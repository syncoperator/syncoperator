<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SyncOperator</title>

<style>
body{
margin:0;
background:#f2f4f8;
font-family:-apple-system,BlinkMacSystemFont;
color:#111;
}

.wrap{max-width:700px;margin:auto;padding:15px}

.block{
background:white;
padding:18px;
border-radius:22px;
margin-bottom:18px;
box-shadow:0 8px 25px rgba(0,0,0,.08)
}

.title{font-size:20px;font-weight:700;margin-bottom:12px}

input,textarea{
width:100%;
padding:13px;
border-radius:14px;
border:1px solid #e3e6ef;
margin-top:8px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
border-radius:16px;
background:#111;
color:white;
font-size:16px;
font-weight:600;
margin-top:12px;
}

.tool{
border:1px solid #e5e7ef;
border-radius:18px;
padding:14px;
margin-top:14px;
}

.toolhead{
font-weight:700;
margin-bottom:6px;
}

.chips{
display:flex;
flex-wrap:wrap;
gap:6px;
margin-top:10px;
}

.chip{
padding:6px 12px;
border-radius:20px;
background:#eef1f7;
font-size:14px;
cursor:pointer;
}

.active{
background:#111;
color:white;
}

.row{
display:flex;
gap:10px;
margin-top:10px;
}

.toggle{
flex:1;
padding:10px;
border-radius:14px;
text-align:center;
background:#eef1f7;
cursor:pointer;
}

.toggle.on{
background:#111;
color:white;
}

.json{
background:#0f172a;
color:#e2e8f0;
padding:15px;
border-radius:16px;
white-space:pre-wrap;
font-family:monospace;
margin-top:15px;
}
</style>
</head>

<body>
<div class="wrap">

<div class="block">
<div class="title">Teil</div>
<input id="num" placeholder="Nummer">
<input id="name" placeholder="Name">
<input id="mat" placeholder="Material">
<input id="grf" placeholder="Greifer">
</div>

<div class="block">
<div class="title">Tools einfügen</div>
<textarea id="input" rows="6" placeholder="T0101 TOOLNAME G54"></textarea>
<button onclick="parse()">Tools erzeugen</button>
</div>

<div id="list"></div>

<div class="block">
<button onclick="exportJSON()">JSON kopieren</button>
<div id="json" class="json"></div>
</div>

</div>

<script>

let tools=[]

function parse(){
tools=[]
let lines=input.value.split("\n")

lines.forEach(l=>{
let t=l.trim()
if(!t)return
let parts=t.split(" ")
let id=parts.shift()
tools.push({
id:id,
nm:parts.join(" "),
dia:"",
fach:"",
spann:"",
red:"",
rev:false,
sonder:false
})
})

render()
}

function chip(v,current,cb){
return `<div class="chip ${current===v?"active":""}" onclick="${cb}('${v}')">${v}</div>`
}

function render(){
list.innerHTML=""

tools.forEach((t,i)=>{

let el=document.createElement("div")
el.className="block tool"

el.innerHTML=`

<div class="toolhead">${t.id} — ${t.nm}</div>

<input placeholder="Dia" value="${t.dia}" oninput="tools[${i}].dia=this.value">

<div class="chips">
${chip("B1",t.fach,`setFach${i}`)}
${chip("B3",t.fach,`setFach${i}`)}
${chip("B4",t.fach,`setFach${i}`)}
${chip("B6",t.fach,`setFach${i}`)}
${chip("B8",t.fach,`setFach${i}`)}
${chip("D",t.fach,`setFach${i}`)}
</div>

<div class="chips">
${chip("D2",t.spann,`setSpann${i}`)}
${chip("D6",t.spann,`setSpann${i}`)}
${chip("D10",t.spann,`setSpann${i}`)}
${chip("D16",t.spann,`setSpann${i}`)}
</div>

<div class="chips">
${chip("D10",t.red,`setRed${i}`)}
${chip("D14",t.red,`setRed${i}`)}
${chip("D16",t.red,`setRed${i}`)}
${chip("D18",t.red,`setRed${i}`)}
${chip("D20",t.red,`setRed${i}`)}
</div>

<div class="row">
<div class="toggle ${t.rev?"on":""}" onclick="setRev(${i})">REV</div>
<div class="toggle ${t.sonder?"on":""}" onclick="tools[${i}].sonder=!tools[${i}].sonder;render()">SONDER</div>
</div>
`

list.appendChild(el)

window["setFach"+i]=(v)=>{tools[i].fach=v;render()}
window["setSpann"+i]=(v)=>{tools[i].spann=v;render()}
window["setRed"+i]=(v)=>{tools[i].red=v;render()}
})
}

function setRev(i){
let state=!tools[i].rev
for(let x=i;x<tools.length;x++){
tools[x].rev=state
}
render()
}

function bem(t){
let a=[]
if(t.fach)a.push("FACH "+t.fach)
if(t.red)a.push("REDUZIERHUELSE "+t.red)
if(t.spann)a.push("SPANNZANGE "+t.spann)
return a.join(" | ")
}

function exportJSON(){

let out=[{
num:num.value,
name:name.value,
mat:mat.value,
grf:grf.value,
tools:tools.map(t=>({
id:t.id,
nm:t.nm,
dia:t.dia,
bem:bem(t),
rev:t.rev,
isSonder:t.sonder
}))
}]

let txt=JSON.stringify(out,null,2)
json.textContent=txt
navigator.clipboard.writeText(txt)
}
</script>
</body>
</html>
