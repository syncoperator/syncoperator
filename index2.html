<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS</title>

<style>
body{margin:0;background:#111;color:#fff;font-family:system-ui}
header{padding:16px;font-weight:800;display:flex;justify-content:space-between;border-bottom:1px solid #222}
button{padding:12px 14px;border-radius:10px;border:none;font-weight:700}
.primary{background:#fff;color:#000}
.secondary{background:#222;color:#fff}
.container{padding:16px}
.card{background:#1a1a1a;padding:16px;border-radius:14px;margin-bottom:12px}
input,textarea{width:100%;padding:12px;background:#000;border:1px solid #333;border-radius:10px;color:#fff;margin-top:6px}
.tool{padding:14px;border-bottom:1px solid #222}
</style>
</head>

<body>

<header>
<div>QS CORE</div>
<button class="primary" onclick="createProject()">NEU</button>
</header>

<div id="home" class="container"></div>

<div id="project" class="container" style="display:none">
<button class="secondary" onclick="back()">←</button>
<h2 id="title"></h2>
<div id="tools"></div>
<button class="primary" onclick="addTool()">+ Werkzeug</button>
<button class="secondary" onclick="exportJSON()">Export JSON</button>
</div>

<script>

const KEY="qs_final_db"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let current=null

function save(){localStorage.setItem(KEY,JSON.stringify(db))}

function renderHome(){
home.innerHTML=""
db.forEach((p,i)=>{
let d=document.createElement("div")
d.className="card"
d.innerHTML="<b>"+p.num+"</b><br>"+p.name
d.onclick=()=>openProject(i)
home.appendChild(d)
})
}

function createProject(){
let num=prompt("Nummer")
if(!num)return
let name=prompt("Name")
db.push({num,name,tools:[]})
save()
renderHome()
}

function openProject(i){
current=i
home.style.display="none"
project.style.display="block"
title.innerText=db[i].num+" — "+db[i].name
renderTools()
}

function back(){
project.style.display="none"
home.style.display="block"
}

function renderTools(){
tools.innerHTML=""
db[current].tools.forEach((t,i)=>{
let d=document.createElement("div")
d.className="tool"
d.innerHTML="<b>"+t.id+"</b> "+t.name+"<br><small>"+(t.note||"")+"</small>"
d.onclick=()=>editTool(i)
tools.appendChild(d)
})
}

function addTool(){
let id=prompt("ID")
if(!id)return
let name=prompt("Name")
let note=prompt("Bemerkung")
db[current].tools.push({id,name,note})
save()
renderTools()
}

function editTool(i){
let t=db[current].tools[i]
let n=prompt("Bemerkung",t.note)
if(n!==null){t.note=n;save();renderTools()}
}

function exportJSON(){
navigator.clipboard.writeText(JSON.stringify(db[current]))
alert("JSON kopiert")
}

renderHome()
</script>
</body>
</html>
