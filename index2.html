<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS CORE</title>

<style>
body{margin:0;background:#0d0d0d;color:#fff;font-family:system-ui}
header{padding:18px;font-weight:800;display:flex;justify-content:space-between;border-bottom:1px solid #222}
button{padding:14px;border-radius:12px;border:none;font-weight:700;font-size:15px}
.primary{background:#fff;color:#000}
.secondary{background:#1c1c1c;color:#fff}
.wrap{padding:18px}
.card{background:#161616;border:1px solid #262626;padding:18px;border-radius:16px;margin-bottom:14px}
.input{margin-bottom:14px}
input,textarea{
width:100%;
padding:14px;
background:#000;
border:1px solid #333;
border-radius:12px;
color:#fff;
font-size:16px
}
.tool{padding:16px;border-bottom:1px solid #222}
.modal{
position:fixed;inset:0;background:#000d;
display:none;align-items:center;justify-content:center;
}
.box{
background:#111;padding:20px;border-radius:18px;width:92%;max-width:420px
}
.title{font-weight:900;margin-bottom:14px}
</style>
</head>

<body>

<header>
<div>QS CORE</div>
<button class="primary" onclick="openProjectModal()">NEU</button>
</header>

<div id="home" class="wrap"></div>

<div id="projectView" class="wrap" style="display:none">
<button class="secondary" onclick="closeProject()">←</button>
<h2 id="projectTitle"></h2>
<div id="toolList"></div>
<br>
<button class="primary" onclick="openToolModal()">+ Werkzeug</button>
<button class="secondary" onclick="exportJSON()">JSON</button>
<button class="secondary" onclick="printPDF()">PDF</button>
</div>


<!-- project modal -->
<div id="projectModal" class="modal">
<div class="box">
<div class="title">Projekt</div>
<div class="input"><input id="pNum" placeholder="Nummer"></div>
<div class="input"><input id="pName" placeholder="Name"></div>
<button class="primary" onclick="saveProject()">Speichern</button>
</div>
</div>

<!-- tool modal -->
<div id="toolModal" class="modal">
<div class="box">
<div class="title">Werkzeug</div>

<div class="input"><input id="tId" placeholder="T-Nr"></div>
<div class="input"><input id="tName" placeholder="Name"></div>
<div class="input"><input id="tDia" placeholder="Ø"></div>
<div class="input"><textarea id="tNote" placeholder="Bemerkung"></textarea></div>

<button class="primary" onclick="saveTool()">Speichern</button>
</div>
</div>

<script>

const KEY="QS_DB_V1"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let currentProject=null
let editToolIndex=null

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}

function renderHome(){
home.innerHTML=""
db.forEach((p,i)=>{
let c=document.createElement("div")
c.className="card"
c.innerHTML="<b>"+p.num+"</b><br>"+p.name
c.onclick=()=>openProject(i)
home.appendChild(c)
})
}

function openProjectModal(){
projectModal.style.display="flex"
}

function saveProject(){
let num=pNum.value.trim()
let name=pName.value.trim()
if(!num||!name)return
db.push({num,name,tools:[]})
saveDB()
projectModal.style.display="none"
pNum.value=""
pName.value=""
renderHome()
}

function openProject(i){
currentProject=i
home.style.display="none"
projectView.style.display="block"
projectTitle.innerText=db[i].num+" — "+db[i].name
renderTools()
}

function closeProject(){
projectView.style.display="none"
home.style.display="block"
}

function renderTools(){
toolList.innerHTML=""
db[currentProject].tools.forEach((t,i)=>{
let d=document.createElement("div")
d.className="tool"
d.innerHTML="<b>"+t.id+"</b> "+t.name+"<br><small>"+(t.note||"")+"</small>"
d.onclick=()=>editTool(i)
toolList.appendChild(d)
})
}

function openToolModal(){
editToolIndex=null
toolModal.style.display="flex"
}

function editTool(i){
editToolIndex=i
let t=db[currentProject].tools[i]
tId.value=t.id
tName.value=t.name
tDia.value=t.dia
tNote.value=t.note
toolModal.style.display="flex"
}

function saveTool(){
let t={
id:tId.value,
name:tName.value,
dia:tDia.value,
note:tNote.value
}

if(editToolIndex==null)
db[currentProject].tools.push(t)
else
db[currentProject].tools[editToolIndex]=t

saveDB()
toolModal.style.display="none"
tId.value=tName.value=tDia.value=tNote.value=""
renderTools()
}

function exportJSON(){
let data=JSON.stringify(db[currentProject],null,2)
navigator.clipboard.writeText(data)
}

function printPDF(){
window.print()
}

renderHome()
</script>
</body>
</html>
