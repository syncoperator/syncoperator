<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2</title>
    <style>
        :root {
            --bg: #ffffff;
            --fg: #000000;
            --accent: #007aff;
            --gray: #f2f2f7;
            --border: #000000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--fg); overflow-x: hidden;
        }

        /* Основные экраны */
        .view { display: none; padding: 20px; animation: fadeIn 0.2s ease; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Заголовки */
        h1 { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin: 0 0 20px 0; text-transform: uppercase; }
        .h-sub { font-size: 14px; font-weight: 700; color: #8e8e93; margin-bottom: 5px; }

        /* Элементы списка в приложении */
        .list-item {
            background: var(--bg);
            border-bottom: 1.5px solid #eee;
            padding: 16px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .t-id-label { font-size: 9px; font-weight: 900; color: #8e8e93; margin-bottom: 2px; }
        .t-name-label { font-size: 22px; font-weight: 900; line-height: 1; margin-bottom: 4px; }

        /* Теги */
        .loc-tag { 
            display: inline-block; padding: 4px 8px; border-radius: 6px; 
            font-size: 11px; font-weight: 800; margin-top: 8px;
        }
        .standart { background: #e8f2ff; color: #007aff; }
        .sonder { background: #fff2e8; color: #ff9500; }

        /* Кнопки */
        .btn-main {
            background: var(--fg); color: var(--bg); border: none;
            padding: 16px 24px; border-radius: 14px; font-size: 16px; font-weight: 700;
            width: 100%; margin-top: 10px; cursor: pointer;
        }
        .btn-sec {
            background: var(--gray); color: var(--fg); border: none;
            padding: 12px; border-radius: 12px; font-size: 14px; font-weight: 700;
        }
        .fab {
            position: fixed; bottom: 30px; right: 20px;
            width: 64px; height: 64px; background: var(--fg); color: var(--bg);
            border-radius: 32px; display: flex; align-items: center; justify-content: center;
            font-size: 30px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 100;
        }

        /* Модальные окна */
        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            display: none; align-items: flex-end; z-index: 1000;
        }
        .modal-content {
            background: var(--bg); width: 100%; padding: 30px 20px;
            border-top-left-radius: 24px; border-top-right-radius: 24px;
            max-height: 90vh; overflow-y: auto;
        }
        input {
            width: 100%; padding: 14px; background: var(--gray);
            border: none; border-radius: 12px; margin-bottom: 15px;
            font-size: 16px; font-weight: 600;
        }

        /* Переключатель Standart */
        .toggle-btn {
            padding: 14px; border-radius: 12px; background: #ff3b30; color: #fff;
            text-align: center; font-weight: 800; margin-bottom: 15px; cursor: pointer;
        }
        .toggle-btn.on { background: #34c759; }

        /* Отступ снизу для списка, чтобы FAB не перекрывал */
        #list-t, #list-p { padding-bottom: 100px; }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Projekte</h1>
            <button class="btn-sec" onclick="openImport()">Data</button>
        </div>
        <div id="list-p"></div>
        <div class="fab" onclick="modalP()">+</div>
    </div>

    <div id="v-det" class="view">
        <div style="display:flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
            <button class="btn-sec" onclick="goHome()">← Back</button>
            <div style="text-align: right;">
                <button class="btn-sec" onclick="editCurrentProject()">Edit</button>
                <button class="btn-sec" style="background:#000; color:#fff; margin-left:8px;" onclick="makePDF()">PDF</button>
            </div>
        </div>
        <div class="h-sub" id="h-nam">NAME</div>
        <h1 id="h-num" style="font-size: 48px; margin-bottom: 25px;">000000</h1>
        
        <div id="list-t"></div>
        <div class="fab" onclick="modalT()">+</div>
    </div>

    <div id="m-p" class="modal" onclick="if(event.target==this) hide('m-p')">
        <div class="modal-content">
            <h2 style="margin-top:0">Projekt Info</h2>
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJEKT NUMMER">
            <input type="text" id="p-nam" placeholder="PROJEKT NAME">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="p-lzf" placeholder="LZF">
                <input type="text" id="p-mat" placeholder="MAT">
                <input type="text" id="p-slg" placeholder="SÄGE">
                <input type="text" id="p-abs" placeholder="ABST">
                <input type="text" id="p-grf" placeholder="BACKEN">
                <input type="text" id="p-stk" placeholder="STOCK">
            </div>
            <button class="btn-main" onclick="saveP()">Speichern</button>
        </div>
    </div>

    <div id="m-t" class="modal" onclick="if(event.target==this) hide('m-t')">
        <div class="modal-content">
            <h2 style="margin-top:0">Werkzeug</h2>
            <input type="hidden" id="t-idx">
            <input type="text" id="t-bem" placeholder="BEMERKUNG">
            <input type="text" id="t-nm" placeholder="NAME">
            <div id="btn-storage-toggle" class="toggle-btn">STANDART (STORAGE)</div>
            <input type="text" id="t-loc" placeholder="LAGERORT">
            <input type="text" id="t-kom" placeholder="ZUSATZ INFO">
            <button class="btn-main" onclick="saveT()">Speichern</button>
            <button id="btn-del-t" class="btn-sec" style="width:100%; margin-top:10px; color:red;" onclick="delT()">Löschen</button>
        </div>
    </div>

    <div id="m-imp" class="modal" onclick="if(event.target==this) hide('m-imp')">
        <div class="modal-content">
            <h2>Data Management</h2>
            <textarea id="imp-area" style="width:100%; height:150px; background:var(--gray); border:none; border-radius:12px; padding:10px; font-family:monospace;"></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <button class="btn-sec" onclick="exportJSON()">Export JSON</button>
                <button class="btn-sec" onclick="importAnyJSON()">Import JSON</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
