<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS TOOL</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f2f7}
header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:800;border-bottom:1px solid #ddd}
.main{padding:15px}
.card{background:#fff;border-radius:16px;padding:15px;margin-bottom:12px}
.plus{background:#007aff;color:#fff;padding:15px;border-radius:14px;text-align:center;font-weight:800;margin-bottom:15px}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}
.modal{background:#fff;width:100%;border-radius:22px 22px 0 0;max-height:92%;overflow:auto}
.modal-head{padding:16px;font-weight:900;text-align:center;border-bottom:1px solid #eee}
.modal-body{padding:15px}
input,textarea{width:100%;padding:14px;margin-bottom:12px;border-radius:12px;border:none;background:#f2f2f7;font-size:16px}
.section{background:#f2f2f7;padding:12px;border-radius:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
.sel{background:#fff;padding:11px;border-radius:10px;text-align:center;font-weight:700;border:2px solid transparent}
.sel.active{border:2px solid #007aff;color:#007aff}
.big{padding:16px;border-radius:14px;font-weight:800;text-align:center;margin-top:12px}
.primary{background:#007aff;color:#fff}
.secondary{background:#e5e5ea}
.tool{background:#fff;padding:14px;border-radius:16px;margin-bottom:10px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<header>
<span>PROJECTS</span>
<button onclick="openProj()">＋</button>
</header>

<div class="main" id="app"></div>

<!-- PROJECT -->
<div class="overlay" id="projModal">
<div class="modal">
<div class="modal-head">Projekt</div>
<div class="modal-body">
<input id="pname" placeholder="Name">
<input id="pnum" placeholder="Nummer">
<div class="big primary" onclick="createProject()">Speichern</div>
<div class="big secondary" onclick="projModal.style.display='none'">Abbrechen</div>
</div>
</div>
</div>

<!-- TOOL -->
<div class="overlay" id="toolModal">
<div class="modal">
<div class="modal-head">Tool</div>
<div class="modal-body">

<input id="tid" placeholder="T0101">
<input id="tnm" placeholder="Name">

<div class="section">
<div>Typ</div>
<div class="grid" id="typeGrid"></div>
</div>

<div class="section" id="fachBlock">
<div>Fach</div>
<div class="grid" id="fachLetters"></div>
</div>

<div class="section" id="numBlock" style="display:none">
<div>Nummer</div>
<div class="grid" id="fachNums"></div>
</div>

<div class="section" id="spannBlock" style="display:none">
<div>Spannzange</div>
<div class="grid" id="spannGrid"></div>
</div>

<div class="section" id="redBlock" style="display:none">
<div>Reduzierhülse</div>
<div class="grid" id="redGrid"></div>
</div>

<textarea id="tbem" placeholder="Zusatz"></textarea>

<div class="big primary" onclick="saveTool()">Speichern</div>
<div class="big secondary" onclick="closeTool()">Abbrechen</div>

</div>
</div>
</div>

<script>
const KEY="QSDBFINAL"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let cur=null
let edit=null

function save(){localStorage.setItem(KEY,JSON.stringify(db))}
const app=document.getElementById("app")

function render(){
app.innerHTML=""
db.forEach((p,i)=>{
app.innerHTML+=`
<div class="card" onclick="openProject(${i})">
<div>${p.name}</div>
<b>${p.num}</b>
</div>`
})
}

function openProj(){projModal.style.display="flex"}

function createProject(){
if(!pname.value||!pnum.value)return
db.push({name:pname.value,num:pnum.value,tools:[]})
save()
projModal.style.display="none"
render()
}

function openProject(i){
cur=i
app.innerHTML=`
<div class="plus" onclick="openTool()">+ Werkzeug</div>
<div id="list"></div>
<button onclick="render()">← Back</button>`
renderTools()
}

function renderTools(){
const l=document.getElementById("list")
l.innerHTML=""
db[cur].tools.forEach((t,i)=>{
l.innerHTML+=`
<div class="tool" draggable="true" ondragstart="drag(${i})" ondrop="drop(${i})" ondragover="event.preventDefault()" onclick="editTool(${i})">
<div class="small">${t.id}</div>
<b>${t.nm}</b>
<div class="small">${t.bem||""}</div>
</div>`
})
}

let dragIndex=null
function drag(i){dragIndex=i}
function drop(i){
const arr=db[cur].tools
const item=arr.splice(dragIndex,1)[0]
arr.splice(i,0,item)
save()
renderTools()
}

function openTool(){
edit=null
toolModal.style.display="flex"
reset()
}

function closeTool(){toolModal.style.display="none"}

function editTool(i){
edit=i
openTool()
const t=db[cur].tools[i]
tid.value=t.id
tnm.value=t.nm
tbem.value=t.bem
}

let type="STD",fach=null,num=null,spann=null,red=null

function grid(el,arr,cb){
el.innerHTML=""
arr.forEach(v=>{
const d=document.createElement("div")
d.className="sel"
d.textContent=v
d.onclick=()=>{
[...el.children].forEach(x=>x.classList.remove("active"))
d.classList.add("active")
cb(v)
}
el.appendChild(d)
})
}

function reset(){
fach=num=spann=red=null
grid(typeGrid,["STANDARD","SONDER"],v=>type=v)
grid(fachLetters,["A","B","C","D","E","F","G"],v=>{
fach=v
numBlock.style.display="block"
})
grid(fachNums,[...Array(25).keys()].map(x=>x+1),v=>{
num=v
spannBlock.style.display="block"
})
grid(spannGrid,[...Array(25).keys()].map(x=>"D"+(x+1)),v=>{
spann=v
redBlock.style.display="block"
})
grid(redGrid,[...Array(25).keys()].map(x=>"D"+(x+1)),v=>red=v)
tid.value=""
tnm.value=""
tbem.value=""
}

function saveTool(){
let bem=[]
if(fach&&num)bem.push("FACH "+fach+num)
if(spann)bem.push("SPANNZANGE "+spann)
if(red)bem.push("REDUZIER "+red)
if(tbem.value)bem.push(tbem.value)

const t={id:tid.value.toUpperCase(),nm:tnm.value.toUpperCase(),bem:bem.join(" | "),type:type}

if(edit===null)db[cur].tools.push(t)
else db[cur].tools[edit]=t

save()
closeTool()
renderTools()
}

render()
</script>
</body>
</html>
