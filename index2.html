<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Tool Order</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
    background:#0f1115;
    color:#fff;
}

header{
    padding:20px;
    font-size:22px;
    font-weight:600;
    letter-spacing:.5px;
    text-align:center;
    border-bottom:1px solid #222;
}

.container{padding:18px}

input,button{
    width:100%;
    padding:14px;
    margin-top:10px;
    border-radius:14px;
    border:none;
    font-size:16px;
}

input{
    background:#1a1d24;
    color:#fff;
}

button{
    background:#d4af37;
    color:#000;
    font-weight:600;
}

.list{
    margin-top:20px;
}

.item{
    background:#1a1d24;
    padding:14px;
    border-radius:14px;
    margin-top:10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.del{
    background:#ff3b30;
    color:#fff;
    border:none;
    padding:6px 12px;
    border-radius:10px;
}
</style>
</head>
<body>

<header>CNC Tool Order</header>

<div class="container">

<input id="name" placeholder="Werkzeug name">
<input id="qty" type="number" placeholder="Quantity">

<button onclick="addItem()">Add Tool</button>

<div class="list" id="list"></div>

<button onclick="generatePDF()">Export PDF</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let tools = JSON.parse(localStorage.getItem("tools")||"[]")

function save(){
    localStorage.setItem("tools",JSON.stringify(tools))
}

function render(){
    const list=document.getElementById("list")
    list.innerHTML=""
    tools.forEach((t,i)=>{
        list.innerHTML+=`
        <div class="item">
            <div>
                <b>${t.name}</b><br>
                Qty: ${t.qty}
            </div>
            <button class="del" onclick="removeItem(${i})">X</button>
        </div>`
    })
}

function addItem(){
    const name=document.getElementById("name").value.trim()
    const qty=document.getElementById("qty").value

    if(!name||!qty)return

    tools.push({name,qty})
    save()
    render()

    name.value=""
    qty.value=""
}

function removeItem(i){
    tools.splice(i,1)
    save()
    render()
}

async function generatePDF(){
    const {jsPDF}=window.jspdf
    const doc=new jsPDF()

    doc.setFontSize(18)
    doc.text("CNC Tool Order List",20,20)

    doc.setFontSize(12)

    let y=40
    tools.forEach((t,i)=>{
        doc.text(`${i+1}. ${t.name} — Qty: ${t.qty}`,20,y)
        y+=10
    })

    doc.save("order.pdf")
}

render()
</script>

</body>
</html>
