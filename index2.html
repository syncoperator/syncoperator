<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS PRO</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f2f7}
.top{padding:15px;background:#fff;font-weight:800;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.btn{background:#007aff;color:#fff;border:none;padding:10px 14px;border-radius:10px;font-weight:700}
.list{padding:15px}
.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:10px}
.small{font-size:12px;color:#666}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.box{background:#fff;padding:20px;border-radius:16px;width:92%;max-width:420px;max-height:90vh;overflow:auto}
input,select,textarea{width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border-radius:8px;border:1px solid #ddd}
.drag{cursor:grab}
</style>
</head>
<body>

<div class="top">
<span>QS PRO</span>
<button class="btn" onclick="newProject()">+ NEU</button>
<button class="btn" onclick="copyProject()">COPY</button>
<button class="btn" onclick="exportJSON()">JSON</button>
<button class="btn" onclick="window.print()">PDF</button>
</div>

<div style="padding:10px">
<input id="search" placeholder="Suche Werkzeug..." oninput="renderTools()">
</div>

<div id="main" class="list"></div>

<!-- IMPORT -->
<div class="modal" id="imp">
<div class="box">
<textarea id="impText" rows="8"></textarea>
<button class="btn" onclick="parseTools()">Import</button>
</div>
</div>

<!-- WIZARD -->
<div class="modal" id="wiz">
<div class="box">

<div id="w1">
<b>Typ</b><br><br>
<button class="btn" onclick="setType(false)">Standard</button>
<button class="btn" onclick="setType(true)">Sonder</button>
</div>

<div id="w2" style="display:none">
<b>Fach</b>
<select id="fach"></select>
<button class="btn" onclick="next(3)">Weiter</button>
</div>

<div id="w3" style="display:none">
<b>Spannzange</b>
<input id="spann">
<button class="btn" onclick="next(4)">Weiter</button>
</div>

<div id="w4" style="display:none">
<b>Reduzierhülse</b>
<input id="hulse">
<button class="btn" onclick="saveTool()">Speichern</button>
</div>

</div>
</div>

<script>
const KEY="QS_PRO_DB"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let p=0
let edit=null

function save(){localStorage.setItem(KEY,JSON.stringify(db))}

/* PROJECT */

function newProject(){
db.push({num:"NEW",name:"PROJEKT",tools:[]})
p=db.length-1
save()
renderTools()
}

function copyProject(){
db.push(JSON.parse(JSON.stringify(db[p])))
save()
alert("kopiert")
}

/* RENDER */

function renderTools(){
if(!db.length){main.innerHTML="kein projekt";return}

let list=db[p].tools
let filter=search.value.toLowerCase()

main.innerHTML=`<div class="card">
<b>${db[p].num}</b><br>${db[p].name}<br><br>
<button onclick="imp.style.display='flex'">Import</button>
</div>`

list
.filter(t=>t.nm.toLowerCase().includes(filter))
.forEach((t,i)=>{
let d=document.createElement("div")
d.className="card drag"
d.draggable=true
d.ondragstart=e=>e.dataTransfer.setData("i",i)
d.ondrop=e=>{
let from=e.dataTransfer.getData("i")
let tmp=list[from]
list.splice(from,1)
list.splice(i,0,tmp)
save()
renderTools()
}
d.ondragover=e=>e.preventDefault()

d.innerHTML=`
<b>${t.id}</b><br>
${t.nm}
<div class="small">${t.bem||""}</div>
<button onclick="editTool(${i})">edit</button>
<button onclick="rev(${i})">rev</button>
`
main.appendChild(d)
})
}

/* IMPORT PARSER */

function parseTools(){
let rows=impText.value.split("\n").filter(x=>x.trim())
rows.forEach(r=>{
let id=r.split(" ")[0]
let name=r.replace(id,"").trim()

let dia=name.match(/D\d+/i)
let spann=dia?dia[0].replace("D",""):""

db[p].tools.push({
id,
nm:name,
bem:"",
rev:false,
isSonder:false,
spann
})
})
save()
imp.style.display="none"
renderTools()
}

/* EDIT */

function editTool(i){
edit=i
wiz.style.display="flex"
show(1)
}

function setType(v){
db[p].tools[edit].isSonder=v
show(2)
}

function show(n){
document.querySelectorAll("#wiz .box>div").forEach(x=>x.style.display="none")
document.getElementById("w"+n).style.display="block"
}

function next(n){show(n)}

function saveTool(){
let f=fach.value
let s=spann.value
let h=hulse.value

let arr=[]
if(f)arr.push("FACH "+f)
if(s)arr.push("SPANNZANGE "+s)
if(h)arr.push("REDUZIERHUELSE "+h)

db[p].tools[edit].bem=arr.join(" | ")
save()
wiz.style.display="none"
renderTools()
}

/* REV */

function rev(i){
db[p].tools[i].rev=!db[p].tools[i].rev
save()
renderTools()
}

/* JSON */

function exportJSON(){
alert(JSON.stringify(db[p]))
}

/* FACH LIST */

let letters="ABCDEFG"
letters.split("").forEach(l=>{
for(let i=1;i<=20;i++){
let o=document.createElement("option")
o.value=l+i
o.text=l+i
fach.appendChild(o)
}
})

renderTools()
</script>
</body>
</html>
