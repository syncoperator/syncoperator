<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>CITITOOL | SyncPro 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 2026 High-Contrast Palette */
            --ct-bg: #f8f9fb;
            --ct-surface: #ffffff;
            --ct-main: #0a0a0b;         /* Глубокий антрацит */
            --ct-accent: #0051ff;       /* Electric Blue */
            --ct-border: #e2e4e8;
            --ct-shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --ct-shadow-md: 0 12px 24px -8px rgba(0,0,0,0.08);
            --radius-st: 4px;           /* Строгие углы для инструментов */
            --radius-ui: 16px;          /* Мягкие углы для UI */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--ct-bg);
            color: var(--ct-main);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SMART HEADER --- */
        header {
            background: var(--ct-surface);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--ct-border);
            position: sticky; top: 0; z-index: 100;
        }

        .brand-block { display: flex; align-items: center; gap: 12px; }
        .logo-box {
            width: 32px; height: 32px;
            background: var(--ct-main);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 18px; border-radius: 6px;
        }
        .brand-name { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; text-transform: uppercase; }
        .brand-name span { color: var(--ct-accent); }

        /* --- NAVIGATION 2026 --- */
        .nav-scroller {
            background: var(--ct-surface);
            display: flex;
            padding: 4px;
            gap: 4px;
            border-bottom: 1px solid var(--ct-border);
        }

        .nav-btn {
            flex: 1;
            padding: 14px 0;
            border: none; background: none;
            font-size: 12px; font-weight: 700;
            color: #888; text-transform: uppercase;
            border-radius: 10px; transition: 0.2s;
        }

        .nav-btn.active {
            background: var(--ct-bg);
            color: var(--ct-accent);
            box-shadow: inset 0 0 0 1px var(--ct-border);
        }

        /* --- CONTENT SECTION --- */
        .page-content { padding: 20px; padding-bottom: 100px; }

        .label-row {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding: 0 4px;
        }
        .label-row h2 { font-size: 11px; font-weight: 800; text-transform: uppercase; color: #888; margin: 0; }

        /* --- TOOL CARDS (STRICT & MODERN) --- */
        .tool-card {
            background: var(--ct-surface);
            border-radius: var(--radius-ui);
            border: 1px solid var(--ct-border);
            box-shadow: var(--ct-shadow-sm);
            margin-bottom: 12px;
            overflow: hidden;
            display: grid;
            grid-template-columns: 60px 1fr 60px;
            align-items: center;
        }

        .tool-id {
            height: 100%;
            background: #f1f3f5;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: 18px;
            border-right: 1px solid var(--ct-border);
        }

        .tool-body { padding: 16px; }
        .tool-body b { display: block; font-size: 14px; margin-bottom: 4px; }
        .tool-body span { font-size: 11px; color: #888; font-family: 'JetBrains Mono', monospace; }

        .tool-action {
            height: 100%;
            border: none; background: none;
            border-left: 1px solid var(--ct-border);
            display: flex; align-items: center; justify-content: center;
        }

        /* --- SYNC TIMELINE --- */
        .sync-step {
            display: flex; gap: 8px; margin-bottom: 8px;
        }

        .m-badge {
            min-width: 70px;
            background: var(--ct-main);
            color: #fff;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: 14px;
        }

        .op-box {
            flex-grow: 1;
            background: var(--ct-surface);
            border: 1px solid var(--ct-border);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 13px; font-weight: 600;
            box-shadow: var(--ct-shadow-sm);
        }

        .op-box.wait {
            background: transparent;
            border: 1px dashed var(--ct-border);
            color: #888;
        }

        /* --- FLOATING COMMAND CENTER --- */
        .cmd-bar {
            position: fixed;
            bottom: 24px; left: 20px; right: 20px;
            background: var(--ct-main);
            height: 64px;
            border-radius: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .cmd-btn {
            border: none; background: none;
            color: #fff; font-size: 10px; font-weight: 700;
            display: flex; flex-direction: column; align-items: center; gap: 4px;
            opacity: 0.6;
        }

        .cmd-btn.active { opacity: 1; color: var(--ct-accent); }

        .btn-add {
            position: absolute;
            top: -24px; left: 50%;
            transform: translateX(-50%);
            width: 56px; height: 56px;
            background: var(--ct-accent);
            border-radius: 50%;
            border: 4px solid var(--ct-bg);
            color: #fff; font-size: 28px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 8px 16px rgba(0,81,255,0.3);
        }

    </style>
</head>
<body>

<header>
    <div class="brand-block">
        <div class="logo-box">C</div>
        <div class="brand-name">CITI<span>TOOL</span></div>
    </div>
    <div style="font-size: 10px; font-weight: 800; color: #888;">PRO V2.6</div>
</header>

<nav class="nav-scroller">
    <button class="nav-btn active">Channel 1</button>
    <button class="nav-btn">Channel 2</button>
    <button class="nav-btn">Map</button>
</nav>

<main class="page-content">
    
    <div class="label-row">
        <h2>Tool Mapping</h2>
        <span style="font-size: 10px; color: var(--ct-accent); font-weight: 700;">LIVE SCAN</span>
    </div>

    <div id="slotList">
        <div class="tool-card">
            <div class="tool-id">01</div>
            <div class="tool-body">
                <b>AXIAL_MILL_PRO_V2</b>
                <span>T0101 • SP4 • 12.00MM</span>
            </div>
            <button class="tool-action">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2.5"><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
            </button>
        </div>
    </div>

    <div class="label-row" style="margin-top: 30px;">
        <h2>Sync Timeline</h2>
    </div>

    <div class="sync-step">
        <div class="m-badge">M100</div>
        <div class="op-box">FACE_TURNING_STRATEGY</div>
    </div>
    
    <div class="sync-step">
        <div class="m-badge" style="background: #e2e4e8; color: #0a0a0b;">WAIT</div>
        <div class="op-box wait">WAITING FOR KANAL 2...</div>
    </div>

    <div class="sync-step">
        <div class="m-badge">M105</div>
        <div class="op-box" style="border-left: 4px solid var(--ct-accent);">PROFILE_MILLING_Q4</div>
    </div>

</main>

<div class="cmd-bar">
    <button class="cmd-btn active">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        DASH
    </button>
    
    <button class="btn-add">+</button>
    <div style="width: 56px;"></div> <button class="cmd-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        SAVE
    </button>
</div>

</body>
</html>
