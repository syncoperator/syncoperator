<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>CITITOOL | SyncOperator</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&family=Roboto:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* CITITOOL Brand Identity */
            --ct-bg: #f5f7f9;           /* Фон страницы */
            --ct-white: #ffffff;         /* Фон панелей */
            --ct-main: #2c3e50;          /* Основной графит */
            --ct-accent: #007bff;        /* Акцентный синий */
            --ct-border: #dee2e6;        /* Линии интерфейса */
            --ct-text: #1a1a1a;          /* Текст */
            --ct-text-muted: #6c757d;    /* Вторичный текст */
            --ct-success: #28a745;       /* Статус OK */
            --ct-warning: #ffc107;       /* Ожидание/Предупреждение */
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--ct-bg);
            color: var(--ct-text);
            margin: 0; padding: 0;
            overflow-x: hidden;
        }

        /* --- TOP NAVIGATION --- */
        header {
            background: var(--ct-white);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 3px solid var(--ct-main);
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .ct-logo {
            font-weight: 900;
            font-size: 18px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .ct-logo span { color: var(--ct-accent); }

        .sys-status {
            font-size: 10px;
            font-weight: 800;
            padding: 4px 12px;
            background: #e9ecef;
            border-radius: 2px;
            border: 1px solid var(--ct-border);
        }

        /* --- CHANNEL SELECTOR --- */
        .channel-bar {
            display: flex;
            background: var(--ct-white);
            border-bottom: 1px solid var(--ct-border);
        }

        .ch-tab {
            flex: 1;
            padding: 16px 0;
            text-align: center;
            font-size: 12px;
            font-weight: 700;
            color: var(--ct-text-muted);
            border: none;
            background: none;
            text-transform: uppercase;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        .ch-tab.active {
            color: var(--ct-accent);
            border-bottom-color: var(--ct-accent);
            background: #f0f7ff;
        }

        /* --- CONTENT WRAPPER --- */
        .content-label {
            padding: 20px 20px 8px;
            font-size: 11px;
            font-weight: 800;
            color: var(--ct-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .ct-card {
            background: var(--ct-white);
            margin: 0 15px 15px;
            border: 1px solid var(--ct-border);
            border-radius: 4px;
        }

        /* --- SLOT ITEM --- */
        .ct-slot {
            display: grid;
            grid-template-columns: 50px 1fr 50px;
            height: 70px;
            align-items: center;
            border-bottom: 1px solid var(--ct-border);
        }

        .ct-slot:last-child { border-bottom: none; }

        .ct-slot-num {
            font-family: 'Roboto Mono', monospace;
            font-size: 20px;
            font-weight: 700;
            color: var(--ct-main);
            text-align: center;
            background: #f8f9fa;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ct-slot-data { padding-left: 15px; }
        .ct-slot-data b { display: block; font-size: 14px; color: var(--ct-text); }
        .ct-slot-data span { font-size: 11px; color: var(--ct-text-muted); font-family: 'Roboto Mono', monospace; }

        .ct-btn-edit {
            height: 100%;
            border: none;
            background: none;
            border-left: 1px solid var(--ct-border);
            color: var(--ct-accent);
            font-weight: 700;
            font-size: 10px;
        }

        /* --- SYNC VIEW --- */
        .sync-list { padding: 15px; }
        
        .sync-item {
            display: grid;
            grid-template-columns: 70px 1fr;
            gap: 4px;
            margin-bottom: 4px;
        }

        .sync-m {
            background: var(--ct-main);
            color: #fff;
            padding: 12px 0;
            font-family: 'Roboto Mono', monospace;
            font-size: 14px;
            text-align: center;
            font-weight: 700;
        }

        .sync-op {
            background: var(--ct-white);
            border: 1px solid var(--ct-border);
            padding: 0 15px;
            display: flex;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
        }

        .sync-wait {
            background: repeating-linear-gradient(45deg, #f8f9fa, #f8f9fa 10px, #e9ecef 10px, #e9ecef 20px);
            color: var(--ct-text-muted);
            border: 1px solid var(--ct-border);
        }

        /* --- BOTTOM CONTROL PANEL --- */
        .ct-controls {
            position: fixed;
            bottom: 0; width: 100%;
            height: 70px;
            background: #1e272e;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
        }

        .ctrl-node {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #d2dae2;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            gap: 6px;
        }

        .ctrl-node svg { width: 22px; height: 22px; fill: currentColor; }
        .ctrl-node.active { color: var(--ct-accent); }
        .ctrl-node.highlight { background: var(--ct-accent); color: #fff; }

    </style>
</head>
<body>

<header>
    <div class="ct-logo">CITI<span>TOOL</span></div>
    <div class="sys-status">OPERATOR MODE</div>
</header>

<div class="channel-bar">
    <button class="ch-tab active">CH 1</button>
    <button class="ch-tab">CH 2</button>
    <button class="ch-tab">CONFIG</button>
</div>

<main style="padding-bottom: 90px;">
    
    <div class="content-label">Unit Mapping</div>
    <div class="ct-card">
        <div class="ct-slot">
            <div class="ct-slot-num">01</div>
            <div class="ct-slot-data">
                <b>AXIAL_UNIT_PRO</b>
                <span>T0101 | SP4 | Ø12.0</span>
            </div>
            <button class="ct-btn-edit">EDIT</button>
        </div>
        <div class="ct-slot">
            <div class="ct-slot-num">02</div>
            <div class="ct-slot-data">
                <b>RADIAL_MILL_HEAD</b>
                <span>T0202 | SP3 | D25.0</span>
            </div>
            <button class="ct-btn-edit">EDIT</button>
        </div>
    </div>

    <div class="content-label">Process Timeline</div>
    <div class="sync-list">
        <div class="sync-item">
            <div class="sync-m">M100</div>
            <div class="sync-op">FACING_OPERATION_01</div>
        </div>
        <div class="sync-item">
            <div class="sync-m" style="background:#e9ecef; color:#1a1a1a;">WAIT</div>
            <div class="sync-op sync-wait">SYNCHRONIZING...</div>
        </div>
        <div class="sync-item">
            <div class="sync-m">M101</div>
            <div class="sync-op" style="border-left: 4px solid var(--ct-accent);">DRILLING_CYCLE_MAIN</div>
        </div>
    </div>

</main>

<div class="ct-controls">
    <div class="ctrl-node active">
        <svg viewBox="0 0 24 24"><path d="M4 10h3v7H4zM10.5 10h3v7h-3zM17 10h3v7h-3zM2 22h20v-2H2v2zm1-12.435V7.1a2 2 0 011.52-1.94l8-2.133a2 2 0 01.96 0l8 2.133A2 2 0 0121 7.1v2.465a4 4 0 01-2 3.465v4.97H5v-4.97a4 4 0 01-2-3.465z"/></svg>
        DASH
    </div>
    <div class="ctrl-node">
        <svg viewBox="0 0 24 24"><path d="M4 6h16v2H4zm0 5h16v2H4zm0 5h16v2H4z"/></svg>
        TOOLS
    </div>
    <div class="ctrl-item ctrl-node">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        EXPORT
    </div>
    <div class="ctrl-node highlight">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        ADD
    </div>
</div>

</body>
</html>
