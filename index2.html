<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CitiTool | SyncOperator Light</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0076bd;
            --border-light: #d1d9e0;
            --bg-main: #ffffff;
            --bg-side: #f8f9fa;
            --text-dark: #333333;
            --text-muted: #666666;
            --accent-soft: #eef7ff;
        }

        body { 
            font-family: 'Roboto', sans-serif; 
            background: var(--bg-main); 
            color: var(--text-dark); 
            margin: 0; 
        }

        /* --- HEADER (Benz-Style) --- */
        .header {
            border-bottom: 2px solid var(--primary-blue);
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .header h1 { 
            margin: 0; color: var(--primary-blue); 
            font-size: 24px; text-transform: uppercase; letter-spacing: 1px;
        }
        .header-nav { display: flex; gap: 10px; }

        /* --- BUTTONS --- */
        button {
            background: #fff; border: 1px solid var(--border-light);
            padding: 8px 15px; cursor: pointer; font-size: 13px;
            transition: all 0.2s; text-transform: uppercase; font-weight: 500;
        }
        button:hover { background: var(--accent-soft); border-color: var(--primary-blue); }
        .btn-active { background: var(--primary-blue) !important; color: #fff; }

        /* --- MAIN LAYOUT --- */
        .container { display: grid; grid-template-columns: 350px 1fr; gap: 40px; padding: 40px; }

        /* SLOTS & LIBRARY */
        .panel-title {
            color: var(--primary-blue); border-bottom: 1px solid var(--primary-blue);
            padding-bottom: 5px; margin-bottom: 20px; font-size: 18px; font-weight: 400;
        }

        .slot-row {
            display: grid; grid-template-columns: 40px 1fr auto;
            align-items: center; padding: 12px; border: 1px solid var(--border-light);
            margin-bottom: 8px; background: #fff;
        }
        .slot-row:hover { border-color: var(--primary-blue); }
        .slot-row.drag-over { background: var(--accent-soft); border: 1px dashed var(--primary-blue); }

        .op-card {
            padding: 10px; border: 1px solid var(--border-light);
            margin-bottom: 5px; cursor: grab; background: var(--bg-side);
            font-size: 13px;
        }
        .op-card:active { cursor: grabbing; }

        /* --- TABLE --- */
        .plan-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .plan-table th { 
            text-align: left; padding: 12px; border-bottom: 2px solid var(--border-light);
            color: var(--primary-blue); font-size: 14px;
        }
        .plan-table td { padding: 12px; border-bottom: 1px solid var(--border-light); font-size: 13px; }

        /* MODAL */
        #modalOverlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal { background: #fff; padding: 30px; width: 450px; border-top: 5px solid var(--primary-blue); }

        @media print { .no-print { display: none; } }
    </style>
</head>
<body>

<header class="header no-print">
    <div>
        <h1>SyncOperator PRO</h1>
        <div style="font-size: 12px; color: var(--text-muted);">TECHNISCHE DATEN & KONFIGURATION</div>
    </div>
    <div class="header-nav">
        <button onclick="window.print()">Drucken / PDF</button>
        <button id="exportJsonBtn">Export JSON</button>
        <button id="importJsonBtn">Import</button>
    </div>
</header>

<div class="container">
    <aside class="no-print">
        <div class="panel-title">KONFIGURATION</div>
        <div style="margin-bottom: 20px;">
            <button id="btnKanal1" class="btn-active" onclick="switchKanal(1)">KANAL 1</button>
            <button id="btnKanal2" onclick="switchKanal(2)">KANAL 2</button>
        </div>
        <div id="slotList"></div>
        <button id="addSlotBtn" style="width: 100%; margin-top: 10px;">+ SLOT HINZUFÜGEN</button>
    </aside>

    <main>
        <div class="panel-title">SYNCHRONPLAN</div>
        <table class="plan-table" id="planTable">
            </table>

        <div class="panel-title no-print" style="margin-top: 40px;">WERKZEUGBIBLIOTHEK</div>
        <div id="libraryList" class="no-print" style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            </div>
    </main>
</div>

<div id="modalOverlay">
    <div class="modal">
        <h2 id="modalTitle" style="color: var(--primary-blue); margin-top: 0;"></h2>
        <div id="modalBody"></div>
        <div style="margin-top: 20px; text-align: right;">
            <button id="modalCloseBtn">Abbrechen</button>
            <button id="modalSaveBtn" class="btn-active">Speichern</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
