<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QS TOOL PRO</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f2f7}
header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:800;border-bottom:1px solid #ddd}
.main{padding:15px}
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:10px}
.plus{background:#007aff;color:#fff;padding:14px;border-radius:12px;text-align:center;font-weight:800;margin-bottom:15px}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}
.modal{background:#fff;width:100%;border-radius:20px 20px 0 0;max-height:90%;overflow:auto}
.modal-head{padding:15px;font-weight:900;text-align:center;border-bottom:1px solid #eee}
.modal-body{padding:15px}
input,textarea{width:100%;padding:12px;margin-bottom:10px;border-radius:10px;border:none;background:#f2f2f7;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.sel{background:#f2f2f7;padding:10px;border-radius:10px;text-align:center;font-weight:700}
.sel.active{background:#000;color:#fff}
.bigbtn{padding:15px;border-radius:12px;font-weight:800;text-align:center;margin-top:10px}
.primary{background:#007aff;color:#fff}
.secondary{background:#e5e5ea}
.tool{background:#fff;padding:14px;border-radius:14px;margin-bottom:10px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<header>
<span>PROJECTS</span>
<button onclick="openProjectModal()">＋</button>
</header>

<div class="main" id="app"></div>

<!-- PROJECT MODAL -->
<div class="overlay" id="projModal">
<div class="modal">
<div class="modal-head">Neues Projekt</div>
<div class="modal-body">
<input id="pname" placeholder="Name">
<input id="pnum" placeholder="Nummer">
<div class="bigbtn primary" onclick="createProject()">Erstellen</div>
<div class="bigbtn secondary" onclick="closeProjectModal()">Abbrechen</div>
</div>
</div>
</div>

<!-- TOOL MODAL -->
<div class="overlay" id="toolModal">
<div class="modal">
<div class="modal-head">Tool</div>
<div class="modal-body">

<input id="tid" placeholder="T0101">
<input id="tnm" placeholder="Name">

<div id="typeBtn" class="sel" onclick="toggleType()">STANDARD</div>

<h4>Fach</h4>
<div id="fachLetters" class="grid"></div>
<div id="fachNums" class="grid"></div>

<h4>Spannzange</h4>
<div id="spannGrid" class="grid"></div>

<h4>Reduzierhülse</h4>
<div id="redGrid" class="grid"></div>

<textarea id="tbem" placeholder="Bemerkung"></textarea>

<div id="revBtn" class="sel" onclick="toggleRev()">REVOLVER START</div>

<div class="bigbtn primary" onclick="saveTool()">Speichern</div>
<div class="bigbtn secondary" onclick="closeModal()">Abbrechen</div>

</div>
</div>
</div>

<script>
const KEY="QSDBV7"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let cur=null
let edit=null

function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
const app=document.getElementById("app")

function renderProjects(){
app.innerHTML=""
db.forEach((p,i)=>{
app.innerHTML+=`
<div class="card" onclick="openProject(${i})">
<div>${p.name}</div>
<b>${p.num}</b>
</div>`
})
}

function openProjectModal(){projModal.style.display="flex"}
function closeProjectModal(){projModal.style.display="none"}

function createProject(){
const n=pname.value.trim()
const num=pnum.value.trim()
if(!n||!num)return alert("Name + Nummer eingeben")
db.push({name:n,num:num,tools:[]})
saveDB()
closeProjectModal()
renderProjects()
}

function openProject(i){
cur=i
app.innerHTML=`
<div class="plus" onclick="openModal()">+ Werkzeug</div>
<div id="toolList"></div>
<button onclick="renderProjects()">← Back</button>
`
renderTools()
}

function renderTools(){
const box=document.getElementById("toolList")
box.innerHTML=""
db[cur].tools.forEach((t,i)=>{
box.innerHTML+=`
<div class="tool" onclick="editTool(${i})">
<div class="small">${t.id}</div>
<b>${t.nm}</b>
<div class="small">${t.bem||""}</div>
</div>`
})
}

function openModal(){
edit=null
toolModal.style.display="flex"
resetSelections()
}

function closeModal(){toolModal.style.display="none"}

function editTool(i){
edit=i
openModal()
const t=db[cur].tools[i]
tid.value=t.id
tnm.value=t.nm
tbem.value=t.bem
}

function toggleType(){
typeBtn.classList.toggle("active")
typeBtn.textContent=typeBtn.classList.contains("active")?"SONDER":"STANDARD"
}

function toggleRev(){revBtn.classList.toggle("active")}

let fachL=null,fachN=null,spann=null,red=null

function grid(el,arr,cb){
el.innerHTML=""
arr.forEach(v=>{
const d=document.createElement("div")
d.className="sel"
d.textContent=v
d.onclick=()=>{cb(v,d)}
el.appendChild(d)
})
}

function initGrids(){
grid(fachLetters,["A","B","C","D","E","F","G"],(v,d)=>{
fachL=v;[...fachLetters.children].forEach(x=>x.classList.remove("active"));d.classList.add("active")
})
grid(fachNums,[...Array(25).keys()].map(x=>x+1),(v,d)=>{
fachN=v;[...fachNums.children].forEach(x=>x.classList.remove("active"));d.classList.add("active")
})
grid(spannGrid,[...Array(25).keys()].map(x=>"D"+(x+1)),(v,d)=>{
spann=v;[...spannGrid.children].forEach(x=>x.classList.remove("active"));d.classList.add("active")
})
grid(redGrid,[...Array(25).keys()].map(x=>"D"+(x+1)),(v,d)=>{
red=v;[...redGrid.children].forEach(x=>x.classList.remove("active"));d.classList.add("active")
})
}

function resetSelections(){
fachL=fachN=spann=red=null
initGrids()
tid.value=""
tnm.value=""
tbem.value=""
typeBtn.classList.remove("active")
revBtn.classList.remove("active")
}

function saveTool(){
let bem=[]
if(fachL&&fachN)bem.push("FACH "+fachL+fachN)
if(spann)bem.push("SPANNZANGE "+spann)
if(red)bem.push("REDUZIER "+red)
if(tbem.value)bem.push(tbem.value)

const t={
id:tid.value.toUpperCase(),
nm:tnm.value.toUpperCase(),
bem:bem.join(" | "),
rev:revBtn.classList.contains("active"),
isSonder:typeBtn.classList.contains("active")
}

if(edit===null)db[cur].tools.push(t)
else db[cur].tools[edit]=t

saveDB()
closeModal()
renderTools()
}

renderProjects()
initGrids()
</script>
</body>
</html>
