<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QS TOOL</title>

<style>
body{margin:0;font-family:system-ui;background:#f2f2f7}
.top{display:flex;justify-content:space-between;padding:14px;background:#fff;font-weight:700}
.btn{background:#007aff;color:#fff;border:none;padding:10px 14px;border-radius:10px}
.list{padding:12px}
.card{background:#fff;padding:14px;border-radius:14px;margin-bottom:10px}
.tool{background:#fff;margin:10px;padding:14px;border-radius:14px;cursor:grab}
.modal{position:fixed;inset:0;background:#fff;z-index:99;display:none;flex-direction:column}
.head{padding:14px;font-weight:800;border-bottom:1px solid #ddd}
.sec{padding:14px;border-bottom:1px solid #eee}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.sel{padding:12px;background:#eee;border-radius:10px;text-align:center;font-weight:700}
.sel.active{background:#000;color:#fff}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ddd;margin-top:8px}
.footer{padding:14px}
</style>
</head>
<body>

<div class="top">
<div>PROJECTS</div>
<button class="btn" onclick="newProject()">NEU</button>
</div>

<div id="projects" class="list"></div>

<div id="toolsView" style="display:none">
<div class="top">
<button class="btn" onclick="back()">←</button>
<div id="title"></div>
<div>
<button class="btn" onclick="addTool()">+</button>
<button class="btn" onclick="exportJSON()">JSON</button>
</div>
</div>
<div id="tools"></div>
</div>

<div id="modal" class="modal">

<div class="head">Werkzeug</div>

<div class="sec">
ID
<input id="tid">
Name
<input id="tnm">
</div>

<div class="sec">
Fach
<div id="fach" class="grid"></div>
</div>

<div class="sec">
Position
<div id="slot" class="grid"></div>
</div>

<div class="sec">
Spannzange
<div id="sp" class="grid"></div>
</div>

<div class="sec">
Reduzierhülse
<div id="red" class="grid"></div>
</div>

<div class="sec">
Bemerkung
<input id="bem">
</div>

<div class="sec">
<button class="btn" id="rev">REVOLVER START</button>
</div>

<div class="footer">
<button class="btn" style="width:100%" onclick="saveTool()">Speichern</button>
</div>

</div>

<script>
let db=JSON.parse(localStorage.qs||"[]")
let cur=null
let edit=null
let rev=false

const q=id=>document.getElementById(id)

function saveDB(){localStorage.qs=JSON.stringify(db)}

function renderProjects(){
q("projects").innerHTML=db.map((p,i)=>`
<div class=card onclick="openProject(${i})">
${p.num} — ${p.name}
</div>`).join("")
}

function newProject(){
let n=prompt("Nummer")
if(!n)return
db.push({num:n,name:"PROJECT",tools:[]})
saveDB()
renderProjects()
}

function openProject(i){
cur=i
q("projects").style.display="none"
q("toolsView").style.display="block"
q("title").innerText=db[i].num
renderTools()
}

function back(){
q("projects").style.display="block"
q("toolsView").style.display="none"
}

function renderTools(){
q("tools").innerHTML=db[cur].tools.map((t,i)=>`
<div class=tool draggable=true
ondragstart="drag=${i}"
ondrop="drop(${i})"
ondragover="event.preventDefault()"
onclick="editTool(${i})">
<b>${t.id}</b><br>${t.nm}<br>${t.bem||""}
</div>`).join("")
}

let drag=null
function drop(i){
let a=db[cur].tools
let x=a.splice(drag,1)[0]
a.splice(i,0,x)
saveDB()
renderTools()
}

function addTool(){
edit=null
openModal()
}

function editTool(i){
edit=i
let t=db[cur].tools[i]
openModal(t)
}

function openModal(t={}){
q("modal").style.display="flex"
q("tid").value=t.id||""
q("tnm").value=t.nm||""
q("bem").value=t.bem||""
rev=t.rev||false
renderSelectors()
}

function renderSelectors(){

grid("fach",["A","B","C","D","E","F","G"],v=>sel.f=v)
grid("slot",[...Array(25)].map((_,i)=>i+1),v=>sel.s=v)
grid("sp",[...Array(25)].map((_,i)=>"D"+(i+1)),v=>sel.sp=v)
grid("red",[...Array(25)].map((_,i)=>"D"+(i+1)),v=>sel.r=v)

}

let sel={}

function grid(id,arr,cb){
let el=q(id)
el.innerHTML=""
arr.forEach(v=>{
let d=document.createElement("div")
d.className="sel"
d.textContent=v
d.onclick=()=>{
[...el.children].forEach(x=>x.classList.remove("active"))
d.classList.add("active")
cb(v)

setTimeout(()=>{
let sec=el.parentElement
sec.style.display="none"
let n=sec.nextElementSibling
if(n)n.style.display="block"
},120)
}
el.appendChild(d)
})
}

q("rev").onclick=()=>{
rev=!rev
q("rev").style.background=rev?"#000":"#007aff"
}

function saveTool(){

let t={
id:q("tid").value.toUpperCase(),
nm:q("tnm").value.toUpperCase(),
bem:`Fach ${sel.f||""}${sel.s||""} | ${sel.sp||""} | ${sel.r||""} ${q("bem").value}`,
rev:rev
}

if(edit===null)db[cur].tools.push(t)
else db[cur].tools[edit]=t

saveDB()
q("modal").style.display="none"
renderTools()
}

function exportJSON(){
alert(JSON.stringify(db[cur]))
}

renderProjects()
</script>
</body>
</html>
