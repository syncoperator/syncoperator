<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>SyncPro | DMG MORI Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* DMG MORI Color Palette */
            --dmg-dark: #1a1a1a;       /* Основной фон */
            --dmg-panel: #2d2d2d;      /* Фон панелей */
            --dmg-border: #404040;     /* Разделители */
            --dmg-accent: #00b0f0;     /* Основной синий (CELOS) */
            --dmg-green: #92d050;      /* Статус OK / Активен */
            --dmg-text: #e0e0e0;       /* Текст */
            --dmg-header-bg: #0d0d0d;
        }

        body {
            font-family: 'Roboto Condensed', sans-serif;
            background-color: var(--dmg-dark);
            color: var(--dmg-text);
            margin: 0;
            padding: 0;
            text-transform: uppercase; /* Фишка индустриальных интерфейсов */
        }

        /* --- HEADER (CELOS STYLE) --- */
        header {
            background: var(--dmg-header-bg);
            height: 60px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            border-bottom: 2px solid var(--dmg-accent);
            justify-content: space-between;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            letter-spacing: 2px;
            color: #fff;
        }

        .status-dot {
            width: 12px; height: 12px;
            background: var(--dmg-green);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--dmg-green);
        }

        /* --- MAIN NAVIGATION GRID --- */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            background: var(--dmg-border);
            border-bottom: 2px solid var(--dmg-border);
        }

        .nav-item {
            background: var(--dmg-panel);
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            color: var(--dmg-text);
            border: none;
            cursor: pointer;
        }

        .nav-item.active {
            background: var(--dmg-accent);
            color: #000;
        }

        /* --- CONTENT CARDS --- */
        .workbench-panel {
            background: var(--dmg-panel);
            margin: 10px;
            border: 1px solid var(--dmg-border);
            border-radius: 4px;
        }

        .panel-header {
            background: #383838;
            padding: 8px 15px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--dmg-border);
        }

        /* --- SLOTS (TOUCH OPTIMIZED) --- */
        .slot-list { padding: 5px; }
        
        .slot-row {
            display: grid;
            grid-template-columns: 50px 1fr 60px;
            height: 55px;
            align-items: center;
            background: #252525;
            margin-bottom: 5px;
            border-left: 4px solid transparent;
        }

        .slot-row.active {
            border-left-color: var(--dmg-accent);
            background: #333;
        }

        .slot-num {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            color: var(--dmg-accent);
        }

        .slot-content { font-size: 14px; }
        .slot-content span { display: block; font-size: 10px; color: #888; }

        .btn-touch {
            height: 100%;
            background: #444;
            border: none;
            color: #fff;
            font-size: 20px;
        }

        /* --- SYNC TIMELINE --- */
        .timeline {
            padding: 10px;
            overflow-x: auto;
        }

        .sync-row {
            display: flex;
            gap: 5px;
            margin-bottom: 5px;
        }

        .sync-block {
            min-width: 100px;
            height: 40px;
            background: #333;
            border: 1px solid var(--dmg-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }

        .sync-block.wait {
            background: repeating-linear-gradient(45deg, #222, #222 10px, #333 10px, #333 20px);
            color: #ff9900;
        }

        /* --- FOOTER MENU --- */
        footer {
            position: fixed;
            bottom: 0; width: 100%;
            height: 70px;
            background: var(--dmg-header-bg);
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 2px solid var(--dmg-border);
        }

        .f-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: #888;
            border-right: 1px solid var(--dmg-border);
        }

        .f-item svg { width: 20px; margin-bottom: 5px; fill: #888; }
        .f-item.active { color: var(--dmg-accent); }
        .f-item.active svg { fill: var(--dmg-accent); }

    </style>
</head>
<body>

<header>
    <div class="logo">DMG MORI <span style="font-weight:400; color:var(--dmg-accent)">SYNC</span></div>
    <div class="status-dot"></div>
</header>

<div class="app-grid">
    <button class="nav-item active">JOB MANAGER</button>
    <button class="nav-item">TOOL ANALYZER</button>
</div>

<main style="padding-bottom: 80px;">
    <div class="workbench-panel">
        <div class="panel-header">
            <span>STATION CONFIGURATION</span>
            <span style="color:var(--dmg-accent)">KANAL 1</span>
        </div>
        <div class="slot-list">
            <div class="slot-row active">
                <div class="slot-num">01</div>
                <div class="slot-content">
                    AXIAL_DRILL_BMT60
                    <span>T0101 | SPINDLE 4</span>
                </div>
                <button class="btn-touch">⋮</button>
            </div>
            <div class="slot-row">
                <div class="slot-num">02</div>
                <div class="slot-content">
                    RADIAL_MILLING
                    <span>T0202 | SPINDLE 3</span>
                </div>
                <button class="btn-touch">⋮</button>
            </div>
        </div>
    </div>

    <div class="workbench-panel">
        <div class="panel-header">SYNC VIEW (WAIT-MARKS)</div>
        <div class="timeline">
            <div class="sync-row">
                <div class="sync-block" style="border-bottom: 3px solid var(--dmg-green)">M100</div>
                <div class="sync-block" style="flex-grow:1">OP_10_BORE</div>
            </div>
            <div class="sync-row">
                <div class="sync-block wait">WAIT</div>
                <div class="sync-block" style="flex-grow:1; border-bottom: 3px solid var(--dmg-accent)">OP_20_TURNING</div>
            </div>
        </div>
    </div>
</main>

<footer>
    <div class="f-item active">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        HOME
    </div>
    <div class="f-item">
        <svg viewBox="0 0 24 24"><path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/></svg>
        LIST
    </div>
    <div class="f-item">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        SAVE
    </div>
    <div class="f-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        INFO
    </div>
</footer>

</body>
</html>
