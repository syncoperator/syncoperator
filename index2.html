<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SyncOperator</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f4f8}
.top{padding:18px;font-weight:700;font-size:20px}
.box{background:#fff;margin:12px;padding:14px;border-radius:16px}
button{width:100%;padding:12px;margin-top:8px;border:none;border-radius:10px;background:#111;color:#fff}
input,textarea{width:100%;padding:10px;margin-top:6px;border-radius:10px;border:1px solid #ddd}
.item{padding:10px;border-bottom:1px solid #eee;cursor:pointer}
.modalBG{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.modal{background:#fff;padding:20px;border-radius:18px;width:90%;max-width:400px}
.row{display:flex;gap:6px;margin-top:8px}
.chip{flex:1;padding:8px;border-radius:10px;background:#eee;text-align:center;cursor:pointer}
.on{background:#111;color:#fff}
</style>
</head>
<body>

<div class="top">SyncOperator</div>

<div id="app"></div>

<div class="modalBG" id="modalBG">
<div class="modal" id="modal"></div>
</div>

<script>

// ---------- DB ----------
let db
const req=indexedDB.open("SyncOperatorDB",1)
req.onupgradeneeded=e=>{
db=e.target.result
db.createObjectStore("projects",{keyPath:"uid"})
}
req.onsuccess=e=>{db=e.target.result;loadProjects()}

// ---------- STATE ----------
let state={
view:"dash",
projects:[],
active:null,
modalTool:null
}

// ---------- UTILS ----------
const uuid=()=>crypto.randomUUID()

// ---------- DB FUNCS ----------
function saveProject(p){
let tx=db.transaction("projects","readwrite")
tx.objectStore("projects").put(p)
}

function loadProjects(){
let tx=db.transaction("projects","readonly")
let req=tx.objectStore("projects").getAll()
req.onsuccess=()=>{
state.projects=req.result
render()
}
}

// ---------- UI ----------
function render(){
app.innerHTML=""
if(state.view==="dash") renderDash()
else renderProject()
}

// ---------- DASH ----------
function renderDash(){
let el=document.createElement("div")

state.projects.forEach(p=>{
let d=document.createElement("div")
d.className="box item"
d.textContent=p.num+"  "+p.name
d.onclick=()=>{state.active=p;state.view="project";render()}
el.appendChild(d)
})

let add=document.createElement("div")
add.className="box"
add.innerHTML=`
<input id="num" placeholder="Nummer">
<input id="name" placeholder="Name">
<button onclick="createProject()">Projekt erstellen</button>
`
el.appendChild(add)

app.appendChild(el)
}

function createProject(){
let p={
uid:uuid(),
num:num.value,
name:name.value,
tools:[],
created:Date.now(),
updated:Date.now()
}
state.projects.push(p)
saveProject(p)
render()
}

// ---------- PROJECT VIEW ----------
function renderProject(){
let p=state.active
let el=document.createElement("div")

let head=document.createElement("div")
head.className="box"
head.innerHTML=`
<b>${p.num} ${p.name}</b>
<button onclick="state.view='dash';render()">← zurück</button>
<textarea id="paste" placeholder="T0101 TOOLNAME"></textarea>
<button onclick="parseTools()">Tools hinzufügen</button>
`
el.appendChild(head)

p.tools.forEach(t=>{
let row=document.createElement("div")
row.className="box item"
row.textContent=t.id+"  "+t.nm
row.onclick=()=>openModal(t)
el.appendChild(row)
})

app.appendChild(el)
}

// ---------- PARSER ----------
function parseTools(){
let lines=paste.value.split("\n")
let p=state.active

lines.forEach(l=>{
let txt=l.trim()
if(!txt)return
let parts=txt.split(" ")
let id=parts.shift()
p.tools.push({
uid:uuid(),
id:id,
nm:parts.join(" "),
dia:"",
fach:"",
spann:"",
red:"",
rev:false,
sonder:false
})
})

saveProject(p)
render()
}

// ---------- MODAL ----------
function openModal(t){
state.modalTool=JSON.parse(JSON.stringify(t))
modalBG.style.display="flex"
drawModal()
}

function drawModal(){
let t=state.modalTool

modal.innerHTML=`
<b>${t.id}</b><br>${t.nm}

<input id="dia" placeholder="Dia" value="${t.dia||""}">

<div class="row">${chips(["B1","B3","B4","B6","D"],t.fach,"fach")}</div>
<div class="row">${chips(["D2","D6","D10","D16"],t.spann,"spann")}</div>
<div class="row">${chips(["D10","D14","D16","D18","D20"],t.red,"red")}</div>

<div class="row">
<div class="chip ${t.rev?"on":""}" onclick="toggle('rev')">REV</div>
<div class="chip ${t.sonder?"on":""}" onclick="toggle('sonder')">SONDER</div>
</div>

<button onclick="saveTool()">SAVE</button>
<button onclick="deleteTool()">DELETE</button>
<button onclick="closeModal()">CANCEL</button>
`
}

function chips(arr,val,key){
return arr.map(v=>`<div class="chip ${val===v?"on":""}" onclick="setChip('${key}','${v}')">${v}</div>`).join("")
}

function setChip(k,v){
state.modalTool[k]=v
drawModal()
}

function toggle(k){
state.modalTool[k]=!state.modalTool[k]
drawModal()
}

function closeModal(){
modalBG.style.display="none"
}

function saveTool(){
let p=state.active
let i=p.tools.findIndex(x=>x.uid===state.modalTool.uid)
p.tools[i]=state.modalTool
saveProject(p)
closeModal()
render()
}

function deleteTool(){
let p=state.active
p.tools=p.tools.filter(x=>x.uid!==state.modalTool.uid)
saveProject(p)
closeModal()
render()
}

modalBG.onclick=e=>{
if(e.target===modalBG) closeModal()
}

</script>
</body>
</html>
