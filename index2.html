<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>CITITOOL OS | 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #fcfcfd;
            --surface: #ffffff;
            --accent: #0047FF;
            --accent-soft: rgba(0, 71, 255, 0.05);
            --text-primary: #0a0a0b;
            --text-secondary: #6b6b78;
            --border: rgba(0, 0, 0, 0.04);
            --bento-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
            --radius: 24px;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0; padding: 0;
            letter-spacing: -0.02em;
        }

        /* --- MODERN HEADER --- */
        header {
            padding: 30px 24px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-weight: 800;
            font-size: 22px;
            background: linear-gradient(to right, #0047FF, #00D1FF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-status {
            width: 40px; height: 40px;
            background: var(--surface);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: var(--bento-shadow);
            border: 1px solid var(--border);
        }

        /* --- BENTO MENU (NAVIGATION) --- */
        .bento-nav {
            display: grid;
            grid-template-columns: 2fr 1fr;
            grid-template-rows: auto auto;
            gap: 12px;
            padding: 20px 24px;
        }

        .bento-item {
            background: var(--surface);
            border-radius: var(--radius);
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--bento-shadow);
            position: relative;
            overflow: hidden;
            transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1);
        }

        .bento-item:active { transform: scale(0.97); }

        .bento-item.active {
            background: var(--accent);
            color: #fff;
        }

        .bento-label { font-size: 11px; font-weight: 600; opacity: 0.6; text-transform: uppercase; }
        .bento-val { font-size: 18px; font-weight: 800; margin-top: 5px; display: block; }

        /* --- CONFIGURATION SECTION --- */
        .section-header {
            padding: 10px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 { font-size: 20px; font-weight: 800; margin: 0; }

        .slot-card {
            background: var(--surface);
            margin: 10px 24px;
            padding: 24px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: var(--bento-shadow);
        }

        .slot-circle {
            width: 50px; height: 50px;
            border-radius: 18px;
            background: var(--accent-soft);
            color: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700; font-size: 18px;
        }

        .slot-meta b { font-size: 15px; display: block; margin-bottom: 2px; }
        .slot-meta span { font-size: 12px; color: var(--text-secondary); font-weight: 500; }

        /* --- TIMELINE (MINIMALIST) --- */
        .timeline-modern {
            padding: 10px 24px 100px;
        }

        .timeline-row {
            display: flex;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 24px;
        }

        .time-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            font-weight: 700;
            color: var(--accent);
            padding-top: 4px;
        }

        .op-bubble {
            background: var(--surface);
            padding: 16px 20px;
            border-radius: 20px;
            border: 1px solid var(--border);
            flex-grow: 1;
            font-size: 14px;
            font-weight: 600;
            box-shadow: var(--bento-shadow);
        }

        .op-bubble.wait {
            background: transparent;
            border: 1px dashed var(--text-secondary);
            color: var(--text-secondary);
            box-shadow: none;
        }

        /* --- FLOATING CONTROLS --- */
        .dock-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(10, 10, 11, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 10px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .dock-item {
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            opacity: 0.5;
        }

        .dock-item.active { opacity: 1; background: rgba(255,255,255,0.1); border-radius: 20px; }

        .add-trigger {
            width: 55px; height: 55px;
            background: var(--accent);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 10px 20px rgba(0, 71, 255, 0.3);
            border: none;
        }

    </style>
</head>
<body>

<header>
    <div class="brand-logo">CITITOOL</div>
    <div class="user-status">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
    </div>
</header>

<div class="bento-nav">
    <div class="bento-item active">
        <span class="bento-label">Active Channel</span>
        <span class="bento-val">CHANNEL 01</span>
    </div>
    <div class="bento-item">
        <span class="bento-label">Mode</span>
        <span class="bento-val">SYNC</span>
    </div>
    <div class="bento-item" style="grid-column: span 2;">
        <span class="bento-label">System Performance</span>
        <span class="bento-val">98.4% Efficiency</span>
    </div>
</div>

<div class="section-header">
    <h2>Workbench</h2>
    <div style="font-size: 13px; font-weight: 700; color: var(--accent)">Edit All</div>
</div>

<div id="slotList">
    <div class="slot-card">
        <div class="slot-circle">01</div>
        <div class="slot-meta">
            <b>AXIAL_MILL_V12</b>
            <span>T0101 • SPINDLE 4</span>
        </div>
    </div>
</div>

<div class="section-header">
    <h2>Timeline</h2>
</div>

<div class="timeline-modern">
    <div class="timeline-row">
        <div class="time-tag">M100</div>
        <div class="op-bubble">INIT_FACING_PROCESS</div>
    </div>
    <div class="timeline-row">
        <div class="time-tag">WAIT</div>
        <div class="op-bubble wait">SYNCING WITH KANAL 2...</div>
    </div>
    <div class="timeline-row">
        <div class="time-tag">M105</div>
        <div class="op-bubble" style="border-left: 5px solid var(--accent)">DRILL_MAIN_CHAMFER</div>
    </div>
</div>

<div class="dock-container">
    <div class="dock-item active">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
    </div>
    <div class="dock-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M9 20v-10M15 20v-2M18 20V4M6 20v-4"></path></svg>
    </div>
    <button class="add-trigger">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
    <div class="dock-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
    </div>
    <div class="dock-item">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </div>
</div>

</body>
</html>
