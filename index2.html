<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>QS PRO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter;background:#F2F2F7}
.view{display:none;position:fixed;inset:0;flex-direction:column}
.view.active{display:flex}
.nav{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:#fff;border-bottom:1px solid #ddd}
.btn{background:#007AFF;color:#fff;border:0;padding:10px 16px;border-radius:12px;font-weight:800}
.list{flex:1;overflow:auto;padding:16px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.overlay{display:none;position:fixed;inset:0;background:#0005;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:92vh;overflow:auto}
input,textarea{width:100%;padding:12px;border-radius:10px;border:0;background:#eee;margin-bottom:10px;font-weight:600}
.wizard button{width:100%;margin:6px 0;padding:14px;border-radius:12px;border:0;font-weight:800}
.drag{cursor:grab}
#print{display:none}
@media print{
body *{display:none}
#print,#print *{display:block}
#print{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>
<body>

<div id="home" class="view active">
<div class="nav"><b>QS PRO</b><button class="btn" onclick="newProject()">+ NEU</button></div>
<div id="plist" class="list"></div>
</div>

<div id="proj" class="view">
<div class="nav">
<button onclick="back()">←</button>
<b id="ptitle"></b>
<button onclick="pdf()">PDF</button>
</div>
<div class="list" id="tlist"></div>
<button class="btn" onclick="importTools()">+ PARSE</button>
</div>

<div id="modal" class="overlay" onclick="if(event.target==this)hide()">
<div class="sheet" id="sheet"></div>
</div>

<div id="print"></div>

<script>
let DB=JSON.parse(localStorage.qs||"[]")
let current=null

const save=()=>localStorage.qs=JSON.stringify(DB)

const show=(html)=>{sheet.innerHTML=html;modal.style.display="flex"}
const hide=()=>modal.style.display="none"

function render(){
plist.innerHTML=DB.map((p,i)=>`
<div class=card onclick="openP(${i})">
<b>${p.num}</b><div>${p.name}</div>
</div>`).join("")
}

function newProject(){
show(`
<h3>Projekt</h3>
<input id=num placeholder=Nummer>
<input id=name placeholder=Name>
<button class=btn onclick="createP()">Speichern</button>`)
}

function createP(){
DB.push({num:num.value,name:name.value,tools:[]})
save();hide();render()
}

function openP(i){
current=i
home.classList.remove("active")
proj.classList.add("active")
ptitle.innerText=DB[i].num
renderTools()
}

function back(){
proj.classList.remove("active")
home.classList.add("active")
render()
}

function renderTools(){
let arr=DB[current].tools
tlist.innerHTML=arr.map((t,i)=>`
<div class="card drag" draggable=true
ondragstart="drag=${i}"
ondragover="event.preventDefault()"
ondrop="dropTool(${i})">
<b>${t.id}</b> ${t.nm}<br>
<small>${t.bem||""}</small>
</div>`).join("")
}

let drag=null
function dropTool(i){
let a=DB[current].tools
a.splice(i,0,a.splice(drag,1)[0])
save();renderTools()
}

function importTools(){
show(`
<h3>Вставь список</h3>
<textarea id=raw rows=8></textarea>
<button class=btn onclick="parse()">Parse</button>`)
}

function parse(){
let lines=raw.value.split("\\n").filter(x=>x.trim())
let arr=DB[current].tools

lines.forEach(l=>{
let id=l.match(/T\\d+/)?.[0]||""
let name=l.replace(id,"").trim()
arr.push({id,nm:name,dia:"",bem:"",rev:false})
})

save();hide();renderTools()
}

function wizard(i){
let t=DB[current].tools[i]
show(`
<h3>${t.id}</h3>
<div class=wizard>
<button onclick="setBem(${i},'Schrank A')">Schrank</button>
<button onclick="setBem(${i},'Blaukiste')">Blaukiste</button>
<button onclick="setBem(${i},'Spannzange')">Spannzange</button>
<button onclick="setBem(${i},'Reduzierhülse')">Reduzierhülse</button>
<button onclick="toggleRev(${i})">Revolver unten</button>
</div>`)
}

function setBem(i,val){
let t=DB[current].tools[i]
t.bem=(t.bem? t.bem+" | ":"")+val
save();wizard(i);renderTools()
}

function toggleRev(i){
let t=DB[current].tools[i]
t.rev=!t.rev
save();wizard(i);renderTools()
}

function pdf(){
let p=DB[current]
print.innerHTML=`
<div style="padding:40px;font-family:sans-serif">
<h1>${p.name}</h1>
<h2>${p.num}</h2>
<hr>
${p.tools.map(t=>`
<div style="margin:10px 0">
<b>${t.id}</b> ${t.nm}<br>${t.bem||""}
</div>`).join("")}
</div>`
setTimeout(()=>window.print(),200)
}

function exportJSON(){
let blob=new Blob([JSON.stringify(DB,null,2)],{type:"application/json"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="qs.json"
a.click()
}

render()
</script>
</body>
</html>
