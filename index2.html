<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Order</title>

<style>
:root{
--bg:#0c0d10;
--card:#151821;
--accent:#d6b25e;
--text:#e8ecf1;
--muted:#7a8391;
}

body{
margin:0;
background:linear-gradient(160deg,#0b0c10,#11131a);
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica;
color:var(--text);
}

header{
padding:22px;
text-align:center;
font-size:20px;
font-weight:600;
letter-spacing:.7px;
background:rgba(255,255,255,.03);
backdrop-filter:blur(10px);
border-bottom:1px solid rgba(255,255,255,.06);
}

.wrap{padding:18px}

.card{
background:var(--card);
padding:16px;
border-radius:18px;
box-shadow:0 10px 30px rgba(0,0,0,.4);
margin-bottom:16px;
}

input{
width:100%;
padding:14px;
margin-top:10px;
border-radius:12px;
border:none;
background:#0f1218;
color:white;
font-size:16px;
outline:none;
}

button{
width:100%;
padding:14px;
margin-top:14px;
border-radius:14px;
border:none;
background:var(--accent);
font-weight:600;
font-size:16px;
}

.listItem{
display:flex;
justify-content:space-between;
align-items:center;
padding:14px;
border-radius:14px;
background:#0f1218;
margin-top:10px;
animation:fade .25s ease;
}

@keyframes fade{
from{opacity:0; transform:translateY(6px)}
to{opacity:1}
}

.name{font-weight:600}
.qty{color:var(--muted); font-size:14px}

.del{
background:#ff4747;
border:none;
color:white;
padding:8px 12px;
border-radius:10px;
font-size:14px;
}

.empty{
text-align:center;
color:var(--muted);
padding:20px 0;
font-size:14px;
}
</style>
</head>
<body>

<header>CNC Tool Order</header>

<div class="wrap">

<div class="card">
<input id="name" placeholder="Tool name">
<input id="qty" type="number" placeholder="Qty">
<button onclick="add()">Add Tool</button>
</div>

<div class="card" id="list"></div>

<button onclick="pdf()">Export PDF</button>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
let tools=JSON.parse(localStorage.getItem("tools")||"[]")

function save(){
localStorage.setItem("tools",JSON.stringify(tools))
}

function draw(){
const box=document.getElementById("list")
box.innerHTML=""

if(!tools.length){
box.innerHTML="<div class='empty'>No tools added</div>"
return
}

tools.forEach((t,i)=>{
box.innerHTML+=`
<div class="listItem">
<div>
<div class="name">${t.name}</div>
<div class="qty">Qty: ${t.qty}</div>
</div>
<button class="del" onclick="del(${i})">✕</button>
</div>`
})
}

function add(){
const nameEl=document.getElementById("name")
const qtyEl=document.getElementById("qty")

const name=nameEl.value.trim()
const qty=qtyEl.value

if(!name||!qty)return

tools.push({name,qty})
save()
draw()

nameEl.value=""
qtyEl.value=""
}

function del(i){
tools.splice(i,1)
save()
draw()
}

async function pdf(){
if(!tools.length)return alert("List empty")

const {jsPDF}=window.jspdf
const doc=new jsPDF()

doc.setFontSize(18)
doc.text("CNC TOOL ORDER",20,20)

doc.setFontSize(12)
let y=40

tools.forEach((t,i)=>{
doc.text(`${i+1}. ${t.name}  |  Qty: ${t.qty}`,20,y)
y+=10
})

doc.save("order.pdf")
}

draw()
</script>

</body>
</html>
