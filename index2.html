<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CitiTool | SyncOperator Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f1f5f9;
        --card-bg: rgba(255, 255, 255, 0.85);
        --card-border: rgba(226, 232, 240, 0.8);
        --border-strong: #cbd5e1;
        --text-main: #0f172a;
        --text-muted: #475569;
        --text-soft: #94a3b8;
        --accent: #0f172a;
        --sp4-ink: #065f46;
        --sp4-bg: #ecfdf5;
        --sp4-border: #10b981;
        --sp3-ink: #1e40af;
        --sp3-bg: #eff6ff;
        --sp3-border: #3b82f6;
        --danger: #ef4444;
        --radius-lg: 24px;
        --radius-md: 16px;
        --radius-sm: 10px;
        --shadow-card: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02);
        --shadow-hover: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --font-main: 'Inter', system-ui, -apple-system, sans-serif;
      }

      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: var(--font-main);
        background: radial-gradient(at top left, #f8fafc, #e2e8f0);
        color: var(--text-main);
        margin: 0;
        padding: 0;
        line-height: 1.5;
      }

      /* Layout */
      .app-shell { max-width: 1400px; margin: 0 auto; padding: 24px 16px; }
      
      /* Header Modernized */
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 32px;
        padding: 16px 24px;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border-radius: var(--radius-lg);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow-card);
      }

      .app-logo-mark {
        width: 48px; height: 48px;
        background: var(--accent);
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        color: white; font-weight: 800; font-size: 22px;
        box-shadow: 0 8px 16px rgba(15, 23, 42, 0.2);
      }

      .app-title-block { margin-left: 16px; }
      .app-title { font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
      .app-subtitle { font-size: 12px; color: var(--text-soft); font-weight: 500; }

      .app-header-right { display: flex; gap: 12px; }

      /* Buttons Premium */
      .btn-primary, .btn-outline {
        padding: 10px 18px;
        border-radius: var(--radius-sm);
        font-size: 13px; font-weight: 600;
        cursor: pointer; transition: var(--transition);
        display: inline-flex; align-items: center; gap: 8px;
      }
      .btn-primary {
        background: var(--accent); color: white; border: none;
      }
      .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(15,23,42,0.3); }
      .btn-outline {
        background: white; border: 1px solid var(--border-strong); color: var(--text-muted);
      }
      .btn-outline:hover { background: #f8fafc; border-color: var(--accent); color: var(--accent); }

      /* Cards Grid */
      .layout-main {
        display: grid;
        grid-template-columns: 1fr 400px;
        gap: 24px;
        margin-bottom: 24px;
      }

      .card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-lg);
        padding: 24px;
        box-shadow: var(--shadow-card);
        backdrop-filter: blur(10px);
      }

      .section-header {
        display: flex; justify-content: space-between; align-items: center;
        margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 16px;
      }
      .section-title { font-weight: 700; font-size: 16px; color: var(--text-main); }

      /* Slot Styling */
      .slot-list { display: flex; flex-direction: column; gap: 10px; }
      .slot-row {
        background: white;
        border-radius: var(--radius-md);
        padding: 14px 18px;
        display: grid; grid-template-columns: 40px 1fr auto;
        align-items: center;
        border: 1px solid transparent;
        transition: var(--transition);
      }
      .slot-row.filled { border-color: #f1f5f9; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
      .slot-row:hover { transform: scale(1.01); border-color: var(--border-strong); }
      .slot-row.drag-over { background: #f0f9ff; border: 2px dashed #0ea5e9; }
      
      .slot-index { font-weight: 700; color: var(--text-soft); font-size: 14px; }
      .slot-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
      
      /* Badges */
      .badge {
        padding: 2px 10px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase;
      }
      .badge-sp4 { background: var(--sp4-bg); color: var(--sp4-ink); border: 1px solid #6ee7b7; }
      .badge-sp3 { background: var(--sp3-bg); color: var(--sp3-ink); border: 1px solid #93c5fd; }
      
      /* Filters */
      .filter-pill {
        padding: 6px 14px; border-radius: 99px; border: 1px solid #e2e8f0;
        background: white; font-size: 12px; font-weight: 500; cursor: pointer; transition: var(--transition);
      }
      .filter-pill.active { background: var(--accent); color: white; border-color: var(--accent); }

      /* Plan Table Premium */
      .plan-table {
        width: 100%; border-collapse: separate; border-spacing: 0;
        background: white; border-radius: var(--radius-md); overflow: hidden;
      }
      .plan-table th {
        background: #f8fafc; padding: 16px; font-size: 12px; font-weight: 700;
        text-transform: uppercase; color: var(--text-muted); border-bottom: 2px solid #f1f5f9;
      }
      .plan-table td { padding: 12px 16px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
      .plan-l { font-weight: 800; color: var(--accent); background: #f1f5f9; padding: 2px 6px; border-radius: 4px; }
      
      /* Mobile optimization */
      @media (max-width: 1024px) {
        .layout-main { grid-template-columns: 1fr; }
      }

      /* Modal Style */
      .modal-dialog {
        max-width: 500px; background: white; border-radius: var(--radius-lg);
        padding: 32px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div class="app-header-left">
          <div class="app-logo-mark">C</div>
          <div class="app-title-block">
            <div class="app-title">CitiTool</div>
            <div class="app-subtitle">SyncOperator 3.0</div>
          </div>
        </div>
        <div class="app-header-right">
          <button id="exportPdfBtn" class="btn-outline">PDF Export</button>
          <button id="exportJsonBtn" class="btn-outline">JSON Save</button>
          <button id="importJsonBtn" class="btn-outline">Import</button>
          <input id="importFileInput" type="file" accept="application/json" style="display:none" />
          <button id="infoButton" class="btn-outline" style="border-radius: 50%; width:40px; height:40px; padding:0; justify-content:center;">i</button>
        </div>
      </header>

      <main class="layout-main">
        <section class="card slots-card">
          <div class="section-header">
            <div>
              <div class="section-title">Program Sequence</div>
              <div class="section-subtitle">Drag operations to organize workflow</div>
            </div>
            <div id="kanalSwitcher" class="app-header-right">
              <button class="filter-pill active" data-kanal="1">Kanal 1</button>
              <button class="filter-pill" data-kanal="2">Kanal 2</button>
            </div>
          </div>
          <div id="kanalHint" style="margin-bottom: 15px; font-size: 12px; font-weight:600; color: var(--text-soft);"></div>
          <div id="slotList" class="slot-list"></div>
          <button id="addSlotBtn" class="btn-primary" style="margin-top: 20px; width: 100%; justify-content: center;">+ Add New Slot</button>
        </section>

        <section class="card library-card">
          <div class="section-header">
            <div class="section-title">Operation Library</div>
            <button id="addOpButton" class="btn-primary" style="padding: 6px 12px;">+ New Op</button>
          </div>
          <div id="libraryFilters" class="library-filters" style="margin-bottom: 20px;"></div>
          <div id="libraryList" class="slot-list"></div>
        </section>
      </main>

      <section class="card plan-card">
        <div class="section-header">
          <div class="section-title">Sync Plan View</div>
          <div class="section-actions"></div>
        </div>
        <div class="plan-table-wrapper">
          <table id="planTable" class="plan-table"></table>
        </div>
      </section>
    </div>

    <div id="modalOverlay" class="modal-overlay" style="position:fixed; inset:0; background:rgba(15,23,42,0.6); backdrop-filter:blur(4px); display:none; align-items:center; justify-content:center; z-index:100;">
      <div class="modal-dialog">
        <div class="modal-header" style="display:flex; justify-content:space-between; margin-bottom:20px;">
          <h3 id="modalTitle" style="margin:0;"></h3>
          <button id="modalCloseButton" style="background:none; border:none; cursor:pointer; font-size:24px;">&times;</button>
        </div>
        <div id="modalDescription" style="font-size:13px; color:var(--text-soft); margin-bottom:20px;"></div>
        <div id="modalBody"></div>
        <div id="modalFooter" style="margin-top:24px; display:flex; justify-content:flex-end; gap:12px;"></div>
      </div>
    </div>

    <script>
      /* Вставьте сюда ваш app.js полностью */
      /* Я адаптировал селекторы в HTML под ваш существующий JS, чтобы ничего не сломалось */
    </script>
  </body>
</html>
