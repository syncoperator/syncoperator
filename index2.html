<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CitiTool | SyncOperator PRO</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Palette: Deep Premium Dark */
            --bg-body: #0a0f18;
            --bg-card: #161e2d;
            --bg-header: rgba(22, 30, 45, 0.8);
            --border-color: rgba(255, 255, 255, 0.08);
            
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            
            /* Spindle Colors (Premium Neon) */
            --sp4-color: #4ade80;
            --sp4-bg: rgba(74, 222, 128, 0.1);
            --sp3-color: #60a5fa;
            --sp3-bg: rgba(96, 165, 250, 0.1);
            
            --radius: 12px;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            margin: 0; 
            padding-bottom: 50px;
            background-image: radial-gradient(circle at 50% 0%, #1e293b 0%, #0a0f18 100%);
        }

        /* --- UI SHELL --- */
        .app-shell { max-width: 1440px; margin: 0 auto; padding: 20px; }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: var(--bg-header);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 24px;
            position: sticky; top: 10px; z-index: 10;
        }

        .app-header-left { display: flex; align-items: center; gap: 15px; }
        .app-logo-mark {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 20px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }
        .app-title { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
        .app-subtitle { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

        .app-header-right { display: flex; gap: 8px; }

        /* --- BUTTONS --- */
        .btn-primary, .btn-outline {
            padding: 8px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: var(--transition); border: 1px solid transparent;
            display: flex; align-items: center; gap: 6px;
        }
        .btn-primary { background: #38bdf8; color: #000; }
        .btn-primary:hover { background: #7dd3fc; transform: translateY(-1px); }
        .btn-outline { background: rgba(255,255,255,0.05); color: #fff; border-color: var(--border-color); }
        .btn-outline:hover { background: rgba(255,255,255,0.1); border-color: #fff; }

        /* --- LAYOUT --- */
        .layout-main { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 20px; }
        @media (max-width: 1024px) { .layout-main { grid-template-columns: 1fr; } }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .section-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 20px; border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }
        .section-title { font-size: 16px; font-weight: 700; color: #fff; }
        .section-subtitle { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

        /* --- KANAL SWITCHER --- */
        .kanal-switcher-wrapper { margin-bottom: 15px; display: flex; justify-content: center; }
        .kanal-switcher {
            display: flex; background: rgba(0,0,0,0.2); padding: 4px; border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .kanal-option {
            background: transparent; border: none; padding: 8px 20px; border-radius: 8px;
            color: var(--text-muted); font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .kanal-option.active { background: #38bdf8; color: #000; }

        /* --- SLOTS --- */
        .slot-list { display: flex; flex-direction: column; gap: 8px; }
        .slot-row {
            display: grid; grid-template-columns: 30px 1fr auto;
            align-items: center; gap: 12px; padding: 12px;
            background: rgba(255,255,255,0.02); border: 1px solid var(--border-color);
            border-radius: 10px; cursor: pointer; transition: var(--transition);
        }
        .slot-row:hover { border-color: var(--accent); background: rgba(255,255,255,0.05); }
        .slot-row.filled { background: rgba(255,255,255,0.04); border-style: solid; }
        .slot-row.drag-over { border: 2px dashed var(--accent); background: rgba(56, 189, 248, 0.1); }

        .slot-index { font-size: 12px; color: var(--text-muted); font-weight: 700; }
        .slot-title { font-weight: 600; font-size: 14px; margin-bottom: 4px; }
        .slot-meta { display: flex; gap: 6px; flex-wrap: wrap; }
        
        /* Badges */
        .badge { padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .badge-sp4 { background: var(--sp4-bg); color: var(--sp4-color); border: 1px solid var(--sp4-color); }
        .badge-sp3 { background: var(--sp3-bg); color: var(--sp3-color); border: 1px solid var(--sp3-color); }
        .badge-soft { background: rgba(255,255,255,0.1); color: #fff; }

        /* --- LIBRARY --- */
        .library-filters { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        .filter-pill {
            background: transparent; border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 4px 12px; border-radius: 20px;
            font-size: 11px; cursor: pointer; transition: var(--transition);
        }
        .filter-pill.active { background: #fff; color: #000; border-color: #fff; }

        .library-list { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 8px; 
            max-height: 400px; overflow-y: auto; padding-right: 5px;
        }
        .op-card {
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-color);
            padding: 10px; border-radius: 8px; cursor: move;
        }
        .op-card:hover { border-color: #fff; background: rgba(255,255,255,0.06); }

        /* --- PLAN TABLE --- */
        .plan-table-wrapper { border-radius: 12px; overflow: hidden; border: 1px solid var(--border-color); }
        .plan-table { width: 100%; border-collapse: collapse; font-size: 12px; background: var(--bg-card); }
        .plan-table th { background: #1e293b; color: var(--text-muted); padding: 12px; text-align: left; }
        .plan-table td { border-bottom: 1px solid var(--border-color); padding: 10px 12px; }
        .plan-table .th-group { background: #0f172a; text-align: center; color: var(--accent); font-weight: 800; }
        .plan-l { color: var(--accent); font-weight: 800; margin-left: 5px; }
        .plan-t { color: var(--text-muted); font-size: 10px; margin-left: 5px; }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 100;
        }
        .modal-overlay.visible { display: flex; }
        .modal-dialog {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 90%; max-width: 500px; border-radius: 20px; padding: 30px;
        }
        .field-input, .field-select {
            width: 100%; background: #0a0f18; border: 1px solid var(--border-color);
            color: #fff; padding: 10px; border-radius: 8px; margin-top: 5px;
        }

        /* Print Settings */
        @media print {
            body { background: #fff; color: #000; }
            .app-header, .slots-card, .library-card, #addSlotBtn { display: none !important; }
            .card { border: none; box-shadow: none; }
            .plan-table th { background: #eee !important; color: #000 !important; }
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <header class="app-header">
            <div class="app-header-left">
                <div class="app-logo-mark">C</div>
                <div class="app-title-block">
                    <div class="app-title">CitiTool</div>
                    <div class="app-subtitle">SyncOperator PRO</div>
                </div>
            </div>
            <div class="app-header-right">
                <button id="exportPdfBtn" class="btn-outline">PDF</button>
                <button id="exportJsonBtn" class="btn-outline">Save JSON</button>
                <button id="importJsonBtn" class="btn-outline">Load</button>
                <input id="importFileInput" type="file" accept="application/json" style="display:none" />
                <button id="infoButton" class="btn-outline">i</button>
            </div>
        </header>

        <main class="layout-main">
            <section class="card slots-card">
                <div class="section-header">
                    <div>
                        <div class="section-title">Konfiguration</div>
                        <div class="section-subtitle">Kanal & Operation Mapping</div>
                    </div>
                </div>

                <div class="kanal-switcher-wrapper">
                    <div id="kanalSwitcher" class="kanal-switcher">
                        <button class="kanal-option active" data-kanal="1">Kanal 1</button>
                        <button class="kanal-option" data-kanal="2">Kanal 2</button>
                    </div>
                </div>

                <div id="kanalHint" style="text-align:center; font-size:12px; color:var(--text-muted); margin-bottom:15px;"></div>

                <div id="slotList" class="slot-list"></div>
                <button id="addSlotBtn" class="btn-outline" style="width:100%; margin-top:15px; justify-content:center;">+ Slot hinzufügen</button>
            </section>

            <section class="card library-card">
                <div class="section-header">
                    <div class="section-title">Operation Library</div>
                    <button id="addOpButton" class="btn-primary">+ Neu</button>
                </div>
                <div id="libraryFilters" class="library-filters"></div>
                <div id="libraryList" class="library-list"></div>
            </section>
        </main>

        <section class="card plan-card">
            <div class="section-header">
                <div class="section-title">Synchronisationsplan</div>
                <div class="section-actions"></div>
            </div>
            <div class="plan-table-wrapper">
                <table id="planTable" class="plan-table"></table>
            </div>
        </section>
    </div>

    <div id="modalOverlay" class="modal-overlay">
        <div class="modal-dialog">
            <div class="section-header">
                <div id="modalTitle" class="section-title"></div>
                <button id="modalCloseButton" class="btn-outline" style="padding:4px 8px;">×</button>
            </div>
            <div id="modalDescription" style="font-size:12px; color:var(--text-muted); margin-bottom:15px;"></div>
            <div id="modalBody"></div>
            <div id="modalFooter" style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;"></div>
        </div>
    </div>

    <svg width="0" height="0" style="position:absolute;">
        <symbol id="icon-trash" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4l1-2zm1 6h2v10h-2V9zm4 0h2v10h-2V9zM6 9h2v10H6V9z"/></symbol>
    </svg>

    <script src="./app.js" defer></script>
</body>
</html>
