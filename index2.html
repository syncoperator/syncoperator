<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS CORE</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto;
background:#0f1115;
color:#fff;
}
.view{display:none;height:100vh;flex-direction:column}
.view.active{display:flex}

.nav{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px;
background:#151922;
border-bottom:1px solid #222;
font-weight:700;
}

.btn{
background:#2d74ff;
border:none;
color:#fff;
padding:10px 16px;
border-radius:12px;
font-weight:700;
}

.list{
flex:1;
overflow:auto;
padding:15px;
}

.card{
background:#1b2030;
padding:15px;
border-radius:16px;
margin-bottom:12px;
cursor:pointer;
}

.card small{opacity:.5}

.overlay{
position:fixed;
inset:0;
background:#000a;
display:none;
align-items:center;
justify-content:center;
z-index:10;
}

.modal{
background:#141824;
width:100%;
max-width:420px;
border-radius:20px;
padding:20px;
animation:pop .2s ease;
}

@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

input,textarea,select{
width:100%;
padding:14px;
margin-bottom:12px;
background:#0f1320;
border:1px solid #222;
color:#fff;
border-radius:12px;
font-size:16px;
}

.stepTitle{
font-size:20px;
margin-bottom:15px;
font-weight:800;
}

.tool{
background:#1a1f2d;
padding:14px;
border-radius:14px;
margin-bottom:10px;
cursor:grab;
}

.bar{
display:flex;
gap:10px;
margin-bottom:12px;
}

.bar button{flex:1}

.badge{
display:inline-block;
background:#000;
padding:2px 8px;
border-radius:6px;
font-size:10px;
margin-bottom:6px;
}
</style>
</head>

<body>

<!-- HOME -->
<div id="home" class="view active">
<div class="nav">
<div>QS CORE</div>
<button class="btn" onclick="openProjectModal()">NEU</button>
</div>
<div id="projectList" class="list"></div>
</div>

<!-- PROJECT -->
<div id="project" class="view">
<div class="nav">
<button onclick="goHome()">←</button>
<div id="projectTitle"></div>
<div>
<button onclick="exportJSON()">JSON</button>
<button onclick="printPDF()">PDF</button>
</div>
</div>

<div class="list">
<div class="bar">
<button class="btn" onclick="wizardStart()">+ Werkzeug</button>
<button class="btn" onclick="importJSON()">Import</button>
</div>
<div id="toolList"></div>
</div>
</div>

<!-- PROJECT MODAL -->
<div id="projModal" class="overlay">
<div class="modal">
<div class="stepTitle">Projekt</div>
<input id="pnum" placeholder="Nummer">
<input id="pname" placeholder="Name">
<button class="btn" onclick="saveProject()">Speichern</button>
</div>
</div>

<!-- WIZARD -->
<div id="wiz" class="overlay">
<div class="modal" id="wizBox"></div>
</div>

<script>

let db=JSON.parse(localStorage.qs||"[]")
let cur=null
let step=0
let tool={}

function saveDB(){localStorage.qs=JSON.stringify(db)}

function goHome(){
cur=null
show("home")
renderProjects()
}

function show(id){
document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"))
document.getElementById(id).classList.add("active")
}

function renderProjects(){
projectList.innerHTML=db.map((p,i)=>`
<div class=card onclick="openProject(${i})">
<small>${p.name}</small>
<div>${p.num}</div>
</div>`).join("")
}

function openProject(i){
cur=i
projectTitle.innerText=db[i].num
show("project")
renderTools()
}

function openProjectModal(){projModal.style.display="flex"}

function saveProject(){
db.push({
num:pnum.value,
name:pname.value,
tools:[]
})
saveDB()
projModal.style.display="none"
renderProjects()
}

function renderTools(){
let list=db[cur].tools
toolList.innerHTML=list.map((t,i)=>`
<div class=tool draggable=true
ondragstart="drag=${i}"
ondragover="event.preventDefault()"
ondrop="drop(${i})"
onclick="editTool(${i})">

${t.rev?`<div class=badge>REV START</div>`:""}
<b>${t.id}</b> ${t.name}
<br><small>${t.loc}</small>

</div>`).join("")
}

let drag=null
function drop(i){
let arr=db[cur].tools
let x=arr.splice(drag,1)[0]
arr.splice(i,0,x)
saveDB()
renderTools()
}

function wizardStart(){
step=0
tool={}
wiz.style.display="flex"
nextStep()
}

function nextStep(){

const steps=[

()=>`
<div class=stepTitle>ID</div>
<input id=s>
<button class=btn onclick="tool.id=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Name</div>
<input id=s>
<button class=btn onclick="tool.name=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Typ</div>
<select id=s>
<option>Standard</option>
<option>Sonder</option>
</select>
<button class=btn onclick="tool.type=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Fach</div>
<select id=s>
${"ABCDEFG".split("").map(x=>`<option>${x}</option>`).join("")}
</select>
<button class=btn onclick="tool.fach=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Slot</div>
<input id=s type=number>
<button class=btn onclick="tool.slot=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Spannzange D</div>
<input id=s type=number>
<button class=btn onclick="tool.sp=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Reduzierhülse D</div>
<input id=s type=number>
<button class=btn onclick="tool.red=s.value;nextStep()">Weiter</button>
`,

()=>`
<div class=stepTitle>Revolver Start?</div>
<select id=s>
<option>Nein</option>
<option>Ja</option>
</select>
<button class=btn onclick="finishTool(s.value)">Fertig</button>
`
]

wizBox.innerHTML=steps[step++]()
}

function finishTool(v){
tool.rev=v=="Ja"
tool.loc=`Fach ${tool.fach}${tool.slot} | SZ D${tool.sp} | RH D${tool.red}`
db[cur].tools.push(tool)
saveDB()
wiz.style.display="none"
renderTools()
}

function editTool(i){
let t=db[cur].tools[i]
wizardStart()
tool=t
step=1
}

function exportJSON(){
let data=JSON.stringify(db,null,2)
navigator.clipboard.writeText(data)
alert("JSON kopiert")
}

function importJSON(){
let txt=prompt("JSON einfügen")
if(!txt)return
db=JSON.parse(txt)
saveDB()
renderProjects()
}

function printPDF(){
window.print()
}

renderProjects()

</script>
</body>
</html>
