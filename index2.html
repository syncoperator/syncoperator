<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Builder</title>

<style>
body{margin:0;background:#f2f4f8;font-family:-apple-system}
.wrap{max-width:650px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:18px;margin-bottom:15px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:14px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:600}
.tool{border:1px solid #e5e5e5;border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;gap:6px}.row>*{flex:1}
.title{font-weight:700;margin-bottom:5px}
.json{background:#0f172a;color:#e2e8f0;padding:15px;border-radius:14px;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<div class="title">Teil</div>
<input id="num" placeholder="Nummer">
<input id="name" placeholder="Name">
<input id="lzf" placeholder="LZF">
<input id="sag" placeholder="SAG">
<div class="row">
<input id="stt" placeholder="STT">
<input id="stn" placeholder="STN">
</div>
<input id="mat" placeholder="Material">
<div class="row">
<input id="abs" placeholder="Abstechmaß">
<input id="grf" placeholder="Greifer">
</div>
</div>

<div class="card">
<div class="title">Tools einfügen</div>
<textarea id="input" rows="6" placeholder="T0101 TOOLNAME G54"></textarea>
<button onclick="parseTools()">Tools erzeugen</button>
</div>

<div id="tools"></div>

<div class="card">
<button onclick="exportJSON()">JSON kopieren</button>
</div>

<div id="out" class="json"></div>

</div>

<script>

let tools=[]

function parseTools(){
tools=[]
let lines=document.getElementById("input").value.split("\n")

lines.forEach(line=>{
let txt=line.trim()
if(!txt) return

let parts=txt.split(" ")
let id=parts.shift()
let nm=parts.join(" ")

tools.push({
id:id,
nm:nm,
dia:"",
fach:"",
spann:"",
red:"",
rev:false,
sonder:false
})
})

renderTools()
}

function renderTools(){
const container=document.getElementById("tools")
container.innerHTML=""

tools.forEach((t,i)=>{

let card=document.createElement("div")
card.className="tool"

card.innerHTML=`
<div class="title">${t.id} — ${t.nm}</div>

<input placeholder="Dia" value="${t.dia}" onchange="tools[${i}].dia=this.value">

<div class="row">
<select onchange="tools[${i}].fach=this.value">
<option value="">Fach</option>
${opt(t.fach,"B1")}
${opt(t.fach,"B3")}
${opt(t.fach,"B4")}
${opt(t.fach,"B6")}
${opt(t.fach,"B8")}
${opt(t.fach,"D")}
</select>

<select onchange="tools[${i}].spann=this.value">
<option value="">Spann</option>
${opt(t.spann,"D2")}
${opt(t.spann,"D3-4")}
${opt(t.spann,"D6")}
${opt(t.spann,"D10")}
${opt(t.spann,"D12")}
${opt(t.spann,"D16")}
</select>
</div>

<select onchange="tools[${i}].red=this.value">
<option value="">Reduzierhülse</option>
${opt(t.red,"D10")}
${opt(t.red,"D14")}
${opt(t.red,"D16")}
${opt(t.red,"D18")}
${opt(t.red,"D20")}
</select>

<div class="row">
<label><input type="checkbox" ${t.rev?"checked":""} onchange="setRev(${i},this.checked)"> Rev</label>
<label><input type="checkbox" ${t.sonder?"checked":""} onchange="tools[${i}].sonder=this.checked"> Sonder</label>
</div>
`

container.appendChild(card)
})
}

function opt(current,val){
return `<option value="${val}" ${current===val?"selected":""}>${val}</option>`
}

function setRev(index,val){
for(let i=index;i<tools.length;i++){
tools[i].rev=val
}
renderTools()
}

function buildBem(t){
let arr=[]
if(t.fach) arr.push("FACH "+t.fach)
if(t.red) arr.push("REDUZIERHUELSE "+t.red)
if(t.spann) arr.push("SPANNZANGE "+t.spann)
return arr.join(" | ")
}

function exportJSON(){

let result=[{
num:num.value,
name:name.value,
lzf:lzf.value,
sag:sag.value,
stt:stt.value,
stn:stn.value,
mat:mat.value,
abs:abs.value,
grf:grf.value,
tools:tools.map(t=>({
id:t.id,
nm:t.nm,
dia:t.dia,
bem:buildBem(t),
rev:t.rev,
isSonder:t.sonder
}))
}]

let json=JSON.stringify(result,null,2)
document.getElementById("out").textContent=json
navigator.clipboard.writeText(json)
}

</script>
</body>
</html>
