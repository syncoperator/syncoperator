<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS PRO</title>

<style>
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#f4f6fb;
color:#111;
}

.nav{
height:60px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 18px;
background:#fff;
border-bottom:1px solid #e3e6ef;
font-weight:700;
}

.btn{
background:#2b6cff;
color:#fff;
border:none;
padding:10px 16px;
border-radius:12px;
font-weight:700;
}

.list{
padding:18px;
}

.card{
background:#fff;
padding:16px;
border-radius:16px;
margin-bottom:12px;
box-shadow:0 4px 12px rgba(0,0,0,.06);
}

.tool{
background:#fff;
padding:14px;
border-radius:14px;
margin-bottom:10px;
box-shadow:0 2px 8px rgba(0,0,0,.05);
cursor:pointer;
}

.small{font-size:12px;color:#666}

.overlay{
position:fixed;
inset:0;
background:#0005;
display:none;
align-items:flex-end;
z-index:20;
}

.sheet{
background:#fff;
width:100%;
border-radius:22px 22px 0 0;
padding:20px;
max-height:85vh;
overflow:auto;
}

input,select{
width:100%;
padding:14px;
margin-bottom:12px;
border-radius:12px;
border:1px solid #e2e6f0;
font-size:16px;
}

.title{
font-weight:800;
font-size:18px;
margin-bottom:10px;
}

.bar{
display:flex;
gap:10px;
margin-bottom:12px;
}

.bar button{flex:1}

.dragging{opacity:.4}
</style>
</head>
<body>

<div class="nav">
<div>QS PRO</div>
<button class="btn" onclick="openProjectSheet()">NEU</button>
</div>

<div id="projects" class="list"></div>

<div id="toolsView" style="display:none">
<div class="nav">
<button onclick="back()">←</button>
<div id="ptitle"></div>
<div>
<button onclick="exportJSON()">JSON</button>
<button onclick="printPDF()">PDF</button>
</div>
</div>

<div class="list">
<div class="bar">
<button class="btn" onclick="startWizard()">+ Werkzeug</button>
<button class="btn" onclick="importJSON()">Import</button>
</div>
<div id="tools"></div>
</div>
</div>

<div id="sheet" class="overlay">
<div class="sheet" id="sheetContent"></div>
</div>

<script>
let db=JSON.parse(localStorage.qspro||"[]")
let cur=null
let editIndex=null

function save(){localStorage.qspro=JSON.stringify(db)}

function renderProjects(){
projects.innerHTML=db.map((p,i)=>`
<div class=card onclick="openProject(${i})">
<b>${p.num}</b><br>
<span class=small>${p.name}</span>
</div>`).join("")
}

function openProject(i){
cur=i
toolsView.style.display="block"
projects.style.display="none"
ptitle.innerText=db[i].num
renderTools()
}

function back(){
toolsView.style.display="none"
projects.style.display="block"
}

function renderTools(){
tools.innerHTML=db[cur].tools.map((t,i)=>`
<div class=tool draggable=true
ondragstart="drag=${i};event.target.classList.add('dragging')"
ondragend="event.target.classList.remove('dragging')"
ondragover="event.preventDefault()"
ondrop="drop(${i})"
onclick="editTool(${i})">

<b>${t.id}</b> ${t.name}
<div class=small>${t.loc}</div>

</div>`).join("")
}

let drag=null
function drop(i){
let arr=db[cur].tools
let x=arr.splice(drag,1)[0]
arr.splice(i,0,x)
save()
renderTools()
}

function openSheet(html){
sheet.style.display="flex"
sheetContent.innerHTML=html
}

function closeSheet(){sheet.style.display="none"}

function openProjectSheet(){
openSheet(`
<div class=title>Projekt</div>
<input id=n placeholder="Nummer">
<input id=nm placeholder="Name">
<button class=btn onclick="createProject()">Speichern</button>
`)
}

function createProject(){
db.push({num:n.value,name:nm.value,tools:[]})
save()
closeSheet()
renderProjects()
}

function startWizard(){
let t={}
let step=0

function next(){
const steps=[

()=>`
<div class=title>ID</div>
<input id=v>
<button class=btn onclick="t.id=v.value;next()">Weiter</button>`,

()=>`
<div class=title>Name</div>
<input id=v>
<button class=btn onclick="t.name=v.value;next()">Weiter</button>`,

()=>`
<div class=title>Fach</div>
<select id=v>${"ABCDEFG".split("").map(x=>`<option>${x}</option>`).join("")}</select>
<button class=btn onclick="t.f=v.value;next()">Weiter</button>`,

()=>`
<div class=title>Slot</div>
<input id=v type=number>
<button class=btn onclick="t.s=v.value;next()">Weiter</button>`,

()=>`
<div class=title>Spannzange D</div>
<input id=v type=number>
<button class=btn onclick="t.sp=v.value;next()">Weiter</button>`,

()=>`
<div class=title>Reduzierhülse D</div>
<input id=v type=number>
<button class=btn onclick="finish(v.value)">Fertig</button>`
]

sheetContent.innerHTML=steps[step++]()
}

function finish(r){
t.loc=`Fach ${t.f}${t.s} | SZ D${t.sp} | RH D${r}`
db[cur].tools.push(t)
save()
closeSheet()
renderTools()
}

openSheet("")
next()
}

function editTool(i){
editIndex=i
let t=db[cur].tools[i]
openSheet(`
<div class=title>Werkzeug</div>
<input id=id value="${t.id}">
<input id=name value="${t.name}">
<input id=loc value="${t.loc}">
<div class=bar>
<button class=btn onclick="saveEdit()">Speichern</button>
<button class=btn style="background:#ff3b3b" onclick="del()">Löschen</button>
</div>
`)
}

function saveEdit(){
let t=db[cur].tools[editIndex]
t.id=id.value
t.name=name.value
t.loc=loc.value
save()
closeSheet()
renderTools()
}

function del(){
db[cur].tools.splice(editIndex,1)
save()
closeSheet()
renderTools()
}

function exportJSON(){
let blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"})
let a=document.createElement("a")
a.href=URL.createObjectURL(blob)
a.download="tools.json"
a.click()
}

function importJSON(){
openSheet(`
<div class=title>JSON Import</div>
<textarea id=imp style="width:100%;height:200px"></textarea>
<button class=btn onclick="loadJSON()">Import</button>
`)
}

function loadJSON(){
db=JSON.parse(imp.value)
save()
closeSheet()
renderProjects()
}

function printPDF(){
window.print()
}

renderProjects()
</script>
</body>
</html>
