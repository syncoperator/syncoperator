<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QS TOOL SYSTEM</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f2f7}
.top{padding:15px;background:#fff;font-weight:700}
.btn{background:#007aff;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:700}
.list{padding:15px}
.card{background:#fff;padding:15px;border-radius:14px;margin-bottom:10px}
.small{font-size:12px;color:#888}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center}
.box{background:#fff;padding:20px;border-radius:16px;width:90%;max-width:400px}
select,input{width:100%;padding:10px;margin-top:6px;margin-bottom:12px;border-radius:8px;border:1px solid #ddd}
</style>
</head>
<body>

<div class="top">
QS TOOL SYSTEM
<button class="btn" onclick="showImport()">Import</button>
<button class="btn" onclick="exportJSON()">JSON</button>
<button class="btn" onclick="window.print()">PDF</button>
</div>

<div class="list" id="list"></div>

<!-- IMPORT -->
<div class="modal" id="imp">
<div class="box">
<textarea id="impText" rows="8" style="width:100%"></textarea>
<button class="btn" onclick="parse()">Importieren</button>
</div>
</div>

<!-- WIZARD -->
<div class="modal" id="wiz">
<div class="box">

<div id="step1">
<b>Typ wählen</b>
<button class="btn" onclick="setType(false)">Standard</button>
<button class="btn" onclick="setType(true)">Sonder</button>
</div>

<div id="step2" style="display:none">
<b>Fach wählen</b>
<select id="fach"></select>
<button class="btn" onclick="next(3)">Weiter</button>
</div>

<div id="step3" style="display:none">
<b>Spannzange</b>
<input id="spann">
<button class="btn" onclick="next(4)">Weiter</button>
</div>

<div id="step4" style="display:none">
<b>Reduzierhülse</b>
<input id="hulse">
<button class="btn" onclick="saveTool()">Speichern</button>
</div>

</div>
</div>

<script>
let tools=[]
let current=null

function showImport(){
imp.style.display="flex"
}

function parse(){
let rows=impText.value.split("\n").filter(x=>x.trim())
rows.forEach(r=>{
let id=r.split(" ")[0]
let name=r.replace(id,"").trim()
tools.push({id,nm:name,bem:"",rev:false,isSonder:false})
})
imp.style.display="none"
render()
}

function render(){
list.innerHTML=""
tools.forEach((t,i)=>{
let d=document.createElement("div")
d.className="card"
d.innerHTML=`
<b>${t.id}</b><br>
${t.nm}
<div class="small">${t.bem||""}</div>
<button onclick="edit(${i})">edit</button>
<button onclick="rev(${i})">rev</button>
`
list.appendChild(d)
})
}

function edit(i){
current=i
wiz.style.display="flex"
step1.style.display="block"
step2.style.display="none"
step3.style.display="none"
step4.style.display="none"
}

function setType(v){
tools[current].isSonder=v
next(2)
}

function next(n){
document.querySelectorAll("#wiz div").forEach(x=>x.style.display="none")
document.getElementById("step"+n).style.display="block"
}

function saveTool(){
let f=fach.value
let s=spann.value
let h=hulse.value

let arr=[]
if(f)arr.push("FACH "+f)
if(s)arr.push("SPANNZANGE "+s)
if(h)arr.push("REDUZIERHUELSE "+h)

tools[current].bem=arr.join(" | ")
wiz.style.display="none"
render()
}

function rev(i){
tools[i].rev=!tools[i].rev
render()
}

function exportJSON(){
alert(JSON.stringify(tools))
}

/* Fach generator */
let letters="ABCDEFG"
letters.split("").forEach(l=>{
for(let i=1;i<=10;i++){
let o=document.createElement("option")
o.value=l+i
o.text=l+i
fach.appendChild(o)
}
})
</script>
</body>
</html>
