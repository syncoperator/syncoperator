<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SyncOperator</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f4f8}
.header{padding:25px;font-size:28px;font-weight:700}
.container{max-width:520px;margin:auto;padding:15px}
.card{background:white;padding:18px;border-radius:20px;margin-bottom:18px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #e2e6ef;margin:7px 0;font-size:15px}
button{width:100%;padding:14px;border:none;border-radius:14px;background:#111;color:white;font-weight:600;margin-top:10px}
.output{background:#0f172a;color:#e2e8f0;padding:15px;border-radius:16px;font-family:monospace;white-space:pre-wrap;max-height:300px;overflow:auto}
.row{display:flex;gap:10px}.row>*{flex:1}
</style>
</head>
<body>

<div class="header">SyncOperator</div>
<div class="container">

<div class="card">
<label>Zeichnungsnummer</label>
<input id="drawing">

<button onclick="saveProject()">Projekt speichern</button>
<button onclick="loadProject()">Projekt laden</button>
<button onclick="deleteProject()">Projekt löschen</button>
</div>

<div class="card">

<input id="id" placeholder="Tool ID">
<input id="name" placeholder="Name">
<input id="dia" placeholder="Durchmesser">

<select id="offset">
<option>G54</option>
<option>G55</option>
</select>

<div class="row">
<select id="fach">
<option value="">Fach</option>
<option>B1</option><option>B3</option><option>B4</option>
<option>B6</option><option>B8</option>
<option>C2</option><option>C9</option>
<option>D</option>
</select>

<select id="spann">
<option value="">Spannzange</option>
<option>D2</option>
<option>D3-4</option>
<option>D6</option>
<option>D10</option>
<option>D12</option>
<option>D16</option>
</select>
</div>

<select id="red">
<option value="">Reduzierhülse</option>
<option>D10</option>
<option>D14</option>
<option>D16</option>
<option>D18</option>
<option>D20</option>
</select>

<div class="row">
<select id="sonder">
<option value="false">Sonder false</option>
<option value="true">Sonder true</option>
</select>

<select id="rev">
<option value="false">Rev false</option>
<option value="true">Rev true</option>
</select>
</div>

<button onclick="addTool()">Tool hinzufügen</button>

</div>

<div class="card">
<button onclick="copyJSON()">JSON kopieren</button>
</div>

<div class="output" id="json"></div>

</div>

<script>

let tools=[]

function addTool(){

let bem=[]
if(fach.value) bem.push("FACH "+fach.value)
if(spann.value) bem.push("SPANNZANGE "+spann.value)
if(red.value) bem.push("REDUZIERHUELSE "+red.value)

tools.push({
id:id.value,
nm:name.value+" "+offset.value,
dia:dia.value,
bem:bem.join(" | "),
rev:rev.value==="true",
isSonder:sonder.value==="true"
})

render()
}

function render(){
json.textContent=JSON.stringify(tools,null,2)
}

function saveProject(){
if(!drawing.value) return alert("Zeichnungsnummer fehlt")
localStorage.setItem("job_"+drawing.value,JSON.stringify(tools))
alert("Gespeichert")
}

function loadProject(){
if(!drawing.value) return
let data=localStorage.getItem("job_"+drawing.value)
if(!data) return alert("Nicht gefunden")
tools=JSON.parse(data)
render()
}

function deleteProject(){
localStorage.removeItem("job_"+drawing.value)
tools=[]
render()
}

function copyJSON(){
navigator.clipboard.writeText(JSON.stringify(tools,null,2))
}

</script>

</body>
</html>
