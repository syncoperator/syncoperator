<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tool Builder</title>

<style>
body{margin:0;background:#f2f4f8;font-family:-apple-system}
.wrap{max-width:650px;margin:auto;padding:15px}
.card{background:#fff;padding:15px;border-radius:18px;margin-bottom:15px;box-shadow:0 8px 25px rgba(0,0,0,.08)}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border-radius:10px;border:1px solid #ddd;font-size:14px}
button{width:100%;padding:12px;margin-top:10px;border:none;border-radius:12px;background:#111;color:#fff;font-weight:600}
.tool{border:1px solid #e5e5e5;border-radius:14px;padding:12px;margin-top:12px}
.row{display:flex;gap:6px}.row>*{flex:1}
.title{font-weight:700;margin-bottom:5px}
.json{background:#0f172a;color:#e2e8f0;padding:15px;border-radius:14px;white-space:pre-wrap;font-family:monospace}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<div class="title">Teil</div>
<input id="num" placeholder="Nummer">
<input id="name" placeholder="Name">
<input id="lzf" placeholder="LZF">
<input id="sag" placeholder="SAG">
<div class="row">
<input id="stt" placeholder="STT">
<input id="stn" placeholder="STN">
</div>
<input id="mat" placeholder="Material">
<div class="row">
<input id="abs" placeholder="Abstechmaß">
<input id="grf" placeholder="Greifer">
</div>
</div>

<div class="card">
<div class="title">Tools einfügen</div>
<textarea id="input" rows="6" placeholder="T0101 TOOLNAME G54"></textarea>
<button onclick="parse()">Tools erzeugen</button>
</div>

<div id="tools"></div>

<div class="card">
<button onclick="exportJSON()">JSON kopieren</button>
</div>

<div id="out" class="json"></div>

</div>

<script>
let tools=[]

function parse(){
tools=[]
let lines=input.value.split("\n").filter(x=>x.trim())
lines.forEach(line=>{
let parts=line.trim().split(" ")
let id=parts.shift()
let nm=parts.join(" ")
tools.push({id,nm,dia:"",fach:"",spann:"",red:"",rev:false,sonder:false})
})
render()
}

function render(){
toolsDiv.innerHTML=""
tools.forEach((t,i)=>{
let el=document.createElement("div")
el.className="tool"
el.innerHTML=`
<div class="title">${t.id} — ${t.nm}</div>

<input placeholder="Dia" value="${t.dia}" onchange="tools[${i}].dia=this.value">

<div class="row">
<select onchange="tools[${i}].fach=this.value">
<option value="">Fach</option>
<option ${sel(t.fach,"B1")}>B1</option>
<option ${sel(t.fach,"B3")}>B3</option>
<option ${sel(t.fach,"B4")}>B4</option>
<option ${sel(t.fach,"B6")}>B6</option>
<option ${sel(t.fach,"B8")}>B8</option>
<option ${sel(t.fach,"D")}>D</option>
</select>

<select onchange="tools[${i}].spann=this.value">
<option value="">Spann</option>
<option ${sel(t.spann,"D2")}>D2</option>
<option ${sel(t.spann,"D3-4")}>D3-4</option>
<option ${sel(t.spann,"D6")}>D6</option>
<option ${sel(t.spann,"D10")}>D10</option>
<option ${sel(t.spann,"D12")}>D12</option>
<option ${sel(t.spann,"D16")}>D16</option>
</select>
</div>

<select onchange="tools[${i}].red=this.value">
<option value="">Reduzierhülse</option>
<option ${sel(t.red,"D10")}>D10</option>
<option ${sel(t.red,"D14")}>D14</option>
<option ${sel(t.red,"D16")}>D16</option>
<option ${sel(t.red,"D18")}>D18</option>
<option ${sel(t.red,"D20")}>D20</option>
</select>

<div class="row">
<label><input type="checkbox" ${t.rev?"checked":""}
onchange="setRev(${i},this.checked)"> Rev</label>

<label><input type="checkbox" ${t.sonder?"checked":""}
onchange="tools[${i}].sonder=this.checked"> Sonder</label>
</div>
`
toolsDiv.appendChild(el)
})
}

function sel(a,b){return a===b?"selected":""}

function setRev(index,val){
for(let i=index;i<tools.length;i++){
tools[i].rev=val
}
render()
}

function buildBem(t){
let arr=[]
if(t.fach) arr.push("FACH "+t.fach)
if(t.red) arr.push("REDUZIERHUELSE "+t.red)
if(t.spann) arr.push("SPANNZANGE "+t.spann)
return arr.join(" | ")
}

function exportJSON(){

let obj=[{
num:num.value,
name:name.value,
lzf:lzf.value,
sag:sag.value,
stt:stt.value,
stn:stn.value,
mat:mat.value,
abs:abs.value,
grf:grf.value,
tools:tools.map(t=>({
id:t.id,
nm:t.nm,
dia:t.dia,
bem:buildBem(t),
rev:t.rev,
isSonder:t.sonder
}))
}]

let txt=JSON.stringify(obj,null,2)
out.textContent=txt
navigator.clipboard.writeText(txt)
}
</script>
</body>
</html>
