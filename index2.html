<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QS TOOL</title>

<style>
body{margin:0;font-family:-apple-system;background:#f2f2f7}
header{height:60px;background:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-weight:700;border-bottom:1px solid #ddd}
.main{padding:16px}
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px}
.btn{background:#007aff;color:#fff;padding:14px;border-radius:14px;text-align:center;font-weight:700;margin-bottom:12px}
.btn.gray{background:#e5e5ea;color:#000}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;max-height:92%;overflow:auto}
.head{padding:16px;text-align:center;font-weight:800;border-bottom:1px solid #eee}
.pad{padding:16px}
input,textarea{width:100%;padding:14px;border:none;border-radius:12px;background:#f2f2f7;margin-bottom:12px;font-size:16px}
.sec{background:#f2f2f7;border-radius:14px;margin-bottom:10px}
.sec h4{margin:0;padding:14px;font-size:14px}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:12px}
.sel{background:#fff;padding:12px;border-radius:10px;text-align:center;font-weight:700;border:2px solid transparent}
.sel.active{border:2px solid #007aff;color:#007aff}
.tool{background:#fff;border-radius:16px;padding:14px;margin-bottom:10px}
.small{font-size:12px;color:#666}
</style>
</head>
<body>

<header>
<span>PROJECTS</span>
<button onclick="openProj()">＋</button>
</header>

<div class="main" id="app"></div>

<!-- PROJECT -->
<div class="overlay" id="projModal">
<div class="sheet">
<div class="head">Projekt</div>
<div class="pad">
<input id="pname" placeholder="Name">
<input id="pnum" placeholder="Nummer">
<div class="btn" onclick="createProject()">Speichern</div>
<div class="btn gray" onclick="projModal.style.display='none'">Abbrechen</div>
</div>
</div>
</div>

<!-- TOOL -->
<div class="overlay" id="toolModal">
<div class="sheet">
<div class="head">Tool</div>
<div class="pad">

<input id="tid" placeholder="T0101">
<input id="tnm" placeholder="Name">

<div class="sec"><h4>Typ</h4><div id="type" class="grid"></div></div>
<div class="sec"><h4>Fach</h4><div id="fach" class="grid"></div></div>
<div class="sec"><h4>Nummer</h4><div id="num" class="grid"></div></div>
<div class="sec"><h4>Spannzange</h4><div id="spann" class="grid"></div></div>
<div class="sec"><h4>Reduzier</h4><div id="red" class="grid"></div></div>

<textarea id="tbem" placeholder="Extra"></textarea>

<div class="btn" onclick="saveTool()">Speichern</div>
<div class="btn gray" onclick="closeTool()">Abbrechen</div>

</div>
</div>
</div>

<!-- BULK -->
<div class="overlay" id="bulkModal">
<div class="sheet">
<div class="head">Bulk Import</div>
<div class="pad">
<textarea id="bulkText" placeholder="T0101 BOHRER D10&#10;T0202 FRAESER D6"></textarea>
<div class="btn" onclick="bulkAdd()">Import</div>
<div class="btn gray" onclick="bulkModal.style.display='none'">Cancel</div>
</div>
</div>
</div>

<script>
const KEY="QSFINAL"
let db=JSON.parse(localStorage.getItem(KEY)||"[]")
let cur=null,edit=null

const app=document.getElementById("app")
function save(){localStorage.setItem(KEY,JSON.stringify(db))}

function render(){
app.innerHTML=""
db.forEach((p,i)=>{
app.innerHTML+=`
<div class="card" onclick="openProject(${i})">
<div>${p.name}</div>
<b>${p.num}</b>
</div>`
})
}

function openProj(){projModal.style.display="flex"}

function createProject(){
if(!pname.value||!pnum.value)return
db.push({name:pname.value,num:pnum.value,tools:[]})
save()
projModal.style.display="none"
render()
}

function openProject(i){
cur=i
app.innerHTML=`
<div class="btn" onclick="openTool()">+ Tool</div>
<div class="btn" onclick="bulkModal.style.display='flex'">Bulk Input</div>
<div class="btn gray" onclick="exportJSON()">Export JSON</div>
<div class="btn gray" onclick="printPDF()">PDF</div>
<div id="list"></div>
<div class="btn gray" onclick="render()">← Back</div>`
renderTools()
}

function renderTools(){
const l=document.getElementById("list")
l.innerHTML=""
db[cur].tools.forEach((t,i)=>{
l.innerHTML+=`
<div class="tool" draggable="true" ondragstart="drag(${i})" ondrop="drop(${i})" ondragover="event.preventDefault()" onclick="editTool(${i})">
<div class="small">${t.id}</div>
<b>${t.nm}</b>
<div class="small">${t.bem||""}</div>
</div>`
})
}

let dragIndex=null
function drag(i){dragIndex=i}
function drop(i){
let arr=db[cur].tools
let el=arr.splice(dragIndex,1)[0]
arr.splice(i,0,el)
save();renderTools()
}

function openTool(){edit=null;toolModal.style.display="flex";reset()}
function closeTool(){toolModal.style.display="none"}

function editTool(i){
edit=i;openTool()
let t=db[cur].tools[i]
tid.value=t.id;tnm.value=t.nm;tbem.value=t.bem
}

let type,fach,num,spann,red

function grid(id,arr,cb){
const el=document.getElementById(id)
el.innerHTML=""
arr.forEach(v=>{
let d=document.createElement("div")
d.className="sel"
d.textContent=v
d.onclick=()=>{
[...el.children].forEach(x=>x.classList.remove("active"))
d.classList.add("active")
cb(v)
}
el.appendChild(d)
})
}

function reset(){
grid("type",["STANDARD","SONDER"],v=>type=v)
grid("fach",["A","B","C","D","E","F","G"],v=>fach=v)
grid("num",[...Array(25).keys()].map(x=>x+1),v=>num=v)
grid("spann",[...Array(25).keys()].map(x=>"D"+(x+1)),v=>spann=v)
grid("red",[...Array(25).keys()].map(x=>"D"+(x+1)),v=>red=v)
tid.value="";tnm.value="";tbem.value=""
}

function saveTool(){
let bem=[]
if(fach&&num)bem.push("FACH "+fach+num)
if(spann)bem.push("SPANNZANGE "+spann)
if(red)bem.push("REDUZIER "+red)
if(tbem.value)bem.push(tbem.value)

let t={id:tid.value.toUpperCase(),nm:tnm.value.toUpperCase(),bem:bem.join(" | ")}

if(edit===null)db[cur].tools.push(t)
else db[cur].tools[edit]=t

save()
closeTool()
renderTools()
}

/* PARSER */
function parseLine(line){
let parts=line.trim().split(/\s+/)
if(parts.length<2)return null
return{
id:parts[0],
nm:parts.slice(1).join(" "),
bem:""
}
}

/* BULK */
function bulkAdd(){
let lines=bulkText.value.split("\n")
lines.forEach(l=>{
let t=parseLine(l)
if(t)db[cur].tools.push(t)
})
save()
bulkModal.style.display="none"
renderTools()
}

/* EXPORT */
function exportJSON(){
const data=JSON.stringify(db[cur],null,2)
navigator.clipboard.writeText(data)
alert("JSON copied")
}

/* PDF */
function printPDF(){
let p=db[cur]
let w=window.open()
w.document.write("<pre>"+JSON.stringify(p,null,2)+"</pre>")
w.print()
}

render()
</script>
</body>
</html>
