<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Manual R-Comp</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f5f7; --card: #ffffff; --accent: #ff2d55; --text: #1d1d1f; --border: #d2d2d7; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; padding-bottom: 40px; }
        header { margin-bottom: 20px; border-left: 5px solid var(--accent); padding-left: 15px; }
        header h1 { margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; }
        
        .section { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .label { display: block; font-size: 10px; font-weight: 700; color: #86868b; text-transform: uppercase; margin-bottom: 8px; }
        
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 600; outline: none; box-sizing: border-box; }
        
        .r-warning { background: #fff3f3; border: 1px solid #ffcccc; color: #d32f2f; padding: 10px; border-radius: 8px; font-size: 12px; font-weight: 600; margin-bottom: 15px; text-align: center; }
        
        .code-box { background: #1c1c1e; color: #34c759; padding: 20px; border-radius: 12px; font-family: 'SF Mono', monospace; font-size: 14px; line-height: 1.6; border: 1px solid #333; }
        .hl-z { color: #ff2d55; font-weight: bold; }
        .hl-a { color: #5856d6; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Nakamura R-Comp (No G41)</h1></header>

    <div class="section">
        <label class="label">Wendeplattenradius (R)</label>
        <input type="number" id="w_rad" value="0.4" step="0.2" oninput="calc()">
        
        <div class="input-group" style="margin-top:15px">
            <div>
                <label class="label">Fase / Konus Länge</label>
                <input type="number" id="f_len" value="1.5" oninput="calc()">
            </div>
            <div>
                <label class="label">Winkel (A)</label>
                <input type="number" id="f_ang" value="45" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="r-warning">
        ACHTUNG: Berechnung OHNE G41/G42 Korrektur!
    </div>

    <div class="section" style="background: #1c1c1e;">
        <label class="label" style="color: #86868b;">Manueller NC-Code (Korrigiert)</label>
        <div id="out" class="code-box">
            </div>
    </div>
</div>

<script>
function calc() {
    const r = parseFloat(document.getElementById('w_rad').value) || 0;
    const fl = parseFloat(document.getElementById('f_len').value) || 0;
    const fa = parseFloat(document.getElementById('f_ang').value) || 0;
    
    // Для фаски 45 градусов без G41:
    // Z-старт должен быть Z(R)
    // Z-конечное = -(Länge + R)
    const zStart = r.toFixed(3);
    const zEnd = (fl + r).toFixed(3);
    const angle = 90 + fa; // Для наружной фаски ,A135

    let html = `G0 X... <span class="hl-z">Z${zStart}</span> (R-Start)<br>`;
    html += `G1 Z0 F0.2<br>`;
    html += `G1 X... <span class="hl-z">Z-${zEnd}</span> <span class="hl-a">,A${angle}</span> F0.1<br>`;
    html += `G1 Z...`;

    document.getElementById('out').innerHTML = html;
}
calc();
</script>
</body>
</html>
