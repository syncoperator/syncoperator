<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Angle Master Compact</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f5f7; --card: #ffffff; --accent-l: #ff3b30; --accent-r: #007aff; --text: #1d1d1f; --border: #d2d2d7; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; overflow: hidden; }
        .container { width: 100%; max-width: 400px; height: 100vh; display: flex; flex-direction: column; }

        /* TABS COMPACT */
        .tabs { display: flex; background: #e5e5ea; padding: 3px; border-radius: 10px; margin-bottom: 8px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 8px; font-weight: 800; font-size: 10px; cursor: pointer; color: #86868b; }
        .tab-btn.active.links { background: #fff; color: var(--accent-l); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-btn.active.rechts { background: #fff; color: var(--accent-r); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* COMPACT SENSOR */
        .sensor-mini { background: #1c1c1e; border-radius: 15px; padding: 12px; display: flex; align-items: center; justify-content: space-around; margin-bottom: 8px; border: 1px solid #333; }
        .visual { position: relative; width: 60px; height: 60px; border: 2px dashed #3a3a3c; border-radius: 50%; }
        .needle { position: absolute; width: 50%; height: 3px; background: #fff; top: calc(50% - 1.5px); left: 50%; transform-origin: left center; border-radius: 2px; }
        .angle-num { color: #fff; font-size: 26px; font-weight: 800; }

        /* COMPACT INPUTS */
        .section { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); }
        .label { display: block; font-size: 9px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 4px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        select, input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-weight: 700; background: #fff; outline: none; box-sizing: border-box; }

        /* RESULT AREA - NO SCROLL */
        .output { background: #000; border-radius: 15px; padding: 12px; border: 1px solid #333; flex-grow: 1; margin-bottom: 10px; display: flex; flex-direction: column; justify-content: center; }
        .code { color: #34c759; font-family: monospace; font-size: 13px; line-height: 1.4; }
        .hl-z { color: #ff9500; } .hl-a { color: #5856d6; } .hl-r { color: #ff2d55; }
    </style>
</head>
<body id="b">

<div class="container">
    <div class="tabs">
        <button id="tl" class="tab-btn active links" onclick="setSide('links')">SP 1 (LINKS)</button>
        <button id="tr" class="tab-btn rechts" onclick="setSide('rechts')">SP 2 (RECHTS)</button>
    </div>

    <div class="sensor-mini">
        <div class="visual"><div id="ndl" class="needle"></div></div>
        <div id="disp" class="angle-num">135°</div>
        <div style="font-size: 9px; color: #636366; font-weight: 800; width: 60px;">FANUC VECTOR</div>
    </div>

    <div class="section">
        <label class="label">X-Richtung</label>
        <select id="dx" onchange="calc()">
            <option value="up">X+ NACH AUSSEN</option>
            <option value="down">X- NACH INNEN</option>
        </select>
        <div class="grid" style="margin-top: 8px;">
            <div>
                <label class="label">Platten R</label>
                <input type="number" id="pr" value="0.4" step="0.2" oninput="calc()">
            </div>
            <div>
                <label class="label">Wunsch ,R</label>
                <input type="number" id="wr" value="0.9" step="0.1" oninput="calc()">
            </div>
        </div>
        <div class="grid" style="margin-top: 8px;">
            <div>
                <label class="label">Winkel (A)</label>
                <input type="number" id="ar" value="45" oninput="calc()">
            </div>
            <div>
                <label class="label">Ziel Ø (X)</label>
                <input type="number" id="tx" value="20" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="output">
        <div id="out" class="code"></div>
    </div>
</div>

<script>
let side = 'links';
function setSide(s) {
    side = s;
    document.getElementById('tl').classList.toggle('active', s === 'links');
    document.getElementById('tr').classList.toggle('active', s === 'rechts');
    calc();
}

function calc() {
    const p = parseFloat(document.getElementById('pr').value) || 0;
    const w = parseFloat(document.getElementById('wr').value) || 0;
    const a = parseFloat(document.getElementById('ar').value) || 0;
    const x = parseFloat(document.getElementById('tx').value) || 0;
    const dx = document.getElementById('dx').value;
    
    let ang, zS, zD;
    const color = (side === 'links') ? '#ff3b30' : '#007aff';
    document.getElementById('ndl').style.background = `linear-gradient(90deg, transparent, ${color})`;

    if (side === 'links') {
        zD = "-";
        ang = (dx === 'up') ? 90 + a : 270 - a;
        zS = p.toFixed(3);
    } else {
        zD = "";
        ang = (dx === 'up') ? 90 - a : 270 + a;
        zStart = "-" + p.toFixed(3);
        zS = "-" + p.toFixed(3);
    }

    document.getElementById('ndl').style.transform = `rotate(-${ang}deg)`;
    document.getElementById('disp').innerText = ang + "°";

    const fR = (w + p).toFixed(3);
    let nc = `G0 X... <span class="hl-z">Z${zS}</span>\n`;
    nc += `G1 Z0.0 F0.2\n`;
    nc += `G1 X${x.toFixed(3)} <span class="hl-a">,A${ang}</span> <span class="hl-r">,R${fR}</span> F0.1\n`;
    nc += `G1 Z${zD}...`;
    document.getElementById('out').innerHTML = nc;
}
calc();
</script>
</body>
</html>
