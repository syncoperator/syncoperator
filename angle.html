<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Trigo-Rechner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f5f7; --card: #ffffff; --accent: #5856d6; --text: #1d1d1f; --border: #d2d2d7; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 500px; }
        header { margin-bottom: 20px; border-left: 5px solid var(--accent); padding-left: 15px; }
        header h1 { margin: 0; font-size: 22px; font-weight: 800; text-transform: uppercase; }
        .section { background: var(--card); border-radius: 14px; padding: 18px; margin-bottom: 12px; border: 1px solid var(--border); }
        .label { display: block; font-size: 10px; font-weight: 700; color: #86868b; text-transform: uppercase; margin-bottom: 8px; }
        input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 600; outline: none; box-sizing: border-box; }
        .result-box { background: #f2f2f7; border-radius: 12px; padding: 20px; text-align: center; border: 1.5px solid var(--accent); }
        .res-val { font-size: 28px; font-weight: 800; color: var(--accent); }
    </style>
</head>
<body>
<div class="container">
    <header><h1>Trigo-Rechner</h1></header>
    <div class="section">
        <label class="label">Start Ø (X)</label>
        <input type="number" id="start_x" value="20" oninput="trig()">
        <div style="margin-top:15px">
            <label class="label">Winkel (Grad °)</label>
            <input type="number" id="angle" value="45" oninput="trig()">
        </div>
        <div style="margin-top:15px">
            <label class="label">Länge (Z-Weg)</label>
            <input type="number" id="len_z" value="2" oninput="trig()">
        </div>
    </div>
    <div class="result-box">
        <label class="label" style="color: var(--accent)">End Ø (X) Ergebnis</label>
        <div id="res_x" class="res-val">24.00</div>
        <div style="margin-top:10px; font-size: 13px; font-weight: 600; color: #1d1d1f">
            Programmzeile: <br>
            <span id="code_out" style="font-family: monospace; background: #fff; padding: 4px 8px; border-radius: 4px;">G1 X24.0 Z-2.0</span>
        </div>
    </div>
</div>
<script>
function trig() {
    const sx = parseFloat(document.getElementById('start_x').value) || 0;
    const ang = parseFloat(document.getElementById('angle').value) || 0;
    const z = parseFloat(document.getElementById('len_z').value) || 0;
    
    // X_end = X_start + (2 * Z * tan(Winkel))
    const rad = ang * (Math.PI / 180);
    const ex = sx + (2 * z * Math.tan(rad));
    
    document.getElementById('res_x').innerText = ex.toFixed(3);
    document.getElementById('code_out').innerText = `G1 X${ex.toFixed(3)} Z-${z.toFixed(2)}`;
}
trig();
</script>
</body>
</html>
