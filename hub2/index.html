<style>
:root{
  --bg0:#101114; --bg1:#232428; --ink:#F4F5F7; --mute:rgba(255,255,255,.5); --dim:rgba(255,255,255,.3);
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14); --track:rgba(255,255,255,.08);
  --glass:linear-gradient(150deg,rgba(255,255,255,.065),rgba(255,255,255,.022));
  --sh:0 2px 6px rgba(0,0,0,.26),0 14px 34px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.06);
  --alert:#E8837B; --warn:#E3B65C; --ok:#62C98E;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg0)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:var(--bg0);
  padding:max(14px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));overflow-x:hidden}
.wrap{max-width:820px;margin:0 auto;position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* Hintergrund wie CitiTool */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 18%,var(--bg1) 0%,var(--bg0) 62%)}
.bgfx i{position:absolute;left:50%;top:150px;border-radius:50%;transform:translate(-50%,-50%)}
.bgfx .r1{width:520px;height:520px;border:1px dashed rgba(255,255,255,.06);animation:spin 30s linear infinite}
.bgfx .r2{width:340px;height:340px;border:1px solid rgba(255,255,255,.08);animation:spin 20s linear infinite reverse}
.bgfx .gl{width:300px;height:300px;background:radial-gradient(circle,rgba(255,255,255,.08),transparent 70%);filter:blur(26px);animation:glow 3.6s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:.9}}

.lockup::after{content:'';position:absolute;inset:0;-webkit-mask:inherit;mask:inherit;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.55) 46%,#fff 50%,rgba(255,255,255,.55) 54%,transparent 62%);
  background-size:260% 100%;background-position:170% 0;animation:shine 4.8s ease-in-out 1.4s infinite}
@keyframes logoIn{0%{opacity:0;transform:scale(.86) translateY(12px)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 12px rgba(255,255,255,.16))}50%{filter:drop-shadow(0 0 26px rgba(255,255,255,.42))}}
@keyframes shine{0%{background-position:170% 0}45%,100%{background-position:-80% 0}}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.42em;color:var(--dim);margin-top:10px;padding-left:.42em}
.greet{margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;color:var(--mute);text-transform:uppercase}
.greet b{color:var(--ink);font-weight:600;letter-spacing:.08em}
.ruler{display:block;width:100%;height:12px;margin:16px 0 12px;color:rgba(255,255,255,.16)}

/* Timer */
.tm{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:20px;background:var(--glass);border:1px solid var(--line2);box-shadow:var(--sh);text-align:left;cursor:pointer;transition:transform .12s,border-color .2s}
.tm:active{transform:scale(.985)}
.tm .play{width:44px;height:44px;border-radius:14px;background:#fff;color:#101114;display:grid;place-items:center;flex:none}
.tm .play svg{width:18px;height:18px;margin-left:2px}
.tm .tx{flex:1;min-width:0}
.tm .tx b{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tm .tx small{display:block;margin-top:3px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.tm.run{cursor:default;border-color:rgba(98,201,142,.35)}
.tm .pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);flex:none;margin:0 4px 0 6px;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(98,201,142,.55)}70%{box-shadow:0 0 0 12px rgba(98,201,142,0)}100%{box-shadow:0 0 0 0 rgba(98,201,142,0)}}
.tm.run .tx b{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tm .stop{flex:none;padding:11px 14px;border-radius:13px;background:#fff;color:#101114;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em}
.rz{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 14px;border-radius:14px;border:1px dashed var(--line2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.rz i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;animation:pl 1.6s infinite}
.rz b{color:var(--ink);margin-left:auto;font-weight:600}

/* Abschnitte */
.sec{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.26em;color:var(--dim);text-transform:uppercase;margin:24px 2px 10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec em{order:2;font-style:normal;letter-spacing:.1em;color:var(--dim)}
.sec em+*{order:3}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:740px){.grid{grid-template-columns:1fr 1fr}}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch .ico{width:40px;height:40px;border-radius:12px;background:#fff;color:#101114;display:grid;place-items:center;flex:none}
.ch .ico svg{width:22px;height:22px}
.ch .ct{flex:1;min-width:0}
.ch b{display:block;font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.ch small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-top:4px}
.ch .go{width:34px;height:34px;border-radius:11px;border:1px solid var(--line2);display:grid;place-items:center;flex:none;color:var(--mute)}
.ch .go svg{width:16px;height:16px}
.ch button.go{background:none;cursor:pointer}
.empty{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}

/* Schnell nachbestellen */
.qs{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,auto);grid-auto-columns:calc(50% - 5px);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 6px;scrollbar-width:none}
.qs::-webkit-scrollbar{display:none}
@media(min-width:620px){.qs{grid-auto-columns:200px}}

.q.soon .st s i,.q.low .st s i{background:var(--alert)}

.kpi.hot{border-color:rgba(232,131,123,.5)}.kpi.hot b{color:var(--alert)}
.kpi.wip b{color:var(--warn)}

.td{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.td:first-child{padding-top:2px}.td:last-child{border-bottom:0;padding-bottom:2px}
.td i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}

.td span{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.td span small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:3px}

.big{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;margin:2px 0 4px}

.big small{font-family:var(--mono);font-size:10px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}

.toast button{border:0;background:#101114;color:#fff;padding:8px 12px;border-radius:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;cursor:pointer}
footer{margin-top:24px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;text-align:center}
@media(max-width:370px){.kpi b{font-size:19px}.tm.run .tx b{font-size:24px}}

}

    var open=orders.filter(function(o){return (o.itemIds||[]).some(function(id){var it=items.find(function(i){return i.id===id});return it&&it.status==='gesendet'})});
    // Schnell nachbestellen
    var by={};items.forEach(function(i){if(!i.libId)return;var o=by[i.libId]||(by[i.libId]={last:0,n:0,cart:false,wait:false,sent:[]});o.n++;o.last=Math.max(o.last,i.createdAt||0);if(i.status==='bedarf')o.cart=true;if(i.status==='gesendet')o.wait=true;if(i.sentAt)o.sent.push(new Date(i.sentAt).toDateString())});
    var quick=lib.map(function(t){
      var o=by[t.id]||{last:0,n:0,sent:[]},ds=Array.from(new Set(o.sent)).map(function(s){return new Date(s).getTime()}).sort(function(a,b){return a-b}),p=null,avg=0;
      if(ds.length>=2){avg=(ds[ds.length-1]-ds[0])/(ds.length-1)/DAY;if(avg>=1)p=(now-ds[ds.length-1])/DAY/avg}
      var mn=q(t.min),isLow=typeof t.stock==='number'&&mn>0&&t.stock<=mn,busy=o.cart||o.wait;

  function citi(){
    var db=arr('CITITOOL_2026'), brain=js('CITITOOL_BRAIN_2026',{}); if(!db.length) return null;
    var ps=db.map(function(p,i){return{p:p,i:i}}).filter(function(x){var p=x.p;return p&&((p.oben||[]).length||(p.unten||[]).length||p.num||p.name)});
    var st={neu:0,wip:0,ok:0};ps.forEach(function(x){var s=x.p.status||'neu';st[s]=(st[s]||0)+1});
    var runTm=ps.filter(function(x){return x.p.tmr&&x.p.tmr.start})[0]||null;
    return{ps:ps,st:st,runTm:runTm,lib:(brain.library||[]).length,lastBackup:+ls('CT_LASTBK')||0};
  }
  // ======== MPF VISUAL (Struktur wird erkannt) ========
  function mpf(){
    var keys=['CitiTool_SO_v12_m','CitiTool_SO_v12'],raw='',key='';
    for(var i=0;i<keys.length;i++){raw=ls(keys[i]);if(raw){key=keys[i];break}}
    if(!raw) return null;
    var d; try{d=JSON.parse(raw)}catch(e){return{key:key,size:raw.length,ps:[]}}
    var pick=function(o){if(Array.isArray(o))return o;if(!o||typeof o!=='object')return null;var c=['projects','projekte','list','items','data','plans'];for(var j=0;j<c.length;j++)if(Array.isArray(o[c[j]]))return o[c[j]];return null};
    var ps=pick(d)||(d&&typeof d==='object'&&(d.ops||d.operations||d.tools||d.werkzeuge)?[d]:[]);
    var len=function(o,names){for(var j=0;j<names.length;j++){var v=o&&o[names[j]];if(Array.isArray(v))return v.length;if(v&&typeof v==='object'){var n=0;for(var k in v)if(Array.isArray(v[k]))n+=v[k].length;if(n)return n}}return 0};
    var num=function(v){v=typeof v==='string'?Date.parse(v):+v;return isFinite(v)?v:0};
    ps=ps.filter(function(p){return p&&typeof p==='object'}).map(function(p,i){return{
      i:i,name:p.name||p.titel||p.title||p.teil||p.projekt||'',nr:p.num||p.nr||p.zeichnung||p.drawing||'',
      ops:len(p,['ops','operations','plan','schritte','steps']),
      tools:len(p,['tools','werkzeuge','wkz','toolList','tl']),
      ts:num(p.updated||p.updatedAt||p.changed||p.modified||p.ts||p.date||p.created||0)}});
    ps.sort(function(a,b){return (b.ts-a.ts)||(b.i-a.i)});
    return{key:key,size:raw.length,ps:ps};
  }
