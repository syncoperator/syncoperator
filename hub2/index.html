*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--sans);background:var(--bg);
  padding:max(12px,env(safe-area-inset-top)) 16px max(30px,env(safe-area-inset-bottom));overflow-x:hidden;transition:background .3s}
.wrap{max-width:860px;margin:0 auto;position:relative;z-index:1}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}

/* Hintergrund (CitiTool-Startbild) */
.bgfx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(circle at 50% 14%,var(--bg-hi) 0%,var(--bg) 58%)}
.bgfx i{position:absolute;left:50%;top:138px;border-radius:50%;transform:translate(-50%,-50%)}
.bgfx .r1{width:520px;height:520px;border:1px dashed var(--ring2);animation:spin 32s linear infinite}
.bgfx .r2{width:340px;height:340px;border:1px solid var(--ring);animation:spin 22s linear infinite reverse}
.bgfx .gl{width:300px;height:300px;background:radial-gradient(circle,var(--glowc),transparent 70%);filter:blur(26px);animation:glow 3.6s ease-in-out infinite}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes glow{0%,100%{opacity:.5}50%{opacity:1}}

.lockup::after{content:'';position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.35) 46%,rgba(255,255,255,.85) 50%,rgba(255,255,255,.35) 54%,transparent 62%);
  background-size:260% 100%;background-position:170% 0;animation:shine 5s ease-in-out 1.4s infinite}
:root[data-theme="dark"] .lockup{animation:logoIn 1s cubic-bezier(.16,1,.3,1) both,breathe 6s ease-in-out 1.1s infinite}
@keyframes logoIn{0%{opacity:0;transform:scale(.86) translateY(12px)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{filter:drop-shadow(0 0 12px rgba(255,255,255,.16))}50%{filter:drop-shadow(0 0 26px rgba(255,255,255,.42))}}
@keyframes shine{0%{background-position:170% 0}45%,100%{background-position:-80% 0}}
.sub{font-family:var(--mono);font-size:9.5px;letter-spacing:.42em;color:var(--dim);margin-top:10px;padding-left:.42em}
.greet{margin-top:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase}
.greet b{color:var(--ink);font-weight:600;letter-spacing:.06em}
.theme{position:absolute;top:8px;right:0;width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer;color:var(--mute)}
.theme svg{width:18px;height:18px}
.ruler{display:block;width:100%;height:12px;margin:16px 0 14px;color:var(--tick)}

/* Timer */
.tm{display:flex;align-items:center;gap:14px;width:100%;padding:12px 14px;border-radius:20px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-align:left;cursor:pointer;transition:transform .12s}
.tm:active{transform:scale(.985)}
.tm .play{width:46px;height:46px;border-radius:14px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.tm .play svg{width:18px;height:18px;margin-left:2px}
.tm .tx{flex:1;min-width:0}
.tm .tx b{display:block;font-size:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.tm .tx small{display:block;margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase}
.tm .chev{width:20px;height:20px;color:var(--dim);flex:none}
.tm.run{cursor:default;background:var(--hero);color:var(--hero-ink);border-color:transparent}
:root[data-theme="dark"] .tm.run{border-color:rgba(98,201,142,.35)}
.tm.run .tx small{color:var(--hero-mute)}
.tm .pulse{width:12px;height:12px;border-radius:50%;background:var(--live);flex:none;margin:0 4px 0 6px;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(47,191,106,.55)}70%{box-shadow:0 0 0 12px rgba(47,191,106,0)}100%{box-shadow:0 0 0 0 rgba(47,191,106,0)}}
.tm.run .tx b{font-family:var(--mono);font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tm .stop{flex:none;padding:11px 14px;border-radius:13px;background:var(--hero-ink);color:#111214;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em}
.rz{display:flex;align-items:center;gap:10px;margin-top:8px;padding:9px 14px;border-radius:14px;border:1px dashed var(--line2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase;background:var(--card)}
.rz i{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none}
.rz b{color:var(--ink);margin-left:auto;font-weight:600}

/* Abschnitte */
.sec{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.24em;color:var(--mute);text-transform:uppercase;margin:24px 2px 10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec em{order:2;font-style:normal;letter-spacing:.1em;color:var(--dim)}
.sec a{order:3;letter-spacing:.1em;color:var(--ink);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh);padding:16px;position:relative;overflow:hidden}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:740px){.grid{grid-template-columns:1fr 1fr}}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch .ico{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.ch .ico svg{width:22px;height:22px}
.ch .ct{flex:1;min-width:0}
.ch b{display:block;font-size:16px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;line-height:1.1}
.ch small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-top:4px}
.ch .go{width:34px;height:34px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--mute)}
.ch .go svg{width:16px;height:16px}
.empty{font-family:var(--mono);font-size:10.5px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;padding:4px 0}

/* Schnell nachbestellen – wie in der App */
.qs{display:grid;grid-auto-flow:column;grid-template-rows:auto auto;grid-auto-columns:calc((100% - 16px) / 3.15);gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:2px 16px 8px;scroll-padding:0 16px;scrollbar-width:none}
.qs::-webkit-scrollbar{display:none}
@media(min-width:620px){.qs{grid-auto-columns:150px}}
.rc{scroll-snap-align:start;position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-height:150px;padding:9px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);overflow:hidden;transition:transform .12s}
.rc:active{transform:scale(.96)}

.rc .rn{font-size:11.5px;font-weight:600;line-height:1.2;letter-spacing:.01em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.rc .rp{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:8px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:17px;font-weight:600;line-height:1}
.rc .uset{margin-top:auto;font-family:var(--mono);font-size:8px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.rc .ubar{display:block;width:100%;height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-top:-3px}
.rc .ubar i{display:block;height:100%;background:var(--ok)}
.rc .ubar.mid i{background:var(--warn)}.rc .ubar.soon i{background:var(--alert)}
.rc.soon .uset,.rc.low .uset{color:var(--alert);font-weight:600}
.rc.soon,.rc.low{border-color:color-mix(in srgb,var(--alert) 40%,var(--line))}
.rc.busy{opacity:.62}
.rc.busy .rp{background:var(--soft);color:var(--mute);border:1px solid var(--line);font-size:12px}
.rc .stk{position:absolute;top:50px;left:50px;padding:2px 5px;border-radius:6px;background:var(--card-solid);border:1px solid var(--line);font-family:var(--mono);font-size:8.5px;font-weight:600}
.rc.low .stk{color:var(--alert);border-color:var(--alert)}

/* Zahlen */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{display:block;padding:13px 4px 11px;border-radius:15px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-align:center}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kpi span{display:block;margin-top:7px;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.kpi.hot{border-color:var(--alert);background:var(--alert-bg)}.kpi.hot b{color:var(--alert)}
.kpi.wip b{color:var(--warn)}

.td{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line)}
.td:first-child{padding-top:2px}.td:last-child{border-bottom:0;padding-bottom:2px}
.td i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--dim)}
.td.r i{background:var(--alert)}.td.y i{background:var(--warn)}.td.g i{background:var(--ok)}
.td span{flex:1;min-width:0;font-size:13.5px;font-weight:500;line-height:1.3}
.td span small{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.td em{font-style:normal;font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:4px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;color:var(--mute)}
.allok{display:flex;align-items:center;gap:10px;color:var(--ok);font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}

.seg{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--track);gap:2px}
.seg i{display:block;height:100%}
.s-neu{background:var(--neu)}.s-wip{background:var(--warn)}.s-ok{background:var(--ok)}.s-sp4{background:var(--sp4)}.s-sp3{background:var(--sp3)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-family:var(--mono);font-size:9px;color:var(--mute);letter-spacing:.08em;margin-top:8px;text-transform:uppercase}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.rows{margin-top:10px}
.pr{display:flex;align-items:center;gap:11px;padding:10px 0;border-top:1px dashed var(--line)}
.pr .dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--neu)}
.pr .dot.wip{background:var(--warn)}.pr .dot.ok{background:var(--ok)}
.pr .t{flex:1;min-width:0}
.pr .t b{display:block;font-size:13.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.pr .t b span{font-weight:500;color:var(--mute)}
.pr .t small{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--mute);margin-top:3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .t small em{font-style:normal;color:var(--warn)}
.rr{display:flex;flex-direction:column;gap:3px;width:74px;flex:none}
.rr i{display:block;height:5px;border-radius:3px;min-width:2px}
.rr .a{background:var(--ink)}.rr .b{background:var(--tick)}

/* Lager */

.mini i{display:block;border-radius:3px 3px 1px 1px;background:var(--ink);opacity:.82;min-height:2px}

.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px dashed var(--line);font-size:12.5px}
.row:first-child{margin-top:12px}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;text-transform:uppercase}
.row .n{font-family:var(--mono);font-weight:600;font-size:12px;white-space:nowrap}
.row .n.r{color:var(--alert)}
.row small{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap}
.prog{width:54px;height:5px;border-radius:3px;background:var(--track);overflow:hidden;flex:none}
.prog i{display:block;height:100%;background:var(--ok)}

/* Apps */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 4px 11px;border-radius:17px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);text-align:center;transition:transform .12s}
.app:active{transform:scale(.96)}
.app .ico{width:42px;height:42px;border-radius:13px;background:var(--ink);color:var(--on-ink);display:grid;place-items:center}
.app .ico svg{width:22px;height:22px}
.app b{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.app small{font-family:var(--mono);font-size:8px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--alert)}.chip.warn{border-color:var(--alert);color:var(--ink)}

.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,140%);z-index:9;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:16px;background:#111214;color:#fff;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;box-shadow:0 12px 34px rgba(0,0,0,.35);transition:transform .3s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
:root[data-theme="dark"] .toast{background:#fff;color:#111214}
.toast:not(.on){visibility:hidden;transition:transform .3s,visibility 0s .3s}
.toast.on{transform:translate(-50%,0)}
.toast button{border:0;background:#fff;color:#111214;padding:8px 12px;border-radius:10px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
:root[data-theme="dark"] .toast button{background:#111214;color:#fff}
footer{margin-top:26px;font-family:var(--mono);font-size:9.5px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;text-align:center}
@media(max-width:370px){.kpi b{font-size:19px}.tm.run .tx b{font-size:24px}.greet{letter-spacing:.12em}}
@media(prefers-reduced-motion:no-preference){
  .card,.kpis,.apps,.tm,.qs{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
  .qs{animation-delay:.05s}.kpis{animation-delay:.1s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){.bgfx i,.lockup,.lockup::after,.tm .pulse{animation:none!important}}

    bk.forEach(function(b){if(!b[2])return;var age=b[1]?Math.floor((now-b[1])/DAY):null;if(age===null||age>14)td.push(['y','Backup '+b[0]+(age===null?' noch nie':' vor '+age+' Tagen'),'Daten liegen nur in diesem Browser',b[0],b[3]])});
    $('todo').innerHTML=td.length?td.map(function(t){return '<a class="td '+t[0]+'" href="'+t[4]+'"><i></i><span>'+esc(t[1])+'<small>'+esc(t[2])+'</small></span><em>'+esc(t[3])+'</em></a>'}).join(''):'<div class="allok"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="9"/><path d="M7 11.5l2.6 2.5L15 8.5"/></svg>Alles erledigt</div>';

    // ---- CitiTool: 5 letzte Projekte
    if(C){
      var tot=C.ps.length||1,last5=C.ps.slice(-5).reverse();
      var mx=Math.max(1,Math.max.apply(null,last5.map(function(p){return Math.max((p.oben||[]).length,(p.unten||[]).length)})));
      var SN={neu:'Neu',wip:'In Arbeit',ok:'Fertig'};
      $('cCiti').innerHTML=head('citi','CitiTool','Nakamura · '+C.ps.length+' Projekte · '+C.lib+' im Gedächtnis',URL_C)+
        '<div class="seg">'+['ok','wip','neu'].map(function(s){return C.st[s]?'<i class="s-'+s+'" style="width:'+(C.st[s]/tot*100)+'%"></i>':''}).join('')+'</div>'+
        '<div class="leg"><span><i class="s-ok"></i>'+C.st.ok+' fertig</span><span><i class="s-wip"></i>'+C.st.wip+' in Arbeit</span><span><i class="s-neu"></i>'+C.st.neu+' neu</span></div>'+
        '<div class="rows">'+last5.map(function(p){var ro=(p.oben||[]).length,ru=(p.unten||[]).length,s=p.status||'neu',tm=p.tmr||{},sec=(tm.total||0)+(tm.start?(now-tm.start)/1000:0);
          return '<a class="pr" href="'+URL_C+'" data-id="citi"><i class="dot '+s+'"></i><span class="t"><b>'+esc(p.num||'Ohne Nr')+(p.name?' <span>· '+esc(p.name)+'</span>':'')+'</b><small>'+'RO '+ro+' · RU '+ru+(sec>=60?' · '+(tm.start?'<em>':'')+'⏱ '+dur(sec)+(tm.start?' ▸</em>':''):'')+'</small></span><span class="rr"><i class="a" style="width:'+(ro/mx*100)+'%"></i><i class="b" style="width:'+(ru/mx*100)+'%"></i></span></a>'}).join('')+'</div>'+
        '<div class="leg"><span><i style="background:var(--ink)"></i>RO Oben</span><span><i style="background:var(--tick)"></i>RU Unten</span></div>';
    } else $('cCiti').innerHTML=head('citi','CitiTool','Nakamura WT-250 II',URL_C)+'<div class="empty">Noch keine Projekte in diesem Browser</div>';

    // ---- MPF Visual: 5 letzte Projekte
    if(M&&M.ps.length){
      var m5=M.ps.slice(-5).reverse(),sp4=0,sp3=0;M.ps.forEach(function(p){sp4+=p.sp4;sp3+=p.sp3});var all=sp4+sp3||1;
      $('cMpf').innerHTML=head('mpf','MPF Visual','CTX 350 · '+M.ps.length+' Projekte · '+M.ops+' Operationen',URL_M)+
        '<div class="seg">'+(sp4?'<i class="s-sp4" style="width:'+(sp4/all*100)+'%"></i>':'')+(sp3?'<i class="s-sp3" style="width:'+(sp3/all*100)+'%"></i>':'')+'</div>'+
        '<div class="leg"><span><i class="s-sp4"></i>'+sp4+' SP4 · K1</span><span><i class="s-sp3"></i>'+sp3+' SP3 · K2</span></div>'+
        '<div class="rows">'+m5.map(function(p){var w=Math.max(1,p.ops);return '<a class="pr" href="'+URL_M+'" data-id="mpf"><i class="dot '+(p.ops&&!p.noT?'ok':p.ops?'wip':'')+'"></i><span class="t"><b>'+esc(p.zn)+(p.bez?' <span>· '+esc(p.bez)+'</span>':'')+'</b><small>CH1 '+p.k1+' · CH2 '+p.k2+' · '+p.tools+' WZ'+(p.noT?' · <em>'+p.noT+' ohne WZ</em>':'')+'</small></span><span class="mbar"><i class="s-sp4" style="width:'+(p.sp4/w*100)+'%"></i><i class="s-sp3" style="width:'+(p.sp3/w*100)+'%"></i></span></a>'}).join('')+'</div>';
    } else $('cMpf').innerHTML=head('mpf','MPF Visual','DMG MORI CTX 350',URL_M)+'<div class="empty">Noch keine Projekte in diesem Browser</div>';

    // ---- Lager
    if(L){var lmx=Math.max(1,Math.max.apply(null,L.days));
      $('cLager').innerHTML=head('box','Bestellliste',L.lib.length+' Werkzeuge · '+L.orders.length+' Bestellungen',URL_B)+
        '<div class="stats4"><a href="'+URL_B+'?view=orders"><b>'+L.cart.length+'</b><span>Liste</span></a><a href="'+URL_B+'?view=orders"><b>'+L.sent.length+'</b><span>Unterwegs</span></a><a class="'+(L.late.length?'hot':'')+'" href="'+URL_B+'?view=orders"><b>'+L.late.length+'</b><span>Überfällig</span></a><a class="'+(L.low.length?'hot':'')+'" href="'+URL_B+'?view=aus"><b>'+L.low.length+'</b><span>Unter Min</span></a></div>'+
        (L.moves.length?'<div class="mini">'+L.days.map(function(n,i){return '<i class="'+(i===13?'now':'')+'" style="height:'+(n?Math.max(8,n/lmx*100):3)+'%"></i>'}).join('')+'</div><div class="mini-l"><span>AUSGABE 14 TAGE</span><span>HEUTE '+L.today+' · 7 T '+L.week+'</span></div>':'')+
        (L.open.length?'<div>'+L.open.slice(0,4).map(function(o){var its=(o.itemIds||[]).map(function(id){return L.items.find(function(i){return i.id===id})}).filter(Boolean),got=its.filter(function(i){return i.status==='geliefert'}).length;var w=Math.floor((now-(o.sentAt||now))/DAY);return '<a class="row" href="'+URL_B+'?view=orders"><span class="t">'+esc(o.nr||'Bestellung')+(o.to?' · '+esc(o.to):'')+'</span><span class="prog"><i style="width:'+(its.length?got/its.length*100:0)+'%"></i></span><small>'+got+'/'+its.length+'</small><span class="n '+(w>=L.rd?'r':'')+'">'+w+' T</span></a>'}).join('')+'</div>':'');
    } else $('cLager').innerHTML=head('box','Bestellliste','Werkzeug bestellen & ausgeben',URL_B)+'<div class="empty">Noch keine Daten in diesem Browser</div>';

    // ---- Apps + Backups
    var used=js('syncop_hub_used',{});
    var apps=[['shift','Einsatz',URL_E],['order','Bestellen',URL_B],['citi','CitiTool',URL_C],['mpf','MPF Visual',URL_M]];
    $('apps').innerHTML=apps.map(function(a){return '<a class="app" data-id="'+a[0]+'" href="'+a[2]+'"><span class="ico">'+IC[a[0]]+'</span><b>'+a[1]+'</b><small>'+ago(used[a[0]])+'</small></a>'}).join('');
    var f=[];bk.forEach(function(b){if(!b[2])return;var age=b[1]?Math.floor((now-b[1])/DAY):null;f.push('<a class="chip '+(age===null||age>14?'warn':'ok')+'" href="'+b[3]+'"><i></i>Backup '+b[0]+': '+(age===null?'noch keins':ago(b[1]))+'</a>')});
    var sc=ls('syncop_bestellliste_synccode');f.push('<span class="chip '+(sc?'ok':'')+'"><i></i>Sync Bestellliste: '+(sc?'an':'aus')+'</span>');
    $('chips').innerHTML=f.join('');
    tick();
  }
  function kw(t){var d=new Date(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate()));var n=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-n);var y=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil(((d-y)/DAY+1)/7)}
  function tick(){
    var t=new Date(),h=t.getHours();
    $('greet').innerHTML=(h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend')+' · '+t.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'}).replace(',','')+' · KW '+kw(t)+' · <b>'+hm(t)+'</b>';
    var E=window.__E;if(E&&E.run&&$('liveT')){var s=Math.floor((Date.now()-E.run.start)/1000);$('liveT').textContent=Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
    var C=window.__C;if(C&&C.runTm&&$('rzT')){var tm=C.runTm.tmr;$('rzT').textContent=dur((tm.total||0)+(Date.now()-tm.start)/1000)}
  }
  document.addEventListener('click',function(e){if(e.target.closest('#tmStart')){startShift();return}var a=e.target.closest('a[data-id]');if(!a)return;var u=js('syncop_hub_used',{});u[a.dataset.id]=Date.now();save('syncop_hub_used',u)});
  render();setInterval(tick,1000);setInterval(render,60000);
  window.addEventListener('storage',function(){META=js('syncop_bestellliste_meta_v1',{})||{};render()});
  document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
  window.addEventListener('pageshow',render);
})();
</script>
