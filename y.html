<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Premium Monitor</title>
    <style>
        :root {
            --bg-page: #f2f2f7;
            --bg-card: #ffffff;
            --text-dark: #1c1c1e;
            --text-gray: #8e8e93;
            --blue: #007aff;
            --green: #34c759;
            --border-line: #e5e5ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }

        h2 { font-size: 1.2rem; margin: 4px 0 2px 0; font-weight: 700; }
        .subtext { font-size: 0.8rem; color: var(--text-gray); margin-bottom: 12px; }

        /* Элемент симулятора */
        #canvasContainer {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1.1;
            background: #1c1c1e;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-line);
            position: relative;
        }

        canvas { width: 100%; height: 100%; display: block; }

        /* Окно терминала ЧПУ (Вывод всего кода) */
        .cnc-monitor {
            width: 100%;
            max-width: 350px;
            height: 130px;
            background: #2c2c2e;
            border-radius: 12px;
            margin-top: 10px;
            padding: 8px;
            box-sizing: border-box;
            overflow-y: auto;
            border: 1px solid #3a3a3c;
            font-family: "SF Mono", Menlo, Monaco, Consolas, monospace;
            font-size: 0.75rem;
            color: #aeaeae;
        }

        .code-line { padding: 2px 6px; border-radius: 4px; }
        .code-line.active { background: #48484a; color: #fff; font-weight: bold; border-left: 3px solid var(--blue); }
        .code-comment { color: #34c759; }

        /* HUD панель */
        .hud {
            margin-top: 10px;
            background: var(--bg-card);
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            border: 1px solid var(--border-line);
            font-size: 0.8rem;
        }

        .hud-line { display: flex; justify-content: space-between; margin: 3px 0; }
        .axis-block { font-family: monospace; font-weight: bold; color: #5856d6; }

        .controls {
            margin-top: 12px;
            width: 100%;
            max-width: 350px;
            display: flex;
            gap: 10px;
            padding-bottom: 34px; /* Отступ под челку/полосу iOS */
        }

        button {
            flex: 1;
            border: none;
            color: white;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
        }

        #startBtn { background-color: var(--green); }
        #resetBtn { background-color: #ff3b30; }
    </style>
</head>
<body>

    <h2>Nakamura True Monitor</h2>
    <div class="subtext">Пазы в центр + Расточка R (Честная кинематика оси C)</div>

    <div id="canvasContainer">
        <canvas id="cncCanvas" width="700" height="770"></canvas>
    </div>

    <div class="cnc-monitor" id="cncMonitor"></div>

    <div class="hud">
        <div class="hud-line"><span>Позиция осей:</span> <span id="axes" class="axis-block">X: 5.95 Y: 0.00 Z: 2.0 C: 0.00</span></div>
    </div>

    <div class="controls">
        <button id="startBtn">СТАРТ</button>
        <button id="resetBtn">СБРОС</button>
    </div>

<script>
const gcodeProgram = [
    { text: "O2026 (NAKAMURA REWORKED)", type: "comment" },
    { text: "G18 G98 G40 M200", type: "code" },
    { text: "T0101 (MILL D2.0)", type: "code" },
    { text: "G00 X5.95 Y0.0 Z2.0 C0.0", type: "code" },
    { text: "G01 Z0.0 F150", type: "code" },
    { text: "G01 Y0.2 F120", type: "code" },
    { text: "G03 Y0.2 Z-3.0 R0.2 F80", type: "code" },
    { text: "G03 Y0.2 R0.2", type: "code" },
    { text: "G01 Y0.0", type: "code" },
    { text: "G01 X0.0 F150 (SLOT 1)", type: "code" },
    { text: "G00 Z5.0", type: "code" },
    { text: "G00 X5.95 Y0.0 Z2.0 C180.0", type: "code" },
    { text: "G01 Z0.0 F150", type: "code" },
    { text: "G01 Y0.2 F120", type: "code" },
    { text: "G03 Y0.2 Z-3.0 R0.2 F80", type: "code" },
    { text: "G03 Y0.2 R0.2", type: "code" },
    { text: "G01 Y0.0", type: "code" },
    { text: "G01 X0.0 F150 (SLOT 2)", type: "code" },
    { text: "G00 Z5.0", type: "code" },
    { text: "G00 X0.0 Y0.0 Z2.0", type: "code" },
    { text: "G01 Z0.0 F150", type: "code" },
    { text: "G01 Y3.0 F120", type: "code" },
    { text: "G03 Y3.0 Z-3.0 R3.0 F90", type: "code" },
    { text: "G03 Y3.0 R3.0 (CENTER HOLE)", type: "code" },
    { text: "G01 Y0.0", type: "code" },
    { text: "G00 Z20.0 M30", type: "code" }
];

const canvas = document.getElementById('cncCanvas');
const ctx = canvas.getContext('2d');
const monitor = document.getElementById('cncMonitor');
const axesTxt = document.getElementById('axes');

const cx = 350, cy = 350;
const scale = 42;

let animationId;
let step = 0, t = 0, currentLineIndex = 0;
let currentRotC = 0; 
let cuts = []; 

// Загрузка программы в монитор при старте
function initMonitor() {
    monitor.innerHTML = "";
    gcodeProgram.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'code-line';
        div.id = `line-${idx}`;
        if (line.type === 'comment') {
            div.innerHTML = `<span class="code-comment">${line.text}</span>`;
        } else {
            div.innerText = line.text;
        }
        monitor.appendChild(div);
    });
}

function updateActiveLine(index) {
    document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
    const activeEl = document.getElementById(`line-${index}`);
    if (activeEl) {
        activeEl.classList.add('active');
        monitor.scrollTop = activeEl.offsetTop - monitor.offsetTop - 40;
    }
}

function drawScene(rotC) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-rotC); // Поворот шпинделя (ось С)

    // Деталь
    ctx.beginPath(); ctx.arc(0, 0, 7.5 * scale, 0, 2 * Math.PI);
    ctx.fillStyle = '#2c2c2e'; ctx.fill();
    ctx.strokeStyle = '#3a3a3c'; ctx.lineWidth = 3; ctx.stroke();

    // Сетка детали
    ctx.beginPath();
    ctx.moveTo(-300, 0); ctx.lineTo(300, 0);
    ctx.moveTo(0, -300); ctx.lineTo(0, 300);
    ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1; ctx.stroke();

    // Контуры обработки
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#007aff';
    ctx.beginPath(); ctx.arc(2.975 * scale, 0, 1.2 * scale, 0, 2 * Math.PI); ctx.stroke(); // Отверстие 1
    ctx.beginPath(); ctx.arc(-2.975 * scale, 0, 1.2 * scale, 0, 2 * Math.PI); ctx.stroke(); // Отверстие 2
    ctx.strokeStyle = '#34c759';
    ctx.beginPath(); ctx.arc(0, 0, 4.0 * scale, 0, 2 * Math.PI); ctx.stroke(); // Центр

    // Отрисовка срезанного материала
    ctx.fillStyle = '#1c1c1e';
    cuts.forEach(c => {
        ctx.beginPath(); ctx.arc(c.x, c.y, 1.0 * scale, 0, 2 * Math.PI); ctx.fill();
    });

    ctx.restore();
}

function drawTool(toolX, toolY, toolZ, rotC, dispX, dispY) {
    axesTxt.innerText = `X: ${dispX} Y: ${dispY} Z: ${toolZ.toFixed(1)} C: ${(rotC * 180 / Math.PI).toFixed(1)}`;
    
    // Инструмент всегда находится сверху над деталью в физических координатах суппорта
    ctx.beginPath();
    ctx.arc(toolX, toolY, 1.0 * scale, 0, 2 * Math.PI);
    ctx.fillStyle = toolZ <= 0 ? 'rgba(255, 59, 48, 0.85)' : 'rgba(255, 214, 10, 0.7)';
    ctx.fill();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.stroke();
}

function mainEngine() {
    let tx = cx, ty = cy, tz = 2.0;
    let dx = "0.00", dy = "0.00";

    // Логика шагов
    if (step === 0) {
        updateActiveLine(3); // G00 X5.95 Y0.0 Z2.0 C0.0
        currentRotC = 0;
        tx = cx + 2.975 * scale; ty = cy;
        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, "5.95", "0.00");
        setTimeout(() => { step = 1; }, 600);
    }
    else if (step === 1) {
        updateActiveLine(6); // G03 Y0.2 Z-3.0 R0.2
        t += 0.02; if (t > 1) t = 1;
        let ang = (t * Math.PI * 2) - Math.PI / 2;
        let r_off = 0.2 * scale;
        tx = cx + 2.975 * scale;
        ty = cy + Math.cos(ang) * r_off + r_off;
        tz = 2.0 - 5.0 * t; if (tz < -3.0) tz = -3.0;

        // Пересчет следа в координаты вращающейся детали
        if (tz <= 0) {
            let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
            let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
            cuts.push({ x: rx, y: ry });
        }
        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, "5.95", ((ty - cy) / scale).toFixed(2));
        if (t === 1) { step = 2; t = 0; }
    }
    else if (step === 2) {
        updateActiveLine(9); // G01 X0.0 F150 (Паз 1)
        t += 0.02; if (t > 1) t = 1;
        tx = (cx + 2.975 * scale) - (2.975 * scale * t);
        ty = cy; tz = -3.0;

        let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
        let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
        cuts.push({ x: rx, y: ry });

        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, (5.95 * (1 - t)).toFixed(2), "0.00");
        if (t === 1) { step = 3; }
    }
    else if (step === 3) {
        updateActiveLine(10); // G00 Z5.0
        drawScene(currentRotC);
        drawTool(cx, cy, 5.0, currentRotC, "0.00", "0.00");
        setTimeout(() => { step = 4; t = 0; }, 400);
    }
    else if (step === 4) {
        updateActiveLine(11); // G00 X5.95 Y0.0 Z2.0 C180.0
        t += 0.04; if (t > 1) t = 1;
        currentRotC = t * Math.PI; // Поворот заготовки на 180 градусов
        tx = cx + 2.975 * scale; ty = cy;
        drawScene(currentRotC);
        drawTool(tx, ty, 2.0, currentRotC, "5.95", "0.00");
        if (t === 1) { step = 5; t = 0; }
    }
    else if (step === 5) {
        updateActiveLine(14); // Helix отверстия 2
        t += 0.02; if (t > 1) t = 1;
        let ang = (t * Math.PI * 2) - Math.PI / 2;
        let r_off = 0.2 * scale;
        tx = cx + 2.975 * scale;
        ty = cy + Math.cos(ang) * r_off + r_off;
        tz = 2.0 - 5.0 * t; if (tz < -3.0) tz = -3.0;

        if (tz <= 0) {
            let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
            let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
            cuts.push({ x: rx, y: ry });
        }
        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, "5.95", ((ty - cy) / scale).toFixed(2));
        if (t === 1) { step = 6; t = 0; }
    }
    else if (step === 6) {
        updateActiveLine(17); // Паз 2 в центр
        t += 0.02; if (t > 1) t = 1;
        tx = (cx + 2.975 * scale) - (2.975 * scale * t);
        ty = cy; tz = -3.0;

        let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
        let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
        cuts.push({ x: rx, y: ry });

        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, (5.95 * (1 - t)).toFixed(2), "0.00");
        if (t === 1) { step = 7; }
    }
    else if (step === 7) {
        updateActiveLine(18);
        drawScene(currentRotC);
        drawTool(cx, cy, 5.0, currentRotC, "0.00", "0.00");
        setTimeout(() => { step = 8; t = 0; }, 400);
    }
    else if (step === 8) {
        updateActiveLine(22); // Центральный Helix Ø8
        t += 0.008; if (t > 1) t = 1;
        let helixAng = (t * Math.PI * 6) - Math.PI / 2;
        let dynR = 3.0 * scale * Math.min(t * 3, 1);
        tx = cx;
        ty = cy + Math.cos(helixAng) * dynR + dynR;
        tz = 0.0 - 3.0 * t;

        let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
        let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
        cuts.push({ x: rx, y: ry });

        drawScene(currentRotC);
        drawTool(tx, ty, tz, currentRotC, "0.00", ((ty - cy) / scale).toFixed(2));
        if (t === 1) { step = 9; t = 0; }
    }
    else if (step === 9) {
        updateActiveLine(23); // Чистовой круг центра
        t += 0.02; if (t > 1) t = 1;
        let ang = (t * Math.PI * 2) - Math.PI / 2;
        tx = cx;
        ty = cy + Math.cos(ang) * (3.0 * scale) + (3.0 * scale);
        
        let rx = (tx - cx) * Math.cos(currentRotC) - (ty - cy) * Math.sin(currentRotC);
        let ry = (tx - cx) * Math.sin(currentRotC) + (ty - cy) * Math.cos(currentRotC);
        cuts.push({ x: rx, y: ry });

        drawScene(currentRotC);
        drawTool(tx, ty, -3.0, currentRotC, "0.00", "3.00");
        if (t === 1) { step = 10; }
    }
    else if (step === 10) {
        updateActiveLine(25); // Конец программы
        drawScene(currentRotC);
        drawTool(cx, cy, 20.0, currentRotC, "0.00", "0.00");
        cancelAnimationFrame(animationId);
        return;
    }

    animationId = requestAnimationFrame(mainEngine);
}

const startBtn = document.getElementById('startBtn');
const trigger = () => {
    if (step === 0 || step === 10) {
        step = 0; t = 0; cuts = [];
        mainEngine();
    }
};

startBtn.addEventListener('click', trigger);
startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); trigger(); });

document.getElementById('resetBtn').addEventListener('click', () => {
    cancelAnimationFrame(animationId);
    step = 0; t = 0; cuts = []; currentRotC = 0;
    initMonitor();
    drawScene(0);
    axesTxt.innerText = "X: 5.95 Y: 0.00 Z: 2.0 C: 0.0";
});

initMonitor();
drawScene(0);
</script>
</body>
</html>
