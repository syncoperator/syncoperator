<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Simulation Nakamura</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { margin-bottom: 5px; color: #0a84ff; font-size: 1.2rem; }
        .info { font-size: 0.85rem; color: #eaeaea; margin-bottom: 15px; text-align: center; }
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1;
            background: #2c2c2e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .controls {
            margin-top: 15px;
            width: 100%;
            max-width: 350px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background-color: #30d158;
            border: none;
            color: white;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(48,209,88,0.4);
        }
        button:active { background-color: #24a142; }
        #resetBtn { background-color: #ff453a; box-shadow: 0 2px 8px rgba(255,69,58,0.4); }
        #resetBtn:active { background-color: #d63629; }
        .hud {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.9rem;
            background: #2c2c2e;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
            max-width: 326px;
            box-sizing: border-box;
        }
        .hud-line { display: flex; justify-content: space-between; margin: 2px 0; }
        .val { color: #ffd60a; }
    </style>
</head>
<body>

    <h2>Nakamura Planflächenfräsen</h2>
    <div class="info">Simulation: Helix-Ausräumen von Ø2.0 auf Ø2.4 (X5.95)</div>

    <div id="canvasContainer">
        <canvas id="cncCanvas" width="700" height="700"></canvas>
    </div>

    <div class="hud">
        <div class="hud-line"><span>Aktueller Code:</span> <span id="gcode" class="val">G00 X5.95 Z2.0 C0</span></div>
        <div class="hud-line"><span>Werkzeug-Ø:</span> <span class="val">2.0 mm</span></div>
        <div class="hud-line"><span>Bohrung-Ø:</span> <span class="val">2.4 mm</span></div>
    </div>

    <div class="controls">
        <button id="startBtn">Zyklus Start</button>
        <button id="resetBtn">Reset</button>
    </div>

<script>
const canvas = document.getElementById('cncCanvas');
const ctx = canvas.getContext('2d');
const gcodeTxt = document.getElementById('gcode');

// Simulationsparameter Scale (Zentrum ist bei 350, 350)
const cx = 350, cy = 350;
const scale = 45; // 1mm = 45 Pixel

let animationId;
let step = 0;
let t = 0;

// Bohrungspositionen im Raum (X5.95 bedeutet Radius=2.975 auf dem Bauteil)
const targetRadius = 2.975 * scale; 

function drawBackground() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Hauptbauteil (Planansicht)
    ctx.beginPath();
    ctx.arc(cx, cy, 7 * scale, 0, 2 * Math.PI);
    ctx.fillStyle = '#3a3a3c';
    ctx.fill();
    ctx.strokeStyle = '#48484a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Achsenkreuz
    ctx.beginPath();
    ctx.moveTo(cx - 320, cy); ctx.lineTo(cx + 320, cy);
    ctx.moveTo(cx, cy - 320); ctx.lineTo(cx, cy + 320);
    ctx.strokeStyle = 'rgba(255,255,255,0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Soll-Bohrungen Ø2.40 mm zeichnen
    drawTargetHole(cx + targetRadius, cy);  // C0
    drawTargetHole(cx - targetRadius, cy);  // C180
}

function drawTargetHole(hx, hy) {
    ctx.beginPath();
    ctx.arc(hx, hy, (2.4 / 2) * scale, 0, 2 * Math.PI);
    ctx.strokeStyle = '#0a84ff';
    ctx.lineWidth = 2;
    ctx.stroke();
}

function drawTool(x, y, color = 'rgba(255, 214, 10, 0.6)') {
    ctx.beginPath();
    ctx.arc(x, y, (2.0 / 2) * scale, 0, 2 * Math.PI);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = '#ffd60a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

// Abgetragenes Material Array
let cuts = [];

function drawCuts() {
    ctx.fillStyle = '#1c1c1e';
    cuts.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, (2.0 / 2) * scale, 0, 2 * Math.PI);
        ctx.fill();
    });
}

function animate() {
    drawBackground();
    drawCuts();

    let tx = cx, ty = cy; // Fräser-Position absolute Pixels

    if (step === 0) {
        gcodeTxt.innerText = "G00 X5.95 Z2.0 C0.0";
        tx = cx + targetRadius;
        ty = cy;
        drawTool(tx, ty);
        setTimeout(() => { step = 1; }, 1000);
    } 
    else if (step === 1) {
        gcodeTxt.innerText = "G01 G41 X6.35 F80";
        t += 0.05;
        if(t > 1) t = 1;
        // Bewegung radial nach außen um 0.2mm (Radiusdifferenz)
        let offset = 0.2 * scale * t;
        tx = cx + targetRadius + offset;
        ty = cy;
        drawTool(tx, ty);
        cuts.push({x: tx, y: ty});
        if(t === 1) { step = 2; t = 0; }
    } 
    else if (step === 2) {
        gcodeTxt.innerText = "G03 I-0.2 Z-3.0 (Helix)";
        t += 0.03; // Rotationsfortschritt
        let angle = t * Math.PI * 2;
        let h_radius = 0.2 * scale; // Kreisradius der Helix
        
        tx = (cx + targetRadius) + Math.cos(angle) * h_radius;
        ty = cy + Math.sin(angle) * h_radius;
        
        drawTool(tx, ty);
        cuts.push({x: tx, y: ty});
        
        if(t >= 1) { step = 3; t = 0; }
    }
    else if (step === 3) {
        gcodeTxt.innerText = "G01 G40 X5.95 (Zentrum C0)";
        tx = cx + targetRadius;
        ty = cy;
        drawTool(tx, ty);
        setTimeout(() => { step = 4; }, 800);
    }
    else if (step === 4) {
        gcodeTxt.innerText = "G00 C180.0";
        tx = cx - targetRadius;
        ty = cy;
        drawTool(tx, ty, 'rgba(255,255,255,0.4)');
        setTimeout(() => { step = 5; }, 1000);
    }
    else if (step === 5) {
        gcodeTxt.innerText = "G01 G41 X6.35 (C180)";
        t += 0.05; if(t > 1) t = 1;
        let offset = 0.2 * scale * t;
        tx = cx - targetRadius - offset; // nach links außen weg
        ty = cy;
        drawTool(tx, ty);
        cuts.push({x: tx, y: ty});
        if(t === 1) { step = 6; t = 0; }
    }
    else if (step === 6) {
        gcodeTxt.innerText = "G03 I0.2 Z-3.0 (Helix C180)";
        t += 0.03;
        let angle = t * Math.PI * 2;
        let h_radius = 0.2 * scale;
        
        // I0.2 zeigt hier in Richtung Bauteilmitte, Start ist links außen
        tx = (cx - targetRadius) - Math.cos(angle) * h_radius;
        ty = cy - Math.sin(angle) * h_radius;
        
        drawTool(tx, ty);
        cuts.push({x: tx, y: ty});
        if(t >= 1) { step = 7; }
    }
    else if (step === 7) {
        gcodeTxt.innerText = "G00 Z20.0 (Fertig)";
        drawTool(cx - targetRadius, cy);
        cancelAnimationFrame(animationId);
        return;
    }

    animationId = requestAnimationFrame(animate);
}

document.getElementById('startBtn').addEventListener('touchstart', () => {
    if(step === 0 || step === 7) {
        step = 0; t = 0; cuts = [];
        animate();
    }
});
document.getElementById('startBtn').addEventListener('click', () => {
    if(step === 0 || step === 7) {
        step = 0; t = 0; cuts = [];
        animate();
    }
});

document.getElementById('resetBtn').addEventListener('click', () => {
    cancelAnimationFrame(animationId);
    step = 0; t = 0; cuts = [];
    gcodeTxt.innerText = "G00 X5.95 Z2.0 C0";
    drawBackground();
});

// Initiale Zeichnung
drawBackground();
</script>
</body>
</html>
