<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Light Premium Fixed</title>
    <style>
        :root {
            --bg-page: #f2f2f7;
            --bg-card: #ffffff;
            --text-dark: #1c1c1e;
            --text-gray: #8e8e93;
            --blue: #007aff;
            --border-line: #e5e5ea;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: var(--bg-page);
            color: var(--text-dark);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 { font-size: 1.3rem; margin: 8px 0 2px 0; font-weight: 700; text-align: center; }
        .subtext { font-size: 0.85rem; color: var(--text-gray); margin-bottom: 20px; text-align: center; }

        #canvasContainer {
            width: 100%;
            max-width: 350px;
            aspect-ratio: 1;
            background: #1c1c1e;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid var(--border-line);
            box-shadow: 0 6px 20px rgba(0,0,0,0.05);
        }

        canvas { width: 100%; height: 100%; display: block; }

        .hud {
            margin-top: 16px;
            background: var(--bg-card);
            border-radius: 14px;
            padding: 14px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            border: 1px solid var(--border-line);
        }

        .hud-line { display: flex; justify-content: space-between; margin: 5px 0; font-size: 0.85rem; }
        .cnc-block { font-family: monospace; font-weight: bold; color: var(--blue); }
        .axis-block { font-family: monospace; font-weight: bold; color: #5856d6; }

        .controls {
            margin-top: 20px;
            width: 100%;
            max-width: 350px;
            display: flex;
            gap: 12px;
            padding-bottom: 40px; /* Фикс перекрытия нижней полосы iOS */
        }

        button {
            flex: 1;
            border: none;
            color: white;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 14px;
            cursor: pointer;
        }

        #startBtn { background-color: #34c759; }
        #startBtn:active { background-color: #28a745; }
        #resetBtn { background-color: #ff3b30; }
        #resetBtn:active { background-color: #dc3545; }
    </style>
</head>
<body>

    <h2>Nakamura Fixed XYZ</h2>
    <div class="subtext">Пазы в центр + Расточка по радиусу R без переменных</div>

    <div id="canvasContainer">
        <canvas id="cncCanvas" width="700" height="700"></canvas>
    </div>

    <div class="hud">
        <div class="hud-line"><span>Кадр ЧПУ:</span> <span id="gcode" class="cnc-block">G00 X5.95 Y0.0 Z2.0</span></div>
        <div class="hud-line"><span>Позиция осей:</span> <span id="axes" class="axis-block">X: 5.95 Y: 0.00 Z: 2.0</span></div>
    </div>

    <div class="controls">
        <button id="startBtn">СТАРТ</button>
        <button id="resetBtn">СБРОС</button>
    </div>

<script>
const canvas = document.getElementById('cncCanvas');
const ctx = canvas.getContext('2d');
const gcodeTxt = document.getElementById('gcode');
const axesTxt = document.getElementById('axes');

const cx = 350, cy = 350;
const scale = 45; 

let animationId;
let step = 0, t = 0, cuts = [];

// Константные технологические размеры
const dMill = 2.0;
const dHole = 2.4;
const dCenter = 8.0;
const zDepth = -3.0;
const radX595 = 2.975 * scale;

function drawPart() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Заготовка
    ctx.beginPath();
    ctx.arc(cx, cy, 7.2 * scale, 0, 2 * Math.PI);
    ctx.fillStyle = '#2c2c2e';
    ctx.fill();
    ctx.strokeStyle = '#3a3a3c';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Сетка осей X-Y
    ctx.beginPath();
    ctx.moveTo(cx - 300, cy); ctx.lineTo(cx + 300, cy);
    ctx.moveTo(cx, cy - 300); ctx.lineTo(cx, cy + 300);
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Фиксированные чертежные окружности
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#007aff'; // Боковые Ø2.4
    ctx.beginPath(); ctx.arc(cx + radX595, cy, (dHole/2)*scale, 0, 2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - radX595, cy, (dHole/2)*scale, 0, 2*Math.PI); ctx.stroke();
    
    ctx.strokeStyle = '#34c759'; // Центральная Ø8
    ctx.beginPath(); ctx.arc(cx, cy, (dCenter/2)*scale, 0, 2*Math.PI); ctx.stroke();
}

function drawCuts() {
    ctx.fillStyle = '#1c1c1e';
    cuts.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, (dMill/2)*scale, 0, 2*Math.PI);
        ctx.fill();
    });
}

function drawTool(x, y, z, codeText, xDisp, yDisp) {
    gcodeTxt.innerText = codeText;
    axesTxt.innerText = `X: ${xDisp} Y: ${yDisp} Z: ${z.toFixed(1)}`;

    ctx.beginPath();
    ctx.arc(x, y, (dMill/2)*scale, 0, 2 * Math.PI);
    ctx.fillStyle = z <= 0 ? 'rgba(255, 59, 48, 0.85)' : 'rgba(255, 214, 10, 0.7)';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function cycleEngine() {
    drawPart();
    drawCuts();

    let tx = cx, ty = cy, tz = 2.0;
    let rHoleOffset = ((dHole - dMill) / 2) * scale;     // 0.2мм в пикселях
    let rCenterOffset = ((dCenter - dMill) / 2) * scale; // 3.0мм в пикселях

    // --- БЛОК 1: С0 ---
    if (step === 0) {
        tx = cx + radX595; ty = cy;
        drawTool(tx, ty, tz, "G00 X5.95 Y0.0 C0.0", "5.95", "0.00");
        setTimeout(() => { step = 1; }, 500);
    }
    else if (step === 1) {
        // Helix Ø2.4 с использованием фиксированного радиуса R0.2
        t += 0.02; if(t > 1) t = 1;
        let angle = (t * Math.PI * 2) - Math.PI/2;
        tx = cx + radX595; 
        ty = cy + Math.cos(angle) * rHoleOffset + rHoleOffset; 
        tz = 2.0 - (5.0 * t); if(tz < -3.0) tz = -3.0;
        
        if(tz <= 0) cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "G03 Y0.2 Z-3.0 R0.2", "5.95", ((ty-cy)/scale).toFixed(2));
        if(t === 1) { step = 2; t = 0; }
    }
    else if (step === 2) {
        // Движение фрезы к центру детали
        t += 0.02; if(t > 1) t = 1;
        tx = (cx + radX595) - (radX595 * t);
        ty = cy; tz = zDepth;
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "G01 X0.0 F150 (Паз)", (5.95*(1-t)).toFixed(2), "0.00");
        if(t === 1) { step = 3; }
    }
    else if (step === 3) {
        drawTool(cx, cy, 5.0, "G00 Z5.0", "0.00", "0.00");
        setTimeout(() => { step = 4; t = 0; }, 400);
    }
    // --- БЛОК 2: С180 ---
    else if (step === 4) {
        tx = cx - radX595; ty = cy;
        drawTool(tx, ty, 2.0, "G00 X5.95 Y0.0 C180.0", "5.95", "0.00");
        setTimeout(() => { step = 5; }, 500);
    }
    else if (step === 5) {
        t += 0.02; if(t > 1) t = 1;
        let angle = (t * Math.PI * 2) - Math.PI/2;
        tx = cx - radX595;
        ty = cy + Math.cos(angle) * rHoleOffset + rHoleOffset;
        tz = 2.0 - (5.0 * t); if(tz < -3.0) tz = -3.0;
        
        if(tz <= 0) cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "G03 Y0.2 Z-3.0 R0.2", "5.95", ((ty-cy)/scale).toFixed(2));
        if(t === 1) { step = 6; t = 0; }
    }
    else if (step === 6) {
        t += 0.02; if(t > 1) t = 1;
        tx = (cx - radX595) + (radX595 * t);
        ty = cy; tz = zDepth;
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "G01 X0.0", (-5.95*(1-t)).toFixed(2), "0.00");
        if(t === 1) { step = 7; }
    }
    else if (step === 7) {
        drawTool(cx, cy, 5.0, "G00 Z5.0", "0.00", "0.00");
        setTimeout(() => { step = 8; t = 0; }, 400);
    }
    // --- БЛОК 3: ЦЕНТР Ø8 ---
    else if (step === 8) {
        // Тройная спираль Helix до глубины Z-3 по фиксированному R3.0
        t += 0.008; if(t > 1) t = 1;
        let helixAngle = (t * Math.PI * 6) - Math.PI/2; 
        let dynRad = rCenterOffset * Math.min(t*3, 1);
        
        tx = cx;
        ty = cy + Math.cos(helixAngle) * dynRad + dynRad;
        tz = 0.0 - (Math.abs(zDepth) * t);
        
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "G03 Y3.0 Z-3.0 R3.0", "0.00", ((ty-cy)/scale).toFixed(2));
        if(t === 1) { step = 9; t = 0; }
    }
    else if (step === 9) {
        t += 0.02; if(t > 1) t = 1;
        let angle = (t * Math.PI * 2) - Math.PI/2;
        tx = cx;
        ty = cy + Math.cos(angle) * rCenterOffset + rCenterOffset;
        
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, zDepth, "G03 Y3.0 R3.0 (Чистовой круг)", "0.00", ((ty-cy)/scale).toFixed(2));
        if(t === 1) { step = 10; }
    }
    else if (step === 10) {
        drawTool(cx, cy, 20.0, "G00 Z20.0 (Цикл Завершен)", "0.00", "0.00");
        cancelAnimationFrame(animationId);
        return;
    }

    animationId = requestAnimationFrame(cycleEngine);
}

const startBtn = document.getElementById('startBtn');
const runEvent = () => {
    if(step === 0 || step === 10) {
        step = 0; t = 0; cuts = [];
        cycleEngine();
    }
};

startBtn.addEventListener('click', runEvent);
startBtn.addEventListener('touchstart', (e) => { e.preventDefault(); runEvent(); });

document.getElementById('resetBtn').addEventListener('click', () => {
    cancelAnimationFrame(animationId);
    step = 0; t = 0; cuts = [];
    drawPart();
    gcodeTxt.innerText = "G00 X5.95 Y0.0 Z2.0";
    axesTxt.innerText = "X: 5.95 Y: 0.00 Z: 2.0";
});

drawPart();
</script>
</body>
</html>
