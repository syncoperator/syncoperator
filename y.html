<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura CNC v2</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #1c1c1e;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
        }
        h2 { margin: 5px 0; color: #0a84ff; font-size: 1.1rem; text-align: center; }
        .info { font-size: 0.8rem; color: #aeaeb2; margin-bottom: 10px; text-align: center; }
        #canvasContainer {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 1;
            background: #2c2c2e;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        canvas { width: 100%; height: 100%; display: block; }
        .controls {
            margin-top: 12px;
            width: 100%;
            max-width: 340px;
            display: flex;
            gap: 10px;
        }
        button {
            flex: 1;
            background-color: #30d158;
            border: none;
            color: white;
            padding: 14px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(48,209,88,0.3);
        }
        button:active { background-color: #24a142; }
        #resetBtn { background-color: #ff453a; box-shadow: 0 2px 8px rgba(255,69,58,0.3); }
        #resetBtn:active { background-color: #d63629; }
        .hud {
            margin-top: 10px;
            font-family: monospace;
            font-size: 0.85rem;
            background: #2c2c2e;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            max-width: 320px;
            box-sizing: border-box;
            border: 1px solid #3a3a3c;
        }
        .hud-line { display: flex; justify-content: space-between; margin: 3px 0; }
        .val { color: #ffd60a; font-weight: bold; }
    </style>
</head>
<body>

    <h2>ЧПУ Симуляция: Пазы и Ø8</h2>
    <div class="info">Фреза Ø2.0 | Отверстия Ø2.4 на X5.95 + Паз до X0 + Центр Ø8</div>

    <div id="canvasContainer">
        <canvas id="cncCanvas" width="700" height="700"></canvas>
    </div>

    <div class="hud">
        <div class="hud-line"><span>Кадр:</span> <span id="gcode" class="val">G00 X5.95 Z2.0 C0</span></div>
        <div class="hud-line"><span>Позиция:</span> <span id="pos" class="val">X: 5.95, Z: 2.0</span></div>
    </div>

    <div class="controls">
        <button id="startBtn">СТАРТ</button>
        <button id="resetBtn">СБРОС</button>
    </div>

<script>
const canvas = document.getElementById('cncCanvas');
const ctx = canvas.getContext('2d');
const gcodeTxt = document.getElementById('gcode');
const posTxt = document.getElementById('pos');

const cx = 350, cy = 350;
const scale = 40; // Масштаб: 1мм = 40 пикселей

let animationId;
let step = 0;
let t = 0;
let cuts = [];

// Позиция эксцентрика X5.95 (в радиусах детали для отрисовки = 2.975мм)
const radX595 = 2.975 * scale;

function drawSetup() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Заготовка
    ctx.beginPath();
    ctx.arc(cx, cy, 7.5 * scale, 0, 2 * Math.PI);
    ctx.fillStyle = '#3a3a3c';
    ctx.fill();
    ctx.strokeStyle = '#48484a';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Сетка
    ctx.beginPath();
    ctx.moveTo(cx - 320, cy); ctx.lineTo(cx + 320, cy);
    ctx.moveTo(cx, cy - 320); ctx.lineTo(cx, cy + 320);
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Контуры требуемых отверстий
    // Левое и правое Ø2.4
    ctx.lineWidth = 2;
    ctx.strokeStyle = '#0a84ff';
    ctx.beginPath(); ctx.arc(cx + radX595, cy, (2.4/2)*scale, 0, 2*Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx - radX595, cy, (2.4/2)*scale, 0, 2*Math.PI); ctx.stroke();
    
    // Контур центрального Ø8
    ctx.strokeStyle = '#30d158';
    ctx.beginPath(); ctx.arc(cx, cy, (8.0/2)*scale, 0, 2*Math.PI); ctx.stroke();
}

function drawCuts() {
    ctx.fillStyle = '#1c1c1e';
    cuts.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, (2.0/2)*scale, 0, 2*Math.PI);
        ctx.fill();
    });
}

function drawTool(x, y, z, txtX, txtZ) {
    posTxt.innerText = `X: ${txtX}, Z: ${txtZ}`;
    ctx.beginPath();
    ctx.arc(x, y, (2.0/2)*scale, 0, 2 * Math.PI);
    // Меняем цвет фрезы в зависимости от глубины Z
    ctx.fillStyle = z <= -3 ? 'rgba(255, 69, 58, 0.7)' : 'rgba(255, 214, 10, 0.6)';
    ctx.fill();
    ctx.strokeStyle = '#ffd60a';
    ctx.lineWidth = 1.5;
    ctx.stroke();
}

function simulate() {
    drawSetup();
    drawCuts();

    let tx = cx, ty = cy, tz = 2.0;
    let dispX = "5.95", dispZ = "2.0";

    // СТОРОНА 1 (C0)
    if (step === 0) {
        gcodeTxt.innerText = "G00 X5.95 Z2.0 C0.0";
        tx = cx + radX595; ty = cy; tz = 2.0;
        drawTool(tx, ty, tz, "5.95", "2.0");
        setTimeout(() => { step = 1; }, 600);
    }
    else if (step === 1) {
        gcodeTxt.innerText = "G01 G41 X6.35 Z-3.0 (Helix)";
        t += 0.02; if(t > 1) t = 1;
        let angle = t * Math.PI * 2;
        let h_rad = 0.2 * scale * Math.min(t*2, 1); // Постепенное расширение до 0.2мм
        tx = (cx + radX595) + Math.cos(angle) * h_rad;
        ty = cy + Math.sin(angle) * h_rad;
        tz = 2.0 - (5.0 * t); if(tz < -3) tz = -3; // Вход в металл до Z-3
        
        if (tz <= 0) cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, (5.95 + (h_rad/scale)*2).toFixed(2), tz.toFixed(1));
        if(t === 1) { step = 2; t = 0; }
    }
    else if (step === 2) {
        gcodeTxt.innerText = "G01 X0.0 Z-3.0 (Фрезеровка к центру)";
        t += 0.02; if(t > 1) t = 1;
        // Движение от X5.95 (radX595) до X0 (cx)
        tx = (cx + radX595) - (radX595 * t);
        ty = cy; tz = -3.0;
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, (5.95 * (1 - t)).toFixed(2), "-3.0");
        if(t === 1) { step = 3; t = 0; }
    }
    else if (step === 3) {
        gcodeTxt.innerText = "G00 Z5.0 (Выход)";
        tx = cx; ty = cy; tz = 5.0;
        drawTool(tx, ty, tz, "0.0", "5.0");
        setTimeout(() => { step = 4; }, 500);
    }
    
    // СТОРОНА 2 (C180)
    else if (step === 4) {
        gcodeTxt.innerText = "G00 X5.95 Z2.0 C180.0";
        tx = cx - radX595; ty = cy; tz = 2.0;
        drawTool(tx, ty, tz, "5.95", "2.0");
        setTimeout(() => { step = 5; }, 600);
    }
    else if (step === 5) {
        gcodeTxt.innerText = "G01 G41 X6.35 Z-3.0 (Helix C180)";
        t += 0.02; if(t > 1) t = 1;
        let angle = t * Math.PI * 2;
        let h_rad = 0.2 * scale * Math.min(t*2, 1);
        tx = (cx - radX595) - Math.cos(angle) * h_rad;
        ty = cy - Math.sin(angle) * h_rad;
        tz = 2.0 - (5.0 * t); if(tz < -3) tz = -3;
        
        if (tz <= 0) cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, (5.95 + (h_rad/scale)*2).toFixed(2), tz.toFixed(1));
        if(t === 1) { step = 6; t = 0; }
    }
    else if (step === 6) {
        gcodeTxt.innerText = "G01 X0.0 Z-3.0 (Второй паз к центру)";
        t += 0.02; if(t > 1) t = 1;
        tx = (cx - radX595) + (radX595 * t);
        ty = cy; tz = -3.0;
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, (5.95 * (1 - t)).toFixed(2), "-3.0");
        if(t === 1) { step = 7; t = 0; }
    }
    else if (step === 7) {
        gcodeTxt.innerText = "G00 Z5.0 (Выход)";
        tx = cx; ty = cy; tz = 5.0;
        drawTool(tx, ty, tz, "0.0", "5.0");
        setTimeout(() => { step = 8; }, 500);
    }

    // ЦЕНТРАЛЬНАЯ ДЫРКА Ø8
    else if (step === 8) {
        gcodeTxt.innerText = "G01 G41 X4.0 Z-3.0 (Растачивание Ø8)";
        t += 0.01; if(t > 1) t = 1; // Медленнее для красивой спирали
        let angle = t * Math.PI * 8; // 4 полных оборота вниз
        let current_max_rad = 3.0 * scale; // Смещение радиуса инструмента (8-2)/2 = 3мм
        let dynamic_rad = current_max_rad * t;
        
        tx = cx + Math.cos(angle) * dynamic_rad;
        ty = cy + Math.sin(angle) * dynamic_rad;
        tz = 0 - (3.0 * t);
        
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, ((dynamic_rad/scale)*2 + 2).toFixed(2), tz.toFixed(1));
        if(t === 1) { step = 9; t = 0; }
    }
    else if (step === 9) {
        gcodeTxt.innerText = "G03 I-3.0 (Чистовой проход центра)";
        t += 0.02; if(t > 1) t = 1;
        let angle = t * Math.PI * 2;
        tx = cx + Math.cos(angle) * (3.0 * scale);
        ty = cy + Math.sin(angle) * (3.0 * scale);
        tz = -3.0;
        cuts.push({x: tx, y: ty});
        drawTool(tx, ty, tz, "8.00", "-3.0");
        if(t === 1) { step = 10; }
    }
    else if (step === 10) {
        gcodeTxt.innerText = "G01 G40 X0.0 Z20.0 (Конец цикла)";
        drawTool(cx, cy, 20, "0.0", "20.0");
        cancelAnimationFrame(animationId);
        return;
    }

    animationId = requestAnimationFrame(simulate);
}

const startBtn = document.getElementById('startBtn');
const triggerStart = () => { if(step === 0 || step === 10) { step = 0; t = 0; cuts = []; simulate(); } };
startBtn.addEventListener('click', triggerStart);
startBtn.addEventListener('touchstart', triggerStart);

document.getElementById('resetBtn').addEventListener('click', () => {
    cancelAnimationFrame(animationId);
    step = 0; t = 0; cuts = [];
    gcodeTxt.innerText = "G00 X5.95 Z2.0 C0";
    posTxt.innerText = "X: 5.95, Z: 2.0";
    drawSetup();
});

drawSetup();
</script>
</body>
</html>
