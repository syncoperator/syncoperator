<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tool Manager 230947</title>
    <style>
        body { font-family: 'Helvetica', sans-serif; background: #e0e0e0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        
        /* Основная карточка */
        .card {
            width: 320px;
            background: white;
            border: 4px solid #000; /* Жирные линии */
            padding: 0;
            box-shadow: 10px 10px 0px #000;
            position: relative;
        }

        .header {
            text-align: center;
            border-bottom: 4px solid #000;
            padding: 15px 5px;
        }

        .t-nr { font-size: 12px; color: #555; display: block; margin-bottom: 5px; }
        .title { font-size: 20px; font-weight: bold; text-transform: uppercase; line-height: 1.2; }

        .content { padding: 10px; }
        .section-h { font-size: 14px; font-weight: bold; text-decoration: underline; margin: 15px 0 8px 0; text-align: center; }

        /* Список с Drag & Drop */
        .tool-list { list-style: none; padding: 0; margin: 0; min-height: 50px; }
        .tool-item {
            border: 2px solid #000;
            margin-bottom: 6px;
            padding: 8px;
            background: #fff;
            cursor: grab;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }
        .tool-item:active { cursor: grabbing; }
        .tool-item.dragging { opacity: 0.5; background: #ffffee; border-style: dashed; }

        /* Кнопки управления */
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn { 
            padding: 10px 15px; 
            border: 2px solid #000; 
            background: #fff; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 4px 4px 0px #000;
        }
        .btn:active { box-shadow: 0px 0px 0px #000; transform: translate(2px, 2px); }

        .footer-pad { height: 60px; } /* Твой padding-bottom чтобы не перекрывало */
    </style>
</head>
<body>

    <div class="card" id="print-area">
        <div class="header">
            <span class="t-nr">T-230947</span>
            <div class="title">EINSCHRAUBNIPPEL<br>DN10</div>
        </div>

        <div class="content">
            <div class="section-h">IN BLAUKISTE (SONDER)</div>
            <ul class="tool-list" id="sonder-list">
                <li class="tool-item" draggable="true">Musterteil 230947</li>
                <li class="tool-item" draggable="true">Greifbacken 18-25</li>
                <li class="tool-item" draggable="true">T1212 - Kugelfräser D10</li>
            </ul>

            <div class="section-h">IN SCHUBLADEN (STANDART)</div>
            <ul class="tool-list" id="standart-list">
                <li class="tool-item" draggable="true">T0101 - Kopierst. R0.8</li>
                <li class="tool-item" draggable="true">T0707 - Drehbohrer D18</li>
                <li class="tool-item" draggable="true">T0303 - Gewinde M29x1.5</li>
            </ul>
            <div class="footer-pad"></div>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="exportJSON()">JSON EXPORT</button>
        <button class="btn" onclick="importJSON()">JSON IMPORT</button>
        <button class="btn" onclick="window.print()">PRINT PDF</button>
    </div>

<script>
    // Logic for Drag & Drop
    const lists = document.querySelectorAll('.tool-list');
    lists.forEach(list => {
        list.addEventListener('dragstart', e => e.target.classList.add('dragging'));
        list.addEventListener('dragend', e => e.target.classList.remove('dragging'));
        list.addEventListener('dragover', e => {
            e.preventDefault();
            const afterElement = getDragAfterElement(list, e.clientY);
            const draggable = document.querySelector('.dragging');
            if (afterElement == null) {
                list.appendChild(draggable);
            } else {
                list.insertBefore(draggable, afterElement);
            }
        });
    });

    function getDragAfterElement(container, y) {
        const draggableElements = [...container.querySelectorAll('.tool-item:not(.dragging)')];
        return draggableElements.reduce((closest, child) => {
            const box = child.getBoundingClientRect();
            const offset = y - box.top - box.height / 2;
            if (offset < 0 && offset > closest.offset) {
                return { offset: offset, element: child };
            } else { return closest; }
        }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // JSON Data Management
    function exportJSON() {
        const data = {
            id: "230947",
            sonder: [...document.querySelectorAll('#sonder-list li')].map(el => el.innerText),
            standart: [...document.querySelectorAll('#standart-list li')].map(el => el.innerText)
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `tool_data_${data.id}.json`;
        a.click();
    }

    function importJSON() {
        const input = document.createElement('input');
        input.type = 'file';
        input.onchange = e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = event => {
                const data = JSON.parse(event.target.result);
                // Здесь можно добавить логику перерисовки списка из JSON
                alert("Data for " + data.id + " loaded!");
            };
            reader.readAsText(file);
        };
        input.click();
    }
</script>
</body>
</html>
