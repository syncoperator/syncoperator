<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Einrichteblatt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="./einrichte.css" />
  <script defer src="./einrichte.js"></script>
</head>

<body>
  <main class="sheet">

    <header class="sheet-header">
      <div class="header-left">
        <h1>Einrichteblatt</h1>
        <div class="meta">
          <label>
            Zeichnungsnummer:
            <input id="drawingNo" placeholder="z.B. 231850 Gehäuse" />
          </label>
        </div>
      </div>

      <div class="header-right">
        <button id="printBtn">Drucken (Querformat)</button>
      </div>
    </header>

    <section class="channels">

      <!-- KANAL 1 -->
      <div class="channel channel-k1">
        <h2>Kanal 1 · Revolver oben</h2>

        <table>
          <thead>
            <tr>
              <th>Drucken</th>
              <th>T</th>
              <th>Werkzeug</th>
            </tr>
          </thead>
          <tbody id="kanal1">
            <!-- DEMO -->
          </tbody>
        </table>
      </div>

      <!-- KANAL 2 -->
      <div class="channel channel-k2">
        <h2>Kanal 2 · Revolver unten</h2>

        <table>
          <thead>
            <tr>
              <th>Drucken</th>
              <th>T</th>
              <th>Werkzeug</th>
            </tr>
          </thead>
          <tbody id="kanal2">
            <!-- DEMO -->
          </tbody>
        </table>
      </div>

    </section>

  </main>
</body>
</html>
