<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Einrichteblatt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="./einrichte.css">
</head>
<body>

<div class="page">

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <div class="brand">
        <div class="brand-mark">C</div>
        <div class="brand-text">
          <div class="brand-title">EINRICHTEBLATT</div>
          <div class="brand-sub">SyncOperator · Werkzeugübersicht</div>
        </div>
      </div>
    </div>

    <div class="header-right">
      <div class="meta-field">
        <label>Zeichnungsnummer</label>
        <input id="drawingNumber" type="text" value="231850 Gehäuse">
      </div>
      <div class="meta-field">
        <label>Datum</label>
        <input id="dateField" type="text">
      </div>
    </div>
  </header>

  <!-- ACTION BAR -->
  <section class="actions">
    <button id="printAll">Alles drucken</button>
    <button id="printNone">Nichts drucken</button>
    <button id="printBtn" class="primary">Drucken / PDF</button>
  </section>

  <!-- MAIN -->
  <main class="kanal-grid">

    <!-- KANAL 1 -->
    <section class="kanal kanal-1">
      <div class="kanal-header">
        Kanal 1 · Revolver oben
      </div>

      <table class="tool-table">
        <thead>
          <tr>
            <th>Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody id="kanal1Body"></tbody>
      </table>
    </section>

    <!-- KANAL 2 -->
    <section class="kanal kanal-2">
      <div class="kanal-header">
        Kanal 2 · Revolver unten
      </div>

      <table class="tool-table">
        <thead>
          <tr>
            <th>Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody id="kanal2Body"></tbody>
      </table>
    </section>

  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div>CitiTool · SyncOperator</div>
    <div>Einrichteblatt · Querformat</div>
  </footer>

</div>

<script src="./einrichte.js"></script>
</body>
</html>
