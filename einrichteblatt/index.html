<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einrichteblatt</title>
  <link rel="stylesheet" href="./einrichte.css" />
  <script defer src="./einrichte.js"></script>
</head>

<body>
  <div class="page">

    <!-- HEADER -->
    <header class="doc-header">
      <div class="doc-title">Einrichteblatt</div>

      <div class="doc-meta">
        <label>
          Zeichnungsnummer:
          <input id="drawingNo" type="text" placeholder="z.B. 231850 Gehäuse" />
        </label>

        <button id="printBtn">Drucken (Querformat)</button>
      </div>
    </header>

    <!-- CONTENT -->
    <main class="doc-content">

      <section class="kanal kanal-1">
        <h2>Kanal 1</h2>
        <table>
          <thead>
            <tr>
              <th>T</th>
              <th>Werkzeug</th>
              <th>Drucken</th>
            </tr>
          </thead>
          <tbody id="kanal1Body"></tbody>
        </table>
      </section>

      <section class="kanal kanal-2">
        <h2>Kanal 2</h2>
        <table>
          <thead>
            <tr>
              <th>T</th>
              <th>Werkzeug</th>
              <th>Drucken</th>
            </tr>
          </thead>
          <tbody id="kanal2Body"></tbody>
        </table>
      </section>

    </main>

  </div>
</body>
</html>
