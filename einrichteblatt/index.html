<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Einrichteblatt</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="./einrichte.css" />
  <script defer src="./einrichte.js"></script>
</head>

<body>
  <header class="sheet-header">
    <div class="header-left">
      <h1>Einrichteblatt</h1>
      <label class="drawing-input">
        Zeichnungsnummer:
        <input id="drawingNumber" type="text" placeholder="z.B. 231850 Gehäuse">
      </label>
    </div>

    <div class="header-right">
      <button id="printBtn">Drucken (Querformat)</button>
    </div>
  </header>

  <main class="sheet-content">
    <section class="kanal">
      <h2 class="kanal-title kanal1">Kanal 1 · Revolver oben</h2>
      <table>
        <thead>
          <tr>
            <th>Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody id="kanal1Body"></tbody>
      </table>
    </section>

    <section class="kanal">
      <h2 class="kanal-title kanal2">Kanal 2 · Revolver unten</h2>
      <table>
        <thead>
          <tr>
            <th>Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody id="kanal2Body"></tbody>
      </table>
    </section>
  </main>
</body>
</html>
