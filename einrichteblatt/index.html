<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Einrichteblatt</title>
  <link rel="stylesheet" href="./einrichte.css" />
</head>

<body>

<main class="page">

  <!-- HEADER -->
  <header class="header">
    <h1>Einrichteblatt</h1>

    <div class="meta">
      <label>
        Zeichnungsnummer:
        <input type="text" placeholder="z.B. 231850 Gehäuse">
      </label>

      <button onclick="window.print()">Drucken (Querformat)</button>
    </div>
  </header>

  <!-- CONTENT -->
  <section class="kanal-grid">

    <!-- KANAL 1 -->
    <article class="kanal kanal-1">
      <h2>Kanal 1 · Revolver oben</h2>

      <table>
        <thead>
          <tr>
            <th class="print-col">Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="print-col"><input type="checkbox" checked></td>
            <td>T0101</td>
            <td>Planen / Vordrehen</td>
          </tr>
          <tr>
            <td class="print-col"><input type="checkbox" checked></td>
            <td>T0202</td>
            <td>Außen Schlichten</td>
          </tr>
          <tr>
            <td class="print-col"><input type="checkbox"></td>
            <td>T0303</td>
            <td>Bohren Ø12.5</td>
          </tr>
        </tbody>
      </table>
    </article>

    <!-- KANAL 2 -->
    <article class="kanal kanal-2">
      <h2>Kanal 2 · Revolver unten</h2>

      <table>
        <thead>
          <tr>
            <th class="print-col">Drucken</th>
            <th>T</th>
            <th>Werkzeug</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td class="print-col"><input type="checkbox" checked></td>
            <td>T1101</td>
            <td>Planen / Vordrehen</td>
          </tr>
          <tr>
            <td class="print-col"><input type="checkbox" checked></td>
            <td>T1202</td>
            <td>Innen Schlichten</td>
          </tr>
          <tr>
            <td class="print-col"><input type="checkbox"></td>
            <td>T1303</td>
            <td>Abstechen</td>
          </tr>
        </tbody>
      </table>
    </article>

  </section>

</main>

</body>
</html>
