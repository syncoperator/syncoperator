<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CitiTool · MPF Visual v4</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff; --bg-soft:#FAFAFA; --bg-2:#F5F5F5; --bg-3:#EFEFEF; --line:#E5E5E5; --line-2:#D4D4D4; --line-3:#A3A3A3;
  --ink:#0A0A0A; --ink-2:#262626; --ink-3:#525252; --ink-4:#737373; --ink-5:#A3A3A3;
  --sp4:#2D6B47; --sp4-bg:#EAF6EE; --sp4-bd:#B5DEC7;
  --sp3:#2D4F8A; --sp3-bg:#E8EFF8; --sp3-bd:#B8CEEA;
  --amber:#92500D; --amber-bg:#FBF1E0; --amber-bd:#E8C896;
  --danger:#B91C1C; --danger-bg:#FEF2F2;
  --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace;
  --r:6px; --r-sm:4px; --t:.14s ease;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{font-family:var(--sans);background:var(--bg-soft);color:var(--ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;}

/* ===== SPLASH / GATE ===== */
.splash{position:fixed;inset:0;z-index:2000;background:radial-gradient(circle at 50% 40%,#1a1a1a 0%,#0a0a0a 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s ease,visibility .5s ease;}
.splash.hide{opacity:0;visibility:hidden;}
.logo-xl{width:120px;height:120px;position:relative;}
.logo-xl svg{width:100%;height:100%;}
.spin-slow{transform-origin:50% 50%;animation:spin 8s linear infinite;}
.spin-rev{transform-origin:50% 50%;animation:spin 5s linear infinite reverse;}
@keyframes spin{to{transform:rotate(360deg);}}
.splash-name{font-size:26px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#fff;}
.splash-name span{color:#9ca3af;}
.splash-sub{font-family:var(--mono);font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:#6b7280;margin-top:-18px;}
.gate{margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:14px;}
.gate-label{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9ca3af;}
.pin{display:flex;gap:10px;}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid #4b5563;transition:.15s;}
.pin-dot.on{background:#fff;border-color:#fff;}
.keys{display:grid;grid-template-columns:repeat(3,64px);gap:12px;margin-top:6px;}
.key{height:64px;border-radius:14px;border:1px solid #2a2a2a;background:#161616;color:#fff;font-family:var(--mono);font-size:24px;font-weight:600;cursor:pointer;transition:.1s;display:flex;align-items:center;justify-content:center;}
.key:hover{background:#222;}
.key:active{transform:scale(.94);background:#2c2c2c;}
.key.wide{grid-column:span 1;font-size:14px;}
.key.empty{visibility:hidden;}
.gate.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-12px);}40%{transform:translateX(11px);}60%{transform:translateX(-8px);}80%{transform:translateX(6px);}}
.gate-hint{font-family:var(--mono);font-size:10px;color:#6b7280;height:14px;}

/* ===== APP shell hidden until unlocked ===== */
.app{display:none;}
.app.ready{display:block;}

.header{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:60;}
.burger{width:38px;height:38px;border:1px solid var(--line-2);border-radius:var(--r);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--ink-3);flex-shrink:0;}
.burger:hover{background:var(--bg-2);color:var(--ink);}
.burger svg{width:18px;height:18px;}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;}
.logo-sm{width:36px;height:36px;}
.logo-sm svg{width:100%;height:100%;}
.brand-text{display:flex;flex-direction:column;line-height:1;gap:2px;}
.brand-name{font-size:14px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;}
.brand-name span{color:var(--ink-4);}
.brand-sub{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--ink-4);letter-spacing:.1em;text-transform:uppercase;}
.hd-spacer{flex:1;}
.hd-meta{display:flex;gap:18px;}
.hd-field{display:flex;flex-direction:column;gap:3px;}
.hd-label{font-family:var(--mono);font-size:9px;font-weight:500;color:var(--ink-4);text-transform:uppercase;letter-spacing:.12em;}
.hd-input{border:1px solid var(--line);border-radius:var(--r-sm);padding:5px 9px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--ink);width:120px;}
.hd-input.mono{font-family:var(--mono);font-weight:500;width:100px;}
.hd-input:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 2px rgba(0,0,0,.06);}
@media(max-width:680px){ .hd-meta{display:none;} }

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;opacity:0;visibility:hidden;transition:var(--t);}
.scrim.open{opacity:1;visibility:visible;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:300px;max-width:84vw;background:#fff;border-right:1px solid var(--line);z-index:91;transform:translateX(-100%);transition:transform var(--t);display:flex;flex-direction:column;box-shadow:0 0 40px rgba(0,0,0,.12);}
.drawer.open{transform:translateX(0);}
.dr-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px;}
.dr-head .brand-name{font-size:13px;}
.dr-x{margin-left:auto;width:30px;height:30px;border:none;background:transparent;cursor:pointer;color:var(--ink-3);font-size:17px;border-radius:var(--r-sm);}
.dr-x:hover{background:var(--bg-2);}
.dr-list{flex:1;overflow-y:auto;padding:8px 0;}
.dr-sec{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-5);padding:14px 18px 6px;}
.dr-group{}
.dr-item{display:flex;align-items:center;gap:11px;padding:11px 18px;cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:500;transition:background var(--t);}
.dr-item:hover{background:var(--bg-soft);}
.dr-item svg{width:17px;height:17px;color:var(--ink-4);flex-shrink:0;}
.dr-item .di-main{flex:1;}
/* hover-reveal Drucken */
.dr-sub-row{display:flex;gap:6px;padding:0 18px 0 46px;max-height:0;overflow:hidden;opacity:0;transition:max-height var(--t),opacity var(--t),padding var(--t);}
.dr-group:hover .dr-sub-row{max-height:48px;opacity:1;padding:2px 18px 9px 46px;}
.dr-chip{font-family:var(--mono);font-size:10.5px;font-weight:600;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:5px 11px;cursor:pointer;background:#fff;}
.dr-chip:hover{border-color:var(--ink);color:var(--ink);}

.main{padding:16px 18px 90px;}
.wrap{max-width:1400px;margin:0 auto;}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 14px;border-radius:var(--r);border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:var(--t);}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line-2);}
.btn.ghost:hover{background:var(--bg-2);}
.btn svg{width:14px;height:14px;}
.btn:active{transform:translateY(1px);}
.bar-spacer{flex:1;}
.modeseg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:3px;}
.modeseg button{border:none;background:transparent;color:var(--ink-4);font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 15px;cursor:pointer;border-radius:var(--r-sm);transition:var(--t);display:flex;align-items:center;gap:7px;}
.modeseg button .mf{font-family:var(--mono);font-size:10px;opacity:.65;}
.modeseg button.on{background:var(--ink);color:#fff;}
.modeseg button.on .mf{opacity:.8;}
.cols{display:grid;gap:16px;align-items:start;}
.cols.single{grid-template-columns:minmax(0,760px);}
.cols.split{grid-template-columns:1fr 1fr;}
@media(max-width:820px){ .cols.split{grid-template-columns:1fr;} }
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;}
.panel-head{padding:11px 14px;border-bottom:1px solid var(--line);background:var(--bg-soft);display:flex;align-items:center;gap:10px;}
.panel-tag{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-4);}
.panel-title{font-size:13px;font-weight:600;}
.panel-head .sp{flex:1;}
.lane-legend{display:flex;gap:14px;padding:10px 14px 0;flex-wrap:wrap;}
.lane-legend .ll{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-3);}
.ll .dot{width:11px;height:11px;border-radius:3px;}
.dot-sp4{background:var(--sp4);} .dot-sp3{background:var(--sp3);}
.chain{padding:12px 14px 16px;display:flex;flex-direction:column;}
.endcap{margin-left:62px;padding:5px 12px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);}
.step{position:relative;display:flex;}
.step.dragging{opacity:.4;}
.step.drag-over .card{box-shadow:inset 0 2px 0 var(--ink),inset 0 -2px 0 var(--ink);}
.step-rail{flex:0 0 56px;display:flex;flex-direction:column;align-items:center;}
.rail-line{width:2px;flex:1;background:var(--line-2);}
.rail-line.top,.rail-line.bot{min-height:8px;}
.rail-node{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;font-weight:700;color:#fff;flex-shrink:0;z-index:1;box-shadow:0 2px 6px rgba(0,0,0,.12);}
.rail-node.sp4{background:var(--sp4);}
.rail-node.sp3{background:var(--sp3);}
.step:first-child .rail-line.top{background:transparent;}
.step.laststep .rail-line.bot{background:transparent;}
.card{flex:1;margin-left:8px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:#fff;transition:box-shadow var(--t),border-color var(--t);position:relative;}
.card.sp4{border-left:3px solid var(--sp4);}
.card.sp3{border-left:3px solid var(--sp3);}
.card:hover{border-color:var(--line-3);}
.card.hl{box-shadow:0 0 0 2px var(--ink);border-color:var(--ink);}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
.drag-handle{cursor:grab;color:var(--ink-5);font-size:13px;width:16px;text-align:center;flex-shrink:0;user-select:none;}
.card-state{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-4);background:var(--bg-2);border:1px solid var(--line-2);border-radius:3px;padding:1px 6px;}
.card-title{font-weight:600;font-size:13px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.card-lcode{font-family:var(--mono);font-size:10.5px;font-weight:600;background:var(--bg-2);border:1px solid var(--line-2);padding:1px 6px;border-radius:3px;}
.card-sp{font-family:var(--mono);font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;}
.sp-badge4{background:var(--sp4-bg);color:var(--sp4);border:1px solid var(--sp4-bd);}
.sp-badge3{background:var(--sp3-bg);color:var(--sp3);border:1px solid var(--sp3-bd);}
.card-tool{font-family:var(--mono);font-size:9px;font-weight:600;padding:2px 6px;border-radius:3px;background:#fff;border:1px solid var(--line-2);color:var(--ink-3);}
.card-edit{width:26px;height:24px;border:1px solid var(--line-2);background:#fff;border-radius:5px;cursor:pointer;color:var(--ink-4);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--t);}
.card-edit svg{width:14px;height:14px;}
.card-edit:hover{background:var(--ink);color:#fff;border-color:var(--ink);transform:rotate(-8deg);}
/* card entrance animation */
@keyframes cardIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
.step .card{animation:cardIn .22s ease both;}
.rail-node{transition:transform var(--t),box-shadow var(--t);}
.card.hl .rail-node,.step:hover .rail-node{transform:scale(1.08);}
.card{transition:box-shadow var(--t),border-color var(--t),transform var(--t);}
.card:hover{transform:translateX(2px);}
.modal{animation:modalIn .2s ease both;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}
.ho-badge{animation:cardIn .3s ease both;}
.flow{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;flex-wrap:wrap;cursor:pointer;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:4px;font-weight:600;white-space:nowrap;}
.chip-if{background:var(--bg-2);border:1px solid var(--line-2);color:var(--ink);}
.chip-reg3{color:var(--sp3);} .chip-reg4{color:var(--sp4);}
.chip-set{border:1px solid;}
.chip-set.r4{background:var(--sp4-bg);border-color:var(--sp4-bd);color:var(--sp4);}
.chip-set.r3{background:var(--sp3-bg);border-color:var(--sp3-bd);color:var(--sp3);}
.flow .arr{color:var(--ink-5);font-size:13px;}
.flow .val{font-weight:700;}
.chip-fertig{color:var(--amber);border:1px solid var(--amber-bd);background:var(--amber-bg);}
.card-foot{display:flex;align-items:center;gap:8px;margin-top:8px;}
.card-waitm{font-family:var(--mono);font-size:9.5px;color:var(--ink-5);flex:1;}
.card-mv{display:flex;gap:3px;}
.mv-btn{width:24px;height:22px;border:1px solid var(--line-2);background:#fff;border-radius:4px;cursor:pointer;color:var(--ink-3);font-size:10px;}
.mv-btn:hover{background:var(--bg-2);}
.mv-btn:disabled{opacity:.25;}
.handoff-row{display:flex;height:20px;}
.handoff-row .ho-rail{flex:0 0 56px;display:flex;justify-content:center;align-items:center;}
.ho-badge{font-family:var(--mono);font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:10px;background:var(--amber-bg);border:1px solid var(--amber-bd);color:var(--amber);white-space:nowrap;}
.add-card{margin-left:62px;margin-top:4px;border:1px dashed var(--line-2);border-radius:var(--r);background:transparent;color:var(--ink-4);font-family:var(--mono);font-size:11px;padding:9px;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;width:calc(100% - 62px);transition:var(--t);}
.add-card:hover{border-color:var(--ink);color:var(--ink);}
.empty-note{padding:28px 14px;text-align:center;color:var(--ink-5);font-family:var(--mono);font-size:11px;}
.fab{position:fixed;right:20px;bottom:20px;z-index:80;background:var(--ink);color:#fff;border:none;border-radius:30px;padding:13px 20px;font-family:var(--sans);font-size:13px;font-weight:600;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;}
.fab svg{width:16px;height:16px;}
.fab:active{transform:translateY(1px);}
.ov{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(0,0,0,.4);}
.ov.open{display:flex;}
.modal{background:#fff;border:1px solid var(--line-2);border-radius:var(--r);width:100%;max-width:560px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.18);}
.modal.wide{max-width:1100px;}
.modal-head{padding:16px 20px 13px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px;}
.mh-tag{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--ink-4);letter-spacing:.14em;text-transform:uppercase;}
.mh-title{font-size:16px;font-weight:600;margin-top:3px;}
.mh-x{margin-left:auto;width:30px;height:30px;border:none;background:transparent;cursor:pointer;color:var(--ink-3);border-radius:var(--r-sm);font-size:18px;}
.mh-x:hover{background:var(--bg-2);color:var(--ink);}
.modal-body{padding:18px 20px;overflow:auto;flex:1;}
.modal-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;background:var(--bg-soft);}
.frow{display:flex;gap:12px;margin-bottom:14px;}
.frow:last-child{margin-bottom:0;}
.fg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
.fg.narrow{flex:0 0 150px;}
.fg.tiny{flex:0 0 70px;}
.flabel{font-family:var(--mono);font-size:9.5px;font-weight:500;color:var(--ink-4);letter-spacing:.12em;text-transform:uppercase;}
.finput,.fselect{background:#fff;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:9px 12px;font-family:var(--sans);font-size:13px;color:var(--ink);width:100%;transition:var(--t);}
.finput.mono{font-family:var(--mono);}
.finput:focus,.fselect:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(0,0,0,.06);}
.fselect{appearance:none;cursor:pointer;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23525252' stroke-width='1.5' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}
.waitm-grid{display:flex;align-items:center;gap:6px;}
.waitm-grid .wm-paren{font-family:var(--mono);font-size:15px;color:var(--ink-4);}
.waitm-grid .finput{text-align:center;}
.toggle{display:inline-flex;align-items:center;gap:10px;padding:9px 14px;background:#fff;border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer;user-select:none;font-size:12.5px;font-weight:500;color:var(--ink-2);}
.toggle.on{background:var(--ink);border-color:var(--ink);color:#fff;}
.ttrack{width:32px;height:18px;background:var(--bg-3);border-radius:99px;position:relative;transition:var(--t);}
.toggle.on .ttrack{background:#fff;}
.tthumb{position:absolute;top:2px;left:2px;width:14px;height:14px;background:var(--ink-4);border-radius:50%;transition:var(--t);}
.toggle.on .tthumb{transform:translateX(14px);background:var(--ink);}
.code-tabs{display:flex;gap:0;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;margin-bottom:12px;width:max-content;}
.code-tabs button{border:none;border-right:1px solid var(--line);background:#fff;color:var(--ink-4);font-family:var(--sans);font-size:12px;font-weight:600;padding:8px 16px;cursor:pointer;}
.code-tabs button:last-child{border-right:none;}
.code-tabs button.on{background:var(--ink);color:#fff;}
.code-info{font-family:var(--mono);font-size:10.5px;color:var(--ink-4);padding:7px 11px;background:var(--bg-2);border-radius:var(--r-sm);margin-bottom:10px;}
.code-grid{display:grid;gap:12px;}
.code-grid.dual{grid-template-columns:1fr 1fr;}
@media(max-width:820px){.code-grid.dual{grid-template-columns:1fr;}}
pre.code{margin:0;background:#0d0d0d;color:#e5e5e5;padding:13px;font-family:var(--mono);font-size:10.5px;line-height:1.55;overflow:auto;max-height:60vh;white-space:pre;border-radius:var(--r-sm);}
.codepanel pre.code{max-height:none;}
pre.code .ln{display:block;padding:0 4px;border-radius:2px;}
pre.code .ln.if{color:#9ece6a;}
pre.code .ln.set{color:#7aa2f7;}
pre.code .ln.code{color:#e0af68;}
pre.code .ln.grp{color:#bb9af7;}
pre.code .ln.cmt{color:#565f89;}
pre.code .ln.mark{color:#f7768e;}
pre.code .ln.hlrow{background:rgba(255,255,255,.10);}
.code-col-head{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink-4);margin-bottom:6px;letter-spacing:.06em;}
</style>
</head>
<body>

<!-- SPLASH + GATE -->
<div class="splash" id="splash">
  <div class="logo-xl">
    <svg viewBox="0 0 100 100" fill="none">
      <defs>
        <linearGradient id="lgMark" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2c2c2c"/><stop offset="1" stop-color="#000"/>
        </linearGradient>
        <linearGradient id="lgRing" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#cfcfcf"/>
        </linearGradient>
      </defs>
      <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#lgMark)" stroke="#3a3a3a" stroke-width="1"/>
      <g class="spin-slow">
        <circle cx="50" cy="50" r="27" stroke="url(#lgRing)" stroke-width="6" stroke-linecap="round" stroke-dasharray="127 43" fill="none"/>
      </g>
      <circle cx="50" cy="50" r="6.5" fill="#fff"/>
    </svg>
  </div>

<script>
/* ===== GATE ===== */
(function(){
  const CODE='3504';let buf='';
  const dots=()=>document.querySelectorAll('#pin .pin-dot');
  function upd(){dots().forEach((d,i)=>d.classList.toggle('on',i<buf.length));}
  function ok(){document.getElementById('splash').classList.add('hide');document.getElementById('app').classList.add('ready');setTimeout(()=>{try{boot();}catch(e){console.error(e);}},60);}
  function fail(){const g=document.getElementById('gate');g.classList.add('shake');document.getElementById('gateHint').textContent='Falscher Code';setTimeout(()=>{g.classList.remove('shake');buf='';upd();document.getElementById('gateHint').textContent='';},500);}
  function push(d){if(buf.length>=4)return;buf+=d;upd();if(buf.length===4){setTimeout(()=>{if(buf===CODE)ok();else fail();},150);}}
  function del(){buf=buf.slice(0,-1);upd();}
  document.getElementById('keys').addEventListener('click',e=>{const k=e.target.closest('.key');if(!k)return;if(k.dataset.act==='del')del();else if(k.dataset.d!==undefined)push(k.dataset.d);});
  document.addEventListener('keydown',e=>{if(document.getElementById('splash').classList.contains('hide'))return;if(/^[0-9]$/.test(e.key))push(e.key);else if(e.key==='Backspace')del();});
})();

/* ===== MODEL ===== */
function codeState(c){const m=String(c||'').match(/(\d+)/);const d=m?m[1]:'';if(!d)return 0;return d.length<=3?(parseInt(d,10)||0):parseInt(d.slice(1),10);}
function digits(c){const m=String(c||'').match(/(\d+)/);return m?m[1]:'';}
function genUUID(){let d=Date.now();return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,ch=>{const r=(d+Math.random()*16)%16|0;d=Math.floor(d/16);return (ch==='x'?r:(r&0x3|0x8)).toString(16);});}
function slotEmpty(s){return !s || (!s.code && !s.title);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
const CATS=['Außen','Innen','Radial','Axial'];
let DATA, mode='sync';
const UUID={'1':genUUID(),'2':genUUID()};
function sampleData(){return{
  '1':[
    {code:'L1101',title:'Schruppen Außen',spindle:'SP4',category:'Außen',doppel:false,tno:'T01',tname:'Schrupper',w1:1,w2:1,w3:2},
    {code:'L1102',title:'Schlichten Außen',spindle:'SP3',category:'Außen',doppel:false,tno:'T02',tname:'Schlichter',w1:2,w2:1,w3:2},
    {code:'L1103',title:'Leer',spindle:'SP4',category:'Außen',doppel:false,tno:'',tname:'',w1:3,w2:1,w3:2},
    {code:'L1104',title:'Gewinde',spindle:'SP4',category:'Innen',doppel:false,tno:'T13',tname:'Gewindebohrer',w1:4,w2:1,w3:2},
  ],
  '2':[
    {code:'L2101',title:'Schruppen Außen',spindle:'SP4',category:'Außen',doppel:false,tno:'T03',tname:'Schrupper',w1:1,w2:1,w3:2},
    {code:'L2102',title:'Bohren D20',spindle:'SP4',category:'Innen',doppel:false,tno:'T04',tname:'Bohrer D20',w1:2,w2:1,w3:2},
    {code:'L2103',title:'Einstechen',spindle:'SP3',category:'Radial',doppel:true,tno:'T05',tname:'Stechschwert',w1:3,w2:1,w3:2},
    {code:'L2104',title:'Schlichten Außen',spindle:'SP4',category:'Außen',doppel:false,tno:'T06',tname:'Schlichter',w1:4,w2:1,w3:2},
  ],
};}
function recode(k){const p=(k==='2')?'L21':'L11';DATA[k].forEach((s,i)=>{if(s)s.code=p+String(i+1).padStart(2,'0');});}
function steps(k){
  const a=DATA[k].filter(s=>!slotEmpty(s));
  return a.map((s,i)=>{
    const ifReg=s.spindle==='SP3'?'RG703':'RG704';
    const ifVal=(i===0)?1:codeState(s.code);
    const last=i===a.length-1;
    const nextSp=last?s.spindle:a[i+1].spindle;
    const assignReg=last?ifReg:(nextSp==='SP3'?'RG703':'RG704');
    const assignVal=last?2:codeState(a[i+1].code);
    return Object.assign({},s,{idx:DATA[k].indexOf(s),pos:i+1,state:codeState(s.code),ifReg,ifVal,assignReg,assignVal,last,handoff:!last&&s.spindle!==nextSp});
  });
}
function wmv(s,key,def){return (s[key]!==undefined&&s[key]!=='')?s[key]:def;}
function buildBlock(k){
  let out='';
  steps(k).forEach(s=>{
    const num=String(s.pos).padStart(3,'0');
    const sp=s.spindle==='SP3'?2:1;
    const w1=wmv(s,'w1',s.pos),w2=wmv(s,'w2',1),w3=wmv(s,'w3',2);
    out+='GROUP_BEGIN(0,"'+num+': '+(s.title||s.code).toUpperCase()+'",'+sp+',0)\n;Id='+UUID[k]+'\nWAITM('+w1+','+w2+','+w3+')\nSTOPRE\nIF '+s.ifReg+'=='+s.ifVal+'\n '+s.code+'\n STOPRE\n '+s.assignReg+'='+s.assignVal+'\nELSE\n ;DUMMY("'+digits(s.code)+'")\nENDIF\nGROUP_END(0,'+sp+')\n';
  });
  return out;
}
/* wrap with markers */
function buildFile(k){
  const block=buildBlock(k);
  return ';****************************************\n; ###_GENERATED_CODE_START_###\n'+block+'; ###_GENERATED_CODE_END_###\n;****************************************\n';
}
/* ===== SCHEMA ===== */
function chainHTML(k){
  const st=steps(k);
  if(!st.length) return '<div class="empty-note">Keine belegten Slots<br>— unten „+ Slot" —</div>';
  let h='<div class="endcap">▼ Rohteil — '+st[0].ifReg+'==1</div>';
  st.forEach(s=>{
    const spCls=s.spindle==='SP3'?'sp3':'sp4';
    const setCls=s.assignReg==='RG703'?'r3':'r4';
    const ifRegCls=s.ifReg==='RG703'?'chip-reg3':'chip-reg4';
    const posLbl=String(s.pos).padStart(2,'0');
    const last2=st[st.length-1];
    h+='<div class="step '+(s.last?'laststep':'')+'" draggable="true" data-k="'+k+'" data-idx="'+s.idx+'" data-pos="'+s.pos+'">'
      +'<div class="step-rail"><div class="rail-line top"></div><div class="rail-node '+spCls+'">'+posLbl+'</div><div class="rail-line bot"></div></div>'
      +'<div class="card '+spCls+'" data-k="'+k+'" data-idx="'+s.idx+'" data-pos="'+s.pos+'">'
        +'<div class="card-top">'
          +'<span class="drag-handle" title="Ziehen">⠿</span>'
          +'<span class="card-state">'+s.state+'</span>'
          +'<span class="card-title" data-edit="'+k+':'+s.idx+'">'+esc(s.title||s.code)+'</span>'
          +(s.tno?'<span class="card-tool">'+esc(s.tno)+'</span>':'')
          +'<span class="card-lcode">'+s.code+'</span>'
          +'<span class="card-sp '+(s.spindle==='SP3'?'sp-badge3':'sp-badge4')+'">'+s.spindle+'</span>'
          +'<button class="card-edit" data-edit="'+k+':'+s.idx+'" title="Bearbeiten"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11.5 2.5l2 2L6 12l-2.5.5L4 10z"/><path d="M10.5 3.5l2 2"/></svg></button>'
        +'</div>'
        +'<div class="flow" data-edit="'+k+':'+s.idx+'">'
          +'<span class="chip chip-if">IF <b class="'+ifRegCls+'">'+s.ifReg+'</b>==<span class="val">'+s.ifVal+'</span></span>'
          +'<span class="arr">→</span>'
          +'<span class="chip chip-set '+setCls+'">'+s.assignReg+'=<span class="val">'+s.assignVal+'</span></span>'
          +(s.last?'<span class="arr">→</span><span class="chip chip-fertig">Fertigteil</span>':'')
        +'</div>'
        +'<div class="card-foot">'
          +'<span class="card-waitm">WAITM('+wmv(s,'w1',s.pos)+','+wmv(s,'w2',1)+','+wmv(s,'w3',2)+')</span>'
          +'<span class="card-mv"><button class="mv-btn" data-mv="up" data-k="'+k+'" data-idx="'+s.idx+'"'+(s.pos===1?' disabled':'')+'>▲</button><button class="mv-btn" data-mv="down" data-k="'+k+'" data-idx="'+s.idx+'"'+(s.pos===st.length?' disabled':'')+'>▼</button></span>'
        +'</div>'
      +'</div></div>';
    if(s.handoff){h+='<div class="handoff-row"><div class="ho-rail"><span class="ho-badge">⇄ Übergabe → '+s.assignReg+'</span></div><div style="flex:1;"></div></div>';}
  });
  h+='<button class="add-card" data-add="'+k+'">+ Slot</button>';
  return h;
}
function panelHTML(k){
  const fn=k==='1'?'1000.MPF':'2000.MPF';
  return '<div class="panel"><div class="panel-head"><span class="panel-tag">Kanal '+k+'</span><span class="panel-title">'+fn+'</span><span class="sp"></span></div>'
    +'<div class="lane-legend"><div class="ll"><span class="dot dot-sp4"></span> SP4 → <b style="color:var(--sp4);margin-left:3px;">RG704</b></div><div class="ll"><span class="dot dot-sp3"></span> SP3 → <b style="color:var(--sp3);margin-left:3px;">RG703</b></div></div>'
    +'<div class="chain" data-chain="'+k+'">'+chainHTML(k)+'</div></div>';
}
function codePanelHTML(k){
  return '<div class="panel codepanel"><div class="panel-head"><span class="panel-tag">Code</span><span class="panel-title">'+(k==='1'?'1000.MPF':'2000.MPF')+'</span><span class="sp"></span><span class="panel-tag" id="cpMeta"></span></div><pre class="code" id="cpPre"></pre></div>';
}
function render(){
  const cols=document.getElementById('cols');
  if(mode==='sync'){cols.className='cols split';cols.innerHTML=panelHTML('1')+panelHTML('2');bindSchema();}
  else{cols.className='cols split';cols.innerHTML=panelHTML(mode)+codePanelHTML(mode);bindSchema();paintInline(mode);}
}
function paintInline(k){
  const pre=document.getElementById('cpPre');if(!pre)return;
  paintCodeInto(k,pre,buildFile(k));
  const meta=document.getElementById('cpMeta');if(meta)meta.textContent=steps(k).length+' Schritte';
}
function bindSchema(){
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();const[k,i]=el.dataset.edit.split(':');openEdit(k,+i);});
  });
  document.querySelectorAll('[data-add]').forEach(b=>{
    b.addEventListener('click',()=>{const k=b.dataset.add;openEdit(k,DATA[k].length,true);});
  });
  document.querySelectorAll('.mv-btn').forEach(b=>{
    b.addEventListener('click',e=>{e.stopPropagation();move(b.dataset.k,+b.dataset.idx,b.dataset.mv==='up'?-1:1);});
  });
  document.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('mouseenter',()=>hoverPos(+c.dataset.pos));
    c.addEventListener('mouseleave',()=>hoverPos(null));
  });
  bindDnD();
}
function move(k,idx,dir){
  const arr=DATA[k];const j=idx+dir;if(j<0||j>=arr.length)return;
  [arr[idx],arr[j]]=[arr[j],arr[idx]];recode(k);render();
}
let dragSrc=null;
function bindDnD(){
  document.querySelectorAll('.step[draggable="true"]').forEach(row=>{
    row.addEventListener('dragstart',e=>{dragSrc={k:row.dataset.k,idx:+row.dataset.idx};row.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
    row.addEventListener('dragend',()=>{row.classList.remove('dragging');document.querySelectorAll('.step.drag-over').forEach(r=>r.classList.remove('drag-over'));});
    row.addEventListener('dragover',e=>{e.preventDefault();if(!dragSrc||dragSrc.k!==row.dataset.k)return;row.classList.add('drag-over');});
    row.addEventListener('dragleave',()=>row.classList.remove('drag-over'));
    row.addEventListener('drop',e=>{e.preventDefault();row.classList.remove('drag-over');if(!dragSrc||dragSrc.k!==row.dataset.k)return;const k=row.dataset.k,ti=+row.dataset.idx,fi=dragSrc.idx;if(fi===ti)return;const arr=DATA[k];const[m]=arr.splice(fi,1);arr.splice(ti,0,m);recode(k);render();});
  });
}
function hoverPos(pos){
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('hl', pos!==null && +c.dataset.pos===pos));
  // sync-highlight inline code panel (non-sync mode)
  codeHover(pos);
}
/* ===== EDIT MODAL (order: code/bez, sp/cat, doppel, T-Nr/Name, WAITM last) ===== */
function openEdit(k,idx,isNew){
  const s=DATA[k][idx]||{code:'',title:'',spindle:'SP4',category:'Außen',doppel:false,tno:'',tname:'',w1:'',w2:1,w3:2};
  document.getElementById('edTitle').textContent=isNew?'Operation hinzufügen':'Operation bearbeiten';
  const body=document.getElementById('edBody');
  const defW1=(s.w1!==undefined&&s.w1!=='')?s.w1:(idx+1);
  body.innerHTML=
    '<div class="frow">'
      +'<div class="fg narrow"><label class="flabel">L-Code · Basis</label><input class="finput mono" id="e_code" value="'+esc(s.code)+'" placeholder="L'+(k==='2'?'21':'11')+'0'+(idx+1)+'"></div>'
      +'<div class="fg"><label class="flabel">Bezeichnung</label><input class="finput" id="e_title" value="'+esc(s.title)+'" placeholder="Bezeichnung"></div>'
    +'</div>'
    +'<div class="frow">'
      +'<div class="fg narrow"><label class="flabel">Spindel</label><select class="fselect" id="e_sp"><option value="SP4"'+(s.spindle==='SP4'?' selected':'')+'>SP4 · Hauptspindel</option><option value="SP3"'+(s.spindle==='SP3'?' selected':'')+'>SP3 · Gegenspindel</option></select></div>'
      +'<div class="fg"><label class="flabel">Kategorie</label><select class="fselect" id="e_cat">'+CATS.map(c=>'<option'+(s.category===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div>'
    +'</div>'
    +'<div class="frow"><div class="toggle '+(s.doppel?'on':'')+'" id="e_dop"><div class="ttrack"><div class="tthumb"></div></div><span>Doppelhalter aktiv</span></div></div>'
    +'<div class="frow">'
      +'<div class="fg narrow"><label class="flabel">Werkzeug T-Nr.</label><input class="finput mono" id="e_tno" value="'+esc(s.tno)+'" placeholder="T01"></div>'
      +'<div class="fg"><label class="flabel">Werkzeug-Name</label><input class="finput" id="e_tname" value="'+esc(s.tname)+'" placeholder="optional"></div>'
    +'</div>'
    +'<div class="frow"><div class="fg"><label class="flabel">WAITM ( Marke , Kanal 1 , Kanal 2 )</label><div class="waitm-grid">'
      +'<span class="wm-paren">WAITM(</span>'
      +'<div class="fg tiny"><input class="finput mono" id="e_w1" value="'+defW1+'"></div><span class="wm-paren">,</span>'
      +'<div class="fg tiny"><input class="finput mono" id="e_w2" value="'+((s.w2!==undefined&&s.w2!=='')?s.w2:1)+'"></div><span class="wm-paren">,</span>'
      +'<div class="fg tiny"><input class="finput mono" id="e_w3" value="'+((s.w3!==undefined&&s.w3!=='')?s.w3:2)+'"></div><span class="wm-paren">)</span>'
    +'</div></div></div>';
  let dop=!!s.doppel;
  document.getElementById('e_dop').addEventListener('click',function(){dop=!dop;this.classList.toggle('on',dop);});
  const foot=document.getElementById('edFoot');foot.innerHTML='';
  if(!isNew){foot.append(mkBtn('Löschen','danger',()=>{DATA[k].splice(idx,1);recode(k);closeEdit();render();}));}
  foot.append(
    mkBtn('Abbrechen','ghost',closeEdit),
    mkBtn('Speichern','primary',()=>{
      const codeRaw=document.getElementById('e_code').value.trim();
      const code=/^\d+$/.test(codeRaw)?'L'+codeRaw:codeRaw;
      const numOr=(v,d)=>{const t=String(v).trim();return t===''?d:t;};
      const obj={
        code:code,title:document.getElementById('e_title').value.trim(),
        spindle:document.getElementById('e_sp').value,category:document.getElementById('e_cat').value,doppel:dop,
        tno:(function(){const r=document.getElementById('e_tno').value.trim();return r?(/^\d+$/.test(r)?'T'+r.padStart(2,'0'):r):'';})(),
        tname:document.getElementById('e_tname').value.trim(),
        w1:numOr(document.getElementById('e_w1').value,''),w2:numOr(document.getElementById('e_w2').value,1),w3:numOr(document.getElementById('e_w3').value,2)
      };
      if(isNew){DATA[k].push(obj);}else{DATA[k][idx]=obj;}
      recode(k);closeEdit();render();
    })
  );
  document.getElementById('editOv').classList.add('open');
}
function closeEdit(){document.getElementById('editOv').classList.remove('open');}
function mkBtn(label,kind,fn){const b=document.createElement('button');b.type='button';b.className='btn '+(kind==='primary'?'':'ghost');if(kind==='danger'){b.style.color='var(--danger)';}b.textContent=label;b.addEventListener('click',fn);return b;}

/* ===== CODE rendering ===== */
const codeMap={'1':{},'2':{}};
function classifyLine(ln){
  if(/_GENERATED_CODE_(START|END)_/.test(ln)||/^;\*{4,}/.test(ln))return 'mark';
  if(/GROUP_BEGIN\(0,"(\d+):/.test(ln))return 'grp';
  if(/^IF /.test(ln))return 'if';
  if(/^\s*RG70[34]=/.test(ln))return 'set';
  if(/^\s*L\d+\s*$/.test(ln))return 'code';
  if(/GROUP_(BEGIN|END)/.test(ln))return 'grp';
  return 'cmt';
}
function paintCodeInto(k,pre,text){
  codeMap[k]={};
  const lines=text.split('\n');
  pre.innerHTML='';let cur=0;
  lines.forEach(ln=>{
    if(ln==='')return;
    const sp=document.createElement('span');sp.className='ln';
    const g=ln.match(/GROUP_BEGIN\(0,"(\d+):/);if(g)cur=parseInt(g[1],10);
    sp.classList.add(classifyLine(ln));
    sp.textContent=ln;sp.dataset.pos=cur;
    (codeMap[k][cur]=codeMap[k][cur]||[]).push(sp);
    pre.appendChild(sp);
  });
  bindCodeHover();
}
function bindCodeHover(){document.querySelectorAll('pre.code .ln').forEach(l=>{l.onmouseenter=()=>codeHover(+l.dataset.pos);l.onmouseleave=()=>codeHover(null);});}
function codeHover(pos){['1','2'].forEach(k=>Object.keys(codeMap[k]).forEach(p=>codeMap[k][p].forEach(l=>l.classList.toggle('hlrow', pos!==null && +p===pos))));}

let codeTab='1';
function openCode(initialTab){
  const sync=(mode==='sync');
  codeTab=initialTab||(mode==='sync'?'1':mode);
  const body=document.getElementById('codeBody');
  const foot=document.getElementById('codeFoot');
  const titleM=document.getElementById('codeTitleM');
  function renderBody(){
    if(sync){
      titleM.textContent='Generiertes NC-Programm · Synchron';
      body.innerHTML='<div class="code-info" id="ci"></div><div class="code-grid dual"><div><div class="code-col-head">KANAL 1 · 1000.MPF</div><pre class="code" id="pre1"></pre></div><div><div class="code-col-head">KANAL 2 · 2000.MPF</div><pre class="code" id="pre2"></pre></div></div>';
      paintCodeInto('1',document.getElementById('pre1'),buildFile('1'));
      paintCodeInto('2',document.getElementById('pre2'),buildFile('2'));
      document.getElementById('ci').textContent='Synchron · 1000.MPF: '+steps('1').length+' · 2000.MPF: '+steps('2').length+' · Hover synchronisiert nach Position';
    }else{
      titleM.textContent='Generiertes NC-Programm';
      body.innerHTML='<div class="code-tabs" id="ctabs"><button data-t="1" class="'+(codeTab==='1'?'on':'')+'">1000.MPF</button><button data-t="2" class="'+(codeTab==='2'?'on':'')+'">2000.MPF</button></div><div class="code-info" id="ci"></div><pre class="code" id="pre1"></pre>';
      paintCodeInto(codeTab,document.getElementById('pre1'),buildFile(codeTab));
      document.getElementById('ci').textContent=(codeTab==='1'?'1000.MPF':'2000.MPF')+' · '+steps(codeTab).length+' Schritte · SP4→RG704, SP3→RG703';
      document.querySelectorAll('#ctabs button').forEach(b=>b.addEventListener('click',()=>{codeTab=b.dataset.t;renderBody();}));
    }
  }
  renderBody();
  foot.innerHTML='';
  foot.append(mkBtn('Schließen','ghost',closeCode),mkBtn('1000.MPF ⬇','ghost',()=>dl('1')),mkBtn('2000.MPF ⬇','primary',()=>dl('2')));
  document.getElementById('codeOv').classList.add('open');
}
function closeCode(){document.getElementById('codeOv').classList.remove('open');}
function dl(k){const fn=k==='1'?'1000.MPF':'2000.MPF';const blob=new Blob([buildFile(k)],{type:'text/plain'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fn;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(a.href);}

/* ===== drawer ===== */
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('scrim').classList.add('open');}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('scrim').classList.remove('open');}

/* ===== boot (after gate) ===== */
function boot(){
  DATA=sampleData();recode('1');recode('2');render();
  document.getElementById('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;mode=b.dataset.m;[...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));render();});
  document.getElementById('btnCode').addEventListener('click',()=>openCode());
  document.getElementById('fab').addEventListener('click',()=>openCode());
  document.getElementById('btnReset').addEventListener('click',()=>{DATA=sampleData();recode('1');recode('2');render();});
  document.getElementById('edClose').addEventListener('click',closeEdit);
  document.getElementById('codeClose').addEventListener('click',closeCode);
  document.getElementById('editOv').addEventListener('click',e=>{if(e.target.id==='editOv')closeEdit();});
  document.getElementById('codeOv').addEventListener('click',e=>{if(e.target.id==='codeOv')closeCode();});
  document.getElementById('burger').addEventListener('click',openDrawer);
  document.getElementById('drX').addEventListener('click',closeDrawer);
  document.getElementById('scrim').addEventListener('click',closeDrawer);
  document.querySelectorAll('.dr-item,.dr-chip').forEach(el=>{el.addEventListener('click',ev=>{const act=el.dataset.act;if(!act)return;ev.stopPropagation();if(act==='mpf-up'){closeDrawer();openCode();return;}closeDrawer();});});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeEdit();closeCode();closeDrawer();}});
}
</script>
