<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SÄGELÄNGE</title>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0A0A; --muted:#9A9A9A; --line:#E8E8E8; --bg:#F3F3F4; --card:#FFFFFF;
    --green-bg:#E8F3EA; --green-ink:#2F6B3A; --green-line:#BFE0C6;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; }
  body{ background:var(--bg); color:var(--ink); font-family:var(--sans); }

  /* STATUS */
  .topbar{
    position:sticky; top:0; z-index:20; background:#fff;
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 18px; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted);
  }
  .topbar .dot{ width:8px; height:8px; border-radius:50%; background:var(--ink); display:inline-block; margin-right:8px; vertical-align:middle; }

  /* MARKE */
  .brandbar{ display:flex; align-items:center; gap:14px; padding:18px; background:#fff; border-bottom:1px solid var(--line); }
  .mark{ width:52px; height:52px; border-radius:14px; background:var(--ink); display:flex; align-items:center; justify-content:center; flex:0 0 auto; }
  .mark svg{ width:26px; height:26px; stroke:#fff; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
  .brand-txt .b1{ font-weight:900; font-size:19px; letter-spacing:-0.4px; line-height:1; }
  .brand-txt .b2{ font-family:var(--mono); font-size:10px; letter-spacing:2px; color:var(--muted); text-transform:uppercase; margin-top:5px; }

  .wrap{ max-width:520px; margin:0 auto; padding:16px 16px 60px; }

  /* TABS */
  .tabs{ display:flex; gap:8px; margin-bottom:16px; }
  .tab{
    flex:1; background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 12px; cursor:pointer; text-align:left; color:var(--muted);
    font-family:var(--sans); font-weight:800; font-size:15px;
    display:flex; align-items:baseline; gap:8px;
  }
  .tab .n{ font-family:var(--mono); font-size:11px; font-weight:700; }
  .tab.active{ background:var(--ink); border-color:var(--ink); color:#fff; }
  .tab.active .n{ color:#fff; }

  /* CARD */
  .card{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; margin-bottom:14px; }
  .card-lbl{ font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:14px; }
  .card-lbl b{ color:var(--ink); }

  .fields{ display:flex; gap:12px; flex-wrap:wrap; }
  .fld{ display:flex; flex-direction:column; gap:7px; flex:1 1 0; min-width:90px; }
  .fld label{ font-family:var(--mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
  .inp{ background:#fff; border:1px solid var(--line); color:var(--ink); padding:14px; font-size:18px; font-weight:700; font-family:var(--mono); text-align:center; border-radius:13px; width:100%; }
  .inp:focus{ outline:none; border-color:var(--ink); }

  /* SLIDER */
  .big-val{ text-align:center; font-family:var(--mono); font-weight:700; font-size:52px; letter-spacing:-2px; margin:6px 0 0; line-height:1; }
  .big-unit{ text-align:center; font-family:var(--mono); font-size:11px; letter-spacing:3px; text-transform:uppercase; color:var(--muted); margin-bottom:6px; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:100%; height:8px; background:#E8E8EA; border-radius:5px; outline:none; margin:18px 0 4px; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:30px; height:30px; background:#fff; border:3px solid var(--ink); border-radius:50%; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.15); }
  input[type=range]::-moz-range-thumb{ width:30px; height:30px; background:#fff; border:3px solid var(--ink); border-radius:50%; cursor:pointer; }
  .range-ends{ display:flex; justify-content:space-between; font-family:var(--mono); font-size:10px; color:var(--muted); }

  /* ERGEBNIS-ZEILEN */
  .res-row{ display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-top:1px solid var(--line); font-size:14px; font-weight:700; }
  .res-row:first-child{ border-top:none; }
  .res-row .lab{ font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); font-weight:500; }
  .res-row .val{ font-family:var(--mono); font-weight:700; font-size:16px; }
  .res-row.accent .val{ color:var(--green-ink); }
  .res-row.big .val{ font-size:20px; }

  /* STANDARD-LISTE */
  .item{
    background:#fff; border:1px solid var(--line); border-radius:14px;
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;
  }
  .item.opt{ border-color:var(--green-line); background:var(--green-bg); }
  .item .lab{ font-family:var(--mono); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); display:block; margin-bottom:3px; }
  .item .len{ font-family:var(--mono); font-size:22px; font-weight:700; letter-spacing:-0.5px; }
  .item.opt .len{ color:var(--green-ink); }
  .badge{ background:var(--ink); color:#fff; font-family:var(--mono); font-weight:700; font-size:18px; min-width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; padding:0 10px; }
  .item.opt .badge{ background:var(--green-ink); }
  .badge .x{ font-size:11px; color:#bbb; margin-right:3px; }
  .item.opt .badge .x{ color:#cfe6d2; }

  .empty{ font-family:var(--mono); font-size:12px; color:var(--muted); text-align:center; padding:24px; }
  .list-lbl{ font-family:var(--mono); font-size:11px; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin:4px 2px 10px; }
  .list-lbl b{ color:var(--ink); }
  .hidden{ display:none; }
</style>
</head>
<body>

<div class="topbar">
  <span><span class="dot"></span> Bereit</span>
  <span id="statSummary">Standard</span>
</div>

<div class="brandbar">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M3 17l4-8 4 8M9 13h-4"/><path d="M14 17l4-8 4 8M16 13h4"/></svg></div>
  <div class="brand-txt">
    <div class="b1">SÄGELÄNGE</div>
    <div class="b2">Schnittlängen-Rechner</div>
  </div>
</div>

<div class="wrap">

  <div class="tabs">
    <button class="tab active" id="t-std" onclick="setMode('std')"><span class="n">01</span> Standard</button>
    <button class="tab" id="t-drill" onclick="setMode('drill')"><span class="n">02</span> Durchbohren</button>
  </div>

  <!-- STANDARD -->
  <div id="m-std">
    <div class="card">
      <div class="card-lbl">[01] · <b>Parameter</b></div>
      <div class="fields">
        <div class="fld"><label>Fertigteil mm</label><input type="number" class="inp" id="in-l" value="175" oninput="runStd()"></div>
        <div class="fld"><label>Schnitt Z</label><input type="number" class="inp" id="in-z" value="5" oninput="runStd()"></div>
        <div class="fld"><label>Min. Rest mm</label><input type="number" class="inp" id="in-r" value="50" oninput="runStd()"></div>
      </div>
    </div>
    <div class="list-lbl">[02] · <b>Schnittlängen</b></div>
    <div id="std-list"></div>
  </div>

  <!-- DURCHBOHREN -->
  <div id="m-drill" class="hidden">
    <div class="card">
      <div class="card-lbl">[01] · <b>Parameter</b></div>
      <div class="fields">
        <div class="fld" style="flex:1.4"><label>Rohmaterial mm</label><input type="number" class="inp" id="dr-raw" value="3085" oninput="runDrill()"></div>
        <div class="fld"><label>Teil L mm</label><input type="number" class="inp" id="dr-l" value="175" oninput="runDrill()"></div>
        <div class="fld"><label>Schnitt Z</label><input type="number" class="inp" id="dr-z" value="5" oninput="runDrill()"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-lbl">[02] · <b>Schnitt S1 + S2</b></div>
      <div class="big-val" id="dr-disp">1150.0</div>
      <div class="big-unit">mm</div>
      <input type="range" id="dr-sl" min="300" max="1170" step="0.5" value="1150" oninput="runDrill()">
      <div class="range-ends"><span>300</span><span>1170</span></div>
    </div>

    <div class="card">
      <div class="card-lbl">[03] · <b>Ergebnis</b></div>
      <div id="dr-results"></div>
    </div>
  </div>

</div>

<script>
function setMode(m){
  document.getElementById('m-std').classList.toggle('hidden', m!=='std');
  document.getElementById('m-drill').classList.toggle('hidden', m!=='drill');
  document.getElementById('t-std').classList.toggle('active', m==='std');
  document.getElementById('t-drill').classList.toggle('active', m==='drill');
  document.getElementById('statSummary').textContent = (m==='std') ? 'Standard' : 'Durchbohren';
  m==='std' ? runStd() : runDrill();
}

function runStd(){
  const l=parseFloat(document.getElementById('in-l').value)||0;
  const z=parseFloat(document.getElementById('in-z').value)||0;
  const r=parseFloat(document.getElementById('in-r').value)||0;
  const unit=l+z;
  const list=document.getElementById('std-list');
  list.innerHTML='';
  if(unit<=0){ list.innerHTML='<div class="empty">Werte eingeben …</div>'; return; }

  let res=[];
  for(let c=1;c<=100;c++){
    let total=(c*unit)+r;
    if(total>1175) break;
    res.push({c,total});
  }
  if(res.length===0){ list.innerHTML='<div class="empty">Keine Lösung im Bereich.</div>'; return; }

  res.reverse().forEach(item=>{
    const isOpt = item.total>=1130 && item.total<=1170;
    const div=document.createElement('div');
    div.className='item'+(isOpt?' opt':'');
    div.innerHTML =
      '<div><span class="lab">Schnittlänge</span><span class="len">'+item.total.toFixed(1)+'</span></div>'+
      '<div class="badge"><span class="x">×</span>'+item.c+'</div>';
    list.appendChild(div);
  });
}

function runDrill(){
  const raw=parseFloat(document.getElementById('dr-raw').value)||0;
  const l=parseFloat(document.getElementById('dr-l').value)||0;
  const z=parseFloat(document.getElementById('dr-z').value)||0;
  const unit=l+z;
  const s12=parseFloat(document.getElementById('dr-sl').value);

  document.getElementById('dr-disp').innerText=s12.toFixed(1);

  const s3=raw-(s12*2);
  const c12=Math.floor(s12/(unit||1));
  const c3=Math.floor((s3-30)/(unit||1));
  const rest3=s3-(c3*(unit||1));

  document.getElementById('dr-results').innerHTML =
    '<div class="res-row"><span class="lab">S3 Länge</span><span class="val">'+s3.toFixed(1)+' mm</span></div>'+
    '<div class="res-row"><span class="lab">Teile in S1 + S2</span><span class="val">'+(c12*2)+'</span></div>'+
    '<div class="res-row"><span class="lab">Teile in S3</span><span class="val">'+c3+'</span></div>'+
    '<div class="res-row accent big"><span class="lab">Rest S3</span><span class="val">'+rest3.toFixed(1)+' mm</span></div>';
}

window.onload=runStd;
</script>
</body>
</html>
