<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC HUB | PREMIUM DESIGN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --card-bg: #ffffff;
            --accent: #000000;
            --text-main: #1d1d1f;
            --text-dim: #86868b;
            --border: #d2d2d7;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hub-container {
            width: 100%;
            max-width: 500px;
        }

        /* ПАНЕЛЬ УПРАВЛЕНИЯ (СВЕРХУ) */
        .settings-panel {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 5px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1.5px solid var(--border);
            font-size: 14px;
            font-weight: 600;
            outline: none;
            appearance: none;
            background: #fff;
        }

        select:focus, input:focus {
            border-color: var(--accent);
        }

        /* КАРТОЧКИ ОПЕРАЦИЙ */
        .tool-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 100px; /* Чтобы не перекрывало кнопками */
        }

        .tool-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .tool-card:active {
            transform: scale(0.98);
            background: #fafafa;
        }

        .t-nr {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            margin-bottom: 2px;
            display: block;
        }

        .description {
            font-size: 18px;
            font-weight: 800;
            color: var(--accent);
            display: block;
            margin-bottom: 10px;
        }

        .specs {
            display: flex;
            gap: 20px;
            border-top: 1px solid #f2f2f2;
            padding-top: 10px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
        }

        .spec-label {
            font-size: 9px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
        }

        .spec-value {
            font-size: 15px;
            font-weight: 700;
            color: var(--accent);
        }

        .fanuc-mode {
            margin-left: auto;
            background: #000;
            color: #fff;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 4px;
            height: fit-content;
        }
    </style>
</head>
<body>

<div class="hub-container">
    <div class="settings-panel">
        <div class="settings-grid">
            <div>
                <label>Material</label>
                <select id="mat" onchange="updateHub()">
                    <option value="1.4104">1.4104 (X14CrMoS17)</option>
                    <option value="1.4112">1.4112 (X90CrMoV18)</option>
                    <option value="2.0966">2.0966 (Bronze)</option>
                    <option value="ms58">MS58 (Messing)</option>
                </select>
            </div>
            <div>
                <label>Ø Durchmesser</label>
                <input type="number" id="dia" value="20" oninput="updateHub()">
            </div>
        </div>
    </div>

    <div class="tool-list" id="toolList">
        </div>
</div>

<script>
const materials = {
    "1.4104": { vc: 160, f_mod: 1.0 },
    "1.4112": { vc: 100, f_mod: 0.75 },
    "2.0966": { vc: 130, f_mod: 0.85 },
    "ms58":   { vc: 220, f_mod: 1.2 }
};

const operations = [
    { id: "T-01", name: "Außen Schruppen", type: "G96", f: 0.25, v_mul: 1.0 },
    { id: "T-02", name: "Außen Fertigdrehen", type: "G96", f: 0.12, v_mul: 1.25 },
    { id: "T-03", name: "Innen Schruppen", type: "G96", f: 0.20, v_mul: 0.9 },
    { id: "T-04", name: "Innen Fertigdrehen", type: "G96", f: 0.10, v_mul: 1.1 },
    { id: "T-05", name: "Nut stechen", type: "G96", f: 0.08, v_mul: 0.6 },
    { id: "T-06", name: "Abstechen", type: "G97", f: 0.07, v_mul: 0.5 },
    { id: "T-07", name: "Bohren HM Spiral", type: "G97", f: 0.15, v_mul: 0.4 },
    { id: "T-08", name: "WP-Bohrer", type: "G97", f: 0.12, v_mul: 0.5 },
    { id: "T-09", name: "Fräsen 6-Kant", type: "G97", f: 0.18, v_mul: 0.8 },
    { id: "T-10", name: "Gewindebohren", type: "G97", f: "Pitch", v_mul: 0.15 }
];

function updateHub() {
    const matKey = document.getElementById('mat').value;
    const dia = parseFloat(document.getElementById('dia').value) || 1;
    const mData = materials[matKey];
    const container = document.getElementById('toolList');
    
    container.innerHTML = '';

    operations.forEach(op => {
        let currentVc = Math.round(mData.vc * op.v_mul);
        let currentF = (typeof op.f === 'number') ? (op.f * mData.f_mod).toFixed(2) : op.f;
        
        // Расчет S (RPM) для G97
        let rpm = Math.round((currentVc * 1000) / (Math.PI * dia));

        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
            <span class="t-nr">${op.id}</span>
            <span class="description">${op.name}</span>
            <div class="specs">
                <div class="spec-item">
                    <span class="spec-label">${op.type === "G96" ? "Vc (m/min)" : "S (U/min)"}</span>
                    <span class="spec-value">${op.type === "G96" ? currentVc : rpm}</span>
                </div>
                <div class="spec-item">
                    <span class="spec-label">Vorschub</span>
                    <span class="spec-value">${currentF}</span>
                </div>
                <div class="fanuc-mode">${op.type}</div>
            </div>
        `;
        container.appendChild(card);
    });
}

updateHub();
</script>

</body>
</html>
