<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC OPTIMIZER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --panel: #f2f2f7;
            --accent: #000000;
            --border: #d2d2d7;
        }

        body {
            background: var(--bg);
            color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
        }

        /* ШАПКА */
        header {
            border-bottom: 3px solid #000;
            margin-bottom: 25px;
            padding-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* ВЫБОР ПАРАМЕТРОВ */
        .settings {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: var(--panel);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 6px;
            color: #666;
        }

        select, input {
            padding: 14px;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            background: #fff;
            outline: none;
        }

        select:focus { border-color: #000; }

        /* РЕЗУЛЬТАТ */
        .result-card {
            border: 2px solid #000;
            border-radius: 12px;
            padding: 20px;
            display: none; /* Скрыто до выбора операции */
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .op-name {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .g-code {
            background: #000;
            color: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 800;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .data-item {
            display: flex;
            flex-direction: column;
        }

        .data-label {
            font-size: 10px;
            font-weight: 800;
            color: #666;
            text-transform: uppercase;
        }

        .data-value {
            font-size: 24px;
            font-weight: 900;
        }

        .data-unit {
            font-size: 11px;
            font-weight: 600;
            color: #888;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>Optimizer</h1>
    </header>

    <div class="settings">
        <div class="input-group">
            <label>Material</label>
            <select id="mat" onchange="calculate()">
                <option value="1.4104">1.4104 (X14CrMoS17)</option>
                <option value="1.4112">1.4112 (X90CrMoV18)</option>
                <option value="2.0966">2.0966 (CuAl10Ni5Fe4)</option>
                <option value="ms58">MS58 (Messing)</option>
            </select>
        </div>

        <div class="input-group">
            <label>Ø Durchmesser (mm)</label>
            <input type="number" id="dia" value="20" oninput="calculate()">
        </div>

        <div class="input-group">
            <label>Verfahren (Operation)</label>
            <select id="op" onchange="calculate()">
                <option value="">-- Выбрать --</option>
                <option value="a_schrupp">Außen: Schruppen</option>
                <option value="a_fertig">Außen: Fertigdrehen</option>
                <option value="i_schrupp">Innen: Schruppen</option>
                <option value="i_fertig">Innen: Fertigdrehen</option>
                <option value="stechen">Nut stechen</option>
                <option value="bohren_hm">Bohren: HM Spiral</option>
                <option value="bohren_wp">Bohren: WP / Drehbohrer</option>
                <option value="frasen">Fräsen / 6-Kant</option>
                <option value="abstechen">Abstechen</option>
                <option value="gewinde">Gewinde drehen</option>
            </select>
        </div>
    </div>

    <div id="resultCard" class="result-card">
        <div class="result-header">
            <span id="resName" class="op-name">---</span>
            <span id="resG" class="g-code">G96</span>
        </div>
        <div class="data-grid">
            <div class="data-item">
                <span id="labelSpeed" class="data-label">Schnittgeschw.</span>
                <span id="resSpeed" class="data-value">0</span>
                <span id="unitSpeed" class="data-unit">m/min</span>
            </div>
            <div class="data-item">
                <span class="data-label">Vorschub</span>
                <span id="resFeed" class="data-value">0</span>
                <span class="data-unit">mm/U</span>
            </div>
        </div>
    </div>
</div>

<script>
[span_3](start_span)[span_4](start_span)// Данные на основе твоих PDF: 1.4104 (хорошая обработка)[span_3](end_span)[span_4](end_span)[span_5](start_span)[span_6](start_span), 1.4112 (труднее)[span_5](end_span)[span_6](end_span)[span_7](start_span), 2.0966 (бронза)[span_7](end_span)
const materials = {
    "1.4104": { vc: 180, f: 1.0 },
    "1.4112": { vc: 120, f: 0.8 },
    "2.0966": { vc: 140, f: 0.9 },
    "ms58":   { vc: 260, f: 1.2 }
};

const ops = {
    "a_schrupp": { name: "Außen Schruppen", g: "G96", v_m: 1.0, f_m: 0.25 },
    "a_fertig":  { name: "Außen Fertig", g: "G96", v_m: 1.3, f_m: 0.12 },
    "i_schrupp": { name: "Innen Schruppen", g: "G96", v_m: 0.85, f_m: 0.20 },
    "i_fertig":  { name: "Innen Fertig", g: "G96", v_m: 1.1, f_m: 0.10 },
    "stechen":   { name: "Nut stechen", g: "G96", v_m: 0.6, f_m: 0.08 },
    "bohren_hm": { name: "HM Spiralbohrer", g: "G97", v_m: 0.45, f_m: 0.15 },
    "bohren_wp": { name: "WP-Bohrer", g: "G97", v_m: 0.55, f_m: 0.12 },
    "frasen":    { name: "Fräsen 6-Kant", g: "G97", v_m: 0.8, f_m: 0.18 },
    "abstechen": { name: "Abstechen", g: "G97", v_m: 0.5, f_m: 0.07 },
    "gewinde":   { name: "Gewinde", g: "G97", v_m: 0.3, f_m: 1.5 }
};

function calculate() {
    const matKey = document.getElementById('mat').value;
    const opKey = document.getElementById('op').value;
    const dia = parseFloat(document.getElementById('dia').value) || 1;
    const card = document.getElementById('resultCard');

    if (!opKey) {
        card.style.display = 'none';
        return;
    }

    const m = materials[matKey];
    const o = ops[opKey];
    card.style.display = 'block';

    let vc = Math.round(m.vc * o.v_m);
    let f = (o.f_m * m.f).toFixed(2);
    
    document.getElementById('resName').innerText = o.name;
    document.getElementById('resG').innerText = o.g;
    document.getElementById('resFeed').innerText = f;

    if (o.g === "G97") {
        // Если G97, считаем обороты (S)
        let rpm = Math.round((vc * 1000) / (Math.PI * dia));
        document.getElementById('labelSpeed').innerText = "Drehzahl (S)";
        document.getElementById('resSpeed').innerText = rpm;
        document.getElementById('unitSpeed').innerText = "U/min";
    } else {
        // Если G96, показываем Vc
        document.getElementById('labelSpeed').innerText = "Schnittgeschw.";
        document.getElementById('resSpeed').innerText = vc;
        document.getElementById('unitSpeed').innerText = "m/min";
    }
}
</script>

</body>
</html>
