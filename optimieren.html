<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CNC Optimizer v2</title>

<style>
body { font-family: Inter, sans-serif; background:#f5f5f7; padding:15px; }
.container { max-width:480px; margin:auto; }

.section { background:#fff; padding:15px; border-radius:15px; margin-bottom:10px; }

label { font-size:12px; font-weight:700; display:block; margin-top:10px; }

input, select { width:100%; padding:10px; margin-top:5px; border-radius:10px; border:1px solid #ccc; }

.result { background:#fff; padding:15px; border-radius:15px; }

.grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; text-align:center; }

.box { background:#f2f2f2; padding:10px; border-radius:10px; }

.code { background:#111; color:#0f0; padding:10px; border-radius:10px; margin-top:10px; font-family:monospace; }
</style>
</head>

<body>

<div class="container">

<div class="section">
<label>Material</label>
<select id="mat">
<option value="1.4104">1.4104</option>
<option value="1.4301">1.4301</option>
<option value="1.4404">1.4404</option>
<option value="ms58">MS58</option>
</select>

<label>Operation</label>
<select id="op">
<option value="turn_rough">Schruppen</option>
<option value="turn_finish">Schlichten</option>
<option value="boring">Bohren</option>
</select>

<label>Diameter (mm)</label>
<input id="dia" type="number" value="20">

<label>Rz (µm)</label>
<input id="rz" type="number" value="6.3">

<label>Tool Radius (mm)</label>
<select id="rad">
<option value="0.2">0.2</option>
<option value="0.4" selected>0.4</option>
<option value="0.8">0.8</option>
</select>

<label>
<input type="checkbox" id="inst"> Instabil
</label>
</div>

<div class="result">
<div class="grid">
<div class="box">
<div>MIN Vc</div>
<div id="v1">0</div>
</div>
<div class="box">
<div>REC Vc</div>
<div id="v2">0</div>
</div>
<div class="box">
<div>MAX Vc</div>
<div id="v3">0</div>
</div>
</div>

<br>

<div class="grid">
<div class="box">
<div>MIN f</div>
<div id="f1">0</div>
</div>
<div class="box">
<div>REC f</div>
<div id="f2">0</div>
</div>
<div class="box">
<div>MAX f</div>
<div id="f3">0</div>
</div>
</div>

<div class="code" id="code"></div>
</div>

</div>

<script>

const db = {
"1.4104": { vc:[150,190,240], f:1.0 },
"1.4301": { vc:[110,145,180], f:0.85 },
"1.4404": { vc:[100,135,170], f:0.8 },
"ms58":   { vc:[250,350,450], f:1.2 }
};

const ops = {
turn_rough: { vm:1.0, fr:[0.25,0.35,0.50], g:"G96" },
turn_finish:{ vm:1.3, fr:[0.08,0.12,0.18], g:"G96" },
boring:     { vm:0.5, fr:[0.12,0.20,0.28], g:"G97" }
};

function clamp(a,b,c){ return Math.max(a,Math.min(b,c)); }

function feedFromRz(rz,r){
return Math.sqrt((rz*r)/125);
}

function run(){

const m = db[mat.value];
const o = ops[op.value];

const dia = +dia.value;
const rz = +rz.value;
const r = +rad.value;

const inst = inst.checked;

const vMult = inst ? 0.6 : 1;
const fMult = inst ? 0.7 : 1;

// SPEED
const vc = m.vc.map(v => Math.round(v * o.vm * vMult));

// BASE FEED
const fBase = o.fr.map(f => f * m.f * fMult);

// RZ LIMIT
const fRz = feedFromRz(rz,r);

// DIA FACTOR
const df = clamp(0.7, Math.sqrt(dia/20), 1.25);

// FINAL FEED
const f = fBase.map(x =>
clamp(0.02, Math.min(x, fRz*df), 1.5).toFixed(2)
);

// OUTPUT Vc
v1.innerText = vc[0];
v2.innerText = vc[1];
v3.innerText = vc[2];

// OUTPUT F
f1.innerText = f[0];
f2.innerText = f[1];
f3.innerText = f[2];

// CODE
if(o.g==="G96"){
code.innerHTML = `G50 S5000<br>G96 S${vc[1]} M3`;
}else{
const rpm = vc.map(v => Math.round((v*1000)/(Math.PI*dia)));
code.innerText = `G97 S${rpm[1]} M3`;
}

}

document.querySelectorAll("input,select").forEach(e=>{
e.addEventListener("input",run);
});

run();

</script>

</body>
</html>
