<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ULTRA CNC OPTIMIZER PRO v3</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --accent: #007aff; --text: #1d1d1f; 
            --border: #d2d2d7; --rec-bg: #e7f3ff; --green: #34c759;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 15px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 480px; padding-bottom: 80px; }
        header { margin-bottom: 25px; text-align: center; }
        header h1 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.5px; }
        header span { color: var(--accent); }
        .tabs { display: flex; background: #e3e3e8; padding: 4px; border-radius: 12px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 9px; font-weight: 800; font-size: 13px; cursor: pointer; color: #86868b; background: none; }
        .tab-btn.active { background: #fff; color: var(--text); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section { background: var(--card); border-radius: 18px; padding: 20px; margin-bottom: 12px; border: 1px solid var(--border); }
        .label { display: block; font-size: 10px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 8px; }
        select, input { width: 100%; padding: 14px; border: 1.5px solid var(--border); border-radius: 12px; font-size: 16px; font-weight: 700; background: #fff; outline: none; box-sizing: border-box; }
        .switch-row { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #fbfbfd; border-radius: 12px; border: 1px dashed var(--border); margin-top: 10px; }
        .switch-row span { font-size: 13px; font-weight: 700; }
        .switch { position: relative; display: inline-block; width: 42px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d1d6; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); }
        .result-card { background: var(--card); border-radius: 20px; padding: 22px; border: 2.5px solid var(--text); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .val-card { display: flex; flex-direction: column; align-items: center; padding: 14px 2px; border-radius: 14px; background: #f5f5f7; }
        .val-card.rec { background: var(--rec-bg); border: 2px solid var(--accent); }
        .v-l { font-size: 9px; font-weight: 800; color: #86868b; margin-bottom: 4px; }
        .v-m { font-size: 19px; font-weight: 900; }
        .v-u { font-size: 10px; font-weight: 700; color: #86868b; }
        .aufmass-label { font-size: 13px; font-weight: 900; color: #1a7f37; text-align: center; background: #ecfdf3; padding: 14px; border-radius: 12px; margin-top: 12px; border: 1px solid #ccebd7; }
        .code-box { background: #1c1c1e; color: var(--green); padding: 18px; border-radius: 14px; font-family: 'SF Mono', monospace; text-align: center; margin-top: 15px; font-size: 16px; font-weight: 800; border: 1px solid #38383a; line-height: 1.4; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>ULTRA <span>OPTIMIZER</span></h1></header>

    <div class="tabs">
        <button id="t-std-btn" class="tab-btn active" onclick="setTab('std')">STANDARD</button>
        <button id="t-qual-btn" class="tab-btn" onclick="setTab('qual')">QUALITY (RZ)</button>
    </div>

    <div class="section">
        <label class="label">Material</label>
        <select id="mat" onchange="run()">
            <option value="1.4104">1.4104 (S)</option>
            <option value="1.4301">1.4301 (V2A)</option>
            <option value="1.4404">1.4404 (V4A)</option>
            <option value="1.4112">1.4112 (Hard)</option>
            <option value="F75">CuAl10Ni5Fe4 (F75)</option>
            <option value="2.0966">2.0966 (Bronze)</option>
            <option value="ms58">MS58 (Messing)</option>
        </select>

        <div class="switch-row">
            <span>Vibration / Instabil</span>
            <label class="switch">
                <input type="checkbox" id="instabil" onchange="run()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="section">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom:15px;">
            <div>
                <label class="label">Ø Durchm. (mm)</label>
                <input type="number" id="dia" value="20" oninput="run()">
            </div>
            <div>
                <label class="label">Operation</label>
                <select id="op" onchange="run()">
                    <option value="dr_schrupp">Schruppen</option>
                    <option value="dr_fertig">Schlichten</option>
                    <option value="in_schrupp">Innen Schruppen</option>
                    <option value="in_fertig">Innen Schlichten</option>
                    <option value="stechen">Einstechen</option>
                    <option value="in_stechen">Innen-Einstechen</option>
                    <option value="frasen">Fräsen / 6-Kant</option>
                    <option value="bohren_hm">Bohren HM</option>
                    <option value="bohren_wp">WP-Bohrer</option>
                    <option value="gewinde">Gewinde</option>
                    <option value="abstechen">Abstechen</option>
                </select>
            </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label class="label">Soll Rz (µm)</label>
                <input type="number" id="rz" value="6.3" step="0.1" oninput="run()">
            </div>
            <div>
                <label class="label">Radius r (mm)</label>
                <select id="rad" onchange="run()">
                    <option value="0.1">0.1</option>
                    <option value="0.2">0.2</option>
                    <option value="0.4" selected>0.4</option>
                    <option value="0.8">0.8</option>
                </select>
            </div>
        </div>
    </div>

    <div class="result-card">
        <div class="grid-3">
            <div class="val-card"><span class="v-l">MIN</span><span id="s-min" class="v-m">0</span><span class="v-u" id="u-s1">m/min</span></div>
            <div class="val-card rec"><span class="v-l">REC</span><span id="s-rec" class="v-m">0</span><span class="v-u" id="u-s2">m/min</span></div>
            <div class="val-card"><span class="v-l">MAX</span><span id="s-max" class="v-m">0</span><span class="v-u" id="u-s3">m/min</span></div>
        </div>
        <div class="grid-3">
            <div class="val-card"><span class="v-l">MIN</span><span id="f-min" class="v-m">0</span><span class="v-u">mm/U</span></div>
            <div class="val-card rec"><span class="v-l">REC</span><span id="f-rec" class="v-m">0</span><span class="v-u">mm/U</span></div>
            <div class="val-card"><span class="v-l">MAX</span><span id="f-max" class="v-m">0</span><span class="v-u">mm/U</span></div>
        </div>
        <div id="aufmass-box" class="aufmass-label hidden">AUFMASS: Ø 0.00 mm</div>
        <div id="code-box" class="code-box">G50 S5000<br>G96 S---- M3</div>
    </div>
</div>

<script>
let activeTab = 'std';

const db = {
    "1.4104": { vc: [150, 190, 240], f_mod: 1.0,  auf_d: 0.4 },
    "1.4301": { vc: [110, 145, 185], f_mod: 0.85, auf_d: 0.5 },
    "1.4404": { vc: [100, 135, 175], f_mod: 0.8,  auf_d: 0.5 },
    "1.4112": { vc: [80, 110, 145],  f_mod: 0.75, auf_d: 0.6 },
    "F75":    { vc: [90, 120, 155],  f_mod: 0.85, auf_d: 0.5 },
    "2.0966": { vc: [120, 155, 195], f_mod: 0.9,  auf_d: 0.4 },
    "ms58":   { vc: [250, 350, 450], f_mod: 1.2,  auf_d: 0.3 }
};

const ops = {
    "dr_schrupp":  { g: "G96", vm: 1.0, fr: [0.35, 0.45, 0.60] }, // Увеличил базу для наглядности лимита Rz
    "dr_fertig":   { g: "G96", vm: 1.3, fr: [0.15, 0.20, 0.25] },
    "in_schrupp":  { g: "G96", vm: 0.85, fr: [0.25, 0.35, 0.45] },
    "in_fertig":   { g: "G96", vm: 1.05, fr: [0.10, 0.15, 0.20] },
    "stechen":     { g: "G96", vm: 0.7, fr: [0.10, 0.15, 0.20] },
    "in_stechen":  { g: "G96", vm: 0.6, fr: [0.08, 0.12, 0.16] },
    "frasen":      { g: "G97", vm: 0.75, fr: [0.15, 0.22, 0.30] },
    "bohren_hm":   { g: "G97", vm: 0.5, fr: [0.12, 0.20, 0.28] },
    "bohren_wp":   { g: "G97", vm: 0.65, fr: [0.10, 0.18, 0.25] },
    "gewinde":     { g: "G97", vm: 0.35, fr: [1.5, 1.5, 1.5] },
    "abstechen":   { g: "G97", vm: 0.55, fr: [0.07, 0.10, 0.15] }
};

function setTab(t) {
    activeTab = t;
    document.getElementById('t-std-btn').classList.toggle('active', t === 'std');
    document.getElementById('t-qual-btn').classList.toggle('active', t === 'qual');
    document.getElementById('aufmass-box').classList.toggle('hidden', t !== 'qual');
    run();
}

function run() {
    const m = db[document.getElementById('mat').value];
    const dia = parseFloat(document.getElementById('dia').value) || 1;
    const isInstabil = document.getElementById('instabil').checked;
    const opKey = document.getElementById('op').value;
    const o = ops[opKey];
    
    const rz = parseFloat(document.getElementById('rz').value) || 0.1;
    const r = parseFloat(document.getElementById('rad').value) || 0.4;

    const vMult = isInstabil ? 0.60 : 1.0;
    const fMult = isInstabil ? 0.70 : 1.0;
    
    // Diameter factor: clamp(0.7, sqrt(dia / 20), 1.25)
    const diaFactor = Math.min(Math.max(0.7, Math.sqrt(dia / 20)), 1.25);

    // Расчет лимита подачи по Rz (mm/rev)
    // Формула: f = sqrt( (Rz * r) / 125 )
    const f_Rz = Math.sqrt((rz * r) / 125);

    const calcFeed = (baseF) => {
        // Резьба не ограничивается шероховатостью (шаг фиксирован)
        if (opKey === "gewinde") return baseF.toFixed(2);
        
        let f_base = baseF * m.f_mod * fMult;
        let f_limit = f_Rz * diaFactor;
        
        // Математика: итоговая подача — это МИНИМУМ между базой операции и физическим лимитом по Rz
        return Math.min(f_base, f_limit).toFixed(2);
    };

    const fArr = [calcFeed(o.fr[0]), calcFeed(o.fr[1]), calcFeed(o.fr[2])];

    const vcBonus = (activeTab === 'qual' || opKey.includes('fertig')) ? 1.25 : 1.0;
    const vcArr = m.vc.map(v => Math.round(v * o.vm * vMult * vcBonus));

    document.getElementById('f-min').innerText = fArr[0];
    document.getElementById('f-rec').innerText = fArr[1];
    document.getElementById('f-max').innerText = fArr[2];

    if (o.g === "G96") {
        [1,2,3].forEach(i => document.getElementById('u-s'+i).innerText = "m/min");
        document.getElementById('s-min').innerText = vcArr[0];
        document.getElementById('s-rec').innerText = vcArr[1];
        document.getElementById('s-max').innerText = vcArr[2];
        document.getElementById('code-box').innerHTML = `G50 S5000<br>G96 S${vcArr[1]} M3`;
    } else {
        [1,2,3].forEach(i => document.getElementById('u-s'+i).innerText = "U/min");
        const rpmArr = vcArr.map(v => Math.round((v * 1000) / (Math.PI * dia)));
        document.getElementById('s-min').innerText = rpmArr[0];
        document.getElementById('s-rec').innerText = rpmArr[1];
        document.getElementById('s-max').innerText = rpmArr[2];
        document.getElementById('code-box').innerHTML = `G97 S${rpmArr[1]} M3`;
    }

    let auf = Math.max(m.auf_d, (r * 1.3)).toFixed(2);
    if (isInstabil) auf = (auf * 0.7).toFixed(2);
    document.getElementById('aufmass-box').innerText = `AUFMASS: Ø ${auf} mm`;
}

// Запуск при старте
run();
</script>
</body>
</html>
