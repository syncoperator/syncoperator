<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Optimizer PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000; --card: #1c1c1e; --accent: #0a84ff; --text: #ffffff; 
            --border: #38383a; --rec-bg: #0a84ff20; --green: #30d158;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 450px; padding-bottom: 40px; }
        
        header { text-align: center; margin: 20px 0; }
        header h1 { margin: 0; font-size: 22px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }

        .tabs { display: flex; background: #2c2c2e; padding: 3px; border-radius: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 7px; font-weight: 700; font-size: 12px; cursor: pointer; color: #8e8e93; background: none; transition: 0.3s; }
        .tab-btn.active { background: #636366; color: #fff; }

        .section { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 10px; border: 1px solid var(--border); }
        .label { display: block; font-size: 9px; font-weight: 800; color: #8e8e93; text-transform: uppercase; margin-bottom: 6px; letter-spacing: 0.5px; }
        
        select, input { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; 
            font-size: 15px; font-weight: 700; background: #2c2c2e; color: #fff; outline: none; box-sizing: border-box; 
        }

        .geo-card { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: #2c2c2e; border-radius: 10px; margin-top: 10px; }
        .geo-card span { font-size: 12px; font-weight: 700; }
        
        /* Switch */
        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #38383a; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* Results */
        .result-card { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid var(--border); }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .val-card { display: flex; flex-direction: column; align-items: center; padding: 10px 5px; border-radius: 12px; background: #2c2c2e; border: 1px solid transparent; }
        .val-card.rec { background: var(--rec-bg); border-color: var(--accent); }
        .v-l { font-size: 8px; font-weight: 800; color: #8e8e93; margin-bottom: 4px; }
        .v-m { font-size: 18px; font-weight: 900; color: #fff; }
        .v-u { font-size: 9px; font-weight: 600; color: #8e8e93; margin-top: 2px; }

        .aufmass-label { font-size: 12px; font-weight: 800; color: var(--green); text-align: center; background: #30d15815; padding: 10px; border-radius: 10px; margin-top: 10px; border: 1px solid #30d15830; }
        .code-box { background: #000; color: var(--green); padding: 15px; border-radius: 10px; font-family: 'SF Mono', monospace; text-align: center; margin-top: 15px; font-size: 14px; border: 1px solid var(--border); }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <header><h1>CNC OPTIMIZER PRO</h1></header>

    <div class="tabs">
        <button id="t-std-btn" class="tab-btn active" onclick="setTab('std')">STANDARD РЕЖИМЫ</button>
        <button id="t-qual-btn" class="tab-btn" onclick="setTab('qual')">КАЧЕСТВО (RZ)</button>
    </div>

    <div class="section">
        <label class="label">Werkstoff (Материал)</label>
        <select id="mat" onchange="run()">
            <option value="1.4104">1.4104 / X14CrMoS17</option>
            <option value="1.4301">1.4301 / V2A</option>
            <option value="1.4404">1.4404 / V4A</option>
            <option value="1.4112">1.4112 / X90CrMoV18</option>
            <option value="stahl">Automatenstahl / C45</option>
            <option value="ms58">Messing / MS58</option>
            <option value="alu">Aluminium</option>
        </select>

        <div class="geo-card">
            <span>Instabil (Вибрация / Тонкая деталь)</span>
            <label class="switch">
                <input type="checkbox" id="instabil" onchange="run()">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div id="tab-std" class="section">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
                <label class="label">Ø Durchm. (мм)</label>
                <input type="number" id="dia" value="20" oninput="run()">
            </div>
            <div>
                <label class="label">Verfahren (Операция)</label>
                <select id="op" onchange="run()">
                    <option value="dr_schrupp">Schruppen (Черн.)</option>
                    <option value="dr_fertig">Schlichten (Чист.)</option>
                    <option value="in_schrupp">Innen (Внутр. черн.)</option>
                    <option value="in_fertig">Innen (Внутр. чист.)</option>
                    <option value="stechen">Einstechen (Канавка)</option>
                    <option value="bohren_hm">Bohren HM (Сверло)</option>
                    <option value="bohren_wp">WP-Bohrer (U-Сверло)</option>
                    <option value="abstechen">Abstechen (Отрезка)</option>
                </select>
            </div>
        </div>
    </div>

    <div id="tab-qual" class="section hidden">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <div>
                <label class="label">Soll Rz (Требуемый)</label>
                <input type="number" id="rz" value="6.3" step="0.1" oninput="run()">
            </div>
            <div>
                <label class="label">Radius (Радиус при вершине)</label>
                <select id="rad" onchange="run()">
                    <option value="0.1">0.1 mm</option>
                    <option value="0.2">0.2 mm</option>
                    <option value="0.4" selected>0.4 mm</option>
                    <option value="0.8">0.8 mm</option>
                </select>
            </div>
        </div>
    </div>

    <div class="result-card">
        <label class="label" style="text-align:center; margin-bottom:15px">Schnittdaten (Результаты)</label>
        
        <div class="grid-3">
            <div class="val-card"><span class="v-l">MIN VC</span><span id="s-min" class="v-m">0</span><span class="v-u" id="u-s1">m/min</span></div>
            <div class="val-card rec"><span class="v-l">REC VC</span><span id="s-rec" class="v-m">0</span><span class="v-u" id="u-s2">m/min</span></div>
            <div class="val-card"><span class="v-l">MAX VC</span><span id="s-max" class="v-m">0</span><span class="v-u" id="u-s3">m/min</span></div>
        </div>

        <div class="grid-3">
            <div class="val-card"><span class="v-l">MIN FEED</span><span id="f-min" class="v-m">0</span><span class="v-u">mm/U</span></div>
            <div class="val-card rec"><span class="v-l">REC FEED</span><span id="f-rec" class="v-m">0</span><span class="v-u">mm/U</span></div>
            <div class="val-card"><span class="v-l">MAX FEED</span><span id="f-max" class="v-m">0</span><span class="v-u">mm/U</span></div>
        </div>

        <div id="aufmass-box" class="aufmass-label hidden">Aufmaß: Ø 0.40 mm</div>
        <div id="code-box" class="code-box">G-- S---- M3</div>
    </div>
</div>

<script>
let activeTab = 'std';
const db = {
    "1.4104": { vc: [140, 175, 210], f: 1.0, auf: 0.4 },
    "1.4301": { vc: [100, 130, 160], f: 0.85, auf: 0.5 },
    "1.4404": { vc: [90, 120, 150], f: 0.8, auf: 0.5 },
    "1.4112": { vc: [80, 105, 130], f: 0.75, auf: 0.6 },
    "stahl":  { vc: [180, 230, 280], f: 1.2, auf: 0.4 },
    "ms58":   { vc: [250, 320, 400], f: 1.3, auf: 0.3 },
    "alu":    { vc: [300, 500, 800], f: 1.5, auf: 0.3 }
};

const ops = {
    "dr_schrupp": { g: "G96", vm: 1.0, fr: [0.22, 0.32, 0.45] },
    "dr_fertig":  { g: "G96", vm: 1.3, fr: [0.08, 0.12, 0.18] },
    "in_schrupp": { g: "G96", vm: 0.8, fr: [0.15, 0.22, 0.30] },
    "in_fertig":  { g: "G96", vm: 1.1, fr: [0.06, 0.10, 0.14] },
    "stechen":    { g: "G96", vm: 0.6, fr: [0.07, 0.11, 0.15] },
    "bohren_hm":  { g: "G97", vm: 0.5, fr: [0.12, 0.18, 0.25] },
    "bohren_wp":  { g: "G97", vm: 0.7, fr: [0.08, 0.14, 0.20] },
    "abstechen":  { g: "G97", vm: 0.5, fr: [0.06, 0.09, 0.13] }
};

function setTab(t) {
    activeTab = t;
    document.getElementById('t-std-btn').classList.toggle('active', t === 'std');
    document.getElementById('t-qual-btn').classList.toggle('active', t === 'qual');
    document.getElementById('tab-std').classList.toggle('hidden', t !== 'std');
    document.getElementById('tab-qual').classList.toggle('hidden', t !== 'qual');
    document.getElementById('aufmass-box').classList.toggle('hidden', t !== 'qual');
    run();
}

function run() {
    const m = db[document.getElementById('mat').value];
    const dia = parseFloat(document.getElementById('dia').value) || 1;
    const isInstabil = document.getElementById('instabil').checked;
    
    let vcArr, fArr, gCode;
    const vMult = isInstabil ? 0.65 : 1.0;
    const fMult = isInstabil ? 0.75 : 1.0;

    if (activeTab === 'std') {
        const o = ops[document.getElementById('op').value];
        vcArr = m.vc.map(v => Math.round(v * o.vm * vMult));
        fArr = o.fr.map(f => (f * m.f * fMult).toFixed(2));
        gCode = o.g;
    } else {
        // РАСЧЕТ ПО КАЧЕСТВУ (Формула Rz -> f)
        const rz = parseFloat(document.getElementById('rz').value) || 6.3;
        const r = parseFloat(document.getElementById('rad').value);
        // f = sqrt( (Rz * r) / 125 )
        const fCalc = Math.sqrt((rz * r) / 125);
        
        vcArr = m.vc.map(v => Math.round(v * 1.2 * vMult));
        fArr = [(fCalc * 0.7).toFixed(2), fCalc.toFixed(2), (fCalc * 1.3).toFixed(2)];
        gCode = "G96";
        
        const aufVal = Math.max(m.auf, r * 1.2).toFixed(2);
        document.getElementById('aufmass-box').innerText = `EMPFEHLUNG AUFMASS: Ø ${aufVal} mm`;
    }

    // Вывод подач
    document.getElementById('f-min').innerText = fArr[0];
    document.getElementById('f-rec').innerText = fArr[1];
    document.getElementById('f-max').innerText = fArr[2];

    if (gCode === "G96") {
        // Постоянная скорость резания
        [1,2,3].forEach(i => document.getElementById('u-s'+i).innerText = "m/min");
        document.getElementById('s-min').innerText = vcArr[0];
        document.getElementById('s-rec').innerText = vcArr[1];
        document.getElementById('s-max').innerText = vcArr[2];
        document.getElementById('code-box').innerText = `G50 S3500\nG96 S${vcArr[1]} M3`;
    } else {
        // Постоянные обороты
        [1,2,3].forEach(i => document.getElementById('u-s'+i).innerText = "U/min");
        const rpmArr = vcArr.map(v => Math.round((v * 1000) / (Math.PI * dia)));
        document.getElementById('s-min').innerText = rpmArr[0];
        document.getElementById('s-rec').innerText = rpmArr[1];
        document.getElementById('s-max').innerText = rpmArr[2];
        document.getElementById('code-box').innerText = `G97 S${rpmArr[1]} M3`;
    }
}

// Запуск при старте
run();
</script>
</body>
</html>
