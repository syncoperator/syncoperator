<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>CNC Optimizer Pro</title>
    <style>
        :root { --accent: #00ff41; --bg: #0a0a0a; --panel: #1a1a1a; }
        body { background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; padding: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; max-width: 900px; margin: 0 auto; }
        .panel { background: var(--panel); padding: 20px; border: 1px solid #333; border-radius: 8px; }
        h3 { color: var(--accent); margin-top: 0; text-transform: uppercase; font-size: 14px; }
        select, input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #000; border: 1px solid var(--accent); color: var(--accent);
            font-weight: bold; border-radius: 4px;
        }
        .result-box { 
            background: #000; padding: 15px; border-left: 4px solid var(--accent);
            font-family: monospace; font-size: 18px; line-height: 1.6;
        }
        .highlight { color: var(--accent); }
    </style>
</head>
<body>

<div class="grid-container">
    <div class="panel">
        <h3>1. Parameter wählen</h3>
        
        <label>Material:</label>
        <select id="material" onchange="calculate()">
            <option value="1.4104">1.4104 (X14CrMoS17)</option>
            <option value="1.4112">1.4112 (X90CrMoV18)</option>
            <option value="2.0966">2.0966 (CuAl10Ni5Fe4)</option>
            <option value="ms58">MS58 (Messing)</option>
        </select>

        <label>Durchmesser (mm):</label>
        <input type="number" id="dia" value="20" oninput="calculate()">

        <label>Verfahren:</label>
        <select id="verfahren" onchange="calculate()">
            <option value="drehen_schruppen">Drehen Schruppen (Außen)</option>
            <option value="drehen_schlichten">Drehen Schlichten (Außen)</option>
            <option value="bohren_hm">HM Spiralbohrer</option>
            <option value="bohren_wp">WP-Bohrer / Drehbohrer</option>
            <option value="frasen">Fräsen / 6-Kant</option>
            <option value="stechen">Nut stechen / Abstechen</option>
            <option value="gewinde">Gewinde drehen</option>
        </select>
    </div>

    <div class="panel">
        <h3>2. CNC Output (Fanuc)</h3>
        <div id="output" class="result-box">
            Wähle Parameter...
        </div>
    </div>
</div>

<script>
const data = {
    [span_3](start_span)"1.4104": { v_base: 180, f_mod: 1.0 }, //[span_3](end_span)
    [span_4](start_span)[span_5](start_span)"1.4112": { v_base: 120, f_mod: 0.8 }, //[span_4](end_span)[span_5](end_span)
    "2.0966": { v_base: 140, f_mod: 0.9 }, //
    "ms58":   { v_base: 250, f_mod: 1.2 }
};

function calculate() {
    const mat = document.getElementById('material').value;
    const dia = parseFloat(document.getElementById('dia').value);
    const verf = document.getElementById('verfahren').value;
    
    let vc = data[mat].v_base;
    let f = 0.2 * data[mat].f_mod;
    let mode = "G96"; // По умолчанию постоянная скорость

    // Корректировка по типу операции
    if(verf.includes("schlichten")) { vc *= 1.3; f = 0.1; }
    if(verf.includes("bohren")) { mode = "G97"; vc = vc * 0.4; f = 0.12; }
    if(verf === "stechen") { vc *= 0.6; f = 0.08; }
    if(verf === "gewinde") { mode = "G97"; vc = 100; f = "Steigung"; }

    // Расчет оборотов для G97 (если нужно)
    const rpm = Math.round((vc * 1000) / (Math.PI * dia));

    let html = `
        <div>MODE: <span class="highlight">${mode}</span></div>
        <div>VC: <span class="highlight">${Math.round(vc)} m/min</span></div>
        <div>VORSCHUB: <span class="highlight">${f} mm/U</span></div>
        <hr style="border:0; border-top:1px solid #333">
        <div style="font-size:14px; color:#888">FANUC CODE:</div>
        <div style="color:#ccc">
            ${mode === "G96" ? 'G96 S'+Math.round(vc)+' M3' : 'G97 S'+rpm+' M3'}<br>
            G1 Z... F${f}
        </div>
    `;
    
    document.getElementById('output').innerHTML = html;
}

// Стартовый расчет
calculate();
</script>

</body>
</html>
