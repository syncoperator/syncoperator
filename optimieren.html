<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC PRO OPTIMIZER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --card: #1a1a1a;
            --accent: #00ff41; /* Терминальный зеленый */
            --text: #ffffff;
            --border: #333;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .app-wrapper {
            width: 100%;
            max-width: 420px;
        }

        /* КРУТАЯ ШАПКА */
        header {
            background: linear-gradient(90deg, #000 0%, #1a1a1a 100%);
            border-left: 5px solid var(--accent);
            padding: 20px;
            margin-bottom: 25px;
            border-radius: 0 12px 12px 0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text);
        }

        header span {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
            text-transform: uppercase;
        }

        /* НАСТРОЙКИ */
        .section-label {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            color: #666;
            margin: 20px 0 10px 5px;
            letter-spacing: 1px;
        }

        .config-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
        }

        select, input {
            width: 100%;
            padding: 14px;
            border: 1px solid #333;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            background: #000;
            color: #fff;
            outline: none;
            margin-bottom: 10px;
        }

        select:focus { border-color: var(--accent); }

        /* ПАНЕЛЬ РЕЗУЛЬТАТОВ */
        .display-panel {
            background: #000;
            border: 1px solid var(--accent);
            border-radius: 16px;
            padding: 20px;
            margin-top: 25px;
            position: relative;
            overflow: hidden;
        }

        .display-panel::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--accent);
            box-shadow: 0 0 15px var(--accent);
        }

        .res-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .res-title {
            font-size: 16px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--accent);
        }

        .res-gcode {
            font-family: monospace;
            background: #1a1a1a;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 14px;
            color: #fff;
            border: 1px solid #333;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-box {
            background: #0a0a0a;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #222;
        }

        .data-label {
            font-size: 9px;
            color: #666;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: block;
        }

        .data-range {
            font-size: 18px;
            font-weight: 900;
            color: #fff;
        }

        .data-unit {
            font-size: 10px;
            color: #444;
            margin-left: 4px;
        }

        .code-preview {
            margin-top: 15px;
            background: #111;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            color: #00ff41;
            text-align: center;
            border: 1px dashed #333;
        }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <span>Fanuc Optimized</span>
        <h1>Industrial Guide</h1>
    </header>

    <div class="section-label">Material & Ø</div>
    <div class="config-card">
        <select id="mat" onchange="calc()">
            <option value="1.4104">1.4104 | X14CrMoS17</option>
            <option value="1.4112">1.4112 | X90CrMoV18</option>
            <option value="2.0966">2.0966 | CuAl10Ni5Fe4</option>
            <option value="ms58">MS58 | Messing</option>
        </select>
        <input type="number" id="dia" value="20" placeholder="Ø Durchmesser" oninput="calc()">
    </div>

    <div class="section-label">Operation</div>
    <div class="config-card">
        <select id="op" onchange="calc()">
            <option value="schrupp">Außen: Schruppen</option>
            <option value="schlicht">Außen: Fertigdrehen</option>
            <option value="i_schrupp">Innen: Schruppen</option>
            <option value="i_schlicht">Innen: Fertigdrehen</option>
            <option value="stechen">Stechen / Abstechen</option>
            <option value="bohren_hm">Bohren: HM Spiral</option>
            <option value="bohren_wp">Bohren: WP / Drehbohrer</option>
            <option value="gewinde">Gewindedrehen</option>
        </select>
    </div>

    <div class="display-panel">
        <div class="res-header">
            <div id="out-op" class="res-title">READY</div>
            <div id="out-g" class="res-gcode">G--</div>
        </div>

        <div class="data-grid">
            <div class="data-box">
                <span id="out-speed-label" class="data-label">SPEED</span>
                <span id="out-speed-val" class="data-range">0 - 0</span>
                <span id="out-speed-unit" class="data-unit">m/min</span>
            </div>
            <div class="data-box">
                <span class="data-label">FEED (f)</span>
                <span id="out-f-val" class="data-range">0 - 0</span>
                <span class="data-unit">mm/U</span>
            </div>
        </div>

        <div id="out-fanuc" class="code-preview">G-- S---- M3</div>
    </div>
</div>

<script>
const db = {
    "1.4104": { vc: [140, 190], f: 1.0 },
    "1.4112": { vc: [80, 120], f: 0.8 },
    "2.0966": { vc: [110, 150], f: 0.9 },
    "ms58":   { vc: [200, 300], f: 1.2 }
};

const ops = {
    "schrupp":   { n: "A-Schruppen", g: "G96", v_m: [0.9, 1.1], f_m: [0.20, 0.35] },
    "schlicht":  { n: "A-Schlichten", g: "G96", v_m: [1.1, 1.3], f_m: [0.08, 0.15] },
    "i_schrupp": { n: "I-Schruppen", g: "G96", v_m: [0.8, 0.9], f_m: [0.15, 0.25] },
    "i_schlicht":{ n: "I-Schlichten", g: "G96", v_m: [1.0, 1.1], f_m: [0.05, 0.12] },
    "stechen":   { n: "Stechen", g: "G96", v_m: [0.5, 0.7], f_m: [0.06, 0.12] },
    "bohren_hm": { n: "HM-Bohren", g: "G97", v_m: [0.35, 0.5], f_m: [0.12, 0.20] },
    "bohren_wp": { n: "WP-Bohren", g: "G97", v_m: [0.45, 0.6], f_m: [0.10, 0.18] },
    "gewinde":   { n: "Gewinde", g: "G97", v_m: [0.25, 0.35], f_m: [1.5, 1.5] }
};

function calc() {
    const m = db[document.getElementById('mat').value];
    const o = ops[document.getElementById('op').value];
    const dia = parseFloat(document.getElementById('dia').value) || 1;

    // Расчет Vc (min/max)
    const vcMin = Math.round(m.vc[0] * o.v_m[0]);
    const vcMax = Math.round(m.vc[1] * o.v_m[1]);

    // Расчет Подачи (min/max)
    const fMin = (o.f_m[0] * m.f).toFixed(2);
    const fMax = (o.f_m[1] * m.f).toFixed(2);

    document.getElementById('out-op').innerText = o.n;
    document.getElementById('out-g').innerText = o.g;
    document.getElementById('out-f-val').innerText = `${fMin} - ${fMax}`;

    if (o.g === "G96") {
        document.getElementById('out-speed-label').innerText = "VC (Schnitt)";
        document.getElementById('out-speed-val').innerText = `${vcMin} - ${vcMax}`;
        document.getElementById('out-speed-unit').innerText = "m/min";
        document.getElementById('out-fanuc').innerText = `G96 S${vcMin} M3 (MAX S3000)`;
    } else {
        const rpmMin = Math.round((vcMin * 1000) / (Math.PI * dia));
        const rpmMax = Math.round((vcMax * 1000) / (Math.PI * dia));
        document.getElementById('out-speed-label').innerText = "RPM (Drehzahl)";
        document.getElementById('out-speed-val').innerText = `${rpmMin} - ${rpmMax}`;
        document.getElementById('out-speed-unit').innerText = "U/min";
        document.getElementById('out-fanuc').innerText = `G97 S${Math.round((rpmMin+rpmMax)/2)} M3`;
    }
}

calc();
</script>

</body>
</html>
