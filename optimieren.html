<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC HUB | OPTIMIZER</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2f2f7;
            --accent: #007aff;
            --card: #ffffff;
            --text: #1c1c1e;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .hub-wrapper {
            width: 100%;
            max-width: 400px;
        }

        header {
            margin-bottom: 20px;
            padding-left: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        /* КАРТОЧКИ НАСТРОЕК */
        .section-label {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            color: #8e8e93;
            margin: 15px 0 8px 5px;
        }

        .config-card {
            background: var(--card);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            margin-bottom: 10px;
        }

        select, input {
            width: 100%;
            padding: 12px;
            border: 1px solid #e5e5ea;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            background: #fff;
            outline: none;
            -webkit-appearance: none;
        }

        /* ПАНЕЛЬ РЕЗУЛЬТАТА */
        .display-panel {
            background: #000;
            color: #fff;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .display-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .op-title {
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--accent);
        }

        .fanuc-pill {
            background: #333;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
        }

        .val-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .val-box {
            display: flex;
            flex-direction: column;
        }

        .val-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            font-weight: 700;
        }

        .val-main {
            font-size: 28px;
            font-weight: 900;
        }

        .val-unit {
            font-size: 12px;
            color: #555;
        }

        .code-output {
            background: #1c1c1e;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            color: #00ff41;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

<div class="hub-wrapper">
    <header>
        <h1>CNC OPTIMIZER</h1>
    </header>

    <div class="section-label">Material & Geometrie</div>
    <div class="config-card">
        <select id="mat" onchange="run()">
            <option value="1.4104">1.4104 | X14CrMoS17</option>
            <option value="1.4112">1.4112 | X90CrMoV18</option>
            <option value="2.0966">2.0966 | CuAl10Ni5Fe4</option>
            <option value="ms58">MS58 | Messing</option>
        </select>
        <div style="margin-top: 10px;">
            <input type="number" id="dia" value="20" placeholder="Ø Durchmesser" oninput="run()">
        </div>
    </div>

    <div class="section-label">Verfahren</div>
    <div class="config-card">
        <select id="op" onchange="run()">
            <option value="schrupp">Außen: Schruppen</option>
            <option value="schlicht">Außen: Fertigdrehen</option>
            <option value="i_schrupp">Innen: Schruppen</option>
            <option value="i_schlicht">Innen: Fertigdrehen</option>
            <option value="stechen">Stechen / Abstechen</option>
            <option value="bohren_hm">Bohren: HM Spiral</option>
            <option value="bohren_wp">Bohren: WP-Bohrer</option>
            <option value="gewinde">Gewindedrehen</option>
        </select>
    </div>

    <div class="display-panel">
        <div class="display-header">
            <div id="res-op" class="op-title">Bereit</div>
            <div id="res-g" class="fanuc-pill">G96</div>
        </div>
        
        <div class="val-grid">
            <div class="val-box">
                <span id="res-type" class="val-label">Schnittgeschw.</span>
                <span id="res-vc" class="val-main">0</span>
                <span id="res-unit" class="val-unit">m/min</span>
            </div>
            <div class="val-box">
                <span class="val-label">Vorschub</span>
                <span id="res-f" class="val-main">0</span>
                <span class="val-unit">mm/U</span>
            </div>
        </div>

        <div class="section-label" style="margin: 5px 0; color:#555">Fanuc Code</div>
        <div id="res-code" class="code-output">
            G96 S... M3
        </div>
    </div>
</div>

<script>
const db = {
    "1.4104": { vc: 180, f: 1.0 },
    "1.4112": { vc: 110, f: 0.8 },
    "2.0966": { vc: 140, f: 0.9 },
    "ms58":   { vc: 280, f: 1.2 }
};

const config = {
    "schrupp":   { n: "Außen Schruppen", g: "G96", v_m: 1.0, f_m: 0.28 },
    "schlicht":  { n: "Außen Fertig", g: "G96", v_m: 1.2, f_m: 0.12 },
    "i_schrupp": { n: "Innen Schruppen", g: "G96", v_m: 0.8, f_m: 0.22 },
    "i_schlicht":{ n: "Innen Fertig", g: "G96", v_m: 1.0, f_m: 0.10 },
    "stechen":   { n: "Stechen", g: "G96", v_m: 0.6, f_m: 0.08 },
    "bohren_hm": { n: "HM Bohren", g: "G97", v_m: 0.4, f_m: 0.16 },
    "bohren_wp": { n: "WP-Bohrer", g: "G97", v_m: 0.5, f_m: 0.14 },
    "gewinde":   { n: "Gewinde", g: "G97", v_m: 0.3, f_m: 1.5 }
};

function run() {
    const mat = db[document.getElementById('mat').value];
    const op = config[document.getElementById('op').value];
    const dia = parseFloat(document.getElementById('dia').value) || 1;

    const vc = Math.round(mat.vc * op.v_m);
    const f = (op.f_m * mat.f).toFixed(2);
    const rpm = Math.round((vc * 1000) / (Math.PI * dia));

    document.getElementById('res-op').innerText = op.n;
    document.getElementById('res-g').innerText = op.g;
    document.getElementById('res-f').innerText = f;

    if(op.g === "G96") {
        document.getElementById('res-type').innerText = "Schnittgeschw.";
        document.getElementById('res-vc').innerText = vc;
        document.getElementById('res-unit').innerText = "m/min";
        document.getElementById('res-code').innerText = `G96 S${vc} M3`;
    } else {
        document.getElementById('res-type').innerText = "Drehzahl (S)";
        document.getElementById('res-vc').innerText = rpm;
        document.getElementById('res-unit').innerText = "U/min";
        document.getElementById('res-code').innerText = `G97 S${rpm} M3`;
    }
}

// Запуск при загрузке
run();
</script>

</body>
</html>
