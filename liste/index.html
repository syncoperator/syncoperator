<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Manager Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="v-home" class="view active">
        <div class="header"><h1>PROJECTS</h1><button onclick="show('m-imp')">⚙️</button></div>
        <div id="list-p"></div>
        <button class="btn-add" onclick="modalP()">+</button>
    </div>

    <div id="v-det" class="view">
        <div class="header">
            <button onclick="goHome()">← BACK</button>
            <div class="h-info"><small id="h-nam"></small><b id="h-num"></b></div>
        </div>
        <div class="actions">
            <button class="btn-print" onclick="makePDF()">PDF PRINT</button>
            <button onclick="modalP(true)">EDIT INFO</button>
        </div>
        <div id="list-t"></div>
        <button class="btn-add" onclick="modalT()">+</button>
    </div>

    <div id="m-t" class="modal">
        <div class="modal-content">
            <input type="hidden" id="t-idx">
            <input type="text" id="t-id" placeholder="T-NR">
            <input type="text" id="t-nm" placeholder="WERKZEUGNAME">
            <input type="text" id="t-dia" placeholder="Ø / TOLERANZ">
            <div id="btn-rev-toggle" class="rev-btn">SET AS UNTEN START</div>
            <button class="btn-save" onclick="saveT()">SAVE</button>
            <button id="btn-del-t" class="btn-del" onclick="delT()">DELETE</button>
            <button onclick="hide('m-t')">CANCEL</button>
        </div>
    </div>

    <div id="m-p" class="modal">...</div>
    <div id="m-imp" class="modal">...</div>
    <div id="print-container"></div>
    <script src="ui.js"></script>
</body>
</html>
