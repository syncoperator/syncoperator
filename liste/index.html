<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QS CENTRAL PREMIUM V5</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <aside class="sidebar">
            <div class="brand">QS-PRO <small>V5</small></div>
            <nav>
                <button onclick="App.showScreen('dashboard')" class="nav-btn">PROJECT</button>
                <button onclick="App.showScreen('tools')" class="nav-btn">TOOLS</button>
                <div class="nav-spacer"></div>
                <button onclick="PDFEngine.generate()" class="nav-btn primary">GENERATE PDF</button>
            </nav>
        </aside>

        <main class="content">
            <section id="screen-dashboard" class="screen">
                <header class="screen-header">
                    <h2>PROJECT DATA</h2>
                </header>
                <div class="grid-layout" id="project-fields">
                    </div>
            </section>

            <section id="screen-tools" class="screen" style="display:none">
                <header class="screen-header">
                    <h2>TOOLING LIST</h2>
                    <button class="action-btn" onclick="UI.openImport()">+ IMPORT LINES</button>
                </header>
                <div class="tool-table-container">
                    <table id="tool-table">
                        <thead>
                            <tr>
                                <th>POS</th>
                                <th>DESCRIPTION</th>
                                <th>ID</th>
                                <th>DIA</th>
                                <th>ACTION</th>
                            </tr>
                        </thead>
                        <tbody id="tool-list"></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="modal-import" class="modal">
        <div class="modal-content">
            <h3>IMPORT TOOLS</h3>
            <p>Each line is a new instrument.</p>
            <textarea id="import-input" placeholder="NAME..."></textarea>
            <div class="modal-actions">
                <button onclick="UI.processImport()" class="btn-confirm">ADD TO LIST</button>
                <button onclick="UI.closeModal()" class="btn-cancel">CANCEL</button>
            </div>
        </div>
    </div>

    <script src="storage.js"></script>
    <script src="pdf-engine.js"></script>
    <script src="app.js"></script>
</body>
</html>
