<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL v15.0 Split</title>
    
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div id="view-home" class="view active-view">
        <div class="app-bar"><h1>PROJECT MANAGER</h1></div>
        <div class="scroll-area">
            <div id="project-list" class="container"></div>
        </div>
        <button class="fab" onclick="openModal('modal-p')">+</button>
    </div>

    <div id="view-detail" class="view">
        <div class="app-bar">
            <button class="nav-btn" onclick="goHome()">←</button>
            <div class="header-info">
                <span id="det-num"></span>
                <small id="det-name"></small>
            </div>
        </div>
        <div class="scroll-area">
            <div class="container">
                <button class="btn btn-blue" onclick="openModal('modal-import')">IMPORTIEREN</button>
                
                <div id="tool-list" class="list-wrapper"></div>
                
                <div class="action-grid">
                    <button class="btn" onclick="openPreview()">VORSCHAU (PDF)</button>
                    <button class="btn btn-danger" onclick="clearTools()">LEEREN</button>
                </div>
            </div>
        </div>
        <button class="fab" onclick="openTModal()">+</button>
    </div>

    <div id="modal-p" class="modal-overlay">
        <div class="modal-card">
            <h3>Neues Projekt</h3>
            <input id="p-in-num" type="text" placeholder="Zeichnungs-Nr">
            <input id="p-in-name" type="text" placeholder="Bauteil Name">
            <button class="btn" onclick="saveProject()">Speichern</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-p')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-t" class="modal-overlay">
        <div class="modal-card">
            <h3>Werkzeug</h3>
            <input type="hidden" id="t-idx">
            <input id="t-in-id" type="text" placeholder="T-Nummer (z.B. T0101)">
            <input id="t-in-nm" type="text" placeholder="Bezeichnung / Kommentar">
            <input id="t-in-diam" type="text" placeholder="Ø (Optional)">
            <button class="btn" onclick="saveTool()">Speichern</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-t')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-import" class="modal-overlay">
        <div class="modal-card">
            <h3>Schnell Import</h3>
            <textarea id="import-area" placeholder="Paste tool list here..."></textarea>
            <button class="btn" onclick="runImport()">Einlesen</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-import')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-prev" class="modal-overlay full-screen">
        <div class="prev-header">
            <button class="nav-btn" onclick="closeModal('modal-prev')">← ZURÜCK</button>
            <button id="download-btn" class="btn-sm" onclick="downloadPDF()">PDF SPEICHERN</button>
        </div>
        <div class="prev-body">
            <div id="preview-stage" class="pdf-wrapper"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
