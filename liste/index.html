<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS PREMIUM</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="app-bar">
            <div class="brand">QS CENTRAL</div>
            <button onclick="modalP()" style="background:var(--accent); color:white; border:none; padding:8px 16px; border-radius:10px; font-weight:700;">+ NEU</button>
        </div>
        <div id="list-p" class="scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="app-bar">
            <button onclick="goHome()" style="background:none; border:none; color:var(--accent); font-size:24px;">←</button>
            <div class="header-info" onclick="modalP(true)">
                <small id="h-nam"></small>
                <b id="h-num"></b>
            </div>
            <button onclick="makePDF()" style="background:none; border:none; color:var(--accent); font-weight:800;">PDF</button>
        </div>
        
        <div class="action-grid">
            <div class="tile" onclick="modalT()">
                <div class="icon">⊕</div>
                <span>Instrument</span>
            </div>
            <div class="tile" onclick="show('m-imp')">
                <div class="icon">⤓</div>
                <span>Import</span>
            </div>
        </div>
        <div id="list-t" class="scroll"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT</h2>
            <input type="hidden" id="p-idx">
            <label>NUMMER</label><input type="text" id="p-num">
            <label>NAME</label><input type="text" id="p-nam">
            <div class="row">
                <div><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>
            <div class="row">
                <div><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div><label>SÄGELÄNGE</label><input type="text" id="p-sag"></div>
            </div>
            <div class="row">
                <div><label>STÜCK A</label><input type="text" id="p-sta"></div>
                <div><label>STÜCK B</label><input type="text" id="p-stb"></div>
            </div>
            <button class="btn-save" onclick="saveP()">SPEICHERN</button>
            <button class="btn-del" onclick="hide('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>INSTRUMENT</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label><input type="text" id="t-id">
            <label>NAME</label><input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label><input type="text" id="t-dia">
            <button class="btn-save" onclick="saveT()">OK</button>
            <button class="btn-del" onclick="delT()">LÖSCHEN</button>
            <button class="btn-del" style="color:var(--sub)" onclick="hide('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h2>IMPORT</h2>
            <textarea id="imp-area" rows="8"></textarea>
            <button class="btn-save" onclick="runImp()">IMPORT</button>
            <button class="btn-del" onclick="hide('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="pdf-box" style="display:none"></div>
    <script src="ui.js"></script>
</body>
</html>
