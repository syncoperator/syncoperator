<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS FINAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="app-bar">
            <div class="brand">QS CENTRAL</div>
            <button class="btn-new" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="app-bar">
            <button class="btn-icon" onclick="goHome()">←</button>
            <div class="header-title" onclick="modalP(true)">
                <small id="h-nam">NAME</small>
                <b id="h-num">000000</b>
            </div>
            <button class="btn-text" onclick="makePDF()">PDF</button>
        </div>
        
        <div class="grid-menu">
            <div class="tile" onclick="modalT()">
                <div class="icon">⊕</div>
                <span>Instrument</span>
            </div>
            <div class="tile" onclick="show('m-imp')">
                <div class="icon">⤓</div>
                <span>Import</span>
            </div>
        </div>

        <div id="list-t" class="scroll"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT DATEN</h2>
            <input type="hidden" id="p-idx">
            <label>NUMMER</label><input type="text" id="p-num">
            <label>NAME</label><input type="text" id="p-nam">
            
            <div class="row">
                <div><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div><label>SÄGELÄNGE</label><input type="text" id="p-sag"></div>
            </div>
            <div class="row">
                <div><label>STÜCK T</label><input type="text" id="p-stt"></div>
                <div><label>STÜCK N</label><input type="text" id="p-stn"></div>
            </div>
            <div class="row">
                <div><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>

            <button class="btn-save" onclick="saveP()">SPEICHERN</button>
            <button class="btn-close" onclick="hide('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>WERKZEUG</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label><input type="text" id="t-id" placeholder="T?">
            <label>NAME / KOMMENTAR</label><input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label><input type="text" id="t-dia">
            
            <button class="btn-save" onclick="saveT()">OK</button>
            <button id="btn-del-t" class="btn-del" onclick="delT()">LÖSCHEN</button>
            <button class="btn-close" onclick="hide('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h2>IMPORT</h2>
            <textarea id="imp-area" rows="8" placeholder="Вставь список..."></textarea>
            <button class="btn-save" onclick="runImp()">START</button>
            <button class="btn-close" onclick="hide('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="pdf-box"></div>

    <script src="ui.js"></script>
</body>
</html>
