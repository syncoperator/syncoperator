<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS TOOL v17</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="v-home" class="view active">
    <div class="bar"><b>PROJECTS</b></div>
    <div class="content" id="list-p"></div>
    <button class="fab" onclick="showM('m-p')">+</button>
</div>

<div id="v-det" class="view">
    <div class="bar">
        <button onclick="goHome()" style="border:none;background:none;font-size:24px;">←</button>
        <div style="text-align:right"><b id="d-num"></b><br><small id="d-nam"></small></div>
    </div>
    <div class="content">
        <button class="btn btn-blue" onclick="showM('m-i')">LISTE IMPORTIEREN</button>
        <div id="list-t"></div>
        <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-black" onclick="openPre()">VORSCHAU</button>
            <button class="btn btn-gray" onclick="clearT()" style="color:red">LEEREN</button>
        </div>
    </div>
    <button class="fab" onclick="openTAdd()">+</button>
</div>

<div id="m-p" class="overlay"><div class="m-card">
    <h3>Neues Projekt</h3>
    <input id="p-num" placeholder="Zeichnungs-Nr."><input id="p-nam" placeholder="Bauteil Name">
    <button class="btn btn-black" onclick="addP()">Speichern</button>
    <button class="btn btn-gray" onclick="hideM('m-p')">Abbrechen</button>
</div></div>

<div id="m-t" class="overlay"><div class="m-card">
    <h3>Werkzeug</h3>
    <input type="hidden" id="t-idx">
    <input id="t-id" placeholder="T-Nummer"><input id="t-nm" placeholder="Bezeichnung"><input id="t-dia" placeholder="Ø">
    <button class="btn btn-black" onclick="addT()">Speichern</button>
    <button class="btn btn-gray" onclick="hideM('m-t')">Abbrechen</button>
</div></div>

<div id="m-i" class="overlay"><div class="m-card">
    <h3>Import</h3>
    <textarea id="i-txt" rows="8" placeholder="T01..."></textarea>
    <button class="btn btn-black" onclick="doImp()">Einlesen</button>
    <button class="btn btn-gray" onclick="hideM('m-i')">Abbrechen</button>
</div></div>

<div id="m-pre" class="overlay pre-view">
    <div class="bar">
        <button class="btn btn-gray" style="width:auto; margin:0" onclick="hideM('m-pre')">ZURÜCK</button>
        <button id="d-btn" class="btn btn-black" style="width:auto; margin:0" onclick="makePDF()">PDF SPEICHERN</button>
    </div>
    <div class="pre-body"><div id="pdf-area"></div></div>
</div>

<script src="app.js"></script>
</body>
</html>
