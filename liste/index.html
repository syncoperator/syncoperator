<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS PRO CENTRAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view">
        <div class="app-bar"><div class="brand">QS CENTRAL</div><button onclick="modalP()" style="background:#0A84FF; color:#fff; border:none; padding:10px 20px; border-radius:12px; font-weight:800;">+ NEU</button></div>
        <div id="list-p" class="scroll"></div>
    </div>

    <div id="v-det" class="view" style="display:none">
        <div class="app-bar">
            <button onclick="goHome()" style="background:none; border:none; color:#0A84FF; font-size:26px;">←</button>
            <div style="flex:1; text-align:center" onclick="modalP(true)"><small id="h-nam" style="color:#8e8e93; font-size:10px; text-transform:uppercase"></small><b id="h-num" style="display:block; font-size:20px"></b></div>
            <button onclick="makePDF()" style="background:none; border:none; color:#0A84FF; font-weight:900;">PDF</button>
        </div>
        <div class="action-grid">
            <div class="tile" onclick="modalT()"><div class="icon">⊕</div><b>Instrument</b></div>
            <div class="tile" onclick="show('m-imp')"><div class="icon">⤓</div><b>Import</b></div>
        </div>
        <div id="list-t" class="scroll"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT KONFIG</h2>
            <input type="hidden" id="p-idx">
            <label>NUMMER</label><input type="text" id="p-num">
            <label>NAME</label><input type="text" id="p-nam">
            <div class="row">
                <div><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div><label>SÄGELÄNGE</label><input type="text" id="p-sag"></div>
            </div>
            <div class="row">
                <div><label>STÜCK T</label><input type="text" id="p-stt"></div>
                <div><label>STÜCK N</label><input type="text" id="p-stn"></div>
            </div>
            <div class="row">
                <div><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>
            <button class="btn-prime" onclick="saveP()">SPEICHERN</button>
            <button class="btn-sec" onclick="hide('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>INSTRUMENT</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label><input type="text" id="t-id">
            <label>NAME / KOMMENTAR</label><input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label><input type="text" id="t-dia">
            <button class="btn-prime" onclick="saveT()">OK</button>
            <button class="btn-sec" style="color:#ff453a" onclick="delT()">LÖSCHEN</button>
            <button class="btn-sec" onclick="hide('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal"><h2>MASSENIMPORT</h2><textarea id="imp-area" rows="8" style="width:100%; background:#000; color:#fff; border:1px solid #2c2c2e; border-radius:15px; padding:15px;"></textarea><button class="btn-prime" onclick="runImp()" style="margin-top:15px">IMPORTIEREN</button><button class="btn-sec" onclick="hide('m-imp')">SCHLIESSEN</button></div>
    </div>

    <div id="pdf-box" style="display:none"></div>
    <script src="ui.js"></script>
</body>
</html>
