<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Tool Manager</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --card: #ffffff;
            --text: #000000;
            --accent: #007aff;
            --danger: #ff3b30;
            --gray: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* HEADER */
        .header { 
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            padding: 20px; position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #d1d1d6;
        }
        .header h1 { margin: 0; font-size: 22px; font-weight: 800; }

        /* VIEWS */
        .view { display: none; padding: 15px; flex-direction: column; }
        .view.active { display: flex; }

        /* CARDS */
        .list-item {
            background: var(--card); border-radius: 12px; padding: 15px;
            margin-bottom: 10px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            cursor: pointer; transition: transform 0.1s;
        }
        .list-item:active { transform: scale(0.98); }
        .list-item b { font-size: 18px; display: block; }
        .list-item small { color: var(--gray); font-weight: 600; }

        /* INPUTS */
        input, textarea {
            width: 100%; padding: 14px; margin-bottom: 12px;
            border: 1px solid #d1d1d6; border-radius: 10px;
            font-size: 16px; font-family: inherit; background: #fff;
        }

        /* BUTTONS */
        .btn {
            padding: 14px 20px; border-radius: 12px; border: none;
            font-weight: 700; font-size: 16px; cursor: pointer;
            text-align: center; transition: 0.2s;
        }
        .btn-main { background: var(--text); color: #fff; width: 100%; }
        .btn-add { 
            position: fixed; bottom: 30px; right: 20px; 
            width: 60px; height: 60px; border-radius: 30px;
            background: var(--text); color: #fff; font-size: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); z-index: 90;
        }

        /* MODAL */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
            z-index: 1000; align-items: flex-end;
        }
        .modal-content {
            background: var(--bg); width: 100%; padding: 25px;
            border-radius: 20px 20px 0 0; max-height: 90vh; overflow-y: auto;
        }

        /* PRINT */
        #print-container { display: none; }
        @media print {
            body * { display: none !important; }
            #print-container, #print-container * { display: block !important; }
            #print-container { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="header">
            <h1>QS PROJECTS</h1>
            <button class="btn" onclick="show('m-imp')" style="background:none; font-size:24px;">⚙️</button>
        </div>
        <div id="list-p"></div>
        <button class="btn btn-add" onclick="modalP()">+</button>
    </div>

    <div id="v-det" class="view">
        <div class="header">
            <div onclick="goHome()" style="cursor:pointer; font-weight:900;">← BACK</div>
            <div style="text-align:right;">
                <small id="h-nam"></small>
                <div id="h-num" style="font-weight:900; font-size:20px;"></div>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
            <button class="btn btn-main" onclick="makePDF()" style="background:#34c759;">PDF PRINT</button>
            <button class="btn btn-main" onclick="modalP(true)">EDIT INFO</button>
        </div>
        <div id="list-t" style="margin-top:20px;"></div>
        <button class="btn btn-add" onclick="modalT()">+</button>
    </div>

    <div id="m-p" class="modal">
        <div class="modal-content">
            <h2 id="p-title">Project Info</h2>
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJECT NUMBER">
            <input type="text" id="p-nam" placeholder="PART NAME">
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="p-lzf" placeholder="LAUFZEIT">
                <input type="text" id="p-sag" placeholder="SÄGELÄNGE">
                <input type="text" id="p-stt" placeholder="STÜCK T">
                <input type="text" id="p-stn" placeholder="STÜCK N">
                <input type="text" id="p-abs" placeholder="ABSTAND">
                <input type="text" id="p-grf" placeholder="GREIFBACKEN">
            </div>
            <button class="btn btn-main" onclick="saveP()">SAVE PROJECT</button>
            <button class="btn" onclick="hide('m-p')" style="width:100%; margin-top:10px;">CANCEL</button>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="modal-content">
            <h2>Tool Detail</h2>
            <input type="hidden" id="t-idx">
            <small>T-NR</small>
            <input type="text" id="t-id" placeholder="T-NR">
            <small>Beschreibung</small>
            <input type="text" id="t-nm" placeholder="WERKZEUGNAME">
            <small>Ø / Toleranz</small>
            <input type="text" id="t-dia" placeholder="Ø / TOLERANZ">
            
            <div id="btn-rev-toggle" style="margin: 10px 0 20px 0; padding: 15px; border-radius: 12px; text-align: center; font-weight: 900; cursor: pointer; border: 1px solid #d1d1d6;">SET AS UNTEN START</div>

            <button id="btn-save-t" class="btn btn-main" onclick="saveT()">SAVE TOOL</button>
            <button id="btn-del-t" class="btn" style="width:100%; margin-top:10px; color:var(--danger);" onclick="delT()">DELETE TOOL</button>
            <button class="btn" onclick="hide('m-t')" style="width:100%; margin-top:10px;">CANCEL</button>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="modal-content">
            <h2>Data Management</h2>
            <textarea id="imp-area" rows="10" placeholder="JSON or Text..."></textarea>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <button class="btn btn-main" onclick="exportJSON()">EXPORT</button>
                <button class="btn btn-main" onclick="importJSON()">IMPORT</button>
            </div>
            <button class="btn btn-main" onclick="runImp()" style="margin-top:10px; background:#5856d6;">IMPORT FROM TEXT</button>
            <button class="btn" onclick="hide('m-imp')" style="width:100%; margin-top:10px;">CLOSE</button>
        </div>
    </div>

    <div id="print-container"></div>

    <script>
        const DB_KEY = 'QS_DATA_V8';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;

        const el = (id) => document.getElementById(id);
        const show = (id) => { if(el(id)) el(id).style.display = 'flex'; };
        const hide = (id) => { if(el(id)) el(id).style.display = 'none'; };

        function modalP(edit = false) {
            if (!edit) currentIdx = null; 
            const p = (edit && currentIdx !== null && db[currentIdx]) ? db[currentIdx] : {num:'', name:'', lzf:'', sag:'', stt:'', stn:'', abs:'', grf:''};
            el('p-idx').value = edit ? currentIdx : '';
            el('p-num').value = p.num || ''; el('p-nam').value = p.name || '';
            el('p-lzf').value = p.lzf || ''; el('p-sag').value = p.sag || '';
            el('p-stt').value = p.stt || ''; el('p-stn').value = p.stn || '';
            el('p-abs').value = p.abs || ''; el('p-grf').value = p.grf || '';
            show('m-p');
        }

        function saveP() {
            const idx = el('p-idx').value;
            const newP = {
                num: el('p-num').value, name: el('p-nam').value.toUpperCase(),
                lzf: el('p-lzf').value, sag: el('p-sag').value,
                stt: el('p-stt').value, stn: el('p-stn').value,
                abs: el('p-abs').value, grf: el('p-grf').value,
                tools: (idx !== '' && db[idx]) ? (db[idx].tools || []) : []
            };
            if (idx === '') { db.push(newP); currentIdx = db.length - 1; } else { db[idx] = newP; }
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            hide('m-p'); renderList();
            if(idx !== '') openProject(idx); else goHome();
        }

        function renderList() {
            const list = el('list-p'); if(!list) return;
            list.innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div><small>${p.name || '---'}</small><b>${p.num || '---'}</b></div>
                    <div style="color:var(--danger); font-weight:900; padding:15px;" onclick="event.stopPropagation(); deleteProject(${i})">✕</div>
                </div>`).join('') + '<div style="height:100px"></div>';
        }

        function openProject(i) {
            if (db[i]) {
                currentIdx = i;
                el('v-home').classList.remove('active');
                el('v-det').classList.add('active');
                el('h-num').innerText = db[i].num || '---';
                el('h-nam').innerText = db[i].name || '---';
                renderTools();
            }
        }

        function goHome() { currentIdx = null; el('v-home').classList.add('active'); el('v-det').classList.remove('active'); renderList(); }

        function renderTools() {
            const list = el('list-t'); if(!list || currentIdx === null) return;
            const tools = db[currentIdx].tools || [];
            list.innerHTML = '';
            tools.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.draggable = true;
                item.style.flexDirection = 'column';
                item.style.alignItems = 'flex-start';
                const revMark = t.rev ? `<div style="background:#000; color:#fff; font-size:10px; padding:2px 6px; border-radius:4px; margin-bottom:5px; font-weight:900;">REVOLVER UNTEN ↓</div>` : '';
                item.innerHTML = `
                    ${revMark}
                    <div style="width:100%;" onclick="modalT(${i})">
                        <small style="color:#gray; font-weight:700; font-size:11px;">${t.id || 'T0000'}</small>
                        <b style="font-size:20px; font-weight:900; line-height:1.2;">${t.nm || '---'}</b>
                    </div>
                `;
                item.ondragstart = (e) => { e.dataTransfer.setData('text/plain', i); item.style.opacity = '0.4'; };
                item.ondragend = () => { item.style.opacity = '1'; renderTools(); };
                item.ondragover = (e) => e.preventDefault();
                item.ondrop = (e) => {
                    e.preventDefault();
                    const from = e.dataTransfer.getData('text/plain');
                    const toolsArr = db[currentIdx].tools;
                    const movedItem = toolsArr.splice(parseInt(from), 1)[0];
                    toolsArr.splice(i, 0, movedItem);
                    localStorage.setItem(DB_KEY, JSON.stringify(db));
                    renderTools();
                };
                list.appendChild(item);
            });
            list.innerHTML += '<div style="height:150px; pointer-events:none;"></div>'; 
        }

        function modalT(i = null) {
            const edit = i !== null;
            el('t-idx').value = edit ? i : '';
            const t = (edit && db[currentIdx].tools[i]) ? db[currentIdx].tools[i] : {id:'', nm:'', dia:'', rev:false};
            el('t-id').value = t.id; el('t-nm').value = t.nm; el('t-dia').value = t.dia;
            
            const btn = el('btn-rev-toggle');
            const updateBtn = (state) => {
                btn.dataset.state = state;
                btn.innerText = state ? "✓ UNTEN (START)" : "SET AS UNTEN START";
                btn.style.background = state ? "#000" : "#f0f0f0";
                btn.style.color = state ? "#fff" : "#000";
            };
            updateBtn(t.rev === true);
            btn.onclick = () => updateBtn(!(btn.dataset.state === 'true'));
            
            el('btn-del-t').style.display = edit ? 'block' : 'none';
            show('m-t');
        }

        function saveT() {
            const i = el('t-idx').value;
            const isUnten = el('btn-rev-toggle').dataset.state === 'true';
            const t = { id: el('t-id').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(), dia: el('t-dia').value, rev: isUnten };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(i === '') db[currentIdx].tools.push(t); else db[currentIdx].tools[parseInt(i)] = t;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderTools(); hide('m-t');
        }

        function makePDF() {
            const p = db[currentIdx];
            const getRow = (t) => {
                const isLong = (t.dia || '').length > 15;
                const displayDia = t.dia.includes('/') ? t.dia.split('/').join('<br>') : t.dia;
                return `<div style="display:flex; align-items:${isLong?'center':'baseline'}; border-bottom:1px solid #eee; padding:10px 0; width:100%;">
                    <div style="width:75px; font-weight:800; font-size:15px;">${t.id}</div>
                    <div style="flex:1; font-weight:700; font-size:15px; text-transform:uppercase; padding-right:10px;">${t.nm}</div>
                    <div style="width:125px; text-align:right; font-weight:800; font-size:14px; line-height:1.2;">${displayDia}</div>
                </div>`;
            };
            let oben = [], unten = [], target = oben;
            (p.tools || []).forEach(t => { if(t.rev) target = unten; target.push(t); });
            const html = `<div style="width:210mm; padding:12mm; background:#fff; font-family:sans-serif;">
                <div style="border:2px solid #000; padding:25px; min-height:265mm; display:flex; flex-direction:column;">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                        <div>
                            <div style="font-size:13px; font-weight:900; color:#666;">${p.name || ''}</div>
                            <div style="font-size:64px; font-weight:900; line-height:0.8;">${p.num || '---'}</div>
                        </div>
                        <div style="width:220px; font-size:11px; font-weight:800; line-height:1.5;">
                            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>ABSTAND</span><span>${p.abs}</span></div>
                            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>LAUFZEIT</span><span>${p.lzf}</span></div>
                            <div style="display:flex; justify-content:space-between;"><span>STÜCK T</span><span>${p.stt}</span></div>
                        </div>
                    </div>
                    <div style="border-bottom:5px solid #000; margin-bottom:15px;"></div>
                    <div style="background:#000; color:#fff; padding:5px 10px; font-weight:900; font-size:13px;">REVOLVER OBEN</div>
                    ${oben.map(getRow).join('')}
                    ${unten.length > 0 ? `<div style="background:#000; color:#fff; padding:5px 10px; font-weight:900; font-size:13px; margin-top:20px;">REVOLVER UNTEN</div>` + unten.map(getRow).join('') : ''}
                </div>
            </div>`;
            el('print-container').innerHTML = html;
            setTimeout(() => { window.print(); }, 150);
        }

        function deleteProject(i) { if(confirm('Delete Project?')) { db.splice(i, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); } }
        function delT() { db[currentIdx].tools.splice(el('t-idx').value, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); hide('m-t'); }
        function exportJSON() { el('imp-area').value = JSON.stringify(db); alert("Copied"); }
        function importJSON() { try { db = JSON.parse(el('imp-area').value); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); hide('m-imp'); } catch(e){alert("Error");} }
        function runImp() {
            const parts = el('imp-area').value.split(/(T[0O]\d{2,4})/gi);
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            for (let i = 1; i < parts.length; i += 2) {
                db[currentIdx].tools.push({ id: parts[i].toUpperCase().replace('O', '0'), nm: (parts[i+1]||'').trim().toUpperCase(), dia: '', rev: false });
            }
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); hide('m-imp');
        }

        window.onload = renderList;
    </script>
</body>
</html>
