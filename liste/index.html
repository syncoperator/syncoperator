<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Tool Manager Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="header">
            <h1>PROJECTS</h1>
            <button class="btn-icon" onclick="show('m-imp')">⚙️</button>
        </div>
        <div id="list-p"></div>
        <button class="btn-add" onclick="modalP()">+</button>
    </div>

    <div id="v-det" class="view">
        <div class="header">
            <button class="btn-back" onclick="goHome()">← BACK</button>
            <div class="header-info">
                <small id="h-nam"></small>
                <b id="h-num"></b>
            </div>
        </div>
        
        <div class="action-bar">
            <button class="btn btn-print" onclick="makePDF()">PDF PRINT</button>
            <button class="btn btn-edit" onclick="modalP(true)">EDIT INFO</button>
        </div>

        <div id="list-t"></div>
        <button class="btn-add" onclick="modalT()">+</button>
    </div>

    <div id="m-p" class="modal">
        <div class="modal-content">
            <h3>Project Info</h3>
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJECT NUMBER">
            <input type="text" id="p-nam" placeholder="PART NAME">
            <div class="grid-2">
                <input type="text" id="p-lzf" placeholder="LAUFZEIT">
                <input type="text" id="p-sag" placeholder="SÄGELÄНGE">
                <input type="text" id="p-stt" placeholder="STÜCK T">
                <input type="text" id="p-stn" placeholder="STÜCK N">
                <input type="text" id="p-abs" placeholder="ABSTAND">
                <input type="text" id="p-grf" placeholder="GREIFBACKEN">
            </div>
            <button class="btn btn-save" onclick="saveP()">SAVE PROJECT</button>
            <button class="btn btn-cancel" onclick="hide('m-p')">CANCEL</button>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="modal-content">
            <h3>Tool Detail</h3>
            <input type="hidden" id="t-idx">
            <div class="input-group">
                <small>T-NR</small>
                <input type="text" id="t-id" placeholder="T0000">
            </div>
            <div class="input-group">
                <small>Beschreibung</small>
                <input type="text" id="t-nm" placeholder="WERKZEUGNAME">
            </div>
            <div class="input-group">
                <small>Ø / Toleranz</small>
                <input type="text" id="t-dia" placeholder="Ø / TOLERANZ">
            </div>
            
            <div id="btn-rev-toggle" class="rev-toggle">SET AS UNTEN START</div>

            <button class="btn btn-save" onclick="saveT()">SAVE TOOL</button>
            <button id="btn-del-t" class="btn btn-del" onclick="delT()">DELETE</button>
            <button class="btn btn-cancel" onclick="hide('m-t')">CANCEL</button>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="modal-content">
            <h3>Data Management</h3>
            <textarea id="imp-area" rows="8" placeholder="JSON or Text data..."></textarea>
            <div class="grid-2">
                <button class="btn" onclick="exportJSON()">JSON EXPORT</button>
                <button class="btn" onclick="importJSON()">JSON IMPORT</button>
            </div>
            <button class="btn btn-save" onclick="runImp()" style="margin-top:10px;">IMPORT FROM TEXT</button>
            <button class="btn btn-cancel" onclick="hide('m-imp')">CLOSE</button>
        </div>
    </div>

    <div id="print-container"></div>

    <script src="ui.js"></script>
</body>
</html>
