<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Central System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="print-section" style="display:none;"><div id="print-area"></div></div>

<div id="v-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content">
        <button class="btn btn-gray" onclick="loadDemo()">DEMO DATEN LADEN</button>
        <div id="list-p"></div>
    </div>
    <button class="fab" onclick="openNewProject()">+</button>
</div>

<div id="v-det" class="view">
    <div class="bar">
        <button onclick="goHome()" class="btn-back">←</button>
        <div class="bar-info" onclick="editCurrentProject()">
            <b id="d-num"></b><br>
            <small id="d-nam"></small>
        </div>
    </div>
    <div class="content">
        <div id="list-t"></div>
        <button class="btn btn-black" style="margin-top:20px" onclick="printPDF()">PDF GENERIEREN</button>
    </div>
    <button class="fab" onclick="openNewTool()">+</button>
</div>

<div id="m-p" class="overlay"><div class="m-card">
    <input type="hidden" id="p-idx">
    <label>Zeichnungsnummer</label>
    <input id="p-num" placeholder="233562">
    <label>Bezeichnung</label>
    <input id="p-nam" placeholder="BUCHSE">
    <button class="btn btn-black" onclick="saveProject()">SPEICHERN</button>
    <button class="btn btn-gray" onclick="hideM('m-p')">ABBRECHEN</button>
</div></div>

<div id="m-t" class="overlay"><div class="m-card">
    <input type="hidden" id="t-idx">
    <label>Smart-Input (T... Name Ø)</label>
    <input id="t-smart" placeholder="T01 FRAESER 12 -0.1" oninput="doSmart()">
    <div class="grid-2">
        <div><label>T-NR</label><input id="t-id" placeholder="T01"></div>
        <div><label>Ø / TOLERANZ</label><textarea id="t-dia" rows="2"></textarea></div>
    </div>
    <label>Bezeichnung</label>
    <input id="t-nm" placeholder="NAME">
    <button class="btn btn-black" onclick="saveTool()">SPEICHERN</button>
    <button id="btn-del-t" class="btn btn-red" onclick="delTool()">LÖSCHEN</button>
    <button class="btn btn-gray" onclick="hideM('m-t')">ABBRECHEN</button>
</div></div>

<script src="app.js"></script>
</body>
</html>
