<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL FIXED</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div id="view-home" class="view active-view">
        <div class="app-bar"><h1>PROJECT MANAGER</h1></div>
        <div class="scroll-area">
            <div id="project-list" class="container"></div>
        </div>
        <button class="fab" onclick="openModal('modal-p')">+</button>
    </div>

    <div id="view-detail" class="view">
        <div class="app-bar">
            <button class="btn-ghost" style="font-size: 24px; padding: 0; width: auto;" onclick="goHome()">←</button>
            <div style="text-align: right;">
                <span id="det-num" style="font-weight: 900; display: block;"></span>
                <small id="det-name" style="color:#888; text-transform:uppercase;"></small>
            </div>
        </div>
        <div class="scroll-area">
            <div class="container">
                <button class="btn btn-blue" onclick="openModal('modal-import')">SCHNELL IMPORT</button>
                <div id="tool-list" style="margin-top: 15px;"></div>
                <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                    <button class="btn" onclick="openPreview()">VORSCHAU</button>
                    <button class="btn btn-red" onclick="clearTools()">LEEREN</button>
                </div>
            </div>
        </div>
        <button class="fab" onclick="openTModal()">+</button>
    </div>

    <div id="modal-p" class="modal-overlay">
        <div class="modal-card">
            <span class="modal-title">Neues Projekt</span>
            <input id="p-in-num" placeholder="Zeichnungs-Nr">
            <input id="p-in-name" placeholder="Bauteil Name">
            <button class="btn" onclick="saveProject()">Speichern</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-p')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-t" class="modal-overlay">
        <div class="modal-card">
            <span class="modal-title">Werkzeug</span>
            <input type="hidden" id="t-idx">
            <input id="t-in-id" placeholder="T-Nummer">
            <input id="t-in-nm" placeholder="Bezeichnung">
            <input id="t-in-diam" placeholder="Ø Durchmesser">
            <button class="btn" onclick="saveTool()">Speichern</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-t')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-import" class="modal-overlay">
        <div class="modal-card">
            <span class="modal-title">Text Import</span>
            <textarea id="import-area" style="height:150px; font-family:monospace;" placeholder="T01..."></textarea>
            <button class="btn" onclick="runImport()">Einlesen</button>
            <button class="btn btn-ghost" onclick="closeModal('modal-import')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-prev" class="modal-overlay full-screen">
        <div class="prev-header">
            <button class="btn-ghost" style="width: auto;" onclick="closeModal('modal-prev')">← ZURÜCK</button>
            <button id="download-btn" class="btn btn-sm" onclick="downloadPDF()">PDF SPEICHERN</button>
        </div>
        <div class="prev-body">
            <div id="preview-stage" class="pdf-wrapper"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
