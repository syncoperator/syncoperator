<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="app-bar">
            <div class="brand">QS CENTRAL</div>
            <button class="btn-add-main" onclick="modalP()">+ NEU</button>
        </div>
        <div class="scroll-content" id="list-p"></div>
    </div>

    <div id="v-det" class="view">
        <div class="app-bar">
            <button class="nav-back" onclick="goHome()">←</button>
            <div class="project-info" onclick="modalP(true)">
                <small id="h-nam">NAME</small>
                <b id="h-num">000000</b>
            </div>
            <button class="pdf-trigger" onclick="makePDF()">PDF</button>
        </div>
        
        <div class="action-grid">
            <div class="btn-card" onclick="modalT()">
                <span class="icon">⊕</span>
                <span>Instrument</span>
            </div>
            <div class="btn-card" onclick="showM('m-imp')">
                <span class="icon">⤓</span>
                <span>Import</span>
            </div>
        </div>

        <div id="list-t" class="scroll-content"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT DETAILS</h2>
            <input type="hidden" id="p-idx">
            <label>NUMMER</label><input type="text" id="p-num">
            <label>NAME</label><input type="text" id="p-nam">
            
            <div class="grid-2">
                <div><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>
            <div class="grid-2">
                <div><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div><label>SÄGELÄNGE</label><input type="text" id="p-sag"></div>
            </div>
            <div class="grid-2">
                <div><label>STÜCK A</label><input type="text" id="p-sta"></div>
                <div><label>STÜCK B</label><input type="text" id="p-stb"></div>
            </div>

            <button class="btn-prime" onclick="saveP()">SPEICHERN</button>
            <button class="btn-text" onclick="hideM('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>INSTRUMENT</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label><input type="text" id="t-id" placeholder="T01">
            <label>WERKZEUGNAME</label><input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label><input type="text" id="t-dia">
            
            <button class="btn-prime" onclick="saveT()">OK</button>
            <button id="btn-del-t" class="btn-danger" onclick="delT()">LÖSCHEN</button>
            <button class="btn-text" onclick="hideM('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h2>MASSENIMPORT</h2>
            <textarea id="imp-area" rows="8" placeholder="Инструменты по одному в строке..."></textarea>
            <button class="btn-prime" onclick="runImp()">IMPORTIEREN</button>
            <button class="btn-text" onclick="hideM('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="pdf-render"></div>
    <script src="ui.js"></script>
</body>
</html>
