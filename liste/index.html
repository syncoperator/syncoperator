<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Tool Final</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="print-section"><div id="print-area"></div></div>

<div id="v-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content" id="list-p"></div>
    <button class="fab" onclick="showM('m-p')">+</button>
</div>

<div id="v-det" class="view">
    <div class="bar">
        <button onclick="goHome()" style="border:none;background:none;font-size:24px;">←</button>
        <div style="text-align:right"><b id="d-num"></b><br><small id="d-nam"></small></div>
    </div>
    <div class="content">
        <button class="btn btn-blue" onclick="showM('m-i')">IMPORTIEREN</button>
        <div id="list-t"></div>
        <button class="btn btn-black" style="margin-top:20px" onclick="printPDF()">DRUCKEN / PDF</button>
    </div>
    <button class="fab" onclick="showM('m-t')">+</button>
</div>

<div id="m-p" class="overlay"><div class="m-card">
    <h3>Projekt</h3>
    <input id="p-num" placeholder="Nummer"><input id="p-nam" placeholder="Name">
    <button class="btn btn-black" onclick="addP()">Speichern</button>
    <button class="btn btn-gray" onclick="hideM('m-p')">Abbrechen</button>
</div></div>

<div id="m-t" class="overlay"><div class="m-card">
    <h3>Werkzeug</h3>
    <input type="hidden" id="t-idx">
    <input id="t-id" placeholder="T-NR"><input id="t-nm" placeholder="Bezeichnung"><input id="t-dia" placeholder="Ø">
    <button class="btn btn-black" onclick="addT()">Speichern</button>
    <button class="btn btn-gray" onclick="hideM('m-t')">Abbrechen</button>
</div></div>

<div id="m-i" class="overlay"><div class="m-card">
    <h3>Import</h3>
    <textarea id="i-txt" rows="8" placeholder="T0101..."></textarea>
    <button class="btn btn-black" onclick="doImp()">Einlesen</button>
    <button class="btn btn-gray" onclick="hideM('m-i')">Abbrechen</button>
</div></div>

<script src="app.js"></script>
</body>
</html>
