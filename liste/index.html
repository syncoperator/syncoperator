<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="nav-bar">
            <h1 class="nav-title">QS <span>CENTRAL</span></h1>
            <button class="btn-add-main" onclick="modalP()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="nav-btn-round" onclick="goHome()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="nav-header-center" onclick="modalP(true)">
                <span id="h-nam">Name</span>
                <span id="h-num">000000</span>
            </div>
            <button class="nav-btn-round action" onclick="makePDF()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            </button>
        </div>

        <div class="controls-area">
            <button class="p-btn primary" onclick="modalT()">+ Instrument</button>
            <button class="p-btn secondary" onclick="show('m-imp')">Import</button>
        </div>

        <div id="list-t" class="content-scroll padded"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <div class="modal-indicator"></div>
            <h3>Projekt Daten</h3>
            <input type="hidden" id="p-idx">
            <div class="input-grid">
                <div class="f-group full"><label>Zeichnungsnummer</label><input type="text" id="p-num" placeholder="000000"></div>
                <div class="f-group full"><label>Kunde / Name</label><input type="text" id="p-nam" placeholder="BUCHSE"></div>
                <div class="f-group"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="f-group"><label>Sägelänge</label><input type="text" id="p-sag"></div>
                <div class="f-group"><label>Stück T</label><input type="text" id="p-stt"></div>
                <div class="f-group"><label>Stück N</label><input type="text" id="p-stn"></div>
                <div class="f-group"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="f-group"><label>Greifbacken</label><input type="text" id="p-grf"></div>
            </div>
            <div class="modal-footer">
                <button class="p-btn primary wide" onclick="saveP()">Speichern</button>
                <button class="p-btn ghost" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <div class="modal-indicator"></div>
            <h3>Werkzeug</h3>
            <input type="hidden" id="t-idx">
            <div class="f-group full"><label>T-Nr</label><input type="text" id="t-id" placeholder="T0101"></div>
            <div class="f-group full"><label>Beschreibung</label><input type="text" id="t-nm"></div>
            <div class="f-group full"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
            <div class="modal-footer">
                <button class="p-btn primary wide" onclick="saveT()">OK</button>
                <button id="btn-del-t" class="p-btn danger wide" onclick="delT()">Löschen</button>
                <button class="p-btn ghost" onclick="hide('m-t')">Zurück</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <div class="modal-indicator"></div>
            <h3>Import</h3>
            <textarea id="imp-area" rows="8" placeholder="T0101..."></textarea>
            <div class="modal-footer">
                <button class="p-btn primary wide" onclick="runImp()">Importieren</button>
                <button class="p-btn ghost" onclick="hide('m-imp')">Schließen</button>
            </div>
        </div>
    </div>

    <div id="print-container"></div>
    <script src="ui.js"></script>
</body>
</html>
