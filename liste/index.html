<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>QS Tool</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="v-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content" id="list-p"></div>
    <button class="fab" onclick="showM('m-p')">+</button>
</div>

<div id="v-det" class="view">
    <div class="bar">
        <button onclick="goHome()" class="back">←</button>
        <div class="title">
            <b id="d-num"></b><br>
            <small id="d-nam"></small>
        </div>
    </div>

    <div class="content" id="print-area">
        <button class="btn btn-blue no-print" onclick="showM('m-i')">LISTE IMPORTIEREN</button>

        <table class="pdf-table">
            <thead>
                <tr>
                    <th>T-NR</th>
                    <th>WERKZEUG</th>
                    <th>Ø</th>
                </tr>
            </thead>
            <tbody id="list-t"></tbody>
        </table>

        <button class="btn btn-black no-print" onclick="printPDF()">PDF / DRUCK</button>
    </div>

    <button class="fab no-print" onclick="showM('m-t')">+</button>
</div>

<!-- MODALS -->
<div id="m-p" class="overlay">
    <div class="m-card">
        <h3>Neues Projekt</h3>
        <input id="p-num" placeholder="Nummer">
        <input id="p-nam" placeholder="Name">
        <button class="btn btn-black" onclick="addP()">Speichern</button>
        <button class="btn btn-gray" onclick="hideM('m-p')">Abbrechen</button>
    </div>
</div>

<div id="m-t" class="overlay">
    <div class="m-card">
        <h3>Werkzeug</h3>
        <input type="hidden" id="t-idx">
        <input id="t-id" placeholder="T-NR">
        <input id="t-nm" placeholder="Bezeichnung">
        <input id="t-dia" placeholder="Ø">
        <button class="btn btn-black" onclick="addT()">Speichern</button>
        <button class="btn btn-gray" onclick="hideM('m-t')">Abbrechen</button>
    </div>
</div>

<div id="m-i" class="overlay">
    <div class="m-card">
        <h3>Import</h3>
        <textarea id="i-txt" rows="10"></textarea>
        <button class="btn btn-black" onclick="doImp()">Einlesen</button>
        <button class="btn btn-gray" onclick="hideM('m-i')">Abbrechen</button>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
