<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core System</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="pdf-template"></div>

<!-- HOME -->
<div id="view-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content" id="project-list"></div>
    <button class="fab" onclick="Actions.openProjectModal()">+</button>
</div>

<!-- PROJECT -->
<div id="view-project" class="view">
    <div class="bar">
        <button class="back" onclick="Actions.goHome()">←</button>
        <div class="title">
            <b id="p-num"></b><br>
            <small id="p-name"></small>
        </div>
    </div>

    <div class="content">
        <button class="btn btn-black" onclick="Actions.openToolModal()">+ Werkzeug</button>
        <div id="tool-list"></div>
        <button class="btn btn-gray" onclick="Actions.openPdfPreview()">PDF PREVIEW</button>
    </div>
</div>

<!-- PROJECT MODAL -->
<div id="modal-project" class="overlay">
    <div class="m-card">
        <h3>Projekt</h3>
        <input id="mp-num" placeholder="Nummer">
        <input id="mp-name" placeholder="Name">
        <button class="btn btn-black" onclick="Actions.saveProject()">Speichern</button>
        <button class="btn btn-gray" onclick="UI.hide('modal-project')">Abbrechen</button>
    </div>
</div>

<!-- TOOL MODAL -->
<div id="modal-tool" class="overlay">
    <div class="m-card">
        <h3>Werkzeug</h3>
        <input type="hidden" id="mt-old">
        <input id="mt-id" placeholder="T0101">
        <input id="mt-name" placeholder="Bezeichnung">
        <input id="mt-dia" placeholder="Ø">
        <button class="btn btn-black" onclick="Actions.saveTool()">Speichern</button>
        <button class="btn btn-gray" onclick="UI.hide('modal-tool')">Abbrechen</button>
    </div>
</div>

<!-- PDF PREVIEW -->
<div id="modal-pdf" class="overlay">
    <div class="pdf-modal">
        <div class="pdf-preview-wrap">
            <div id="pdf-preview"></div>
        </div>
        <div class="pdf-actions">
            <button class="btn btn-gray" onclick="UI.hide('modal-pdf')">Закрыть</button>
            <button class="btn btn-black" onclick="Actions.exportPdf()">Скачать PDF</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
