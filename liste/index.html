<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="nav-bar">
            <div class="nav-title">QS CENTRAL</div>
            <button class="nav-btn-primary" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="nav-btn-back" onclick="goHome()">←</button>
            <div class="nav-header-center" onclick="modalP(true)">
                <span id="h-nam">NAME</span>
                <span id="h-num">000000</span>
            </div>
            <button class="nav-btn-text" onclick="makePDF()">PDF</button>
        </div>

        <div class="controls-area">
            <button class="action-btn" onclick="modalT()">+ INSTRUMENT</button>
            <button class="action-btn outline" onclick="show('m-imp')">IMPORT</button>
        </div>

        <div id="list-t" class="content-scroll padded"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h3>PROJEKT DATEN</h3>
            <input type="hidden" id="p-idx">
            <div class="input-group">
                <label>Nummer</label>
                <input type="text" id="p-num" placeholder="z.B. 233562">
            </div>
            <div class="input-group">
                <label>Name / Kunde</label>
                <input type="text" id="p-nam" placeholder="z.B. BUCHSE">
            </div>
            
            <div class="grid-2">
                <div class="input-group"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="input-group"><label>Sägelänge</label><input type="text" id="p-sag"></div>
                <div class="input-group"><label>Stück T</label><input type="text" id="p-stt"></div>
                <div class="input-group"><label>Stück N</label><input type="text" id="p-stn"></div>
                <div class="input-group"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="input-group"><label>Greifbacken</label><input type="text" id="p-grf"></div>
            </div>

            <button class="btn-save" onclick="saveP()">SPEICHERN</button>
            <button class="btn-cancel" onclick="hide('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h3>WERKZEUG</h3>
            <input type="hidden" id="t-idx">
            <div class="input-group">
                <label>T-Nr</label>
                <input type="text" id="t-id" placeholder="T?">
            </div>
            <div class="input-group">
                <label>Beschreibung</label>
                <input type="text" id="t-nm">
            </div>
            <div class="input-group">
                <label>Ø / Toleranz</label>
                <input type="text" id="t-dia">
            </div>
            
            <button class="btn-save" onclick="saveT()">OK</button>
            <button id="btn-del-t" class="btn-delete" onclick="delT()">LÖSCHEN</button>
            <button class="btn-cancel" onclick="hide('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h3>IMPORT</h3>
            <p style="font-size: 12px; color: #888; margin-bottom: 10px;">Вставь список текстом. Каждая строка = новый инструмент.</p>
            <textarea id="imp-area" rows="10" placeholder="Paste here..."></textarea>
            <button class="btn-save" onclick="runImp()">IMPORTIEREN</button>
            <button class="btn-cancel" onclick="hide('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="print-container"></div>

    <script src="ui.js"></script>
</body>
</html>
