<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="app-bar">
            <div class="brand">QS CENTRAL</div>
            <button class="btn-main-add" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="app-bar">
            <button class="nav-btn" onclick="goHome()">←</button>
            <div class="header-info" onclick="modalP(true)">
                <small id="h-nam">PROJEKTNAME</small>
                <b id="h-num">000000</b>
            </div>
            <button class="pdf-btn" onclick="makePDF()">PDF</button>
        </div>
        
        <div class="action-grid">
            <div class="tile" onclick="modalT()">
                <div class="icon">⊕</div>
                <b>Instrument</b>
            </div>
            <div class="tile" onclick="show('m-imp')">
                <div class="icon">⤓</div>
                <b>Import</b>
            </div>
        </div>
        <div id="list-t" class="scroll"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT DETAILS</h2>
            <input type="hidden" id="p-idx">
            <label>NUMMER</label><input type="text" id="p-num">
            <label>NAME</label><input type="text" id="p-nam">
            <div class="row">
                <div><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div><label>SÄGELÄNGE</label><input type="text" id="p-sag"></div>
            </div>
            <div class="row">
                <div><label>STÜCK T</label><input type="text" id="p-stt"></div>
                <div><label>STÜCK N</label><input type="text" id="p-stn"></div>
            </div>
            <div class="row">
                <div><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>
            <button class="btn-prime" onclick="saveP()">SPEICHERN</button>
            <button class="btn-sec" onclick="hide('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>INSTRUMENT</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label><input type="text" id="t-id" placeholder="T01">
            <label>NAME / KOMMENTAR</label><input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label><input type="text" id="t-dia">
            <button class="btn-prime" onclick="saveT()">OK</button>
            <button id="btn-del-t" class="btn-danger" onclick="delT()">LÖSCHEN</button>
            <button class="btn-sec" onclick="hide('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h2>MASSENIMPORT</h2>
            <textarea id="imp-area" rows="10" placeholder="Одна строка = один инструмент"></textarea>
            <button class="btn-prime" onclick="runImp()">IMPORTIEREN</button>
            <button class="btn-sec" onclick="hide('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="pdf-box" style="display:none"></div>
    <script src="ui.js"></script>
</body>
</html>
