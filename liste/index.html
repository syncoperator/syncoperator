<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkzeugliste</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div id="view-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content" id="project-list"></div>
    <button class="fab" onclick="openProjectModal()">+</button>
</div>

<div id="view-project" class="view">
    <div class="bar">
        <button class="back" onclick="goHome()">←</button>
        <div class="title">
            <b id="p-num"></b><br>
            <small id="p-name"></small>
        </div>
    </div>

    <div class="content">
        <button class="btn btn-black" onclick="openToolModal()">+ Werkzeug</button>
        <div id="tool-list"></div>
        <button class="btn btn-gray" onclick="exportWerkzeugPDF()">PDF / DRUCK</button>
    </div>
</div>

<!-- PROJECT -->
<div id="modal-project" class="overlay">
    <div class="m-card">
        <input id="mp-num" placeholder="Projekt Nr">
        <input id="mp-name" placeholder="Projekt Name">
        <button class="btn btn-black" onclick="saveProject()">Speichern</button>
    </div>
</div>

<!-- TOOL -->
<div id="modal-tool" class="overlay">
    <div class="m-card">
        <input type="hidden" id="mt-old">
        <input id="mt-id" placeholder="T-NR">
        <input id="mt-name" placeholder="Werkzeug">
        <input id="mt-dia" placeholder="Ø">
        <button class="btn btn-black" onclick="saveTool()">Speichern</button>
    </div>
</div>

<!-- PDF TEMPLATE -->
<div id="pdf-template"></div>

<script src="app.js"></script>
</body>
</html>
