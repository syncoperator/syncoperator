<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>QS TOOL v18</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

<div id="v-home" class="view active">
    <div class="bar"><b>PROJEKTE</b></div>
    <div class="content" id="list-p"></div>
    <button class="fab" onclick="showM('m-p')">+</button>
</div>

<div id="v-det" class="view">
    <div class="bar">
        <button onclick="goHome()" style="border:none;background:none;font-size:24px;">←</button>
        <div style="text-align:right"><b id="d-num"></b><br><small id="d-nam"></small></div>
    </div>
    <div class="content">
        <button class="btn btn-black" onclick="showM('m-i')">IMPORT</button>
        <div id="list-t"></div>
        <button class="btn btn-black" style="margin-top:20px" onclick="openPre()">PDF VORSCHAU</button>
    </div>
    <button class="fab" onclick="showM('m-t')">+</button>
</div>

<div id="m-p" class="overlay"><div class="m-card">
    <h3>Neues Projekt</h3>
    <input id="p-num" placeholder="Nummer"><input id="p-nam" placeholder="Name">
    <button class="btn btn-black" onclick="addP()">OK</button>
    <button class="btn btn-gray" onclick="hideM('m-p')">X</button>
</div></div>

<div id="m-t" class="overlay"><div class="m-card">
    <h3>Werkzeug</h3>
    <input type="hidden" id="t-idx">
    <input id="t-id" placeholder="T-NR"><input id="t-nm" placeholder="NAME"><input id="t-dia" placeholder="Ø">
    <button class="btn btn-black" onclick="addT()">OK</button>
    <button class="btn btn-gray" onclick="hideM('m-t')">X</button>
</div></div>

<div id="m-i" class="overlay"><div class="m-card">
    <h3>Import</h3>
    <textarea id="i-txt" rows="8" style="width:100%"></textarea>
    <button class="btn btn-black" onclick="doImp()">OK</button>
    <button class="btn btn-gray" onclick="hideM('m-i')">X</button>
</div></div>

<div id="m-pre" class="overlay">
    <div class="bar" style="position:fixed; top:0; width:100%;">
        <button class="btn-gray" style="padding:10px" onclick="hideM('m-pre')">ЗАКРЫТЬ</button>
        <button class="btn-black" style="padding:10px" onclick="makePDF()">СКАЧАТЬ PDF</button>
    </div>
    <div id="pdf-area"></div>
</div>

<script src="app.js"></script>
</body>
</html>
