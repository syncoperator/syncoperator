<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Werkzeugliste PDF</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div id="view-home" class="view active">
    <div class="bar"><b>PROJEKT</b></div>
    <div class="content">
        <button class="btn btn-black" onclick="openProject()">Projekt öffnen</button>
    </div>
</div>

<div id="view-project" class="view">
    <div class="bar">
        <button class="back" onclick="goHome()">←</button>
        <div class="title">
            <b id="p-num"></b><br>
            <small id="p-name"></small>
        </div>
    </div>

    <div class="content">
        <div id="tool-list"></div>
        <button class="btn btn-black" onclick="exportPDF()">PDF / DRUCK</button>
    </div>
</div>

<!-- PDF SOURCE (ВАЖНО: НЕ hidden / НЕ display:none) -->
<div id="pdf-root"></div>

<script src="app.js"></script>
</body>
</html>
