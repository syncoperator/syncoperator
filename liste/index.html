<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS TOOL FINAL 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #007AFF; --bg: #F2F2F7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: #000; overflow: hidden; }

        /* ИНТЕРФЕЙС */
        .view { display: none; flex-direction: column; height: 100vh; }
        .view.active { display: flex; }
        .header { background: #FFF; padding: 10px 16px; display: flex; align-items: center; border-bottom: 1px solid #D1D1D6; min-height: 64px; }
        .back-btn { border: none; background: none; font-size: 28px; color: var(--accent); padding-right: 15px; }
        .project-info { flex: 1; text-align: right; cursor: pointer; }
        .project-info b { font-size: 19px; display: block; line-height: 1.1; }
        .project-info small { color: var(--accent); font-weight: 700; text-transform: uppercase; font-size: 11px; }

        .content { flex: 1; overflow-y: auto; padding: 12px; -webkit-overflow-scrolling: touch; padding-bottom: 100px; }
        
        .tool-card { background: #FFF; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; align-items: center; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
        .drag-handle { color: #C7C7CC; padding-right: 15px; font-size: 20px; cursor: grab; }
        .tool-main { flex: 1; cursor: pointer; }
        .tool-id { font-weight: 800; color: var(--accent); font-size: 15px; }
        .tool-name { font-weight: 500; font-size: 14px; text-transform: uppercase; }
        .tool-dia { width: 80px; text-align: right; font-weight: 600; color: #8E8E93; }

        .btn { width: 100%; padding: 16px; border-radius: 14px; border: none; font-size: 16px; font-weight: 700; margin-bottom: 10px; }
        .btn-black { background: #000; color: #FFF; }
        .btn-gray { background: #E5E5EA; color: #000; }
        .btn-red { background: #FF3B30; color: #FFF; }
        .fab { position: fixed; bottom: 25px; right: 20px; width: 64px; height: 64px; border-radius: 32px; background: #000; color: #FFF; border: none; font-size: 32px; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal { background: #FFF; width: 100%; max-width: 400px; border-radius: 24px; padding: 25px; }
        input, textarea { width: 100%; padding: 14px; background: #F2F2F7; border: none; border-radius: 12px; margin-bottom: 14px; font-size: 16px; font-family: inherit; }
        label { font-size: 11px; color: #8E8E93; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; display: block; }

        /* ПЕЧАТЬ (PDF) */
        @media print {
            @page { size: A4; margin: 0; }
            body { background: #FFF; }
            .view, .fab, .overlay { display: none !important; }
            #print-container { display: block !important; padding: 15mm; }
            .pdf-frame { border: 1.5pt solid #000; padding: 25pt; min-height: 275mm; }
            .pdf-name { font-size: 12pt; text-transform: uppercase; margin: 0; color: #666; font-weight: 400; }
            .pdf-num { font-size: 36pt; font-weight: 800; margin: 0 0 10pt 0; line-height: 1; }
            .pdf-hr { border-top: 3.5pt solid #000; margin-bottom: 15pt; }
            table { width: 100%; border-collapse: collapse; }
            th { text-align: left; padding-bottom: 8pt; border-bottom: 2pt solid #000; font-size: 9pt; font-weight: 800; }
            td { padding: 10pt 5pt; border-bottom: 0.5pt solid #DDD; font-size: 10.5pt; font-weight: 400; text-transform: uppercase; }
            .td-id { width: 15%; font-weight: 700; }
            .td-nm { width: 70%; }
            .td-dia { width: 15%; text-align: right; font-weight: 700; }
        }
    </style>
</head>
<body>

<div id="print-container" style="display:none;"><div id="pdf-content"></div></div>

<div id="v-home" class="view active">
    <div class="header"><b>PROJEKTE</b></div>
    <div class="content">
        <button class="btn btn-gray" onclick="loadDemo()">DEMO: 15 TOOLS LADEN</button>
        <div id="list-p"></div>
    </div>
    <button class="fab" onclick="modalP()">+</button>
</div>

<div id="v-det" class="view">
    <div class="header">
        <button class="back-btn" onclick="goHome()">←</button>
        <div class="project-info" onclick="modalP(true)">
            <b id="h-num"></b><small id="h-nam"></small>
        </div>
    </div>
    <div class="content">
        <button class="btn btn-black" onclick="showM('m-imp')">MASSEN-IMPORT</button>
        <div id="list-t"></div>
        <button class="btn btn-black" style="margin-top:20px" onclick="makePDF()">PDF GENERIEREN</button>
    </div>
    <button class="fab" onclick="modalT()">+</button>
</div>

<div id="m-p" class="overlay"><div class="modal">
    <input type="hidden" id="p-idx"><label>Nummer</label><input id="p-num"><label>Name</label><input id="p-nam">
    <button class="btn btn-black" onclick="saveP()">OK</button>
    <button class="btn btn-gray" onclick="hideM('m-p')">X</button>
</div></div>

<div id="m-imp" class="overlay"><div class="modal">
    <label>Liste einfügen</label><textarea id="imp-area" rows="10"></textarea>
    <button class="btn btn-black" onclick="doImp()">IMPORTIEREN</button>
    <button class="btn btn-gray" onclick="hideM('m-imp')">X</button>
</div></div>

<div id="m-t" class="overlay"><div class="modal">
    <input type="hidden" id="t-idx"><label>Smart-Input</label><input id="t-smart" oninput="doSmart()">
    <div style="display:flex;gap:10px">
        <div style="flex:1"><label>T-NR</label><input id="t-id"></div>
        <div style="flex:1"><label>Ø / TOL.</label><input id="t-dia"></div>
    </div>
    <label>Bezeichnung</label><input id="t-nm">
    <button class="btn btn-black" onclick="saveT()">OK</button>
    <button id="btn-del-t" class="btn btn-red" onclick="delT()">LÖSCHEN</button>
    <button class="btn btn-gray" onclick="hideM('m-t')">X</button>
</div></div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v5_final')) || [];
    let cur = null;

    const showM = id => document.getElementById(id).style.display = 'flex';
    const hideM = id => document.getElementById(id).style.display = 'none';
    const saveDB = () => localStorage.setItem('qs_v5_final', JSON.stringify(db));

    function modalP(edit=false) {
        document.getElementById('p-idx').value = edit ? cur : "";
        document.getElementById('p-num').value = edit ? db[cur].num : "";
        document.getElementById('p-nam').value = edit ? db[cur].name : "";
        showM('m-p');
    }

    function saveP() {
        let i = document.getElementById('p-idx').value;
        let n = document.getElementById('p-num').value;
        let m = document.getElementById('p-nam').value.toUpperCase();
        if(!n) return;
        if(i==="") db.push({num:n, name:m, tools:[]}); else { db[i].num=n; db[i].name=m; }
        saveDB(); renderP(); hideM('m-p'); if(cur!==null) openProject(cur);
    }

    function renderP() {
        let l = document.getElementById('list-p'); l.innerHTML = "";
        db.forEach((p, i) => {
            l.innerHTML += `<div class="tool-card" onclick="openProject(${i})"><div style="flex:1"><b>${p.num}</b><small>${p.name}</small></div><button onclick="event.stopPropagation();delP(${i})" style="border:none;background:none;color:red;font-size:20px">✕</button></div>`;
        });
    }

    function openProject(i) {
        cur = i; document.getElementById('v-home').classList.remove('active'); document.getElementById('v-det').classList.add('active');
        document.getElementById('h-num').innerText = db[i].num; document.getElementById('h-nam').innerText = db[i].name;
        renderT();
    }

    function goHome() { cur=null; document.getElementById('v-det').classList.remove('active'); document.getElementById('v-home').classList.add('active'); renderP(); }
    function delP(i) { if(confirm('Löschen?')) { db.splice(i,1); saveDB(); renderP(); }}

    // ИНСТРУМЕНТЫ
    function parse(v) {
        let r = {id:"", nm:"", dia:""};
        let t = v.match(/T\d+/i); if(t) { r.id=t[0].toUpperCase(); v=v.replace(t[0],'').trim(); }
        let d = v.match(/(\d+[\.,]?\d*\s*[\+\-]?\s*\d*[\.,]?\d*)$/);
        if(d) { r.dia=d[0].trim(); v=v.replace(d[0],'').trim(); }
        r.nm = v.toUpperCase(); return r;
    }

    function doSmart() { let p=parse(document.getElementById('t-smart').value); document.getElementById('t-id').value=p.id; document.getElementById('t-dia').value=p.dia; document.getElementById('t-nm').value=p.nm; }
    
    function doImp() {
        document.getElementById('imp-area').value.split('\n').forEach(line => {
            if(line.trim()) {
                let p = parse(line);
                if(p.id) db[cur].tools.push({id:p.id, nm:p.nm, dia:p.dia});
            }
        });
        cleanSlots(); saveDB(); renderT(); hideM('m-imp'); document.getElementById('imp-area').value="";
    }

    function cleanSlots() {
        // Удаляем пустые слоты (где нет ID или имени)
        db[cur].tools = db[cur].tools.filter(t => t.id && t.id.trim() !== "");
    }

    function renderT() {
        let l = document.getElementById('list-t'); l.innerHTML = "";
        db[cur].tools.forEach((t, i) => {
            let div = document.createElement('div'); div.className='tool-card'; div.dataset.id=i;
            div.innerHTML = `<div class="drag-handle">☰</div><div class="tool-main" onclick="modalT(${i})"><div class="tool-id">${t.id}</div><div class="tool-name">${t.nm}</div></div><div class="tool-dia">${t.dia||''}</div>`;
            l.appendChild(div);
        });
        new Sortable(l, { handle:'.drag-handle', animation:150, onEnd:()=>{
            let up=[]; l.querySelectorAll('.tool-card').forEach(el=>up.push(db[cur].tools[el.dataset.id]));
            db[cur].tools=up; saveDB(); renderT();
        }});
    }

    function modalT(i=null) {
        let edit = i!==null; document.getElementById('t-idx').value = edit?i:"";
        document.getElementById('t-smart').value = "";
        document.getElementById('t-id').value = edit?db[cur].tools[i].id:"";
        document.getElementById('t-nm').value = edit?db[cur].tools[i].nm:"";
        document.getElementById('t-dia').value = edit?db[cur].tools[i].dia:"";
        document.getElementById('btn-del-t').style.display = edit?'block':'none';
        showM('m-t');
    }

    function saveT() {
        let i = document.getElementById('t-idx').value;
        let t = {id:document.getElementById('t-id').value.toUpperCase(), nm:document.getElementById('t-nm').value.toUpperCase(), dia:document.getElementById('t-dia').value};
        if(!t.id) return;
        if(i==="") db[cur].tools.push(t); else db[cur].tools[i]=t;
        cleanSlots(); saveDB(); renderT(); hideM('m-t');
    }

    function delT() { db[cur].tools.splice(document.getElementById('t-idx').value,1); saveDB(); renderT(); hideM('m-t'); }

    function makePDF() {
        const p = db[cur];
        const rows = p.tools.map(t => `<tr><td class="td-id">${t.id}</td><td class="td-nm">${t.nm}</td><td class="td-dia">${t.dia||''}</td></tr>`).join('');
        document.getElementById('pdf-content').innerHTML = `<div class="pdf-frame"><p class="pdf-name">${p.name}</p><h1 class="pdf-num">${p.num}</h1><div class="pdf-hr"></div><table><thead><tr><th>T-NR</th><th>WERKZEUGNAME / KOMMENTAR</th><th align="right">Ø / TOL.</th></tr></thead><tbody>${rows}</tbody></table></div>`;
        window.print();
    }

    function loadDemo() {
        let d=[]; for(let i=1;i<=15;i++) d.push({id:`T${i}`, nm:`WERKZEUG NR ${i}`, dia: i===1?"10 -0.2":""});
        db.push({num:"233562", name:"BUCHSE", tools:d}); saveDB(); renderP();
    }
    renderP();
</script>
</body>
</html>
