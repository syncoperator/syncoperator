<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="app-bar">
            <div class="app-bar-container">
                <div class="brand">QS CENTRAL</div>
                <div class="actions">
                    <button class="action-btn" onclick="modalProject()">+ NEU</button>
                </div>
            </div>
        </div>
        <div class="scroll-content" id="list-projects"></div>
    </div>

    <div id="v-det" class="view">
        <div class="app-bar">
            <div class="app-bar-container">
                <button class="nav-back" onclick="goHome()">←</button>
                <div class="project-title-block" onclick="modalProject(true)">
                    <small id="h-nam">NAME</small>
                    <b id="h-num">000000</b>
                </div>
                <div class="actions">
                    <button class="pdf-btn" onclick="makePDF()">PDF</button>
                </div>
            </div>
        </div>
        <div class="scroll-content">
            <div class="btn-container">
                <button class="btn-action" onclick="modalTool()"><span>+</span> INSTRUMENT</button>
                <button class="btn-action" onclick="showM('m-imp')"><span>⬇</span> IMPORT</button>
            </div>
            <div id="list-tools"></div>
        </div>
    </div>

    <div id="m-p" class="overlay">
        <div class="modal">
            <h2>PROJEKT DETAILS</h2>
            <input type="hidden" id="p-idx">
            <label>PROJEKT NUMMER</label>
            <input type="text" id="p-num" placeholder="233562">
            <label>PROJEKT NAME</label>
            <input type="text" id="p-nam" placeholder="MUSTER">
            
            <div class="input-row">
                <div class="col"><label>ABSTAND</label><input type="text" id="p-abs"></div>
                <div class="col"><label>GREIFBACKEN</label><input type="text" id="p-grf"></div>
            </div>
            <div class="input-row">
                <div class="col"><label>LAUFZEIT</label><input type="text" id="p-lzf"></div>
                <div class="col"><label>STÜCK A</label><input type="text" id="p-sta"></div>
                <div class="col"><label>STÜCK B</label><input type="text" id="p-stb"></div>
            </div>

            <button class="btn-save" onclick="saveProject()">SPEICHERN</button>
            <button class="btn-flat" onclick="hideM('m-p')">ABBRECHEN</button>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="modal">
            <h2>INSTRUMENT</h2>
            <input type="hidden" id="t-idx">
            <label>T-NR</label>
            <input type="text" id="t-id" placeholder="T01">
            <label>WERKZEUGNAME</label>
            <input type="text" id="t-nm">
            <label>Ø / TOLERANZ</label>
            <input type="text" id="t-dia">
            <button class="btn-save" onclick="saveTool()">OK</button>
            <button id="btn-del-t" class="btn-danger" onclick="deleteTool()">LÖSCHEN</button>
            <button class="btn-flat" onclick="hideM('m-t')">ZURÜCK</button>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="modal">
            <h2>IMPORT</h2>
            <textarea id="imp-area" rows="10" placeholder="Kopiere deine Liste hierher..."></textarea>
            <button class="btn-save" onclick="runMassImport()">IMPORTIEREN</button>
            <button class="btn-flat" onclick="hideM('m-imp')">SCHLIESSEN</button>
        </div>
    </div>

    <div id="pdf-render" style="display:none"></div>

    <script src="storage.js"></script>
    <script src="ui.js"></script>
</body>
</html>
