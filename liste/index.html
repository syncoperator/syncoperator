<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="v-home" class="view active">
        <div class="nav-bar">
            <h1 class="nav-title">QS <span>CENTRAL</span></h1>
            <button class="btn-plus" onclick="modalP()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="nav-back" onclick="goHome()">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <div class="nav-info" onclick="modalP(true)">
                <span id="h-nam">NAME</span>
                <span id="h-num">000000</span>
            </div>
            <button class="nav-print" onclick="makePDF()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
            </button>
        </div>

        <div class="action-grid">
            <button class="btn-main primary" onclick="modalT()">+ Werkzeug</button>
            <button class="btn-main secondary" onclick="show('m-imp')">Import</button>
        </div>

        <div id="list-t" class="content-scroll"></div>
    </div>

    <div id="m-p" class="overlay">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <div class="sheet-content">
                <h2 class="sheet-title">Projekt Details</h2>
                <input type="hidden" id="p-idx">
                <div class="form-grid">
                    <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="p-num" placeholder="z.B. 233562"></div>
                    <div class="field full"><label>Projektname</label><input type="text" id="p-nam" placeholder="BUCHSE"></div>
                    <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                    <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
                    <div class="field"><label>Stück T</label><input type="text" id="p-stt"></div>
                    <div class="field"><label>Stück N</label><input type="text" id="p-stn"></div>
                    <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
                    <div class="field"><label>Greifbacken</label><input type="text" id="p-grf"></div>
                </div>
                <div class="sheet-buttons">
                    <button class="btn-action primary" onclick="saveP()">Speichern</button>
                    <button class="btn-action ghost" onclick="hide('m-p')">Abbrechen</button>
                </div>
            </div>
        </div>
    </div>

    <div id="m-t" class="overlay">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <div class="sheet-content">
                <h2 class="sheet-title">Werkzeug</h2>
                <input type="hidden" id="t-idx">
                <div class="field full"><label>T-Nr</label><input type="text" id="t-id" placeholder="T0101"></div>
                <div class="field full"><label>Bezeichnung</label><input type="text" id="t-nm"></div>
                <div class="field full"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
                <div class="sheet-buttons">
                    <button class="btn-action primary" onclick="saveT()">Speichern</button>
                    <button id="btn-del-t" class="btn-action danger" onclick="delT()">Löschen</button>
                    <button class="btn-action ghost" onclick="hide('m-t')">Schließen</button>
                </div>
            </div>
        </div>
    </div>

    <div id="m-imp" class="overlay">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <div class="sheet-content">
                <h2 class="sheet-title">Import</h2>
                <textarea id="imp-area" rows="6" placeholder="T0101..."></textarea>
                <div class="sheet-buttons">
                    <button class="btn-action primary" onclick="runImp()">Starten</button>
                    <button class="btn-action ghost" onclick="hide('m-imp')">Fertig</button>
                </div>
            </div>
        </div>
    </div>

    <div id="print-container"></div>
    <script src="ui.js"></script>
</body>
</html>
