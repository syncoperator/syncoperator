<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CITITOOL SYNCOPERATOR</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#FAFAFA; --card:#FFF; --ink:#0A0A0A; --ink2:#52525B; --ink3:#A1A1AA;
  --line:#E4E4E7; --line2:#D4D4D8; --field:#F4F4F5;
  --green:#16A34A; --green-bg:#DCFCE7; --red:#DC2626;
  --sans:'Space Grotesk',sans-serif; --mono:'JetBrains Mono',monospace;
}
html,body{height:100%;font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;}
.app{max-width:520px;margin:0 auto;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;}

/* STATUS BAR */
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:1px;}
.status-left{display:flex;align-items:center;gap:8px;text-transform:uppercase;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);}
.status-right{color:var(--ink3);display:flex;gap:14px;text-transform:uppercase;}
.status-edit{color:var(--ink2);cursor:pointer;}

/* BRAND */
.brandbar{display:flex;align-items:center;justify-content:space-between;padding:18px;}
.brand{display:flex;align-items:center;gap:14px;}
.brand-logo{width:54px;height:54px;background:var(--ink);border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.brand-logo svg{width:30px;height:30px;}
.brand-name{font-size:21px;font-weight:700;letter-spacing:1px;line-height:1;}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--ink3);margin-top:3px;}
.brand-actions{display:flex;gap:8px;}
.icon-btn{width:52px;height:52px;border:1px solid var(--line2);border-radius:13px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.icon-btn:hover{background:var(--field);}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2;}

/* HEAD FIELDS */
.headrow{display:flex;gap:10px;padding:0 18px 14px;align-items:flex-end;}
.menu-btn{width:64px;height:62px;border:1px solid var(--line2);border-radius:13px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
.menu-btn svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:2;}
.fieldbox{flex:1;}
.fieldbox label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink3);margin-bottom:6px;padding-left:2px;}
.fieldbox input{width:100%;height:62px;border:1px solid var(--line2);border-radius:13px;background:var(--card);padding:0 18px;font-family:var(--mono);font-size:21px;font-weight:700;color:var(--ink);outline:none;}
.fieldbox.wide input{font-family:var(--sans);font-size:22px;}
.fieldbox input:focus{border-color:var(--ink);}

.divider{height:1px;background:var(--line);margin:4px 0;}

/* META GRID (inline editable) */
.metagrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 18px 14px;}
.metacell{background:var(--card);border:1px solid var(--line2);border-radius:11px;padding:9px 13px;}
.metacell.span2{grid-column:span 2;}
.metacell label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:1.5px;color:var(--ink3);margin-bottom:3px;}
.metacell input{width:100%;border:none;outline:none;background:transparent;font-family:var(--mono);font-size:15px;font-weight:600;color:var(--ink);padding:0;}
.metacell input::placeholder{color:var(--ink3);}

/* TABS */
.tabs{display:flex;gap:10px;padding:16px 18px;}
.tab{flex:1;padding:18px;border-radius:13px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:.15s;text-align:center;}
.tab.active{background:var(--ink);border-color:var(--ink);}
.tab-num{font-family:var(--mono);font-size:13px;color:var(--ink3);font-weight:600;}
.tab.active .tab-num{color:rgba(255,255,255,.5);}
.tab-name{font-size:17px;font-weight:700;margin-top:2px;}
.tab.active .tab-name{color:#fff;}

/* KANAL */
.kanals{display:flex;gap:10px;padding:0 18px 16px;}
.kanal{flex:1;padding:18px;border-radius:13px;border:1px solid var(--line2);background:var(--card);cursor:pointer;transition:.15s;}
.kanal.active{background:var(--ink);border-color:var(--ink);}
.kanal-name{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:1px;}
.kanal.active .kanal-name{color:#fff;}
.kanal-sub{font-family:var(--mono);font-size:13px;color:var(--ink3);margin-top:4px;}
.kanal.active .kanal-sub{color:rgba(255,255,255,.5);}

/* SECTION HEAD */
.sechead{padding:8px 18px 4px;display:flex;justify-content:space-between;align-items:flex-end;}
.sechead-tag{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--ink3);text-transform:uppercase;}
.sechead-title{font-size:26px;font-weight:700;margin-top:2px;}
.sechead-count{text-align:right;}
.sechead-count b{font-family:var(--mono);font-size:30px;font-weight:700;}
.sechead-count span{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--ink3);}
.sechead-count small{display:block;font-family:var(--mono);font-size:12px;color:var(--ink3);}

/* HINT */
.hint{margin:12px 18px;padding:16px;background:var(--field);border-radius:13px;display:flex;gap:12px;align-items:flex-start;}
.hint-i{width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-style:italic;font-weight:700;flex-shrink:0;font-size:14px;}
.hint p{font-family:var(--mono);font-size:13px;color:var(--ink2);line-height:1.5;}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:0 18px 18px;}

/* OP CARD */
.op{border:1px solid var(--ink);border-radius:16px;background:var(--card);padding:18px;margin-bottom:14px;}
.op-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.op-slot{display:flex;align-items:center;gap:8px;}
.op-idx{font-family:var(--mono);font-size:16px;font-weight:600;border:1px solid var(--line2);border-radius:9px;padding:8px 12px;min-width:48px;text-align:center;}
.op-prog{font-family:var(--mono);font-size:16px;font-weight:600;border:1px dashed var(--line2);border-radius:9px;padding:8px 12px;color:var(--ink2);}
.op-ctrls{display:flex;gap:8px;}
.opc{width:48px;height:44px;border:1px solid var(--line2);border-radius:9px;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s;}
.opc:hover{background:var(--field);}
.opc:active{background:var(--line);}
.opc svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:2.2;}
.opc.x svg{stroke:var(--ink);}
.op-title{font-size:22px;font-weight:700;margin:16px 0 14px;cursor:pointer;}
.op-title.empty{color:var(--ink3);font-weight:500;}
.op-tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.otag{font-family:var(--mono);font-size:13px;font-weight:600;padding:7px 11px;border-radius:9px;border:1px solid var(--line2);}
.otag.sp{background:var(--green-bg);border-color:transparent;color:var(--green);}
.otag.tool{flex:1;min-width:0;border-style:solid;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* REV DIVIDER */
.revdiv{display:flex;align-items:center;gap:12px;margin:6px 4px 14px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2px;color:var(--ink2);text-transform:uppercase;}
.revdiv::before,.revdiv::after{content:'';flex:1;height:1px;background:var(--line2);}

/* BOTTOM BAR */
.bottombar{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--ink);background:var(--bg);position:sticky;bottom:0;}
.bb{flex:1;padding:18px 10px;border-radius:14px;border:1px solid var(--line2);background:var(--card);font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:.15s;}
.bb:hover{background:var(--field);}
.bb svg{width:19px;height:19px;stroke:var(--ink);fill:none;stroke-width:2.2;}
.bb.primary{background:var(--ink);color:#fff;border-color:var(--ink);}
.bb.primary svg{stroke:#fff;}
.bb.primary:hover{background:#222;}

/* SHEET */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:500;align-items:flex-end;justify-content:center;}
.overlay.active{display:flex;}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:24px 24px 0 0;padding:24px 20px 36px;max-height:92dvh;overflow-y:auto;animation:up .28s cubic-bezier(.16,1,.3,1);}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-bar{width:38px;height:4px;background:var(--line2);border-radius:2px;margin:0 auto 22px;}
.sheet-title{font-size:22px;font-weight:700;margin-bottom:20px;}
.f{margin-bottom:14px;}
.f label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink3);margin-bottom:6px;}
.f input,.f textarea{width:100%;padding:14px 16px;background:var(--field);border:1px solid transparent;border-radius:12px;font-family:var(--sans);font-size:17px;font-weight:600;color:var(--ink);outline:none;}
.f input:focus,.f textarea:focus{border-color:var(--ink);background:var(--card);}
.f textarea{resize:none;font-family:var(--mono);font-size:14px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;}
.chip{background:var(--field);border:1px solid var(--line2);padding:8px 13px;border-radius:9px;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;transition:.15s;}
.chip:hover{background:var(--ink);color:#fff;border-color:var(--ink);}
.pill{display:flex;align-items:center;justify-content:space-between;padding:15px;background:var(--field);border:1px solid transparent;border-radius:12px;margin-bottom:12px;cursor:pointer;}
.pill.on{border-color:var(--ink);background:#fff;}
.pill-l{font-size:15px;font-weight:700;}
.pill-s{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:2px;}
.sw{position:relative;width:48px;height:28px;flex-shrink:0;}
.sw input{opacity:0;width:0;height:0;}
.sw-t{position:absolute;inset:0;background:var(--line2);border-radius:14px;transition:.2s;cursor:pointer;}
.sw-t::before{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;left:3px;top:3px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25);}
.sw input:checked + .sw-t{background:var(--ink);}
.sw input:checked + .sw-t::before{transform:translateX(20px);}
.sheet-btns{display:grid;grid-template-columns:1fr 2fr;gap:10px;margin-top:18px;}
.sbtn{padding:16px;border-radius:12px;border:none;font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer;transition:.15s;}
.sbtn.del{background:#fff;border:1px solid var(--line2);color:var(--red);}
.sbtn.save{background:var(--ink);color:#fff;}
.sbtn.full{grid-column:span 2;}
.sbtn.sec{background:var(--field);color:var(--ink);border:1px solid var(--line2);}
.filelbl{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:16px;border-radius:12px;background:var(--field);border:1px solid var(--line2);font-weight:700;cursor:pointer;margin-bottom:8px;}
.filelbl input{display:none;}
.filelbl svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2.2;}
.ioarea{width:100%;min-height:110px;padding:12px;background:var(--field);border:1px solid var(--line2);border-radius:12px;font-family:var(--mono);font-size:12px;outline:none;resize:vertical;}

/* LIBRARY */
.libitem{border:1px solid var(--line2);border-radius:14px;background:var(--card);margin-bottom:8px;overflow:hidden;}
.libmain{display:flex;align-items:center;gap:12px;padding:15px;}
.libinfo{flex:1;min-width:0;cursor:pointer;}
.libnm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.libsub{font-family:var(--mono);font-size:12px;color:var(--ink3);margin-top:3px;}
.libacts{display:flex;gap:6px;}
.libbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;}
.libbtn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:2.2;}
.libbtn.del svg{stroke:var(--red);}
.libedit{display:none;flex-direction:column;gap:8px;padding:0 15px 15px;}
.libedit.open{display:flex;}
.empty{text-align:center;padding:50px 20px;color:var(--ink3);}
.empty svg{width:46px;height:46px;stroke:var(--ink3);fill:none;stroke-width:1.5;margin-bottom:12px;}

/* TOAST */
#toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;font-weight:600;z-index:9999;opacity:0;transition:.25s;pointer-events:none;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media(min-width:560px){
  .overlay{align-items:center;}
  .sheet{border-radius:20px;margin:20px;max-height:88dvh;}
  @keyframes up{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
}

/* PRINT */
#print-area{display:none;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:99999;background:#0A0A0A;display:flex;align-items:center;justify-content:center;transition:opacity .5s ease;}
#splash.hide{opacity:0;pointer-events:none;}
.splash-inner{display:flex;flex-direction:column;align-items:center;}
.splash-logo{width:88px;height:88px;background:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:splashPop .6s cubic-bezier(.16,1.4,.3,1);}
.splash-logo svg{width:52px;height:52px;}
.splash-logo svg circle,.splash-logo svg path{stroke:#0A0A0A;}
.splash-name{font-family:var(--sans);font-size:30px;font-weight:700;letter-spacing:4px;color:#fff;}
.splash-sub{font-family:var(--mono);font-size:12px;letter-spacing:6px;color:rgba(255,255,255,.4);margin-top:6px;}
.splash-bar{width:140px;height:3px;background:rgba(255,255,255,.15);border-radius:2px;margin-top:32px;overflow:hidden;}
.splash-fill{width:0;height:100%;background:#fff;border-radius:2px;animation:splashLoad 1.4s ease forwards;}
@keyframes splashPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes splashLoad{from{width:0}to{width:100%}}
@media print{
  html,body{background:#fff;height:auto;overflow:visible;}
  .app,#toast,#splash{display:none!important;}
  #print-area{display:block!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #print-area *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #print-area > div{break-inside:avoid;}
  @page{size:A4;margin:0;}
}
</style>
</head>
<body>
<div id="splash">
  <div class="splash-inner">
    <div class="splash-logo">
      <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#fff" stroke-width="2.5"/><path d="M16 16 L16 5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
    </div>
    <div class="splash-name">CITITOOL</div>
    <div class="splash-sub">SYNCOPERATOR</div>
    <div class="splash-bar"><div class="splash-fill"></div></div>
  </div>
</div>
<div id="toast"></div>
<div id="print-area"></div>

<div class="app">
  <div class="statusbar">
    <div class="status-left"><span class="status-dot"></span><span>Connected</span></div>
    <div class="status-right"><span class="status-edit" onclick="openProjModal(true)">Edit</span><span id="clock">--:--</span></div>
  </div>

  <div class="brandbar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="13" stroke="#fff" stroke-width="2.5"/><path d="M16 16 L16 5" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <div>
        <div class="brand-name">CITITOOL</div>
        <div class="brand-sub">SYNCOPERATOR</div>
      </div>
    </div>
    <div class="brand-actions">
      <button class="icon-btn" onclick="openIO()" title="Import/Export">
        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" onclick="makePDF()" title="PDF">
        <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      </button>
    </div>
  </div>

  <div class="headrow">
    <button class="menu-btn" onclick="openProjList()">
      <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="fieldbox">
      <label>ZEICHNUNG-NR.</label>
      <input type="text" id="h-num" placeholder="000000" oninput="P().num=this.value;persist();" >
    </div>
    <div class="fieldbox wide">
      <label>BEZEICHNUNG</label>
      <input type="text" id="h-name" placeholder="Buchse" oninput="P().name=this.value;persist();">
    </div>
  </div>

  <div class="divider"></div>

  <div class="metagrid" id="metagrid">
    <div class="metacell"><label>LAUFZEIT</label><input id="m-lzf" placeholder="—" oninput="P().lzf=this.value;persist();"></div>
    <div class="metacell"><label>MATERIAL</label><input id="m-mat" placeholder="—" oninput="P().mat=this.value;persist();"></div>
    <div class="metacell"><label>SÄGELÄNGE</label><input id="m-sag" placeholder="—" oninput="P().sag=this.value;persist();"></div>
    <div class="metacell"><label>ABSTAND</label><input id="m-abs" placeholder="—" oninput="P().abs=this.value;persist();"></div>
    <div class="metacell"><label>STÜCK T</label><input id="m-stt" placeholder="—" oninput="P().stt=this.value;persist();"></div>
    <div class="metacell"><label>STÜCK N</label><input id="m-stn" placeholder="—" oninput="P().stn=this.value;persist();"></div>
    <div class="metacell span2"><label>GREIFBACKEN</label><input id="m-grf" placeholder="—" oninput="P().grf=this.value;persist();"></div>
  </div>

  <div class="divider"></div>

  <div class="sechead">
    <div>
      <div class="sechead-title" id="sec-title">Werkzeugliste</div>
    </div>
    <div class="sechead-count">
      <div><b id="cnt-used">0</b><span> / <span id="cnt-total">0</span></span></div>
      <small>Werkzeuge</small>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="bottombar">
    <button class="bb" onclick="openLibrary()">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Library
    </button>
    <button class="bb" onclick="openIO()">
      <svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      Import
    </button>
    <button class="bb primary" onclick="openToolModal()">
      <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Neue Op
    </button>
  </div>
</div>

<!-- PROJECT MODAL -->
<div class="overlay" id="m-proj" onclick="if(event.target===this)close_('m-proj')">
  <div class="sheet">
    <div class="sheet-bar"></div>
    <div class="sheet-title" id="proj-title">Neues Projekt</div>
    <div class="f"><label>ZEICHNUNG-NR.</label><input id="p-num" placeholder="231850"></div>
    <div class="f"><label>BEZEICHNUNG</label><input id="p-name" placeholder="Buchse"></div>
    <div class="f2">
      <div class="f"><label>LAUFZEIT</label><input id="p-lzf"></div>
      <div class="f"><label>SÄGELÄNGE</label><input id="p-sag"></div>
    </div>
    <div class="f2">

<script>
// ═══ DATA ═══
const DB='CITITOOL_2026';
const BRAIN='CITITOOL_BRAIN_2026';
let db=JSON.parse(localStorage.getItem(DB)||'[]');
let brain=JSON.parse(localStorage.getItem(BRAIN)||'{}');
brain.nm=brain.nm||[]; brain.bem=brain.bem||[]; brain.pairs=brain.pairs||{}; brain.library=brain.library||[];
let cur=0, kanal='oben', tab='prog', tEdit=null, editingProj=false;

if(!db.length){ db.push(newProject()); }
function newProject(){return{num:'',name:'',lzf:'',sag:'',stt:'',stn:'',mat:'',abs:'',grf:'',titleOben:'Revolver Oben',titleUnten:'Revolver Unten',oben:[],unten:[]};}
function P(){return db[cur];}
function curList(){const p=P(); if(!p.oben)p.oben=[]; if(!p.unten)p.unten=[]; return kanal==='oben'?p.oben:p.unten;}
function persist(){localStorage.setItem(DB,JSON.stringify(db));}
function saveBrain(){localStorage.setItem(BRAIN,JSON.stringify(brain));}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2200);}
function close_(id){document.getElementById(id).classList.remove('active');}
function open_(id){document.getElementById(id).classList.add('active');}

// ═══ CLOCK ═══
function tick(){const d=new Date();document.getElementById('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');}
tick();setInterval(tick,30000);

// ═══ HEADER ═══
function renderHeader(){
  const p=P();
  document.getElementById('h-num').value=p.num||'';
  document.getElementById('h-name').value=p.name||'';
  document.getElementById('m-lzf').value=p.lzf||'';
  document.getElementById('m-mat').value=p.mat||'';
  document.getElementById('m-sag').value=p.sag||'';
  document.getElementById('m-abs').value=p.abs||'';
  document.getElementById('m-stt').value=p.stt||'';
  document.getElementById('m-stn').value=p.stn||'';
  document.getElementById('m-grf').value=p.grf||'';
}

// ═══ RENDER ═══
function opCard(t,i,listName){
  const isRev = listName==='unten';
  return `
    <div class="op"${isRev?' style="border-color:#1D4ED8"':''}>
      <div class="op-top">
        <div class="op-slot">
          <div class="op-idx">${String(i+1).padStart(2,'0')}</div>
          <div class="op-prog">${esc(t.id||t.slot||'—')}</div>
        </div>
        <div class="op-ctrls">
          <button class="opc" onclick="moveIn('${listName}',${i},-1)"><svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg></button>
          <button class="opc" onclick="moveIn('${listName}',${i},1)"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/></svg></button>
          <button class="opc x" onclick="delIn('${listName}',${i})"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
        </div>
      </div>
      <div class="op-title ${t.nm?'':'empty'}" onclick="editIn('${listName}',${i})">${esc(t.nm||'Leer — antippen')}</div>
      <div class="op-tags">
        ${t.isSonder?'<span class="otag sp" style="background:#DBEAFE;color:#1D4ED8">Sonder</span>':'<span class="otag">Standard</span>'}
        ${t.dia?'<span class="otag">Ø '+esc(t.dia)+'</span>':''}
        ${t.bem?'<span class="otag tool" onclick="editIn(\''+listName+'\','+i+')">'+esc(t.bem)+'</span>':''}
      </div>
    </div>`;
}

function render(){
  const p=P(); if(!p.oben)p.oben=[]; if(!p.unten)p.unten=[];
  const c=document.getElementById('content');
  const total=p.oben.length+p.unten.length;
  document.getElementById('cnt-used').textContent=p.oben.filter(t=>t.nm).length+p.unten.filter(t=>t.nm).length;
  document.getElementById('cnt-total').textContent=total;
  if(!total){c.innerHTML=emptyHTML();return;}
  let html='';
  if(p.oben.length){html+='<div class="revdiv" onclick="renameSection(\'oben\')" style="cursor:pointer">'+esc(p.titleOben||'Revolver Oben')+' ✎</div>'+p.oben.map((t,i)=>opCard(t,i,'oben')).join('');}
  if(p.unten.length){html+='<div class="revdiv" onclick="renameSection(\'unten\')" style="cursor:pointer">'+esc(p.titleUnten||'Revolver Unten')+' ✎</div>'+p.unten.map((t,i)=>opCard(t,i,'unten')).join('');}
  c.innerHTML=html+'<div style="height:20px"></div>';
}

function emptyHTML(){return '<div class="empty"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><div style="font-weight:600">Keine Werkzeuge</div><div style="font-family:var(--mono);font-size:12px;margin-top:6px">Datei laden oder „Neue Op"</div></div>';}

// list-aware ops
function listByName(n){const p=P();if(!p.oben)p.oben=[];if(!p.unten)p.unten=[];return n==='unten'?p.unten:p.oben;}
function moveIn(n,i,d){const l=listByName(n);if(i+d<0||i+d>=l.length)return;[l[i],l[i+d]]=[l[i+d],l[i]];persist();render();}
function delIn(n,i){if(!confirm('Werkzeug löschen?'))return;listByName(n).splice(i,1);persist();render();}
function editIn(n,i){editList=n;openToolModal(i,n);}
function renameSection(n){
  const p=P();
  const key=n==='unten'?'titleUnten':'titleOben';
  const cur=p[key]||(n==='unten'?'Revolver Unten':'Revolver Oben');
  const val=prompt('Bezeichnung ändern:',cur);
  if(val!==null&&val.trim()){p[key]=val.trim();persist();render();}
}

// ═══ TOOL MODAL ═══
let editList='oben';
function openToolModal(i=null,listName=null){
  tEdit=i;
  // determine which list we edit
  editList = listName || 'oben';
  const fields=['t-slot','t-id','t-nm','t-dia','t-bem'];
  if(i!==null){
    const t=listByName(editList)[i];
    document.getElementById('t-slot').value=t.slot||'';
    document.getElementById('t-id').value=t.id||'';
    document.getElementById('t-nm').value=t.nm||'';
    document.getElementById('t-dia').value=t.dia||'';
    document.getElementById('t-bem').value=t.bem||'';
    document.getElementById('t-sonder').checked=!!t.isSonder;
    document.getElementById('t-rev').checked=(editList==='unten');
    document.getElementById('tool-title').textContent='Operation '+(i+1);
    document.getElementById('tool-del').style.display='block';
  }else{
    fields.forEach(f=>document.getElementById(f).value='');
    document.getElementById('t-sonder').checked=false;
    document.getElementById('t-rev').checked=(editList==='unten');
    document.getElementById('tool-title').textContent='Neue Operation';
    document.getElementById('tool-del').style.display='none';
  }
  document.getElementById('nm-chips').innerHTML='';
  document.getElementById('bem-chips').innerHTML='';
  syncPill('sonder');syncPill('rev');
  open_('m-tool');
}
function togglePill(k){const cb=document.getElementById('t-'+k);cb.checked=!cb.checked;syncPill(k);}
function syncPill(k){const cb=document.getElementById('t-'+k);document.getElementById('pill-'+k).classList.toggle('on',cb.checked);}

function saveTool(){
  const nm=document.getElementById('t-nm').value.toUpperCase().trim();
  const bem=document.getElementById('t-bem').value.toUpperCase().trim();
  const dia=document.getElementById('t-dia').value.trim();
  const wantUnten=document.getElementById('t-rev').checked;
  const targetList=wantUnten?'unten':'oben';
  const t={
    slot:document.getElementById('t-slot').value.toUpperCase().trim(),
    id:document.getElementById('t-id').value.toUpperCase().trim()||'T—',
    nm,dia,bem,isSonder:document.getElementById('t-sonder').checked
  };
  // learn
  if(nm){
    if(!brain.nm.includes(nm))brain.nm.push(nm);
    if(bem){if(!brain.bem.includes(bem))brain.bem.push(bem);brain.pairs[nm]=bem;}
    if(!brain.library.find(x=>x.nm===nm))brain.library.push({nm,bem,dia,rev:targetList});
    saveBrain();
  }
  if(tEdit===null){
    // new — add to target list
    listByName(targetList).push(t);
  }else{
    // editing existing
    if(targetList===editList){
      listByName(editList)[tEdit]=t;
    }else{
      // moved between Oben/Unten
      listByName(editList).splice(tEdit,1);
      listByName(targetList).push(t);
    }
  }
  persist();close_('m-tool');render();
}
function deleteTool(){if(tEdit===null)return;listByName(editList).splice(tEdit,1);persist();close_('m-tool');render();}

// ═══ SMART CHIPS ═══
function chips(type,val){
  const cont=document.getElementById(type+'-chips');cont.innerHTML='';
  const q=val.toUpperCase().trim();
  let list=brain[type]||[];
  let m=q?list.filter(x=>x.includes(q)).slice(0,5):list.slice(-5).reverse();
  m.forEach(x=>{
    const c=document.createElement('div');c.className='chip';c.textContent=x;
    c.onclick=()=>{document.getElementById('t-'+type).value=x;cont.innerHTML='';
      if(type==='nm'&&brain.pairs[x])document.getElementById('t-bem').value=brain.pairs[x];};
    cont.appendChild(c);
  });
}

// ═══ PROJECT MODAL ═══
function openProjModal(edit=false){
  editingProj=edit;
  if(edit){
    const p=P();
    ['num','name','lzf','sag','stt','stn','mat','abs','grf'].forEach(k=>document.getElementById('p-'+k).value=p[k]||'');
    document.getElementById('proj-title').textContent='Projekt bearbeiten';
    document.getElementById('proj-del').style.display='block';
    document.getElementById('proj-save').style.gridColumn='';
  }else{
    document.querySelectorAll('#m-proj input').forEach(i=>i.value='');
    document.getElementById('proj-title').textContent='Neues Projekt';
    document.getElementById('proj-del').style.display='none';
    document.getElementById('proj-save').style.gridColumn='span 2';
  }
  open_('m-proj');
}
function saveProject(){
  const get=k=>document.getElementById('p-'+k).value.trim();
  const data={num:get('num'),name:get('name'),lzf:get('lzf'),sag:get('sag'),stt:get('stt'),stn:get('stn'),mat:get('mat').toUpperCase(),abs:get('abs'),grf:get('grf')};
  if(editingProj){Object.assign(P(),data);}
  else{const np=newProject();Object.assign(np,data);db.push(np);cur=db.length-1;}
  persist();close_('m-proj');renderHeader();render();
}
function deleteProject(){
  if(!confirm('Projekt löschen?'))return;
  db.splice(cur,1);if(!db.length)db.push(newProject());cur=0;
  persist();close_('m-proj');renderHeader();render();
}
function openProjList(){
  const body=document.getElementById('projlist-body');
  body.innerHTML=db.map((p,i)=>`
    <div class="libitem"><div class="libmain">
      <div class="libinfo" onclick="selectProject(${i})">
        <div class="libnm">${esc(p.num||'(ohne Nr)')}</div>
        <div class="libsub">${esc(p.name||'—')} · ${(p.oben||[]).length+(p.unten||[]).length} Ops</div>
      </div>
      <div class="libacts"><button class="libbtn del" onclick="event.stopPropagation();delProjectByIdx(${i})"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button></div>
    </div></div>`).join('');
  open_('m-projlist');
}
function selectProject(i){cur=i;close_('m-projlist');renderHeader();render();}
function delProjectByIdx(i){if(!confirm('Projekt löschen?'))return;db.splice(i,1);if(!db.length)db.push(newProject());if(cur>=db.length)cur=0;persist();openProjList();renderHeader();render();}

// ═══ LIBRARY ═══
function openLibrary(){renderLibrary();open_('m-lib');}
function libItemHTML(it,i){
  return `
    <div class="libitem">
      <div class="libmain">
        <div class="libinfo" onclick="useLibItem(${i})">
          <div class="libnm">${esc(it.nm)}</div>
          <div class="libsub">${it.bem?esc(it.bem):'—'}${it.dia?' · Ø '+esc(it.dia):''}</div>
        </div>
        <div class="libacts">
          <button class="libbtn" onclick="event.stopPropagation();toggleLibRev(${i})" title="Oben/Unten wechseln"><svg viewBox="0 0 24 24"><polyline points="17 11 12 6 7 11"/><polyline points="17 18 12 13 7 18"/></svg></button>
          <button class="libbtn" onclick="event.stopPropagation();editLib(${i})"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
          <button class="libbtn del" onclick="event.stopPropagation();delLib(${i})"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/></svg></button>
        </div>
      </div>
      <div class="libedit" id="le-${i}">
        <input style="padding:11px 14px;background:var(--field);border:1px solid var(--line2);border-radius:10px;font-family:var(--sans);font-weight:600" id="le-nm-${i}" value="${esc(it.nm)}">
        <input style="padding:11px 14px;background:var(--field);border:1px solid var(--line2);border-radius:10px;font-family:var(--mono);font-size:13px" id="le-bem-${i}" value="${esc(it.bem||'')}" placeholder="Bemerkung">
        <input style="padding:11px 14px;background:var(--field);border:1px solid var(--line2);border-radius:10px;font-family:var(--mono);font-size:13px" id="le-dia-${i}" value="${esc(it.dia||'')}" placeholder="Ø / Toleranz">
        <div style="display:flex;gap:8px"><button class="sbtn sec" style="flex:1;padding:11px" onclick="closeLibEdit(${i})">Abbrechen</button><button class="sbtn save" style="flex:2;padding:11px" onclick="saveLib(${i})">Speichern</button></div>
      </div>
    </div>`;
}
function renderLibrary(){
  const body=document.getElementById('lib-body');
  if(!brain.library.length){body.innerHTML='<div class="empty"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/></svg><div style="font-weight:600">Bibliothek leer</div><div style="font-family:var(--mono);font-size:12px;margin-top:6px">Werkzeuge werden automatisch gespeichert</div></div>';return;}
  const oben=[],unten=[];
  brain.library.forEach((it,i)=>{ (it.rev==='unten'?unten:oben).push({it,i}); });
  let html='';
  html+='<div class="revdiv">Revolver Oben</div>';
  html+= oben.length ? oben.map(o=>libItemHTML(o.it,o.i)).join('') : '<div style="font-family:var(--mono);font-size:12px;color:var(--ink3);padding:4px 4px 12px">— leer —</div>';
  html+='<div class="revdiv">Revolver Unten</div>';
  html+= unten.length ? unten.map(o=>libItemHTML(o.it,o.i)).join('') : '<div style="font-family:var(--mono);font-size:12px;color:var(--ink3);padding:4px 4px 12px">— leer —</div>';
  body.innerHTML=html;
}
function toggleLibRev(i){
  brain.library[i].rev = (brain.library[i].rev==='unten')?'oben':'unten';
  saveBrain();renderLibrary();
}
function editLib(i){document.querySelectorAll('.libedit').forEach(e=>e.classList.remove('open'));document.getElementById('le-'+i).classList.add('open');}
function closeLibEdit(i){document.getElementById('le-'+i).classList.remove('open');}
function saveLib(i){
  brain.library[i].nm=document.getElementById('le-nm-'+i).value.toUpperCase().trim();
  brain.library[i].bem=document.getElementById('le-bem-'+i).value.toUpperCase().trim();
  brain.library[i].dia=document.getElementById('le-dia-'+i).value.trim();
  if(brain.library[i].nm&&!brain.nm.includes(brain.library[i].nm))brain.nm.push(brain.library[i].nm);
  saveBrain();renderLibrary();toast('Gespeichert');
}
function delLib(i){if(!confirm('Eintrag löschen?'))return;brain.library.splice(i,1);saveBrain();renderLibrary();toast('Gelöscht');}
function useLibItem(i){
  const it=brain.library[i];
  const target=(it.rev==='unten')?'unten':'oben';
  listByName(target).push({slot:'',id:'T—',nm:it.nm,dia:it.dia||'',bem:it.bem||'',isSonder:false});
  persist();close_('m-lib');render();toast('Hinzugefügt · '+(target==='unten'?'Unten':'Oben'));
}

// ═══ PROGRAM PARSER (.O RO/RU) ═══
const SERVICE_RE=/^(WARTEN|ENTSPANEN|BOHREN|ABFRAGE|FERTIGTEIL|G5[45]-|BACKEN|AUSSPANN|ZWEITE NUTE|ORINGNUTE|ENTGRATEN|G54-HAUPT|G55-GEGEN|STANGEN|5 MM|BOHRUNG|BOHRG)/i;

function parseProgram(text){
  const lines=text.split(/\r?\n/);
  const ops=[];
  const seen=new Set();
  let pendingT=null;
  for(let raw of lines){
    const line=raw.trim();
    // T-number: G0G99T0101 , G99T0202 , G0T1216 , T0505G54 ...
    const tm=line.match(/T(\d{4})/);
    const hasG=/G\d|^T\d/.test(line);
    if(tm && /T\d{4}/.test(line) && !/^\(/.test(line)){
      pendingT='T'+tm[1];
      continue;
    }
    // comment line
    const cm=line.match(/^\((.+?)\)/);
    if(cm && pendingT){
      const comment=cm[1].trim();
      if(SERVICE_RE.test(comment)){continue;} // skip service comment, keep waiting
      // valid name
      if(!seen.has(pendingT)){
        ops.push({slot:'',id:pendingT,nm:comment.toUpperCase(),dia:'',bem:'',isSonder:false});
        seen.add(pendingT);
      }
      pendingT=null;
    }
  }
  return ops;
}

function detectKanal(filename,text){
  const f=filename.toUpperCase();
  if(/RU(\.|_|$)/.test(f)||/UNTEN/.test(f))return 'unten';
  if(/RO(\.|_|$)/.test(f)||/OBEN/.test(f))return 'oben';
  // header inside: (PK231850RU)
  if(/PK\w*RU\)/.test(text.toUpperCase()))return 'unten';
  if(/PK\w*RO\)/.test(text.toUpperCase()))return 'oben';
  return 'oben';
}
function detectNum(text){
  const m=text.match(/PK(\d{4,})R[OU]/i)||text.match(/\((\d{5,})/);
  return m?m[1]:'';
}

function loadProgramFiles(input){
  const files=[...input.files];if(!files.length)return;
  let loaded=0,total=files.length;
  let detectedNum='';
  files.forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{
      const text=e.target.result;
      const k=detectKanal(file.name,text);
      const ops=parseProgram(text);
      const num=detectNum(text);
      if(num&&!detectedNum){detectedNum=num;}
      // merge into current project
      const p=P();
      if(num&&!p.num)p.num=num;
      if(k==='oben'){p.oben=ops;}else{p.unten=ops;}
      // learn into library
      ops.forEach(o=>{
        if(o.nm&&!brain.nm.includes(o.nm))brain.nm.push(o.nm);
        if(o.nm&&!brain.library.find(x=>x.nm===o.nm))brain.library.push({nm:o.nm,bem:'',dia:'',rev:k});
      });
      loaded++;
      if(loaded===total){
        saveBrain();persist();close_('m-io');renderHeader();
        render();
        toast(`${total} Datei(en) · ${ops.length} Werkzeuge`);
      }
    };
    r.readAsText(file);
  });
  input.value='';
}

// ═══ JSON IO ═══
function openIO(){open_('m-io');}
function loadJSON(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      let val=JSON.parse(e.target.result);
      const arr=Array.isArray(val)?val:[val];
      arr.forEach(p=>{if(!p.oben&&p.tools){p.oben=p.tools;p.unten=[];}if(!p.oben)p.oben=[];if(!p.unten)p.unten=[];db.push(p);});
      cur=db.length-1;persist();close_('m-io');renderHeader();render();toast(arr.length+' Projekt(e)');
    }catch{toast('JSON Fehler');}
  };
  r.readAsText(file);input.value='';
}
function exportCurrent(){
  const blob=new Blob([JSON.stringify([P()],null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${P().num||'projekt'}.json`;a.click();
}
function importPasted(){
  try{
    let val=JSON.parse(document.getElementById('io-area').value);
    const arr=Array.isArray(val)?val:[val];
    arr.forEach(p=>{if(!p.oben&&p.tools){p.oben=p.tools;p.unten=[];}if(!p.oben)p.oben=[];if(!p.unten)p.unten=[];db.push(p);});
    cur=db.length-1;persist();close_('m-io');renderHeader();render();
    document.getElementById('io-area').value='';toast('Importiert');
  }catch{toast('JSON Fehler');}
}

  const tableHead=`<div style="display:flex;font-size:11px;font-weight:900;text-transform:uppercase;margin-bottom:5px;padding:0 2px;"><div style="width:95px;">T-NR</div><div style="flex:1;">WERKZEUGNAME / KOMMENTAR</div><div style="width:135px;text-align:right;">Ø / TOLERANZ</div></div><div style="border-bottom:2px solid #000;"></div>`;
