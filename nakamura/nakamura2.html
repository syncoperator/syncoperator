<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CitiTool Syncoperator</title>
  <style>
    :root {
      --bg-main: #F4F5F7;          /* Мягкий фон (без слепящего белого) */
      --bg-card: #FFFFFF;          /* Цвет карточек */
      --text-dark: #111827;        /* Четкий читаемый текст */
      --text-muted: #6B7280;       /* Вспомогательный текст */
      --border-color: #1A1A1A;     /* Аккуратная жирная рамка */
      --accent: #0052FF;           /* Акцентный цвет для главных кнопок */
      --radius: 10px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-main);
      color: var(--text-dark);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Центрированный главный контейнер */
    .app-container {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    /* Шапка */
    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-header h1 {
      font-size: 1.6rem;
      margin: 0;
      letter-spacing: -0.02em;
    }

    .app-header p {
      color: var(--text-muted);
      margin-top: 6px;
      font-size: 0.9rem;
    }

    /* Список инструментов с защитным нижним отступом */
    .tools-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      /* Отступ снизу, чтобы элементы не перекрывались плавающей панелью */
      padding-bottom: clamp(120px, 15vh, 180px);
    }

    /* Карточка инструмента в стиле Light Premium */
    .tool-card {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 2px solid var(--border-color);
      border-radius: var(--radius);
      padding: 14px 18px;
      cursor: grab;
      user-select: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
    }

    .tool-card:active {
      cursor: grabbing;
    }

    .tool-card.dragging {
      opacity: 0.4;
      border-style: dashed;
      background-color: #FAFAFA;
    }

    /* Зона иконки перетаскивания (Drag Handle) */
    .drag-handle {
      font-size: 1.2rem;
      color: var(--text-muted);
      padding-right: 16px;
      display: flex;
      align-items: center;
    }

    .tool-info {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .tool-title {
      font-weight: 600;
      font-size: 1rem;
    }

    .tool-meta {
      font-size: 0.825rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Кнопка удаления */
    .btn-icon {
      background: none;
      border: none;
      font-size: 1.1rem;
      color: var(--text-muted);
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: color 0.15s, background-color 0.15s;
    }

    .btn-icon:hover {
      color: #DC2626;
      background-color: #FEE2E2;
    }

    /* Фиксированная нижняя панель (Sticky Bottom Bar) */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(244, 245, 247, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 2px solid var(--border-color);
      padding: 16px 20px;
      display: flex;
      justify-content: center;
      gap: 12px;
      z-index: 100;
    }

    .btn-primary, .btn-secondary {
      padding: 12px 22px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: transform 0.1s ease, background-color 0.15s ease;
    }

    .btn-primary:active, .btn-secondary:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
    }

    .btn-primary:hover {
      background: #0046E0;
    }

    .btn-secondary {
      background: #FFFFFF;
      color: var(--text-dark);
      border: 2px solid var(--border-color);
    }

    .btn-secondary:hover {
      background: #F1F5F9;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header class="app-header">
      <h1>CitiTool Syncoperator</h1>
      <p>Центрированный список с Drag & Drop и защитой от перекрытий</p>
    </header>

    <!-- Основной список инструментов -->
    <main class="tools-list" id="toolsList">
      
      <div class="tool-card" draggable="true">
        <div class="drag-handle" title="Зажмите, чтобы переместить">⋮⋮</div>
        <div class="tool-info">
          <span class="tool-title">Инструмент #1</span>
          <span class="tool-meta">Статус: Готов • ID: 1042</span>
        </div>
        <button class="btn-icon" title="Удалить">✕</button>
      </div>

      <div class="tool-card" draggable="true">
        <div class="drag-handle" title="Зажмите, чтобы переместить">⋮⋮</div>
        <div class="tool-info">
          <span class="tool-title">Инструмент #2</span>
          <span class="tool-meta">Статус: В работе • ID: 1043</span>
        </div>
        <button class="btn-icon" title="Удалить">✕</button>
      </div>

      <div class="tool-card" draggable="true">
        <div class="drag-handle" title="Зажмите, чтобы переместить">⋮⋮</div>
        <div class="tool-info">
          <span class="tool-title">Инструмент #3</span>
          <span class="tool-meta">Статус: Проверка • ID: 1044</span>
        </div>
        <button class="btn-icon" title="Удалить">✕</button>
      </div>

    </main>
  </div>

  <!-- Фиксированная нижняя панель -->
  <footer class="bottom-bar">
    <button class="btn-secondary" id="btnAdd">+ Добавить инструмент</button>
    <button class="btn-primary">Экспорт в PDF</button>
  </footer>

  <script>
    const list = document.getElementById('toolsList');
    let draggingItem = null;

    // Логика Drag-and-Drop
    list.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.tool-card');
      if (card) {
        draggingItem = card;
        card.classList.add('dragging');
      }
    });

    list.addEventListener('dragend', (e) => {
      const card = e.target.closest('.tool-card');
      if (card) {
        card.classList.remove('dragging');
        draggingItem = null;
      }
    });

    list.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!draggingItem) return;
      
      const afterElement = getDragAfterElement(list, e.clientY);
      if (afterElement == null) {
        list.appendChild(draggingItem);
      } else {
        list.insertBefore(draggingItem, afterElement);
      }
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.tool-card:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    // Удаление элементов
    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('btn-icon')) {
        const card = e.target.closest('.tool-card');
        if (card) card.remove();
      }
    });

    // Добавление нового элемента
    let toolCounter = 4;
    document.getElementById('btnAdd').addEventListener('click', () => {
      const newCard = document.createElement('div');
      newCard.className = 'tool-card';
      newCard.draggable = true;
      newCard.innerHTML = `
        <div class="drag-handle" title="Зажмите, чтобы переместить">⋮⋮</div>
        <div class="tool-info">
          <span class="tool-title">Инструмент #${toolCounter}</span>
          <span class="tool-meta">Статус: Новый • ID: ${1040 + toolCounter}</span>
        </div>
        <button class="btn-icon" title="Удалить">✕</button>
      `;
      list.appendChild(newCard);
      toolCounter++;
    });
  </script>
</body>
</html>
