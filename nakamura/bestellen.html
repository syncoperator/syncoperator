<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Werkzeug">
<title>Werkzeug-Bestellliste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: two views (Bestellen / Bibliothek) — alarm strip, library picker, status segments, cards with one big next-step button */
:root{
  --bg:#F2F3F5; --card:#FFFFFF; --fg:#111214; --muted:#6B6F76; --line:#E1E3E7;
  --ink:#111214; --on-ink:#FFFFFF; --soft:#ECEDF0;
  --warn:#B45309; --warn-bg:#FEF3E2; --crit:#B42318; --crit-bg:#FDECEA; --ok:#1E7A46; --ok-bg:#E6F4EC;
  --shadow:0 1px 2px rgba(17,18,20,.05),0 6px 18px rgba(17,18,20,.06);
  --f-head:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141518; --card:#1D1F23; --fg:#ECEDEF; --muted:#9A9EA6; --line:#2E3136;
  --ink:#ECEDEF; --on-ink:#141518; --soft:#26282D;
  --warn:#F5B35C; --warn-bg:#3A2A12; --crit:#FF8A80; --crit-bg:#3D1C1A; --ok:#6FD39A; --ok-bg:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141518; --card:#1D1F23; --fg:#ECEDEF; --muted:#9A9EA6; --line:#2E3136;
  --ink:#ECEDEF; --on-ink:#141518; --soft:#26282D;
  --warn:#F5B35C; --warn-bg:#3A2A12; --crit:#FF8A80; --crit-bg:#3D1C1A; --ok:#6FD39A; --ok-bg:#16301F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;text-transform:uppercase}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:20px 60px;display:flex;flex-direction:column;gap:16px}
h1,h2{font-family:var(--f-head);margin:0;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;text-transform:uppercase}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg{flex:none}
.keepcase{text-transform:none}

/* header + main nav */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted)}
h1{font-size:26px;font-weight:700;letter-spacing:0}
.ruler{height:10px;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 8px),repeating-linear-gradient(90deg,var(--muted) 0 1px,transparent 1px 40px);background-size:auto 5px,auto 10px;background-repeat:repeat-x;background-position:bottom;opacity:.7}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}
.nav button{border:0;background:var(--card);padding:12px 8px;font-family:var(--f-head);font-weight:700;font-size:15px;letter-spacing:.04em;display:flex;justify-content:center;align-items:center;gap:8px}
.nav button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.nav .n{font-family:var(--f-mono);font-size:12px;font-weight:600;opacity:.7}

/* alarm */
.alarm{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:center}
.alarm.hot{background:var(--ink);color:var(--on-ink)}
.alarm.calm{background:var(--card);box-shadow:var(--shadow);color:var(--muted)}
.alarm b{font-family:var(--f-head);font-size:17px;display:block;color:inherit}
.alarm small{opacity:.8;font-size:13px}
.alarm .big{font-family:var(--f-mono);font-size:30px;font-weight:600;line-height:1;min-width:1.2em;text-align:center}

/* card + form */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.form{display:flex;flex-direction:column;gap:10px}
.form h2{font-size:15px;font-weight:700;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid.g3{grid-template-columns:repeat(3,1fr)}
.grid .full{grid-column:1/-1}
@media (max-width:480px){.grid{grid-template-columns:1fr}.grid.g3{grid-template-columns:1fr 1fr}.grid.g3 .full,.grid.g3 .wide{grid-column:1/-1}}
label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;color:var(--muted);min-width:0}
input,select,textarea{font:inherit;font-size:15px;text-transform:uppercase;letter-spacing:0;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
input::placeholder,textarea::placeholder{text-transform:none;color:var(--muted);opacity:.8}
input[type="email"]{text-transform:none}
textarea{resize:vertical;min-height:44px}
input.mono{font-family:var(--f-mono)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 14px;font-weight:600;font-size:14px;letter-spacing:.02em}
.btn.primary{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;padding:0}
.hint{font-size:12px;color:var(--muted)}

/* library picker (order view) */
.pick{display:flex;flex-direction:column;gap:8px}
.pick-res{display:flex;flex-direction:column;gap:6px;max-height:420px;overflow:auto}
.pr{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.pr .t{font-weight:600;font-family:var(--f-head);overflow-wrap:anywhere;min-width:0}
.pr .s{font-size:12px;color:var(--muted);grid-column:1;display:flex;gap:4px 12px;flex-wrap:wrap;min-width:0}
.pr .s .mono{color:var(--fg)}
.pr > .btn{grid-row:1/span 2;grid-column:2}
.pr.open{border-color:var(--ink)}
.pr .ordform{grid-column:1/-1;display:grid;grid-template-columns:90px 1fr;gap:8px;margin-top:6px}
.pr .ordform .full{grid-column:1/-1}
.pr .ordform input{background:var(--card)}

/* segments */
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 6px;font-weight:600;font-size:13px;color:var(--muted);display:flex;justify-content:center;gap:6px;align-items:center;flex-wrap:wrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
.seg .n{font-family:var(--f-mono);font-size:12px;background:var(--line);border-radius:6px;padding:1px 6px;color:var(--fg)}
.seg button[aria-pressed="true"] .n{background:var(--ink);color:var(--on-ink)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools input{flex:1 1 200px;background:var(--card)}

/* items */
.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;border-left:4px solid transparent}
.item.late{border-left-color:var(--crit)}
.item.aging{border-left-color:var(--warn)}
.item .main{min-width:0;display:flex;flex-direction:column;gap:6px}
.item .name{font-family:var(--f-head);font-weight:600;font-size:17px;overflow-wrap:anywhere}
.item .qty{font-family:var(--f-mono);font-weight:600;font-size:18px;text-align:right;white-space:nowrap}
.item .qty small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:500}
.item .fa{font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;white-space:nowrap}
.item .fa small{display:block;font-size:10px;letter-spacing:.1em;color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.meta span{display:inline-flex;gap:5px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.meta em{font-style:normal;font-size:10px;letter-spacing:.1em}
.meta .mono{color:var(--fg);font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--fg)}
.chip.spec{font-family:var(--f-mono);background:transparent;border:1px solid var(--line)}
.chip.crit{background:var(--crit-bg);color:var(--crit)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.note{font-size:13px;color:var(--fg);background:var(--bg);border-radius:8px;padding:6px 10px;overflow-wrap:anywhere}
.acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);padding-top:10px}
.acts .grow{flex:1}
.trail{font-size:12px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:32px 16px;background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.empty b{display:block;font-family:var(--f-head);color:var(--fg);font-size:16px;margin-bottom:4px}
.status{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--ok)}
.dot.off{background:var(--crit)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.copybox{width:100%;min-height:140px;font-family:var(--f-mono);font-size:12px}
.backup{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted)}
.group-h{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--muted);padding:6px 2px 0;display:flex;align-items:center;gap:8px}
.group-h::after{content:"";flex:1;height:1px;background:var(--line)}
@media (prefers-reduced-motion:no-preference){.item{transition:border-color .2s}}

/* printed order slip */
.sheet{display:none}
@media print{
  @page{size:A4;margin:16mm}
  html,body{background:#fff!important;color:#000!important;padding:0}
  .wrap,.toast{display:none!important}
  .sheet{display:block;font-family:var(--f-body);color:#000}
  .sheet .s-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:6mm}
  .sheet .s-brand{font-family:var(--f-mono);font-size:9pt;letter-spacing:.14em}
  .sheet .s-date{font-family:var(--f-mono);font-size:10pt}
  .sheet .s-hello{font-size:14pt;margin:10mm 0 2mm}
  .sheet h2{font-family:var(--f-head);font-size:34pt;line-height:1.05;margin:0 0 3mm}
  .sheet .s-until{font-size:14pt;font-weight:600;border:2px solid #000;display:inline-block;padding:2mm 4mm;margin-bottom:6mm}
  .sheet table{width:100%;border-collapse:collapse;font-size:10.5pt;margin-top:4mm}
  .sheet th{text-align:left;font-size:7.5pt;letter-spacing:.1em;border-bottom:1.5px solid #000;padding:2mm 2mm 2mm 0}
  .sheet td{border-bottom:.5px solid #999;padding:3mm 2mm 3mm 0;vertical-align:top}
  .sheet td.m{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .sheet td.box{width:8mm}
  .sheet td.box span{display:inline-block;width:5mm;height:5mm;border:1.5px solid #000}
  .sheet .s-sub{font-size:8.5pt;color:#444;margin-top:1mm}
  .sheet tr{break-inside:avoid}
  .sheet .s-thanks{margin-top:14mm;font-size:18pt}
  .sheet .s-name{font-family:var(--f-head);font-size:22pt;font-weight:600;margin-top:2mm}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <div class="brand">SYNCOPERATOR · WERKZEUG</div>
      <h1>BESTELLLISTE</h1>
    </div>
  </header>
  <div class="ruler" aria-hidden="true"></div>

  <nav class="nav" aria-label="Bereich">
    <button type="button" data-view="orders" aria-pressed="true">Bestellen <span class="n" id="nv_orders">0</span></button>
    <button type="button" data-view="lib" aria-pressed="false">Bibliothek <span class="n" id="nv_lib">0</span></button>
  </nav>

  <!-- ================= BESTELLEN ================= -->
  <section id="v_orders" class="wrap" style="padding:0;max-width:none">
    <div id="alarm" class="alarm calm"></div>

    <div class="card pick">
      <div class="form"><h2><span>Was fehlt?</span><button type="button" class="link" id="goNewTool">+ Neues Werkzeug</button></h2></div>
      <input id="pickQ" type="search" autocomplete="off" placeholder="Suchen: CNMG, Ø8, R0.8, Firmen-Nr. …">
      <div id="pickRes" class="pick-res"></div>
    </div>

    <div class="seg" role="group" aria-label="Status">
      <button type="button" data-tab="bedarf" aria-pressed="true">Zu bestellen <span class="n" id="n_bedarf">0</span></button>
      <button type="button" data-tab="bestellt" aria-pressed="false">Bestellt <span class="n" id="n_bestellt">0</span></button>
      <button type="button" data-tab="geliefert" aria-pressed="false">Geliefert <span class="n" id="n_geliefert">0</span></button>
    </div>

    <div class="tools">
      <input id="q" type="search" placeholder="Liste durchsuchen …">
      <button type="button" class="btn primary" id="printOpen">
        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12v8H2z M2 4.5l6 4.5 6-4.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
        Bestellung senden
      </button>
    </div>

    <div id="printPanel" class="card form" hidden>
      <h2><span>Bestellung senden</span><button type="button" id="printClose" class="link">Schließen</button></h2>
      <div class="grid">
        <label>An (Name, optional)
          <input id="p_to" placeholder="z. B. Thomas">
        </label>
        <label>E-Mail (optional)
          <input id="p_mail" type="email" inputmode="email" placeholder="einkauf@firma.de">
        </label>
        <label>Bitte bis (optional)
          <input id="p_until" type="date">
        </label>
        <label>Dein Name
          <input id="p_name" placeholder="z. B. Roma">
        </label>
      </div>
      <div class="hint" id="p_info"></div>
      <div class="row">
        <button type="button" class="btn primary" id="mailGo">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.5h12v8H2z M2 4.5l6 4.5 6-4.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>
          Per E-Mail
        </button>
        <button type="button" class="btn" id="copyBtn">Text kopieren</button>
        <button type="button" class="btn" id="printGo">Drucken</button>
      </div>
      <textarea id="copyFallback" class="copybox" readonly hidden></textarea>
    </div>

    <div id="list" class="list"></div>
  </section>

  <!-- ================= BIBLIOTHEK ================= -->
  <section id="v_lib" class="wrap" style="padding:0;max-width:none" hidden>
    <form id="libForm" class="card form" autocomplete="off">
      <h2><span id="libTitle">Neues Werkzeug</span><button type="button" id="libCancel" class="link" hidden>Abbrechen</button></h2>
      <div class="grid g3">
        <label>Typ
          <select id="l_type">
            <option>Wendeplatte</option>
            <option>Halter</option>
            <option>Bohrer</option>
            <option>Fräser</option>
            <option>Stechen</option>
            <option>Gewinde</option>
            <option>Reibahle</option>
            <option>Spannmittel</option>
            <option>Sonstiges</option>
          </select>
        </label>
        <label class="wide" style="grid-column:span 2">Bezeichnung *
          <input id="l_name" required placeholder="z. B. CNMG 120408-PM">
        </label>
        <label>Ø Durchmesser
          <input id="l_d" class="mono" inputmode="decimal" placeholder="mm">
        </label>
        <label>r Radius
          <input id="l_r" class="mono" inputmode="decimal" placeholder="mm">
        </label>
        <label>Sorte / Beschichtung
          <input id="l_grade" class="mono" placeholder="z. B. 4325">
        </label>
        <label class="wide">Firmen-Art.-Nr.
          <input id="l_firm" class="mono" placeholder="unsere Nummer">
        </label>
        <label>Hersteller
          <input id="l_maker" list="dl_maker" placeholder="z. B. Sandvik">
        </label>
        <label>Hersteller-Art.-Nr.
          <input id="l_makerArt" class="mono" placeholder="Bestellnummer">
        </label>
        <label>Lieferant
          <input id="l_sup" list="dl_sup" placeholder="falls anders">
        </label>
        <label>Standard-Menge
          <input id="l_qty" class="mono" placeholder="z. B. 10 STK">
        </label>
        <label>Maschine
          <input id="l_mach" list="dl_mach" placeholder="z. B. WT-250 RO">
        </label>
        <label class="full">Notiz
          <input id="l_note" placeholder="Einsatz, Alternative …">
        </label>
      </div>
      <datalist id="dl_mach"><option value="WT-250 RO"><option value="WT-250 RU"><option value="WT-250 BEIDE"><option value="ALLGEMEIN"></datalist>
      <datalist id="dl_maker"></datalist>
      <datalist id="dl_sup"></datalist>
      <div class="row">
        <button type="submit" class="btn primary" id="libSave">Speichern</button>
        <button type="button" class="btn" id="libSaveOrder">Speichern + bestellen</button>
      </div>
    </form>

    <div class="tools">
      <input id="libQ" type="search" placeholder="Bibliothek durchsuchen …">
    </div>
    <div id="libList" class="list"></div>
  </section>

  <div class="backup">
    <span class="status"><span class="dot" id="dot"></span><span id="statusText"></span></span>
    <span class="row">
      <button type="button" class="btn" id="exportBtn">Backup speichern</button>
      <button type="button" class="btn" id="importBtn">Backup laden</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </span>
  </div>
</div>
<div id="toast" class="toast" hidden></div>
<section id="sheet" class="sheet" aria-hidden="true"></section>

<script>
(() => {
  const DAY = 86400000;
  const AGE_WARN_BEDARF = 1, AGE_CRIT_BEDARF = 2;
  const AGE_WARN_BESTELLT = 7, AGE_CRIT_BESTELLT = 14;
  const HIDE_DELIVERED_AFTER = 30;
  const KEY = 'syncop_bestellliste_v1';
  const LIB_KEY = 'syncop_bestellliste_lib_v1';
  const TYPES = ['Wendeplatte','Halter','Bohrer','Fräser','Stechen','Gewinde','Reibahle','Spannmittel','Sonstiges'];

  const $ = id => document.getElementById(id);
  const state = { items: [], lib: [], view: 'orders', tab: 'bedarf', q: '', libQ: '', pickQ: '', pickOpen: null,
                  editLib: null, confirmDel: null, confirmLibDel: null };

  const U = s => String(s ?? '').trim().toUpperCase();
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const days = ts => ts ? Math.floor((Date.now() - ts) / DAY) : 0;
  const ageText = d => d <= 0 ? 'HEUTE' : d === 1 ? 'SEIT 1 TAG' : `SEIT ${d} TAGEN`;
  const fmtDate = ts => ts ? new Date(ts).toLocaleDateString('de-DE', { day:'2-digit', month:'2-digit' }) : '';
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const toast = msg => { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 2200); };
  const lsGet = k => { try { return localStorage.getItem(k) || '' } catch { return '' } };
  const lsSet = (k,v) => { try { localStorage.setItem(k, v); return true } catch { return false } };

  // spec line, e.g. "Ø8,5 · R0,8 · 4325"
  const num = v => String(v).replace('.', ',');
  const specs = t => [t.d && `Ø${num(t.d)}`, t.r && `R${num(t.r)}`, t.grade].filter(Boolean);
  const fullName = t => [t.name, ...specs(t)].join(' ');

  // ---------- storage ----------
  let storageOk = true;
  function migrateItem(i) {
    if (i.art && !i.makerArt) { i.makerArt = i.art; delete i.art; }
    if (i.sup && !i.maker && !i.libId) { i.maker = i.sup; delete i.sup; }
    ['name','type','d','r','grade','firm','maker','makerArt','sup','mach','dwg','note','qty'].forEach(k => { if (i[k]) i[k] = U(i[k]); });
    return i;
  }
  function load() {
    try {
      const a = JSON.parse(lsGet(KEY) || '[]'); state.items = Array.isArray(a) ? a.map(migrateItem) : [];
      const b = JSON.parse(lsGet(LIB_KEY) || '[]'); state.lib = Array.isArray(b) ? b : [];
    } catch { storageOk = false; }
  }
  function save() {
    storageOk = lsSet(KEY, JSON.stringify(state.items)) && lsSet(LIB_KEY, JSON.stringify(state.lib));
    updateStatus();
  }
  function setStatus(kind, text) { $('dot').className = 'dot ' + (kind || ''); $('statusText').textContent = text; }
  function updateStatus() {
    if (storageOk) setStatus('live', `${state.lib.length} Werkzeuge · ${state.items.length} Bestellungen · in diesem Browser`);
    else setStatus('off', 'Speichern nicht möglich (privates Fenster?) – Backup nutzen');
  }
  const commit = msg => { save(); render(); if (msg) toast(msg); };

  // ---------- nav ----------
  function setView(v) {
    state.view = v;
    document.querySelectorAll('.nav button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    $('v_orders').hidden = v !== 'orders'; $('v_lib').hidden = v !== 'lib';
    render();
  }
  document.querySelectorAll('.nav button').forEach(b => b.onclick = () => setView(b.dataset.view));
  $('goNewTool').onclick = () => {
    resetLibForm();
    const q = U($('pickQ').value); if (q) $('l_name').value = q;
    setView('lib'); $('l_name').focus();
  };

  // ---------- library form ----------
  const LF = { type:'l_type', name:'l_name', d:'l_d', r:'l_r', grade:'l_grade', firm:'l_firm', maker:'l_maker', makerArt:'l_makerArt', sup:'l_sup', qty:'l_qty', mach:'l_mach', note:'l_note' };
  const readLib = () => Object.fromEntries(Object.entries(LF).map(([k,id]) => [k, k === 'type' ? $(id).value : U($(id).value)]));
  const fillLib = (o={}) => Object.entries(LF).forEach(([k,id]) => $(id).value = o[k] ?? (k === 'type' ? TYPES[0] : ''));
  function resetLibForm() { state.editLib = null; fillLib(); $('libTitle').textContent = 'Neues Werkzeug'; $('libCancel').hidden = true; $('libSaveOrder').hidden = false; }
  $('libCancel').onclick = resetLibForm;

  function saveLib(andOrder) {
    const d = readLib();
    if (!d.name) { $('l_name').focus(); return null; }
    let tool;
    if (state.editLib) {
      tool = state.lib.find(t => t.id === state.editLib);
      Object.assign(tool, d, { updatedAt: Date.now() });
    } else {
      const dup = d.firm && state.lib.find(t => t.firm === d.firm);
      if (dup) { toast(`Firmen-Nr. ${d.firm} gibt es schon`); return null; }
      tool = { id: newId(), ...d, createdAt: Date.now() };
      state.lib.push(tool);
    }
    const wasEdit = !!state.editLib;
    resetLibForm();
    if (andOrder) { orderFromLib(tool, {}); setView('orders'); }
    else commit(wasEdit ? 'Gespeichert' : 'In Bibliothek');
    return tool;
  }
  $('libForm').addEventListener('submit', e => { e.preventDefault(); saveLib(false); });
  $('libSaveOrder').onclick = () => saveLib(true);

  // ---------- ordering ----------
  function orderFromLib(t, o) {
    const it = {
      id: newId(), libId: t.id,
      name: t.name, type: t.type, d: t.d, r: t.r, grade: t.grade, firm: t.firm,
      maker: t.maker, makerArt: t.makerArt, sup: t.sup, mach: t.mach,
      qty: U(o.qty) || t.qty || '', dwg: U(o.dwg), note: U(o.note),
      status: 'bedarf', createdAt: Date.now()
    };
    state.items.push(it);
    commit('Auf der Liste');
  }

  const libHay = t => [t.name, t.type, ...specs(t), t.d, t.r, t.firm, t.maker, t.makerArt, t.sup, t.mach, t.note].join(' ').toUpperCase().replace(/,/g,'.');
  const match = (hay, q) => q.split(/\s+/).filter(Boolean).every(w => hay.includes(w.replace(/,/g,'.').replace(/^Ø/,'Ø')));

  function lastOrder(libId) {
    const its = state.items.filter(i => i.libId === libId);
    return { count: its.length, last: Math.max(0, ...its.map(i => i.createdAt || 0)), open: its.some(i => i.status === 'bedarf') };
  }

  function renderPick() {
    const q = state.pickQ;
    const R = $('pickRes');
    if (!state.lib.length) { R.innerHTML = `<div class="hint">Bibliothek ist leer. Mit „+ Neues Werkzeug“ das erste anlegen – danach reicht hier ein Suchwort.</div>`; return; }
    let rows = state.lib.slice();
    if (q) rows = rows.filter(t => match(libHay(t), q));
    else rows.sort((a,b) => lastOrder(b.id).last - lastOrder(a.id).last);
    rows = rows.slice(0, q ? 30 : 6);
    if (!rows.length) { R.innerHTML = `<div class="hint">Nichts gefunden. <button type="button" class="link" data-pick="new">Als neues Werkzeug anlegen</button></div>`; return; }
    R.innerHTML = (q ? '' : `<div class="hint">Zuletzt bestellt:</div>`) + rows.map(t => {
      const lo = lastOrder(t.id);
      const open = state.pickOpen === t.id;
      const sub = [
        ...specs(t).map(s => `<span class="mono">${esc(s)}</span>`),
        t.firm && `<span>FA <span class="mono">${esc(t.firm)}</span></span>`,
        t.maker && `<span>${esc(t.maker)}</span>`,
        lo.open && `<span style="color:var(--warn);font-weight:600">SCHON AUF DER LISTE</span>`
      ].filter(Boolean).join('');
      return `<div class="pr ${open ? 'open' : ''}">
        <div class="t">${esc(t.name)}</div>
        <button type="button" class="btn ${open ? '' : 'primary'} sm" data-pick="toggle" data-id="${t.id}">${open ? 'Zu' : '+ Bestellen'}</button>
        <div class="s">${sub}</div>
        ${open ? `<div class="ordform">
            <label>Menge<input id="o_qty" class="mono" value="${esc(t.qty || '')}" placeholder="10 STK"></label>
            <label>Zeichnung / Auftrag<input id="o_dwg" class="mono" placeholder="optional"></label>
            <label class="full">Notiz<input id="o_note" placeholder="optional, z. B. dringend"></label>
            <div class="full row"><button type="button" class="btn primary" data-pick="add" data-id="${t.id}">Auf die Liste</button></div>
          </div>` : ''}
      </div>`;
    }).join('');
  }
  $('pickQ').addEventListener('input', e => { state.pickQ = U(e.target.value); state.pickOpen = null; renderPick(); });
  $('pickRes').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]'); if (!b) return;
    if (b.dataset.pick === 'new') { $('goNewTool').click(); return; }
    const t = state.lib.find(x => x.id === b.dataset.id); if (!t) return;
    if (b.dataset.pick === 'toggle') {
      state.pickOpen = state.pickOpen === t.id ? null : t.id; renderPick();
      if (state.pickOpen) { const q = $('o_qty'); q.focus(); q.select(); }
    }
    if (b.dataset.pick === 'add') {
      orderFromLib(t, { qty: $('o_qty').value, dwg: $('o_dwg').value, note: $('o_note').value });
      state.pickOpen = null; state.pickQ = ''; $('pickQ').value = ''; renderPick();
    }
  });
  $('pickRes').addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.closest('.ordform')) { e.preventDefault(); $('pickRes').querySelector('[data-pick="add"]')?.click(); }
  });

  // ---------- order list actions ----------
  $('list').addEventListener('click', e => {
    const b = e.target.closest('button[data-act]'); if (!b) return;
    const id = b.dataset.id, act = b.dataset.act, now = Date.now();
    const it = state.items.find(x => x.id === id); if (!it) return;
    if (act === 'order') { Object.assign(it, { status:'bestellt', orderedAt: now }); commit('Als bestellt markiert'); }
    if (act === 'deliver') { Object.assign(it, { status:'geliefert', deliveredAt: now }); commit('Als geliefert markiert'); }
    if (act === 'back') { it.status = it.status === 'geliefert' ? 'bestellt' : 'bedarf'; commit('Zurückgesetzt'); }
    if (act === 'again') {
      const t = state.lib.find(x => x.id === it.libId) || it;
      orderFromLib({ ...t, id: it.libId || t.id }, { qty: it.qty, dwg: it.dwg });
    }
    if (act === 'del') { state.confirmDel = id; render(); }
    if (act === 'delno') { state.confirmDel = null; render(); }
    if (act === 'delyes') { state.confirmDel = null; state.items = state.items.filter(x => x.id !== id); commit('Gelöscht'); }
  });

  // ---------- library list actions ----------
  $('libList').addEventListener('click', e => {
    const b = e.target.closest('button[data-lact]'); if (!b) return;
    const t = state.lib.find(x => x.id === b.dataset.id); if (!t) return;
    const act = b.dataset.lact;
    if (act === 'order') { setView('orders'); state.pickQ = U(t.firm || t.name); $('pickQ').value = state.pickQ; state.pickOpen = t.id; renderPick(); const q = $('o_qty'); if (q) { q.focus(); q.select(); } }
    if (act === 'edit') {
      state.editLib = t.id; fillLib(t);
      $('libTitle').textContent = 'Werkzeug bearbeiten'; $('libCancel').hidden = false; $('libSaveOrder').hidden = true;
      $('libForm').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    }
    if (act === 'copy') { state.editLib = null; fillLib({ ...t, firm: '', makerArt: '' }); $('libTitle').textContent = 'Neues Werkzeug (Kopie)'; $('libCancel').hidden = false; $('l_name').focus(); }
    if (act === 'del') { state.confirmLibDel = t.id; render(); }
    if (act === 'delno') { state.confirmLibDel = null; render(); }
    if (act === 'delyes') { state.confirmLibDel = null; state.lib = state.lib.filter(x => x.id !== t.id); commit('Aus Bibliothek gelöscht'); }
  });
  $('libQ').addEventListener('input', e => { state.libQ = U(e.target.value); render(); });

  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
    state.tab = b.dataset.tab;
    document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    render();
  });
  $('q').addEventListener('input', e => { state.q = U(e.target.value); render(); });

  // ---------- send: mail / copy / print ----------
  const NAME_KEY = 'syncop_bestellliste_name';
  $('p_name').value = lsGet(NAME_KEY);
  $('p_name').addEventListener('input', e => lsSet(NAME_KEY, e.target.value.trim()));
  [['p_to','syncop_bestellliste_to'],['p_mail','syncop_bestellliste_mail']].forEach(([id,k]) => {
    $(id).value = lsGet(k);
    $(id).addEventListener('input', e => lsSet(k, e.target.value.trim()));
  });
  const openItems = () => state.items.filter(i => i.status === 'bedarf').sort((a,b) => (a.createdAt||0) - (b.createdAt||0));
  const untilText = () => { const u = $('p_until').value; return u ? new Date(u + 'T12:00').toLocaleDateString('de-DE', { weekday:'long', day:'2-digit', month:'2-digit', year:'numeric' }).toUpperCase() : ''; };

  function slipText(items) {
    const to = U($('p_to').value), name = U($('p_name').value), until = untilText();
    const lines = items.map((i, n) => {
      const head = [`${n+1}. ${fullName(i)}`];
      if (i.firm) head.push(`FA-NR. ${i.firm}`);
      if (i.qty) head.push(`MENGE: ${i.qty}`);
      let line = head.join(' · ');
      const sub = [i.maker && (i.makerArt ? `${i.maker} ${i.makerArt}` : i.maker), !i.maker && i.makerArt && `ART.-NR. ${i.makerArt}`, i.sup && `LIEFERANT ${i.sup}`, i.dwg && `ZEICHNUNG ${i.dwg}`, i.mach, i.note].filter(Boolean).join(' · ');
      if (sub) line += `\n   ${sub}`;
      return line;
    });
    return [to ? `HALLO ${to},` : 'HALLO,', '', until ? `BITTE BIS ${until} BESTELLEN:` : 'BITTE BESTELLEN:', '', lines.join('\n'), '', 'DANKE!', name].join('\n').trim() + '\n';
  }

  $('printOpen').onclick = () => {
    const n = openItems().length;
    if (!n) { toast('Nichts zu bestellen'); return; }
    $('p_info').textContent = `${n} ${n === 1 ? 'Position' : 'Positionen'} aus „Zu bestellen“. Ohne E-Mail-Adresse wählst du den Empfänger im Mailprogramm.`;
    $('printPanel').hidden = false;
    $('printPanel').scrollIntoView({ block: 'nearest' });
  };
  $('printClose').onclick = () => $('printPanel').hidden = true;

  $('copyBtn').onclick = async () => {
    const items = openItems(); if (!items.length) { toast('Nichts zu bestellen'); return; }
    const text = slipText(items);
    try { await navigator.clipboard.writeText(text); toast(`${items.length} Positionen kopiert`); $('copyFallback').hidden = true; }
    catch { const ta = $('copyFallback'); ta.value = text; ta.hidden = false; ta.focus(); ta.select(); toast('Text markiert – jetzt kopieren'); }
  };
  $('mailGo').onclick = () => {
    const items = openItems(); if (!items.length) { toast('Nichts zu bestellen'); return; }
    const to = $('p_mail').value.trim();
    const subject = `BESTELLUNG ${new Date().toLocaleDateString('de-DE')}`;
    location.href = `mailto:${encodeURIComponent(to).replace(/%40/g,'@')}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(slipText(items))}`;
  };
  $('printGo').onclick = () => {
    const items = openItems(); if (!items.length) { toast('Nichts zu bestellen'); return; }
    const to = U($('p_to').value), name = U($('p_name').value), until = untilText();
    const rows = items.map((i, n) => {
      const sub = [i.maker && (i.makerArt ? `${i.maker} ${i.makerArt}` : i.maker), !i.maker && i.makerArt, i.dwg && `ZEICHNUNG ${i.dwg}`, i.mach, i.note].filter(Boolean).map(esc).join(' · ');
      return `<tr>
        <td class="box"><span></span></td>
        <td class="m">${n+1}</td>
        <td><strong>${esc(fullName(i))}</strong>${sub ? `<div class="s-sub">${sub}</div>` : ''}</td>
        <td class="m">${esc(i.firm || '')}</td>
        <td>${esc(i.sup || i.maker || '')}</td>
        <td class="m">${esc(i.qty || '')}</td>
      </tr>`;
    }).join('');
    $('sheet').innerHTML = `
      <div class="s-top"><span class="s-brand">BESTELLUNG</span><span class="s-date">${new Date().toLocaleDateString('de-DE')}</span></div>
      <div class="s-hello">${to ? `HALLO ${esc(to)},` : 'HALLO,'}</div>
      <h2>BITTE BESTELLEN:</h2>
      ${until ? `<div class="s-until">BIS ${esc(until)}</div>` : ''}
      <table>
        <thead><tr><th></th><th>POS</th><th>BEZEICHNUNG</th><th>FIRMEN-NR.</th><th>LIEFERANT</th><th>MENGE</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="s-thanks">DANKE!</div>
      <div class="s-name">${esc(name) || '&nbsp;'}</div>`;
    window.print();
  };

  // ---------- backup ----------
  $('exportBtn').onclick = () => {
    const blob = new Blob([JSON.stringify({ app: 'bestellliste', version: 2, exportedAt: new Date().toISOString(), lib: state.lib, items: state.items }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `bestellliste-${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    toast('Backup gespeichert');
  };
  $('importBtn').onclick = () => $('importFile').click();
  $('importFile').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const data = JSON.parse(await f.text());
      const items = Array.isArray(data) ? data : (data.items || []);
      const lib = Array.isArray(data.lib) ? data.lib : [];
      const mergeInto = (arr, incoming, fix) => { const m = new Map(arr.map(x => [x.id, x])); let n = 0; incoming.forEach(x => { if (x && x.id && x.name) { if (!m.has(x.id)) n++; m.set(x.id, fix ? fix(x) : x); } }); return [[...m.values()], n]; };
      let a, b;
      [state.items, a] = mergeInto(state.items, items, migrateItem);
      [state.lib, b] = mergeInto(state.lib, lib);
      commit(`${b} Werkzeuge, ${a} Bestellungen geladen`);
    } catch { toast('Datei ist kein gültiges Backup'); }
  };

  // ---------- render ----------
  function ageClass(it) {
    if (it.status === 'bedarf') { const d = days(it.createdAt); return d >= AGE_CRIT_BEDARF ? 'late' : d >= AGE_WARN_BEDARF ? 'aging' : ''; }
    if (it.status === 'bestellt') { const d = days(it.orderedAt); return d >= AGE_CRIT_BESTELLT ? 'late' : d >= AGE_WARN_BESTELLT ? 'aging' : ''; }
    return '';
  }

  function renderAlarm() {
    const open = state.items.filter(i => i.status === 'bedarf');
    const lateOrders = state.items.filter(i => i.status === 'bestellt' && days(i.orderedAt) >= AGE_CRIT_BESTELLT);
    const a = $('alarm');
    if (open.length) {
      const oldest = Math.max(...open.map(i => days(i.createdAt)));
      a.className = 'alarm hot';
      a.innerHTML = `<span class="big">${open.length}</span><div><b>${open.length === 1 ? 'Position wartet' : 'Positionen warten'} auf Bestellung</b><small>Älteste ${ageText(oldest)}${lateOrders.length ? ` · ${lateOrders.length} Bestellung${lateOrders.length>1?'en':''} über ${AGE_CRIT_BESTELLT} Tage offen` : ''}</small></div>`;
    } else if (lateOrders.length) {
      a.className = 'alarm hot';
      a.innerHTML = `<span class="big">${lateOrders.length}</span><div><b>Bestellt, aber nicht geliefert</b><small>Seit über ${AGE_CRIT_BESTELLT} Tagen – beim Lieferanten nachfragen</small></div>`;
    } else {
      a.className = 'alarm calm';
      a.innerHTML = `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M7 11.5l2.6 2.5L15 8.5" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b style="color:var(--fg)">Alles bestellt</b><small>Fehlt etwas? Unten suchen und auf die Liste setzen.</small></div>`;
    }
  }

  const specChips = t => specs(t).map(s => `<span class="chip spec">${esc(s)}</span>`).join('');

  function itemHTML(it) {
    const cls = ageClass(it);
    const chips = [];
    if (it.status === 'bedarf') chips.push(`<span class="chip ${cls==='late'?'crit':cls==='aging'?'warn':''}">Eingetragen ${ageText(days(it.createdAt))}</span>`);
    if (it.status === 'bestellt') chips.push(`<span class="chip ${cls==='late'?'crit':cls==='aging'?'warn':''}">Bestellt ${ageText(days(it.orderedAt))}</span>`);
    if (it.status === 'geliefert') chips.push(`<span class="chip ok">Geliefert ${fmtDate(it.deliveredAt)}</span>`);
    if (it.type) chips.push(`<span class="chip">${esc(it.type)}</span>`);
    if (it.mach) chips.push(`<span class="chip">${esc(it.mach)}</span>`);

    const meta = [];
    if (it.firm) meta.push(`<span><em>FA-Nr.</em><span class="mono">${esc(it.firm)}</span></span>`);
    if (it.makerArt || it.maker) meta.push(`<span><em>${esc(it.maker || 'Art.')}</em><span class="mono">${esc(it.makerArt || '')}</span></span>`);
    if (it.sup) meta.push(`<span><em>Lief.</em>${esc(it.sup)}</span>`);
    if (it.dwg) meta.push(`<span><em>Zng.</em><span class="mono">${esc(it.dwg)}</span></span>`);

    const trail = [`eingetragen ${fmtDate(it.createdAt)}`];
    if (it.orderedAt) trail.push(`bestellt ${fmtDate(it.orderedAt)}`);
    if (it.deliveredAt) trail.push(`erhalten ${fmtDate(it.deliveredAt)}`);

    let acts;
    if (state.confirmDel === it.id) {
      acts = `<span class="grow" style="font-size:14px">Wirklich löschen?</span>
        <button class="btn" data-act="delno" data-id="${it.id}">Nein</button>
        <button class="btn primary" data-act="delyes" data-id="${it.id}">Löschen</button>`;
    } else {
      const main = it.status === 'bedarf' ? `<button class="btn primary" data-act="order" data-id="${it.id}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3 3L13 4.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Bestellt</button>`
        : it.status === 'bestellt' ? `<button class="btn primary" data-act="deliver" data-id="${it.id}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 5.5L8 2.5l6 3v5l-6 3-6-3z M2 5.5l6 3 6-3 M8 8.5v5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg>Geliefert</button>`
        : `<button class="btn" data-act="again" data-id="${it.id}">Nochmal bestellen</button>`;
      const back = it.status !== 'bedarf' ? `<button class="btn ghost" data-act="back" data-id="${it.id}">Zurück</button>` : '';
      acts = `${main}<span class="grow"></span>${back}
        <button class="btn ghost" data-act="del" data-id="${it.id}" aria-label="Löschen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg></button>`;
    }

    return `<article class="item ${cls}">
      <div class="main">
        <div class="name">${esc(it.name)}</div>
        ${specs(it).length ? `<div class="chips">${specChips(it)}</div>` : ''}
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
        <div class="chips">${chips.join('')}</div>
        ${it.note ? `<div class="note">${esc(it.note)}</div>` : ''}
        <div class="trail">${trail.join(' · ')}</div>
      </div>
      <div class="qty">${esc(it.qty || '–')}<small>Menge</small></div>
      <div class="acts">${acts}</div>
    </article>`;
  }

  function libHTML(t) {
    const lo = lastOrder(t.id);
    const meta = [];
    if (t.maker || t.makerArt) meta.push(`<span><em>${esc(t.maker || 'Art.')}</em><span class="mono">${esc(t.makerArt || '')}</span></span>`);
    if (t.sup) meta.push(`<span><em>Lief.</em>${esc(t.sup)}</span>`);
    if (t.mach) meta.push(`<span><em>Masch.</em>${esc(t.mach)}</span>`);
    if (t.qty) meta.push(`<span><em>Std.</em><span class="mono">${esc(t.qty)}</span></span>`);
    const trail = lo.count ? `${lo.count}× bestellt · zuletzt ${fmtDate(lo.last)}` : 'noch nie bestellt';
    const acts = state.confirmLibDel === t.id
      ? `<span class="grow" style="font-size:14px">Aus Bibliothek löschen?</span>
         <button class="btn" data-lact="delno" data-id="${t.id}">Nein</button>
         <button class="btn primary" data-lact="delyes" data-id="${t.id}">Löschen</button>`
      : `<button class="btn primary" data-lact="order" data-id="${t.id}">+ Bestellen</button><span class="grow"></span>
         <button class="btn ghost" data-lact="copy" data-id="${t.id}">Kopie</button>
         <button class="btn ghost" data-lact="edit" data-id="${t.id}" aria-label="Bearbeiten"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 13l1-3.5L10.5 3 13 5.5 6.5 12z" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg></button>
         <button class="btn ghost" data-lact="del" data-id="${t.id}" aria-label="Löschen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5h5.6l.7-8.5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linejoin="round"/></svg></button>`;
    return `<article class="item">
      <div class="main">
        <div class="name">${esc(t.name)}</div>
        ${specs(t).length ? `<div class="chips">${specChips(t)}</div>` : ''}
        ${meta.length ? `<div class="meta">${meta.join('')}</div>` : ''}
        ${t.note ? `<div class="note">${esc(t.note)}</div>` : ''}
        <div class="trail">${trail}${lo.open ? ' · <b style="color:var(--warn)">auf der Liste</b>' : ''}</div>
      </div>
      <div class="fa">${esc(t.firm || '–')}<small>FA-Nr.</small></div>
      <div class="acts">${acts}</div>
    </article>`;
  }

  function renderOrders() {
    const vis = state.items.filter(i => !(i.status === 'geliefert' && days(i.deliveredAt) > HIDE_DELIVERED_AFTER));
    ['bedarf','bestellt','geliefert'].forEach(s => $('n_' + s).textContent = vis.filter(i => i.status === s).length);
    renderAlarm(); renderPick();
    let rows = vis.filter(i => i.status === state.tab);
    if (state.q) rows = rows.filter(i => match(libHay(i) + ' ' + (i.dwg||''), state.q));
    const key = { bedarf: i => i.createdAt, bestellt: i => i.orderedAt, geliefert: i => -(i.deliveredAt||0) };
    rows.sort((a,b) => (key[state.tab](a)||0) - (key[state.tab](b)||0));
    const L = $('list');
    if (!rows.length) {
      const msg = state.q ? ['Keine Treffer', 'Suchbegriff ändern.']
        : state.tab === 'bedarf' ? ['Nichts offen', 'Oben Werkzeug suchen und „+ Bestellen“ tippen.']
        : state.tab === 'bestellt' ? ['Keine offenen Bestellungen', 'Was bestellt ist, bleibt hier bis zur Lieferung.']
        : ['Noch nichts geliefert', `Gelieferte Einträge bleiben ${HIDE_DELIVERED_AFTER} Tage sichtbar.`];
      L.innerHTML = `<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`;
    } else L.innerHTML = rows.map(itemHTML).join('');
  }

  function renderLib() {
    let rows = state.lib.slice();
    if (state.libQ) rows = rows.filter(t => match(libHay(t), state.libQ));
    const L = $('libList');
    if (!rows.length) {
      L.innerHTML = state.libQ ? `<div class="empty"><b>Keine Treffer</b>Suchbegriff ändern.</div>`
        : `<div class="empty"><b>Bibliothek ist leer</b>Oben das erste Werkzeug anlegen: Bezeichnung, Ø, Radius, Firmen-Nr. – nur einmal.</div>`;
      return;
    }
    const byType = {};
    rows.forEach(t => (byType[t.type || 'Sonstiges'] ||= []).push(t));
    const order = [...TYPES, ...Object.keys(byType).filter(k => !TYPES.includes(k))];
    const cmp = (a,b) => (parseFloat(a.d)||0) - (parseFloat(b.d)||0) || a.name.localeCompare(b.name) || (parseFloat(a.r)||0) - (parseFloat(b.r)||0);
    L.innerHTML = order.filter(k => byType[k]).map(k =>
      `<div class="group-h">${esc(k)} · ${byType[k].length}</div>` + byType[k].sort(cmp).map(libHTML).join('')
    ).join('');
  }

  function render() {
    $('nv_orders').textContent = state.items.filter(i => i.status === 'bedarf').length;
    $('nv_lib').textContent = state.lib.length;
    const uniq = k => [...new Set(state.lib.map(t => t[k]).filter(Boolean))].map(v => `<option value="${esc(v)}">`).join('');
    $('dl_maker').innerHTML = uniq('maker'); $('dl_sup').innerHTML = uniq('sup');
    if (state.view === 'orders') renderOrders(); else renderLib();
  }

  load();
  resetLibForm();
  if (!state.lib.length && !state.items.some(i => i.status === 'bedarf')) setView('lib'); else render();
  updateStatus();
  setInterval(render, 60 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !state.pickOpen && !state.editLib) { load(); render(); } });
})();
</script>
</body>
</html>
