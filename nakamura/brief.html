<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Command AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    @keyframes pulse-subtle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .animate-pulse-subtle { animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    .prose p { margin-bottom: 0.5rem; }
    .prose p:last-child { margin-bottom: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-4 antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Spotlight Container -->
  <div class="w-full max-w-2xl flex flex-col gap-3">
    
    <!-- Command Header Badge -->
    <div class="flex items-center justify-between px-2">
      <div class="flex items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-indigo-600 animate-pulse-subtle"></div>
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Aura Command Bar</span>
      </div>
      <span class="text-[11px] font-bold text-slate-400 bg-white border border-slate-200 rounded-md px-2 py-0.5 shadow-2xs">Gemini 3.6</span>
    </div>

    <!-- Main Command Box -->
    <div class="bg-white border-2 border-slate-200 rounded-2xl shadow-xl overflow-hidden focus-within:border-indigo-500 focus-within:ring-4 focus-within:ring-indigo-100 transition-all duration-200">
      
      <!-- Interactive Context Bar (Chips) -->
      <div class="p-3 border-b border-slate-100 bg-slate-50/50 flex flex-wrap items-center justify-between gap-2">
        
        <!-- Target Language Pills -->
        <div class="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-xl shadow-2xs">
          <button onclick="setLang('Deutsch')" id="lang-Deutsch" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-600 text-white transition-all">DE</button>
          <button onclick="setLang('English')" id="lang-English" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">EN</button>
          <button onclick="setLang('Russian')" id="lang-Russian" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">RU</button>
          <button onclick="setLang('Spanish')" id="lang-Spanish" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">ES</button>
        </div>

        <!-- Format Mode Pills -->
        <div class="flex items-center gap-1 bg-white border border-slate-200 p-1 rounded-xl shadow-2xs">
          <button onclick="setType('grammar')" id="type-grammar" class="type-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-white transition-all">Grammatik</button>
          <button onclick="setType('whatsapp')" id="type-whatsapp" class="type-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">Chat</button>
          <button onclick="setType('email')" id="type-email" class="type-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">Mail</button>
        </div>

      </div>

      <!-- Command Text Area -->
      <div class="p-4 relative">
        <textarea id="text" rows="3" class="w-full bg-transparent text-slate-800 font-medium text-base resize-none outline-none placeholder:text-slate-400 leading-relaxed" placeholder="Введите суть сообщения или текст для коррекции..."></textarea>
        
        <!-- Bottom Action Bar inside Box -->
        <div class="flex justify-between items-center pt-2">
          <button onclick="clearAll()" class="text-xs text-slate-400 hover:text-rose-500 font-bold transition flex items-center gap-1">
            <i data-lucide="x" class="w-3.5 h-3.5"></i> Сброс
          </button>
          
          <button id="execBtn" onclick="runCommand()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-2">
            <span>Выполнить</span>
            <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

    </div>

    <!-- Modifiers Bar (Quick Adjustments) -->
    <div class="flex items-center justify-center gap-2 pt-1">
      <button onclick="runCommand('Сделай более вежливым')" class="text-xs font-bold bg-white hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 rounded-lg px-3 py-1.5 transition shadow-2xs flex items-center gap-1.5">
        <i data-lucide="heart" class="w-3.5 h-3.5 text-indigo-500"></i> Вежливее
      </button>
      <button onclick="runCommand('Сделай максимально коротким')" class="text-xs font-bold bg-white hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 rounded-lg px-3 py-1.5 transition shadow-2xs flex items-center gap-1.5">
        <i data-lucide="zap" class="w-3.5 h-3.5 text-amber-500"></i> Короче
      </button>
      <button onclick="runCommand('Добавь официальный бизнес-тон')" class="text-xs font-bold bg-white hover:bg-indigo-50 text-slate-600 hover:text-indigo-600 border border-slate-200 rounded-lg px-3 py-1.5 transition shadow-2xs flex items-center gap-1.5">
        <i data-lucide="briefcase" class="w-3.5 h-3.5 text-slate-700"></i> Строже
      </button>
    </div>

    <!-- Output Card (Appears seamlessly) -->
    <div id="outputCard" class="hidden mt-2 bg-white border-2 border-indigo-100 rounded-2xl p-5 shadow-lg relative group cursor-pointer transition hover:border-indigo-300" onclick="copyResult()">
      
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
        <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider flex items-center gap-1.5">
          <i data-lucide="sparkles" class="w-4 h-4"></i> Результат
        </span>
        <span id="copyStatus" class="text-xs font-bold text-slate-400 group-hover:text-indigo-600 transition flex items-center gap-1">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i> Кликните, чтобы скопировать
        </span>
      </div>

      <div id="output" class="prose text-slate-800 font-medium text-sm leading-relaxed"></div>
      
      <!-- Hidden Raw Storage -->
      <textarea id="rawOutput" class="hidden"></textarea>

      <!-- Loader Overlay -->
      <div id="loader" class="hidden absolute inset-0 bg-white/90 backdrop-blur-xs rounded-2xl flex items-center justify-center gap-3">
        <div class="w-6 h-6 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-xs font-bold text-indigo-600">Обработка...</span>
      </div>

    </div>

  </div>

  <script>
    lucide.createIcons();

    const WORKER_URL = "https://aura-communicator-api.russianflow.workers.dev/";

    let currentLang = 'Deutsch';
    let currentType = 'grammar';

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.className = 'lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all';
      });
      document.getElementById(`lang-${lang}`).className = 'lang-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-600 text-white transition-all';
    }

    function setType(type) {
      currentType = type;
      document.querySelectorAll('.type-btn').forEach(btn => {
        btn.className = 'type-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all';
      });
      document.getElementById(`type-${type}`).className = 'type-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-800 text-white transition-all';
    }

    function clearAll() {
      document.getElementById('text').value = '';
      document.getElementById('outputCard').classList.add('hidden');
    }

    async function runCommand(modifier = '') {
      const text = document.getElementById('text').value;
      const outputCard = document.getElementById('outputCard');
      const output = document.getElementById('output');
      const rawOutput = document.getElementById('rawOutput');
      const loader = document.getElementById('loader');

      if (!text.trim()) return;

      outputCard.classList.remove('hidden');
      loader.classList.remove('hidden');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: currentType,
            targetLang: currentLang,
            text: text,
            modifier: modifier
          })
        });

        const data = await res.json();
        const rawText = data.result || data.error;

        rawOutput.value = rawText;
        output.innerHTML = marked.parse(rawText);

      } catch (err) {
        output.innerText = "Ошибка: " + err.message;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function copyResult() {
      const rawText = document.getElementById('rawOutput').value;
      if (!rawText) return;

      let cleanText = rawText
        .replace(/^#+\s+/gm, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1');

      navigator.clipboard.writeText(cleanText.trim());

      const status = document.getElementById('copyStatus');
      status.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-600"></i> <span class="text-emerald-600">Скопировано!</span>`;
      lucide.createIcons();

      setTimeout(() => {
        status.innerHTML = `<i data-lucide="copy" class="w-3.5 h-3.5"></i> Кликните, чтобы скопировать`;
        lucide.createIcons();
      }, 2000);
    }
  </script>
</body>
</html>
