<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart AI Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-colors">

  <div class="max-w-lg w-full bg-white dark:bg-slate-800 rounded-2xl shadow-2xl p-6 space-y-4 border border-slate-200 dark:border-slate-700">
    
    <div class="flex justify-between items-center">
      <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-purple-500 bg-clip-text text-transparent">
        Smart AI Communicator
      </h1>
      <span class="text-xs px-2 py-1 bg-indigo-100 dark:bg-indigo-900/50 text-indigo-600 dark:text-indigo-300 rounded-full font-medium">Gemini 1.5</span>
    </div>
    
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Режим работы</label>
        <select id="type" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="grammar">Grammatik & Rechtschreibung</option>
          <option value="whatsapp">WhatsApp / Telegram</option>
          <option value="email">Официальное письмо</option>
          <option value="github">GitHub PR / Issue</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 dark:text-slate-400 mb-1">Язык результата</label>
        <select id="targetLang" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="Deutsch">Deutsch</option>
          <option value="English">English</option>
          <option value="Russian">Русский</option>
          <option value="Spanish">Español</option>
        </select>
      </div>
    </div>

    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Исходный текст или тезисы</label>
        <button onclick="document.getElementById('text').value=''" class="text-xs text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">Очистить</button>
      </div>
      <textarea id="text" rows="4" class="w-full bg-slate-50 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 text-slate-800 dark:text-slate-100 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none transition-all" placeholder="Вставьте текст с ошибками для проверки или введите тезисы ответа..."></textarea>
    </div>

    <button id="btn" onclick="generateResponse()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-all shadow-md flex justify-center items-center gap-2">
      <span>Обработать</span>
    </button>

    <div>
      <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-500 dark:text-slate-400">Результат</label>
        <button onclick="copyToClipboard()" class="text-xs text-indigo-600 dark:text-indigo-400 font-medium hover:underline">Скопировать</button>
      </div>
      <div id="output" class="w-full bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg p-3 text-sm text-slate-800 dark:text-slate-200 min-h-[120px] whitespace-pre-wrap leading-relaxed select-text">Результат появится здесь...</div>
    </div>
  </div>

  <script>
    // Укажите URL вашего Worker в Cloudflare
    const WORKER_URL = "https://your-worker.your-subdomain.workers.dev";

    async function generateResponse() {
      const text = document.getElementById('text').value;
      const output = document.getElementById('output');
      const btn = document.getElementById('btn');

      if (!text.trim()) {
        alert('Пожалуйста, введите текст.');
        return;
      }

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      output.innerText = "Думаю и анализирую...";

      const payload = {
        type: document.getElementById('type').value,
        targetLang: document.getElementById('targetLang').value,
        text: text
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        output.innerText = data.result || data.error;
      } catch (err) {
        output.innerText = "Ошибка соединения: " + err.message;
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
    }

    function copyToClipboard() {
      const text = document.getElementById('output').innerText;
      if (text && text !== "Результат появится здесь...") {
        navigator.clipboard.writeText(text);
        alert('Скопировано в буфер обмена!');
      }
    }
  </script>
</body>
</html>
