<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Canvas & Radial Control</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .radial-grid {
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 12px 12px;
    }
    .prose p { margin-bottom: 0.5rem; }
    .prose p:last-child { margin-bottom: 0; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-center items-center p-3 md:p-6 font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Main Canvas Container -->
  <div class="w-full max-w-3xl bg-white border-2 border-slate-200 rounded-3xl shadow-xl overflow-hidden flex flex-col gap-0">
    
    <!-- Top Bar -->
    <div class="px-5 py-3.5 border-b-2 border-slate-100 bg-slate-50/50 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <div class="w-2.5 h-2.5 rounded-full bg-indigo-600 animate-pulse"></div>
        <span class="font-bold text-xs uppercase tracking-wider text-slate-600">Aura Live Canvas</span>
      </div>
      
      <!-- Target Language Switcher -->
      <div class="flex items-center gap-1 bg-white border-2 border-slate-200 p-1 rounded-xl shadow-2xs">
        <button onclick="setLang('Deutsch')" id="lang-Deutsch" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-600 text-white transition-all">DE</button>
        <button onclick="setLang('English')" id="lang-English" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">EN</button>
        <button onclick="setLang('Russian')" id="lang-Russian" class="lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all">RU</button>
      </div>
    </div>

    <!-- Input Area -->
    <div class="p-5 border-b-2 border-slate-100 bg-white">
      <textarea id="userInput" rows="2" class="w-full bg-transparent text-slate-800 font-semibold text-base outline-none resize-none placeholder:text-slate-400 placeholder:font-normal" placeholder="Набросайте суть или вставьте исходный текст..."></textarea>
      
      <div class="flex justify-between items-center pt-2">
        <span class="text-xs font-bold text-slate-400">Формат: Auto-Detect</span>
        <button onclick="generateBase()" class="bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-bold text-xs px-4 py-2 rounded-xl transition flex items-center gap-1.5 shadow-sm">
          <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
          <span>Сгенерировать</span>
        </button>
      </div>
    </div>

    <!-- Interactive Output Canvas -->
    <div id="canvasArea" class="p-6 bg-slate-50 min-h-[160px] relative flex flex-col justify-between">
      
      <div id="outputContent" class="prose text-slate-800 font-medium text-base leading-relaxed">
        <span class="text-slate-400 italic text-sm">Результат появится здесь...</span>
      </div>

      <!-- Quick Action Floating Bar -->
      <div id="copyBar" class="hidden justify-end pt-4">
        <button onclick="copyCanvasText()" class="bg-white border-2 border-slate-200 hover:border-indigo-500 text-indigo-600 font-bold text-xs px-3.5 py-1.5 rounded-xl transition shadow-sm flex items-center gap-1.5">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span id="copyBtnText">Скопировать</span>
        </button>
      </div>

      <!-- Loading Overlay -->
      <div id="loader" class="hidden absolute inset-0 bg-white/80 backdrop-blur-xs flex items-center justify-center gap-2">
        <div class="w-5 h-5 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-xs font-bold text-indigo-600">Адаптация текста...</span>
      </div>
    </div>

    <!-- RADIAL TONALITY DIAL (Прорывный орган управления) -->
    <div class="p-5 bg-white border-t-2 border-slate-100 flex flex-col md:flex-row items-center justify-between gap-4">
      
      <div class="flex flex-col gap-1 text-center md:text-left">
        <span class="text-xs font-bold text-slate-700 uppercase tracking-wider">Джойстик Тональности</span>
        <p class="text-[11px] font-medium text-slate-400 max-w-xs">Перемещайте точку по осям для моментальной подстройки стиля ответа.</p>
      </div>

      <!-- 2D Directional Grid Controller -->
      <div class="relative w-48 h-32 bg-slate-50 border-2 border-slate-200 rounded-2xl radial-grid p-2 flex items-center justify-center shrink-0">
        <!-- Axis Labels -->
        <span class="absolute top-1 text-[9px] font-bold text-slate-500 uppercase">Короче</span>
        <span class="absolute bottom-1 text-[9px] font-bold text-slate-500 uppercase">Подробно</span>
        <span class="absolute left-1 text-[9px] font-bold text-slate-500 uppercase">Строго</span>
        <span class="absolute right-1 text-[9px] font-bold text-slate-500 uppercase">Мягко</span>

        <!-- Quick Quadrant Buttons -->
        <div class="grid grid-cols-2 gap-2 w-full h-full pt-3 pb-3 px-4">
          <button onclick="applyDial('Максимально строго и коротко')" class="hover:bg-indigo-100/60 rounded-lg text-[10px] font-bold text-slate-600 border border-slate-200/60 transition">Деловой / Краткий</button>
          <button onclick="applyDial('Очень мягко, вежливо и коротко')" class="hover:bg-indigo-100/60 rounded-lg text-[10px] font-bold text-slate-600 border border-slate-200/60 transition">Мягкий / Краткий</button>
          <button onclick="applyDial('Официальное развернутое письмо')" class="hover:bg-indigo-100/60 rounded-lg text-[10px] font-bold text-slate-600 border border-slate-200/60 transition">Строгий / Развернутый</button>
          <button onclick="applyDial('Дружелюбно, тепло и развернуто')" class="hover:bg-indigo-100/60 rounded-lg text-[10px] font-bold text-slate-600 border border-slate-200/60 transition">Теплый / Развернутый</button>
        </div>
      </div>

    </div>

  </div>

  <textarea id="rawStorage" class="hidden"></textarea>

  <script>
    lucide.createIcons();

    const WORKER_URL = "https://aura-communicator-api.russianflow.workers.dev/";
    let currentLang = 'Deutsch';

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.className = 'lang-btn text-xs font-bold px-2.5 py-1 rounded-lg text-slate-600 hover:bg-slate-100 transition-all';
      });
      document.getElementById(`lang-${lang}`).className = 'lang-btn text-xs font-bold px-2.5 py-1 rounded-lg bg-indigo-600 text-white transition-all';
    }

    async function generateBase() {
      applyDial('');
    }

    async function applyDial(styleInstruction) {
      const text = document.getElementById('userInput').value.trim();
      if (!text) return;

      const loader = document.getElementById('loader');
      const outputContent = document.getElementById('outputContent');
      const rawStorage = document.getElementById('rawStorage');
      const copyBar = document.getElementById('copyBar');

      loader.classList.remove('hidden');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'whatsapp',
            targetLang: currentLang,
            text: text,
            modifier: styleInstruction
          })
        });

        const data = await res.json();
        const rawText = data.result || data.error;

        rawStorage.value = rawText;
        outputContent.innerHTML = marked.parse(rawText);
        copyBar.classList.remove('hidden');
        copyBar.classList.add('flex');

      } catch (err) {
        outputContent.innerText = "Ошибка: " + err.message;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function copyCanvasText() {
      const rawText = document.getElementById('rawStorage').value;
      if (!rawText) return;

      let cleanText = rawText
        .replace(/^#+\s+/gm, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1');

      navigator.clipboard.writeText(cleanText.trim());

      const btnText = document.getElementById('copyBtnText');
      btnText.innerText = "Скопировано!";
      setTimeout(() => btnText.innerText = "Скопировать", 2000);
    }
  </script>
</body>
</html>
