<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Communicator AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .glass {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 glass sticky top-0 z-50 px-6 py-4 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl shadow-lg shadow-indigo-500/30">
        <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
          Aura AI
        </h1>
        <p class="text-xs text-slate-400">Умный лингвистический ассистент</p>
      </div>
    </div>

    <!-- Badge & Controls -->
    <div class="flex items-center gap-3">
      <span class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
        Gemini 2.5 Flash
      </span>
      <label class="flex items-center gap-2 cursor-pointer text-xs font-medium text-slate-400 hover:text-slate-200 transition">
        <input type="checkbox" id="liveMode" class="sr-only peer">
        <div class="w-8 h-4 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative"></div>
        <span>Live-режим</span>
      </label>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- INPUT COLUMN -->
    <div class="flex flex-col gap-4">
      
      <!-- Settings Bar -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold text-slate-400 mb-1.5 block">Формат</label>
          <select id="type" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition">
            <option value="grammar">✨ Grammatik & Rechtschreibung</option>
            <option value="whatsapp">💬 WhatsApp / Telegram</option>
            <option value="email">✉️ Официальное письмо</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-400 mb-1.5 block">Язык</label>
          <select id="targetLang" class="w-full bg-slate-800/80 border border-slate-700 rounded-xl p-2.5 text-sm font-medium focus:ring-2 focus:ring-indigo-500 outline-none transition">
            <option value="Deutsch">Deutsch 🇩🇪</option>
            <option value="English">English 🇺🇸</option>
            <option value="Russian">Русский 🇷🇺</option>
            <option value="Spanish">Español 🇪🇸</option>
          </select>
        </div>
      </div>

      <!-- Textarea Card -->
      <div class="relative flex-grow flex flex-col bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 focus-within:border-indigo-500/80 transition-all">
        <textarea id="text" class="w-full flex-grow bg-transparent text-sm resize-none outline-none placeholder:text-slate-500 leading-relaxed" placeholder="Вставьте исходный текст или набросайте суть ответа..."></textarea>
        
        <div class="flex justify-between items-center pt-3 border-t border-slate-700/40 mt-2">
          <span id="charCount" class="text-xs text-slate-500">0 символов</span>
          <button onclick="clearInput()" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Очистить
          </button>
        </div>
      </div>

      <!-- Quick Templates -->
      <div>
        <span class="text-xs font-semibold text-slate-400 mb-2 block">Быстрые сценарии:</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="applyTemplate('Извинение за задержку ответа')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-300 transition">⏳ Извинение за задержку</button>
          <button onclick="applyTemplate('Вежливый отказ от предложения')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-300 transition">🙅‍♂️ Вежливый отказ</button>
          <button onclick="applyTemplate('Напоминание про решение по моему вопросу')" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-300 transition">🔔 Напоминание</button>
        </div>
      </div>

      <!-- Submit Button -->
      <button id="btn" onclick="generateResponse()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 active:scale-[0.99] text-white font-semibold rounded-xl p-3 shadow-lg shadow-indigo-600/20 transition-all flex items-center justify-center gap-2">
        <i data-lucide="wand-2" class="w-4 h-4"></i>
        <span>Преобразовать</span>
      </button>

    </div>

    <!-- OUTPUT COLUMN -->
    <div class="flex flex-col gap-4">
      
      <!-- Action Chips -->
      <div class="flex flex-col gap-1.5">
        <span class="text-xs font-semibold text-slate-400">Быстрая подстройка ответа:</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="modifyResponse('Сделай более вежливым и мягким')" class="text-xs bg-indigo-950/60 hover:bg-indigo-900/80 border border-indigo-700/50 text-indigo-300 rounded-lg px-2.5 py-1 transition flex items-center gap-1">
            ✨ Вежливее
          </button>
          <button onclick="modifyResponse('Сделай максимально коротким и емким')" class="text-xs bg-indigo-950/60 hover:bg-indigo-900/80 border border-indigo-700/50 text-indigo-300 rounded-lg px-2.5 py-1 transition flex items-center gap-1">
            ⚡ Короче
          </button>
          <button onclick="modifyResponse('Добавь профессиональный бизнес-тон')" class="text-xs bg-indigo-950/60 hover:bg-indigo-900/80 border border-indigo-700/50 text-indigo-300 rounded-lg px-2.5 py-1 transition flex items-center gap-1">
            💼 Строже
          </button>
        </div>
      </div>

      <!-- Result Card -->
      <div class="relative flex-grow flex flex-col bg-slate-800/40 border border-slate-700/60 rounded-2xl p-4 min-h-[250px]">
        
        <div class="flex justify-between items-center pb-3 border-b border-slate-700/40 mb-3">
          <span class="text-xs font-semibold text-indigo-400 flex items-center gap-1.5">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Результат
          </span>
          <button onclick="smartCopy(event)" class="text-xs bg-indigo-600/20 hover:bg-indigo-600/40 text-indigo-300 border border-indigo-500/30 rounded-lg px-3 py-1 transition flex items-center gap-1.5">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Скопировать чистый текст
          </button>
        </div>

        <div id="output" class="flex-grow text-sm leading-relaxed whitespace-pre-wrap text-slate-200 select-text overflow-y-auto max-h-[350px] pr-2">
          Сгенерированный вариант или разбор грамматики появится здесь...
        </div>

        <div id="loader" class="hidden absolute inset-0 bg-slate-900/80 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-3">
          <div class="w-8 h-8 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-xs font-medium text-indigo-300">Aura AI генерирует ответ...</span>
        </div>

      </div>

    </div>

  </main>

  <script>
    lucide.createIcons();

    // Замените на ваш актуальный URL Cloudflare Worker
    const WORKER_URL = "https://your-worker.your-subdomain.workers.dev";
    
    let debounceTimer;
    const textInput = document.getElementById('text');
    const charCount = document.getElementById('charCount');
    const liveMode = document.getElementById('liveMode');

    textInput.addEventListener('input', () => {
      charCount.innerText = `${textInput.value.length} символов`;
      if (liveMode.checked && textInput.value.trim().length > 10) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => generateResponse(), 800);
      }
    });

    function applyTemplate(text) {
      textInput.value = text;
      textInput.dispatchEvent(new Event('input'));
      generateResponse();
    }

    function clearInput() {
      textInput.value = '';
      charCount.innerText = '0 символов';
      document.getElementById('output').innerText = 'Сгенерированный вариант или разбор грамматики появится здесь...';
    }

    async function generateResponse(modifier = '') {
      const text = textInput.value;
      const output = document.getElementById('output');
      const loader = document.getElementById('loader');

      if (!text.trim()) return;

      loader.classList.remove('hidden');

      const payload = {
        type: document.getElementById('type').value,
        targetLang: document.getElementById('targetLang').value,
        text: text,
        modifier: modifier
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        output.innerText = data.result || data.error;
      } catch (err) {
        output.innerText = "Ошибка соединения: " + err.message;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function modifyResponse(instruction) {
      generateResponse(instruction);
    }

    function smartCopy(e) {
      const rawText = document.getElementById('output').innerText;
      if (!rawText || rawText.includes("появится здесь...")) return;

      let textToCopy = rawText;

      if (rawText.includes("### 1. Исправленный вариант:") || rawText.includes("1. Исправленный вариант")) {
        const parts = rawText.split(/### 2|2\./);
        textToCopy = parts[0].replace(/### 1\. Исправленный вариант:|1\. Исправленный вариант:/g, '').trim();
      }

      navigator.clipboard.writeText(textToCopy);
      
      const btn = e.currentTarget;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Скопировано!`;
      lucide.createIcons();
      setTimeout(() => btn.innerHTML = originalHTML, 2000);
    }
  </script>
</body>
</html>
