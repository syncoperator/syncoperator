<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aura Communicator AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between font-sans antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b-2 border-slate-200 bg-white/90 backdrop-blur-md sticky top-0 z-50 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-indigo-50 border-2 border-indigo-100 rounded-xl">
        <i data-lucide="sparkles" class="w-5 h-5 text-indigo-600"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-slate-900">
          Aura AI
        </h1>
        <p class="text-xs font-semibold text-slate-500">Умный лингвистический ассистент</p>
      </div>
    </div>

    <!-- Badge & Controls -->
    <div class="flex items-center gap-3">
      <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-slate-100 text-slate-700 border-2 border-slate-200">
        Gemini 2.5 Flash
      </span>
      <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-600 hover:text-slate-900 transition">
        <input type="checkbox" id="liveMode" class="sr-only peer">
        <div class="w-8 h-4 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-indigo-600 relative"></div>
        <span>Live-режим</span>
      </label>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-6xl w-full mx-auto p-4 md:p-6 flex-grow grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- INPUT COLUMN -->
    <div class="flex flex-col gap-4">
      
      <!-- Settings Bar -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-bold text-slate-700 mb-1.5 block">Формат</label>
          <select id="type" class="w-full bg-white border-2 border-slate-200 text-slate-800 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-sm">
            <option value="grammar">Grammatik & Rechtschreibung</option>
            <option value="whatsapp">WhatsApp / Telegram</option>
            <option value="email">Официальное письмо</option>
          </select>
        </div>

        <div>
          <label class="text-xs font-bold text-slate-700 mb-1.5 block">Язык</label>
          <select id="targetLang" class="w-full bg-white border-2 border-slate-200 text-slate-800 rounded-xl p-2.5 text-sm font-semibold focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition shadow-sm">
            <option value="Deutsch">Deutsch</option>
            <option value="English">English</option>
            <option value="Russian">Русский</option>
            <option value="Spanish">Español</option>
          </select>
        </div>
      </div>

      <!-- Textarea Card -->
      <div class="relative flex-grow flex flex-col bg-white border-2 border-slate-200 rounded-2xl p-4 focus-within:border-indigo-500 focus-within:ring-1 focus-within:ring-indigo-500 transition-all shadow-sm">
        <textarea id="text" class="w-full flex-grow bg-transparent text-sm resize-none outline-none placeholder:text-slate-400 leading-relaxed text-slate-800 font-medium" placeholder="Вставьте исходный текст или набросайте суть ответа..."></textarea>
        
        <div class="flex justify-between items-center pt-3 border-t-2 border-slate-100 mt-2">
          <span id="charCount" class="text-xs font-semibold text-slate-400">0 символов</span>
          <button onclick="clearInput()" class="text-xs text-slate-500 hover:text-rose-600 transition flex items-center gap-1.5 font-bold">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Очистить
          </button>
        </div>
      </div>

      <!-- Quick Templates -->
      <div class="pb-3">
        <span class="text-xs font-bold text-slate-700 mb-2 block">Быстрые сценарии</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="applyTemplate('Извинение за задержку ответа')" class="text-xs bg-white hover:bg-slate-100 border-2 border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-500"></i> Задержка ответа
          </button>
          <button onclick="applyTemplate('Вежливый отказ от предложения')" class="text-xs bg-white hover:bg-slate-100 border-2 border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="x-circle" class="w-3.5 h-3.5 text-slate-500"></i> Отказ
          </button>
          <button onclick="applyTemplate('Напоминание про решение по моему вопросу')" class="text-xs bg-white hover:bg-slate-100 border-2 border-slate-200 rounded-lg px-2.5 py-1.5 text-slate-700 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="bell" class="w-3.5 h-3.5 text-slate-500"></i> Напоминание
          </button>
        </div>
      </div>

      <!-- Submit Button -->
      <button id="btn" onclick="generateResponse()" class="w-full bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold rounded-xl p-3 shadow-md shadow-indigo-100 transition-all flex items-center justify-center gap-2">
        <i data-lucide="wand-2" class="w-4 h-4"></i>
        <span>Преобразовать</span>
      </button>

    </div>

    <!-- OUTPUT COLUMN -->
    <div class="flex flex-col gap-4">
      
      <!-- Action Chips -->
      <div class="flex flex-col gap-1.5 pb-2">
        <span class="text-xs font-bold text-slate-700">Быстрая подстройка ответа</span>
        <div class="flex flex-wrap gap-2">
          <button onclick="modifyResponse('Сделай более вежливым и мягким')" class="text-xs bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-200 text-indigo-700 rounded-lg px-2.5 py-1.5 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="heart" class="w-3.5 h-3.5 text-indigo-500"></i> Вежливее
          </button>
          <button onclick="modifyResponse('Сделай максимально коротким и емким')" class="text-xs bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-200 text-indigo-700 rounded-lg px-2.5 py-1.5 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="zap" class="w-3.5 h-3.5 text-indigo-500"></i> Короче
          </button>
          <button onclick="modifyResponse('Добавь профессиональный бизнес-тон')" class="text-xs bg-white hover:bg-indigo-50 border-2 border-slate-200 hover:border-indigo-200 text-indigo-700 rounded-lg px-2.5 py-1.5 transition flex items-center gap-1.5 shadow-sm font-bold">
            <i data-lucide="briefcase" class="w-3.5 h-3.5 text-indigo-500"></i> Строже
          </button>
        </div>
      </div>

      <!-- Result Card -->
      <div class="relative flex-grow flex flex-col bg-white border-2 border-slate-200 rounded-2xl p-4 min-h-[250px] shadow-sm">
        
        <div class="flex justify-between items-center pb-3 border-b-2 border-slate-100 mb-3">
          <span class="text-xs font-bold text-indigo-600 flex items-center gap-1.5">
            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Результат
          </span>
          <button onclick="smartCopy(event)" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 border-2 border-indigo-200 rounded-lg px-3 py-1 transition flex items-center gap-1.5 font-bold">
            <i data-lucide="copy" class="w-3.5 h-3.5"></i> Скопировать чистый текст
          </button>
        </div>

        <div id="output" class="flex-grow text-sm leading-relaxed whitespace-pre-wrap text-slate-700 font-medium select-text overflow-y-auto max-h-[350px] pr-2">
          Сгенерированный вариант или разбор грамматики появится здесь...
        </div>

        <div id="loader" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm rounded-2xl flex flex-col items-center justify-center gap-3">
          <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          <span class="text-xs font-bold text-indigo-600">Aura AI генерирует ответ...</span>
        </div>

      </div>

    </div>

  </main>

  <script>
    lucide.createIcons();

    // Ваш рабочий URL Cloudflare Worker
    const WORKER_URL = "https://aura-communicator-api.russianflow.workers.dev/";
    
    let debounceTimer;
    const textInput = document.getElementById('text');
    const charCount = document.getElementById('charCount');
    const liveMode = document.getElementById('liveMode');

    textInput.addEventListener('input', () => {
      charCount.innerText = `${textInput.value.length} символов`;
      if (liveMode.checked && textInput.value.trim().length > 10) {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => generateResponse(), 800);
      }
    });

    function applyTemplate(text) {
      textInput.value = text;
      textInput.dispatchEvent(new Event('input'));
      generateResponse();
    }

    function clearInput() {
      textInput.value = '';
      charCount.innerText = '0 символов';
      document.getElementById('output').innerText = 'Сгенерированный вариант или разбор грамматики появится здесь...';
    }

    async function generateResponse(modifier = '') {
      const text = textInput.value;
      const output = document.getElementById('output');
      const loader = document.getElementById('loader');

      if (!text.trim()) return;

      loader.classList.remove('hidden');

      const payload = {
        type: document.getElementById('type').value,
        targetLang: document.getElementById('targetLang').value,
        text: text,
        modifier: modifier
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        output.innerText = data.result || data.error;
      } catch (err) {
        output.innerText = "Ошибка соединения: " + err.message;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function modifyResponse(instruction) {
      generateResponse(instruction);
    }

    function smartCopy(e) {
      const rawText = document.getElementById('output').innerText;
      if (!rawText || rawText.includes("появится здесь...")) return;

      let textToCopy = rawText;

      if (rawText.includes("### 1. Исправленный вариант:") || rawText.includes("1. Исправленный вариант")) {
        const parts = rawText.split(/### 2|2\./);
        textToCopy = parts[0].replace(/### 1\. Исправленный вариант:|1\. Исправленный вариант:/g, '').trim();
      }

      navigator.clipboard.writeText(textToCopy);
      
      const btn = e.currentTarget;
      const originalHTML = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Скопировано!`;
      lucide.createIcons();
      setTimeout(() => btn.innerHTML = originalHTML, 2000);
    }
  </script>
</body>
</html>
