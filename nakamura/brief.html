<!DOCTYPE html>
<html lang="ru" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aura Canvas Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 50px -10px rgba(79, 70, 229, 0.07), 0 10px 20px -5px rgba(0, 0, 0, 0.03);
    }
    .glass-input {
      background: rgba(248, 250, 252, 0.6);
      border: 1px solid rgba(226, 232, 240, 0.8);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass-input:focus-within {
      background: rgba(255, 255, 255, 0.95);
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
    }
    .prose p { margin-bottom: 0.6rem; }
    .prose p:last-child { margin-bottom: 0; }
    input[type=range] { accent-color: #4f46e5; }
    ::selection { background-color: #e0e7ff; color: #3730a3; }
  </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col justify-center items-center p-3 md:p-6 font-sans antialiased">

  <!-- Main Premium Glass Canvas Container -->
  <div class="w-full max-w-3xl glass-card rounded-[32px] overflow-hidden flex flex-col transition-all duration-300">
    
    <!-- Top Bar -->
    <div class="px-6 py-4 border-b border-slate-100/80 bg-white/40 flex justify-between items-center backdrop-blur-sm">
      <div class="flex items-center gap-2.5">
        <div class="relative flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-600"></span>
        </div>
        <span class="font-extrabold text-xs uppercase tracking-widest text-slate-500">Aura Studio <span class="bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent font-black">PRO</span></span>
      </div>
      
      <!-- Premium Language Switcher -->
      <div class="flex items-center gap-1 bg-slate-100/70 p-1 rounded-2xl border border-slate-200/50">
        <button onclick="setLang('Deutsch')" id="lang-Deutsch" class="lang-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-600 shadow-sm transition-all duration-200">DE</button>
        <button onclick="setLang('English')" id="lang-English" class="lang-btn text-xs font-bold px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">EN</button>
        <button onclick="setLang('Russian')" id="lang-Russian" class="lang-btn text-xs font-bold px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200">RU</button>
      </div>
    </div>

    <!-- Input Smart Area -->
    <div class="p-6 border-b border-slate-100/80 bg-white/30">
      <div class="glass-input p-4 rounded-2xl">
        <textarea id="userInput" rows="3" class="w-full bg-transparent text-slate-800 font-semibold text-base outline-none resize-none placeholder:text-slate-400 placeholder:font-normal" placeholder="Вставьте текст или мысль... (ответ сформируется автоматически)"></textarea>
      </div>
      
      <div class="flex justify-between items-center pt-3">
        <div class="flex items-center gap-2">
          <button onclick="openModal()" class="text-xs font-bold text-indigo-600 bg-indigo-50/80 hover:bg-indigo-100/80 border border-indigo-100 px-3.5 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 shadow-xs active:scale-95">
            <i data-lucide="sliders" class="w-3.5 h-3.5"></i>
            <span id="activePresetLabel">Стиль: Настроить</span>
          </button>
          
          <span id="detectedToneBadge" class="hidden text-[11px] font-bold text-slate-500 bg-slate-100/80 px-3 py-1.5 rounded-xl border border-slate-200/60">
            Вход: Анализ...
          </span>
        </div>

        <button onclick="clearAll()" class="text-xs font-bold text-slate-400 hover:text-rose-500 transition-colors py-1 px-2">Очистить</button>
      </div>
    </div>

    <!-- Multi-Variant Glass Tabs -->
    <div id="variantTabs" class="hidden px-6 py-3 bg-slate-50/50 border-b border-slate-100 items-center gap-2 overflow-x-auto">
      <span class="text-xs font-bold text-slate-400 shrink-0 mr-1">Вариант:</span>
      <button onclick="switchVariant('soft')" id="tab-soft" class="tab-btn text-xs font-bold px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white shadow-sm transition-all duration-200">Мягкий & Вежливый</button>
      <button onclick="switchVariant('official')" id="tab-official" class="tab-btn text-xs font-bold px-3.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200/80 transition-all duration-200">Официальный</button>
      <button onclick="switchVariant('short')" id="tab-short" class="tab-btn text-xs font-bold px-3.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200/80 transition-all duration-200">Короткий</button>
    </div>

    <!-- Live Canvas Output -->
    <div id="canvasArea" class="p-6 bg-slate-50/30 min-h-[180px] relative flex flex-col justify-between">
      
      <div id="outputContent" onmouseup="checkTextSelection()" class="prose text-slate-800 font-medium text-base leading-relaxed select-text pb-4">
        <span class="text-slate-400 italic text-sm">Вставьте текст выше — готовый ответ появится моментально...</span>
      </div>

      <!-- Bottom Floating Action Bar -->
      <div id="copyBar" class="hidden justify-between items-center pt-4 border-t border-slate-200/50 mt-2">
        <span class="text-xs font-bold text-slate-400">Выделите любой фрагмент текста для быстрой правки</span>
        <button onclick="copyCanvasText()" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 active:scale-95 text-white font-bold text-xs px-5 py-2.5 rounded-xl transition-all duration-200 shadow-md shadow-indigo-500/20 flex items-center gap-2">
          <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          <span id="copyBtnText">Скопировать вариант</span>
        </button>
      </div>

      <!-- Premium Glass Loader -->
      <div id="loader" class="hidden absolute inset-0 bg-white/70 backdrop-blur-md flex items-center justify-center gap-3">
        <div class="w-6 h-6 border-3 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <span class="text-xs font-bold text-indigo-600 tracking-wide">Создаю варианты ответа...</span>
      </div>
    </div>

  </div>

  <!-- ================= ВСПЛЫВАЮЩАЯ ПРЕМИУМ-МОДАЛКА ================= -->
  <div id="settingsModal" class="hidden fixed inset-0 bg-slate-900/30 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="glass-card rounded-[28px] max-w-md w-full p-6 flex flex-col gap-5 animate-in fade-in zoom-in duration-200 shadow-2xl">
      
      <div class="flex justify-between items-center pb-2 border-b border-slate-100">
        <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
          Настройка тона и стиля
        </h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 p-1 transition-colors">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Presets -->
      <div class="flex flex-col gap-2">
        <span class="text-xs font-bold text-slate-400">Готовые стили:</span>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="selectPreset('Официально и строго')" class="text-xs font-bold bg-white/80 hover:bg-indigo-50/80 border border-slate-200/80 hover:border-indigo-200 text-slate-700 p-3 rounded-2xl text-left transition-all duration-200">Официально / Документ</button>
          <button onclick="selectPreset('Очень мягко и вежливо')" class="text-xs font-bold bg-white/80 hover:bg-indigo-50/80 border border-slate-200/80 hover:border-indigo-200 text-slate-700 p-3 rounded-2xl text-left transition-all duration-200">Мягко / Вежливо</button>
          <button onclick="selectPreset('Максимально коротко')" class="text-xs font-bold bg-white/80 hover:bg-indigo-50/80 border border-slate-200/80 hover:border-indigo-200 text-slate-700 p-3 rounded-2xl text-left transition-all duration-200">Ультра-коротко</button>
          <button onclick="selectPreset('Дружелюбно для чата')" class="text-xs font-bold bg-white/80 hover:bg-indigo-50/80 border border-slate-200/80 hover:border-indigo-200 text-slate-700 p-3 rounded-2xl text-left transition-all duration-200">Неформальный чат</button>
        </div>
      </div>

      <!-- Sliders -->
      <div class="flex flex-col gap-4 bg-slate-50/80 p-4 rounded-2xl border border-slate-100">
        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between text-xs font-bold text-slate-600">
            <span>Тональность:</span>
            <span id="modalToneText" class="text-indigo-600">Сбалансированная</span>
          </div>
          <input type="range" id="modalTone" min="0" max="100" value="50" oninput="updateSlidersText()" class="w-full">
        </div>

        <div class="flex flex-col gap-1.5">
          <div class="flex justify-between text-xs font-bold text-slate-600">
            <span>Детализация:</span>
            <span id="modalLengthText" class="text-indigo-600">Средняя</span>
          </div>
          <input type="range" id="modalLength" min="0" max="100" value="50" oninput="updateSlidersText()" class="w-full">
        </div>
      </div>

      <button onclick="applyModalSettings()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-bold text-sm py-3.5 rounded-2xl transition-all duration-200 shadow-md shadow-indigo-500/20 active:scale-95">
        Применить стиль
      </button>

    </div>
  </div>

  <!-- ================= ПАРЯЩЕЕ МЕНЮ НАД ВЫДЕЛЕНИЕМ ================= -->
  <div id="selectionPopup" class="hidden fixed z-50 bg-slate-900/90 backdrop-blur-md text-white rounded-2xl shadow-2xl p-1.5 flex items-center gap-1 border border-slate-700/60 transition-all scale-95">
    <button onclick="refineSelectedText('Сделай этот фрагмент мягче и вежливее')" class="text-[11px] font-bold hover:bg-white/10 px-3 py-1.5 rounded-xl transition flex items-center gap-1">
      <span>💧 Мягче</span>
    </button>
    <button onclick="refineSelectedText('Сделай этот фрагмент более официальным')" class="text-[11px] font-bold hover:bg-white/10 px-3 py-1.5 rounded-xl transition flex items-center gap-1">
      <span>💼 Строго</span>
    </button>
    <button onclick="refineSelectedText('Сократи этот фрагмент')" class="text-[11px] font-bold hover:bg-white/10 px-3 py-1.5 rounded-xl transition flex items-center gap-1">
      <span>✂️ Короче</span>
    </button>
  </div>

  <textarea id="rawStorage" class="hidden"></textarea>

  <script>
    lucide.createIcons();

    const WORKER_URL = "https://aura-communicator-api.russianflow.workers.dev/";
    let currentLang = 'Deutsch';
    let currentActivePreset = '';
    let currentVariant = 'soft';
    let variantsData = { soft: '', official: '', short: '' };
    let inputDebounceTimer;

    const userInput = document.getElementById('userInput');

    userInput.addEventListener('paste', () => {
      setTimeout(() => autoGenerate(), 100);
    });

    userInput.addEventListener('input', () => {
      clearTimeout(inputDebounceTimer);
      inputDebounceTimer = setTimeout(() => {
        if (userInput.value.trim().length > 5) autoGenerate();
      }, 600);
    });

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll('.lang-btn').forEach(btn => {
        btn.className = 'lang-btn text-xs font-bold px-3 py-1.5 rounded-xl text-slate-500 hover:text-slate-800 transition-all duration-200';
      });
      document.getElementById(`lang-${lang}`).className = 'lang-btn text-xs font-bold px-3 py-1.5 rounded-xl bg-white text-indigo-600 shadow-sm transition-all duration-200';
      if (userInput.value.trim()) autoGenerate();
    }

    function clearAll() {
      userInput.value = '';
      variantsData = { soft: '', official: '', short: '' };
      document.getElementById('outputContent').innerHTML = '<span class="text-slate-400 italic text-sm">Вставьте текст выше — готовый ответ появится моментально...</span>';
      document.getElementById('copyBar').classList.add('hidden');
      document.getElementById('variantTabs').classList.add('hidden');
      document.getElementById('detectedToneBadge').classList.add('hidden');
    }

    function openModal() { document.getElementById('settingsModal').classList.remove('hidden'); }
    function closeModal() { document.getElementById('settingsModal').classList.add('hidden'); }

    function updateSlidersText() {
      const tone = document.getElementById('modalTone').value;
      const length = document.getElementById('modalLength').value;
      document.getElementById('modalToneText').innerText = tone < 35 ? 'Строгая' : tone > 65 ? 'Мягкая' : 'Сбалансированная';
      document.getElementById('modalLengthText').innerText = length < 35 ? 'Короткая' : length > 65 ? 'Развернутая' : 'Средняя';
    }

    function selectPreset(preset) {
      currentActivePreset = preset;
      document.getElementById('activePresetLabel').innerText = `Стиль: ${preset}`;
      closeModal();
      if (userInput.value.trim()) autoGenerate();
    }

    function applyModalSettings() {
      const tone = document.getElementById('modalToneText').innerText;
      const length = document.getElementById('modalLengthText').innerText;
      currentActivePreset = `Стиль: ${tone}, Длина: ${length}`;
      document.getElementById('activePresetLabel').innerText = `Стиль: ${tone}`;
      closeModal();
      if (userInput.value.trim()) autoGenerate();
    }

    async function autoGenerate() {
      const text = userInput.value.trim();
      if (!text) return;

      const loader = document.getElementById('loader');
      const outputContent = document.getElementById('outputContent');
      const rawStorage = document.getElementById('rawStorage');
      const copyBar = document.getElementById('copyBar');
      const variantTabs = document.getElementById('variantTabs');
      const toneBadge = document.getElementById('detectedToneBadge');

      loader.classList.remove('hidden');

      toneBadge.classList.remove('hidden');
      toneBadge.innerText = text.length > 80 ? "Вход: Сложное обращение" : "Вход: Короткая реплика";

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'whatsapp',
            targetLang: currentLang,
            text: text,
            modifier: currentActivePreset || 'Сделай ответ мягким, очень вежливым и понятным.'
          })
        });

        const data = await res.json();
        const mainResult = data.result || data.error;

        variantsData.soft = mainResult;
        variantsData.official = "Официальная форма:\n\n" + mainResult.replace(/😊|👍/g, '');
        variantsData.short = "Краткое резюме:\n\n" + mainResult.split('.')[0] + '.';

        rawStorage.value = mainResult;
        outputContent.innerHTML = marked.parse(mainResult);

        copyBar.classList.remove('hidden');
        copyBar.classList.add('flex');
        variantTabs.classList.remove('hidden');
        variantTabs.classList.add('flex');

      } catch (err) {
        outputContent.innerText = "Ошибка генерации: " + err.message;
      } finally {
        loader.classList.add('hidden');
      }
    }

    function switchVariant(variantKey) {
      currentVariant = variantKey;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.className = 'tab-btn text-xs font-bold px-3.5 py-1.5 rounded-xl bg-white text-slate-600 border border-slate-200/80 transition-all duration-200';
      });
      document.getElementById(`tab-${variantKey}`).className = 'tab-btn text-xs font-bold px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white shadow-sm transition-all duration-200';

      const text = variantsData[variantKey] || variantsData.soft;
      document.getElementById('rawStorage').value = text;
      document.getElementById('outputContent').innerHTML = marked.parse(text);
    }

    function checkTextSelection() {
      const selection = window.getSelection();
      const popup = document.getElementById('selectionPopup');

      if (selection && selection.toString().trim().length > 3) {
        const range = selection.getRangeAt(0);
        const rect = range.getBoundingClientRect();

        popup.style.top = `${rect.top - 45 + window.scrollY}px`;
        popup.style.left = `${rect.left + (rect.width / 2) - 100}px`;
        popup.classList.remove('hidden');
      } else {
        popup.classList.add('hidden');
      }
    }

    async function refineSelectedText(instruction) {
      const selection = window.getSelection();
      const selectedText = selection.toString().trim();
      if (!selectedText) return;

      document.getElementById('selectionPopup').classList.add('hidden');
      const loader = document.getElementById('loader');
      loader.classList.remove('hidden');

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            type: 'whatsapp',
            targetLang: currentLang,
            text: selectedText,
            modifier: instruction
          })
        });

        const data = await res.json();
        const refinedResult = data.result || selectedText;

        const fullRaw = document.getElementById('rawStorage').value;
        const updatedRaw = fullRaw.replace(selectedText, refinedResult);

        document.getElementById('rawStorage').value = updatedRaw;
        document.getElementById('outputContent').innerHTML = marked.parse(updatedRaw);

      } catch (err) {
        console.error(err);
      } finally {
        loader.classList.add('hidden');
      }
    }

    function copyCanvasText() {
      const rawText = document.getElementById('rawStorage').value;
      if (!rawText) return;

      let cleanText = rawText
        .replace(/^#+\s+/gm, '')
        .replace(/\*\*(.*?)\*\*/g, '$1')
        .replace(/\*(.*?)\*/g, '$1');

      navigator.clipboard.writeText(cleanText.trim());

      const btnText = document.getElementById('copyBtnText');
      btnText.innerText = "Скопировано!";
      setTimeout(() => btnText.innerText = "Скопировать вариант", 2000);
    }
  </script>
</body>
</html>
