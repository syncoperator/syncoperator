<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Werkzeugliste - Light Premium</title>
  <style>
    @page {
      size: A4;
      margin: 15mm;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #000;
      background: #fff;
    }
    
    .page-wrapper {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      box-sizing: border-box;
      padding: 10px 0;
    }

    /* Заголовок по центру */
    .header {
      text-align: center;
      border-bottom: 4px solid #000; /* Жирная линия сверху */
      padding-bottom: 15px;
      margin-bottom: 30px;
    }

    .title {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: 2px;
      margin: 0;
      text-transform: uppercase;
      text-align: center;
    }

    /* Зона списка инструментов */
    .tools-container {
      flex: 1;
      padding-bottom: 60px; /* Защитный отступ снизу списка */
    }

    .tools-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    /* Нижняя часть (Footer) по центру */
    .footer {
      text-align: center;
      border-top: 4px solid #000; /* Жирная линия снизу */
      padding-top: 15px;
      margin-top: auto;
    }

    .footer-text {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase; /* CITIZEN M20 ALLES GROSS */
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Верхняя часть -->
    <div>
      <header class="header">
        <h1 class="title">Werkzeugliste</h1>
      </header>

      <!-- Контейнер под рендер списка из ui.js -->
      <main class="tools-container">
        <ul class="tools-list" id="tools-list">
          <!-- Элементы списка инструментов -->
        </ul>
      </main>
    </div>

    <!-- Подвал -->
    <footer class="footer">
      <div class="footer-text">CITIZEN M20</div>
    </footer>
  </div>

</body>
</html>
