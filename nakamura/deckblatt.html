<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deckblatt">
<title>Deckblatt Einrichteblatt</title>
<script>(function(){try{var t=localStorage.getItem('cititool_theme')||'auto';if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t);var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='dark'?'#101114':'#F2F3F5')}catch(e){}})();</script>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2215%22%20fill=%22%23111214%22/%3E%3Cpath%20d=%22M32%2010l19%2011v22L32%2054%2013%2043V21z%22%20fill=%22none%22%20stroke=%22%23fff%22%20stroke-width=%225%22%20stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Poppins:wght@600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F3F5;--card:#FFFFFF;--ink:#111214;--on-ink:#FFFFFF;--mute:#6B6F76;--dim:#9A9EA6;--line:#E3E5E9;--line2:#D6D9DE;
  --sh:0 1px 2px rgba(17,18,20,.05),0 6px 18px rgba(17,18,20,.06);--alert:#B42318;
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#101114;--card:#1B1C20;--ink:#F4F5F7;--on-ink:#101114;--mute:rgba(255,255,255,.52);--dim:rgba(255,255,255,.32);
  --line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);--sh:0 2px 6px rgba(0,0,0,.26),0 14px 34px rgba(0,0,0,.22);--alert:#E8837B;color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}

/* ---------- Werkzeugleiste (nur Bildschirm) ---------- */
.top{border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 12px}
.row{max-width:640px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row+.row{margin-top:8px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{width:26px;height:26px}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.3em;color:var(--mute)}
.brand b{font-size:17px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:7px;height:38px;padding:0 13px;border-radius:11px;border:1px solid var(--line2);background:var(--card);color:var(--ink);
  font:600 13px var(--sans);cursor:pointer;box-shadow:var(--sh);white-space:nowrap}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.btn:active{transform:scale(.97)}
select.btn{appearance:none;-webkit-appearance:none;padding-right:28px;max-width:210px;text-overflow:ellipsis;
  background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 10px) 16px;background-size:5px 5px;background-repeat:no-repeat}
.chk{display:inline-flex;align-items:center;gap:6px;font:500 12.5px var(--sans);color:var(--mute);cursor:pointer;user-select:none}
.chk input{accent-color:var(--ink);width:16px;height:16px}
.hint{max-width:640px;margin:10px auto 0;font:400 11.5px var(--mono);color:var(--dim)}

.stage{padding:18px 16px 0}

/* =====================================================================
   Das Deckblatt. Alle Maße relativ zur Blattbreite (cqw), Seitenverhältnis fest.
   → passt sich jeder Druckfläche an (iPhone, Mac, Windows) und kippt nicht.
   ===================================================================== */
.sheet{width:100%;max-width:640px;margin:0 auto;aspect-ratio:var(--pw-n,200)/var(--ph-n,287);container-type:inline-size;background:#fff;color:#111214;
  box-shadow:0 2px 8px rgba(0,0,0,.12),0 18px 50px rgba(0,0,0,.14);position:relative;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;break-inside:avoid;page-break-inside:avoid}
.frame{position:absolute;inset:0;border:.32cqw solid #111214;display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:6.5cqw 7cqw 5.5cqw;overflow:hidden}

[contenteditable]{outline:none;border-radius:.4cqw;cursor:text;min-width:4cqw}
[contenteditable]:hover{box-shadow:0 0 0 1px #D6D9DE}
[contenteditable]:focus{box-shadow:0 0 0 1.5px #111214}
[contenteditable]:empty::before{content:attr(data-ph);color:#C4C7CC}

/* Logo */
.logo{cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3.6cqw}
.logo .mk{display:block;height:auto}
.logo .wm{font-family:'Poppins',var(--sans);font-weight:600;letter-spacing:-.01em;line-height:.9;white-space:nowrap}
.logo img{display:block;object-fit:contain;max-width:84cqw}

.brandk{font-family:var(--mono);font-size:1.75cqw;letter-spacing:.32em;color:#6B6F76;margin-top:4.2cqw;padding-left:.32em}
.year{font-family:var(--mono);font-size:1.75cqw;letter-spacing:.22em;color:#6B6F76;margin-top:1.4cqw;padding-left:.22em}

/* Lineal */
.ruler{width:100%;margin-top:6cqw}
.ruler svg{display:block;width:100%;height:3.2cqw}
.kick{font-family:var(--mono);font-size:1.85cqw;letter-spacing:.42em;color:#2E3036;margin-top:.8cqw;padding-left:.42em;white-space:nowrap}

.title{font-family:var(--sans);font-weight:700;letter-spacing:-.025em;line-height:1;white-space:nowrap;margin-top:3.6cqw;max-width:100%}
.bar{width:17cqw;height:.42cqw;background:#111214;margin:5cqw 0 5.2cqw}
.mach{font-family:var(--mono);font-weight:500;font-size:3.1cqw;letter-spacing:.09em;white-space:nowrap;max-width:100%;padding-left:.09em}
.ctrl{font-family:var(--mono);font-weight:500;font-size:3.1cqw;letter-spacing:.09em;white-space:nowrap;margin-top:1.1cqw;max-width:100%;padding-left:.09em}
.desc{font-family:var(--sans);font-size:2.25cqw;color:#5A5E66;margin-top:3.2cqw;max-width:100%}

/* Felder unten */
.fields{margin-top:auto;width:100%;border-top:1px solid #C9CCD1;padding-top:3.4cqw;display:grid;grid-template-columns:repeat(3,1fr);gap:4cqw;text-align:left}
.fields .lab{display:block;font-family:var(--mono);font-size:1.5cqw;letter-spacing:.2em;color:#6B6F76}
.fields .val{display:block;font-family:var(--mono);font-size:2.4cqw;font-weight:600;margin-top:1.6cqw;min-height:5.2cqw;border-bottom:1px solid #111214;padding-bottom:.6cqw;overflow-wrap:anywhere}

input[type=file]{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;
  background:var(--ink);color:var(--on-ink);font:500 13px var(--sans);padding:10px 16px;border-radius:12px;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ================= Drucken ================= */
@media print{
  @page{size:A4 portrait;margin:5mm}
  :root,:root[data-theme="dark"]{color-scheme:light!important}
  html,body{background:#fff!important;padding:0!important;margin:0!important;min-height:0!important}
  body>*:not(.stage){display:none!important}
  .stage{padding:0!important}
  .sheet{width:calc(var(--pw-n,200)*1mm)!important;height:calc(var(--ph-n,287)*1mm)!important;max-width:none!important;aspect-ratio:auto!important;margin:0 auto!important;box-shadow:none!important}
  [contenteditable]{box-shadow:none!important}
  [contenteditable]:empty::before{content:none!important}
  .noprint{display:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="5.5" stroke-linejoin="round"><path d="M32 9l20 11.5v23L32 55 12 43.5v-23z"/></svg>
      <div><small>CITITOOL</small><b>Deckblatt</b></div>
    </div>
    <select class="btn" id="sel" aria-label="Gespeicherte Deckblätter"></select>
    <button class="btn" id="bNew" title="Neues Deckblatt (Kopie des aktuellen)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Neu</button>
    <button class="btn pri" id="bPrint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linejoin="round"><path d="M7 9V3.5h10V9"/><rect x="3" y="9" width="18" height="8" rx="2.2"/><path d="M7 14h10v6.5H7z"/></svg>Drucken</button>
  </div>
  <div class="row">
    <button class="btn" id="bLogo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>Logo-Bild</button>
    <button class="btn" id="bLogoReset">Standard-Logo</button>
    <select class="btn" id="logoSize" aria-label="Logogröße">
      <option value="0.75">Logo klein</option><option value="1">Logo mittel</option><option value="1.2">Logo groß</option>
    </select>
    <select class="btn" id="psize" aria-label="Druckgröße"><option value="max">Größe: maximal</option><option value="gross">Größe: groß</option><option value="normal">Größe: normal</option></select>
    <label class="chk"><input type="checkbox" id="optRuler" checked> Lineal</label>
    <button class="btn" id="bDel" style="margin-left:auto;color:var(--alert)">Löschen</button>
  </div>
  <div class="hint">Text im Blatt antippen und ändern · Logo antippen = eigenes Bild · leere Felder unten bleiben als Schreiblinie</div>
</header>

<div class="stage">
  <section class="sheet" id="sheet">
    <div class="frame">
      <div class="logo" id="logo" title="Logo austauschen"></div>
      <div class="brandk" contenteditable="true" data-k="brand" data-ph="SYNCOPERATOR"></div>
      <div class="year" contenteditable="true" data-k="year" data-ph="Jahr"></div>

      <div class="ruler" id="ruler"></div>
      <div class="kick" contenteditable="true" data-k="kick" data-ph="RÜSTUNTERLAGEN · DREHEN"></div>

      <div class="title fitx" contenteditable="true" data-k="title" data-ph="EINRICHTEBLATT" data-max="10.2"></div>
      <div class="bar"></div>
      <div class="mach fitx" contenteditable="true" data-k="mach" data-ph="MASCHINE" data-max="3.1"></div>
      <div class="ctrl fitx" contenteditable="true" data-k="ctrl" data-ph="Steuerung" data-max="3.1"></div>
      <div class="desc" contenteditable="true" data-k="desc" data-ph="Beschreibung"></div>

      <div class="fields">
        <div><span class="lab" contenteditable="true" data-k="f1l" data-ph="FELD"></span><span class="val" contenteditable="true" data-k="f1v"></span></div>
        <div><span class="lab" contenteditable="true" data-k="f2l" data-ph="FELD"></span><span class="val" contenteditable="true" data-k="f2v"></span></div>
        <div><span class="lab" contenteditable="true" data-k="f3l" data-ph="FELD"></span><span class="val" contenteditable="true" data-k="f3v"></span></div>
      </div>
    </div>
  </section>
</div>

<input type="file" id="file" accept="image/*">
<div class="toast" id="toast"></div>

<script>
const $=id=>document.getElementById(id);
const KEY='cititool_deckblatt_v2';

/* Standard-Logo: Sechseck-„C“ + Schriftzug */
const MARK='<svg class="mk" viewBox="58 42 644 740"><g fill="#111214" stroke="#111214" stroke-width="10" stroke-linejoin="round"><path d="M509 129 L380 54 L70 233 L70 591 L380 770 L509 695 L210 514 L210 308 Z"/><path d="M545 150 L690 234 L690 371 L426 221 Z"/><path d="M545 674 L690 590 L690 453 L426 603 Z"/></g></svg>';

const today=()=>{const d=new Date();return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()};
const blank=()=>({
  brand:'SYNCOPERATOR',year:String(new Date().getFullYear()),kick:'RÜSTUNTERLAGEN · DREHEN',title:'EINRICHTEBLATT',
  mach:'NAKAMURA-TOME WT-250 II',ctrl:'Fanuc · RO / RU',desc:'Werkzeuglisten, Nullpunkte und Rüstprotokolle',
  f1l:'ABTEILUNG',f1v:'',f2l:'VERANTWORTLICH',f2v:'',f3l:'STAND',f3v:today(),
  logo:null,logoSize:1,ruler:true
});

let db;
try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!db||!Array.isArray(db.covers)||!db.covers.length)db={covers:[blank()],cur:0};
if(db.cur>=db.covers.length)db.cur=0;
const C=()=>db.covers[db.cur];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Speichern nicht möglich (Logo zu groß?)')}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),2200)}

/* Lineal: kleine Striche, jeder 5. lang */
(function(){let s='<svg viewBox="0 0 600 32" preserveAspectRatio="none">';
  for(let i=0;i<=60;i++){const x=i*10+(i===60?-0.6:0)+(i===0?0.6:0),big=i%5===0;
    s+=`<line x1="${x}" x2="${x}" y1="${big?2:14}" y2="30" stroke="${big?'#111214':'#9A9EA6'}" stroke-width="${big?1.4:0.9}"/>`}
  $('ruler').innerHTML=s+'</svg>'})();

function renderSel(){
  $('sel').innerHTML=db.covers.map((c,i)=>`<option value="${i}">${esc(c.mach||('Deckblatt '+(i+1)))}</option>`).join('');
  $('sel').value=db.cur;
}
function renderLogo(){
  const c=C(),k=c.logoSize||1,el=$('logo');
  if(c.logo){el.innerHTML=`<img src="${c.logo}" alt="Logo" style="max-height:${34*k}cqw">`}
  else{el.innerHTML=MARK+`<div class="wm" style="font-size:${14*k}cqw">CitiTool</div>`;el.querySelector('.mk').style.width=(22*k)+'cqw'}
  $('logoSize').value=String(k);
}
function render(){
  const c=C();
  document.querySelectorAll('[data-k]').forEach(el=>{el.textContent=c[el.dataset.k]||''});
  $('ruler').hidden=!c.ruler;$('optRuler').checked=!!c.ruler;
  renderLogo();renderSel();
  requestAnimationFrame(fitAll);
}

/* lange Zeilen auf eine Zeile verkleinern */
function fitText(el){
  const max=+el.dataset.max;el.style.fontSize=max+'cqw';
  const box=el.parentElement.clientWidth-1;let s=max;
  while(el.scrollWidth>box&&s>1){s-=.1;el.style.fontSize=s.toFixed(2)+'cqw'}
}
const fitAll=()=>document.querySelectorAll('.fitx').forEach(fitText);

/* ---------- Eingaben ---------- */
const sheet=$('sheet');
sheet.addEventListener('input',e=>{
  const el=e.target;if(!el.dataset.k)return;
  C()[el.dataset.k]=el.textContent.replace(/ /g,' ');
  if(!el.textContent.trim()&&el.innerHTML)el.innerHTML='';
  if(el.dataset.k==='mach')renderSel();
  if(el.classList.contains('fitx'))fitText(el);
  save();
});
sheet.addEventListener('paste',e=>{if(!e.target.isContentEditable)return;e.preventDefault();
  const t=(e.clipboardData||window.clipboardData).getData('text').replace(/\s*\n\s*/g,' ');document.execCommand('insertText',false,t)});
sheet.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.isContentEditable){e.preventDefault();e.target.blur()}});

/* ---------- Logo ---------- */
$('logo').onclick=$('bLogo').onclick=()=>$('file').click();
$('file').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    if(f.type==='image/svg+xml'){C().logo=rd.result;save();renderLogo();return}
    const img=new Image();
    img.onload=()=>{const M=1200,k=Math.min(1,M/Math.max(img.width,img.height));
      const cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);
      const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cv.width,cv.height);x.drawImage(img,0,0,cv.width,cv.height);
      C().logo=cv.toDataURL('image/jpeg',.92);save();renderLogo();toast('Logo übernommen')};
    img.src=rd.result};
  rd.readAsDataURL(f);
};
$('bLogoReset').onclick=()=>{C().logo=null;save();renderLogo()};
$('logoSize').onchange=e=>{C().logoSize=+e.target.value;save();renderLogo()};
$('optRuler').onchange=e=>{C().ruler=e.target.checked;$('ruler').hidden=!C().ruler;save()};

/* ---------- mehrere Deckblätter ---------- */
$('sel').onchange=e=>{db.cur=+e.target.value;save();render()};
$('bNew').onclick=()=>{const c=JSON.parse(JSON.stringify(C()));c.mach='';
  db.covers.push(c);db.cur=db.covers.length-1;save();render();
  setTimeout(()=>sheet.querySelector('[data-k=mach]').focus(),60);toast('Neues Deckblatt – Maschine eintragen')};
$('bDel').onclick=()=>{
  if(!confirm('Dieses Deckblatt löschen?'))return;
  db.covers.splice(db.cur,1);if(!db.covers.length)db.covers.push(blank());db.cur=Math.max(0,db.cur-1);save();render()};

/* ---------- Drucken ---------- */
$('bPrint').onclick=()=>{
  document.activeElement&&document.activeElement.blur();
  const t0=document.title;document.title='Deckblatt_'+(C().mach||'Einrichteblatt').replace(/[^\wäöüÄÖÜß.-]+/g,'_');
  const back=()=>{document.title=t0;window.removeEventListener('afterprint',back)};
  window.addEventListener('afterprint',back);
  setTimeout(()=>{try{window.print()}catch(e){back();toast('Drucken wird hier nicht unterstützt')}},150);
};
/* Druckbreite ≠ Bildschirmbreite → Zeilen vor und nach dem Druck neu einpassen */
addEventListener('beforeprint',()=>setTimeout(fitAll,0));
addEventListener('afterprint',fitAll);
matchMedia('print').addEventListener&&matchMedia('print').addEventListener('change',()=>fitAll());
addEventListener('resize',fitAll);
document.fonts&&document.fonts.ready.then(fitAll);
addEventListener('storage',e=>{if(e.key==='cititool_theme')location.reload()});

/* Druckgröße (gilt für alle Deckblätter) */
const PSIZE={max:[200,287],gross:[194,272],normal:[186,255]};
function applySize(){let k='max';try{k=localStorage.getItem('cititool_deckblatt_size')||'max'}catch(e){}
  if(!PSIZE[k])k='max';const [w,h]=PSIZE[k];
  document.documentElement.style.setProperty('--pw-n',w);document.documentElement.style.setProperty('--ph-n',h);
  $('psize').value=k;requestAnimationFrame(fitAll)}
$('psize').onchange=e=>{try{localStorage.setItem('cititool_deckblatt_size',e.target.value)}catch(_){}applySize()};
applySize();

render();
</script>
</body>
</html>
