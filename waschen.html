<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAKAMURA | PRINT</title>
    <style>
        /* Базовые стили в стиле Light Premium */
        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* HEADER: Жирные линии и центрирование */
        header {
            text-align: center;
            border-bottom: 4px solid #000; /* Жирная линия */
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        header p {
            margin: 5px 0 0;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* ТАБЛИЦА: Оптимизирована для ручного заполнения */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            border: 2px solid #000;
            padding: 10px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
        }

        td {
            border: 1px solid #000;
            height: 38px; /* Высота под почерк */
        }

        /* Кнопка управления (скрывается при печати) */
        .no-print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 25px;
            border-radius: 50px;
            font-weight: 900;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            z-index: 1000;
        }

        /* НАСТРОЙКИ ПЕЧАТИ ДЛЯ МОБИЛЬНЫХ */
        @media print {
            .no-print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .container { max-width: 100%; border: none; }
            
            /* Убираем лишние отступы браузера */
            @page {
                size: A4;
                margin: 10mm;
            }
        }
    </style>
</head>
<body>

    <button class="no-print-btn" onclick="window.print()">DRUCKEN / PDF</button>

    <div class="container">
        <header>
            <h1>NAKAMURA</h1>
            <p>Teile zum Waschen</p>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stück</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 22; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
