<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* КОНТЕЙНЕР-МОНОЛИТ (Запрещает разрывы внутри себя) */
        .page-wrapper {
            width: 100%;
            max-width: 190mm; /* Чуть уже А4 для запаса */
            padding: 10mm;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        header {
            text-align: center;
            border-bottom: 4px solid #000;
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            padding: 5px 0;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 8px 4px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
        }

        td {
            border: 1px solid #000;
            height: 32px; /* Компактная высота, чтобы точно влезло */
        }

        /* КНОПКА */
        .print-btn {
            position: fixed;
            bottom: 20px;
            background: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 800;
            border: none;
            z-index: 100;
            cursor: pointer;
        }

        @media print {
            .print-btn { display: none; }
            body { padding: 0; }
            .page-wrapper { 
                padding: 0;
                margin: 0;
                max-width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">DRUCKEN</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stück</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 22; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
