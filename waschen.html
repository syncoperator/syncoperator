<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEILE ZUM WASCHEN | PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 12mm 15mm;
        }

        /* HEADER: Наш фирменный Premium стиль */
        header {
            border-bottom: 6px solid #000; /* Очень жирная линия */
            margin-bottom: 20px;
            padding-bottom: 5px;
            text-align: left;
        }

        header h1 {
            margin: 0;
            font-size: 42px; /* Огромный заголовок */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        /* ТАБЛИЦА */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 3px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 8px 10px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #f4f4f4;
        }

        td {
            border: 1px solid #000;
            height: 30px; /* Оптимальная высота, чтобы не рвало страницу */
        }

        /* Колонки */
        .col-1 { width: 30%; }
        .col-2 { width: 30%; }
        .col-3 { width: 15%; }
        .col-4 { width: 25%; }

        /* Кнопка (скрыта при печати) */
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            z-index: 100;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 5mm;
            }
            th { -webkit-print-color-adjust: exact; background-color: #f4f4f4 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-1">Zeichnungsnummer</th>
                    <th class="col-2">Auftragsnummer</th>
                    <th class="col-3">Stückzahl</th>
                    <th class="col-4">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 27; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
