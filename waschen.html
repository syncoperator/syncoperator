<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN | INDUSTRIAL GUIDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 10mm 15mm;
            display: flex;
            flex-direction: column;
        }

        /* HEADER: Акцент на заголовке */
        header {
            margin-bottom: 25px;
            border-bottom: 4px solid #000;
            padding-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1.5px;
        }

        /* ТАБЛИЦА: Видимые, но мягкие линии */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000; /* Внешняя рамка четкая */
        }

        th {
            border: 1px solid #000;
            padding: 10px 8px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #f4f4f4;
        }

        td {
            /* Линии теперь 1px и сероватые — их видно, но они не грубые */
            border: 1px solid #d1d1d1; 
            height: 32px; 
        }

        /* Делаем вертикальные линии между колонками чуть темнее для структуры */
        td:not(:last-child) {
            border-right: 1px solid #b1b1b1;
        }

        /* Колонки */
        .col-1 { width: 30%; }
        .col-2 { width: 30%; }
        .col-3 { width: 15%; }
        .col-4 { width: 25%; }

        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            z-index: 100;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
            th { -webkit-print-color-adjust: exact; background-color: #f4f4f4 !important; }
            td { border: 1px solid #d1d1d1 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-1">Zeichnungsnummer</th>
                    <th class="col-2">Auftragsnummer</th>
                    <th class="col-3">Stückzahl</th>
                    <th class="col-4">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    // 24 строки - чтобы точно влезло на 1 лист
                    for (let i = 0; i < 24; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
