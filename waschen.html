<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN | INDUSTRIAL FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 15mm 18mm;
            display: flex;
            flex-direction: column;
        }

        /* HEADER: Brutal Industrial */
        header {
            margin-bottom: 30px;
            border-bottom: 8px solid #000; /* Очень жирная отсечка */
            padding-bottom: 10px;
        }

        header h1 {
            margin: 0;
            font-size: 54px; /* Максимальный контраст */
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -3px;
            line-height: 0.9;
        }

        /* TABLE: Сетка как на чертежах */
        .table-container {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th {
            border: 1px solid #000;
            padding: 10px 8px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #fff;
            letter-spacing: 1px;
        }

        td {
            border: 0.5px solid #000; /* Тонкая, но четкая линия для письма */
            height: 32px; 
        }

        /* Колонки */
        .col-1 { width: 35%; }
        .col-2 { width: 35%; }
        .col-3 { width: 10%; }
        .col-4 { width: 20%; }

        .print-btn {
            position: fixed;
            bottom: 40px;
            right: 40px;
            background: #000;
            color: #fff;
            padding: 20px 40px;
            border-radius: 0; /* Острые углы */
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            border: 4px solid #000;
            cursor: pointer;
            box-shadow: 10px 10px 0px rgba(0,0,0,0.1);
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 10mm 15mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
            td { border: 0.5pt solid #000 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Print Document</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-1">Zeichnungsnummer</th>
                        <th class="col-2">Auftragsnummer</th>
                        <th class="col-3">Stk.</th>
                        <th class="col-4">Datum</th>
                    </tr>
                </thead>
                <tbody>
                    <script>
                        // 24 строки - идеальная высота для ручного заполнения на 1 лист
                        for (let i = 0; i < 24; i++) {
                            document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                        }
                    </script>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
