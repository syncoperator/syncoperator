<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN | TECH-STYLE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 12mm 15mm;
            display: flex;
            flex-direction: column;
        }

        /* HEADER: Технический заголовок */
        header {
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding-bottom: 10px;
            border-bottom: 0.5px solid #000; /* Тончайшая линия под заголовком */
        }

        /* ТАБЛИЦА: Контраст толщины линий */
        .table-container {
            border-top: 2px solid #000;    /* Жирная линия сверху */
            border-bottom: 2px solid #000; /* Жирная линия снизу */
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border-left: 0.5px solid #000;
            border-right: 0.5px solid #000;
        }

        th {
            border: 0.5px solid #000;
            padding: 8px;
            font-size: 8px; /* Мелкий технический шрифт */
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #fbfbfb;
            color: #444;
        }

        td {
            border: 0.5px solid #000; /* Тончайшие внутренние линии */
            height: 29px; 
        }

        /* Колонки */
        .col-1 { width: 30%; }
        .col-2 { width: 30%; }
        .col-3 { width: 15%; }
        .col-4 { width: 25%; }

        /* Кнопка управления */
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 14px 28px;
            border-radius: 2px;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 10px;
            border: none;
            cursor: pointer;
            letter-spacing: 1px;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 5mm 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 5mm;
            }
            th { -webkit-print-color-adjust: exact; background-color: #fbfbfb !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Print Document</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th class="col-1">Zeichnungsnummer</th>
                        <th class="col-2">Auftragsnummer</th>
                        <th class="col-3">Stückzahl</th>
                        <th class="col-4">Datum</th>
                    </tr>
                </thead>
                <tbody>
                    <script>
                        for (let i = 0; i < 26; i++) {
                            document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                        }
                    </script>
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
