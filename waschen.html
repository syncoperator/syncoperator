<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASH-LIST V13</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ СТИЛИ В СТИЛЕ LIGHT PREMIUM */
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* HEADER: ТЕПЕРЬ СТРОГО ТИТУЛЬНОЕ НАЗВАНИЕ */
        header {
            text-align: center;
            border-bottom: 4px solid #000; /* Жирная промышленная линия */
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1.5px;
            text-transform: uppercase;
        }

        /* ТАБЛИЦА: ОПТИМИЗИРОВАНА ДЛЯ РУЧНОГО ЗАПОЛНЕНИЯ */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000; /* Внешний контур жирный */
        }

        th {
            border: 2px solid #000;
            padding: 12px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #fff; /* Чтобы не просвечивало при дублировании */
        }

        td {
            border: 1px solid #000;
            height: 38px; /* Оптимальная высота под handwriting */
        }

        /* Кнопка управления (скрывается при печати) */
        .no-print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            border: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
            transition: 0.2s;
        }
        .no-print-btn:active { transform: scale(0.96); }

        /* НАСТРОЙКИ ПЕЧАТИ (ФИКС PDF РАЗРЫВА) */
        @media print {
            .no-print-btn { display: none !important; }
            body { padding: 0; margin: 0; background: #fff; }
            .container { max-width: 100%; border: none; }
            
            /* Жесткие настройки полей для PDF-принтера на мобильных */
            @page {
                size: A4;
                margin: 10mm; /* Минимальные надежные поля */
            }

            /* КРИТИЧЕСКИЙ ФИКС ДЛЯ PDF: Повторять заголовок на каждой странице */
            thead {
                display: table-header-group !important;
                -webkit-print-color-adjust: exact;
            }

            /* Запретить строкам разрываться пополам */
            tr {
                page-break-inside: avoid !important;
            }
        }
    </style>
</head>
<body>

    <button class="no-print-btn" onclick="window.print()">Drucken / PDF Erstellen</button>

    <div class="container">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stückzahl</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 40; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
