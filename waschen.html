<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>TEILE ZUM WASCHEN</title>

<style>
/* === A4 ЖЕСТКАЯ ОСНОВА === */
@page {
    size: A4;
    margin: 0;
}

html, body {
    margin: 0;
    padding: 0;
    width: 210mm;
    height: 297mm;
    font-family: Arial, sans-serif;
    background: #fff;
}

/* === КОНТЕЙНЕР С ТОЧНОЙ ГЕОМЕТРИЕЙ === */
.page {
    width: 210mm;
    height: 297mm;
    padding: 10mm;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
}

/* === HEADER === */
header {
    text-align: center;
    border-bottom: 3px solid #000;
    padding-bottom: 4mm;
    margin-bottom: 4mm;
}

header h1 {
    margin: 0;
    font-size: 22px;
    font-weight: 900;
}

/* === ТАБЛИЦА === */
.table-wrapper {
    flex: 1;
    display: flex;
}

table {
    width: 100%;
    height: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    border: 2px solid #000;
}

/* HEADER */
th {
    border: 2px solid #000;
    font-size: 10px;
    padding: 2mm;
    text-align: left;
}

/* ROWS */
tbody tr {
    height: calc(100% / 20); /* РОВНО 20 строк */
}

td {
    border: 1px solid #000;
}

/* ШИРИНЫ */
.col1 { width: 30%; }
.col2 { width: 30%; }
.col3 { width: 15%; }
.col4 { width: 25%; }

/* КНОПКА (НЕ ПЕЧАТАЕТСЯ) */
.print-btn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 20px;
    background: #000;
    color: #fff;
    border: none;
}

@media print {
    .print-btn {
        display: none;
    }
}
</style>
</head>

<body>

<button class="print-btn" onclick="window.print()">Print</button>

<div class="page">

<header>
    <h1>TEILE ZUM WASCHEN</h1>

<div class="table-wrapper">

</div>

</html>
