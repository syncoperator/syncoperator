<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEILE ZUM WASCHEN - Clean Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .hub-container {
            width: 100%;
            max-width: 210mm; /* Размер А4 */
        }

        /* --- HERO HEADER --- */
        .hero-header {
            text-align: center;
            border-bottom: 5px solid #000;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .hero-header h1 {
            margin: 0;
            font-size: 38px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -2px;
        }

        /* --- ЧИСТАЯ ТАБЛИЦА --- */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000; /* Внешний контур жирнее */
        }

        th {
            border: 1px solid #000;
            padding: 8px;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            text-align: left;
            background: #f8f8f8;
        }

        td {
            border: 1px solid #000;
            height: 28px; /* Уменьшенная высота для предотвращения разрывов */
        }

        /* Столбцы */
        .col-zeichnungen { width: 30%; }
        .col-auftrags { width: 30%; }
        .col-stueck { width: 15%; }
        .col-datum { width: 25%; }

        /* Кнопка управления (Скрыта при печати) */
        .doc-actions {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 1000;
        }
        .btn-print {
            padding: 16px 35px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            background: #000;
            color: white;
            transition: 0.2s;
        }
        .btn-print:active { transform: scale(0.96); opacity: 0.9; }

        /* НАСТРОЙКИ ПЕЧАТИ (РОВНО 1 ЛИСТ A4) */
        @media print {
            .doc-actions { display: none !important; }
            body { padding: 0; margin: 0; background: white; }
            .hub-container { max-width: 100%; padding: 0; margin: 0; border: none; }
            
            /* Жесткие настройки полей для PDF-принтера на мобильных */
            @page {
                size: A4 portrait;
                margin: 8mm; /* Чистый отступ */
            }

            .hero-header h1 { font-size: 48px; } /* Делаем крупнее на печати */
            th { -webkit-print-color-adjust: exact; background-color: #f8f8f8 !important; }
        }
    </style>
</head>
<body>

    <div class="doc-actions">
        <button class="btn-print" onclick="window.print()">Drucken / PDF Экспорт</button>
    </div>

    <div class="hub-container">
        
        <header class="hero-header">
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-zeichnungen">Zeichnungsnummer</th>
                    <th class="col-auftrags">Auftragsnummer</th>
                    <th class="col-stueck">Stückzahl</th>
                    <th class="col-datum">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 28; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>

    </div>

</body>
</html>
