<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN - FINAL</title>
    <style>
        * { box-sizing: border-box; }
        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* КОНТЕЙНЕР-МОНОЛИТ */
        .page-wrapper {
            width: 100%;
            max-width: 210mm; 
            padding: 8mm 12mm; 
            page-break-inside: avoid;
            break-inside: avoid;
        }

        header {
            text-align: center;
            border-bottom: 5px solid #000; 
            margin-bottom: 10px;
        }

        header h1 {
            margin: 0;
            padding: 4px 0;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2.5px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 8px 4px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #f0f0f0;
        }

        td {
            border: 1px solid #000;
            height: 34px; /* Чуть увеличил высоту для комфортной записи */
        }

        /* КНОПКА ПЕЧАТИ */
        .print-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #000;
            color: #fff;
            padding: 14px 28px;
            border-radius: 50px;
            font-weight: 900;
            border: none;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            text-transform: uppercase;
            font-size: 12px;
        }

        @media print {
            .print-btn { display: none; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 0;
                margin: 0;
                max-width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 5mm;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken (1 Seite)</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stück</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 25; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
