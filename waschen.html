<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN - 1 PAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* БАЗОВЫЕ СТИЛИ */
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        /* HEADER: ЖИРНЫЕ ЛИНИИ, ЦЕНТРИРОВАНИЕ */
        header {
            text-align: center;
            border-bottom: 4px solid #000;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 30px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        /* ТАБЛИЦА: ЖЕСТКАЯ ФИКСАЦИЯ РАЗМЕРОВ */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 10px;
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #fff;
        }

        td {
            border: 1px solid #000;
            height: 35px; /* Идеальная высота для записи рукой и умещения на 1 лист */
        }

        /* КНОПКА ПЕЧАТИ */
        .no-print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            border: none;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
            z-index: 1000;
            cursor: pointer;
        }

        /* ПРАВИЛА ДЛЯ ПРИНТЕРА (РОВНО 1 ЛИСТ A4) */
        @media print {
            .no-print-btn { display: none !important; }
            body { 
                padding: 0; 
                margin: 0; 
            }
            .container { 
                max-width: 100%; 
                border: none; 
            }
            
            /* Жестко задаем формат А4 и убираем лишние поля браузера */
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            
            /* Блокируем любые разрывы */
            table, tr, td, th, header {
                page-break-inside: avoid;
            }
        }
    </style>
</head>
<body>

    <button class="no-print-btn" onclick="window.print()">Drucken / 1 Seite</button>

    <div class="container">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stückzahl</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 25; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
