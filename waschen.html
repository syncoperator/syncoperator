<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teile zum Waschen | Werkzeugliste Style</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 10mm 15mm;
            display: flex;
            flex-direction: column;
        }

        /* Стиль заголовка как в карте наладки */
        header {
            border-bottom: 2px solid #000;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Таблица в стиле Werkzeugliste */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 2px solid #000;
        }

        th {
            border: 1px solid #000;
            padding: 4px 6px;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: bold;
            text-align: left;
            vertical-align: top;
            height: 25px;
            color: #333;
        }

        td {
            border: 1px solid #000;
            height: 38px; /* Оптимально для письма от руки */
        }

        /* Ширина колонок согласно твоему бланку */
        .col-zeich { width: 30%; }
        .col-auftr { width: 30%; }
        .col-stk   { width: 15%; }
        .col-date  { width: 25%; }

        /* Кнопка печати */
        .print-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
        }

        @media print {
            .print-btn { display: none; }
            body { padding: 0; }
            .page-wrapper { 
                padding: 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken</button>

    <div class="page-wrapper">
        <header>
            <h1>Teile zum Waschen</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-zeich">Zeichnungsnummer:</th>
                    <th class="col-auftr">Auftragsnummer:</th>
                    <th class="col-stk">Stückzahl:</th>
                    <th class="col-date">Datum:</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 23; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
