<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEILE ZUM WASCHEN | INDUSTRIAL FINAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            /* Увеличенный отступ сверху как ты просил */
            padding: 25mm 15mm 10mm 15mm;
            display: flex;
            flex-direction: column;
        }

        header {
            margin-bottom: 15px;
            border-bottom: 2px solid #000;
            padding-bottom: 6px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        /* ТАБЛИЦА: Оптимизирована по высоте для 1 листа */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 1px solid #BBBBBB;
        }

        th {
            border: 1px solid #BBBBBB;
            padding: 8px 8px;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            text-align: left;
            background: #F9F9F9;
        }

        td {
            border: 1px solid #BBBBBB;
            /* Уменьшенная высота ячеек, чтобы не рвало страницу */
            height: 29px; 
        }

        /* Колонки */
        .col-1 { width: 30%; }
        .col-2 { width: 30%; }
        .col-3 { width: 15%; }
        .col-4 { width: 25%; }

        /* Кнопка */
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 11px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            z-index: 100;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 20mm 12mm 10mm 12mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
            table, th, td {
                border: 1pt solid #BBBBBB !important;
                -webkit-print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken / PDF</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-1">Zeichnungsnummer</th>
                    <th class="col-2">Auftragsnummer</th>
                    <th class="col-3">Stückzahl</th>
                    <th class="col-4">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    // 25 строк теперь идеально входят на один лист
                    for (let i = 0; i < 25; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
