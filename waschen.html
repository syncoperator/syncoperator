<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN | PREMIUM PRINT</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .page-wrapper {
            width: 100%;
            max-width: 210mm; 
            padding: 10mm 12mm; 
            page-break-inside: avoid;
            break-inside: avoid;
        }

        /* HEADER: Тонкая линия и наш стиль */
        header {
            text-align: center;
            border-bottom: 2px solid #000; /* Линия стала тоньше */
            margin-bottom: 12px;
            padding-bottom: 8px;
        }

        header h1 {
            margin: 0;
            font-size: 26px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ТАБЛИЦА */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 10px 6px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #f4f4f4;
        }

        td {
            border: 1px solid #000;
            height: 34px; 
        }

        /* КНОПКА (Скрыта при печати) */
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 900;
            border: none;
            z-index: 100;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            text-transform: uppercase;
            font-size: 12px;
            transition: 0.2s;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 0;
                margin: 0;
                max-width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
            th {
                -webkit-print-color-adjust: exact;
                background-color: #f4f4f4 !important;
            }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken (1 Seite)</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stück</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 23; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
