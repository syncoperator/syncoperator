<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TEILE ZUM WASCHEN | INDUSTRIAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 8mm 12mm;
        }

        /* HEADER: Строгий индустриальный стиль */
        header {
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 1px solid #000; /* Тонкая линия */
        }

        header h1 {
            margin: 0;
            font-size: 22px; 
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #000;
        }

        /* ТАБЛИЦА: Чистая функциональность */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            border: 2px solid #000;
        }

        th {
            border: 1px solid #000;
            padding: 6px 8px;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            text-align: left;
            background: #f9f9f9;
            color: #333;
        }

        td {
            border: 1px solid #000;
            height: 30px; /* Идеальная высота для записей */
        }

        /* Колонки */
        .col-1 { width: 30%; }
        .col-2 { width: 30%; }
        .col-3 { width: 15%; }
        .col-4 { width: 25%; }

        /* Кнопка */
        .print-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            border: none;
            cursor: pointer;
            z-index: 100;
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 0; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
            th { -webkit-print-color-adjust: exact; background-color: #f9f9f9 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken</button>

    <div class="page-wrapper">
        <header>
            <h1>TEILE ZUM WASCHEN</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-1">Zeichnungsnummer</th>
                    <th class="col-2">Auftragsnummer</th>
                    <th class="col-3">Stückzahl</th>
                    <th class="col-4">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 25; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
