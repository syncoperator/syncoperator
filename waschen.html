<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>NAKAMURA | PRINT VORLAGE</title>
    <style>
        /* Настройки для печати */
        @media print {
            .no-print { display: none; }
            body { padding: 0; margin: 0; }
            .container { width: 100%; max-width: 100%; border: none; }
        }

        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 800px;
            border: 2px solid #000;
            padding: 30px;
        }

        /* HEADER */
        header {
            text-align: center;
            border-bottom: 3px solid #000;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
        }

        header p {
            margin: 5px 0 0;
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* TABLE */
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            border: 2px solid #000;
            padding: 12px;
            font-size: 12px;
            text-transform: uppercase;
            background: #fff;
        }

        td {
            border: 1px solid #000;
            height: 35px; /* Оптимальная высота для записи рукой */
            padding: 8px;
        }

        /* Специальные жирные линии для разделения */
        .heavy-border {
            border-bottom: 3px solid #000;
        }

        /* Кнопка управления */
        .no-print {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #000;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 900;
            font-size: 14px;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <button class="no-print" onclick="window.print()">ПЕЧАТЬ (PDF)</button>

    <div class="container">
        <header>
            <h1>NAKAMURA</h1>
            <p>Teile zum Waschen</p>
        </header>

        <table>
            <thead>
                <tr>
                    <th>Zeichnungsnummer</th>
                    <th>Auftragsnummer</th>
                    <th>Stückzahl</th>
                    <th>Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 1; i <= 25; i++) {
                        document.write(`<tr><td></td><td></td><td></td><td></td></tr>`);
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
