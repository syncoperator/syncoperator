<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN | PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 12mm 15mm;
            page-break-inside: avoid;
        }

        /* HEADER: В стиле Werkzeugliste, но Premium */
        header {
            border-bottom: 5px solid #000;
            margin-bottom: 20px;
            padding-bottom: 5px;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
        }

        header h1 {
            margin: 0;
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        header .sub-title {
            font-size: 14px;
            font-weight: 700;
            color: #666;
            text-transform: uppercase;
        }

        /* ТАБЛИЦА: Мощная и четкая */
        table {
            width: 100%;
            border-collapse: collapse;
            border: 3px solid #000;
        }

        th {
            border: 2px solid #000;
            padding: 8px 10px;
            font-size: 10px;
            text-transform: uppercase;
            font-weight: 900;
            text-align: left;
            background: #f8f8f8;
        }

        td {
            border: 1px solid #000;
            height: 36px; /* Идеально для ручного заполнения */
        }

        /* Кнопка управления */
        .print-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #000;
            color: #fff;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; }
            .page-wrapper { 
                padding: 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 5mm;
            }
            th { -webkit-print-color-adjust: exact; background-color: #f8f8f8 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken (1 Seite)</button>

    <div class="page-wrapper">
        <header>
            <h1>Teile zum Waschen</h1>
            <div class="sub-title">Dokumentation</div>
        </header>

        <table>
            <thead>
                <tr>
                    <th style="width: 30%;">Zeichnungsnummer</th>
                    <th style="width: 30%;">Auftragsnummer</th>
                    <th style="width: 15%;">Stückzahl</th>
                    <th style="width: 25%;">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 22; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
