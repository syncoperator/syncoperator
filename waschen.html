<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEILE ZUM WASCHEN - Clean</title>
    <style>
        * { box-sizing: border-box; }
        
        body {
            background: #fff;
            color: #000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .page-wrapper {
            width: 210mm;
            padding: 10mm 15mm;
            display: flex;
            flex-direction: column;
        }

        header {
            border-bottom: 2px solid #000;
            margin-bottom: 12px;
            padding-bottom: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* ТАБЛИЦА: Монолит с одинаковыми линиями */
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            /* Внешняя рамка теперь такая же тонкая, как внутренние линии */
            border: 0.5px solid #000;
        }

        th {
            /* Жирный, маленький, серый текст для заголовков */
            border: 0.5px solid #000;
            padding: 6px 4px;
            font-size: 9px;
            text-transform: uppercase;
            font-weight: 800;
            text-align: left;
            background: #f0f0f0;
            color: #333;
        }

        td {
            border: 0.5px solid #000;
            /* Высота ячейки для удобного ручного заполнения */
            height: 34px;
        }

        /* Колонки */
        .col-zeichnungen { width: 30%; }
        .col-auftrags { width: 30%; }
        .col-stueck { width: 15%; }
        .col-datum { width: 25%; }

        /* Кнопка */
        .print-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            color: #fff;
            padding: 12px 24px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            border: none;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        @media print {
            .print-btn { display: none !important; }
            body { padding: 0; margin: 0; }
            .page-wrapper { 
                padding: 10mm; 
                width: 100%;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
            th { -webkit-print-color-adjust: exact; background-color: #f0f0f0 !important; }
        }
    </style>
</head>
<body>

    <button class="print-btn" onclick="window.print()">Drucken</button>

    <div class="page-wrapper">
        <header>
            <h1>Teile zum Waschen</h1>
        </header>

        <table>
            <thead>
                <tr>
                    <th class="col-zeichnungen">Zeichnungsnummer</th>
                    <th class="col-auftrags">Auftragsnummer</th>
                    <th class="col-stueck">Stückzahl</th>
                    <th class="col-datum">Datum</th>
                </tr>
            </thead>
            <tbody>
                <script>
                    for (let i = 0; i < 25; i++) {
                        document.write('<tr><td></td><td></td><td></td><td></td></tr>');
                    }
                </script>
            </tbody>
        </table>
    </div>

</body>
</html>
