<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProCalc Mobile | Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; color: #111827; -webkit-tap-highlight-color: transparent; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header class="bg-black text-white px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-lg">
        <div>
            <h1 class="font-extrabold tracking-tighter text-lg italic">PRO<span class="text-slate-400">CALC</span></h1>
            <p class="text-[8px] tracking-[0.3em] uppercase text-slate-500">Mobile Factory Suite</p>
        </div>
        <button onclick="toggleModal()" class="p-2 bg-white/10 rounded-full">
            <i data-lucide="info" class="w-5 h-5 text-white"></i>
        </button>
    </header>

    <main class="flex-1 p-4 space-y-4">
        
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-slate-100">
            <h2 class="text-[10px] font-black uppercase tracking-widest text-slate-400 mb-4 flex items-center gap-2">
                <i data-lucide="settings-2" class="w-3 h-3"></i> Parameter
            </h2>
            
            <div class="space-y-5">
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-xs font-bold">Fertigteil (mm)</label>
                        <input type="number" id="fertigteil" value="51" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold focus:border-black outline-none transition-all">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold">Ausspannen (mm)</label>
                        <input type="number" id="ausspann" value="55" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl font-bold focus:border-black outline-none transition-all">
                    </div>
                </div>

                <div class="space-y-1 bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                    <label class="text-xs font-bold text-blue-800">Teile pro Stange (Zuschnitt)</label>
                    <div class="flex items-center gap-3">
                        <input type="range" id="teileProStange" min="1" max="20" value="2" oninput="calculate()" class="flex-1 accent-blue-600">
                        <span id="label-teile" class="font-black text-blue-600 text-xl w-8 text-center">2</span>
                    </div>
                    <p class="text-[10px] text-blue-500 italic mt-1">Wie viele Teile sollen an einem Sägestück hängen?</p>
                </div>
            </div>
        </div>

        <div class="bg-black rounded-3xl p-6 shadow-xl text-white relative overflow-hidden">
            <div class="relative z-10">
                <p class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-1">Säge-Zuschnittmaß</p>
                <div class="flex items-baseline gap-2">
                    <span class="text-6xl font-black mono tracking-tighter" id="res-saege">173</span>
                    <span class="text-xl font-bold text-slate-500 uppercase">mm</span>
                </div>
                <div class="mt-4 flex items-center gap-2">
                    <div id="badge-robot" class="px-2 py-1 rounded text-[8px] font-black uppercase tracking-widest bg-green-500 text-white">Robot Ready</div>
                    <div class="px-2 py-1 rounded text-[8px] font-black uppercase tracking-widest bg-white/10 text-slate-400">Limit: 1000mm</div>
                </div>
            </div>
            <i data-lucide="scissors" class="absolute -right-4 -bottom-4 w-32 h-32 text-white/5 rotate-12"></i>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">Butzen (Abfall)</p>
                <p class="text-2xl font-bold mono" id="res-rest">115 mm</p>
            </div>
            <div class="bg-white p-4 rounded-3xl shadow-sm border border-slate-100">
                <p class="text-[9px] font-black text-slate-400 uppercase mb-1">3m Ausbeute</p>
                <p class="text-2xl font-bold mono" id="res-gesamt">34 Stk</p>
            </div>
        </div>

    </main>

    <nav class="bg-white border-t border-slate-200 px-8 py-4 flex justify-around items-center safe-area-bottom">
        <button class="text-black flex flex-col items-center gap-1">
            <i data-lucide="calculator" class="w-6 h-6"></i>
            <span class="text-[8px] font-bold uppercase">Rechner</span>
        </button>
        <button class="text-slate-300 flex flex-col items-center gap-1">
            <i data-lucide="history" class="w-6 h-6"></i>
            <span class="text-[8px] font-bold uppercase">History</span>
        </button>
        <button class="text-slate-300 flex flex-col items-center gap-1">
            <i data-lucide="more-horizontal" class="w-6 h-6"></i>
            <span class="text-[8px] font-bold uppercase">Mehr</span>
        </button>
    </nav>

    <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden flex items-end z-[100]">
        <div class="bg-white w-full rounded-t-[40px] p-8 space-y-6 animate-slide-up">
            <div class="w-12 h-1 bg-slate-200 mx-auto rounded-full mb-2"></div>
            <h3 class="text-center font-black text-sm uppercase tracking-widest">Berechnungs-Logik</h3>
            <div class="space-y-4 text-xs font-medium text-slate-600">
                <div class="flex justify-between"><span>Durchlauf (Teil + 3mm)</span><span id="step-verlust" class="mono text-black">54mm</span></div>
                <div class="flex justify-between"><span>Zuschnitt (X Teile + Rest)</span><span id="step-rechnung" class="mono text-black">2x54 + 115</span></div>
                <div class="flex justify-between border-t pt-4 font-bold text-black"><span>Resultat</span><span id="step-result" class="mono">173mm</span></div>
            </div>
            <button onclick="toggleModal()" class="w-full bg-black text-white py-4 rounded-2xl font-bold text-sm">Schließen</button>
        </div>
    </div>

    <script>
        function toggleModal() { document.getElementById('modal').classList.toggle('hidden'); }

        function calculate() {
            const f = parseFloat(document.getElementById('fertigteil').value) || 0;
            const a = parseFloat(document.getElementById('ausspann').value) || 0;
            const teileProZuschnitt = parseInt(document.getElementById('teileProStange').value);
            
            document.getElementById('label-teile').innerText = teileProZuschnitt;

            const SCHNITT = 3, ZANGE = 50, TOL = 10, MAX_ROBOT = 1000, STANGE_3M = 3000;
            const durchlauf = f + SCHNITT;
            const butzen = ZANGE + a + TOL;

            // Formel: Wie lange muss die Säge sägen?
            let saegeMass = (teileProZuschnitt * durchlauf) + butzen;

            // Prüfung auf Robot-Limit
            const badge = document.getElementById('badge-robot');
            if (saegeMass > MAX_ROBOT) {
                badge.innerText = "Too Long for Robot";
                badge.className = "px-2 py-1 rounded text-[8px] font-black uppercase tracking-widest bg-red-500 text-white";
            } else {
                badge.innerText = "Robot Ready";
                badge.className = "px-2 py-1 rounded text-[8px] font-black uppercase tracking-widest bg-green-500 text-white";
            }

            // Ausbeute 3m
            const anzahlZuschnitte = Math.floor(STANGE_3M / saegeMass);
            const gesamtTeile = anzahlZuschnitte * teileProZuschnitt;

            // UI
            document.getElementById('res-saege').innerText = Math.round(saegeMass);
            document.getElementById('res-rest').innerText = butzen + " mm";
            document.getElementById('res-gesamt').innerText = gesamtTeile + " Stk";

            // Modal Trace
            document.getElementById('step-verlust').innerText = durchlauf + "mm";
            document.getElementById('step-rechnung').innerText = teileProZuschnitt + "x " + durchlauf + " + " + butzen;
            document.getElementById('step-result').innerText = Math.round(saegeMass) + "mm";
        }

        lucide.createIcons();
        calculate();
    </script>
</body>
</html>
