<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stangenrechner Pro | CNC Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-3xl shadow-2xl border border-slate-700 overflow-hidden">
        <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold text-white tracking-tight">Stangenrechner</h1>
                    <p class="text-blue-100 text-xs opacity-80">Premium Manufacturing Tool</p>
                </div>
                <i data-lucide="cpu" class="text-white opacity-20 w-12 h-12"></i>
            </div>
        </div>

        <div class="p-6 space-y-6">
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Fertigteillänge (mm)</label>
                    <div class="relative">
                        <input type="number" id="fertigteil" value="51" oninput="calculate()" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <i data-lucide="box" class="absolute right-4 top-3 text-slate-600 w-5 h-5"></i>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Ausspannlänge (mm)</label>
                    <div class="relative">
                        <input type="number" id="ausspann" value="55" oninput="calculate()" 
                            class="w-full bg-slate-900 border border-slate-700 rounded-xl py-3 px-4 text-white focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <i data-lucide="tally-5" class="absolute right-4 top-3 text-slate-600 w-5 h-5"></i>
                    </div>
                </div>
            </div>

            <div class="bg-slate-900/50 rounded-2xl p-5 border border-blue-500/30">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-sm text-slate-400">Optimale Länge</span>
                    <span class="bg-blue-500/10 text-blue-400 text-[10px] font-bold px-2 py-1 rounded uppercase">Robot Safe</span>
                </div>
                <div class="text-4xl font-black text-white" id="res-optimiert">979 mm</div>
                <div class="mt-4 pt-4 border-t border-slate-700 grid grid-cols-2 gap-4">
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Teile / Durchlauf</p>
                        <p class="text-lg font-semibold text-slate-200" id="res-teile">16 Stk.</p>
                    </div>
                    <div>
                        <p class="text-[10px] text-slate-500 uppercase font-bold">Reststück (Butzen)</p>
                        <p class="text-lg font-semibold text-slate-200" id="res-rest">115 mm</p>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 text-[10px] text-slate-500 bg-slate-900 p-3 rounded-lg">
                <i data-lucide="info" class="w-3 h-3 text-blue-500"></i>
                <span>Berechnung basiert auf 3mm Schnitt & 920mm Arbeitsraum.</span>
            </div>
        </div>
    </div>

    <script>
        function calculate() {
            const fertigteil = parseFloat(document.getElementById('fertigteil').value) || 0;
            const ausspann = parseFloat(document.getElementById('ausspann').value) || 0;
            
            const SCHNITT = 3;
            const MAX_RAUM = 920;
            const ZANGE = 50;
            const TOLERANZ = 10;

            const verlust = fertigteil + SCHNITT;
            const anzahl = Math.floor(MAX_RAUM / verlust);
            
            let rohmasse = (anzahl * verlust) + ZANGE + ausspann + TOLERANZ;
            let finaleTeile = anzahl;

            if (rohmasse > 1000) {
                rohmasse -= verlust;
                finaleTeile -= 1;
            }

            document.getElementById('res-optimiert').innerText = Math.round(rohmasse) + ' mm';
            document.getElementById('res-teile').innerText = finaleTeile + ' Stk.';
            document.getElementById('res-rest').innerText = (ZANGE + ausspann + TOLERANZ) + ' mm';
        }

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
