<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Nakamura CNC"/>
  <title>Nakamura WT-250 II</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233B82F6'/><text y='22' x='5' font-size='18' font-weight='bold' fill='white' font-family='monospace'>N</text></svg>"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#080A10;overflow:hidden;}
    #root{height:100%;}
    #loading{position:fixed;inset:0;background:#080A10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;}
    .ll{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;font-weight:700;color:#fff;animation:pulse 1.5s ease-in-out infinite;}
    .lt{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#3A4060;}
    .lb{width:160px;height:2px;background:#1E2333;border-radius:1px;overflow:hidden;}
    .lf{height:100%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);animation:fill 2s ease-in-out forwards;}
    @keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.4);}50%{box-shadow:0 0 40px rgba(59,130,246,.8);}}
    @keyframes fill{from{width:0%;}to{width:100%;}}
    #err{display:none;position:fixed;inset:0;background:#080A10;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;z-index:9999;}
    #err h2{color:#EF4444;font-family:monospace;font-size:13px;letter-spacing:2px;}
    #err pre{color:#7A82A0;font-size:10px;max-width:100%;overflow:auto;background:#0F1118;padding:12px;border-radius:8px;border:1px solid #1E2333;white-space:pre-wrap;word-break:break-all;max-height:300px;}
    #err button{padding:10px 24px;background:#3B82F6;border:none;color:#fff;border-radius:8px;cursor:pointer;font-family:monospace;font-size:12px;}
  </style>
</head>
<body>
  <div id="loading">
    <div class="ll">N</div>
    <div class="lt">Nakamura WT-250 II</div>
    <div class="lb"><div class="lf"></div></div>
    <div class="lt" style="font-size:8px;margin-top:-10px;color:#2A3050">LOADING CNC SIMULATOR...</div>
  </div>
  <div id="err">
    <div class="ll" style="background:linear-gradient(135deg,#B91C1C,#EF4444);animation:none">!</div>
    <h2>ERROR LOADING APP</h2>
    <pre id="errmsg"></pre>
    <button onclick="location.reload()">RELOAD</button>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    function showError(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('err').style.display = 'flex';
      document.getElementById('errmsg').textContent = msg;
    }

    fetch('nakamura-v6.jsx')
      .then(function(r) {
        if (!r.ok) throw new Error('HTTP ' + r.status + ': cannot load nakamura-v6.jsx');
        return r.text();
      })
      .then(function(code) {
        // Remove ALL import lines (lines starting with "import")
        var lines = code.split('\n');
        var filtered = lines.filter(function(line) {
          var t = line.trim();
          return !t.startsWith('import ') && !t.startsWith('import{');
        });
        // Remove export default
        code = filtered.join('\n')
          .replace(/export\s+default\s+function\s+App/g, 'function App');

        // Transform JSX with Babel
        var result = Babel.transform(code, {
          presets: [['react', {runtime: 'classic'}]],
          filename: 'app.jsx'
        }).code;

        // Run in a scope where React hooks are available
        var fn = new Function(
          'React','useState','useRef','useEffect','useCallback','useMemo','ReactDOM',
          result + '\nreturn App;'
        );

        var App = fn(
          React,
          React.useState,
          React.useRef,
          React.useEffect,
          React.useCallback,
          React.useMemo,
          ReactDOM
        );

        ReactDOM.createRoot(document.getElementById('root')).render(
          React.createElement(App)
        );
        document.getElementById('loading').style.display = 'none';
      })
      .catch(function(err) {
        console.error(err);
        showError(err.message || String(err));
      });
  </script>
</body>
</html>
