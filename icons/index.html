<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Nakamura CNC"/>
  <title>Nakamura WT-250 II</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233B82F6'/><text y='22' x='5' font-size='18' font-weight='bold' fill='white' font-family='monospace'>N</text></svg>"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;background:#080A10;overflow:hidden;}
    #root{height:100%;}
    #loading{position:fixed;inset:0;background:#080A10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:9999;}
    .ll{width:56px;height:56px;border-radius:12px;background:linear-gradient(135deg,#3B82F6,#6366F1);display:flex;align-items:center;justify-content:center;font-family:monospace;font-size:24px;font-weight:700;color:#fff;box-shadow:0 0 30px rgba(59,130,246,.5);animation:pulse 1.5s ease-in-out infinite;}
    .lt{font-family:'Courier New',monospace;font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#3A4060;}
    .lb{width:160px;height:2px;background:#1E2333;border-radius:1px;overflow:hidden;}
    .lf{height:100%;width:0%;background:linear-gradient(90deg,#3B82F6,#8B5CF6);animation:fill 2s ease-in-out forwards;}
    @keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(59,130,246,.4);}50%{box-shadow:0 0 40px rgba(59,130,246,.8);}}
    @keyframes fill{0%{width:0%;}70%{width:85%;}100%{width:100%;}}
    #err{display:none;position:fixed;inset:0;background:#080A10;align-items:center;justify-content:center;flex-direction:column;gap:16px;padding:24px;z-index:9999;}
    #err h2{color:#EF4444;font-family:monospace;font-size:13px;letter-spacing:2px;text-transform:uppercase;}
    #err pre{color:#7A82A0;font-size:10px;max-width:100%;overflow:auto;background:#0F1118;padding:12px;border-radius:8px;border:1px solid #1E2333;white-space:pre-wrap;word-break:break-all;}
    #err button{padding:10px 24px;background:#3B82F6;border:none;color:#fff;border-radius:8px;cursor:pointer;font-family:monospace;font-size:12px;letter-spacing:1px;}
  </style>
</head>
<body>
  <div id="loading">
    <div class="ll">N</div>
    <div class="lt">Nakamura WT-250 II</div>
    <div class="lb"><div class="lf"></div></div>
    <div class="lt" style="font-size:8px;margin-top:-10px;color:#2A3050">LOADING CNC SIMULATOR...</div>
  </div>
  <div id="err">
    <div class="ll" style="background:linear-gradient(135deg,#B91C1C,#EF4444)">!</div>
    <h2>ERROR LOADING APP</h2>
    <pre id="errmsg"></pre>
    <button onclick="location.reload()">RELOAD</button>
  </div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    fetch('nakamura-v6.jsx')
      .then(r => {
        if (!r.ok) throw new Error('HTTP ' + r.status + ': cannot load nakamura-v6.jsx');
        return r.text();
      })
      .then(code => {
        // Strip ES module import/export statements - we use UMD globals instead
        code = code
          .replace(/^import\s+React\s*,?\s*\{[^}]*\}\s+from\s+['"]react['"];?\s*/m, '')
          .replace(/^import\s+\{[^}]*\}\s+from\s+['"]react['"];?\s*/m, '')
          .replace(/^import\s+React\s+from\s+['"]react['"];?\s*/m, '')
          .replace(/^export\s+default\s+function\s+/m, 'function ')
          .replace(/^export\s+default\s+/m, 'var __AppExport = ');

        // Inject React hooks from global React
        const header = `
var useState = React.useState;
var useRef = React.useRef;
var useEffect = React.useEffect;
var useCallback = React.useCallback;
var useMemo = React.useMemo;
`;
        code = header + code;

        // Transform JSX
        const result = Babel.transform(code, {
          presets: [['react', { runtime: 'classic' }]],
          filename: 'app.jsx'
        }).code;

        // Execute and mount
        const fn = new Function('React', 'ReactDOM', result + '\nreturn App;');
        const App = fn(React, ReactDOM);
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(React.createElement(App));
        document.getElementById('loading').style.display = 'none';
      })
      .catch(err => {
        console.error(err);
        document.getElementById('loading').style.display = 'none';
        document.getElementById('err').style.display = 'flex';
        document.getElementById('errmsg').textContent = err.message || String(err);
      });
  </script>
</body>
</html>
