<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Writer Assistant</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-2xl shadow-xl p-6 space-y-4">
    <h1 class="text-xl font-bold text-slate-800 text-center">AI Коммуникатор</h1>
    
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Стиль</label>
        <select id="type" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="github">GitHub PR/Issue</option>
          <option value="email">Официальное письмо</option>
          <option value="whatsapp">WhatsApp / Telegram</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-600 mb-1">Язык ответа</label>
        <select id="targetLang" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none">
          <option value="English">English</option>
          <option value="Russian">Русский</option>
          <option value="Spanish">Español</option>
        </select>
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Контекст или входящий текст</label>
      <textarea id="text" rows="4" class="w-full bg-slate-50 border border-slate-300 text-slate-800 text-sm rounded-lg p-2.5 focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Вставьте текст или опишите кратко задачу..."></textarea>
    </div>

    <button onclick="generateResponse()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-lg text-sm px-5 py-2.5 transition-colors">
      Сгенерировать
    </button>

    <div>
      <label class="block text-xs font-semibold text-slate-600 mb-1">Результат</label>
      <div id="output" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-3 text-sm text-slate-700 min-h-[100px] whitespace-pre-wrap">Готовый ответ появится здесь...</div>
    </div>
  </div>

  <script>
    // Вставьте URL вашего Cloudflare Worker
    const WORKER_URL = "https://your-worker.your-subdomain.workers.dev";

    async function generateResponse() {
      const output = document.getElementById('output');
      output.innerText = "Генерация...";

      const payload = {
        type: document.getElementById('type').value,
        targetLang: document.getElementById('targetLang').value,
        text: document.getElementById('text').value
      };

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        output.innerText = data.result || data.error;
      } catch (err) {
        output.innerText = "Ошибка: " + err.message;
      }
    }
  </script>
</body>
</html>
