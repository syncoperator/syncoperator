<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Light Premium PDF Template</title>
  <style>
    @page {
      size: A4;
      margin: 15mm;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #111;
      background: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    
    /* Центрированный заголовок с жирной чертой */
    .header {
      text-align: center;
      padding-bottom: 16px;
      border-bottom: 4px solid #000; /* Жирная линия */
    }
    .header h1 {
      margin: 0;
      font-size: 26px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    
    /* Разделитель */
    .bold-divider {
      border-top: 3px solid #000;
      margin: 24px 0;
    }

    /* Список инструментов с заложенным нижним отступом */
    .tools-list {
      list-style: none;
      padding: 0;
      margin: 0;
      padding-bottom: 48px; /* Защита от накладывания элементов внизу */
    }
    .tool-item {
      padding: 12px 18px;
      margin-bottom: 10px;
      background: #f8f9fa;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #000; /* Акцентная жирная линия слева */
      border-radius: 4px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="header">
      <h1>Light Premium Document</h1>
    </header>

    <div class="bold-divider"></div>

    <main>
      <h3>Список инструментов:</h3>
      <ul class="tools-list">
        <li class="tool-item">
          <span><strong>Инструмент 1:</strong> Генерация макета</span>
          <span>ОК</span>
        </li>
        <li class="tool-item">
          <span><strong>Инструмент 2:</strong> Оптимизация ui.js</span>
          <span>ОК</span>
        </li>
      </ul>
    </main>
  </div>

</body>
</html>
