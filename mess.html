<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-Pro | Smart Engineering</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #007AFF;
            --accent: #5856D6;
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --success: #34C759;
            --danger: #FF3B30;
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
        }

        /* App Shell & Design */
        .app-container { max-width: 600px; margin: 0 auto; padding: 25px; min-height: 100vh; }
        .glass-header { 
            background: var(--glass); backdrop-filter: blur(15px); 
            padding: 20px; border-radius: 20px; position: sticky; top: 10px; 
            z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.05);
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;
        }

        .title-group h1 { font-size: 22px; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .title-group p { font-size: 12px; color: var(--primary); margin: 0; text-transform: uppercase; font-weight: 600; }

        /* Karten Design */
        .card { 
            background: var(--card); border-radius: 20px; padding: 20px; 
            margin-bottom: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s ease;
        }
        .project-item { display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 6px solid var(--primary); }
        .project-item:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,0,0,0.08); }

        /* Smart Form */
        .form-group { display: flex; flex-direction: column; gap: 10px; }
        input, textarea { 
            border: none; background: #E9E9EB; padding: 16px; border-radius: 12px; 
            font-size: 16px; font-family: inherit; outline: none; transition: 0.2s;
        }
        input:focus { background: #E2E2E7; box-shadow: inset 0 0 0 2px var(--primary); }

        .btn { 
            padding: 16px; border-radius: 14px; border: none; font-weight: 700; 
            font-size: 16px; cursor: pointer; transition: 0.2s; 
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-ghost { background: transparent; color: var(--primary); }

        /* Messwerte Liste */
        .measure-row { 
            display: grid; grid-template-columns: 1fr auto; gap: 10px; 
            background: #F8F9FA; padding: 15px; border-radius: 14px; margin-top: 10px;
        }
        .tol-badge { font-family: monospace; font-size: 12px; color: #666; background: #EEE; padding: 4px 8px; border-radius: 6px; }

        /* Modal Preview */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); 
            z-index: 1000; padding: 10px; overflow-y: auto;
        }
        .modal-content { 
            background: white; border-radius: 20px; max-width: 800px; margin: 20px auto; 
            padding: 20px; position: relative;
        }

        /* PDF Layout (Bunt & Elegant) */
        #pdf-render-area { padding: 40px; color: #1a1a1a; display: none; }
        .pdf-header { 
            background: linear-gradient(135deg, #00416A 0%, #E4E5E6 100%);
            padding: 30px; border-radius: 10px; color: white; margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        .pdf-table th { background: #00416A; color: white; padding: 12px; text-align: left; }
        .pdf-table td { padding: 12px; border-bottom: 1px solid #eee; }
        .pdf-table tr:nth-child(even) { background: #f9f9f9; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container" id="dash">
    <div class="glass-header">
        <div class="title-group">
            <p>Quality Assurance</p>
            <h1>Engineering Hub</h1>
        </div>
        <button class="btn-ghost" onclick="toggleModal('projModal', true)">+ Neu</button>
    </div>
    <div id="project-list"></div>
</div>

<div class="app-container hidden" id="details">
    <div class="glass-header">
        <button class="btn-ghost" onclick="goBack()">←</button>
        <div class="title-group" style="text-align: center;">
            <p id="sub-zn">ZN: -</p>
            <h1 id="main-title">Projekt</h1>
        </div>
        <button class="btn-ghost" onclick="openPreview()" style="color:var(--success)">PDF</button>
    </div>
    <div class="card">
        <div class="form-group">
            <input type="text" id="m-dim" placeholder="Maß (z.B. 29 -0.1 oder 38 +0.05)">
            <input type="text" id="m-val" placeholder="Ist-Wert / Kommentar">
            <button class="btn btn-primary" onclick="addMeasurement()">Messpunkt Speichern</button>
        </div>
    </div>
    <div id="measurement-list"></div>
</div>

<div id="projModal" class="modal">
    <div class="modal-content">
        <h2>Neue Zeichnung</h2>
        <div class="form-group">
            <input type="text" id="p-title" placeholder="Bezeichnung">
            <input type="text" id="p-zn" placeholder="Zeichnungs-Nr.">
            <button class="btn btn-primary" onclick="createProject()">Projekt anlegen</button>
            <button class="btn btn-ghost" onclick="toggleModal('projModal', false)">Abbrechen</button>
        </div>
    </div>
</div>

<div id="previewModal" class="modal">
    <div class="modal-content">
        <div style="display:flex; justify-content: space-between; margin-bottom: 15px;">
            <button class="btn btn-ghost" onclick="toggleModal('previewModal', false)">Schließen</button>
            <button class="btn btn-primary" onclick="finalDownload()">Jetzt Herunterladen</button>
        </div>
        <div id="pdf-preview-box" style="border: 1px solid #ddd; zoom: 0.6;">
            </div>
    </div>
</div>

<div id="pdf-render-area">
    <div class="pdf-header">
        <div>
            <h1 style="margin:0; font-size: 28px;">PRÜFPROTOKOLL</h1>
            <p id="pdf-info" style="margin:5px 0 0 0; opacity: 0.8;"></p>
        </div>
        <div style="text-align: right;">
            <div style="font-size: 20px; font-weight: 800;">QS-DONE</div>
            <div id="pdf-date" style="font-size: 12px;"></div>
        </div>
    </div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>Merkmal (Soll)</th>
                <th>Toleranz (Min/Max)</th>
                <th>Ist-Wert / Ergebnis</th>
            </tr>
        </thead>
        <tbody id="pdf-table-body"></tbody>
    </table>
</div>

<script>
    let projects = JSON.parse(localStorage.getItem('qs_v3_data')) || [];
    let activeIdx = null;

    function save() { localStorage.setItem('qs_v3_data', JSON.stringify(projects)); }
    function toggleModal(id, show) { document.getElementById(id).style.display = show ? 'block' : 'none'; }

    // Smart Toleranz Rechner
    function calcTol(input) {
        let nenn = parseFloat(input);
        let tolMatch = input.match(/([+-]\d*\.?\d+)/);
        let tol = tolMatch ? parseFloat(tolMatch[0]) : 0;
        
        let min = nenn, max = nenn;
        if (tol < 0) min = nenn + tol;
        if (tol > 0) max = nenn + tol;
        
        return { nenn, min: min.toFixed(2), max: max.toFixed(2) };
    }

    function createProject() {
        let t = document.getElementById('p-title').value;
        let z = document.getElementById('p-zn').value;
        if(!t) return;
        projects.push({ title: t, zn: z, data: [] });
        save();
        toggleModal('projModal', false);
        renderDash();
    }

    function renderDash() {
        const list = document.getElementById('project-list');
        list.innerHTML = "";
        projects.forEach((p, i) => {
            list.innerHTML += `
                <div class="card project-item" onclick="openProject(${i})">
                    <div>
                        <div style="font-weight:800; font-size:18px;">${p.title}</div>
                        <div style="color:var(--primary); font-size:12px; font-weight:700;">ZN: ${p.zn}</div>
                    </div>
                    <div style="font-size:20px; color:#DDD;">❯</div>
                </div>`;
        });
    }

    function openProject(i) {
        activeIdx = i;
        document.getElementById('dash').classList.add('hidden');
        document.getElementById('details').classList.remove('hidden');
        document.getElementById('main-title').innerText = projects[i].title;
        document.getElementById('sub-zn').innerText = "ZN: " + projects[i].zn;
        renderMeasures();
    }

    function goBack() {
        document.getElementById('dash').classList.remove('hidden');
        document.getElementById('details').classList.add('hidden');
        renderDash();
    }

    function addMeasurement() {
        let dimInput = document.getElementById('m-dim').value;
        let val = document.getElementById('m-val').value;
        if(!dimInput) return;

        let t = calcTol(dimInput);
        projects[activeIdx].data.push({ dim: dimInput, min: t.min, max: t.max, ist: val });
        save();
        renderMeasures();
        document.getElementById('m-dim').value = '';
        document.getElementById('m-val').value = '';
    }

    function renderMeasures() {
        const list = document.getElementById('measurement-list');
        list.innerHTML = "";
        projects[activeIdx].data.forEach((m, i) => {
            list.innerHTML += `
                <div class="measure-row">
                    <div>
                        <div style="font-weight:700;">${m.dim}</div>
                        <span class="tol-badge">Min: ${m.min} / Max: ${m.max}</span>
                        <div style="margin-top:5px; font-size:14px; color:var(--primary);">${m.ist || 'Kein Wert'}</div>
                    </div>
                    <button onclick="delMeasure(${i})" style="border:none; background:none; color:var(--danger);">✕</button>
                </div>`;
        });
    }

    function delMeasure(i) {
        projects[activeIdx].data.splice(i, 1);
        save();
        renderMeasures();
    }

    // PDF PREVIEW & EXPORT
    function openPreview() {
        const p = projects[activeIdx];
        document.getElementById('pdf-info').innerText = `${p.title} | Zeichnungs-Nr: ${p.zn}`;
        document.getElementById('pdf-date').innerText = new Date().toLocaleDateString();
        
        const tbody = document.getElementById('pdf-table-body');
        tbody.innerHTML = "";
        p.data.forEach(m => {
            tbody.innerHTML += `
                <tr>
                    <td style="font-weight:700;">${m.dim}</td>
                    <td>Min: ${m.min} | Max: ${m.max}</td>
                    <td style="color:var(--primary); font-weight:700;">${m.ist}</td>
                </tr>`;
        });

        // HTML in das Preview Fenster kopieren
        const clone = document.getElementById('pdf-render-area').cloneNode(true);
        clone.style.display = 'block';
        document.getElementById('pdf-preview-box').innerHTML = "";
        document.getElementById('pdf-preview-box').appendChild(clone);
        
        toggleModal('previewModal', true);
    }

    function finalDownload() {
        const element = document.getElementById('pdf-render-area');
        element.style.display = 'block';
        const opt = {
            margin: 10, filename: `QS_Bericht_${projects[activeIdx].zn}.pdf`,
            html2canvas: { scale: 2 }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save().then(() => {
            element.style.display = 'none';
            toggleModal('previewModal', false);
        });
    }

    renderDash();
</script>
</body>
</html>
