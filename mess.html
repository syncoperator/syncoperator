<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Engineering QS Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --primary: #007AFF;
            --bg: #F0F2F5;
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-sub: #86868b;
            --success: #34C759;
            --danger: #FF3B30;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text-main); margin: 0; padding: 0;
            line-height: 1.5;
        }

        .app-wrapper { max-width: 500px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }

        /* Header Area */
        .glass-header {
            background: var(--card-bg); backdrop-filter: blur(20px);
            padding: 25px; border-radius: var(--radius-lg);
            box-shadow: var(--shadow); margin-bottom: 30px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid rgba(255,255,255,0.5);
        }
        .glass-header h1 { font-size: 24px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        .glass-header span { font-size: 12px; color: var(--primary); text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }

        /* List Cards */
        .card {
            background: var(--card-bg); border-radius: var(--radius-md);
            padding: 20px; margin-bottom: 15px; box-shadow: var(--shadow);
            border: 1px solid rgba(255,255,255,0.4); transition: 0.3s ease;
            position: relative; overflow: hidden;
        }
        .card:active { transform: scale(0.98); }
        .project-card { border-left: 8px solid var(--primary); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }

        /* Measurement Items */
        .m-item { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 15px; }
        .check-btn { 
            width: 24px; height: 24px; border-radius: 50%; border: 2px solid #ddd; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .check-btn.active { background: var(--success); border-color: var(--success); color: white; }
        .m-info b { font-size: 17px; display: block; }
        .m-info small { color: var(--text-sub); font-family: 'Courier New', Courier, monospace; }

        /* Actions & Inputs */
        .btn-fab { 
            position: fixed; bottom: 30px; right: 20px; width: 65px; height: 65px;
            background: var(--primary); border-radius: 50%; color: white; font-size: 30px;
            border: none; box-shadow: 0 10px 25px rgba(0,122,255,0.4); cursor: pointer;
            display: flex; align-items: center; justify-content: center; z-index: 100;
        }

        .btn-action {
            background: var(--primary); color: white; border: none; padding: 16px;
            border-radius: var(--radius-md); font-weight: 700; width: 100%; margin-top: 10px;
        }

        /* Bottom Sheet Modal */
        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            z-index: 1000; animation: fadeIn 0.3s;
        }
        .modal-content {
            position: absolute; bottom: 0; left: 0; right: 0;
            background: white; border-radius: 30px 30px 0 0;
            padding: 30px; box-shadow: 0 -10px 40px rgba(0,0,0,0.1);
            animation: slideUp 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* PDF Styles - Modern & Bunt */
        #pdf-export-area { padding: 40px; color: #333; display: none; background: #fff; }
        .pdf-header-box { 
            background: #00416A; padding: 25px; color: white; border-radius: 8px; 
            margin-bottom: 30px; display: flex; justify-content: space-between;
        }
        .pdf-table { width: 100%; border-collapse: collapse; }
        .pdf-table th { background: #f2f2f7; padding: 12px; text-align: left; border-bottom: 2px solid #00416A; }
        .pdf-table td { padding: 12px; border-bottom: 1px solid #eee; }

        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .hidden { display: none; }
    </style>
</head>
<body>

<div id="dashboard" class="app-wrapper">
    <div class="glass-header">
        <div><span>Quality Management</span><h1>Engineering</h1></div>
        <button onclick="openModal('projModal')" style="border:none; background:var(--bg); border-radius:50%; width:40px; height:40px; color:var(--primary); font-weight:bold;">+</button>
    </div>
    <div id="project-list"></div>
</div>

<div id="detail-view" class="app-wrapper hidden">
    <div class="glass-header">
        <button onclick="closeDetails()" style="border:none; background:none; font-size:20px;">←</button>
        <div style="text-align:center;"><span id="zn-label">ZN: -</span><h1 id="title-label">Projekt</h1></div>
        <button onclick="openPreview()" style="border:none; background:none; color:var(--primary); font-weight:bold;">PDF</button>
    </div>
    <div id="measure-list"></div>
    <button class="btn-fab" onclick="openModal('measureModal')">+</button>
</div>

<div id="projModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0">Neues Projekt</h2>
        <input type="text" id="p-title" placeholder="Bezeichnung (z.B. Nippel)" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:10px; font-size:16px;">
        <input type="text" id="p-zn" placeholder="Zeichnungsnummer" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; font-size:16px;">
        <button class="btn-action" onclick="addProject()">Projekt anlegen</button>
        <button onclick="closeModal('projModal')" style="width:100%; background:none; border:none; color:var(--danger); padding:15px;">Abbrechen</button>
    </div>
</div>

<div id="measureModal" class="modal">
    <div class="modal-content">
        <h2 style="margin-top:0">Maß hinzufügen</h2>
        <input type="text" id="m-dim" placeholder="Soll (z.B. 29 -0.1)" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:10px; font-size:16px;">
        <input type="text" id="m-ist" placeholder="Ist-Wert / Ergebnis" style="width:100%; padding:15px; border-radius:12px; border:1px solid #ddd; margin-bottom:20px; font-size:16px;">
        <button class="btn-action" onclick="saveMeasure()">Maß speichern</button>
        <button onclick="closeModal('measureModal')" style="width:100%; background:none; border:none; color:var(--danger); padding:15px;">Abbrechen</button>
    </div>
</div>

<div id="previewModal" class="modal">
    <div class="modal-content" style="height: 80vh; overflow-y: auto;">
        <div style="display:flex; justify-content:space-between; margin-bottom:20px;">
            <button onclick="closeModal('previewModal')" style="border:none; background:none; color:var(--danger);">Schließen</button>
            <button onclick="generatePDF()" class="btn-action" style="width:auto; margin:0; padding:10px 20px;">Download PDF</button>
        </div>
        <div id="pdf-view-box" style="zoom:0.5; border:1px solid #eee; box-shadow:0 0 20px rgba(0,0,0,0.1);"></div>
    </div>
</div>

<div id="pdf-export-area">
    <div class="pdf-header-box">
        <div>
            <h1 style="margin:0">MESS-PROTOKOLL</h1>
            <p id="pdf-zn" style="margin:5px 0 0 0; opacity:0.8"></p>
        </div>
        <div style="text-align:right">
            <h2 id="pdf-title" style="margin:0"></h2>
        </div>
    </div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th>Prüfmerkmal</th>
                <th>Soll-Bereich</th>
                <th>Messwert</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v4_data')) || [];
    let currentIdx = null;

    function save() { localStorage.setItem('qs_v4_data', JSON.stringify(db)); }
    function openModal(id) { document.getElementById(id).style.display = 'block'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Smart Toleranz Rechner (Soll + Toleranz)
    function getTol(str) {
        let nenn = parseFloat(str);
        let plus = 0, minus = 0;
        let matches = str.match(/([+-]\d*\.?\d+)/g);
        if (matches) {
            matches.forEach(m => {
                if (m.startsWith('+')) plus = parseFloat(m);
                if (m.startsWith('-')) minus = parseFloat(m);
            });
        }
        return { 
            min: (nenn + minus).toFixed(3), 
            max: (nenn + plus).toFixed(3) 
        };
    }

    function addProject() {
        let t = document.getElementById('p-title').value;
        let z = document.getElementById('p-zn').value;
        if(!t) return;
        db.push({ title: t, zn: z, measures: [] });
        save(); closeModal('projModal'); renderDash();
    }

    function renderDash() {
        const list = document.getElementById('project-list');
        list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="card project-card" onclick="showDetails(${i})">
                <div><b>${p.title}</b><br><small>ZN: ${p.zn}</small></div>
                <div style="color:var(--primary)">❯</div>
            </div>`;
        });
    }

    function showDetails(i) {
        currentIdx = i;
        document.getElementById('dashboard').classList.add('hidden');
        document.getElementById('detail-view').classList.remove('hidden');
        document.getElementById('title-label').innerText = db[i].title;
        document.getElementById('zn-label').innerText = "ZN: " + db[i].zn;
        renderMeasures();
    }

    function closeDetails() {
        document.getElementById('dashboard').classList.remove('hidden');
        document.getElementById('detail-view').classList.add('hidden');
    }

    function saveMeasure() {
        let dim = document.getElementById('m-dim').value;
        let ist = document.getElementById('m-ist').value;
        if(!dim) return;
        let t = getTol(dim);
        db[currentIdx].measures.push({ dim, ist, min: t.min, max: t.max, ok: false });
        save(); renderMeasures(); closeModal('measureModal');
    }

    function renderMeasures() {
        const list = document.getElementById('measure-list');
        list.innerHTML = "";
        db[currentIdx].measures.forEach((m, i) => {
            list.innerHTML += `
            <div class="card m-item">
                <div class="check-btn ${m.ok ? 'active' : ''}" onclick="toggleCheck(${i})">${m.ok ? '✓' : ''}</div>
                <div class="m-info">
                    <b>${m.dim}</b>
                    <small>Min: ${m.min} / Max: ${m.max}</small>
                    <div style="color:var(--primary); font-weight:bold; margin-top:4px;">${m.ist || '---'}</div>
                </div>
                <button onclick="delM(${i})" style="border:none; background:none; color:var(--danger)">✕</button>
            </div>`;
        });
    }

    function toggleCheck(i) {
        db[currentIdx].measures[i].ok = !db[currentIdx].measures[i].ok;
        save(); renderMeasures();
    }

    function delM(i) { db[currentIdx].measures.splice(i,1); save(); renderMeasures(); }

    function openPreview() {
        const p = db[currentIdx];
        document.getElementById('pdf-title').innerText = p.title;
        document.getElementById('pdf-zn').innerText = "Zeichnungsnummer: " + p.zn;
        const body = document.getElementById('pdf-body');
        body.innerHTML = "";
        p.measures.forEach(m => {
            body.innerHTML += `<tr>
                <td><b>${m.dim}</b></td>
                <td>${m.min} - ${m.max}</td>
                <td style="color:#007AFF">${m.ist}</td>
                <td>${m.ok ? '✅ OK' : '❌'}</td>
            </tr>`;
        });
        const area = document.getElementById('pdf-export-area');
        area.style.display = 'block';
        document.getElementById('pdf-view-box').innerHTML = area.outerHTML;
        area.style.display = 'none';
        openModal('previewModal');
    }

    function generatePDF() {
        const el = document.querySelector('#pdf-view-box div');
        const opt = { margin:10, filename: `QS_${db[currentIdx].zn}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'a4'} };
        html2pdf().set(opt).from(el).save();
    }

    renderDash();
</script>
</body>
</html>
