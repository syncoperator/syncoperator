<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator - Core</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="app-header">
        <h1>SyncOperator</h1>
        <div class="global-actions">
            <button id="exportBtn">Export JSON</button>
            <button id="importBtn">Import JSON</button>
            <input type="file" id="importInput" style="display:none" accept=".json">
        </div>
    </header>

    <main class="app-container">
        <section class="library-section">
            <h2>Operation Library</h2>
            <div class="filters">
                <select id="filterCategory">
                    <option value="">Alle Kategorien</option>
                    <option value="Außen">Außen</option>
                    <option value="Innen">Innen</option>
                    <option value="Radial">Radial</option>
                    <option value="Axial">Axial</option>
                </select>
                <select id="filterSpindle">
                    <option value="">Alle Spindeln</option>
                    <option value="SP3">SP3</option>
                    <option value="SP4">SP4</option>
                </select>
            </div>
            <div id="libraryList" class="op-list"></div>
            <button id="addNewOpBtn" class="primary-btn">+ Neue Operation</button>
        </section>

        <section class="plan-section">
            <h2>Programmplan</h2>
            <div class="channels-container">
                <div class="channel" data-channel="1">
                    <h3>Kanal 1 (1000.MPF)</h3>
                    <div id="slots-1" class="slot-list"></div>
                    <button class="add-slot-btn" data-channel="1">+ Slot hinzufügen</button>
                </div>
                <div class="channel" data-channel="2">
                    <h3>Kanal 2 (2000.MPF)</h3>
                    <div id="slots-2" class="slot-list"></div>
                    <button class="add-slot-btn" data-channel="2">+ Slot hinzufügen</button>
                </div>
            </div>
        </section>

        <section class="setup-section">
            <h2>Einrichteblatt</h2>
            <table id="setupTable">
                <thead>
                    <tr>
                        <th>Tool No</th>
                        <th>Kanal 1 (Oben)</th>
                        <th>Kanal 2 (Unten)</th>
                    </tr>
                </thead>
                <tbody id="setupBody"></tbody>
            </table>
        </section>
    </main>

    <div id="opModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Operation bearbeiten</h3>
            <form id="opForm">
                <input type="hidden" id="field-id">
                <label>Name: <input type="text" id="field-title" required></label>
                <label>Basis L-Code: <input type="text" id="field-code" required></label>
                <label>Spindel: 
                    <select id="field-spindle">
                        <option value="SP3">SP3</option>
                        <option value="SP4">SP4</option>
                    </select>
                </label>
                <label>Kategorie: 
                    <select id="field-category">
                        <option value="Außen">Außen</option>
                        <option value="Innen">Innen</option>
                        <option value="Radial">Radial</option>
                        <option value="Axial">Axial</option>
                    </select>
                </label>
                <label>Tool No (Txxxx): <input type="text" id="field-toolNo" required></label>
                <label>Tool Name: <input type="text" id="field-toolName"></label>
                <label>Doppelhalter: <input type="checkbox" id="field-doppelhalter"></label>
                <div class="modal-actions">
                    <button type="button" id="deleteOpBtn" class="danger-btn">Löschen</button>
                    <button type="button" id="closeModalBtn">Abbrechen</button>
                    <button type="submit" class="primary-btn">Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
