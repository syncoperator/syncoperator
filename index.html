<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator | Drag & Plan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; overflow: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .active-tab { border-bottom: 3px solid #000; color: #000; }
        .sortable-ghost { opacity: 0.3; background: #dbeafe !important; border: 2px dashed #3b82f6 !important; }
        .handle { cursor: grab; padding: 10px; }
        .handle:active { cursor: grabbing; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-black text-white px-5 py-4 flex justify-between items-center shadow-lg shrink-0">
        <h1 class="font-extrabold tracking-tighter text-lg italic uppercase">Sync<span class="text-slate-400">Op</span></h1>
        <div class="flex gap-2">
            <button onclick="addNewSlot()" class="p-2 bg-blue-600 rounded-xl flex items-center gap-1 px-3">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span class="text-[10px] font-black uppercase italic">Add Slot</span>
            </button>
        </div>
    </header>

    <div class="flex bg-white border-b border-slate-200 shrink-0">
        <button onclick="switchChannel('1')" id="tab-1" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest active-tab">Kanal 1</button>
        <button onclick="switchChannel('2')" id="tab-2" class="flex-1 py-4 text-[10px] font-black uppercase tracking-widest text-slate-400">Kanal 2</button>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-2 pb-10" id="slot-container">
        </main>

    <div id="op-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[100] p-4 flex items-center">
        <div class="bg-white w-full rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 class="font-black text-xs uppercase italic tracking-widest">Operation Setup</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <input type="text" id="in-title" placeholder="Bezeichnung" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold">
                <input type="text" id="in-tool-name" placeholder="Werkzeug Name" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold">
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="in-tool" placeholder="T-Nummer" class="p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold mono">
                    <select id="in-spindle" class="p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold uppercase">
                        <option value="SP3">SP 3</option>
                        <option value="SP4">SP 4</option>
                    </select>
                </div>
                <button onclick="saveOperation()" class="w-full py-5 bg-black text-white rounded-2xl font-black uppercase tracking-widest mt-2 active:scale-95 transition-transform">Save Data</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('sync_v4_state')) || {
            slots: { "1": Array(5).fill(null), "2": Array(5).fill(null) },
            currentChannel: "1"
        };

        let currentEditingIdx = null;
        let sortableInstance = null;

        function save() {
            localStorage.setItem('sync_v4_state', JSON.stringify(state));
            render();
        }

        function switchChannel(ch) {
            state.currentChannel = ch;
            document.getElementById('tab-1').classList.toggle('active-tab', ch === '1');
            document.getElementById('tab-1').classList.toggle('text-slate-400', ch !== '1');
            document.getElementById('tab-2').classList.toggle('active-tab', ch === '2');
            document.getElementById('tab-2').classList.toggle('text-slate-400', ch !== '2');
            render();
        }

        function render() {
            const container = document.getElementById('slot-container');
            const ch = state.currentChannel;
            const prefix = ch === "1" ? "L11" : "L21";

            container.innerHTML = state.slots[ch].map((op, idx) => `
                <div class="slot-item bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between" data-id="${idx}">
                    <div class="flex items-center gap-4 flex-1" onclick="openModal(${idx})">
                        <span class="mono text-[10px] font-bold text-slate-300 w-10">${prefix}${(idx+1).toString().padStart(2, '0')}</span>
                        <div class="h-8 w-[1px] bg-slate-100"></div>
                        <div class="flex-1">
                            <div class="text-[11px] font-black uppercase ${op ? 'text-black' : 'text-slate-200'}">
                                ${op ? op.title : 'Leerer Slot'}
                            </div>
                            ${op ? `<div class="text-[9px] font-bold text-blue-500 uppercase mono">${op.tool} | ${op.toolName}</div>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1">
                        ${op ? `<button onclick="deleteOp(${idx})" class="p-2 text-slate-200"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        <div class="handle text-slate-300"><i data-lucide="grip-vertical" class="w-5 h-5"></i></div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            const el = document.getElementById('slot-container');
            if (sortableInstance) sortableInstance.destroy();
            
            sortableInstance = Sortable.create(el, {
                handle: '.handle',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: (evt) => {
                    const ch = state.currentChannel;
                    const items = state.slots[ch];
                    const movedItem = items.splice(evt.oldIndex, 1)[0];
                    items.splice(evt.newIndex, 0, movedItem);
                    save();
                }
            });
        }

        function openModal(idx) {
            currentEditingIdx = idx;
            const op = state.slots[state.currentChannel][idx];
            document.getElementById('in-title').value = op ? op.title : "";
            document.getElementById('in-tool-name').value = op ? op.toolName : "";
            document.getElementById('in-tool').value = op ? op.tool : "";
            document.getElementById('in-spindle').value = op ? op.spindle : "SP3";
            document.getElementById('op-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); }

        function saveOperation() {
            const title = document.getElementById('in-title').value;
            if(!title) return;
            state.slots[state.currentChannel][currentEditingIdx] = {
                title,
                toolName: document.getElementById('in-tool-name').value,
                tool: document.getElementById('in-tool').value,
                spindle: document.getElementById('in-spindle').value
            };
            save();
            closeModal();
        }

        function deleteOp(idx) {
            state.slots[state.currentChannel][idx] = null;
            save();
        }

        function addNewSlot() {
            state.slots["1"].push(null);
            state.slots["2"].push(null);
            save();
        }

        render();
    </script>
</body>
</html>
