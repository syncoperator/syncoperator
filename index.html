<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>CITITOOL PRO 2026</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="glass-header">
        <div class="brand">CITITOOL <span>CORE</span></div>
        <div class="header-actions">
            <button onclick="App.exportPDF()" class="btn-icon">PDF</button>
            <button onclick="App.toggleView()" id="view-toggle" class="btn-primary">EINRICHTEBLATT</button>
        </div>
    </header>

    <nav class="kanal-selector">
        <button class="k-btn active" onclick="App.switchKanal(1)">KANAL 1</button>
        <button class="k-btn" onclick="App.switchKanal(2)">KANAL 2</button>
    </nav>

    <main id="app-viewport">
        <section id="config-view" class="view">
            <div class="section-label">Active Workbench</div>
            <div id="slot-list" class="slot-container"></div>
            
            <div class="section-label">Tool Library (Drag to Slot)</div>
            <div class="library-grid" id="tool-lib"></div>
        </section>

        <section id="report-view" class="view hidden">
            <div class="report-paper">
                <div class="report-header">
                    <h1>EINRICHTEBLATT</h1>
                    <p id="report-date"></p>
                </div>
                <table class="report-table">
                    <thead>
                        <tr>
                            <th>POS</th>
                            <th>WERKZEUG</th>
                            <th>GEOMETRIE</th>
                            <th>L-XXXX (MM)</th>
                            <th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="report-body"></tbody>
                </table>
            </div>
        </section>
    </main>

    <div class="dock">
        <button onclick="App.addSlot()" class="add-fab">+</button>
        <button onclick="App.save()" class="dock-item">SAVE</button>
        <button onclick="App.load()" class="dock-item">LOAD</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
