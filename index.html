<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOp X | Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Inter:wght@300;400;500;700;800&family=JetBrains+Mono:wght@600&display=swap');
        
        :root {
            --bg-main: #f3f4f7;
            --panel-bg: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
            --accent: #000000;
            --border-color: #d1d5db;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: #111; }
        
        /* Glassmorphism & Depth */
        .celos-card {
            background: var(--panel-bg);
            border: 1px solid #fff;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03), inset 0 0 20px rgba(255,255,255,0.5);
            border-radius: 12px;
            transition: transform 0.1s;
        }
        
        .celos-card:active { transform: scale(0.98); background: #eee; }

        .active-tab {
            background: #fff;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            border-top: 4px solid var(--accent);
            color: #000;
            font-weight: 800;
        }

        /* PDF Styles - Industrial Accuracy */
        .pdf-page { width: 297mm; background: white; padding: 0; color: #000; }
        .pdf-grid { display: flex; border: 2px solid #000; margin: 10mm; }
        .pdf-col { flex: 1; border-right: 2px solid #000; }
        .pdf-col:last-child { border-right: none; }
        .pdf-header-cell { background: #000; color: #fff; text-align: center; font-weight: 800; font-size: 12px; padding: 8px; text-transform: uppercase; }
        .pdf-sub-header { display: flex; border-bottom: 2px solid #000; background: #e5e7eb; font-size: 10px; font-weight: 700; text-align: center; }
        .pdf-row { display: flex; border-bottom: 1px solid #000; min-height: 30px; align-items: stretch; font-size: 10px; }
        .pdf-num { width: 35px; background: #ddd; border-right: 2px solid #000; display: flex; align-items: center; justify-content: center; font-weight: 900; }
        .pdf-cell { flex: 1; padding: 4px 10px; border-right: 1px solid #000; display: flex; flex-direction: column; justify-content: center; }
        .pdf-cell:last-child { border-right: none; }
        .pdf-op-name { font-weight: 800; text-transform: uppercase; }
        .pdf-op-sub { font-family: 'JetBrains Mono'; font-size: 8px; color: #444; margin-top: 2px; }

        .lib-btn {
            background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 10px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; transition: all 0.2s;
        }
        .lib-btn:hover { border-color: #000; background: #fafafa; }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <nav class="bg-white border-b border-gray-300 px-6 py-4 flex justify-between items-center shadow-sm z-10">
        <div class="flex items-center gap-4">
            <h1 class="text-2xl font-black italic tracking-tighter">SyncOp <span class="bg-black text-white px-2 py-0.5 rounded italic not-italic text-sm ml-1">X</span></h1>
        </div>
        <div class="flex gap-3">
            <button onclick="previewTools()" class="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 rounded-lg text-xs font-bold hover:bg-gray-50">
                <i data-lucide="wrench" class="w-4 h-4"></i> Werkzeugliste
            </button>
            <button onclick="previewPlan()" class="flex items-center gap-2 px-5 py-2 bg-black text-white rounded-lg text-xs font-bold shadow-lg active:scale-95 transition-all">
                <i data-lucide="printer" class="w-4 h-4"></i> Export Plan
            </button>
        </div>
    </nav>

    <div class="flex bg-gray-100 border-b border-gray-300">
        <button onclick="switchChannel('1')" id="tab-1" class="flex-1 py-4 text-xs font-black uppercase tracking-widest active-tab transition-all">Kanal 1</button>
        <button onclick="switchChannel('2')" id="tab-2" class="flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 transition-all">Kanal 2</button>
    </div>

    <main class="flex-1 overflow-y-auto p-5 space-y-3" id="scroll-area">
        <div id="slot-container" class="space-y-3 max-w-3xl mx-auto"></div>
        <div class="max-w-3xl mx-auto pt-4">
            <button onclick="addNewSlot()" class="w-full py-6 border-2 border-dashed border-gray-300 rounded-2xl text-gray-400 text-xs font-black uppercase tracking-widest hover:border-black hover:text-black transition-all">+ Add New Sequence Slot</button>
        </div>
    </main>

    <div id="op-modal" class="fixed inset-0 bg-black/40 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-3xl shadow-2xl overflow-hidden border border-white/20">
            <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
                <h3 class="font-black uppercase text-xs tracking-widest text-gray-500">Operation Config</h3>
                <button onclick="closeModal()"><i data-lucide="x" class="text-gray-400"></i></button>
            </div>
            <div class="p-8 space-y-6">
                <div class="grid grid-cols-3 gap-2" id="lib-grid"></div>
                <div class="space-y-4">
                    <div class="relative">
                        <label class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-gray-400">BEZEICHNUNG</label>
                        <input type="text" id="in-title" class="w-full border-2 border-gray-200 p-4 rounded-xl font-black text-lg focus:border-black outline-none transition-all">
                    </div>
                    <div class="relative">
                        <label class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-gray-400">WERKZEUG SPEZIFIKATION</label>
                        <input type="text" id="in-tool-name" class="w-full border-2 border-gray-200 p-4 rounded-xl font-bold text-gray-600 outline-none focus:border-black">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-gray-400">T-NR</label>
                            <input type="text" id="in-tool" class="w-full border-2 border-gray-200 p-4 rounded-xl font-black text-center text-xl mono">
                        </div>
                        <div class="relative">
                            <label class="absolute -top-2 left-3 bg-white px-1 text-[10px] font-bold text-gray-400">SPINDEL</label>
                            <select id="in-spindle" class="w-full border-2 border-gray-200 p-4 rounded-xl font-black appearance-none text-center">
                                <option value="SP4">SPINDEL 4</option>
                                <option value="SP3">SPINDEL 3</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button onclick="saveOp()" class="w-full py-5 bg-black text-white rounded-2xl font-black text-sm uppercase tracking-widest shadow-xl active:scale-95 transition-all">Sequence speichern</button>
            </div>
        </div>
    </div>

    <div style="position: absolute; left: -9999px;">
        <div id="pdf-root" class="pdf-page">
            <div id="pdf-header-info" style="padding: 10mm 10mm 0 10mm; display: flex; justify-content: space-between; align-items: flex-end;">
                <h1 style="font-family: 'Orbitron', sans-serif; font-size: 24px;">SyncOp X</h1>
                <div style="text-align: right; font-weight: 800; font-size: 10px;">PRODUCTION SEQUENCE / UNITARY PLAN</div>
            </div>
            <div class="pdf-grid" id="pdf-content"></div>
        </div>
    </div>

    <script>
        const library = [
            { id: 'scr', label: 'Schruppen', t: 'T1', n: 'CNMG 120408', sp: 'SP4' },
            { id: 'fin', label: 'Schlichten', t: 'T2', n: 'DCMT 070204', sp: 'SP4' },
            { id: 'dril', label: 'Bohren', t: 'T10', n: 'VHM D12.5', sp: 'SP3' },
            { id: 'tap', label: 'Gewinde', t: 'T15', n: 'M12 HSS-E', sp: 'SP3' },
            { id: 'cut', label: 'Abstechen', t: 'T20', n: 'Parting 3mm', sp: 'SP4' },
            { id: 'face', label: 'Planen', t: 'T1', n: 'CNMG 120408', sp: 'SP4' }
        ];

        let state = JSON.parse(localStorage.getItem('sync_v12_state')) || {
            slots: { "1": Array(6).fill(null), "2": Array(6).fill(null) },
            currentChannel: "1"
        };

        let currentIdx = null;

        function save() { localStorage.setItem('sync_v12_state', JSON.stringify(state)); render(); }

        function render() {
            const container = document.getElementById('slot-container');
            const ch = state.currentChannel;
            const prefix = ch === "1" ? "L11" : "L21";
            container.innerHTML = state.slots[ch].map((op, idx) => `
                <div class="celos-card p-5 flex items-center justify-between group" data-id="${idx}">
                    <div class="flex items-center gap-6 flex-1" onclick="openModal(${idx})">
                        <div class="w-12 h-12 bg-gray-100 rounded-lg flex items-center justify-center font-black text-[10px] text-gray-400 border border-gray-200">
                            ${(idx+1).toString().padStart(2, '0')}
                        </div>
                        <div class="flex-1">
                            <div class="text-xs font-bold text-gray-400 mono mb-1">${prefix}${(idx+1).toString().padStart(2, '0')}</div>
                            <div class="text-[15px] font-black uppercase tracking-tight ${op ? 'text-black' : 'text-gray-200'}">
                                ${op ? op.title : 'Sequence Leer'}
                            </div>
                            ${op ? `<div class="text-[10px] font-bold text-gray-500 mt-1 uppercase">${op.tool} — ${op.toolName} — <span class="text-black">${op.spindle}</span></div>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <button onclick="removeSlot(${idx})" class="p-2 text-gray-300 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                        <div class="handle p-2"><i data-lucide="grip-vertical" class="w-5 h-5 text-gray-300"></i></div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
            Sortable.create(container, { handle: '.handle', animation: 150, onEnd: (e) => {
                const items = state.slots[state.currentChannel];
                const moved = items.splice(e.oldIndex, 1)[0];
                items.splice(e.newIndex, 0, moved);
                save();
            }});
        }

        function openModal(idx) {
            currentIdx = idx;
            const op = state.slots[state.currentChannel][idx];
            document.getElementById('in-title').value = op ? op.title : "";
            document.getElementById('in-tool-name').value = op ? op.toolName : "";
            document.getElementById('in-tool').value = op ? op.tool : "";
            document.getElementById('in-spindle').value = op ? op.spindle : "SP4";
            
            document.getElementById('lib-grid').innerHTML = library.map(i => `
                <button onclick="loadLib('${i.id}')" class="lib-btn">${i.label}</button>
            `).join('');
            
            document.getElementById('op-modal').classList.remove('hidden');
        }

        function loadLib(id) {
            const i = library.find(x => x.id === id);
            document.getElementById('in-title').value = i.label;
            document.getElementById('in-tool-name').value = i.n;
            document.getElementById('in-tool').value = i.t;
            document.getElementById('in-spindle').value = i.sp;
        }

        function saveOp() {
            state.slots[state.currentChannel][currentIdx] = {
                title: document.getElementById('in-title').value,
                toolName: document.getElementById('in-tool-name').value,
                tool: document.getElementById('in-tool').value,
                spindle: document.getElementById('in-spindle').value
            };
            save(); closeModal();
        }

        function previewPlan() {
            const max = Math.max(state.slots["1"].length, state.slots["2"].length);
            const buildRows = (ch) => {
                let r = "";
                for(let i=0; i<max; i++) {
                    const op = state.slots[ch][i];
                    const l = (ch === "1" ? "L11" : "L21") + (i+1).toString().padStart(2,'0');
                    const spA = (ch === "1" ? "SP4" : "SP3"), spB = (ch === "1" ? "SP3" : "SP4");
                    const cell = (s) => (op && op.spindle === s) ? `<div class="pdf-op-name">${op.title}</div><div class="pdf-op-sub">${l} | ${op.tool}</div>` : "";
                    r += `<div class="pdf-row"><div class="pdf-num">${i+1}</div><div class="pdf-cell">${cell(spA)}</div><div class="pdf-cell">${cell(spB)}</div></div>`;
                }
                return r;
            };
            document.getElementById('pdf-content').innerHTML = `
                <div class="pdf-col">
                    <div class="pdf-header-cell">Kanal 1 - 1000.MPF</div>
                    <div class="pdf-sub-header"><div style="flex:1; border-right:1px solid #000; padding:4px">SPINDEL 4</div><div style="flex:1; padding:4px">SPINDEL 3</div></div>
                    ${buildRows("1")}
                </div>
                <div class="pdf-col">
                    <div class="pdf-header-cell">Kanal 2 - 2000.MPF</div>
                    <div class="pdf-sub-header"><div style="flex:1; border-right:1px solid #000; padding:4px">SPINDEL 3</div><div style="flex:1; padding:4px">SPINDEL 4</div></div>
                    ${buildRows("2")}
                </div>`;
            print();
        }

        function previewTools() {
            const tools = [];
            [1,2].forEach(ch => state.slots[ch].forEach(op => { if(op && op.tool) tools.push({...op, ch}) }));
            tools.sort((a,b) => a.tool.localeCompare(b.tool, undefined, {numeric: true}));
            
            let r = "";
            tools.forEach((t, i) => {
                r += `<div class="pdf-row">
                    <div class="pdf-num">${i+1}</div>
                    <div class="pdf-cell" style="flex:0.3; font-weight:900">${t.tool}</div>
                    <div class="pdf-cell" style="font-weight:700">${t.toolName} <small style="opacity:0.5">(${t.spindle})</small></div>
                    <div class="pdf-cell" style="flex:0.2; text-align:center">K${t.ch}</div>
                </div>`;
            });

            document.getElementById('pdf-content').innerHTML = `
                <div class="pdf-col">
                    <div class="pdf-header-cell">Einrichteblatt / Werkzeugliste</div>
                    <div class="pdf-sub-header"><div style="flex:0.3; border-right:1px solid #000; padding:4px">T-NR</div><div style="flex:1; border-right:1px solid #000; padding:4px">BESCHREIBUNG</div><div style="flex:0.2; padding:4px">KANAL</div></div>
                    ${r}
                </div>`;
            print();
        }

        function print() {
            html2pdf().from(document.getElementById('pdf-root')).set({
                margin: 0, filename: 'SyncOpX.pdf', jsPDF: { orientation: 'landscape', unit: 'mm', format: 'a4' }
            }).outputPdf('bloburl').then(url => window.open(url));
        }

        function switchChannel(ch) {
            state.currentChannel = ch;
            document.getElementById('tab-1').className = ch==='1' ? 'flex-1 py-4 text-xs font-black uppercase tracking-widest active-tab transition-all' : 'flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 transition-all';
            document.getElementById('tab-2').className = ch==='2' ? 'flex-1 py-4 text-xs font-black uppercase tracking-widest active-tab transition-all' : 'flex-1 py-4 text-xs font-black uppercase tracking-widest text-gray-400 transition-all';
            render();
        }

        function removeSlot(i) { state.slots[state.currentChannel].splice(i,1); save(); }
        function addNewSlot() { state.slots[state.currentChannel].push(null); save(); }
        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); }

        render();
    </script>
</body>
</html>
