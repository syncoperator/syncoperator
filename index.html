<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <header class="header">
        <div style="font-weight:900; font-size:20px;">SyncOp <span style="color:var(--dmg-blue)">X</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-dark" onclick="App.exportPDF('tools')">Werkzeugliste</button>
            <button class="btn btn-primary" onclick="App.exportPDF('plan')">Export Plan</button>
        </div>
    </header>

    <div style="display:flex; background:#ddd;">
        <button onclick="App.switchChannel('1')" style="flex:1; padding:12px; border:none; font-weight:bold; cursor:pointer;">Kanal 1</button>
        <button onclick="App.switchChannel('2')" style="flex:1; padding:12px; border:none; font-weight:bold; cursor:pointer;">Kanal 2</button>
    </div>

    <div id="ui-root" style="padding: 20px; max-width: 600px; margin: 0 auto;"></div>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h3 style="margin-top:0; font-size:12px; text-transform:uppercase;">Slot Setup</h3>
            <input type="text" id="in-title" placeholder="Bezeichnung" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc;">
            <input type="text" id="in-tool" placeholder="T-Nummer" style="width:100%; padding:10px; margin-bottom:10px; border:1px solid #ccc;">
            <select id="in-spindle" style="width:100%; padding:10px; margin-bottom:20px; border:1px solid #ccc;">
                <option value="SP4">Spindel 4</option>
                <option value="SP3">Spindel 3</option>
            </select>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-dark" style="flex:1" onclick="App.closeModal()">Abbrechen</button>
                <button class="btn btn-primary" style="flex:1" onclick="App.saveSlot()">Speichern</button>
            </div>
        </div>
    </div>

    <div id="pdf-buffer" style="position: absolute; left: -9999px;"></div>
    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
