<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator v8 | Print Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .active-tab { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        .handle { cursor: grab; touch-action: none; }
        
        /* Стили для PDF, имитирующие скриншот */
        .pdf-page { width: 297mm; padding: 10mm; background: white; font-family: sans-serif; }
        .pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ccc; padding-bottom: 10px; margin-bottom: 10px; }
        .table-container { display: flex; gap: 0; border: 1px solid #ccc; }
        .chan-col { flex: 1; border-right: 1px solid #ccc; }
        .chan-col:last-child { border-right: none; }
        .chan-title { background: #e5e7eb; text-align: center; font-weight: bold; font-size: 10px; padding: 4px; border-bottom: 1px solid #ccc; }
        .sp-header { display: flex; font-size: 9px; font-weight: bold; text-align: center; color: white; }
        .sp-4 { flex: 1; background: #4ade80; padding: 4px; border-right: 1px solid #ccc; }
        .sp-3 { flex: 1; background: #3b82f6; padding: 4px; }
        .row { display: flex; border-bottom: 1px solid #eee; min-height: 25px; font-size: 9px; align-items: center; }
        .row-num { width: 25px; text-align: center; border-right: 1px solid #ccc; background: #f9fafb; font-size: 8px; font-weight: bold; flex-shrink: 0; }
        .cell { flex: 1; padding: 2px 6px; border-right: 1px solid #eee; display: flex; align-items: center; }
        .cell:last-child { border-right: none; }
        .op-text { font-weight: 500; }
        .op-meta { color: #666; font-size: 7px; margin-left: auto; font-family: monospace; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-slate-900 text-white px-5 py-4 flex justify-between items-center shrink-0">
        <h1 class="font-black italic uppercase text-xl text-blue-400">SyncOp <span class="text-white text-[10px] not-italic opacity-50">V8.0</span></h1>
        <button onclick="previewPDF()" class="p-2 bg-blue-600 rounded-lg text-[10px] font-black uppercase flex items-center gap-2 px-4">
            <i data-lucide="printer" class="w-4 h-4"></i> PREVIEW & PRINT
        </button>
    </header>

    <div class="flex bg-white border-b shrink-0">
        <button onclick="switchChannel('1')" id="tab-1" class="flex-1 py-4 text-[10px] font-black uppercase active-tab">Kanal 1 (1000)</button>
        <button onclick="switchChannel('2')" id="tab-2" class="flex-1 py-4 text-[10px] font-black uppercase text-slate-400">Kanal 2 (2000)</button>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-2" id="slot-list-container">
        <div id="slot-container" class="space-y-2"></div>
        <button onclick="addNewSlot()" class="w-full py-4 border-2 border-dashed border-slate-300 rounded-xl text-slate-400 text-[10px] font-black uppercase mt-4">+ Neuer Slot</button>
    </main>

    <div style="position: absolute; left: -9999px; top: -9999px;">
        <div id="print-template" class="pdf-page">
            <div class="pdf-header">
                <span style="font-weight: 900; font-size: 14px;">SYNCOPERATOR PLAN</span>
                <span id="print-date" style="font-size: 10px;"></span>
            </div>
            <div class="table-container">
                <div class="chan-col">
                    <div class="chan-title">Kanal 1 - 1000.MPF</div>
                    <div class="sp-header">
                        <div class="sp-4" style="background: #4ade80;">Spindel 4</div>
                        <div class="sp-3" style="background: #3b82f6;">Spindel 3</div>
                    </div>
                    <div id="pdf-rows-k1"></div>
                </div>
                <div class="chan-col">
                    <div class="chan-title">Kanal 2 - 2000.MPF</div>
                    <div class="sp-header">
                        <div class="sp-3" style="background: #3b82f6;">Spindel 3</div>
                        <div class="sp-4" style="background: #4ade80;">Spindel 4</div>
                    </div>
                    <div id="pdf-rows-k2"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="op-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden z-[100] p-4 flex items-center justify-center">
        <div class="bg-white w-full max-w-lg rounded-[2rem] shadow-2xl overflow-hidden">
            <div class="p-5 border-b flex justify-between items-center bg-slate-50">
                <span class="text-[10px] font-black uppercase tracking-widest text-slate-400">Operation Details</span>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="p-8 space-y-4">
                <input type="text" id="in-title" placeholder="Bezeichnung" class="w-full p-4 bg-slate-100 rounded-xl font-bold outline-none border-2 border-transparent focus:border-blue-500">
                <div class="grid grid-cols-2 gap-3">
                    <input type="text" id="in-tool" placeholder="T-Nr" class="p-4 bg-slate-100 rounded-xl font-bold mono uppercase">
                    <select id="in-spindle" class="p-4 bg-slate-100 rounded-xl font-bold">
                        <option value="SP4">Spindel 4</option>
                        <option value="SP3">Spindel 3</option>
                    </select>
                </div>
                <button onclick="saveOperation()" class="w-full py-5 bg-black text-white rounded-2xl font-black uppercase tracking-widest shadow-xl">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        let state = JSON.parse(localStorage.getItem('sync_v8_state')) || {
            slots: { "1": Array(18).fill(null), "2": Array(18).fill(null) },
            currentChannel: "1"
        };

        let currentEditingIdx = null;

        function save() { localStorage.setItem('sync_v8_state', JSON.stringify(state)); render(); }

        function render() {
            const container = document.getElementById('slot-container');
            const ch = state.currentChannel;
            const prefix = ch === "1" ? "L11" : "L21";
            container.innerHTML = state.slots[ch].map((op, idx) => `
                <div class="bg-white p-4 rounded-xl border flex items-center justify-between shadow-sm" data-id="${idx}">
                    <div class="flex items-center gap-4 flex-1" onclick="openModal(${idx})">
                        <span class="mono text-[10px] font-black text-slate-300 w-8">${prefix}${(idx+1).toString().padStart(2, '0')}</span>
                        <div class="flex-1">
                            <div class="text-[12px] font-black uppercase ${op ? 'text-black' : 'text-slate-200'}">${op ? op.title : 'Leer'}</div>
                            ${op ? `<div class="text-[9px] font-bold text-blue-500 uppercase">${op.tool} | ${op.spindle}</div>` : ''}
                        </div>
                    </div>
                    <div class="handle p-2 text-slate-300"><i data-lucide="grip-vertical" class="w-5 h-5"></i></div>
                </div>
            `).join('');
            lucide.createIcons();
            initSortable();
        }

        function initSortable() {
            Sortable.create(document.getElementById('slot-container'), {
                handle: '.handle', animation: 150,
                onEnd: (evt) => {
                    const items = state.slots[state.currentChannel];
                    const moved = items.splice(evt.oldIndex, 1)[0];
                    items.splice(evt.newIndex, 0, moved);
                    save();
                }
            });
        }

        function switchChannel(ch) {
            state.currentChannel = ch;
            document.getElementById('tab-1').className = ch === '1' ? 'flex-1 py-4 text-[10px] font-black uppercase active-tab' : 'flex-1 py-4 text-[10px] font-black uppercase text-slate-400';
            document.getElementById('tab-2').className = ch === '2' ? 'flex-1 py-4 text-[10px] font-black uppercase active-tab' : 'flex-1 py-4 text-[10px] font-black uppercase text-slate-400';
            render();
        }

        function openModal(idx) {
            currentEditingIdx = idx;
            const op = state.slots[state.currentChannel][idx];
            document.getElementById('in-title').value = op ? op.title : "";
            document.getElementById('in-tool').value = op ? op.tool : "";
            document.getElementById('in-spindle').value = op ? op.spindle : "SP4";
            document.getElementById('op-modal').classList.remove('hidden');
        }

        function saveOperation() {
            state.slots[state.currentChannel][currentEditingIdx] = {
                title: document.getElementById('in-title').value,
                tool: document.getElementById('in-tool').value,
                spindle: document.getElementById('in-spindle').value
            };
            save(); closeModal();
        }

        function addNewSlot() { state.slots[state.currentChannel].push(null); save(); }
        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); }

        // ПРЕДПРОСМОТР PDF
        async function previewPDF() {
            document.getElementById('print-date').innerText = new Date().toLocaleString();
            
            const renderRows = (ch, targetId) => {
                const target = document.getElementById(targetId);
                target.innerHTML = "";
                const max = Math.max(state.slots["1"].length, state.slots["2"].length);
                const prefix = ch === "1" ? "L11" : "L21";
                
                for(let i=0; i<max; i++) {
                    const op = state.slots[ch][i];
                    const lCode = `${prefix}${(i+1).toString().padStart(2,'0')}`;
                    
                    // Порядок колонок SP4/SP3 меняется как на скриншоте
                    const isK2 = ch === "2";
                    const colA = !isK2 ? "SP4" : "SP3";
                    const colB = !isK2 ? "SP3" : "SP4";

                    const contentA = op && op.spindle === colA ? `<span class="op-text">${op.title}</span> <span class="op-meta">${lCode} ${op.tool}</span>` : "";
                    const contentB = op && op.spindle === colB ? `<span class="op-text">${op.title}</span> <span class="op-meta">${lCode} ${op.tool}</span>` : "";

                    target.innerHTML += `
                        <div class="row">
                            <div class="row-num">${i+1}</div>
                            <div class="cell">${contentA}</div>
                            <div class="cell">${contentB}</div>
                        </div>
                    `;
                }
            };

            renderRows("1", "pdf-rows-k1");
            renderRows("2", "pdf-rows-k2");

            const element = document.getElementById('print-template');
            
            // Вместо скачивания используем output('bloburl') для предпросмотра
            const opt = {
                margin: 0,
                filename: 'SyncPlan.pdf',
                image: { type: 'jpeg', quality: 1 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            };

            // Генерируем PDF и открываем в новом окне (превью)
            html2pdf().set(opt).from(element).outputPdf('bloburl').then(function(pdfUrl) {
                window.open(pdfUrl, '_blank');
            });
        }

        render();
    </script>
</body>
</html>
