<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator | Industrial Control</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .slot-drop { transition: all 0.2s ease; border: 2px dashed #e5e7eb; }
        .slot-drop.active { border-color: #000; background-color: #fff; }
        .op-card { cursor: grab; transition: transform 0.1s; }
        .op-card:active { cursor: grabbing; transform: scale(0.98); }
        
        /* Industrial Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <aside class="w-80 bg-black text-white flex flex-col shrink-0">
        <div class="p-6 border-b border-white/10">
            <h1 class="font-black tracking-tighter text-xl italic uppercase">Sync<span class="text-slate-500">Operator</span></h1>
            <p class="text-[9px] tracking-[0.3em] text-slate-500 font-bold uppercase mt-1">Operation Library</p>
        </div>
        
        <div class="p-4 flex-1 overflow-y-auto space-y-3" id="library-container">
            </div>

        <div class="p-4 border-t border-white/10">
            <button onclick="addNewOpPrompt()" class="w-full py-3 bg-white text-black text-xs font-black uppercase tracking-widest rounded-xl hover:bg-slate-200 transition-all flex items-center justify-center gap-2">
                <i data-lucide="plus" class="w-4 h-4"></i> Neue Operation
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <div class="flex items-center gap-4">
                <span class="text-[10px] font-black bg-black text-white px-2 py-1 rounded">V 1.0</span>
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-400">Programmplanung / Dual-Channel</h2>
            </div>
            <div class="flex gap-2">
                <button onclick="renderSetupSheet()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 border border-slate-200"><i data-lucide="clipboard-list"></i></button>
                <button onclick="exportJSON()" class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 border border-slate-200"><i data-lucide="download"></i></button>
            </div>
        </header>

        <div class="flex-1 overflow-x-auto p-8 flex gap-8">
            
            <div class="flex-1 min-w-[400px] flex flex-col gap-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="font-black text-sm uppercase tracking-widest flex items-center gap-2">
                        <span class="w-3 h-3 bg-blue-500 rounded-full"></span> 1000.MPF <span class="text-slate-400 text-[10px] ml-2">Kanal 1</span>
                    </h3>
                </div>
                <div id="channel-1" class="space-y-2">
                    </div>
            </div>

            <div class="flex-1 min-w-[400px] flex flex-col gap-4">
                <div class="flex items-center justify-between px-2">
                    <h3 class="font-black text-sm uppercase tracking-widest flex items-center gap-2">
                        <span class="w-3 h-3 bg-orange-500 rounded-full"></span> 2000.MPF <span class="text-slate-400 text-[10px] ml-2">Kanal 2</span>
                    </h3>
                </div>
                <div id="channel-2" class="space-y-2">
                    </div>
            </div>

        </div>
    </main>

    <script src="core.js"></script> <script>
        // UI REFRESH LOGIC
        function refreshUI() {
            renderLibrary();
            renderChannels();
            lucide.createIcons();
        }

        function renderLibrary() {
            const container = document.getElementById('library-container');
            container.innerHTML = SyncOperator.state.operations.map(op => `
                <div class="op-card bg-slate-900 p-4 rounded-xl border border-white/5 hover:border-white/20 transition-all" 
                     draggable="true" ondragstart="onDragStart(event, '${op.id}')">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[9px] font-bold text-blue-400 uppercase tracking-tighter">${op.toolNo}</span>
                        <button onclick="SyncOperator.deleteOperation('${op.id}'); refreshUI();" class="text-slate-600 hover:text-red-500"><i data-lucide="trash-2" class="w-3 h-3"></i></button>
                    </div>
                    <div class="text-xs font-bold text-slate-100 truncate">${op.title}</div>
                    <div class="text-[8px] text-slate-500 mt-1 uppercase">${op.category} | ${op.spindle}</div>
                </div>
            `).join('');
        }

        function renderChannels() {
            [1, 2].forEach(ch => {
                const plan = SyncOperator.getProgramPlan(ch.toString());
                const container = document.getElementById(`channel-${ch}`);
                container.innerHTML = plan.map((slot, idx) => `
                    <div class="slot-drop bg-white rounded-xl p-3 flex items-center justify-between gap-4"
                         ondragover="onDragOver(event)" 
                         ondrop="onDrop(event, '${ch}', ${idx})">
                        <div class="flex items-center gap-4">
                            <span class="mono text-[10px] font-bold text-slate-400 w-10">${slot.lCode}</span>
                            <div class="h-8 w-[2px] bg-slate-100"></div>
                            <div>
                                <div class="text-[11px] font-bold ${slot.name === 'EMPTY' ? 'text-slate-300 italic' : 'text-black'}">${slot.name}</div>
                                <div class="text-[9px] font-medium text-slate-400">${slot.toolNo}</div>
                            </div>
                        </div>
                        ${slot.name !== 'EMPTY' ? `<button onclick="SyncOperator.clearSlot('${ch}', ${idx}); refreshUI();" class="text-slate-300 hover:text-black"><i data-lucide="x" class="w-4 h-4"></i></button>` : ''}
                    </div>
                `).join('');
            });
        }

        // DRAG & DROP BRIDGE
        function onDragStart(e, opId) {
            e.dataTransfer.setData('text/plain', opId);
        }

        function onDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('active');
        }

        function onDrop(e, channel, slotIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('active');
            const opId = e.dataTransfer.getData('text/plain');
            SyncOperator.assignOpToSlot(opId, channel, slotIdx);
            refreshUI();
        }

        // INITIAL LOAD
        window.onload = () => {
            if(SyncOperator.state.operations.length === 0) {
                // Beispiel-Daten falls leer
                SyncOperator.addOperation({title: "Planen", toolNo: "T0101", category: "Außen", spindle: "SP3"});
                SyncOperator.addOperation({title: "Bohren", toolNo: "T0505", category: "Innen", spindle: "SP3"});
            }
            refreshUI();
        };

        function addNewOpPrompt() {
            const title = prompt("Name der Operation:");
            const tool = prompt("Werkzeugnummer (z.B. T0101):");
            if(title && tool) {
                SyncOperator.addOperation({title, toolNo: tool});
                refreshUI();
            }
        }
    </script>
</body>
</html>
