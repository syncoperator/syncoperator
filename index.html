<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SyncOp X</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    </head>
<body>
    <header class="p-4 bg-white border-b-2 border-slate-900 flex justify-between items-center shadow-sm">
        <div class="text-xl font-black italic">SyncOp <span class="text-blue-600">X</span></div>
        <div class="flex gap-2">
            <button onclick="SyncOp.exportPDF('tools')" class="px-4 py-2 border border-slate-300 font-bold text-xs uppercase">Werkzeugliste</button>
            <button onclick="SyncOp.exportPDF('plan')" class="px-4 py-2 bg-slate-900 text-white font-bold text-xs uppercase shadow-md">Export Plan</button>
        </div>
    </header>

    <main class="p-6">
        <div id="ui-root" class="max-w-4xl mx-auto">
            <p class="text-center text-slate-400 text-sm">Здесь будет список слотов для редактирования...</p>
        </div>
    </main>

    <div id="pdf-buffer" style="position: absolute; left: -9999px;"></div>

    <script src="app.js"></script>
    <script>
        // Инициализация UI при загрузке
        window.onload = () => {
            // Здесь можно вызвать SyncOp.renderUI(), если дописать отрисовку кнопок управления
            console.log("SyncOp Ready");
        };
    </script>
</body>
</html>
