<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SyncOp X Professional</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <header style="background:#000; color:#fff; padding:15px 20px; display:flex; justify-content:space-between; align-items:center;">
        <div style="font-weight:900; letter-spacing:-1px;">SyncOp <span style="color:#2563eb">X</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn btn-primary" style="border:1px solid #444" onclick="App.exportPDF('tools')">Werkzeugliste</button>
            <button class="btn btn-accent" onclick="App.exportPDF('plan')">Operation Plan</button>
        </div>
    </header>

    <div class="app-container" id="ui-root">
        </div>

    <div id="pdf-buffer" style="position: absolute; left: -9999px;"></div>

    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
