<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SyncOp X Professional</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script> </head>
<body class="bg-slate-100">

    <header class="app-header">
        <div class="text-2xl font-black italic tracking-tighter">SyncOp <span class="text-blue-500">X</span></div>
        <div class="flex gap-3">
            <button onclick="App.exportPDF('tools')" class="px-5 py-2 bg-slate-800 text-white font-bold text-xs uppercase hover:bg-slate-700">Werkzeugliste</button>
            <button onclick="App.exportPDF('plan')" class="px-5 py-2 bg-blue-600 text-white font-bold text-xs uppercase hover:bg-blue-500 shadow-lg">Export Plan</button>
        </div>
    </header>

    <div class="flex bg-slate-200 border-b border-slate-300">
        <button id="tab-1" onclick="App.switchChannel('1')" class="tab-btn flex-1 py-4 font-black uppercase text-xs tracking-widest transition-all">Kanal 1</button>
        <button id="tab-2" onclick="App.switchChannel('2')" class="tab-btn flex-1 py-4 font-black uppercase text-xs tracking-widest transition-all">Kanal 2</button>
    </div>

    <div id="ui-root" class="max-w-3xl mx-auto p-6"></div>

    <div id="modal" class="modal-overlay hidden">
        <div class="modal-content">
            <h2 class="font-black uppercase text-sm mb-6 border-b pb-2">Slot Konfiguration</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Bezeichnung</label>
                    <input type="text" id="in-title" class="w-full border-2 border-slate-100 p-3 font-bold focus:border-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Spezifikation</label>
                    <input type="text" id="in-tool-name" class="w-full border-2 border-slate-100 p-3 text-sm focus:border-blue-500 outline-none">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">T-Nummer</label>
                        <input type="text" id="in-tool" class="w-full border-2 border-slate-100 p-3 font-mono text-center focus:border-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold text-slate-400 uppercase mb-1">Spindel</label>
                        <select id="in-spindle" class="w-full border-2 border-slate-100 p-3 font-bold bg-white outline-none">
                            <option value="SP4">Spindel 4</option>
                            <option value="SP3">Spindel 3</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex gap-3 mt-8">
                <button onclick="App.closeModal()" class="flex-1 py-3 bg-slate-100 font-bold uppercase text-[10px]">Abbrechen</button>
                <button onclick="App.saveSlot()" class="flex-1 py-3 bg-blue-600 text-white font-bold uppercase text-[10px]">Speichern</button>
            </div>
        </div>
    </div>

    <div id="pdf-buffer" style="position: absolute; left: -9999px;"></div>

    <script src="renderer.js"></script>
    <script src="app.js"></script>
</body>
</html>
