<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOp | CELOS X</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@500;700&display=swap');
        
        :root {
            --celos-bg: #ffffff;
            --celos-border: #e5e7eb;
            --celos-text: #111827;
            --celos-accent: #000000;
            --celos-gray: #f9fafb;
        }

        body { font-family: 'Inter', sans-serif; background-color: var(--celos-bg); color: var(--celos-text); }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* CELOS X UI */
        .card { background: white; border: 1px solid var(--celos-border); transition: all 0.2s; }
        .card:active { background: var(--celos-gray); }
        .active-tab { border-bottom: 3px solid var(--celos-accent); font-weight: 800; }
        .handle { cursor: grab; opacity: 0.2; }
        
        /* PDF 1:1 Design (Technical Drawing Style) */
        .pdf-page { width: 297mm; background: white; color: black; padding: 5mm; }
        .table-container { display: flex; border: 1.2px solid #000; }
        .chan-col { flex: 1; border-right: 1.2px solid #000; }
        .chan-col:last-child { border-right: none; }
        .chan-title { background: #000; color: #fff; text-align: center; font-weight: 800; font-size: 10px; padding: 4px; text-transform: uppercase; }
        
        .sp-header { display: flex; font-size: 9px; font-weight: 700; text-align: center; border-bottom: 1.2px solid #000; }
        .sp-4 { flex: 1; background: #f3f4f6; padding: 4px; border-right: 1px solid #000; }
        .sp-3 { flex: 1; background: #e5e7eb; padding: 4px; }
        
        .row { display: flex; border-bottom: 1px solid #e5e7eb; min-height: 24px; font-size: 9px; align-items: center; }
        .row:last-child { border-bottom: none; }
        .row-num { width: 25px; text-align: center; border-right: 1.2px solid #000; background: #f9fafb; font-weight: 800; align-self: stretch; display: flex; align-items: center; justify-content: center; font-size: 8px; }
        .cell { flex: 1; padding: 0 6px; border-right: 1px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; height: 100%; }
        .cell:last-child { border-right: none; }
        
        .op-title { font-weight: 600; text-transform: uppercase; letter-spacing: -0.01em; }
        .op-meta { font-family: 'JetBrains Mono'; font-size: 7px; color: #6b7280; font-weight: 600; }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="px-6 py-4 flex justify-between items-center shrink-0 border-b border-gray-100">
        <div class="flex items-center gap-2">
            <h1 class="font-extrabold uppercase text-lg tracking-tighter italic">Sync<span class="text-gray-300">Op</span></h1>
            <span class="text-[8px] bg-black text-white px-1.5 py-0.5 rounded font-bold tracking-widest">X</span>
        </div>
        <div class="flex gap-2">
            <button onclick="previewTools()" class="px-4 py-2 bg-gray-50 border border-gray-200 rounded-md text-[9px] font-bold uppercase tracking-wider hover:bg-gray-100">Werkzeugliste</button>
            <button onclick="previewPlan()" class="px-4 py-2 bg-black text-white rounded-md text-[9px] font-bold uppercase tracking-wider active:scale-95 transition-all">Export Plan</button>
        </div>
    </header>

    <div class="flex bg-white shrink-0 shadow-sm">
        <button onclick="switchChannel('1')" id="tab-1" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest active-tab">Kanal 1</button>
        <button onclick="switchChannel('2')" id="tab-2" class="flex-1 py-4 text-[10px] font-bold uppercase tracking-widest text-gray-400">Kanal 2</button>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-2 bg-[#fcfcfc]" id="main-view">
        <div id="slot-container" class="space-y-1.5"></div>
        <button onclick="addNewSlot()" class="w-full py-4 border-2 border-dashed border-gray-200 rounded-xl text-gray-300 text-[9px] font-bold uppercase tracking-[0.2em] mt-2">+ Neuer Slot</button>
    </main>

    <div style="position: absolute; left: -9999px;">
        <div id="pdf-container" class="pdf-page">
            <div class="table-container" id="pdf-content"></div>
        </div>
    </div>

    <div id="op-modal" class="fixed inset-0 bg-black/20 backdrop-blur-sm hidden z-[100] p-4 flex items-center justify-center">
        <div class="bg-white w-full max-w-md border border-gray-200 rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <span class="text-[10px] font-extrabold uppercase tracking-widest text-gray-400">Parameter</span>
                <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <div class="p-6 space-y-5">
                <div class="grid grid-cols-2 gap-2" id="library-grid"></div>

                <div class="space-y-3">
                    <div class="group">
                        <label class="text-[8px] font-bold text-gray-400 uppercase ml-1">Bezeichnung</label>
                        <input type="text" id="in-title" class="w-full bg-gray-50 border-b-2 border-gray-200 p-3 font-bold uppercase text-sm outline-none focus:border-black transition-all">
                    </div>
                    <div class="group">
                        <label class="text-[8px] font-bold text-gray-400 uppercase ml-1">Spezifikation</label>
                        <input type="text" id="in-tool-name" class="w-full bg-gray-50 border-b-2 border-gray-200 p-3 font-medium text-xs outline-none focus:border-black transition-all">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[8px] font-bold text-gray-400 uppercase ml-1">T-Nummer</label>
                            <input type="text" id="in-tool" class="w-full bg-gray-50 border-b-2 border-gray-200 p-3 font-bold mono text-sm outline-none focus:border-black">
                        </div>
                        <div>
                            <label class="text-[8px] font-bold text-gray-400 uppercase ml-1">Spindel</label>
                            <select id="in-spindle" class="w-full bg-gray-50 border-b-2 border-gray-200 p-3 font-bold text-sm outline-none focus:border-black appearance-none">
                                <option value="SP4">Spindel 4</option>
                                <option value="SP3">Spindel 3</option>
                            </select>
                        </div>
                    </div>
                </div>
                <button onclick="saveOp()" class="w-full py-4 bg-black text-white rounded-lg font-bold uppercase text-xs tracking-widest shadow-lg active:bg-gray-800">Übernehmen</button>
            </div>
        </div>
    </div>

    <script>
        const library = [
            { id: 'schrup', label: 'Schruppen', t: 'T1', name: 'WSP CNMG 120408', sp: 'SP4' },
            { id: 'schlicht', label: 'Schlichten', t: 'T2', name: 'WSP DCMT 070204', sp: 'SP4' },
            { id: 'bohr', label: 'Bohren', t: 'T5', name: 'VHM D10.3 IK', sp: 'SP3' },
            { id: 'abst', label: 'Abstechen', t: 'T12', name: 'Breite 3.1mm', sp: 'SP4' },
            { id: 'gew', label: 'Gewinde', t: 'T8', name: 'M10 Steigung 1.5', sp: 'SP3' },
            { id: 'zent', label: 'Zentrieren', t: 'T3', name: 'NC-Anbohrer 90°', sp: 'SP4' }
        ];

        let state = JSON.parse(localStorage.getItem('sync_v11_state')) || {
            slots: { "1": Array(10).fill(null), "2": Array(10).fill(null) },
            currentChannel: "1"
        };

        let currentIdx = null;

        function renderLibrary() {
            const grid = document.getElementById('library-grid');
            grid.innerHTML = library.map(item => `
                <button onclick="loadFromLib('${item.id}')" class="p-2 bg-gray-50 border border-gray-100 rounded text-[9px] font-bold uppercase hover:border-black transition-all">
                    ${item.label}
                </button>
            `).join('');
        }

        function loadFromLib(id) {
            const item = library.find(x => x.id === id);
            document.getElementById('in-title').value = item.label;
            document.getElementById('in-tool-name').value = item.name;
            document.getElementById('in-tool').value = item.t;
            document.getElementById('in-spindle').value = item.sp;
        }

        function save() { localStorage.setItem('sync_v11_state', JSON.stringify(state)); render(); }

        function render() {
            const container = document.getElementById('slot-container');
            const ch = state.currentChannel;
            const prefix = ch === "1" ? "L11" : "L21";
            container.innerHTML = state.slots[ch].map((op, idx) => `
                <div class="card p-4 rounded-lg flex items-center justify-between group" data-id="${idx}">
                    <div class="flex items-center gap-4 flex-1" onclick="openModal(${idx})">
                        <span class="mono text-[9px] font-bold text-gray-300 w-8">${prefix}${(idx+1).toString().padStart(2, '0')}</span>
                        <div class="flex-1">
                            <div class="text-[11px] font-extrabold uppercase tracking-tight ${op ? 'text-black' : 'text-gray-200'}">${op ? op.title : 'Leerer Slot'}</div>
                            ${op ? `<div class="text-[8px] font-bold text-gray-400 uppercase mt-0.5 mono tracking-tighter">${op.tool} <span class="mx-1">|</span> ${op.spindle} <span class="mx-1">|</span> ${op.toolName}</div>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="removeSlot(${idx})" class="p-2 text-gray-200 hover:text-red-500 transition-all"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        <div class="handle p-2"><i data-lucide="grip-vertical" class="w-4 h-4 text-gray-300"></i></div>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
            Sortable.create(container, { handle: '.handle', animation: 150, onEnd: (evt) => {
                const items = state.slots[state.currentChannel];
                const moved = items.splice(evt.oldIndex, 1)[0];
                items.splice(evt.newIndex, 0, moved);
                save();
            }});
        }

        function switchChannel(ch) {
            state.currentChannel = ch;
            document.getElementById('tab-1').className = ch === '1' ? 'flex-1 py-4 text-[10px] font-bold uppercase tracking-widest active-tab' : 'flex-1 py-4 text-[10px] font-bold uppercase tracking-widest text-gray-300';
            document.getElementById('tab-2').className = ch === '2' ? 'flex-1 py-4 text-[10px] font-bold uppercase tracking-widest active-tab' : 'flex-1 py-4 text-[10px] font-bold uppercase tracking-widest text-gray-300';
            render();
        }

        function openModal(idx) {
            currentIdx = idx;
            const op = state.slots[state.currentChannel][idx];
            document.getElementById('in-title').value = op ? op.title : "";
            document.getElementById('in-tool-name').value = op ? op.toolName : "";
            document.getElementById('in-tool').value = op ? op.tool : "";
            document.getElementById('in-spindle').value = op ? op.spindle : "SP4";
            document.getElementById('op-modal').classList.remove('hidden');
            renderLibrary();
        }

        function saveOp() {
            state.slots[state.currentChannel][currentIdx] = {
                title: document.getElementById('in-title').value,
                toolName: document.getElementById('in-tool-name').value,
                tool: document.getElementById('in-tool').value,
                spindle: document.getElementById('in-spindle').value
            };
            save(); closeModal();
        }

        function removeSlot(idx) { state.slots[state.currentChannel].splice(idx, 1); save(); }
        function addNewSlot() { state.slots[state.currentChannel].push(null); save(); }
        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); }

        // PDF GENERATION (1:1 Design)
        function previewPlan() {
            let html = `
                <div class="chan-col">
                    <div class="chan-title">Kanal 1 - 1000.MPF</div>
                    <div class="sp-header"><div class="sp-4">Spindel 4</div><div class="sp-3">Spindel 3</div></div>
                    ${generateRows("1")}
                </div>
                <div class="chan-col">
                    <div class="chan-title">Kanal 2 - 2000.MPF</div>
                    <div class="sp-header"><div class="sp-3">Spindel 3</div><div class="sp-4">Spindel 4</div></div>
                    ${generateRows("2")}
                </div>`;
            document.getElementById('pdf-content').innerHTML = html;
            printPDF('SyncPlan');
        }

        function generateRows(ch) {
            let rows = "";
            const max = Math.max(state.slots["1"].length, state.slots["2"].length);
            for(let i=0; i<max; i++) {
                const op = state.slots[ch][i];
                const lCode = ch === "1" ? `L11${(i+1).toString().padStart(2,'0')}` : `L21${(i+1).toString().padStart(2,'0')}`;
                const spA = (ch === "1" ? "SP4" : "SP3"), spB = (ch === "1" ? "SP3" : "SP4");
                const content = (s) => (op && op.spindle === s) ? `<div class="op-title">${op.title}</div><div class="op-meta">${lCode} ${op.tool}</div>` : "";
                rows += `<div class="row"><div class="row-num">${i+1}</div><div class="cell">${content(spA)}</div><div class="cell">${content(spB)}</div></div>`;
            }
            return rows;
        }

        function previewTools() {
            const allTools = [];
            [1,2].forEach(ch => state.slots[ch].forEach(op => { if(op && op.tool) allTools.push({...op, ch}) }));
            allTools.sort((a,b) => a.tool.localeCompare(b.tool, undefined, {numeric: true}));

            let html = `
                <div class="chan-col" style="flex:2">
                    <div class="chan-title">Einrichteblatt / Werkzeugliste</div>
                    <div class="sp-header"><div class="sp-4" style="flex:0.2">T-NR</div><div class="sp-3">Werkzeug Name / Spezifikation</div><div class="sp-4" style="flex:0.2">Kanal</div></div>`;
            
            allTools.forEach((t, i) => {
                html += `
                    <div class="row">
                        <div class="row-num">${i+1}</div>
                        <div class="cell" style="flex:0.2; font-weight:800; font-family:monospace">${t.tool}</div>
                        <div class="cell" style="font-weight:600">${t.toolName} <span style="font-size:7px; color:#9ca3af; margin-left:10px">${t.spindle}</span></div>
                        <div class="cell" style="flex:0.2; text-align:center; display:block">K${t.ch}</div>
                    </div>`;
            });
            html += `</div>`;
            document.getElementById('pdf-content').innerHTML = html;
            printPDF('Werkzeugliste');
        }

        function printPDF(name) {
            const opt = { margin:0, filename: name + '.pdf', image:{type:'jpeg', quality:1}, html2canvas:{scale:3}, jsPDF:{unit:'mm', format:'a4', orientation:'landscape'} };
            html2pdf().from(document.getElementById('pdf-container')).set(opt).outputPdf('bloburl').then(url => window.open(url));
        }

        render();
    </script>
</body>
</html>
