<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator | Mobile CNC Planning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #111827; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .active-tab { border-bottom: 3px solid #000; color: #000; }
        .dragging { opacity: 0.5; transform: scale(0.95); }
    </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

    <header class="bg-black text-white px-5 py-4 flex justify-between items-center shadow-lg z-50 shrink-0">
        <div class="flex items-center gap-2">
            <h1 class="font-extrabold tracking-tighter text-lg italic uppercase">Sync<span class="text-slate-400">Op</span></h1>
            <span class="text-[8px] bg-blue-600 px-1.5 py-0.5 rounded font-bold">V 3.0</span>
        </div>
        <div class="flex gap-2">
            <button onclick="exportToPDF()" class="p-2 bg-white/10 rounded-lg"><i data-lucide="file-text" class="w-5 h-5"></i></button>
            <button onclick="resetToDemo()" class="p-2 bg-blue-600 rounded-lg text-[10px] font-bold uppercase">Demo</button>
        </div>
    </header>

    <div class="flex bg-white border-b border-slate-200 shrink-0">
        <button onclick="switchChannel('1')" id="tab-1" class="flex-1 py-3 text-xs font-black uppercase tracking-widest active-tab">Kanal 1</button>
        <button onclick="switchChannel('2')" id="tab-2" class="flex-1 py-3 text-xs font-black uppercase tracking-widest text-slate-400">Kanal 2</button>
    </div>

    <main class="flex-1 overflow-y-auto p-4 space-y-2 pb-20" id="slot-list">
        </main>

    <div id="op-modal" class="fixed inset-0 bg-black/60 backdrop-blur-md hidden z-[100] p-4 flex items-center">
        <div class="bg-white w-full rounded-[2.5rem] overflow-hidden shadow-2xl">
            <div class="p-6 border-b bg-slate-50 flex justify-between items-center">
                <h3 id="modal-title" class="font-black text-xs uppercase">Neue Operation</h3>
                <button onclick="closeModal()"><i data-lucide="x"></i></button>
            </div>
            <div class="p-6 space-y-4">
                <div>
                    <label class="text-[10px] font-bold uppercase text-slate-400">Bezeichnung</label>
                    <input type="text" id="in-title" placeholder="z.B. Schruppen" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400">Werkzeug (T)</label>
                        <input type="text" id="in-tool" placeholder="T1" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold mono">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold uppercase text-slate-400">Spindel</label>
                        <select id="in-spindle" class="w-full p-4 bg-slate-100 rounded-2xl border-none outline-none font-bold">
                            <option value="SP3">Spindel 3</option>
                            <option value="SP4">Spindel 4</option>
                        </select>
                    </div>
                </div>
                <button onclick="saveOperation()" class="w-full py-5 bg-black text-white rounded-2xl font-black uppercase tracking-widest mt-2">Speichern</button>
            </div>
        </div>
    </div>

    <script>
        // --- LOGIC CORE ---
        let state = JSON.parse(localStorage.getItem('sync_v3_state')) || {
            slots: { "1": [], "2": [] },
            currentChannel: "1"
        };

        // Initialisierung von 20 leeren Slots pro Kanal
        if (state.slots["1"].length === 0) {
            for(let i=0; i<20; i++) { state.slots["1"].push(null); state.slots["2"].push(null); }
        }

        let currentEditingSlot = null;

        function saveState() {
            localStorage.setItem('sync_v3_state', JSON.stringify(state));
            renderSlots();
        }

        function switchChannel(ch) {
            state.currentChannel = ch;
            document.getElementById('tab-1').classList.toggle('active-tab', ch === '1');
            document.getElementById('tab-1').classList.toggle('text-slate-400', ch !== '1');
            document.getElementById('tab-2').classList.toggle('active-tab', ch === '2');
            document.getElementById('tab-2').classList.toggle('text-slate-400', ch !== '2');
            renderSlots();
        }

        function renderSlots() {
            const container = document.getElementById('slot-list');
            const ch = state.currentChannel;
            const prefix = ch === "1" ? "L11" : "L21";

            container.innerHTML = state.slots[ch].map((op, idx) => `
                <div class="slot-item bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex items-center justify-between gap-3 active:scale-95 transition-transform"
                     draggable="true" 
                     onsubmit="return false;"
                     onclick="openOpModal(${idx})"
                     ondragstart="handleDragStart(event, ${idx})"
                     ondragover="handleDragOver(event)"
                     ondrop="handleDrop(event, ${idx})">
                    
                    <div class="flex items-center gap-4 pointer-events-none">
                        <span class="mono text-[10px] font-bold text-slate-300 w-8">${prefix}${(idx+1).toString().padStart(2, '0')}</span>
                        <div class="h-8 w-px bg-slate-100"></div>
                        <div>
                            <div class="text-xs font-black uppercase ${op ? 'text-black' : 'text-slate-300 italic'}">
                                ${op ? op.title : 'Leerer Slot'}
                            </div>
                            ${op ? `<div class="text-[10px] font-bold text-blue-600 mono">${op.tool} <span class="text-slate-400 ml-2">${op.spindle}</span></div>` : ''}
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        ${op ? `<button onclick="event.stopPropagation(); deleteOp(${idx})" class="p-2 text-slate-300"><i data-lucide="trash-2" class="w-4 h-4"></i></button>` : ''}
                        <i data-lucide="grip-vertical" class="text-slate-200 w-5 h-5"></i>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- DRAG & DROP LOGIC ---
        let dragSourceIndex = null;

        function handleDragStart(e, idx) {
            dragSourceIndex = idx;
            e.target.classList.add('dragging');
        }

        function handleDragOver(e) { e.preventDefault(); }

        function handleDrop(e, targetIdx) {
            e.preventDefault();
            const ch = state.currentChannel;
            const movedItem = state.slots[ch].splice(dragSourceIndex, 1)[0];
            state.slots[ch].splice(targetIdx, 0, movedItem);
            saveState();
        }

        // --- MODAL & CRUD ---
        function openOpModal(idx) {
            currentEditingSlot = idx;
            const op = state.slots[state.currentChannel][idx];
            document.getElementById('modal-title').innerText = op ? "Operation bearbeiten" : "Neue Operation";
            document.getElementById('in-title').value = op ? op.title : "";
            document.getElementById('in-tool').value = op ? op.tool : "";
            document.getElementById('in-spindle').value = op ? op.spindle : "SP3";
            document.getElementById('op-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('op-modal').classList.add('hidden'); }

        function saveOperation() {
            const title = document.getElementById('in-title').value;
            const tool = document.getElementById('in-tool').value;
            const spindle = document.getElementById('in-spindle').value;

            if (title) {
                state.slots[state.currentChannel][currentEditingSlot] = { title, tool, spindle };
                saveState();
                closeModal();
            }
        }

        function deleteOp(idx) {
            state.slots[state.currentChannel][idx] = null;
            saveState();
        }

        // --- EXPORT & DEMO ---
        function exportToPDF() {
            const element = document.getElementById('slot-list');
            const opt = {
                margin: 10,
                filename: `Programmplan_Kanal_${state.currentChannel}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        function resetToDemo() {
            state.slots["1"][0] = { title: "Schruppen", tool: "T1", spindle: "SP4" };
            state.slots["1"][1] = { title: "Bohrung Vordrehen", tool: "T5", spindle: "SP4" };
            state.slots["2"][0] = { title: "Schruppen", tool: "T1", spindle: "SP3" };
            saveState();
        }

        renderSlots();
    </script>
</body>
</html>
