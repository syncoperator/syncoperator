<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator Pro</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <header class="app-header">
        <div class="logo">
            <span class="logo-dot"></span>
            <h1>SyncOperator <span>PRO</span></h1>
        </div>
        <div class="global-actions">
            <button id="exportBtn" class="icon-btn" title="Export">📤</button>
            <button id="importBtn" class="icon-btn" title="Import">📥</button>
            <input type="file" id="importInput" style="display:none" accept=".json">
        </div>
    </header>

    <div class="main-layout">
        <nav class="mobile-nav">
            <button class="nav-item active" data-target="plan-section">Programm</button>
            <button class="nav-item" data-target="library-section">Bibliothek</button>
            <button class="nav-item" data-target="setup-section">Setup</button>
        </nav>

        <main class="content-area">
            <section id="plan-section" class="view-section active">
                <div class="section-header">
                    <h2>Programmplan</h2>
                </div>
                <div class="channels-grid">
                    <div class="channel-col" data-channel="1">
                        <div class="channel-badge">CH 1: 1000.MPF</div>
                        <div id="slots-1" class="slot-container"></div>
                        <button class="add-slot-btn" data-channel="1">+ Slot</button>
                    </div>
                    <div class="channel-col" data-channel="2">
                        <div class="channel-badge secondary">CH 2: 2000.MPF</div>
                        <div id="slots-2" class="slot-container"></div>
                        <button class="add-slot-btn" data-channel="2">+ Slot</button>
                    </div>
                </div>
            </section>

            <section id="library-section" class="view-section">
                <div class="section-header">
                    <h2>Bibliothek</h2>
                    <button id="addNewOpBtn" class="fab">+</button>
                </div>
                <div class="glass-filters">
                    <select id="filterCategory">
                        <option value="">Kategorie</option>
                        <option value="Außen">Außen</option>
                        <option value="Innen">Innen</option>
                        <option value="Radial">Radial</option>
                        <option value="Axial">Axial</option>
                    </select>
                    <select id="filterSpindle">
                        <option value="">Spindel</option>
                        <option value="SP3">SP3</option>
                        <option value="SP4">SP4</option>
                    </select>
                </div>
                <div id="libraryList" class="library-grid"></div>
            </section>

            <section id="setup-section" class="view-section">
                <div class="section-header">
                    <h2>Einrichteblatt</h2>
                </div>
                <div id="setupBody" class="setup-cards-container"></div>
            </section>
        </main>
    </div>

    <div id="opModal" class="modal">
        <div class="modal-content glass">
            <h3 id="modalTitle">Operation</h3>
            <form id="opForm">
                <input type="hidden" id="field-id">
                <div class="input-group">
                    <input type="text" id="field-title" placeholder="Name" required>
                    <input type="text" id="field-code" placeholder="Basis L-Code" required>
                </div>
                <div class="input-group">
                    <select id="field-spindle">
                        <option value="SP3">SP3</option>
                        <option value="SP4">SP4</option>
                    </select>
                    <select id="field-category">
                        <option value="Außen">Außen</option>
                        <option value="Innen">Innen</option>
                        <option value="Radial">Radial</option>
                        <option value="Axial">Axial</option>
                    </select>
                </div>
                <div class="input-group">
                    <input type="text" id="field-toolNo" placeholder="T0101" required>
                    <input type="text" id="field-toolName" placeholder="Tool Name">
                </div>
                <label class="checkbox-container">
                    <span>Doppelhalter</span>
                    <input type="checkbox" id="field-doppelhalter">
                    <span class="checkmark"></span>
                </label>
                <div class="modal-actions">
                    <button type="button" id="deleteOpBtn" class="btn-text danger">Löschen</button>
                    <div class="main-btns">
                        <button type="button" id="closeModalBtn" class="btn-text">Abbruch</button>
                        <button type="submit" class="btn-primary">Speichern</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
