<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SSA | Sägelänge Rechner</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f12;
            --card: #1a1a1f;
            --accent: #30d158; /* Машинный зеленый */
            --input-bg: #24242b;
            --text: #ffffff;
            --sub: #8e8e93;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            margin-bottom: 30px;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        header p {
            margin: 5px 0 0;
            color: var(--sub);
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            background: var(--card);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .field {
            display: flex;
            flex-direction: column;
        }

        .field.full {
            grid-column: span 2;
        }

        .field label {
            font-size: 10px;
            font-weight: 800;
            color: var(--sub);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .field input {
            background: var(--input-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 15px;
            color: var(--text);
            font-family: 'JetBrains Mono', monospace;
            font-size: 20px;
            font-weight: 800;
            outline: none;
            transition: border-color 0.2s;
        }

        .field input:focus {
            border-color: var(--accent);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10px 10px;
            border-bottom: 1px solid #333;
            margin-bottom: 15px;
        }

        .results-header span {
            font-size: 11px;
            font-weight: 800;
            color: var(--sub);
        }

        .result-card {
            background: var(--card);
            margin-bottom: 10px;
            padding: 15px 20px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s;
        }

        .result-card.optimal {
            border: 2px solid var(--accent);
            background: rgba(48, 209, 88, 0.05);
        }

        .count-badge {
            display: flex;
            flex-direction: column;
        }

        .count-badge b {
            font-size: 24px;
            font-family: 'JetBrains Mono', monospace;
        }

        .count-badge span {
            font-size: 10px;
            font-weight: 700;
            color: var(--sub);
        }

        .length-value {
            text-align: right;
        }

        .length-value b {
            font-size: 24px;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
        }

        .length-value span {
            font-size: 12px;
            margin-left: 4px;
            color: var(--sub);
        }

        .info-footer {
            margin-top: 30px;
            text-align: center;
            font-size: 10px;
            color: #333;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SSA RECHNER</h1>
            <p>Nakamura CNC Drehen | Stangenkalkulation</p>
        </header>

        <div class="input-group">
            <div class="field full">
                <label>Fertigteillänge (mm)</label>
                <input type="number" id="l" value="146" step="0.1" oninput="calc()">
            </div>
            <div class="field">
                <label>Zugabe (+ mm)</label>
                <input type="number" id="z" value="5" step="0.1" oninput="calc()">
            </div>
            <div class="field">
                <label>Reststück (mm)</label>
                <input type="number" id="r" value="50" step="1" oninput="calc()">
            </div>
        </div>

        <div class="results-header">
            <span>STÜCKZAHL</span>
            <span>STANGENLÄNGE</span>
        </div>

        <div id="results">
            </div>

        <div class="info-footer">
            VER. 2026.1 | OPTIMIZED FOR NAKAMURA CNC
        </div>
    </div>

    <script>
        function calc() {
            const l = parseFloat(document.getElementById('l').value) || 0;
            const z = parseFloat(document.getElementById('z').value) || 0;
            const r = parseFloat(document.getElementById('r').value) || 0;
            const container = document.getElementById('results');

            if (l <= 0) {
                container.innerHTML = '';
                return;
            }

            const unit = l + z;
            // Ищем количество деталей, которое максимально близко к 1000мм (как в твоем примере)
            const baseCount = Math.round(1000 / unit);
            
            let html = '';
            // Генерируем варианты: -3 и +3 от базы
            for (let i = -3; i <= 5; i++) {
                const count = baseCount + i;
                if (count <= 0) continue;

                const total = (unit * count) + r;
                // Подсветка варианта, который ближе всего к 1000 мм
                const isOptimal = count === baseCount;

                html += `
                    <div class="result-card ${isOptimal ? 'optimal' : ''}">
                        <div class="count-badge">
                            <b>${count}</b>
                            <span>TEILE</span>
                        </div>
                        <div class="length-value">
                            <b>${total.toFixed(1)}</b><span>mm</span>
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        // Запуск при загрузке
        window.onload = calc;
    </script>
</body>
</html>
