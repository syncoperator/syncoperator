<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL MASTER v10.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #007AFF; --bg: #F2F2F7; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; padding: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* --- APP UI HEADER --- */
        .app-bar { background: white; padding: 15px 20px; border-bottom: 1px solid #DDD; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .app-bar h1 { margin: 0; font-size: 14px; font-weight: 900; letter-spacing: 1px; }

        /* --- MAIN CONTENT AREAS --- */
        .scroll-area { flex-grow: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .container { max-width: 600px; margin: 0 auto; }
        
        .tool-row { display: grid; grid-template-columns: 30px 70px 1fr 60px 40px; gap: 10px; align-items: center; background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; border: 1px solid #EEE; }
        .drag-handle { color: #CCC; cursor: grab; font-size: 20px; }

        /* --- MODALS --- */
        .modal { display: none; position: fixed; inset: 0; background: white; z-index: 2000; padding: 20px; overflow-y: auto; }
        input { width: 100%; background: #F2F2F7; border: 1px solid #E5E5EA; border-radius: 12px; padding: 16px; margin-bottom: 10px; font-size: 16px; font-weight: 600; outline: none; }
        .btn { background: #000; color: white; border: none; border-radius: 12px; padding: 18px; width: 100%; font-weight: 800; cursor: pointer; }
        .btn-sec { background: #E5E5EA; color: black; margin-top: 8px; }

        /* --- PREVIEW FIX (Der Download-Retter) --- */
        #modal-prev { background: #1C1C1E; padding: 0; display: none; flex-direction: column; }
        .prev-header { background: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; z-index: 3000; flex-shrink: 0; }
        .prev-body { flex-grow: 1; overflow-y: auto; display: flex; justify-content: center; padding: 20px 0; }
        
        /* Das PDF-Dokument in der Vorschau */
        .pdf-view-wrap { background: white; width: 210mm; min-height: 297mm; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.4); transform-origin: top center; flex-shrink: 0; }

        /* --- PDF MASTER TEMPLATE --- */
        #pdf-hidden-render { position: absolute; left: -9999px; top: 0; width: 210mm; }
        .pdf-page { background: white; padding: 15mm; width: 210mm; min-height: 297mm; color: black; }
        .pdf-border { border: 2pt solid #000; min-height: 265mm; padding: 10mm; display: flex; flex-direction: column; }
        .pdf-header { border-bottom: 4pt solid #000; padding-bottom: 10px; margin-bottom: 25px; }
        .pdf-label { font-size: 18pt; font-weight: 700; color: #888; text-transform: uppercase; }
        .pdf-main-num { font-size: 44pt; font-weight: 900; display: block; letter-spacing: -2pt; line-height: 1; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .pdf-table th { text-align: left; padding: 10pt 5pt; font-size: 9pt; font-weight: 900; color: #999; border-bottom: 2pt solid #000; text-transform: uppercase; }
        .pdf-table td { padding: 14pt 5pt; font-size: 11pt; font-weight: 700; border-bottom: 0.5pt solid #EEE; }
    </style>
</head>
<body>

<div id="view-home" style="display:contents;">
    <div class="app-bar"><h1>PROJECTS</h1></div>
    <div class="scroll-area"><div id="project-list" class="container"></div></div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; height:60px; border-radius:30px; z-index:100;" onclick="openM('modal-p')">+</button>
</div>

<div id="view-detail" style="display:none; flex-direction:column; height:100vh;">
    <div class="app-bar">
        <button onclick="goHome()" style="background:none; border:none; font-size:24px;">←</button>
        <div style="text-align:right;"><span id="det-num" style="font-weight:900; font-size:18px;"></span><br><small id="det-name" style="color:#888; text-transform:uppercase;"></small></div>
    </div>
    <div class="scroll-area">
        <div class="container">
            <button class="btn" style="background:var(--accent);" onclick="openM('modal-import')">IMPORTIEREN</button>
            <div id="tool-list" style="margin-top:15px;"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
                <button class="btn" onclick="openPreview()">VORSCHAU</button>
                <button class="btn btn-sec" onclick="clearTools()" style="color:red;">LEEREN</button>
            </div>
        </div>
    </div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; height:60px; border-radius:30px; z-index:100;" onclick="openTModal()">+</button>
</div>

<div id="modal-prev" class="modal">
    <div class="prev-header">
        <button onclick="closeModal('modal-prev')" style="border:none; background:none; font-weight:800; font-size:16px;">← ZURÜCK</button>
        <button id="download-btn" onclick="downloadPDF()" style="background:#000; color:white; border:none; padding:12px 25px; border-radius:10px; font-weight:900;">PDF SPEICHERN</button>
    </div>
    <div class="prev-body">
        <div id="preview-stage" class="pdf-view-wrap"></div>
    </div>
</div>

<div id="pdf-hidden-render">
    <div id="pdf-master" class="pdf-page">
        <div class="pdf-border">
            <div class="pdf-header">
                <span id="pdf-v-name" class="pdf-label"></span>
                <span id="pdf-v-num" class="pdf-main-num"></span>
            </div>
            <table class="pdf-table">
                <thead>
                    <tr>
                        <th style="width:15%">T-NR</th>
                        <th style="width:70%">WERKZEUGNAME / KOMMENTAR</th>
                        <th style="width:15%; text-align:right;">Ø</th>
                    </tr>
                </thead>
                <tbody id="pdf-v-body"></tbody>
            </table>
        </div>
    </div>
</div>

<div id="modal-p" class="modal">
    <h2>Neues Projekt</h2>
    <input id="p-in-num" placeholder="Zeichnungs-Nummer (Groß)">
    <input id="p-in-name" placeholder="Bauteil Name (Klein)">
    <button class="btn" onclick="saveProject()">Speichern</button>
    <button class="btn btn-sec" onclick="closeModal('modal-p')">Abbrechen</button>
</div>

<div id="modal-t" class="modal">
    <h2>Werkzeug</h2>
    <input type="hidden" id="t-idx">
    <input id="t-in-id" placeholder="T-Nummer">
    <input id="t-in-nm" placeholder="Bezeichnung">
    <input id="t-in-diam" placeholder="Ø Durchmesser">
    <button class="btn" onclick="saveTool()">Speichern</button>
    <button class="btn btn-sec" onclick="closeModal('modal-t')">Abbrechen</button>
</div>

<div id="modal-import" class="modal">
    <h2>Schnell-Import</h2>
    <textarea id="import-area" style="width:100%; height:200px; border-radius:12px; padding:10px; font-weight:600;" placeholder="T-Codes hier einfügen..."></textarea>
    <button class="btn" style="margin-top:10px;" onclick="runImport()">Einlesen</button>
    <button class="btn btn-sec" onclick="closeModal('modal-import')">Abbrechen</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v10')) || [];
    let curP = null;

    const openM = (id) => { document.getElementById(id).style.display = (id === 'modal-prev' ? 'flex' : 'block'); };
    const closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    const save = () => localStorage.setItem('qs_v10', JSON.stringify(db));

    function renderHome() {
        const list = document.getElementById('project-list'); list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="tool-row" style="grid-template-columns: 1fr 40px;" onclick="openDetail(${i})">
                <div><b style="font-size:18px;">${p.num}</b><br><small style="color:#888; font-weight:700;">${p.name}</small></div>
                <button onclick="event.stopPropagation(); deleteProject(${i})" style="border:none; background:none; color:red;">✕</button>
            </div>`;
        });
    }

    function openDetail(i) {
        curP = i;
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'flex';
        document.getElementById('det-num').innerText = db[i].num;
        document.getElementById('det-name').innerText = db[i].name;
        renderTools();
    }

    function renderTools() {
        const list = document.getElementById('tool-list'); list.innerHTML = "";
        db[curP].tools.forEach((t, i) => {
            list.innerHTML += `<div class="tool-row" onclick="editT(${i})">
                <div class="drag-handle">☰</div>
                <div style="font-weight:900; color:var(--accent);">${t.id}</div>
                <div style="font-weight:600;">${t.nm}</div>
                <div style="font-weight:800; opacity:0.4; text-align:right;">${t.diam || '-'}</div>
                <button onclick="event.stopPropagation(); delT(${i})" style="border:none; background:none; color:red;">✕</button>
            </div>`;
        });
        new Sortable(list, { handle:'.drag-handle', animation:150, onEnd: () => {
            const rows = Array.from(list.querySelectorAll('.tool-row'));
            db[curP].tools = rows.map(row => {
                const tid = row.children[1].innerText;
                return db[curP].tools.find(t => t.id === tid);
            });
            save();
        }});
    }

    function openPreview() {
        document.getElementById('pdf-v-name').innerText = db[curP].name;
        document.getElementById('pdf-v-num').innerText = db[curP].num;
        const b = document.getElementById('pdf-v-body'); b.innerHTML = "";
        db[curP].tools.forEach(t => { 
            b.innerHTML += `<tr><td style="font-weight:900;">${t.id}</td><td>${t.nm}</td><td style="text-align:right; font-weight:800;">${t.diam || ''}</td></tr>`; 
        });
        document.getElementById('preview-stage').innerHTML = document.getElementById('pdf-master').outerHTML;
        openM('modal-prev');
    }

    function downloadPDF() {
        const btn = document.getElementById('download-btn');
        btn.innerText = "GENERIEREN...";
        const element = document.getElementById('pdf-master');
        const opt = { 
            margin: 0, 
            filename: `${db[curP].num}.pdf`, 
            html2canvas: { scale: 3, useCORS: true }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };
        html2pdf().set(opt).from(element).save().then(() => { btn.innerText = "PDF SPEICHERN"; });
    }

    function saveProject() {
        const name = document.getElementById('p-in-name').value;
        const num = document.getElementById('p-in-num').value;
        if(!num) return alert("Nummer fehlt!");
        db.push({name, num, tools:[]}); save(); renderHome(); closeModal('modal-p');
    }

    function saveTool() {
        const id = document.getElementById('t-in-id').value;
        const diam = document.getElementById('t-in-diam').value;
        const nm = document.getElementById('t-in-nm').value;
        const idx = document.getElementById('t-idx').value;
        if(!id) return alert("T-Nummer fehlt!");
        if(idx === "") db[curP].tools.push({id, diam, nm}); else db[curP].tools[idx] = {id, diam, nm};
        save(); renderTools(); closeModal('modal-t');
    }

    function editT(i) {
        document.getElementById('t-idx').value = i;
        document.getElementById('t-in-id').value = db[curP].tools[i].id;
        document.getElementById('t-in-nm').value = db[curP].tools[i].nm;
        document.getElementById('t-in-diam').value = db[curP].tools[i].diam || '';
        openM('modal-t');
    }

    function runImport() {
        const lines = document.getElementById('import-area').value.split('\n');
        let tid = null; let tnm = [];
        lines.forEach(l => {
            if(/^[T][0-9]/i.test(l)) {
                if(tid) db[curP].tools.push({id: tid, diam: '', nm: tnm.join(' ')});
                tid = l.trim().toUpperCase(); tnm = [];
            } else if(tid) tnm.push(l.trim());
        });
        if(tid) db[curP].tools.push({id: tid, diam: '', nm: tnm.join(' ')});
        save(); renderTools(); closeModal('modal-import');
    }

    function goHome() { document.getElementById('view-home').style.display='contents'; document.getElementById('view-detail').style.display='none'; renderHome(); }
    function deleteProject(i) { if(confirm("Projekt löschen?")) { db.splice(i,1); save(); renderHome(); } }
    function delT(i) { if(confirm("Löschen?")) { db[curP].tools.splice(i,1); save(); renderTools(); } }
    function clearTools() { if(confirm("Alles leeren?")) { db[curP].tools = []; save(); renderTools(); } }
    function openTModal() { document.getElementById('t-idx').value=""; document.getElementById('t-in-id').value=""; document.getElementById('t-in-diam').value=""; document.getElementById('t-in-nm').value=""; openM('modal-t'); }

    renderHome();
</script>
</body>
</html>
