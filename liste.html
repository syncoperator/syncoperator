<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL CORE v2.8</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #000; --bg: #FFF; --border: #000; --soft: #F2F2F7; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--accent); margin: 0; padding: 0; }
        .app-shell { max-width: 600px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        .top-bar { padding: 40px 20px 20px; border-bottom: 5px solid var(--accent); display: flex; justify-content: space-between; align-items: flex-end; }
        .top-bar h1 { font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase; }

        .proj-card { border: 2px solid #000; margin: 10px 20px; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: #fff; }
        
        .tool-row { 
            border: 2px solid var(--border); margin: 8px 15px; padding: 12px; 
            display: grid; grid-template-columns: 30px 80px 1fr 40px; 
            gap: 10px; align-items: center; background: #fff;
        }
        .t-num { font-weight: 900; border-right: 2px solid #000; cursor: pointer; font-size: 16px; }
        .t-name { font-weight: 700; text-transform: uppercase; cursor: pointer; word-break: break-all; font-size: 13px; line-height: 1.3; }
        .g-highlight { color: #d32f2f; font-weight: 900; }

        .btn-black { background: #000; color: #fff; border: none; padding: 15px; font-weight: 900; text-transform: uppercase; cursor: pointer; width: 100%; }
        .btn-import-trigger { background: #000; color: #fff; border: 2px solid #000; padding: 12px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase; }
        
        input, textarea { width: 100%; border: 2px solid #000; padding: 12px; font-size: 16px; font-weight: bold; box-sizing: border-box; margin-bottom: 10px; font-family: inherit; }
        .fab { position: fixed; bottom: 30px; right: 20px; background: #000; color: #fff; border: none; width: 60px; height: 60px; font-size: 30px; border-radius: 50%; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        .modal { display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; padding: 20px; overflow-y: auto; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="view-dash" class="app-shell">
    <div class="top-bar">
        <div><h1>DATABASE</h1><span>WERKZEUGE</span></div>
        <button onclick="exportData()" style="font-size:10px; border:1px solid #000; background:none; padding:5px;">BACKUP</button>
    </div>
    <div id="project-list" style="margin-top:20px;"></div>
    <button class="fab" onclick="openM_P()">+</button>
</div>

<div id="view-detail" class="app-shell hidden">
    <div class="top-bar">
        <button onclick="closeDetail()" style="background:none; border:none; font-size:24px; font-weight:900;">←</button>
        <div style="text-align:right;"><h1 id="title-head" style="font-size:20px; margin:0;"></h1><span id="zn-head" style="font-weight:bold; opacity:0.7;"></span></div>
    </div>
    
    <div style="padding: 15px 15px 5px;">
        <button class="btn-import-trigger" onclick="openM('modal-import')">LISTE IMPORTIEREN</button>
    </div>

    <div id="tool-list"></div>
    
    <div style="padding:20px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <button class="btn-black" onclick="openPreview()">PDF VORSCHAU</button>
        <button class="btn-black" style="background:#cc0000;" onclick="clearTools()">LEEREN</button>
    </div>
    <button class="fab" onclick="openM_T()">+</button>
</div>

<div id="modal-import" class="modal">
    <h1>IMPORT</h1>
    <textarea id="import-area" rows="15" placeholder="T-Text hier einfügen..."></textarea>
    <button class="btn-black" onclick="processImport()">DATEN VERARBEITEN</button>
    <button onclick="closeM('modal-import')" style="width:100%; background:none; border:none; margin-top:20px; font-weight:bold; text-decoration: underline;">ABBRECHEN</button>
</div>

<div id="modal-p" class="modal">
    <h1 id="p-modal-title">NEUE ZEICHNUNG</h1>
    <input type="hidden" id="p-edit-idx">
    <input type="text" id="p-bz" placeholder="BEZEICHNUNG (z.B. BUCHSE)">
    <input type="text" id="p-zn" placeholder="ZEICHNUNGSNUMMER (z.B. 233562RO.O)">
    <button class="btn-black" onclick="saveProject()">SPEICHERN</button>
    <button onclick="closeM('modal-p')" style="width:100%; background:none; border:none; margin-top:20px;">ABBRECHEN</button>
</div>

<div id="modal-t" class="modal">
    <h1 id="t-modal-title">WERKZEUG</h1>
    <input type="hidden" id="t-edit-idx">
    <input type="text" id="t-id" placeholder="T-NR">
    <input type="text" id="t-name" placeholder="NAME / NULLPUNKT">
    <button class="btn-black" onclick="saveT()">SPEICHERN</button>
    <button onclick="closeM('modal-t')" style="width:100%; background:none; border:none; margin-top:20px;">ABBRECHEN</button>
</div>

<div id="modal-prev" class="modal">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
        <button onclick="closeM('modal-prev')" style="border:2px solid #000; background:none; padding:10px;">ZURÜCK</button>
        <button class="btn-black" onclick="downloadPDF()" style="width:auto; padding:10px 20px;">PDF DRUCKEN</button>
    </div>
    <div id="pdf-view-box" style="border:1px solid #000; zoom:0.5; background:#fff;"></div>
</div>

<div id="pdf-content" style="display:none; padding:40px; font-family: 'Courier', monospace; color: #000;">
    <div style="border-bottom: 5px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
        <h1 id="pdf-main-title" style="margin:0; font-size:28px; text-transform: uppercase;"></h1>
        <p id="pdf-zn-sub" style="margin:5px 0 0 0; font-weight:bold; font-size:20px;"></p>
    </div>
    <table style="width:100%; border-collapse: collapse;">
        <thead>
            <tr style="background: #f0f0f0;">
                <th style="border:2px solid #000; padding:12px; text-align:left; width:15%;">T-NR</th>
                <th style="border:2px solid #000; padding:12px; text-align:left;">WERKZEUGNAME / KOMMENTAR</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('tool_db_v28')) || [];
    let curIdx = null;

    const save = () => localStorage.setItem('tool_db_v28', JSON.stringify(db));
    const openM = (id) => document.getElementById(id).style.display = 'block';
    const closeM = (id) => document.getElementById(id).style.display = 'none';

    function renderDash() {
        const list = document.getElementById('project-list');
        list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="proj-card"><div onclick="showDetail(${i})" style="flex-grow:1;"><b>${p.bz}</b><br><small>${p.zn}</small></div><button onclick="openM_P(${i})" style="margin-right:15px; border:none; background:none; font-size:20px;">✎</button><button onclick="delP(${i})" style="border:none; background:none; color:red; font-size:20px;">✕</button></div>`;
        });
    }

    function processImport() {
        const text = document.getElementById('import-area').value;
        const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        let foundTools = []; let currentT = null; let currentDesc = [];
        lines.forEach(line => {
            if (/^[T][O0-9]/i.test(line)) {
                if (currentT) foundTools.push({ tid: currentT, tnm: currentDesc.join(' ').trim(), tnt: "" });
                currentT = line.toUpperCase(); currentDesc = [];
            } else if (currentT) { currentDesc.push(line); }
        });
        if (currentT) foundTools.push({ tid: currentT, tnm: currentDesc.join(' ').trim(), tnt: "" });
        db[curIdx].tools = [...db[curIdx].tools, ...foundTools];
        save(); renderTools(); closeM('modal-import');
        document.getElementById('import-area').value = "";
    }

    function renderTools() {
        const list = document.getElementById('tool-list');
        list.innerHTML = "";
        db[curIdx].tools.forEach((t, i) => {
            let dName = t.tnm.replace(/(G5[4-9])/gi, '<span class="g-highlight">$1</span>');
            list.innerHTML += `<div class="tool-row" data-id="${i}"><div class="drag-handle">☰</div><div class="t-num" onclick="openM_T(${i})">${t.tid}</div><div class="t-name" onclick="openM_T(${i})">${dName}</div><button onclick="delT(${i})" style="border:none; background:none; color:red;">✕</button></div>`;
        });
    }

    function showDetail(i) {
        curIdx = i;
        document.getElementById('view-dash').classList.add('hidden');
        document.getElementById('view-detail').classList.remove('hidden');
        document.getElementById('title-head').innerText = db[i].bz;
        document.getElementById('zn-head').innerText = db[i].zn;
        renderTools();
    }

    function openM_P(idx = null) {
        if(idx !== null) {
            document.getElementById('p-edit-idx').value = idx;
            document.getElementById('p-zn').value = db[idx].zn;
            document.getElementById('p-bz').value = db[idx].bz;
        } else {
            document.getElementById('p-edit-idx').value = "";
            document.getElementById('p-zn').value = "";
            document.getElementById('p-bz').value = "";
        }
        openM('modal-p');
    }

    function saveProject() {
        let zn = document.getElementById('p-zn').value, bz = document.getElementById('p-bz').value, idx = document.getElementById('p-edit-idx').value;
        if(!bz) return;
        if(idx !== "") { db[idx].zn = zn; db[idx].bz = bz; }
        else { db.push({ zn, bz, tools: [] }); }
        save(); closeM('modal-p'); renderDash();
    }

    function openPreview() {
        const p = db[curIdx];
        document.getElementById('pdf-main-title').innerText = p.bz || "OHNE NAME";
        document.getElementById('pdf-zn-sub').innerText = p.zn || "";
        const tbody = document.getElementById('pdf-body');
        tbody.innerHTML = "";
        p.tools.forEach(t => {
            tbody.innerHTML += `<tr><td style="border:2px solid #000; padding:12px; font-weight:bold;">${t.tid}</td><td style="border:2px solid #000; padding:12px;">${t.tnm}</td></tr>`;
        });
        const content = document.getElementById('pdf-content');
        content.style.display = 'block';
        document.getElementById('pdf-view-box').innerHTML = content.outerHTML;
        content.style.display = 'none';
        openM('modal-prev');
    }

    function downloadPDF() {
        const el = document.querySelector('#pdf-view-box div');
        html2pdf().set({ margin:10, filename: `${db[curIdx].bz}_${db[curIdx].zn}.pdf`, html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'a4'} }).from(el).save();
    }

    function saveT() {
        let tid = document.getElementById('t-id').value, tnm = document.getElementById('t-name').value, idx = document.getElementById('t-edit-idx').value;
        if(!tid) return;
        if(idx !== "") db[curIdx].tools[idx] = { tid, tnm, tnt: "" };
        else db[curIdx].tools.push({ tid, tnm, tnt: "" });
        save(); renderTools(); closeM('modal-t');
    }

    function openM_T(idx = null) {
        if(idx !== null) {
            let t = db[curIdx].tools[idx];
            document.getElementById('t-edit-idx').value = idx;
            document.getElementById('t-id').value = t.tid;
            document.getElementById('t-name').value = t.tnm;
        } else {
            document.getElementById('t-edit-idx').value = "";
            document.getElementById('t-id').value = "";
            document.getElementById('t-name').value = "";
        }
        openM('modal-t');
    }

    function closeDetail() { document.getElementById('view-dash').classList.remove('hidden'); document.getElementById('view-detail').classList.add('hidden'); renderDash(); }
    function delP(i) { if(confirm("Löschen?")) { db.splice(i,1); save(); renderDash(); } }
    function delT(i) { db[curIdx].tools.splice(i,1); save(); renderTools(); }
    function clearTools() { if(confirm("Liste leeren?")) { db[curIdx].tools = []; save(); renderTools(); } }
    function exportData() {
        const blob = new Blob([JSON.stringify(db)], {type: "application/json"});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = "QS_Tool_Backup.json"; a.click();
    }

    new Sortable(document.getElementById('tool-list'), { handle: '.drag-handle', animation: 150 });
    renderDash();
</script>
</body>
</html>
