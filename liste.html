<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL STABLE v14.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --accent: #007AFF; --bg: #F2F2F7; }
        
        /* --- ОСНОВНОЙ КАРКАС (КАК В V11) --- */
        html, body { height: 100%; margin: 0; overflow: hidden; background: var(--bg); font-family: 'Inter', sans-serif; }
        .app-viewport { display: flex; flex-direction: column; height: 100%; }
        .app-bar { background: white; padding: 12px 20px; border-bottom: 1px solid #DDD; display: flex; justify-content: space-between; align-items: center; z-index: 100; flex-shrink: 0; }
        .scroll-content { flex-grow: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .container { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }

        /* --- СПИСОК И КАРТОЧКИ --- */
        .tool-card { display: grid; grid-template-columns: 30px 60px 1fr 40px 40px; gap: 8px; align-items: center; background: white; border-radius: 12px; padding: 12px; margin-bottom: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #EEE; }
        .drag-handle { color: #BBB; cursor: grab; font-size: 20px; padding: 5px; touch-action: none; } /* Важно для тач-устройств */

        /* --- КНОПКА ПЛЮС --- */
        .fab { position: fixed; bottom: 30px; right: 20px; width: 60px; height: 60px; border-radius: 30px; background: black; color: white; border: none; font-size: 32px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 500; display: flex; align-items: center; justify-content: center; }

        /* --- МОДАЛЬНЫЕ ОКНА (Исправлены) --- */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal-card { background: white; width: 100%; max-width: 400px; border-radius: 16px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto; }
        
        /* ПРЕВЬЮ МОДАЛКА (На весь экран) */
        #modal-prev { background: #1C1C1E; padding: 0; display: none; flex-direction: column; }
        .prev-header { background: white; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .prev-body { flex-grow: 1; width: 100%; overflow-y: auto; display: flex; justify-content: center; padding: 20px; }
        
        /* Стили для формы */
        input, textarea { width: 100%; background: #F2F2F7; border: 1px solid #E5E5EA; border-radius: 10px; padding: 14px; margin-bottom: 10px; font-size: 16px; font-weight: 600; outline: none; }
        .btn { background: #000; color: white; border: none; border-radius: 12px; padding: 16px; width: 100%; font-weight: 800; font-size: 15px; cursor: pointer; }
        
        /* --- PDF ШАБЛОН --- */
        .pdf-view { background: white; width: 210mm; min-height: 297mm; padding: 12mm; box-shadow: 0 10px 30px rgba(0,0,0,0.5); transform: scale(0.45); transform-origin: top center; margin-bottom: 20px; }
        
        /* Стили внутри PDF */
        .pdf-border { border: 2pt solid #000; min-height: 270mm; padding: 8mm; display: flex; flex-direction: column; }
        .pdf-header { border-bottom: 3pt solid #000; padding-bottom: 10px; margin-bottom: 15px; }
        .pdf-table { width: 100%; border-collapse: collapse; }
        .pdf-table th { text-align: left; padding: 8pt 4pt; font-size: 9pt; border-bottom: 2pt solid #000; color: #999; font-weight: 900; }
        .pdf-table td { padding: 9pt 4pt; font-size: 11pt; font-weight: 700; border-bottom: 0.5pt solid #EEE; }

        /* ВРЕМЕННЫЙ КОНТЕЙНЕР ДЛЯ ГЕНЕРАЦИИ (ЧТОБЫ НЕ БЫЛО БЕЛОГО ЛИСТА) */
        #temp-print-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 9999; display: flex; justify-content: center; align-items: flex-start;
            overflow: auto; pointer-events: none; opacity: 0; /* Скрыт, но существует */
        }
    </style>
</head>
<body>

<div class="app-viewport" id="view-home">
    <div class="app-bar"><h1>PROJEKTE</h1></div>
    <div class="scroll-content"><div id="project-list" class="container"></div></div>
    <button class="fab" onclick="openModal('modal-p')">+</button>
</div>

<div class="app-viewport" id="view-detail" style="display:none;">
    <div class="app-bar">
        <button onclick="goHome()" style="background:none; border:none; font-size:24px;">←</button>
        <div style="text-align:right;"><span id="det-num" style="font-weight:900;"></span><br><small id="det-name" style="color:#888; text-transform:uppercase;"></small></div>
    </div>
    <div class="scroll-content">
        <div class="container">
            <button class="btn" style="background:var(--accent); margin-bottom:15px;" onclick="openModal('modal-import')">SCHNELL-IMPORT</button>
            <div id="tool-list"></div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
                <button class="btn" onclick="openPreview()">VORSCHAU</button>
                <button class="btn" style="background:#EEE; color:red;" onclick="clearTools()">LEEREN</button>
            </div>
        </div>
    </div>
    <button class="fab" onclick="openTModal()">+</button>
</div>

<div id="modal-p" class="modal">
    <div class="modal-card">
        <h3>Neues Projekt</h3>
        <input id="p-in-num" placeholder="Zeichnungs-Nr">
        <input id="p-in-name" placeholder="Bauteil Name">
        <button class="btn" onclick="saveProject()">Speichern</button>
        <button class="btn" style="background:none; color:#888; margin-top:10px;" onclick="closeModal('modal-p')">Abbrechen</button>
    </div>
</div>

<div id="modal-t" class="modal">
    <div class="modal-card">
        <h3>Werkzeug</h3>
        <input type="hidden" id="t-idx">
        <input id="t-in-id" placeholder="T-Nummer">
        <input id="t-in-nm" placeholder="Bezeichnung">
        <input id="t-in-diam" placeholder="Ø Durchmesser">
        <button class="btn" onclick="saveTool()">Speichern</button>
        <button class="btn" style="background:none; color:#888; margin-top:10px;" onclick="closeModal('modal-t')">Abbrechen</button>
    </div>
</div>

<div id="modal-import" class="modal">
    <div class="modal-card">
        <h3>Import</h3>
        <textarea id="import-area" style="height:150px;"></textarea>
        <button class="btn" onclick="runImport()">Einlesen</button>
        <button class="btn" style="background:none; color:#888; margin-top:10px;" onclick="closeModal('modal-import')">Abbrechen</button>
    </div>
</div>

<div id="modal-prev" class="modal">
    <div class="prev-header">
        <button onclick="closeModal('modal-prev')" style="border:none; background:none; font-weight:800; font-size:16px;">← ZURÜCK</button>
        <button id="download-btn" onclick="downloadPDF()" style="background:#000; color:white; border:none; padding:10px 20px; border-radius:8px; font-weight:900;">PDF SPEICHERN</button>
    </div>
    <div class="prev-body">
        <div id="preview-stage" class="pdf-view"></div>
    </div>
</div>

<div id="temp-print-overlay"></div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v14')) || [];
    let curP = null;

    // UI Helpers
    const openModal = (id) => { 
        document.getElementById(id).style.display = (id === 'modal-prev' ? 'flex' : 'flex'); 
    };
    const closeModal = (id) => { document.getElementById(id).style.display = 'none'; };
    const save = () => localStorage.setItem('qs_v14', JSON.stringify(db));

    // --- LOGIC ---
    function renderHome() {
        const list = document.getElementById('project-list'); list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="tool-card" style="grid-template-columns: 1fr 40px;" onclick="openDetail(${i})">
                <div><b style="font-size:18px;">${p.num}</b><br><small style="color:#888;">${p.name}</small></div>
                <button onclick="event.stopPropagation(); deleteProject(${i})" style="border:none; background:none; color:red;">✕</button>
            </div>`;
        });
    }

    function openDetail(i) {
        curP = i;
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'flex'; // Flex для layout
        document.getElementById('det-num').innerText = db[i].num;
        document.getElementById('det-name').innerText = db[i].name;
        renderTools();
    }

    function renderTools() {
        const list = document.getElementById('tool-list'); list.innerHTML = "";
        db[curP].tools.forEach((t, i) => {
            list.innerHTML += `<div class="tool-card" onclick="editT(${i})">
                <div class="drag-handle">☰</div>
                <div style="font-weight:900; color:var(--accent);">${t.id}</div>
                <div style="font-weight:600;">${t.nm}</div>
                <div style="font-weight:800; opacity:0.3; text-align:right;">${t.diam || ''}</div>
                <button onclick="event.stopPropagation(); delT(${i})" style="border:none; background:none; color:red;">✕</button>
            </div>`;
        });
        
        // Re-init sortable safely
        new Sortable(list, { 
            handle: '.drag-handle', 
            animation: 150, 
            onEnd: () => {
                const rows = Array.from(list.querySelectorAll('.tool-card'));
                db[curP].tools = rows.map(row => {
                    const tid = row.children[1].innerText;
                    return db[curP].tools.find(t => t.id === tid);
                });
                save();
            }
        });
    }

    function getPDFContent() {
        let rows = db[curP].tools.map(t => `<tr><td style="font-weight:900;">${t.id}</td><td>${t.nm}</td><td style="text-align:right;">${t.diam || ''}</td></tr>`).join('');
        return `<div class="pdf-border">
            <div class="pdf-header">
                <div style="font-size:16pt; color:#888; font-weight:700;">${db[curP].name}</div>
                <div style="font-size:42pt; font-weight:900;">${db[curP].num}</div>
            </div>
            <table class="pdf-table">
                <thead><tr><th style="width:15%">T-NR</th><th style="width:70%">WERKZEUGNAME / KOMMENTAR</th><th style="width:15%; text-align:right;">Ø</th></tr></thead>
                <tbody>${rows}</tbody>
            </table>
        </div>`;
    }

    function openPreview() {
        document.getElementById('preview-stage').innerHTML = getPDFContent();
        openModal('modal-prev');
    }

    async function downloadPDF() {
        const btn = document.getElementById('download-btn');
        btn.innerText = "LÄDT...";
        
        // 1. Создаем клон для печати в чистом слое
        const overlay = document.getElementById('temp-print-overlay');
        overlay.innerHTML = `<div style="width:210mm; padding:10mm; background:white;">${getPDFContent()}</div>`;
        
        // 2. Делаем слой "видимым" для html2canvas, но прозрачным для глаза
        overlay.style.opacity = "1"; 
        
        const element = overlay.firstElementChild;
        
        const opt = { 
            margin: 0, 
            filename: `Setup_${db[curP].num}.pdf`, 
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true, logging: false }, 
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
        };

        try {
            await html2pdf().set(opt).from(element).save();
        } catch (e) {
            alert("Ошибка сохранения");
        } finally {
            btn.innerText = "PDF SPEICHERN";
            overlay.innerHTML = ""; // Очищаем
            overlay.style.opacity = "0";
        }
    }

    // CRUD
    function saveProject() { const name=document.getElementById('p-in-name').value; const num=document.getElementById('p-in-num').value; if(num){db.push({name,num,tools:[]});save();renderHome();closeModal('modal-p');} }
    function saveTool() { const id=document.getElementById('t-in-id').value; const nm=document.getElementById('t-in-nm').value; const diam=document.getElementById('t-in-diam').value; const idx=document.getElementById('t-idx').value; 
        if(idx===""){db[curP].tools.push({id,nm,diam})}else{db[curP].tools[idx]={id,nm,diam}}; save(); renderTools(); closeModal('modal-t'); 
    }
    function editT(i) { document.getElementById('t-idx').value=i; document.getElementById('t-in-id').value=db[curP].tools[i].id; document.getElementById('t-in-nm').value=db[curP].tools[i].nm; document.getElementById('t-in-diam').value=db[curP].tools[i].diam||''; openModal('modal-t'); }
    function runImport() { const l=document.getElementById('import-area').value.split('\n'); let tid=null; let tnm=[]; l.forEach(line=>{ if(/^[T][0-9]/i.test(line)){ if(tid)db[curP].tools.push({id:tid,nm:tnm.join(' '),diam:''}); tid=line.trim().toUpperCase(); tnm=[]; }else if(tid){tnm.push(line.trim())} }); if(tid)db[curP].tools.push({id:tid,nm:tnm.join(' '),diam:''}); save(); renderTools(); closeModal('modal-import'); }
    function delT(i) { db[curP].tools.splice(i,1); save(); renderTools(); }
    function deleteProject(i) { if(confirm("Löschen?")) { db.splice(i,1); save(); renderHome(); } }
    function clearTools() { if(confirm("Alles löschen?")) { db[curP].tools=[]; save(); renderTools(); } }
    function goHome() { document.getElementById('view-detail').style.display='none'; document.getElementById('view-home').style.display='flex'; renderHome(); }
    function openTModal() { document.getElementById('t-idx').value=""; document.getElementById('t-in-id').value=""; document.getElementById('t-in-nm').value=""; document.getElementById('t-in-diam').value=""; openModal('modal-t'); }

    renderHome();
</script>
</body>
</html>
