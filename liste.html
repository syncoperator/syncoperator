<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL PREMIUM v7.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        :root { --accent: #007AFF; --bg: #F8F9FA; --card: #FFFFFF; --text: #1C1C1E; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* UI App Design */
        .app-bar { background: white; padding: 20px; border-bottom: 1px solid #E5E5E5; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
        .app-bar h1 { margin: 0; font-size: 18px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; }
        .container { max-width: 650px; margin: 0 auto; padding: 15px; }
        
        .tool-row { display: grid; grid-template-columns: 30px 60px 50px 1fr 40px; gap: 12px; align-items: center; background: white; border-radius: 12px; padding: 15px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); border: 1px solid #EEE; }
        .drag-handle { color: #CCC; cursor: grab; font-size: 20px; }
        
        /* Modal Design */
        .modal { display: none; position: fixed; inset: 0; background: white; z-index: 1000; padding: 30px; }
        input, textarea { width: 100%; background: #F2F2F7; border: 1px solid #E5E5EA; border-radius: 10px; padding: 16px; margin-bottom: 15px; font-size: 16px; font-weight: 600; outline: none; }
        .btn { background: #000; color: white; border: none; border-radius: 12px; padding: 18px; width: 100%; font-weight: 800; cursor: pointer; transition: 0.2s; }
        .btn:active { transform: scale(0.97); }

        /* --- HIGH-END PDF LAYOUT --- */
        #pdf-render { width: 210mm; height: 297mm; background: white; padding: 15mm; display: none; }
        .premium-border { border: 1.5pt solid #000; height: 100%; padding: 12mm; display: flex; flex-direction: column; position: relative; }
        
        .pdf-header { display: flex; align-items: baseline; border-bottom: 3.5pt solid #000; padding-bottom: 15px; margin-bottom: 30px; }
        .pdf-name { font-size: 44pt; font-weight: 900; text-transform: uppercase; margin-right: 18pt; letter-spacing: -2pt; color: #000; }
        .pdf-num { font-size: 24pt; font-weight: 700; color: #555555; } /* Helleres, fettes Grau */
        
        .pdf-table { width: 100%; border-collapse: collapse; }
        .pdf-table th { text-align: left; padding: 10pt 8pt; font-size: 9pt; font-weight: 900; text-transform: uppercase; letter-spacing: 1.5pt; color: #888; border-bottom: 1.5pt solid #000; }
        .pdf-table td { padding: 15pt 8pt; font-size: 12pt; font-weight: 700; border-bottom: 0.5pt solid #E5E5E5; color: #1A1A1A; }
        .pdf-table tr:last-child td { border-bottom: 1.5pt solid #000; } /* Abschlusslinie */
        
        .col-t { width: 15%; }
        .col-diam { width: 15%; }
        .col-desc { width: 70%; }
    </style>
</head>
<body>

<div id="view-home">
    <div class="app-bar"><h1>Tool Database</h1><button onclick="exportJSON()" style="font-size:10px; opacity:0.5;">BACKUP</button></div>
    <div class="container" id="project-list"></div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; border-radius:30px;" onclick="openPModal()">+</button>
</div>

<div id="view-detail" style="display:none;">
    <div class="app-bar">
        <button onclick="goHome()" style="background:none; border:none; font-size:24px;">←</button>
        <div style="text-align:right;"><span id="det-name" style="font-weight:900;"></span><br><small id="det-num" style="color:#555; font-weight:700;"></small></div>
    </div>
    <div class="container">
        <button class="btn" style="background:#007AFF;" onclick="openModal('modal-import')">IMPORT DATEN</button>
        <div id="tool-list" style="margin-top:20px;"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
            <button class="btn" onclick="openPreview()">PREVIEW</button>
            <button class="btn" style="background:#F2F2F7; color:#FF3B30;" onclick="clearTools()">LEEREN</button>
        </div>
    </div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; border-radius:30px;" onclick="openTModal()">+</button>
</div>

<div id="modal-p" class="modal">
    <h2 style="font-weight:900;">Projekt</h2>
    <input id="p-in-name" placeholder="Bauteil (z.B. BUCHSE)">
    <input id="p-in-num" placeholder="Nummer (z.B. 233562)">
    <button class="btn" onclick="saveProject()">Speichern</button>
    <button class="btn" style="background:none; color:black;" onclick="closeModal('modal-p')">Abbrechen</button>
</div>

<div id="modal-t" class="modal">
    <h2 style="font-weight:900;">Werkzeug</h2>
    <input type="hidden" id="t-idx">
    <input id="t-in-id" placeholder="T-Nummer">
    <input id="t-in-diam" placeholder="Ø (Durchmesser)">
    <input id="t-in-nm" placeholder="Bezeichnung">
    <button class="btn" onclick="saveTool()">Hinzufügen</button>
    <button class="btn" style="background:none; color:black;" onclick="closeModal('modal-t')">Zurück</button>
</div>

<div id="modal-import" class="modal">
    <h2 style="font-weight:900;">Import</h2>
    <textarea id="import-area" style="height:250px;" placeholder="Text einfügen..."></textarea>
    <button class="btn" onclick="runImport()">Einlesen</button>
    <button class="btn" style="background:none; color:black;" onclick="closeModal('modal-import')">Zurück</button>
</div>

<div id="modal-prev" class="modal" style="background:#1C1C1E; overflow:auto; padding:10px;">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; background:white; padding:12px; border-radius:14px; position:sticky; top:0; z-index:1000;">
        <button onclick="closeModal('modal-prev')" style="border:none; background:none; font-weight:800; cursor:pointer;">← ZURÜCK</button>
        <button onclick="downloadPDF()" style="background:#000; color:white; border:none; padding:10px 25px; border-radius:10px; font-weight:800; cursor:pointer;">PDF SPEICHERN</button>
    </div>
    <div id="preview-stage" style="transform: scale(0.38); transform-origin: top center;"></div>
</div>

<div id="pdf-render">
    <div class="premium-border">
        <div class="pdf-header">
            <span id="pdf-v-name" class="pdf-name"></span>
            <span id="pdf-v-num" class="pdf-num"></span>
        </div>
        <table class="pdf-table">
            <thead>
                <tr>
                    <th class="col-t">T-NR</th>
                    <th class="col-diam">Ø</th>
                    <th class="col-desc">WERKZEUGNAME / KOMMENTAR</th>
                </tr>
            </thead>
            <tbody id="pdf-v-body"></tbody>
        </table>
        <div style="flex-grow:1;"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v7')) || [];
    let curP = null;

    const openModal = (id) => document.getElementById(id).style.display = 'block';
    const closeModal = (id) => document.getElementById(id).style.display = 'none';
    const save = () => localStorage.setItem('qs_v7', JSON.stringify(db));

    function renderHome() {
        const list = document.getElementById('project-list'); list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="tool-row" style="grid-template-columns: 1fr 40px;" onclick="openDetail(${i})">
                <div><b style="font-size:18px;">${p.name}</b><br><small style="color:#888">${p.num}</small></div>
                <button onclick="event.stopPropagation(); editP(${i})" style="border:none; background:none; font-size:20px;">✎</button>
            </div>`;
        });
    }

    function openDetail(i) {
        curP = i;
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('det-name').innerText = db[i].name;
        document.getElementById('det-num').innerText = db[i].num;
        renderTools();
    }

    function renderTools() {
        const list = document.getElementById('tool-list'); list.innerHTML = "";
        db[curP].tools.forEach((t, i) => {
            list.innerHTML += `<div class="tool-row" onclick="editT(${i})">
                <div class="drag-handle">☰</div>
                <div style="font-weight:900; color:#007AFF;">${t.id}</div>
                <div style="font-weight:700; opacity:0.6;">${t.diam || '-'}</div>
                <div style="font-weight:600;">${t.nm}</div>
                <button onclick="event.stopPropagation(); delT(${i})" style="border:none; background:none; color:#FF3B30;">✕</button>
            </div>`;
        });
        new Sortable(list, { handle:'.drag-handle', animation:150, onEnd: (e) => {
            const item = db[curP].tools.splice(e.oldIndex, 1)[0];
            db[curP].tools.splice(e.newIndex, 0, item);
            save();
        }});
    }

    function runImport() {
        const lines = document.getElementById('import-area').value.split('\n');
        let tid = null; let tnm = [];
        lines.forEach(l => {
            if(/^[T][0-9]/i.test(l)) {
                if(tid) db[curP].tools.push({id: tid, diam: '', nm: tnm.join(' ')});
                tid = l.trim().toUpperCase(); tnm = [];
            } else if(tid) tnm.push(l.trim());
        });
        if(tid) db[curP].tools.push({id: tid, diam: '', nm: tnm.join(' ')});
        save(); renderTools(); closeModal('modal-import');
    }

    function openPreview() {
        document.getElementById('pdf-v-name').innerText = db[curP].name;
        document.getElementById('pdf-v-num').innerText = db[curP].num;
        const b = document.getElementById('pdf-v-body'); b.innerHTML = "";
        db[curP].tools.forEach(t => { 
            b.innerHTML += `<tr><td>${t.id}</td><td style="color:#555;">${t.diam || ''}</td><td>${t.nm}</td></tr>`; 
        });
        const wrap = document.getElementById('pdf-render'); wrap.style.display = 'block';
        document.getElementById('preview-stage').innerHTML = wrap.outerHTML;
        wrap.style.display = 'none';
        openModal('modal-prev');
    }

    function downloadPDF() {
        const el = document.querySelector('#preview-stage #pdf-render');
        html2pdf().set({ margin:0, filename: `${db[curP].name}.pdf`, html2canvas: {scale:4}, jsPDF: {unit:'mm', format:'a4'} }).from(el).save();
    }

    function saveProject() {
        const name = document.getElementById('p-in-name').value;
        const num = document.getElementById('p-in-num').value;
        db.push({name, num, tools:[]}); save(); renderHome(); closeModal('modal-p');
    }

    function saveTool() {
        const id = document.getElementById('t-in-id').value;
        const diam = document.getElementById('t-in-diam').value;
        const nm = document.getElementById('t-in-nm').value;
        const idx = document.getElementById('t-idx').value;
        if(idx === "") db[curP].tools.push({id, diam, nm}); else db[curP].tools[idx] = {id, diam, nm};
        save(); renderTools(); closeModal('modal-t');
    }

    function editT(i) {
        document.getElementById('t-idx').value = i;
        document.getElementById('t-in-id').value = db[curP].tools[i].id;
        document.getElementById('t-in-diam').value = db[curP].tools[i].diam || '';
        document.getElementById('t-in-nm').value = db[curP].tools[i].nm;
        openModal('modal-t');
    }

    function openPModal() { document.getElementById('p-in-name').value=""; document.getElementById('p-in-num').value=""; openModal('modal-p'); }
    function openTModal() { document.getElementById('t-idx').value=""; document.getElementById('t-in-id').value=""; document.getElementById('t-in-diam').value=""; document.getElementById('t-in-nm').value=""; openModal('modal-t'); }
    function goHome() { document.getElementById('view-home').style.display='block'; document.getElementById('view-detail').style.display='none'; renderHome(); }
    function delT(i) { if(confirm("Löschen?")) { db[curP].tools.splice(i,1); save(); renderTools(); } }
    function clearTools() { if(confirm("Alles löschen?")) { db[curP].tools = []; save(); renderTools(); } }
    function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); a.download="QS_Backup.json"; a.click(); }

    renderHome();
</script>
</body>
</html>
