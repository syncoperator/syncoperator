<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL v6.0 MODERN</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #007AFF; --bg: #F2F2F7; --card: #FFFFFF; --text: #000000; }
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); margin: 0; padding: 0; }

        /* Modern App UI */
        .app-bar { background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); padding: 20px; position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid #ccc; display: flex; justify-content: space-between; align-items: center; }
        .app-bar h1 { margin: 0; font-size: 20px; font-weight: 800; }
        
        .container { max-width: 600px; margin: 0 auto; padding: 15px; }
        .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; transition: 0.2s; }
        .card:active { transform: scale(0.98); background: #fafafa; }
        
        .tool-row { display: grid; grid-template-columns: 40px 80px 1fr 40px; gap: 10px; align-items: center; background: white; border-radius: 10px; padding: 12px; margin-bottom: 8px; border: 1px solid #eee; }
        .drag-handle { color: #ccc; cursor: grab; font-size: 20px; }

        /* Modals Modern */
        .modal { display: none; position: fixed; inset: 0; background: white; z-index: 1000; padding: 30px; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        input, textarea { width: 100%; background: #F2F2F7; border: none; border-radius: 10px; padding: 15px; margin-bottom: 15px; font-size: 16px; font-weight: 600; }
        .btn { background: black; color: white; border: none; border-radius: 12px; padding: 18px; width: 100%; font-weight: 700; font-size: 15px; cursor: pointer; }
        .btn-secondary { background: #E5E5EA; color: black; margin-top: 10px; }

        /* --- PDF DESIGN "MODERN INDUSTRIAL" --- */
        #pdf-wrap { width: 210mm; height: 297mm; background: white; padding: 12mm; display: none; }
        .pdf-frame { border: 2pt solid #000; height: 100%; padding: 10mm; display: flex; flex-direction: column; position: relative; }
        
        .pdf-head { display: flex; align-items: baseline; border-bottom: 4pt solid black; padding-bottom: 12px; margin-bottom: 25px; }
        .pdf-title { font-size: 40pt; font-weight: 900; margin-right: 15pt; letter-spacing: -2pt; }
        .pdf-sub { font-size: 20pt; font-weight: 300; color: #555; }
        
        .pdf-table { width: 100%; border-collapse: collapse; }
        .pdf-table th { border-bottom: 2pt solid black; padding: 12pt 8pt; text-align: left; font-size: 9pt; text-transform: uppercase; letter-spacing: 1pt; }
        .pdf-table td { border-bottom: 0.5pt solid #eee; padding: 14pt 8pt; font-size: 12pt; font-weight: 500; }
        .pdf-table tr:last-child td { border-bottom: 2pt solid black; } /* Schließt Tabelle modern ab */
    </style>
</head>
<body>

<div id="view-home">
    <div class="app-bar"><h1>PROJECTS</h1><button onclick="exportJSON()" style="background:none; border:none; font-size:12px;">BACKUP</button></div>
    <div class="container" id="project-list"></div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; border-radius:30px;" onclick="openPModal()">+</button>
</div>

<div id="view-detail" style="display:none;">
    <div class="app-bar">
        <button onclick="goHome()" style="background:none; border:none; font-size:24px;">←</button>
        <div style="text-align:right;"><b id="det-name"></b><br><small id="det-num"></small></div>
    </div>
    <div class="container">
        <button class="btn" style="background: var(--accent);" onclick="openModal('modal-import')">IMPORT LISTE</button>
        <div id="tool-list" style="margin-top:20px;"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:20px;">
            <button class="btn" onclick="openPreview()">VORSCHAU</button>
            <button class="btn btn-secondary" onclick="clearTools()" style="color:red;">LEEREN</button>
        </div>
    </div>
    <button class="btn" style="position:fixed; bottom:30px; right:20px; width:60px; border-radius:30px;" onclick="openTModal()">+</button>
</div>

<div id="modal-p" class="modal">
    <h2 id="p-modal-title">Projekt</h2>
    <input type="hidden" id="p-idx">
    <input id="p-in-name" placeholder="Bauteil Name">
    <input id="p-in-num" placeholder="Zeichnungs-Nr.">
    <button class="btn" onclick="saveProject()">Speichern</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-p')">Abbrechen</button>
</div>

<div id="modal-t" class="modal">
    <h2>Werkzeug</h2>
    <input type="hidden" id="t-idx">
    <input id="t-in-id" placeholder="T-Nummer (z.B. T0101)">
    <input id="t-in-nm" placeholder="Beschreibung">
    <button class="btn" onclick="saveTool()">Speichern</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-t')">Abbrechen</button>
</div>

<div id="modal-import" class="modal">
    <h2>Import</h2>
    <textarea id="import-area" style="height:200px;" placeholder="Programm-Text hier einfügen..."></textarea>
    <button class="btn" onclick="runImport()">Daten einlesen</button>
    <button class="btn btn-secondary" onclick="closeModal('modal-import')">Zurück</button>
</div>

<div id="modal-prev" class="modal" style="background:#1c1c1e; padding:10px; overflow:auto;">
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; background:white; padding:10px; border-radius:12px;">
        <button onclick="closeModal('modal-prev')" style="border:none; background:none; font-weight:700;">ZURÜCK</button>
        <button onclick="downloadPDF()" style="background:var(--accent); color:white; border:none; padding:8px 20px; border-radius:8px; font-weight:700;">PDF SPEICHERN</button>
    </div>
    <div id="preview-stage" style="transform: scale(0.4); transform-origin: top center;"></div>
</div>

<div id="pdf-wrap">
    <div class="pdf-frame">
        <div class="pdf-head">
            <span id="pdf-v-name" class="pdf-title"></span>
            <span id="pdf-v-num" class="pdf-sub"></span>
        </div>
        <table class="pdf-table">
            <thead>
                <tr><th style="width:20%">T-NR</th><th>WERKZEUGNAME / KOMMENTAR / NULLPUNKT</th></tr>
            </thead>
            <tbody id="pdf-v-body"></tbody>
        </table>
        <div style="flex-grow:1;"></div>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v6')) || [];
    let curP = null;

    const openModal = (id) => document.getElementById(id).style.display = 'block';
    const closeModal = (id) => document.getElementById(id).style.display = 'none';
    const save = () => localStorage.setItem('qs_v6', JSON.stringify(db));

    function renderHome() {
        const list = document.getElementById('project-list'); list.innerHTML = "";
        db.forEach((p, i) => {
            list.innerHTML += `<div class="card" onclick="openDetail(${i})">
                <div><b>${p.name}</b><br><small style="color:#888">${p.num}</small></div>
                <button onclick="event.stopPropagation(); editP(${i})" style="border:none; background:none;">✎</button>
            </div>`;
        });
    }

    function openDetail(i) {
        curP = i;
        document.getElementById('view-home').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('det-name').innerText = db[i].name;
        document.getElementById('det-num').innerText = db[i].num;
        renderTools();
    }

    function renderTools() {
        const list = document.getElementById('tool-list'); list.innerHTML = "";
        db[curP].tools.forEach((t, i) => {
            list.innerHTML += `<div class="tool-row" onclick="editT(${i})">
                <div class="drag-handle">☰</div>
                <div style="font-weight:800">${t.id}</div>
                <div>${t.nm}</div>
                <button onclick="event.stopPropagation(); delT(${i})" style="border:none; background:none; color:red;">✕</button>
            </div>`;
        });
        new Sortable(list, { handle: '.drag-handle', animation: 150, onEnd: (evt) => {
            const item = db[curP].tools.splice(evt.oldIndex, 1)[0];
            db[curP].tools.splice(evt.newIndex, 0, item);
            save();
        }});
    }

    function runImport() {
        const lines = document.getElementById('import-area').value.split('\n');
        let tid = null; let tnm = [];
        lines.forEach(l => {
            if(/^[T][0-9]/i.test(l)) {
                if(tid) db[curP].tools.push({id: tid, nm: tnm.join(' ')});
                tid = l.trim().toUpperCase(); tnm = [];
            } else if(tid) tnm.push(l.trim());
        });
        if(tid) db[curP].tools.push({id: tid, nm: tnm.join(' ')});
        save(); renderTools(); closeModal('modal-import');
    }

    function openPreview() {
        document.getElementById('pdf-v-name').innerText = db[curP].name;
        document.getElementById('pdf-v-num').innerText = db[curP].num;
        const body = document.getElementById('pdf-v-body'); body.innerHTML = "";
        db[curP].tools.forEach(t => { body.innerHTML += `<tr><td style="font-weight:700">${t.id}</td><td>${t.nm}</td></tr>`; });
        const wrap = document.getElementById('pdf-wrap'); wrap.style.display = 'block';
        document.getElementById('preview-stage').innerHTML = wrap.outerHTML;
        wrap.style.display = 'none';
        openModal('modal-prev');
    }

    function downloadPDF() {
        const el = document.querySelector('#preview-stage #pdf-wrap');
        const opt = { margin:0, filename: `${db[curP].name}.pdf`, html2canvas: {scale:3}, jsPDF: {unit:'mm', format:'a4'} };
        html2pdf().set(opt).from(el).save();
    }

    /* Helper Functions */
    function openPModal() { document.getElementById('p-idx').value = ""; document.getElementById('p-in-name').value=""; document.getElementById('p-in-num').value=""; openModal('modal-p'); }
    function editP(i) { document.getElementById('p-idx').value = i; document.getElementById('p-in-name').value = db[i].name; document.getElementById('p-in-num').value = db[i].num; openModal('modal-p'); }
    function saveProject() {
        const name = document.getElementById('p-in-name').value; const num = document.getElementById('p-in-num').value;
        const idx = document.getElementById('p-idx').value;
        if(idx === "") db.push({name, num, tools:[]}); else { db[idx].name = name; db[idx].num = num; }
        save(); renderHome(); closeModal('modal-p');
    }
    function openTModal() { document.getElementById('t-idx').value = ""; document.getElementById('t-in-id').value=""; document.getElementById('t-in-nm').value=""; openModal('modal-t'); }
    function editT(i) { document.getElementById('t-idx').value = i; document.getElementById('t-in-id').value = db[curP].tools[i].id; document.getElementById('t-in-nm').value = db[curP].tools[i].nm; openModal('modal-t'); }
    function saveTool() {
        const id = document.getElementById('t-in-id').value; const nm = document.getElementById('t-in-nm').value;
        const idx = document.getElementById('t-idx').value;
        if(idx === "") db[curP].tools.push({id, nm}); else db[curP].tools[idx] = {id, nm};
        save(); renderTools(); closeModal('modal-t');
    }
    function goHome() { document.getElementById('view-home').style.display='block'; document.getElementById('view-detail').style.display='none'; renderHome(); }
    function delT(i) { if(confirm("Löschen?")) { db[curP].tools.splice(i,1); save(); renderTools(); } }
    function clearTools() { if(confirm("Alles löschen?")) { db[curP].tools = []; save(); renderTools(); } }
    function exportJSON() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], {type:'application/json'})); a.download="QS_Backup.json"; a.click(); }

    renderHome();
</script>
</body>
</html>
