<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TOOL-CORE v1</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --accent: #000; --bg: #FFF; --border: #000; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--accent); margin: 0; padding: 0; }
        .app-shell { max-width: 500px; margin: 0 auto; min-height: 100vh; }
        
        /* Header */
        .top-bar { padding: 40px 20px 20px; border-bottom: 4px solid var(--accent); display: flex; justify-content: space-between; align-items: flex-end; }
        .top-bar h1 { font-size: 28px; font-weight: 900; margin: 0; text-transform: uppercase; }
        
        /* Tool Row */
        .tool-row { 
            border: 2px solid var(--border); margin: 10px 20px; padding: 12px; 
            display: grid; grid-template-columns: 30px 60px 1fr auto; gap: 10px; 
            align-items: center; background: #fff;
        }
        .drag-handle { cursor: grab; font-size: 20px; color: #999; }
        .t-num { font-weight: 900; font-size: 18px; border-right: 2px solid #000; }
        .t-name { font-weight: 700; text-transform: uppercase; }
        .t-comment { font-size: 12px; color: #555; grid-column: 2 / 4; margin-top: -5px; }

        /* Buttons */
        .btn-black { background: #000; color: #fff; border: none; padding: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; width: 100%; margin-top: 10px; }
        .fab { position: fixed; bottom: 30px; right: 20px; background: #000; color: #fff; border: none; width: 60px; height: 60px; font-size: 30px; border-radius: 50%; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 100; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; padding: 25px; }
        input, textarea { width: 100%; border: 2px solid #000; padding: 15px; font-size: 16px; font-weight: bold; margin-bottom: 15px; box-sizing: border-box; font-family: inherit; }

        /* PDF S/W */
        #pdf-content { display: none; padding: 30px; background: white; color: black; font-family: 'Courier', monospace; }
        .pdf-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .pdf-table th, .pdf-table td { border: 1px solid black; padding: 10px; text-align: left; }
        
        .hidden { display: none; }
        .ghost { opacity: 0.3; background: #eee; }
    </style>
</head>
<body>

<div class="app-shell">
    <div class="top-bar">
        <div><h1>TOOL-CORE</h1><span>WERKZEUGLISTE</span></div>
        <button onclick="openPreview()" style="background:none; border:2px solid #000; font-weight:bold; padding:5px 10px;">PDF</button>
    </div>

    <div style="padding: 20px 20px 0;">
        <input type="text" id="project-info" placeholder="PROGRAMM-NR / BAUTEIL" oninput="saveTools()" style="margin-bottom:0; border-bottom:4px solid #000;">
    </div>

    <div id="tool-list" style="margin-top:20px;"></div>
    
    <button class="fab" onclick="openM()">+</button>
</div>

<div id="modal-tool" class="modal">
    <h1 id="m-title">NEUES WERKZEUG</h1>
    <input type="hidden" id="edit-idx">
    <input type="text" id="t-id" placeholder="T-NUMMER (z.B. T01)">
    <input type="text" id="t-name" placeholder="WERKZEUGNAME">
    <textarea id="t-note" placeholder="KOMMENTAR / ANMERKUNG" rows="3"></textarea>
    <button class="btn-black" onclick="saveTool()">SPEICHERN</button>
    <button onclick="closeM()" style="width:100%; background:none; border:none; margin-top:20px; font-weight:bold; text-decoration:underline;">ABBRECHEN</button>
</div>

<div id="modal-prev" class="modal" style="overflow-y: auto;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <button onclick="document.getElementById('modal-prev').style.display='none'" style="background:none; border:2px solid #000; padding:10px;">ZURÜCK</button>
        <button class="btn-black" style="width:auto; padding:10px 30px;" onclick="downloadPDF()">DRUCKEN</button>
    </div>
    <div id="pdf-preview" style="border:1px solid #000; zoom:0.5;"></div>
</div>

<div id="pdf-content">
    <div style="border-bottom: 5px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
        <h1 style="margin:0; font-size:30px;">WERKZEUGLISTE</h1>
        <h2 id="pdf-project-name" style="margin:5px 0 0 0; text-transform:uppercase;"></h2>
    </div>
    <table class="pdf-table">
        <thead>
            <tr>
                <th width="15%">T-NR</th>
                <th width="35%">WERKZEUGNAME</th>
                <th width="50%">KOMMENTARE / SETUP</th>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<script>
    let tools = JSON.parse(localStorage.getItem('tool_db_v1')) || [];
    let projName = localStorage.getItem('tool_proj_name') || "";

    const saveTools = () => {
        localStorage.setItem('tool_db_v1', JSON.stringify(tools));
        localStorage.setItem('tool_proj_name', document.getElementById('project-info').value);
    };

    const openM = () => document.getElementById('modal-tool').style.display = 'block';
    const closeM = () => {
        document.getElementById('modal-tool').style.display = 'none';
        document.getElementById('edit-idx').value = '';
        document.getElementById('t-id').value = '';
        document.getElementById('t-name').value = '';
        document.getElementById('t-note').value = '';
        document.getElementById('m-title').innerText = "NEUES WERKZEUG";
    };

    function saveTool() {
        let tid = document.getElementById('t-id').value;
        let tnm = document.getElementById('t-name').value;
        let tnt = document.getElementById('t-note').value;
        let idx = document.getElementById('edit-idx').value;

        if(!tid || !tnm) return alert("T-Nr und Name angeben!");

        let obj = { tid, tnm, tnt };
        if(idx !== "") tools[idx] = obj;
        else tools.push(obj);

        saveTools(); renderTools(); closeM();
    }

    function renderTools() {
        const l = document.getElementById('tool-list');
        l.innerHTML = "";
        tools.forEach((t, i) => {
            l.innerHTML += `
            <div class="tool-row" data-id="${i}">
                <div class="drag-handle">☰</div>
                <div class="t-num" onclick="editT(${i})">${t.tid}</div>
                <div class="t-name" onclick="editT(${i})">${t.tnm}</div>
                <button onclick="delT(${i})" style="background:none; border:none; color:red; font-weight:bold;">✕</button>
                <div class="t-comment" onclick="editT(${i})">${t.tnt || ''}</div>
            </div>`;
        });
    }

    function editT(i) {
        document.getElementById('t-id').value = tools[i].tid;
        document.getElementById('t-name').value = tools[i].tnm;
        document.getElementById('t-note').value = tools[i].tnt;
        document.getElementById('edit-idx').value = i;
        document.getElementById('m-title').innerText = "WERKZEUG EDITIEREN";
        openM();
    }

    function delT(i) { if(confirm("Werkzeug löschen?")) { tools.splice(i,1); saveTools(); renderTools(); } }

    function openPreview() {
        document.getElementById('pdf-project-name').innerText = document.getElementById('project-info').value || "UNBENANNTES PROJEKT";
        const b = document.getElementById('pdf-body');
        b.innerHTML = "";
        tools.forEach(t => {
            b.innerHTML += `<tr><td><b>${t.tid}</b></td><td>${t.tnm}</td><td>${t.tnt}</td></tr>`;
        });
        const area = document.getElementById('pdf-content');
        area.style.display = 'block';
        document.getElementById('pdf-preview').innerHTML = area.outerHTML;
        area.style.display = 'none';
        document.getElementById('modal-prev').style.display = 'block';
    }

    function downloadPDF() {
        const el = document.querySelector('#pdf-preview #pdf-content');
        el.style.display = 'block';
        html2pdf().set({ margin:10, filename: 'Werkzeugliste.pdf', html2canvas:{scale:2}, jsPDF:{unit:'mm', format:'a4'} }).from(el).save();
    }

    // Sortable für Werkzeug-Reihenfolge
    new Sortable(document.getElementById('tool-list'), {
        handle: '.drag-handle', animation: 150, ghostClass: 'ghost',
        onEnd: () => {
            let n = [];
            document.querySelectorAll('.tool-row').forEach(r => n.push(tools[r.dataset.id]));
            tools = n; saveTools(); renderTools();
        }
    });

    document.getElementById('project-info').value = projName;
    renderTools();
</script>
</body>
</html>
