<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS-TOOL V5.0 PIXEL PERFECT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root { --black: #000; --white: #fff; --gray: #f4f4f4; }
        * { box-sizing: border-box; }
        body { font-family: 'Helvetica', Arial, sans-serif; margin: 0; background: var(--gray); }

        /* APP UI */
        .ui-header { padding: 30px 20px; background: white; border-bottom: 4px solid #000; }
        .ui-card { border: 2px solid #000; margin: 10px; padding: 15px; background: white; cursor: pointer; display: flex; justify-content: space-between; }
        .btn-black { background: #000; color: #fff; border: none; padding: 18px; width: 100%; font-weight: 900; cursor: pointer; }
        .modal { display: none; position: fixed; inset: 0; background: #fff; z-index: 1000; padding: 20px; }
        .input-f { width: 100%; border: 2px solid #000; padding: 15px; margin-bottom: 10px; font-weight: bold; font-size: 16px; }

        /* --- PDF LAYOUT (MATHEMATISCH EXAKT) --- */
        #pdf-master {
            width: 210mm;
            height: 297mm;
            background: white;
            padding: 10mm;
            display: none; /* In App versteckt */
            position: relative;
        }
        .outer-frame {
            border: 1.5pt solid black;
            height: 277mm; /* 297 - 20mm Padding */
            width: 190mm;  /* 210 - 20mm Padding */
            padding: 8mm;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header-line {
            display: flex;
            align-items: baseline;
            border-bottom: 4pt solid black;
            padding-bottom: 10pt;
            margin-bottom: 15pt;
        }
        .title-main { font-size: 42pt; font-weight: 900; text-transform: uppercase; margin-right: 15pt; }
        .title-sub { font-size: 22pt; font-weight: 400; color: #666; }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { border: 1.5pt solid black; padding: 10pt; background: #f0f0f0; text-align: left; font-size: 10pt; font-weight: 900; }
        .data-table td { border: 1.5pt solid black; padding: 12pt 10pt; font-size: 12pt; font-weight: 600; }
        
        .tool-row-ui { display: grid; grid-template-columns: 80px 1fr 40px; gap: 10px; border: 2px solid #000; margin: 5px 10px; padding: 10px; background: #fff; }
    </style>
</head>
<body>

<div id="view-dash">
    <div class="ui-header"><h1>DATABASE</h1></div>
    <div id="proj-list"></div>
    <button class="btn-black" onclick="openM('m-proj')" style="position:fixed; bottom:20px; right:20px; width:60px; height:60px; border-radius:50%;">+</button>
</div>

<div id="view-detail" style="display:none;">
    <div class="ui-header" style="display:flex; align-items:center; gap:20px;">
        <button onclick="goHome()" style="background:none; border:none; font-size:30px; font-weight:bold;">←</button>
        <div><h2 id="det-name" style="margin:0;"></h2><small id="det-num"></small></div>
    </div>
    <div style="padding:15px;"><button class="btn-black" onclick="openM('m-import')">IMPORT</button></div>
    <div id="tool-list"></div>
    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; padding:15px;">
        <button class="btn-black" onclick="showPreview()">VORSCHAU</button>
        <button class="btn-black" style="background:red;" onclick="clearTools()">LÖSCHEN</button>
    </div>
</div>

<div id="m-proj" class="modal">
    <h2>PROJEKT</h2>
    <input id="p-name" class="input-f" placeholder="BUCHSE">
    <input id="p-num" class="input-f" placeholder="233562">
    <button class="btn-black" onclick="addProj()">SPEICHERN</button>
    <button onclick="closeM('m-proj')" style="width:100%; border:none; background:none; margin-top:10px;">Abbrechen</button>
</div>

<div id="m-import" class="modal">
    <h2>IMPORT</h2>
    <textarea id="import-area" class="input-f" style="height:250px;" placeholder="T0101..."></textarea>
    <button class="btn-black" onclick="runImport()">START</button>
    <button onclick="closeM('m-import')" style="width:100%; border:none; background:none; margin-top:10px;">Zurück</button>
</div>

<div id="m-prev" class="modal" style="background:#444; overflow:auto;">
    <div style="background:#fff; padding:15px; display:flex; justify-content:space-between; position:sticky; top:0; z-index:10;">
        <button onclick="closeM('m-prev')" style="border:2px solid #000; background:none; padding:10px;">ZURÜCK</button>
        <button class="btn-black" style="width:auto; padding:10px 30px;" onclick="savePDF()">PDF SPEICHERN</button>
    </div>
    <div id="preview-wrap" style="transform: scale(0.35); transform-origin: top center; padding-top:20px;"></div>
</div>

<div id="pdf-master">
    <div class="outer-frame">
        <div class="header-line">
            <span id="pdf-val-name" class="title-main"></span>
            <span id="pdf-val-num" class="title-sub"></span>
        </div>
        <table class="data-table">
            <thead>
                <tr>
                    <th style="width:20%;">T-NR</th>
                    <th>WERKZEUGNAME / KOMMENTAR / NULLPUNKT</th>
                </tr>
            </thead>
            <tbody id="pdf-val-body"></tbody>
        </table>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('qs_v5')) || [];
    let cur = null;

    const openM = (id) => document.getElementById(id).style.display = 'block';
    const closeM = (id) => document.getElementById(id).style.display = 'none';

    function render() {
        const l = document.getElementById('proj-list'); l.innerHTML = "";
        db.forEach((p, i) => {
            l.innerHTML += `<div class="ui-card" onclick="openDetail(${i})"><b>${p.name}</b> <span>${p.num}</span></div>`;
        });
    }

    function openDetail(i) {
        cur = i;
        document.getElementById('view-dash').style.display = 'none';
        document.getElementById('view-detail').style.display = 'block';
        document.getElementById('det-name').innerText = db[i].name;
        document.getElementById('det-num').innerText = db[i].num;
        renderTools();
    }

    function renderTools() {
        const l = document.getElementById('tool-list'); l.innerHTML = "";
        db[cur].tools.forEach((t, i) => {
            l.innerHTML += `<div class="tool-row-ui"><b>${t.id}</b> <span>${t.nm}</span> <button onclick="delT(${i})" style="border:none; color:red;">✕</button></div>`;
        });
    }

    function runImport() {
        const lines = document.getElementById('import-area').value.split('\n');
        let tid = null; let tnm = [];
        lines.forEach(line => {
            if(/^[T][0-9]/i.test(line)) {
                if(tid) db[cur].tools.push({id: tid, nm: tnm.join(' ')});
                tid = line.trim().toUpperCase(); tnm = [];
            } else if(tid) tnm.push(line.trim());
        });
        if(tid) db[cur].tools.push({id: tid, nm: tnm.join(' ')});
        localStorage.setItem('qs_v5', JSON.stringify(db));
        renderTools(); closeM('m-import');
    }

    function showPreview() {
        const p = db[cur];
        document.getElementById('pdf-val-name').innerText = p.name;
        document.getElementById('pdf-val-num').innerText = p.num;
        const b = document.getElementById('pdf-val-body'); b.innerHTML = "";
        p.tools.forEach(t => {
            b.innerHTML += `<tr><td style="font-weight:900;">${t.id}</td><td>${t.nm}</td></tr>`;
        });
        const master = document.getElementById('pdf-master');
        master.style.display = 'block';
        document.getElementById('preview-wrap').innerHTML = master.outerHTML;
        master.style.display = 'none';
        openM('m-prev');
    }

    function savePDF() {
        const el = document.querySelector('#preview-wrap #pdf-master');
        const opt = {
            margin: 0,
            filename: `Setup_${db[cur].name}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 4, logging: false, useCORS: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(el).save();
    }

    function addProj() {
        db.push({ name: document.getElementById('p-name').value, num: document.getElementById('p-num').value, tools: [] });
        localStorage.setItem('qs_v5', JSON.stringify(db));
        render(); closeM('m-proj');
    }

    function goHome() { document.getElementById('view-dash').style.display='block'; document.getElementById('view-detail').style.display='none'; }
    function delT(i) { db[cur].tools.splice(i,1); localStorage.setItem('qs_v5', JSON.stringify(db)); renderTools(); }
    function clearTools() { db[cur].tools = []; localStorage.setItem('qs_v5', JSON.stringify(db)); renderTools(); }

    render();
</script>
</body>
</html>
