<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA SMART HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --accent: #007AFF;
            --text: #000000;
            --sub: #8E8E93;
            --ok: #34C759;
            --border: #E5E5EA;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 90px; }
        .container { max-width: 400px; margin: 0 auto; padding: 16px; }

        /* HEADER */
        header { text-align: center; padding: 20px 0; margin-bottom: 10px; }
        header h1 { margin: 0; font-size: 28px; font-weight: 900; letter-spacing: -1.5px; text-transform: uppercase; }
        header h1 span { color: var(--accent); }

        /* CARDS */
        .card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid var(--border); }
        .card-title { font-size: 10px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 15px; letter-spacing: 0.5px; }

        /* INPUTS */
        .field-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .field { flex: 1; }
        .field label { display: block; font-size: 9px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 6px; }
        .field input { width: 100%; border: none; background: var(--bg); padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 900; text-align: center; box-sizing: border-box; outline: none; transition: 0.2s; border: 2px solid transparent; }
        .field input:focus { border-color: var(--accent); background: #fff; }

        /* NAVIGATION BAR (Bottom) */
        .tab-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); display: flex; justify-content: space-around; padding: 10px 0 25px 0; border-top: 1px solid var(--border); z-index: 1000; }
        .tab-item { border: none; background: none; color: var(--sub); font-size: 10px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .tab-item.active { color: var(--accent); }
        .tab-icon { font-size: 20px; margin-bottom: 2px; }

        /* STRATEGY ITEMS */
        .res-item { background: var(--card); border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; border: 1px solid var(--border); }
        .res-item.highlight { border-color: var(--ok); background: #F2FFF5; }
        .res-info b { font-size: 22px; font-weight: 900; display: block; }
        .res-info span { font-size: 9px; font-weight: 800; color: var(--sub); text-transform: uppercase; }
        .count-badge { background: var(--text); color: white; padding: 8px 14px; border-radius: 12px; font-size: 18px; font-weight: 900; }

        /* TOOL LIST STYLE */
        .tool-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--bg); }
        .tool-row:last-child { border-bottom: none; }
        .tool-name { font-weight: 800; font-size: 14px; }
        .tool-val { color: var(--accent); font-weight: 900; }

        .hidden { display: none; }
        .big-val { font-size: 48px; font-weight: 900; color: var(--accent); text-align: center; letter-spacing: -2px; margin: 10px 0; }
        
        input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; background: var(--bg); border-radius: 4px; outline: none; margin: 20px 0; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: var(--text); border-radius: 50%; border: 4px solid var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>NAKA<span>MURA</span></h1></header>

    <div id="page-std">
        <div class="card">
            <div class="card-title">Optimierung Sägelänge</div>
            <div class="field-group">
                <div class="field"><label>Fertigteil</label><input type="number" id="l" value="175" oninput="calcStd()"></div>
                <div class="field"><label>Schnitt Z</label><input type="number" id="z" value="5" oninput="calcStd()"></div>
            </div>
            <div class="field"><label>Min. Reststück (mm)</label><input type="number" id="r" value="50" oninput="calcStd()"></div>
        </div>
        <div id="std-list"></div>
    </div>

    <div id="page-drill" class="hidden">
        <div class="card">
            <div class="card-title">Durchbohren Balance</div>
            <div class="field-group">
                <div class="field"><label>Rohmaterial</label><input type="number" id="dr-raw" value="3085" oninput="calcDrill()"></div>
                <div class="field"><label>Teil L</label><input type="number" id="dr-l" value="175" oninput="calcDrill()"></div>
                <div class="field"><label>Z</label><input type="number" id="dr-z" value="5" oninput="calcDrill()"></div>
            </div>
        </div>
        <div class="card">
            <div class="big-val" id="dr-disp">1150.0</div>
            <input type="range" id="dr-sl" min="300" max="1170" step="0.5" value="1150" oninput="calcDrill()">
            <div id="dr-res"></div>
        </div>
    </div>

    <div id="page-tools" class="hidden">
        <div class="card">
            <div class="card-title">Aktive Werkzeugliste</div>
            <div class="tool-row"><div class="tool-name">T01 Abstechwerkzeug</div><div class="tool-val">3.0 mm</div></div>
            <div class="tool-row"><div class="tool-name">T03 Bohrer D25</div><div class="tool-val">Z-120</div></div>
            <div class="tool-row"><div class="tool-name">T05 Schruppstahl</div><div class="tool-val">CNMG 12</div></div>
            <div class="tool-row"><div class="tool-name">T08 Feinbohrstange</div><div class="tool-val">D16</div></div>
        </div>
        <div class="card">
            <div class="card-title">Zukünftige Offsets</div>
            <p style="color:var(--sub); font-size:12px; font-weight:600; text-align:center;">Здесь можно будет добавлять коррекцию в реальном времени.</p>
        </div>
    </div>
</div>

<nav class="tab-bar">
    <button class="tab-item active" onclick="nav('std', this)">
        <span class="tab-icon">📏</span>Sägelänge
    </button>
    <button class="tab-item" onclick="nav('drill', this)">
        <span class="tab-icon">🔄</span>Drill
    </button>
    <button class="tab-item" onclick="nav('tools', this)">
        <span class="tab-icon">🛠️</span>Tools
    </button>
</nav>

<script>
function nav(page, btn) {
    document.getElementById('page-std').classList.toggle('hidden', page !== 'std');
    document.getElementById('page-drill').classList.toggle('hidden', page !== 'drill');
    document.getElementById('page-tools').classList.toggle('hidden', page !== 'tools');
    
    document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    
    if(page === 'std') calcStd();
    if(page === 'drill') calcDrill();
}

function calcStd() {
    const l = parseFloat(document.getElementById('l').value) || 0;
    const z = parseFloat(document.getElementById('z').value) || 0;
    const r = parseFloat(document.getElementById('r').value) || 0;
    const unit = l + z;
    const list = document.getElementById('std-list');
    list.innerHTML = '';
    if(unit <= 0) return;

    let res = [];
    for(let c = 1; c <= 100; c++) {
        let total = (c * unit) + r;
        if (total > 1175) break;
        res.push({c, total});
    }

    res.reverse().forEach(item => {
        const div = document.createElement('div');
        const isOpt = item.total >= 1130 && item.total <= 1170;
        div.className = 'res-item' + (isOpt ? ' highlight' : '');
        div.innerHTML = `<div class="res-info"><span>Schnittlänge</span><b>${item.total.toFixed(1)}</b></div><div class="count-badge">${item.c}</div>`;
        list.appendChild(div);
    });
}

function calcDrill() {
    const raw = parseFloat(document.getElementById('dr-raw').value) || 0;
    const l = parseFloat(document.getElementById('dr-l').value) || 0;
    const z = parseFloat(document.getElementById('dr-z').value) || 0;
    const unit = l + z;
    const s12 = parseFloat(document.getElementById('dr-sl').value);
    
    document.getElementById('dr-disp').innerText = s12.toFixed(1);
    const s3 = raw - (s12 * 2);
    const c12 = Math.floor(s12 / (unit || 1));
    const c3 = Math.floor((s3 - 30) / (unit || 1));
    const rest3 = s3 - (c3 * (unit || 1));

    document.getElementById('dr-res').innerHTML = `
        <div style="font-size:14px; font-weight:700; line-height:1.8;">
            <div style="display:flex; justify-content:space-between;">S3 Länge: <span>${s3.toFixed(1)} mm</span></div>
            <div style="display:flex; justify-content:space-between; margin-top:10px;">Teile S1+S2: <span>${c12 * 2}</span></div>
            <div style="display:flex; justify-content:space-between;">Teile S3: <span>${c3}</span></div>
            <div style="display:flex; justify-content:space-between; color:var(--accent); font-weight:900; border-top:1px solid var(--bg); padding-top:5px; margin-top:5px;">Rest S3: <span>${rest3.toFixed(1)} mm</span></div>
        </div>
    `;
}

window.onload = () => calcStd();
</script>
</body>
</html>
