<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA PREMIUM HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #FFFFFF;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F; /* Deep Black for Monochrome */
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA; /* Lighter border for clean look */
            --hover-bg: #F5f5f7;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg);
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- PARALLAX BACKGROUND LAYER --- */
        #parallax-bg {
            position: fixed;
            top: -10%;
            left: -10%;
            width: 120%;
            height: 120%;
            background-image: 
                radial-gradient(#E5E5EA 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
            z-index: -1;
            transition: transform 0.1s ease-out; /* Smooth movement */
        }

        /* Padding-bottom to avoid overlapping with OS navigation */
        .app-container { 
            width: 100%; 
            max-width: 480px; 
            padding: 50px 20px 80px 20px; 
            box-sizing: border-box;
            opacity: 0; /* Hidden initially for Splash Screen */
            animation: fadeInPage 1s ease-out 1s forwards; /* Fades in after Loader */
            z-index: 1;
        }

        @keyframes fadeInPage {
            to { opacity: 1; }
        }

        /* --- SPLASH SCREEN / LOADER --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: opacity 0.8s ease-in-out;
        }

        #splash-screen h1 {
            font-size: 50px;
            font-weight: 900;
            letter-spacing: -3px;
            margin: 0;
            opacity: 0;
            animation: pulseLogo 1.5s ease-in-out infinite;
        }
        
        #splash-screen h1 span { color: #86868B; } /* Monochrome span */

        .loader-bar {
            width: 50px;
            height: 3px;
            background: var(--accent);
            border-radius: 2px;
            margin-top: 15px;
            transform: scaleX(0);
            animation: expandBar 1s ease-out 0.2s forwards;
        }

        @keyframes pulseLogo {
            0%, 100% { opacity: 0.3; transform: scale(0.98); }
            50% { opacity: 1; transform: scale(1); }
        }

        @keyframes expandBar {
            to { transform: scaleX(1); }
        }

        /* HEADER - Centered layout */
        header { 
            margin-bottom: 50px; 
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header h1 { 
            margin: 0; 
            font-size: 46px; 
            font-weight: 900; 
            letter-spacing: -2.5px; 
            line-height: 1;
            color: var(--text-main);
        }
        
        /* Monochrome Nakamura span */
        header h1 span { 
            color: #86868B; 
        }

        header p { 
            margin: 10px 0 18px; 
            font-size: 12px; 
            font-weight: 800; 
            color: var(--text-sub); 
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header-line {
            width: 30px;
            height: 5px;
            background: var(--accent);
            border-radius: 2.5px;
        }

        /* MODULE LIST */
        .module-list { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        .module-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        /* CARD - Monochrome Premium */
        .module-card { 
            background: var(--card-bg); 
            border-radius: 22px; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            border: 2px solid var(--border);
            transition: all 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); /* Sleek motion */
            position: relative;
            overflow: hidden;
        }

        /* Deep black background on hover, pure white elements */
        .module-card:hover {
            border-color: var(--accent);
            background: var(--accent);
        }

        .module-card:active { 
            transform: scale(0.98) translateY(1px); 
        }

        /* ICON WRAPPER - Clean gray to start, inverted on hover */
        .icon-wrapper {
            width: 54px;
            height: 54px;
            background: #F9F9F9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 18px;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .module-card:hover .icon-wrapper {
            background: #FFFFFF;
        }

        .icon-svg {
            width: 26px;
            height: 26px;
            fill: none;
            stroke: var(--text-main);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: all 0.3s ease;
        }

        .module-card:hover .icon-svg {
            stroke: var(--accent);
        }

        /* TEXT CONTENT - Text becomes White on hover */
        .card-content {
            display: flex;
            flex-direction: column;
            justify-content: center;
            transition: all 0.3s ease;
        }
        
        .card-content .sub-text {
            font-size: 10px;
            color: var(--text-sub);
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 0.8px;
            transition: all 0.3s ease;
        }

        .card-content .main-text {
            margin: 0;
            font-size: 19px;
            font-weight: 900;
            letter-spacing: -0.6px;
            color: var(--text-main);
            transition: all 0.3s ease;
        }

        .module-card:hover .sub-text { color: #FFFFFF; opacity: 0.7; }
        .module-card:hover .main-text { color: #FFFFFF; }

        /* ARROW - Inverted on hover */
        .arrow {
            margin-left: auto;
            color: var(--border);
            font-weight: 800;
            font-size: 20px;
            transition: all 0.3s ease;
        }

        .module-card:hover .arrow {
            color: #FFFFFF;
            transform: translateX(3px);
        }

        /* DISABLED */
        .module-card.disabled {
            opacity: 0.3;
            pointer-events: none;
            background: #F9F9F9;
        }
    </style>
</head>
<body>

<div id="splash-screen">

<script>
    // --- 1. HANDLING SPLASH SCREEN ---
    window.addEventListener('load', function() {
        const splash = document.getElementById('splash-screen');
        // Wait a bit to ensure a smooth transition even if load is instant
        setTimeout(() => {
            splash.style.opacity = '0';
            // Completely remove from document after fade out
            setTimeout(() => {
                splash.style.display = 'none';
            }, 800); 
        }, 1200); // Pulse happens once before hiding
    });

    // --- 2. SUBTLE PARALLAX EFFECT ---
    const parallaxBg = document.getElementById('parallax-bg');
    
    // Check if it's a touch device for different interaction model
    const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

    if (!isTouch) {
        // Desktop: Mouse move parallax
        window.addEventListener('mousemove', function(e) {
            const moveX = (window.innerWidth / 2 - e.clientX) * 0.01; // Depth factor
            const moveY = (window.innerHeight / 2 - e.clientY) * 0.01;
            
            parallaxBg.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    } else {
        // Mobile: Device orientation (Gyroscope) parallax
        window.addEventListener('deviceorientation', function(e) {
            if (!e.gamma || !e.beta) return; // No gyro data

            const moveX = e.gamma * 0.3; // Gamma is left-to-right tilt
            const moveY = e.beta * 0.3;  // Beta is front-to-back tilt

            parallaxBg.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });
    }
</script>

</body>
