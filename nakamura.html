<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA PRO | HUB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #F2F2F7; --card: #FFFFFF; --accent: #007AFF; --sub: #8E8E93; --text: #000000; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .hub-container { width: 100%; max-width: 360px; padding: 20px; box-sizing: border-box; text-align: center; }
        
        /* Premium Header */
        header { margin-bottom: 30px; border-bottom: 2px solid var(--text); padding-bottom: 15px; }
        header h1 { margin: 0; font-size: 30px; font-weight: 900; text-transform: uppercase; letter-spacing: -1.5px; }
        header h1 span { color: var(--accent); }
        header p { margin: 5px 0 0; color: var(--sub); font-size: 11px; font-weight: 800; text-transform: uppercase; }

        /* Кнопки Навигации (вместо табов) */
        .hub-buttons { display: flex; flex-direction: column; gap: 12px; }
        
        .nav-btn { display: flex; align-items: center; justify-content: space-between; border: none; padding: 20px; border-radius: 16px; background: var(--card); color: var(--text); font-size: 14px; font-weight: 800; text-transform: uppercase; text-align: left; text-decoration: none; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        .nav-btn:active { transform: scale(0.98); }
        .nav-btn span { font-size: 10px; color: var(--sub); display: block; margin-top: 2px; }
        .nav-btn i { font-style: normal; font-size: 20px; color: var(--sub); }

        /* Специальный стиль для Durchbohren (как на image_0.png) */
        .nav-btn.special { background: #E5E5EA; color: var(--sub); }
        .nav-btn.special span { color: #A5A5AA; }
    </style>
</head>
<body>

<div class="hub-container">
    <header>
        <h1>NAKA<span>MURA</span></h1>
        <p>Pro-Schnitt Optimizer V10</p>
    </header>

    <div class="hub-buttons">
        <a href="std_calc.html" class="nav-btn">
            <div>
                STANDARD
                <span>Schnelle Optimierung & Längenliste</span>
            </div>
            <i>&#10140;</i> </a>

        <a href="drill_calc.html" class="nav-btn special">
            <div>
                DURCHBOHREN
                <span>Slider, Баланс & End-Rest S3 (Max 1170)</span>
            </div>
            <i>&#10140;</i>
        </a>
    </div>
</div>

</body>
</html>
