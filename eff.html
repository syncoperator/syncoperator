<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Brief → PDF</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#111}
body{
  font-family:Georgia,'Times New Roman',serif;
  background:#F5F1E8;color:#1c1c1c;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:90px;
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
}

.hdr{background:#111;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px}
.logo-name{font-family:‘Arial Black’,Arial,sans-serif;font-size:14px;color:#fff;letter-spacing:.5px}
.logo-sub{font-family:monospace;font-size:8px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-top:2px}
.hdr-stripe{height:4px;background:repeating-linear-gradient(-45deg,#b8390e 0 7px,#111 7px 14px)}

.wrap{padding:14px;max-width:560px;margin:0 auto}
.box{background:#FAF7F0;border:1.5px solid #1c1c1c;box-shadow:3px 3px 0 #1c1c1c;padding:14px 13px 4px;margin-bottom:14px;position:relative}
.box-lbl{position:absolute;top:-9px;left:11px;background:#F5F1E8;padding:0 7px;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em}
.f{margin-bottom:16px}
label{display:block;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em;color:#7a6f62;margin-bottom:7px}
label b{color:#b8390e;margin-right:7px}
input,textarea,select{
width:100%;background:transparent;border:none;border-bottom:1.5px solid #1c1c1c;
padding:6px 0 8px;font-family:Georgia,serif;font-size:16px;color:#1c1c1c;
outline:none;resize:none;border-radius:0;-webkit-appearance:none;appearance:none
}
input[type=date]{font-family:Georgia,serif;font-size:16px}
input:focus,textarea:focus{border-bottom-color:#b8390e}
textarea{min-height:150px;line-height:1.55}

.bottom-bar{
position:fixed;bottom:0;left:0;right:0;background:#111;
padding:10px 14px 14px;display:flex;gap:10px;z-index:200;
border-top:2px solid #b8390e
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
.bottom-bar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
.btn{
flex:1;background:#2A2A2A;color:#fff;border:1.5px solid #444;
font-family:monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;
padding:14px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;
display:flex;align-items:center;justify-content:center;
}
.btn:active{opacity:.8}
.btn-pdf{background:#b8390e;border-color:#b8390e;flex:1.5}

.toast{
position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(8px);
background:#111;color:#fff;font-family:monospace;font-size:10px;letter-spacing:1.5px;
padding:10px 18px;border-top:2px solid #b8390e;
opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:300
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── NUR DRUCKEN ── */
#print-doc{display:none}

@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
@page{margin:0;size:A4 portrait}
html,body{background:#fff!important;background-image:none!important;padding:0!important;margin:0!important}
body > *:not(#print-doc){display:none!important}

#print-doc{
display:block!important;
background:#fff!important;
font-family:Arial,Helvetica,sans-serif;
font-size:10pt;
color:#000;
line-height:1.5;
width:210mm;
min-height:297mm;
position:relative;
}

/*
DIN 5008 Form A — Anschriftfeld exakt für Fensterkuvert:
Anschriftzone: links 20mm, oben 27mm, Breite 85mm, Höhe 40mm
Absender-Kurzzeile startet bei ~27mm von oben
Empfänger bei ~32mm von oben
Textbeginn: links 25mm, oben 97mm
*/

/* Kopfbereich rechts (Absender-Block) */
.pr-absender-block{
position:absolute;
top:20mm;
left:125mm;
right:20mm;
font-size:10pt;
line-height:1.6;
}

/* Anschriftfeld (Fensterzone) */
.pr-anschrift-feld{
position:absolute;
top:27mm;
left:20mm;
width:85mm;
height:40mm;
}

/* Absender-Kurzzeile im Fenster */
.pr-absender-klein{
font-size:7pt;
color:#000;
border-bottom:0.3pt solid #000;
padding-bottom:1.5pt;
margin-bottom:3pt;
white-space:nowrap;
overflow:hidden;
line-height:1.3;
}

/* Empfänger-Anschrift */
.pr-empfaenger{
font-size:10pt;
line-height:1.45;
}

/* Datum rechtsbündig */
.pr-datum{
position:absolute;
top:80mm;
left:125mm;
right:20mm;
text-align:right;
font-size:10pt;
}

/* Textblock: DIN 5008 Form A — ab 103mm von oben */
.pr-textblock{
position:absolute;
top:103mm;
left:25mm;
right:20mm;
}

.pr-betreff{
font-size:10pt;
font-weight:bold;
margin-bottom:6mm;
}
.pr-anrede{
margin-bottom:6mm;
}
.pr-text{
margin-bottom:8mm;
white-space:pre-wrap;
text-align:justify;
line-height:1.5;
}
.pr-gruss{
margin-bottom:18mm;
}
.pr-name{
margin-bottom:8mm;
}
.pr-anlagen-titel{
font-size:9pt;
font-weight:bold;
margin-bottom:1.5mm;
}
.pr-anlagen-liste{
font-size:9pt;
padding-left:0;
list-style:none;
line-height:1.6;
}
.pr-anlagen-liste li::before{content:”– “;}
}
</style>

</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div>
      <div class="logo-name">BRIEF.PDF</div>
      <div class="logo-sub">BRIEFGENERATOR · DIN 5008 FORM A</div>
    </div>
  </div>
  <div class="hdr-stripe"></div>
</header>

<div class="wrap">

  <div class="box">
    <div class="box-lbl">Absender</div>
    <div class="f"><label><b>01</b>Name</label><input id="absName" autocomplete="off" placeholder="Erika Mustermann"></div>
    <div class="f"><label><b>02</b>Straße &amp; Hausnummer</label><input id="absStr" autocomplete="off" placeholder="Musterstraße 12"></div>
    <div class="f"><label><b>03</b>PLZ &amp; Ort</label><input id="absOrt" autocomplete="off" placeholder="12345 Berlin"></div>
    <div class="f"><label><b>04</b>E-Mail / Telefon (optional)</label><input id="absKontakt" autocomplete="off" placeholder="erika@gmail.com · 030 123456"></div>
  </div>

  <div class="box">
    <div class="box-lbl">Empfänger</div>
    <div class="f"><label><b>05</b>Firma / Name</label><input id="empName" autocomplete="off" placeholder="Google Germany GmbH"></div>
    <div class="f"><label><b>06</b>Straße &amp; Hausnummer</label><input id="empStr" autocomplete="off" placeholder="ABC-Strasse 19"></div>
    <div class="f"><label><b>07</b>PLZ &amp; Ort</label><input id="empOrt" autocomplete="off" placeholder="20354 Hamburg"></div>
  </div>

  <div class="f"><label><b>08</b>Datum</label><input type="date" id="datum"></div>
  <div class="f"><label><b>09</b>Betreff</label><input id="betreff" autocomplete="off" placeholder="Betreff des Briefes"></div>
  <div class="f"><label><b>10</b>Anrede</label><input id="anrede" autocomplete="off" placeholder="Sehr geehrte Damen und Herren,"></div>
  <div class="f"><label><b>11</b>Brieftext</label><textarea id="text" rows="10" placeholder="Schreiben Sie hier den Inhalt Ihres Briefes…"></textarea></div>
  <div class="f"><label><b>12</b>Grußformel</label><input id="gruss" autocomplete="off" placeholder="Mit freundlichen Grüßen"></div>

  <div class="box">
    <div class="box-lbl">Anlagen (optional)</div>
    <div class="f"><label><b>13</b>Anlage 1</label><input id="anl1" autocomplete="off" placeholder="Lebenslauf"></div>
    <div class="f"><label><b>14</b>Anlage 2</label><input id="anl2" autocomplete="off" placeholder="Zeugnisse"></div>
    <div class="f"><label><b>15</b>Anlage 3</label><input id="anl3" autocomplete="off" placeholder=""></div>
  </div>

</div>

<div id="print-doc"></div>

<div class="bottom-bar">
  <button class="btn" onclick="doReset()">↺ RESET</button>
  <button class="btn btn-pdf" onclick="doPDF()">⎙ PDF / DRUCKEN</button>
</div>
<div class="toast" id="toast"></div>

<script>
function g(id){return document.getElementById(id)}
function v(id){return g(id).value.trim()}
function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

var MO=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];

function datumFormatieren(iso){
  if(!iso)return"";
  var p=iso.split("-");
  return parseInt(p[2])+". "+MO[parseInt(p[1])-1]+" "+p[0];
}

function doPDF(){
  var absName=v("absName"),absStr=v("absStr"),absOrt=v("absOrt"),absKontakt=v("absKontakt");
  var empName=v("empName"),empStr=v("empStr"),empOrt=v("empOrt");
  var datum=datumFormatieren(v("datum"));
  var betreff=v("betreff"),anrede=v("anrede");
  var text=v("text"),gruss=v("gruss");
  var anl1=v("anl1"),anl2=v("anl2"),anl3=v("anl3");

  var h="";

  // Absender-Block rechts oben
  var absZeilen=[absName,absStr,absOrt,absKontakt].filter(Boolean);
  if(absZeilen.length){
    h+='<div class="pr-absender-block">'+absZeilen.map(esc).join("<br>")+'</div>';
  }

  // Anschriftfeld (Fensterzone DIN 5008 Form A)
  h+='<div class="pr-anschrift-feld">';
  // Absender-Kurzzeile
  var absKurz=[absName,absStr,absOrt].filter(Boolean).join(", ");
  if(absKurz) h+='<div class="pr-absender-klein">'+esc(absKurz)+'</div>';
  // Empfänger
  var empZeilen=[empName,empStr,empOrt].filter(Boolean);
  if(empZeilen.length)
    h+='<div class="pr-empfaenger">'+empZeilen.map(esc).join("<br>")+'</div>';
  h+='</div>';

  // Datum
  if(datum) h+='<div class="pr-datum">'+esc(datum)+'</div>';

  // Textblock
  h+='<div class="pr-textblock">';
  if(betreff) h+='<div class="pr-betreff">'+esc(betreff)+'</div>';
  if(anrede)  h+='<div class="pr-anrede">'+esc(anrede)+'</div>';
  if(text)    h+='<div class="pr-text">'+esc(text)+'</div>';
  if(gruss)   h+='<div class="pr-gruss">'+esc(gruss)+'</div>';
  if(absName) h+='<div class="pr-name">'+esc(absName)+'</div>';

  var anlagen=[anl1,anl2,anl3].filter(Boolean);
  if(anlagen.length){
    h+='<div class="pr-anlagen-titel">Anlagen:</div>';
    h+='<ul class="pr-anlagen-liste">'+anlagen.map(function(a){return"<li>"+esc(a)+"</li>"}).join("")+'</ul>';
  }
  h+='</div>';

  g("print-doc").innerHTML=h;
  window.print();
}

var FIELDS=["absName","absStr","absOrt","absKontakt","empName","empStr","empOrt",
            "datum","betreff","anrede","text","gruss","anl1","anl2","anl3"];

function setupSave(){
  FIELDS.forEach(function(id){
    var el=g(id);
    function save(){localStorage.setItem("brief_"+id,el.value);}
    el.addEventListener("input",save);
    el.addEventListener("change",save);
  });
}

function laden(){
  FIELDS.forEach(function(id){
    var val=localStorage.getItem("brief_"+id);
    if(val!==null) g(id).value=val;
  });
  if(!g("datum").value)
    g("datum").value=new Date().toISOString().slice(0,10);
}

function doReset(){
  FIELDS.forEach(function(id){
    g(id).value="";
    localStorage.removeItem("brief_"+id);
  });
  g("datum").value=new Date().toISOString().slice(0,10);
  localStorage.setItem("brief_datum",g("datum").value);
  var t=g("toast");
  t.textContent="✓ ZURÜCKGESETZT";
  t.classList.add("on");
  setTimeout(function(){t.classList.remove("on")},1800);
}

laden();
setupSave();
</script>

</body>
</html>
