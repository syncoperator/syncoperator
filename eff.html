<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Brief → PDF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --ink: #1a1a1a;
    --paper: #f4f1ea;
    --line: #2a2a2a;
    --accent: #b8390e;
    --muted: #6b6155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  body {
    background-image:
      radial-gradient(circle at 20% 10%, rgba(184, 57, 14, 0.04), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(26, 26, 26, 0.05), transparent 40%);
    padding: 24px 18px 60px;
  }
  .stage { max-width: 560px; margin: 0 auto; }
  header {
    border-bottom: 2px solid var(--line);
    padding-bottom: 18px;
    margin-bottom: 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .mark {
    font-family: 'Didot', 'Bodoni 72', 'Bodoni MT', Didot, serif;
    font-size: 32px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .mark em { font-style: italic; color: var(--accent); }
  .meta {
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .field { margin-bottom: 22px; }
  label {
    display: block;
    font-family: 'Courier New', Courier, monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--muted);
    margin-bottom: 8px;
  }
  label .num { color: var(--accent); margin-right: 8px; font-weight: 700; }
  input, textarea {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--line);
    padding: 8px 0 10px;
    font-family: inherit;
    font-size: 17px;
    color: var(--ink);
    outline: none;
    resize: none;
    border-radius: 0;
    -webkit-appearance: none;
  }
  input:focus, textarea:focus { border-bottom-color: var(--accent); }
  textarea { min-height: 180px; line-height: 1.5; }
  .group {
    border: 1.5px solid var(--line);
    padding: 16px 14px 4px;
    margin-bottom: 24px;
    position: relative;
  }
  .group-title {
    position: absolute;
    top: -9px;
    left: 12px;
    background: var(--paper);
    padding: 0 8px;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
  }
  .lang-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
  }
  .lang-toggle button {
    flex: 1;
    padding: 10px;
    background: transparent;
    border: 1.5px solid var(--line);
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    letter-spacing: 0.15em;
  }
  .lang-toggle button.active {
    background: var(--ink);
    color: var(--paper);
  }
  .actions { margin-top: 32px; display: flex; flex-direction: column; gap: 10px; }
  .actions button {
    width: 100%;
    padding: 18px;
    font-family: inherit;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    border: none;
    border-radius: 0;
    -webkit-appearance: none;
  }
  .btn-primary { background: var(--ink); color: var(--paper); letter-spacing: 0.04em; }
  .btn-primary::before { content: '→ '; color: var(--accent); }
  .btn-secondary {
    background: transparent;
    color: var(--ink);
    border: 1.5px solid var(--line);
    font-size: 14px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  footer {
    margin-top: 48px;
    text-align: center;
    font-family: 'Courier New', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: var(--muted);
  }
  footer span { color: var(--accent); }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--ink);
    color: var(--paper);
    padding: 14px 22px;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    transition: transform 0.3s ease;
    z-index: 100;
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--accent); }
</style>
</head>
<body>
<div class="stage">
  <header>
    <div class="mark" id="title">Brief<em>.</em>pdf</div>
    <div class="meta">№ 001</div>
  </header>

  <div class="lang-toggle">
    <button id="langDe" class="active" onclick="setLang('de')">Deutsch</button>
    <button id="langRu" onclick="setLang('ru')">Русский</button>
    <button id="langEn" onclick="setLang('en')">English</button>
  </div>

  <div class="group">
    <div class="group-title" data-i18n="from">Absender</div>
    <div class="field">
      <label><span class="num">01</span><span data-i18n="name">Name</span></label>
      <input id="fromName" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label><span class="num">02</span><span data-i18n="address">Adresse</span></label>
      <textarea id="fromAddr" rows="3"></textarea>
    </div>
  </div>

  <div class="group">
    <div class="group-title" data-i18n="to">Empfänger</div>
    <div class="field">
      <label><span class="num">03</span><span data-i18n="name">Name</span></label>
      <input id="toName" type="text" autocomplete="off">
    </div>
    <div class="field">
      <label><span class="num">04</span><span data-i18n="address">Adresse</span></label>
      <textarea id="toAddr" rows="3"></textarea>
    </div>
  </div>

  <div class="field">
    <label><span class="num">05</span><span data-i18n="date">Datum</span></label>
    <input id="date" type="date">
  </div>

  <div class="field">
    <label><span class="num">06</span><span data-i18n="subject">Betreff</span></label>
    <input id="subject" type="text" autocomplete="off">
  </div>

  <div class="field">
    <label><span class="num">07</span><span data-i18n="greeting">Anrede</span></label>
    <input id="greeting" type="text" autocomplete="off">
  </div>

  <div class="field">
    <label><span class="num">08</span><span data-i18n="body">Brieftext</span></label>
    <textarea id="body" rows="10"></textarea>
  </div>

  <div class="field">
    <label><span class="num">09</span><span data-i18n="closing">Grußformel</span></label>
    <input id="closing" type="text" autocomplete="off">
  </div>

  <div class="actions">
    <button class="btn-primary" id="genBtn" onclick="makePDF()">PDF erstellen</button>
    <button class="btn-secondary" id="clearBtn" onclick="clearAll()">Zurücksetzen</button>
  </div>

  <footer>
    Print-ready A4 <span>✦</span> Offline
  </footer>
</div>

<div class="toast" id="toast"></div>

      toName: 'Анна Сидорова', toAddr: 'пр. Невский, 25
191000 СПб
Россия',
      subject: 'Касательно нашего соглашения', greeting: 'Уважаемая Анна,',
      body: 'Пишите здесь основной текст...', closing: 'С уважением,'
    }
  },
  en: {
    title: 'Letter.pdf', from: 'Sender', to: 'Recipient',
    name: 'Name', address: 'Address', date: 'Date',
    subject: 'Subject', greeting: 'Greeting', body: 'Body',
    closing: 'Closing', gen: 'Create PDF', clear: 'Reset',
    confirm: 'Clear all fields?', done: 'PDF saved',
    err: 'Error creating PDF', subjPrefix: 'Subject: ',
    placeholders: {
      fromName: 'John Doe', fromAddr: '1 Main Street
New York, NY 10001
USA',
      toName: 'Jane Smith', toAddr: '25 Park Avenue
Boston, MA 02101
USA',
      subject: 'Regarding our agreement', greeting: 'Dear Jane,',
      body: 'Write your letter here...', closing: 'Best regards,'
    }
  }
};

let currentLang = localStorage.getItem('letter_lang') || 'de';

function setLang(lang) {
  currentLang = lang;
  localStorage.setItem('letter_lang', lang);
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.getElementById('title').innerHTML = t.title.replace('.', '<em>.</em>');
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key]) el.textContent = t[key];
  });
  document.getElementById('genBtn').textContent = t.gen;
  document.getElementById('clearBtn').textContent = t.clear;
  for (const [id, ph] of Object.entries(t.placeholders)) {
    const el = document.getElementById(id);
    if (el) el.placeholder = ph;
  }
  ['langDe','langRu','langEn'].forEach(b => document.getElementById(b).classList.remove('active'));
  document.getElementById('lang' + lang.charAt(0).toUpperCase() + lang.slice(1)).classList.add('active');
}

setLang(currentLang);

// Сохранение полей
const fields = ['fromName','fromAddr','toName','toAddr','date','subject','greeting','body','closing'];
fields.forEach(id => {
  const el = document.getElementById(id);
  const saved = sessionStorage.getItem('lt_' + id);
  if (saved) el.value = saved;
  el.addEventListener('input', () => sessionStorage.setItem('lt_' + id, el.value));
});

if (!document.getElementById('date').value) {
  document.getElementById('date').value = new Date().toISOString().slice(0,10);
}

function showToast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function clearAll() {
  if (!confirm(I18N[currentLang].confirm)) return;
  fields.forEach(id => {
    document.getElementById(id).value = '';
    sessionStorage.removeItem('lt_' + id);
  });
  document.getElementById('date').value = new Date().toISOString().slice(0,10);
}

function formatDate(iso, lang) {
  if (!iso) return '';
  const [y,m,d] = iso.split('-');
  const day = parseInt(d), mon = parseInt(m) - 1;
  if (lang === 'ru') {
    const months = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
    return `${day} ${months[mon]} ${y} г.`;
  }
  if (lang === 'de') {
    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    return `${day}. ${months[mon]} ${y}`;
  }
  const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  return `${months[mon]} ${day}, ${y}`;
}

function makePDF() {
  try {
    if (!window.jspdf) {
      showToast(I18N[currentLang].err + ': jsPDF', true);
      return;
    }
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4', putOnlyUsedFonts: true });

    // Встраиваем шрифты
    doc.addFileToVFS('PlexSerif.ttf', FONT_REG);
    doc.addFont('PlexSerif.ttf', 'PlexSerif', 'normal');
    doc.addFileToVFS('PlexSerif-Bold.ttf', FONT_BOLD);
    doc.addFont('PlexSerif-Bold.ttf', 'PlexSerif', 'bold');
    doc.setFont('PlexSerif', 'normal');

    const v = id => document.getElementById(id).value.trim();
    const fromName = v('fromName');
    const fromAddr = v('fromAddr');
    const toName   = v('toName');
    const toAddr   = v('toAddr');
    const date     = formatDate(v('date'), currentLang);
    const subject  = v('subject');
    const greeting = v('greeting');
    const body     = v('body');
    const closing  = v('closing');

    const margin = 25;
    const pageW = 210;
    const pageH = 297;
    const maxW = pageW - margin * 2;
    let y = margin;

    // Отправитель — справа сверху
    doc.setFontSize(10);
    if (fromName || fromAddr) {
      const fromLines = [fromName, ...fromAddr.split('
')].filter(Boolean);
      fromLines.forEach((line, i) => {
        const w = doc.getTextWidth(line);
        doc.text(line, pageW - margin - w, y + i * 5);
      });
      y += fromLines.length * 5 + 10;
    } else {
      y += 10;
    }

    // Получатель — слева
    if (toName || toAddr) {
      doc.setFontSize(11);
      const toLines = [toName, ...toAddr.split('
')].filter(Boolean);
      toLines.forEach((line, i) => {
        doc.text(line, margin, y + i * 5.5);
      });
      y += toLines.length * 5.5 + 10;
    }

    // Дата справа
    if (date) {
      doc.setFontSize(11);
      const w = doc.getTextWidth(date);
      doc.text(date, pageW - margin - w, y);
      y += 12;
    }

    // Тема
    if (subject) {
      doc.setFont('PlexSerif', 'bold');
      doc.setFontSize(12);
      const subjLines = doc.splitTextToSize(I18N[currentLang].subjPrefix + subject, maxW);
      doc.text(subjLines, margin, y);
      y += subjLines.length * 6 + 6;
      doc.setFont('PlexSerif', 'normal');
    }

    // Приветствие
    if (greeting) {
      doc.setFontSize(12);
      doc.text(greeting, margin, y);
      y += 8;
    }

    // Текст
    if (body) {
      doc.setFontSize(12);
      const paragraphs = body.split('
');
      for (const p of paragraphs) {
        if (!p.trim()) { y += 4; continue; }
        const lines = doc.splitTextToSize(p, maxW);
        for (const line of lines) {
          if (y > pageH - margin - 30) {
            doc.addPage();
            y = margin;
          }
          doc.text(line, margin, y);
          y += 6.5;
        }
        y += 3;
      }
      y += 6;
    }

    // Подпись
    if (closing || fromName) {
      if (y > pageH - margin - 20) { doc.addPage(); y = margin; }
      doc.setFontSize(12);
      if (closing) { doc.text(closing, margin, y); y += 8; }
      if (fromName) { doc.text(fromName, margin, y); }
    }

    const safe = s => (s || 'letter').replace(/[^a-zA-Zа-яА-ЯäöüÄÖÜß0-9]+/g,'_').slice(0,40);
    const fname = safe(toName ? 'brief-' + toName : 'brief') + '.pdf';
    doc.save(fname);
    showToast(I18N[currentLang].done);
  } catch (e) {
    console.error(e);
    showToast(I18N[currentLang].err + ': ' + e.message, true);
  }
}
