<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Produktions-Effizienz | Premium</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --surface: #ffffff;
            --accent: #007aff;
            --text-main: #1c1c1e;
            --text-sec: #8e8e93;
            --border: #d1d1d6;
            --positive: #34c759;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            margin: 0; padding: 0; background: var(--bg); 
            font-family: -apple-system, sans-serif; color: var(--text-main);
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 100px; }
        
        header { margin-bottom: 25px; border-left: 4px solid var(--accent); padding-left: 15px; }
        header h1 { font-size: 20px; font-weight: 800; margin: 0; letter-spacing: -0.5px; }
        header p { color: var(--text-sec); font-size: 13px; margin: 2px 0 0; text-transform: uppercase; }

        .card { 
            background: var(--surface); border-radius: 14px; padding: 20px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.04); border: 1px solid var(--border);
            margin-bottom: 15px;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-sec); margin-bottom: 6px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1.5px solid var(--border); 
            font-size: 16px; background: #fff; font-weight: 600; outline: none;
        }
        input:focus { border-color: var(--accent); }

        .highlight-box { 
            background: #f8f9ff; border: 2px solid var(--accent); text-align: center; 
            padding: 20px; border-radius: 14px; grid-column: span 2;
        }
        .big-val { font-size: 32px; font-weight: 900; color: var(--accent); display: block; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; font-size: 11px; color: var(--text-sec); padding: 10px 5px; text-transform: uppercase; border-bottom: 2px solid var(--text-main); }
        td { padding: 14px 5px; border-bottom: 1px solid var(--border); font-size: 15px; }
        .val-neu { color: var(--accent); font-weight: 800; }

        footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 90px; 
            background: rgba(255,255,255,0.9); backdrop-filter: blur(10px);
            border-top: 1px solid var(--border); display: flex; align-items: center; 
            padding: 0 20px calc(env(safe-area-inset-bottom) + 5px); gap: 12px;
        }
        .btn { 
            height: 54px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; 
            font-size: 14px; flex: 1; text-transform: uppercase;
        }
        .btn-pdf { background: var(--text-main); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EFFIZIENZ-ANALYSE</h1>
        <p>Premium Production Tool</p>
    </header>

    <section class="card">
        <div class="input-row">
            <div style="grid-column: span 2;">
                <label>Gesamtstückzahl (Штук всего)</label>
                <input type="number" id="stk" value="1000" oninput="calc()">
            </div>
            <div>
                <label>Zeit ALT (Min : Sek)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="am" value="5" oninput="calc()">
                    <input type="number" id="as" value="30" oninput="calc()">
                </div>
            </div>
            <div>
                <label>Zeit NEU (Min : Sek)</label>
                <div style="display:flex; gap:5px;">
                    <input type="number" id="nm" value="4" oninput="calc()">
                    <input type="number" id="ns" value="15" oninput="calc()">
                </div>
            </div>
        </div>
        <div class="input-row">
            <div>
                <label>Abendschicht (шт)</label>
                <input type="number" id="abend" value="50" oninput="calc()">
            </div>
            <div>
                <label>Schichtzeit (Std)</label>
                <input type="number" id="sh" value="7.5" oninput="calc()">
            </div>
        </div>
    </section>

    <div class="input-row" style="padding: 0 5px;">
        <div class="highlight-box">
            <span class="big-val" id="res-saving">0h 0m</span>
            <label style="color: var(--accent); margin:0;">Gesamte Zeitersparnis</label>
        </div>
    </div>

    <section class="card">
        <table>
            <thead>
                <tr>
                    <th>Parameter</th>
                    <th>Alt</th>
                    <th>Neu</th>
                </tr>
            </thead>
            <tbody id="table-body">
                <tr>
                    <td>Sekunden / Stk</td>
                    <td id="s-alt-s">-</td>
                    <td class="val-neu" id="s-neu-s">-</td>
                </tr>
                <tr>
                    <td>Stk / Schicht</td>
                    <td id="s-alt-sh">-</td>
                    <td class="val-neu" id="s-neu-sh">-</td>
                </tr>
                <tr>
                    <td>Gesamtzeit</td>
                    <td id="s-alt-tot">-</td>
                    <td class="val-neu" id="s-neu-tot">-</td>
                </tr>
                <tr>
                    <td>Schichten</td>
                    <td id="s-alt-sch">-</td>
                    <td class="val-neu" id="s-neu-sch">-</td>
                </tr>
            </tbody>
        </table>
    </section>
</div>

<footer-nav>
    <button class="btn btn-pdf" onclick="generatePDF()">Bericht PDF Erstellen</button>
</footer-nav>

<script>
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const shSec = parseFloat(document.getElementById('sh').value) * 3600;
        const tA = (parseFloat(document.getElementById('am').value) * 60) + (parseFloat(document.getElementById('as').value) || 0);
        const tN = (parseFloat(document.getElementById('nm').value) * 60) + (parseFloat(document.getElementById('ns').value) || 0);

        const totA = stk * tA;
        const totN = stk * tN;
        const save = totA - totN;

        const fTime = (s) => `${Math.floor(s/3600)}h ${Math.floor((s%3600)/60)}m`;

        document.getElementById('res-saving').innerText = fTime(save);
        document.getElementById('s-alt-s').innerText = tA + " s";
        document.getElementById('s-neu-s').innerText = tN + " s";
        document.getElementById('s-alt-sh').innerText = (shSec / tA).toFixed(1);
        document.getElementById('s-neu-sh').innerText = (shSec / tN).toFixed(1);
        document.getElementById('s-alt-tot').innerText = fTime(totA);
        document.getElementById('s-neu-tot').innerText = fTime(totN);
        document.getElementById('s-alt-sch').innerText = (totA / shSec).toFixed(1);
        document.getElementById('s-neu-sch').innerText = (totN / shSec).toFixed(1);
    }

    async function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        
        // Settings
        const accent = [0, 122, 255];
        const stk = document.getElementById('stk').value;
        const saving = document.getElementById('res-saving').innerText;

        // Header
        doc.setFillColor(245, 245, 247);
        doc.rect(0, 0, 210, 40, 'F');
        doc.setDrawColor(accent[0], accent[1], accent[2]);
        doc.setLineWidth(1.5);
        doc.line(10, 15, 10, 30);

        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.setTextColor(30, 30, 30);
        doc.text("EFFIZIENZ-BERICHT", 15, 22);
        
        doc.setFontSize(10);
        doc.setTextColor(100, 100, 100);
        doc.text("PRODUKTIONSOPTIMIERUNG CNC", 15, 28);
        doc.text(new Date().toLocaleDateString('de-DE'), 170, 22);

        // Main Metric Box
        doc.setDrawColor(200, 200, 200);
        doc.setLineWidth(0.5);
        doc.roundedRect(10, 50, 190, 35, 3, 3, 'S');
        
        doc.setFontSize(12);
        doc.text("GESAMTE ZEITERSPARNIS:", 105, 62, {align: "center"});
        doc.setFontSize(30);
        doc.setTextColor(accent[0], accent[1], accent[2]);
        doc.text(saving, 105, 75, {align: "center"});

        // Table
        doc.autoTable({
            startY: 95,
            head: [['PARAMETER', 'STATUS: ALT', 'STATUS: NEU']],
            body: [
                ['Gesamtstückzahl', stk, stk],
                ['Zeit pro Stück', document.getElementById('s-alt-s').innerText, document.getElementById('s-neu-s').innerText],
                ['Stück pro Schicht', document.getElementById('s-alt-sh').innerText, document.getElementById('s-neu-sh').innerText],
                ['Gesamtzeit (Produktion)', document.getElementById('s-alt-tot').innerText, document.getElementById('s-neu-tot').innerText],
                ['Benötigte Schichten', document.getElementById('s-alt-sch').innerText, document.getElementById('s-neu-sch').innerText]
            ],
            theme: 'grid',
            headStyles: { fillColor: [30, 30, 30], textColor: 255, fontStyle: 'bold', halign: 'center' },
            styles: { fontSize: 11, cellPadding: 8 },
            columnStyles: { 
                1: { halign: 'center' }, 
                2: { halign: 'center', fontStyle: 'bold', textColor: accent } 
            }
        });

        // Conclusion
        const finalY = doc.lastAutoTable.finalY + 20;
        doc.setFontSize(14);
        doc.setTextColor(30, 30, 30);
        const savedShifts = (parseFloat(document.getElementById('s-alt-sch').innerText) - parseFloat(document.getElementById('s-neu-sch').innerText)).toFixed(1);
        doc.text(`Ergebnis: Wir sparen ca. ${savedShifts} Arbeitsschichten ein.`, 10, finalY);
        
        doc.setDrawColor(accent[0], accent[1], accent[2]);
        doc.setLineWidth(1);
        doc.line(10, finalY + 2, 200, finalY + 2);

        doc.save(`Effizienz_Bericht_${stk}_Stk.pdf`);
    }

    calc();
</script>

</body>
</html>
