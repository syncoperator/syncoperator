<style>
/**
 * Brief Generator – Mobile Edition (Single File)
 * Original print layout © 2016 Kim-Christian Meyer (GPL-3.0+)
 * Mobile rewrite preserves baseline grid (7pt) and DIN lang window position.
 */

:root {
  --ink: #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-mute: #8a8a8a;
  --paper: #ffffff;
  --bg: #f4f3ef;
  --bg-card: #ffffff;
  --line: #e5e2dc;
  --line-strong: #d6d2c8;
  --accent: #1a1a1a;
  --accent-ink: #ffffff;
  --danger: #c1432f;
  --shadow-sm: 0 1px 2px rgba(20,18,14,.04), 0 2px 6px rgba(20,18,14,.04);
  --shadow-md: 0 4px 12px rgba(20,18,14,.08), 0 12px 32px rgba(20,18,14,.06);
  --shadow-lg: 0 10px 40px rgba(20,18,14,.12), 0 30px 80px rgba(20,18,14,.08);
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --display: 'Playfair Display', Georgia, serif;
  --body: 'Fira Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  overflow-x: hidden;
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
input, textarea { font-family: inherit; }

/* === MOBILE EDITOR === */
.editor {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}

.editor-header {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  padding-top: max(14px, env(safe-area-inset-top));
  background: rgba(244,243,239,.92);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--line);
}

.brand {
  display: flex;
  align-items: baseline;
  gap: 10px;
}

.brand-mark {
  font-size: 20px;
  line-height: 1;
  transform: translateY(2px);
}

.brand-name {
  font-family: var(--display);
  font-weight: 900;
  font-size: 22px;
  letter-spacing: -.01em;
  font-style: italic;
}

.btn-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--ink);
  transition: background .15s ease;
}
.btn-icon:hover, .btn-icon:active { background: rgba(0,0,0,.06); }

.drafts-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 18px 4px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.drafts-bar::-webkit-scrollbar { display: none; }

.drafts-list {
  display: flex;
  gap: 8px;
  flex-wrap: nowrap;
}

.draft-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 6px 8px 14px;
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: all .15s ease;
  flex-shrink: 0;
}
.draft-chip:hover { border-color: var(--line-strong); color: var(--ink); }
.draft-chip.is-active {
  background: var(--ink);
  color: var(--accent-ink);
  border-color: var(--ink);
}
.draft-chip-name {
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.draft-chip-x {
  display: grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  margin-left: 2px;
  color: inherit;
  opacity: .55;
  transition: opacity .15s ease, background .15s ease;
}
.draft-chip-x:hover, .draft-chip-x:active {
  opacity: 1;
  background: rgba(255,255,255,.15);
}
.draft-chip:not(.is-active) .draft-chip-x:hover {
  background: rgba(0,0,0,.08);
}
.new-chip {
  background: transparent;
  border: 1px dashed var(--line-strong);
  color: var(--ink-soft);
  padding: 8px 14px;
}
.new-chip:hover { background: var(--bg-card); }

.form {
  flex: 1;
  padding: 8px 18px 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.form-section {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  padding: 20px 18px;
  box-shadow: var(--shadow-sm);
}

.section-label {
  display: flex;
  align-items: baseline;
  gap: 12px;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

.section-num {
  font-family: var(--display);
  font-style: italic;
  font-size: 14px;
  color: var(--ink-mute);
}

.section-label h2 {
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .02em;
  text-transform: uppercase;
  color: var(--ink);
}

.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin-bottom: 14px;
}
.field:last-child { margin-bottom: 0; }

.field-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  letter-spacing: .02em;
}

.field-opt {
  color: var(--ink-mute);
  font-weight: 400;
  font-style: italic;
}

.field input,
.field textarea {
  width: 100%;
  padding: 12px 14px;
  font-size: 16px;
  line-height: 1.4;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: var(--radius-md);
  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
  -webkit-appearance: none;
  appearance: none;
}

.field textarea {
  resize: vertical;
  min-height: 60px;
  font-family: var(--body);
}

.field input:focus,
.field textarea:focus {
  outline: none;
  border-color: var(--ink);
  background: var(--paper);
  box-shadow: 0 0 0 3px rgba(26,26,26,.08);
}

.field input::placeholder,
.field textarea::placeholder { color: var(--ink-mute); }

.templates {
  display: flex;
  gap: 6px;
  margin-bottom: 16px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 4px;
}
.templates::-webkit-scrollbar { display: none; }

.template-pill {
  padding: 7px 12px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-soft);
  white-space: nowrap;
  transition: all .15s ease;
  flex-shrink: 0;
}
.template-pill:hover {
  background: var(--ink);
  color: var(--accent-ink);
  border-color: var(--ink);
}
.template-pill:active { transform: scale(.96); }

.form-spacer { height: 90px; }

.action-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  gap: 10px;
  padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
  background: rgba(244,243,239,.94);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-top: 1px solid var(--line);
}

.action-btn {
  flex: 1;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 16px;
  border-radius: var(--radius-md);
  font-size: 15px;
  font-weight: 500;
  letter-spacing: .01em;
  transition: transform .1s ease, background .15s ease;
}
.action-btn:active { transform: scale(.98); }

.action-primary { background: var(--ink); color: var(--accent-ink); }
.action-primary:hover { background: #000; }

.action-secondary {
  background: var(--bg-card);
  color: var(--ink);
  border: 1px solid var(--line);
}
.action-secondary:hover { border-color: var(--line-strong); }

/* === MENU OVERLAY === */
.menu-overlay {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(20,18,14,.4);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  animation: fadeIn .2s ease;
}
.menu-overlay[hidden] { display: none; }

.menu-sheet {
  position: relative;
  width: 100%;
  max-width: 520px;
  background: var(--bg-card);
  border-radius: 24px 24px 0 0;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow: var(--shadow-lg);
  animation: slideUp .25s cubic-bezier(.2,.8,.2,1);
}

.menu-sheet h3 {
  font-family: var(--display);
  font-style: italic;
  font-weight: 700;
  font-size: 20px;
  margin-bottom: 14px;
  padding-right: 40px;
}

.menu-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  color: var(--ink-soft);
}
.menu-close:hover { background: var(--bg); color: var(--ink); }

.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 14px 12px;
  border-radius: var(--radius-md);
  font-size: 15px;
  color: var(--ink);
  text-align: left;
  transition: background .15s ease;
}
.menu-item:hover { background: var(--bg); }

.menu-item-danger { color: var(--danger); }

.menu-hint {
  margin-top: 12px;
  padding: 12px;
  background: var(--bg);
  border-radius: var(--radius-md);
  font-size: 12px;
  line-height: 1.5;
  color: var(--ink-soft);
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* === TOAST === */
.toast {
  position: fixed;
  bottom: calc(90px + env(safe-area-inset-bottom));
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  z-index: 200;
  padding: 10px 18px;
  background: var(--ink);
  color: var(--accent-ink);
  font-size: 13px;
  border-radius: 999px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s ease, transform .2s ease;
  white-space: nowrap;
  box-shadow: var(--shadow-md);
}
.toast.is-visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* === A4 PREVIEW (preserves original print layout) === */
.preview {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 50;
  background: rgba(20,18,14,.7);
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.preview.is-open { display: block; }

.preview-header {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top));
  background: rgba(20,18,14,.85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  color: white;
}

.preview-back, .preview-print {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 500;
  color: white;
  transition: background .15s ease;
}
.preview-back:hover { background: rgba(255,255,255,.1); }
.preview-print { background: white; color: var(--ink); }
.preview-print:hover { background: rgba(255,255,255,.9); }

/* The actual A4 page – wrapped so scaling preserves layout */
.page-wrap {
  display: flex;
  justify-content: center;
  padding: 20px 12px 40px;
}

.page {
  position: relative;
  width: 210mm;
  min-width: 210mm;
  height: 297mm;
  padding: 24mm;
  background: var(--paper);
  box-shadow: 0 5px 50px rgba(0,0,0,.4);
  font-family: 'Fira Sans', sans-serif;
  font-size: 10pt;
  line-height: 14pt;
  color: #000;
  box-sizing: border-box;
  transform-origin: top left;
  flex-shrink: 0;
}

.address-overlay {
  position: absolute;
  left: 15mm;
  top: 46.5mm;
  width: 90mm;
  height: 45mm;
  border-radius: 4mm;
  background: rgba(0,0,0,.04);
  z-index: 0;
}

.address-wrapper {
  position: absolute;
  left: 20mm;
  top: 126pt;
  width: 90mm;
  padding: 14pt 4mm;
  z-index: 10;
  box-sizing: border-box;
}

.address-overline {
  font-size: 8pt;
  line-height: 12pt;
  padding-top: 5.1pt;
  margin-bottom: 8pt;
  color: #555;
}

.address-block {
  font-size: 10pt;
  line-height: 14pt;
  padding-top: 4.7pt;
}

.sidebar {
  position: absolute;
  right: 24mm;
  top: 70pt;
  width: 40mm;
  height: 182pt;
  font-size: 8pt;
  line-height: 12pt;
}

.sidebar-inner {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding-bottom: 1.4pt;
}

.sidebar-text { white-space: pre-line; }

.body {
  position: absolute;
  left: 24mm;
  top: 308pt;
  right: 24mm;
  padding-top: 4.7pt;
  font-size: 10pt;
  line-height: 14pt;
}

.body-subject {
  font-weight: bold;
  margin-bottom: 14pt;
  font-size: 10pt;
}

.body-text { white-space: pre-line; }
.body-text p { margin: 0 0 14pt 0; }

.footer-attachments {
  margin-top: 21pt;
  font-size: 8pt;
  line-height: 12pt;
}

.footer-attachments .attachments-hd {
  font-style: italic;
  font-weight: bold;
  margin: 0;
}

.footer-attachments .attachments-bd { white-space: pre-line; }

.line {
  position: absolute;
  left: 5mm;
  height: 0.3mm;
  background: rgba(0,0,0,.3);
  display: block;
}
.line-1 { top: 105mm; width: 3mm; }
.line-2 { top: 148.5mm; width: 5mm; }
.line-3 { top: 210mm; width: 3mm; }

/* === RESPONSIVE PREVIEW SCALING ===
   Page is rendered at 210mm and JS sets a CSS variable --scale.
   We use a wrapper to absorb the scaled size so layout stays clean. */
.page {
  transform: scale(var(--scale, 1));
}

.page-wrap {
  /* Reserve space equal to the scaled page so scrolling works */
  min-height: calc(297mm * var(--scale, 1) + 60px);
  width: 100%;
}

.page-sizer {
  width: calc(210mm * var(--scale, 1));
  height: calc(297mm * var(--scale, 1));
  position: relative;
}

@media (max-width: 420px) {
  .editor-header { padding-left: 16px; padding-right: 12px; }
  .form { padding-left: 14px; padding-right: 14px; }
  .form-section { padding: 18px 14px; }
}

@media (min-width: 900px) {
  .editor {
    max-width: 720px;
    margin: 0 auto;
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
    background: var(--bg);
  }
  .action-bar {
    max-width: 720px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 1px solid var(--line);
    border-right: 1px solid var(--line);
  }
}

/* === PRINT === */
@media print {
  @page { size: A4; margin: 0; }

  html, body {
    background: white !important;
    width: 210mm;
    height: 297mm;
    --scale: 1 !important;
  }

  .no-print, .editor, .preview-header, .menu-overlay, .toast, .action-bar {
    display: none !important;
  }

  .preview {
    display: block !important;
    position: static !important;
    background: white !important;
    overflow: visible !important;
  }

  .page-wrap, .page-sizer {
    padding: 0 !important;
    margin: 0 !important;
    width: 210mm !important;
    height: 297mm !important;
    min-height: 0 !important;
    display: block !important;
  }

  .page {
    margin: 0 !important;
    padding: 24mm !important;
    box-shadow: none !important;
    width: 210mm !important;
    height: 297mm !important;
    transform: none !important;
    page-break-after: avoid;
  }

  .address-overlay { display: none; }
}
</style>

<script>
/**

(function () {
  'use strict';

  const STORAGE_KEY = 'brief-generator-mobile-v1';
  const ACTIVE_KEY  = 'brief-generator-mobile-active';

  const blankDraft = () => ({
    id: 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: 'Neuer Entwurf',
    updated: Date.now(),
    fields: {
      senderName: '', senderAddress: '', senderEmail: '', senderPhone: '',
      recipientName: '', recipientAddress: '',
      date: formatToday(),
      subject: '',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: '',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    }
  });

  const TEMPLATES = {
    bewerbung: {
      name: 'Bewerbung',
      subject: 'Bewerbung als [Position]',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: 'mit großem Interesse habe ich Ihre Stellenanzeige gelesen und möchte mich hiermit auf die Position als [Position] bewerben.\n\nIn meiner bisherigen Tätigkeit konnte ich umfangreiche Erfahrungen in [Bereich] sammeln. Besonders meine Kenntnisse in [Fähigkeit 1] und [Fähigkeit 2] qualifizieren mich für diese Stelle.\n\nIch freue mich darauf, Sie in einem persönlichen Gespräch von meiner Motivation zu überzeugen.',
      closing: 'Mit freundlichen Grüßen',
      attachments: 'Lebenslauf\nZeugnisse\nReferenzen'
    },
    kuendigung: {
      name: 'Kündigung',
      subject: 'Kündigung meines Vertrags zum nächstmöglichen Termin',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: 'hiermit kündige ich meinen oben genannten Vertrag fristgerecht zum nächstmöglichen Termin.\n\nBitte bestätigen Sie mir den Eingang der Kündigung sowie das Vertragsende schriftlich.',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    },
    widerspruch: {
      name: 'Widerspruch',
      subject: 'Widerspruch gegen [Bescheid/Rechnung] vom [Datum]',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: 'gegen den oben genannten Bescheid lege ich hiermit fristgerecht Widerspruch ein.\n\nBegründung: [Bitte hier Ihre Begründung einfügen]\n\nIch bitte um Prüfung des Sachverhalts und um schriftliche Stellungnahme.',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    },
    anfrage: {
      name: 'Anfrage',
      subject: 'Anfrage bezüglich [Thema]',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: 'ich wende mich mit folgendem Anliegen an Sie:\n\n[Bitte hier Ihre Anfrage konkret formulieren]\n\nÜber eine baldige Rückmeldung würde ich mich sehr freuen.',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    },
    dank: {
      name: 'Dankschreiben',
      subject: 'Vielen Dank',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: 'ich möchte mich auf diesem Wege herzlich bei Ihnen für [Anlass] bedanken.\n\n[Persönliche Worte hier ergänzen]\n\nVielen Dank nochmals für Ihre Mühe.',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    },
    leer: {
      name: 'Leer',
      subject: '',
      greeting: 'Sehr geehrte Damen und Herren,',
      body: '',
      closing: 'Mit freundlichen Grüßen',
      attachments: ''
    }
  };

  let drafts = {};
  let activeId = null;
  let saveTimer = null;

  const $ = id => document.getElementById(id);

  const els = {
    senderName: $('f-sender-name'), senderAddress: $('f-sender-address'),
    senderEmail: $('f-sender-email'), senderPhone: $('f-sender-phone'),
    recipientName: $('f-recipient-name'), recipientAddress: $('f-recipient-address'),
    date: $('f-date'), subject: $('f-subject'), greeting: $('f-greeting'),
    body: $('f-body'), closing: $('f-closing'), attachments: $('f-attachments'),
    draftsList: $('drafts-list'), newDraftBtn: $('new-draft-btn'),
    menuBtn: $('menu-btn'), menuOverlay: $('menu-overlay'), menuClose: $('menu-close'),
    menuRename: $('menu-rename'), menuDuplicate: $('menu-duplicate'),
    menuExport: $('menu-export'), menuImport: $('menu-import'), menuDelete: $('menu-delete'),
    importFile: $('import-file'),
    previewBtn: $('preview-btn'), pdfBtn: $('pdf-btn'),
    preview: $('preview'), previewBack: $('preview-back'), previewPrint: $('preview-print'),
    pOverline: $('p-overline'), pRecipient: $('p-recipient'),
    pSidebar: $('p-sidebar'), pSubject: $('p-subject'),
    pBody: $('p-body'), pAttachments: $('p-attachments'),
    templates: document.querySelectorAll('.template-pill'),
    toast: $('toast')
  };

  const FIELD_MAP = {
    senderName: 'senderName', senderAddress: 'senderAddress',
    senderEmail: 'senderEmail', senderPhone: 'senderPhone',
    recipientName: 'recipientName', recipientAddress: 'recipientAddress',
    date: 'date', subject: 'subject', greeting: 'greeting',
    body: 'body', closing: 'closing', attachments: 'attachments'
  };

  function formatToday() {
    const months = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
    const d = new Date();
    return d.getDate() + '. ' + months[d.getMonth()] + ' ' + d.getFullYear();
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function showToast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add('is-visible');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => els.toast.classList.remove('is-visible'), 2200);
  }

  function loadDrafts() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) drafts = JSON.parse(raw) || {};
    } catch (e) { drafts = {}; }

    activeId = localStorage.getItem(ACTIVE_KEY);

    if (Object.keys(drafts).length === 0) {
      const d = blankDraft();
      drafts[d.id] = d;
      activeId = d.id;
    }
    if (!activeId || !drafts[activeId]) activeId = Object.keys(drafts)[0];
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(drafts));
      localStorage.setItem(ACTIVE_KEY, activeId);
    } catch (e) { showToast('Speichern fehlgeschlagen'); }
  }

  function debouncedSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const d = drafts[activeId];
      if (!d) return;
      d.updated = Date.now();
      // Auto-name from subject or recipient, but only if it looks like real text
      if (d.name === 'Neuer Entwurf' || !d.name) {
        const candidate = (d.fields.subject || d.fields.recipientName || '').trim();
        // Require at least 2 letters/digits (not just punctuation/symbols)
        if (candidate && /[\p{L}\p{N}]{2,}/u.test(candidate)) {
          d.name = candidate.slice(0, 30);
        }
      }
      persist();
      renderDrafts();
    }, 400);
  }

  function fillForm(draft) {
    Object.keys(FIELD_MAP).forEach(k => {
      const el = els[FIELD_MAP[k]];
      if (el) el.value = draft.fields[k] || '';
    });
  }

  function getFromForm() {
    const fields = {};
    Object.keys(FIELD_MAP).forEach(k => {
      const el = els[FIELD_MAP[k]];
      fields[k] = el ? el.value : '';
    });
    return fields;
  }

  function onFieldChange() {
    const d = drafts[activeId];
    if (!d) return;
    d.fields = getFromForm();
    debouncedSave();
  }

  function renderDrafts() {
    const list = Object.values(drafts).sort((a, b) => b.updated - a.updated);
    els.draftsList.innerHTML = '';
    list.forEach(d => {
      const btn = document.createElement('button');
      btn.className = 'draft-chip' + (d.id === activeId ? ' is-active' : '');
      btn.type = 'button';
      btn.dataset.id = d.id;

      const nameSpan = document.createElement('span');
      nameSpan.className = 'draft-chip-name';
      nameSpan.textContent = d.name || 'Ohne Titel';
      btn.appendChild(nameSpan);

      const xBtn = document.createElement('span');
      xBtn.className = 'draft-chip-x';
      xBtn.setAttribute('role', 'button');
      xBtn.setAttribute('aria-label', 'Entwurf löschen');
      xBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
      xBtn.addEventListener('click', e => {
        e.stopPropagation();
        deleteDraftById(d.id);
      });
      btn.appendChild(xBtn);

      btn.addEventListener('click', () => switchDraft(d.id));
      els.draftsList.appendChild(btn);
    });
  }

  function deleteDraftById(id) {
    const d = drafts[id];
    if (!d) return;
    if (!confirm('Entwurf "' + (d.name || 'Ohne Titel') + '" wirklich löschen?')) return;
    delete drafts[id];
    if (Object.keys(drafts).length === 0) {
      const nd = blankDraft();
      drafts[nd.id] = nd;
      activeId = nd.id;
    } else if (id === activeId) {
      activeId = Object.keys(drafts)[0];
    }
    fillForm(drafts[activeId]);
    persist();
    renderDrafts();
    showToast('Entwurf gelöscht');
  }

  function switchDraft(id) {
    if (!drafts[id]) return;
    activeId = id;
    fillForm(drafts[id]);
    persist();
    renderDrafts();
  }

  function newDraft() {
    const d = blankDraft();
    drafts[d.id] = d;
    activeId = d.id;
    fillForm(d);
    persist();
    renderDrafts();
    showToast('Neuer Entwurf erstellt');
    window.scrollTo({ top: 0, behavior: 'smooth' });
    setTimeout(() => els.recipientName.focus(), 300);
  }

  function duplicateDraft() {
    const cur = drafts[activeId];
    if (!cur) return;
    const copy = JSON.parse(JSON.stringify(cur));
    copy.id = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    copy.name = (cur.name || 'Entwurf') + ' (Kopie)';
    copy.updated = Date.now();
    drafts[copy.id] = copy;
    activeId = copy.id;
    fillForm(copy);
    persist();
    renderDrafts();
    showToast('Entwurf dupliziert');
  }

  function renameDraft() {
    const cur = drafts[activeId];
    if (!cur) return;
    const name = prompt('Name des Entwurfs:', cur.name || '');
    if (name === null) return;
    cur.name = name.trim() || 'Ohne Titel';
    persist();
    renderDrafts();
    showToast('Umbenannt');
  }

  function deleteDraft() {
    if (activeId) deleteDraftById(activeId);
  }

  function applyTemplate(key) {
    const t = TEMPLATES[key];
    if (!t) return;
    const d = drafts[activeId];
    if (!d) return;
    if (d.fields.body && d.fields.body.trim() &&
        !confirm('Aktuellen Text mit Vorlage überschreiben?')) return;
    d.fields.subject = t.subject;
    d.fields.greeting = t.greeting;
    d.fields.body = t.body;
    d.fields.closing = t.closing;
    d.fields.attachments = t.attachments;
    if (d.name === 'Neuer Entwurf') d.name = t.name;
    fillForm(d);
    persist();
    renderDrafts();
    showToast('Vorlage geladen: ' + t.name);
  }

  function renderPreview() {
    const d = drafts[activeId];
    if (!d) return;
    const f = d.fields;

    // Address overline (small line above recipient, mimicking envelope window).
    // Only show if BOTH name and address are filled, otherwise looks weird.
    if (f.senderName && f.senderAddress) {
      const overlineParts = [
        f.senderName,
        f.senderAddress.replace(/\n+/g, ', ').trim()
      ].filter(Boolean).join(', ');
      els.pOverline.textContent = overlineParts;
      els.pOverline.style.display = '';
    } else {
      els.pOverline.textContent = '';
      els.pOverline.style.display = 'none';
    }

    const recipientLines = [f.recipientName, f.recipientAddress]
      .filter(s => s && s.trim()).join('\n');
    els.pRecipient.innerHTML = escapeHtml(recipientLines).replace(/\n/g, '<br>');

    // Sidebar: sender details + email + phone + date, each block separated.
    // Only include non-empty blocks to avoid stray blank lines.
    const sidebarBlocks = [];
    const senderBlock = [f.senderName, f.senderAddress].filter(s => s && s.trim()).join('\n');
    if (senderBlock) sidebarBlocks.push(senderBlock);
    if (f.senderEmail && f.senderEmail.trim()) sidebarBlocks.push(f.senderEmail);
    if (f.senderPhone && f.senderPhone.trim()) sidebarBlocks.push(f.senderPhone);
    if (f.date && f.date.trim()) sidebarBlocks.push(f.date);
    const sidebarHtml = sidebarBlocks
      .map(b => escapeHtml(b).replace(/\n/g, '<br>'))
      .join('<br><br>');
    els.pSidebar.innerHTML = sidebarHtml;

    els.pSubject.textContent = f.subject || '';

    const bodyParts = [];
    if (f.greeting) bodyParts.push('<p>' + escapeHtml(f.greeting) + '</p>');
    if (f.body) {
      f.body.split(/\n\s*\n/).forEach(par => {
        if (par.trim()) bodyParts.push('<p>' + escapeHtml(par).replace(/\n/g, '<br>') + '</p>');
      });
    }
    if (f.closing) {
      bodyParts.push('<p>' + escapeHtml(f.closing) + '<br><br><br>' + escapeHtml(f.senderName || '') + '</p>');
    }
    els.pBody.innerHTML = bodyParts.join('');

    if (f.attachments && f.attachments.trim()) {
      els.pAttachments.innerHTML =
        '<p class="attachments-hd"><em>Anlagen</em>:</p>' +
        '<div class="attachments-bd">' + escapeHtml(f.attachments).replace(/\n/g, '<br>') + '</div>';
    } else {
      els.pAttachments.innerHTML = '';
    }

    updatePreviewScale();
  }

  // 210mm at 96 DPI ≈ 793.7px. Scale page to fit available width.
  function updatePreviewScale() {
    const A4_WIDTH_PX = 793.7;
    const padding = 24; // 12px each side
    const available = Math.min(window.innerWidth, 900) - padding;
    const scale = Math.min(1, available / A4_WIDTH_PX);
    document.documentElement.style.setProperty('--scale', scale.toFixed(4));
  }

  function openPreview() {
    renderPreview();
    els.preview.classList.add('is-open');
    els.preview.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closePreview() {
    els.preview.classList.remove('is-open');
    els.preview.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
  }

  function printLetter() {
    renderPreview();
    setTimeout(() => window.print(), 50);
  }

  function exportJson() {
    const cur = drafts[activeId];
    if (!cur) return;
    const data = JSON.stringify(cur, null, 2);
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'brief-' + (cur.name || 'entwurf').replace(/[^a-z0-9äöüß]+/gi, '-').toLowerCase() + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('Exportiert');
  }

  function importJson(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const obj = JSON.parse(e.target.result);
        if (!obj.fields) throw new Error('Ungültiges Format');
        obj.id = 'd_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        obj.updated = Date.now();
        drafts[obj.id] = obj;
        activeId = obj.id;
        fillForm(obj);
        persist();
        renderDrafts();
        showToast('Importiert');
      } catch (err) {
        showToast('Import fehlgeschlagen');
      }
    };
    reader.readAsText(file);
  }

  function openMenu()  { els.menuOverlay.hidden = false; }
  function closeMenu() { els.menuOverlay.hidden = true; }

  function bindEvents() {
    Object.values(FIELD_MAP).forEach(key => {
      const el = els[key];
      if (el) el.addEventListener('input', onFieldChange);
    });

    els.newDraftBtn.addEventListener('click', newDraft);

    els.templates.forEach(btn => {
      btn.addEventListener('click', () => applyTemplate(btn.dataset.template));
    });

    els.previewBtn.addEventListener('click', openPreview);
    els.previewBack.addEventListener('click', closePreview);
    els.previewPrint.addEventListener('click', printLetter);
    els.pdfBtn.addEventListener('click', printLetter);

    els.menuBtn.addEventListener('click', openMenu);
    els.menuClose.addEventListener('click', closeMenu);
    els.menuOverlay.addEventListener('click', e => {
      if (e.target === els.menuOverlay) closeMenu();
    });
    els.menuRename.addEventListener('click', () => { closeMenu(); renameDraft(); });
    els.menuDuplicate.addEventListener('click', () => { closeMenu(); duplicateDraft(); });
    els.menuDelete.addEventListener('click', () => { closeMenu(); deleteDraft(); });
    els.menuExport.addEventListener('click', () => { closeMenu(); exportJson(); });
    els.menuImport.addEventListener('click', () => { closeMenu(); els.importFile.click(); });

    els.importFile.addEventListener('change', e => {
      const file = e.target.files[0];
      if (file) importJson(file);
      e.target.value = '';
    });

    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if (els.preview.classList.contains('is-open')) closePreview();
      else if (!els.menuOverlay.hidden) closeMenu();
    });

    window.addEventListener('resize', () => {
      updatePreviewScale();
    });
    window.addEventListener('orientationchange', updatePreviewScale);
  }

  function init() {
    loadDrafts();
    fillForm(drafts[activeId]);
    renderDrafts();
    bindEvents();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>

</body>
</html>
