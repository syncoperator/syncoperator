<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Brief → PDF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f5f1e8;color:#1c1c1c;font-family:Georgia,serif;padding:20px 16px 60px}
.w{max-width:520px;margin:0 auto}
h1{font-size:26px;font-weight:400;border-bottom:2px solid #1c1c1c;padding-bottom:12px;margin-bottom:20px}
h1 em{font-style:italic;color:#b8390e}
.langs{display:flex;gap:6px;margin-bottom:20px}
.langs button{flex:1;padding:10px;border:1.5px solid #1c1c1c;background:transparent;font-family:Georgia,serif;font-size:13px;cursor:pointer}
.langs button.on{background:#1c1c1c;color:#f5f1e8}
.box{border:1.5px solid #1c1c1c;padding:14px 12px 2px;margin-bottom:16px;position:relative}
.bl{position:absolute;top:-8px;left:10px;background:#f5f1e8;padding:0 6px;font:10px monospace;text-transform:uppercase;letter-spacing:.18em}
.f{margin-bottom:16px}
label{display:block;font:10px monospace;text-transform:uppercase;letter-spacing:.18em;color:#7a6f62;margin-bottom:6px}
label b{color:#b8390e;margin-right:6px}
input,textarea{width:100%;background:transparent;border:none;border-bottom:1.5px solid #1c1c1c;padding:6px 0 8px;font-family:Georgia,serif;font-size:16px;color:#1c1c1c;outline:none;resize:none;border-radius:0;-webkit-appearance:none}
textarea{min-height:140px;line-height:1.5}
.btn{width:100%;padding:17px;background:#1c1c1c;color:#f5f1e8;border:none;font-family:Georgia,serif;font-size:16px;cursor:pointer;margin-top:20px}
.btn:before{content:"→ ";color:#b8390e}
.btn:disabled{opacity:.5}
#st{margin-top:10px;padding:12px;font:11px monospace;text-transform:uppercase;letter-spacing:.1em;text-align:center;display:none}
.ok{background:#1c1c1c;color:#f5f1e8}
.er{background:#b8390e;color:#fff}
.sp{color:#7a6f62;border:1px solid #7a6f62}
</style>
</head>
<body>
<div class="w">
<h1 id="ttl">Brief<em>.</em>pdf</h1>
<div class="langs">
  <button id="bDe" class="on" onclick="SL('de')">Deutsch</button>
  <button id="bRu" onclick="SL('ru')">Русский</button>
  <button id="bEn" onclick="SL('en')">English</button>
</div>

<div class="box">
  <div class="bl" id="lFrom">Absender</div>
  <div class="f"><label><b>01</b><span id="lN1">Name</span></label><input id="fromName" autocomplete="off"></div>
  <div class="f"><label><b>02</b><span id="lA1">Adresse</span></label><textarea id="fromAddr" rows="3"></textarea></div>
</div>
<div class="box">
  <div class="bl" id="lTo">Empfänger</div>
  <div class="f"><label><b>03</b><span id="lN2">Name</span></label><input id="toName" autocomplete="off"></div>
  <div class="f"><label><b>04</b><span id="lA2">Adresse</span></label><textarea id="toAddr" rows="3"></textarea></div>
</div>
<div class="f"><label><b>05</b><span id="lDt">Datum</span></label><input id="date" type="date"></div>
<div class="f"><label><b>06</b><span id="lSb">Betreff</span></label><input id="subject" autocomplete="off"></div>
<div class="f"><label><b>07</b><span id="lGr">Anrede</span></label><input id="greeting" autocomplete="off"></div>
<div class="f"><label><b>08</b><span id="lBd">Brieftext</span></label><textarea id="body" rows="10"></textarea></div>
<div class="f"><label><b>09</b><span id="lCl">Grußformel</span></label><input id="closing" autocomplete="off"></div>

<button class="btn" id="goBtn" onclick="go()">PDF erstellen</button>

<div id="st"></div>
</div>

<canvas id="cv" style="position:fixed;left:-9999px;top:0;width:1px;height:1px"></canvas>

<script>
const T={
  de:{ttl:"Brief",from:"Absender",to:"Empfänger",name:"Name",addr:"Adresse",
      date:"Datum",subj:"Betreff",greet:"Anrede",body:"Brieftext",close:"Grußformel",
      btn:"PDF erstellen",sp:"Erstelle PDF…",ok:"PDF öffnet sich gleich",er:"Fehler",
      sbpfx:"Betreff: ",
      mo:["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"]},
  ru:{ttl:"Письмо",from:"Отправитель",to:"Получатель",name:"Имя",addr:"Адрес",
      date:"Дата",subj:"Тема",greet:"Приветствие",body:"Текст",close:"Подпись",
      btn:"Создать PDF",sp:"Создаём…",ok:"PDF открывается",er:"Ошибка",
      sbpfx:"Тема: ",
      mo:["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"]},
  en:{ttl:"Letter",from:"Sender",to:"Recipient",name:"Name",addr:"Address",
      date:"Date",subj:"Subject",greet:"Greeting",body:"Body",close:"Closing",
      btn:"Create PDF",sp:"Creating…",ok:"PDF is opening",er:"Error",
      sbpfx:"Subject: ",
      mo:["January","February","March","April","May","June","July","August","September","October","November","December"]}
};
let lang=localStorage.getItem("ll")||"de";

function SL(l){
  lang=l;localStorage.setItem("ll",l);
  const t=T[l];
  document.getElementById("ttl").innerHTML=t.ttl+'<em>.</em>pdf';
  const m={lFrom:"from",lTo:"to",lN1:"name",lN2:"name",lA1:"addr",lA2:"addr",
           lDt:"date",lSb:"subj",lGr:"greet",lBd:"body",lCl:"close"};
  for(const[id,k]of Object.entries(m))document.getElementById(id).textContent=t[k];
  document.getElementById("goBtn").textContent="→ "+t.btn;
  ["bDe","bRu","bEn"].forEach(b=>document.getElementById(b).classList.remove("on"));
  document.getElementById("b"+l[0].toUpperCase()+l.slice(1)).classList.add("on");
}
SL(lang);
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function ss(txt,cls){const e=document.getElementById("st");e.textContent=txt;e.className=cls;e.style.display=txt?"block":"none";}

function fmtDate(iso,l){
  if(!iso)return"";
  const[y,m,d]=iso.split("-"),mn=T[l].mo[+m-1];
  if(l==="de")return`${+d}. ${mn} ${y}`;
  if(l==="ru")return`${+d} ${mn} ${y} г.`;
  return`${mn} ${+d}, ${y}`;
}

async function go(){
  const btn=document.getElementById("goBtn");
  btn.disabled=true;ss(T[lang].sp,"sp");
  try{
    // Must open window BEFORE async work (iOS requires it in click handler)
    const win=window.open("","_blank");
    if(!win){ss("Popup blockiert — bitte erlauben","er");btn.disabled=false;return;}
    win.document.write("<html><body style='font-family:sans-serif;padding:20px;background:#111;color:#fff'><p>Erstelle PDF…</p></body></html>");

    const bytes=await buildPDF();

    const blob=new Blob([bytes],{type:"application/pdf"});
    const url=URL.createObjectURL(blob);
    win.location.href=url;
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    ss(T[lang].ok,"ok");
  }catch(e){
    console.error(e);ss(T[lang].er+": "+e.message,"er");
  }finally{btn.disabled=false;}
}

async function buildPDF(){
  const t=T[lang];
  const g=id=>document.getElementById(id).value.trim();
  const fromName=g("fromName"),fromAddr=g("fromAddr");
  const toName=g("toName"),toAddr=g("toAddr");
  const date=fmtDate(g("date"),lang);
  const subject=g("subject"),greeting=g("greeting");
  const body=g("body"),closing=g("closing");

  // Use system fonts — guaranteed to work on iOS canvas
  // Georgia supports Cyrillic on iOS, Helvetica for fallback
  const FONT_NORMAL = "Georgia, 'Times New Roman', serif";
  const FONT_BOLD   = "Georgia, 'Times New Roman', serif";

  const SC=2, PW=595, PH=842;
  const CW=PW*SC, CH=PH*SC;
  const MX=68*SC, MY=58*SC;
  const maxW=CW-MX*2;

  const cv=document.getElementById("cv");
  cv.width=CW; cv.height=CH;
  const ctx=cv.getContext("2d");

  function setFont(bold,pt){
    ctx.font=`${bold?"bold ":""}${pt*SC}px ${bold?FONT_BOLD:FONT_NORMAL}`;
  }
  function tw(text,bold,pt){setFont(bold,pt);return ctx.measureText(text).width;}
  function wrap(text,bold,pt){
    setFont(bold,pt);
    const words=text.split(" "),out=[];
    let line="";
    for(const w of words){
      const t2=line?line+" "+w:w;
      if(ctx.measureText(t2).width<=maxW)line=t2;
      else{if(line)out.push(line);line=w;}
    }
    if(line)out.push(line);
    return out.length?out:[""];
  }

  // Collect items
  const items=[];
  const add=(text,bold,pt,align)=>items.push({text,bold,pt,align:align||"left"});
  const gap=pt=>items.push({gap:pt*SC});

  if(fromName||fromAddr){
    [fromName,...fromAddr.split("\n")].filter(Boolean).forEach(l=>add(l,false,10,"right"));
    gap(8);
  }
  if(toName||toAddr){
    [toName,...toAddr.split("\n")].filter(Boolean).forEach(l=>add(l,false,11));
    gap(8);
  }
  if(date){add(date,false,11,"right");gap(12);}
  if(subject){wrap(t.sbpfx+subject,true,12).forEach(l=>add(l,true,12));gap(6);}
  if(greeting){add(greeting,false,12);gap(5);}
  if(body){
    for(const para of body.split("\n")){
      if(!para.trim()){gap(6);continue;}
      wrap(para,false,12).forEach(l=>add(l,false,12));
    }
    gap(10);
  }
  if(closing)add(closing,false,12);
  if(fromName)add(fromName,false,12);

  // Paginate
  const LH=pt=>pt*SC*1.65;
  const pages=[],maxY=CH-MY;
  let cur=[],cy=MY;
  for(const item of items){
    if(item.gap!==undefined){cur.push(item);cy+=item.gap;continue;}
    const lh=LH(item.pt);
    if(cy+lh>maxY&&cur.length){pages.push(cur);cur=[];cy=MY;}
    cur.push({...item});
    cy+=lh;
  }
  if(cur.length||!pages.length)pages.push(cur);

  // Render each page to JPEG
  const jpegs=[];
  for(const page of pages){
    ctx.clearRect(0,0,CW,CH);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle="#1c1c1c";
    let y=MY;
    for(const item of page){
      if(item.gap!==undefined){y+=item.gap;continue;}
      setFont(item.bold,item.pt);
      const lh=LH(item.pt);
      const baseline=y+lh*0.75;
      if(item.align==="right"){
        const w=ctx.measureText(item.text).width;
        ctx.fillText(item.text,CW-MX-w,baseline);
      }else{
        ctx.fillText(item.text,MX,baseline);
      }
      y+=lh;
    }
    // toDataURL works on iOS with system fonts (no taint)
    const url=cv.toDataURL("image/jpeg",0.93);
    const b64=url.split(",")[1];
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    jpegs.push(arr);
  }

  // Assemble PDF
  const enc=new TextEncoder();
  const parts=[]; let pos=0; const xr={};
  const wr=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);pos+=b.length;};
  const wl=s=>wr(s+"\n");
  const obj=(n,f)=>{xr[n]=pos;wl(`${n} 0 obj`);f();wl("endobj");};

  wl("%PDF-1.4");
  wr(new Uint8Array([37,226,227,207,211,10]));
  obj(1,()=>wl("<< /Type /Catalog /Pages 2 0 R >>"));
  const np=jpegs.length;
  obj(2,()=>wl(`<< /Type /Pages /Kids [${Array.from({length:np},(_,i)=>`${3+i*2} 0 R`).join(" ")}] /Count ${np} >>`));

  for(let i=0;i<np;i++){
    const pgN=3+i*2,imN=4+i*2,img=jpegs[i];
    const cs=enc.encode(`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`);
    obj(pgN,()=>{
      wl(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}]`);
      wl(`   /Contents << /Length ${cs.length} >> /Resources << /XObject << /Im${i} ${imN} 0 R >> >> >>`);
      wl("stream");wr(cs);wl("\nendstream");
    });
    obj(imN,()=>{
      wl(`<< /Type /XObject /Subtype /Image /Width ${CW} /Height ${CH}`);
      wl(`   /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${img.length} >>`);
      wl("stream");wr(img);wl("\nendstream");
    });
  }

  const xp=pos,maxN=2+np*2;
  wl("xref");wl(`0 ${maxN+1}`);
  wl("0000000000 65535 f ");
  for(let i=1;i<=maxN;i++)wl((xr[i]!=null?String(xr[i]).padStart(10,"0"):"0000000000")+" 00000 n ");
  wl("trailer");wl(`<< /Size ${maxN+1} /Root 1 0 R >>`);
  wl("startxref");wl(String(xp));wr("%%EOF");

  const tot=parts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(tot);let off=0;
  for(const p of parts){out.set(p,off);off+=p.length;}
  return out;
}
</script>

</body>
</html>
