<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#f5f5f0"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>Brief</title>

<style>
/* ─────────────────────────────────────────
   TOKENS
───────────────────────────────────────── */
:root {
  --bg:      #f5f5f0;
  --surface: #ffffff;
  --ink:     #111111;
  --ink2:    #555555;
  --ink3:    #999999;
  --border:  rgba(0,0,0,.09);
  --border2: rgba(0,0,0,.14);
  --radius:  14px;
  --shadow:  0 1px 3px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}

/* ─────────────────────────────────────────
RESET
───────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
font-family:-apple-system,BlinkMacSystemFont,‘Segoe UI’,sans-serif;
font-size:16px;
background:var(–bg);
color:var(–ink);
-webkit-font-smoothing:antialiased;
overflow-x:hidden;
min-height:100dvh;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
input,textarea{font-family:inherit;font-size:16px}

/* ─────────────────────────────────────────
LAYOUT
───────────────────────────────────────── */
#app{
max-width:600px;
margin:0 auto;
min-height:100dvh;
display:flex;
flex-direction:column;
}

/* ─────────────────────────────────────────
HEADER
───────────────────────────────────────── */
.header{
position:sticky;top:0;z-index:30;
display:flex;align-items:center;justify-content:space-between;
padding:max(16px,env(safe-area-inset-top)) 20px 14px;
background:rgba(245,245,240,.94);
backdrop-filter:blur(18px) saturate(160%);
-webkit-backdrop-filter:blur(18px) saturate(160%);
border-bottom:1px solid var(–border);
}
.logo{
font-size:21px;font-weight:700;letter-spacing:-.4px;
display:flex;align-items:center;gap:9px;
}
.logo svg{opacity:.7}
.menu-btn{
width:36px;height:36px;display:grid;place-items:center;
border-radius:8px;color:var(–ink2);
transition:background .15s;
}
.menu-btn:active{background:rgba(0,0,0,.07)}

/* ─────────────────────────────────────────
DRAFTS ROW
Outer: overflow:hidden (kills iOS ~~~)
Inner: overflow-x:auto (actual scroll)
───────────────────────────────────────── */
.drafts-wrap{
height:48px;
overflow:hidden;          /* ← THIS kills the iOS ~~~ indicator */
padding:0 20px;
border-bottom:1px solid var(–border);
}
.drafts-row{
display:flex;
align-items:center;
gap:7px;
height:100%;
padding:6px 0;
overflow-x:auto;
overflow-y:hidden;        /* explicit, no iOS indicator */
scrollbar-width:none;
-ms-overflow-style:none;
}
.drafts-row::-webkit-scrollbar{display:none}

.d-new{
flex-shrink:0;
display:inline-flex;align-items:center;gap:5px;
height:32px;padding:0 13px;
border:1.5px dashed var(–border2);border-radius:999px;
font-size:13px;font-weight:500;color:var(–ink2);
white-space:nowrap;
transition:border-color .15s,background .15s;
}
.d-new:active{background:rgba(0,0,0,.04)}

.d-chip{
flex-shrink:0;
display:inline-flex;align-items:center;
height:32px;
border:1px solid var(–border2);border-radius:999px;
font-size:13px;font-weight:500;color:var(–ink2);
background:var(–surface);
overflow:hidden;
transition:all .15s;
}
.d-chip.active{background:var(–ink);color:#fff;border-color:var(–ink)}
.d-name{
padding:0 8px 0 13px;
max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
cursor:pointer;
}
.d-x{
display:grid;place-items:center;
width:28px;height:32px;
opacity:.35;cursor:pointer;
transition:opacity .15s;
}
.d-x:active{opacity:1}

/* ─────────────────────────────────────────
FORM
───────────────────────────────────────── */
.form{
flex:1;
padding:16px 20px calc(80px + env(safe-area-inset-bottom));
display:flex;flex-direction:column;gap:14px;
}

/* Card */
.card{
background:var(–surface);
border-radius:var(–radius);
box-shadow:var(–shadow);
overflow:hidden;
}
.card-head{
display:flex;align-items:baseline;gap:8px;
padding:14px 18px 12px;
border-bottom:1px solid var(–border);
}
.card-n{
font-size:11px;color:var(–ink3);
font-style:italic;font-weight:400;
}
.card-t{
font-size:13px;font-weight:600;color:var(–ink2);
letter-spacing:.01em;
}

/* Field row */
.frow{
padding:12px 18px;
border-bottom:1px solid var(–border);
}
.frow:last-child{border-bottom:none}
.frow label{
display:block;
font-size:12px;font-weight:500;color:var(–ink3);
margin-bottom:5px;
}
.frow input,
.frow textarea{
display:block;width:100%;
background:transparent;border:none;outline:none;
font-size:16px;line-height:1.5;color:var(–ink);
padding:0;resize:none;
}
.frow textarea{min-height:52px}
.frow input::placeholder,
.frow textarea::placeholder{color:var(–ink3)}

/* Template pills */
.tpl-scroll{
display:flex;gap:7px;
padding:12px 18px;
border-bottom:1px solid var(–border);
overflow-x:auto;overflow-y:hidden;
scrollbar-width:none;-ms-overflow-style:none;
}
.tpl-scroll::-webkit-scrollbar{display:none}
.tpl{
flex-shrink:0;
padding:6px 13px;
border:1px solid var(–border2);border-radius:999px;
font-size:12.5px;font-weight:500;color:var(–ink2);
white-space:nowrap;
transition:all .15s;
}
.tpl:active{background:var(–ink);color:#fff;border-color:var(–ink)}

/* ─────────────────────────────────────────
BOTTOM BAR
───────────────────────────────────────── */
.bottom{
position:fixed;bottom:0;
left:50%;transform:translateX(-50%);
width:100%;max-width:600px;
z-index:30;
display:flex;gap:10px;
padding:10px 20px calc(10px + env(safe-area-inset-bottom));
background:rgba(245,245,240,.95);
backdrop-filter:blur(18px) saturate(160%);
-webkit-backdrop-filter:blur(18px) saturate(160%);
border-top:1px solid var(–border);
}
.btn{
flex:1;
display:inline-flex;align-items:center;justify-content:center;gap:7px;
padding:13px 12px;border-radius:12px;
font-size:15px;font-weight:600;
transition:opacity .12s,transform .1s;
}
.btn:active{opacity:.75;transform:scale(.98)}
.btn-ghost{background:var(–surface);color:var(–ink);border:1px solid var(–border2);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.btn-dark{background:var(–ink);color:#fff}
.btn.loading{opacity:.6;pointer-events:none}

/* ─────────────────────────────────────────
SHEET MENU
───────────────────────────────────────── */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.3);animation:oin .18s ease}
.overlay[hidden]{display:none}
.sheet{
position:fixed;bottom:0;left:0;right:0;z-index:51;
max-width:540px;margin:0 auto;
background:var(–surface);
border-radius:20px 20px 0 0;
padding:0 0 calc(16px + env(safe-area-inset-bottom));
box-shadow:0 -4px 30px rgba(0,0,0,.1);
animation:sin .2s cubic-bezier(.3,.9,.3,1);
}
.sheet[hidden]{display:none}
.sheet-bar{width:36px;height:4px;background:var(–border2);border-radius:2px;margin:10px auto 14px}
.sitem{
display:flex;align-items:center;gap:14px;
width:100%;padding:15px 22px;
font-size:16px;color:var(–ink);
border-top:1px solid var(–border);
transition:background .12s;
}
.sitem:first-of-type{border-top:none}
.sitem:active{background:rgba(0,0,0,.04)}
.sitem.red{color:#d93025}
.sitem-ic{color:var(–ink3);flex-shrink:0}
.sitem.red .sitem-ic{color:#d93025}
.sheet-note{
margin:10px 18px 0;padding:10px 14px;
background:var(–bg);border-radius:10px;
font-size:12px;line-height:1.5;color:var(–ink3);text-align:center;
}
@keyframes oin{from{opacity:0}to{opacity:1}}
@keyframes sin{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ─────────────────────────────────────────
TOAST
───────────────────────────────────────── */
.toast{
position:fixed;
bottom:calc(80px + env(safe-area-inset-bottom));
left:50%;transform:translateX(-50%) translateY(8px);
z-index:100;
padding:8px 18px;
background:rgba(17,17,17,.88);color:#fff;
font-size:13px;font-weight:500;border-radius:999px;
white-space:nowrap;
opacity:0;pointer-events:none;
transition:opacity .17s,transform .17s;
backdrop-filter:blur(8px);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ─────────────────────────────────────────
PREVIEW SCREEN
───────────────────────────────────────── */
.pv-screen{
display:none;
position:fixed;inset:0;z-index:60;
background:#1c1c1c;
flex-direction:column;
}
.pv-screen.open{display:flex}

.pv-bar{
flex-shrink:0;
display:flex;justify-content:space-between;align-items:center;
padding:max(14px,env(safe-area-inset-top)) 16px 13px;
background:rgba(22,22,22,.9);
backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.pv-back{
display:inline-flex;align-items:center;gap:6px;
padding:8px 12px;border-radius:9px;
font-size:14px;font-weight:500;color:#fff;
transition:background .12s;
}
.pv-back:active{background:rgba(255,255,255,.1)}
.pv-dl{
display:inline-flex;align-items:center;gap:7px;
padding:9px 16px;border-radius:9px;
font-size:14px;font-weight:600;
background:#fff;color:#111;
transition:opacity .12s;
}
.pv-dl:active{opacity:.8}
.pv-dl.loading{opacity:.6;pointer-events:none}

.pv-hint{
flex-shrink:0;
text-align:center;
font-size:11px;color:rgba(255,255,255,.38);
padding:5px 16px 0;
letter-spacing:.01em;
}

/* Scroll area */
.pv-scroll{
flex:1;
overflow:auto;
-webkit-overflow-scrolling:touch;
display:flex;justify-content:center;
padding:16px 12px 40px;
}

/* A4 page wrapper — sized by JS */
.pv-sizer{
position:relative;
flex-shrink:0;
}

/* A4 canvas: 794×1123px @ 96dpi = 210×297mm.
transform:scale(–s) from top-left. */
.pv-page{
position:absolute;top:0;left:0;
width:794px;height:1123px;
transform:scale(var(–s,1));
transform-origin:top left;
background:#fff;
box-shadow:0 6px 40px rgba(0,0,0,.55);
font-size:10pt;line-height:14pt;color:#000;
font-family:‘Helvetica Neue’,Arial,sans-serif;
padding:90.7px;            /* 24mm @ 96dpi */
box-sizing:border-box;
}

/* Window ghost */
.p-win{
position:absolute;
left:56.7px;top:158px;
width:340px;height:170px;
background:rgba(0,0,0,.035);
border-radius:10px;
}
/* Sender line above recipient */
.p-from{
position:absolute;
left:75.6px;top:156px;
width:340px;
font-size:7pt;line-height:10pt;color:#777;
}
/* Recipient */
.p-to{
position:absolute;
left:75.6px;top:172px;
width:340px;
font-size:10pt;line-height:14pt;
}
/* Sidebar */
.p-side{
position:absolute;
right:90.7px;top:93px;
width:151px;height:242px;
font-size:8pt;line-height:12.5pt;
}
.p-side-in{position:absolute;bottom:0;width:100%}
/* Body */
.p-body{
position:absolute;
left:90.7px;top:411px;right:90.7px;
font-size:10pt;line-height:14pt;
}
.p-body p{margin:0 0 14pt}
.p-subj{font-weight:bold;margin-bottom:14pt}
.p-att{margin-top:21pt;font-size:8pt;line-height:12pt}
.p-att b{font-style:italic}
/* Fold marks */
.p-fold{position:absolute;left:18px;width:1px;background:rgba(0,0,0,.2)}
.p-fold-1{top:397px;height:11px}
.p-fold-2{top:561px;height:19px}
.p-fold-3{top:794px;height:11px}

/* ─────────────────────────────────────────
PRINT (fallback if jsPDF fails)
───────────────────────────────────────── */
#print-el{display:none}
@media print{
@page{size:A4 portrait;margin:0}
body>*{display:none!important}
#print-el{
display:block!important;
position:fixed!important;
inset:0!important;
width:210mm!important;height:297mm!important;
background:white!important;
}
#print-el .pv-page{
position:static!important;
transform:none!important;
width:210mm!important;height:297mm!important;
padding:24mm!important;
box-shadow:none!important;
}
#print-el .p-from{position:absolute;left:20mm;top:126pt;width:90mm;font-size:7pt;color:#777}
#print-el .p-to  {position:absolute;left:20mm;top:144pt;width:90mm;font-size:10pt}
#print-el .p-side{position:absolute;right:24mm;top:70pt;width:40mm;height:182pt}
#print-el .p-body{position:absolute;left:24mm;top:308pt;right:24mm}
#print-el .p-fold-1{position:absolute;left:5mm;top:105mm;height:3mm;width:.3mm;background:rgba(0,0,0,.2)}
#print-el .p-fold-2{position:absolute;left:5mm;top:148.5mm;height:5mm;width:.3mm;background:rgba(0,0,0,.2)}
#print-el .p-fold-3{position:absolute;left:5mm;top:210mm;height:3mm;width:.3mm;background:rgba(0,0,0,.2)}
}
</style>

    </button>

      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      PDF laden
    </button>
  </div>
  <div class="pv-hint" id="pv-hint">Wird generiert…</div>
  <div class="pv-scroll">
    <div class="pv-sizer" id="pv-sizer">
      <div class="pv-page" id="pv-page">
        <div class="p-win"></div>
        <div class="p-from" id="pv-from"></div>
        <div class="p-to"   id="pv-to"></div>
        <div class="p-side"><div class="p-side-in" id="pv-side"></div></div>
        <div class="p-body">
          <div class="p-subj" id="pv-subj"></div>
          <div id="pv-body"></div>
          <div class="p-att"  id="pv-att"></div>
        </div>
        <div class="p-fold p-fold-1"></div>
        <div class="p-fold p-fold-2"></div>
        <div class="p-fold p-fold-3"></div>
      </div>
    </div>
  </div>
</div>

<!-- Print fallback element -->

<div id="print-el">
  <div class="pv-page" id="pp-page">
    <div class="p-win"></div>
    <div class="p-from" id="pp-from"></div>
    <div class="p-to"   id="pp-to"></div>
    <div class="p-side"><div class="p-side-in" id="pp-side"></div></div>
    <div class="p-body">
      <div class="p-subj" id="pp-subj"></div>
      <div id="pp-body"></div>
      <div class="p-att"  id="pp-att"></div>
    </div>
    <div class="p-fold p-fold-1"></div>
    <div class="p-fold p-fold-2"></div>
    <div class="p-fold p-fold-3"></div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<!-- jsPDF from CDN -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
(function(){
'use strict';

/* ── Storage ── */
var SK='brief5', AK='brief5-a';

/* ── Templates ── */
var T={
  bewerbung:{n:'Bewerbung',s:'Bewerbung als [Position]',g:'Sehr geehrte Damen und Herren,',
    b:'mit großem Interesse habe ich Ihre Stellenanzeige gelesen und möchte mich hiermit auf die Position als [Position] bewerben.\n\nIn meiner bisherigen Tätigkeit konnte ich umfangreiche Erfahrungen in [Bereich] sammeln. Besonders meine Kenntnisse in [Fähigkeit 1] und [Fähigkeit 2] qualifizieren mich für diese Stelle.\n\nIch freue mich darauf, Sie in einem persönlichen Gespräch von meiner Motivation zu überzeugen.',
    c:'Mit freundlichen Grüßen',a:'Lebenslauf\nZeugnisse\nReferenzen'},
  kuendigung:{n:'Kündigung',s:'Kündigung meines Vertrags zum nächstmöglichen Termin',g:'Sehr geehrte Damen und Herren,',
    b:'hiermit kündige ich meinen oben genannten Vertrag fristgerecht zum nächstmöglichen Termin.\n\nBitte bestätigen Sie mir den Eingang dieser Kündigung sowie das Vertragsende schriftlich.',
    c:'Mit freundlichen Grüßen',a:''},
  widerspruch:{n:'Widerspruch',s:'Widerspruch gegen [Bescheid] vom [Datum]',g:'Sehr geehrte Damen und Herren,',
    b:'gegen den oben genannten Bescheid lege ich hiermit fristgerecht Widerspruch ein.\n\nBegründung: [Hier Begründung einfügen]\n\nIch bitte um Prüfung und schriftliche Stellungnahme.',
    c:'Mit freundlichen Grüßen',a:''},
  anfrage:{n:'Anfrage',s:'Anfrage bezüglich [Thema]',g:'Sehr geehrte Damen und Herren,',
    b:'ich wende mich mit folgendem Anliegen an Sie:\n\n[Anfrage formulieren]\n\nÜber eine baldige Rückmeldung würde ich mich sehr freuen.',
    c:'Mit freundlichen Grüßen',a:''},
  dank:{n:'Dankschreiben',s:'Vielen Dank',g:'Sehr geehrte Damen und Herren,',
    b:'ich möchte mich herzlich bei Ihnen für [Anlass] bedanken.\n\n[Persönliche Worte]\n\nVielen Dank nochmals.',
    c:'Mit freundlichen Grüßen',a:''},
  leer:{n:'Leer',s:'',g:'Sehr geehrte Damen und Herren,',b:'',c:'Mit freundlichen Grüßen',a:''}
};

/* ── Blank draft ── */
function mkD(){
  var M=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'],d=new Date();
  return{id:'x'+Date.now().toString(36),name:'Neuer Entwurf',ts:Date.now(),
    f:{sname:'',saddr:'',semail:'',sphone:'',rname:'',raddr:'',
       date:d.getDate()+'. '+M[d.getMonth()]+' '+d.getFullYear(),
       subj:'',greet:'Sehr geehrte Damen und Herren,',body:'',close:'Mit freundlichen Grüßen',attach:''}};
}

/* ── State ── */
var DB={},act=null,saveT=null;

/* ── DOM ── */
function get$(id){return document.getElementById(id)}
var E={
  sname:get$('f-sname'),saddr:get$('f-saddr'),semail:get$('f-semail'),sphone:get$('f-sphone'),
  rname:get$('f-rname'),raddr:get$('f-raddr'),
  date:get$('f-date'),subj:get$('f-subj'),greet:get$('f-greet'),
  body:get$('f-body'),close:get$('f-close'),attach:get$('f-attach'),
  chips:get$('chips'),btnNew:get$('btn-new'),
  overlay:get$('overlay'),sheet:get$('sheet'),btnMenu:get$('btn-menu'),
  mRename:get$('m-rename'),mDup:get$('m-dup'),mExport:get$('m-export'),mImport:get$('m-import'),mDel:get$('m-del'),
  fileIn:get$('file-in'),
  btnPreview:get$('btn-preview'),btnPdf:get$('btn-pdf'),
  preview:get$('preview'),btnBack:get$('btn-back'),btnDl:get$('btn-dl'),
  pvHint:get$('pv-hint'),pvSizer:get$('pv-sizer'),pvPage:get$('pv-page'),
  pvFrom:get$('pv-from'),pvTo:get$('pv-to'),pvSide:get$('pv-side'),
  pvSubj:get$('pv-subj'),pvBody:get$('pv-body'),pvAtt:get$('pv-att'),
  ppPage:get$('pp-page'),printEl:get$('print-el'),
  ppFrom:get$('pp-from'),ppTo:get$('pp-to'),ppSide:get$('pp-side'),
  ppSubj:get$('pp-subj'),ppBody:get$('pp-body'),ppAtt:get$('pp-att'),
  toast:get$('toast')
};
var FIELDS=['sname','saddr','semail','sphone','rname','raddr','date','subj','greet','body','close','attach'];

/* ── Utils ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
var toastT;
function toast(m){E.toast.textContent=m;E.toast.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){E.toast.classList.remove('show')},2000)}

/* ── Persistence ── */
function load(){
  try{DB=JSON.parse(localStorage.getItem(SK))||{}}catch(e){DB={}}
  act=localStorage.getItem(AK);
  if(!Object.keys(DB).length){var d=mkD();DB[d.id]=d;act=d.id}
  if(!act||!DB[act])act=Object.keys(DB)[0];
}
function persist(){
  try{localStorage.setItem(SK,JSON.stringify(DB));localStorage.setItem(AK,act)}
  catch(e){toast('Speichern fehlgeschlagen')}
}

/* ── Form ── */
function fill(d){FIELDS.forEach(function(k){if(E[k])E[k].value=d.f[k]||''})}
function read(){var f={};FIELDS.forEach(function(k){f[k]=E[k]?E[k].value:''});return f}
function onInput(){
  var d=DB[act];if(!d)return;
  d.f=read();
  clearTimeout(saveT);
  saveT=setTimeout(function(){
    d.ts=Date.now();
    if(d.name==='Neuer Entwurf'||!d.name){
      var c=(d.f.subj||d.f.rname||'').trim();
      if(c&&/[A-Za-zÄÖÜäöüß0-9]{2,}/.test(c))d.name=c.slice(0,26);
    }
    persist();drawChips();
  },600);
}

/* ── Chips ── */
function drawChips(){
  var list=Object.values(DB).sort(function(a,b){return b.ts-a.ts});
  E.chips.innerHTML='';
  list.forEach(function(d){
    var c=document.createElement('div');
    c.className='d-chip'+(d.id===act?' active':'');
    var n=document.createElement('span');n.className='d-name';n.textContent=d.name||'Ohne Titel';n.title=n.textContent;
    n.addEventListener('click',function(){switchTo(d.id)});
    var x=document.createElement('span');x.className='d-x';
    x.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    x.addEventListener('click',function(e){e.stopPropagation();delDraft(d.id)});
    c.appendChild(n);c.appendChild(x);E.chips.appendChild(c);
  });
}
function switchTo(id){if(!DB[id])return;act=id;fill(DB[id]);persist();drawChips()}
function newDraft(){var d=mkD();DB[d.id]=d;act=d.id;fill(d);persist();drawChips();toast('Neuer Entwurf');setTimeout(function(){E.rname.focus()},200)}
function delDraft(id){
  var d=DB[id];if(!d)return;
  if(!confirm('"'+(d.name||'Entwurf')+'" löschen?'))return;
  delete DB[id];
  if(!Object.keys(DB).length){var nd=mkD();DB[nd.id]=nd;act=nd.id}
  else if(id===act)act=Object.keys(DB)[0];
  fill(DB[act]);persist();drawChips();toast('Gelöscht');
}
function renameDraft(){var d=DB[act];if(!d)return;var n=prompt('Name:',d.name||'');if(n===null)return;d.name=n.trim()||'Ohne Titel';persist();drawChips();toast('Umbenannt')}
function dupDraft(){
  var d=DB[act];if(!d)return;
  var c=JSON.parse(JSON.stringify(d));
  c.id='x'+Date.now().toString(36);c.name=(d.name||'Entwurf')+' (Kopie)';c.ts=Date.now();
  DB[c.id]=c;act=c.id;fill(c);persist();drawChips();toast('Dupliziert');
}
function exportDraft(){
  var d=DB[act];if(!d)return;
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='brief-'+(d.name||'entwurf').replace(/[^\wäöüÄÖÜß]+/g,'-')+'.json';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(a.href)},1000);
  toast('Exportiert');
}
function importDraft(file){
  var r=new FileReader();
  r.onload=function(e){
    try{var o=JSON.parse(e.target.result);if(!o.f)throw 0;o.id='x'+Date.now().toString(36);o.ts=Date.now();DB[o.id]=o;act=o.id;fill(o);persist();drawChips();toast('Importiert')}
    catch(e){toast('Ungültiges Format')}
  };r.readAsText(file);
}

/* ── Template ── */
function applyTpl(key){
  var t=T[key];if(!t)return;
  var d=DB[act];if(!d)return;
  if(d.f.body&&d.f.body.trim()&&!confirm('Text überschreiben?'))return;
  d.f.subj=t.s;d.f.greet=t.g;d.f.body=t.b;d.f.close=t.c;d.f.attach=t.a;
  if(d.name==='Neuer Entwurf')d.name=t.n;
  fill(d);persist();drawChips();toast(t.n+' geladen');
}

/* ── Render letter into DOM nodes ── */
function renderLetter(el,f){
  var hasfrom=f.sname&&f.sname.trim()&&f.saddr&&f.saddr.trim();
  if(hasfrom){el.from.textContent=f.sname+', '+f.saddr.replace(/\n+/g,', ');el.from.style.display=''}
  else{el.from.textContent='';el.from.style.display='none'}

  el.to.innerHTML=esc([f.rname,f.raddr].filter(function(s){return s&&s.trim()}).join('\n')).replace(/\n/g,'<br>');

  var sb=[];
  var bl=[f.sname,f.saddr].filter(function(s){return s&&s.trim()}).join('\n');
  if(bl)sb.push(bl);
  if(f.semail&&f.semail.trim())sb.push(f.semail);
  if(f.sphone&&f.sphone.trim())sb.push(f.sphone);
  if(f.date&&f.date.trim())sb.push(f.date);
  el.side.innerHTML=sb.map(function(b){return esc(b).replace(/\n/g,'<br>')}).join('<br><br>');

  el.subj.textContent=f.subj||'';

  var parts=[];
  if(f.greet)parts.push('<p>'+esc(f.greet)+'</p>');
  (f.body||'').split(/\n[ \t]*\n/).forEach(function(p){p=p.trim();if(p)parts.push('<p>'+esc(p).replace(/\n/g,'<br>')+'</p>')});
  if(f.close)parts.push('<p>'+esc(f.close)+'<br><br><br>'+esc(f.sname||'')+'</p>');
  el.body.innerHTML=parts.join('');

  if(f.attach&&f.attach.trim()){el.att.innerHTML='<p><b>Anlagen</b>:</p><div>'+esc(f.attach).replace(/\n/g,'<br>')+'</div>'}
  else{el.att.innerHTML=''}
}

/* ── Scale preview page ── */
function scalePage(){
  var W=794,H=1123;
  var aw=Math.min(window.innerWidth,600)-24;
  var s=Math.min(1,aw/W);
  document.documentElement.style.setProperty('--s',s.toFixed(4));
  E.pvSizer.style.width=Math.round(W*s)+'px';
  E.pvSizer.style.height=Math.round(H*s)+'px';
}

/* ── Preview open/close ── */
function openPreview(){
  var f=DB[act]?DB[act].f:{};
  renderLetter({from:E.pvFrom,to:E.pvTo,side:E.pvSide,subj:E.pvSubj,body:E.pvBody,att:E.pvAtt},f);
  scalePage();
  E.pvHint.textContent='';
  E.preview.classList.add('open');
  E.preview.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closePreview(){
  E.preview.classList.remove('open');
  E.preview.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

/* ── PDF download via html2canvas + jsPDF ──
   Renders the 794×1123 preview page to a canvas,
   then inserts it into a jsPDF A4 document and triggers download.
   No print dialog needed!                                          */
function downloadPDF(){
  var f=DB[act]?DB[act].f:{};
  var name=(f.subj||f.rname||'brief').replace(/[^\wäöüÄÖÜß\s]+/g,'').trim().replace(/\s+/g,'-')||'brief';

  /* Ensure jsPDF and html2canvas are loaded */
  if(typeof window.jspdf==='undefined'||typeof window.html2canvas==='undefined'){
    toast('Bibliotheken laden…');
    fallbackPrint();
    return;
  }

  /* Mark button as loading */
  var btn=E.btnPdf;var dlBtn=E.btnDl;
  [btn,dlBtn].forEach(function(b){if(b)b.classList.add('loading');if(b)b.textContent='…'});
  E.pvHint.textContent='PDF wird erstellt…';

  /* Render into the hidden full-res page element */
  renderLetter({from:E.ppFrom,to:E.ppTo,side:E.ppSide,subj:E.ppSubj,body:E.ppBody,att:E.ppAtt},f);

  /* Temporarily make it visible off-screen for html2canvas */
  E.printEl.style.cssText='display:block;position:fixed;top:0;left:-9999px;width:794px;height:1123px;z-index:-1';
  E.ppPage.style.cssText='position:relative;width:794px;height:1123px;transform:none';

  setTimeout(function(){
    window.html2canvas(E.ppPage,{
      scale:2,          /* 2× for crisp PDF */
      useCORS:true,
      logging:false,
      width:794,
      height:1123,
      backgroundColor:'#ffffff'
    }).then(function(canvas){
      var jsPDF=window.jspdf.jsPDF;
      var pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4'});
      var imgData=canvas.toDataURL('image/jpeg',0.92);
      pdf.addImage(imgData,'JPEG',0,0,210,297);
      pdf.save(name+'.pdf');

      /* Cleanup */
      E.printEl.style.cssText='display:none';
      [btn,dlBtn].forEach(function(b){
        if(b){b.classList.remove('loading'); b.textContent='PDF laden'}
      });
      E.pvHint.textContent='';
      toast('PDF gespeichert ✓');
    }).catch(function(err){
      console.error(err);
      E.printEl.style.cssText='display:none';
      [btn,dlBtn].forEach(function(b){if(b){b.classList.remove('loading')}});
      fallbackPrint();
    });
  },100);
}

/* Fallback: window.print() if html2canvas fails */
function fallbackPrint(){
  var f=DB[act]?DB[act].f:{};
  renderLetter({from:E.ppFrom,to:E.ppTo,side:E.ppSide,subj:E.ppSubj,body:E.ppBody,att:E.ppAtt},f);
  E.printEl.style.display='block';
  document.body.classList.add('printing');
  setTimeout(function(){
    window.print();
    setTimeout(function(){
      document.body.classList.remove('printing');
      E.printEl.style.display='none';
    },2500);
  },80);
}

/* ── Menu ── */
function openMenu(){E.overlay.hidden=false;E.sheet.hidden=false}
function closeMenu(){E.overlay.hidden=true;E.sheet.hidden=true}

/* ── Events ── */
function bind(){
  FIELDS.forEach(function(k){if(E[k])E[k].addEventListener('input',onInput)});
  E.btnNew.addEventListener('click',newDraft);
  document.querySelectorAll('.tpl').forEach(function(b){b.addEventListener('click',function(){applyTpl(b.dataset.t)})});

  E.btnPreview.addEventListener('click',openPreview);
  E.btnPdf.addEventListener('click',downloadPDF);
  E.btnBack.addEventListener('click',closePreview);
  E.btnDl.addEventListener('click',downloadPDF);

  E.btnMenu.addEventListener('click',openMenu);
  E.overlay.addEventListener('click',closeMenu);

  E.mRename.addEventListener('click',function(){closeMenu();renameDraft()});
  E.mDup.addEventListener('click',function(){closeMenu();dupDraft()});
  E.mExport.addEventListener('click',function(){closeMenu();exportDraft()});
  E.mImport.addEventListener('click',function(){closeMenu();E.fileIn.click()});
  E.mDel.addEventListener('click',function(){closeMenu();delDraft(act)});
  E.fileIn.addEventListener('change',function(e){if(e.target.files[0])importDraft(e.target.files[0]);e.target.value=''});

  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(E.preview.classList.contains('open'))closePreview();
    else if(!E.sheet.hidden)closeMenu();
  });
  window.addEventListener('resize',function(){if(E.preview.classList.contains('open'))scalePage()});
  if(window.screen&&window.screen.orientation)window.screen.orientation.addEventListener('change',scalePage);
}

/* ── Boot ── */
function init(){load();fill(DB[act]);drawChips();bind()}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',init):init();

})();
</script>
