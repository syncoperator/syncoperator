<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Brief → PDF</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:#111}
body{
  font-family:Georgia,'Times New Roman',serif;
  background:#F5F1E8;color:#1c1c1c;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:90px;
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
  body{padding-bottom:calc(82px + env(safe-area-inset-bottom))}
}

.hdr{background:#111;position:sticky;top:0;z-index:100}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 10px}
.logo-name{font-family:‘Arial Black’,Arial,sans-serif;font-size:14px;color:#fff;letter-spacing:.5px}
.logo-sub{font-family:monospace;font-size:8px;color:rgba(255,255,255,.4);letter-spacing:2px;margin-top:2px}
.hdr-date{font-family:monospace;font-size:10px;color:rgba(255,255,255,.5)}
.hdr-stripe{height:4px;background:repeating-linear-gradient(-45deg,#b8390e 0 7px,#111 7px 14px)}

.langs{display:grid;grid-template-columns:1fr 1fr 1fr;background:#1A1A1A}
.langs button{
display:block;color:rgba(255,255,255,.4);
font-family:monospace;font-size:10px;font-weight:700;letter-spacing:2px;
padding:13px 8px;cursor:pointer;position:relative;text-align:center;
background:transparent;border:none;-webkit-tap-highlight-color:transparent;
}
.langs button.on{color:#fff}
.langs button.on::after{content:’’;position:absolute;bottom:0;left:18%;right:18%;height:2px;background:#b8390e}

.wrap{padding:14px;max-width:560px;margin:0 auto}

.box{background:#FAF7F0;border:1.5px solid #1c1c1c;box-shadow:3px 3px 0 #1c1c1c;padding:14px 13px 4px;margin-bottom:14px;position:relative}
.box-lbl{position:absolute;top:-9px;left:11px;background:#F5F1E8;padding:0 7px;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em}

.f{margin-bottom:16px}
label{display:block;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em;color:#7a6f62;margin-bottom:7px}
label b{color:#b8390e;margin-right:7px}
input,textarea{
width:100%;background:transparent;border:none;border-bottom:1.5px solid #1c1c1c;
padding:6px 0 8px;font-family:Georgia,serif;font-size:16px;color:#1c1c1c;
outline:none;resize:none;border-radius:0;-webkit-appearance:none;appearance:none
}
input:focus,textarea:focus{border-bottom-color:#b8390e}
textarea{min-height:150px;line-height:1.55}

.bottom-bar{
position:fixed;bottom:0;left:0;right:0;background:#111;
padding:10px 14px 14px;display:flex;gap:10px;z-index:200;
border-top:2px solid #b8390e
}
@supports(padding-bottom:env(safe-area-inset-bottom)){
.bottom-bar{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
.btn{
flex:1;background:#2A2A2A;color:#fff;border:1.5px solid #444;
font-family:monospace;font-size:11px;font-weight:700;letter-spacing:1.5px;
padding:14px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent;
display:flex;align-items:center;justify-content:center;
}
.btn:active{opacity:.8}
.btn-pdf{background:#b8390e;border-color:#b8390e;flex:1.5}

.toast{
position:fixed;bottom:86px;left:50%;transform:translateX(-50%) translateY(8px);
background:#111;color:#fff;font-family:monospace;font-size:10px;letter-spacing:1.5px;
padding:10px 18px;border-top:2px solid #b8390e;
opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;z-index:300
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── ТОЛЬКО ДЛЯ ПЕЧАТИ ── */
#print-doc{display:none}

@media print{
*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
@page{margin:20mm 22mm;size:A4 portrait}
body > *:not(#print-doc){display:none!important}
#print-doc{
display:block!important;
font-family:Georgia,‘Times New Roman’,serif;
font-size:11pt;color:#111;line-height:1.6;
}
.pr-from{
text-align:right;font-size:10pt;color:#333;
margin-bottom:20pt;line-height:1.5;
}
.pr-to{font-size:11pt;margin-bottom:18pt;line-height:1.5}
.pr-date{text-align:right;font-size:11pt;margin-bottom:6pt}
.pr-rule{height:2pt;margin:12pt 0 16pt;background:#1c1c1c;position:relative}
.pr-rule::after{content:’’;position:absolute;right:0;top:0;bottom:0;width:25%;background:#b8390e}
.pr-subject{font-size:12pt;font-weight:700;margin-bottom:14pt}
.pr-greeting{margin-bottom:10pt}
.pr-body{margin-bottom:18pt;white-space:pre-wrap;line-height:1.65}
.pr-closing{margin-bottom:2pt}
.pr-name{margin-top:28pt}
.pr-footer{
position:fixed;bottom:0;left:0;right:0;
border-top:1pt solid #ddd;padding-top:5pt;
font-family:monospace;font-size:8pt;color:#aaa;
display:flex;justify-content:space-between;
}
}
</style>

</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div>
      <div class="logo-name" id="ttl">BRIEF.PDF</div>
      <div class="logo-sub" id="sub">BRIEFGENERATOR</div>
    </div>
    <div class="hdr-date" id="hdrDate"></div>
  </div>
  <div class="langs">
    <button id="bDe" class="on" onclick="SL('de')">DE</button>
    <button id="bRu" onclick="SL('ru')">RU</button>
    <button id="bEn" onclick="SL('en')">EN</button>
  </div>
  <div class="hdr-stripe"></div>
</header>

<div class="wrap">
  <div class="box">
    <div class="box-lbl" id="lFrom">Absender</div>
    <div class="f"><label><b>01</b><span id="lN1">Name</span></label><input id="fromName" autocomplete="off"></div>
    <div class="f"><label><b>02</b><span id="lA1">Adresse</span></label><textarea id="fromAddr" rows="3"></textarea></div>
  </div>
  <div class="box">
    <div class="box-lbl" id="lTo">Empfänger</div>
    <div class="f"><label><b>03</b><span id="lN2">Name</span></label><input id="toName" autocomplete="off"></div>
    <div class="f"><label><b>04</b><span id="lA2">Adresse</span></label><textarea id="toAddr" rows="3"></textarea></div>
  </div>
  <div class="f"><label><b>05</b><span id="lDt">Datum</span></label><input id="date" type="date"></div>
  <div class="f"><label><b>06</b><span id="lSb">Betreff</span></label><input id="subject" autocomplete="off"></div>
  <div class="f"><label><b>07</b><span id="lGr">Anrede</span></label><input id="greeting" autocomplete="off"></div>
  <div class="f"><label><b>08</b><span id="lBd">Brieftext</span></label><textarea id="body" rows="10"></textarea></div>
  <div class="f"><label><b>09</b><span id="lCl">Grußformel</span></label><input id="closing" autocomplete="off"></div>
</div>

<div id="print-doc"></div>

<div class="bottom-bar">
  <button class="btn" onclick="doReset()">↺ RESET</button>
  <button class="btn btn-pdf" onclick="doPDF()">⎙ PDF</button>
</div>
<div class="toast" id="toast"></div>

<script>
var T={
  de:{ttl:"BRIEF.PDF",sub:"BRIEFGENERATOR",from:"Absender",to:"Empfänger",name:"Name",addr:"Adresse",date:"Datum",subj:"Betreff",greet:"Anrede",body:"Brieftext",close:"Grußformel",sbpfx:"Betreff: ",reset:"ZURÜCKGESETZT",mo:["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"]},
  ru:{ttl:"ПИСЬМО.PDF",sub:"ГЕНЕРАТОР ПИСЕМ",from:"Отправитель",to:"Получатель",name:"Имя",addr:"Адрес",date:"Дата",subj:"Тема",greet:"Приветствие",body:"Текст",close:"Подпись",sbpfx:"Тема: ",reset:"ОЧИЩЕНО",mo:["января","февраля","марта","апреля","мая","июня","июля","августа","сентября","октября","ноября","декабря"]},
  en:{ttl:"LETTER.PDF",sub:"LETTER GENERATOR",from:"Sender",to:"Recipient",name:"Name",addr:"Address",date:"Date",subj:"Subject",greet:"Greeting",body:"Body",close:"Closing",sbpfx:"Subject: ",reset:"RESET",mo:["January","February","March","April","May","June","July","August","September","October","November","December"]}
};
var lang=localStorage.getItem("ll")||"de";

function g(id){return document.getElementById(id)}
function v(id){return g(id).value.trim()}

function SL(l){
  lang=l; localStorage.setItem("ll",l);
  var t=T[l];
  g("ttl").textContent=t.ttl; g("sub").textContent=t.sub;
  var m={lFrom:"from",lTo:"to",lN1:"name",lN2:"name",lA1:"addr",lA2:"addr",lDt:"date",lSb:"subj",lGr:"greet",lBd:"body",lCl:"close"};
  for(var id in m) g(id).textContent=t[m[id]];
  ["bDe","bRu","bEn"].forEach(function(b){g(b).classList.remove("on")});
  g("b"+l[0].toUpperCase()+l.slice(1)).classList.add("on");
}

function fmtDate(iso,l){
  if(!iso)return"";
  var p=iso.split("-"),y=p[0],m=+p[1]-1,d=+p[2];
  var mn=T[l].mo[m];
  return l==="de"?d+". "+mn+" "+y:l==="ru"?d+" "+mn+" "+y+" г.":mn+" "+d+", "+y;
}

function esc(s){return(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function doPDF(){
  var t=T[lang];
  var fromName=v("fromName"),fromAddr=v("fromAddr");
  var toName=v("toName"),toAddr=v("toAddr");
  var date=fmtDate(v("date"),lang);
  var subject=v("subject"),greeting=v("greeting");
  var body=v("body"),closing=v("closing");

  var h="";

  if(fromName||fromAddr){
    var fl=[fromName,fromAddr].filter(Boolean).join("\n");
    h+='<div class="pr-from">'+esc(fl).replace(/\n/g,"<br>")+'</div>';
  }
  if(toName||toAddr){
    var tl=[toName,toAddr].filter(Boolean).join("\n");
    h+='<div class="pr-to">'+esc(tl).replace(/\n/g,"<br>")+'</div>';
  }
  if(date) h+='<div class="pr-date">'+esc(date)+'</div>';

  h+='<div class="pr-rule"></div>';

  if(subject) h+='<div class="pr-subject">'+esc(t.sbpfx+subject)+'</div>';
  if(greeting) h+='<div class="pr-greeting">'+esc(greeting)+'</div>';
  if(body) h+='<div class="pr-body">'+esc(body)+'</div>';
  if(closing) h+='<div class="pr-closing">'+esc(closing)+'</div>';
  if(fromName) h+='<div class="pr-name">'+esc(fromName)+'</div>';
  h+='<div class="pr-footer"><span>'+esc(toName)+'</span><span>'+esc(date)+'</span></div>';

  g("print-doc").innerHTML=h;
  window.print();
}

function doReset(){
  ["fromName","fromAddr","toName","toAddr","subject","greeting","body","closing"].forEach(function(id){g(id).value=""});
  g("date").value=new Date().toISOString().slice(0,10);
  var toast=g("toast");
  toast.textContent="✓ "+T[lang].reset;
  toast.classList.add("on");
  setTimeout(function(){toast.classList.remove("on")},1800);
}

SL(lang);
g("date").value=new Date().toISOString().slice(0,10);
g("hdrDate").textContent=new Date().toLocaleDateString(lang==="ru"?"ru-RU":lang==="de"?"de-DE":"en-GB");
</script>

</body>
</html>
