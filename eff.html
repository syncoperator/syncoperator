<style>
/* === TOKENS === */
:root {
  --ink:      #1a1a1a;
  --ink-soft: #4a4a4a;
  --ink-mute: #9a9a9a;
  --paper:    #fff;
  --bg:       #f4f3ef;
  --card:     #fff;
  --bdr:      #e5e2dc;
  --bdr2:     #d0ccc4;
  --danger:   #c1432f;
  --r:        12px;
  --r-lg:     18px;
  --font:     'Fira Sans', -apple-system, sans-serif;
  --serif:    'Playfair Display', Georgia, serif;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100dvh;
}
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; -webkit-tap-highlight-color: transparent; }
input, textarea { font-family: inherit; }

/* === EDITOR === */
.editor {
display: flex;
flex-direction: column;
min-height: 100dvh;
max-width: 680px;
margin: 0 auto;
}

/* Header */
.hdr {
position: sticky; top: 0; z-index: 20;
display: flex; align-items: center; justify-content: space-between;
padding: max(14px, env(safe-area-inset-top)) 16px 14px;
background: rgba(244,243,239,.95);
backdrop-filter: blur(16px) saturate(180%);
-webkit-backdrop-filter: blur(16px) saturate(180%);
border-bottom: 1px solid var(–bdr);
}
.brand { display: flex; align-items: center; gap: 9px; }
.brand-icon { font-size: 18px; opacity: .65; }
.brand-name {
font-family: var(–serif);
font-style: italic; font-weight: 700;
font-size: 22px; letter-spacing: -.01em; line-height: 1;
}
.hdr-btn {
width: 38px; height: 38px;
display: grid; place-items: center;
border-radius: 10px; transition: background .15s;
}
.hdr-btn:hover { background: rgba(0,0,0,.06); }

/* === DRAFTS BAR — scrollbar hidden, NO iOS indicator === */
.drafts-bar {
display: flex; align-items: center; gap: 8px;
padding: 10px 16px;
overflow-x: auto; overflow-y: visible;
scrollbar-width: none; -ms-overflow-style: none;
}
.drafts-bar::-webkit-scrollbar { display: none; }

.chip-new {
flex-shrink: 0;
display: inline-flex; align-items: center; gap: 6px;
padding: 7px 14px;
border: 1px dashed var(–bdr2); border-radius: 999px;
font-size: 13px; font-weight: 500; color: var(–ink-soft);
white-space: nowrap; transition: background .15s;
}
.chip-new:hover { background: var(–card); }

.drafts-list { display: flex; gap: 8px; flex-wrap: nowrap; }

.chip {
flex-shrink: 0;
display: inline-flex; align-items: center;
border: 1px solid var(–bdr); border-radius: 999px;
font-size: 13px; font-weight: 500; color: var(–ink-soft);
white-space: nowrap; background: var(–card);
overflow: hidden; transition: all .15s;
}
.chip.active { background: var(–ink); color: #fff; border-color: var(–ink); }

.chip-label {
padding: 7px 8px 7px 14px;
max-width: 140px; overflow: hidden; text-overflow: ellipsis;
cursor: pointer;
}
.chip-x {
display: grid; place-items: center;
width: 28px; height: 30px; flex-shrink: 0;
opacity: .4; transition: opacity .15s, background .15s; cursor: pointer;
}
.chip-x:hover { opacity: 1; background: rgba(0,0,0,.07); }
.chip.active .chip-x:hover { background: rgba(255,255,255,.12); }

/* === FORM === */
.form {
flex: 1;
display: flex; flex-direction: column; gap: 14px;
padding: 8px 16px calc(80px + env(safe-area-inset-bottom));
width: 100%;
}
.card {
background: var(–card); border: 1px solid var(–bdr);
border-radius: var(–r-lg); padding: 18px 16px;
box-shadow: 0 1px 3px rgba(0,0,0,.04), 0 2px 8px rgba(0,0,0,.03);
width: 100%; overflow: hidden;
}
.card-hd {
display: flex; align-items: baseline; gap: 10px;
padding-bottom: 12px; margin-bottom: 14px;
border-bottom: 1px solid var(–bdr);
}
.card-num { font-family: var(–serif); font-style: italic; font-size: 13px; color: var(–ink-mute); }
.card-title { font-size: 11.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; width: 100%; }
.field:last-child { margin-bottom: 0; }
.lbl { font-size: 11.5px; font-weight: 600; color: var(–ink-soft); letter-spacing: .03em; }
.opt { font-weight: 400; color: var(–ink-mute); font-style: italic; }

.field input, .field textarea {
width: 100%; padding: 11px 13px;
font-size: 16px; line-height: 1.45; color: var(–ink);
background: var(–bg); border: 1px solid var(–bdr);
border-radius: var(–r); -webkit-appearance: none; appearance: none;
transition: border-color .15s, box-shadow .15s, background .15s;
}
.field textarea { resize: vertical; min-height: 64px; }
.field input:focus, .field textarea:focus {
outline: none; border-color: var(–ink);
background: var(–paper); box-shadow: 0 0 0 3px rgba(26,26,26,.07);
}
.field input::placeholder, .field textarea::placeholder { color: var(–ink-mute); }

/* Templates */
.tpl-row {
display: flex; gap: 6px; margin-bottom: 14px;
overflow-x: auto; overflow-y: visible;
scrollbar-width: none; -ms-overflow-style: none;
}
.tpl-row::-webkit-scrollbar { display: none; }
.tpl {
flex-shrink: 0; padding: 6px 12px;
border: 1px solid var(–bdr); border-radius: 999px;
font-size: 12px; font-weight: 500; color: var(–ink-soft);
background: var(–bg); white-space: nowrap; transition: all .15s;
}
.tpl:hover { background: var(–ink); color: #fff; border-color: var(–ink); }
.tpl:active { transform: scale(.96); }

/* === ACTION BAR === */
.action-bar {
position: fixed; bottom: 0; z-index: 20;
display: flex; gap: 10px;
padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
background: rgba(244,243,239,.96);
backdrop-filter: blur(16px) saturate(180%);
-webkit-backdrop-filter: blur(16px) saturate(180%);
border-top: 1px solid var(–bdr);
width: 100%; max-width: 680px;
left: 50%; transform: translateX(-50%);
}
.act {
flex: 1; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
padding: 13px 16px; border-radius: var(–r);
font-size: 15px; font-weight: 500; transition: transform .1s, background .15s;
}
.act:active { transform: scale(.97); }
.act-p { background: var(–ink); color: #fff; }
.act-p:hover { background: #000; }
.act-s { background: var(–card); color: var(–ink); border: 1px solid var(–bdr); }
.act-s:hover { border-color: var(–bdr2); }

/* === MENU === */
.overlay {
position: fixed; inset: 0; z-index: 100;
background: rgba(20,18,14,.45);
display: flex; align-items: flex-end; justify-content: center;
animation: fadeIn .2s ease;
}
.overlay[hidden] { display: none; }
.sheet {
position: relative; width: 100%; max-width: 520px;
background: var(–card); border-radius: 22px 22px 0 0;
padding: 16px 16px calc(20px + env(safe-area-inset-bottom));
box-shadow: 0 8px 30px rgba(0,0,0,.14), 0 30px 80px rgba(0,0,0,.1);
animation: slideUp .22s cubic-bezier(.2,.8,.2,1);
}
.sheet-hd { font-family: var(–serif); font-style: italic; font-size: 20px; font-weight: 700; margin-bottom: 12px; padding-right: 40px; }
.sheet-x {
position: absolute; top: 14px; right: 14px;
width: 34px; height: 34px; display: grid; place-items: center;
border-radius: 9px; color: var(–ink-soft);
}
.sheet-x:hover { background: var(–bg); }
.mitem {
display: flex; align-items: center; gap: 12px;
width: 100%; padding: 13px 10px;
border-radius: var(–r); font-size: 15px; text-align: left; transition: background .15s;
}
.mitem:hover { background: var(–bg); }
.mitem-d { color: var(–danger); }
.sheet-note {
margin-top: 10px; padding: 11px 12px;
background: var(–bg); border-radius: var(–r);
font-size: 12px; line-height: 1.5; color: var(–ink-soft);
}
@keyframes fadeIn  { from { opacity: 0; }          to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

/* === TOAST === */
.toast {
position: fixed; bottom: calc(82px + env(safe-area-inset-bottom));
left: 50%; transform: translateX(-50%) translateY(14px);
z-index: 300; padding: 9px 16px;
background: var(–ink); color: #fff;
font-size: 13px; border-radius: 999px;
opacity: 0; pointer-events: none;
transition: opacity .2s, transform .2s;
white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,.2);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* === PREVIEW === */
.preview-wrap {
display: none;
position: fixed; inset: 0; z-index: 50;
background: #272420; overflow: auto; -webkit-overflow-scrolling: touch;
}
.preview-wrap.open { display: block; }

.preview-bar {
position: sticky; top: 0; z-index: 10;
display: flex; justify-content: space-between; align-items: center;
padding: max(12px, env(safe-area-inset-top)) 14px 12px;
background: rgba(28,25,22,.88);
backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.pv-back, .pv-print {
display: inline-flex; align-items: center; gap: 7px;
padding: 9px 13px; border-radius: 9px;
font-size: 14px; font-weight: 500; transition: background .15s;
}
.pv-back  { color: #fff; }
.pv-back:hover { background: rgba(255,255,255,.1); }
.pv-print { background: #fff; color: var(–ink); }
.pv-print:hover { background: rgba(255,255,255,.88); }

/* Page host: centres the scaled page, provides scrollable space */
.page-host {
display: flex; justify-content: center;
padding: 14px 0 40px;
}
.page-sizer {
/* Dimensions are set by JS to match scaled page */
position: relative; flex-shrink: 0;
}

/* The A4 page: 794×1123 px = 210×297 mm @ 96 dpi.
JS sets –s, transform scales from top-left. */
.page {
position: absolute; top: 0; left: 0;
width: 794px; height: 1123px;
transform: scale(var(–s, 1)); transform-origin: top left;
background: #fff;
box-shadow: 0 4px 40px rgba(0,0,0,.55);
font-family: ‘Fira Sans’, sans-serif;
font-size: 10pt; line-height: 14pt; color: #000;
padding: 90.7px; /* 24 mm */
box-sizing: border-box; overflow: hidden;
}

/* Address window ghost (visual only) */
.a-win {
position: absolute;
left: 56.7px; top: 166px; /* 15mm, ~44mm */
width: 340px; height: 170px;
border-radius: 14px; background: rgba(0,0,0,.04);
}

/* Sender mini-line above recipient */
.a-from {
position: absolute;
left: 75.6px; top: 164px;
width: 340px;
font-size: 8pt; line-height: 12pt; color: #666;
}

/* Recipient */
.a-to {
position: absolute;
left: 75.6px; top: 186px;
width: 340px;
font-size: 10pt; line-height: 14pt;
}

/* Sender info sidebar (right) */
.s-bar {
position: absolute;
right: 90.7px; top: 93.3px; /* 70pt */
width: 151px; /* 40mm */
height: 242px; /* 182pt */
font-size: 8pt; line-height: 12pt;
}
.s-bar-in {
position: absolute; bottom: 2px; width: 100%;
}

/* Letter body */
.l-body {
position: absolute;
left: 90.7px; top: 411px; /* 308pt */
right: 90.7px;
font-size: 10pt; line-height: 14pt;
}
.l-body p { margin: 0 0 14pt; }
.l-subj { font-weight: bold; margin-bottom: 14pt; }
.l-attach { margin-top: 21pt; font-size: 8pt; line-height: 12pt; }
.l-attach em { font-style: italic; font-weight: bold; }

/* Fold marks */
.fold { position: absolute; left: 18.9px; background: rgba(0,0,0,.25); width: 1px; }
.fold-1 { top: 396.9px; height: 11.3px; }
.fold-2 { top: 561.3px; height: 18.9px; }
.fold-3 { top: 793.7px; height: 11.3px; }

/* === PRINT — scale reset, only page content === */
@media print {
@page { size: A4; margin: 0; }
html, body { background: white !important; }
.no-print, .editor, .action-bar, .overlay, .toast,
.preview-bar, .page-host { display: none !important; }
.preview-wrap {
display: block !important; position: static !important;
background: white !important; overflow: visible !important;
}
.page-sizer { display: none !important; }
/* Print page rendered separately with mm units */
.print-page {
position: static !important;
width: 210mm !important; height: 297mm !important;
padding: 24mm !important;
transform: none !important;
box-shadow: none !important;
font-size: 10pt !important; line-height: 14pt !important;
background: white; overflow: hidden;
}
.print-page .a-win  { display: none; }
.print-page .a-from { position: absolute; left: 20mm; top: 126pt; width: 90mm; }
.print-page .a-to   { position: absolute; left: 20mm; top: 148pt; width: 90mm; }
.print-page .s-bar  { position: absolute; right: 24mm; top: 70pt; width: 40mm; height: 182pt; }
.print-page .l-body { position: absolute; left: 24mm; top: 308pt; right: 24mm; }
.print-page .fold-1 { top: 105mm; height: 3mm; }
.print-page .fold-2 { top: 148.5mm; height: 5mm; }
.print-page .fold-3 { top: 210mm; height: 3mm; }
}
</style>

</head>

  <div class="preview-bar no-print">
    <button class="pv-back" id="btn-back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      Bearbeiten
    </button>
    <button class="pv-print" id="btn-print">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
      Drucken / PDF
    </button>
  </div>

  <!-- Scaled preview (screen only) -->

  <div class="page-host no-print">
    <div class="page-sizer" id="sizer">
      <div class="page" id="pv-page">
        <div class="a-win"></div>
        <div class="a-from" id="pv-from"></div>
        <div class="a-to"   id="pv-to"></div>
        <div class="s-bar"><div class="s-bar-in" id="pv-sidebar"></div></div>
        <div class="l-body">
          <div class="l-subj" id="pv-subj"></div>
          <div id="pv-body"></div>
          <div class="l-attach" id="pv-attach"></div>
        </div>
        <div class="fold fold-1"></div>
        <div class="fold fold-2"></div>
        <div class="fold fold-3"></div>
      </div>
    </div>
  </div>

  <!-- Full-size print page (hidden on screen, shown only during window.print()) -->

  <div id="print-wrap" style="display:none">
    <div class="page print-page" id="pr-page">
      <div class="a-win"></div>
      <div class="a-from" id="pr-from"></div>
      <div class="a-to"   id="pr-to"></div>
      <div class="s-bar"><div class="s-bar-in" id="pr-sidebar"></div></div>
      <div class="l-body">
        <div class="l-subj" id="pr-subj"></div>
        <div id="pr-body"></div>
        <div class="l-attach" id="pr-attach"></div>
      </div>
      <div class="fold fold-1"></div>
      <div class="fold fold-2"></div>
      <div class="fold fold-3"></div>
    </div>
  </div>

</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---- Storage keys ---- */
const SK='brief-v3', AK='brief-v3-active';

/* ---- Blank draft ---- */
function blank(){
  return {
    id:'D'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),
    name:'Neuer Entwurf', ts:Date.now(),
    f:{ sname:'',saddr:'',semail:'',sphone:'',
        rname:'',raddr:'',date:today(),
        subj:'',greet:'Sehr geehrte Damen und Herren,',
        body:'',close:'Mit freundlichen Grüßen',attach:'' }
  };
}

/* ---- Templates ---- */
var T={
  bewerbung:{name:'Bewerbung',subj:'Bewerbung als [Position]',
    greet:'Sehr geehrte Damen und Herren,',
    body:'mit großem Interesse habe ich Ihre Stellenanzeige gelesen und möchte mich hiermit auf die Position als [Position] bewerben.\n\nIn meiner bisherigen Tätigkeit konnte ich umfangreiche Erfahrungen in [Bereich] sammeln. Besonders meine Kenntnisse in [Fähigkeit 1] und [Fähigkeit 2] qualifizieren mich für diese Stelle.\n\nIch freue mich darauf, Sie in einem persönlichen Gespräch von meiner Motivation zu überzeugen.',
    close:'Mit freundlichen Grüßen',attach:'Lebenslauf\nZeugnisse\nReferenzen'},
  kuendigung:{name:'Kündigung',subj:'Kündigung meines Vertrags zum nächstmöglichen Termin',
    greet:'Sehr geehrte Damen und Herren,',
    body:'hiermit kündige ich meinen oben genannten Vertrag fristgerecht zum nächstmöglichen Termin.\n\nBitte bestätigen Sie mir den Eingang dieser Kündigung sowie das Vertragsende schriftlich.',
    close:'Mit freundlichen Grüßen',attach:''},
  widerspruch:{name:'Widerspruch',subj:'Widerspruch gegen [Bescheid] vom [Datum]',
    greet:'Sehr geehrte Damen und Herren,',
    body:'gegen den oben genannten Bescheid lege ich hiermit fristgerecht Widerspruch ein.\n\nBegründung: [Bitte hier Ihre Begründung einfügen]\n\nIch bitte um Prüfung des Sachverhalts und um schriftliche Stellungnahme.',
    close:'Mit freundlichen Grüßen',attach:''},
  anfrage:{name:'Anfrage',subj:'Anfrage bezüglich [Thema]',
    greet:'Sehr geehrte Damen und Herren,',
    body:'ich wende mich mit folgendem Anliegen an Sie:\n\n[Bitte hier Ihre Anfrage formulieren]\n\nÜber eine baldige Rückmeldung würde ich mich sehr freuen.',
    close:'Mit freundlichen Grüßen',attach:''},
  dank:{name:'Dankschreiben',subj:'Vielen Dank',
    greet:'Sehr geehrte Damen und Herren,',
    body:'ich möchte mich auf diesem Wege herzlich bei Ihnen für [Anlass] bedanken.\n\n[Persönliche Worte]\n\nVielen Dank nochmals für Ihre Mühe.',
    close:'Mit freundlichen Grüßen',attach:''},
  leer:{name:'Leer',subj:'',greet:'Sehr geehrte Damen und Herren,',body:'',close:'Mit freundlichen Grüßen',attach:''}
};

/* ---- State ---- */
var drafts={}, active=null, saveTimer=null;

/* ---- DOM ---- */
function $i(id){ return document.getElementById(id); }
var E={
  sname:$i('f-sname'),saddr:$i('f-saddr'),semail:$i('f-semail'),sphone:$i('f-sphone'),
  rname:$i('f-rname'),raddr:$i('f-raddr'),
  date:$i('f-date'),subj:$i('f-subj'),greet:$i('f-greet'),
  body:$i('f-body'),close:$i('f-close'),attach:$i('f-attach'),
  draftsList:$i('drafts-list'),btnNew:$i('btn-new'),
  menuBtn:$i('menu-btn'),menuWrap:$i('menu-wrap'),menuClose:$i('menu-close'),
  mRename:$i('m-rename'),mDup:$i('m-dup'),mExport:$i('m-export'),mImport:$i('m-import'),mDel:$i('m-del'),
  fileImport:$i('file-import'),
  btnPreview:$i('btn-preview'),btnPdf:$i('btn-pdf'),
  preview:$i('preview'),btnBack:$i('btn-back'),btnPrint:$i('btn-print'),
  sizer:$i('sizer'),
  pvFrom:$i('pv-from'),pvTo:$i('pv-to'),pvSidebar:$i('pv-sidebar'),
  pvSubj:$i('pv-subj'),pvBody:$i('pv-body'),pvAttach:$i('pv-attach'),
  printWrap:$i('print-wrap'),
  prFrom:$i('pr-from'),prTo:$i('pr-to'),prSidebar:$i('pr-sidebar'),
  prSubj:$i('pr-subj'),prBody:$i('pr-body'),prAttach:$i('pr-attach'),
  toast:$i('toast'),
  tpls:document.querySelectorAll('.tpl')
};
var FIELDS=['sname','saddr','semail','sphone','rname','raddr','date','subj','greet','body','close','attach'];

/* ---- Helpers ---- */
function today(){
  var M=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
  var d=new Date();
  return d.getDate()+'. '+M[d.getMonth()]+' '+d.getFullYear();
}
function esc(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
var toastTimer;
function toast(msg){
  E.toast.textContent=msg;
  E.toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){ E.toast.classList.remove('show'); },2000);
}

/* ---- Persistence ---- */
function loadDrafts(){
  try{ drafts=JSON.parse(localStorage.getItem(SK))||{}; }catch(e){ drafts={}; }
  active=localStorage.getItem(AK);
  if(!Object.keys(drafts).length){ var d=blank(); drafts[d.id]=d; active=d.id; }
  if(!active||!drafts[active]) active=Object.keys(drafts)[0];
}
function persist(){
  try{ localStorage.setItem(SK,JSON.stringify(drafts)); localStorage.setItem(AK,active); }
  catch(e){ toast('Speichern fehlgeschlagen'); }
}

/* ---- Form ---- */
function fillForm(d){
  FIELDS.forEach(function(k){ if(E[k]) E[k].value=d.f[k]||''; });
}
function readForm(){
  var f={};
  FIELDS.forEach(function(k){ f[k]=E[k]?E[k].value:''; });
  return f;
}
function onInput(){
  var d=drafts[active]; if(!d) return;
  d.f=readForm();
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    d.ts=Date.now();
    if(d.name==='Neuer Entwurf'||!d.name){
      var c=(d.f.subj||d.f.rname||'').trim();
      if(c && /[a-zA-ZäöüÄÖÜß0-9]{2,}/.test(c)) d.name=c.slice(0,28);
    }
    persist(); renderDrafts();
  },500);
}

/* ---- Drafts ---- */
function renderDrafts(){
  var list=Object.values(drafts).sort(function(a,b){ return b.ts-a.ts; });
  E.draftsList.innerHTML='';
  list.forEach(function(d){
    var chip=document.createElement('div');
    chip.className='chip'+(d.id===active?' active':'');

    var lbl=document.createElement('span');
    lbl.className='chip-label';
    lbl.textContent=d.name||'Ohne Titel';
    lbl.title=d.name||'Ohne Titel';
    lbl.addEventListener('click',function(){ switchDraft(d.id); });

    var x=document.createElement('span');
    x.className='chip-x';
    x.setAttribute('role','button');
    x.setAttribute('aria-label','Löschen');
    x.innerHTML='<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
    x.addEventListener('click',function(e){ e.stopPropagation(); deleteDraftById(d.id); });

    chip.appendChild(lbl); chip.appendChild(x);
    E.draftsList.appendChild(chip);
  });
}
function switchDraft(id){
  if(!drafts[id]) return;
  active=id; fillForm(drafts[id]); persist(); renderDrafts();
}
function newDraft(){
  var d=blank(); drafts[d.id]=d; active=d.id;
  fillForm(d); persist(); renderDrafts();
  toast('Neuer Entwurf erstellt');
  window.scrollTo({top:0,behavior:'smooth'});
  setTimeout(function(){ E.rname.focus(); },300);
}
function deleteDraftById(id){
  var d=drafts[id]; if(!d) return;
  if(!confirm('Entwurf "'+( d.name||'Ohne Titel')+'" löschen?')) return;
  delete drafts[id];
  if(!Object.keys(drafts).length){ var nd=blank(); drafts[nd.id]=nd; active=nd.id; }
  else if(id===active) active=Object.keys(drafts)[0];
  fillForm(drafts[active]); persist(); renderDrafts();
  toast('Gelöscht');
}
function renameDraft(){
  var d=drafts[active]; if(!d) return;
  var n=prompt('Name:',d.name||''); if(n===null) return;
  d.name=n.trim()||'Ohne Titel'; persist(); renderDrafts(); toast('Umbenannt');
}
function dupDraft(){
  var d=drafts[active]; if(!d) return;
  var c=JSON.parse(JSON.stringify(d));
  c.id='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  c.name=(d.name||'Entwurf')+' (Kopie)'; c.ts=Date.now();
  drafts[c.id]=c; active=c.id; fillForm(c); persist(); renderDrafts(); toast('Dupliziert');
}
function exportDraft(){
  var d=drafts[active]; if(!d) return;
  var b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b);
  a.download='brief-'+(d.name||'entwurf').replace(/[^\wäöüÄÖÜß]+/g,'-').toLowerCase()+'.json';
  a.click(); URL.revokeObjectURL(a.href); toast('Exportiert');
}
function importDraft(file){
  var r=new FileReader();
  r.onload=function(e){
    try{
      var o=JSON.parse(e.target.result);
      if(!o.f) throw 0;
      o.id='D'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
      o.ts=Date.now();
      drafts[o.id]=o; active=o.id; fillForm(o); persist(); renderDrafts(); toast('Importiert');
    }catch(e){ toast('Ungültiges Format'); }
  };
  r.readAsText(file);
}

/* ---- Template ---- */
function applyTpl(key){
  var t=T[key]; if(!t) return;
  var d=drafts[active]; if(!d) return;
  if(d.f.body&&d.f.body.trim()&&!confirm('Text überschreiben?')) return;
  d.f.subj=t.subj; d.f.greet=t.greet; d.f.body=t.body; d.f.close=t.close; d.f.attach=t.attach;
  if(d.name==='Neuer Entwurf') d.name=t.name;
  fillForm(d); persist(); renderDrafts(); toast('Vorlage: '+t.name);
}

/* ---- Render letter into DOM elements ---- */
function renderLetter(ids, f){
  var hasFrom=f.sname&&f.sname.trim()&&f.saddr&&f.saddr.trim();
  if(hasFrom){
    ids.from.textContent=[f.sname, f.saddr.replace(/\n+/g,', ').trim()].join(', ');
    ids.from.style.display='';
  } else {
    ids.from.textContent=''; ids.from.style.display='none';
  }

  ids.to.innerHTML=esc([f.rname,f.raddr].filter(function(s){ return s&&s.trim(); }).join('\n')).replace(/\n/g,'<br>');

  var sb=[];
  var sblock=[f.sname,f.saddr].filter(function(s){ return s&&s.trim(); }).join('\n');
  if(sblock) sb.push(sblock);
  if(f.semail&&f.semail.trim()) sb.push(f.semail);
  if(f.sphone&&f.sphone.trim()) sb.push(f.sphone);
  if(f.date&&f.date.trim()) sb.push(f.date);
  ids.sidebar.innerHTML=sb.map(function(b){ return esc(b).replace(/\n/g,'<br>'); }).join('<br><br>');

  ids.subj.textContent=f.subj||'';

  var parts=[];
  if(f.greet) parts.push('<p>'+esc(f.greet)+'</p>');
  (f.body||'').split(/\n\s*\n/).forEach(function(p){ if(p.trim()) parts.push('<p>'+esc(p).replace(/\n/g,'<br>')+'</p>'); });
  if(f.close) parts.push('<p>'+esc(f.close)+'<br><br><br>'+esc(f.sname||'')+'</p>');
  ids.body.innerHTML=parts.join('');

  if(f.attach&&f.attach.trim()){
    ids.attach.innerHTML='<p><em>Anlagen</em>:</p><div>'+esc(f.attach).replace(/\n/g,'<br>')+'</div>';
  } else { ids.attach.innerHTML=''; }
}

/* ---- Scale preview to fit screen ---- */
function scalePreview(){
  var W=794, H=1123;
  var avail=Math.min(window.innerWidth,680)-24;
  var s=Math.min(1, avail/W);
  document.documentElement.style.setProperty('--s', s.toFixed(4));
  E.sizer.style.width=Math.round(W*s)+'px';
  E.sizer.style.height=Math.round(H*s)+'px';
}

/* ---- Preview open/close ---- */
function openPreview(){
  var f=drafts[active]?drafts[active].f:{};
  renderLetter({from:E.pvFrom,to:E.pvTo,sidebar:E.pvSidebar,subj:E.pvSubj,body:E.pvBody,attach:E.pvAttach},f);
  scalePreview();
  E.preview.classList.add('open');
  E.preview.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
}
function closePreview(){
  E.preview.classList.remove('open');
  E.preview.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
}

/* ---- Print/PDF ---- */
function doPrint(){
  var f=drafts[active]?drafts[active].f:{};
  renderLetter({from:E.prFrom,to:E.prTo,sidebar:E.prSidebar,subj:E.prSubj,body:E.prBody,attach:E.prAttach},f);
  E.printWrap.style.display='block';
  // Brief pause so browser renders the full-size page before print dialog
  setTimeout(function(){
    window.print();
    setTimeout(function(){ E.printWrap.style.display='none'; },1500);
  },80);
}

/* ---- Menu ---- */
function openMenu(){ E.menuWrap.hidden=false; }
function closeMenu(){ E.menuWrap.hidden=true; }

/* ---- Event binding ---- */
function bind(){
  FIELDS.forEach(function(k){ if(E[k]) E[k].addEventListener('input',onInput); });
  E.btnNew.addEventListener('click',newDraft);
  E.tpls.forEach(function(b){ b.addEventListener('click',function(){ applyTpl(b.dataset.tpl); }); });
  E.btnPreview.addEventListener('click',openPreview);
  E.btnBack.addEventListener('click',closePreview);
  E.btnPrint.addEventListener('click',doPrint);
  E.btnPdf.addEventListener('click',doPrint);
  E.menuBtn.addEventListener('click',openMenu);
  E.menuClose.addEventListener('click',closeMenu);
  E.menuWrap.addEventListener('click',function(e){ if(e.target===E.menuWrap) closeMenu(); });
  E.mRename.addEventListener('click',function(){ closeMenu(); renameDraft(); });
  E.mDup.addEventListener('click',function(){ closeMenu(); dupDraft(); });
  E.mExport.addEventListener('click',function(){ closeMenu(); exportDraft(); });
  E.mImport.addEventListener('click',function(){ closeMenu(); E.fileImport.click(); });
  E.mDel.addEventListener('click',function(){ closeMenu(); deleteDraftById(active); });
  E.fileImport.addEventListener('change',function(e){ if(e.target.files[0]) importDraft(e.target.files[0]); e.target.value=''; });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Escape') return;
    if(E.preview.classList.contains('open')) closePreview();
    else if(!E.menuWrap.hidden) closeMenu();
  });
  window.addEventListener('resize',function(){ if(E.preview.classList.contains('open')) scalePreview(); });
  if(screen.orientation) screen.orientation.addEventListener('change',scalePreview);
}

/* ---- Init ---- */
function init(){
  loadDrafts(); fillForm(drafts[active]); renderDrafts(); bind();
}
document.readyState==='loading'
  ? document.addEventListener('DOMContentLoaded',init)
  : init();

})();
</script>

</body>
</html>
