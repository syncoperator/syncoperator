<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efficiency Pro v3.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #ececf1; --surface: #ffffff; --accent: #000000;
            --text-main: #1c1c1e; --text-sec: #636366; --border: #d1d1d6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text-main); }
        
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 160px; }
        
        header { margin-bottom: 25px; border-left: 6px solid var(--accent); padding-left: 15px; }
        header h1 { font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }

        .card { 
            background: var(--surface); border: 2px solid var(--accent); 
            padding: 20px; margin-bottom: 20px;
        }

        .tool-nr { font-size: 10px; color: var(--text-sec); text-transform: uppercase; display: block; }
        .tool-desc { font-size: 18px; font-weight: 900; text-transform: uppercase; margin-bottom: 15px; display: block; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: var(--text-sec); text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; border: 1.5px solid var(--border); 
            font-size: 16px; font-weight: 700; background: #f9f9fb; outline: none;
        }
        input:focus { border-color: var(--accent); background: #fff; }

        /* Стили аналитики */
        .cap-block { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .cap-block h4 { margin: 0 0 10px 0; font-size: 12px; color: var(--accent); text-transform: uppercase; }
        .cap-line { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; font-weight: 600; }
        .cap-label { color: var(--text-sec); font-weight: 400; }

        .money-banner { background: var(--accent); color: white; padding: 20px; margin-bottom: 20px; }
        .money-banner small { font-size: 11px; opacity: 0.7; font-weight: 600; text-transform: uppercase; }
        .money-banner div { font-size: 32px; font-weight: 900; margin-top: 5px; }

        .footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: white; border-top: 2px solid var(--accent);
            display: flex; gap: 10px; padding: 20px; z-index: 1000;
        }
        .btn { flex: 1; height: 55px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .btn-black { background: var(--accent); color: white; }
        .btn-outline { background: white; border: 2px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Efficiency Pro</h1><small>v3.2 Industrial Elite</small></header>

    <!-- T-01: BAUTEIL -->
    <section class="card">
        <span class="tool-nr">T-01</span>
        <span class="tool-desc">Bauteil Information</span>
        <div class="input-grid">
            <div class="field full"><label>Benennung</label><input type="text" id="partName" value="Gehäuse"></div>
            <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="partNum" value="234446"></div>
        </div>
    </section>

    <!-- T-02: PRODUCTION -->
    <section class="card">
        <span class="tool-nr">T-02</span>
        <span class="tool-desc">Produktionsdaten</span>
        <div class="input-grid">
            <div class="field full"><label>Gesamtstückzahl</label><input type="number" id="stk" value="290" oninput="calc()"></div>
            <div class="field"><label>ALT (Min)</label><input type="number" id="am" value="5" oninput="calc()"></div>
            <div class="field"><label>ALT (Sek)</label><input type="number" id="as" value="30" oninput="calc()"></div>
            <div class="field"><label>NEU (Min)</label><input type="number" id="nm" value="4" oninput="calc()"></div>
            <div class="field"><label>NEU (Sek)</label><input type="number" id="ns" value="15" oninput="calc()"></div>
            <div class="field"><label>Abends (Stk)</label><input type="number" id="abend" value="30" oninput="calc()"></div>
            <div class="field"><label>Schicht (h)</label><input type="number" id="sh" value="7.5" oninput="calc()"></div>
        </div>
    </section>

    <!-- T-03: KOSTEN -->
    <section class="card">
        <span class="tool-nr">T-03</span>
        <span class="tool-desc">Maschinenstundensatz</span>
        <div class="field full"><label>Kostensatz (€/h)</label><input type="number" id="hourlyRate" value="85" oninput="calc()"></div>
    </section>

    <div class="money-banner">
        <small id="saving-label">Ersparnis</small>
        <div id="money-saved">0,00 €</div>
        <div id="time-saved-text" style="font-size: 14px; opacity: 0.8; margin-top: 5px; font-weight: 600;">0 MIN GESPART</div>
    </div>

    <!-- T-04: ANALYSE -->
    <section class="card">
        <span class="tool-nr">T-04</span>
        <span class="tool-desc">Kapazitätsanalyse</span>
        
        <div class="cap-block">
            <h4>Analyse (ALT)</h4>
            <div class="cap-line"><span class="cap-label">Kapazität / Tag:</span><span id="cap-day-alt">-</span></div>
            <div class="cap-line"><span class="cap-label">Zeitbedarf:</span><span id="days-alt">-</span></div>
            <div class="cap-line"><span class="cap-label">Gesamtminuten:</span><span id="min-alt">-</span></div>
        </div>

        <div class="cap-block" style="border-top: 2px solid var(--accent);">
            <h4>Analyse (NEU)</h4>
            <div class="cap-line"><span class="cap-label">Kapazität / Tag:</span><span id="cap-day-neu">-</span></div>
            <div class="cap-line"><span class="cap-label">Zeitbedarf:</span><span id="days-neu">-</span></div>
            <div class="cap-line"><span class="cap-label">Gesamtminuten:</span><span id="min-neu">-</span></div>
        </div>
    </section>
</div>

<div class="footer-nav">
    <button class="btn btn-outline" onclick="alert('Daten lokal gesichert')">Speichern</button>
    <button class="btn btn-black" onclick="generatePDF()">PDF Bericht</button>
</div>

<script>
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const abend = parseFloat(document.getElementById('abend').value) || 0;
        const shH = parseFloat(document.getElementById('sh').value) || 0;
        const rate = parseFloat(document.getElementById('hourlyRate').value) || 0;
        const shSec = shH * 3600;

        const tA = (parseFloat(document.getElementById('am').value)*60) + (parseFloat(document.getElementById('as').value)||0);
        const tN = (parseFloat(document.getElementById('nm').value)*60) + (parseFloat(document.getElementById('ns').value)||0);

        if (tA <= 0 || tN <= 0) return;

        // Расчеты по дням
        const capDayA = (shSec / tA) + abend;
        const capDayN = (shSec / tN) + abend;
        const daysA = stk / capDayA;
        const daysN = stk / capDayN;
        const totalMinA = (stk * tA) / 60;
        const totalMinN = (stk * tN) / 60;
        const minDiff = totalMinA - totalMinN;
        const moneySaved = (minDiff / 60) * rate;

        // Обновление экрана
        document.getElementById('money-saved').innerText = moneySaved.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
        document.getElementById('time-saved-text').innerText = Math.round(minDiff) + " MINUTEN GESPART";
        
        document.getElementById('cap-day-alt').innerText = capDayA.toFixed(1) + " Stk";
        document.getElementById('days-alt').innerText = daysA.toFixed(1) + " Tage";
        document.getElementById('min-alt').innerText = Math.round(totalMinA) + " min";

        document.getElementById('cap-day-neu').innerText = capDayN.toFixed(1) + " Stk";
        document.getElementById('days-neu').innerText = daysN.toFixed(1) + " Tage";
        document.getElementById('min-neu').innerText = Math.round(totalMinN) + " min";

        window.latestCalc = { stk, tA, tN, abend, shH, rate, capDayA, capDayN, daysA, daysN, totalMinA, totalMinN, minDiff, moneySaved };
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const d = window.latestCalc;
        
        doc.setLineWidth(1.0); doc.line(15, 25, 195, 25);
        doc.setFont("helvetica", "bold"); doc.setFontSize(22);
        doc.text("PRODUKTIONS-BERICHT", 105, 20, {align: 'center'});

        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text(`NR: ${document.getElementById('partNum').value} | ${document.getElementById('partName').value}`, 15, 35);
        doc.text(`DATUM: ${new Date().toLocaleDateString('de-DE')}`, 15, 41);

        const buildSection = (title, cap, days, min, y) => {
            doc.setFont("helvetica", "bold"); doc.setFontSize(12);
            doc.text(title, 15, y);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10);
            doc.text(`- Kapazität pro Tag: ${cap.toFixed(1)} Stück`, 20, y+7);
            doc.text(`- Zeitbedarf: ${days.toFixed(1)} Arbeitstage`, 20, y+13);
            doc.text(`- Gesamtminuten: ${Math.round(min)} min`, 20, y+19);
            return y + 30;
        };

        let currentY = 55;
        currentY = buildSection("KAPAZITÄTSANALYSE (ALT):", d.capDayA, d.daysA, d.totalMinA, currentY);
        currentY = buildSection("KAPAZITÄTSANALYSE (NEU / ERSPARNIS):", d.capDayN, d.daysN, d.totalMinN, currentY);

        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text(`FINANZIELLE ERSPARNIS: ${d.moneySaved.toFixed(2)} €`, 15, currentY + 10);
        doc.text(`ZEIT-ERSPARNIS: ${Math.round(d.minDiff)} MIN`, 15, currentY + 18);

        doc.setLineWidth(1.0); doc.line(15, 280, 195, 280);
        doc.setFontSize(8); doc.text("CNC PRODUCTION OPTIMIZER I INDUSTRIAL v3.2", 105, 287, {align: 'center'});
        doc.save(`Report_${document.getElementById('partNum').value}.pdf`);
    }

    calc();
</script>
</body>
</html>
