<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efficiency Pro v3.3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f4f4f7; --surface: #ffffff; --accent: #000000;
            --text-main: #1c1c1e; --text-sec: #636366; --border: #000000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text-main); }
        
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 180px; } /* Отступ снизу */
        
        header { margin-bottom: 30px; border-bottom: 3px solid var(--accent); padding-bottom: 10px; text-align: center; }
        header h1 { font-size: 26px; font-weight: 900; margin: 0; text-transform: uppercase; letter-spacing: -1px; }

        .card { 
            background: var(--surface); border: 2px solid var(--accent); 
            padding: 20px; margin-bottom: 20px; position: relative;
        }

        /* T-NR Styling */
        .tool-nr { font-size: 11px; font-weight: 400; color: var(--text-sec); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .tool-desc { font-size: 18px; font-weight: 900; text-transform: uppercase; display: block; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 11px; font-weight: 800; margin-bottom: 5px; color: var(--text-sec); text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; border: 1.5px solid #d1d1d6; 
            font-size: 16px; font-weight: 700; background: #fff; outline: none; border-radius: 0;
        }
        input:focus { border-color: var(--accent); }

        /* Таблица на экране */
        .res-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .res-table th { text-align: left; font-size: 10px; padding: 10px 5px; background: #f9f9f9; border-bottom: 2px solid var(--accent); }
        .res-table td { padding: 12px 5px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #eee; }
        .val-alt { color: var(--text-sec); }
        .val-neu { color: var(--accent); font-weight: 900; }

        .money-banner { background: var(--accent); color: white; padding: 25px; margin-bottom: 25px; text-align: center; }
        .money-banner small { font-size: 12px; opacity: 0.8; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
        .money-banner div { font-size: 36px; font-weight: 900; margin-top: 5px; }

        .footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: rgba(255,255,255,0.95); border-top: 3px solid var(--accent);
            display: flex; gap: 15px; padding: 25px 20px; z-index: 1000;
        }
        .btn { flex: 1; height: 60px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; font-size: 14px; }
        .btn-black { background: var(--accent); color: white; }
        .btn-outline { background: white; border: 2px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Produktions-Bericht</h1></header>

    <!-- T-01 -->
    <section class="card">
        <span class="tool-nr">T-01</span>
        <span class="tool-desc">Bauteil Details</span>
        <div class="input-grid">
            <div class="field full"><label>Benennung</label><input type="text" id="pName" value="Gehäuse"></div>
            <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="pNum" value="234446"></div>
        </div>
    </section>

    <!-- T-02 -->
    <section class="card">
        <span class="tool-nr">T-02</span>
        <span class="tool-desc">Parameter</span>
        <div class="input-grid">
            <div class="field full"><label>Menge (Stk)</label><input type="number" id="stk" value="290" oninput="calc()"></div>
            <div class="field"><label>ALT Min</label><input type="number" id="am" value="5" oninput="calc()"></div>
            <div class="field"><label>ALT Sek</label><input type="number" id="as" value="30" oninput="calc()"></div>
            <div class="field"><label>NEU Min</label><input type="number" id="nm" value="4" oninput="calc()"></div>
            <div class="field"><label>NEU Sek</label><input type="number" id="ns" value="15" oninput="calc()"></div>
            <div class="field"><label>Abends (Stk)</label><input type="number" id="abend" value="30" oninput="calc()"></div>
            <div class="field"><label>Schicht (h)</label><input type="number" id="sh" value="7.5" oninput="calc()"></div>
        </div>
    </section>

    <div class="money-banner">
        <small>Ersparnis Gesamt</small>
        <div id="res-money">0,00 €</div>
        <div id="res-min" style="font-size:16px; margin-top:10px; font-weight:700;">0 MIN</div>
    </div>

    <!-- T-03 -->
    <section class="card">
        <span class="tool-nr">T-03</span>
        <span class="tool-desc">Kapazitätsanalyse</span>
        <table class="res-table">
            <thead>
                <tr><th>WERT</th><th>ALT</th><th>NEU</th></tr>
            </thead>
            <tbody>
                <tr><td>Kapazität / Tag</td><td id="c-day-a" class="val-alt">-</td><td id="c-day-n" class="val-neu">-</td></tr>
                <tr><td>Zeitbedarf (Tage)</td><td id="c-time-a" class="val-alt">-</td><td id="c-time-n" class="val-neu">-</td></tr>
                <tr><td>Gesamtminuten</td><td id="c-min-a" class="val-alt">-</td><td id="c-min-n" class="val-neu">-</td></tr>
            </tbody>
        </table>
        <div class="field full" style="margin-top:20px;">
            <label>Maschinensatz (€/h)</label>
            <input type="number" id="rate" value="85" oninput="calc()">
        </div>
    </section>
</div>

<div class="footer-nav">
    <button class="btn btn-outline" onclick="exportData()">JSON Export</button>
    <button class="btn btn-black" onclick="generatePDF()">PDF Bericht</button>
</div>

<script>
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const abend = parseFloat(document.getElementById('abend').value) || 0;
        const shH = parseFloat(document.getElementById('sh').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const shSec = shH * 3600;

        const tA = (parseFloat(document.getElementById('am').value)*60) + (parseFloat(document.getElementById('as').value)||0);
        const tN = (parseFloat(document.getElementById('nm').value)*60) + (parseFloat(document.getElementById('ns').value)||0);

        if (tA <= 0 || tN <= 0) return;

        const capA = (shSec / tA) + abend;
        const capN = (shSec / tN) + abend;
        const daysA = stk / capA;
        const daysN = stk / capN;
        const minA = (stk * tA) / 60;
        const minN = (stk * tN) / 60;
        const diffMin = minA - minN;
        const diffEur = (diffMin / 60) * rate;

        // UI
        document.getElementById('res-money').innerText = diffEur.toLocaleString('de-DE', {style:'currency', currency:'EUR'});
        document.getElementById('res-min').innerText = Math.round(diffMin) + " MIN ERSPARNIS";
        
        document.getElementById('c-day-a').innerText = capA.toFixed(1);
        document.getElementById('c-day-n').innerText = capN.toFixed(1);
        document.getElementById('c-time-a').innerText = daysA.toFixed(1);
        document.getElementById('c-time-n').innerText = daysN.toFixed(1);
        document.getElementById('c-min-a').innerText = Math.round(minA);
        document.getElementById('c-min-n').innerText = Math.round(minN);

        window.calcData = { stk, tA, tN, abend, shH, rate, capA, capN, daysA, daysN, minA, minN, diffMin, diffEur };
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const d = window.calcData;
        const pName = document.getElementById('pName').value;
        const pNum = document.getElementById('pNum').value;

        // Header
        doc.setLineWidth(1.2);
        doc.line(15, 20, 195, 20);
        doc.setFont("helvetica", "bold");
        doc.setFontSize(22);
        doc.text("PRODUKTIONS-BERICHT", 105, 15, {align:'center'});

        doc.setFontSize(10);
        doc.setFont("helvetica", "normal");
        doc.text(`NR: ${pNum} | ${pName}`, 15, 28);
        doc.text(`DATUM: ${new Date().toLocaleDateString('de-DE')}`, 15, 33);

        // Таблица (AutoTable для структуры)
        doc.autoTable({
            startY: 40,
            head: [['KAPAZITÄTSANALYSE', 'ALT-ZUSTAND', 'NEU-ZUSTAND']],
            body: [
                ['Kapazität pro Tag (Stk)', d.capA.toFixed(1), d.capN.toFixed(1)],
                ['Zeitbedarf (Arbeitstage)', d.daysA.toFixed(1), d.daysN.toFixed(1)],
                ['Gesamtminuten (min)', Math.round(d.minA), Math.round(d.minN)],
                ['Kosten bei ' + d.rate + '€/h', (d.minA/60*d.rate).toFixed(2)+' €', (d.minN/60*d.rate).toFixed(2)+' €']
            ],
            theme: 'grid',
            headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontStyle: 'bold' },
            styles: { fontSize: 10, cellPadding: 5 }
        });

        const finalY = doc.lastAutoTable.finalY + 20;

        doc.setFontSize(18);
        doc.setFont("helvetica", "bold");
        doc.text(`FINANZIELLE ERSPARNIS: ${d.diffEur.toFixed(2)} €`, 15, finalY);
        doc.text(`ZEIT-ERSPARNIS: ${Math.round(d.diffMin)} MIN`, 15, finalY + 10);

        // Footer
        doc.setLineWidth(0.8);
        doc.line(15, 280, 195, 280);
        doc.setFontSize(8);
        doc.text("CNC OPTIMIZER PREMIUM v3.3", 105, 285, {align:'center'});

        doc.save(`Report_${pNum}.pdf`);
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(window.calcData));
        const downloadAnchorNode = document.createElement('a');
        downloadAnchorNode.setAttribute("href", dataStr);
        downloadAnchorNode.setAttribute("download", "efficiency_data.json");
        document.body.appendChild(downloadAnchorNode);
        downloadAnchorNode.click();
        downloadAnchorNode.remove();
    }

    calc();
</script>
</body>
</html>
