<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efficiency Pro v3.5</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f4f4f7; --surface: #ffffff; --accent: #000000;
            --text-main: #1c1c1e; --text-sec: #636366; --border: #000000;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text-main); }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 180px; }
        
        header { margin-bottom: 25px; border-bottom: 4px solid var(--accent); padding-bottom: 10px; text-align: center; }
        header h1 { font-size: 22px; font-weight: 900; margin: 0; text-transform: uppercase; }

        .card { 
            background: var(--surface); border: 2px solid var(--accent); 
            padding: 20px; margin-bottom: 20px;
        }

        .tool-nr { font-size: 10px; color: var(--text-sec); text-transform: uppercase; display: block; }
        .tool-desc { font-size: 16px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; display: block; border-bottom: 1px solid #eee; padding-bottom: 5px; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 10px; font-weight: 700; margin-bottom: 5px; color: var(--text-sec); text-transform: uppercase; }
        input { 
            width: 100%; padding: 12px; border: 1.5px solid #d1d1d6; 
            font-size: 16px; font-weight: 700; background: #fff; outline: none; border-radius: 0;
        }

        /* ТАБЛИЦА СРАВНЕНИЯ */
        .comparison-table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        .comparison-table th { background: var(--accent); color: white; font-size: 10px; padding: 10px; text-align: left; text-transform: uppercase; }
        .comparison-table td { padding: 12px 10px; font-size: 14px; font-weight: 700; border-bottom: 1px solid #eee; }
        .col-label { color: var(--text-sec); font-size: 11px; text-transform: uppercase; }

        .money-banner { background: var(--accent); color: white; padding: 25px; margin-bottom: 20px; text-align: center; }
        .money-banner span { display: block; font-size: 32px; font-weight: 900; }
        .money-banner small { font-size: 12px; font-weight: 600; opacity: 0.8; text-transform: uppercase; }

        .cap-detail { font-size: 13px; line-height: 1.6; margin-top: 15px; }
        .cap-detail b { display: block; font-size: 12px; margin-bottom: 4px; text-transform: uppercase; }

        .footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: white; border-top: 4px solid var(--accent); 
            display: flex; padding: 25px 20px; gap: 15px; z-index: 1000;
        }
        .btn { flex: 1; height: 60px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .btn-black { background: var(--accent); color: white; }
        .btn-outline { background: white; border: 2px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Produktions-Bericht</h1></header>

    <!-- T-01 -->
    <section class="card">
        <span class="tool-nr">T-01</span><span class="tool-desc">Bauteil Information</span>
        <div class="input-grid">
            <div class="field full"><label>Benennung</label><input type="text" id="pName" value="Gehäuse"></div>
            <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="pNum" value="234446"></div>
        </div>
    </section>

    <!-- T-02 -->
    <section class="card">
        <span class="tool-nr">T-02</span><span class="tool-desc">Produktionsdaten</span>
        <div class="input-grid">
            <div class="field full"><label>Menge (Stk)</label><input type="number" id="stk" value="290" oninput="calc()"></div>
            <div class="field"><label>ALT (Min)</label><input type="number" id="am" value="5" oninput="calc()"></div>
            <div class="field"><label>ALT (Sek)</label><input type="number" id="as" value="30" oninput="calc()"></div>
            <div class="field"><label>NEU (Min)</label><input type="number" id="nm" value="4" oninput="calc()"></div>
            <div class="field"><label>NEU (Sek)</label><input type="number" id="ns" value="15" oninput="calc()"></div>
            <div class="field"><label>Abend (Stk)</label><input type="number" id="abend" value="30" oninput="calc()"></div>
            <div class="field"><label>Schicht (h)</label><input type="number" id="sh" value="7.5" oninput="calc()"></div>
            <div class="field full"><label>Maschinensatz (€/h)</label><input type="number" id="rate" value="85" oninput="calc()"></div>
        </div>
    </section>

    <div class="money-banner">
        <small>Ersparnis Gesamt</small>
        <span id="save-min">0 MIN</span>
        <div id="save-eur" style="font-size:18px; margin-top:5px;">0,00 €</div>
    </div>

    <!-- T-03: ТАБЛИЦА + АНАЛИЗ -->
    <section class="card">
        <span class="tool-nr">T-03</span><span class="tool-desc">Kapazitätsanalyse</span>
        <table class="comparison-table">
            <thead>
                <tr><th>Werte</th><th>Ist (Alt)</th><th>Ziel (Neu)</th></tr>
            </thead>
            <tbody>
                <tr><td class="col-label">Stk / Tag</td><td id="t-cap-a">-</td><td id="t-cap-n">-</td></tr>
                <tr><td class="col-label">Arbeitstage</td><td id="t-days-a">-</td><td id="t-days-n">-</td></tr>
            </tbody>
        </table>
        
        <div class="cap-detail" id="view-alt"></div>
        <div style="border-top: 2px solid var(--accent); margin: 15px 0;"></div>
        <div class="cap-detail" id="view-neu"></div>
    </section>
</div>

<div class="footer-nav">
    <button class="btn btn-outline" onclick="alert('Daten gesichert')">Speichern</button>
    <button class="btn btn-black" onclick="generatePDF()">PDF Bericht</button>
</div>

<script>
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const abend = parseFloat(document.getElementById('abend').value) || 0;
        const shH = parseFloat(document.getElementById('sh').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;
        const shSec = shH * 3600;

        const tA = (parseFloat(document.getElementById('am').value)*60) + (parseFloat(document.getElementById('as').value)||0);
        const tN = (parseFloat(document.getElementById('nm').value)*60) + (parseFloat(document.getElementById('ns').value)||0);

        if (tA <= 0 || tN <= 0) return;

        const capA = (shSec / tA) + abend;
        const capN = (shSec / tN) + abend;
        const daysA = stk / capA;
        const daysN = stk / capN;
        const minA = (stk * tA) / 60;
        const minN = (stk * tN) / 60;
        const diff = minA - minN;

        document.getElementById('save-min').innerText = Math.round(diff) + " MIN";
        document.getElementById('save-eur').innerText = ((diff/60)*rate).toLocaleString('de-DE', {style:'currency', currency:'EUR'});

        // Таблица
        document.getElementById('t-cap-a').innerText = capA.toFixed(1);
        document.getElementById('t-cap-n').innerText = capN.toFixed(1);
        document.getElementById('t-days-a').innerText = daysA.toFixed(1);
        document.getElementById('t-days-n').innerText = daysN.toFixed(1);

        // Блоки текста
        const buildText = (t, c, d, m) => `<b>${t}</b>- Kapazität pro Tag: ${c.toFixed(1)} Stück<br>- Zeitbedarf: ${d.toFixed(1)} Arbeitstage<br>- Gesamtminuten: ${Math.round(m)} min`;
        document.getElementById('view-alt').innerHTML = buildText("KAPAZITÄTSANALYSE (ALT):", capA, daysA, minA);
        document.getElementById('view-neu').innerHTML = buildText("KAPAZITÄTSANALYSE (NEU / ERSPARNIS):", capN, daysN, minN);

        window.calcRes = { stk, tA, tN, abend, rate, capA, capN, daysA, daysN, minA, minN, diff };
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const d = window.calcRes;

        doc.setLineWidth(1.2);
        doc.line(15, 22, 195, 22);
        doc.setFont("helvetica", "bold"); doc.setFontSize(22);
        doc.text("PRODUKTIONS-BERICHT", 105, 18, {align:'center'});

        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text(`NR: ${document.getElementById('pNum').value} | ${document.getElementById('pName').value}`, 15, 30);
        doc.text(`DATUM: ${new Date().toLocaleDateString('de-DE')}`, 15, 35);

        // ТАБЛИЦА В PDF
        doc.autoTable({
            startY: 42,
            head: [['PARAMETER', 'ALT-ZUSTAND', 'NEU-ZUSTAND']],
            body: [
                ['Kapazität pro Tag (Stk)', d.capA.toFixed(1), d.capN.toFixed(1)],
                ['Zeitbedarf (Arbeitstage)', d.daysA.toFixed(1), d.daysN.toFixed(1)],
                ['Gesamtminuten (min)', Math.round(d.minA), Math.round(d.minN)]
            ],
            theme: 'grid',
            headStyles: { fillColor: [0, 0, 0] }
        });

        let y = doc.lastAutoTable.finalY + 15;

        // БЛОКИ АНАЛИЗА
        const addBlock = (title, cap, days, min, curY) => {
            doc.setFont("helvetica", "bold"); doc.setFontSize(11);
            doc.text(title, 15, curY);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10);
            doc.text(`- Kapazität pro Tag: ${cap.toFixed(1)} Stück`, 20, curY+7);
            doc.text(`- Zeitbedarf: ${days.toFixed(1)} Arbeitstage`, 20, curY+13);
            doc.text(`- Gesamtminuten: ${Math.round(min)} min`, 20, curY+19);
            return curY + 28;
        };

        y = addBlock("KAPAZITÄTSANALYSE (ALT):", d.capA, d.daysA, d.minA, y);
        y = addBlock("KAPAZITÄTSANALYSE (NEU / ERSPARNIS):", d.capN, d.daysN, d.minN, y);

        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text(`FINANZIELLE ERSPARNIS: ${((d.diff/60)*d.rate).toFixed(2)} €`, 15, y + 5);
        doc.text(`ZEIT-ERSPARNIS: ${Math.round(d.diff)} MIN`, 15, y + 14);

        doc.setLineWidth(1.2);
        doc.line(15, 280, 195, 280);
        doc.setFontSize(8); doc.text("CNC PRODUCTION OPTIMIZER I v3.5 PREMIUM", 105, 286, {align:'center'});
        
        doc.save(`Report_${document.getElementById('pNum').value}.pdf`);
    }

    calc();
</script>
</body>
</html>
