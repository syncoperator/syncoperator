<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Efficiency Pro v3.2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f2f2f7; --surface: #ffffff; --accent: #000000;
            --text-main: #1c1c1e; --text-sec: #8e8e93; --border: #d1d1d6;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: var(--bg); font-family: -apple-system, sans-serif; color: var(--text-main); }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; padding-bottom: 140px; }
        
        header { margin-bottom: 25px; border-left: 5px solid var(--accent); padding-left: 15px; }
        header h1 { font-size: 22px; font-weight: 900; margin: 0; text-transform: uppercase; }

        .card { 
            background: var(--surface); border: 2px solid var(--accent); 
            padding: 20px; margin-bottom: 15px;
        }

        .tool-nr { font-size: 10px; color: var(--text-sec); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .tool-desc { font-size: 14px; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; display: block; }

        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }
        
        label { display: block; font-size: 11px; font-weight: 700; margin-bottom: 5px; color: var(--text-sec); }
        input { 
            width: 100%; padding: 12px; border: 1px solid var(--border); 
            font-size: 16px; font-weight: 700; background: #fff; outline: none;
        }

        .analysis-box { background: var(--accent); color: white; padding: 20px; margin-bottom: 15px; }
        .analysis-box span { display: block; font-size: 24px; font-weight: 900; }

        .cap-info { font-size: 13px; line-height: 1.6; margin-top: 10px; border-top: 1px solid #eee; padding-top: 10px; }
        .cap-info b { display: block; text-transform: uppercase; font-size: 11px; color: var(--text-sec); margin-bottom: 5px; }

        .footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 100px; 
            background: rgba(255,255,255,0.95); border-top: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 20px; gap: 10px; z-index: 1000;
        }
        .btn { flex: 1; height: 55px; border: none; font-weight: 900; text-transform: uppercase; cursor: pointer; }
        .btn-black { background: var(--accent); color: white; }
        .btn-outline { background: white; border: 2px solid var(--accent); color: var(--accent); }
    </style>
</head>
<body>

<div class="container">
    <header><h1>Efficiency Pro</h1><small>v3.2 Full Analytics</small></header>

    <section class="card">
        <span class="tool-nr">T-01</span><span class="tool-desc">Bauteil Information</span>
        <div class="input-grid">
            <div class="field full"><label>Benennung</label><input type="text" id="pName" value="Gehäuse"></div>
            <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="pNum" value="234446"></div>
        </div>
    </section>

    <section class="card">
        <span class="tool-nr">T-02</span><span class="tool-desc">Produktionsdaten & Kosten</span>
        <div class="input-grid">
            <div class="field full"><label>Menge (Stk)</label><input type="number" id="stk" value="290" oninput="calc()"></div>
            <div class="field"><label>ALT (Min)</label><input type="number" id="am" value="5" oninput="calc()"></div>
            <div class="field"><label>ALT (Sek)</label><input type="number" id="as" value="30" oninput="calc()"></div>
            <div class="field"><label>NEU (Min)</label><input type="number" id="nm" value="4" oninput="calc()"></div>
            <div class="field"><label>NEU (Sek)</label><input type="number" id="ns" value="15" oninput="calc()"></div>
            <div class="field"><label>Abend (Stk)</label><input type="number" id="abend" value="30" oninput="calc()"></div>
            <div class="field"><label>Schicht (h)</label><input type="number" id="sh" value="7.5" oninput="calc()"></div>
            <div class="field full"><label>Maschinensatz (€/h)</label><input type="number" id="rate" value="85" oninput="calc()"></div>
        </div>
    </section>

    <div class="analysis-box">
        <label style="color:rgba(255,255,255,0.6)">ERSPARNIS</label>
        <span id="save-min">0 MIN</span>
        <small id="save-eur">0,00 €</small>
    </div>

    <section class="card">
        <span class="tool-nr">T-03</span><span class="tool-desc">Kapazitätsanalyse</span>
        <div class="cap-info" id="view-alt"></div>
        <div class="cap-info" id="view-neu" style="margin-top:20px; border-top: 2px solid var(--accent);"></div>
    </section>
</div>

<div class="footer-nav">
    <button class="btn btn-outline" onclick="alert('Gespeichert')">Speichern</button>
    <button class="btn btn-black" onclick="generatePDF()">PDF Bericht</button>
</div>

<script>
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const abend = parseFloat(document.getElementById('abend').value) || 0;
        const shH = parseFloat(document.getElementById('sh').value) || 0;
        const rate = parseFloat(document.getElementById('rate').value) || 0;

        const tA = (parseFloat(document.getElementById('am').value)*60) + (parseFloat(document.getElementById('as').value)||0);
        const tN = (parseFloat(document.getElementById('nm').value)*60) + (parseFloat(document.getElementById('ns').value)||0);

        if (tA <= 0 || tN <= 0) return;

        const capDayA = (shH * 3600 / tA) + abend;
        const capDayN = (shH * 3600 / tN) + abend;
        
        const daysA = stk / capDayA;
        const daysN = stk / capDayN;

        const totalMinA = (stk * tA) / 60;
        const totalMinN = (stk * tN) / 60;
        const minDiff = totalMinA - totalMinN;
        const eurSaved = (minDiff / 60) * rate;

        // Update UI
        document.getElementById('save-min').innerText = Math.round(minDiff) + " MIN";
        document.getElementById('save-eur').innerText = eurSaved.toLocaleString('de-DE', {style:'currency', currency:'EUR'});

        const buildInfo = (title, cap, days, min) => `
            <b>${title}</b>
            • Kapazität pro Tag: ${cap.toFixed(1)} Stück<br>
            • Zeitbedarf: ${days.toFixed(1)} Arbeitstage<br>
            • Gesamtminuten: ${Math.round(min)} min
        `;

        document.getElementById('view-alt').innerHTML = buildInfo("KAPAZITÄTSANALYSE (ALT):", capDayA, daysA, totalMinA);
        document.getElementById('view-neu').innerHTML = buildInfo("KAPAZITÄTSANALYSE (NEU / ERSPARNIS):", capDayN, daysN, totalMinN);

        window.latest = { stk, tA, tN, abend, shH, rate, capDayA, capDayN, daysA, daysN, totalMinA, totalMinN, minDiff, eurSaved };
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const d = window.latest;

        doc.setLineWidth(1.0); doc.line(15, 25, 195, 25);
        doc.setFont("helvetica", "bold"); doc.setFontSize(22);
        doc.text("PRODUKTIONS-ANALYSE", 105, 20, {align:'center'});

        doc.setFontSize(10); doc.setFont("helvetica", "normal");
        doc.text(`BAUTEIL: ${document.getElementById('pName').value} | NR: ${document.getElementById('pNum').value}`, 15, 35);

        const buildSection = (title, cap, days, min, y) => {
            doc.setFont("helvetica", "bold"); doc.setFontSize(12);
            doc.text(title, 15, y);
            doc.setFont("helvetica", "normal"); doc.setFontSize(10);
            doc.text(`- Kapazität pro Tag: ${cap.toFixed(1)} Stück`, 20, y+7);
            doc.text(`- Zeitbedarf: ${days.toFixed(1)} Arbeitstage`, 20, y+13);
            doc.text(`- Gesamtminuten: ${Math.round(min)} min`, 20, y+19);
            return y + 30;
        };

        let currentY = 50;
        currentY = buildSection("KAPAZITÄTSANALYSE (ALT):", d.capDayA, d.daysA, d.totalMinA, currentY);
        currentY = buildSection("KAPAZITÄTSANALYSE (NEU / ERSPARNIS):", d.capDayN, d.daysN, d.totalMinN, currentY);

        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text(`ERSPARNIS: ${Math.round(d.minDiff)} MIN / ${d.eurSaved.toFixed(2)} €`, 15, currentY + 10);

        doc.setLineWidth(1.0); doc.line(15, 280, 195, 280);
        doc.setFontSize(8); doc.text("EFFICIENCY PRO v3.2 | PREMIUM LIGHT DESIGN", 105, 287, {align:'center'});
        doc.save(`Report_${document.getElementById('pNum').value}.pdf`);
    }

    calc();
</script>
</body>
</html>
