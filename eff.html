<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Brief → PDF</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#1c1c1c;--bg:#f5f1e8;--red:#b8390e;--dim:#7a6f62;--brd:#2a2a2a}
body{background:var(--bg);color:var(--ink);font-family:Georgia,serif;padding:22px 16px 56px}
.wrap{max-width:540px;margin:0 auto}
h1{font-size:28px;font-weight:400;letter-spacing:-.02em;border-bottom:2px solid var(--brd);padding-bottom:14px;margin-bottom:22px}
h1 i{font-style:italic;color:var(--red)}
.langs{display:flex;gap:6px;margin-bottom:22px}
.langs button{flex:1;padding:11px 4px;border:1.5px solid var(--brd);background:transparent;font-family:Georgia,serif;font-size:13px;cursor:pointer}
.langs button.on{background:var(--ink);color:var(--bg)}
.box{border:1.5px solid var(--brd);padding:16px 14px 4px;margin-bottom:18px;position:relative}
.box-lbl{position:absolute;top:-8px;left:10px;background:var(--bg);padding:0 7px;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em}
.f{margin-bottom:18px}
label{display:block;font:10px/1 monospace;text-transform:uppercase;letter-spacing:.2em;color:var(--dim);margin-bottom:7px}
label s{color:var(--red);text-decoration:none;margin-right:7px;font-weight:700}
input,textarea{width:100%;background:transparent;border:none;border-bottom:1.5px solid var(--brd);padding:7px 0 9px;font-family:Georgia,serif;font-size:16px;color:var(--ink);outline:none;resize:none;border-radius:0;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus{border-bottom-color:var(--red)}
textarea{min-height:160px;line-height:1.55}
.go{width:100%;padding:18px;background:var(--ink);color:var(--bg);border:none;font-family:Georgia,serif;font-size:17px;cursor:pointer;margin-top:24px;-webkit-appearance:none;appearance:none}
.go:before{content:"→ ";color:var(--red)}
.go:disabled{opacity:.5}
#status{margin-top:12px;padding:13px;font:11px/1.4 monospace;text-transform:uppercase;letter-spacing:.1em;text-align:center;display:none}
#status.ok{background:#1a7a3a;color:#fff}
#status.err{background:var(--red);color:#fff}
#status.spin{background:transparent;color:var(--dim);border:1px solid var(--dim)}
</style>
</head>
<body>
<div class="wrap">
<h1 id="ttl">Brief<i>.</i>pdf</h1>
<div class="langs">
  <button id="bDe" class="on" onclick="SL('de')">Deutsch</button>
  <button id="bRu" onclick="SL('ru')">Русский</button>
  <button id="bEn" onclick="SL('en')">English</button>
</div>
<div class="box">
  <div class="box-lbl" id="l_from">Absender</div>
  <div class="f"><label><s>01</s><span id="l_n1">Name</span></label><input id="fromName" autocomplete="off"></div>
  <div class="f"><label><s>02</s><span id="l_a1">Adresse</span></label><textarea id="fromAddr" rows="3"></textarea></div>
</div>
<div class="box">
  <div class="box-lbl" id="l_to">Empfänger</div>
  <div class="f"><label><s>03</s><span id="l_n2">Name</span></label><input id="toName" autocomplete="off"></div>
  <div class="f"><label><s>04</s><span id="l_a2">Adresse</span></label><textarea id="toAddr" rows="3"></textarea></div>
</div>
<div class="f"><label><s>05</s><span id="l_dt">Datum</span></label><input id="date" type="date"></div>
<div class="f"><label><s>06</s><span id="l_sb">Betreff</span></label><input id="subject" autocomplete="off"></div>
<div class="f"><label><s>07</s><span id="l_gr">Anrede</span></label><input id="greeting" autocomplete="off"></div>
<div class="f"><label><s>08</s><span id="l_bd">Brieftext</span></label><textarea id="body" rows="10"></textarea></div>
<div class="f"><label><s>09</s><span id="l_cl">Grußformel</span></label><input id="closing" autocomplete="off"></div>
<button class="go" id="goBtn" onclick="makePDF()">PDF erstellen</button>
<div id="status"></div>
</div>
<canvas id="cv" style="position:fixed;left:-9999px;top:-9999px"></canvas>

let lang=localStorage.getItem("ll")||"de";

function SL(l){
  lang=l; localStorage.setItem("ll",l);
  const t=T[l];
  document.getElementById("ttl").innerHTML=t.ttl.replace(".","<i>.</i>");
  const m={l_from:"from",l_to:"to",l_n1:"name",l_n2:"name",l_a1:"addr",l_a2:"addr",
           l_dt:"date",l_sb:"subj",l_gr:"greet",l_bd:"body",l_cl:"close"};
  for(const [id,k] of Object.entries(m)) document.getElementById(id).textContent=t[k];
  document.getElementById("goBtn").textContent="→ "+t.btn;

SL(lang);
document.getElementById("date").value=new Date().toISOString().slice(0,10);

function setStatus(txt,cls){
  const el=document.getElementById("status");
  el.textContent=txt; el.className=cls; el.style.display=txt?"block":"none";
}
function fmtDate(iso,l){
  if(!iso)return"";
  const[y,m,d]=iso.split("-"),mn=T[l].mo[+m-1];
  if(l==="de")return`${+d}. ${mn} ${y}`;
  if(l==="ru")return`${+d} ${mn} ${y} г.`;
  return`${mn} ${+d}, ${y}`;
}

// Load fonts
let fontsReady=false;
async function loadFonts(){
  if(fontsReady)return;
  function b64buf(b64){
    const s=atob(b64),b=new Uint8Array(s.length);
    for(let i=0;i<s.length;i++)b[i]=s.charCodeAt(i);
    return b.buffer;
  }
  const fR=new FontFace("LR",b64buf(FONT_REG_B64));
  const fB=new FontFace("LB",b64buf(FONT_BOLD_B64));
  const[r,b]=await Promise.all([fR.load(),fB.load()]);
  document.fonts.add(r); document.fonts.add(b);
  await document.fonts.ready;
  // warm-up: draw with font to ensure it's in canvas glyph cache
  const cv=document.getElementById("cv");
  cv.width=200;cv.height=50;
  const ctx=cv.getContext("2d");
  ctx.font="20px LR"; ctx.fillText("Ag",0,30);
  ctx.font="20px LB"; ctx.fillText("Ag",50,30);
  await new Promise(r=>setTimeout(r,150));
  fontsReady=true;
}

async function makePDF(){
  const btn=document.getElementById("goBtn");
  btn.disabled=true;
  setStatus(T[lang].spin,"spin");
  try{
    await loadFonts();
    const pdfBytes=await buildPDF();
    openPDF(pdfBytes);
    setStatus(T[lang].ok,"ok");
  }catch(e){
    console.error(e);
    setStatus(T[lang].err+": "+e.message,"err");
  }finally{
    btn.disabled=false;
  }
}

// Open PDF in new tab (works on iOS Safari - user can then Share > Save to Files)
function openPDF(bytes){
  const blob=new Blob([bytes],{type:"application/pdf"});
  const url=URL.createObjectURL(blob);
  // iOS Safari: window.open in click handler works
  window.open(url,"_blank");
  // Also offer direct link as fallback
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

async function buildPDF(){
  const t=T[lang];
  const g=id=>document.getElementById(id).value.trim();
  const fromName=g("fromName"),fromAddr=g("fromAddr");
  const toName=g("toName"),toAddr=g("toAddr");
  const date=fmtDate(g("date"),lang);
  const subject=g("subject"),greeting=g("greeting");
  const body=g("body"),closing=g("closing");

  // Render at 2× for quality, A4 proportions
  const SC=2, PW=595, PH=842;
  const CW=PW*SC, CH=PH*SC;
  const MX=72*SC, MY=60*SC;
  const maxW=CW-MX*2;

  const cv=document.getElementById("cv");
  cv.width=CW; cv.height=CH;
  const ctx=cv.getContext("2d");

  function setF(bold,pt){ ctx.font=`${pt*SC}px ${bold?"LB":"LR"}`; }
  function measure(text,bold,pt){ setF(bold,pt); return ctx.measureText(text).width; }
  function wrapText(text,bold,pt){
    setF(bold,pt);
    const words=text.split(" "),out=[];
    let line="";
    for(const w of words){
      const t2=line?line+" "+w:w;
      if(ctx.measureText(t2).width<=maxW)line=t2;
      else{if(line)out.push(line);line=w;}
    }
    if(line)out.push(line);
    return out.length?out:[""];
  }

  // Build draw list
  const items=[];
  const txt=(text,bold,pt,align)=>items.push({text,bold,pt,align:align||"left"});
  const gap=pt=>items.push({gap:pt*SC});

  if(fromName||fromAddr){
    [fromName,...fromAddr.split("\n")].filter(Boolean).forEach(l=>txt(l,false,10,"right"));
    gap(8);
  }
  if(toName||toAddr){
    [toName,...toAddr.split("\n")].filter(Boolean).forEach(l=>txt(l,false,11));
    gap(8);
  }
  if(date){txt(date,false,11,"right");gap(12);}
  if(subject){
    wrapText(t.sbpfx+subject,true,12).forEach(l=>txt(l,true,12));
    gap(6);
  }
  if(greeting){txt(greeting,false,12);gap(5);}
  if(body){
    for(const para of body.split("\n")){
      if(!para.trim()){gap(6);continue;}
      wrapText(para,false,12).forEach(l=>txt(l,false,12));
    }
    gap(10);
  }
  if(closing)txt(closing,false,12);
  if(fromName)txt(fromName,false,12);

  // Paginate
  const LH=pt=>pt*SC*1.6;
  const maxY=CH-MY;
  const pages=[];
  let cur=[],cy=MY;
  for(const item of items){
    if(item.gap!==undefined){cur.push(item);cy+=item.gap;continue;}
    const lh=LH(item.pt);
    if(cy+lh>maxY&&cur.length){pages.push(cur);cur=[];cy=MY;}
    cur.push({...item,y:cy+lh*0.78});
    cy+=lh;
  }
  if(cur.length||!pages.length)pages.push(cur);

  // Render pages → JPEG blobs
  const jpegs=[];
  for(const page of pages){
    ctx.clearRect(0,0,CW,CH);
    ctx.fillStyle="#ffffff";
    ctx.fillRect(0,0,CW,CH);
    ctx.fillStyle="#1c1c1c";
    let cy2=MY;
    for(const item of page){
      if(item.gap!==undefined){cy2+=item.gap;continue;}
      setF(item.bold,item.pt);
      const baseline=cy2+LH(item.pt)*0.78;
      cy2+=LH(item.pt);
      if(item.align==="right"){
        const w=ctx.measureText(item.text).width;
        ctx.fillText(item.text,CW-MX-w,baseline);
      }else{
        ctx.fillText(item.text,MX,baseline);
      }
    }
    // Get JPEG - toDataURL always works on iOS even with custom fonts
    const dataURL=cv.toDataURL("image/jpeg",0.92);
    const b64=dataURL.split(",")[1];
    const bin=atob(b64);
    const arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
    jpegs.push(arr);
  }

  // Build PDF binary
  const enc=new TextEncoder();
  const parts=[]; let pos=0;
  const xr={};
  const wr=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);pos+=b.length;};
  const wl=s=>wr(s+"\n");
  const obj=(n,f)=>{xr[n]=pos;wl(`${n} 0 obj`);f();wl("endobj");};

  wl("%PDF-1.4");
  wr(new Uint8Array([37,226,227,207,211,10]));

  obj(1,()=>wl("<< /Type /Catalog /Pages 2 0 R >>"));
  const np=jpegs.length;
  obj(2,()=>{
    const kids=Array.from({length:np},(_,i)=>`${3+i*2} 0 R`).join(" ");
    wl(`<< /Type /Pages /Kids [${kids}] /Count ${np} >>`);
  });

  for(let i=0;i<np;i++){
    const pgN=3+i*2, imN=4+i*2, img=jpegs[i];
    const cs=enc.encode(`q ${PW} 0 0 ${PH} 0 0 cm /Im${i} Do Q`);
    obj(pgN,()=>{
      wl(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}]`);
      wl(`   /Contents << /Length ${cs.length} >>`);
      wl(`   /Resources << /XObject << /Im${i} ${imN} 0 R >> >> >>`);
      wl("stream"); wr(cs); wl("\nendstream");
    });
    obj(imN,()=>{
      wl(`<< /Type /XObject /Subtype /Image /Width ${CW} /Height ${CH}`);
      wl("   /ColorSpace /DeviceRGB /BitsPerComponent 8");
      wl(`   /Filter /DCTDecode /Length ${img.length} >>`);
      wl("stream"); wr(img); wl("\nendstream");
    });
  }

  const xp=pos;
  const maxN=2+np*2;
  wl("xref"); wl(`0 ${maxN+1}`);
  wl("0000000000 65535 f ");
  for(let i=1;i<=maxN;i++){
    const o=xr[i];
    wl(o!=null?String(o).padStart(10,"0")+" 00000 n ":"0000000000 65535 f ");
  }
  wl("trailer"); wl(`<< /Size ${maxN+1} /Root 1 0 R >>`);
  wl("startxref"); wl(String(xp)); wr("%%EOF");

  const tot=parts.reduce((s,p)=>s+p.length,0);
  const out=new Uint8Array(tot); let off=0;
  for(const p of parts){out.set(p,off);off+=p.length;}
  return out;
}
</script>
