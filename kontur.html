<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Pro CNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #020617; color: white; height: 100vh; display: flex; flex-col; overflow: hidden; }
        .siemens-blue { background: #004b73; border-bottom: 2px solid #00f2ff; }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 25px 25px; }
        .modal-active { display: flex !important; }
        .hide-g0 .line-g0 { display: none; }
        input { font-size: 16px !important; background: #0f172a !important; color: #22d3ee !important; border: 1px solid #334155 !important; padding: 10px; border-radius: 6px; width: 100%; }
        .btn-tab { flex: 1; padding: 12px; font-size: 11px; font-weight: bold; border-bottom: 3px solid transparent; color: #64748b; }
        .btn-tab.active { border-color: #00f2ff; color: #00f2ff; background: #0f172a; }
    </style>
</head>
<body class="flex flex-col">

    <header class="siemens-blue p-3 shrink-0 flex justify-between items-center shadow-lg">
        <span class="font-black italic text-xs tracking-widest">NAKAMURA <span class="text-cyan-300">PRO</span></span>
        <div class="flex gap-2">
             <button onclick="toggleG0()" id="g0-toggle" class="bg-slate-800 text-[10px] px-2 py-1 rounded border border-white/20 uppercase">G0: Виден</button>
             <button onclick="showPaste()" class="bg-cyan-500 text-[10px] px-3 py-1 rounded font-bold uppercase shadow-inner">Импорт</button>
        </div>
    </header>

    <div class="flex bg-slate-950 shrink-0 shadow-md">
        <button id="tab-draw-btn" onclick="setTab('draw')" class="btn-tab active">СИМУЛЯТОР</button>
        <button id="tab-edit-btn" onclick="setTab('edit')" class="btn-tab">РЕДАКТОР</button>
    </div>

    <main class="flex-1 relative overflow-hidden">
        
        <div id="tab-draw" class="absolute inset-0 canvas-bg flex flex-col">
            <div class="absolute top-4 right-4 z-10 text-right">
                <div class="text-[10px] text-slate-500 font-bold uppercase">Position</div>
                <div class="text-cyan-400 font-mono text-lg">X<span id="dx">0.00</span></div>
                <div class="text-cyan-400 font-mono text-lg">Z<span id="dz">0.00</span></div>
            </div>
            
            <svg id="canvas" class="w-full h-full touch-none">
                <g id="viewport" transform="translate(250, 200)">
                    <line x1="-1000" y1="0" x2="500" y2="0" stroke="#1e293b" stroke-width="1" />
                    <line x1="0" y1="-500" x2="0" y2="500" stroke="#1e293b" stroke-width="1" />
                    <g id="draw-layer"></g>
                    <circle id="pointer" r="4" fill="#ff0055" style="display:none" />
                </g>
            </svg>
        </div>

        <div id="tab-edit" class="absolute inset-0 bg-slate-900 hidden overflow-y-auto p-3 pb-24">
            <div id="list-container" class="space-y-2"></div>
        </div>
    </main>

    <footer class="bg-slate-950 p-2 border-t border-white/5 flex gap-2 shrink-0">
        <button onclick="addStep('G1')" class="flex-1 bg-slate-800 p-3 rounded-xl border-b-4 border-yellow-600 font-bold">G1</button>
        <button onclick="addStep('Angle')" class="flex-1 bg-slate-800 p-3 rounded-xl border-b-4 border-cyan-600 font-bold text-cyan-400">∠ A</button>
        <button onclick="addStep('Radius')" class="flex-1 bg-slate-800 p-3 rounded-xl border-b-4 border-orange-600 font-bold text-orange-400">,R</button>
        <button onclick="clearAll()" class="bg-red-900/40 p-3 px-5 rounded-xl font-bold border-b-4 border-red-700 uppercase text-[10px]">Del</button>
    </footer>

    <div id="modal-edit" class="fixed inset-0 bg-black/90 z-[100] hidden flex-col p-6 animate-in fade-in duration-200">
        <div class="flex justify-between items-center mb-6">
            <h3 class="text-cyan-400 font-bold uppercase tracking-tighter">Свойства перехода</h3>
            <button onclick="closeModal()" class="text-3xl text-slate-500">&times;</button>
        </div>
        <div class="space-y-5">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-slate-500 block mb-1">X (ДИАМЕТР)</label>
                    <input id="mx" type="number" step="0.001">
                </div>
                <div>
                    <label class="text-[10px] text-slate-500 block mb-1">Z (ДЛИНА)</label>
                    <input id="mz" type="number" step="0.001">
                </div>
            </div>
            <div id="angle-box">
                <label class="text-[10px] text-cyan-500 block mb-1 font-bold">УГОЛ ,A (180=←, 225=↙, 135=↖)</label>
                <input id="ma" type="number" step="0.001">
            </div>
            <div>
                <label class="text-[10px] text-orange-500 block mb-1 font-bold">РАДИУС ,R</label>
                <input id="mr" type="number" step="0.001">
            </div>
            <button onclick="saveElement()" class="w-full bg-cyan-600 p-5 rounded-2xl font-black uppercase mt-4 shadow-lg shadow-cyan-900/20">Применить</button>
        </div>
    </div>

    <div id="modal-paste" class="fixed inset-0 bg-black z-[110] hidden flex-col p-4">
        <h3 class="text-center font-bold mb-4">ВСТАВИТЬ G-КОД</h3>
        <textarea id="paste-area" class="flex-1 bg-slate-900 border border-slate-800 p-4 rounded-xl text-green-400 font-mono text-sm outline-none" placeholder="Вставьте код..."></textarea>
        <div class="flex gap-3 py-4">
            <button onclick="closePaste()" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold">ОТМЕНА</button>
            <button onclick="doImport()" class="flex-1 p-4 bg-cyan-600 rounded-xl font-bold uppercase">Импорт</button>
        </div>
    </div>

    <script>
        let contour = [{ x: 0, z: 2, a: null, r: 0, type: 'G0' }];
        let editIdx = -1;
        let showG0 = true;
        let scale = 8;

        function setTab(tab) {
            document.getElementById('tab-draw').classList.toggle('hidden', tab !== 'draw');
            document.getElementById('tab-edit').classList.toggle('hidden', tab !== 'edit');
            document.getElementById('tab-draw-btn').className = `btn-tab ${tab==='draw'?'active':''}`;
            document.getElementById('tab-edit-btn').className = `btn-tab ${tab==='edit'?'active':''}`;
            if(tab === 'draw') redraw();
        }

        function showPaste() { document.getElementById('modal-paste').classList.add('modal-active'); }
        function closePaste() { document.getElementById('modal-paste').classList.remove('modal-active'); }
        function toggleG0() { showG0 = !showG0; document.getElementById('g0-toggle').innerText = `G0: ${showG0?'Виден':'Скрыт'}`; redraw(); }

        function addStep(type) {
            editIdx = -1;
            let last = contour[contour.length-1];
            document.getElementById('mx').value = last.x;
            document.getElementById('mz').value = '';
            document.getElementById('ma').value = '';
            document.getElementById('mr').value = '';
            document.getElementById('modal-edit').classList.add('modal-active');
        }

        function editElement(i) {
            editIdx = i;
            let el = contour[i];
            document.getElementById('mx').value = el.x;
            document.getElementById('mz').value = el.z ?? '';
            document.getElementById('ma').value = el.a ?? '';
            document.getElementById('mr').value = el.r || '';
            document.getElementById('modal-edit').classList.add('modal-active');
        }

        function closeModal() { document.getElementById('modal-edit').classList.remove('modal-active'); }

        function saveElement() {
            let data = {
                x: parseFloat(document.getElementById('mx').value) || 0,
                z: document.getElementById('mz').value === '' ? null : parseFloat(document.getElementById('mz').value),
                a: document.getElementById('ma').value === '' ? null : parseFloat(document.getElementById('ma').value),
                r: parseFloat(document.getElementById('mr').value) || 0,
                type: 'G1'
            };
            if(editIdx === -1) contour.push(data);
            else contour[editIdx] = data;
            closeModal();
            updateAll();
        }

        function updateAll() {
            renderList();
            redraw();
        }

        function renderList() {
            const list = document.getElementById('list-container');
            list.innerHTML = contour.map((el, i) => `
                <div onclick="editElement(${i})" class="bg-slate-800 p-3 rounded-lg border-l-4 ${el.a ? 'border-cyan-500' : 'border-slate-600'} flex justify-between">
                    <div class="text-xs font-mono">
                        <span class="text-slate-500">#${i} ${el.type}</span><br>
                        X${el.x.toFixed(3)} ${el.z!==null?'Z'+el.z.toFixed(3):''} ${el.a?',A'+el.a:''} ${el.r?',R'+el.r:''}
                    </div>
                    <button onclick="event.stopPropagation();contour.splice(${i},1);updateAll()" class="text-red-900 text-lg px-2">✕</button>
                </div>
            `).join('');
        }

        function redraw() {
            const group = document.getElementById('draw-layer');
            group.innerHTML = '';
            let cx = 0, cz = 0;

            contour.forEach((el, i) => {
                let nx = el.x;
                let nz = el.z;

                if (el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;

                if (i > 0) {
                    if (el.type === 'G0' && !showG0) { /* skip */ } 
                    else {
                        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                        line.setAttribute("x1", cz * scale);
                        line.setAttribute("y1", -(cx/2) * scale);
                        line.setAttribute("x2", nz * scale);
                        line.setAttribute("y2", -(nx/2) * scale);
                        line.setAttribute("stroke", el.type === 'G0' ? "#334155" : (el.a ? "#22d3ee" : "#facc15"));
                        line.setAttribute("stroke-width", el.a ? "1.5" : "0.8");
                        group.appendChild(line);
                    }
                }
                cx = nx; cz = nz;
                if(i === contour.length - 1) {
                    let p = document.getElementById('pointer');
                    p.setAttribute('cx', cz * scale); p.setAttribute('cy', -(cx/2) * scale); p.style.display = 'block';
                    document.getElementById('dx').innerText = cx.toFixed(2);
                    document.getElementById('dz').innerText = cz.toFixed(2);
                }
            });
        }

        function doImport() {
            const raw = document.getElementById('paste-area').value.toUpperCase();
            contour = [];
            raw.split('\n').forEach(line => {
                if(!line.includes('X') && !line.includes('Z')) return;
                const xM = line.match(/X(-?\d*\.?\d+)/);
                const zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/);
                const rM = line.match(/,R(-?\d*\.?\d+)/);
                contour.push({
                    x: xM ? parseFloat(xM[1]) : (contour.length?contour[contour.length-1].x:0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closePaste();
            setTab('draw');
            updateAll();
        }

        function clearAll() { if(confirm('Очистить всё?')) { contour = [{ x: 0, z: 0, a: null, r: 0, type: 'G0' }]; updateAll(); } }
        window.onload = updateAll;
    </script>
</body>
</html>
