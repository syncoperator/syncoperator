<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura Pro Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { 
            background-color: #020617; color: white; 
            height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
        }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 20px 20px; }
        .ui-card { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(34, 211, 238, 0.2); backdrop-filter: blur(10px); }
        .btn-main { height: 60px; border-radius: 12px; font-weight: 900; transition: all 0.1s; border-bottom: 4px solid rgba(0,0,0,0.3); }
        .btn-main:active { transform: translateY(2px); border-bottom-width: 1px; }
        input { font-size: 16px !important; background: #020617 !important; color: #22d3ee !important; border: 1px solid #334155 !important; padding: 12px; border-radius: 8px; width: 100%; }
        .tab-active { color: #22d3ee; border-bottom: 3px solid #22d3ee; }
    </style>
</head>
<body class="antialiased">

    <header class="bg-slate-900/80 p-3 shrink-0 flex justify-between items-center border-b border-cyan-900/50">
        <div>
            <div class="text-[10px] font-bold text-cyan-500 tracking-widest uppercase">Nakamura-Tome</div>
            <div class="text-sm font-black italic">PROFESSIONAL <span class="text-cyan-400">V2</span></div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleMirror()" id="mirror-btn" class="bg-amber-600/20 border border-amber-600/50 text-[9px] px-2 py-1 rounded text-amber-500 font-bold uppercase">Зеркало: Выкл</button>
            <button onclick="showModal('m-import')" class="bg-cyan-600 text-[10px] px-3 py-1 rounded font-black uppercase">ИМПОРТ</button>
        </div>
    </header>

    <div class="flex bg-slate-950 shrink-0 border-b border-white/5">
        <button id="tab-sim-btn" onclick="switchTab('sim')" class="flex-1 p-3 text-[11px] font-bold tab-active uppercase">Симуляция</button>
        <button id="tab-list-btn" onclick="switchTab('list')" class="flex-1 p-3 text-[11px] font-bold text-slate-500 uppercase">Список (G-Code)</button>
    </div>

    <main class="flex-1 relative overflow-hidden">
        <div id="view-sim" class="absolute inset-0 canvas-bg">
            <div class="absolute top-4 left-4 z-10 ui-card p-3 rounded-xl space-y-1">
                <div class="text-[9px] text-slate-500 font-bold uppercase">Position</div>
                <div class="font-mono text-cyan-400 leading-none">X: <span id="pos-x" class="text-lg text-white">0.000</span></div>
                <div class="font-mono text-cyan-400 leading-none">Z: <span id="pos-z" class="text-lg text-white">0.000</span></div>
            </div>
            
            <svg id="canvas" class="w-full h-full">
                <g id="viewport" transform="translate(300, 200)">
                    <line x1="-2000" y1="0" x2="500" y2="0" stroke="#1e293b" stroke-width="1" />
                    <g id="g-path"></g>
                    <circle id="marker" r="4" fill="#f43f5e" class="animate-pulse" style="display:none" />
                </g>
            </svg>
        </div>

        <div id="view-list" class="absolute inset-0 bg-slate-950 hidden overflow-y-auto p-4 pb-40">
            <div id="element-list" class="space-y-2"></div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-white/10 p-3 pb-[calc(12px+var(--sab))] shrink-0 grid grid-cols-4 gap-2">
        <button onclick="newStep('G1')" class="btn-main bg-slate-800 border-b-yellow-500 text-white">G1</button>
        <button onclick="newStep('A')" class="btn-main bg-slate-800 border-b-cyan-500 text-cyan-400">∠ A</button>
        <button onclick="newStep('R')" class="btn-main bg-slate-800 border-b-orange-500 text-orange-400">,R</button>
        <button onclick="clearContour()" class="btn-main bg-red-950/40 border-b-red-600 text-red-500">DEL</button>
    </footer>

    <div id="m-edit" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-cyan-400 font-black italic uppercase tracking-widest">Параметры G1</h2>
            <button onclick="closeModal('m-edit')" class="text-4xl text-slate-500">&times;</button>
        </div>
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[10px] text-slate-500 font-bold block mb-2 uppercase">X (Diameter)</label><input id="inp-x" type="number" step="0.001"></div>
                <div><label class="text-[10px] text-slate-500 font-bold block mb-2 uppercase">Z (Length)</label><input id="inp-z" type="number" step="0.001"></div>
            </div>
            <div>
                <label id="angle-label" class="text-[10px] text-cyan-400 font-bold block mb-2 uppercase">УГОЛ ,A (0-360)</label>
                <input id="inp-a" type="number" step="0.01">
            </div>
            <div><label class="text-[10px] text-orange-400 font-bold block mb-2 uppercase">РАДИУС ,R</label><input id="inp-r" type="number" step="0.001"></div>
            <button onclick="saveElement()" class="w-full bg-cyan-600 h-16 rounded-2xl font-black uppercase text-white shadow-xl mt-4">Применить</button>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-black z-[110] hidden flex-col p-4">
        <div class="text-center font-bold text-xs mb-4 text-slate-500 uppercase tracking-widest italic">Вставить код из .O файла</div>
        <textarea id="import-area" class="flex-1 bg-slate-900 border border-slate-800 p-4 rounded-xl text-green-500 font-mono text-xs outline-none" placeholder="Например: G1 X32.3 ,R.9 ..."></textarea>
        <div class="flex gap-3 py-4">
            <button onclick="closeModal('m-import')" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold uppercase text-[10px]">Отмена</button>
            <button onclick="processImport()" class="flex-1 p-4 bg-cyan-600 rounded-xl font-bold uppercase text-[10px]">Загрузить контур</button>
        </div>
    </div>

    <script>
        let contour = [{ x: 37, z: 2, a: null, r: 0, type: 'G0' }];
        let editingIndex = -1;
        let isMirrored = false;
        let zoom = 6.5;

        function switchTab(tab) {
            document.getElementById('view-sim').classList.toggle('hidden', tab !== 'sim');
            document.getElementById('view-list').classList.toggle('hidden', tab !== 'list');
            document.getElementById('tab-sim-btn').className = `flex-1 p-3 text-[11px] font-bold uppercase ${tab==='sim'?'tab-active':'text-slate-500'}`;
            document.getElementById('tab-list-btn').className = `flex-1 p-3 text-[11px] font-bold uppercase ${tab==='list'?'tab-active':'text-slate-500'}`;
            if(tab === 'sim') redraw();
        }

        function toggleMirror() {
            isMirrored = !isMirrored;
            document.getElementById('mirror-btn').innerText = isMirrored ? "Зеркало: Вкл" : "Зеркало: Выкл";
            document.getElementById('mirror-btn').classList.toggle('bg-amber-600/20', !isMirrored);
            document.getElementById('mirror-btn').classList.toggle('bg-cyan-600/20', isMirrored);
            redraw();
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function newStep(type) {
            editingIndex = -1;
            let last = contour[contour.length-1];
            document.getElementById('inp-x').value = last.x;
            document.getElementById('inp-z').value = '';
            document.getElementById('inp-a').value = '';
            document.getElementById('inp-r').value = '';
            showModal('m-edit');
        }

        function editStep(i) {
            editingIndex = i;
            let el = contour[i];
            document.getElementById('inp-x').value = el.x;
            document.getElementById('inp-z').value = el.z ?? '';
            document.getElementById('inp-a').value = el.a ?? '';
            document.getElementById('inp-r').value = el.r || '';
            showModal('m-edit');
        }

        function saveElement() {
            let data = {
                x: parseFloat(document.getElementById('inp-x').value) || 0,
                z: document.getElementById('inp-z').value === '' ? null : parseFloat(document.getElementById('inp-z').value),
                a: document.getElementById('inp-a').value === '' ? null : parseFloat(document.getElementById('inp-a').value),
                r: parseFloat(document.getElementById('inp-r').value) || 0,
                type: 'G1'
            };
            if(editingIndex === -1) contour.push(data); else contour[editingIndex] = data;
            closeModal('m-edit');
            updateUI();
        }

        function updateUI() {
            const list = document.getElementById('element-list');
            list.innerHTML = contour.map((el, i) => `
                <div onclick="editStep(${i})" class="bg-slate-900 p-4 rounded-xl border-l-4 ${el.a!==null?'border-cyan-500':'border-slate-700'} flex justify-between items-center active:bg-slate-800 transition-colors">
                    <div class="text-[11px] font-mono">
                        <span class="text-slate-600">STEP ${i} | ${el.type}</span><br>
                        X<span class="text-white font-bold">${el.x.toFixed(3)}</span>
                        ${el.z!==null ? ` Z<span class="text-white">${el.z.toFixed(3)}</span>` : ''}
                        ${el.a!==null ? ` ,A<span class="text-cyan-400">${el.a}</span>` : ''}
                        ${el.r>0 ? ` ,R<span class="text-orange-400">${el.r}</span>` : ''}
                    </div>
                    <button onclick="event.stopPropagation();contour.splice(${i},1);updateUI();redraw();" class="text-red-900 font-bold px-3">✕</button>
                </div>
            `).join('');
            redraw();
        }

        function redraw() {
            const pathLayer = document.getElementById('g-path');
            pathLayer.innerHTML = '';
            let cx = 0, cz = 0;

            contour.forEach((el, i) => {
                let nx = el.x, nz = el.z;

                if (el.a !== null && nz === null) {
                    // Учет зеркальности для нижнего револьвера
                    let angle = parseFloat(el.a);
                    if (isMirrored) angle = (360 - angle) % 360; 
                    
                    const rad = (angle * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;

                if (i > 0) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", cz * zoom);
                    line.setAttribute("y1", -(cx/2) * zoom);
                    line.setAttribute("x2", nz * zoom);
                    line.setAttribute("y2", -(nx/2) * zoom);
                    line.setAttribute("stroke", el.a !== null ? "#22d3ee" : "#facc15");
                    line.setAttribute("stroke-width", el.a !== null ? "1.2" : "0.7");
                    pathLayer.appendChild(line);
                }
                cx = nx; cz = nz;

                if(i === contour.length - 1) {
                    let m = document.getElementById('marker');
                    m.setAttribute('cx', cz * zoom); m.setAttribute('cy', -(cx/2) * zoom); m.style.display = 'block';
                    document.getElementById('pos-x').innerText = cx.toFixed(3);
                    document.getElementById('pos-z').innerText = cz.toFixed(3);
                }
            });
        }

        function processImport() {
            const text = document.getElementById('import-area').value.toUpperCase();
            contour = [];
            text.split('\n').forEach(line => {
                if(!/X|Z|A/.test(line)) return;
                const xM = line.match(/X(-?\d*\.?\d+)/);
                const zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/);
                const rM = line.match(/,R(-?\d*\.?\d+)/);
                contour.push({
                    x: xM ? parseFloat(xM[1]) : (contour.length ? contour[contour.length-1].x : 0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closeModal('m-import');
            switchTab('sim');
            updateUI();
        }

        function clearContour() { if(confirm('Удалить всё?')) { contour = [{ x: 37, z: 2, a: null, r: 0, type: 'G0' }]; updateUI(); } }

        window.onload = updateUI;
    </script>
</body>
</html>
