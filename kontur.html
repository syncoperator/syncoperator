<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura-Tome CNC Smart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #020617; color: white; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 25px 25px; }
        .input-box { background: #0f172a; border: 1px solid #334155; color: #22d3ee; padding: 12px; border-radius: 8px; font-size: 16px !important; width: 100%; }
        .btn-mode { flex: 1; padding: 10px; font-size: 10px; font-weight: 800; border: 1px solid #334155; transition: 0.2s; }
        .btn-mode.active { background: #0891b2; border-color: #22d3ee; color: white; }
        footer { padding-bottom: calc(10px + var(--sab)); }
    </style>
</head>
<body>

    <header class="bg-slate-900 p-3 flex justify-between items-center border-b border-cyan-500/50">
        <div class="flex flex-col">
            <span class="text-cyan-400 font-black text-xs italic">NAKAMURA SMART</span>
            <span id="turret-label" class="text-[9px] text-slate-500 uppercase font-bold tracking-tighter">Upper Turret (G54)</span>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTurret()" id="turret-btn" class="bg-slate-800 px-3 py-1 rounded text-[10px] font-bold border border-white/10">СМЕНИТЬ РЕВОЛЬВЕР</button>
            <button onclick="showModal('m-import')" class="bg-cyan-600 px-3 py-1 rounded text-[10px] font-bold uppercase">Импорт</button>
        </div>
    </header>

    <div class="flex bg-slate-950 text-[10px] font-bold shrink-0">
        <button id="t-sim" onclick="tab('sim')" class="flex-1 p-3 border-b-2 border-cyan-500 text-cyan-400">ГРАФИКА</button>
        <button id="t-list" onclick="tab('list')" class="flex-1 p-3 border-b-2 border-transparent text-slate-500">КОД</button>
    </div>

    <main class="flex-1 relative overflow-hidden">
        <div id="v-sim" class="absolute inset-0 canvas-bg">
            <div class="absolute top-4 left-4 z-10 bg-black/60 backdrop-blur p-2 rounded border border-white/10 font-mono text-xs">
                <div class="text-cyan-400">X: <span id="dx" class="text-white">0.000</span></div>
                <div class="text-cyan-400">Z: <span id="dz" class="text-white">0.000</span></div>
            </div>
            
            <div class="absolute top-4 right-4 z-10 flex flex-col gap-2">
                <button onclick="autoCenter()" class="bg-slate-800 p-2 rounded border border-white/20 text-[10px]">ЦЕНТР</button>
                <button onclick="zoomIn(1.2)" class="bg-slate-800 p-2 rounded border border-white/20 text-lg">+</button>
                <button onclick="zoomIn(0.8)" class="bg-slate-800 p-2 rounded border border-white/20 text-lg">-</button>
            </div>

            <svg id="svg" class="w-full h-full touch-none">
                <g id="vp" transform="translate(250, 200)">
                    <line x1="-2000" y1="0" x2="500" y2="0" stroke="#1e293b" />
                    <g id="paths"></g>
                    <circle id="tool" r="5" fill="#f43f5e" class="animate-pulse" style="display:none" />
                </g>
            </svg>
        </div>

        <div id="v-list" class="absolute inset-0 bg-slate-950 hidden overflow-y-auto p-4 pb-40">
            <div id="el-container" class="space-y-2"></div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-white/10 p-3 grid grid-cols-4 gap-2 shrink-0">
        <button onclick="openEdit('G1')" class="bg-slate-800 h-14 rounded-xl border-b-4 border-yellow-600 font-bold">G1</button>
        <button onclick="openEdit('A')" class="bg-slate-800 h-14 rounded-xl border-b-4 border-cyan-600 font-bold text-cyan-400 italic">∠ 45°</button>
        <button onclick="openEdit('R')" class="bg-slate-800 h-14 rounded-xl border-b-4 border-orange-600 font-bold text-orange-400">,R</button>
        <button onclick="resetContour()" class="bg-red-900/30 h-14 rounded-xl border-b-4 border-red-700 flex items-center justify-center">✕</button>
    </footer>

    <div id="m-edit" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-cyan-400 font-black italic uppercase">Параметры элемента</h2>
            <button onclick="closeModal('m-edit')" class="text-4xl text-slate-500">&times;</button>
        </div>
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[10px] text-slate-500 uppercase font-bold">X (Диаметр)</label><input id="ix" type="number" step="0.001" class="input-box"></div>
                <div><label class="text-[10px] text-slate-500 uppercase font-bold">Z (Длина)</label><input id="iz" type="number" step="0.001" class="input-box"></div>
            </div>
            
            <div class="p-4 bg-slate-900 rounded-xl border border-cyan-500/20">
                <label class="text-[10px] text-cyan-400 uppercase font-bold mb-3 block">Угол из чертежа (например 45)</label>
                <div class="flex gap-2 mb-4">
                    <button onclick="setDir('up')" id="dir-up" class="btn-mode active">ВВЕРХ ↖</button>
                    <button onclick="setDir('down')" id="dir-down" class="btn-mode">ВНИЗ ↙</button>
                </div>
                <input id="ia" type="number" step="0.1" class="input-box" placeholder="Градусы">
            </div>

            <div><label class="text-[10px] text-orange-400 uppercase font-bold">Радиус ,R</label><input id="ir" type="number" step="0.01" class="input-box"></div>
            
            <button onclick="save()" class="w-full bg-cyan-600 h-16 rounded-2xl font-black uppercase text-lg shadow-xl">OK / SAVE</button>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-black z-[110] hidden flex-col p-4">
        <div class="text-center font-bold text-xs mb-4 text-cyan-400 uppercase">Вставить G-код</div>
        <textarea id="import-text" class="flex-1 bg-slate-900 border border-slate-800 p-4 rounded-xl text-green-500 font-mono text-[11px] outline-none" placeholder="G1 X32.3 ,A225 ..."></textarea>
        <div class="flex gap-3 pt-4">
            <button onclick="closeModal('m-import')" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold uppercase">Назад</button>
            <button onclick="doImport()" class="flex-1 p-4 bg-cyan-600 rounded-xl font-bold uppercase">Загрузить</button>
        </div>
    </div>

    <script>
        let contour = [{ x: 40, z: 2, a: null, r: 0, type: 'G0' }];
        let turret = 'upper'; // or lower
        let direction = 'up';
        let zoom = 5;
        let offsetZ = 300;
        let curEdit = -1;

        function tab(t) {
            document.getElementById('v-sim').classList.toggle('hidden', t !== 'sim');
            document.getElementById('v-list').classList.toggle('hidden', t !== 'list');
            document.getElementById('t-sim').className = `flex-1 p-3 border-b-2 ${t==='sim'?'border-cyan-500 text-cyan-400':'border-transparent text-slate-500'}`;
            document.getElementById('t-list').className = `flex-1 p-3 border-b-2 ${t==='list'?'border-cyan-500 text-cyan-400':'border-transparent text-slate-500'}`;
            if(t==='sim') redraw();
        }

        function toggleTurret() {
            turret = (turret === 'upper') ? 'lower' : 'upper';
            document.getElementById('turret-label').innerText = (turret === 'upper') ? 'Upper Turret (G54)' : 'Lower Turret (G55)';
            document.getElementById('turret-btn').className = (turret === 'upper') ? 'bg-slate-800 px-3 py-1 rounded text-[10px] font-bold border border-white/10' : 'bg-cyan-900 px-3 py-1 rounded text-[10px] font-bold border border-cyan-400';
            redraw();
        }

        function setDir(d) {
            direction = d;
            document.getElementById('dir-up').classList.toggle('active', d === 'up');
            document.getElementById('dir-down').classList.toggle('active', d === 'down');
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openEdit(type) {
            curEdit = -1;
            let l = contour[contour.length-1];
            document.getElementById('ix').value = l.x;
            document.getElementById('iz').value = '';
            document.getElementById('ia').value = '';
            document.getElementById('ir').value = '';
            showModal('m-edit');
        }

        function editStep(i) {
            curEdit = i;
            let el = contour[i];
            document.getElementById('ix').value = el.x;
            document.getElementById('iz').value = el.z ?? '';
            document.getElementById('ia').value = ''; 
            document.getElementById('ir').value = el.r || '';
            showModal('m-edit');
        }

        function save() {
            let deg = parseFloat(document.getElementById('ia').value);
            let finalA = null;

            if (!isNaN(deg)) {
                // Математика углов чертежа для Nakamura
                if (turret === 'upper') {
                    finalA = (direction === 'up') ? (180 - deg) : (180 + deg);
                } else {
                    finalA = (direction === 'up') ? (180 + deg) : (180 - deg);
                }
            }

            let d = {
                x: parseFloat(document.getElementById('ix').value) || 0,
                z: document.getElementById('iz').value === '' ? null : parseFloat(document.getElementById('iz').value),
                a: finalA,
                r: parseFloat(document.getElementById('ir').value) || 0,
                type: 'G1'
            };

            if(curEdit === -1) contour.push(d); else contour[curEdit] = d;
            closeModal('m-edit');
            updateUI();
        }

        function updateUI() {
            document.getElementById('el-container').innerHTML = contour.map((el, i) => `
                <div onclick="editStep(${i})" class="bg-slate-900 p-3 rounded-lg border-l-4 ${el.a?'border-cyan-500':'border-slate-700'} flex justify-between items-center">
                    <div class="text-[11px] font-mono">
                        <span class="text-slate-600">#${i} ${el.type}</span><br>
                        X${el.x.toFixed(3)} ${el.z!==null?'Z'+el.z.toFixed(3):''} ${el.a?',A'+el.a:''} ${el.r?',R'+el.r:''}
                    </div>
                    <button onclick="event.stopPropagation();contour.splice(${i},1);updateUI();" class="text-red-900 px-3">✕</button>
                </div>
            `).join('');
            redraw();
        }

        function redraw() {
            const g = document.getElementById('paths'); g.innerHTML = '';
            let cx = 0, cz = 0;
            document.getElementById('vp').setAttribute('transform', `translate(${offsetZ}, 200)`);

            contour.forEach((el, i) => {
                let nx = el.x, nz = el.z;
                if (el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;
                if (i > 0) {
                    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    l.setAttribute("x1", cz * zoom); l.setAttribute("y1", -(cx/2) * zoom);
                    l.setAttribute("x2", nz * zoom); l.setAttribute("y2", -(nx/2) * zoom);
                    l.setAttribute("stroke", el.a ? "#22d3ee" : "#facc15");
                    l.setAttribute("stroke-width", el.a ? "1.5" : "0.7");
                    g.appendChild(l);
                }
                cx = nx; cz = nz;
                if(i === contour.length - 1) {
                    let p = document.getElementById('tool');
                    p.setAttribute('cx', cz * zoom); p.setAttribute('cy', -(cx/2) * zoom); p.style.display = 'block';
                    document.getElementById('dx').innerText = cx.toFixed(3);
                    document.getElementById('dz').innerText = cz.toFixed(3);
                }
            });
        }

        function zoomIn(v) { zoom *= v; redraw(); }
        function autoCenter() {
            let minZ = Math.min(...contour.map(e => e.z || 0));
            offsetZ = Math.abs(minZ * zoom) + 100;
            if (offsetZ < 100) offsetZ = 300;
            redraw();
        }

        function doImport() {
            const raw = document.getElementById('import-text').value.toUpperCase();
            contour = [];
            raw.split('\n').forEach(line => {
                if(!/X|Z|A/.test(line)) return;
                const xM = line.match(/X(-?\d*\.?\d+)/);
                const zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/);
                const rM = line.match(/,R(-?\d*\.?\d+)/);
                contour.push({
                    x: xM ? parseFloat(xM[1]) : (contour.length?contour[contour.length-1].x:0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closeModal('m-import'); tab('sim'); updateUI(); autoCenter();
        }

        function resetContour() { if(confirm('Очистить?')) { contour=[{x:40,z:2,a:null,r:0,type:'G0'}]; updateUI(); } }
        window.onload = updateUI;
    </script>
</body>
</html>
