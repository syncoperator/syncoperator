<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Mobile Viz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @font-face { font-family: 'Consolas'; src: local('Consolas'); }
        .cnc-font { font-family: 'Consolas', monospace; line-height: 1.5; }
        .active-line { background: rgba(0, 153, 255, 0.3); border-left: 3px solid #0099ff; }
        .grid-bg { background-image: radial-gradient(#2d3748 1px, transparent 1px); background-size: 20px 20px; background-color: #0a0a0a; }
        #canvas-container { touch-action: none; }
        .siemens-blue { color: #0099ff; }
        /* Стили для мобильного скролла */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #334155; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col overflow-hidden">

    <header class="bg-black border-b border-blue-900 p-3 flex justify-between items-center shrink-0">
        <h1 class="text-sm font-bold tracking-tighter">SINUMERIK <span class="siemens-blue">ONE</span> | MOBILE</h1>
        <div class="flex gap-2">
            <button onclick="zoom(0.8)" class="bg-gray-800 p-2 rounded text-xs">A-</button>
            <button onclick="zoom(1.2)" class="bg-gray-800 p-2 rounded text-xs">A+</button>
            <button onclick="processCode()" class="bg-blue-600 px-4 py-1 rounded text-xs font-bold">DRAW</button>
        </div>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <div id="canvas-container" class="relative flex-1 md:flex-[2] grid-bg overflow-hidden border-b border-gray-800 md:border-b-0 md:border-r">
            <div class="absolute top-2 left-2 z-10 flex flex-col gap-1">
                <div class="bg-black/60 p-1 rounded text-[10px] border border-white/10">X: <span id="valX" class="text-yellow-400">0.0</span></div>
                <div class="bg-black/60 p-1 rounded text-[10px] border border-white/10">Z: <span id="valZ" class="text-yellow-400">0.0</span></div>
            </div>

            <svg id="canvas" class="w-full h-full cursor-move">
                <g id="viewport">
                    <line x1="-2000" y1="0" x2="2000" y2="0" stroke="#1e293b" stroke-width="1" />
                    <line x1="0" y1="-2000" x2="0" y2="2000" stroke="#1e293b" stroke-width="1" />
                    <g id="path-group"></g>
                    <g id="labels-group"></g>
                    <circle id="cursor" r="4" fill="red" style="display:none" />
                </g>
            </svg>
        </div>

        <div class="h-1/2 md:h-auto md:w-80 bg-black flex flex-col overflow-hidden">
            <div class="bg-gray-900 p-2 text-[10px] font-bold uppercase text-gray-500 flex justify-between">
                <span>G-Code Monitor</span>
                <span id="line-counter" class="siemens-blue">L0</span>
            </div>
            <div id="editor-lines" class="flex-1 overflow-y-auto cnc-font text-sm p-2 bg-black select-none">
                </div>
        </div>
    </main>

    <script>
        let curX = 0, curZ = 0;
        let scale = 4;
        let panX = 100, panY = 200; // Стартовые координаты для токарки
        let pathData = [];

        // Инициализация примера при загрузке
        window.onload = () => {
            const demo = `N1 G54 M41\nG0 X37. Z2.\nG1 Z.1 F.12\nG1 X-1.6\nG0 X26 Z1\nG1 Z0.1 F.18\nG1 X32.3,R.9\nG1 Z-2.9\nG1 X30.3,A225\nG1 Z-24.4\nG1 X34.3,R.8\nG1 Z-28`;
            renderEditor(demo);
            processCode();
        };

        function renderEditor(code) {
            const container = document.getElementById('editor-lines');
            container.innerHTML = code.split('\n').map((line, i) => `
                <div class="code-line cursor-pointer px-2 border-l-2 border-transparent hover:bg-gray-800" 
                     onclick="highlightLine(${i})" id="line-${i}">
                    <span class="text-gray-600 mr-2 w-6 inline-block">${i+1}</span>${line}
                </div>
            `).join('');
        }

        function highlightLine(index) {
            // Убираем старую подсветку
            document.querySelectorAll('.code-line').forEach(l => l.classList.remove('active-line'));
            document.getElementById(`line-${index}`).classList.add('active-line');
            document.getElementById('line-counter').innerText = `L${index + 1}`;

            // Показываем курсор на графике
            const point = pathData[index];
            if (point) {
                const cursor = document.getElementById('cursor');
                cursor.setAttribute('cx', point.z * scale);
                cursor.setAttribute('cy', -(point.x / 2) * scale);
                cursor.style.display = 'block';
                document.getElementById('valX').innerText = point.x.toFixed(3);
                document.getElementById('valZ').innerText = point.z.toFixed(3);
            }
        }

        function processCode() {
            const lines = Array.from(document.querySelectorAll('.code-line')).map(l => l.innerText.replace(/^\d+\s*/, ''));
            const pathGroup = document.getElementById('path-group');
            const labelsGroup = document.getElementById('labels-group');
            pathGroup.innerHTML = '';
            labelsGroup.innerHTML = '';
            pathData = [];

            let x = 0, z = 0;

            lines.forEach((line, i) => {
                const clean = line.toUpperCase();
                const xM = clean.match(/X(-?\d*\.?\d+)/);
                const zM = clean.match(/Z(-?\d*\.?\d+)/);
                const aM = clean.match(/,A(-?\d*\.?\d+)/);

                let nextX = xM ? parseFloat(xM[1]) : x;
                let nextZ = zM ? parseFloat(zM[1]) : z;

                if (aM && !zM) {
                    const angle = parseFloat(aM[1]);
                    const rad = (angle * Math.PI) / 180;
                    nextZ = z + ((nextX - x) / 2) / Math.tan(rad);
                }

                if (clean.includes('G1') || clean.includes('G0')) {
                    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    l.setAttribute("x1", z * scale);
                    l.setAttribute("y1", -(x/2) * scale);
                    l.setAttribute("x2", nextZ * scale);
                    l.setAttribute("y2", -(nextX/2) * scale);
                    l.setAttribute("stroke", aM ? "#0099ff" : (clean.includes('G0') ? "#334155" : "#fbbf24"));
                    l.setAttribute("stroke-width", aM ? "3" : "1.5");
                    pathGroup.appendChild(l);
                }

                pathData[i] = { x: nextX, z: nextZ };
                x = nextX; z = nextZ;
            });
            updateViewport();
        }

        // Управление камерой (Zoom/Pan)
        function updateViewport() {
            const group = document.getElementById('viewport');
            group.setAttribute('transform', `translate(${panX}, ${panY})`);
        }

        function zoom(factor) {
            scale *= factor;
            processCode();
        }

        // Реализация Touch/Mouse Dragging
        let isDragging = false;
        let startX, startY;
        const container = document.getElementById('canvas-container');

        container.addEventListener('mousedown', e => { isDragging = true; startX = e.clientX - panX; startY = e.clientY - panY; });
        container.addEventListener('mousemove', e => { if(isDragging) { panX = e.clientX - startX; panY = e.clientY - startY; updateViewport(); } });
        container.addEventListener('mouseup', () => isDragging = false);

        container.addEventListener('touchstart', e => { 
            isDragging = true; 
            startX = e.touches[0].clientX - panX; 
            startY = e.touches[0].clientY - panY; 
        });
        container.addEventListener('touchmove', e => { 
            if(isDragging) { 
                panX = e.touches[0].clientX - startX; 
                panY = e.touches[0].clientY - startY; 
                updateViewport(); 
            } 
        });
        container.addEventListener('touchend', () => isDragging = false);
    </script>
</body>
</html>
