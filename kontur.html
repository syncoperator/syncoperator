<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura Pro CNC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); }
        body { 
            background-color: #020617; 
            color: white; 
            height: 100vh; /* Fallback */
            height: 100dvh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            padding-bottom: var(--sab); /* Отступ под челку/полоску iPhone */
        }
        .canvas-bg { background-image: radial-gradient(#1e293b 1px, transparent 1px); background-size: 30px 30px; }
        input { font-size: 16px !important; background: #0f172a !important; color: #22d3ee !important; border: 1px solid #334155 !important; padding: 12px; border-radius: 8px; width: 100%; }
        .active-tab { color: #00f2ff; border-bottom: 3px solid #00f2ff; background: rgba(0,242,255,0.05); }
    </style>
</head>
<body class="antialiased">

    <header class="bg-slate-900 px-4 py-2 shrink-0 flex justify-between items-center border-b border-cyan-500/30">
        <div class="leading-none">
            <div class="text-[10px] text-cyan-500 font-bold tracking-widest">NAKAMURA</div>
            <div class="text-xs font-black italic">PRO SIM</div>
        </div>
        <div class="flex gap-2">
             <button onclick="toggleG0()" id="g0-btn" class="bg-slate-800 text-[9px] px-2 py-1 rounded border border-white/10">G0: ON</button>
             <button onclick="showPaste()" class="bg-cyan-600 text-[10px] px-3 py-1 rounded font-bold uppercase shadow-lg">Импорт</button>
        </div>
    </header>

    <div class="flex bg-slate-950 shrink-0 text-[10px] font-bold tracking-wider">
        <button id="t-sim" onclick="setTab('sim')" class="flex-1 p-3 active-tab">СИМУЛЯТОР</button>
        <button id="t-edit" onclick="setTab('edit')" class="flex-1 p-3 text-slate-500">РЕДАКТОР</button>
    </div>

    <main class="flex-1 relative overflow-hidden">
        <div id="view-sim" class="absolute inset-0 canvas-bg">
            <div class="absolute top-4 left-4 z-10 font-mono text-[11px] bg-black/60 p-2 rounded-lg border border-white/5">
                <div class="text-cyan-400">X: <span id="pos-x">0.00</span></div>
                <div class="text-cyan-400">Z: <span id="pos-z">0.00</span></div>
            </div>
            <svg id="canvas" class="w-full h-full">
                <g id="vport" transform="translate(300, 250)">
                    <line x1="-1500" y1="0" x2="200" y2="0" stroke="#1e293b" stroke-width="1" />
                    <g id="draw-g"></g>
                    <circle id="tool" r="5" fill="#ff0055" class="animate-pulse" style="display:none" />
                </g>
            </svg>
        </div>

        <div id="view-edit" class="absolute inset-0 bg-slate-900 hidden overflow-y-auto p-4 pb-32">
            <div id="el-list" class="space-y-2"></div>
        </div>
    </main>

    <footer class="bg-black/80 backdrop-blur-lg p-3 border-t border-white/10 flex gap-2 shrink-0">
        <button onclick="add('G1')" class="flex-1 bg-slate-800 h-14 rounded-xl border-b-4 border-yellow-600 text-lg font-bold">G1</button>
        <button onclick="add('A')" class="flex-1 bg-slate-800 h-14 rounded-xl border-b-4 border-cyan-600 text-lg font-bold text-cyan-400">∠A</button>
        <button onclick="add('R')" class="flex-1 bg-slate-800 h-14 rounded-xl border-b-4 border-orange-600 text-lg font-bold text-orange-400">,R</button>
        <button onclick="resetAll()" class="w-14 bg-red-900/30 h-14 rounded-xl border-b-4 border-red-700 flex items-center justify-center">
            <span class="text-xl">✕</span>
        </button>
    </footer>

    <div id="m-edit" class="fixed inset-0 bg-black/95 z-[100] hidden flex-col p-6 overflow-y-auto">
        <div class="flex justify-between items-center mb-8">
            <h2 id="m-title" class="text-cyan-400 font-bold uppercase italic">Параметры</h2>
            <button onclick="closeM()" class="text-4xl text-slate-500">&times;</button>
        </div>
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div><label class="text-[9px] text-slate-500 uppercase font-bold">X (Diam)</label><input id="ix" type="number" step="0.001"></div>
                <div><label class="text-[9px] text-slate-500 uppercase font-bold">Z (Length)</label><input id="iz" type="number" step="0.001"></div>
            </div>
            <div><label class="text-[9px] text-cyan-500 uppercase font-bold">Angle ,A (180=L, 225=L-Down)</label><input id="ia" type="number" step="0.1"></div>
            <div><label class="text-[9px] text-orange-500 uppercase font-bold">Radius ,R</label><input id="ir" type="number" step="0.01"></div>
            <button onclick="save()" class="w-full bg-cyan-600 py-5 rounded-2xl font-black uppercase text-white shadow-2xl active:scale-95 transition-all">OK</button>
        </div>
    </div>

    <div id="m-paste" class="fixed inset-0 bg-black z-[110] hidden flex-col p-4">
        <h3 class="text-center text-xs font-bold mb-4 tracking-widest text-cyan-400">PASTE G-CODE</h3>
        <textarea id="p-area" class="flex-1 bg-slate-900 border border-slate-800 p-4 rounded-xl text-green-400 font-mono text-xs outline-none" placeholder="Вставьте текст программы..."></textarea>
        <div class="flex gap-3 pt-4">
            <button onclick="closeP()" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold">BACK</button>
            <button onclick="doImp()" class="flex-1 p-4 bg-cyan-600 rounded-xl font-bold uppercase">IMPORT</button>
        </div>
    </div>

    <script>
        let cont = [{ x: 37, z: 2, a: null, r: 0, type: 'G0' }];
        let curI = -1;
        let g0On = true;
        let sc = 7;

        function setTab(t) {
            document.getElementById('view-sim').classList.toggle('hidden', t !== 'sim');
            document.getElementById('view-edit').classList.toggle('hidden', t !== 'edit');
            document.getElementById('t-sim').className = `flex-1 p-3 ${t==='sim'?'active-tab':'text-slate-500'}`;
            document.getElementById('t-edit').className = `flex-1 p-3 ${t==='edit'?'active-tab':'text-slate-500'}`;
            if(t==='sim') draw();
        }

        function toggleG0() { g0On = !g0On; document.getElementById('g0-btn').innerText = `G0: ${g0On?'ON':'OFF'}`; draw(); }
        function showPaste() { document.getElementById('m-paste').classList.remove('hidden'); }
        function closeP() { document.getElementById('m-paste').classList.add('hidden'); }

        function add(type) {
            curI = -1;
            let l = cont[cont.length-1];
            document.getElementById('ix').value = l.x;
            document.getElementById('iz').value = '';
            document.getElementById('ia').value = '';
            document.getElementById('ir').value = '';
            document.getElementById('m-edit').classList.remove('hidden');
        }

        function edit(i) {
            curI = i;
            let el = cont[i];
            document.getElementById('ix').value = el.x;
            document.getElementById('iz').value = el.z ?? '';
            document.getElementById('ia').value = el.a ?? '';
            document.getElementById('ir').value = el.r || '';
            document.getElementById('m-edit').classList.remove('hidden');
        }

        function closeM() { document.getElementById('m-edit').classList.add('hidden'); }

        function save() {
            let d = {
                x: parseFloat(document.getElementById('ix').value) || 0,
                z: document.getElementById('iz').value === '' ? null : parseFloat(document.getElementById('iz').value),
                a: document.getElementById('ia').value === '' ? null : parseFloat(document.getElementById('ia').value),
                r: parseFloat(document.getElementById('ir').value) || 0,
                type: 'G1'
            };
            if(curI === -1) cont.push(d); else cont[curI] = d;
            closeM(); upd();
        }

        function upd() { render(); draw(); }

        function render() {
            document.getElementById('el-list').innerHTML = cont.map((el, i) => `
                <div onclick="edit(${i})" class="bg-slate-800/50 p-3 rounded-lg border-l-4 ${el.a ? 'border-cyan-500' : 'border-slate-700'} flex justify-between items-center">
                    <div class="text-[11px] font-mono">
                        <span class="text-slate-500">#${i} ${el.type}</span><br>
                        X${el.x.toFixed(2)} ${el.z!==null?'Z'+el.z.toFixed(2):''} ${el.a?',A'+el.a:''} ${el.r?',R'+el.r:''}
                    </div>
                    <button onclick="event.stopPropagation();cont.splice(${i},1);upd()" class="text-red-900 px-2 text-xl">✕</button>
                </div>
            `).join('');
        }

        function draw() {
            const g = document.getElementById('draw-g'); g.innerHTML = '';
            let cx = 0, cz = 0;
            cont.forEach((el, i) => {
                let nx = el.x, nz = el.z;
                if (el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;
                if (i > 0 && (el.type !== 'G0' || g0On)) {
                    const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    l.setAttribute("x1", cz * sc); l.setAttribute("y1", -(cx/2) * sc);
                    l.setAttribute("x2", nz * sc); l.setAttribute("y2", -(nx/2) * sc);
                    l.setAttribute("stroke", el.type === 'G0' ? "#334155" : (el.a ? "#22d3ee" : "#facc15"));
                    l.setAttribute("stroke-width", el.a ? "1.5" : "0.7");
                    g.appendChild(l);
                }
                cx = nx; cz = nz;
                if(i === cont.length - 1) {
                    let p = document.getElementById('tool');
                    p.setAttribute('cx', cz * sc); p.setAttribute('cy', -(cx/2) * sc); p.style.display = 'block';
                    document.getElementById('pos-x').innerText = cx.toFixed(2);
                    document.getElementById('pos-z').innerText = cz.toFixed(2);
                }
            });
        }

        function doImp() {
            const raw = document.getElementById('p-area').value.toUpperCase();
            cont = [];
            raw.split('\n').forEach(line => {
                if(!line.includes('X') && !line.includes('Z') && !line.includes('A')) return;
                const xM = line.match(/X(-?\d*\.?\d+)/), zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/), rM = line.match(/,R(-?\d*\.?\d+)/);
                cont.push({
                    x: xM ? parseFloat(xM[1]) : (cont.length?cont[cont.length-1].x:0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closeP(); setTab('sim'); upd();
        }

        function resetAll() { if(confirm('Del all?')) { cont = [{ x: 37, z: 2, a: null, r: 0, type: 'G0' }]; upd(); } }
        window.onload = upd;
    </script>
</body>
</html>
