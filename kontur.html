<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura v10 Meister</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #010409; color: #e6edf3; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, sans-serif; }
        
        /* Tool Cards [cite: 2026-02-04] */
        .t-card { background: #0d1117; border-radius: 12px; padding: 12px; border: 1px solid #30363d; margin-bottom: 8px; }
        .t-card.active { border-color: #2f81f7; background: #161b22; box-shadow: 0 0 10px rgba(47,129,247,0.2); }
        .t-nr { font-size: 8px; color: #8b949e; text-transform: uppercase; font-weight: 800; }
        .t-desc { font-size: 16px; font-weight: 800; color: #fff; }
        
        .glass { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid #30363d; }
        input, select { background: #010409 !important; border: 1px solid #30363d !important; color: #58a6ff !important; padding: 12px; border-radius: 8px; font-weight: 700; width: 100%; appearance: none; }
        
        #canvas-bg { background-image: radial-gradient(#161b22 1.5px, transparent 1.5px); background-size: 30px 30px; }
        .btn-main { background: #21262d; border: 1px solid #30363d; border-radius: 10px; font-size: 11px; font-weight: 800; color: #c9d1d9; }
        
        footer { padding-bottom: calc(15px + var(--sab)); background: #0d1117; border-top: 1px solid #30363d; }
    </style>
</head>
<body>

    <header class="p-4 glass z-[100] flex justify-between items-center">
        <div>
            <div id="turret-id" class="text-[9px] font-black text-blue-500 tracking-widest uppercase">G54 | UPPER TURRET</div>
            <div class="flex gap-4 mt-1 font-mono text-xl">
                <div>X <span id="dx" class="text-blue-400">0.000</span></div>
                <div>Z <span id="dz" class="text-emerald-400">0.000</span></div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTurret()" class="btn-main px-4 py-2">TURRET</button>
            <button onclick="showModal('m-tool')" class="btn-main px-4 py-2 text-blue-400">WERKZEUG</button>
            <button onclick="showModal('m-import')" class="btn-main px-4 py-2 bg-blue-600 !border-blue-500 !text-white">IMPORT</button>
        </div>
    </header>

    <main id="canvas-bg" class="flex-1 relative overflow-hidden">
        <div class="absolute top-4 right-4 z-10 flex flex-col gap-2">
            <button onclick="zoom(1.2)" class="w-10 h-10 btn-main text-lg">+</button>
            <button onclick="zoom(0.8)" class="w-10 h-10 btn-main text-lg">-</button>
            <button onclick="autoFocus()" class="w-10 h-10 btn-main text-[9px]">CENTER</button>
        </div>

        <svg id="viewport" class="w-full h-full">
            <g id="stage" transform="translate(400, 300) scale(10)">
                <line x1="-1000" y1="0" x2="500" y2="0" stroke="#30363d" stroke-width="0.1" />
                <g id="trace-layer"></g>
                <g id="tool-unit" style="transition: transform 0.2s cubic-bezier(0.2, 1, 0.3, 1)">
                    <path id="h-body" fill="#21262d" stroke="#484f58" stroke-width="0.15" />
                    <path id="h-insert" fill="#f2cc60" stroke="#fff" stroke-width="0.2" />
                    <circle r="0.15" fill="#ff7b72" /> </g>
            </g>
        </svg>
    </main>

    <section id="step-list" class="h-[35%] overflow-y-auto p-4 bg-[#010409]">
        </section>

    <footer class="p-4 grid grid-cols-4 gap-2">
        <button onclick="addKadre('G1')" class="h-14 btn-main text-amber-500">G1 LINEAR</button>
        <button onclick="addKadre('G33')" class="h-14 btn-main text-blue-400">G33 GEWINDE</button>
        <button onclick="addKadre('G75')" class="h-14 btn-main text-emerald-500">G75 STICH</button>
        <button onclick="resetApp()" class="h-14 btn-main text-red-500">RESET</button>
    </footer>

    <div id="m-tool" class="fixed inset-0 bg-black/98 z-[500] hidden p-8 overflow-y-auto">
        <h2 class="text-2xl font-black text-blue-500 mb-8 italic">WERKZEUG-EINSTELLUNGEN</h2>
        <div class="space-y-6 max-w-sm mx-auto">
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-2">Operation / Typ</label>
                <select id="t-op" onchange="drawToolGeometry()">
                    <option value="turning">Drehen (Schlichten/Schruppen)</option>
                    <option value="threading">Gewindeschneiden</option>
                    <option value="grooving">Stechen / Einstich</option>
                    <option value="boring">Bohrstange (Innen)</option>
                </select>
            </div>
            <div>
                <label class="text-[10px] font-bold text-slate-500 uppercase block mb-2">Montage (Ausrichtung)</label>
                <select id="t-mount" onchange="drawToolGeometry()">
                    <option value="radial">Radial (X-Richtung)</option>
                    <option value="axial">Axial (Z-Richtung)</option>
                </select>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 mb-2 block uppercase">Spitzenwinkel (°)</label>
                    <select id="t-v" onchange="drawToolGeometry()">
                        <option value="35">35° (V-Platte)</option>
                        <option value="55">55° (D-Platte)</option>
                        <option value="80">80° (C-Platte)</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] font-bold text-slate-500 mb-2 block uppercase">Halter-Größe</label>
                    <input id="t-size" type="number" value="20" oninput="drawToolGeometry()">
                </div>
            </div>
            <button onclick="closeModal('m-tool')" class="w-full bg-blue-600 h-16 rounded-2xl font-black text-white mt-10 uppercase tracking-widest">Speichern & Schließen</button>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-[#0d1117] z-[510] hidden p-4 flex flex-col">
        <div class="text-[10px] font-black text-blue-400 mb-4 uppercase">G-Code Analyse</div>
        <textarea id="imp-area" class="flex-1 bg-black border border-slate-800 rounded-2xl p-6 font-mono text-sm text-green-400 outline-none" placeholder="G0 X100. Z5. ..."></textarea>
        <div class="flex gap-4 mt-6">
            <button onclick="closeModal('m-import')" class="flex-1 h-14 btn-main">Abbrechen</button>
            <button onclick="processImport()" class="flex-1 h-14 bg-white text-black font-black rounded-2xl uppercase">Verarbeiten</button>
        </div>
    </div>

    <script>
        let program = [{ x: 40, z: 2, type: 'G0', modX: true, modZ: true }];
        let activeIdx = 0;
        let viewScale = 10;
        let turret = 'UPPER';

        function toggleTurret() {
            turret = (turret === 'UPPER') ? 'LOWER' : 'UPPER';
            document.getElementById('turret-id').innerText = `G5${turret==='UPPER'?'4':'5'} | ${turret} TURRET`;
            drawToolGeometry(); updateUI();
        }

        function drawToolGeometry() {
            const op = document.getElementById('t-op').value;
            const mount = document.getElementById('t-mount').value;
            const angle = parseFloat(document.getElementById('t-v').value);
            const size = parseFloat(document.getElementById('t-size').value);
            
            const insert = document.getElementById('h-insert');
            const holder = document.getElementById('h-body');
            const side = (turret === 'UPPER') ? 1 : -1;

            // Вертикальный расчет пластины (теперь стоит "торчком")
            const rad = (angle/2) * (Math.PI/180);
            const pHeight = 5; 
            const dx = pHeight * Math.sin(rad); // Ширина по Z
            const dy = pHeight * Math.cos(rad); // Высота по X

            if(op === 'turning' || op === 'boring') {
                const dir = (op === 'boring') ? -1 : 1;
                // Пластина - острая вершина в 0,0
                insert.setAttribute('d', `M 0 0 L ${-dx} ${dy*side*dir} L 0 ${dy*2*side*dir} L ${dx} ${dy*side*dir} Z`);
                
                // Halter (Державка)
                if(mount === 'radial') {
                    holder.setAttribute('d', `M ${-dx} ${dy*side*dir} L ${-dx} ${(dy+size)*side*dir} L ${dx} ${(dy+size)*side*dir} L ${dx} ${dy*side*dir} Z`);
                } else {
                    holder.setAttribute('d', `M ${dx} ${dy*side*dir} L ${size} ${dy*side*dir} L ${size} ${-dy*side*dir} L ${dx} ${-dy*side*dir} Z`);
                }
            } else if (op === 'grooving') {
                insert.setAttribute('d', `M -1.5 0 L 1.5 0 L 1.5 ${4*side} L -1.5 ${4*side} Z`);
                holder.setAttribute('d', `M -1.5 ${4*side} L -1.5 ${(4+size)*side} L 1.5 ${(4+size)*side} L 1.5 ${4*side} Z`);
            }
        }

        function processImport() {
            const lines = document.getElementById('imp-area').value.toUpperCase().split('\n');
            program = [];
            let lx = 40, lz = 2;
            lines.forEach(l => {
                if(!/X|Z/.test(l)) return;
                const xm = l.match(/X(-?\d*\.?\d+)/);
                const zm = l.match(/Z(-?\d*\.?\d+)/);
                const cx = xm ? parseFloat(xm[1]) : lx;
                const cz = zm ? parseFloat(zm[1]) : lz;
                program.push({
                    x: cx, z: cz,
                    type: l.includes('G0') ? 'G0' : (l.includes('G33')?'G33':'G1'),
                    modX: !!xm, modZ: !!zm
                });
                lx = cx; lz = cz;
            });
            closeModal('m-import'); updateUI(); autoFocus();
        }

        function updateUI() {
            const list = document.getElementById('step-list');
            list.innerHTML = program.map((p, i) => `
                <div class="t-card ${i===activeIdx?'active':''}" onclick="selectStep(${i})">
                    <span class="t-nr">Step #${i} — ${p.type}</span>
                    <div class="t-desc">
                        ${p.modX ? `<span class="text-blue-400">X${p.x.toFixed(3)}</span>` : ''}
                        ${p.modZ ? `<span class="text-emerald-400 ml-3">Z${p.z.toFixed(3)}</span>` : ''}
                    </div>
                </div>
            `).join('') + '<div style="height:50px"></div>';
            renderPath();
        }

        function selectStep(i) {
            activeIdx = i;
            const p = program[i];
            document.getElementById('tool-unit').setAttribute('transform', `translate(${p.z}, ${-p.x/2})`);
            document.getElementById('dx').innerText = p.x.toFixed(3);
            document.getElementById('dz').innerText = p.z.toFixed(3);
            updateUI();
        }

        function renderPath() {
            const layer = document.getElementById('trace-layer');
            layer.innerHTML = '';
            program.forEach((p, i) => {
                if(i === 0) return;
                const prev = program[i-1];
                const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l.setAttribute("x1", prev.z); l.setAttribute("y1", -prev.x/2);
                l.setAttribute("x2", p.z); l.setAttribute("y2", -p.x/2);
                l.setAttribute("stroke", p.type==='G0'?'#21262d':(p.type==='G33'?'#58a6ff':'#d29922'));
                l.setAttribute("stroke-width", "0.35");
                layer.appendChild(l);
            });
        }

        function zoom(v) { viewScale *= v; applyZoom(); }
        function autoFocus() {
            const zs = program.map(p => p.z);
            const minZ = Math.min(...zs);
            const off = 400 - (minZ * viewScale);
            document.getElementById('stage').setAttribute('transform', `translate(${off}, 300) scale(${viewScale})`);
        }
        function applyZoom() {
            const current = document.getElementById('stage').getAttribute('transform').split('scale')[0];
            document.getElementById('stage').setAttribute('transform', `${current} scale(${viewScale})`);
        }
        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }
        window.onload = () => { drawToolGeometry(); updateUI(); autoFocus(); };
    </script>
</body>
</html>
