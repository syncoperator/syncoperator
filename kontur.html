<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura v13 Standard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #010409; color: #e6edf3; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Tool Cards Style [cite: 2026-02-04] */
        .t-card { background: #0d1117; border-radius: 10px; padding: 12px; border: 1px solid #30363d; margin-bottom: 8px; position: relative; }
        .t-card.active { border-color: #2f81f7; background: #161b22; box-shadow: 0 0 15px rgba(47,129,247,0.1); }
        .t-nr { font-size: 9px; color: #8b949e; font-weight: 800; display: block; }
        .t-desc { font-size: 16px; font-weight: 900; color: #fff; }
        
        header { background: rgba(13, 17, 23, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid #30363d; }
        input, select { background: #010409 !important; border: 1px solid #30363d !important; color: #58a6ff !important; padding: 12px; border-radius: 8px; font-weight: 700; width: 100%; }
        
        #viewport { background-image: radial-gradient(#1c2128 1.5px, transparent 1.5px); background-size: 40px 40px; }
        .btn-ui { background: #21262d; border: 1px solid #30363d; border-radius: 12px; font-size: 11px; font-weight: 800; color: #c9d1d9; transition: 0.1s; }
        .btn-ui:active { transform: scale(0.95); background: #30363d; }
        
        /* Scroll adjustment [cite: 2026-02-04] */
        #step-list { padding-bottom: 100px; }
        footer { padding-bottom: calc(15px + var(--sab)); background: #0d1117; border-top: 1px solid #30363d; }
    </style>
</head>
<body>

    <header class="p-4 z-[100] flex justify-between items-center">
        <div>
            <div id="turret-label" class="text-[9px] font-black text-blue-500 tracking-widest uppercase">G54 | OBERER REVOLVER</div>
            <div class="flex gap-4 mt-1 font-mono text-xl font-bold">
                <div>X <span id="valX" class="text-white">0.000</span></div>
                <div>Z <span id="valZ" class="text-white">0.000</span></div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTurret()" class="btn-ui px-4 py-2">TURRET</button>
            <button onclick="showM('m-tool')" class="btn-ui px-4 py-2 text-blue-400">WERKZEUG</button>
            <button onclick="showM('m-import')" class="btn-ui px-4 py-2 bg-blue-600 !text-white">IMPORT</button>
        </div>
    </header>

    <main id="viewport" class="flex-1 relative overflow-hidden">
        <div class="absolute top-4 right-4 z-10 flex flex-col gap-2">
            <button onclick="zoom(1.2)" class="w-12 h-12 btn-ui text-xl">+</button>
            <button onclick="zoom(0.8)" class="w-12 h-12 btn-ui text-xl">-</button>
            <button onclick="autoFit()" class="w-12 h-12 btn-ui text-[9px]">CENTER</button>
        </div>
        <svg id="svg" class="w-full h-full">
            <g id="world" transform="translate(100, 300) scale(15)">
                <line x1="-1000" y1="0" x2="1000" y2="0" stroke="#1c2128" stroke-width="0.1" />
                <g id="trace"></g>
                <g id="tool-group" style="transition: transform 0.1s linear">
                    <path id="t-halter" fill="#2d333b" stroke="#444c56" stroke-width="0.1" />
                    <path id="t-insert" fill="#f2cc60" stroke="#fff" stroke-width="0.15" />
                    <path id="t-angle-view" fill="rgba(88, 166, 255, 0.2)" />
                    <circle r="0.15" fill="#ff7b72" />
                </g>
            </g>
        </svg>
    </main>

    <section id="step-list" class="h-[35%] overflow-y-auto p-4 bg-[#010409]">
        </section>

    <footer class="p-4 grid grid-cols-2 gap-2">
        <button onclick="addKadre('G1')" class="h-14 btn-ui text-amber-500 text-sm">G1 LINEAR</button>
        <button onclick="resetApp()" class="h-14 btn-ui text-red-500 text-sm">RESET ALL</button>
    </footer>

    <div id="m-tool" class="fixed inset-0 bg-black/95 z-[500] hidden items-center justify-center p-6">
        <div class="bg-[#0d1117] border border-[#30363d] rounded-2xl p-6 w-full max-w-sm">
            <h2 class="text-xl font-black text-blue-500 mb-6 uppercase italic">Werkzeug-Geometrie</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Position</label>
                    <select id="t-pos" onchange="drawTool()">
                        <option value="outside">Außen (Normal)</option>
                        <option value="inside">Innen (Bohrstange)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Spitzenwinkel (°)</label>
                        <input id="t-angle" type="number" value="55" oninput="drawTool()">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Platte Länge</label>
                        <input id="t-size" type="number" value="12" oninput="drawTool()">
                    </div>
                </div>
                <button onclick="closeM('m-tool')" class="w-full bg-blue-600 h-14 rounded-xl font-black text-white mt-4">FERTIG</button>
            </div>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-[#010409] z-[510] hidden flex flex-col p-4">
        <textarea id="imp-area" class="flex-1 bg-black border border-slate-800 rounded-xl p-4 font-mono text-sm text-green-500" placeholder="G-Code..."></textarea>
        <div class="flex gap-4 mt-4">
            <button onclick="closeM('m-import')" class="flex-1 h-14 btn-ui">Abbrechen</button>
            <button onclick="doImport()" class="flex-1 h-14 bg-white text-black font-black rounded-xl uppercase">Analysieren</button>
        </div>
    </div>

    <script>
        let program = [{ x: 50, z: 2, type: 'G0', hasX: true, hasZ: true }];
        let activeIdx = 0, zoomScale = 15, turret = 'UPPER';

        function toggleTurret() {
            turret = (turret === 'UPPER') ? 'LOWER' : 'UPPER';
            document.getElementById('turret-label').innerText = `G5${turret==='UPPER'?'4':'5'} | ${turret.toUpperCase()} REVOLVER`;
            drawTool(); updateUI();
        }

        function drawTool() {
            const pos = document.getElementById('t-pos').value;
            const angle = parseFloat(document.getElementById('t-angle').value);
            const size = parseFloat(document.getElementById('t-size').value);
            
            const insert = document.getElementById('t-insert');
            const halter = document.getElementById('t-halter');
            const highlight = document.getElementById('t-angle-view');
            
            // Вектор направления: Верхний револьвер режет ВНИЗ (side = 1)
            const side = (turret === 'UPPER') ? 1 : -1;
            // Если Innen (внутри), инвертируем направление пластины относительно оси
            const mode = (pos === 'inside') ? -1 : 1;

            const rad = (angle/2) * (Math.PI/180);
            const dx = (size/2) * Math.sin(rad);
            const dy = (size/2) * Math.cos(rad);

            // Отрисовка: Вершина всегда в 0,0. Пластина растет вверх (по X)
            // Для Außen: пластина выше детали, для Innen: пластина ниже
            insert.setAttribute('d', `M 0 0 L ${-dx} ${dy*side*mode} L 0 ${dy*2*side*mode} L ${dx} ${dy*side*mode} Z`);
            
            // Державка (Halter): уходит в сторону от детали
            halter.setAttribute('d', `M ${-dx} ${dy*side*mode} L ${-dx} ${(dy+15)*side*mode} L ${-25} ${(dy+15)*side*mode} L ${-25} ${dy*side*mode} Z`);
            
            // Подсветка угла
            highlight.setAttribute('d', `M 0 0 L ${-dx*1.5} ${dy*1.5*side*mode} A ${size} ${size} 0 0 1 ${dx*1.5} ${dy*1.5*side*mode} Z`);
        }

        function doImport() {
            const lines = document.getElementById('imp-area').value.toUpperCase().split('\n');
            program = []; let lx = 50, lz = 2;
            lines.forEach(l => {
                if(!/X|Z/.test(l)) return;
                const xm = l.match(/X(-?\d*\.?\d+)/), zm = l.match(/Z(-?\d*\.?\d+)/);
                const cx = xm ? parseFloat(xm[1]) : lx, cz = zm ? parseFloat(zm[1]) : lz;
                program.push({ x: cx, z: cz, type: l.includes('G0')?'G0':'G1', hasX: !!xm, hasZ: !!zm });
                lx = cx; lz = cz;
            });
            closeM('m-import'); updateUI(); autoFit();
        }

        function updateUI() {
            const list = document.getElementById('step-list');
            list.innerHTML = program.map((p, i) => `
                <div class="t-card ${i===activeIdx?'active':''}" onclick="gotoStep(${i})">
                    <span class="t-nr">KADRE N${i+1} — ${p.type}</span>
                    <div class="t-desc">${p.hasX?'X'+p.x.toFixed(2):''} ${p.hasZ?' Z'+p.z.toFixed(2):''}</div>
                </div>
            `).join('') + '<div style="height:100px"></div>';
            renderTrace();
        }

        function gotoStep(i) {
            activeIdx = i; const p = program[i];
            document.getElementById('tool-group').setAttribute('transform', `translate(${p.z}, ${-p.x/2})`);
            document.getElementById('valX').innerText = p.x.toFixed(3);
            document.getElementById('valZ').innerText = p.z.toFixed(3);
            updateUI();
        }

        function renderTrace() {
            const g = document.getElementById('trace'); g.innerHTML = '';
            program.forEach((p, i) => {
                if(i === 0) return;
                const prev = program[i-1];
                const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l.setAttribute("x1", prev.z); l.setAttribute("y1", -prev.x/2);
                l.setAttribute("x2", p.z); l.setAttribute("y2", -p.x/2);
                l.setAttribute("stroke", p.type==='G0'?'#21262d':'#d29922');
                l.setAttribute("stroke-width", "0.2");
                g.appendChild(l);
            });
        }

        function addKadre(t) {
            const last = program[program.length-1];
            program.push({...last, type: t});
            updateUI();
        }

        function resetApp() { program = [{ x: 50, z: 2, type: 'G0', hasX: true, hasZ: true }]; activeIdx = 0; updateUI(); autoFit(); }
        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        function zoom(v) { zoomScale *= v; applyZoom(); }
        function applyZoom() { 
            const t = document.getElementById('world').getAttribute('transform').split('scale')[0];
            document.getElementById('world').setAttribute('transform', `${t} scale(${zoomScale})`);
        }
        function autoFit() {
            const zs = program.map(p => p.z), xs = program.map(p => -p.x/2);
            const minZ = Math.min(...zs), maxZ = Math.max(...zs);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const w = document.getElementById('viewport').clientWidth, h = document.getElementById('viewport').clientHeight;
            zoomScale = Math.min(w/(Math.abs(maxZ-minZ)||50), h/(Math.abs(maxX-minX)||50)) * 0.7;
            document.getElementById('world').setAttribute('transform', `translate(${w/2 - ((minZ+maxZ)/2)*zoomScale}, ${h/2 - ((minX+maxX)/2)*zoomScale}) scale(${zoomScale})`);
        }

        window.onload = () => { drawTool(); updateUI(); autoFit(); };
    </script>
</body>
</html>
