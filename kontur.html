<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Premium - Parser & Angles</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        * { box-sizing: border-box; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background: #0b1120; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, monospace; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* HEADER */
        header { background: #0f172a; border-bottom: 1px solid #1e293b; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .val-box { font-size: 24px; font-weight: 700; font-family: ui-monospace, monospace; letter-spacing: 1px; }
        
        /* VIEWS */
        #view-parser, #view-sim { display: none; flex-direction: column; height: 100%; flex: 1; }
        #view-parser.active, #view-sim.active { display: flex; }

        /* SIMULATION AREA */
        #sim-area { flex: 1; background: #0b1120; position: relative; min-height: 25vh; border-bottom: 1px solid #1e293b; overflow: hidden; }
        #sim-grid { position: absolute; inset: 0; background-image: radial-gradient(#334155 1px, transparent 1px); background-size: 30px 30px; opacity: 0.3; }
        .sim-btn { position: absolute; right: 12px; width: 44px; height: 44px; background: #1e293b; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; border: 1px solid #334155; color: white; z-index: 10; }
        .sim-btn:active { background: #334155; }

        /* LIST & CARDS */
        #list-container { flex: 1; overflow-y: auto; padding: 12px; background: #0b1120; }
        #list-container::after { content: ''; display: block; height: 140px; } 
        
        .t-card { background: #0f172a; border: 1px solid #1e293b; border-radius: 12px; padding: 14px; margin-bottom: 10px; transition: 0.1s; cursor: pointer; display: flex; flex-direction: column; }
        .t-card.active { border-color: #3b82f6; background: #172554; box-shadow: 0 0 0 1px #3b82f6; }
        
        .t-card-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: #64748b; margin-bottom: 6px; }
        .t-card-body { font-size: 18px; font-weight: 700; color: #f8fafc; font-family: ui-monospace, monospace; display: flex; gap: 12px; flex-wrap: wrap;}
        
        /* EDITOR CONTROLS */
        #editor-controls { background: #0f172a; border-top: 1px solid #1e293b; padding: 12px; padding-bottom: calc(12px + var(--sab)); z-index: 10; box-shadow: 0 -4px 10px rgba(0,0,0,0.5); }
        
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
        .axis-input { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 10px 10px 10px 32px; border-radius: 8px; font-size: 16px; font-family: monospace; font-weight: bold; text-align: left; }
        .axis-input:focus { outline: none; border-color: #3b82f6; background: #0f172a; }
        .input-wrap { position: relative; }
        .input-label { position: absolute; left: 12px; top: 11px; font-weight: bold; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .btn-act { background: #1e293b; border: 1px solid #334155; color: white; border-radius: 8px; height: 44px; font-weight: 700; font-size: 12px; text-transform: uppercase; }
        .btn-act:active { background: #334155; }
        .btn-act.highlight { background: #3b82f6; border-color: #2563eb; }
        .btn-act.g0-toggle.is-g0 { background: #ef4444; border-color: #dc2626; } 
        .btn-act.g0-toggle.is-g1 { background: #10b981; border-color: #059669; } 

        /* MODALS */
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
        .modal-box { background: #0f172a; border-radius: 16px; padding: 20px; width: 100%; max-width: 400px; border: 1px solid #1e293b; }
        
        .tool-list-item { background: #f8fafc; color: #0f172a; padding: 16px; border-radius: 10px; font-weight: 700; margin-bottom: 10px; text-transform: uppercase; display: flex; justify-content: space-between; align-items: center;}
    </style>
</head>
<body>

    <div id="view-parser" class="active">
        <header>
            <div>
                <div class="text-[10px] font-black text-blue-500 uppercase tracking-widest">G-Code Parser</div>
                <div class="font-bold text-white text-sm">Programm Analyse</div>
            </div>
        </header>
        <div class="p-4 flex flex-col h-full overflow-y-auto">
            <textarea id="raw-gcode" class="w-full h-40 bg-slate-800 text-slate-300 font-mono text-xs p-3 rounded-lg border border-slate-600 mb-4 focus:border-blue-500 outline-none" placeholder="G-Code einfügen..."></textarea>
            
            <button onclick="parseGCode()" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl uppercase tracking-widest mb-6">Liste Laden</button>
            
            <div id="parsed-tools-list" class="flex-1 overflow-y-auto">
                <div class="text-center text-slate-500 text-sm mt-10">Keine Daten geladen.</div>
            </div>
        </div>
    </div>

    <div id="view-sim">
        <header>
            <div class="flex flex-col">
                <span class="text-[10px] font-black text-blue-500 uppercase tracking-widest">Nakamura Premium</span>
                <span id="header-tool-name" class="text-xs font-bold text-slate-400">G54 | UPPER TURRET</span>
            </div>
            <div class="flex gap-2">
                <button onclick="openModal('mod-tool')" class="bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase">Tool</button>
                <button onclick="backToParser()" class="bg-slate-800 border border-slate-700 text-white px-4 py-2 rounded-lg text-xs font-bold uppercase">Back</button>
            </div>
        </header>

        <div id="sim-area">
            <div id="sim-grid"></div>
            <button class="sim-btn" style="top: 12px" onclick="zoom(1.2)">+</button>
            <button class="sim-btn" style="top: 68px" onclick="zoom(0.8)">-</button>
            <button class="sim-btn text-[10px]" style="top: 124px; padding: 0" onclick="autoFit()">CTR</button>
            
            <div class="absolute top-3 left-4 pointer-events-none z-10">
                <div class="text-[10px] text-slate-500 font-bold uppercase mb-1">Pos</div>
                <div class="val-box text-blue-400">X<span id="ui-x">0.000</span></div>
                <div class="val-box text-emerald-400">Z<span id="ui-z">0.000</span></div>
            </div>

            <svg id="svg" class="w-full h-full absolute inset-0 z-0">
                <g id="camera" transform="translate(150,150) scale(4)">
                    <line x1="-1000" y1="0" x2="1000" y2="0" stroke="#334155" stroke-width="0.3" stroke-dasharray="2,2" />
                    <line x1="0" y1="-1000" x2="0" y2="1000" stroke="#334155" stroke-width="0.3" />
                    <g id="layer-trace"></g>
                    <g id="layer-tool" style="transition: transform 0.1s linear">
                        <polygon id="t-ins" points="0,0 -4,6 4,6" fill="#fbbf24" stroke="#d97706" stroke-width="0.3" />
                        <polygon id="t-hold" points="-4,6 -4,25 15,25 15,6" fill="#334155" stroke="#0f172a" stroke-width="0.2" />
                        <circle r="0.6" fill="#ef4444" />
                    </g>
                </g>
            </svg>
        </div>

        <div id="list-container"></div>

        <div id="editor-controls">
            <div class="input-grid">
                <div class="input-wrap">
                    <span class="input-label text-blue-400">X</span>
                    <input id="inp-x" type="number" step="0.01" class="axis-input" oninput="updateActiveStep('x', this.value)">
                </div>
                <div class="input-wrap">
                    <span class="input-label text-emerald-400">Z</span>
                    <input id="inp-z" type="number" step="0.01" class="axis-input" oninput="updateActiveStep('z', this.value)">
                </div>
                <div class="input-wrap">
                    <span class="input-label text-purple-400">A</span>
                    <input id="inp-a" type="number" step="0.1" class="axis-input" placeholder="Winkel" oninput="updateActiveStep('a', this.value)">
                </div>
                <div class="input-wrap">
                    <span class="input-label text-orange-400">R</span>
                    <input id="inp-r" type="number" step="0.1" class="axis-input" placeholder="Radius" oninput="updateActiveStep('r', this.value)">
                </div>
            </div>
            
            <div class="btn-grid">
                <button id="btn-toggle-g" onclick="toggleGMode()" class="btn-act g0-toggle is-g1">G1</button>
                <button onclick="addStep()" class="btn-act highlight">+ Add</button>
                <button onclick="deleteStep()" class="btn-act bg-red-900 border-red-800">Del</button>
            </div>
        </div>
    </div>

    <div id="mod-tool" class="modal">
        <div class="modal-box">
            <h2 class="text-lg font-black text-white italic mb-4 uppercase">Werkzeug Setup</h2>
            <label class="text-[10px] text-slate-400 font-bold uppercase block mb-1">Ausrichtung</label>
            <select id="tool-mount" class="w-full bg-slate-800 text-blue-400 border border-slate-600 rounded-lg p-3 mb-4 font-bold outline-none">
                <option value="OD">AUSSEN (OD)</option>
                <option value="ID">INNEN (ID)</option>
            </select>
            <button onclick="saveToolConfig()" class="w-full bg-cyan-600 text-white font-bold py-4 rounded-xl mt-4">Speichern</button>
        </div>
    </div>

    <script>
        // ================= STATE =================
        let parsedTools = []; 
        let activeToolIndex = -1;
        let activeStepIndex = 0;
        let currentScale = 4;

        // Пример с твоими углами и радиусами для теста парсера
        const defaultGCode = `N1G54M41 
G0G99T0101M765 
(KOPIERST.R0.8 G54)
G0X50 Z2
G1Z.1F.2 
G1X0F.12 
G0X36Z1
G1Z.1
G1,A90 
G1X40.5Z-2,A135
G1Z-5
G1X41.5,R.9
G1Z-27.9 
M1`;

        document.getElementById('raw-gcode').value = defaultGCode;

        // ================= PARSER =================
        function parseGCode() {
            const text = document.getElementById('raw-gcode').value;
            const lines = text.split('\n');
            
            parsedTools = [];
            let currentTool = null;
            let currentX = 0, currentZ = 0, currentG = 'G0';

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i].trim().toUpperCase();
                if (!line) continue;

                let tMatch = line.match(/T(\d{4})/);
                if (tMatch) {
                    if (currentTool) parsedTools.push(currentTool);
                    currentTool = { number: tMatch[0], desc: 'Unbekanntes Werkzeug', steps: [] };
                    
                    let nextLine = (lines[i+1] || '').trim();
                    if (nextLine.startsWith('(')) {
                        currentTool.desc = nextLine.replace(/[()]/g, '');
                    }
                    currentX = 50; currentZ = 5; currentG = 'G0';
                } 
                else if (currentTool) {
                    let gMatch = line.match(/G([01])/);
                    let xMatch = line.match(/X([-\d.]+)/);
                    let zMatch = line.match(/Z([-\d.]+)/);
                    
                    // Ищем углы и радиусы (с запятой или без)
                    let aMatch = line.match(/,?[A]([-\d.]+)/);
                    let rMatch = line.match(/,?[RC]([-\d.]+)/);

                    if (gMatch) currentG = 'G' + gMatch[1];

                    if (xMatch || zMatch || aMatch || rMatch) {
                        if (xMatch) currentX = parseFloat(xMatch[1]);
                        if (zMatch) currentZ = parseFloat(zMatch[1]);
                        
                        let stepData = {
                            type: currentG,
                            x: currentX,
                            z: currentZ,
                            a: aMatch ? parseFloat(aMatch[1]) : null,
                            r: rMatch ? parseFloat(rMatch[1]) : null
                        };
                        currentTool.steps.push(stepData);
                    }
                }
            }
            if (currentTool && currentTool.steps.length > 0) parsedTools.push(currentTool);
            renderToolsList();
        }

        // ================= LIST VIEW =================
        function renderToolsList() {
            const container = document.getElementById('parsed-tools-list');
            if (parsedTools.length === 0) {
                container.innerHTML = `<div class="text-center text-red-500 font-bold mt-10">Keine Werkzeuge gefunden!</div>`;
                return;
            }

            container.innerHTML = parsedTools.map((t, idx) => `
                <div class="tool-list-item" onclick="loadToolIntoSim(${idx})">
                    <div class="flex flex-col">
                        <span class="text-sm font-black text-blue-600">${t.number}</span>
                        <span class="text-xs text-slate-500">${t.desc}</span>
                    </div>
                    <div class="bg-blue-100 text-blue-800 px-3 py-1 rounded-full text-[10px]">${t.steps.length} Steps</div>
                </div>
            `).join('');
        }

        function loadToolIntoSim(idx) {
            activeToolIndex = idx;
            activeStepIndex = 0;
            const t = parsedTools[idx];
            document.getElementById('header-tool-name').innerText = `${t.number} | ${t.desc}`;
            if (t.steps.length === 0) t.steps.push({ type: 'G0', x: 0, z: 0, a: null, r: null });

            document.getElementById('view-parser').classList.remove('active');
            document.getElementById('view-sim').classList.add('active');
            
            renderSimList();
            setTimeout(autoFit, 100);
        }

        function backToParser() {
            document.getElementById('view-sim').classList.remove('active');
            document.getElementById('view-parser').classList.add('active');
        }

        // ================= EDITOR LIST =================
        function renderSimList() {
            const steps = parsedTools[activeToolIndex].steps;
            const list = document.getElementById('list-container');
            
            list.innerHTML = steps.map((s, i) => `
                <div id="card-${i}" class="t-card ${i === activeStepIndex ? 'active' : ''}" onclick="selectStep(${i})">
                    <div class="t-card-header">
                        <span>N${(i+1)*10}</span>
                        <span>${s.type}</span>
                    </div>
                    <div class="t-card-body">
                        <span class="text-blue-400">X${s.x.toFixed(3)}</span>
                        <span class="text-emerald-400">Z${s.z.toFixed(3)}</span>
                        ${s.a !== null ? `<span class="text-purple-400">A${s.a}</span>` : ''}
                        ${s.r !== null ? `<span class="text-orange-400">R${s.r}</span>` : ''}
                    </div>
                </div>
            `).join('');

            const activeCard = document.getElementById(`card-${activeStepIndex}`);
            if (activeCard) activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

            syncInputsAndGraphics();
        }

        function selectStep(idx) {
            activeStepIndex = idx;
            renderSimList();
        }

        // ================= INPUT HANDLING =================
        function updateActiveStep(key, val) {
            const steps = parsedTools[activeToolIndex].steps;
            const p = steps[activeStepIndex];
            if (!p) return;
            
            if (val === '') {
                p[key] = null; // Позволяет стереть угол или радиус
                if(key === 'x') p.x = 0; // X и Z не могут быть null
                if(key === 'z') p.z = 0;
            } else {
                p[key] = parseFloat(val) || 0;
            }
            
            // Быстрое обновление DOM без потери фокуса
            const card = document.getElementById(`card-${activeStepIndex}`);
            if (card) {
                const body = card.querySelector('.t-card-body');
                body.innerHTML = `
                    <span class="text-blue-400">X${p.x.toFixed(3)}</span>
                    <span class="text-emerald-400">Z${p.z.toFixed(3)}</span>
                    ${p.a !== null ? \`<span class="text-purple-400">A\${p.a}\</span>\` : ''}
                    ${p.r !== null ? \`<span class="text-orange-400">R\${p.r}\</span>\` : ''}
                `;
            }
            syncInputsAndGraphics(true);
        }

        function toggleGMode() {
            const step = parsedTools[activeToolIndex].steps[activeStepIndex];
            if (!step) return;
            step.type = step.type === 'G0' ? 'G1' : 'G0';
            renderSimList();
        }

        function addStep() {
            const steps = parsedTools[activeToolIndex].steps;
            const current = steps[activeStepIndex] || { x: 0, z: 0, type: 'G1' };
            
            // Копируем X и Z, но обнуляем углы и радиусы для нового кадра
            const newStep = { type: current.type, x: current.x, z: current.z, a: null, r: null };
            steps.splice(activeStepIndex + 1, 0, newStep);
            activeStepIndex++;
            renderSimList();
        }

        function deleteStep() {
            const steps = parsedTools[activeToolIndex].steps;
            if (steps.length <= 1) return;
            
            steps.splice(activeStepIndex, 1);
            if (activeStepIndex >= steps.length) activeStepIndex = steps.length - 1;
            renderSimList();
        }

        // ================= GRAPHICS =================
        function syncInputsAndGraphics(skipInputUpdate = false) {
            const steps = parsedTools[activeToolIndex].steps;
            const p = steps[activeStepIndex];
            if (!p) return;

            if (!skipInputUpdate) {
                document.getElementById('inp-x').value = p.x;
                document.getElementById('inp-z').value = p.z;
                document.getElementById('inp-a').value = p.a !== null ? p.a : '';
                document.getElementById('inp-r').value = p.r !== null ? p.r : '';
            }
            
            const btnG = document.getElementById('btn-toggle-g');
            btnG.innerText = p.type;
            if (p.type === 'G0') {
                btnG.classList.add('is-g0'); btnG.classList.remove('is-g1');
            } else {
                btnG.classList.add('is-g1'); btnG.classList.remove('is-g0');
            }

            document.getElementById('ui-x').innerText = p.x.toFixed(3);
            document.getElementById('ui-z').innerText = p.z.toFixed(3);

            document.getElementById('layer-tool').setAttribute('transform', `translate(${p.z}, ${-p.x/2})`);

            const trace = document.getElementById('layer-trace');
            trace.innerHTML = '';
            for (let i = 1; i <= activeStepIndex; i++) {
                const p1 = steps[i-1], p2 = steps[i];
                const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                l.setAttribute('x1', p1.z); l.setAttribute('y1', -p1.x/2);
                l.setAttribute('x2', p2.z); l.setAttribute('y2', -p2.x/2);
                l.setAttribute('stroke', p2.type === 'G0' ? '#64748b' : '#fbbf24');
                l.setAttribute('stroke-width', p2.type === 'G0' ? '0.3' : '0.6');
                if (p2.type === 'G0') l.setAttribute('stroke-dasharray', '1,1');
                trace.appendChild(l);
            }
        }

        // ================= UTILS & CAMERA =================
        function zoom(factor) { currentScale *= factor; applyCam(); }
        let camX = 150, camY = 150;
        function applyCam() { document.getElementById('camera').setAttribute('transform', `translate(${camX}, ${camY}) scale(${currentScale})`); }

        function autoFit() {
            const steps = parsedTools[activeToolIndex]?.steps;
            if (!steps || steps.length === 0) return;
            
            const w = document.getElementById('sim-area').clientWidth;
            const h = document.getElementById('sim-area').clientHeight;
            
            let minZ = steps[0].z, maxZ = minZ, minX = -steps[0].x/2, maxX = minX;
            steps.forEach(p => {
                if (p.z < minZ) minZ = p.z; if (p.z > maxZ) maxZ = p.z;
                let rx = -p.x/2; if (rx < minX) minX = rx; if (rx > maxX) maxX = rx;
            });

            const pad = 10;
            minZ -= pad; maxZ += pad; minX -= pad; maxX += pad;
            
            let sc = Math.min(w / (maxZ - minZ || 1), h / (maxX - minX || 1));
            currentScale = Math.max(1, Math.min(sc, 20));

            const cx = (minZ + maxZ) / 2, cy = (minX + maxX) / 2;
            camX = w/2 - cx*currentScale;
            camY = h/2 - cy*currentScale;
            
            applyCam();
        }

        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function saveToolConfig() {
            const mount = document.getElementById('tool-mount').value;
            const h = document.getElementById('t-hold'), i = document.getElementById('t-ins');
            if (mount === 'OD') { 
                i.setAttribute('points', '0,0 -4,-6 4,-6'); h.setAttribute('points', '-4,-6 -4,-25 15,-25 15,-6');
            } else { 
                i.setAttribute('points', '0,0 -4,6 4,6'); h.setAttribute('points', '-4,6 -4,25 15,25 15,6');
            }
            closeModal('mod-tool');
        }

        window.onload = () => parseGCode();
    </script>
</body>
</html>
