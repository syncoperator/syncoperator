<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura Premium OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #020617; color: #f8fafc; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }
        .premium-gradient { background: linear-gradient(135deg, #0f172a 0%, #020617 100%); }
        .canvas-grid { background-image: 
            linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-premium { background: #1e293b; border-bottom: 4px solid #000; transition: all 0.1s; position: relative; overflow: hidden; }
        .btn-premium:active { transform: translateY(2px); border-bottom-width: 1px; }
        .btn-premium::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.05); display: none; }
        .btn-premium:active::after { display: block; }
        input { background: #020617 !important; border: 1px solid #334155 !important; color: #22d3ee !important; font-size: 18px !important; padding: 14px !important; border-radius: 12px !important; width: 100%; font-family: monospace; }
        footer { padding-bottom: calc(10px + var(--sab)); }
        .line-g0 { stroke-dasharray: 4; stroke: rgba(255,255,255,0.15); stroke-width: 1; }
        .line-g1 { stroke: #fbbf24; stroke-width: 2; stroke-linecap: round; }
        .line-angle { stroke: #22d3ee; stroke-width: 2.5; }
    </style>
</head>
<body class="antialiased">

    <header class="p-4 flex justify-between items-center glass shrink-0">
        <div class="flex flex-col">
            <h1 class="text-xs font-black tracking-[0.3em] text-white">NAKAMURA <span class="text-cyan-500 underline decoration-2">PREMIUM</span></h1>
            <div id="status-line" class="text-[9px] text-slate-500 font-bold uppercase mt-1 italic tracking-widest">G54 | UPPER REVOLVER | R0.4</div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleSystem()" id="sys-btn" class="px-3 py-1.5 rounded-lg border border-cyan-500/30 text-[9px] font-black bg-cyan-950/20 text-cyan-400">UPPER (G54)</button>
            <button onclick="showModal('m-import')" class="px-3 py-1.5 rounded-lg bg-white text-black text-[9px] font-black uppercase">Import</button>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden canvas-grid">
        <div class="absolute top-4 left-4 z-10 space-y-2 pointer-events-none">
            <div class="glass p-3 rounded-2xl min-w-[120px]">
                <div class="text-[8px] text-slate-500 font-bold uppercase">X Diameter</div>
                <div id="dro-x" class="text-2xl font-mono font-light text-white tracking-tighter">0.000</div>
            </div>
            <div class="glass p-3 rounded-2xl min-w-[120px]">
                <div class="text-[8px] text-slate-500 font-bold uppercase">Z Length</div>
                <div id="dro-z" class="text-2xl font-mono font-light text-white tracking-tighter">0.000</div>
            </div>
        </div>

        <div class="absolute top-4 right-4 z-10 flex flex-col gap-3">
            <button onclick="zoom(1.2)" class="w-12 h-12 glass rounded-full flex items-center justify-center text-xl">+</button>
            <button onclick="zoom(0.8)" class="w-12 h-12 glass rounded-full flex items-center justify-center text-xl">-</button>
            <button onclick="recenter()" class="w-12 h-12 glass rounded-full flex items-center justify-center text-[10px] font-bold">RESET</button>
        </div>

        <svg id="screen" class="w-full h-full touch-none">
            <g id="world" transform="translate(300, 250)">
                <line x1="-3000" y1="0" x2="500" y2="0" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
                <g id="draw-group"></g>
                <circle id="cursor" r="5" fill="#f43f5e" class="animate-pulse" style="display:none" />
            </g>
        </svg>

        <div id="list-view" class="absolute inset-0 bg-slate-950/95 hidden overflow-y-auto p-4 pb-40">
            <div id="elements-list" class="space-y-3"></div>
        </div>
    </main>

    <footer class="glass p-4 grid grid-cols-4 gap-3 shrink-0">
        <button onclick="openEditor('G1')" class="btn-premium h-16 rounded-2xl flex flex-col items-center justify-center">
            <span class="text-xs font-black tracking-widest text-amber-500">G1</span>
            <span class="text-[8px] opacity-40 uppercase">Line</span>
        </button>
        <button onclick="openEditor('A')" class="btn-premium h-16 rounded-2xl flex flex-col items-center justify-center">
            <span class="text-xs font-black tracking-widest text-cyan-400 italic">∠ 45°</span>
            <span class="text-[8px] opacity-40 uppercase">Angle</span>
        </button>
        <button onclick="openEditor('R')" class="btn-premium h-16 rounded-2xl flex flex-col items-center justify-center text-orange-500">
            <span class="text-xs font-black tracking-widest">,R</span>
            <span class="text-[8px] opacity-40 uppercase">Radius</span>
        </button>
        <button id="list-btn" onclick="toggleList()" class="btn-premium h-16 rounded-2xl flex flex-col items-center justify-center">
            <span class="text-xs font-black tracking-widest">LIST</span>
            <span class="text-[8px] opacity-40 uppercase font-bold">Code</span>
        </button>
    </footer>

    <div id="m-edit" class="fixed inset-0 bg-black/98 z-[100] hidden flex-col p-8">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-light tracking-tighter">Geometry <span class="text-cyan-500 font-black italic">EDITOR</span></h2>
                <p class="text-[10px] text-slate-500 uppercase font-bold tracking-widest">Professional Nakamura Input</p>
            </div>
            <button onclick="closeModal('m-edit')" class="text-4xl font-thin">&times;</button>
        </div>
        
        <div class="space-y-8">
            <div class="grid grid-cols-2 gap-6">
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase">Target X (Diam)</label>
                    <input id="ix" type="number" step="0.001" placeholder="0.000">
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase">Target Z (Length)</label>
                    <input id="iz" type="number" step="0.001" placeholder="0.000">
                </div>
            </div>

            <div class="glass p-6 rounded-3xl space-y-4">
                <div class="flex justify-between items-center">
                    <label class="text-[10px] font-black text-cyan-500 uppercase tracking-widest">Manual Angle (∠)</label>
                    <div class="flex bg-black p-1 rounded-lg">
                        <button onclick="setAngleDir('in')" id="dir-in" class="px-4 py-2 text-[10px] font-bold rounded-md bg-cyan-600">В МЯСО ↙</button>
                        <button onclick="setAngleDir('out')" id="dir-out" class="px-4 py-2 text-[10px] font-bold rounded-md">НАРУЖУ ↖</button>
                    </div>
                </div>
                <input id="ia" type="number" step="0.1" placeholder="Угол с чертежа (напр. 45)">
            </div>

            <div class="space-y-2">
                <label class="text-[10px] font-black text-orange-500 uppercase tracking-widest">Smoothing (,R)</label>
                <input id="ir" type="number" step="0.01" placeholder="0.00">
            </div>

            <button onclick="saveStep()" class="w-full bg-white text-black h-20 rounded-[30px] font-black text-xl uppercase tracking-widest active:scale-95 transition-transform">Save Element</button>
            <button onclick="clearContour()" class="w-full text-red-600 text-[10px] font-bold uppercase tracking-widest pt-4">Reset All Steps</button>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-black z-[110] hidden flex-col p-6">
        <h3 class="text-center font-black text-xs tracking-widest text-white mb-6 uppercase">Paste G-Code Block</h3>
        <textarea id="import-area" class="flex-1 bg-slate-900/50 border border-white/5 p-6 rounded-3xl text-green-400 font-mono text-xs leading-relaxed outline-none" placeholder="G1 X40. Z-20. ,A150 ..."></textarea>
        <div class="grid grid-cols-2 gap-4 mt-6">
            <button onclick="closeModal('m-import')" class="p-6 rounded-2xl bg-slate-800 font-bold uppercase text-[10px]">Cancel</button>
            <button onclick="processImport()" class="p-6 rounded-2xl bg-cyan-600 font-bold uppercase text-[10px]">Analyze & Draw</button>
        </div>
    </div>

    <script>
        let contour = [{ x: 40, z: 2, a: null, r: 0, type: 'G0' }];
        let system = 'UPPER'; // UPPER or LOWER
        let angleDir = 'in';
        let currentScale = 8;
        let viewOffset = 350;
        let editIdx = -1;

        function toggleSystem() {
            system = (system === 'UPPER') ? 'LOWER' : 'UPPER';
            document.getElementById('sys-btn').innerText = `${system} (G5${system==='UPPER'?'4':'5'})`;
            document.getElementById('status-line').innerText = `${system} REVOLVER | NAKAMURA MODE`;
            document.getElementById('sys-btn').classList.toggle('text-cyan-400', system==='UPPER');
            document.getElementById('sys-btn').classList.toggle('text-amber-400', system==='LOWER');
            update();
        }

        function setAngleDir(d) {
            angleDir = d;
            document.getElementById('dir-in').classList.toggle('bg-cyan-600', d === 'in');
            document.getElementById('dir-out').classList.toggle('bg-cyan-600', d === 'out');
        }

        function toggleList() {
            const lv = document.getElementById('list-view');
            lv.classList.toggle('hidden');
            document.getElementById('list-btn').classList.toggle('bg-cyan-900', !lv.classList.contains('hidden'));
            if(!lv.classList.contains('hidden')) renderList();
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function openEditor(type) {
            editIdx = -1;
            let last = contour[contour.length-1];
            document.getElementById('ix').value = last.x;
            document.getElementById('iz').value = '';
            document.getElementById('ia').value = '';
            document.getElementById('ir').value = '';
            showModal('m-edit');
        }

        function saveStep() {
            let deg = parseFloat(document.getElementById('ia').value);
            let finalA = null;
            if(!isNaN(deg)) {
                if(system === 'UPPER') finalA = (angleDir === 'in') ? (180+deg) : (180-deg);
                else finalA = (angleDir === 'in') ? (180-deg) : (180+deg);
            }
            let data = {
                x: parseFloat(document.getElementById('ix').value) || 0,
                z: document.getElementById('iz').value === '' ? null : parseFloat(document.getElementById('iz').value),
                a: finalA,
                r: parseFloat(document.getElementById('ir').value) || 0,
                type: 'G1'
            };
            if(editIdx === -1) contour.push(data); else contour[editIdx] = data;
            closeModal('m-edit');
            update();
        }

        function update() {
            redraw();
            if(!document.getElementById('list-view').classList.contains('hidden')) renderList();
        }

        function renderList() {
            const container = document.getElementById('elements-list');
            container.innerHTML = contour.map((el, i) => `
                <div onclick="editExisting(${i})" class="glass p-5 rounded-3xl flex justify-between items-center active:scale-95 transition-all">
                    <div class="font-mono text-[11px]">
                        <span class="text-slate-500 font-black italic">#${i} ${el.type}</span><br>
                        <span class="text-white">X${el.x.toFixed(3)}</span> 
                        ${el.z!==null?`<span class="text-white">Z${el.z.toFixed(3)}</span>`:''}
                        ${el.a!==null?`<span class="text-cyan-400">,A${el.a}</span>`:''}
                        ${el.r>0?`<span class="text-orange-500">,R${el.r}</span>`:''}
                    </div>
                    <button onclick="event.stopPropagation();contour.splice(${i},1);update();" class="text-red-500/30 text-2xl font-thin px-4">&times;</button>
                </div>
            `).join('');
        }

        function editExisting(i) {
            editIdx = i;
            let el = contour[i];
            document.getElementById('ix').value = el.x;
            document.getElementById('iz').value = el.z ?? '';
            document.getElementById('ia').value = '';
            document.getElementById('ir').value = el.r || '';
            showModal('m-edit');
        }

        function redraw() {
            const group = document.getElementById('draw-group');
            group.innerHTML = '';
            let cx = 0, cz = 0;
            document.getElementById('world').setAttribute('transform', `translate(${viewOffset}, 250)`);

            contour.forEach((el, i) => {
                let nx = el.x, nz = el.z;
                if(el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx)/2) / Math.tan(rad);
                }
                if(nz === null) nz = cz;
                if(i > 0) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", cz * currentScale); line.setAttribute("y1", -(cx/2) * currentScale);
                    line.setAttribute("x2", nz * currentScale); line.setAttribute("y2", -(nx/2) * currentScale);
                    line.className.baseVal = (el.type === 'G0') ? 'line-g0' : (el.a ? 'line-g1 line-angle' : 'line-g1');
                    group.appendChild(line);
                }
                cx = nx; cz = nz;
                if(i === contour.length - 1) {
                    const c = document.getElementById('cursor');
                    c.setAttribute('cx', cz * currentScale); c.setAttribute('cy', -(cx/2) * currentScale); c.style.display = 'block';
                    document.getElementById('dro-x').innerText = cx.toFixed(3);
                    document.getElementById('dro-z').innerText = cz.toFixed(3);
                }
            });
        }

        function zoom(f) { currentScale *= f; redraw(); }
        function recenter() { 
            let minZ = Math.min(...contour.map(e => e.z || 0));
            viewOffset = Math.abs(minZ * currentScale) + 200;
            redraw(); 
        }

        function processImport() {
            const text = document.getElementById('import-area').value.toUpperCase();
            if(text.includes('G55') || text.includes('B-90')) {
                system = 'LOWER';
                document.getElementById('sys-btn').innerText = 'LOWER (G55)';
            }
            contour = [];
            text.split('\n').forEach(line => {
                if(!/X|Z|A/.test(line)) return;
                const xM = line.match(/X(-?\d*\.?\d+)/), zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/), rM = line.match(/,R(-?\d*\.?\d+)/);
                contour.push({
                    x: xM ? parseFloat(xM[1]) : (contour.length?contour[contour.length-1].x:0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closeModal('m-import'); update(); recenter();
        }

        function clearContour() { if(confirm('Full Reset?')) { contour=[{x:40,z:2,a:null,r:0,type:'G0'}]; update(); closeModal('m-edit'); } }
        window.onload = () => { update(); recenter(); };
    </script>
</body>
</html>
