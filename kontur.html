<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura OS Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #010409; color: #e6edf3; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .canvas-container { position: relative; flex: 1; background: radial-gradient(circle at center, #0d1117 0%, #010409 100%); overflow: hidden; }
        .grid-layer { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 30px 30px; pointer-events: none; }
        
        /* Стили карточек из Saved Info */
        .tool-card { background: rgba(22, 27, 34, 0.7); border: 1px solid rgba(48, 54, 61, 0.8); backdrop-filter: blur(8px); border-radius: 12px; padding: 10px; margin-bottom: 8px; }
        .t-nr { font-size: 9px; font-weight: bold; color: #8b949e; text-transform: uppercase; margin-bottom: 2px; }
        .t-desc { font-size: 14px; font-weight: 800; color: #ffffff; }
        
        .floating-ui { position: absolute; bottom: 0; left: 0; right: 0; max-height: 45%; overflow-y: auto; padding: 15px; background: linear-gradient(to top, #010409 80%, transparent); z-index: 50; }
        .btn-action { height: 55px; border-radius: 14px; background: #21262d; border: 1px solid #30363d; font-weight: 700; transition: 0.1s; }
        .btn-action:active { background: #30363d; transform: scale(0.98); }
        
        /* Визуализация инструмента */
        .tool-shape { fill: rgba(31, 111, 235, 0.4); stroke: #58a6ff; stroke-width: 1; }
        footer { padding-bottom: calc(10px + var(--sab)); background: #0d1117; border-top: 1px solid #30363d; }
    </style>
</head>
<body>

    <div class="absolute top-0 left-0 right-0 p-4 z-[60] flex justify-between items-start pointer-events-none">
        <div class="pointer-events-auto">
            <div class="tool-card w-48">
                <div class="t-nr">SYSTEM STATUS</div>
                <div id="sys-label" class="t-desc text-cyan-400">UPPER / G54</div>
            </div>
            <div class="tool-card w-48 mt-2">
                <div class="t-nr">TOOL INFO</div>
                <div id="tool-name" class="t-desc text-xs">VBMT R0.4 (L:32 W:3)</div>
            </div>
        </div>
        <div class="flex flex-col gap-2 pointer-events-auto">
            <button onclick="toggleTurret()" class="bg-blue-600 px-4 py-2 rounded-full text-[10px] font-black uppercase">Switch Turret</button>
            <button onclick="showModal('m-import')" class="bg-slate-700 px-4 py-2 rounded-full text-[10px] font-black uppercase">Import .O</button>
        </div>
    </div>

    <div class="canvas-container">
        <div class="grid-layer"></div>
        <svg id="viewport" class="w-full h-full touch-none">
            <g id="scene" transform="translate(300, 250) scale(6)">
                <rect id="stock" x="-150" y="-25" width="200" height="50" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.1)" stroke-dasharray="2" />
                <line x1="-1000" y1="0" x2="1000" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="0.2" />
                
                <g id="path-group"></g>
                <g id="tool-group">
                    <path id="tool-path" class="tool-shape" d="M 0 0 L -5 -3 L -10 0 L -5 3 Z" />
                </g>
            </g>
        </svg>
    </div>

    <div class="floating-ui" id="list-container">
        <div id="steps-list">
            </div>
        <div style="height: 60px;"></div> </div>

    <footer class="p-3 grid grid-cols-4 gap-2 z-[70]">
        <button onclick="addStep('G1')" class="btn-action text-amber-500">G1</button>
        <button onclick="addStep('A')" class="btn-action text-cyan-400">∠ A</button>
        <button onclick="addStep('R')" class="btn-action text-orange-400">,R</button>
        <button onclick="autoRecenter()" class="btn-action text-white">CENTER</button>
    </footer>

    <div id="m-edit" class="fixed inset-0 bg-black/95 z-[100] hidden p-6 flex flex-col justify-center">
        <div class="tool-card mb-6">
            <div class="t-nr italic">Geometry Editor</div>
            <div class="t-desc">НАСТРОЙКА КАДРА</div>
        </div>
        <div class="grid grid-cols-2 gap-4 mb-4">
            <input id="ix" type="number" step="0.001" class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-white" placeholder="X Dia">
            <input id="iz" type="number" step="0.001" class="bg-slate-900 border border-slate-700 p-4 rounded-xl text-white" placeholder="Z Pos">
        </div>
        <div class="tool-card space-y-4">
            <div class="flex gap-2">
                <button onclick="setDir('in')" id="d-in" class="flex-1 p-2 bg-blue-600 rounded text-[10px] font-bold">В МЯСО (↙)</button>
                <button onclick="setDir('out')" id="d-out" class="flex-1 p-2 bg-slate-800 rounded text-[10px] font-bold">НАРУЖУ (↖)</button>
            </div>
            <input id="ia" type="number" class="w-full bg-slate-950 p-3 rounded border border-slate-700" placeholder="Угол с чертежа (45, 30...)">
        </div>
        <div class="flex gap-2 mt-6">
            <button onclick="closeModal('m-edit')" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold">ОТМЕНА</button>
            <button onclick="saveStep()" class="flex-1 p-4 bg-blue-600 rounded-xl font-bold">СОХРАНИТЬ</button>
        </div>
    </div>

    <div id="m-import" class="fixed inset-0 bg-black z-[110] hidden p-4 flex flex-col">
        <textarea id="import-area" class="flex-1 bg-slate-900 text-green-400 p-4 font-mono text-xs rounded-xl" placeholder="Вставь текст программы..."></textarea>
        <div class="flex gap-3 py-4">
            <button onclick="closeModal('m-import')" class="flex-1 p-4 bg-slate-800 rounded-xl font-bold">НАЗАД</button>
            <button onclick="doImport()" class="flex-1 p-4 bg-blue-600 rounded-xl font-bold">ЗАГРУЗИТЬ</button>
        </div>
    </div>

    <script>
        let contour = [{ x: 37, z: 2, a: null, r: 0, type: 'G0' }];
        let turret = 'UPPER'; 
        let angleDir = 'in';
        let scale = 6;
        let editIdx = -1;

        function toggleTurret() {
            turret = (turret === 'UPPER') ? 'LOWER' : 'UPPER';
            document.getElementById('sys-label').innerText = turret + (turret === 'UPPER' ? ' / G54' : ' / G55');
            update();
        }

        function setDir(d) {
            angleDir = d;
            document.getElementById('d-in').className = d==='in' ? 'flex-1 p-2 bg-blue-600 rounded text-[10px] font-bold' : 'flex-1 p-2 bg-slate-800 rounded text-[10px] font-bold';
            document.getElementById('d-out').className = d==='out' ? 'flex-1 p-2 bg-blue-600 rounded text-[10px] font-bold' : 'flex-1 p-2 bg-slate-800 rounded text-[10px] font-bold';
        }

        function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function addStep(t) { editIdx = -1; showModal('m-edit'); }

        function saveStep() {
            let deg = parseFloat(document.getElementById('ia').value);
            let finalA = null;
            if(!isNaN(deg)) {
                if(turret === 'UPPER') finalA = (angleDir === 'in') ? (180+deg) : (180-deg);
                else finalA = (angleDir === 'in') ? (180-deg) : (180+deg);
            }
            let step = {
                x: parseFloat(document.getElementById('ix').value) || 0,
                z: document.getElementById('iz').value === '' ? null : parseFloat(document.getElementById('iz').value),
                a: finalA,
                r: parseFloat(document.getElementById('ir').value) || 0,
                type: 'G1'
            };
            if(editIdx === -1) contour.push(step); else contour[editIdx] = step;
            closeModal('m-edit');
            update();
            autoRecenter();
        }

        function update() {
            renderList();
            redraw();
        }

        function renderList() {
            const list = document.getElementById('steps-list');
            list.innerHTML = contour.map((el, i) => `
                <div class="tool-card flex justify-between items-center" onclick="editExisting(${i})">
                    <div>
                        <div class="t-nr">KADR #${i} | ${el.type}</div>
                        <div class="t-desc text-xs">X${el.x.toFixed(2)} ${el.z!==null?'Z'+el.z.toFixed(2):''} ${el.a?',A'+el.a:''}</div>
                    </div>
                    <button onclick="event.stopPropagation();contour.splice(${i},1);update();" class="text-red-900 font-bold px-3">✕</button>
                </div>
            `).join('');
        }

        function editExisting(i) {
            editIdx = i;
            let el = contour[i];
            document.getElementById('ix').value = el.x;
            document.getElementById('iz').value = el.z ?? '';
            document.getElementById('ia').value = '';
            showModal('m-edit');
        }

        function redraw() {
            const g = document.getElementById('path-group');
            g.innerHTML = '';
            let cx = 0, cz = 0;

            contour.forEach((el, i) => {
                let nx = el.x, nz = el.z;
                if(el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx)/2) / Math.tan(rad);
                }
                if(nz === null) nz = cz;
                if(i > 0) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", cz); line.setAttribute("y1", -cx/2);
                    line.setAttribute("x2", nz); line.setAttribute("y2", -nx/2);
                    line.setAttribute("stroke", el.type === 'G0' ? "rgba(255,255,255,0.1)" : "#fbbf24");
                    line.setAttribute("stroke-width", el.type === 'G0' ? "0.2" : "0.8");
                    if(el.a) line.setAttribute("stroke", "#22d3ee");
                    g.appendChild(line);
                }
                cx = nx; cz = nz;
                if(i === contour.length - 1) {
                    document.getElementById('tool-group').setAttribute('transform', `translate(${cz}, ${-cx/2})`);
                }
            });
        }

        function autoRecenter() {
            let zValues = contour.map(e => e.z).filter(v => v !== null);
            let minZ = zValues.length ? Math.min(...zValues) : -50;
            let moveZ = Math.abs(minZ) * scale + 200;
            document.getElementById('scene').setAttribute('transform', `translate(${moveZ}, 250) scale(${scale})`);
            redraw();
        }

        function doImport() {
            const raw = document.getElementById('import-area').value.toUpperCase();
            if(raw.includes('G55')) { turret = 'LOWER'; toggleTurret(); toggleTurret(); }
            contour = [];
            raw.split('\n').forEach(line => {
                if(!/X|Z|A/.test(line)) return;
                const xM = line.match(/X(-?\d*\.?\d+)/), zM = line.match(/Z(-?\d*\.?\d+)/);
                const aM = line.match(/,A(-?\d*\.?\d+)/), rM = line.match(/,R(-?\d*\.?\d+)/);
                contour.push({
                    x: xM ? parseFloat(xM[1]) : (contour.length?contour[contour.length-1].x:0),
                    z: zM ? parseFloat(zM[1]) : null,
                    a: aM ? parseFloat(aM[1]) : null,
                    r: rM ? parseFloat(rM[1]) : 0,
                    type: line.includes('G0') ? 'G0' : 'G1'
                });
            });
            closeModal('m-import'); update(); autoRecenter();
        }

        window.onload = update;
    </script>
</body>
</html>
