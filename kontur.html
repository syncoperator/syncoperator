<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura v12 Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #010409; color: #e6edf3; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; font-family: 'Inter', sans-serif; }
        
        /* Tool Cards Horizontal Ribbon [cite: 2026-02-04] */
        .ribbon { display: flex; overflow-x: auto; gap: 8px; padding: 10px; background: #0d1117; border-top: 1px solid #30363d; scrollbar-width: none; }
        .t-card { min-width: 140px; background: #161b22; border-radius: 8px; padding: 8px; border: 1px solid #30363d; flex-shrink: 0; }
        .t-card.active { border-color: #2f81f7; background: #0d1117; }
        .t-nr { font-size: 8px; color: #8b949e; font-weight: 800; text-transform: uppercase; }
        .t-desc { font-size: 14px; font-weight: 900; color: #fff; margin-top: 2px; }
        
        .glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(15px); border-bottom: 1px solid #30363d; }
        input, select { background: #0d1117 !important; border: 1px solid #30363d !important; color: #58a6ff !important; padding: 10px; border-radius: 8px; font-weight: 700; width: 100%; }
        
        #viewport { background-color: #010409; background-image: linear-gradient(#161b22 1px, transparent 1px), linear-gradient(90deg, #161b22 1px, transparent 1px); background-size: 40px 40px; }
        .btn-ui { background: #21262d; border: 1px solid #30363d; border-radius: 10px; font-size: 11px; font-weight: 800; color: #c9d1d9; }
        
        .modal { background: rgba(0,0,0,0.9); position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; p: 20px; }
        .modal-box { background: #0d1117; border: 1px solid #30363d; border-radius: 16px; width: 100%; max-width: 400px; padding: 24px; }
        
        /* [cite: 2026-02-04] Padding-bottom adjustment */
        .spacer { height: calc(20px + var(--sab)); }
    </style>
</head>
<body>

    <header class="p-4 glass z-[100] flex justify-between items-center">
        <div>
            <div id="turret-txt" class="text-[9px] font-black text-blue-500 tracking-[0.2em] uppercase">G54 | UPPER REVOLVER</div>
            <div class="flex gap-6 mt-1 font-mono text-2xl font-bold">
                <div class="flex items-baseline"><span class="text-xs mr-1 opacity-50">X</span><span id="valX">0.000</span></div>
                <div class="flex items-baseline"><span class="text-xs mr-1 opacity-50">Z</span><span id="valZ">0.000</span></div>
            </div>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleTurret()" class="btn-ui px-4 py-2">TURRET</button>
            <button onclick="showM('m-tool')" class="btn-ui px-4 py-2 text-blue-400">WERKZEUG</button>
            <button onclick="showM('m-import')" class="btn-ui px-4 py-2 bg-blue-600 !text-white">IMPORT</button>
        </div>
    </header>

    <main id="viewport" class="flex-1 relative overflow-hidden">
        <div class="absolute top-4 right-4 z-10 flex flex-col gap-2">
            <button onclick="zoom(1.2)" class="w-12 h-12 btn-ui text-xl">+</button>
            <button onclick="zoom(0.8)" class="w-12 h-12 btn-ui text-xl">-</button>
            <button onclick="autoFit()" class="w-12 h-12 btn-ui text-[9px]">FIT</button>
        </div>
        
        <svg id="svg" class="w-full h-full">
            <g id="world" transform="translate(100, 300) scale(15)">
                <line x1="-1000" y1="0" x2="1000" y2="0" stroke="#1c2128" stroke-width="0.1" />
                <g id="trace"></g>
                <g id="tool" style="transition: transform 0.1s linear">
                    <path id="t-halter" fill="#2d333b" stroke="#444c56" stroke-width="0.08" />
                    <path id="t-insert" fill="#f2cc60" stroke="#fff" stroke-width="0.12" />
                    <circle r="0.1" fill="#ff7b72" />
                </g>
            </g>
        </svg>
    </main>

    <div id="program-ribbon" class="ribbon scrollbar-hide">
        </div>

    <footer class="p-4 grid grid-cols-4 gap-2 bg-[#0d1117]">
        <button onclick="add('G1')" class="h-14 btn-ui text-amber-500">G1 LINEAR</button>
        <button onclick="add('G33')" class="h-14 btn-ui text-blue-400">G33 GEWINDE</button>
        <button onclick="add('G75')" class="h-14 btn-ui text-emerald-500">G75 STICH</button>
        <button onclick="resetApp()" class="h-14 btn-ui text-red-500">RESET</button>
    </footer>
    <div class="spacer"></div>

    <div id="m-tool" class="modal">
        <div class="modal-box">
            <h2 class="text-xl font-black text-blue-500 mb-6 uppercase italic">Werkzeug-Setup</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Bearbeitungsrichtung</label>
                    <select id="t-side" onchange="drawTool()">
                        <option value="outside">Außen (OD Turning)</option>
                        <option value="inside">Innen (ID Boring)</option>
                    </select>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Spitzenwinkel (°)</label>
                        <input id="t-angle" type="number" value="55" oninput="drawTool()">
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Platten-Länge</label>
                        <input id="t-size" type="number" value="10" oninput="drawTool()">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div><label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Halter-B</label><input id="t-hw" type="number" value="8" oninput="drawTool()"></div>
                    <div><label class="text-[10px] font-bold text-slate-500 block mb-1 uppercase">Halter-L</label><input id="t-hl" type="number" value="30" oninput="drawTool()"></div>
                </div>
                <button onclick="closeM('m-tool')" class="w-full bg-blue-600 h-14 rounded-xl font-black text-white mt-4 uppercase">Übernehmen</button>
            </div>
        </div>
    </div>

    <div id="m-import" class="modal">
        <div class="modal-box !max-w-lg">
            <textarea id="imp-txt" class="w-full h-64 bg-black border border-slate-800 rounded-lg p-4 font-mono text-xs text-green-500" placeholder="G-Code..."></textarea>
            <div class="flex gap-2 mt-4">
                <button onclick="closeM('m-import')" class="flex-1 btn-ui h-12">Abbrechen</button>
                <button onclick="doImport()" class="flex-1 bg-white text-black font-black rounded-xl uppercase">Analysieren</button>
            </div>
        </div>
    </div>

    <script>
        let steps = [{ x: 60, z: 2, type: 'G0', mx: true, mz: true }];
        let activeIdx = 0, scale = 15, turret = 'UPPER';

        function toggleTurret() {
            turret = (turret === 'UPPER') ? 'LOWER' : 'UPPER';
            document.getElementById('turret-txt').innerText = `G5${turret==='UPPER'?'4':'5'} | ${turret} REVOLVER`;
            drawTool(); update();
        }

        function drawTool() {
            const side = document.getElementById('t-side').value;
            const angle = parseFloat(document.getElementById('t-angle').value);
            const size = parseFloat(document.getElementById('t-size').value);
            const hw = parseFloat(document.getElementById('t-hw').value);
            const hl = parseFloat(document.getElementById('t-hl').value);
            
            const insert = document.getElementById('t-insert');
            const halter = document.getElementById('t-halter');
            const flip = (turret === 'UPPER') ? 1 : -1;
            const idMode = (side === 'inside') ? -1 : 1;

            // Расчет вертикальной пластины [cite: 2026-02-04]
            const rad = (angle/2) * (Math.PI/180);
            const dx = size/2 * Math.sin(rad);
            const dy = size/2 * Math.cos(rad);

            // Пластина (направление зависит от Outside/Inside)
            insert.setAttribute('d', `M 0 0 L ${-dx} ${dy*flip*idMode} L 0 ${dy*2*flip*idMode} L ${dx} ${dy*flip*idMode} Z`);
            
            // Державка (всегда уходит вверх/вниз и назад по Z)
            halter.setAttribute('d', `M ${-dx} ${dy*flip*idMode} L ${-hl} ${dy*flip*idMode} L ${-hl} ${(dy+hw)*flip*idMode} L ${-dx} ${(dy+hw)*flip*idMode} Z`);
        }

        function doImport() {
            const lines = document.getElementById('imp-txt').value.toUpperCase().split('\n');
            steps = []; let lx = 60, lz = 2;
            lines.forEach(l => {
                if(!/X|Z/.test(l)) return;
                const xm = l.match(/X(-?\d*\.?\d+)/), zm = l.match(/Z(-?\d*\.?\d+)/);
                const cx = xm ? parseFloat(xm[1]) : lx, cz = zm ? parseFloat(zm[1]) : lz;
                steps.push({ x: cx, z: cz, type: l.includes('G0')?'G0':'G1', mx: !!xm, mz: !!zm });
                lx = cx; lz = cz;
            });
            closeM('m-import'); update(); autoFit();
        }

        function update() {
            const rb = document.getElementById('program-ribbon');
            rb.innerHTML = steps.map((s, i) => `
                <div class="t-card ${i===activeIdx?'active':''}" onclick="goto(${i})">
                    <span class="t-nr">KADRE ${i+1} | ${s.type}</span>
                    <div class="t-desc">${s.mx?'X'+s.x.toFixed(2):''} ${s.mz?'Z'+s.z.toFixed(2):''}</div>
                </div>
            `).join('');
            renderTrace();
        }

        function goto(i) {
            activeIdx = i; const s = steps[i];
            document.getElementById('tool').setAttribute('transform', `translate(${s.z}, ${-s.x/2})`);
            document.getElementById('valX').innerText = s.x.toFixed(3);
            document.getElementById('valZ').innerText = s.z.toFixed(3);
            update();
        }

        function renderTrace() {
            const g = document.getElementById('trace'); g.innerHTML = '';
            steps.forEach((s, i) => {
                if(i === 0) return;
                const p = steps[i-1];
                const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l.setAttribute("x1", p.z); l.setAttribute("y1", -p.x/2);
                l.setAttribute("x2", s.z); l.setAttribute("y2", -s.x/2);
                l.setAttribute("stroke", s.type==='G0'?'#21262d':'#d29922');
                l.setAttribute("stroke-width", "0.25");
                g.appendChild(l);
            });
        }

        function autoFit() {
            const zs = steps.map(s => s.z), xs = steps.map(s => -s.x/2);
            const minZ = Math.min(...zs), maxZ = Math.max(...zs);
            const minX = Math.min(...xs), maxX = Math.max(...xs);
            const w = document.getElementById('viewport').clientWidth, h = document.getElementById('viewport').clientHeight;
            scale = Math.min(w/(Math.abs(maxZ-minZ)||50), h/(Math.abs(maxX-minX)||50)) * 0.7;
            document.getElementById('world').setAttribute('transform', `translate(${w/2 - ((minZ+maxZ)/2)*scale}, ${h/2 - ((minX+maxX)/2)*scale}) scale(${scale})`);
        }

        function showM(id) { document.getElementById(id).style.display = 'flex'; }
        function closeM(id) { document.getElementById(id).style.display = 'none'; }
        function zoom(v) { scale *= v; const t = document.getElementById('world').getAttribute('transform').split('scale')[0]; document.getElementById('world').setAttribute('transform', `${t} scale(${scale})`); }
        window.onload = () => { drawTool(); update(); autoFit(); };
    </script>
</body>
</html>
