<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nakamura Dialod Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .siemens-bg { background: #003a5d; } /* Классический цвет Siemens */
        .siemens-input { background: #e2e8f0; color: #1a202c; border: 1px solid #4a5568; }
        .grid-bg { background-image: radial-gradient(#2d3748 1px, transparent 1px); background-size: 20px 20px; background-color: #050505; }
    </style>
</head>
<body class="bg-gray-900 text-white h-screen flex flex-col overflow-hidden font-sans">

    <header class="siemens-bg p-3 border-b border-blue-400 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-4">
            <span class="font-black italic text-xl">SINUMERIK</span>
            <span class="bg-blue-500 text-[10px] px-2 py-0.5 rounded">CONTOUR EDITOR</span>
        </div>
        <button onclick="processCode()" class="bg-orange-500 hover:bg-orange-400 px-6 py-1 rounded font-bold text-sm transition-all">GENERATE G-CODE</button>
    </header>

    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        
        <div class="flex-1 relative grid-bg overflow-hidden border-r border-gray-800">
            <svg id="canvas" class="w-full h-full cursor-move">
                <g id="viewport" transform="translate(100, 300)">
                    <line x1="-1000" y1="0" x2="1000" y2="0" stroke="#1e293b" stroke-width="1" />
                    <g id="path-group"></g>
                    <circle id="target-point" r="5" fill="#00f2ff" style="display:none shadow: 0 0 10px #00f2ff" />
                </g>
            </svg>
        </div>

        <div class="w-full md:w-96 bg-gray-200 text-slate-800 flex flex-col shadow-inner">
            <div class="bg-slate-700 text-white p-2 text-xs font-bold uppercase tracking-widest">
                Input Element Properties
            </div>
            
            <div id="inspector" class="p-4 flex flex-col gap-4">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Target X (Diameter)</label>
                    <input type="number" id="inpX" class="siemens-input w-full p-2 text-lg font-mono outline-none focus:ring-2 ring-blue-400" step="0.1">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Target Z (Length)</label>
                    <input type="number" id="inpZ" class="siemens-input w-full p-2 text-lg font-mono outline-none focus:ring-2 ring-blue-400" step="0.1">
                </div>
                <div class="space-y-1 border-t pt-4">
                    <label class="text-[10px] font-bold text-blue-600 uppercase">Angle ,A (Fanuc Polar)</label>
                    <div class="flex gap-2">
                        <input type="number" id="inpA" class="siemens-input flex-1 p-2 text-lg font-mono font-bold text-blue-700" placeholder="e.g. 225">
                        <div id="angle-hint" class="bg-blue-100 p-2 text-[10px] w-24 leading-tight border border-blue-200">
                            180° = Left<br>225° = Left-Down
                        </div>
                    </div>
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-slate-500 uppercase">Radius ,R</label>
                    <input type="number" id="inpR" class="siemens-input w-full p-2 text-lg font-mono">
                </div>
                <button onclick="updateSelectedLine()" class="mt-4 bg-slate-800 text-white p-3 font-bold hover:bg-black transition">APPLY CHANGES</button>
            </div>

            <div id="code-list" class="flex-1 bg-white overflow-y-auto border-t border-gray-300">
                </div>
        </div>
    </main>

    <script>
        let gLines = [
            { x: 26, z: 1, a: null, r: null, raw: 'G0 X26. Z1.' },
            { x: 32.3, z: 0.1, a: null, r: 0.9, raw: 'G1 X32.3 Z0.1 ,R.9' },
            { x: 30.3, z: null, a: 225, r: null, raw: 'G1 X30.3 ,A225' },
            { x: 30.3, z: -24.4, a: null, r: null, raw: 'G1 Z-24.4' }
        ];
        let activeIdx = 0;
        const scale = 8;

        function renderAll() {
            const list = document.getElementById('code-list');
            list.innerHTML = gLines.map((l, i) => `
                <div onclick="selectLine(${i})" class="p-2 border-b text-sm font-mono cursor-pointer ${activeIdx === i ? 'bg-blue-500 text-white' : 'hover:bg-blue-50'}">
                    ${l.raw}
                </div>
            `).join('');
            drawGraph();
        }

        function selectLine(i) {
            activeIdx = i;
            const line = gLines[i];
            document.getElementById('inpX').value = line.x || '';
            document.getElementById('inpZ').value = line.z || '';
            document.getElementById('inpA').value = line.a || '';
            document.getElementById('inpR').value = line.r || '';
            renderAll();
        }

        function updateSelectedLine() {
            const l = gLines[activeIdx];
            l.x = parseFloat(document.getElementById('inpX').value) || 0;
            l.z = document.getElementById('inpZ').value ? parseFloat(document.getElementById('inpZ').value) : null;
            l.a = document.getElementById('inpA').value ? parseFloat(document.getElementById('inpA').value) : null;
            l.r = document.getElementById('inpR').value ? parseFloat(document.getElementById('inpR').value) : null;
            
            // Пересобираем строку G-кода
            let code = `G1 X${l.x.toFixed(2)}`;
            if (l.z !== null) code += ` Z${l.z.toFixed(2)}`;
            if (l.a !== null) code += ` ,A${l.a}`;
            if (l.r !== null) code += ` ,R${l.r}`;
            l.raw = code;
            
            renderAll();
        }

        function drawGraph() {
            const group = document.getElementById('path-group');
            group.innerHTML = '';
            let cx = 0, cz = 0;

            gLines.forEach((l, i) => {
                let nz = l.z;
                let nx = l.x;

                if (l.a !== null && l.z === null) {
                    const rad = (l.a * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;

                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", cz * scale);
                line.setAttribute("y1", -(cx/2) * scale);
                line.setAttribute("x2", nz * scale);
                line.setAttribute("y2", -(nx/2) * scale);
                line.setAttribute("stroke", activeIdx === i ? "#00f2ff" : "#fbbf24");
                line.setAttribute("stroke-width", activeIdx === i ? "4" : "2");
                group.appendChild(line);

                if (activeIdx === i) {
                    const cursor = document.getElementById('target-point');
                    cursor.setAttribute('cx', nz * scale);
                    cursor.setAttribute('cy', -(nx/2) * scale);
                    cursor.style.display = 'block';
                }

                cx = nx; cz = nz;
            });
        }

        window.onload = renderAll;
    </script>
</body>
</html>
