<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura Dialog Mobile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050b14; font-family: sans-serif; }
        .siemens-blue { background-color: #006494; }
        .canvas-container { background: radial-gradient(#1e293b 1px, transparent 1px); background-size: 15px 15px; background-color: #020617; }
        input { font-size: 18px !important; } /* Чтобы iPhone не зумил при вводе */
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden text-white">

    <header class="siemens-blue p-2 flex justify-between items-center shrink-0">
        <span class="text-xs font-bold tracking-tighter">SINUMERIK <span class="text-cyan-400">ONE</span></span>
        <div class="flex gap-2">
            <button onclick="clearAll()" class="bg-red-900/50 px-2 py-1 rounded text-[10px]">СБРОС</button>
            <button onclick="exportGCode()" class="bg-orange-500 px-3 py-1 rounded text-xs font-bold uppercase">G-CODE</button>
        </div>
    </header>

    <div class="flex-[1] relative canvas-container border-b border-blue-900/50 overflow-hidden">
        <svg id="canvas" class="w-full h-full">
            <g id="viewport" transform="translate(50, 150)">
                <line x1="-100" y1="0" x2="1000" y2="0" stroke="#1e293b" />
                <g id="path-group"></g>
                <circle id="marker" r="4" fill="cyan" style="display:none" />
            </g>
        </svg>
    </div>

    <div class="flex-[1.2] bg-slate-900 flex flex-col">
        <div class="flex bg-slate-800 border-b border-white/5">
            <button class="flex-1 p-3 text-xs font-bold border-b-2 border-cyan-400 text-cyan-400">КОНТУР</button>
            <button class="flex-1 p-3 text-xs font-bold text-slate-500">ПАРАМЕТРЫ</button>
        </div>

        <div id="elements-list" class="flex-1 overflow-y-auto p-2 space-y-1">
            </div>

        <div class="p-2 grid grid-cols-4 gap-2 bg-black/40">
            <button onclick="openModal('G0')" class="bg-slate-700 p-3 rounded flex flex-col items-center">
                <span class="text-[10px]">G0</span>
                <span class="text-lg">➔</span>
            </button>
            <button onclick="openModal('G1')" class="bg-slate-700 p-3 rounded flex flex-col items-center border-b-2 border-yellow-500">
                <span class="text-[10px]">Линия</span>
                <span class="text-lg">⎯</span>
            </button>
            <button onclick="openModal('Angle')" class="bg-slate-700 p-3 rounded flex flex-col items-center border-b-2 border-cyan-500">
                <span class="text-[10px]">Угол</span>
                <span class="text-lg">∠</span>
            </button>
            <button onclick="openModal('Radius')" class="bg-slate-700 p-3 rounded flex flex-col items-center border-b-2 border-orange-500">
                <span class="text-[10px]">Радиус</span>
                <span class="text-lg">◯</span>
            </button>
        </div>
    </div>

    <div id="modal" class="fixed inset-0 bg-black/90 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-800 w-full max-w-sm rounded-xl border border-blue-500 overflow-hidden shadow-2xl">
            <div id="modal-title" class="siemens-blue p-3 text-sm font-bold uppercase">Свойства элемента</div>
            <div class="p-6 space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">X (Диаметр)</label>
                        <input id="mX" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-xl">
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 uppercase">Z (Длина)</label>
                        <input id="mZ" type="number" step="0.01" class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-xl">
                    </div>
                </div>
                <div id="angle-input-group">
                    <label class="text-[10px] text-cyan-400 uppercase font-bold">Угол ,A (180=Слева, 225=Вниз)</label>
                    <input id="mA" type="number" class="w-full bg-slate-900 border border-slate-700 p-3 rounded text-xl text-cyan-400">
                </div>
                <div class="flex gap-3 pt-4">
                    <button onclick="closeModal()" class="flex-1 bg-slate-700 p-4 rounded font-bold">ОТМЕНА</button>
                    <button onclick="saveElement()" class="flex-1 bg-cyan-600 p-4 rounded font-bold text-white">OK</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let elements = [
            { type: 'START', x: 20, z: 2 }
        ];
        let currentEditingType = null;
        let scale = 10;

        function openModal(type) {
            currentEditingType = type;
            document.getElementById('modal-title').innerText = "Добавить: " + type;
            document.getElementById('angle-input-group').style.display = (type === 'Angle') ? 'block' : 'none';
            document.getElementById('modal').classList.remove('hidden');
            
            // Предзаполнение последними координатами
            let last = elements[elements.length - 1];
            document.getElementById('mX').value = last.x;
            document.getElementById('mZ').value = (type === 'Angle') ? '' : last.z;
            document.getElementById('mA').value = '';
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function saveElement() {
            const x = parseFloat(document.getElementById('mX').value) || 0;
            const z = document.getElementById('mZ').value === '' ? null : parseFloat(document.getElementById('mZ').value);
            const a = parseFloat(document.getElementById('mA').value) || null;

            elements.push({ type: currentEditingType, x, z, a });
            closeModal();
            render();
        }

        function render() {
            const list = document.getElementById('elements-list');
            list.innerHTML = elements.map((el, i) => `
                <div class="bg-slate-800/50 p-2 rounded flex justify-between items-center border-l-4 ${el.type === 'Angle' ? 'border-cyan-500' : 'border-yellow-500'}">
                    <span class="text-[10px] font-bold text-slate-500">#${i}</span>
                    <span class="text-xs font-mono">${el.type} X${el.x} ${el.z !== null ? 'Z'+el.z : ''} ${el.a ? ',A'+el.a : ''}</span>
                    <button onclick="elements.splice(${i},1);render()" class="text-red-500 p-1">✕</button>
                </div>
            `).join('');
            draw();
        }

        function draw() {
            const group = document.getElementById('path-group');
            group.innerHTML = '';
            let cx = 0, cz = 0;

            elements.forEach((el, i) => {
                let nx = el.x;
                let nz = el.z;

                if (el.a !== null && nz === null) {
                    const rad = (el.a * Math.PI) / 180;
                    nz = cz + ((nx - cx) / 2) / Math.tan(rad);
                }
                if (nz === null) nz = cz;

                if (i > 0) {
                    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                    line.setAttribute("x1", cz * scale);
                    line.setAttribute("y1", -(cx/2) * scale);
                    line.setAttribute("x2", nz * scale);
                    line.setAttribute("y2", -(nx/2) * scale);
                    line.setAttribute("stroke", el.type === 'Angle' ? "#22d3ee" : "#facc15");
                    line.setAttribute("stroke-width", "2");
                    group.appendChild(line);
                }
                cx = nx; cz = nz;
            });
        }

        function clearAll() { elements = [{ type: 'START', x: 0, z: 0 }]; render(); }

        function exportGCode() {
            let res = elements.map(el => {
                if(el.type === 'START') return `G0 X${el.x} Z${el.z}`;
                let s = `G1 X${el.x}`;
                if(el.z !== null) s += ` Z${el.z}`;
                if(el.a !== null) s += ` ,A${el.a}`;
                return s;
            }).join('\n');
            alert("G-CODE:\n" + res);
        }

        window.onload = render;
    </script>
</body>
</html>
