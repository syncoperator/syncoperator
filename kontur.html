<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Nakamura v18 Clean</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --sab: env(safe-area-inset-bottom); }
        body { background: #010409; color: #e6edf3; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        
        /* 1. Информационная панель */
        header { height: 70px; background: #0d1117; border-bottom: 2px solid #30363d; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; flex-shrink: 0; }
        .val-display { font-family: 'ui-monospace', monospace; font-weight: 800; font-size: 20px; }

        /* 2. Область симуляции */
        #viewport { flex: 1; background: #010409; position: relative; min-height: 200px; border-bottom: 2px solid #30363d; overflow: hidden; }

        /* 3. Список программы (Scroll Down) */
        #program-area { height: 30%; background: #010409; overflow-y: auto; padding: 10px; border-bottom: 1px solid #30363d; }
        .t-card { background: #0d1117; border: 1px solid #30363d; border-radius: 8px; padding: 12px; margin-bottom: 8px; }
        .t-card.active { border-color: #2f81f7; background: #161b22; box-shadow: inset 4px 0 0 #2f81f7; }
        .t-card-title { font-size: 10px; color: #8b949e; font-weight: 800; text-transform: uppercase; }
        .t-card-val { font-size: 17px; font-weight: 900; color: #fff; margin-top: 4px; }

        /* 4. Панель управления (Кнопки) */
        footer { background: #0d1117; padding: 10px; padding-bottom: calc(10px + var(--sab)); flex-shrink: 0; z-index: 100; }
        .grid-menu { display: grid; grid-template-cols: repeat(4, 1fr); gap: 8px; }
        
        .btn-main { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 10px; height: 45px; font-weight: 800; font-size: 11px; text-transform: uppercase; }
        .btn-main.active { background: #2f81f7; color: white; border-color: #58a6ff; }
        
        .btn-sub { background: #161b22; border: 1px solid #30363d; color: #f0f6fc; border-radius: 10px; height: 50px; font-weight: 800; font-size: 12px; }
        .btn-sub:active { background: #30363d; transform: scale(0.97); }

        /* Редактор */
        #edit-panel { background: #161b22; padding: 10px; display: none; gap: 10px; border-top: 2px solid #2f81f7; }
        #edit-panel input { background: #010409; border: 1px solid #30363d; color: #58a6ff; border-radius: 8px; padding: 10px; width: 100%; text-align: center; font-weight: 800; font-size: 18px; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <div class="flex gap-6">
            <div><span class="text-[9px] font-black text-slate-500 block uppercase">X-Axis</span><div id="dispX" class="val-display">0.000</div></div>
            <div><span class="text-[9px] font-black text-emerald-500 block uppercase">Z-Axis</span><div id="dispZ" class="val-display text-emerald-400">0.000</div></div>
        </div>
        <div class="flex gap-2">
            <button id="open-tool" class="btn-main px-4">Tool</button>
            <button id="reset-app" class="btn-main px-4 text-red-500">Reset</button>
        </div>
    </header>

    <main id="viewport">
        <svg id="svg" class="w-full h-full">
            <g id="world" transform="translate(100, 150) scale(15)">
                <line x1="-1000" y1="0" x2="1000" y2="0" stroke="#1c2128" stroke-width="0.1" />
                <g id="path-layer"></g>
                <g id="tool-group" style="transition: transform 0.1s linear">
                    <path id="t-halter" fill="#2d333b" stroke="#484f58" stroke-width="0.1" />
                    <path id="t-plate" fill="#f2cc60" stroke="#fff" stroke-width="0.15" />
                    <circle r="0.12" fill="#ff7b72" />
                </g>
            </g>
        </svg>
    </main>

    <section id="program-area">
        <div id="step-list"></div>
        <div style="height: 50px;"></div> </section>

    <div id="edit-panel">
        <input id="inpX" type="number" step="0.1" placeholder="X">
        <input id="inpZ" type="number" step="0.1" placeholder="Z">
        <button id="close-edit" class="btn-main px-6 bg-blue-600 text-white">OK</button>
    </div>

    <footer>
        <div id="sub-menu" class="grid grid-cols-4 gap-2 mb-3"></div>
        <div class="grid-menu">
            <button id="tab-drehen" class="btn-main active">Drehen</button>
            <button id="tab-bohren" class="btn-main">Bohren</button>
            <button id="tab-cycles" class="btn-main">Cycles</button>
            <button id="tab-system" class="btn-main">System</button>
        </div>
    </footer>

    <div id="m-tool" class="modal">
        <div class="bg-[#0d1117] border border-[#30363d] p-6 rounded-2xl w-full max-w-sm">
            <h3 class="text-blue-500 font-black mb-4 uppercase">Tool Geometry</h3>
            <div class="space-y-4">
                <select id="t-mode" class="w-full bg-black border border-slate-700 p-3 rounded-lg text-blue-400 font-bold">
                    <option value="out">AUSSEN (OD)</option>
                    <option value="in">INNEN (ID)</option>
                </select>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="text-[9px] font-bold text-slate-500 uppercase">Winkel</label><input id="t-angle" type="number" value="55" class="w-full bg-black border border-slate-700 p-2 rounded text-white"></div>
                    <div><label class="text-[9px] font-bold text-slate-500 uppercase">Länge</label><input id="t-size" type="number" value="12" class="w-full bg-black border border-slate-700 p-2 rounded text-white"></div>
                </div>
                <button id="save-tool" class="w-full bg-blue-600 h-12 rounded-xl font-black text-white uppercase mt-2">Speichern</button>
            </div>
        </div>
    </div>

    <div id="m-import" class="modal">
        <div class="bg-[#0d1117] border border-[#30363d] p-6 rounded-2xl w-full max-w-lg">
            <textarea id="import-area" class="w-full h-60 bg-black border border-slate-800 p-3 font-mono text-green-500 text-sm mb-4" placeholder="G-Code..."></textarea>
            <div class="flex gap-2">
                <button id="cancel-import" class="flex-1 btn-sub">Abbrechen</button>
                <button id="do-import" class="flex-1 bg-white text-black font-black rounded-lg uppercase">Import</button>
            </div>
        </div>
    </div>

    <script>
        let program = [{ x: 40, z: 2, type: 'G0' }];
        let activeIdx = 0;

        // Элементы
        const list = document.getElementById('step-list');
        const sub = document.getElementById('sub-menu');
        const editPanel = document.getElementById('edit-panel');

        const menus = {
            drehen: [
                { l: 'G0 RAPID', op: 'G0' }, { l: 'G1 LINEAR', op: 'G1' }, 
                { l: 'WINKEL A', op: 'A' }, { l: 'RADIUS R', op: 'R' }
            ],
            bohren: [
                { l: 'G83 DRILL', op: 'G83' }, { l: 'G81 CENT', op: 'G81' }, 
                { l: 'G84 TAP', op: 'G84' }, { l: 'PECK', op: 'G73' }
            ],
            cycles: [
                { l: 'G71 ROUGH', op: 'G71' }, { l: 'G75 GROOV', op: 'G75' }, 
                { l: 'G33 THRD', op: 'G33' }, { l: 'G70 FINISH', op: 'G70' }
            ],
            system: [
                { l: 'IMPORT', op: 'IMP' }, { l: 'CENTER', op: 'FIT' }, 
                { l: 'UPPER G54', op: 'T1' }, { l: 'LOWER G55', op: 'T2' }
            ]
        };

        // 1. Управление меню
        function setMenu(key) {
            document.querySelectorAll('.btn-main').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + key).classList.add('active');
            sub.innerHTML = menus[key].map(m => `<button class="btn-sub" data-op="${m.op}">${m.l}</button>`).join('');
            
            // Привязка событий к новым кнопкам
            sub.querySelectorAll('.btn-sub').forEach(btn => {
                btn.onclick = () => {
                    const op = btn.dataset.op;
                    if (op === 'G0' || op === 'G1') addStep(op);
                    if (op === 'IMP') document.getElementById('m-import').style.display = 'flex';
                    if (op === 'FIT') autoFit();
                };
            });
        }

        // 2. Отрисовка резца
        function drawTool() {
            const mode = document.getElementById('t-mode').value;
            const ang = parseFloat(document.getElementById('t-angle').value);
            const size = parseFloat(document.getElementById('t-size').value);
            const plate = document.getElementById('t-plate');
            const halter = document.getElementById('t-halter');

            const rad = (ang / 2) * (Math.PI / 180);
            const dx = (size / 2) * Math.sin(rad);
            const dy = (size / 2) * Math.cos(rad);

            if (mode === 'out') {
                // AUSSEN: Над деталью, острие вниз
                plate.setAttribute('d', `M 0 0 L ${-dx} ${-dy} L 0 ${-dy*2} L ${dx} ${-dy} Z`);
                halter.setAttribute('d', `M ${-dx} ${-dy} L ${-dx} ${-dy-15} L ${-20} ${-dy-15} L ${-20} ${-dy} Z`);
            } else {
                // INNEN: Снизу детали, острие вверх
                plate.setAttribute('d', `M 0 0 L ${-dx} ${dy} L 0 ${dy*2} L ${dx} ${dy} Z`);
                halter.setAttribute('d', `M ${-dx} ${dy} L ${-dx} ${dy+15} L ${-20} ${dy+15} L ${-20} ${dy} Z`);
            }
        }

        // 3. Логика программы
        function update() {
            list.innerHTML = program.map((p, i) => `
                <div class="t-card ${i===activeIdx?'active':''}" onclick="selectStep(${i})">
                    <div class="t-card-title">Step N${i} — ${p.type}</div>
                    <div class="t-card-val">X${p.x.toFixed(2)} Z${p.z.toFixed(2)}</div>
                </div>
            `).join('');

            const cur = program[activeIdx];
            document.getElementById('tool-group').setAttribute('transform', `translate(${cur.z}, ${-cur.x/2})`);
            document.getElementById('dispX').innerText = cur.x.toFixed(3);
            document.getElementById('dispZ').innerText = cur.z.toFixed(3);
            document.getElementById('inpX').value = cur.x;
            document.getElementById('inpZ').value = cur.z;

            // Траектория
            const layer = document.getElementById('path-layer');
            layer.innerHTML = '';
            program.forEach((p, i) => {
                if (i === 0) return;
                const prev = program[i-1];
                const l = document.createElementNS("http://www.w3.org/2000/svg", "line");
                l.setAttribute("x1", prev.z); l.setAttribute("y1", -prev.x/2);
                l.setAttribute("x2", p.z); l.setAttribute("y2", -p.x/2);
                l.setAttribute("stroke", p.type === 'G0' ? '#21262d' : '#f2cc60');
                l.setAttribute("stroke-width", "0.3");
                layer.appendChild(l);
            });
        }

        function addStep(t) {
            program.push({ ...program[program.length-1], type: t });
            activeIdx = program.length - 1;
            update();
            editPanel.style.display = 'flex';
        }

        function selectStep(i) {
            activeIdx = i;
            update();
            editPanel.style.display = 'flex';
        }

        function autoFit() {
            const w = document.getElementById('viewport').clientWidth;
            const h = document.getElementById('viewport').clientHeight;
            document.getElementById('world').setAttribute('transform', `translate(${w/2}, ${h/2}) scale(15)`);
        }

        // Инициализация событий (Безопасная)
        document.getElementById('tab-drehen').onclick = () => setMenu('drehen');
        document.getElementById('tab-bohren').onclick = () => setMenu('bohren');
        document.getElementById('tab-cycles').onclick = () => setMenu('cycles');
        document.getElementById('tab-system').onclick = () => setMenu('system');

        document.getElementById('open-tool').onclick = () => document.getElementById('m-tool').style.display = 'flex';
        document.getElementById('save-tool').onclick = () => { drawTool(); document.getElementById('m-tool').style.display = 'none'; };
        document.getElementById('reset-app').onclick = () => { program = [{x:40,z:2,type:'G0'}]; activeIdx=0; update(); };
        
        document.getElementById('close-edit').onclick = () => editPanel.style.display = 'none';
        document.getElementById('inpX').oninput = (e) => { program[activeIdx].x = parseFloat(e.target.value) || 0; update(); };
        document.getElementById('inpZ').oninput = (e) => { program[activeIdx].z = parseFloat(e.target.value) || 0; update(); };

        document.getElementById('do-import').onclick = () => {
            const text = document.getElementById('import-area').value.toUpperCase().split('\n');
            program = []; let lx=40, lz=2;
            text.forEach(line => {
                const xm = line.match(/X(-?\d*\.?\d+)/), zm = line.match(/Z(-?\d*\.?\d+)/);
                if(xm || zm) {
                    lx = xm ? parseFloat(xm[1]) : lx; lz = zm ? parseFloat(zm[1]) : lz;
                    program.push({ x:lx, z:lz, type: line.includes('G0')?'G0':'G1' });
                }
            });
            if(program.length===0) program = [{x:40,z:2,type:'G0'}];
            activeIdx = program.length-1;
            document.getElementById('m-import').style.display = 'none';
            update(); autoFit();
        };
        document.getElementById('cancel-import').onclick = () => document.getElementById('m-import').style.display = 'none';

        window.onload = () => { setMenu('drehen'); drawTool(); update(); autoFit(); };
    </script>
</body>
</html>
