<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Multi-Tool Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f2f2f7; --card: #1c1c1e; --accent: #ff9500; --safety: #34c759; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; }

        .tabs { display: flex; background: #e5e5ea; padding: 4px; border-radius: 12px; margin-bottom: 10px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 9px; font-weight: 800; font-size: 10px; color: #86868b; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .visual-card { background: var(--card); border-radius: 24px; padding: 15px; border: 1px solid #333; margin-bottom: 12px; }
        .svg-container { width: 100%; height: 220px; position: relative; }
        svg { width: 100%; height: 100%; overflow: visible; }
        
        .line-wp { fill: rgba(255,149,0,0.1); stroke: var(--accent); stroke-width: 1.5; }
        .line-path { fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 1; stroke-dasharray: 4; }
        .tool-dot { fill: #ff3b30; stroke: #fff; stroke-width: 1; filter: drop-shadow(0 0 5px #ff3b30); transition: all 0.3s ease-out; }

        .info { text-align: center; margin-top: 10px; border-top: 1px solid #333; padding-top: 10px; }
        .p-name { color: #86868b; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .p-coords { color: var(--accent); font-size: 26px; font-weight: 800; font-family: monospace; }

        .section { background: #fff; border-radius: 18px; padding: 15px; margin-bottom: 10px; border: 1px solid #d2d2d7; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .label { display: block; font-size: 10px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 15px; font-weight: 700; outline: none; box-sizing: border-box; }

        .code-box { background: #000; border-radius: 20px; padding: 15px; border: 1px solid #333; }
        .line { font-family: 'SF Mono', monospace; font-size: 12px; color: #34c759; padding: 4px 0; border-bottom: 1px solid #222; cursor: pointer; white-space: nowrap; overflow: hidden; }
        .line.safety { color: var(--safety); border-left: 4px solid var(--safety); padding-left: 10px; }
        .hl { color: var(--accent); font-weight: bold; }
        .comment { color: #555; font-size: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="t-g112" class="tab-btn active" onclick="setMode('G112')">G112 (No Comp)</button>
        <button id="t-g112comp" class="tab-btn" onclick="setMode('G112Comp')">G112 + G41</button>
        <button id="t-yax" class="tab-btn" onclick="setMode('Y-AXIS')">Y-ACHSE</button>
    </div>

    <div class="visual-card">
        <div class="svg-container">
            <svg id="svg-field" viewBox="-100 -100 200 200">
                <polygon id="wp-poly" class="line-wp" points="" />
                <polygon id="path-poly" class="line-path" points="" />
                <circle id="tool-dot" class="tool-dot" cx="0" cy="0" r="5" />
            </svg>
        </div>
        <div class="info">
            <div id="p-name" class="p-name">STARTPUNKT</div>
            <div id="p-coords" class="p-coords">X0.000 Y0.000</div>
        </div>
    </div>

    <div class="section">
        <div class="grid">
            <div>
                <label class="label">SW (Größe)</label>
                <input type="number" id="sw" value="19" oninput="calc()">
            </div>
            <div>
                <label class="label">Fräser Ø</label>
                <input type="number" id="fdia" value="10" oninput="calc()">
            </div>
        </div>
        <div class="grid" style="margin-top: 10px;">
            <div>
                <label class="label">Sicherheit</label>
                <input type="number" id="safe" value="5" oninput="calc()">
            </div>
            <div>
                <label class="label">Vorschub F</label>
                <input type="number" id="feed" value="0.12" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="code-box" id="code-output"></div>
</div>

<script>
let currentMode = 'G112';
let points = [];
let zoom = 1;

function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('t-' + m.toLowerCase().replace('-', '')).classList.add('active');
    calc();
}

function getHexPoints(radius) {
    const r_corner = radius / Math.cos(30 * Math.PI / 180);
    return [
        {x: radius, y: -radius * Math.tan(30*Math.PI/180)},
        {x: radius, y: radius * Math.tan(30*Math.PI/180)},
        {x: 0, y: r_corner},
        {x: -radius, y: radius * Math.tan(30*Math.PI/180)},
        {x: -radius, y: -radius * Math.tan(30*Math.PI/180)},
        {x: 0, y: -r_corner}
    ];
}

function calc() {
    const sw = parseFloat(document.getElementById('sw').value) || 1;
    const f = parseFloat(document.getElementById('fdia').value) || 0;
    const s = parseFloat(document.getElementById('safe').value) || 0;
    const feed = document.getElementById('feed').value;
    
    const r_wp = sw / 2;
    // Если используем G41 (G112Comp или Y-AXIS), траектория идет по размеру SW. 
    // Если без коррекции (G112), прибавляем радиус фрезы.
    const r_calc = (currentMode === 'G112') ? (sw + f) / 2 : (sw / 2);
    const p0x = sw + f + (s * 2);

    zoom = 85 / Math.max(p0x/2, (r_calc + f/2) * 1.3);

    const wpPts = getHexPoints(r_wp);
    const pathPts = getHexPoints(r_calc);

    document.getElementById('wp-poly').setAttribute('points', wpPts.map(p => `${p.x * zoom},${-p.y * zoom}`).join(' '));
    document.getElementById('path-poly').setAttribute('points', pathPts.map(p => `${p.x * zoom},${-p.y * zoom}`).join(' '));

    points = [
        {x: p0x, y: 0, n: "VORPOSITIONIEREN", safe: true},
        ...pathPts.map((p, i) => ({x: p.x * 2, y: p.y, n: `PUNKT ${i+1}`})),
        {x: pathPts[0].x * 2, y: pathPts[0].y, n: "ENDE (P7)"}
    ];

    renderCode(feed);
}

function renderCode(f) {
    let out = '';
    const ax = (currentMode === 'Y-AXIS') ? 'Y' : 'C';
    
    out += `<div class="line safety" onclick="move(0)">G0 <span class="hl">X${points[0].x.toFixed(3)}</span> ${ax}0.0</div>`;
    
    if (currentMode === 'G112') {
        out += `<div class="line comment">G112 (POLAR AN - MITTE FRÄSER)</div>`;
        points.slice(1).forEach((p, i) => {
            out += `<div class="line" onclick="move(${i+1})">G1 <span class="hl">X${p.x.toFixed(3)}</span> C${p.y.toFixed(3)} F${f}</div>`;
        });
        out += `<div class="line comment">G113 (POLAR AUS)</div>`;
    } 
    else if (currentMode === 'G112Comp') {
        out += `<div class="line comment">G112 (POLAR AN + KORREKTUR)</div>`;
        out += `<div class="line">G1 <span class="hl">G41</span> X${points[1].x.toFixed(3)} C${points[1].y.toFixed(3)} F${f}</div>`;
        points.slice(2).forEach((p, i) => {
            out += `<div class="line" onclick="move(${i+2})">G1 X${p.x.toFixed(3)} C${p.y.toFixed(3)}</div>`;
        });
        out += `<div class="line">G1 <span class="hl">G40</span> X${points[0].x.toFixed(3)} C0.0</div>`;
        out += `<div class="line comment">G113 (POLAR AUS)</div>`;
    }
    else {
        out += `<div class="line comment">(FRÄSEN MIT Y-ACHSE)</div>`;
        out += `<div class="line">G1 <span class="hl">G41</span> X${points[1].x.toFixed(3)} Y${points[1].y.toFixed(3)} F${f}</div>`;
        points.slice(2).forEach((p, i) => {
            out += `<div class="line" onclick="move(${i+2})">G1 X${p.x.toFixed(3)} Y${p.y.toFixed(3)}</div>`;
        });
        out += `<div class="line">G1 <span class="hl">G40</span> X${points[0].x.toFixed(3)} Y0.0</div>`;
    }

    document.getElementById('code-output').innerHTML = out;
    move(0);
}

function move(i) {
    const p = points[i];
    const dot = document.getElementById('tool-dot');
    const axLabel = (currentMode === 'Y-AXIS') ? 'Y' : 'C';

    dot.setAttribute('cx', (p.x / 2) * zoom);
    dot.setAttribute('cy', -p.y * zoom);

    document.getElementById('p-name').innerText = p.n;
    document.getElementById('p-coords').innerText = `X${p.x.toFixed(3)} ${axLabel}${p.y.toFixed(3)}`;
}

calc();
</script>
</body>
</html>
