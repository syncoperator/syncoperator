<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura G112 Pro Fix</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f2f2f7; --card: #1c1c1e; --accent: #ff9500; --text: #1d1d1f; --border: #d2d2d7; --safety: #34c759; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; }

        .tabs { display: flex; background: #e5e5ea; padding: 4px; border-radius: 12px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; border-radius: 9px; font-weight: 800; font-size: 11px; cursor: pointer; color: #86868b; text-transform: uppercase; }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* VISUALIZER 1:1 LOGIC */
        .visual-card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 12px; border: 1px solid #333; position: relative; }
        .canvas { width: 100%; height: 240px; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; border-bottom: 1px solid #333; margin-bottom: 15px; }
        
        /* Werkstück (Orange) */
        #hex-wp { position: absolute; background: rgba(255,149,0,0.25); border: 2px solid var(--accent); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transition: 0.3s; z-index: 2; }
        
        /* Fräserpfad (Gestrichelt) */
        #hex-path { position: absolute; border: 1.5px dashed rgba(255,255,255,0.3); clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); transition: 0.3s; z-index: 1; }
        
        /* Fräser (Roter Punkt) */
        #dot { position: absolute; width: 14px; height: 14px; background: #ff3b30; border-radius: 50%; box-shadow: 0 0 15px #ff3b30; transition: 0.4s cubic-bezier(0.1, 0.7, 0.1, 1); z-index: 10; margin: -7px 0 0 -7px; left: 50%; top: 50%; }

        .info-display { text-align: center; padding-bottom: 5px; }
        .p-name { color: #86868b; font-size: 11px; font-weight: 800; text-transform: uppercase; }
        .p-coords { color: var(--accent); font-size: 28px; font-weight: 800; font-family: monospace; }

        .section { background: #fff; border-radius: 18px; padding: 15px; margin-bottom: 10px; border: 1px solid var(--border); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .label { display: block; font-size: 10px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 700; outline: none; box-sizing: border-box; }

        .code-box { background: #000; border-radius: 20px; padding: 15px; border: 1px solid #333; }
        .line { font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.8; color: #34c759; border-bottom: 1px solid #222; padding: 4px 0; cursor: pointer; }
        .line.safety { color: var(--safety); border-left: 4px solid var(--safety); padding-left: 10px; }
        .hl { color: var(--accent); font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button class="tab-btn active">AXIAL (STIRN)</button>
        <button class="tab-btn">RADIAL (MANTEL)</button>
    </div>

    <div class="visual-card">
        <div class="canvas">
            <div id="hex-wp"></div>
            <div id="hex-path"></div>
            <div id="dot"></div>
        </div>
        <div class="info-display">
            <div id="p-name" class="p-name">P2</div>
            <div id="p-coords" class="p-coords">X29.000 C8.372</div>
        </div>
    </div>

    <div class="section">
        <div class="grid">
            <div>
                <label class="label">Bearbeitung</label>
                <select id="type" onchange="calc()"><option value="aussen">AUSSEN</option><option value="innen">INNEN</option></select>
            </div>
            <div>
                <label class="label">SW (Größe)</label>
                <input type="number" id="sw" value="19" oninput="calc()">
            </div>
        </div>
        <div class="grid" style="margin-top: 10px;">
            <div>
                <label class="label">Fräser Ø</label>
                <input type="number" id="fdia" value="10" oninput="calc()">
            </div>
            <div>
                <label class="label">Sicherheit</label>
                <input type="number" id="safe" value="5" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="code-box">
        <div id="l0" class="line safety" onclick="move(0)"></div>
        <div id="codes"></div>
    </div>
</div>

<script>
let points = [];
let zoom = 1;

function calc() {
    const sw = parseFloat(document.getElementById('sw').value) || 1;
    const f = parseFloat(document.getElementById('fdia').value) || 0;
    const s = parseFloat(document.getElementById('safe').value) || 0;
    
    const r_eff = (sw + f) / 2;
    const side = r_eff * Math.tan(30 * Math.PI / 180);
    const p0x = sw + f + (s * 2);

    // Масштабирование: берем макс. габарит и вписываем в 240px
    const maxDim = Math.max(p0x, r_eff * 2.3); 
    zoom = 200 / maxDim;

    // Отрисовка заготовки (Orange)
    const wp = document.getElementById('hex-wp');
    const wpSize = sw * zoom;
    wp.style.width = wpSize + 'px';
    wp.style.height = wpSize + 'px';

    // Отрисовка пути (Пунктир)
    const path = document.getElementById('hex-path');
    const pathSize = (r_eff * 2) * zoom;
    path.style.width = pathSize + 'px';
    path.style.height = pathSize + 'px';

    points = [
        {x: p0x, c: 0, n: "VORPOSITIONIEREN", isP0: true},
        {x: r_eff * 2, c: -side, n: "P1 ANFAHREN"},
        {x: r_eff * 2, c: side, n: "P2"},
        {x: r_eff, c: side * 2, n: "P3"},
        {x: -r_eff, c: side, n: "P4"},
        {x: -r_eff * 2, c: -side, n: "P5"},
        {x: -r_eff, c: -side * 2, n: "P6"},
        {x: r_eff, c: -side, n: "P7 ENDE"}
    ];

    document.getElementById('l0').innerHTML = `G0 <span class="hl">X${p0x.toFixed(3)}</span> C0.0 <span style="font-size:10px; color:#666">(VORPOS)</span>`;
    
    const codes = document.getElementById('codes');
    codes.innerHTML = '<div class="line" style="color:#666">G112 (POLAR AN)</div>';
    points.slice(1).forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.onclick = () => move(i + 1);
        div.innerHTML = `G1 <span class="hl">X${p.x.toFixed(3)}</span> C${p.c.toFixed(3)} <span style="font-size:10px; color:#666">P${i+1}</span>`;
        codes.appendChild(div);
    });
    codes.innerHTML += '<div class="line" style="color:#666">G113 (POLAR AUS)</div>';
    
    move(2); // По умолчанию показываем P2 как на скрине
}

function move(i) {
    const dot = document.getElementById('dot');
    const p = points[i];

    // Координаты: C в радиусах (Y), X в диаметрах (поэтому X/2 для графики)
    // В вебе Y идет вниз, поэтому инвертируем C
    const offsetX = (p.x / 2) * zoom;
    const offsetY = -p.c * zoom;

    dot.style.transform = `translate(${offsetX}px, ${offsetY}px)`;
    
    document.getElementById('p-name').innerText = p.n;
    document.getElementById('p-coords').innerText = `X${p.x.toFixed(3)} C${p.c.toFixed(3)}`;
}

calc();
</script>
</body>
</html>
