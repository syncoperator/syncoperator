<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura G112 Master</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7;
            --card: #ffffff;
            --accent: #ff9500;
            --text: #1d1d1f;
            --border: #d2d2d7;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; }

        /* HEADER & TABS */
        .main-tabs { display: flex; background: #e5e5ea; padding: 3px; border-radius: 12px; margin-bottom: 8px; }
        .tab-btn { flex: 1; padding: 8px; border: none; border-radius: 10px; font-weight: 800; font-size: 10px; cursor: pointer; color: #86868b; }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* SENSOR / VISUALIZER */
        .sensor-card { background: #1c1c1e; border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border: 1px solid #333; }
        .visual-hex { position: relative; width: 85px; height: 85px; border: 1px dashed #444; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); background: rgba(255,149,0,0.05); }
        .dot { position: absolute; width: 10px; height: 10px; background: #ff3b30; border-radius: 50%; box-shadow: 0 0 12px #ff3b30; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); margin: -5px 0 0 -5px; }

        /* SETTINGS GRID */
        .section { background: var(--card); border-radius: 16px; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); }
        .label { display: block; font-size: 9px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 4px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        select, input { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 15px; font-weight: 700; background: #fff; outline: none; box-sizing: border-box; }

        /* CODE OUTPUT */
        .code-box { background: #000; border-radius: 18px; padding: 15px; border: 1px solid #333; font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6; color: #34c759; }
        .line { border-bottom: 1px solid #1a1a1a; padding: 4px 0; display: flex; justify-content: space-between; cursor: pointer; }
        .line:hover { background: #111; }
        .hl { color: var(--accent); font-weight: bold; }
        .comment { color: #636366; font-size: 11px; }
    </style>
</head>
<body>

<div class="container">
    <div class="main-tabs">
        <button id="m-axial" class="tab-btn active" onclick="setMode('axial')">AXIAL (STIRN)</button>
        <button id="m-radial" class="tab-btn" onclick="setMode('radial')">RADIAL (MANTEL)</button>
    </div>

    <div class="sensor-card">
        <div class="visual-hex"><div id="dot" class="dot"></div></div>
        <div style="text-align: right;">
            <div id="p-label" style="color: #fff; font-size: 14px; font-weight: 800;">STARTPUNKT</div>
            <div id="p-coords" style="color: var(--accent); font-size: 18px; font-weight: 800; font-variant-numeric: tabular-nums;">X... C...</div>
        </div>
    </div>

    <div class="section">
        <div class="grid">
            <div>
                <label class="label">Typ</label>
                <select id="type" onchange="calc()">
                    <option value="aussen">AUSSEN</option>
                    <option value="innen">INNEN</option>
                </select>
            </div>
            <div>
                <label class="label">SW (Größe)</label>
                <input type="number" id="sw" value="19" oninput="calc()">
            </div>
        </div>
        <div class="grid" style="margin-top: 8px;">
            <div>
                <label class="label">Fräser Ø</label>
                <input type="number" id="fdia" value="10" oninput="calc()">
            </div>
            <div>
                <label class="label">Sicherheit</label>
                <input type="number" id="safe" value="2" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="code-box">
        <div class="line" style="color:#86868b">G112 (POLAR EIN / XY-MODE)</div>
        <div id="code-list"></div>
        <div class="line" style="color:#86868b">G113 (POLAR AUS)</div>
    </div>
</div>

<script>
let toolMode = 'axial';
let points = [];

function setMode(m) {
    toolMode = m;
    document.getElementById('m-axial').classList.toggle('active', m === 'axial');
    document.getElementById('m-radial').classList.toggle('active', m === 'radial');
    calc();
}

function calc() {
    const sw = parseFloat(document.getElementById('sw').value) || 0;
    const f = parseFloat(document.getElementById('fdia').value) || 0;
    const type = document.getElementById('type').value;
    const s = parseFloat(document.getElementById('safe').value) || 0;

    // Radius Berechnung (Außen: SW+Fräser, Innen: SW-Fräser)
    const r_eff = (type === 'aussen') ? (sw + f) / 2 : (sw - f) / 2;
    const side = r_eff * Math.tan(30 * Math.PI / 180);

    points = [
        {x: r_eff * 2, c: -side, n: "START"},
        {x: r_eff * 2, c: side, n: "P2"},
        {x: r_eff, c: side * 2, n: "P3"},
        {x: -r_eff, c: side, n: "P4"},
        {x: -r_eff * 2, c: -side, n: "P5"},
        {x: -r_eff, c: -side * 2, n: "P6"},
        {x: r_eff, c: -side, n: "ENDE"}
    ];

    renderCode();
    updateVisual(0);
}

function renderCode() {
    const container = document.getElementById('code-list');
    container.innerHTML = '';
    points.forEach((p, i) => {
        const div = document.createElement('div');
        div.className = 'line';
        div.onclick = () => updateVisual(i);
        const cmd = (i === 0) ? 'G0' : 'G1';
        div.innerHTML = `<span>${cmd} X${p.x.toFixed(3)} C${p.c.toFixed(3)}</span><span class="hl">P${i+1}</span>`;
        container.appendChild(div);
    });
}

function updateVisual(i) {
    const dot = document.getElementById('dot');
    const p = points[i];
    // Mapping Points to Hex-Polygon
    const map = [
        {t: '25%', l: '100%'}, {t: '75%', l: '100%'}, {t: '100%', l: '50%'},
        {t: '75%', l: '0%'}, {t: '25%', l: '0%'}, {t: '0%', l: '50%'}, {t: '25%', l: '100%'}
    ];
    dot.style.top = map[i].t;
    dot.style.left = map[i].l;
    
    document.getElementById('p-label').innerText = p.n;
    document.getElementById('p-coords').innerText = `X${p.x.toFixed(3)} C${p.c.toFixed(3)}`;
}

calc();
</script>
</body>
</html>
