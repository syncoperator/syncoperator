<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nakamura CNC Expert Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f2f2f7; --card: #1c1c1e; --accent: #ff9500; --safety: #34c759; --error: #ff3b30; }
        body { background: var(--bg); font-family: 'Inter', sans-serif; margin: 0; padding: 10px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 440px; padding-bottom: 60px; }

        .tabs { display: flex; background: #e5e5ea; padding: 4px; border-radius: 12px; margin-bottom: 8px; gap: 4px; }
        .tab-btn { flex: 1; padding: 10px 5px; border: none; border-radius: 9px; font-weight: 800; font-size: 10px; color: #86868b; text-transform: uppercase; cursor: pointer; }
        .tab-btn.active { background: #fff; color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        .visual-card { background: var(--card); border-radius: 24px; padding: 15px; border: 1px solid #333; margin-bottom: 12px; }
        .svg-container { width: 100%; height: 200px; position: relative; }
        svg { width: 100%; height: 100%; overflow: visible; }
        .line-wp { fill: rgba(255,149,0,0.1); stroke: var(--accent); stroke-width: 1.5; }
        .line-path { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 1; stroke-dasharray: 4; }
        .tool-circle { fill: rgba(255, 59, 48, 0.2); stroke: #ff3b30; stroke-width: 1; transition: all 0.3s cubic-bezier(0.1, 0.7, 0.1, 1); pointer-events: none; }
        .warning-msg { color: var(--error); font-size: 11px; font-weight: 800; text-align: center; margin-top: 5px; display: none; }

        .info { text-align: center; margin-top: 10px; border-top: 1px solid #333; padding-top: 8px; }
        .p-coords { color: var(--accent); font-size: 24px; font-weight: 800; font-family: monospace; }

        .section { background: #fff; border-radius: 18px; padding: 15px; margin-bottom: 10px; border: 1px solid #d2d2d7; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .label { display: block; font-size: 9px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #d2d2d7; border-radius: 10px; font-size: 14px; font-weight: 700; outline: none; box-sizing: border-box; }

        .code-box { background: #000; border-radius: 20px; padding: 15px; border: 1px solid #333; }
        .line { font-family: 'SF Mono', monospace; font-size: 12px; color: #34c759; padding: 6px 0; border-bottom: 1px solid #222; cursor: pointer; }
        .line:active { background: #1a1a1a; }
        .hl { color: var(--accent); font-weight: bold; }
        .comment { color: #555; font-size: 10px; pointer-events: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <button id="t-g112" class="tab-btn active" onclick="setMode('G112')">G112</button>
        <button id="t-g112comp" class="tab-btn" onclick="setMode('G112Comp')">G112+G41</button>
        <button id="t-yax" class="tab-btn" onclick="setMode('Y-AXIS')">Y-ACHSE</button>
    </div>

    <div class="visual-card">
        <div class="svg-container">
            <svg viewBox="-100 -100 200 200">
                <polygon id="wp-poly" class="line-wp" points="" />
                <polygon id="path-poly" class="line-path" points="" />
                <circle id="tool-vis" class="tool-circle" cx="0" cy="0" r="0" />
            </svg>
        </div>
        <div id="collision-warn" class="warning-msg">⚠ KOLLISION / UNMÖGLICH</div>
        <div class="info">
            <div id="p-coords" class="p-coords">X0.000 C0.000</div>
        </div>
    </div>

    <div class="section">
        <div class="grid-3">
            <div>
                <label class="label">Typ</label>
                <select id="bearb" onchange="calc()"><option value="aussen">AUSSEN</option><option value="innen">INNEN</option></select>
            </div>
            <div>
                <label class="label">SW</label>
                <input type="number" id="sw" value="19" oninput="calc()">
            </div>
            <div>
                <label class="label">Fräser Ø</label>
                <input type="number" id="fdia" value="10" oninput="calc()">
            </div>
        </div>
    </div>

    <div class="section">
        <div class="grid-3">
            <div>
                <label class="label">Vc m/min</label>
                <input type="number" id="vc" value="120" oninput="calc()">
            </div>
            <div>
                <label class="label">fz mm</label>
                <input type="number" id="fz" value="0.05" oninput="calc()">
            </div>
            <div style="background: #f9f9f9; padding: 5px; border-radius: 8px; text-align: center;">
                <label class="label">F (min)</label>
                <div id="res-f" style="font-weight: 800; color: #1d1d1f; font-size: 14px;">0</div>
            </div>
        </div>
    </div>

    <div class="code-box" id="code-output"></div>
</div>

<script>
let currentMode = 'G112';
let points = [];
let zoom = 1;

function setMode(m) {
    currentMode = m;
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    const btnId = m === 'G112' ? 't-g112' : (m === 'G112Comp' ? 't-g112comp' : 't-yax');
    document.getElementById(btnId).classList.add('active');
    calc();
}

function getHexPoints(radius) {
    const r_corner = radius / Math.cos(30 * Math.PI / 180);
    return [
        {x: radius, y: -radius * Math.tan(30*Math.PI/180)},
        {x: radius, y: radius * Math.tan(30*Math.PI/180)},
        {x: 0, y: r_corner},
        {x: -radius, y: radius * Math.tan(30*Math.PI/180)},
        {x: -radius, y: -radius * Math.tan(30*Math.PI/180)},
        {x: 0, y: -r_corner}
    ];
}

function calc() {
    const sw = parseFloat(document.getElementById('sw').value) || 1;
    const f_dia = parseFloat(document.getElementById('fdia').value) || 0;
    const bearb = document.getElementById('bearb').value;
    const vc = parseFloat(document.getElementById('vc').value) || 0;
    const fz = parseFloat(document.getElementById('fz').value) || 0;

    const s_val = Math.round((vc * 1000) / (Math.PI * f_dia)) || 0;
    const f_val = Math.round(s_val * fz * 3) || 0;
    document.getElementById('res-f').innerText = f_val;

    const r_wp = sw / 2;
    let r_calc = (currentMode === 'G112') ? (sw + f_dia) / 2 : sw / 2;
    if (bearb === 'innen' && currentMode === 'G112') r_calc = (sw - f_dia) / 2;

    const warn = document.getElementById('collision-warn');
    warn.style.display = (bearb === 'innen' && f_dia >= sw) ? 'block' : 'none';

    const p0x = (bearb === 'aussen') ? (sw + f_dia + 10) : 0;
    zoom = 85 / Math.max(p0x/2 || 5, (r_calc + f_dia/2) * 1.2);

    const wpPts = getHexPoints(r_wp);
    const pathPts = getHexPoints(r_calc);

    document.getElementById('wp-poly').setAttribute('points', wpPts.map(p => `${p.x * zoom},${-p.y * zoom}`).join(' '));
    document.getElementById('path-poly').setAttribute('points', pathPts.map(p => `${p.x * zoom},${-p.y * zoom}`).join(' '));
    document.getElementById('tool-vis').setAttribute('r', (f_dia / 2) * zoom);

    points = [{x: p0x, y: 0}, ...pathPts.map(p => ({x: p.x * 2, y: p.y})), {x: pathPts[0].x * 2, y: pathPts[0].y}];
    renderCode(f_val);
}

function renderCode(f) {
    const ax = (currentMode === 'Y-AXIS') ? 'Y' : 'C';
    const output = document.getElementById('code-output');
    output.innerHTML = '';

    const addLine = (text, idx) => {
        const div = document.createElement('div');
        div.className = 'line';
        if (text.includes('(')) div.className += ' comment';
        div.innerHTML = text;
        if (idx !== null) div.onclick = () => move(idx);
        output.appendChild(div);
    };

    addLine(`G0 <span class="hl">X${points[0].x.toFixed(3)}</span> ${ax}0.0`, 0);

    if (currentMode === 'G112') {
        addLine('(G112 START)', null);
        points.slice(1).forEach((p, i) => {
            addLine(`G1 <span class="hl">X${p.x.toFixed(3)}</span> C${p.y.toFixed(3)} F${f}`, i + 1);
        });
        addLine('(G112 END)', null);
    } else if (currentMode === 'G112Comp') {
        addLine('(G112 START)', null);
        addLine(`G1 <span class="hl">G41</span> X${points[1].x.toFixed(3)} C${points[1].y.toFixed(3)} F${f}`, 1);
        points.slice(2).forEach((p, i) => {
            addLine(`X${p.x.toFixed(3)} C${p.y.toFixed(3)}`, i + 2);
        });
        addLine(`G40 X${points[0].x.toFixed(3)} C0.0`, 0);
        addLine('(G112 END)', null);
    } else {
        addLine(`G1 <span class="hl">G41</span> X${points[1].x.toFixed(3)} Y${points[1].y.toFixed(3)} F${f}`, 1);
        points.slice(2).forEach((p, i) => {
            addLine(`X${p.x.toFixed(3)} Y${p.y.toFixed(3)}`, i + 2);
        });
        addLine(`G40 X${points[0].x.toFixed(3)} Y0.0`, 0);
    }
    
    move(0);
}

function move(i) {
    const p = points[i];
    const dot = document.getElementById('tool-vis');
    const axLabel = (currentMode === 'Y-AXIS' ? 'Y' : 'C');
    
    dot.setAttribute('cx', (p.x / 2) * zoom);
    dot.setAttribute('cy', -p.y * zoom);
    document.getElementById('p-coords').innerText = `X${p.x.toFixed(3)} ${axLabel}${p.y.toFixed(3)}`;
}

calc();
</script>
</body>
</html>
