<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanuc G112 Helper</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #f5f5f7; --card: #ffffff; --accent: #ff9500; --text: #1d1d1f; --border: #d2d2d7; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 12px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 420px; }
        
        header { margin-bottom: 15px; border-left: 5px solid var(--accent); padding-left: 12px; }
        header h1 { margin: 0; font-size: 20px; font-weight: 800; text-transform: uppercase; }

        .section { background: var(--card); border-radius: 16px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
        .label { display: block; font-size: 10px; font-weight: 800; color: #86868b; text-transform: uppercase; margin-bottom: 6px; }
        
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        input { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 16px; font-weight: 700; background: #fff; outline: none; box-sizing: border-box; }

        .code-container { background: #000; border-radius: 18px; padding: 15px; border: 1px solid #333; }
        .code-line { font-family: 'SF Mono', monospace; font-size: 13px; line-height: 1.6; color: #34c759; border-bottom: 1px solid #1a1a1a; padding: 4px 0; }
        .hl { color: var(--accent); font-weight: bold; }
        .comment { color: #636366; font-size: 11px; }
    </style>
</head>
<body>
<div class="container">
    <header><h1>G112 Polar-Helper</h1></header>

    <div class="section">
        <div class="grid">
            <div>
                <label class="label">Schlüsselweite (SW)</label>
                <input type="number" id="sw" value="19" oninput="calc()">
            </div>
            <div>
                <label class="label">Fräser Ø</label>
                <input type="number" id="fdia" value="10" oninput="calc()">
            </div>
        </div>
        <div style="margin-top:12px">
            <label class="label">Sicherheitsabstand (R)</label>
            <input type="number" id="safe" value="2.0" oninput="calc()">
        </div>
    </div>

    <div class="code-container">
        <div class="code-line">G112 <span class="comment">(POLAR EIN)</span></div>
        <div class="code-line" id="l1"></div>
        <div class="code-line" id="l2"></div>
        <div class="code-line" id="l3"></div>
        <div class="code-line">G113 <span class="comment">(POLAR AUS)</span></div>
    </div>
</div>

<script>
function calc() {
    const sw = parseFloat(document.getElementById('sw').value) || 0;
    const fdia = parseFloat(document.getElementById('fdia').value) || 0;
    const safe = parseFloat(document.getElementById('safe').value) || 0;

    // Расчет для фрезеровки одной грани (лыски) в G112
    // X в G112 - это диаметр, C - это радиус (как Y)
    const xStart = (sw + fdia + (safe * 2)).toFixed(3);
    const xFinal = sw.toFixed(3);
    const cPos = (sw / 2).toFixed(3);

    document.getElementById('l1').innerHTML = `G0 <span class="hl">X${xStart}</span> C0.0`;
    document.getElementById('l2').innerHTML = `G1 <span class="hl">X${xFinal}</span> F0.1`;
    document.getElementById('l3').innerHTML = `G1 C${cPos} F0.15 <span class="comment">(Y-BEWEGUNG)</span>`;
}
calc();
</script>
</body>
</html>
