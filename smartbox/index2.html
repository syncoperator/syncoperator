<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: rgba(0, 0, 0, 0.1);
        }

        body { 
            background: var(--bg); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            color: var(--text-primary); 
            -webkit-tap-highlight-color: transparent;
        }

        header {
            background: rgba(255, 255, 255, 0.8); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px; 
            border-bottom: 0.5px solid var(--border); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }

        .view { display: none; }
        .view.active { display: block; }

        .project-header { padding: 24px 20px; background: #fff; border-bottom: 1px solid var(--border); }
        .p-num-title { font-size: 42px; font-weight: 900; letter-spacing: -1.5px; margin: 4px 0; text-transform: uppercase; }

        .list-item {
            background: var(--surface); 
            border-radius: 20px; 
            margin: 12px 16px; 
            padding: 18px;
            border: 0.5px solid var(--border); 
            display: flex; 
            align-items: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.1s;
        }

        .t-id-label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 2px; }
        .t-name-label { font-size: 24px; font-weight: 900; line-height: 1.1; margin-bottom: 8px; }
        
        .loc-tag { 
            font-size: 10px; font-weight: 800; padding: 4px 10px; border-radius: 6px; 
            display: inline-block; text-transform: uppercase; 
        }
        .loc-tag.sonder { background: var(--accent); color: #fff; }
        .loc-tag.standart { background: #1d1d1f; color: #fff; }

        .actions-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(15px); 
            padding: 12px 24px; border-radius: 100px; z-index: 1500;
            display: flex; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .btn-action { background: none; color: #fff; border: none; font-weight: 700; font-size: 14px; cursor: pointer; }
        .btn-save { background: var(--accent); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 16px; font-weight: 700; font-size: 16px; margin-top: 10px; cursor: pointer; }
        .btn-secondary { background: #f2f2f7; color: #1d1d1f; border: none; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer; }
        .btn-pdf { background: #000; color: #fff; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 800; font-size: 12px; cursor: pointer; }

        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); 
            z-index: 2000; align-items: flex-end; backdrop-filter: blur(10px); 
        }
        .modal-content { 
            background: #fff; width: 100%; border-radius: 32px 32px 0 0; 
            padding: 30px; box-sizing: border-box; max-height: 95vh; overflow-y: auto; 
        }
        
        input, textarea { 
            width: 100%; padding: 16px; margin: 8px 0; border: none; border-radius: 14px; 
            font-size: 16px; box-sizing: border-box; background: #f5f5f7; font-family: inherit; font-weight: 600; 
        }

        .toggle-btn { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; font-weight: 700; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
        .switch { width: 44px; height: 24px; background: #e5e5e7; border-radius: 20px; position: relative; transition: 0.3s; }
        .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle-btn.on .switch { background: #34c759; }
        .toggle-btn.on .switch::after { left: 22px; }

        .handle { cursor: grab; padding: 15px 5px; color: #d2d2d7; font-size: 24px; margin-right: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .scroll-pad { height: 180px; }

        .sortable-ghost { opacity: 0.3; background: #cce4ff; }
    </style>
</head>
<body>

    <header>
        <div style="font-weight: 900; letter-spacing: -0.5px; font-size: 18px;">SMARTBOX <span style="color:var(--accent)">PRO</span></div>
        <button class="btn-secondary" onclick="openImport()">ДАННЫЕ</button>
    </header>

    <!-- Главная страница (Проекты) -->
    <div id="v-home" class="view active">
        <div class="project-header">
            <div class="t-id-label">ОБЗОР</div>
            <div class="p-num-title">ПРОЕКТЫ</div>
        </div>
        <div id="list-p"></div>
        <div class="scroll-pad"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ НОВЫЙ ПРОЕКТ</button>
        </div>
    </div>

    <!-- Детализация проекта (Инструменты) -->
    <div id="v-det" class="view">
        <div class="project-header">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="btn-secondary" onclick="goHome()">← НАЗАД</button>
                <div style="display:flex; gap:8px;">
                    <button class="btn-secondary" onclick="editCurrentProject()">ИЗМЕНИТЬ</button>
                    <button class="btn-pdf" id="pdf-btn">PDF ЭКСПОРТ</button>
                </div>
            </div>
            <div class="t-id-label">НОМЕР ПРОЕКТА</div>
            <div class="p-num-title" id="h-num">---</div>
            <div style="font-size:20px; font-weight:700; color:var(--text-secondary);" id="h-nam">---</div>
        </div>
        <div id="list-t"></div>
        <div class="scroll-pad"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ ИНСТРУМЕНТ</button>
        </div>
    </div>

    <!-- Модальное окно Проекта -->
    <div id="m-p" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 20px; font-weight:900; font-size:28px;">Проект</h2>
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="НОМЕР ПРОЕКТА">
            <input type="text" id="p-nam" placeholder="НАЗВАНИЕ ПРОЕКТА">
            <div class="grid-2">
                <input type="text" id="p-lzf" placeholder="LZF">
                <input type="text" id="p-mat" placeholder="МАТЕРИАЛ">
                <input type="text" id="p-slg" placeholder="ПИЛА">
                <input type="text" id="p-abs" placeholder="ОТСТУП">
                <input type="text" id="p-grf" placeholder="КУЛАЧКИ">
                <input type="text" id="p-stk" placeholder="ШТОК">
            </div>
            <button class="btn-save" onclick="saveP()">СОХРАНИТЬ</button>
            <button id="btn-del-p" style="color:red; background:none; border:none; width:100%; margin-top:15px; font-weight:700; display:none; cursor:pointer" onclick="delP()">Удалить проект</button>
        </div>
    </div>

    <!-- Модальное окно Инструмента -->
    <div id="m-t" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 20px; font-weight:900; font-size:28px;">Инструмент</h2>
            <input type="hidden" id="t-idx">
            <input type="text" id="t-bem" placeholder="T-НОМЕР (напр. T01)">
            <input type="text" id="t-nm" placeholder="ОПИСАНИЕ (напр. ФРЕЗА)">
            <div id="btn-storage-toggle" class="toggle-btn">
                <span>СТАНДАРТ (СКЛАД)</span>
                <div class="switch"></div>
            </div>
            <input type="text" id="t-loc" placeholder="МЕСТО ХРАНЕНИЯ (напр. A-01)">
            <textarea id="t-kom" placeholder="КОММЕНТАРИЙ" rows="3"></textarea>
            <button class="btn-save" onclick="saveT()">СОХРАНИТЬ</button>
            <button id="btn-del-t" style="color:red; background:none; border:none; width:100%; margin-top:15px; font-weight:700; cursor:pointer;" onclick="delT()">Удалить из списка</button>
        </div>
    </div>

    <!-- Управление данными -->
    <div id="m-imp" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="font-weight:900; font-size:28px;">Менеджер Данных</h2>
            <textarea id="imp-area" style="height:250px; font-family:monospace; font-size:12px;" placeholder="Вставьте JSON для импорта"></textarea>
            <div class="grid-2">
                <button class="btn-secondary" onclick="exportJSON()">JSON ЭКСПОРТ</button>
                <button class="btn-save" style="margin:0" onclick="importAnyJSON()">JSON ИМПОРТ</button>
            </div>
        </div>
    </div>

    <script>
        const STORAGE_KEY = 'SMARTBOX_PRO_V2_DATA';
        let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        let currentIdx = null;
        let sortable = null;

        const el = (id) => document.getElementById(id);

        function renderList() {
            el('list-p').innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div style="flex:1">
                        <div class="t-id-label">PROJEKT</div>
                        <div class="t-name-label">${p.num || '---'}</div>
                        <div style="font-size:15px; font-weight:700; color:var(--text-secondary);">${p.name || ''}</div>
                    </div>
                    <div style="color:#d2d2d7; font-size:24px;">❯</div>
                </div>`).join('');
        }

        function openProject(i) {
            currentIdx = i;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-det').classList.add('active');
            el('h-num').innerText = db[i].num || '---';
            el('h-nam').innerText = db[i].name || '---';
            renderTools();
        }

        function goHome() {
            currentIdx = null;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-home').classList.add('active');
            renderList();
        }

        function renderTools() {
            const list = el('list-t');
            const tools = db[currentIdx].tools || [];
            
            list.innerHTML = tools.map((t, i) => `
                <div class="list-item" data-id="${i}">
                    <div class="handle">≡</div>
                    <div style="flex:1" onclick="modalT(${i})">
                        <div class="t-id-label">${t.bem || 'T-NR'}</div>
                        <div class="t-name-label">${t.nm || '---'}</div>
                        <div class="loc-tag ${t.isStandart ? 'standart' : 'sonder'}">
                            ${t.isStandart ? 'STANDART | ' + (t.loc || 'LAGER') : 'SONDER | BLAUKISTE'}
                        </div>
                        ${t.kom ? `<div style="font-size:12px; margin-top:8px; color:#888; font-weight:600;">${t.kom}</div>` : ''}
                    </div>
                </div>`).join('');

            if(sortable) sortable.destroy();
            sortable = new Sortable(list, {
                handle: '.handle',
                animation: 250,
                ghostClass: 'sortable-ghost',
                onEnd: () => {
                    const newOrder = Array.from(list.querySelectorAll('.list-item')).map(item => {
                        return db[currentIdx].tools[parseInt(item.dataset.id)];
                    });
                    db[currentIdx].tools = newOrder;
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                    renderTools(); // Обновляем индексы в data-id
                }
            });
        }

        // Логика Проектов
        function modalP() {
            el('p-idx').value = '';
            ['p-num','p-nam','p-lzf','p-mat','p-slg','p-abs','p-grf','p-stk'].forEach(id => el(id).value = '');
            el('btn-del-p').style.display = 'none';
            el('m-p').style.display = 'flex';
        }

        function editCurrentProject() {
            const p = db[currentIdx];
            el('p-idx').value = currentIdx;
            el('p-num').value = p.num; el('p-nam').value = p.name;
            el('p-lzf').value = p.lzf; el('p-mat').value = p.mat;
            el('p-slg').value = p.slg; el('p-abs').value = p.abs;
            el('p-grf').value = p.grf; el('p-stk').value = p.stk;
            el('btn-del-p').style.display = 'block';
            el('m-p').style.display = 'flex';
        }

        function saveP() {
            const i = el('p-idx').value;
            const data = {
                num: el('p-num').value.toUpperCase(),
                name: el('p-nam').value.toUpperCase(),
                lzf: el('p-lzf').value, mat: el('p-mat').value,
                slg: el('p-slg').value, abs: el('p-abs').value,
                grf: el('p-grf').value, stk: el('p-stk').value,
                tools: i !== '' ? db[i].tools : []
            };
            if(i === '') db.push(data); else db[i] = data;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            if(i !== '') { el('h-num').innerText = data.num; el('h-nam').innerText = data.name; }
            renderList(); el('m-p').style.display = 'none';
        }

        function delP() {
            if(confirm('Удалить этот проект и все его инструменты?')) {
                db.splice(currentIdx, 1);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                el('m-p').style.display = 'none';
                goHome();
            }
        }

        // Логика Инструментов
        function modalT(i = null) {
            const isEdit = i !== null;
            el('t-idx').value = isEdit ? i : '';
            const t = isEdit ? db[currentIdx].tools[i] : {bem:'', nm:'', isStandart:false, loc:'', kom:''};
            el('t-bem').value = t.bem; el('t-nm').value = t.nm; el('t-loc').value = t.loc; el('t-kom').value = t.kom;
            const toggle = el('btn-storage-toggle');
            t.isStandart ? toggle.classList.add('on') : toggle.classList.remove('on');
            toggle.onclick = () => toggle.classList.toggle('on');
            el('btn-del-t').style.display = isEdit ? 'block' : 'none';
            el('m-t').style.display = 'flex';
        }

        function saveT() {
            const i = el('t-idx').value;
            const tool = {
                bem: el('t-bem').value.toUpperCase(),
                nm: el('t-nm').value.toUpperCase(),
                isStandart: el('btn-storage-toggle').classList.contains('on'),
                loc: el('t-loc').value.toUpperCase(),
                kom: el('t-kom').value.toUpperCase()
            };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(i === '') db[currentIdx].tools.push(tool); else db[currentIdx].tools[i] = tool;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            renderTools(); el('m-t').style.display = 'none';
        }

        function delT() {
            db[currentIdx].tools.splice(el('t-idx').value, 1);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            renderTools(); el('m-t').style.display = 'none';
        }

        // Данные
        function openImport() { el('imp-area').value = ''; el('m-imp').style.display = 'flex'; }
        function exportJSON() { el('imp-area').value = JSON.stringify(db, null, 2); }
        function importAnyJSON() {
            try {
                const data = JSON.parse(el('imp-area').value);
                if(Array.isArray(data)) { 
                    db = data; 
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(db)); 
                    renderList(); 
                    el('m-imp').style.display='none'; 
                }
            } catch(e) { alert('Ошибка формата JSON'); }
        }

        // Генерация PDF (Фикс разрывов и дизайна)
        function makePDF() {
            const p = db[currentIdx];
            if(!p) return;
            const sonder = (p.tools || []).filter(x => !x.isStandart);
            const standart = (p.tools || []).filter(x => x.isStandart);

            const row = (t, info) => `
                <div class="pdf-row">
                    <div class="pdf-main">
                        <div class="pdf-t-name">${t.nm || '---'}</div>
                        <div class="pdf-t-info">${info} ${t.kom ? ' | ' + t.kom : ''}</div>
                    </div>
                    <div class="pdf-side">
                        <div class="pdf-side-lbl">BEMERKUNG</div>
                        <div class="pdf-side-val">${t.bem || '--'}</div>
                    </div>
                </div>`;

            const html = `<!DOCTYPE html><html><head><style>
                @page { size: A4; margin: 10mm; }
                body { font-family: sans-serif; margin: 0; color: #000; }
                .pdf-wrapper { border: 3px solid #000; width: 100%; box-sizing: border-box; }
                .pdf-header { display: flex; border-bottom: 3px solid #000; background: #fff; }
                .pdf-h-left { flex: 1; padding: 25px; }
                .pdf-h-right { width: 240px; border-left: 3px solid #000; padding: 15px; }
                .pdf-p-name { font-size: 16px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
                .pdf-p-num { font-size: 65px; font-weight: 900; line-height: 0.9; letter-spacing: -3px; }
                .pdf-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 12px; font-weight: 900; }
                .pdf-meta div { display: flex; justify-content: space-between; border-bottom: 1px solid #ccc; padding: 3px 0; }
                .pdf-section { background: #000; color: #fff; padding: 10px 15px; font-weight: 900; font-size: 14px; text-transform: uppercase; }
                .pdf-row { display: flex; border-bottom: 2px solid #000; page-break-inside: avoid; }
                .pdf-row:last-child { border-bottom: none; }
                .pdf-main { flex: 1; padding: 12px 20px; }
                .pdf-side { width: 180px; border-left: 2px solid #000; padding: 10px; text-align: right; display: flex; flex-direction: column; justify-content: center; }
                .pdf-t-name { font-weight: 900; font-size: 24px; line-height: 1.1; margin-bottom: 2px; }
                .pdf-t-info { font-size: 11px; font-weight: 700; color: #333; text-transform: uppercase; }
                .pdf-side-lbl { font-size: 9px; color: #666; font-weight: 900; margin-bottom: 2px; }
                .pdf-side-val { font-weight: 900; font-size: 22px; line-height: 1; }
                /* Исправляем разрыв нижней границы на страницах */
                .pdf-wrapper { border-bottom: 3px solid #000; }
            </style></head><body>
                <div class="pdf-wrapper">
                    <div class="pdf-header">
                        <div class="pdf-h-left">
                            <div class="pdf-p-name">${p.name || ''}</div>
                            <div class="pdf-p-num">${p.num || '---'}</div>
                        </div>
                        <div class="pdf-h-right">
                            <div class="pdf-meta">
                                <div><span>MAT:</span><span>${p.mat||'--'}</span></div>
                                <div><span>LZF:</span><span>${p.lzf||'--'}</span></div>
                                <div><span>SÄGE:</span><span>${p.slg||'--'}</span></div>
                                <div><span>ABST:</span><span>${p.abs||'--'}</span></div>
                                <div><span>BACK:</span><span>${p.grf||'--'}</span></div>
                                <div><span>STK:</span><span>${p.stk||'--'}</span></div>
                            </div>
                        </div>
                    </div>
                    ${sonder.length ? '<div class="pdf-section">Sonderwerkzeuge (СПЕЦ)</div>' + sonder.map(t => row(t, 'IN BLAUKISTE')).join('') : ''}
                    ${standart.length ? '<div class="pdf-section">Standartwerkzeuge (СКЛАД)</div>' + standart.map(t => row(t, t.loc || 'LAGER')).join('') : ''}
                </div>
                <script>window.onload = () => { setTimeout(() => { window.print(); window.close(); }, 300); };<\/script>
            </body></html>`;

            // Создаем временное окно для печати
            const printWin = window.open('', '_blank');
            if (printWin) {
                printWin.document.write(html);
                printWin.document.close();
            } else {
                alert('Пожалуйста, разрешите всплывающие окна для экспорта PDF');
            }
        }

        window.onload = () => {
            renderList();
            // Обработчик кнопки PDF с проверкой на существование
            const btn = el('pdf-btn');
            if(btn) btn.onclick = makePDF;
        };
    </script>
</body>
</html>
