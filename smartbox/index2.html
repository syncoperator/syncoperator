<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMARTBOX PRO V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-primary: #1c1c1e;
            --text-secondary: #8e8e93;
            --border-ui: rgba(0,0,0,0.1);
        }

        body { 
            background: var(--bg); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* UI Styles */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            padding: 15px 20px;
            border-bottom: 0.5px solid var(--border-ui);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .view { display: none; padding-bottom: 120px; }
        .view.active { display: block; }

        .project-header { background: #fff; padding: 25px 20px; border-bottom: 1px solid var(--border-ui); }
        .p-num-title { font-size: 48px; font-weight: 900; letter-spacing: -3px; margin: 5px 0; line-height: 0.9; }

        .list-item {
            background: #fff; margin: 12px 16px; padding: 16px; border-radius: 18px;
            display: flex; align-items: center; border: 0.5px solid var(--border-ui);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .t-id-label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; }
        .t-name-label { font-size: 22px; font-weight: 900; line-height: 1.1; margin-top: 2px; }
        
        .loc-tag { 
            font-size: 10px; font-weight: 800; padding: 4px 8px; border-radius: 5px; 
            margin-top: 8px; display: inline-block; text-transform: uppercase;
        }
        .loc-tag.sonder { background: var(--accent); color: #fff; }
        .loc-tag.standart { background: #1c1c1e; color: #fff; }

        .actions-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #000; padding: 12px 25px; border-radius: 100px; z-index: 1500;
            display: flex; gap: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .btn-action { background: none; color: #fff; border: none; font-weight: 700; font-size: 14px; }
        .btn-save { background: var(--accent); color: #fff; width: 100%; padding: 18px; border: none; border-radius: 15px; font-weight: 700; margin-top: 15px; }
        .btn-secondary { background: #e5e5ea; color: #000; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 700; font-size: 12px; }
        .btn-pdf { background: #000; color: #fff; border: none; padding: 8px 15px; border-radius: 8px; font-weight: 800; font-size: 12px; }

        .modal { 
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); 
            z-index: 2000; align-items: flex-end; backdrop-filter: blur(8px);
        }
        .modal-content { 
            background: #fff; width: 100%; border-radius: 30px 30px 0 0; padding: 30px; 
            box-sizing: border-box; max-height: 90vh; overflow-y: auto;
        }

        input, textarea { 
            width: 100%; padding: 15px; margin: 8px 0; border: none; border-radius: 12px; 
            background: #f2f2f7; font-size: 16px; box-sizing: border-box; font-weight: 600;
        }

        .handle { cursor: grab; padding: 10px; color: #ccc; font-size: 20px; margin-right: 10px; }

        /* PDF PREVIEW (Full Overlay) */
        #pdf-overlay {
            display: none; position: fixed; inset: 0; background: #fff; z-index: 5000;
            overflow-y: auto; padding: 0;
        }
        
        .pdf-controls {
            position: sticky; top: 0; background: #f9f9f9; padding: 15px;
            display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;
            z-index: 5001;
        }

        /* PRINT STYLES */
        @media print {
            .no-print { display: none !important; }
            body { background: #fff; margin: 0; padding: 0; }
            #pdf-overlay { display: block !important; position: static; }
            .pdf-container { width: 100% !important; border: none !important; }
        }

        .pdf-container {
            width: 1000px; margin: 20px auto; background: #fff; color: #000;
            border: 5px solid #000; box-sizing: border-box; text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header class="no-print">
        <div style="font-weight: 900; font-size: 18px;">SMARTBOX <span style="color:var(--accent)">PRO</span></div>
        <button class="btn-secondary" onclick="openImport()">DATEN</button>
    </header>

    <div id="v-home" class="view active no-print">
        <div class="project-header">
            <div class="t-id-label">ÜBERSICHT</div>
            <div class="p-num-title">AUFTRÄGE</div>
        </div>
        <div id="list-p"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ NEUER AUFTRAG</button>
        </div>
    </div>

    <div id="v-det" class="view no-print">
        <div class="project-header">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <button class="btn-secondary" onclick="goHome()">← BACK</button>
                <div style="display:flex; gap:8px;">
                    <button class="btn-secondary" onclick="editCurrentProject()">EDIT</button>
                    <button class="btn-pdf" onclick="renderPDF()">PDF EXPORT</button>
                </div>
            </div>
            <div class="t-id-label" id="h-sub">AUFTRAGSNUMMER</div>
            <div class="p-num-title" id="h-num">---</div>
            <div style="font-size:20px; font-weight:700; color:var(--text-secondary);" id="h-nam">---</div>
        </div>
        <div id="list-t"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ WERKZEUG</button>
        </div>
    </div>

    <!-- PDF OVERLAY LAYER -->
    <div id="pdf-overlay">
        <div class="pdf-controls no-print">
            <button class="btn-secondary" onclick="closePDF()">← EDIT MODUS</button>
            <button class="btn-pdf" onclick="window.print()">DRUCKEN / SPEICHERN</button>
        </div>
        <div id="pdf-content"></div>
    </div>

    <!-- Modals -->
    <div id="m-p" class="modal no-print" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 20px; font-weight:900;">Auftrag Details</h2>
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="AUFTRAGSNUMMER (z.B. 230947)">
            <input type="text" id="p-nam" placeholder="BEZEICHNUNG">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="p-mat" placeholder="MAT">
                <input type="text" id="p-lzf" placeholder="LZF">
                <input type="text" id="p-slg" placeholder="SÄGE">
                <input type="text" id="p-abs" placeholder="ABST">
                <input type="text" id="p-grf" placeholder="BACK">
                <input type="text" id="p-stk" placeholder="STK">
            </div>
            <button class="btn-save" onclick="saveP()">SPEICHERN</button>
            <button id="btn-del-p" style="color:red; background:none; border:none; width:100%; margin-top:20px; font-weight:700; display:none" onclick="delP()">Löschen</button>
        </div>
    </div>

    <div id="m-t" class="modal no-print" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 20px; font-weight:900;">Werkzeug</h2>
            <input type="hidden" id="t-idx">
            <input type="text" id="t-bem" placeholder="T-NUMMER (BEMERKUNG)">
            <input type="text" id="t-nm" placeholder="BESCHREIBUNG">
            <div id="btn-storage-toggle" style="display:flex; justify-content:space-between; padding:15px 0; font-weight:700; cursor:pointer;">
                <span>LAGER (STANDART)</span>
                <input type="checkbox" id="t-is-std" style="width:20px; margin:0;">
            </div>
            <input type="text" id="t-loc" placeholder="PLATZ (z.B. FACH A1)">
            <textarea id="t-kom" placeholder="ZUSATZ INFO / KOMMENTAR" rows="2"></textarea>
            <button class="btn-save" onclick="saveT()">HINZUFÜGEN</button>
            <button id="btn-del-t" style="color:red; background:none; border:none; width:100%; margin-top:20px; font-weight:700;" onclick="delT()">Löschen</button>
        </div>
    </div>

    <script>
        const DB_KEY = 'SB_PRO_V2_DATA';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let curIdx = null;
        let sortable = null;

        const el = (id) => document.getElementById(id);

        function renderList() {
            el('list-p').innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div style="flex:1">
                        <div class="t-id-label">AUFTRAG</div>
                        <div class="t-name-label">${p.num || '---'}</div>
                        <div style="font-size:14px; font-weight:700; color:var(--text-secondary);">${p.name || ''}</div>
                    </div>
                    <div style="color:#ccc; font-size:20px;">❯</div>
                </div>`).join('');
        }

        function openProject(i) {
            curIdx = i;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-det').classList.add('active');
            el('h-num').innerText = db[i].num || '---';
            el('h-nam').innerText = db[i].name || '---';
            renderTools();
        }

        function goHome() {
            curIdx = null;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-home').classList.add('active');
            renderList();
        }

        function renderTools() {
            const list = el('list-t');
            const tools = db[curIdx].tools || [];
            list.innerHTML = tools.map((t, i) => `
                <div class="list-item" data-id="${i}">
                    <div class="handle">≡</div>
                    <div style="flex:1" onclick="modalT(${i})">
                        <div class="t-id-label">${t.bem || 'T-NR'}</div>
                        <div class="t-name-label">${t.nm || 'UNBEKANNT'}</div>
                        <div class="loc-tag ${t.isStd ? 'standart' : 'sonder'}">
                            ${t.isStd ? 'LAGER: ' + (t.loc || '---') : 'SONDER: BLAUKISTE'}
                        </div>
                    </div>
                </div>`).join('');

            if(sortable) sortable.destroy();
            sortable = new Sortable(list, {
                handle: '.handle', animation: 200,
                onEnd: () => {
                    db[curIdx].tools = Array.from(list.querySelectorAll('.list-item')).map(item => db[curIdx].tools[parseInt(item.dataset.id)]);
                    localStorage.setItem(DB_KEY, JSON.stringify(db));
                    renderTools();
                }
            });
        }

        // Logic
        function modalP() {
            el('p-idx').value = '';
            ['p-num','p-nam','p-mat','p-lzf','p-slg','p-abs','p-grf','p-stk'].forEach(id => el(id).value = '');
            el('m-p').style.display = 'flex'; el('btn-del-p').style.display = 'none';
        }

        function editCurrentProject() {
            const p = db[curIdx]; el('p-idx').value = curIdx;
            el('p-num').value = p.num; el('p-nam').value = p.name;
            el('p-mat').value = p.mat; el('p-lzf').value = p.lzf;
            el('p-slg').value = p.slg; el('p-abs').value = p.abs;
            el('p-grf').value = p.grf; el('p-stk').value = p.stk;
            el('m-p').style.display = 'flex'; el('btn-del-p').style.display = 'block';
        }

        function saveP() {
            const i = el('p-idx').value;
            const data = {
                num: el('p-num').value.toUpperCase(), name: el('p-nam').value.toUpperCase(),
                mat: el('p-mat').value, lzf: el('p-lzf').value, slg: el('p-slg').value,
                abs: el('p-abs').value, grf: el('p-grf').value, stk: el('p-stk').value,
                tools: i !== '' ? db[i].tools : []
            };
            if(i === '') db.push(data); else db[i] = data;
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            if(i !== '') { el('h-num').innerText = data.num; el('h-nam').innerText = data.name; }
            renderList(); el('m-p').style.display = 'none';
        }

        function delP() {
            if(confirm('Auftrag löschen?')) { db.splice(curIdx, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); goHome(); el('m-p').style.display='none'; }
        }

        function modalT(i = null) {
            const edit = i !== null; el('t-idx').value = edit ? i : '';
            const t = edit ? db[curIdx].tools[i] : {bem:'', nm:'', isStd:false, loc:'', kom:''};
            el('t-bem').value = t.bem; el('t-nm').value = t.nm; 
            el('t-is-std').checked = t.isStd; el('t-loc').value = t.loc; el('t-kom').value = t.kom;
            el('m-t').style.display = 'flex'; el('btn-del-t').style.display = edit ? 'block' : 'none';
        }

        function saveT() {
            const i = el('t-idx').value;
            const t = {
                bem: el('t-bem').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(),
                isStd: el('t-is-std').checked, loc: el('t-loc').value.toUpperCase(), kom: el('t-kom').value.toUpperCase()
            };
            if(!db[curIdx].tools) db[curIdx].tools = [];
            if(i === '') db[curIdx].tools.push(t); else db[curIdx].tools[i] = t;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); el('m-t').style.display = 'none';
        }

        function delT() {
            db[curIdx].tools.splice(el('t-idx').value, 1);
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); el('m-t').style.display = 'none';
        }

        function openImport() { 
            const val = prompt('Daten einfügen (JSON):');
            if(val) { try { db = JSON.parse(val); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); } catch(e){alert('Error');} }
        }

        // --- PDF RENDER ENGINE ---
        function renderPDF() {
            const p = db[curIdx];
            if(!p) return;
            
            const sonder = (p.tools || []).filter(t => !t.isStd);
            const standard = (p.tools || []).filter(t => t.isStd);

            const row = (t, loc) => `
                <div style="display:flex; border-bottom:4px solid #000; min-height:80px; page-break-inside:avoid;">
                    <div style="flex:1; padding:15px 25px;">
                        <div style="font-weight:900; font-size:32px; line-height:1;">${t.nm || '---'}</div>
                        <div style="font-size:14px; font-weight:800; color:#333; margin-top:5px;">${loc} ${t.kom ? ' | ' + t.kom : ''}</div>
                    </div>
                    <div style="width:220px; border-left:4px solid #000; padding:10px; display:flex; flex-direction:column; justify-content:center; text-align:right;">
                        <div style="font-size:11px; font-weight:900; color:#666;">BEMERKUNG</div>
                        <div style="font-weight:900; font-size:28px;">${t.bem || '--'}</div>
                    </div>
                </div>`;

            const html = `
                <div class="pdf-container">
                    <!-- HEADER -->
                    <div style="display:flex; border-bottom:5px solid #000;">
                        <div style="flex:1; padding:30px;">
                            <div style="font-size:18px; font-weight:900; color:#000;">${p.name || 'UNBEKANNT'}</div>
                            <div style="font-size:95px; font-weight:900; line-height:0.8; letter-spacing:-6px; margin-top:10px;">${p.num || '---'}</div>
                        </div>
                        <div style="width:320px; border-left:5px solid #000; padding:15px;">
                            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; font-size:15px; font-weight:900;">
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>MAT:</span><span>${p.mat||'--'}</span></div>
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>LZF:</span><span>${p.lzf||'--'}</span></div>
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>SÄGE:</span><span>${p.slg||'--'}</span></div>
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>ABST:</span><span>${p.abs||'--'}</span></div>
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>BACK:</span><span>${p.grf||'--'}</span></div>
                                <div style="border-bottom:2px solid #000; display:flex; justify-content:space-between;"><span>STK:</span><span>${p.stk||'--'}</span></div>
                            </div>
                        </div>
                    </div>

                    <!-- SONDER -->
                    ${sonder.length ? `
                        <div style="background:#000; color:#fff; padding:12px 25px; font-weight:900; font-size:20px;">SONDERWERKZEUGE</div>
                        ${sonder.map(t => row(t, 'IN BLAUKISTE')).join('')}
                    ` : ''}

                    <!-- STANDART -->
                    ${standard.length ? `
                        <div style="background:#000; color:#fff; padding:12px 25px; font-weight:900; font-size:20px;">STANDARTWERKZEUGE</div>
                        ${standard.map(t => row(t, t.loc || 'LAGER')).join('')}
                    ` : ''}
                </div>`;

            el('pdf-content').innerHTML = html;
            el('pdf-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePDF() {
            el('pdf-overlay').style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onload = renderList;
    </script>
</body>
</html>
