<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SMARTBOX PRO V2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <style>
        :root {
            --bg: #f2f2f7;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-primary: #000000;
            --text-secondary: #8e8e93;
            --border-heavy: #000000;
        }

        body { 
            background: var(--bg); 
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; 
            margin: 0; 
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* UI Styling */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }

        .view { display: none; padding-bottom: 140px; }
        .view.active { display: block; }

        .project-header { background: #fff; padding: 20px; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .p-num-display { font-size: 52px; font-weight: 900; letter-spacing: -3px; line-height: 0.8; margin: 10px 0; }

        /* Tool Cards UI - T-NR on top, Name below */
        .tool-card {
            background: #fff; margin: 10px 15px; padding: 15px; border-radius: 12px;
            display: flex; align-items: center; border: 1px solid rgba(0,0,0,0.05);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .tool-info { flex: 1; }
        .t-nr-label { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 2px; }
        .t-name-label { font-size: 20px; font-weight: 900; line-height: 1.1; text-transform: uppercase; }
        .t-loc-label { font-size: 10px; font-weight: 700; color: #fff; background: #000; padding: 3px 6px; border-radius: 4px; display: inline-block; margin-top: 6px; }
        .t-loc-label.sonder { background: var(--accent); }

        .handle { cursor: grab; padding: 10px; color: #ccc; font-size: 20px; margin-right: 10px; }

        /* Floating Actions */
        .actions-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #000; padding: 10px 20px; border-radius: 50px; z-index: 1500;
            display: flex; gap: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .btn-action { background: none; color: #fff; border: none; font-weight: 800; font-size: 13px; text-transform: uppercase; }
        .btn-main { background: var(--accent); color: #fff; border: none; padding: 15px; border-radius: 12px; width: 100%; font-weight: 800; margin-top: 15px; font-size: 16px; }
        .btn-nav { background: #eee; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 700; font-size: 11px; }
        .btn-black { background: #000; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; font-weight: 800; font-size: 11px; }

        /* Modals */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; border-radius: 25px 25px 0 0; padding: 25px; box-sizing: border-box; max-height: 90vh; overflow-y: auto; }
        input, textarea { width: 100%; padding: 14px; margin: 6px 0; border: none; border-radius: 10px; background: #f2f2f7; font-size: 16px; box-sizing: border-box; font-weight: 700; }

        /* PDF Overlay */
        #pdf-overlay { display: none; position: fixed; inset: 0; background: #fff; z-index: 9999; overflow-y: auto; }
        .pdf-controls { position: sticky; top: 0; background: #f9f9f9; padding: 12px; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; z-index: 10000; }

        /* INDUSTRIAL PDF DESIGN (Matches Screenshot) */
        .pdf-page {
            width: 100%; max-width: 800px; margin: 0 auto; color: #000; 
            border: 5px solid #000; box-sizing: border-box; font-family: sans-serif;
            text-transform: uppercase;
        }
        .pdf-header { display: flex; border-bottom: 5px solid #000; }
        .pdf-header-left { flex: 1; padding: 20px; border-right: 5px solid #000; }
        .pdf-header-right { width: 280px; padding: 10px; }
        
        .pdf-title-small { font-size: 14px; font-weight: 800; margin-bottom: 2px; }
        .pdf-order-num { font-size: 90px; font-weight: 900; line-height: 0.8; letter-spacing: -6px; }
        
        .param-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; font-size: 13px; font-weight: 900; }
        .param-item { border-bottom: 1.5px solid #000; display: flex; justify-content: space-between; padding: 2px 0; }

        .section-title { background: #000; color: #fff; padding: 10px 20px; font-weight: 900; font-size: 18px; }
        
        .tool-row { display: flex; border-bottom: 4px solid #000; min-height: 75px; page-break-inside: avoid; }
        .tool-row-main { flex: 1; padding: 12px 20px; }
        .tool-row-side { width: 180px; border-left: 4px solid #000; padding: 8px; display: flex; flex-direction: column; justify-content: center; text-align: right; }
        
        .pdf-tool-name { font-size: 26px; font-weight: 900; line-height: 1; }
        .pdf-tool-sub { font-size: 11px; font-weight: 800; color: #444; margin-top: 4px; }
        .pdf-bemerkung-label { font-size: 9px; font-weight: 900; color: #666; margin-bottom: 2px; }
        .pdf-bemerkung-val { font-size: 22px; font-weight: 900; }

        @media print {
            body * { visibility: hidden; }
            #pdf-overlay, #pdf-overlay * { visibility: visible; }
            #pdf-overlay { position: absolute; left: 0; top: 0; width: 100%; display: block !important; }
            .pdf-controls { display: none !important; }
            .pdf-page { border: 5px solid #000 !important; width: 100% !important; max-width: none !important; margin: 0 !important; }
        }
    </style>
</head>
<body>

    <header class="no-print">
        <div style="font-weight: 900; font-size: 18px;">SMARTBOX <span style="color:var(--accent)">PRO</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-nav" onclick="exportData()">EXPORT</button>
            <button class="btn-nav" onclick="importData()">IMPORT</button>
        </div>
    </header>

    <!-- Project List View -->
    <div id="v-home" class="view active no-print">
        <div class="project-header">
            <div class="t-nr-label">Übersicht</div>
            <div class="p-num-display">AUFTRÄGE</div>
        </div>
        <div id="list-projects"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="openProjectModal()">+ Neuer Auftrag</button>
        </div>
    </div>

    <!-- Project Detail View -->
    <div id="v-detail" class="view no-print">
        <div class="project-header">
            <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <button class="btn-nav" onclick="showHome()">← Zurück</button>
                <div style="display:flex; gap:8px;">
                    <button class="btn-nav" onclick="editProject()">Edit</button>
                    <button class="btn-black" onclick="generatePDF()">PDF Export</button>
                </div>
            </div>
            <div class="t-nr-label" id="det-sub">Auftragsnummer</div>
            <div class="p-num-display" id="det-num">---</div>
            <div style="font-size:18px; font-weight:800; color:var(--text-secondary);" id="det-name">---</div>
        </div>
        <div id="list-tools"></div>
        <div style="height: 50px;"></div> <!-- Padding for list end -->
        <div class="actions-bar">
            <button class="btn-action" onclick="openToolModal()">+ Werkzeug hinzufügen</button>
        </div>
    </div>

    <!-- PDF Preview Overlay -->
    <div id="pdf-overlay">
        <div class="pdf-controls no-print">
            <button class="btn-nav" onclick="closePDF()">← Edit Modus</button>
            <button class="btn-black" onclick="window.print()">Drucken / Speichern</button>
        </div>
        <div id="pdf-container"></div>
    </div>

    <!-- Project Modal -->
    <div id="m-project" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 15px; font-weight:900;">Auftrag Details</h2>
            <input type="hidden" id="p-id">
            <input type="text" id="p-num" placeholder="AUFTRAGSNUMMER">
            <input type="text" id="p-name" placeholder="BEZEICHNUNG">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="p-mat" placeholder="MAT">
                <input type="text" id="p-lzf" placeholder="LZF">
                <input type="text" id="p-slg" placeholder="SÄGE">
                <input type="text" id="p-abs" placeholder="ABST">
                <input type="text" id="p-grf" placeholder="BACK">
                <input type="text" id="p-stk" placeholder="STK">
            </div>
            <button class="btn-main" onclick="saveProject()">Speichern</button>
            <button id="btn-del-p" style="color:red; background:none; border:none; width:100%; margin-top:15px; font-weight:800; display:none" onclick="deleteProject()">Auftrag löschen</button>
        </div>
    </div>

    <!-- Tool Modal -->
    <div id="m-tool" class="modal" onclick="if(event.target==this) this.style.display='none'">
        <div class="modal-content">
            <h2 style="margin:0 0 15px; font-weight:900;">Werkzeug</h2>
            <input type="hidden" id="t-id">
            <input type="text" id="t-bem" placeholder="T-NUMMER / BEMERKUNG">
            <input type="text" id="t-name" placeholder="WERKZEUG BESCHREIBUNG">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; font-weight:800;">
                <span>Lagerartikel (Standart)</span>
                <input type="checkbox" id="t-std" style="width:25px; height:25px; margin:0;">
            </div>
            <input type="text" id="t-loc" placeholder="PLATZ / KOMMENTAR">
            <button class="btn-main" onclick="saveTool()">Hinzufügen</button>
            <button id="btn-del-t" style="color:red; background:none; border:none; width:100%; margin-top:15px; font-weight:800; display:none" onclick="deleteTool()">Löschen</button>
        </div>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('SB_INDUSTRIAL_DB')) || [];
        let activeProjectIdx = null;
        let toolSortable = null;

        const el = (id) => document.getElementById(id);

        function showHome() {
            activeProjectIdx = null;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-home').classList.add('active');
            renderProjectList();
        }

        function renderProjectList() {
            el('list-projects').innerHTML = db.map((p, i) => `
                <div class="tool-card" onclick="openProjectDetails(${i})">
                    <div class="tool-info">
                        <div class="t-nr-label">AUFTRAG</div>
                        <div class="t-name-label">${p.num || '---'}</div>
                        <div style="font-size:14px; font-weight:700; color:#888;">${p.name || ''}</div>
                    </div>
                    <div style="color:#ccc;">❯</div>
                </div>
            `).join('');
        }

        function openProjectDetails(idx) {
            activeProjectIdx = idx;
            const p = db[idx];
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-detail').classList.add('active');
            el('det-num').innerText = p.num || '---';
            el('det-name').innerText = p.name || '---';
            renderToolList();
        }

        function renderToolList() {
            const list = el('list-tools');
            const tools = db[activeProjectIdx].tools || [];
            list.innerHTML = tools.map((t, i) => `
                <div class="tool-card" data-id="${i}">
                    <div class="handle">≡</div>
                    <div class="tool-info" onclick="openToolModal(${i})">
                        <div class="t-nr-label">${t.bem || 'T-NR'}</div>
                        <div class="t-name-label">${t.name || '---'}</div>
                        <div class="t-loc-label ${t.std ? '' : 'sonder'}">${t.std ? 'LAGER: ' + (t.loc || '---') : 'SONDER: BLAUKISTE'}</div>
                    </div>
                </div>
            `).join('');

            if(toolSortable) toolSortable.destroy();
            toolSortable = new Sortable(list, {
                handle: '.handle', animation: 200,
                onEnd: () => {
                    const newOrder = Array.from(list.querySelectorAll('.tool-card')).map(item => tools[item.dataset.id]);
                    db[activeProjectIdx].tools = newOrder;
                    saveToDisk();
                }
            });
        }

        // Modals Logic
        function openProjectModal() {
            el('p-id').value = '';
            ['p-num','p-name','p-mat','p-lzf','p-slg','p-abs','p-grf','p-stk'].forEach(id => el(id).value = '');
            el('btn-del-p').style.display = 'none'; el('m-project').style.display = 'flex';
        }

        function editProject() {
            const p = db[activeProjectIdx];
            el('p-id').value = activeProjectIdx;
            el('p-num').value = p.num; el('p-name').value = p.name;
            el('p-mat').value = p.mat; el('p-lzf').value = p.lzf;
            el('p-slg').value = p.slg; el('p-abs').value = p.abs;
            el('p-grf').value = p.grf; el('p-stk').value = p.stk;
            el('btn-del-p').style.display = 'block'; el('m-project').style.display = 'flex';
        }

        function saveProject() {
            const id = el('p-id').value;
            const pData = {
                num: el('p-num').value.toUpperCase(), name: el('p-name').value.toUpperCase(),
                mat: el('p-mat').value, lzf: el('p-lzf').value, slg: el('p-slg').value,
                abs: el('p-abs').value, grf: el('p-grf').value, stk: el('p-stk').value,
                tools: id !== '' ? db[id].tools : []
            };
            if(id === '') db.push(pData); else db[id] = pData;
            saveToDisk(); showHome(); el('m-project').style.display = 'none';
        }

        function deleteProject() {
            if(confirm('Löschen?')) { db.splice(activeProjectIdx, 1); saveToDisk(); showHome(); el('m-project').style.display = 'none'; }
        }

        function openToolModal(i = null) {
            const edit = i !== null; el('t-id').value = edit ? i : '';
            const t = edit ? db[activeProjectIdx].tools[i] : {bem:'', name:'', std:true, loc:''};
            el('t-bem').value = t.bem; el('t-name').value = t.name; el('t-std').checked = t.std; el('t-loc').value = t.loc;
            el('btn-del-t').style.display = edit ? 'block' : 'none'; el('m-tool').style.display = 'flex';
        }

        function saveTool() {
            const i = el('t-id').value;
            const tData = {
                bem: el('t-bem').value.toUpperCase(), name: el('t-name').value.toUpperCase(),
                std: el('t-std').checked, loc: el('t-loc').value.toUpperCase()
            };
            if(!db[activeProjectIdx].tools) db[activeProjectIdx].tools = [];
            if(i === '') db[activeProjectIdx].tools.push(tData); else db[activeProjectIdx].tools[i] = tData;
            saveToDisk(); renderToolList(); el('m-tool').style.display = 'none';
        }

        function deleteTool() {
            db[activeProjectIdx].tools.splice(el('t-id').value, 1);
            saveToDisk(); renderToolList(); el('m-tool').style.display = 'none';
        }

        function saveToDisk() { localStorage.setItem('SB_INDUSTRIAL_DB', JSON.stringify(db)); }

        function exportData() {
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'smartbox_backup.json'; a.click();
        }

        function importData() {
            const input = document.createElement('input'); input.type = 'file';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = () => { db = JSON.parse(reader.result); saveToDisk(); renderProjectList(); };
                reader.readAsText(e.target.files[0]);
            };
            input.click();
        }

        // --- PDF ENGINE ---
        function generatePDF() {
            const p = db[activeProjectIdx];
            const sonder = (p.tools || []).filter(t => !t.std);
            const standard = (p.tools || []).filter(t => t.std);

            const getToolRow = (t) => `
                <div class="tool-row">
                    <div class="tool-row-main">
                        <div class="pdf-tool-name">${t.name || '---'}</div>
                        <div class="pdf-tool-sub">${t.std ? t.loc || 'LAGER' : 'IN BLAUKISTE'}</div>
                    </div>
                    <div class="tool-row-side">
                        <div class="pdf-bemerkung-label">BEMERKUNG</div>
                        <div class="pdf-bemerkung-val">${t.bem || '--'}</div>
                    </div>
                </div>`;

            const pdfHtml = `
                <div class="pdf-page">
                    <div class="pdf-header">
                        <div class="pdf-header-left">
                            <div class="pdf-title-small">${p.name || 'UNBEKANNT'}</div>
                            <div class="pdf-order-num">${p.num || '---'}</div>
                        </div>
                        <div class="pdf-header-right">
                            <div class="param-grid">
                                <div class="param-item"><span>MAT:</span><span>${p.mat||'--'}</span></div>
                                <div class="param-item"><span>LZF:</span><span>${p.lzf||'--'}</span></div>
                                <div class="param-item"><span>SÄGE:</span><span>${p.slg||'--'}</span></div>
                                <div class="param-item"><span>ABST:</span><span>${p.abs||'--'}</span></div>
                                <div class="param-item"><span>BACK:</span><span>${p.grf||'--'}</span></div>
                                <div class="param-item"><span>STK:</span><span>${p.stk||'--'}</span></div>
                            </div>
                        </div>
                    </div>
                    ${sonder.length ? '<div class="section-title">SONDERWERKZEUGE</div>' + sonder.map(getToolRow).join('') : ''}
                    ${standard.length ? '<div class="section-title">STANDARTWERKZEUGE</div>' + standard.map(getToolRow).join('') : ''}
                </div>`;

            el('pdf-container').innerHTML = pdfHtml;
            el('pdf-overlay').style.display = 'block';
            document.body.style.overflow = 'hidden';
        }

        function closePDF() { el('pdf-overlay').style.display = 'none'; document.body.style.overflow = 'auto'; }

        renderProjectList();
    </script>
</body>
</html>
