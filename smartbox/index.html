<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartBox Pro V2</title>
    <style>
        :root { --bg: #f2f2f7; --card: #ffffff; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); margin: 0; padding: 0; user-select: none; }
        .view { display: none; padding: 20px; box-sizing: border-box; }
        .view.active { display: block; }
        
        /* Стили карточек */
        .list-item { 
            background: var(--card); margin-bottom: 12px; padding: 16px; 
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); 
            display: flex; align-items: center; cursor: pointer;
        }
        .p-num-title { font-size: 32px; font-weight: 900; letter-spacing: -1px; margin-bottom: 10px; }
        
        /* Модальные окна */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 999;
        }
        .modal-content { 
            background: #fff; padding: 20px; border-radius: 20px; width: 90%; max-width: 400px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
        }
        input { 
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; 
            border-radius: 10px; font-size: 16px; box-sizing: border-box;
        }
        
        /* Кнопки */
        button { 
            border: none; border-radius: 12px; padding: 12px 20px; 
            font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #e5e5ea; color: #000; }
        .btn-pdf { background: #000; color: #fff; }
        .btn-action { background: var(--accent); color: #fff; width: 100%; font-size: 18px; padding: 16px; }
        
        .actions-bar { position: fixed; bottom: 30px; left: 20px; right: 20px; }
        .loc-tag { font-size: 10px; padding: 4px 8px; border-radius: 6px; font-weight: 800; display: inline-block; margin-top: 5px; }
        .loc-tag.sonder { background: #000; color: #fff; }
        .loc-tag.standart { background: #007aff; color: #fff; }

        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; }
        .toggle-switch { width: 50px; height: 26px; background: #e5e5ea; border-radius: 13px; position: relative; transition: 0.3s; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 22px; height: 22px; background: #fff; border-radius: 50%; transition: 0.3s; }
        .toggle-switch.on { background: #34c759; }
        .toggle-switch.on::after { left: 26px; }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>SmartBox</h1>
            <button class="btn-secondary" onclick="openImport()">JSON</button>
        </div>
        <div id="list-p"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ NEUES PROJEKT</button>
        </div>
    </div>

    <div id="v-det" class="view">
        <div class="project-header">
            <div id="h-nam" style="font-size:12px; color:#666; font-weight:700;"></div>
            <div id="h-num" class="p-num-title"></div>
            <div style="display:flex; gap:8px; margin-bottom:20px;">
                <button class="btn-secondary" onclick="goHome()">ZURÜCK</button>
                <button class="btn-secondary" onclick="editCurrentProject()">EDIT</button>
                <button class="btn-pdf" onclick="makePDF()">PDF</button>
            </div>
        </div>
        <div id="list-t"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ WERKZEUG</button>
        </div>
    </div>

    <div id="m-p" class="modal" onclick="if(event.target==this)hide('m-p')">
        <div class="modal-content">
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJEKT NUMMER">
            <input type="text" id="p-nam" placeholder="BAUTEIL NAME">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <input type="text" id="p-lzf" placeholder="LAUFZEIT">
                <input type="text" id="p-mat" placeholder="MATERIAL">
                <input type="text" id="p-slg" placeholder="SÄGELÄNGE">
                <input type="text" id="p-abs" placeholder="ABSTAND">
                <input type="text" id="p-grf" placeholder="BACKEN">
                <input type="text" id="p-stk" placeholder="STÜCK">
            </div>
            <button class="btn-primary" onclick="saveP()" style="width:100%; margin-top:10px;">SPEICHERN</button>
        </div>
    </div>

    <div id="m-t" class="modal" onclick="if(event.target==this)hide('m-t')">
        <div class="modal-content">
            <input type="hidden" id="t-idx">
            <input type="text" id="t-id" placeholder="T-NUMMER">
            <input type="text" id="t-nm" placeholder="NAME">
            <div class="toggle-row">
                <span>STANDART</span>
                <div id="btn-storage-toggle" class="toggle-switch"></div>
            </div>
            <input type="text" id="t-loc" placeholder="PLATZ">
            <button class="btn-primary" onclick="saveT()" style="width:100%; margin-top:10px;">OK</button>
            <button id="btn-del-t" onclick="delT()" style="width:100%; margin-top:8px; background:none; color:red;">LÖSCHEN</button>
        </div>
    </div>

    <div id="m-imp" class="modal" onclick="if(event.target==this)hide('m-imp')">
        <div class="modal-content">
            <textarea id="imp-area" style="width:100%; height:150px;"></textarea>
            <button class="btn-primary" onclick="importAnyJSON()" style="width:100%; margin-top:10px;">IMPORT</button>
            <button class="btn-secondary" onclick="exportJSON()" style="width:100%; margin-top:5px;">EXPORT</button>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
