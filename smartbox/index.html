<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartBox Pro V2</title>
    <style>
        :root { 
            --bg: #f2f2f7; 
            --card: #ffffff; 
            --accent: #007aff; 
            --text: #1c1c1e;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 0; overflow-x: hidden; 
        }

        /* Views */
        .view { display: none; padding: 20px; min-height: 100vh; box-sizing: border-box; }
        .view.active { display: block; }

        /* Заголовки */
        .header-main { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; margin: 0; }
        .p-num-title { font-size: 48px; font-weight: 900; letter-spacing: -2px; line-height: 1; margin: 10px 0; }

        /* Кнопки как на скриншотах */
        button { 
            border: none; border-radius: 14px; font-weight: 700; 
            cursor: pointer; transition: transform 0.1s; 
            -webkit-tap-highlight-color: transparent;
        }
        button:active { transform: scale(0.96); }

        .btn-json { background: #e5e5ea; color: #3a3a3c; padding: 8px 16px; font-size: 13px; z-index: 10; }
        .btn-pdf { background: #000; color: #fff; padding: 12px 20px; font-size: 14px; }
        .btn-secondary { background: #e5e5ea; color: #000; padding: 12px 20px; font-size: 14px; }
        .btn-primary { background: var(--accent); color: #fff; padding: 16px; font-size: 17px; }

        /* Кнопка + WERKZEUG и + NEUES PROJEKT */
        .actions-bar { 
            position: fixed; bottom: 40px; left: 20px; right: 20px; z-index: 100;
        }
        .btn-action { 
            background: var(--accent); color: #fff; width: 100%; 
            padding: 20px; font-size: 18px; font-weight: 800;
            box-shadow: 0 8px 25px rgba(0,122,255,0.3);
            text-transform: uppercase;
        }

        /* Список */
        .list-item { 
            background: var(--card); border-radius: 16px; padding: 18px; 
            margin-bottom: 12px; display: flex; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .t-id-label { font-size: 10px; font-weight: 800; color: #8e8e93; text-transform: uppercase; }
        .t-name-label { font-size: 18px; font-weight: 800; margin: 2px 0; }
        .loc-tag { 
            font-size: 10px; font-weight: 900; padding: 4px 10px; 
            border-radius: 8px; margin-top: 6px; display: inline-block;
        }
        .loc-tag.standart { background: #007aff; color: #fff; }
        .loc-tag.sonder { background: #000; color: #fff; }

        /* Модалки (ФИКС КЛИКОВ) */
        .modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.4); backdrop-filter: blur(5px);
            align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content { 
            background: #fff; padding: 25px; border-radius: 24px; width: 90%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }
        input { 
            width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #e5e5ea; 
            border-radius: 12px; font-size: 16px; background: #f9f9fb; box-sizing: border-box;
        }
        
        .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; }
        .toggle-switch { width: 52px; height: 32px; background: #e5e5ea; border-radius: 16px; position: relative; }
        .toggle-switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 28px; height: 28px; background: #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        .toggle-switch.on { background: #34c759; }
        .toggle-switch.on::after { left: 22px; }

        #list-p, #list-t { padding-bottom: 120px; } /* Паддинг чтобы кнопки не перекрывали список */
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="header-main">
            <h1>CitiTool Box</h1>
            <button class="btn-json" onclick="openImport()">JSON DATA</button>
        </div>
        <div id="list-p"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ NEUES PROJEKT</button>
        </div>
    </div>

    <div id="v-det" class="view">
        <div class="project-header">
            <div id="h-nam" class="t-id-label"></div>
            <div id="h-num" class="p-num-title"></div>
            <div style="display:flex; gap:10px; margin-bottom:20px;">
                <button class="btn-secondary" onclick="goHome()">ZURÜCK</button>
                <button class="btn-secondary" onclick="editCurrentProject()">EDIT</button>
                <button class="btn-pdf" onclick="makePDF()">PDF CARD</button>
            </div>
        </div>
        <div id="list-t"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ WERKZEUG</button>
        </div>
    </div>

    <div id="m-p" class="modal" onclick="if(event.target==this)hide('m-p')">
        <div class="modal-content">
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJEKT NUMMER">
            <input type="text" id="p-nam" placeholder="BAUTEIL NAME">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="p-lzf" placeholder="LAUFZEIT">
                <input type="text" id="p-mat" placeholder="MATERIAL">
                <input type="text" id="p-slg" placeholder="SÄGELÄNGE">
                <input type="text" id="p-abs" placeholder="ABSTAND">
                <input type="text" id="p-grf" placeholder="BACKEN">
                <input type="text" id="p-stk" placeholder="STÜCK">
            </div>
            <button class="btn-primary" onclick="saveP()" style="width:100%; margin-top:15px;">SPEICHERN</button>
        </div>
    </div>

    <div id="m-t" class="modal" onclick="if(event.target==this)hide('m-t')">
        <div class="modal-content">
            <input type="hidden" id="t-idx">
            <input type="text" id="t-id" placeholder="T-NUMMER">
            <input type="text" id="t-nm" placeholder="WERKZEUG NAME">
            <div class="toggle-row">
                <span style="font-weight:700;">STANDART PLATZ?</span>
                <div id="btn-storage-toggle" class="toggle-switch"></div>
            </div>
            <input type="text" id="t-loc" placeholder="PLATZ (z.B. SCHUBLADE 2)">
            <button class="btn-primary" onclick="saveT()" style="width:100%; margin-top:15px;">FERTIG</button>
            <button id="btn-del-t" onclick="delT()" style="width:100%; margin-top:10px; background:none; color:#ff3b30; font-size:14px;">LÖSCHEN</button>
        </div>
    </div>

    <div id="m-imp" class="modal" onclick="if(event.target==this)hide('m-imp')">
        <div class="modal-content">
            <h3 style="margin-top:0;">DATA MANAGEMENT</h3>
            <textarea id="imp-area" style="width:100%; height:180px; border-radius:12px; border:1px solid #ddd; padding:10px; box-sizing:border-box; font-family:monospace;"></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:15px;">
                <button class="btn-primary" onclick="importAnyJSON()">IMPORT</button>
                <button class="btn-secondary" onclick="exportJSON()">EXPORT</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
