<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiTool SmartBox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-title">CitiTool SmartBox</div>
        <button class="btn-util" onclick="openImport()">JSON</button>
    </header>

    <div id="v-home" class="view active">
        <div id="list-p"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ NEUES PROJEKT</button>
        </div>
    </div>

    <div id="v-det" class="view">
        <div class="project-header">
            <div id="h-nam" class="t-id-label"></div>
            <div id="h-num" class="p-num-title"></div>
            <div class="det-controls">
                <button class="btn-det" onclick="goHome()">ЗАКРЫТЬ</button>
                <button class="btn-det" onclick="makePDF()" style="background:#000; color:#fff;">PDF КАРТОЧКА</button>
            </div>
        </div>
        <div id="list-t"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ WERKZEUG</button>
        </div>
    </div>

    <div id="m-p" class="modal">
        <div class="modal-content">
            <input type="hidden" id="p-idx">
            <input id="p-num" placeholder="PROJEKT NUMMER">
            <input id="p-nam" placeholder="PROJEKTNAME">
            <div class="grid-2">
                <input id="p-lzf" placeholder="Laufzeit">
                <input id="p-mat" placeholder="Material">
            </div>
            <input id="p-grf" placeholder="Greifbacken">
            <button class="btn-save" onclick="saveP()">SPEICHERN</button>
            <button class="btn-cancel" onclick="hide('m-p')">Abbrechen</button>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="modal-content">
            <input type="hidden" id="t-idx">
            <input id="t-id" placeholder="T-NR (z.B. T0101)">
            <input id="t-nm" placeholder="WERKZEUGNAME">
            <input id="t-dia" placeholder="Ø / TOLERANZ">
            <input id="t-loc" placeholder="FACH NR. (если в полке)">
            
            <div id="btn-storage-toggle" class="toggle-btn">
                <span>IN SCHUBLADEN (STANDART)</span>
                <div class="switch"></div>
            </div>

            <button class="btn-save" onclick="saveT()">OK</button>
            <button id="btn-del-t" class="btn-del" onclick="delT()">Löschen</button>
            <button class="btn-cancel" onclick="hide('m-t')">Abbrechen</button>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="modal-content">
            <textarea id="imp-area"></textarea>
            <button class="btn-save" onclick="importJSON()">IMPORT</button>
            <button class="btn-save" onclick="exportJSON()" style="background:#86868b">EXPORT</button>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
