<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2</title>
    <style>
        :root { --bg: #ffffff; --fg: #000000; --accent: #007aff; --gray: #f2f2f7; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; font-family: -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
        .view { display: none; padding: 20px; }
        .view.active { display: block; }
        h1 { font-size: 32px; font-weight: 900; margin: 0 0 20px 0; text-transform: uppercase; }
        .h-sub { font-size: 14px; font-weight: 700; color: #8e8e93; }
        .list-item { border-bottom: 1.5px solid #eee; padding: 16px 0; display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .t-id-label { font-size: 9px; font-weight: 900; color: #8e8e93; text-transform: uppercase; } 
        .t-name-label { font-size: 22px; font-weight: 900; line-height: 1; margin: 2px 0; } 
        .loc-tag { display: inline-block; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; margin-top: 8px; }
        .standart { background: #e8f2ff; color: #007aff; }
        .sonder { background: #fff2e8; color: #ff9500; }
        .btn-main { background: var(--fg); color: var(--bg); border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; width: 100%; }
        .btn-sec { background: var(--gray); color: var(--fg); border: none; padding: 10px 15px; border-radius: 10px; font-size: 14px; font-weight: 700; }
        .fab { position: fixed; bottom: 30px; right: 20px; width: 64px; height: 64px; background: var(--fg); color: var(--bg); border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 30px; z-index: 100; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: none; align-items: flex-end; z-index: 1000; }
        .modal-content { background: var(--bg); width: 100%; padding: 25px; border-radius: 24px 24px 0 0; max-height: 90vh; overflow-y: auto; }
        input { width: 100%; padding: 14px; background: var(--gray); border: none; border-radius: 12px; margin-bottom: 12px; font-size: 16px; }
        .toggle-btn { padding: 14px; border-radius: 12px; background: #ff3b30; color: #fff; text-align: center; font-weight: 800; margin-bottom: 15px; }
        .toggle-btn.on { background: #34c759; }
        #list-t, #list-p { padding-bottom: 140px; }
    </style>
</head>
<body>
    <div id="v-home" class="view active">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h1>Projekte</h1>
            <button class="btn-sec" onclick="openImport()">Data</button>
        </div>
        <div id="list-p"></div>
        <div class="fab" onclick="modalP()">+</div>
    </div>
    <div id="v-det" class="view">
        <div style="display:flex; justify-content: space-between; margin-bottom: 20px;">
            <button class="btn-sec" onclick="goHome()">←</button>
            <div style="display: flex; gap: 8px;">
                <button class="btn-sec" onclick="editCurrentProject()">Edit</button>
                <button class="btn-sec" style="background:#000; color:#fff;" onclick="makePDF()">PDF</button>
            </div>
        </div>
        <div class="h-sub" id="h-nam">---</div>
        <h1 id="h-num" style="font-size: 42px; margin: 5px 0 20px 0;">000000</h1>
        <div id="list-t"></div>
        <div class="fab" onclick="modalT()">+</div>
    </div>

    <div id="m-p" class="modal" onclick="if(event.target==this) hide('m-p')">
        <div class="modal-content">
            <input type="hidden" id="p-idx"><input type="text" id="p-num" placeholder="PROJEKT NUMMER"><input type="text" id="p-nam" placeholder="NAME">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
                <input type="text" id="p-lzf" placeholder="LZF"><input type="text" id="p-mat" placeholder="MAT">
                <input type="text" id="p-slg" placeholder="SÄGE"><input type="text" id="p-abs" placeholder="ABST">
                <input type="text" id="p-grf" placeholder="BACKEN"><input type="text" id="p-stk" placeholder="STOCK">
            </div>
            <button class="btn-main" onclick="saveP()">Speichern</button>
        </div>
    </div>

    <div id="m-t" class="modal" onclick="if(event.target==this) hide('m-t')">
        <div class="modal-content">
            <input type="hidden" id="t-idx"><input type="text" id="t-bem" placeholder="BEMERKUNG"><input type="text" id="t-nm" placeholder="WERKZEUG NAME">
            <div id="btn-storage-toggle" class="toggle-btn">STANDART (STORAGE)</div>
            <input type="text" id="t-loc" placeholder="LAGERORT"><input type="text" id="t-kom" placeholder="ZUSATZ INFO">
            <button class="btn-main" onclick="saveT()">Speichern</button>
            <button id="btn-del-t" style="width:100%; margin-top:15px; color:red; border:none; background:none; font-weight:700;" onclick="delT()">Löschen</button>
        </div>
    </div>

    <div id="m-imp" class="modal" onclick="if(event.target==this) hide('m-imp')">
        <div class="modal-content">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:10px;">
                <button class="btn-sec" onclick="exportJSON()">JSON Export</button>
                <button class="btn-sec" onclick="importAnyJSON()">JSON Import</button>
            </div>
            <textarea id="imp-area" style="width:100%; height:200px; border-radius:12px; padding:10px; border: 1.5px solid #eee;"></textarea>
        </div>
    </div>

    <script>
        const DB_KEY = 'SMARTBOX_PRO_V2';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;
        const el = (id) => document.getElementById(id);
        const hide = (id) => { el(id).style.display = 'none'; };

        function renderList() {
            const list = el('list-p'); if(!list) return;
            list.innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div style="flex:1">
                        <div class="t-id-label">PROJEKT</div>
                        <div class="t-name-label">${p.num || '---'}</div>
                        <div style="font-size:13px; font-weight:600; color:#8e8e93;">${p.name || ''}</div>
                    </div>
                </div>`).join('') + '<div style="height:100px;"></div>';
        }

        function openProject(i) {
            currentIdx = i;
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            el('v-det').classList.add('active');
            el('h-num').innerText = db[i].num; el('h-nam').innerText = db[i].name;
            renderTools();
        }

        function goHome() { currentIdx = null; document.querySelectorAll('.view').forEach(v => v.classList.remove('active')); el('v-home').classList.add('active'); renderList(); }

        function moveTool(idx, dir) {
            const t = db[currentIdx].tools; const n = idx + dir;
            if(n >= 0 && n < t.length) { [t[idx], t[n]] = [t[n], t[idx]]; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); }
        }

        function renderTools() {
            const list = el('list-t'); const tools = db[currentIdx].tools || [];
            list.innerHTML = tools.map((t, i) => `
                <div class="list-item">
                    <div style="display:flex; flex-direction:column; gap:5px; margin-right:10px;">
                        <button onclick="moveTool(${i},-1)" style="border:none; background:#eee; border-radius:4px; padding:5px;">↑</button>
                        <button onclick="moveTool(${i},1)" style="border:none; background:#eee; border-radius:4px; padding:5px;">↓</button>
                    </div>
                    <div style="flex:1" onclick="modalT(${i})">
                        <div class="t-id-label">BEMERKUNG</div>
                        <div class="t-name-label" style="font-size:18px;">${t.bem || '---'}</div>
                        <div style="font-weight:700; font-size:15px;">${t.nm}</div>
                        <div class="loc-tag ${t.isStandart ? 'standart' : 'sonder'}">${t.isStandart ? 'STANDART' : 'SONDER'}</div>
                    </div>
                </div>`).join('') + '<div style="height:120px;"></div>';
        }

        function saveP() {
            const i = el('p-idx').value;
            const data = { num: el('p-num').value, name: el('p-nam').value.toUpperCase(), tools: i !== '' ? db[i].tools : [], mat: el('p-mat').value, lzf: el('p-lzf').value, slg: el('p-slg').value, abs: el('p-abs').value, grf: el('p-grf').value, stk: el('p-stk').value };
            if(i === '') db.push(data); else db[i] = data;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); hide('m-p'); if(i !== '') openProject(i);
        }

        function saveT() {
            const i = el('t-idx').value;
            const t = { bem: el('t-bem').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(), isStandart: el('btn-storage-toggle').classList.contains('on'), loc: el('t-loc').value.toUpperCase(), kom: el('t-kom').value.toUpperCase() };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(i === '') db[currentIdx].tools.push(t); else db[currentIdx].tools[i] = t;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); hide('m-t');
        }

        function modalT(i = null) {
            const edit = i !== null; el('t-idx').value = edit ? i : '';
            const t = edit ? db[currentIdx].tools[i] : {bem:'', nm:'', isStandart:false};
            el('t-bem').value = t.bem; el('t-nm').value = t.nm;
            const btn = el('btn-storage-toggle'); t.isStandart ? btn.classList.add('on') : btn.classList.remove('on');
            btn.onclick = () => btn.classList.toggle('on'); el('m-t').style.display = 'flex';
        }

        function makePDF() {
            const p = db[currentIdx];
            let html = `<html><head><style>body{font-family:sans-serif;margin:20px;}.frame{border:2px solid #000;padding:10px;}table{width:100%;border-collapse:collapse;}td{border-bottom:1px solid #000;padding:8px;}</style></head><body><div class="frame"><h1>${p.num}</h1><p>${p.name}</p><table>${(p.tools||[]).map(t=>`<tr><td>${t.nm}</td><td>${t.bem}</td></tr>`).join('')}</table></div></body></html>`;
            const win = window.open('','_blank'); win.document.write(html); win.document.close(); win.print();
        }

        function openImport() { el('imp-area').value = ''; el('m-imp').style.display = 'flex'; }
        function exportJSON() { el('imp-area').value = JSON.stringify(db); }
        function importAnyJSON() { try { const d = JSON.parse(el('imp-area').value); if(Array.isArray(d)) db = d; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); hide('m-imp'); } catch(e) { alert('Error'); } }

        window.onload = renderList;
    </script>
</body>
</html>
