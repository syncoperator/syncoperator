<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SmartBox Pro V2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-premium">

    <div id="v-home" class="view active">
        <div class="header-main">
            <h1>CitiTool SmartBox</h1>
            <button class="btn-json" onclick="openImport()">JSON DATA</button>
        </div>
        <div id="list-p"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalP()">+ NEUES PROJEKT</button>
        </div>
    </div>

    <div id="v-det" class="view">
        <div class="project-header">
            <div id="h-nam" class="t-id-label"></div>
            <div id="h-num" class="p-num-title"></div>
            <div class="det-controls">
                <button class="btn-secondary" onclick="goHome()">ЗАКРЫТЬ</button>
                <button class="btn-secondary" onclick="editCurrentProject()">EDIT</button>
                <button class="btn-pdf" onclick="makePDF()">PDF КАРТОЧКА</button>
            </div>
        </div>
        <div id="list-t"></div>
        <div class="actions-bar">
            <button class="btn-action" onclick="modalT()">+ WERKZEUG</button>
        </div>
    </div>

    <div id="m-p" class="modal">
        <div class="modal-content">
            <input type="hidden" id="p-idx">
            <input type="text" id="p-num" placeholder="PROJEKT NUMMER">
            <input type="text" id="p-nam" placeholder="BAUTEIL NAME">
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <input type="text" id="p-lzf" placeholder="LAUFZEIT">
                <input type="text" id="p-mat" placeholder="MATERIAL">
                <input type="text" id="p-slg" placeholder="SÄGELÄNGE">
                <input type="text" id="p-abs" placeholder="ABSTAND">
                <input type="text" id="p-grf" placeholder="GREIFBACKEN">
                <input type="text" id="p-stk" placeholder="STÜCKZAHL">
            </div>
            
            <div style="margin-top:15px; display:flex; gap:10px;">
                <button class="btn-primary" onclick="saveP()" style="flex:2">SPEICHERN</button>
                <button class="btn-secondary" onclick="hide('m-p')" style="flex:1">X</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="modal-content">
            <input type="hidden" id="t-idx">
            <input type="text" id="t-id" placeholder="T-NUMMER (T0101)">
            <input type="text" id="t-nm" placeholder="WERKZEUG NAME">
            
            <div class="toggle-row">
                <span>STANDART / SCHUBLADE</span>
                <div id="btn-storage-toggle" class="toggle-switch"></div>
            </div>
            
            <input type="text" id="t-loc" placeholder="PLATZ (z.B. FACH A)">
            
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-primary" onclick="saveT()" style="flex:2">OK</button>
                <button id="btn-del-t" class="btn-secondary" onclick="delT()" style="color:red">DEL</button>
                <button class="btn-secondary" onclick="hide('m-t')">X</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="modal-content">
            <h3>DATA MANAGEMENT</h3>
            <textarea id="imp-area" placeholder="Paste JSON here..."></textarea>
            <div style="display:flex; gap:10px; margin-top:10px;">
                <button class="btn-primary" onclick="importAnyJSON()" style="flex:1">IMPORT</button>
                <button class="btn-secondary" onclick="exportJSON()" style="flex:1">EXPORT</button>
                <button class="btn-secondary" onclick="hide('m-imp')">X</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
