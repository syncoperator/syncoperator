<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CNC Clean v35</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f2f2f7;
            --accent: #007aff;
            --border: #d1d1d6;
            --text: #1c1c1e;
            /* Professional Palette */
            --syn-g0: #af52de;
            --syn-g1: #007aff;
            --syn-g-arc: #5ac8fa;
            --syn-m: #ff9500;
            --syn-t: #34c759;
            --syn-x: #ff3b30;
            --syn-z: #007aff;
            --syn-s: #ff2d55;
            --syn-f: #ff9500;
            --syn-a: #ff375f;
            --syn-r: #32ade6;
            --syn-c: #8e8e93;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100dvh; width: 100vw; background: var(--bg); font-family: -apple-system, sans-serif; overflow: hidden; }
        
        .app-wrapper { display: flex; flex-direction: column; height: 100dvh; }

        header { 
            height: 50px; border-bottom: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 15px; 
            background: #fff; flex-shrink: 0; 
        }

        main { flex: 1; position: relative; overflow: hidden; background: var(--surface); }

        /* Hub View */
        #hub { height: 100%; overflow-y: auto; padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; align-content: start; }
        .tool-item { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; cursor: pointer; font-weight: 700; }

        /* Editor View */
        #editor-layer { position: absolute; inset: 0; background: #fff; display: none; flex-direction: column; z-index: 100; }
        .editor-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        /* Увеличен шрифт для удобства */
        #code, #syntax { 
            position: absolute; inset: 0; padding: 20px 15px 20px 55px; 
            font-family: "SF Mono", "Menlo", monospace; font-size: 16px; 
            line-height: 1.6; white-space: pre; border: none; outline: none; margin: 0; 
        }
        #code { color: transparent; background: transparent; z-index: 2; caret-color: var(--accent); resize: none; width: 200%; }
        #syntax { z-index: 1; color: var(--text); pointer-events: none; }

        .line-nums { 
            width: 45px; position: absolute; left: 0; top: 0; bottom: 0; 
            background: var(--surface); border-right: 1px solid var(--border); 
            padding-top: 20px; text-align: center; font-size: 12px; color: #aeaeb2; z-index: 3; 
        }

        footer { 
            height: 90px; background: #fff; border-top: 1px solid var(--border); 
            display: flex; align-items: center; padding: 0 15px calc(env(safe-area-inset-bottom) + 10px) 15px; 
            gap: 12px; flex-shrink: 0; 
        }

        .btn { 
            height: 50px; border-radius: 12px; border: 1px solid var(--border); 
            background: var(--surface); color: var(--text); font-size: 14px; font-weight: 700; 
            cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center; 
        }
        .btn.primary { background: var(--accent); color: #fff; border: none; }

        /* Clean Syntax Highlighting */
        .hc-t { color: var(--syn-t); font-weight: 800; }
        .hc-g0 { color: var(--syn-g0); font-weight: 800; }
        .hc-g1 { color: var(--syn-g1); font-weight: 800; }
        .hc-ga { color: var(--syn-g-arc); font-weight: 800; }
        .hc-gs { color: var(--syn-g-sys); }
        .hc-m { color: var(--syn-m); font-weight: 800; }
        .hc-x { color: var(--syn-x); }
        .hc-z { color: var(--syn-z); }
        .hc-s { color: var(--syn-s); font-weight: 800; }
        .hc-f { color: var(--syn-f); font-weight: 800; }
        .hc-a { color: var(--syn-a); font-weight: 800; }
        .hc-r { color: var(--syn-r); font-weight: 800; }
        .hc-c { color: var(--syn-c); font-style: italic; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <b style="font-size: 14px;">CNC EDITOR v35</b>
        <div style="flex:1"></div>
        <button class="btn" style="flex:0; width:44px; height:34px;" onclick="document.getElementById('f').click()">📂</button>
        <input type="file" id="f" hidden onchange="openFile(this)">
    </header>

    <main>
        <div id="hub"></div>
        <div id="editor-layer">
            <div style="padding: 10px 15px; background: var(--surface); display:flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border);">
                <small id="cur-tool" style="font-weight: 800; color: var(--accent);"></small>
                <button class="btn" style="flex:0; height:32px; padding:0 15px; font-size:12px;" onclick="closeEditor()">ZURÜCK</button>
            </div>
            <div class="editor-container">
                <div class="line-nums" id="ln"></div>
                <div style="flex:1; position:relative; overflow:auto;" id="scr" onscroll="sync()">
                    <div id="syntax"></div>
                    <textarea id="code" spellcheck="false" oninput="render()"></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn" onclick="copyToolList()">LISTE KOPIEREN</button>
        <button class="btn primary" onclick="exportO()">SPEICHERN (.O)</button>
    </footer>
</div>

<script>
    const el = document.getElementById('code');
    const sx = document.getElementById('syntax');
    const ln = document.getElementById('ln');
    const hb = document.getElementById('hub');

    window.onload = () => {
        const last = localStorage.getItem('cnc_v35');
        el.value = last || "O3500 (CLEAN_LOGIC)\nG54 G96 S180 M3\nM8\nG0 Z2.\nG1 X-0.8 F.15\nG1 X40 Z-2.2 ,A135, R.9\nM30";
        render();
    };

    function render() {
        let val = el.value.replace(/T(\d{1,2})(?!\d{2})/gi, (m, p1) => "T" + p1.padStart(2, '0') + p1.padStart(2, '0'));
        if (el.value !== val) el.value = val;
        localStorage.setItem('cnc_v35', val);

        // Чистый рендеринг без "мусора"
        let h = val.replace(/&/g, "&amp;").replace(/</g, "&lt;");
        
        h = h.replace(/\((.*?)\)/g, '<span class="hc-c">($1)</span>')
             .replace(/(T\d{4})/gi, '<span class="hc-t">$1</span>')
             .replace(/\b(G0)\b/gi, '<span class="hc-g0">$1</span>')
             .replace(/\b(G1)\b/gi, '<span class="hc-g1">$1</span>')
             .replace(/\b(G[23])\b/gi, '<span class="hc-ga">$1</span>')
             .replace(/\b(G\d+)\b/gi, '<span class="hc-gs">$1</span>')
             .replace(/\b(M\d+)\b/gi, '<span class="hc-m">$1</span>')
             .replace(/(X-?\d*\.?\d*)/gi, '<span class="hc-x">$1</span>')
             .replace(/(Z-?\d*\.?\d*)/gi, '<span class="hc-z">$1</span>')
             .replace(/(S\d+)/gi, '<span class="hc-s">$1</span>')
             .replace(/(F\d*\.?\d+)/gi, '<span class="hc-f">$1</span>')
             .replace(/(,A\d*\.?\d+)/gi, '<span class="hc-a">$1</span>')
             .replace(/(,R\d*\.?\d+|R\d*\.?\d+)/gi, '<span class="hc-r">$1</span>');

        sx.innerHTML = h;

        const rows = val.split('\n');
        ln.innerHTML = rows.map((_, i) => i + 1).join('<br>');
        el.style.height = sx.style.height = Math.max(window.innerHeight, rows.length * 25.6 + 200) + 'px';
        buildHub(rows);
    }

    function buildHub(rows) {
        hb.innerHTML = "";
        rows.forEach((line, i) => {
            const t = line.match(/T(\d{4})/i);
            if(t) {
                let desc = "";
                [rows[i], rows[i+1] || ""].forEach(s => {
                    const m = s.match(/\((.*?)\)/); if(m) desc = m[1];
                });
                const div = document.createElement('div');
                div.className = 'tool-item';
                div.innerHTML = `T${t[1]}${desc ? ' ' + desc : ''}`;
                div.onclick = () => {
                    document.getElementById('editor-layer').style.display = 'flex';
                    document.getElementById('cur-tool').innerText = "T" + t[1] + " " + desc;
                    const pos = rows.slice(0, i).join('\n').length + (i > 0 ? 1 : 0);
                    el.focus(); el.setSelectionRange(pos, pos + line.length);
                    document.getElementById('scr').scrollTop = i * 25.6 - 60;
                };
                hb.appendChild(div);
            }
        });
    }

    function copyToolList() {
        const rows = el.value.split('\n');
        let out = "";
        rows.forEach((line, i) => {
            const t = line.match(/T(\d{4})/);
            if(t) {
                let desc = "";
                [rows[i], rows[i+1] || ""].forEach(s => {
                    const m = s.match(/\((.*?)\)/); if(m) desc = m[1];
                });
                out += `T${t[1]}${desc ? ' ' + desc : ''}\n`;
            }
        });
        navigator.clipboard.writeText(out.trim()).then(() => alert("Liste kopiert!"));
    }

    function exportO() {
        const b = new Blob([el.value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'PROGRAMM.O'; a.click();
    }

    function openFile(input) {
        const f = input.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = e => { el.value = e.target.result; render(); };
        r.readAsText(f);
    }

    function closeEditor() { document.getElementById('editor-layer').style.display = 'none'; }
    function sync() { sx.scrollTop = ln.scrollTop = document.getElementById('scr').scrollTop; }
</script>
</body>
</html>
