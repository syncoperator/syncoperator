<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC CAM DATA v18</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --accent: #007aff; --bg: #1c1c1e; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: -apple-system, sans-serif; }
        
        header { background: #fff; height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #ccc; position: relative; z-index: 100; }
        
        /* 3D Viewport */
        #viewport { position: fixed; inset: 0; z-index: 5; background: #000; }

        /* Панель управления */
        .side-panel { position: absolute; left: 10px; top: 60px; width: 240px; background: rgba(28, 28, 30, 0.9); color: #fff; border-radius: 12px; padding: 15px; pointer-events: auto; z-index: 20; display: none; border: 1px solid #48484a; }
        
        .tool-config { background: #2c2c2e; padding: 8px; border-radius: 6px; margin-bottom: 10px; font-size: 11px; }
        .tool-config input { width: 40px; background: #3a3a3c; border: none; color: #fff; text-align: center; border-radius: 4px; }

        /* Индикатор размеров */
        .dro { position: absolute; top: 60px; right: 10px; background: rgba(0,0,0,0.7); color: #00ff00; font-family: monospace; padding: 10px; border-radius: 8px; font-size: 14px; border: 1px solid #00ff00; pointer-events: none; z-index: 20; display: none; }

        /* Editor */
        .editor-box { position: absolute; inset: 50px 0 0 0; background: #fff; z-index: 10; display: flex; }
        #code-in { flex: 1; padding: 15px; font-family: monospace; font-size: 14px; border: none; outline: none; resize: none; }

        .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d1d6; background: #fff; font-weight: 600; cursor: pointer; }
        .fab { position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px; background: var(--accent); border-radius: 30px; color: #fff; border: none; font-size: 24px; z-index: 100; box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

<div id="viewport"></div>
<div class="dro" id="dro">X: 0.000<br>Z: 0.000</div>

<header>
    <b>CNC <span style="color:var(--accent)">DATA PRO</span></b>
    <button class="btn" style="background:var(--accent); color:#fff; border:none;" onclick="toggleView()">МОДЕЛЬ 🧊</button>
</header>

<div class="editor-box" id="editor">
    <textarea id="code-in" spellcheck="false" oninput="save()">O1407(CAM TEST)
N1 T0101 (NARUZHNIY)
G0 X60 Z2
G1 Z-40 F.2
G1 X80
G0 X100 Z100

N2 T0303 (REZHUSHCHIY)
G0 X60 Z-20
G1 X40 F.1
G0 X100 Z100</textarea>
</div>

<div class="side-panel" id="ui-3d">
    <div style="font-size:10px; color:var(--accent); margin-bottom:10px;">ДАННЫЕ ИНСТРУМЕНТОВ</div>
    <div id="tools-setup"></div>
    <hr style="opacity:0.2">
    <label><input type="checkbox" id="showWire" onchange="build()"> СЕТКА</label>
</div>

<script>
    let scene, camera, renderer, controls, solid;
    let toolSettings = {}; // Храним вылеты и радиусы

    window.onload = () => {
        const saved = localStorage.getItem('cnc_v18_code');
        if(saved) document.getElementById('code-in').value = saved;
        init3D();
    };

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(150, 100, 150);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('viewport').appendChild(renderer.domElement);
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(50, 100, 50);
        scene.add(sun);
        const grid = new THREE.GridHelper(200, 20, 0x333333, 0x111111);
        grid.rotation.x = Math.PI/2;
        scene.add(grid);

        function anim() { requestAnimationFrame(anim); renderer.render(scene, camera); }
        anim();
    }

    function toggleView() {
        const ed = document.getElementById('editor');
        const ui = document.getElementById('ui-3d');
        const dro = document.getElementById('dro');
        const isVisible = ed.style.display === 'none';

        ed.style.display = isVisible ? 'flex' : 'none';
        ui.style.display = isVisible ? 'none' : 'block';
        dro.style.display = isVisible ? 'none' : 'block';
        
        if(!isVisible) build();
    }

    function build() {
        if(solid) scene.remove(solid);
        const code = document.getElementById('code-in').value;
        const lines = code.split('\n');
        let pts = [];
        let curX = 0, curZ = 0;
        let setupHtml = "";

        lines.forEach(l => {
            const tMatch = l.match(/T(\d+)/i);
            if(tMatch) {
                const tNum = tMatch[1];
                if(!toolSettings[tNum]) toolSettings[tNum] = { r: 0.4, offX: 0 };
                setupHtml += `
                    <div class="tool-config">
                        <b>T${tNum}</b> | R: <input type="number" step="0.1" value="${toolSettings[tNum].r}" onchange="toolSettings['${tNum}'].r=this.value; build()">
                        X-Off: <input type="number" value="${toolSettings[tNum].offX}" onchange="toolSettings['${tNum}'].offX=this.value; build()">
                    </div>`;
            }

            const mx = l.match(/X(-?\d*\.?\d+)/i);
            const mz = l.match(/Z(-?\d*\.?\d+)/i);
            if(mx) curX = parseFloat(mx[1]);
            if(mz) curZ = parseFloat(mz[1]);
            
            if(mx || mz) {
                pts.push(new THREE.Vector2(Math.abs(curX)/2, curZ));
            }
        });

        document.getElementById('tools-setup').innerHTML = setupHtml || "Инструменты не найдены";
        if(pts.length < 2) return;

        pts.sort((a,b) => b.y - a.y);
        const geo = new THREE.LatheGeometry(pts, 64);
        const mat = new THREE.MeshStandardMaterial({ 
            color: 0x999999, metalness: 0.8, roughness: 0.2, 
            wireframe: document.getElementById('showWire').checked 
        });
        solid = new THREE.Mesh(geo, mat);
        solid.rotation.x = -Math.PI/2;
        scene.add(solid);

        // Обновляем DRO (координаты последней точки)
        document.getElementById('dro').innerHTML = `X: ${curX.toFixed(3)}<br>Z: ${curZ.toFixed(3)}`;
    }

    function save() { localStorage.setItem('cnc_v18_code', document.getElementById('code-in').value); }
</script>
</body>
</html>
