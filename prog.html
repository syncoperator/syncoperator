<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC ULTIMATE v7</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7; --accent: #007aff; --text: #1d1d1f; --border: #d2d2d7;
            --x-col: #ff2d55; --z-col: #007aff; --a-col: #5856d6;
        }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; }
        
        /* Layout */
        .app { display: flex; flex-direction: column; height: 100vh; }
        header { padding: 10px 15px; background: #fff; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
        
        .dro { display: grid; grid-template-columns: repeat(4, 1fr); background: #1c1c1e; padding: 8px; gap: 5px; }
        .dro-item { background: #2c2c2e; border-radius: 6px; padding: 4px; text-align: center; }
        .dro-l { font-size: 8px; color: #8e8e93; display: block; font-weight: 800; }
        .dro-v { font-family: 'Fira Code', monospace; font-size: 13px; color: #fff; }

        /* Editor */
        .editor-zone { flex: 1; display: flex; position: relative; background: #fff; overflow: hidden; }
        #line-nums { width: 35px; padding: 15px 5px; text-align: right; font-size: 12px; color: #aeaeb2; background: #f9f9f9; border-right: 1px solid var(--border); line-height: 1.6; }
        .scroll-v { flex: 1; position: relative; overflow: auto; }
        #code-in, #code-out { width: 100%; min-height: 100%; padding: 15px; box-sizing: border-box; font-family: 'Fira Code', monospace; font-size: 14px; line-height: 1.6; white-space: pre; position: absolute; top: 0; left: 0; border: none; outline: none; }
        #code-in { color: transparent; background: transparent; z-index: 2; caret-color: #000; }
        #code-out { z-index: 1; pointer-events: none; }

        /* Colors */
        .c-g { color: #d70015; font-weight: 700; }
        .c-x { color: var(--x-col); font-weight: 700; }
        .c-z { color: var(--z-col); font-weight: 700; }
        .c-a { color: var(--a-col); font-weight: 700; }
        .c-t { color: #af52de; font-weight: 800; border-bottom: 2px solid #af52de; }
        .c-comm { color: #8e8e93; font-style: italic; }

        /* Modal Simulation */
        .modal { position: fixed; inset: 0; background: #000; z-index: 1000; display: none; flex-direction: column; }
        .modal-h { padding: 15px; background: #1c1c1e; display: flex; justify-content: space-between; color: #fff; align-items: center; }
        .modal-b { flex: 1; position: relative; overflow: hidden; }
        #sim-canvas { width: 100%; height: 100%; touch-action: none; }
        
        .tool-list { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.8); padding: 10px; border-radius: 8px; border: 1px solid #444; max-height: 80%; overflow-y: auto; color: white; font-size: 12px; }
        .t-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
        
        .fab { position: absolute; bottom: 25px; right: 25px; width: 56px; height: 56px; background: var(--accent); border-radius: 28px; border: none; color: white; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 10; }
        .btn-top { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 700; background: #fff; }
    </style>
</head>
<body>

<div class="app">
    <header>
        <div style="font-weight:900;">CNC<span>STUDIO</span></div>
        <div style="display:flex; gap:8px;">
            <button class="btn-top" onclick="clearData()">ОЧИСТИТЬ</button>
            <button class="btn-top" style="background:var(--accent); color:#fff; border:none;" onclick="saveToFile()">СОХРАНИТЬ</button>
        </div>
    </header>

    <div class="dro">
        <div class="dro-item"><span class="dro-l">X-POS</span><span id="dx" class="dro-v">0.000</span></div>
        <div class="dro-item"><span class="dro-l">Z-POS</span><span id="dz" class="dro-v">0.000</span></div>
        <div class="dro-item"><span class="dro-l">A-ANG</span><span id="da" class="dro-v">0.000</span></div>
        <div class="dro-item"><span class="dro-l">ACTIVE T</span><span id="dt" class="dro-v">T0000</span></div>
    </div>

    <div class="editor-zone">
        <div id="line-nums">1</div>
        <div class="scroll-v" id="scr" onscroll="sync()">
            <div id="code-out"></div>
            <textarea id="code-in" spellcheck="false" oninput="update()" onkeyup="track()" onclick="track()"></textarea>
        </div>
        <button class="fab" onclick="showSim()">📈</button>
    </div>
</div>

<div id="modal" class="modal">
    <div class="modal-h">
        <span style="font-weight:900;">СИМУЛЯТОР ТРАЕКТОРИЙ</span>
        <button onclick="closeSim()" style="background:#ff3b30; color:#fff; border:none; padding:8px 15px; border-radius:6px; font-weight:700;">ЗАКРЫТЬ</button>
    </div>
    <div class="modal-b">
        <canvas id="sim-canvas"></canvas>
        <div class="tool-list" id="t-list"></div>
    </div>
</div>

<script>
    const inp = document.getElementById('code-in');
    const out = document.getElementById('code-out');
    const lns = document.getElementById('line-nums');
    const cvs = document.getElementById('sim-canvas');
    const ctx = cvs.getContext('2d');

    let trajectories = {}; 
    let tVisibility = {};

    window.onload = () => {
        const saved = localStorage.getItem('cnc_v7_data');
        if (saved) { inp.value = saved; } 
        else { inp.value = "N1 T0101 (AUSSEN)\nG0 X50 Z2 A0\nG1 Z-25 F0.2\nG1 X60\nG0 X100 Z100\n\nN2 T0202 (BOHRER)\nG0 X0 Z2\nG1 Z-15 F0.1\nG0 Z100"; }
        update();
    };

    function update() {
        const val = inp.value;
        localStorage.setItem('cnc_v7_data', val);
        
        const lines = val.split('\n');
        lns.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        
        out.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c-comm">($1)</span>')
            .replace(/(G\d+)/gi, '<span class="c-g">$1</span>')
            .replace(/(T\d+)/gi, '<span class="c-t">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="c-x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="c-z">$1</span>')
            .replace(/(A-?\d*\.?\d+)/gi, '<span class="c-a">$1</span>');
        
        parseProgram();
    }

    function parseProgram() {
        const lines = inp.value.split('\n');
        trajectories = {};
        let currentT = "T0000";
        let cx = 0, cz = 0;

        lines.forEach(l => {
            const tMatch = l.match(/T(\d+)/i);
            const nMatch = l.match(/\((.*?)\)/);
            if(tMatch) {
                currentT = "T" + tMatch[1];
                if(!trajectories[currentT]) {
                    trajectories[currentT] = { name: nMatch ? nMatch[1] : currentT, paths: [] };
                    if(!(currentT in tVisibility)) tVisibility[currentT] = true;
                }
            }

            const mx = l.match(/X(-?\d*\.?\d+)/i);
            const mz = l.match(/Z(-?\d*\.?\d+)/i);
            const g0 = /G0/i.test(l);

            if(mx || mz) {
                let nx = mx ? parseFloat(mx[1]) : cx;
                let nz = mz ? parseFloat(mz[1]) : cz;
                if(!trajectories[currentT]) trajectories[currentT] = { name: "INIT", paths: [] };
                
                trajectories[currentT].paths.push({ x1:cx, z1:cz, x2:nx, z2:nz, rapid: g0 });
                cx = nx; cz = nz;
            }
        });
    }

    function showSim() {
        document.getElementById('modal').style.display = 'flex';
        renderTList();
        setTimeout(draw, 50); // Даем время на отрисовку модалки
    }

    function closeSim() { document.getElementById('modal').style.display = 'none'; }

    function renderTList() {
        const list = document.getElementById('t-list');
        list.innerHTML = '<b style="color:#007aff; font-size:10px;">ИНСТРУМЕНТЫ:</b><br><br>';
        for(let id in trajectories) {
            const row = document.createElement('div');
            row.className = 't-row';
            row.innerHTML = `<input type="checkbox" ${tVisibility[id]?'checked':''} onchange="tToggle('${id}')"> <span>${id}</span>`;
            list.appendChild(row);
        }
    }

    function tToggle(id) { tVisibility[id] = !tVisibility[id]; draw(); }

    function draw() {
        cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
        ctx.clearRect(0,0,cvs.width,cvs.height);
        
        let scale = 3.5, ox = cvs.width * 0.8, oy = cvs.height / 2;
        
        // Оси
        ctx.strokeStyle = '#333'; ctx.beginPath();
        ctx.moveTo(0, oy); ctx.lineTo(cvs.width, oy);
        ctx.moveTo(ox, 0); ctx.lineTo(ox, cvs.height); ctx.stroke();

        ctx.save(); ctx.translate(ox, oy);
        for(let id in trajectories) {
            if(!tVisibility[id]) continue;
            trajectories[id].paths.forEach(p => {
                ctx.beginPath();
                ctx.lineWidth = p.rapid ? 1 : 2;
                ctx.strokeStyle = p.rapid ? '#ff3b30' : '#007aff';
                ctx.moveTo(p.z1 * scale, -p.x1 * scale / 2);
                ctx.lineTo(p.z2 * scale, -p.x2 * scale / 2);
                ctx.stroke();
            });
        }
        ctx.restore();
    }

    function track() {
        const text = inp.value;
        const cur = inp.selectionStart;
        const lines = text.substring(0, cur).split('\n');
        const line = lines[lines.length-1];
        
        const mx = line.match(/X(-?\d*\.?\d+)/i);
        const mz = line.match(/Z(-?\d*\.?\d+)/i);
        const ma = line.match(/A(-?\d*\.?\d+)/i);
        if(mx) document.getElementById('dx').innerText = parseFloat(mx[1]).toFixed(3);
        if(mz) document.getElementById('dz').innerText = parseFloat(mz[1]).toFixed(3);
        if(ma) document.getElementById('da').innerText = parseFloat(ma[1]).toFixed(3);
        
        for(let i=lines.length-1; i>=0; i--) {
            const t = text.split('\n')[i].match(/T(\d+)/i);
            if(t) { document.getElementById('dt').innerText = "T"+t[1]; break; }
        }
    }

    function sync() { out.scrollTop = document.getElementById('scr').scrollTop; lns.scrollTop = document.getElementById('scr').scrollTop; }
    function clearData() { if(confirm('Удалить всё?')) { inp.value=''; update(); } }
    function saveToFile() {
        const b = new Blob([inp.value], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download='PROGRAM.NC'; a.click();
    }
</script>
</body>
</html>
