<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Industrial Premium v25</title>
    <style>
        :root {
            --accent: #007aff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --border: #d2d2d7;
            --text-main: #1d1d1f;
            --text-sec: #86868b;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { margin: 0; padding: 0; height: 100%; background: #f5f5f7; font-family: -apple-system, sans-serif; overflow: hidden; }

        .workspace { display: flex; flex-direction: column; height: 100vh; }

        /* HEADER CONTROL */
        .glass-header {
            background: var(--bg-glass); backdrop-filter: blur(20px);
            height: 55px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 1000;
        }

        .search-field {
            flex: 1; height: 36px; background: rgba(0,0,0,0.05);
            border: 1px solid transparent; border-radius: 8px;
            padding: 0 12px; font-size: 14px; outline: none; transition: 0.3s;
        }
        .search-field:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 10px rgba(0,122,255,0.2); }

        /* EDITOR CORE */
        .editor-box { flex: 1; display: flex; position: relative; background: #fff; overflow: hidden; }
        
        .line-numbers {
            width: 50px; background: #fbfbfd; border-right: 1px solid #efefef;
            padding: 20px 10px; font-family: "SF Mono", monospace; font-size: 13px;
            color: #ccc; text-align: right; user-select: none;
        }

        .scroll-container { flex: 1; position: relative; overflow: auto; }
        
        #input, #visual {
            position: absolute; inset: 0; padding: 20px;
            font-family: "SF Mono", "Fira Code", monospace; font-size: 16px;
            line-height: 1.6; white-space: pre; border: none; outline: none; margin: 0;
        }
        #input { color: transparent; background: transparent; z-index: 2; caret-color: var(--accent); resize: none; }
        #visual { z-index: 1; color: var(--text-main); }

        /* TOOLS OVERLAY (MODERN VIEW) */
        #tools-overlay {
            position: absolute; inset: 0; background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px); z-index: 500; display: none;
            padding: 60px 20px; align-items: start; justify-content: center; overflow-y: auto;
        }
        .tools-grid {
            width: 100%; max-width: 800px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px;
        }
        .tool-card {
            background: #fff; border: 1px solid var(--border); border-radius: 14px;
            padding: 20px; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .tool-card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 10px 25px rgba(0,122,255,0.15); }
        .t-id { font-size: 10px; font-weight: 800; color: var(--accent); text-transform: uppercase; margin-bottom: 5px; }
        .t-desc { font-size: 17px; font-weight: 600; color: #000; }

        /* FOOTER ACTIONS */
        .glass-footer {
            height: 65px; background: var(--bg-glass); backdrop-filter: blur(20px);
            border-top: 1px solid var(--border); display: flex; align-items: center;
            padding: 0 20px; gap: 12px;
        }

        .btn-action {
            height: 40px; padding: 0 20px; border-radius: 10px; border: 1px solid var(--border);
            background: #fff; color: var(--text-main); font-weight: 600; font-size: 13px;
            cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-action:active { transform: scale(0.97); background: #f5f5f7; }
        .btn-action.primary { background: var(--accent); color: #fff; border: none; }

        /* SYNTAX */
        .g { color: #8e8e93; font-weight: bold; }
        .t { color: var(--accent); font-weight: 800; }
        .x { color: #ff3b30; }
        .z { color: #007aff; }
        .c { color: #34c759; font-style: italic; }
        .m { background: rgba(255, 214, 0, 0.3); border-radius: 2px; }
    </style>
</head>
<body>

<div class="workspace">
    <header class="glass-header">
        <input type="text" id="find" class="search-field" placeholder="Поиск в коде..." oninput="update()">
        <button class="btn-action" onclick="toggleTools()">
            <span id="tools-label">СПИСОК ИНСТРУМЕНТОВ</span>
        </button>
    </header>

    <div class="editor-box">
        <div class="line-numbers" id="line-nums">1</div>
        <div class="scroll-container" id="scroller" onscroll="sync()">
            <div id="visual"></div>
            <textarea id="input" spellcheck="false" oninput="update()"></textarea>
        </div>

        <div id="tools-overlay" onclick="toggleTools()">
            <div class="tools-grid" id="tools-container" onclick="event.stopPropagation()"></div>
        </div>
    </div>

    <footer class="glass-footer">
        <button class="btn-action" onclick="exportJSON()">JSON EXPORT</button>
        <button class="btn-action" onclick="importJSON()">IMPORT</button>
        <div style="flex:1"></div>
        <button class="btn-action primary" onclick="saveFile()">СОХРАНИТЬ MPF</button>
    </footer>
</div>

<script>
    const area = document.getElementById('input');
    const vis = document.getElementById('visual');
    const nums = document.getElementById('line-nums');
    const toolGrid = document.getElementById('tools-container');
    const overlay = document.getElementById('tools-overlay');

    window.onload = () => {
        area.value = localStorage.getItem('cnc_v25_pro') || 
        "O0025 (FLANGE_PROJECT)\nG54\nN10 T1 D1\n(ROUGH TURN EXTERNAL)\nG0 X120. Z2.\nG1 Z-35. F0.25\nG1 X140. Z-50.\nG0 X200. Z100.\n\nN20 T3 D1\n(FINISH SHOULDER)\nG0 X120. Z-20.\nG1 X115. F0.15\nG0 X200. Z200.";
        update();
    };

    function update() {
        const code = area.value;
        localStorage.setItem('cnc_v25_pro', code);

        // Highlight
        let html = code.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c">($1)</span>')
            .replace(/(T\d+)/gi, '<span class="t">$1</span>')
            .replace(/(G\d+)/gi, '<span class="g">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="z">$1</span>');

        // Search
        const search = document.getElementById('find').value;
        if(search) {
            const re = new RegExp(`(${search})`, "gi");
            html = html.replace(re, '<span class="m">$1</span>');
        }
        vis.innerHTML = html;

        // Lines & Tools
        const lines = code.split('\n');
        nums.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        area.style.height = vis.style.height = Math.max(window.innerHeight, lines.length * 25.6 + 100) + 'px';

        buildToolList(lines);
    }

    function buildToolList(lines) {
        toolGrid.innerHTML = "";
        lines.forEach((line, i) => {
            const t = line.match(/T(\d+)/i);
            if(t) {
                // Логика: если в текущей или СЛЕДУЮЩЕЙ строке есть скобки - это имя
                let desc = "БЕЗ ОПИСАНИЯ";
                let searchRange = [lines[i], lines[i+1] || ""];
                searchRange.forEach(s => {
                    const m = s.match(/\((.*?)\)/);
                    if(m) desc = m[1];
                });

                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `<div class="t-id">ИНСТРУМЕНТ ${t[0]}</div><div class="t-desc">${desc}</div>`;
                card.onclick = () => {
                    const pos = lines.slice(0, i).join('\n').length + (i > 0 ? 1 : 0);
                    area.focus();
                    area.setSelectionRange(pos, pos + line.length);
                    document.getElementById('scroller').scrollTop = i * 25.6 - 40;
                    toggleTools();
                };
                toolGrid.appendChild(card);
            }
        });
    }

    function toggleTools() {
        const isVisible = overlay.style.display === 'flex';
        overlay.style.display = isVisible ? 'none' : 'flex';
        document.getElementById('tools-label').innerText = isVisible ? 'СПИСОК ИНСТРУМЕНТОВ' : 'ЗАКРЫТЬ СПИСОК';
    }

    function sync() { vis.scrollTop = nums.scrollTop = document.getElementById('scroller').scrollTop; }

    function saveFile() {
        const b = new Blob([area.value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = 'PREMIUM_PROG.MPF'; a.click();
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify({code: area.value, date: new Date()})], {type: 'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'backup.json'; a.click();
    }

    function importJSON() {
        const f = document.createElement('input'); f.type = 'file';
        f.onchange = e => {
            const r = new FileReader();
            r.onload = ev => { area.value = JSON.parse(ev.target.result).code; update(); };
            r.readAsText(e.target.files[0]);
        };
        f.click();
    }
</script>
</body>
</html>
