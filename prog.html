<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC PROFESSIONAL MONITOR</title>
    <style>
        :root { --bg: #1c1c1e; --accent: #0a84ff; --text: #ffffff; --x-col: #ff375f; --z-col: #0a84ff; }
        body, html { margin: 0; padding: 0; height: 100%; background: #000; font-family: 'Inter', sans-serif; color: var(--text); overflow: hidden; }
        
        .interface { display: flex; flex-direction: column; height: 100vh; }
        
        /* Виджет симуляции - теперь он сверху и всегда виден */
        .viewport { height: 40%; background: #000; position: relative; border-bottom: 2px solid var(--accent); }
        #cncCanvas { width: 100%; height: 100%; display: block; }
        
        /* Панель датчиков */
        .dro { display: grid; grid-template-columns: repeat(4, 1fr); background: #2c2c2e; padding: 10px; gap: 8px; }
        .dro-card { background: #1c1c1e; padding: 8px; border-radius: 8px; border: 1px solid #3a3a3c; text-align: center; }
        .label { font-size: 10px; color: #8e8e93; display: block; margin-bottom: 4px; }
        .value { font-family: 'Courier New', monospace; font-size: 16px; font-weight: bold; }

        /* Редактор */
        .editor-wrap { flex: 1; display: flex; position: relative; background: #1c1c1e; overflow: hidden; }
        #line-nums { width: 40px; padding: 15px 5px; text-align: right; color: #48484a; font-family: monospace; border-right: 1px solid #3a3a3c; font-size: 12px; }
        .scroll-area { flex: 1; position: relative; overflow: auto; }
        #code-input {
            width: 100%; min-height: 100%; padding: 15px; box-sizing: border-box;
            background: transparent; color: #fff; border: none; outline: none;
            font-family: 'Consolas', monospace; font-size: 14px; line-height: 1.5;
            resize: none; white-space: pre;
        }

        /* Кнопки */
        .controls { padding: 10px; background: #2c2c2e; display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; background: #3a3a3c; color: white; }
        .btn-primary { background: var(--accent); }
    </style>
</head>
<body>

<div class="interface">
    <div class="viewport">
        <canvas id="cncCanvas"></canvas>
        <div style="position:absolute; top:10px; left:10px; font-size:10px; color:var(--accent);">REAL-TIME PATH VISUALIZER</div>
    </div>

    <div class="dro">
        <div class="dro-card"><span class="label">X (DIAM)</span><span id="valX" class="value" style="color:var(--x-col)">0.000</span></div>
        <div class="dro-card"><span class="label">Z (LONG)</span><span id="valZ" class="value" style="color:var(--z-col)">0.000</span></div>
        <div class="dro-card"><span class="label">A (ROT)</span><span id="valA" class="value">0.000</span></div>
        <div class="dro-card"><span class="label">TOOL</span><span id="valT" class="value" style="color:#bf5af2">T0000</span></div>
    </div>

    <div class="editor-wrap">
        <div id="line-nums">1</div>
        <div class="scroll-area">
            <textarea id="code-input" spellcheck="false" oninput="process()" onkeyup="track()" onclick="track()"></textarea>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="zoomFit()">ZOOM FIT</button>
        <button class="btn btn-primary" onclick="exportCode()">SAVE .NC</button>
    </div>
</div>

<script>
    const input = document.getElementById('code-input');
    const canvas = document.getElementById('cncCanvas');
    const ctx = canvas.getContext('2d');
    
    // Сохранение при перезагрузке
    window.onload = () => {
        const saved = localStorage.getItem('cnc_pro_work');
        if(saved) input.value = saved;
        else input.value = "% \nO1407(PK231850RO)\nN1 T0101 (KOPIERST)\nG0 X50. Z2.\nG1 Z-25. F.2\nG1 X60.\nG0 X100. Z100.\nN2 T0606 (EINSTECH)\nG0 X12.3 Z2.\nG1 Z-53.1 F5.\nG1 X16. F.1";
        process();
    };

    function process() {
        localStorage.setItem('cnc_pro_work', input.value);
        const lines = input.value.split('\n');
        document.getElementById('line-nums').innerHTML = lines.map((_, i) => i + 1).join('<br>');
        draw();
    }

    function draw() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        const lines = input.value.split('\n');
        let cx = 0, cz = 0;
        let points = [];
        
        // 1. Сбор координат
        lines.forEach(l => {
            const mx = l.match(/X(-?\d*\.?\d+)/i);
            const mz = l.match(/Z(-?\d*\.?\d+)/i);
            const g0 = /G0/i.test(l);
            
            if(mx || mz) {
                let nx = mx ? parseFloat(mx[1]) : cx;
                let nz = mz ? parseFloat(mz[1]) : cz;
                points.push({x1: cx, z1: cz, x2: nx, z2: nz, rapid: g0});
                cx = nx; cz = nz;
            }
        });

        if(points.length === 0) return;

        // 2. Авто-масштаб
        const allZ = points.flatMap(p => [p.z1, p.z2]);
        const allX = points.flatMap(p => [p.x1, p.x2]);
        const minZ = Math.min(...allZ) - 10;
        const maxZ = Math.max(...allZ) + 10;
        const minX = Math.min(...allX) - 10;
        const maxX = Math.max(...allX) + 10;

        const scaleZ = canvas.width / (maxZ - minZ || 1);
        const scaleX = canvas.height / (maxX - minX || 1);
        const scale = Math.min(scaleZ, scaleX) * 0.8;

        const offZ = canvas.width * 0.8; // Начало справа для токарки
        const offY = canvas.height / 2;

        // 3. Отрисовка
        ctx.save();
        ctx.translate(offZ, offY);
        
        // Сетка
        ctx.strokeStyle = '#222';
        ctx.beginPath(); ctx.moveTo(-canvas.width, 0); ctx.lineTo(canvas.width, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -canvas.height); ctx.lineTo(0, canvas.height); ctx.stroke();

        points.forEach(p => {
            ctx.beginPath();
            ctx.lineWidth = p.rapid ? 1 : 2;
            ctx.strokeStyle = p.rapid ? '#ff3b30' : '#0a84ff';
            // Z идет влево (минус), X идет вверх/вниз (радиус)
            ctx.moveTo(p.z1 * scale, -p.x1 * scale / 2);
            ctx.lineTo(p.z2 * scale, -p.x2 * scale / 2);
            ctx.stroke();
        });
        ctx.restore();
    }

    function track() {
        const lines = input.value.substring(0, input.selectionStart).split('\n');
        const lastLine = lines[lines.length - 1];
        
        const mx = lastLine.match(/X(-?\d*\.?\d+)/i);
        const mz = lastLine.match(/Z(-?\d*\.?\d+)/i);
        const ma = lastLine.match(/A(-?\d*\.?\d+)/i);

        if(mx) document.getElementById('valX').innerText = parseFloat(mx[1]).toFixed(3);
        if(mz) document.getElementById('valZ').innerText = parseFloat(mz[1]).toFixed(3);
        if(ma) document.getElementById('valA').innerText = parseFloat(ma[1]).toFixed(3);

        for(let i = lines.length-1; i>=0; i--) {
            const t = lines[i].match(/T(\d+)/i);
            if(t) { document.getElementById('valT').innerText = "T"+t[1]; break; }
        }
    }

    function zoomFit() { draw(); }
    function exportCode() {
        const blob = new Blob([input.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'CLEAN_PROG.NC';
        a.click();
    }
</script>
</body>
</html>
