<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopTurn Full v21</title>
    <style>
        :root { 
            --s-blue: #003a5a; --s-light: #005f87; --s-orange: #eb7800;
            --s-gray: #e6e6e6; --s-dark: #333;
        }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }

        .cnc-grid {
            display: grid;
            grid-template-columns: 1fr 100px;
            grid-template-rows: 30px 1fr 1fr 60px;
            height: 100vh;
        }

        /* 1. Header */
        .cnc-header { 
            grid-column: 1 / 3; background: var(--s-blue); color: #fff;
            display: flex; align-items: center; padding: 0 10px; font-size: 12px; font-weight: bold;
        }

        /* 2. Simulation Screen */
        .cnc-screen { 
            background: #000; position: relative; border: 2px solid #555; overflow: hidden;
        }
        canvas { width: 100%; height: 100%; }
        
        .cnc-dro {
            position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8);
            border: 1px solid var(--s-light); padding: 8px; color: #00ff00; font-family: monospace;
        }

        /* 3. Program Editor */
        .cnc-editor { 
            background: #fff; display: flex; overflow: hidden; border-top: 2px solid var(--s-blue);
        }
        #ln { width: 30px; background: #ddd; text-align: right; padding: 10px 5px; font-size: 11px; color: #666; }
        .edit-wrap { flex: 1; position: relative; overflow-y: auto; }
        #input, #syntax {
            position: absolute; inset: 0; padding: 10px; font-family: monospace; font-size: 14px;
            line-height: 1.4; white-space: pre; border: none; outline: none;
        }
        #input { color: transparent; background: transparent; z-index: 2; caret-color: #000; }
        #syntax { z-index: 1; color: #333; }

        /* 4. Vertical Softkeys (Правая панель) */
        .v-keys { 
            grid-row: 2 / 4; grid-column: 2; background: #444; 
            display: flex; flex-direction: column; gap: 2px; padding: 2px;
        }
        .v-key { 
            flex: 1; background: #666; color: #fff; border: none; font-size: 10px; 
            text-transform: uppercase; font-weight: bold; cursor: pointer;
        }
        .v-key:active { background: var(--s-orange); }

        /* 5. Horizontal Softkeys (Нижняя панель) */
        .h-keys { 
            grid-column: 1 / 3; background: #222; display: flex; gap: 2px; padding: 2px;
        }
        .h-key { 
            flex: 1; background: #555; color: #fff; border: none; font-size: 10px; font-weight: bold;
        }

        /* Syntax colors */
        .c-g { color: var(--s-orange); font-weight: bold; }
        .c-x { color: #d32f2f; }
        .c-z { color: #1976d2; }
        .c-t { color: #7b1fa2; background: #f0f0f0; }
    </style>
</head>
<body>

<div class="cnc-grid">
    <div class="cnc-header">SKP_01.MPF | CHANNEL 1 | JOG MODE</div>

    <div class="cnc-screen">
        <canvas id="cvs"></canvas>
        <div class="cnc-dro" id="dro">X: 0.000<br>Z: 0.000</div>
    </div>

    <div class="v-keys">
        <button class="v-key" onclick="setMode('contour')">Контур</button>
        <button class="v-key" onclick="setMode('drill')">Сверление</button>
        <button class="v-key" onclick="setMode('turn')">Точение</button>
        <button class="v-key" onclick="zoom(1.2)">Zoom +</button>
        <button class="v-key" onclick="zoom(0.8)">Zoom -</button>
        <button class="v-key" style="background:#888" onclick="resetV()">Reset</button>
    </div>

    <div class="cnc-editor">
        <div id="ln">1</div>
        <div class="edit-wrap" id="scr" onscroll="sync()">
            <div id="syntax"></div>
            <textarea id="input" spellcheck="false" oninput="render()"></textarea>
        </div>
    </div>

    <div class="h-keys">
        <button class="h-key">PROGRAM</button>
        <button class="h-key">OFFSET</button>
        <button class="h-key">PROGRAM MANAGER</button>
        <button class="h-key">DIAGNOSIS</button>
        <button class="h-key" style="background:var(--s-orange)" onclick="saveFile()">💾 SAVE</button>
    </div>
</div>

<script>
    const inp = document.getElementById('input');
    const syn = document.getElementById('syntax');
    const lns = document.getElementById('ln');
    const cvs = document.getElementById('cvs');
    const ctx = cvs.getContext('2d');

    let scale = 5, offX = 0, offZ = 0;
    const colors = ['#eb7800', '#00ff00', '#00bfff', '#ff00ff'];

    window.onload = () => {
        inp.value = "G54\nT1 D1\nG0 X60 Z2\nG1 Z-30 F.2\nG1 X80 Z-50\nG0 X120 Z100\n\nT2 D1\nG0 X40 Z-20\nG1 X0\nG0 X100 Z100";
        init(); render();
    };

    function init() {
        cvs.width = cvs.offsetWidth; cvs.height = cvs.offsetHeight;
        offX = cvs.height * 0.7; offZ = cvs.width * 0.8;
    }

    function render() {
        const val = inp.value;
        syn.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/(G0\d?|G00)/gi, '<span style="color:#888">$1</span>')
            .replace(/(G1\d?|G01|G2|G3)/gi, '<span class="c-g">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="c-x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="c-z">$1</span>')
            .replace(/(T\d+)/gi, '<span class="c-t">$1</span>');

        const rows = val.split('\n');
        lns.innerHTML = rows.map((_,i)=>i+1).join('<br>');
        inp.style.height = syn.style.height = Math.max(200, rows.length * 20) + 'px';
        draw(rows);
    }

    function draw(prog) {
        ctx.fillStyle = '#000'; ctx.fillRect(0,0,cvs.width,cvs.height);
        
        // Grid
        ctx.strokeStyle = '#222'; ctx.lineWidth = 1;
        for(let i=0;i<cvs.width;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,cvs.height);ctx.stroke();}
        for(let i=0;i<cvs.height;i+=40){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(cvs.width,i);ctx.stroke();}

        let cX = 0, cZ = 0, t = 0;
        prog.forEach(line => {
            const tm = line.match(/T(\d+)/i); if(tm) t = parseInt(tm[1]) % colors.length;
            const mx = line.match(/X(-?\d*\.?\d+)/i);
            const mz = line.match(/Z(-?\d*\.?\d+)/i);
            const isG0 = /G0/i.test(line);

            if(mx || mz) {
                let nX = mx ? parseFloat(mx[1]) : cX;
                let nZ = mz ? parseFloat(mz[1]) : cZ;
                ctx.beginPath();
                ctx.lineWidth = isG0 ? 1 : 3;
                ctx.strokeStyle = isG0 ? '#555' : colors[t];
                ctx.setLineDash(isG0 ? [4,4] : []);
                ctx.moveTo(offZ + cZ*scale, offX - (cX/2)*scale);
                ctx.lineTo(offZ + nZ*scale, offX - (nX/2)*scale);
                ctx.stroke();
                cX = nX; cZ = nZ;
            }
        });
        document.getElementById('dro').innerHTML = `X: ${cX.toFixed(3)}<br>Z: ${cZ.toFixed(3)}`;
    }

    function setMode(m) { alert('Режим ' + m + ' активирован. Вставьте цикл в код.'); }
    function zoom(f) { scale *= f; render(); }
    function resetV() { scale = 5; init(); render(); }
    function sync() { syn.scrollTop = lns.scrollTop = document.getElementById('scr').scrollTop; }
    function saveFile() {
        const b = new Blob([inp.value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b);
        a.download = 'WORK.MPF'; a.click();
    }
    window.onresize = () => { init(); render(); };
</script>
</body>
</html>
