<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CNC Pro v32</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #f2f2f7;
            --accent: #007aff;
            --border: #d1d1d6;
            --text: #1c1c1e;
            --syn-t: #34c759;
            --syn-g: #af52de;
            --syn-coord: #ff3b30;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body, html { 
            margin: 0; padding: 0; 
            height: 100dvh; width: 100vw;
            background: var(--bg); font-family: -apple-system, sans-serif; 
            color: var(--text); overflow: hidden;
        }

        .app-wrapper {
            display: flex; flex-direction: column;
            height: 100dvh; width: 100%;
        }

        header {
            height: 50px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 15px;
            background: #fff; flex-shrink: 0;
        }

        main { flex: 1; position: relative; overflow: hidden; background: var(--surface); }

        #hub {
            height: 100%; overflow-y: auto; padding: 15px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px; align-content: start;
        }

        .tool-item {
            background: #fff; border: 1px solid var(--border); border-radius: 12px;
            padding: 15px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        #editor-layer {
            position: absolute; inset: 0; background: #fff;
            display: none; flex-direction: column; z-index: 100;
        }

        .editor-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        
        #code, #syntax {
            position: absolute; inset: 0; padding: 15px 15px 15px 50px;
            font-family: "SF Mono", monospace; font-size: 15px;
            line-height: 1.5; white-space: pre; border: none; outline: none; margin: 0;
        }
        #code { color: transparent; background: transparent; z-index: 2; caret-color: var(--accent); resize: none; }
        #syntax { z-index: 1; color: var(--text); pointer-events: none; }

        .line-nums {
            width: 40px; position: absolute; left: 0; top: 0; bottom: 0;
            background: var(--surface); border-right: 1px solid var(--border);
            padding-top: 15px; text-align: center; font-size: 11px; color: #aeaeb2; z-index: 3;
        }

        footer {
            height: 85px; background: #fff; border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 15px calc(env(safe-area-inset-bottom) + 5px) 15px;
            gap: 10px; flex-shrink: 0;
        }

        .btn {
            height: 46px; border-radius: 10px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text); font-size: 13px; font-weight: 600;
            cursor: pointer; flex: 1; display: flex; align-items: center; justify-content: center;
        }
        .btn.primary { background: var(--accent); color: #fff; border: none; }

        .t { color: var(--syn-t); font-weight: bold; }
        .g { color: var(--syn-g); }
        .x { color: var(--syn-coord); }
        .z { color: var(--accent); }
        .c { color: #8e8e93; font-style: italic; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <b style="font-size: 13px;">T-MANAGER PRO v32</b>
        <div style="flex:1"></div>
        <button class="btn" style="flex:0; width:40px; height:32px;" onclick="document.getElementById('f').click()">📂</button>
        <input type="file" id="f" hidden onchange="openFile(this)">
    </header>

    <main>
        <div id="hub"></div>

        <div id="editor-layer">
            <div style="padding: 8px 15px; background: var(--surface); display:flex; justify-content: space-between; align-items: center;">
                <small id="cur-tool" style="font-weight: 700; color: var(--accent);"></small>
                <button class="btn" style="flex:0; height:28px; padding:0 10px; font-size:11px;" onclick="closeEditor()">ZURÜCK</button>
            </div>
            <div class="editor-container">
                <div class="line-nums" id="ln"></div>
                <div style="flex:1; position:relative; overflow:auto;" id="scr" onscroll="sync()">
                    <div id="syntax"></div>
                    <textarea id="code" spellcheck="false" oninput="render()"></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn" onclick="copyToolList()">LISTE KOPIEREN</button>
        <button class="btn primary" onclick="exportO()">SPEICHERN (.O)</button>
    </footer>
</div>

<script>
    const el = document.getElementById('code');
    const sx = document.getElementById('syntax');
    const ln = document.getElementById('ln');
    const hb = document.getElementById('hub');

    window.onload = () => {
        el.value = localStorage.getItem('cnc_v32') || 
        "O3200 (DIRECT_T_FORMAT)\nG54 G90\n\nN10 T0101\n(KOPIERST.R0.8 G54)\nG0 X100. Z5.\nG1 Z-20. F0.2\nG0 X200. Z200.\n\nN20 T0303\n(ABSTECH.2.5MM)\nG0 X50. Z2.\nG1 Z-15. F0.1\nG0 X200. Z200.";
        render();
    };

    function render() {
        let val = el.value.replace(/T(\d{1,2})(?!\d{2})/gi, (m, p1) => "T" + p1.padStart(2, '0') + p1.padStart(2, '0'));
        if (el.value !== val) el.value = val;
        localStorage.setItem('cnc_v32', val);

        sx.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c">($1)</span>')
            .replace(/(T\d{4})/gi, '<span class="t">$1</span>')
            .replace(/(G\d+)/gi, '<span class="g">$1</span>')
            .replace(/(X-?\d*\.?\d*)/gi, '<span class="x">$1</span>')
            .replace(/(Z-?\d*\.?\d*)/gi, '<span class="z">$1</span>');

        const rows = val.split('\n');
        ln.innerHTML = rows.map((_, i) => i + 1).join('<br>');
        el.style.height = sx.style.height = Math.max(window.innerHeight, rows.length * 22.5 + 200) + 'px';
        buildHub(rows);
    }

    function buildHub(rows) {
        hb.innerHTML = "";
        rows.forEach((line, i) => {
            const t = line.match(/T(\d{4})/i);
            if(t) {
                let desc = "";
                [rows[i], rows[i+1] || ""].forEach(s => {
                    const m = s.match(/\((.*?)\)/); if(m) desc = m[1];
                });

                const div = document.createElement('div');
                div.className = 'tool-item';
                div.innerHTML = `<b>T${t[1]}${desc ? ' ' + desc : ''}</b>`;
                div.onclick = () => {
                    document.getElementById('editor-layer').style.display = 'flex';
                    document.getElementById('cur-tool').innerText = "T" + t[1] + " " + desc;
                    const pos = rows.slice(0, i).join('\n').length + (i > 0 ? 1 : 0);
                    el.focus(); el.setSelectionRange(pos, pos + line.length);
                    document.getElementById('scr').scrollTop = i * 22.5 - 50;
                };
                hb.appendChild(div);
            }
        });
    }

    function copyToolList() {
        const rows = el.value.split('\n');
        let out = "";
        rows.forEach((line, i) => {
            const t = line.match(/T(\d{4})/);
            if(t) {
                let desc = "";
                [rows[i], rows[i+1] || ""].forEach(s => {
                    const m = s.match(/\((.*?)\)/); if(m) desc = m[1];
                });
                out += `T${t[1]}${desc ? ' ' + desc : ''}\n`;
            }
        });
        navigator.clipboard.writeText(out.trim()).then(() => alert("Liste kopiert!"));
    }

    function exportO() {
        const b = new Blob([el.value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'PROGRAMM.O'; a.click();
    }

    function openFile(input) {
        const f = input.files[0]; if(!f) return;
        const r = new FileReader();
        r.onload = e => { el.value = e.target.result; render(); };
        r.readAsText(f);
    }

    function closeEditor() { document.getElementById('editor-layer').style.display = 'none'; }
    function sync() { sx.scrollTop = ln.scrollTop = document.getElementById('scr').scrollTop; }
</script>
</body>
</html>
