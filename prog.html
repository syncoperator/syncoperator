<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Navigation Editor</title>
    <style>
        :root { 
            --s-blue: #003a5a; --s-light: #005f87; --s-orange: #eb7800;
            --bg: #1e1e1e; --text: #d4d4d4;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Segoe UI', sans-serif; color: var(--text); overflow: hidden; }

        .app { display: flex; flex-direction: column; height: 100vh; }

        /* Верхняя панель поиска */
        .search-bar { 
            background: #2d2d2d; padding: 10px; display: flex; gap: 8px; 
            border-bottom: 1px solid #3c3c3c; flex-wrap: wrap;
        }
        .search-bar input { 
            background: #3c3c3c; border: 1px solid #555; color: #fff; 
            padding: 5px 10px; border-radius: 4px; font-size: 13px; outline: none;
        }
        .search-bar input:focus { border-color: var(--s-orange); }

        /* Рабочая зона */
        .main { flex: 1; display: flex; overflow: hidden; position: relative; }

        /* Список инструментов (Навигация) */
        .tool-nav { 
            width: 150px; background: #252526; border-right: 1px solid #3c3c3c; 
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .tool-item { 
            padding: 10px; font-size: 12px; border-bottom: 1px solid #333; 
            cursor: pointer; color: #aaa; transition: 0.2s;
        }
        .tool-item:hover { background: #2a2d2e; color: #fff; }
        .tool-item b { color: var(--s-orange); display: block; margin-bottom: 3px; }

        /* Редактор */
        .editor-container { flex: 1; position: relative; display: flex; overflow: hidden; }
        #ln-col { 
            width: 40px; background: #1e1e1e; color: #858585; 
            text-align: right; padding: 15px 5px; font-family: monospace; font-size: 14px; 
        }
        .edit-wrap { flex: 1; position: relative; overflow: auto; }
        #editor, #highlight { 
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 15px; font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 16px; line-height: 1.5; white-space: pre; border: none; outline: none;
        }
        #editor { color: transparent; background: transparent; z-index: 2; caret-color: #fff; resize: none; }
        #highlight { z-index: 1; pointer-events: none; }

        /* Футер */
        .footer { 
            background: var(--s-blue); height: 50px; display: flex; 
            gap: 2px; padding: 2px; 
        }
        .f-btn { 
            flex: 1; background: var(--s-light); border: none; color: #fff; 
            font-size: 11px; font-weight: bold; text-transform: uppercase; cursor: pointer;
        }
        .f-btn:active { background: var(--s-orange); }

        /* Цвета синтаксиса */
        .g { color: #dcdcaa; } /* G-коды */
        .t { color: #c586c0; font-weight: bold; } /* Инструмент */
        .x { color: #ce9178; } /* X */
        .z { color: #9cdcfe; } /* Z */
        .comm { color: #6a9955; font-style: italic; } /* Комменты */
        .match { background: rgba(255, 255, 0, 0.3); border-bottom: 2px solid orange; } /* Подсветка поиска */
    </style>
</head>
<body>

<div class="app">
    <div class="search-bar">
        <input type="text" id="find-inp" placeholder="Найти (X, Z, T...)" oninput="applySearch()">
        <input type="text" id="replace-inp" placeholder="Заменить на...">
        <button class="f-btn" style="flex:0; padding: 0 15px;" onclick="replaceText()">Заменить</button>
        <div id="search-stat" style="font-size:12px; align-self:center; color:#888; margin-left:10px;"></div>
    </div>

    <div class="main">
        <div class="tool-nav" id="tool-nav">
            </div>
        <div class="editor-container">
            <div id="ln-col">1</div>
            <div class="edit-wrap" id="scroll-box" onscroll="sync()">
                <div id="highlight"></div>
                <textarea id="editor" spellcheck="false" oninput="process()"></textarea>
            </div>
        </div>
    </div>

    <div class="footer">
        <button class="f-btn" onclick="jumpTo('T')">След. Инструмент</button>
        <button class="f-btn" onclick="document.getElementById('editor').focus()">Правка</button>
        <button class="f-btn" onclick="saveFile()">💾 Сохранить</button>
        <button class="f-btn" style="background:var(--s-orange)" onclick="toggleNav()">Навигация</button>
    </div>
</div>

<script>
    const ed = document.getElementById('editor');
    const hi = document.getElementById('highlight');
    const ln = document.getElementById('ln-col');
    const nav = document.getElementById('tool-nav');
    const findInp = document.getElementById('find-inp');

    window.onload = () => {
        ed.value = localStorage.getItem('cnc_v22') || "O1001 (VAL)\nN5 T1 D1 (ROUGH)\nG0 X100 Z5\nG1 Z0 F.2\nG1 X40 Z-25\nG1 Z-50\nG0 X200 Z100\n\nN10 T2 D1 (FINISH)\nG0 X42 Z2\nG1 Z-50 F.1\nG1 X60\nG0 X200 Z200\n\nN15 T3 D1 (THREAD)";
        process();
    };

    function process() {
        const text = ed.value;
        localStorage.setItem('cnc_v22', text);
        
        // 1. Синтаксис
        let html = text.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="comm">($1)</span>')
            .replace(/(T\d+)/gi, '<span class="t">$1</span>')
            .replace(/(G\d+)/gi, '<span class="g">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="z">$1</span>');

        // 2. Поиск
        const query = findInp.value;
        if(query) {
            const regex = new RegExp(`(${query})`, "gi");
            html = html.replace(regex, '<span class="match">$1</span>');
        }
        
        hi.innerHTML = html;

        // 3. Номера строк и Навигация
        const lines = text.split('\n');
        ln.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        ed.style.height = hi.style.height = Math.max(window.innerHeight - 150, lines.length * 24) + 'px';

        updateNav(lines);
    }

    function updateNav(lines) {
        nav.innerHTML = '<div style="padding:10px; font-size:10px; color:#555">ИНСТРУМЕНТЫ</div>';
        lines.forEach((line, index) => {
            const tMatch = line.match(/T(\d+)/i);
            const comm = line.match(/\((.*?)\)/);
            if(tMatch) {
                const item = document.createElement('div');
                item.className = 'tool-item';
                item.innerHTML = `<b>${tMatch[0]}</b> ${comm ? comm[1] : ''}`;
                item.onclick = () => scrollToLine(index);
                nav.appendChild(item);
            }
        });
    }

    function scrollToLine(idx) {
        const lineHeight = 24; 
        document.getElementById('scroll-box').scrollTop = idx * lineHeight;
        ed.focus();
        // Ставим курсор
        const lines = ed.value.split('\n');
        let pos = 0;
        for(let i=0; i<idx; i++) pos += lines[i].length + 1;
        ed.setSelectionRange(pos, pos + lines[idx].length);
    }

    function applySearch() {
        process();
        const count = (hi.innerHTML.match(/class="match"/g) || []).length;
        document.getElementById('search-stat').innerText = count ? `Найдено: ${count}` : "";
    }

    function replaceText() {
        const find = findInp.value;
        const replace = document.getElementById('replace-inp').value;
        if(!find) return;
        ed.value = ed.value.split(find).join(replace);
        process();
    }

    function jumpTo(char) {
        const text = ed.value;
        const start = ed.selectionStart + 1;
        const nextPos = text.toUpperCase().indexOf(char.toUpperCase(), start);
        if(nextPos !== -1) {
            ed.setSelectionRange(nextPos, nextPos + 2);
            const line = text.substr(0, nextPos).split('\n').length - 1;
            scrollToLine(line);
        } else {
            ed.setSelectionRange(0, 0); // В начало, если не нашли
        }
    }

    function toggleNav() {
        nav.style.display = nav.style.display === 'none' ? 'flex' : 'none';
    }

    function sync() {
        const s = document.getElementById('scroll-box');
        hi.scrollTop = ln.scrollTop = s.scrollTop;
    }

    function saveFile() {
        const blob = new Blob([ed.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'PROGRAM.MPF';
        a.click();
    }
</script>
</body>
</html>
