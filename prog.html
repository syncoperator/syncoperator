<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Premium Editor v24</title>
    <style>
        :root {
            --accent: #007aff;
            --bg: #ffffff;
            --text: #1d1d1f;
            --border: #d2d2d7;
            --secondary: #f5f5f7;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--text); overflow: hidden; }

        .app-shell { display: flex; flex-direction: column; height: 100vh; }

        /* HEADER: SEARCH & TOOLS */
        .premium-header {
            padding: 10px 15px; background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 10px; z-index: 100;
        }
        .search-group { display: flex; gap: 8px; align-items: center; }
        .input-premium {
            flex: 1; border: 1px solid var(--border); background: var(--secondary);
            padding: 8px 12px; border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s;
        }
        .input-premium:focus { border-color: var(--accent); background: #fff; box-shadow: 0 0 0 3px rgba(0,122,255,0.1); }

        /* EDITOR AREA */
        .main-editor { flex: 1; display: flex; overflow: hidden; position: relative; }
        .line-numbers {
            width: 45px; background: var(--secondary); color: #86868b;
            text-align: right; padding: 20px 8px; font-family: "SF Mono", Menlo, monospace; font-size: 13px; border-right: 1px solid var(--border);
        }
        .editor-scroll { flex: 1; position: relative; overflow: auto; padding-bottom: 120px; } /* padding to avoid overlap */
        #code-input, #code-layer {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 20px; font-family: "SF Mono", "Fira Code", monospace; font-size: 15px;
            line-height: 1.6; white-space: pre; border: none; outline: none; margin: 0;
        }
        #code-input { color: transparent; background: transparent; z-index: 2; caret-color: var(--accent); resize: none; }
        #code-layer { z-index: 1; pointer-events: none; }

        /* PULL-UP TOOLS PANEL */
        .tools-drawer {
            position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%);
            width: 95%; max-width: 600px; background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 200; overflow: hidden; max-height: 40vh; display: flex; flex-direction: column;
        }
        .tools-drawer.collapsed { transform: translateX(-50%) translateY(calc(100% + 10px)); }
        .drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 10px auto; cursor: pointer; }
        .tools-list { overflow-y: auto; padding: 0 15px 15px; }
        .tool-card {
            padding: 12px; border-bottom: 1px solid var(--secondary); cursor: pointer;
            display: flex; flex-direction: column;
        }
        .tool-card:last-child { border-bottom: none; }
        .t-nr { font-size: 10px; color: var(--accent); text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
        .t-name { font-size: 16px; font-weight: 700; color: var(--text); }

        /* FOOTER ACTION BAR */
        .footer-bar {
            height: 60px; background: var(--bg); border-top: 1px solid var(--border);
            display: flex; padding: 0 15px; align-items: center; gap: 10px; justify-content: space-between;
        }
        .btn-premium {
            background: var(--secondary); border: none; color: var(--text);
            padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: 0.2s;
        }
        .btn-premium.active { background: var(--accent); color: #fff; }
        .btn-premium:active { transform: scale(0.96); }

        /* SYNTAX */
        .g-code { color: #af52de; font-weight: bold; }
        .x-coord { color: #ff3b30; }
        .z-coord { color: #007aff; }
        .t-call { color: #34c759; font-weight: bold; }
        .comment { color: #8e8e93; font-style: italic; }
        .match { background: rgba(255, 214, 0, 0.3); border-radius: 3px; }
    </style>
</head>
<body>

<div class="app-shell">
    <header class="premium-header">
        <div class="search-group">
            <input type="text" id="findInput" class="input-premium" placeholder="Поиск (напр. X120)" oninput="render()">
            <input type="text" id="replaceInput" class="input-premium" placeholder="Замена">
            <button class="btn-premium" onclick="replaceText()">All</button>
        </div>
    </header>

    <div class="main-editor">
        <div class="line-numbers" id="lineNums">1</div>
        <div class="editor-scroll" id="editorScroll" onscroll="syncScroll()">
            <div id="code-layer"></div>
            <textarea id="code-input" spellcheck="false" oninput="render()"></textarea>
        </div>
    </div>

    <div id="drawer" class="tools-drawer collapsed">
        <div class="drawer-handle" onclick="toggleTools()"></div>
        <div style="padding: 0 15px 10px; font-size: 12px; font-weight: bold; color: #888;">LISTA INSTRUMENTELOR</div>
        <div class="tools-list" id="toolsList"></div>
    </div>

    <footer class="footer-bar">
        <div style="display:flex; gap:8px;">
            <button class="btn-premium" onclick="toggleTools()" id="toolsBtn">TOOLS</button>
            <button class="btn-premium" onclick="exportJSON()">JSON EXPORT</button>
            <button class="btn-premium" onclick="importJSON()">IMPORT</button>
        </div>
        <button class="btn-premium active" onclick="saveNC()">SAVE MPF</button>
    </footer>
</div>

<script>
    const input = document.getElementById('code-input');
    const layer = document.getElementById('code-layer');
    const lineNums = document.getElementById('lineNums');
    const toolsList = document.getElementById('toolsList');
    const drawer = document.getElementById('drawer');

    window.onload = () => {
        input.value = localStorage.getItem('cnc_premium_v24') || 
        "G54\nT01 D1\n(ROUGHING OUTER)\nG0 X120. Z2.\nG1 Z-45. F0.2\nG1 X140.\nG0 X200. Z100.\n\nT03 D1\n(FINISHING FLANGE)\nG0 X120. Z-10.5\nG1 X125.05 F0.15\nG0 X200. Z200.";
        render();
    };

    function render() {
        const val = input.value;
        localStorage.setItem('cnc_premium_v24', val);

        // Syntax highlighting
        let html = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="comment">($1)</span>')
            .replace(/(T\d+)/gi, '<span class="t-call">$1</span>')
            .replace(/(G\d+)/gi, '<span class="g-code">$1</span>')
            .replace(/(X-?\d*\.?\d*)/gi, '<span class="x-coord">$1</span>')
            .replace(/(Z-?\d*\.?\d*)/gi, '<span class="z-coord">$1</span>');

        // Search highlight
        const query = document.getElementById('findInput').value;
        if(query) {
            const re = new RegExp(`(${query})`, "gi");
            html = html.replace(re, '<span class="match">$1</span>');
        }
        layer.innerHTML = html;

        // Lines
        const lines = val.split('\n');
        lineNums.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        input.style.height = layer.style.height = Math.max(window.innerHeight, lines.length * 24 + 200) + 'px';

        updateTools(lines);
    }

    function updateTools(lines) {
        toolsList.innerHTML = "";
        lines.forEach((line, i) => {
            const tMatch = line.match(/T(\d+)/i);
            if(tMatch) {
                // Ищем название в следующей строке, если там скобки
                let name = "NO NAME";
                if(lines[i+1] && lines[i+1].includes('(')) {
                    const nMatch = lines[i+1].match(/\((.*?)\)/);
                    if(nMatch) name = nMatch[1];
                }
                
                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `<span class="t-nr">T-${tMatch[1]}</span><span class="t-name">${name}</span>`;
                card.onclick = () => {
                    const pos = lines.slice(0, i).join('\n').length + (i > 0 ? 1 : 0);
                    input.focus();
                    input.setSelectionRange(pos, pos + line.length);
                    document.getElementById('editorScroll').scrollTop = i * 24;
                    toggleTools();
                };
                toolsList.appendChild(card);
            }
        });
    }

    function toggleTools() {
        drawer.classList.toggle('collapsed');
        document.getElementById('toolsBtn').classList.toggle('active');
    }

    function replaceText() {
        const find = document.getElementById('findInput').value;
        const replace = document.getElementById('replaceInput').value;
        if(!find) return;
        input.value = input.value.split(find).join(replace);
        render();
    }

    function syncScroll() {
        layer.scrollTop = lineNums.scrollTop = document.getElementById('editorScroll').scrollTop;
    }

    function saveNC() {
        const blob = new Blob([input.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'PREMIUM_PROG.MPF';
        a.click();
    }

    function exportJSON() {
        const data = { code: input.value, timestamp: new Date() };
        const blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'config_export.json';
        a.click();
    }

    function importJSON() {
        const inputF = document.createElement('input');
        inputF.type = 'file';
        inputF.onchange = e => {
            const reader = new FileReader();
            reader.onload = event => {
                const data = JSON.parse(event.target.result);
                input.value = data.code;
                render();
            };
            reader.readAsText(e.target.files[0]);
        };
        inputF.click();
    }
</script>
</body>
</html>
