<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNC Studio Pro — Light Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --accent: #007aff; --text: #1d1d1f; 
            --border: #d2d2d7; --comment: #8e8e93; --gcode: #ff3b30; 
            --mcode: #af52de; --coord: #007aff; --feed: #34c759;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 20px; height: 100vh; overflow: hidden; }

        .app-container {
            display: flex; flex-direction: column; height: calc(100vh - 40px);
            background: var(--card); border-radius: 24px; border: 1px solid var(--border);
            box-shadow: 0 20px 40px rgba(0,0,0,0.08); overflow: hidden;
        }

        /* Header & Search */
        .top-bar {
            padding: 15px 25px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }

        .search-wrapper { position: relative; flex: 1; max-width: 400px; }
        .search-input {
            width: 100%; padding: 10px 15px 10px 35px; border-radius: 10px;
            border: 1px solid var(--border); background: #f5f5f7; font-size: 14px; outline: none;
        }
        .search-input:focus { border-color: var(--accent); background: #fff; }
        .search-icon { position: absolute; left: 12px; top: 11px; opacity: 0.4; }

        .btn-group { display: flex; gap: 10px; }
        .btn-main {
            padding: 10px 20px; border-radius: 12px; border: none; font-weight: 700;
            font-size: 13px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-load { background: #e8e8ed; color: var(--text); }
        .btn-save { background: var(--accent); color: white; }
        .btn-main:hover { opacity: 0.8; transform: translateY(-1px); }

        /* Main Workspace */
        .workspace { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        #line-numbers {
            padding: 20px 10px; background: #fbfbfd; border-right: 1px solid var(--border);
            text-align: right; color: #aeaeb2; font-family: 'Fira Code', monospace;
            font-size: 14px; line-height: 1.6; min-width: 45px; user-select: none;
        }

        .editor-wrapper { flex: 1; overflow: auto; position: relative; background: #fff; }
        
        #editor {
            width: 100%; min-height: 100%; padding: 20px; box-sizing: border-box;
            font-family: 'Fira Code', monospace; font-size: 15px; line-height: 1.6;
            white-space: pre; outline: none; color: transparent; caret-color: var(--text);
            position: absolute; top: 0; left: 0; z-index: 2;
        }

        #highlight-layer {
            width: 100%; padding: 20px; box-sizing: border-box;
            font-family: 'Fira Code', monospace; font-size: 15px; line-height: 1.6;
            white-space: pre-wrap; word-break: break-all; pointer-events: none;
            position: absolute; top: 0; left: 0; z-index: 1; color: var(--text);
        }

        /* Syntax Colors */
        .cnc-g { color: var(--gcode); font-weight: bold; }
        .cnc-m { color: var(--mcode); font-weight: bold; }
        .cnc-xyz { color: var(--coord); }
        .cnc-fs { color: var(--feed); font-weight: 600; }
        .cnc-comment { color: var(--comment); font-style: italic; background: #f2f2f7; border-radius: 4px; }
        .cnc-search-match { background: #fff100; color: #000; border-radius: 2px; }

        /* Drag & Drop Overlay */
        #drop-zone {
            position: absolute; inset: 0; background: rgba(0,122,255,0.1);
            border: 3px dashed var(--accent); z-index: 100; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div id="drop-zone"><h2>Drop NC File here</h2></div>
    
    <div class="top-bar">
        <div>
            <h1 style="margin:0; font-size:18px; font-weight:900;">CNC<span>.STUDIO</span></h1>
            <span id="filename-display" style="font-size:11px; font-weight:700; color:var(--comment);">new_program.nc</span>
        </div>

        <div class="search-wrapper">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Quick search (G0, M3, X...)" oninput="runHighlight()">
        </div>

        <div class="btn-group">
            <input type="file" id="file-input" hidden onchange="loadFile(event)">
            <button class="btn-main btn-load" onclick="document.getElementById('file-input').click()">Open File</button>
            <button class="btn-main btn-save" onclick="saveFile()">Save NC</button>
        </div>
    </div>

    <div class="workspace">
        <div id="line-numbers"></div>
        <div class="editor-wrapper">
            <div id="highlight-layer"></div>
            <div id="editor" contenteditable="true" spellcheck="false" oninput="runHighlight()" onscroll="syncScroll()"></div>
        </div>
    </div>

    <div style="padding: 10px 25px; border-top: 1px solid var(--border); font-size: 11px; display: flex; justify-content: space-between; font-weight: 700; color: var(--comment);">
        <div id="stats">Lines: 0 | Chars: 0</div>
        <div>PREMIUM LIGHT ENGINE v2.0</div>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const highlightLayer = document.getElementById('highlight-layer');
    const lineNumbers = document.getElementById('line-numbers');
    const searchInput = document.getElementById('search-input');

    // Темы подсветки
    function runHighlight() {
        let content = editor.innerText;
        const searchVal = searchInput.value;

        // Обновляем статистику
        const lines = content.split('\n');
        document.getElementById('stats').innerText = `Lines: ${lines.length} | Chars: ${content.length}`;
        
        // Номера строк
        lineNumbers.innerHTML = lines.map((_, i) => i + 1).join('<br>');

        // Подсветка синтаксиса
        let html = content
            .replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="cnc-comment">($1)</span>')
            .replace(/(G\d+)/gi, '<span class="cnc-g">$1</span>')
            .replace(/(M\d+)/gi, '<span class="cnc-m">$1</span>')
            .replace(/([XYZUVWRA][-]?\d*\.?\d+)/gi, '<span class="cnc-xyz">$1</span>')
            .replace(/([FS]\d*\.?\d+)/gi, '<span class="cnc-fs">$1</span>');

        // Подсветка поиска
        if (searchVal && searchVal.length > 0) {
            const re = new RegExp(`(${searchVal})`, "gi");
            html = html.replace(re, '<span class="cnc-search-match">$1</span>');
        }

        highlightLayer.innerHTML = html + "\n";
    }

    function syncScroll() {
        highlightLayer.scrollTop = editor.scrollTop;
        highlightLayer.scrollLeft = editor.scrollLeft;
        lineNumbers.scrollTop = editor.scrollTop;
    }

    // Загрузка файла
    function loadFile(e) {
        const file = e.target.files[0];
        if (!file) return;
        readFile(file);
    }

    function readFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
            editor.innerText = e.target.result;
            document.getElementById('filename-display').innerText = file.name.toUpperCase();
            runHighlight();
        };
        reader.readAsText(file);
    }

    // Сохранение файла
    function saveFile() {
        const text = editor.innerText;
        const blob = new Blob([text], { type: 'text/plain' });
        const anchor = document.createElement('a');
        anchor.download = document.getElementById('filename-display').innerText || 'program.nc';
        anchor.href = window.URL.createObjectURL(blob);
        anchor.click();
    }

    // Drag and Drop логика
    const dropZone = document.getElementById('drop-zone');
    window.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.display = 'flex'; });
    dropZone.addEventListener('dragleave', () => { dropZone.style.display = 'none'; });
    dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.style.display = 'none';
        const file = e.dataTransfer.files[0];
        if (file) readFile(file);
    });

    // Инициализация при загрузке
    window.onload = runHighlight;
</script>

</body>
</html>
