<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC Expert IDE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f7; --card: #ffffff; --accent: #007aff; --text: #1d1d1f;
            --border: #d2d2d7; --x-col: #ff2d55; --z-col: #007aff; --a-col: #5856d6;
        }

        body, html { margin: 0; padding: 0; height: 100%; background: var(--bg); font-family: 'Inter', sans-serif; overflow: hidden; }

        /* App Layout */
        .app-shell { display: flex; flex-direction: column; height: 100vh; }

        header { 
            padding: 12px 20px; background: #fff; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; z-index: 100;
        }

        .logo { font-weight: 900; font-size: 18px; letter-spacing: -0.5px; }
        .logo span { color: var(--accent); }

        /* DRO & Stats */
        .status-bar {
            display: flex; background: #1c1c1e; color: #fff; padding: 10px 20px; gap: 20px;
            font-family: 'Fira Code', monospace; font-size: 12px;
        }
        .status-item span { color: #8e8e93; font-weight: 800; margin-right: 5px; }

        /* Main Editor Area */
        .workspace { flex: 1; display: flex; overflow: hidden; background: #fff; position: relative; }
        
        #line-numbers {
            width: 45px; padding: 20px 5px; text-align: right; background: #fbfbfd;
            border-right: 1px solid var(--border); color: #aeaeb2; font-size: 13px; line-height: 1.6;
        }

        .editor-container { flex: 1; position: relative; overflow: hidden; }
        #code-input, #code-view {
            width: 100%; min-height: 100%; padding: 20px; box-sizing: border-box;
            font-family: 'Fira Code', monospace; font-size: 15px; line-height: 1.6;
            white-space: pre; position: absolute; top: 0; left: 0; border: none; outline: none;
        }
        #code-input { color: transparent; background: transparent; z-index: 2; caret-color: #000; }
        #code-view { z-index: 1; pointer-events: none; color: var(--text); }

        /* Highlighting */
        .c-g { color: #d70015; font-weight: 700; }
        .c-x { color: var(--x-col); font-weight: 700; }
        .c-z { color: var(--z-col); font-weight: 700; }
        .c-a { color: var(--a-col); font-weight: 700; }
        .c-t { color: #af52de; font-weight: 700; background: #f2f2f7; border-radius: 4px; padding: 0 2px; }
        .c-comm { color: #8e8e93; font-style: italic; border-bottom: 1px dashed #d2d2d7; }

        /* Floating Simulation Button */
        .sim-trigger {
            position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px;
            background: var(--accent); border-radius: 50%; display: flex; align-items: center;
            justify-content: center; box-shadow: 0 10px 25px rgba(0,122,255,0.4);
            z-index: 10; border: none; cursor: pointer; color: white;
        }

        /* Fullscreen Modal */
        .modal {
            position: fixed; inset: 0; background: #000; z-index: 1000;
            display: none; flex-direction: column;
        }
        .modal-header {
            padding: 15px 20px; background: #1c1c1e; border-bottom: 1px solid #333;
            display: flex; justify-content: space-between; align-items: center; color: white;
        }

        .modal-body { flex: 1; display: flex; flex-direction: column; position: relative; }
        #sim-canvas { width: 100%; height: 100%; }

        /* Tool Manager in Modal */
        .tool-manager {
            position: absolute; top: 20px; left: 20px; background: rgba(28,28,30,0.9);
            border-radius: 12px; padding: 15px; border: 1px solid #444; max-height: 70%;
            overflow-y: auto; width: 200px; backdrop-filter: blur(10px);
        }
        .tool-item {
            display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
            color: #fff; font-size: 12px; cursor: pointer;
        }
        .tool-item input { accent-color: var(--accent); }

        .btn {
            padding: 10px 20px; border-radius: 10px; border: none; font-weight: 700; cursor: pointer;
        }
        .btn-close { background: #ff3b30; color: white; }
    </style>
</head>
<body>

<div class="app-shell">
    <header>
        <div class="logo">CNC<span>PRO</span> IDE</div>
        <div style="display:flex; gap:10px;">
            <input type="file" id="fLoader" hidden onchange="loadFile(this)">
            <button class="btn" style="background:#e8e8ed;" onclick="document.getElementById('fLoader').click()">ОТКРЫТЬ</button>
            <button class="btn" style="background:var(--accent); color:white;" onclick="saveNC()">СОХРАНИТЬ</button>
        </div>
    </header>

    <div class="status-bar">
        <div class="status-item"><span>X:</span><b id="dro-x">0.000</b></div>
        <div class="status-item"><span>Z:</span><b id="dro-z">0.000</b></div>
        <div class="status-item"><span>A:</span><b id="dro-a">0.000</b></div>
        <div class="status-item"><span>TOOL:</span><b id="dro-t">T0000</b></div>
    </div>

    <div class="workspace">
        <div id="line-numbers">1</div>
        <div class="editor-container" onscroll="syncScroll(this)">
            <div id="code-view"></div>
            <textarea id="code-input" spellcheck="false" oninput="onInput()" onkeyup="trackPosition()" onclick="trackPosition()"></textarea>
        </div>
        <button class="sim-trigger" onclick="openSim()">📈</button>
    </div>
</div>

<div id="sim-modal" class="modal">
    <div class="modal-header">
        <div style="font-weight:900;">СИМУЛЯЦИЯ КОНТУРА (XZ)</div>
        <button class="btn btn-close" onclick="closeSim()">ЗАКРЫТЬ</button>
    </div>
    <div class="modal-body">
        <canvas id="sim-canvas"></canvas>
        <div class="tool-manager" id="tool-list">
            </div>
    </div>
</div>

<script>
    const input = document.getElementById('code-input');
    const view = document.getElementById('code-view');
    const lnum = document.getElementById('line-numbers');
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');

    let toolsData = []; // Хранит траектории по инструментам
    let visibleTools = {}; // Какие инструменты включены в симе

    // 1. Инициализация (Загрузка из localStorage)
    window.onload = () => {
        const saved = localStorage.getItem('cnc_code');
        if (saved) {
            input.value = saved;
            onInput();
        } else {
            input.value = "(START PROGRAM)\nN1 T0101 (AUSSEN)\nG0 X50 Z2\nG1 Z-20 F0.2\nG1 X60\nG0 X100 Z100\n\nN2 T0202 (BOHRER)\nG0 X0 Z2\nG1 Z-15 F0.1\nG0 Z100";
            onInput();
        }
    };

    function onInput() {
        const val = input.value;
        localStorage.setItem('cnc_code', val); // Сохраняем при каждом вводе
        
        const lines = val.split('\n');
        lnum.innerHTML = lines.map((_, i) => i + 1).join('<br>');

        view.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c-comm">($1)</span>')
            .replace(/(G\d+)/gi, '<span class="c-g">$1</span>')
            .replace(/(T\d+)/gi, '<span class="c-t">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="c-x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="c-z">$1</span>')
            .replace(/(A-?\d*\.?\d+)/gi, '<span class="c-a">$1</span>');
            
        parseTools();
    }

    // 2. Парсинг инструментов и траекторий
    function parseTools() {
        const lines = input.value.split('\n');
        toolsData = [];
        let currentTool = "T0000";
        let currentToolName = "UNKNOWN";
        let cx = 0, cz = 0, ca = 0;

        lines.forEach(line => {
            const tMatch = line.match(/T(\d+)/i);
            const nMatch = line.match(/\((.*?)\)/);
            if (tMatch) {
                currentTool = "T" + tMatch[1];
                currentToolName = nMatch ? nMatch[1] : "TOOL " + tMatch[1];
            }

            const mx = line.match(/X(-?\d*\.?\d+)/i);
            const mz = line.match(/Z(-?\d*\.?\d+)/i);
            const ma = line.match(/A(-?\d*\.?\d+)/i);
            const isG0 = /G0/i.test(line);

            if (mx || mz || ma) {
                let nx = mx ? parseFloat(mx[1]) : cx;
                let nz = mz ? parseFloat(mz[1]) : cz;
                
                if (!toolsData[currentTool]) {
                    toolsData[currentTool] = { name: currentToolName, paths: [] };
                    if (!(currentTool in visibleTools)) visibleTools[currentTool] = true;
                }

                toolsData[currentTool].paths.push({ x1: cx, z1: cz, x2: nx, z2: nz, fast: isG0 });
                cx = nx; cz = nz;
            }
        });
    }

    // 3. Симулятор
    function openSim() {
        document.getElementById('sim-modal').style.display = 'flex';
        renderToolList();
        drawSim();
    }

    function closeSim() {
        document.getElementById('sim-modal').style.display = 'none';
    }

    function renderToolList() {
        const container = document.getElementById('tool-list');
        container.innerHTML = '<div style="color:var(--accent); font-weight:900; margin-bottom:10px; font-size:10px;">СЛОИ ИНСТРУМЕНТОВ</div>';
        
        for (let tId in toolsData) {
            const div = document.createElement('div');
            div.className = 'tool-item';
            div.innerHTML = `
                <input type="checkbox" ${visibleTools[tId] ? 'checked' : ''} onchange="toggleTool('${tId}')">
                <span>${tId} - ${toolsData[tId].name}</span>
            `;
            container.appendChild(div);
        }
    }

    function toggleTool(id) {
        visibleTools[id] = !visibleTools[id];
        drawSim();
    }

    function drawSim() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        let scale = 4;
        let ox = canvas.width * 0.8, oy = canvas.height / 2;

        ctx.strokeStyle = '#333';
        ctx.beginPath(); ctx.moveTo(0, oy); ctx.lineTo(canvas.width, oy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox, canvas.height); ctx.stroke();

        ctx.save();
        ctx.translate(ox, oy);

        for (let tId in toolsData) {
            if (!visibleTools[tId]) continue;

            toolsData[tId].paths.forEach(p => {
                ctx.beginPath();
                ctx.lineWidth = p.fast ? 1 : 2;
                ctx.strokeStyle = p.fast ? '#ff3b30' : '#007aff';
                ctx.moveTo(p.z1 * scale, -p.x1 * scale / 2);
                ctx.lineTo(p.z2 * scale, -p.x2 * scale / 2);
                ctx.stroke();
            });
        }
        ctx.restore();
    }

    // 4. Вспомогательные функции
    function trackPosition() {
        const lines = input.value.substring(0, input.selectionStart).split('\n');
        const curLineText = input.value.split('\n')[lines.length - 1];
        
        const mx = curLineText.match(/X(-?\d*\.?\d+)/i);
        const mz = curLineText.match(/Z(-?\d*\.?\d+)/i);
        const ma = curLineText.match(/A(-?\d*\.?\d+)/i);
        
        if(mx) document.getElementById('dro-x').innerText = parseFloat(mx[1]).toFixed(3);
        if(mz) document.getElementById('dro-z').innerText = parseFloat(mz[1]).toFixed(3);
        if(ma) document.getElementById('dro-a').innerText = parseFloat(ma[1]).toFixed(3);

        // Ищем T назад
        for(let i = lines.length-1; i >= 0; i--){
            const t = input.value.split('\n')[i].match(/T(\d+)/i);
            if(t) { document.getElementById('dro-t').innerText = "T"+t[1]; break; }
        }
    }

    function syncScroll(el) {
        view.scrollTop = el.scrollTop;
        lnum.scrollTop = el.scrollTop;
    }

    function saveNC() {
        const b = new Blob([input.value], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download='PROJECT_FIXED.NC'; a.click();
    }

    function loadFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => { 
            input.value = e.target.result; 
            onInput(); 
        };
        reader.readAsText(file);
    }
</script>

</body>
</html>
