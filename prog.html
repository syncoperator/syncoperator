<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ShopTurn Siemens v20</title>
    <style>
        :root { 
            --siemens-blue: #003a5a; 
            --siemens-light: #005f87;
            --siemens-orange: #eb7800;
            --panel-bg: #e6e6e6;
            --screen-bg: #000000;
        }

        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--panel-bg); font-family: 'Segoe UI', sans-serif; }

        /* Интерфейс Siemens */
        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* Верхняя статусная строка */
        .status-bar { 
            height: 35px; background: var(--siemens-blue); color: #fff; 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 0 15px; font-size: 13px; font-weight: bold;
        }

        /* Основной экран симуляции */
        #display-section { 
            flex: 2; background: var(--screen-bg); position: relative; 
            border: 4px solid #333; margin: 5px; box-shadow: inset 0 0 20px rgba(0,255,0,0.1);
        }
        canvas { width: 100%; height: 100%; touch-action: none; }

        /* DRO Панель (Координаты) */
        .dro-panel {
            position: absolute; top: 10px; right: 10px; 
            background: rgba(40, 40, 40, 0.9); border: 1px solid var(--siemens-light);
            padding: 10px; border-radius: 4px; color: #00ff00; font-family: monospace;
            min-width: 120px; z-index: 50;
        }
        .dro-row { display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 2px; }

        /* Редактор программ (Нижняя часть) */
        .editor-section { 
            flex: 1.5; background: #fff; display: flex; flex-direction: column; 
            border-top: 2px solid var(--siemens-blue);
        }

        .tool-header {
            background: var(--siemens-light); color: #fff; height: 30px;
            display: flex; align-items: center; padding: 0 15px; font-size: 12px;
        }

        .code-wrap { flex: 1; display: flex; overflow: hidden; }
        #line-nums { width: 35px; background: #f0f0f0; border-right: 1px solid #ccc; text-align: right; padding: 10px 5px; color: #999; font-size: 12px; }
        .input-wrap { flex: 1; position: relative; overflow-y: auto; }
        
        #editor, #highlighter {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 10px; font-family: 'Consolas', monospace; font-size: 15px;
            line-height: 1.5; white-space: pre; border: none; outline: none; margin: 0;
        }
        #editor { color: transparent; background: transparent; z-index: 2; caret-color: black; }
        #highlighter { z-index: 1; color: #333; }

        /* Кнопки Softkeys (Боковые) */
        .softkeys { 
            height: 60px; background: #333; display: flex; gap: 2px; padding: 2px;
        }
        .softkey { 
            flex: 1; background: #555; color: #fff; border: none; 
            font-size: 10px; font-weight: bold; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; text-align: center;
        }
        .softkey:active { background: var(--siemens-orange); }

        /* Подсветка G-кода */
        .g-work { color: var(--siemens-orange); font-weight: bold; }
        .g-fast { color: #888; }
        .axis-x { color: #d32f2f; }
        .axis-z { color: #1976d2; }
        .tool-call { color: #7b1fa2; font-weight: bold; background: #f3e5f5; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="status-bar">
        <span>RUNNING: MPF0_PIECE1</span>
        <span id="cycle-time">T: 00:01:24</span>
    </div>

    <div id="display-section">
        <div class="dro-panel">
            <div class="dro-row"><span>X</span><span id="dro-x">0.000</span></div>
            <div class="dro-row"><span>Z</span><span id="dro-z">0.000</span></div>
            <div style="color:#aaa; font-size:10px; margin-top:5px;">ACTIVE: <span id="dro-t">T1</span></div>
        </div>
        <canvas id="screen"></canvas>
    </div>

    <div class="editor-section">
        <div class="tool-header">PROGRAM MANAGER | NC/WKS/MY_PARTS</div>
        <div class="code-wrap">
            <div id="line-nums">1</div>
            <div class="input-wrap" id="scroll-sync" onscroll="sync()">
                <div id="highlighter"></div>
                <textarea id="editor" spellcheck="false" oninput="runAll()"></textarea>
            </div>
        </div>
    </div>

    <div class="softkeys">
        <button class="softkey" onclick="zoom(1.2)">Zoom +</button>
        <button class="softkey" onclick="zoom(0.8)">Zoom -</button>
        <button class="softkey" onclick="resetView()">Центр</button>
        <button class="softkey" onclick="document.getElementById('editor').value=''; runAll()">Очистить</button>
        <button class="softkey" style="background:var(--siemens-orange)" onclick="saveFile()">Save .MPF</button>
    </div>
</div>

<script>
    const editor = document.getElementById('editor');
    const high = document.getElementById('highlighter');
    const lines = document.getElementById('line-nums');
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');

    let scale = 4;
    let offsetX = 0, offsetZ = 0;
    const toolColors = ['#eb7800', '#00ff00', '#007aff', '#ff2d55', '#af52de'];

    window.onload = () => {
        editor.value = "G54\nT1 D1 (ROUGHING)\nG0 X65 Z2\nG1 Z0 F.2\nG1 X40 Z-20\nG1 Z-45\nG1 X60\nG0 X100 Z5\n\nT2 D1 (FINISHING)\nG0 X42 Z-20\nG1 Z-45\nG1 X62\nG0 X100 Z100";
        initCanvas();
        runAll();
    };

    function runAll() {
        const val = editor.value;
        localStorage.setItem('shopturn_v20_code', val);
        
        // Подсветка синтаксиса
        high.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/(G0\s|G00)/gi, '<span class="g-fast">$1</span>')
            .replace(/(G1\s|G01|G2|G3)/gi, '<span class="g-work">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="axis-x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="axis-z">$1</span>')
            .replace(/(T\d+)/gi, '<span class="tool-call">$1</span>');

        // Номера строк
        const arr = val.split('\n');
        lines.innerHTML = arr.map((_, i) => i + 1).join('<br>');
        editor.style.height = high.style.height = Math.max(200, arr.length * 23) + 'px';

        drawSimulation(arr);
    }

    function initCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        offsetX = canvas.height * 0.7; // Ось X (центр)
        offsetZ = canvas.width * 0.8;  // Ноль детали Z
    }

    function drawSimulation(program) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // Сетка Siemens
        ctx.strokeStyle = '#1a1a1a';
        ctx.lineWidth = 1;
        for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
        for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

        // Осевые линии
        ctx.strokeStyle = '#333';
        ctx.setLineDash([5, 5]);
        ctx.beginPath(); ctx.moveTo(0, offsetX); ctx.lineTo(canvas.width, offsetX); ctx.stroke(); // Z
        ctx.beginPath(); ctx.moveTo(offsetZ, 0); ctx.lineTo(offsetZ, canvas.height); ctx.stroke(); // X
        ctx.setLineDash([]);

        let curX = 0, curZ = 0, tIdx = 0;

        program.forEach(line => {
            const tm = line.match(/T(\d+)/i);
            if(tm) tIdx = parseInt(tm[1]) % toolColors.length;

            const mx = line.match(/X(-?\d*\.?\d+)/i);
            const mz = line.match(/Z(-?\d*\.?\d+)/i);
            const isG0 = /G0/i.test(line);

            if(mx || mz) {
                let nX = mx ? parseFloat(mx[1]) : curX;
                let nZ = mz ? parseFloat(mz[1]) : curZ;

                ctx.beginPath();
                ctx.lineWidth = isG0 ? 1 : 3;
                ctx.strokeStyle = isG0 ? '#555' : toolColors[tIdx];
                if(isG0) ctx.setLineDash([4, 4]); else ctx.setLineDash([]);

                // Масштабирование: ShopTurn вид (Z горизонтально, X вертикально)
                let z1 = offsetZ + (curZ * scale);
                let x1 = offsetX - (curX / 2 * scale);
                let z2 = offsetZ + (nZ * scale);
                let x2 = offsetX - (nX / 2 * scale);

                ctx.moveTo(z1, x1);
                ctx.lineTo(z2, x2);
                ctx.stroke();

                curX = nX; curZ = nZ;
            }
        });

        document.getElementById('dro-x').innerText = curX.toFixed(3);
        document.getElementById('dro-z').innerText = curZ.toFixed(3);
        document.getElementById('dro-t').innerText = 'T' + tIdx;
    }

    function sync() {
        const s = document.getElementById('scroll-sync');
        high.scrollTop = lines.scrollTop = s.scrollTop;
    }

    function zoom(f) { scale *= f; runAll(); }
    function resetView() { scale = 4; initCanvas(); runAll(); }

    function saveFile() {
        const blob = new Blob([editor.value], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'PART_1.MPF';
        a.click();
    }

    window.onresize = () => { initCanvas(); runAll(); };
</script>
</body>
</html>
