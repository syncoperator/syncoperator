<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CNC Obsidian IDE v29</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --surface: #161618;
            --accent: #007aff;
            --border: #2c2c2e;
            --text-p: #ffffff;
            --text-s: #8e8e93;
            /* Syntax */
            --syn-g: #bf5af2;
            --syn-t: #30d158;
            --syn-x: #ff453a;
            --syn-z: #0a84ff;
            --syn-c: #636366;
        }

        * { box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        body, html { 
            margin: 0; padding: 0; height: 100%; 
            background: var(--bg); font-family: -apple-system, system-ui, sans-serif; 
            color: var(--text-p); overflow: hidden; 
        }

        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* HEADER */
        header {
            height: 60px; background: var(--bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 100;
        }
        .file-info { flex: 1; font-size: 14px; font-weight: 600; color: var(--text-s); }

        /* MAIN STAGE */
        main { flex: 1; position: relative; overflow: hidden; display: flex; }

        /* VIEW 1: TOOL HUB */
        #tool-hub {
            flex: 1; overflow-y: auto; padding: 20px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px; align-content: start; transition: 0.4s;
        }
        .tool-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; cursor: pointer; transition: 0.3s;
        }
        .tool-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .t-badge { font-size: 10px; font-weight: 900; color: var(--accent); text-transform: uppercase; margin-bottom: 6px; }
        .t-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
        .t-preview { font-family: monospace; font-size: 12px; color: var(--text-s); }

        /* VIEW 2: CODE EDITOR */
        #editor-stage {
            position: absolute; inset: 0; background: var(--bg);
            display: none; flex-direction: column; z-index: 50;
        }
        .editor-header {
            padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        .editor-body { flex: 1; display: flex; position: relative; overflow: hidden; }
        .ln-col { width: 50px; background: #000; color: #3a3a3c; text-align: right; padding: 20px 10px; font-family: monospace; font-size: 13px; }
        .scroller { flex: 1; position: relative; overflow: auto; }
        #code, #syntax {
            position: absolute; inset: 0; padding: 20px; font-family: "SF Mono", Menlo, monospace;
            font-size: 16px; line-height: 1.6; white-space: pre; border: none; outline: none; margin: 0;
        }
        #code { color: transparent; background: transparent; z-index: 2; caret-color: var(--accent); resize: none; }
        #syntax { z-index: 1; color: #fff; pointer-events: none; }

        /* FOOTER */
        footer {
            height: 80px; background: var(--bg); border-top: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px 20px 20px; gap: 12px;
        }
        .btn {
            height: 48px; border-radius: 14px; border: 1px solid var(--border);
            background: var(--surface); color: var(--text-p); font-size: 13px; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; flex: 1;
            transition: 0.2s;
        }
        .btn.primary { background: var(--accent); border: none; }
        .btn:active { transform: scale(0.96); opacity: 0.8; }

        /* SYNTAX HIGHLIGHTING */
        .g { color: var(--syn-g); font-weight: bold; }
        .t { color: var(--syn-t); font-weight: bold; text-decoration: underline; }
        .x { color: var(--syn-x); }
        .z { color: var(--syn-z); }
        .c { color: var(--syn-c); font-style: italic; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div class="file-info" id="file-name">NEW_PROGRAM.MPF</div>
        <button class="btn" style="flex:0; width:50px; height:36px;" onclick="document.getElementById('fileIn').click()">📂</button>
        <input type="file" id="fileIn" hidden onchange="importFile(this)">
    </header>

    <main>
        <div id="tool-hub"></div>

        <div id="editor-stage">
            <div class="editor-header">
                <span id="active-t" style="color: var(--accent); font-weight: bold;">EDITOR</span>
                <button class="btn" style="flex:0; height:32px; padding:0 15px;" onclick="closeEditor()">ЗАКРЫТЬ</button>
            </div>
            <div class="editor-body">
                <div class="ln-col" id="ln">1</div>
                <div class="scroller" id="scroll" onscroll="sync()">
                    <div id="syntax"></div>
                    <textarea id="code" spellcheck="false" oninput="refresh()"></textarea>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <button class="btn" onclick="saveBundle()">СОХРАНИТЬ JSON</button>
        <button class="btn primary" onclick="saveMPF()">ЭКСПОРТ .MPF</button>
    </footer>
</div>

<script>
    const codeArea = document.getElementById('code');
    const syntaxLayer = document.getElementById('syntax');
    const lnCol = document.getElementById('ln');
    const toolHub = document.getElementById('tool-hub');
    const editorStage = document.getElementById('editor-stage');

    window.onload = () => {
        const saved = localStorage.getItem('cnc_v29_code');
        codeArea.value = saved || "O1000 (DEMO PROJECT)\nG54 G90\n\nN10 T1 D1\n(ROUGHING OUTER CONTOUR)\nG0 X120. Z2.\nG1 Z-45. F0.25\nG0 X200. Z200.\n\nN20 T3 D1\n(FINISHING FACE)\nG0 X120. Z-10.\nG1 X110. F0.15\nG0 X200. Z100.";
        refresh();
    };

    function refresh() {
        const val = codeArea.value;
        localStorage.setItem('cnc_v29_code', val);

        // 1. Подсветка
        let html = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c">($1)</span>')
            .replace(/(T\d+)/gi, '<span class="t">$1</span>')
            .replace(/(G\d+)/gi, '<span class="g">$1</span>')
            .replace(/(X-?\d*\.?\d*)/gi, '<span class="x">$1</span>')
            .replace(/(Z-?\d*\.?\d*)/gi, '<span class="z">$1</span>');
        syntaxLayer.innerHTML = html;

        // 2. Строки
        const lines = val.split('\n');
        lnCol.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        codeArea.style.height = syntaxLayer.style.height = Math.max(window.innerHeight, lines.length * 25.6 + 200) + 'px';

        // 3. Генерация хаба инструментов
        generateHub(lines);
    }

    function generateHub(lines) {
        toolHub.innerHTML = "";
        lines.forEach((line, i) => {
            const tMatch = line.match(/T(\d+)/i);
            if(tMatch) {
                let name = "ОПЕРАЦИЯ БЕЗ НАЗВАНИЯ";
                // Ищем комментарий в этой или следующей строке
                [lines[i], lines[i+1] || ""].forEach(s => {
                    const m = s.match(/\((.*?)\)/);
                    if(m) name = m[1];
                });

                const card = document.createElement('div');
                card.className = 'tool-card';
                card.innerHTML = `
                    <div class="t-badge">Инструмент ${tMatch[1]}</div>
                    <div class="t-title">${name}</div>
                    <div class="t-preview">${line.substring(0, 30)}...</div>
                `;
                card.onclick = () => openEditorAt(i, line.length);
                toolHub.appendChild(card);
            }
        });
    }

    function openEditorAt(lineIdx, len) {
        editorStage.style.display = 'flex';
        const lines = codeArea.value.split('\n');
        const pos = lines.slice(0, lineIdx).join('\n').length + (lineIdx > 0 ? 1 : 0);
        
        codeArea.focus();
        codeArea.setSelectionRange(pos, pos + lines[lineIdx].length);
        document.getElementById('scroll').scrollTop = lineIdx * 25.6 - 100;
    }

    function closeEditor() {
        editorStage.style.display = 'none';
    }

    function sync() {
        syntaxLayer.scrollTop = lnCol.scrollTop = document.getElementById('scroll').scrollTop;
    }

    function importFile(input) {
        const f = input.files[0];
        if(!f) return;
        document.getElementById('file-name').innerText = f.name.toUpperCase();
        const r = new FileReader();
        r.onload = e => { codeArea.value = e.target.result; refresh(); };
        r.readAsText(f);
    }

    function saveMPF() {
        const b = new Blob([codeArea.value], {type:'text/plain'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'PROG.MPF'; a.click();
    }

    function saveBundle() {
        const data = { code: codeArea.value, date: new Date().toLocaleString() };
        const b = new Blob([JSON.stringify(data)], {type:'application/json'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'project_backup.json'; a.click();
    }
</script>
</body>
</html>
