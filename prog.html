<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC EXPERT v11</title>
    <style>
        :root {
            --bg: #f2f2f7; --accent: #007aff; --border: #c6c6c8;
            --x-col: #ff2d55; --z-col: #007aff; --t-col: #af52de;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background: var(--bg); font-family: -apple-system, system-ui, sans-serif; 
            overflow: hidden; position: fixed; /* Предотвращает системный резиновый скролл */
        }

        .app-wrapper { display: flex; flex-direction: column; height: 100vh; width: 100vw; }

        header { 
            height: 50px; background: #fff; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-shrink: 0;
        }

        /* ЕДИНЫЙ КОНТЕЙНЕР ДЛЯ СКРОЛЛА */
        .editor-viewport { 
            flex: 1; position: relative; overflow: auto; background: #fff; 
            display: flex; align-items: flex-start; -webkit-overflow-scrolling: touch;
        }

        #line-nums { 
            width: 40px; padding: 15px 5px; text-align: right; color: #8e8e93; 
            font-family: 'Courier New', monospace; font-size: 13px; background: #f9f9f9; 
            border-right: 1px solid var(--border); sticky; left: 0; z-index: 10; line-height: 1.5;
        }

        .code-container { position: relative; flex: 1; min-width: 1000px; /* Чтобы не сжимался код */ }

        #code-input, #code-render {
            width: 100%; min-height: 100%; padding: 15px; box-sizing: border-box;
            font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; line-height: 1.5;
            white-space: pre; position: absolute; top: 0; left: 0; border: none; outline: none; margin: 0;
            overflow: hidden; /* Скролл идет через родителя */
        }
        #code-input { color: transparent; background: transparent; z-index: 2; caret-color: #000; }
        #code-render { z-index: 1; pointer-events: none; color: #333; }

        /* Подсветка */
        .c-g { color: #d70015; font-weight: bold; }
        .c-x { color: var(--x-col); font-weight: bold; }
        .c-z { color: var(--z-col); font-weight: bold; }
        .c-t { color: var(--t-col); font-weight: 800; background: rgba(175, 82, 222, 0.1); border-radius: 3px; }
        .c-com { color: #8e8e93; font-style: italic; }

        /* МОДАЛКА */
        #sim-overlay {
            position: fixed; inset: 0; background: #000; z-index: 99999; 
            display: none; flex-direction: column;
        }
        .sim-nav { height: 50px; background: #1c1c1e; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: #fff; }
        .sim-main { flex: 1; display: flex; position: relative; overflow: hidden; }
        
        #sim-canvas { flex: 1; background: #000; touch-action: none; width: 100%; height: 100%; }
        .sim-side { width: 160px; background: rgba(30,30,30,0.9); border-right: 1px solid #444; padding: 10px; overflow-y: auto; color: #fff; font-size: 10px; }

        .t-btn { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding: 10px; background: #333; border-radius: 6px; }
        .t-btn input { width: 18px; height: 18px; }

        .fab { 
            position: absolute; bottom: 30px; right: 30px; width: 60px; height: 60px; 
            background: var(--accent); border-radius: 50%; color: #fff; border: none; 
            font-size: 24px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); z-index: 50;
        }
        .btn { padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); font-size: 12px; font-weight: 600; }
    </style>
</head>
<body>

<div class="app-wrapper">
    <header>
        <div style="font-weight:900;">CNC PRO <small>v11</small></div>
        <div style="display:flex; gap:10px;">
            <button class="btn" onclick="document.getElementById('fileIn').click()">OPEN</button>
            <input type="file" id="fileIn" hidden onchange="handleFile(this)">
            <button class="btn" style="background:var(--accent); color:#fff; border:none;" onclick="saveFile()">SAVE</button>
        </div>
    </header>

    <div class="editor-viewport" id="master-scroll">
        <div id="line-nums">1</div>
        <div class="code-container">
            <div id="code-render"></div>
            <textarea id="code-input" spellcheck="false" oninput="onInput()"></textarea>
        </div>
    </div>
    
    <button class="fab" onclick="openModal()">📈</button>
</div>

<div id="sim-overlay">
    <div class="sim-nav">
        <span>СЛОИ ТРАЕКТОРИЙ</span>
        <button class="btn" style="background:#ff3b30; color:#fff; border:none;" onclick="closeModal()">ЗАКРЫТЬ</button>
    </div>
    <div class="sim-main">
        <div class="sim-side" id="t-list"></div>
        <canvas id="sim-canvas"></canvas>
    </div>
</div>

<script>
    const input = document.getElementById('code-input');
    const render = document.getElementById('code-render');
    const lines = document.getElementById('line-nums');
    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');

    let tools = {}; 
    let toolsActive = {};

    window.onload = () => {
        const saved = localStorage.getItem('cnc_v11_code');
        if (saved) input.value = saved;
        else input.value = "O1407 (PK231850RO)\nN1 T0101 (KOPIERST)\nG0 X50. Z2.\nG1 Z-25. F.2\nG0 X100.\n\nN2 T0606 (BOHRER)\nG0 X12. Z2.\nG1 Z-50. F5.";
        onInput();
    };

    function onInput() {
        const val = input.value;
        localStorage.setItem('cnc_v11_code', val);

        // 1. Подсветка
        render.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="c-com">($1)</span>')
            .replace(/(G\d+)/gi, '<span class="c-g">$1</span>')
            .replace(/(T\d+)/gi, '<span class="c-t">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="c-x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="c-z">$1</span>');

        // 2. Линейка и высота контейнера
        const lineCount = val.split('\n').length;
        lines.innerHTML = Array.from({length: lineCount}, (_, i) => i + 1).join('<br>');
        
        // Авто-подстройка высоты для скролла
        const newHeight = Math.max(window.innerHeight, lineCount * 21 + 100);
        input.style.height = render.style.height = newHeight + "px";

        parseTools();
    }

    function parseTools() {
        const codeLines = input.value.split('\n');
        tools = {};
        let curT = "T0000";
        let cx = 0, cz = 0;

        codeLines.forEach(line => {
            const tMatch = line.match(/T(\d+)/i);
            const nMatch = line.match(/\((.*?)\)/);
            
            if(tMatch) {
                curT = "T" + tMatch[1];
                if(!tools[curT]) {
                    // Берём название из текущей строки или следующей
                    tools[curT] = { name: nMatch ? nMatch[1] : curT, paths: [] };
                    if(!(curT in toolsActive)) toolsActive[curT] = true;
                }
            }

            const mx = line.match(/X(-?\d*\.?\d+)/i);
            const mz = line.match(/Z(-?\d*\.?\d+)/i);
            const isG0 = /G0/i.test(line);

            if(mx || mz) {
                let nx = mx ? parseFloat(mx[1]) : cx;
                let nz = mz ? parseFloat(mz[1]) : cz;
                if(!tools[curT]) tools[curT] = { name: "START", paths: [] };
                tools[curT].paths.push({x1: cx, z1: cz, x2: nx, z2: nz, g0: isG0});
                cx = nx; cz = nz;
            }
        });
    }

    function openModal() {
        document.getElementById('sim-overlay').style.display = 'flex';
        updateSidebar();
        setTimeout(draw, 100);
    }

    function closeModal() { document.getElementById('sim-overlay').style.display = 'none'; }

    function updateSidebar() {
        const side = document.getElementById('t-list');
        side.innerHTML = '<b style="color:var(--accent)">ИНСТРУМЕНТЫ</b><br><br>';
        for(let t in tools) {
            const row = document.createElement('div');
            row.className = 't-btn';
            row.innerHTML = `<input type="checkbox" ${toolsActive[t]?'checked':''} onchange="toggleT('${t}')"> <span style="font-size:9px">${t}<br>${tools[t].name}</span>`;
            side.appendChild(row);
        }
    }

    function toggleT(t) { toolsActive[t] = !toolsActive[t]; draw(); }

    function draw() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
        ctx.clearRect(0,0,canvas.width,canvas.height);

        let scale = 3, ox = canvas.width * 0.8, oy = canvas.height / 2;
        ctx.save();
        ctx.translate(ox, oy);

        // Сетка
        ctx.strokeStyle = '#222';
        ctx.beginPath(); ctx.moveTo(-canvas.width,0); ctx.lineTo(100,0); ctx.stroke();

        for(let t in tools) {
            if(!toolsActive[t]) continue;
            tools[t].paths.forEach(p => {
                ctx.beginPath();
                ctx.lineWidth = p.g0 ? 1 : 2;
                ctx.strokeStyle = p.g0 ? '#ff3b30' : '#007aff';
                ctx.moveTo(p.z1 * scale, -p.x1 * scale / 2);
                ctx.lineTo(p.z2 * scale, -p.x2 * scale / 2);
                ctx.stroke();
            });
        }
        ctx.restore();
    }

    function handleFile(input) {
        const file = input.files[0];
        const reader = new FileReader();
        reader.onload = (e) => { 
            document.getElementById('code-input').value = e.target.result; 
            onInput(); 
            document.getElementById('master-scroll').scrollTop = 0;
        };
        reader.readAsText(file);
    }

    function saveFile() {
        const blob = new Blob([input.value], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download='PROGRAM.O'; a.click();
    }
</script>
</body>
</html>
