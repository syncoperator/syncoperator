<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC ULTIMATE v13</title>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --bg: #f2f2f7; --accent: #007aff; --text: #1c1c1e; --border: #c6c6c8; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: var(--bg); font-family: -apple-system, system-ui, sans-serif; overflow: hidden; }

        .app-container { display: flex; flex-direction: column; height: 100vh; }

        /* Шапка */
        header { 
            height: 55px; background: #fff; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px; flex-shrink: 0;
            z-index: 10;
        }

        /* Редактор: Исправленная логика скролла */
        .editor-view { 
            flex: 1; position: relative; overflow: hidden; background: #fff;
            display: flex; flex-direction: row;
        }
        
        #line-numbers { 
            width: 45px; background: #f9f9f9; border-right: 1px solid var(--border);
            padding: 15px 5px; text-align: right; color: #aeaeb2; font-family: monospace; font-size: 13px;
            line-height: 1.5; user-select: none;
        }

        .scroll-area { 
            flex: 1; position: relative; overflow: auto; 
            -webkit-overflow-scrolling: touch; 
        }

        .code-layer {
            position: absolute; top: 0; left: 0; width: 100%; min-height: 100%;
            padding: 15px; font-family: 'SF Mono', 'Fira Code', monospace; 
            font-size: 14px; line-height: 1.5; white-space: pre; word-wrap: normal;
        }

        #input-area {
            color: transparent; background: transparent; z-index: 3;
            caret-color: #000; resize: none; border: none; outline: none;
            width: 200%; /* Запас для длинных строк */
        }

        #render-area { z-index: 2; color: #1d1d1f; pointer-events: none; }

        /* Подсветка G-кода */
        .g-cmd { color: #d70015; font-weight: bold; }
        .x-val { color: #ff2d55; font-weight: bold; }
        .z-val { color: #007aff; font-weight: bold; }
        .t-val { color: #af52de; font-weight: bold; background: rgba(175,82,222,0.1); padding: 0 2px; }
        .comment { color: #8e8e93; font-style: italic; }

        /* 3D Окно */
        #modal-3d { 
            position: fixed; inset: 0; background: #000; z-index: 1000; 
            display: none; flex-direction: column; 
        }
        .mod-nav { height: 50px; background: #1c1c1e; display: flex; justify-content: space-between; align-items: center; padding: 0 15px; color: #fff; }
        .mod-body { flex: 1; display: flex; overflow: hidden; }
        
        #canvas-3d { flex: 1; outline: none; }
        
        .sidebar { 
            width: 180px; background: rgba(30,30,30,0.9); padding: 15px; 
            overflow-y: auto; color: #fff; border-right: 1px solid #444;
        }
        .tool-item { 
            background: #2c2c2e; padding: 10px; border-radius: 8px; margin-bottom: 10px; 
            font-size: 11px; display: flex; align-items: flex-start; gap: 8px;
        }
        .tool-item input { margin-top: 2px; width: 18px; height: 18px; }

        /* Кнопки */
        .btn { 
            padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border); 
            background: #fff; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .btn-blue { background: var(--accent); color: #fff; border: none; }
        .fab { 
            position: absolute; bottom: 25px; right: 25px; width: 60px; height: 60px; 
            background: var(--accent); border-radius: 30px; color: #fff; font-size: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3); z-index: 5; border: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <div style="font-weight:900;">CNC <span style="color:var(--accent)">PRO</span></div>
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="document.getElementById('f-in').click()">ОТКРЫТЬ</button>
            <input type="file" id="f-in" hidden onchange="openNC(this)">
            <button class="btn btn-blue" onclick="saveNC()">СОХРАНИТЬ</button>
        </div>
    </header>

    <div class="editor-view">
        <div id="line-numbers">1</div>
        <div class="scroll-area" id="scroller" onscroll="syncScroll()">
            <div id="render-area" class="code-layer"></div>
            <textarea id="input-area" class="code-layer" spellcheck="false" oninput="handleInput()"></textarea>
        </div>
        <button class="fab" onclick="showModal()">🧊</button>
    </div>
</div>

<div id="modal-3d">
    <div class="mod-nav">
        <span style="font-weight:bold;">3D ВИЗУАЛИЗАЦИЯ</span>
        <button class="btn" style="background:#ff3b30; color:#fff; border:none;" onclick="hideModal()">ЗАКРЫТЬ</button>
    </div>
    <div class="mod-body">
        <div class="sidebar">
            <label style="display:flex; align-items:center; gap:8px; margin-bottom:15px; color:#ff2d55; font-weight:bold;">
                <input type="checkbox" id="noG0" onchange="render3D()" checked> СКРЫТЬ G0
            </label>
            <div id="tool-list"></div>
        </div>
        <div id="canvas-3d"></div>
    </div>
</div>

<script>
    const input = document.getElementById('input-area');
    const render = document.getElementById('render-area');
    const lines = document.getElementById('line-numbers');
    const scroller = document.getElementById('scroller');

    let trajectory = {}; 
    let activeLayers = {};
    let scene, camera, renderer, controls, group;

    window.onload = () => {
        const saved = localStorage.getItem('cnc_v13_code');
        if (saved) input.value = saved;
        else input.value = "O1407 (PK231850RO)\nN1 T0101 (KOPIERST)\nG0 X50. Z2.\nG1 Z-25. F.2\nG1 X60.\nG0 X100. Z100.\n\nN2 T0606 (BOHRER)\nG0 X0 Z2.\nG1 Z-40. F0.1\nG0 Z100.";
        handleInput();
        init3DEngine();
    };

    function handleInput() {
        const val = input.value;
        localStorage.setItem('cnc_v13_code', val);

        // 1. Подсветка
        render.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/\((.*?)\)/g, '<span class="comment">($1)</span>')
            .replace(/(G\d+)/gi, '<span class="g-cmd">$1</span>')
            .replace(/(T\d+)/gi, '<span class="t-val">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="x-val">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="z-val">$1</span>');

        // 2. Номера строк и высота
        const arr = val.split('\n');
        lines.innerHTML = arr.map((_, i) => i + 1).join('<br>');
        
        const contentH = Math.max(scroller.offsetHeight, arr.length * 21 + 100);
        input.style.height = render.style.height = contentH + 'px';

        parseNC(arr);
    }

    function parseNC(arr) {
        trajectory = {};
        let curT = "T0000";
        let cx = 0, cz = 0;

        arr.forEach(line => {
            const tm = line.match(/T(\d+)/i);
            const nm = line.match(/\((.*?)\)/);
            if(tm) {
                curT = "T" + tm[1];
                if(!trajectory[curT]) {
                    trajectory[curT] = { name: nm ? nm[1] : "ИНСТРУМЕНТ " + curT, paths: [] };
                    if(!(curT in activeLayers)) activeLayers[curT] = true;
                }
            }
            const mx = line.match(/X(-?\d*\.?\d+)/i);
            const mz = line.match(/Z(-?\d*\.?\d+)/i);
            const g0 = /G0/i.test(line);

            if(mx || mz) {
                let nx = mx ? parseFloat(mx[1]) : cx;
                let nz = mz ? parseFloat(mz[1]) : cz;
                if(!trajectory[curT]) trajectory[curT] = { name: "START", paths: [] };
                trajectory[curT].paths.push({x1:cx, z1:cz, x2:nx, z2:nz, fast: g0});
                cx = nx; cz = nz;
            }
        });
    }

    function syncScroll() {
        render.scrollTop = scroller.scrollTop;
        lines.scrollTop = scroller.scrollTop;
    }

    function init3DEngine() {
        const container = document.getElementById('canvas-3d');
        if(!window.THREE) return;

        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, container.offsetWidth / container.offsetHeight, 1, 2000);
        camera.position.set(150, 100, 150);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.offsetWidth, container.offsetHeight);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        group = new THREE.Group();
        scene.add(group);

        const grid = new THREE.GridHelper(200, 20, 0x444444, 0x222222);
        grid.rotation.x = Math.PI/2;
        scene.add(grid);
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));

        function anim() { requestAnimationFrame(anim); renderer.render(scene, camera); }
        anim();
    }

    function showModal() {
        document.getElementById('modal-3d').style.display = 'flex';
        updateSidebar();
        render3D();
        // Ресайз
        const c = document.getElementById('canvas-3d');
        camera.aspect = c.offsetWidth / c.offsetHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(c.offsetWidth, c.offsetHeight);
    }

    function hideModal() { document.getElementById('modal-3d').style.display = 'none'; }

    function updateSidebar() {
        const list = document.getElementById('tool-list');
        list.innerHTML = "";
        for(let t in trajectory) {
            const item = document.createElement('div');
            item.className = 'tool-item';
            item.innerHTML = `
                <input type="checkbox" ${activeLayers[t]?'checked':''} onchange="toggleLayer('${t}')">
                <span><b>${t}</b><br>${trajectory[t].name}</span>
            `;
            list.appendChild(item);
        }
    }

    function toggleLayer(t) { activeLayers[t] = !activeLayers[t]; render3D(); }

    function render3D() {
        if(!group) return;
        while(group.children.length > 0) group.remove(group.children[0]);
        
        const noG0 = document.getElementById('noG0').checked;

        for(let t in trajectory) {
            if(!activeLayers[t]) continue;
            trajectory[t].paths.forEach(p => {
                if(noG0 && p.fast) return;
                const mat = new THREE.LineBasicMaterial({ color: p.fast ? 0xff2d55 : 0x007aff });
                const geom = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(p.z1, p.x1/2, 0),
                    new THREE.Vector3(p.z2, p.x2/2, 0)
                ]);
                group.add(new THREE.Line(geom, mat));
            });
        }
    }

    function openNC(input) {
        const file = input.files[0];
        const r = new FileReader();
        r.onload = (e) => { input.value = e.target.result; handleInput(); scroller.scrollTop = 0; };
        r.readAsText(file);
    }

    function saveNC() {
        const b = new Blob([input.value], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download='PROJECT.O'; a.click();
    }
</script>
</body>
</html>
