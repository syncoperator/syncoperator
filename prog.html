<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CNC CAM SOLID v15</title>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        :root { --accent: #007aff; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a1a; font-family: sans-serif; }
        
        /* UI Layers */
        .ui-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 10; pointer-events: none; }
        header { pointer-events: auto; background: rgba(255,255,255,0.9); height: 50px; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #ccc; }
        
        .editor-zone { flex: 1; display: flex; overflow: hidden; pointer-events: auto; background: #fff; transition: 0.3s; }
        #ln-area { width: 40px; background: #f0f0f0; border-right: 1px solid #ccc; padding: 15px 5px; text-align: right; font-family: monospace; font-size: 12px; color: #888; }
        .edit-wrap { flex: 1; position: relative; overflow: auto; }
        #code-in, #code-out { position: absolute; top: 0; left: 0; width: 100%; min-height: 100%; padding: 15px; font-family: 'SF Mono', monospace; font-size: 14px; line-height: 1.5; white-space: pre; border: none; outline: none; }
        #code-in { color: transparent; background: transparent; z-index: 2; caret-color: #000; }
        #code-out { z-index: 1; pointer-events: none; }

        /* 3D View */
        #viewport-3d { position: fixed; inset: 0; z-index: 5; background: radial-gradient(circle, #333 0%, #000 100%); }
        
        .cam-panel { position: absolute; left: 10px; top: 60px; width: 180px; background: rgba(0,0,0,0.8); color: #fff; border-radius: 8px; padding: 12px; pointer-events: auto; z-index: 20; display: none; }
        
        .btn { pointer-events: auto; padding: 8px 12px; border-radius: 6px; border: 1px solid #ccc; background: #fff; font-weight: bold; cursor: pointer; }
        .fab { position: absolute; bottom: 30px; right: 30px; width: 65px; height: 65px; background: var(--accent); border-radius: 50%; color: #fff; font-size: 24px; z-index: 100; pointer-events: auto; border: none; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        
        /* Syntax */
        .g { color: #d70015; font-weight: bold; }
        .x { color: #ff2d55; }
        .z { color: #007aff; }
    </style>
</head>
<body>

<div id="viewport-3d"></div>

<div class="ui-overlay">
    <header>
        <b>CNC <span style="color:var(--accent)">SOLID CAM</span></b>
        <div style="display:flex; gap:8px;">
            <button class="btn" onclick="document.getElementById('file').click()">LOAD</button>
            <input type="file" id="file" hidden onchange="openFile(this)">
            <button class="btn" style="background:var(--accent); color:#fff;" onclick="saveFile()">SAVE</button>
        </div>
    </header>

    <div class="editor-zone" id="editor">
        <div id="ln-area">1</div>
        <div class="edit-wrap" id="scr" onscroll="sync()">
            <div id="code-out"></div>
            <textarea id="code-in" spellcheck="false" oninput="run()"></textarea>
        </div>
    </div>
</div>

<div class="cam-panel" id="ui-3d">
    <div style="font-size:11px; margin-bottom:10px; color:var(--accent)">CAD/CAM МОДЕЛЬ</div>
    <label style="display:block; margin-bottom:10px;">
        <input type="checkbox" id="showWire" onchange="toggleWire()"> СЕТКА (WIRE)
    </label>
    <button class="btn" style="width:100%; font-size:10px;" onclick="resetCamera()">СБРОС КАМЕРЫ</button>
</div>

<button class="fab" id="mode-btn" onclick="toggleMode()">🧊</button>

<script>
    const input = document.getElementById('code-in');
    const output = document.getElementById('code-out');
    const ln = document.getElementById('ln-area');
    
    let is3D = false;
    let scene, camera, renderer, controls, solidMesh, pathLines;

    window.onload = () => {
        input.value = localStorage.getItem('cnc_solid_v15') || "O1407\nN1 T0101\nG0 X40 Z2\nG1 Z-20 F.2\nG1 X50 Z-30\nG1 Z-50\nG1 X60\nG0 X100 Z100";
        run();
        init3D();
    };

    function run() {
        const val = input.value;
        localStorage.setItem('cnc_solid_v15', val);
        
        output.innerHTML = val.replace(/&/g, "&amp;").replace(/</g, "&lt;")
            .replace(/(G\d+)/gi, '<span class="g">$1</span>')
            .replace(/(X-?\d*\.?\d+)/gi, '<span class="x">$1</span>')
            .replace(/(Z-?\d*\.?\d+)/gi, '<span class="z">$1</span>');

        const lines = val.split('\n');
        ln.innerHTML = lines.map((_, i) => i + 1).join('<br>');
        input.style.height = output.style.height = Math.max(500, lines.length * 21 + 100) + 'px';
    }

    function init3D() {
        const container = document.getElementById('viewport-3d');
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(80, 50, 80);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        
        // Освещение как в CAD
        const sun = new THREE.DirectionalLight(0xffffff, 1);
        sun.position.set(10, 20, 10);
        scene.add(sun);
        scene.add(new THREE.AmbientLight(0x404040, 2));

        const grid = new THREE.GridHelper(200, 20, 0x555555, 0x222222);
        grid.rotation.x = Math.PI/2;
        scene.add(grid);

        function animate() { requestAnimationFrame(animate); renderer.render(scene, camera); }
        animate();
    }

    function toggleMode() {
        is3D = !is3D;
        document.getElementById('editor').style.opacity = is3D ? "0" : "1";
        document.getElementById('editor').style.pointerEvents = is3D ? "none" : "auto";
        document.getElementById('ui-3d').style.display = is3D ? "block" : "none";
        document.getElementById('mode-btn').innerText = is3D ? "📝" : "🧊";
        if(is3D) buildSolid();
    }

    function buildSolid() {
        if(solidMesh) scene.remove(solidMesh);
        if(pathLines) scene.remove(pathLines);

        const lines = input.value.split('\n');
        let points = [];
        let cx = 0, cz = 0;

        // Собираем точки контура
        lines.forEach(l => {
            const mx = l.match(/X(-?\d*\.?\d+)/i);
            const mz = l.match(/Z(-?\d*\.?\d+)/i);
            if(mx) cx = parseFloat(mx[1]);
            if(mz) cz = parseFloat(mz[1]);
            if(mx || mz) points.push(new THREE.Vector2(cx / 2, cz)); // Делим X на 2 (радиус)
        });

        if(points.length < 2) return;

        // Создаем тело вращения (Lathe)
        const geometry = new THREE.LatheGeometry(points, 32);
        const material = new THREE.MeshPhongMaterial({ 
            color: 0x999999, 
            specular: 0x222222, 
            shininess: 100, 
            side: THREE.DoubleSide,
            flatShading: false 
        });
        
        solidMesh = new THREE.Mesh(geometry, material);
        solidMesh.rotation.x = -Math.PI / 2; // Кладем на ось Z
        scene.add(solidMesh);
    }

    function toggleWire() {
        if(solidMesh) solidMesh.material.wireframe = document.getElementById('showWire').checked;
    }

    function resetCamera() {
        controls.reset();
        camera.position.set(80, 50, 80);
    }

    function sync() { 
        output.scrollTop = document.getElementById('scr').scrollTop; 
        ln.scrollTop = document.getElementById('scr').scrollTop; 
    }

    function openFile(inputEl) {
        const reader = new FileReader();
        reader.onload = (e) => { input.value = e.target.result; run(); };
        reader.readAsText(inputEl.files[0]);
    }

    function saveFile() {
        const b = new Blob([input.value], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b); a.download='CAD_MODEL.O'; a.click();
    }

    window.onresize = () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    };
</script>
</body>
</html>
