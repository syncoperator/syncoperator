<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ProCalc Elite | Precision</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #f0f2f5;
            --neu-upper: #ffffff;
            --neu-lower: #d1d9e6;
            --text-main: #1d1d1f;
            --accent: #007aff;
        }

        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main);
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Шапка с отражением */
        .hero { padding: 60px 20px 30px; text-align: center; }
        .main-title {
            font-size: 42px; font-weight: 900; margin: 0; letter-spacing: -2px;
            position: relative; z-index: 2;
        }
        .title-reflection {
            font-size: 42px; font-weight: 900; margin: 0; letter-spacing: -2px;
            position: absolute; top: 30px; left: 0; right: 0;
            transform: scaleY(-0.6); opacity: 0.1; filter: blur(1px); z-index: 1;
        }

        /* Контейнеры */
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        .neu-card {
            background: var(--bg);
            border-radius: 35px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 12px 12px 24px var(--neu-lower), -12px -12px 24px var(--neu-upper);
            border: 1px solid rgba(255,255,255,0.5);
        }

        /* Инпуты как углубления */
        .input-group { margin-bottom: 20px; }
        label { font-size: 10px; font-weight: 800; text-transform: uppercase; color: #86868b; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        
        input[type="number"] {
            width: 100%;
            padding: 18px;
            border: none;
            background: var(--bg);
            border-radius: 20px;
            box-shadow: inset 6px 6px 12px var(--neu-lower), inset -6px -6px 12px var(--neu-upper);
            font-size: 18px; font-weight: 800; color: var(--text-main); outline: none; box-sizing: border-box;
        }

        /* Главный результат */
        .result-big { text-align: center; padding: 40px 20px; }
        .res-label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: var(--accent); }
        .res-value { font-size: 80px; font-weight: 900; letter-spacing: -4px; margin: 10px 0; }
        .res-unit { font-size: 20px; color: #86868b; }

        /* Слайдер */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track {
            height: 12px; border-radius: 10px; box-shadow: inset 3px 3px 6px var(--neu-lower), inset -3px -3px 6px var(--neu-upper);
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 30px; width: 30px; border-radius: 50%;
            background: var(--bg); box-shadow: 4px 4px 8px var(--neu-lower), -4px -4px 8px var(--neu-upper);
            cursor: pointer; margin-top: -9px; border: 2px solid var(--accent);
        }

        /* Кнопки */
        .btn-row { display: flex; gap: 15px; margin-bottom: 20px; }
        .neu-btn {
            flex: 1; padding: 15px; border: none; border-radius: 18px; background: var(--bg);
            box-shadow: 6px 6px 12px var(--neu-lower), -6px -6px 12px var(--neu-upper);
            font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .neu-btn:active { box-shadow: inset 4px 4px 8px var(--neu-lower), inset -4px -4px 8px var(--neu-upper); }
        .neu-btn.primary { color: var(--accent); }

        .footer-status { text-align: center; padding: 40px; }
        .badge { padding: 10px 25px; border-radius: 50px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .safe { background: #34c759; color: white; box-shadow: 0 10px 20px rgba(52, 199, 89, 0.3); }
        .danger { background: #ff3b30; color: white; box-shadow: 0 10px 20px rgba(255, 59, 48, 0.3); }
        
        .bottom-spacer { height: 100px; }
    </style>
</head>
<body>

    <header class="hero">
        <div style="position: relative; display: inline-block;">
            <h1 class="main-title">ProCalc Elite</h1>
            <div class="title-reflection">ProCalc Elite</div>
        </div>
    </header>

    <main class="container">
        
        <div class="btn-row">
            <button class="neu-btn primary" onclick="resetToAuto()">AUTO MODE</button>
            <button class="neu-btn" onclick="toggleModal()"><i data-lucide="info" style="width:18px"></i></button>
        </div>

        <div class="neu-card">
            <div class="input-group">
                <label>Fertigteil (mm)</label>
                <input type="number" id="fertigteil" value="51" oninput="calculate(false)">
            </div>
            <div class="input-group">
                <label>Ausspannen (mm)</label>
                <input type="number" id="ausspann" value="55" oninput="calculate(false)">
            </div>
        </div>

        <div class="neu-card">
            <label>Teile pro Zuschnitt: <span id="label-teile" style="color: var(--accent)">2</span></label>
            <input type="range" id="teileProStange" min="1" max="25" value="2" oninput="calculate(true)">
            <p id="hint-text" style="font-size: 10px; color: #86868b; margin-top: 15px; font-style: italic;"></p>
        </div>

        <div class="neu-card result-big">
            <span class="res-label">Säge-Maß</span>
            <div class="res-value" id="res-saege">173</div>
            <span class="res-unit">Millimeter</span>
            
            <div style="display: flex; justify-content: space-around; margin-top: 30px; border-top: 1px solid var(--neu-lower); pt: 20px;">
                <div>
                    <label>Butzen</label>
                    <div style="font-weight: 800;" id="res-rest">115 mm</div>
                </div>
                <div>
                    <label>Gesamt (3m)</label>
                    <div style="font-weight: 800; color: var(--accent);" id="res-gesamt">34 Stk</div>
                </div>
            </div>
        </div>

        <div class="footer-status">
            <span id="badge-robot" class="badge">Robot Safe</span>
        </div>

    </main>

    <div class="bottom-spacer"></div>

    <div id="modal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(10px); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
        <div class="neu-card" style="width: 100%; max-width: 350px;">
            <h3 style="text-align: center; margin-bottom: 20px;">DETAILS</h3>
            <div style="font-size: 13px; space-y: 10px;">
                <p>Formel: <span id="step-rechnung" style="font-weight: 800;"></span></p>
                <p>Schnittverlust: <span id="step-verlust"></span></p>
            </div>
            <button class="neu-btn primary" style="width: 100%; margin-top: 20px;" onclick="toggleModal()">OK</button>
        </div>
    </div>

    <script>
        let autoMode = true;

        function toggleModal() { 
            const m = document.getElementById('modal');
            m.style.display = m.style.display === 'none' ? 'flex' : 'none';
        }
        
        function resetToAuto() {
            autoMode = true;
            calculate(false);
        }

        function calculate(manualChange) {
            if(manualChange) autoMode = false;

            const f = parseFloat(document.getElementById('fertigteil').value) || 0;
            const a = parseFloat(document.getElementById('ausspann').value) || 0;
            const teileInput = document.getElementById('teileProStange');
            
            const SCHNITT = 3, ZANGE = 50, TOL = 10, MAX_ROBOT = 1000, STANGE_3M = 3000;
            const durchlauf = f + SCHNITT;
            const butzen = ZANGE + a + TOL;

            if(autoMode) {
                const maxTeile = Math.floor((MAX_ROBOT - butzen) / durchlauf);
                teileInput.value = maxTeile;
                document.getElementById('hint-text').innerText = "Automatik: Maximum für <1000mm.";
            } else {
                document.getElementById('hint-text').innerText = "Manuell: Klicke AUTO für Optimierung.";
            }

            const teileProZuschnitt = parseInt(teileInput.value);
            document.getElementById('label-teile').innerText = teileProZuschnitt;

            let saegeMass = (teileProZuschnitt * durchlauf) + butzen;

            const badge = document.getElementById('badge-robot');
            if (saegeMass > MAX_ROBOT) {
                badge.innerText = "Too Long for Robot";
                badge.className = "badge danger";
            } else {
                badge.innerText = "Robot Safe";
                badge.className = "badge safe";
            }

            document.getElementById('res-saege').innerText = Math.round(saegeMass);
            document.getElementById('res-rest').innerText = butzen + " mm";
            document.getElementById('res-gesamt').innerText = Math.floor(STANGE_3M / saegeMass) * teileProZuschnitt + " Stk";

            document.getElementById('step-verlust').innerText = durchlauf + "mm";
            document.getElementById('step-rechnung').innerText = teileProZuschnitt + "x" + durchlauf + " + " + butzen;
            
            lucide.createIcons();
        }

        lucide.createIcons();
        calculate(false);
    </script>
</body>
</html>
