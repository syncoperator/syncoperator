<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Stangenberechnung - Light Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="tool-container" class="tool-list">
        <div class="tool-card" draggable="true" id="card-979">
            <div class="t-nr">T-03</div>
            <div class="beschreibung">Оптимальная длина: 979 мм</div>
            
            <div class="calc-box">
                <div class="formula">912mm + 50mm + 55mm + 12mm = 1033mm</div>
                <div class="result-line">1033mm - 54mm = <span>979mm</span></div>
            </div>

            <div class="data-management">
                <button onclick="exportData('card-979')">JSON Export</button>
                <button onclick="importData()">JSON Import</button>
            </div>
            
            <div class="ui-padding"></div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
