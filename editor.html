<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA JSON EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
        }

        /* UI Styles */
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 40px 20px 100px 20px; box-sizing: border-box; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2px solid var(--border); box-sizing: border-box; }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 14px; font-weight: 700; background: transparent; font-family: inherit; }
        .full-width { grid-column: span 2; }
        .tool-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .t-nr { font-size: 12px; font-weight: 900; color: var(--text-sub); }
        .desc { font-size: 18px; font-weight: 900; }
        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; border: none; cursor: pointer; margin-bottom: 10px; text-transform: uppercase; }
        .btn-pdf { background: #000; color: #FFF; }
        .btn-add { background: #fff; border: 2px dashed var(--border); }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #fff; width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; box-sizing: border-box; }

        /* PRINT SETTINGS - THE FIX IS HERE */
        #print-container { display: none; }
        @media print {
            @page { size: A4; margin: 0; }
            body { background: #fff; }
            .app-container, .modal-overlay { display: none !important; }
            #print-container { display: block !important; }
            .page-box { 
                width: 210mm; 
                height: 297mm; 
                padding: 10mm; 
                box-sizing: border-box; /* Важно! */
                background: #fff;
                page-break-after: always;
            }
            .inner-border { 
                border: 1.5px solid #000; 
                padding: 20px; 
                height: 100%; 
                display: flex; 
                flex-direction: column; 
                box-sizing: border-box; /* Важно! */
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>JSON <span>EDITOR</span></h1></header>
    <div id="meta-container" class="meta-grid"></div>
    <div id="tool-list"></div>
    <button class="btn btn-add" onclick="addNewTool()">+ Werkzeug hinzufügen</button>
    <button class="btn btn-pdf" onclick="makePDF()">PDF DRUCKEN</button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <div class="meta-grid">
            <div class="input-group"><label>T-NR</label><input type="text" id="m-id"></div>
            <div class="input-group"><label>NAME</label><input type="text" id="m-nm"></div>
            <div class="input-group full-width"><label>INFO / Ø</label><input type="text" id="m-dia"></div>
            <div class="input-group full-width"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
        </div>
        <div style="margin: 10px 0;"><input type="checkbox" id="m-rev"> Revolver Unten Start</div>
        <div style="margin-bottom: 20px;"><input type="checkbox" id="m-sonder"> Sonderwerkzeug</div>
        <button class="btn btn-pdf" onclick="saveTool()">SPEICHERN</button>
        <button class="btn" style="color:red" onclick="deleteTool()">LÖSCHEN</button>
    </div>
</div>

<div id="print-container"></div>

<script>
let job = { num: "231598", name: "BUCHSE", lzf: "4Min 25Sek", mat: "F75 D36", sag: "1010MM", stn: "50", stt: "70", tools: [] };
let editingIndex = null;

function render() {
    const meta = document.getElementById('meta-container');
    meta.innerHTML = `
        <div class="input-group full-width"><label>NUMMER</label><input value="${job.num}" oninput="job.num=this.value"></div>
        <div class="input-group full-width"><label>NAME</label><input value="${job.name}" oninput="job.name=this.value"></div>
    `;
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card" onclick="openModal(${i})">
            <div><div class="t-nr">${t.id}</div><div class="desc">${t.nm}</div></div>
            <div style="font-size:20px">→</div>
        </div>`).join('');
}

function openModal(i) {
    editingIndex = i; const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = t.rev;
    document.getElementById('m-sonder').checked = t.isSonder;
    document.getElementById('edit-modal').classList.add('active');
}

function saveTool() {
    job.tools[editingIndex] = {
        id: document.getElementById('m-id').value,
        nm: document.getElementById('m-nm').value,
        dia: document.getElementById('m-dia').value,
        bem: document.getElementById('m-bem').value,
        rev: document.getElementById('m-rev').checked,
        isSonder: document.getElementById('m-sonder').checked
    };
    document.getElementById('edit-modal').classList.remove('active'); render();
}

function addNewTool() { job.tools.push({id:"T0101", nm:"NEU"}); render(); openModal(job.tools.length-1); }
function deleteTool() { job.tools.splice(editingIndex, 1); document.getElementById('edit-modal').classList.remove('active'); render(); }

function makePDF() {
    const head = `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;">
            <div><div style="font-size:18px; font-weight:900;">${job.name}</div><div style="font-size:80px; font-weight:900; line-height:0.8;">${job.num}</div></div>
            <div style="width:200px; font-size:12px; font-weight:800; line-height:1.6;">
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000;"><span>LAUFZEIT</span><span>${job.lzf}</span></div>
                <div style="display:flex; justify-content:space-between; border-bottom:1px solid #000;"><span>MATERIAL</span><span>${job.mat}</span></div>
                <div style="display:flex; justify-content:space-between;"><span>STÜCK</span><span>${job.stt}/${job.stn}</span></div>
            </div>
        </div><div style="border-bottom:6px solid #000; margin-bottom:15px;"></div>`;

    const row = (t) => `
        <div style="display:flex; border-bottom:1.5px solid #000; padding:10px 0; align-items:center;">
            <div style="width:80px; font-size:18px; font-weight:900;">${t.id}</div>
            <div style="flex:1;"><div style="font-weight:800; font-size:16px;">${t.nm}</div><div style="font-size:10px; font-weight:700;">${t.isSonder?'SONDER':''} ${t.bem}</div></div>
            <div style="width:100px; text-align:right; font-weight:900;">${t.dia}</div>
        </div>`;

    let oben = [], unten = [], isU = false;
    job.tools.forEach(t => { if(t.rev) isU = true; if(isU) unten.push(t); else oben.push(t); });

    let content = `
        <div class="page-box"><div class="inner-border">
            ${head}
            <div style="font-size:20px; font-weight:900; margin-bottom:10px;">REVOLVER OBEN</div>
            ${oben.map(row).join('')}
        </div></div>`;

    if(unten.length > 0) {
        content += `
        <div class="page-box"><div class="inner-border">
            ${head}
            <div style="font-size:20px; font-weight:900; margin-bottom:10px;">REVOLVER UNTEN</div>
            ${unten.map(row).join('')}
        </div></div>`;
    }

    document.getElementById('print-container').innerHTML = content;
    setTimeout(() => window.print(), 300);
}

render();
</script>
</body>
</html>
