<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA JSON EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
            --blue: #007AFF;
        }

        body { 
            margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); 
            display: flex; justify-content: center; min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 500px; padding: 40px 20px 120px 20px; box-sizing: border-box; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }
        .header-line { width: 40px; height: 4px; background: var(--accent); margin: 10px auto 0; border-radius: 2px; }

        .section-title { font-size: 11px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 30px 0 10px 0; letter-spacing: 1px; }
        
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2.5px solid var(--border); }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 700; color: var(--text-main); background: transparent; padding: 0; box-sizing: border-box; }
        .full-width { grid-column: span 2; }

        .tool-list { display: flex; flex-direction: column; gap: 10px; }
        .tool-card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: 20px; padding: 15px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .tool-info b { font-size: 18px; display: block; }
        .tool-info span { font-size: 11px; color: var(--text-sub); font-weight: 800; }

        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 13px; text-transform: uppercase; border: none; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add { background: #fff; color: var(--text-main); border: 2px dashed var(--border); }
        .btn-primary { background: var(--accent); color: #FFF; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-sub { background: #E5E5EA; color: var(--text-main); }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 28px; padding: 25px; box-sizing: border-box; box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
        .modal-card h2 { margin-top: 0; font-size: 20px; font-weight: 900; text-align: center; text-transform: uppercase; }
        
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { flex: 2; background: var(--accent); color: #FFF; border-radius: 14px; padding: 14px; font-weight: 800; border: none; cursor: pointer; }
        .btn-cancel { flex: 1; background: #E5E5EA; border-radius: 14px; font-weight: 800; border: none; cursor: pointer; }

        .data-area { width: 100%; height: 180px; background: #f2f2f7; border-radius: 12px; border: 2px solid var(--border); padding: 12px; font-family: monospace; font-size: 13px; margin-top: 10px; resize: none; box-sizing: border-box; outline: none; color: #000; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>JSON <span>EDITOR</span></h1>
        <div class="header-line"></div>
    </header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div class="meta-grid" id="meta-container"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div id="tool-list" class="tool-list" style="margin-bottom: 15px;"></div>
    <button class="btn btn-add" onclick="addNewTool()">+ Werkzeug hinzufügen</button>

    <div class="section-title">DATEI & ТЕКСТ MANAGER</div>
    <button class="btn btn-primary" onclick="openCopyModal()">📄 Текст для копирования</button>
    <div class="meta-grid">
        <button class="btn btn-blue" onclick="downloadJSON()">💾 Save JSON</button>
        <button class="btn btn-sub" onclick="openImportModal()">📥 Import JSON</button>
    </div>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <h2>WERKZEUG EDIT</h2>
        <div class="meta-grid">
            <div class="input-group full-width"><label>T-NR</label><input type="text" id="m-id"></div>
            <div class="input-group full-width"><label>BESCHREIBUNG</label><input type="text" id="m-nm"></div>
            <div class="input-group"><label>Ø / TOL</label><input type="text" id="m-dia"></div>
            <div class="input-group"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="deleteCurrentTool()" style="color:var(--danger);">LÖSCHEN</button>
            <button class="btn-save" onclick="saveTool()">OK</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="copy-modal">
    <div class="modal-card">
        <h2>KOPIEREN</h2>
        <textarea class="data-area" id="copy-area" readonly></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">Schließen</button>
            <button class="btn-save" onclick="copyAction()">Копировать текст</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="import-modal">
    <div class="modal-card">
        <h2>JSON IMPORT</h2>
        <textarea class="data-area" id="import-area" placeholder='Füge JSON hier ein...'></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">Abbrechen</button>
            <button class="btn-save" onclick="processImport()">Laden</button>
        </div>
    </div>
</div>

<script>
let job = {"num":"231598","name":"BUCHSE","lzf":"4Min 25Sek","sag":"1010MM","mat":"F75 D36","tools":[]};
let editingIdx = null;

function init() {
    renderMeta();
    renderTools();
}

function renderMeta() {
    const c = document.getElementById('meta-container');
    c.innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" value="${job.num}" oninput="job.num=this.value"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" value="${job.name}" oninput="job.name=this.value"></div>
        <div class="input-group"><label>LAUFZEIT</label><input type="text" value="${job.lzf}" oninput="job.lzf=this.value"></div>
        <div class="input-group"><label>MATERIAL</label><input type="text" value="${job.mat}" oninput="job.mat=this.value"></div>
    `;
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card" onclick="openEditModal(${i})">
            <div class="tool-info">
                <span>${t.id}</span>
                <b>${t.nm}</b>
            </div>
            <div style="font-weight:900; color:var(--blue);">EDIT</div>
        </div>
    `).join('');
}

function openEditModal(i) {
    editingIdx = i;
    const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('edit-modal').classList.add('active');
}

function openCopyModal() {
    let txt = `AUFTRAG: ${job.num}\nNAME: ${job.name}\nMAT: ${job.mat}\n\nTOOLS:\n`;
    job.tools.forEach(t => {
        txt += `${t.id} | ${t.nm} ${t.dia ? '| Ø'+t.dia : ''} ${t.bem ? '('+t.bem+')' : ''}\n`;
    });
    document.getElementById('copy-area').value = txt;
    document.getElementById('copy-modal').classList.add('active');
}

function copyAction() {
    const area = document.getElementById('copy-area');
    area.select();
    document.execCommand('copy');
    alert("Текст скопирован!");
}

function openImportModal() {
    document.getElementById('import-area').value = '';
    document.getElementById('import-modal').classList.add('active');
}

function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

function saveTool() {
    job.tools[editingIdx] = {
        id: document.getElementById('m-id').value.toUpperCase(),
        nm: document.getElementById('m-nm').value.toUpperCase(),
        dia: document.getElementById('m-dia').value,
        bem: document.getElementById('m-bem').value
    };
    renderTools(); closeModals();
}

function deleteCurrentTool() {
    if(confirm('Удалить инструмент?')) {
        job.tools.splice(editingIdx, 1);
        renderTools(); closeModals();
    }
}

function addNewTool() {
    job.tools.push({id:"T0000", nm:"NEU", dia:"", bem:""});
    renderTools(); openEditModal(job.tools.length - 1);
}

function downloadJSON() {
    const blob = new Blob([JSON.stringify([job], null, 2)], {type: "application/json"});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `Job_${job.num || 'data'}.json`;
    link.click();
}

function processImport() {
    try {
        const parsed = JSON.parse(document.getElementById('import-area').value);
        job = Array.isArray(parsed) ? parsed[0] : parsed;
        init(); closeModals();
    } catch(e) { alert("Ошибка JSON!"); }
}

init();
</script>
</body>
</html>
