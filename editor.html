<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA SMARTBOX PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7; --card-bg: #FFFFFF; --accent: #1D1D1F; --text-main: #1D1D1F;
            --text-sub: #86868B; --border: #E5E5EA; --blue: #007AFF; --orange: #FF9500; --danger: #FF3B30;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 500px; padding: 20px 20px 120px 20px; box-sizing: border-box; }
        
        header h1 { text-align: center; font-size: 24px; font-weight: 900; text-transform: uppercase; margin-bottom: 20px; letter-spacing: -1px; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 25px 0 10px 0; letter-spacing: 1px; }
        
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .input-group { background: var(--card-bg); padding: 10px 14px; border-radius: 14px; border: 2.5px solid var(--border); transition: 0.2s; position: relative; }
        .input-group:focus-within { border-color: var(--accent); }
        .input-group label { display: block; font-size: 8px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 700; background: transparent; color: var(--text-main); padding: 0; }
        .full-width { grid-column: span 2; }

        /* SMART CHIPS */
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; min-height: 20px; }
        .chip { background: var(--blue); color: white; padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .chip:active { transform: scale(0.95); opacity: 0.8; }

        .tool-card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: 20px; margin-bottom: 10px; position: relative; overflow: hidden; }
        .tool-card.rev-active { border-left: 8px solid var(--orange); }
        .tool-main-row { display: flex; align-items: center; padding: 15px; }
        .tool-info { flex: 1; cursor: pointer; }
        .t-name { font-size: 17px; font-weight: 800; text-transform: uppercase; }
        .reorder-controls { display: flex; flex-direction: column; gap: 10px; padding-left: 15px; border-left: 1px solid var(--border); }
        .move-btn { background: none; border: none; padding: 5px; cursor: pointer; color: var(--text-sub); }
        .move-btn svg { width: 20px; height: 20px; stroke-width: 3; stroke: currentColor; fill: none; }
        .tool-footer { background: #F9F9FB; padding: 10px 15px; border-top: 1px solid var(--border); font-size: 12px; display: flex; gap: 10px; }

        .btn { width: 100%; padding: 16px; border-radius: 18px; font-weight: 900; border: none; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; font-size: 12px; }
        .btn-add { background: #fff; border: 2.5px dashed var(--border); }
        .btn-primary { background: var(--accent); color: #fff; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); display: none; align-items: flex-start; justify-content: center; z-index: 1000; padding: 20px; overflow-y: auto; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 28px; padding: 24px; margin-top: 40px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 12px; margin-top: 20px; }
        .btn-save { background: var(--accent); color: #fff; border-radius: 16px; font-weight: 800; border: none; padding: 16px; }
        .btn-cancel { background: #F2F2F7; color: var(--danger); border-radius: 16px; font-weight: 800; border: none; padding: 16px; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 700; transition: 0.3s; z-index: 2000; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Info</div>

<div class="app-container">
    <header><h1>NAKAMURA <span>EDITOR</span></h1></header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div id="meta-container" class="meta-grid"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div id="tool-list"></div>
    <button class="btn btn-add" onclick="addNewTool()">HINZUFÜGEN</button>

    <div class="section-title">MANAGEMENT</div>
    <button class="btn btn-primary" onclick="copyJSON()">JSON KOPIEREN</button>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
        <button class="btn" style="background:var(--blue); color:#fff" onclick="downloadJSON()">SAVE FILE</button>
        <button class="btn" style="background:#E5E5EA; color:var(--text-main)" onclick="openImportModal()">IMPORT</button>
    </div>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <div style="display:flex; flex-direction:column; gap:10px;">
            <div class="input-group"><label>T-NR</label><input type="text" id="m-id"></div>
            <div class="input-group">
                <label>BESCHREIBUNG</label>
                <input type="text" id="m-nm" oninput="showChips('nm', this.value)" onfocus="showChips('nm', this.value)">
                <div id="nm-chips" class="chip-container"></div>
            </div>
            <div class="input-group">
                <label>BEMERKUNG</label>
                <input type="text" id="m-bem" oninput="showChips('bem', this.value)" onfocus="showChips('bem', this.value)">
                <div id="bem-chips" class="chip-container"></div>
            </div>
            <div class="input-group"><label>Ø / TOLERANZ</label><input type="text" id="m-dia"></div>
            <label style="display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--bg); border-radius:12px; font-size:12px; font-weight:800; cursor:pointer;">
                REV UNTEN <input type="checkbox" id="m-rev" style="width:20px; height:20px;">
            </label>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="deleteTool()">DEL</button>
            <button class="btn-save" onclick="saveTool()">OK</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="import-modal">
    <div class="modal-card">
        <textarea id="import-area" style="width:100%; height:150px; border-radius:16px; padding:12px; border:2px solid var(--border); font-family:monospace;" placeholder="JSON Code..."></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" style="color:var(--text-main)" onclick="closeModals()">ZU</button>
            <button class="btn-save" onclick="processImport()">LOAD</button>
        </div>
    </div>
</div>

<script>
// "МОЗГИ" - инициализация
let smartMap = JSON.parse(localStorage.getItem('naka_v7_brain')) || { nm: [], bem: [], pairs: {} };

let job = JSON.parse(localStorage.getItem('naka_last_job')) || {
    num: "", name: "", lzf: "", saege: "", stT: "", stN: "", mat: "", abst: "", greif: "", tools: []
};

let editingIdx = null;

function saveState() {
    localStorage.setItem('naka_last_job', JSON.stringify(job));
}

function renderMeta() {
    const fields = [
        {id: 'num', label: 'TEILENUMMER', full: true}, {id: 'name', label: 'BENENNUNG', full: true},
        {id: 'lzf', label: 'LAUFZEIT'}, {id: 'saege', label: 'SÄGELÄNGE'},
        {id: 'stT', label: 'STÜCK T'}, {id: 'stN', label: 'STÜCK N'},
        {id: 'mat', label: 'MATERIAL'}, {id: 'abst', label: 'ABSTAND'},
        {id: 'greif', label: 'GREIFBACKEN', full: true}
    ];
    document.getElementById('meta-container').innerHTML = fields.map(f => `
        <div class="input-group ${f.full ? 'full-width' : ''}">
            <label>${f.label}</label>
            <input type="text" value="${job[f.id] || ''}" oninput="job.${f.id}=this.value; saveState();">
        </div>
    `).join('');
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card ${t.revUnten ? 'rev-active' : ''}">
            <div class="tool-main-row">
                <div class="tool-info" onclick="openEditModal(${i})">
                    <span style="font-size:10px; font-weight:900; color:var(--text-sub);">${t.id}</span>
                    <div class="t-name">${t.nm || 'LEER'}</div>
                </div>
                <div class="reorder-controls">
                    <button class="move-btn" onclick="moveTool(${i}, -1)" ${i === 0 ? 'style="opacity:0"' : ''}>
                        <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
                    </button>
                    <button class="move-btn" onclick="moveTool(${i}, 1)" ${i === job.tools.length - 1 ? 'style="opacity:0"' : ''}>
                        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                </div>
            </div>
            <div class="tool-footer" ${!t.bem && !t.dia ? 'style="display:none"' : ''}>
                ${t.dia ? `<b>Ø</b> ${t.dia}` : ''} ${t.bem ? `<span style="color:var(--border)">|</span> ${t.bem}` : ''}
            </div>
        </div>
    `).join('');
}

// УЛУЧШЕННЫЙ ПОКАЗ ЧИПОВ
function showChips(type, val) {
    const container = document.getElementById(type + '-chips');
    container.innerHTML = '';
    
    let list = smartMap[type] || [];
    let matches = [];

    if (!val) {
        // Если поле пустое, показываем последние 3 добавленных
        matches = list.slice(-3).reverse();
    } else {
        // Если что-то введено, фильтруем
        matches = list.filter(i => i.includes(val.toUpperCase())).slice(0, 3);
    }

    matches.forEach(m => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = m;
        chip.onclick = () => {
            document.getElementById('m-' + type).value = m;
            container.innerHTML = '';
            // Если выбрали название, проверяем есть ли пара для примечания
            if (type === 'nm' && smartMap.pairs[m]) {
                document.getElementById('m-bem').value = smartMap.pairs[m];
            }
        };
        container.appendChild(chip);
    });
}

function saveTool() {
    const nm = document.getElementById('m-nm').value.toUpperCase().trim();
    const bem = document.getElementById('m-bem').value.toUpperCase().trim();
    
    if (nm) {
        // Добавляем в базу имен, если еще нет
        if (!smartMap.nm.includes(nm)) smartMap.nm.push(nm);
        if (bem) {
            // Добавляем в базу примечаний, если еще нет
            if (!smartMap.bem.includes(bem)) smartMap.bem.push(bem);
            // Сохраняем связку
            smartMap.pairs[nm] = bem;
        }
        // Сохраняем "мозги" в LocalStorage
        localStorage.setItem('naka_v7_brain', JSON.stringify(smartMap));
    }

    job.tools[editingIdx] = {
        id: document.getElementById('m-id').value.toUpperCase() || 'T0101',
        nm: nm, dia: document.getElementById('m-dia').value,
        bem: bem, revUnten: document.getElementById('m-rev').checked
    };
    renderTools(); saveState(); closeModals();
}

function openEditModal(i) {
    editingIdx = i; const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = !!t.revUnten;
    // Очищаем чипы при открытии, они появятся при фокусе
    document.getElementById('nm-chips').innerHTML = '';
    document.getElementById('bem-chips').innerHTML = '';
    document.getElementById('edit-modal').classList.add('active');
}

function moveTool(index, dir) {
    const target = index + dir;
    [job.tools[index], job.tools[target]] = [job.tools[target], job.tools[index]];
    renderTools(); saveState();
}

function addNewTool() {
    job.tools.push({id:"T0101", nm:"", dia:"", bem:"", revUnten: false});
    renderTools(); openEditModal(job.tools.length - 1);
}

function deleteTool() { job.tools.splice(editingIdx, 1); renderTools(); saveState(); closeModals(); }
function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

function copyJSON() {
    const text = JSON.stringify([job], null, 2);
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed"; // Избегаем прокрутки
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
        document.execCommand('copy');
        showToast("JSON KOPIERT!");
    } catch (err) {
        alert("Copy Error");
    }
    document.body.removeChild(textArea);
}

function downloadJSON() { 
    const blob = new Blob([JSON.stringify([job], null, 2)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Job_${job.num || 'data'}.json`; a.click();
}

function openImportModal() { document.getElementById('import-modal').classList.add('active'); }
function processImport() {
    try {
        const val = JSON.parse(document.getElementById('import-area').value);
        job = Array.isArray(val) ? val[0] : val;
        renderMeta(); renderTools(); saveState(); closeModals(); showToast("Imported");
    } catch(e) { alert("JSON Error"); }
}

renderMeta(); renderTools();
</script>
</body>
</html>
