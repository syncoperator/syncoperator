<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA JSON EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
            --success: #34C759;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg);
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
        }

        .app-container { 
            width: 100%; 
            max-width: 500px; 
            padding: 40px 20px 100px 20px;
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }
        .header-line { width: 40px; height: 4px; background: var(--accent); margin: 10px auto 0; border-radius: 2px; }

        .section-title { font-size: 12px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 25px 0 10px 0; letter-spacing: 1px; }
        
        /* GRID */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2px solid var(--border); }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input, .input-group textarea { width: 100%; border: none; outline: none; font-size: 14px; font-weight: 700; color: var(--text-main); background: transparent; padding: 0; box-sizing: border-box; font-family: inherit; }
        .full-width { grid-column: span 2; }

        /* TOOLS */
        .tool-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .tool-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 16px 16px 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .tool-info { flex: 1; text-align: left; }
        .t-nr { font-size: 12px; font-weight: 900; color: var(--text-sub); margin-bottom: 4px; }
        .desc { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; }

        .tool-controls { display: flex; flex-direction: column; gap: 6px; margin-left: 15px; }
        .btn-move { width: 36px; height: 36px; background: #F5F5F7; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-move svg { width: 18px; height: 18px; fill: none; stroke: var(--text-main); stroke-width: 3; }

        /* BUTTONS */
        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 14px; text-transform: uppercase; border: none; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-add { background: var(--card-bg); color: var(--text-main); border: 2px dashed var(--border); }
        .btn-primary { background: var(--accent); color: #FFF; }
        .btn-sub { background: #E5E5EA; color: var(--text-main); }
        
        /* DATA AREA */
        .data-box { background: #000; color: #34C759; font-family: monospace; font-size: 11px; padding: 15px; border-radius: 16px; width: 100%; height: 120px; border: none; outline: none; margin-bottom: 10px; resize: none; box-sizing: border-box; }

        /* MODAL */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; box-sizing: border-box; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { flex: 2; background: var(--accent); color: #FFF; border-radius: 12px; padding: 14px; font-weight: 800; border: none; }
        .btn-delete { flex: 1; background: #FFF; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-weight: 800; }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>JSON <span>EDITOR</span></h1>
        <div class="header-line"></div>
    </header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div class="meta-grid" id="meta-container"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div class="tool-list" id="tool-list"></div>
    <button class="btn btn-add" onclick="addNewTool()">+ Werkzeug hinzufügen</button>

    <div class="section-title">DATEN MANAGEMENT</div>
    <textarea class="data-box" id="json-output" placeholder="JSON Code появится здесь..."></textarea>
    
    <div class="meta-grid">
        <button class="btn btn-primary" style="margin-bottom:0" onclick="exportData()">JSON Export</button>
        <button class="btn btn-sub" style="margin-bottom:0" onclick="importData()">JSON Import</button>
    </div>
    <button class="btn btn-sub" style="margin-top:10px; width:100%;" onclick="copyAsText()">Als Text kopieren (Backup)</button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <h2 style="margin-top:0; text-align:center;">EDITIEREN</h2>
        <div class="modal-grid">
            <div class="input-group"><label>T-NUMMER</label><input type="text" id="m-id"></div>
            <div class="input-group"><label>BESCHREIBUNG</label><input type="text" id="m-nm"></div>
            <div class="input-group"><label>Ø / INFO</label><input type="text" id="m-dia"></div>
            <div class="input-group"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
            <div style="display:flex; gap:20px; padding:10px 0;">
                <label style="font-size:12px; font-weight:700;"><input type="checkbox" id="m-rev"> REV</label>
                <label style="font-size:12px; font-weight:700;"><input type="checkbox" id="m-sonder"> SONDER</label>
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-delete" id="btn-del-tool">LÖSCHEN</button>
            <button class="btn-save" onclick="saveTool()">OK</button>
        </div>
    </div>
</div>

<script>
let job = {"num":"231598","name":"BUCHSE","lzf":"4Min 25Sek","sag":"1010MM","stn":"50","mat":"F75 D36","tools":[]};
let editingIndex = null;

function init() {
    renderMeta();
    renderTools();
    updateJsonArea();
}

function renderMeta() {
    const container = document.getElementById('meta-container');
    container.innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" value="${job.num}" oninput="job.num=this.value; updateJsonArea()"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" value="${job.name}" oninput="job.name=this.value; updateJsonArea()"></div>
        <div class="input-group"><label>LAUFZEIT</label><input type="text" value="${job.lzf}" oninput="job.lzf=this.value; updateJsonArea()"></div>
        <div class="input-group"><label>MATERIAL</label><input type="text" value="${job.mat}" oninput="job.mat=this.value; updateJsonArea()"></div>
    `;
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = '';
    job.tools.forEach((t, index) => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.innerHTML = `
            <div class="tool-info" onclick="openModal(${index})">
                <div class="t-nr">${t.id} ${t.rev ? '• REV' : ''}</div>
                <div class="desc">${t.nm}</div>
            </div>
            <div class="tool-controls">
                <button class="btn-move" onclick="moveTool(${index}, -1)" ${index === 0 ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="btn-move" onclick="moveTool(${index}, 1)" ${index === job.tools.length - 1 ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function updateJsonArea() {
    document.getElementById('json-output').value = JSON.stringify([job], null, 2);
}

function moveTool(index, direction) {
    const target = index + direction;
    [job.tools[index], job.tools[target]] = [job.tools[target], job.tools[index]];
    renderTools();
    updateJsonArea();
}

function openModal(index) {
    editingIndex = index;
    const t = job.tools[index];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = t.rev;
    document.getElementById('m-sonder').checked = t.isSonder;
    document.getElementById('btn-del-tool').onclick = () => { job.tools.splice(index, 1); renderTools(); updateJsonArea(); closeModal(); };
    document.getElementById('edit-modal').classList.add('active');
}

function closeModal() { document.getElementById('edit-modal').classList.remove('active'); }

function saveTool() {
    job.tools[editingIndex] = {
        id: document.getElementById('m-id').value,
        nm: document.getElementById('m-nm').value,
        dia: document.getElementById('m-dia').value,
        bem: document.getElementById('m-bem').value,
        rev: document.getElementById('m-rev').checked,
        isSonder: document.getElementById('m-sonder').checked
    };
    renderTools(); updateJsonArea(); closeModal();
}

function addNewTool() {
    job.tools.push({ id: "T0000", nm: "NEU", dia: "", bem: "", rev: false, isSonder: false });
    renderTools(); openModal(job.tools.length - 1);
}

function exportData() {
    const el = document.getElementById('json-output');
    el.select();
    document.execCommand('copy');
    alert("JSON в буфере!");
}

function importData() {
    try {
        const data = JSON.parse(document.getElementById('json-output').value);
        job = Array.isArray(data) ? data[0] : data;
        init();
        alert("Импорт успешен!");
    } catch (e) { alert("Ошибка JSON!"); }
}

function copyAsText() {
    let text = `AUFTRAG: ${job.num} - ${job.name}\n`;
    text += `LAUFZEIT: ${job.lzf} | MAT: ${job.mat}\n\nWERKZEUGE:\n`;
    job.tools.forEach(t => {
        text += `${t.id}: ${t.nm} ${t.dia ? '| Ø'+t.dia : ''} ${t.rev ? '[REV]' : ''}\n`;
    });
    navigator.clipboard.writeText(text);
    alert("Текст скопирован для заметок!");
}

document.getElementById('edit-modal').onclick = (e) => { if(e.target.id==='edit-modal') closeModal(); };

init();
</script>
</body>
</html>
