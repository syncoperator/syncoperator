<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA PREMIUM EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7; --card-bg: #FFFFFF; --accent: #1D1D1F; --text-main: #1D1D1F;
            --text-sub: #86868B; --border: #E5E5EA; --danger: #FF3B30; --blue: #007AFF;
            --orange: #FF9500; --note-bg: #F9F9FB;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 20px 20px 120px 20px; box-sizing: border-box; }
        
        header h1 { text-align: center; font-size: 26px; font-weight: 900; letter-spacing: -1px; margin-bottom: 20px; text-transform: uppercase; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 25px 0 10px 0; letter-spacing: 1px; }
        
        /* INPUTS */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .input-group { background: var(--card-bg); padding: 10px; border-radius: 14px; border: 2.5px solid var(--border); position: relative; }
        .input-group label { display: block; font-size: 9px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 2px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 700; background: transparent; padding: 0; box-sizing: border-box; color: var(--text-main); }
        .full-width { grid-column: span 2; }

        /* SMART CHIPS */
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .chip { background: var(--blue); color: white; padding: 5px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; cursor: pointer; text-transform: uppercase; }

        /* TOOL CARDS */
        .tool-card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: 20px; margin-bottom: 10px; overflow: hidden; cursor: pointer; }
        .tool-card.rev-active { border-left: 8px solid var(--orange); }
        .tool-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .t-name { font-size: 17px; font-weight: 800; text-transform: uppercase; }
        .tool-footer { background: var(--note-bg); padding: 8px 15px; border-top: 1px solid var(--border); font-size: 12px; display: flex; gap: 10px; }

        /* BUTTONS */
        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; border: none; cursor: pointer; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; font-size: 12px; }
        .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; }
        .btn-add { background: #fff; border: 2.5px dashed var(--border); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-blue { background: var(--blue); color: #fff; }
        .btn-sub { background: #E5E5EA; color: var(--text-main); }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 26px; padding: 22px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); }
        
        .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 20px; }
        .btn-save { background: var(--accent); color: #fff; border-radius: 14px; font-weight: 800; border: none; }
        .btn-cancel { background: #E5E5EA; border-radius: 14px; font-weight: 800; border: none; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 25px; font-size: 13px; font-weight: 700; transition: 0.3s; z-index: 2000; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Info</div>

<div class="app-container">
    <header><h1>NAKAMURA <span>PRO</span></h1></header>

    <div class="section-title">AUFTRAG</div>
    <div id="meta-container" class="meta-grid"></div>

    <div class="section-title">WERKZEUGE</div>
    <div id="tool-list"></div>
    <button class="btn btn-add" onclick="addNewTool()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Hinzufügen
    </button>

    <div class="section-title">MANAGEMENT</div>
    <button class="btn btn-primary" onclick="copyJSON()">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        JSON КОПИРОВАТЬ
    </button>
    <div class="meta-grid">
        <button class="btn btn-blue" onclick="downloadJSON()">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            SAVE FILE
        </button>
        <button class="btn btn-sub" onclick="openImportModal()">
            <svg viewBox="0 0 24 24"><polyline points="16 16 12 12 8 16"></polyline><line x1="12" y1="12" x2="12" y2="21"></line></svg>
            IMPORT
        </button>
    </div>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <div class="meta-grid">
            <div class="input-group full-width"><label>T-NR</label><input type="text" id="m-id"></div>
            
            <div class="input-group full-width">
                <label>BESCHREIBUNG</label>
                <input type="text" id="m-nm" oninput="showChips('nm', this.value)">
                <div id="nm-chips" class="chip-container"></div>
            </div>
            
            <div class="input-group"><label>Ø / TOL</label><input type="text" id="m-dia"></div>
            
            <div class="input-group">
                <label>BEMERKUNG</label>
                <input type="text" id="m-bem" oninput="showChips('bem', this.value)">
                <div id="bem-chips" class="chip-container"></div>
            </div>

            <div class="full-width" style="display:flex; align-items:center; justify-content:space-between; background:var(--bg); padding:12px; border-radius:14px; font-size:12px; font-weight:800; cursor:pointer;" onclick="document.getElementById('m-rev').click()">
                REV UNTEN
                <input type="checkbox" id="m-rev" onclick="event.stopPropagation()">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" style="padding:14px" onclick="deleteTool()">DEL</button>
            <button class="btn-save" style="padding:14px" onclick="saveTool()">OK</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="import-modal">
    <div class="modal-card">
        <textarea id="import-area" style="width:100%; height:150px; border-radius:12px; padding:10px; border:1px solid var(--border); font-family:monospace;" placeholder="Вставь JSON сюда..."></textarea>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeModals()">CLOSE</button>
            <button class="btn-save" onclick="processImport()">LOAD</button>
        </div>
    </div>
</div>

<script>
// БАЗА ДАННЫХ В ПАМЯТИ
let smartMap = JSON.parse(localStorage.getItem('naka_v3_brain')) || {
    nm: ['KOPIERSTAHL', 'BOHRER', 'ABSTECHSTAHL'],
    bem: ['FACH B2', 'KÜHLUNG', '3MM'],
    pairs: { 'KOPIERSTAHL': 'FACH B2' }
};

let job = {"num":"231598","name":"BUCHSE","lzf":"4M 25S","mat":"F75 D36","tools":[]};
let editingIdx = null;

// ПОКАЗ КНОПОК-ПОДСКАЗОК
function showChips(type, val) {
    const container = document.getElementById(type + '-chips');
    container.innerHTML = '';
    if (!val) return;

    const list = smartMap[type];
    const matches = list.filter(item => item.includes(val.toUpperCase())).slice(0, 3);

    matches.forEach(m => {
        const chip = document.createElement('div');
        chip.className = 'chip';
        chip.innerText = m;
        chip.onclick = () => {
            document.getElementById('m-' + type).value = m;
            container.innerHTML = '';
            if (type === 'nm' && smartMap.pairs[m]) {
                document.getElementById('m-bem').value = smartMap.pairs[m];
            }
        };
        container.appendChild(chip);
    });
}

function saveTool() {
    const nm = document.getElementById('m-nm').value.toUpperCase();
    const bem = document.getElementById('m-bem').value.toUpperCase();

    if (nm) {
        if (!smartMap.nm.includes(nm)) smartMap.nm.push(nm);
        if (bem) {
            if (!smartMap.bem.includes(bem)) smartMap.bem.push(bem);
            smartMap.pairs[nm] = bem; // Связываем
        }
        localStorage.setItem('naka_v3_brain', JSON.stringify(smartMap));
    }

    job.tools[editingIdx] = {
        id: document.getElementById('m-id').value.toUpperCase(),
        nm: nm,
        dia: document.getElementById('m-dia').value,
        bem: bem,
        revUnten: document.getElementById('m-rev').checked
    };
    renderTools(); closeModals(); showToast("Gespeichert");
}

function openEditModal(i) {
    editingIdx = i; const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = !!t.revUnten;
    document.getElementById('nm-chips').innerHTML = '';
    document.getElementById('bem-chips').innerHTML = '';
    document.getElementById('edit-modal').classList.add('active');
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card ${t.revUnten ? 'rev-active' : ''}" onclick="openEditModal(${i})">
            <div class="tool-header">
                <div><span style="font-size:10px; font-weight:900; color:var(--text-sub);">${t.id}</span><div class="t-name">${t.nm}</div></div>
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--border);fill:none;stroke-width:3;"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="tool-footer" ${!t.bem && !t.dia ? 'style="display:none"' : ''}>
                ${t.dia ? `<b>Ø</b> ${t.dia}` : ''} ${t.bem ? `<span>|</span> ${t.bem}` : ''}
            </div>
        </div>
    `).join('');
}

function renderMeta() {
    document.getElementById('meta-container').innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" value="${job.num}" oninput="job.num=this.value"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" value="${job.name}" oninput="job.name=this.value"></div>
    `;
}

function addNewTool() {
    job.tools.push({id:"T0000", nm:"", dia:"", bem:"", revUnten: false});
    renderTools(); openEditModal(job.tools.length - 1);
}

function deleteTool() {
    job.tools.splice(editingIdx, 1);
    renderTools(); closeModals();
}

function copyJSON() {
    navigator.clipboard.writeText(JSON.stringify([job], null, 2)).then(() => showToast("JSON COPIED"));
}

function downloadJSON() {
    const blob = new Blob([JSON.stringify([job], null, 2)], {type: "application/json"});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `Job_${job.num}.json`; a.click();
}

function openImportModal() { document.getElementById('import-modal').classList.add('active'); }

function processImport() {
    try {
        const val = JSON.parse(document.getElementById('import-area').value);
        job = Array.isArray(val) ? val[0] : val;
        renderMeta(); renderTools(); closeModals(); showToast("Imported");
    } catch(e) { alert("JSON Error"); }
}

function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }
function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2000); }

renderMeta(); renderTools();
</script>
</body>
</html>
