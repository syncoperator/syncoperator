<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA EDITOR PRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
            --blue: #007AFF;
            --orange: #FF9500;
            --note-bg: #F9F9FB;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 40px 20px 120px 20px; box-sizing: border-box; }

        header h1 { text-align: center; margin: 0 0 30px 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }

        .section-title { font-size: 11px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 30px 0 10px 0; letter-spacing: 1px; }
        
        /* INPUTS */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2.5px solid var(--border); }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 700; color: var(--text-main); background: transparent; padding: 0; box-sizing: border-box; }
        .full-width { grid-column: span 2; }

        /* TOOL LIST - REDESIGNED */
        .tool-list { display: flex; flex-direction: column; gap: 12px; }
        .tool-card { 
            background: var(--card-bg); 
            border: 2.5px solid var(--border); 
            border-radius: 22px; 
            padding: 0; 
            overflow: hidden;
            cursor: pointer; 
            transition: 0.2s;
            display: flex;
            flex-direction: column;
        }
        .tool-card.rev-active { border-left: 8px solid var(--orange); }

        .tool-header { padding: 15px 18px 10px 18px; display: flex; justify-content: space-between; align-items: flex-start; }
        .tool-main-info { flex: 1; }
        .t-number { font-size: 11px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; display: block; margin-bottom: 2px; }
        .t-name { font-size: 19px; font-weight: 800; color: var(--text-main); line-height: 1.2; }

        .tool-footer { 
            background: var(--note-bg); 
            padding: 10px 18px; 
            border-top: 1px solid var(--border); 
            display: flex;
            gap: 15px;
            align-items: center;
        }
        .note-item { font-size: 12px; font-weight: 600; color: var(--text-sub); display: flex; align-items: center; gap: 5px; }
        .note-item b { color: var(--accent); font-weight: 800; }

        .badge-rev { background: var(--orange); color: #fff; font-size: 10px; font-weight: 900; padding: 3px 8px; border-radius: 8px; margin-top: 5px; display: inline-block; }

        /* BUTTONS */
        .btn { width: 100%; padding: 16px; border-radius: 18px; font-weight: 900; font-size: 13px; text-transform: uppercase; border: none; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .btn-add { background: #fff; border: 2.5px dashed var(--border); color: var(--text-main); }
        .btn-primary { background: var(--accent); color: #FFF; }
        .btn-blue { background: var(--blue); color: #fff; }

        /* MODALS */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 420px; border-radius: 30px; padding: 25px; box-sizing: border-box; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; background: var(--bg); padding: 15px; border-radius: 16px; margin-top: 10px; cursor: pointer; }
        .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 25px; }
        .btn-save { background: var(--accent); color: #FFF; border-radius: 16px; padding: 14px; font-weight: 800; border: none; cursor: pointer; }
        .btn-cancel { background: #E5E5EA; border-radius: 16px; font-weight: 800; border: none; cursor: pointer; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 25px; font-size: 14px; font-weight: 700; transition: 0.3s; z-index: 2000; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Copied!</div>

<div class="app-container">
    <header><h1>NAKAMURA <span>PRO</span></h1></header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div class="meta-grid" id="meta-container"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div id="tool-list" class="tool-list" style="margin-bottom: 20px;"></div>
    <button class="btn btn-add" onclick="addNewTool()">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        Hinzufügen
    </button>

    <div class="section-title">MANAGEMENT</div>
    <button class="btn btn-primary" onclick="copyJSON()">
        <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        JSON KOPIEREN
    </button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <h2 style="text-align:center; font-weight:900; margin-bottom:20px;">WERKZEUG EDIT</h2>
        <div class="meta-grid">
            <div class="input-group full-width"><label>T-NR</label><input type="text" id="m-id"></div>
            <div class="input-group full-width"><label>BESCHREIBUNG</label><input type="text" id="m-nm"></div>
            <div class="input-group"><label>Ø / TOL</label><input type="text" id="m-dia"></div>
            <div class="input-group"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
            <div class="full-width toggle-row" onclick="document.getElementById('m-rev').click()">
                <label>REVOLVER UNTEN (REV ⬇️)</label>
                <input type="checkbox" id="m-rev" onclick="event.stopPropagation()">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="deleteTool()" style="color:var(--danger);">LÖSCHEN</button>
            <button class="btn-save" onclick="saveTool()">SPEICHERN</button>
        </div>
    </div>
</div>

<script>
let job = {"num":"231598","name":"BUCHSE","lzf":"4M 25S","mat":"F75 D36","tools":[]};
let editingIdx = null;

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function renderMeta() {
    const c = document.getElementById('meta-container');
    c.innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" value="${job.num}" oninput="job.num=this.value"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" value="${job.name}" oninput="job.name=this.value"></div>
        <div class="input-group"><label>LAUFZEIT</label><input type="text" value="${job.lzf}" oninput="job.lzf=this.value"></div>
        <div class="input-group"><label>MATERIAL</label><input type="text" value="${job.mat}" oninput="job.mat=this.value"></div>
    `;
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card ${t.revUnten ? 'rev-active' : ''}" onclick="openEditModal(${i})">
            <div class="tool-header">
                <div class="tool-main-info">
                    <span class="t-number">${t.id}</span>
                    <div class="t-name">${t.nm}</div>
                    ${t.revUnten ? '<span class="badge-rev">REV UNTEN ⬇️</span>' : ''}
                </div>
                <svg viewBox="0 0 24 24" style="width:20px; height:20px; stroke:var(--border); fill:none; stroke-width:3; margin-top:10px;"><polyline points="9 18 15 12 9 6"></polyline></svg>
            </div>
            <div class="tool-footer" ${!t.bem && !t.dia ? 'style="display:none"' : ''}>
                ${t.dia ? `<div class="note-item"><b>Ø</b> ${t.dia}</div>` : ''}
                ${t.bem ? `<div class="note-item" style="flex:1"><b>NOTE:</b> ${t.bem}</div>` : ''}
            </div>
        </div>
    `).join('');
}

function openEditModal(i) {
    editingIdx = i;
    const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = !!t.revUnten;
    document.getElementById('edit-modal').classList.add('active');
}

function saveTool() {
    job.tools[editingIdx] = {
        id: document.getElementById('m-id').value.toUpperCase(),
        nm: document.getElementById('m-nm').value.toUpperCase(),
        dia: document.getElementById('m-dia').value,
        bem: document.getElementById('m-bem').value,
        revUnten: document.getElementById('m-rev').checked
    };
    renderTools(); closeModals();
    showToast("Gespeichert");
}

function copyJSON() {
    navigator.clipboard.writeText(JSON.stringify([job], null, 2)).then(() => showToast("JSON COPIED!"));
}

function addNewTool() {
    job.tools.push({id:"T0000", nm:"NEU", dia:"", bem:"", revUnten: false});
    renderTools(); openEditModal(job.tools.length - 1);
}

function deleteTool() {
    job.tools.splice(editingIdx, 1);
    renderTools(); closeModals();
    showToast("Gelöscht");
}

function closeModals() {
    document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
}

renderMeta();
renderTools();
</script>
</body>
</html>
