<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA JSON EDITOR + PDF</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
        }

        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 40px 20px 180px 20px; box-sizing: border-box; }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }

        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2px solid var(--border); }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 14px; font-weight: 700; color: var(--text-main); background: transparent; padding: 0; }
        .full-width { grid-column: span 2; }

        .section-title { font-size: 12px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .tool-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        
        .tool-card { background: var(--card-bg); border: 2px solid var(--border); border-radius: 20px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
        .tool-info { flex: 1; }
        .t-nr { font-size: 12px; font-weight: 900; color: var(--text-sub); margin-bottom: 4px; }
        .desc { font-size: 18px; font-weight: 900; }

        .btn-move { width: 36px; height: 36px; background: #F5F5F7; border: none; border-radius: 10px; cursor: pointer; margin-left: 5px;}
        .btn-move svg { width: 18px; height: 18px; stroke: #000; stroke-width: 3; fill: none; }

        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 14px; text-transform: uppercase; border: none; cursor: pointer; margin-bottom: 10px; }
        .btn-add { background: var(--card-bg); color: var(--text-main); border: 2px dashed var(--border); }
        .btn-export { background: var(--accent); color: #FFF; }
        .btn-pdf { background: #007AFF; color: #FFF; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: #fff; width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; }

        /* PRINT CONFIG */
        #print-container { display: none; }
        @media print {
            body { background: #fff; }
            .app-container, .modal-overlay { display: none !important; }
            #print-container { display: block !important; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <header><h1>JSON <span>EDITOR</span></h1></header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div class="meta-grid" id="meta-container"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div id="tool-list" class="tool-list"></div>

    <button class="btn btn-add" onclick="addNewTool()">+ Werkzeug hinzufügen</button>
    <button class="btn btn-pdf" onclick="makePDF()">📄 PDF GENERIEREN</button>
    <button class="btn btn-export" onclick="exportData()">Export JSON (Copy)</button>
    <button class="btn btn-import" onclick="importData()" style="background:#E5E5EA; color:#000;">Import JSON</button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <h2 style="text-align:center; font-weight:900;">EDITIEREN</h2>
        <div class="meta-grid">
            <div class="input-group full-width"><label>T-NUMMER</label><input type="text" id="m-id"></div>
            <div class="input-group full-width"><label>BESCHREIBUNG</label><input type="text" id="m-nm"></div>
            <div class="input-group"><label>Ø / INFO</label><input type="text" id="m-dia"></div>
            <div class="input-group"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:flex; align-items:center; font-weight:800; font-size:14px;">
                <input type="checkbox" id="m-rev" style="width:20px; height:20px; margin-right:10px;"> UNTEN START (Rev)
            </label>
            <br>
            <label style="display:flex; align-items:center; font-weight:800; font-size:14px;">
                <input type="checkbox" id="m-sonder" style="width:20px; height:20px; margin-right:10px;"> SONDERWERKZEUG
            </label>
        </div>
        <div style="display:flex; gap:10px;">
            <button onclick="closeModal()" style="flex:1; padding:12px; border-radius:12px; border:none; font-weight:800;">ABBRECHEN</button>
            <button onclick="saveTool()" style="flex:1; padding:12px; border-radius:12px; border:none; background:#000; color:#fff; font-weight:800;">SAVE</button>
        </div>
        <button onclick="deleteTool(editingIndex); closeModal();" style="width:100%; margin-top:10px; color:red; background:none; border:none; font-weight:800; cursor:pointer;">LÖSCHEN</button>
    </div>
</div>

<div id="print-container"></div>

<script>
let currentData = [{"num":"231598","name":"BUCHSE","lzf":"4Min 25Sek","sag":"1010MM","stt":"70","stn":"50","mat":"F75 D36","abs":"","grf":"25-31","tools":[{"id":"T0101","nm":"KOPIERST.R0.8 VBMT G54","dia":"","bem":"FACH B","rev":false,"isSonder":false},{"id":"T1216","nm":"STANGENANSCHLAG G54","dia":"","bem":"NACHSCHUBLANGE 500","rev":true,"isSonder":false}]}];
let job = currentData[0];
let editingIndex = null;

function init() { renderMeta(); renderTools(); }

function renderMeta() {
    const c = document.getElementById('meta-container');
    c.innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" value="${job.num}" onchange="job.num=this.value"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" value="${job.name}" onchange="job.name=this.value"></div>
        <div class="input-group"><label>LAUFZEIT</label><input type="text" value="${job.lzf}" onchange="job.lzf=this.value"></div>
        <div class="input-group"><label>MATERIAL</label><input type="text" value="${job.mat}" onchange="job.mat=this.value"></div>
        <div class="input-group"><label>SÄGELÄNGE</label><input type="text" value="${job.sag}" onchange="job.sag=this.value"></div>
        <div class="input-group"><label>STÜCKZAHL</label><input type="text" value="${job.stn}" onchange="job.stn=this.value"></div>
    `;
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card" onclick="openModal(${i})">
            <div class="tool-info">
                <div class="t-nr">${t.id} ${t.rev?'(UNTEN START)':''}</div>
                <div class="desc">${t.nm}</div>
            </div>
            <div onclick="event.stopPropagation()">
                <button class="btn-move" onclick="moveTool(${i},-1)" ${i==0?'disabled':''}><svg viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
                <button class="btn-move" onclick="moveTool(${i},1)" ${i==job.tools.length-1?'disabled':''}><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
            </div>
        </div>`).join('');
}

function moveTool(index, dir) {
    const target = index + dir;
    [job.tools[index], job.tools[target]] = [job.tools[target], job.tools[index]];
    renderTools();
}

function openModal(i) {
    editingIndex = i; const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = t.rev;
    document.getElementById('m-sonder').checked = t.isSonder;
    document.getElementById('edit-modal').classList.add('active');
}

function closeModal() { document.getElementById('edit-modal').classList.remove('active'); }

function saveTool() {
    job.tools[editingIndex] = {
        id: document.getElementById('m-id').value,
        nm: document.getElementById('m-nm').value,
        dia: document.getElementById('m-dia').value,
        bem: document.getElementById('m-bem').value,
        rev: document.getElementById('m-rev').checked,
        isSonder: document.getElementById('m-sonder').checked
    };
    renderTools(); closeModal();
}

function addNewTool() {
    job.tools.push({id:"T0000", nm:"NEU", dia:"", bem:"", rev:false, isSonder:false});
    renderTools(); openModal(job.tools.length-1);
}

function deleteTool(i) { if(confirm('Löschen?')) job.tools.splice(i,1); renderTools(); }

function makePDF() {
    const getHead = () => `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; min-height:100px;">
            <div>
                <div style="font-size:18px; font-weight:900; text-transform:uppercase;">${job.name}</div>
                <div style="font-size:90px; font-weight:900; line-height:0.8; letter-spacing:-4px; margin-left:-4px;">${job.num}</div>
            </div>
            <div style="width:250px; font-size:12px; font-weight:800; line-height:1.7;">
                <div style="border-bottom:1.5px solid #000; display:flex; justify-content:space-between;"><span>LAUFZEIT</span><span>${job.lzf}</span></div>
                <div style="border-bottom:1.5px solid #000; display:flex; justify-content:space-between;"><span>MATERIAL</span><span>${job.mat}</span></div>
                <div style="border-bottom:1.5px solid #000; display:flex; justify-content:space-between;"><span>SÄGELÄNGE</span><span>${job.sag}</span></div>
                <div style="border-bottom:1.5px solid #000; display:flex; justify-content:space-between;"><span>STÜCK</span><span>${job.stn}</span></div>
            </div>
        </div><div style="border-bottom:7px solid #000; margin-bottom:12px;"></div>`;

    const getRow = (t) => `
        <div style="display:flex; align-items:center; border-bottom:1.5px solid #000; padding:8px 0;">
            <div style="width:95px; font-weight:900; font-size:20px;">${t.id}</div>
            <div style="flex:1;">
                <div style="font-weight:800; font-size:17px; text-transform:uppercase;">${t.nm}</div>
                <div style="font-size:9px; font-weight:800;">${t.isSonder?'SONDER':'STD'} ${t.bem?` | ${t.bem}`:''}</div>
            </div>
            <div style="width:130px; text-align:right; font-weight:900; font-size:16px;">${t.dia}</div>
        </div>`;

    const wrap = (title, items) => `
        <div style="width:210mm; height:297mm; padding:10mm; background:#fff; box-sizing:border-box; page-break-after:always;">
            <div style="border:1.5px solid #000; padding:25px; height:100%; display:flex; flex-direction:column; box-sizing:border-box;">
                ${getHead()}
                <div style="font-size:22px; font-weight:900; margin-bottom:10px;">${title}</div>
                <div style="flex:1;">${items.map(getRow).join('')}</div>
            </div>
        </div>`;

    let oben = [], unten = [], reached = false;
    job.tools.forEach(t => { if(t.rev) reached = true; if(reached) unten.push(t); else oben.push(t); });

    let html = wrap("REVOLVER OBEN", oben);
    if(unten.length > 0) html += wrap("REVOLVER UNTEN", unten);

    document.getElementById('print-container').innerHTML = html;
    setTimeout(() => window.print(), 300);
}

function exportData() { navigator.clipboard.writeText(JSON.stringify([job])).then(() => alert("Copied!")); }
function importData() {
    const input = prompt("JSON:");
    if(input) { try { job = JSON.parse(input)[0]; init(); } catch(e) { alert("Error"); } }
}

init();
</script>
</body>
</html>
