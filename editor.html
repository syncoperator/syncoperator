<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA JSON EDITOR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7;
            --card-bg: #FFFFFF;
            --accent: #1D1D1F;
            --text-main: #1D1D1F;
            --text-sub: #86868B;
            --border: #E5E5EA;
            --danger: #FF3B30;
        }

        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: var(--bg);
            color: var(--text-main); 
            display: flex; 
            justify-content: center;
            min-height: 100vh;
        }

        .app-container { 
            width: 100%; 
            max-width: 500px; 
            padding: 40px 20px 100px 20px; 
            box-sizing: border-box;
        }

        header { text-align: center; margin-bottom: 30px; }
        header h1 { margin: 0; font-size: 32px; font-weight: 900; letter-spacing: -1px; }
        header h1 span { color: var(--text-sub); }
        .header-line { width: 40px; height: 4px; background: var(--accent); margin: 10px auto 0; border-radius: 2px; }

        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 25px; }
        .input-group { background: var(--card-bg); padding: 12px; border-radius: 16px; border: 2px solid var(--border); }
        .input-group label { display: block; font-size: 10px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 14px; font-weight: 700; color: var(--text-main); background: transparent; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        .full-width { grid-column: span 2; }

        .section-title { font-size: 12px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
        .tool-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        
        .tool-card { 
            background: var(--card-bg); 
            border: 2px solid var(--border); 
            border-radius: 20px; 
            padding: 16px 16px 16px 20px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer; 
            transition: all 0.2s;
        }
        .tool-card:active { transform: scale(0.98); border-color: var(--accent); }
        
        .tool-info { flex: 1; text-align: left; }
        .t-nr { font-size: 12px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
        .desc { font-size: 18px; font-weight: 900; color: var(--text-main); letter-spacing: -0.5px; }

        .tool-controls { display: flex; flex-direction: column; gap: 6px; margin-left: 15px; }
        .btn-move { width: 36px; height: 36px; background: #F5F5F7; border: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .btn-move svg { width: 18px; height: 18px; fill: none; stroke: var(--text-main); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .btn-move:active { background: #E5E5EA; transform: scale(0.9); }
        .btn-move:disabled { opacity: 0.3; cursor: default; transform: none; }

        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 14px; text-transform: uppercase; border: none; cursor: pointer; transition: 0.2s; letter-spacing: 0.5px; margin-bottom: 10px; }
        .btn-add { background: var(--card-bg); color: var(--text-main); border: 2px dashed var(--border); margin-bottom: 30px; }
        .btn-export { background: #E5E5EA; color: var(--text-main); }
        .btn-pdf { background: #000; color: #FFF; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(5px); display: none; align-items: center; justify-content: center; z-index: 100; opacity: 0; transition: opacity 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-card { background: var(--card-bg); width: 90%; max-width: 400px; border-radius: 24px; padding: 25px; box-sizing: border-box; transform: translateY(20px); transition: transform 0.3s; }
        .modal-overlay.active .modal-card { transform: translateY(0); }
        .modal-card h2 { margin: 0 0 20px 0; font-size: 20px; font-weight: 900; letter-spacing: -0.5px; text-align: center; }
        
        .modal-grid { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .check-group { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; }
        
        .modal-actions { display: flex; gap: 10px; }
        .btn-save { flex: 2; background: var(--accent); color: #FFF; border-radius: 12px; padding: 14px; font-weight: 800; border: none; cursor: pointer; }
        .btn-delete { flex: 1; background: #FFF; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-weight: 800; cursor: pointer; }

        #print-container { display: none; }
        @media print { 
            body { background: #fff; overflow: visible; } 
            .app-container, .modal-overlay { display: none !important; } 
            #print-container { display: block !important; } 
        }
    </style>
</head>
<body>

<div class="app-container">
    <header>
        <h1>JSON <span>EDITOR</span></h1>
        <div class="header-line"></div>
    </header>

    <div class="section-title">AUFTRAGSDATEN</div>
    <div class="meta-grid" id="meta-container"></div>

    <div class="section-title">WERKZEUGLISTE</div>
    <div class="tool-list" id="tool-list"></div>

    <button class="btn btn-add" onclick="addNewTool()">+ Werkzeug hinzufügen</button>
    <button class="btn btn-pdf" onclick="makePDF()">PDF DRUCKEN</button>
    <button class="btn btn-export" onclick="exportData()">Export JSON (Copy)</button>
    <button class="btn btn-export" onclick="importData()">Import JSON</button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <h2 id="modal-title">WERKZEUG EDITIEREN</h2>
        <div class="modal-grid">
            <div class="input-group"><label>T-NUMMER</label><input type="text" id="m-id" placeholder="T0101"></div>
            <div class="input-group"><label>BESCHREIBUNG</label><input type="text" id="m-nm" placeholder="KOPIERST..."></div>
            <div class="input-group"><label>DURCHMESSER / INFO</label><input type="text" id="m-dia"></div>
            <div class="input-group"><label>BEMERKUNG</label><input type="text" id="m-bem"></div>
            <div class="check-group"><input type="checkbox" id="m-rev"> <label for="m-rev" style="margin:0; font-size: 12px;">REVOLVER UNTEN START ↓</label></div>
            <div class="check-group"><input type="checkbox" id="m-sonder"> <label for="m-sonder" style="margin:0; font-size: 12px;">SONDERWERKZEUG</label></div>
        </div>
        <div class="modal-actions">
            <button class="btn-delete" id="btn-del-tool">LÖSCHEN</button>
            <button class="btn-save" onclick="saveTool()">SPEICHERN</button>
        </div>
    </div>
</div>

<div id="print-container"></div>

<script>
let currentData = [{"num":"231598","name":"BUCHSE","lzf":"4Min 25Sek","sag":"1010MM","stt":"70","stn":"50","mat":"F75 D36","abs":"","grf":"25-31","tools":[{"id":"T0101","nm":"KOPIERST.R0.8 VBMT G54","dia":"","bem":"FACH B","rev":false,"isSonder":false},{"id":"T1010","nm":"WP-BO D19.5 G54","dia":"","bem":"","rev":false,"isSonder":true},{"id":"T1216","nm":"STANGENANSCHLAG G54","dia":"","bem":"NACHSCHUBLANGE 500","rev":true,"isSonder":false}]}];
let job = currentData[0];
let editingIndex = null;

function init() { renderMeta(); renderTools(); }

function renderMeta() {
    const container = document.getElementById('meta-container');
    container.innerHTML = `
        <div class="input-group full-width"><label>TEILENUMMER</label><input type="text" id="job-num" value="${job.num}" onchange="updateMeta('num', this.value)"></div>
        <div class="input-group full-width"><label>BENENNUNG</label><input type="text" id="job-name" value="${job.name}" onchange="updateMeta('name', this.value)"></div>
        <div class="input-group"><label>LAUFZEIT</label><input type="text" value="${job.lzf}" onchange="updateMeta('lzf', this.value)"></div>
        <div class="input-group"><label>MATERIAL</label><input type="text" value="${job.mat}" onchange="updateMeta('mat', this.value)"></div>
        <div class="input-group"><label>SÄGELÄNGE</label><input type="text" value="${job.sag}" onchange="updateMeta('sag', this.value)"></div>
        <div class="input-group"><label>STÜCKZAHL</label><input type="text" value="${job.stn}" onchange="updateMeta('stn', this.value)"></div>
    `;
}

function updateMeta(key, value) { job[key] = value; }

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = '';
    job.tools.forEach((t, index) => {
        const card = document.createElement('div');
        card.className = 'tool-card';
        card.onclick = () => openModal(index);
        card.innerHTML = `
            <div class="tool-info">
                <div class="t-nr">${t.id} ${t.rev ? '<span style="color:#FF3B30;">(UNTEN)</span>' : ''}</div>
                <div class="desc">${t.nm}</div>
            </div>
            <div class="tool-controls">
                <button class="btn-move" onclick="moveTool(event, ${index}, -1)" ${index === 0 ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24"><polyline points="18 15 12 9 6 15"></polyline></svg>
                </button>
                <button class="btn-move" onclick="moveTool(event, ${index}, 1)" ${index === job.tools.length - 1 ? 'disabled' : ''}>
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"></polyline></svg>
                </button>
            </div>
        `;
        list.appendChild(card);
    });
}

function moveTool(event, index, direction) {
    event.stopPropagation();
    const target = index + direction;
    [job.tools[index], job.tools[target]] = [job.tools[target], job.tools[index]];
    renderTools();
}

function openModal(index) {
    editingIndex = index;
    const t = job.tools[index];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('m-rev').checked = t.rev;
    document.getElementById('m-sonder').checked = t.isSonder;
    document.getElementById('btn-del-tool').onclick = () => { deleteTool(index); closeModal(); };
    document.getElementById('edit-modal').classList.add('active');
}

function closeModal() { document.getElementById('edit-modal').classList.remove('active'); }

function saveTool() {
    if (editingIndex !== null) {
        job.tools[editingIndex] = {
            id: document.getElementById('m-id').value.toUpperCase(),
            nm: document.getElementById('m-nm').value.toUpperCase(),
            dia: document.getElementById('m-dia').value,
            bem: document.getElementById('m-bem').value.toUpperCase(),
            rev: document.getElementById('m-rev').checked,
            isSonder: document.getElementById('m-sonder').checked
        };
        renderTools(); closeModal();
    }
}

function deleteTool(index) { if(confirm('Löschen?')) { job.tools.splice(index, 1); renderTools(); } }
function addNewTool() { job.tools.push({id:"T0000", nm:"NEUES WERKZEUG", dia:"", bem:"", rev:false, isSonder:false}); renderTools(); openModal(job.tools.length-1); }

function exportData() {
    const jsonStr = JSON.stringify([job], null, 0);
    navigator.clipboard.writeText(jsonStr).then(() => alert("Kopiert!"));
}

function importData() {
    const input = prompt("JSON:");
    if (input) { try { const parsed = JSON.parse(input); job = parsed[0]; init(); } catch (e) { alert("Error!"); } }
}

function makePDF() {
    const p = job; 
    const getHead = () => `
        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px; min-height:100px;">
            <div>
                <div style="font-size:18px; font-weight:900; text-transform:uppercase; color:#000;">${p.name || ''}</div>
                <div style="font-size:90px; font-weight:900; line-height:0.8; letter-spacing:-4px;">${p.num || ''}</div>
            </div>
            <div style="width:250px; font-size:12px; font-weight:800; line-height:1.7;">
                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>LAUFZEIT</span><span>${p.lzf || ''}</span></div>
                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>MATERIAL</span><span>${p.mat || ''}</span></div>
                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>SÄGELÄNGE</span><span>${p.sag || ''}</span></div>
                <div style="display:flex; justify-content:space-between;"><span>STÜCKZAHL</span><span>${p.stt || ''} / ${p.stn || ''}</span></div>
            </div>
        </div><div style="border-bottom:7px solid #000; margin-bottom:12px;"></div>`;

    const getRow = (t) => `
        <div style="display:flex; align-items:center; border-bottom:1.5px solid #000; padding:8px 0;">
            <div style="width:95px; font-weight:900; font-size:20px;">${t.id}</div>
            <div style="flex:1;">
                <div style="font-weight:800; font-size:17px; text-transform:uppercase;">${t.nm}</div>
                <div style="font-size:9px; font-weight:800;">${t.isSonder ? 'SONDERWERKZEUG' : 'STANDARD'} ${t.bem ? ' | '+t.bem : ''}</div>
            </div>
            <div style="width:135px; text-align:right; font-weight:900; font-size:16px;">${(t.dia || '').replace('/','<br>')}</div>
        </div>`;

    let oben = [], unten = [], reached = false;
    job.tools.forEach(t => { if(t.rev) reached = true; if(reached) unten.push(t); else oben.push(t); });

    const tableHead = `<div style="display:flex; font-size:11px; font-weight:900; text-transform:uppercase; margin-bottom:5px;">
        <div style="width:95px;">T-NR</div><div style="flex:1;">WERKZEUGNAME</div><div style="width:135px; text-align:right;">Ø / TOLERANZ</div>
    </div><div style="border-bottom:5px solid #000;"></div>`;

    let html = `<div style="width:210mm; padding:10mm; background:#fff; font-family:sans-serif; box-sizing:border-box;">
        <div style="border:1.5px solid #000; padding:25px; min-height:270mm; display:flex; flex-direction:column; box-sizing:border-box;">
            ${getHead()}
            <div style="flex:1;">
                <div style="font-size:22px; font-weight:900; margin-bottom:8px;">REVOLVER OBEN</div>
                ${tableHead} ${oben.map(getRow).join('')}
            </div>
        </div>
    </div>`;
    
    if(unten.length > 0) {
        html += `<div style="width:210mm; padding:10mm; background:#fff; font-family:sans-serif; box-sizing:border-box; page-break-before:always;">
            <div style="border:1.5px solid #000; padding:25px; min-height:270mm; display:flex; flex-direction:column; box-sizing:border-box;">
                ${getHead()}
                <div style="flex:1;">
                    <div style="font-size:22px; font-weight:900; margin-bottom:8px;">REVOLVER UNTEN</div>
                    ${tableHead} ${unten.map(getRow).join('')}
                </div>
            </div>
        </div>`;
    }
    
    document.getElementById('print-container').innerHTML = html; 
    setTimeout(() => window.print(), 250);
}

document.getElementById('edit-modal').onclick = (e) => { if(e.target.id==='edit-modal') closeModal(); };
init();
</script>
</body>
</html>
