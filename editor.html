<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAKAMURA SMART BUTTONS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #F5F5F7; --card-bg: #FFFFFF; --accent: #1D1D1F; --text-main: #1D1D1F;
            --text-sub: #86868B; --border: #E5E5EA; --danger: #FF3B30; --blue: #007AFF;
            --orange: #FF9500; --note-bg: #F9F9FB;
        }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text-main); display: flex; justify-content: center; min-height: 100vh; }
        .app-container { width: 100%; max-width: 500px; padding: 20px 20px 120px 20px; box-sizing: border-box; }
        
        header h1 { text-align: center; font-size: 26px; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        .section-title { font-size: 10px; font-weight: 900; color: var(--text-sub); text-transform: uppercase; margin: 25px 0 10px 0; }
        
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .input-group { background: var(--card-bg); padding: 10px; border-radius: 14px; border: 2.5px solid var(--border); position: relative; }
        .input-group label { display: block; font-size: 9px; font-weight: 800; color: var(--text-sub); text-transform: uppercase; margin-bottom: 2px; }
        .input-group input { width: 100%; border: none; outline: none; font-size: 15px; font-weight: 700; background: transparent; padding: 0; color: var(--text-main); }
        .full-width { grid-column: span 2; }

        /* ОБУЧАЮЩИЕ КНОПКИ */
        .smart-suggestion { 
            display: none; 
            margin-top: 8px; 
            background: var(--blue); 
            color: white; 
            font-size: 10px; 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-weight: 800; 
            text-transform: uppercase;
            width: fit-content;
        }

        .tool-card { background: var(--card-bg); border: 2.5px solid var(--border); border-radius: 20px; margin-bottom: 10px; overflow: hidden; cursor: pointer; }
        .tool-card.rev-active { border-left: 8px solid var(--orange); }
        .tool-header { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        .t-name { font-size: 17px; font-weight: 800; text-transform: uppercase; }
        .tool-footer { background: var(--note-bg); padding: 8px 15px; border-top: 1px solid var(--border); font-size: 12px; display: flex; gap: 10px; }

        .btn { width: 100%; padding: 16px; border-radius: 16px; font-weight: 900; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: uppercase; font-size: 12px; }
        .btn-add { background: #fff; border: 2.5px dashed var(--border); margin-top: 10px; }
        .btn-primary { background: var(--accent); color: #fff; margin-top: 20px; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-card { background: var(--card-bg); width: 100%; max-width: 400px; border-radius: 26px; padding: 22px; }
        
        .modal-actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 20px; }
        .btn-save { background: var(--accent); color: #fff; border-radius: 14px; font-weight: 800; border: none; }
        .btn-cancel { background: #E5E5EA; border-radius: 14px; font-weight: 800; border: none; }

        #toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--accent); color: #fff; padding: 12px 24px; border-radius: 25px; font-size: 13px; font-weight: 700; transition: 0.3s; z-index: 2000; opacity: 0; }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

<div id="toast">Info</div>

<div class="app-container">
    <header><h1>NAKAMURA <span>EDITOR</span></h1></header>
    <div id="meta-container" class="meta-grid"></div>
    <div class="section-title">WERKZEUGE</div>
    <div id="tool-list"></div>
    <button class="btn btn-add" onclick="addNewTool()">HINZUFÜGEN</button>
    <button class="btn btn-primary" onclick="copyJSON()">JSON KOPIEREN</button>
</div>

<div class="modal-overlay" id="edit-modal">
    <div class="modal-card">
        <div class="meta-grid">
            <div class="input-group full-width"><label>T-NR</label><input type="text" id="m-id"></div>
            <div class="input-group full-width">
                <label>BESCHREIBUNG</label>
                <input type="text" id="m-nm" oninput="checkSmart(this.value)">
                <div id="smart-hint" class="smart-suggestion" onclick="applyHint()"></div>
            </div>
            <div class="input-group"><label>Ø / TOL</label><input type="text" id="m-dia"></div>
            <div class="input-group">
                <label>BEMERKUNG</label>
                <input type="text" id="m-bem">
            </div>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" style="padding:14px" onclick="deleteTool()">DEL</button>
            <button class="btn-save" style="padding:14px" onclick="saveTool()">SPEICHERN</button>
        </div>
        <p style="font-size:9px; color:var(--text-sub); margin-top:15px; text-align:center;">При сохранении связка Beschreibung + Bemerkung запоминается автоматически.</p>
    </div>
</div>

<script>
// Загрузка "мозгов"
let smartMap = JSON.parse(localStorage.getItem('naka_v2')) || { 'KOPIERSTAHL': 'FACH B2' };
let job = {"num":"231598","name":"BUCHSE","lzf":"4M 25S","mat":"F75 D36","tools":[]};
let editingIdx = null;

function checkSmart(val) {
    const key = val.toUpperCase();
    const hint = document.getElementById('smart-hint');
    if (smartMap[key]) {
        hint.innerText = "Auto: " + smartMap[key];
        hint.style.display = "block";
    } else {
        hint.style.display = "none";
    }
}

function applyHint() {
    const key = document.getElementById('m-nm').value.toUpperCase();
    if (smartMap[key]) {
        document.getElementById('m-bem').value = smartMap[key];
        document.getElementById('smart-hint').style.display = "none";
    }
}

function saveTool() {
    const name = document.getElementById('m-nm').value.toUpperCase();
    const note = document.getElementById('m-bem').value.toUpperCase();
    
    if (name && note) {
        smartMap[name] = note; // Запоминаем
        localStorage.setItem('naka_v2', JSON.stringify(smartMap));
    }

    job.tools[editingIdx] = {
        id: document.getElementById('m-id').value.toUpperCase(),
        nm: name,
        dia: document.getElementById('m-dia').value,
        bem: note
    };
    renderTools(); closeModals(); showToast("Gelernt & Gespeichert");
}

function openEditModal(i) {
    editingIdx = i; const t = job.tools[i];
    document.getElementById('m-id').value = t.id;
    document.getElementById('m-nm').value = t.nm;
    document.getElementById('m-dia').value = t.dia || '';
    document.getElementById('m-bem').value = t.bem || '';
    document.getElementById('smart-hint').style.display = "none";
    document.getElementById('edit-modal').classList.add('active');
}

function renderTools() {
    const list = document.getElementById('tool-list');
    list.innerHTML = job.tools.map((t, i) => `
        <div class="tool-card" onclick="openEditModal(${i})">
            <div class="tool-header">
                <div><span style="font-size:10px; font-weight:900; color:var(--text-sub);">${t.id}</span><div class="t-name">${t.nm}</div></div>
                <svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:var(--border);fill:none;stroke-width:3;"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
            <div class="tool-footer" ${!t.bem && !t.dia ? 'style="display:none"' : ''}>
                ${t.dia ? `<b>Ø</b> ${t.dia}` : ''} ${t.bem ? `<span>|</span> ${t.bem}` : ''}
            </div>
        </div>
    `).join('');
}

function renderMeta() {
    document.getElementById('meta-container').innerHTML = `
        <div class="input-group full-width"><label>NR</label><input type="text" value="${job.num}" oninput="job.num=this.value"></div>
        <div class="input-group full-width"><label>NAME</label><input type="text" value="${job.name}" oninput="job.name=this.value"></div>
    `;
}

function addNewTool() {
    job.tools.push({id:"T0000", nm:"", dia:"", bem:""});
    renderTools(); openEditModal(job.tools.length - 1);
}

function deleteTool() {
    job.tools.splice(editingIdx, 1);
    renderTools(); closeModals();
}

function closeModals() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

function showToast(m) {
    const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function copyJSON() {
    navigator.clipboard.writeText(JSON.stringify([job], null, 2)).then(() => showToast("JSON COPIED"));
}

renderMeta(); renderTools();
</script>
</body>
</html>
