 to return half the money if the deal failed, which the brokers deny. Boosie says getting his money back will start once the legal process is underway.",published_at:"2026-10-21T00:00:00Z",effective_at:"2026-10-21T00:00:00Z",date_source:"time_tag",date_confidence:"medium",fetched_at:"2026-10-21T08:10:00Z",lang:"en",tg_views:null,fwd_from:null,similarity:null,date_flags:[]}],current_post:{id:19,cluster_id:20,version:1,mode:"standard",status:"draft",flag_emoji:"\u{1F1FA}\u{1F1F8}",topic_emoji:"\u{1F4B0}",headline:"Boosie Badazz: $600 \u0442\u044B\u0441. \u0437\u0430 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435, \u043A\u043E\u0442\u043E\u0440\u043E\u0433\u043E \u043D\u0435 \u0431\u044B\u043B\u043E",bullets:["\u0412 \u0438\u043D\u0442\u0435\u0440\u0432\u044C\u044E 60 Minutes \u0440\u044D\u043F\u0435\u0440 \u0440\u0430\u0441\u0441\u043A\u0430\u0437\u0430\u043B, \u0447\u0442\u043E \u0437\u0430\u043F\u043B\u0430\u0442\u0438\u043B Jack Burkman \u0438 Jacob Wohl $600 \u0442\u044B\u0441. \u0432\u043F\u0435\u0440\u0451\u0434 \u0437\u0430 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435 \u043E\u0442 \u0414\u043E\u043D\u0430\u043B\u044C\u0434\u0430 \u0422\u0440\u0430\u043C\u043F\u0430.","\u041F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u044F \u043D\u0435 \u0431\u044B\u043B\u043E. \u041F\u043E \u0441\u043B\u043E\u0432\u0430\u043C Boosie, \u043F\u043E\u0441\u0440\u0435\u0434\u043D\u0438\u043A\u0438 \u043E\u0431\u0435\u0449\u0430\u043B\u0438 \u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443, \u0435\u0441\u043B\u0438 \u0441\u0434\u0435\u043B\u043A\u0430 \u0441\u043E\u0440\u0432\u0451\u0442\u0441\u044F, \u2014 \u043E\u043D\u0438 \u044D\u0442\u043E \u043E\u0442\u0440\u0438\u0446\u0430\u044E\u0442.","TMZ \u043E\u043D \u0441\u043A\u0430\u0437\u0430\u043B, \u0447\u0442\u043E \u0440\u0430\u0434, \u0447\u0442\u043E \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0434\u0438\u043B \u0434\u0440\u0443\u0433\u0438\u0445. \u0412\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0442\u044C \u0434\u0435\u043D\u044C\u0433\u0438 \u0431\u0443\u0434\u0435\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0443\u0434, \u043A\u043E\u0433\u0434\u0430 \u043D\u0430\u0447\u043D\u0451\u0442\u0441\u044F \u043F\u0440\u043E\u0446\u0435\u0441\u0441."],summary:"\u0414\u0435\u043D\u044C\u0433\u0438 \u0443\u0448\u043B\u0438 \u0432\u043F\u0435\u0440\u0451\u0434 \u2014 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435 \u0442\u0430\u043A \u0438 \u043D\u0435 \u043F\u0440\u0438\u0448\u043B\u043E.",tags:["\u0421\u043A\u0430\u043D\u0434\u0430\u043B"],sources:[{name:"TMZ",url:"https://www.tmz.com/2026/10/20/boosie-badazz-happy-to-stop-pardon-broker-scams/"}],footnotes:[],body_html:`\u{1F1FA}\u{1F1F8}\u{1F4B0} <b>Boosie Badazz: $600 \u0442\u044B\u0441. \u0437\u0430 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435, \u043A\u043E\u0442\u043E\u0440\u043E\u0433\u043E \u043D\u0435 \u0431\u044B\u043B\u043E</b>

\u25AA\uFE0F \u0412 \u0438\u043D\u0442\u0435\u0440\u0432\u044C\u044E 60 Minutes \u0440\u044D\u043F\u0435\u0440 \u0440\u0430\u0441\u0441\u043A\u0430\u0437\u0430\u043B, \u0447\u0442\u043E \u0437\u0430\u043F\u043B\u0430\u0442\u0438\u043B Jack Burkman \u0438 Jacob Wohl $600 \u0442\u044B\u0441. \u0432\u043F\u0435\u0440\u0451\u0434 \u0437\u0430 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435 \u043E\u0442 \u0414\u043E\u043D\u0430\u043B\u044C\u0434\u0430 \u0422\u0440\u0430\u043C\u043F\u0430.
\u25AA\uFE0F \u041F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u044F \u043D\u0435 \u0431\u044B\u043B\u043E. \u041F\u043E \u0441\u043B\u043E\u0432\u0430\u043C Boosie, \u043F\u043E\u0441\u0440\u0435\u0434\u043D\u0438\u043A\u0438 \u043E\u0431\u0435\u0449\u0430\u043B\u0438 \u0432\u0435\u0440\u043D\u0443\u0442\u044C \u043F\u043E\u043B\u043E\u0432\u0438\u043D\u0443, \u0435\u0441\u043B\u0438 \u0441\u0434\u0435\u043B\u043A\u0430 \u0441\u043E\u0440\u0432\u0451\u0442\u0441\u044F, \u2014 \u043E\u043D\u0438 \u044D\u0442\u043E \u043E\u0442\u0440\u0438\u0446\u0430\u044E\u0442.
\u25AA\uFE0F TMZ \u043E\u043D \u0441\u043A\u0430\u0437\u0430\u043B, \u0447\u0442\u043E \u0440\u0430\u0434, \u0447\u0442\u043E \u043F\u0440\u0435\u0434\u0443\u043F\u0440\u0435\u0434\u0438\u043B \u0434\u0440\u0443\u0433\u0438\u0445. \u0412\u043E\u0437\u0432\u0440\u0430\u0449\u0430\u0442\u044C \u0434\u0435\u043D\u044C\u0433\u0438 \u0431\u0443\u0434\u0435\u0442 \u0447\u0435\u0440\u0435\u0437 \u0441\u0443\u0434, \u043A\u043E\u0433\u0434\u0430 \u043D\u0430\u0447\u043D\u0451\u0442\u0441\u044F \u043F\u0440\u043E\u0446\u0435\u0441\u0441.

<blockquote>\u0414\u0435\u043D\u044C\u0433\u0438 \u0443\u0448\u043B\u0438 \u0432\u043F\u0435\u0440\u0451\u0434 \u2014 \u043F\u043E\u043C\u0438\u043B\u043E\u0432\u0430\u043D\u0438\u0435 \u0442\u0430\u043A \u0438 \u043D\u0435 \u043F\u0440\u0438\u0448\u043B\u043E.</blockquote>
