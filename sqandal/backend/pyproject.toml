[project]
name = "sqandal-radar"
version = "1.0.0"
description = "Мониторинг хип-хоп новостей (RU / DE / US) и генерация постов для Telegram-канала @SQANDALru"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
