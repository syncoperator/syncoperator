# Вотчлист артистов: поднимает приоритет и помогает дедупу не склеивать
# разные истории (если в двух новостях разные артисты — это разные сюжеты).
#
#   name     — основное написание (как в посте)
#   aliases  — другие написания (кириллица/латиница, сокращения)
#   tier     — 1: +10 к приоритету, 2: +3 (по умолчанию 2; веса — в tags.yaml)
#   cs       — искать с учётом регистра (имя = обычное слово: Future, Face, Платина)
#   exclude  — регулярки-исключения: имя внутри такого фрагмента не считается («Future of Battlerap»)
#   footnote — обязательная сноска, которую форматтер добавит в пост,
#              если артист упомянут (например, требование законодательства).
#              Текст сноски — на твоей ответственности, система его не проверяет.
#
# Список — стартовый, правь под свою повестку.

