<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Excellence</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --card-bg: #FFFFFF;
            --accent: #007AFF;
            --text-main: #121212;
            --text-sec: #636366;
            --border: rgba(0, 0, 0, 0.05);
            --shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        body {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }

        /* --- SPLASH: MINIMALIST LUXURY --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .splash-logo {
            width: 100px; /* Smaller, more elegant on splash */
            opacity: 0;
            transform: scale(0.95);
            animation: reveal 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards;
        }

        @keyframes reveal {
            to { opacity: 1; transform: scale(1); }
        }

        /* --- CONTENT WRAPPER --- */
        #content {
            opacity: 0;
            transform: translateY(15px);
            transition: all 1s cubic-bezier(0.19, 1, 0.22, 1);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }

        /* LOGO: 220px refined */
        .hero {
            width: 220px;
            margin-bottom: 32px; /* Controlled intentional gap */
        }

        .main-logo {
            width: 100%;
            height: auto;
            animation: breathe 8s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 5px 15px rgba(0,0,0,0.02)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.06)); }
        }

        /* APP LIST */
        .app-list {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 20px; /* Reduced from 28px for a "stiffer" more premium look */
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .app-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08);
            border-color: rgba(0, 122, 255, 0.1);
        }

        .app-card:active {
            transform: scale(0.98);
        }

        /* TYPOGRAPHY HIERARCHY */
        .t-id {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.12em; /* Elevated tracking */
            margin-bottom: 2px;
        }

        .t-name {
            font-size: 19px;
            font-weight: 600; /* Semi-bold is more expensive than Heavy-bold */
            letter-spacing: -0.02em;
        }

        /* ICON SYSTEM */
        .icon-container {
            width: 42px;
            height: 42px;
            background: #F2F2F7;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            transition: background 0.3s;
        }

        .app-card:hover .icon-container {
            background: var(--accent);
            color: #fff;
        }

        .bottom-gap { height: 100px; }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="splash-logo">
    </div>

    <div id="content">
        <div class="hero">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
        </div>

        <div class="app-list">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div>
                    <div class="t-id">Module 01</div>
                    <div class="t-name">CitiTool</div>
                </div>
                <div class="icon-container">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div>
                    <div class="t-id">Module 02</div>
                    <div class="t-name">Stange</div>
                </div>
                <div class="icon-container">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </a>
        </div>
        <div class="bottom-gap"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    const content = document.getElementById('content');
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 800);
            }, 1200);
        });
    </script>
</body>
</html>
