<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Premium</title>
    <style>
        :root {
            --bg: #0a0a0b;
            --surface: #1c1c1e;
            --accent: #007AFF;
            --text-main: #ffffff;
            --text-dim: #86868b;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ГЛАВНЫЙ ГЕРОЙ - ЛОГОТИП ПО ЦЕНТРУ */
        .hero-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px 20px 40px;
            width: 100%;
            box-sizing: border-box;
        }

        .main-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(0, 122, 255, 0.3));
            margin-bottom: 24px;
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .main-logo:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .brand-title {
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -1.5px;
            margin: 0;
            background: linear-gradient(180deg, #fff 0%, #86868b 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-subtitle {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        /* СПИСОК ПРИЛОЖЕНИЙ */
        .app-container {
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 24px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, transparent 100%);
            opacity: 0;
            transition: opacity 0.4s;
        }

        .app-card:active {
            transform: scale(0.94);
            background: #2c2c2e;
        }

        .app-card:hover::before {
            opacity: 1;
        }

        /* Твой стиль: ID сверху, Name снизу */
        .app-info {
            display: flex;
            flex-direction: column;
            z-index: 1;
        }

        .t-id-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .t-name-label {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .app-icon-box {
            width: 54px;
            height: 54px;
            background: var(--glass);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            border: 0.5px solid var(--border);
            z-index: 1;
        }

        /* СИСТЕМНАЯ КАРТОЧКА */
        .sys-card {
            background: transparent;
            border: 1px dashed var(--border);
        }

        .bottom-space {
            height: 100px;
            width: 100%;
        }

        /* Анимация появления */
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-card { animation: fadeUp 0.8s ease-out both; }
        .app-card:nth-child(1) { animation-delay: 0.2s; }
        .app-card:nth-child(2) { animation-delay: 0.4s; }
        .app-card:nth-child(3) { animation-delay: 0.6s; }

    </style>
</head>
<body>

    <div class="hero-section">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" alt="CitiHub" class="main-logo">
        <h1 class="brand-title">CitiHub</h1>
        <div class="brand-subtitle">Precision Control</div>
    </div>

    <div class="app-container">
        <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
            <div class="app-info">
                <div class="t-id-label">SYSTEM APP 01</div>
                <div class="t-name-label">CitiTool</div>
            </div>
            <div class="app-icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            </div>
        </a>

        <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
            <div class="app-info">
                <div class="t-id-label">CORE UNIT 02</div>
                <div class="t-name-label">Stange</div>
            </div>
            <div class="app-icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path></svg>
            </div>
        </a>

        <a href="#" class="app-card sys-card" onclick="alert('Data Sync')">
            <div class="app-info">
                <div class="t-id-label">SYSTEM CONFIG</div>
                <div class="t-name-label">Sync Data</div>
            </div>
            <div class="app-icon-box">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            </div>
        </a>
    </div>

    <div class="bottom-space"></div>

</body>
</html>
