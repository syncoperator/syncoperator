<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Premium</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --surface: #F2F5F9;
            --accent: #007AFF;
            --text-main: #000000;
            --text-dim: #86868b;
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* --- ПРЕМИАЛЬНЫЙ SPLASH --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .splash-logo {
            width: 140px;
            animation: splashPulse 2s ease-in-out infinite;
        }

        @keyframes splashPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- КОНТЕНТ --- */
        #content {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            padding-top: 40px; /* Тот самый отступ для воздуха */
            transition: all 1s cubic-bezier(0.2, 1, 0.2, 1);
            transform: translateY(20px);
        }

        /* ЛОГОТИП 220px С АНИМАЦИЕЙ */
        .hero {
            width: 220px;
            margin-bottom: 45px; /* Сбалансированный отступ до карточек */
            position: relative;
        }

        .main-logo {
            width: 100%;
            height: auto;
            /* Плавное покачивание и микро-вращение */
            animation: heroFloat 6s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.03));
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-8px) rotate(1deg); }
            66% { transform: translateY(-4px) rotate(-1deg); }
        }

        /* СЕТКА КАРТОЧЕК */
        .app-grid {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .app-card {
            background: var(--surface);
            border-radius: 26px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: all 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            border: 1px solid rgba(0,0,0,0.01);
        }

        .app-card:active {
            transform: scale(0.96);
            background: #E8EDF3;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        /* T-NR сверху, Описание снизу */
        .t-id {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
        }

        .t-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .icon {
            width: 48px;
            height: 48px;
            background: #fff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.04);
            color: var(--accent);
        }

        /* Кнопка синхронизации (акцентная) */
        .sync-btn {
            background: #000;
            color: #fff;
            margin-top: 10px;
        }
        .sync-btn .t-id { color: #86868b; }
        .sync-btn .icon { background: #1c1c1e; color: #fff; box-shadow: none; }

        .bottom-gap {
            height: 120px;
        }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="splash-logo">
    </div>

    <div id="content">
        <div class="hero">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
        </div>

        <div class="app-grid">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div class="info">
                    <div class="t-id">UNIT-01</div>
                    <div class="t-name">CitiTool</div>
                </div>
                <div class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div class="info">
                    <div class="t-id">UNIT-02</div>
                    <div class="t-name">Stange</div>
                </div>
                <div class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </a>

            <a href="#" class="app-card sync-btn" onclick="location.reload()">
                <div class="info">
                    <div class="t-id">SYSTEM</div>
                    <div class="t-name">Refresh Hub</div>
                </div>
                <div class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                </div>
            </a>
        </div>

        <div class="bottom-gap"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash');
                const content = document.getElementById('content');
                
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 700);
            }, 1600);
        });
    </script>

</body>
</html>
