<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CitiHub</title>

<style>

:root{
 --bg:#f2f3f7;
 --glass:rgba(255,255,255,.55);
 --card:#ffffff;
 --text:#0f1115;
 --sub:#8b8f97;
 --radius:26px;
 --ease:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:radial-gradient(circle at 30% 20%,#ffffff, var(--bg));
 color:var(--text);
 height:100vh;
 overflow:hidden;
}

/* top */

.top{
 position:fixed;
 inset:0 0 auto 0;
 height:64px;
 backdrop-filter:blur(24px);
 background:var(--glass);
 border-bottom:1px solid rgba(0,0,0,.04);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:600;
 letter-spacing:2px;
 font-size:11px;
 color:var(--sub);
 z-index:10;
}

/* bottom */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:90px;
 backdrop-filter:blur(30px);
 background:var(--glass);
 border-top:1px solid rgba(0,0,0,.05);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

/* main */

main{
 padding-top:100px;
 height:100%;
 overflow:auto;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:28px;
 animation:fade 1.2s var(--ease);
}

@keyframes fade{
 from{opacity:0; transform:translateY(20px)}
}

/* logo */

.logo{
 width:210px;
 filter:drop-shadow(0 40px 60px rgba(0,0,0,.12));
 animation:float 7s var(--ease) infinite;
}

@keyframes float{
 50%{transform:translateY(-18px) scale(1.02)}
}

/* cards */

.stack{
 width:92%;
 max-width:420px;
 display:flex;
 flex-direction:column;
 gap:16px;
 padding-bottom:140px;
}

.card{
 background:var(--card);
 border-radius:var(--radius);
 padding:22px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;
 position:relative;
 overflow:hidden;

 box-shadow:
 0 1px 2px rgba(0,0,0,.03),
 0 12px 30px rgba(0,0,0,.06);

 transition:.55s var(--ease);
}

/* liquid hover light */

.card::before{
 content:"";
 position:absolute;
 inset:-40%;
 background:radial-gradient(circle at var(--x) var(--y),
 rgba(255,255,255,.9),transparent 40%);
 opacity:0;
 transition:.6s;
}

.card:hover::before{opacity:1}

.card:hover{
 transform:translateY(-6px) scale(1.01);
 box-shadow:
 0 2px 6px rgba(0,0,0,.05),
 0 30px 70px rgba(0,0,0,.12);
}

/* text */

.label{
 font-size:10px;
 letter-spacing:1.6px;
 color:var(--sub);
 margin-bottom:6px;
 font-weight:600;
}

.title{
 font-size:22px;
 font-weight:600;
}

/* icon */

.icon{
 width:48px;
 height:48px;
 border-radius:50%;
 background:#f4f5f9;
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.5s var(--ease);
}

.card:hover .icon{
 background:#111;
 color:#fff;
 transform:scale(1.15) rotate(6deg);
}

/* nav icons */

.nav{
 width:52px;
 height:52px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#8d9198;
 transition:.4s;
}

.nav.active{
 color:#111;
 transform:scale(1.15);
}

/* scrollbar */

::-webkit-scrollbar{width:0}

</style>
</head>
<body>

<div class="top">CITIHUB INTERFACE</div>

<main>

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="#">
<div>
<div class="label">MODULE 01</div>
<div class="title">CitiTool</div>
</div>
<div class="icon">⚙️</div>
</a>

<a class="card" href="#">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>
<div class="icon">⏱</div>
</a>

</div>
</main>

<div class="bottom">
<div class="nav active">▦</div>
<div class="nav">◐</div>
<div class="nav">⚙</div>
</div>

<script>

/* hover light position */

document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect()
  card.style.setProperty("--x",(e.clientX-r.left)+"px")
  card.style.setProperty("--y",(e.clientY-r.top)+"px")
 })
})

</script>

</body>
</html>
