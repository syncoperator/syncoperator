<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>CitiHub OS</title>

<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/stange/index.html">
<link rel="prefetch" href="https://romarfbozz.github.io/syncoperator/index.html">

<style>
:root {
    --bg: #F2F2F7;
    --surface: #FFFFFF;
    --text: #1C1C1E;
    --muted: #8E8E93;
    --accent: #007AFF;
    --line: rgba(0,0,0,0.04);
    --shadow: 0 20px 40px rgba(0,0,0,0.06);
}

* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
}

/* --- ИНТРО (ЭФФЕКТ ПРИСУТСТВИЯ) --- */
#intro {
    position: fixed; inset: 0;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    z-index: 10000;
}

.intro-text {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(180deg, #000 0%, #666 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
    transform: translateY(10px);
    animation: reveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

@keyframes reveal {
    50% { opacity: 1; transform: translateY(0); }
    100% { opacity: 0; transform: translateY(-10px); }
}

/* --- ВЕРХНЯЯ ПАНЕЛЬ --- */
.header {
    height: 50px;
    background: rgba(255,255,255,0.7);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; letter-spacing: 2px;
    color: var(--muted);
    z-index: 100;
}

/* --- ОСНОВНОЙ КОНТЕНТ --- */
main {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 120px;
    opacity: 0;
    transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1);
    scrollbar-width: none;
}
main::-webkit-scrollbar { display: none; }

/* ЛОГОТИП (ФИЗИКА) */
.hero {
    perspective: 1000px;
    margin-bottom: 30px;
}

.logo {
    width: 220px;
    filter: drop-shadow(0 30px 50px rgba(0,0,0,0.12));
    transition: transform 0.1s ease-out; /* Плавность для JS */
    will-change: transform;
}

/* КАРТОЧКИ (LUXE) */
.stack {
    width: 100%;
    max-width: 390px;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    padding: 20px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
}

.card:active {
    transform: scale(0.97);
    background: #F2F2F7;
}

.label {
    font-size: 10px;
    font-weight: 700;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 2px;
    text-transform: uppercase;
}

.title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.4px;
}

.icon {
    width: 48px; height: 48px;
    border-radius: 16px;
    background: #F9F9FB;
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    transition: 0.3s;
    color: var(--text);
}

.card:hover .icon {
    background: var(--text);
    color: #fff;
}

/* --- ФУТЕР --- */
.footer {
    position: fixed; bottom: 0; width: 100%;
    height: 80px;
    background: rgba(255,255,255,0.8);
    backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around; align-items: center;
    padding-bottom: 20px;
    z-index: 100;
}

.nav {
    color: var(--muted);
    transition: 0.3s;
}

.nav.active { color: var(--text); transform: scale(1.1); }

</style>
</head>
<body>

<div id="intro">
    <div class="intro-text">CITIHUB</div>
</div>

<header class="header">SYSTEM INTERFACE 2.6</header>

<main id="main">
    <div class="hero">
        <img class="logo" id="parallax-logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" alt="Logo">
    </div>

    <div class="stack">
        <a class="card" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
            <div>
                <div class="label">Module 01</div>
                <div class="title">Werkzeugliste</div>
            </div>
            <div class="icon">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14.7 6.3l2 2 4-4a6 6 0 11-8 8l-7 7a2 2 0 11-3-3l7-7a6 6 0 018-8z"/></svg>
            </div>
        </a>

        <a class="card" href="https://syncoperator.github.io/syncoperator/stange/index.html">
            <div>
                <div class="label">Module 02</div>
                <div class="title">Stange</div>
            </div>
            <div class="icon">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </div>
        </a>

        <a class="card" href="https://romarfbozz.github.io/syncoperator/index.html" style="border-color: var(--accent);">
            <div>
                <div class="label" style="color: var(--accent);">System Sync</div>
                <div class="title">SyncOP</div>
            </div>
            <div class="icon" style="color: var(--accent);">
                <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 2v6h-6M3 22v-6h6M3.5 9a9 9 0 0114.8-3.4L21 8M3 16l2.7 2.4A9 9 0 0020.5 15"/></svg>
            </div>
        </a>
    </div>
</main>

<footer class="footer">
    <div class="nav active"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg></div>
    <div class="nav"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg></div>
    <div class="nav"><svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg></div>
</footer>

<script>
// Управление входом
window.addEventListener("load", () => {
    setTimeout(() => {
        const intro = document.getElementById('intro');
        intro.style.opacity = '0';
        intro.style.transition = 'opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
        setTimeout(() => {
            intro.remove();
            document.getElementById('main').style.opacity = '1';
        }, 800);
    }, 1500);
});

// Улучшенный параллакс с инерцией
const logo = document.getElementById('parallax-logo');
let targetX = 0, targetY = 0;
let currentX = 0, currentY = 0;

document.addEventListener("mousemove", (e) => {
    targetX = (window.innerWidth / 2 - e.clientX) / 25;
    targetY = (window.innerHeight / 2 - e.clientY) / 25;
});

function animate() {
    currentX += (targetX - currentX) * 0.1;
    currentY += (targetY - currentY) * 0.1;
    logo.style.transform = `rotateY(${currentX}deg) rotateX(${-currentY}deg)`;
    requestAnimationFrame(animate);
}
animate();

// Прелоад при наведении
document.querySelectorAll(".card").forEach(card => {
    card.addEventListener("touchstart", () => card.style.transform = "scale(0.96)");
    card.addEventListener("touchend", () => card.style.transform = "scale(1)");
});
</script>

</body>
</html>
