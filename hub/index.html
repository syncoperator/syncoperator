<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator // Premium OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="premium-header">
        <div class="header-left">
            <span class="label">System Interface</span>
            <h1>SyncOperator</h1>
        </div>
        <div class="header-right">
            <button class="neu-btn small" onclick="exportData()">Export <b>JSON</b></button>
            <button class="neu-btn small primary" onclick="importData()">Import <b>JSON</b></button>
        </div>
    </header>

    <main class="neu-container" id="draggable-list">
        <div class="neu-card" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="card-inner">
                <span class="t-nr">T-01</span>
                <h2 class="t-name">Stange Calculator</h2>
            </div>
            <div class="card-footer">
                <span class="status-dot"></span> Stable
            </div>
        </div>

        <div class="neu-card" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="card-inner">
                <span class="t-nr">T-02</span>
                <h2 class="t-name">Advanced Liste</h2>
            </div>
            <div class="card-footer">
                <span class="status-dot"></span> Active
            </div>
        </div>

        <div class="neu-card upcoming">
            <div class="card-inner">
                <span class="t-nr">T-03</span>
                <h2 class="t-name">New Module</h2>
            </div>
            <div class="card-footer">Upcoming</div>
        </div>
    </main>

    <div class="bottom-safe-area"></div>

    <script src="ui.js"></script>
</body>
</html>
