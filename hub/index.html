<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitiHub</title>

<style>

/* =========================
   SYSTEM TOKENS
========================= */

:root{

 --space-1:6px;
 --space-2:12px;
 --space-3:18px;
 --space-4:26px;
 --space-5:38px;

 --radius:24px;

 --bg:#f7f9fc;
 --surface:#ffffff;
 --text:#0c0f14;
 --muted:#9198a4;
 --line:rgba(0,0,0,.06);

 --depth-1:0 2px 6px rgba(0,0,0,.05);
 --depth-2:0 16px 40px rgba(0,0,0,.08);
 --depth-3:0 40px 120px rgba(0,0,0,.14);

 --motion:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;margin:0}

body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:radial-gradient(circle at var(--mx) var(--my),#fff,var(--bg));
 color:var(--text);
 height:100vh;
 overflow:hidden;
}

/* =========================
   TOP BAR
========================= */

.top{
 position:fixed;
 width:100%;
 height:64px;
 backdrop-filter:blur(24px);
 background:rgba(255,255,255,.7);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
 letter-spacing:2px;
 color:var(--muted);
 z-index:5;
}

/* =========================
   MAIN
========================= */

main{
 height:100%;
 overflow:auto;
 padding:120px 20px 160px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:var(--space-5);
}

/* =========================
   LOGO
========================= */

.logo{
 width:210px;
 filter:drop-shadow(var(--depth-3));
 animation:float 7s var(--motion) infinite;
}

@keyframes float{
 50%{transform:translateY(-14px)}
}

/* =========================
   STACK
========================= */

.stack{
 width:100%;
 max-width:440px;
 display:flex;
 flex-direction:column;
 gap:var(--space-3);
}

/* =========================
   CARD
========================= */

.card{
 position:relative;
 padding:var(--space-4);
 border-radius:var(--radius);
 background:var(--surface);
 border:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;

 box-shadow:var(--depth-1),var(--depth-2);
 transition:.35s var(--motion);
}

.card:hover{
 transform:translateY(-8px);
 box-shadow:var(--depth-1),var(--depth-3);
}

/* light */

.card::before{
 content:"";
 position:absolute;
 inset:0;
 background:radial-gradient(circle at var(--lx) var(--ly),
 rgba(255,255,255,.9),transparent 45%);
 opacity:0;
 pointer-events:none;
 transition:.3s;
}

.card:hover::before{opacity:1}

/* text */

.label{
 font-size:11px;
 letter-spacing:1.6px;
 color:var(--muted);
 margin-bottom:4px;
 font-weight:600;
}

.title{
 font-size:22px;
 font-weight:600;
}

/* icon */

.icon{
 width:54px;
 height:54px;
 border-radius:50%;
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.3s;
}

.card:hover .icon{
 background:#0c0f14;
 transform:scale(1.1);
}

.card:hover svg{stroke:#fff}

/* =========================
   BOTTOM BAR
========================= */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:96px;
 backdrop-filter:blur(26px);
 background:rgba(255,255,255,.75);
 border-top:1px solid var(--line);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav{
 width:56px;
 height:56px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#98a0ad;
 transition:.3s;
}

.nav.active{
 color:#0c0f14;
 transform:scale(1.2);
}

::-webkit-scrollbar{display:none}

</style>
</head>
<body>

<div class="top">CITIHUB</div>

<main>

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="#">
<div>
<div class="label">MODULE 01</div>
<div class="title">CitiTool</div>
</div>

<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<path d="M14.7 6.3l2 2 4-4a6 6 0 11-8 8l-7 7a2 2 0 11-3-3l7-7a6 6 0 018-8z"/>
</svg>
</div>
</a>

<a class="card" href="#">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>

<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</div>
</a>

</div>
</main>

<div class="bottom">

<div class="nav active">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7"/>
<rect x="14" y="3" width="7" height="7"/>
<rect x="14" y="14" width="7" height="7"/>
<rect x="3" y="14" width="7" height="7"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.7 1.7 0 01.3 1.8"/>
</svg>
</div>

</div>

<script>

document.addEventListener("mousemove",e=>{
 document.body.style.setProperty("--mx",e.clientX+"px")
 document.body.style.setProperty("--my",e.clientY+"px")
})

document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect()
  card.style.setProperty("--lx",(e.clientX-r.left)+"px")
  card.style.setProperty("--ly",(e.clientY-r.top)+"px")
 })
})

</script>

</body>
</html>
