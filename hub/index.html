<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator // Premium Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

<header class="hub-header">
    <div class="header-main">
        <span class="system-label">SyncOperator OS v3.0</span>
        <h1>Control Center</h1>
    </div>
    <div class="hub-controls">
        <button class="control-btn" onclick="exportData()">
            <span class="small-label">Export</span>
            <b>JSON</b>
        </button>
        <button class="control-btn primary" onclick="importData()">
            <span class="small-label">Import</span>
            <b>JSON</b>
        </button>
    </div>
</header>

<main class="fluid-grid" id="drag-zone">
    <div class="premium-tile" onclick="window.location.href='https://syncoperator.github.io/syncoperator/stange.html'">
        <div class="tile-header">
            <span class="t-nr">T-01</span>
            <div class="status-pulse"></div>
        </div>
        <div class="tile-visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
        </div>
        <h2 class="t-name">Stange Calculator</h2>
    </div>

    <div class="premium-tile" onclick="window.location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
        <div class="tile-header">
            <span class="t-nr">T-02</span>
            <div class="status-pulse"></div>
        </div>
        <div class="tile-visual">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 6h16M4 10h16M4 14h16M4 18h16"/></svg>
        </div>
        <h2 class="t-name">Advanced Liste</h2>
    </div>
</main>

<div class="footer-spacer">
    <p>DRAG CARDS TO REORDER • DESIGNED FOR SYNC OPERATOR</p>
</div>

<script src="ui.js"></script>
</body>
</html>
