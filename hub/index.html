<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Excellence</title>
    <style>
        :root {
            --bg: #F5F5F7;
            --surface: #FFFFFF;
            --text-main: #1D1D1F;
            --text-dim: #86868B;
            --border: rgba(0, 0, 0, 0.03);
            --shadow-soft: 0 8px 30px rgba(0,0,0,0.04);
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-main);
            overflow: hidden; height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- LOADING: THE WHITE VOID --- */
        #splash {
            position: fixed; inset: 0;
            background: #fff;
            display: flex; align-items: center; justify-content: center;
            z-index: 2000;
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-logo {
            width: 80px;
            opacity: 0;
            animation: emerge 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes emerge {
            0% { opacity: 0; filter: blur(10px); transform: scale(0.9); }
            50% { opacity: 1; filter: blur(0); transform: scale(1); }
            100% { opacity: 0; filter: blur(5px); transform: scale(1.05); }
        }

        /* --- UI FRAME --- */
        .top-bar {
            position: fixed; top: 0; width: 100%;
            height: 50px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; font-weight: 700; letter-spacing: 2px;
            text-transform: uppercase; color: var(--text-dim);
        }

        .bottom-bar {
            position: fixed; bottom: 0; width: 100%;
            height: 75px;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around;
            z-index: 100;
        }

        /* --- CONTENT --- */
        #main-view {
            opacity: 0;
            display: flex; flex-direction: column; align-items: center;
            padding-top: 70px; height: 100%;
            transition: opacity 1.5s ease;
        }

        /* ЛОГОТИП 220px: Скульптурная анимация */
        .hero {
            position: relative;
            width: 220px;
            margin-bottom: 30px; /* Идеальный отступ */
        }

        .main-logo {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 5;
            /* Эффект дыхания без свечения */
            animation: sculptureMove 10s ease-in-out infinite;
            filter: drop-shadow(0 15px 35px rgba(0,0,0,0.06));
        }

        @keyframes sculptureMove {
            0%, 100% { transform: translateY(0) scale(1) rotate(0); }
            50% { transform: translateY(-10px) scale(1.01) rotate(0.5deg); }
        }

        /* Скрытая подложка для "глубины" */
        .hero::after {
            content: '';
            position: absolute; bottom: -20px; left: 15%; width: 70%; height: 10px;
            background: rgba(0,0,0,0.03);
            filter: blur(10px);
            border-radius: 50%;
            animation: shadowPulse 10s ease-in-out infinite;
        }

        @keyframes shadowPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.2; }
        }

        /* --- CARDS: PRECISION DESIGN --- */
        .scroll-container {
            width: 90%; max-width: 400px;
            display: flex; flex-direction: column;
            gap: 12px;
            padding-bottom: 120px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 18px 20px;
            display: flex; justify-content: space-between; align-items: center;
            text-decoration: none; color: inherit;
            box-shadow: var(--shadow-soft);
            transition: all 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .card:active {
            transform: scale(0.975);
            background: #F2F2F7;
        }

        .info-group { display: flex; flex-direction: column; }

        .t-id {
            font-size: 9px; font-weight: 700; color: var(--text-dim);
            letter-spacing: 1.2px; text-transform: uppercase; margin-bottom: 3px;
        }

        .t-name {
            font-size: 20px; font-weight: 600; color: var(--text-main);
            letter-spacing: -0.4px;
        }

        .icon-circle {
            width: 42px; height: 42px;
            background: #F2F2F7;
            border-radius: 50%; /* Круглые иконки — классика премиума */
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            transition: all 0.3s;
        }

        .card:hover .icon-circle {
            background: var(--text-main);
            color: #fff;
        }

        /* Кнопки в футере */
        .nav-icon {
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            color: var(--text-dim);
            transition: color 0.3s;
        }
        .nav-icon.active { color: var(--text-main); }

    </style>
</head>
<body>

    <div id="splash">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="splash-logo">
    </div>

    <div class="top-bar">CitiHub Command Center</div>

    <main id="main-view">
        <div class="hero">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
        </div>

        <div class="scroll-container">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="card">
                <div class="info-group">
                    <span class="t-id">Module 01</span>
                    <span class="t-name">CitiTool</span>
                </div>
                <div class="icon-circle">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="card">
                <div class="info-group">
                    <span class="t-id">Module 02</span>
                    <span class="t-name">Stange</span>
                </div>
                <div class="icon-circle">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </a>
        </div>
    </main>

    <footer class="bottom-bar">
        <div class="nav-icon active">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div class="nav-icon">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </div>
        <div class="nav-icon">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </footer>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('main-view').style.opacity = '1';
                }, 1000);
            }, 2500);
        });
    </script>
</body>
</html>
