<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub MONOLITH 2026</title>
    <style>
        :root {
            --bg: #F0F2F5; /* Очень светлый, почти белый фон */
            --surface: #ffffff;
            --accent: #007AFF;
            --text-main: #1C1C1E;
            --text-dim: #8E8E93;
            --shadow-light: 0 10px 40px rgba(0, 0, 0, 0.08);
            --border-light: rgba(0, 0, 0, 0.05);
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            overflow-x: hidden;
            height: 100%;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        /* --- SPLASH SCREEN (ПРЕМИУМ-ЗАГРУЗКА) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; /* Черный фон для контраста */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 1;
            visibility: visible;
            transition: opacity 1s ease-in-out, visibility 1s; /* Дольше, плавнее */
        }

        .splash-logo {
            width: 250px; /* Большой логотип на сплэше */
            height: auto;
            opacity: 0;
            animation: splashFadeIn 1s ease-out forwards, pulseLight 2s infinite ease-in-out 1s; /* Плавное появление и пульсация */
            filter: drop-shadow(0 0 40px rgba(0, 122, 255, 0.4)); /* Эффект свечения */
        }

        @keyframes splashFadeIn {
            0% { opacity: 0; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseLight {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- ГЛАВНЫЙ КОНТЕНТ (СКРЫТ ДО ЗАГРУЗКИ) --- */
        #main-content {
            opacity: 0;
            transform: translateY(40px); /* Появляется снизу */
            transition: opacity 1s ease-out 0.5s, transform 1s ease-out 0.5s; /* Задержка и плавная анимация */
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px; /* Отступ сверху */
        }

        /* Монументальный логотип */
        .hero-branding {
            margin-bottom: 60px; /* Больше отступа */
            position: relative;
        }

        .main-logo {
            width: 300px; /* ОГРОМНЫЙ ЛОГОТИП (500px может быть слишком для мобильных) */
            height: auto;
            filter: drop-shadow(0 20px 60px rgba(0,0,0,0.1)); /* Глубокая тень */
            animation: logoScaleIn 1s ease-out forwards; /* Анимация появления */
        }

        @keyframes logoScaleIn {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* Сетка приложений */
        .app-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 24px; /* Увеличиваем отступы */
            width: 90%;
            max-width: 480px; /* Шире, для воздуха */
            margin-bottom: 120px; /* Отступ снизу */
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border-light);
            border-radius: 36px; /* Более скругленные края */
            padding: 28px; /* Больше внутреннего отступа */
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            box-shadow: var(--shadow-light);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); /* Быстрее, отзывчивее */
            position: relative;
            overflow: hidden;
        }

        .app-card::before { /* Эффект блика при наведении */
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.5s ease-out;
        }

        .app-card:hover::before {
            left: 100%;
        }

        .app-card:active {
            transform: scale(0.97); /* Чуть более заметный клик */
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }

        /* Текст: T-NR сверху, Название снизу */
        .info-stack {
            display: flex;
            flex-direction: column;
        }

        .t-id-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1.5px; /* Больше пространства между буквами */
            margin-bottom: 6px;
        }

        .t-name-label {
            font-size: 26px; /* Крупнее название */
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.8px; /* Меньше для плотности */
        }

        .icon-box {
            width: 60px; /* Больше иконки */
            height: 60px;
            background: var(--accent); /* Акцентный цвет для иконок */
            border-radius: 20px;
            display: flex;
            align-items: center; justify-content: center;
            color: #ffffff; /* Белые иконки на акцентном фоне */
            box-shadow: 0 5px 20px rgba(0, 122, 255, 0.3); /* Тень под иконкой */
            animation: iconPulse 3s infinite ease-in-out; /* Легкая пульсация */
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        /* Адаптация для больших экранов */
        @media (min-width: 768px) {
            .app-grid {
                grid-template-columns: repeat(2, 1fr); /* Две колонки на планшетах */
            }
            .main-logo { width: 400px; } /* Ещё больше на больших экранах */
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" class="splash-logo">
    </div>

    <div id="main-content">
        <div class="hero-branding">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" class="main-logo">
        </div>

        <div class="app-grid">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div class="info-stack">
                    <div class="t-id-label">APP-01</div>
                    <div class="t-name-label">CitiTool</div>
                </div>
                <div class="icon-box">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div class="info-stack">
                    <div class="t-id-label">APP-02</div>
                    <div class="t-name-label">Stange</div>
                </div>
                <div class="icon-box">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </a>

            <a href="#" class="app-card">
                <div class="info-stack">
                    <div class="t-id-label">SYSTEM</div>
                    <div class="t-name-label">Cloud Sync</div>
                </div>
                <div class="icon-box">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            // Задержка для демонстрации сплэш-скрина
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const content = document.getElementById('main-content');
                
                // Плавно скрываем сплэш-скрин
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                // Плавно показываем основной контент
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 2500); // Задержка 2.5 секунды
        });
    </script>

</body>
</html>
