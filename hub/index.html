<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
        }

        body { 
            background: var(--bg); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-primary);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--border);
            padding: 20px;
            position: sticky; top: 0; z-index: 1000;
            text-align: center;
        }

        .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
        .header-sub { font-size: 10px; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* Сетка Dashboard */
        .hub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px;
            max-width: 500px;
            margin: 0 auto;
        }

        .hub-card {
            background: var(--surface);
            border-radius: 28px;
            padding: 20px;
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 1;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            position: relative;
            box-sizing: border-box;
        }

        .hub-card:active { transform: scale(0.95); background: #f9f9f9; }

        .t-id-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            margin-bottom: auto;
        }

        .hub-icon {
            margin-bottom: 12px;
            color: var(--accent);
        }

        .t-name-label {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        /* Особая карточка для настроек */
        .action-card { background: #1d1d1f; border: none; }
        .action-card .t-id-label { color: #86868b; }
        .action-card .t-name-label { color: #ffffff; }
        .action-card .hub-icon { color: #ffffff; }

        @media (min-width: 600px) {
            .hub-grid { grid-template-columns: repeat(3, 1fr); max-width: 800px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">CitiHub</div>
    <div class="header-sub">Central Control</div>
</header>

<div class="hub-grid">
    <a href="cititool.html" class="hub-card">
        <div class="t-id-label">APP-01</div>
        <div class="hub-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path>
            </svg>
        </div>
        <div class="t-name-label">CitiTool</div>
    </a>

    <div class="hub-card" style="opacity: 0.6;">
        <div class="t-id-label">APP-02</div>
        <div class="hub-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="20" x2="12" y2="10"></line>
                <line x1="18" y1="20" x2="18" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="16"></line>
            </svg>
        </div>
        <div class="t-name-label">Analytics</div>
    </div>

    <div class="hub-card action-card" onclick="alert('Export/Import logic here')">
        <div class="t-id-label">SYSTEM</div>
        <div class="hub-icon">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
        </div>
        <div class="t-name-label">Sync Data</div>
    </div>
</div>

</body>
</html>
