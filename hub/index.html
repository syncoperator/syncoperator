<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Premium</title>
    <style>
        :root {
            --bg: #FFFFFF;
            --surface: #F2F5F9;
            --accent: #007AFF;
            --text-main: #000000;
            --text-dim: #86868b;
            --shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .splash-img {
            width: 180px;
            animation: breathe 2s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; }
        }

        /* --- MAIN CONTENT --- */
        #content {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.8s ease-out;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px; /* Минимальный верхний отступ */
        }

        /* ЛОГОТИП: 500px ширина, минимальный отступ снизу */
        .hero {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            margin-bottom: -10px; /* Отрицательный отступ для сближения с карточками */
        }

        .main-logo {
            width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* СЕТКА КАРТОЧЕК */
        .app-grid {
            width: 92%;
            max-width: 440px;
            display: grid;
            gap: 12px;
            padding-bottom: 80px;
        }

        .app-card {
            background: var(--surface);
            border-radius: 28px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .app-card:active {
            transform: scale(0.97);
            background: #EBEFF4;
        }

        .info {
            display: flex;
            flex-direction: column;
        }

        .t-id {
            font-size: 10px;
            font-weight: 800;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
        }

        .t-name {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .icon {
            width: 48px;
            height: 48px;
            background: #fff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            color: var(--accent);
        }

    </style>
</head>
<body>

    <div id="splash">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="splash-img">
    </div>

    <div id="content">
        <div class="hero">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
        </div>

        <div class="app-grid">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div class="info">
                    <div class="t-id">APP-01</div>
                    <div class="t-name">CitiTool</div>
                </div>
                <div class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div class="info">
                    <div class="t-id">APP-02</div>
                    <div class="t-name">Stange</div>
                </div>
                <div class="icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </a>

            <a href="#" class="app-card" style="border: 1px dashed #D1D1D6; background: transparent;">
                <div class="info">
                    <div class="t-id">SYSTEM</div>
                    <div class="t-name">Cloud Sync</div>
                </div>
                <div class="icon" style="background: var(--surface);">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </div>
            </a>
        </div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    const content = document.getElementById('content');
                    content.style.opacity = '1';
                    content.style.transform = 'translateY(0)';
                }, 600);
            }, 1500);
        });
    </script>

</body>
</html>
