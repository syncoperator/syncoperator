<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Excellence</title>
    <style>
        :root {
            --bg: #F2F5F9;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-main: #1d1d1f;
            --text-dim: #86868b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            --border: rgba(0, 0, 0, 0.04);
        }

        body {
            background: var(--bg);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- БЛОК ЛОГОТИПА С ЗЕРКАЛОМ --- */
        .hero-branding {
            perspective: 1000px;
            padding: 80px 0 60px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 160px;
            height: auto;
            z-index: 2;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.05));
            animation: logoFloat 4s ease-in-out infinite;
        }

        /* Эффект зеркального отражения */
        .logo-reflection {
            width: 160px;
            height: auto;
            transform: scaleY(-1) translateY(-10px);
            opacity: 0.15;
            mask-image: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,0.8) 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 20%, rgba(0,0,0,0.8) 100%);
            filter: blur(2px);
            pointer-events: none;
            user-select: none;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* --- СЕТКА ПРИЛОЖЕНИЙ --- */
        .app-grid {
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            display: grid;
            gap: 16px;
            box-sizing: border-box;
        }

        .app-card {
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: 28px;
            padding: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:active {
            transform: scale(0.95);
            background: #fafafa;
            box-shadow: 0 5px 15px rgba(0,0,0,0.03);
        }

        /* T-NR сверху, Название снизу */
        .info-stack {
            display: flex;
            flex-direction: column;
        }

        .t-id-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .t-name-label {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        /* Иконка-кнопка */
        .icon-btn {
            width: 52px;
            height: 52px;
            background: #F8FAFD;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            border: 1px solid var(--border);
            box-shadow: inset 0 2px 4px #fff, 0 4px 8px rgba(0,0,0,0.03);
        }

        .bottom-gap {
            height: 120px;
        }
    </style>
</head>
<body>

    <div class="hero-branding">
        <div class="logo-wrapper">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" alt="CitiHub Logo" class="main-logo">
            <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" alt="Reflection" class="logo-reflection">
        </div>
    </div>

    <div class="app-grid">
        <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
            <div class="info-stack">
                <div class="t-id-label">APP-01</div>
                <div class="t-name-label">CitiTool</div>
            </div>
            <div class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
            </div>
        </a>

        <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
            <div class="info-stack">
                <div class="t-id-label">APP-02</div>
                <div class="t-name-label">Stange</div>
            </div>
            <div class="icon-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
            </div>
        </a>

        <a href="#" class="app-card" style="border-style: dashed; background: transparent; box-shadow: none;" onclick="alert('Cloud Sync Started')">
            <div class="info-stack">
                <div class="t-id-label">SYSTEM</div>
                <div class="t-name-label">Sync Data</div>
            </div>
            <div class="icon-btn" style="background: white;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
            </div>
        </a>
    </div>

    <div class="bottom-gap"></div>

</body>
</html>
