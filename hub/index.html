<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Dashboard</title>
    <style>
        :root {
            --bg: #f5f5f7;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 40px rgba(0,0,0,0.08);
        }

        body { 
            background: var(--bg); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text-primary);
            margin: 0; padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 0.5px solid var(--border);
            padding: 15px 20px;
            position: sticky; top: 0; z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-container { display: flex; align-items: center; gap: 12px; }
        .logo-img { height: 32px; width: auto; border-radius: 6px; }
        .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

        .hub-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .hub-card {
            background: var(--surface);
            border-radius: 24px;
            padding: 20px;
            border: 0.5px solid var(--border);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            aspect-ratio: 1 / 0.9;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            color: inherit;
            box-sizing: border-box;
        }

        .hub-card:active { transform: scale(0.96); background: #fafafa; }

        /* Правило T-NR сверху, Описание снизу */
        .t-id-label {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .hub-icon {
            margin: auto 0;
            color: var(--text-primary);
        }

        .t-name-label {
            font-size: 18px;
            font-weight: 800;
            line-height: 1.2;
            letter-spacing: -0.2px;
        }

        .action-card { background: #1d1d1f; border: none; }
        .action-card .t-id-label { color: #86868b; }
        .action-card .t-name-label, .action-card .hub-icon { color: #ffffff; }

        /* Отступ снизу для предотвращения перекрытия */
        .bottom-padding { height: 100px; }
    </style>
</head>
<body>

<header>
    <div class="logo-container">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" alt="Logo" class="logo-img">
        <div class="header-title">CitiHub</div>
    </div>
</header>

<div class="hub-grid">
    <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="hub-card">
        <div class="t-id-label">APP-01</div>
        <div class="hub-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
                <polyline points="10 9 9 9 8 9"></polyline>
            </svg>
        </div>
        <div class="t-name-label">CitiTool<br>Manager</div>
    </a>

    <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="hub-card">
        <div class="t-id-label">APP-02</div>
        <div class="hub-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path>
                <path d="M22 12A10 10 0 0 0 12 2v10z"></path>
            </svg>
        </div>
        <div class="t-name-label">Stange<br>Optimizer</div>
    </a>

    <div class="hub-card action-card" onclick="alert('JSON Management')">
        <div class="t-id-label">SYSTEM</div>
        <div class="hub-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
        </div>
        <div class="t-name-label">Cloud<br>Sync</div>
    </div>
</div>

<div class="bottom-padding"></div>

</body>
</html>
