<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator Premium Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="premium-header">
        <h1>SyncOperator <span class="thin">Dashboard</span></h1>
        <div class="data-controls">
            <button onclick="exportJSON()" class="btn-outline">Export JSON</button>
            <button onclick="importJSON()" class="btn-outline">Import JSON</button>
        </div>
    </header>

    <main id="tools-container" class="tools-grid">
        <div class="tool-card" data-id="1" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="t-nr">T-01</div>
            <div class="t-name">Stange Calculator</div>
        </div>

        <div class="tool-card" data-id="2" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="t-nr">T-02</div>
            <div class="t-name">Advanced Liste</div>
        </div>
    </main>

    <div class="bottom-spacer"></div>

    <script src="ui.js"></script>
</body>
</html>
