<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator // Ultra Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="hub-header">
        <div class="logo-area">
            <h1>SyncOperator</h1>
            <p>System Management</p>
        </div>
        <div class="actions">
            <button class="neu-btn" onclick="exportData()">Export <span>JSON</span></button>
            <button class="neu-btn primary" onclick="importData()">Import <span>JSON</span></button>
        </div>
    </header>

    <main class="grid-container" id="draggable-list">
        <div class="neu-card" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="card-inner">
                <span class="t-nr">T-01</span>
                <h2 class="t-name">Stange Calculator</h2>
            </div>
            <div class="card-status">Stable</div>
        </div>

        <div class="neu-card" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="card-inner">
                <span class="t-nr">T-02</span>
                <h2 class="t-name">Advanced Liste</h2>
            </div>
            <div class="card-status">Active</div>
        </div>

        <div class="neu-card disabled">
            <div class="card-inner">
                <span class="t-nr">T-03</span>
                <h2 class="t-name">New Module</h2>
            </div>
            <div class="card-status">Upcoming</div>
        </div>
    </main>

    <div class="safe-bottom-padding"></div>

    <script src="ui.js"></script>
</body>
</html>
