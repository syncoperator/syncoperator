<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <div class="bg-glow"></div>

    <header class="main-header">
        <div class="brand">
            <span class="logo-dot"></span>
            <h1>SYNC OPERATOR <small>SYSTEM</small></h1>
        </div>
        
        <div class="system-controls">
            <button onclick="exportData()" class="glass-btn">
                <span>JSON</span> EXPORT
            </button>
            <button onclick="importData()" class="glass-btn">
                <span>JSON</span> IMPORT
            </button>
        </div>
    </header>

    <main id="draggable-zone" class="grid-layout">
        
        <div class="tool-tile" data-url="https://syncoperator.github.io/syncoperator/stange.html">
            <div class="tile-content">
                <span class="t-nr">T-01</span>
                <h2 class="t-name">STANGE CALCULATOR</h2>
            </div>
            <div class="tile-status">READY</div>
        </div>

        <div class="tool-tile" data-url="https://syncoperator.github.io/syncoperator/liste2/index.html">
            <div class="tile-content">
                <span class="t-nr">T-02</span>
                <h2 class="t-name">ADVANCED LISTE</h2>
            </div>
            <div class="tile-status">ACTIVE</div>
        </div>

        <div class="tool-tile placeholder">
            <div class="tile-content">
                <span class="t-nr">T-XX</span>
                <h2 class="t-name">ADD NEW TOOL</h2>
            </div>
        </div>

    </main>

    <footer class="bottom-safe-area">
        <p>SYSTEM STATUS: OPTIMIZED • DRAG & DROP ENABLED</p>
    </footer>

    <script src="ui.js"></script>
</body>
</html>
