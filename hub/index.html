<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Premium</title>
    <style>
        :root {
            --bg: #F2F5F9;
            --surface: #ffffff;
            --accent: #007AFF;
            --text-main: #1d1d1f;
            --text-dim: #86868b;
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.06);
            --border: rgba(0, 0, 0, 0.04);
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            min-height: 100vh;
        }

        /* --- SPLASH SCREEN (ЗАГРУЗКА) --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.8s;
        }

        .splash-logo {
            width: 120px;
            height: auto;
            animation: pulse 2s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .loader-bar {
            width: 140px;
            height: 2px;
            background: rgba(0,0,0,0.05);
            margin-top: 30px;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }

        .loader-progress {
            position: absolute;
            width: 40%;
            height: 100%;
            background: var(--accent);
            animation: loadMove 1.5s infinite linear;
        }

        @keyframes loadMove {
            0% { left: -40%; }
            100% { left: 140%; }
        }

        /* --- ГЛАВНЫЙ КОНТЕНТ --- */
        #main-content {
            opacity: 0;
            transform: translateY(20px);
            transition: all 1s ease-out;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-branding {
            padding: 60px 0 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-logo {
            width: 150px;
            height: auto;
            z-index: 2;
            animation: logoFloat 4s ease-in-out infinite;
        }

        .logo-reflection {
            width: 150px;
            height: auto;
            transform: scaleY(-1) translateY(-10px);
            opacity: 0.12;
            mask-image: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.8) 100%);
            -webkit-mask-image: linear-gradient(to bottom, transparent 30%, rgba(0,0,0,0.8) 100%);
            filter: blur(2px);
            pointer-events: none;
        }

        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* КАРТОЧКИ */
        .app-grid {
            width: 100%;
            max-width: 440px;
            padding: 0 20px;
            display: grid;
            gap: 16px;
            box-sizing: border-box;
        }

        .app-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 22px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .app-card:active { transform: scale(0.96); background: #fafafa; }

        .t-id-label {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .t-name-label {
            font-size: 22px;
            font-weight: 900;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: #F8FAFD;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .bottom-gap { height: 100px; }
    </style>
</head>
<body>

    <div id="splash-screen">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" class="splash-logo">
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <div id="main-content">
        <div class="hero-branding">
            <div class="logo-wrapper">
                <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" class="main-logo">
                <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/IMG_2810.png" class="logo-reflection">
            </div>
        </div>

        <div class="app-grid">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div class="info-stack">
                    <div class="t-id-label">APP-01</div>
                    <div class="t-name-label">CitiTool</div>
                </div>
                <div class="icon-btn">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div class="info-stack">
                    <div class="t-id-label">APP-02</div>
                    <div class="t-name-label">Stange</div>
                </div>
                <div class="icon-btn">
                    <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                </div>
            </a>
        </div>

        <div class="bottom-gap"></div>
    </div>

    <script>
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                const content = document.getElementById('main-content');
                
                splash.style.opacity = '0';
                splash.style.visibility = 'hidden';
                
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 2000); // 2 секунды заставки
        });
    </script>

</body>
</html>
