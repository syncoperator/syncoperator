<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub OS</title>
    <style>
        :root {
            --bg: #F8F9FA;
            --glass: rgba(255, 255, 255, 0.7);
            --border: rgba(0, 0, 0, 0.04);
            --accent: #007AFF;
            --text: #1D1D1F;
        }

        body, html {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            color: var(--text);
            height: 100%;
            overflow: hidden;
        }

        /* --- SPLASH SCREEN --- */
        #splash {
            position: fixed;
            inset: 0;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 1s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .splash-logo {
            width: 120px;
            filter: grayscale(1);
            opacity: 0;
            animation: fadeInOut 2.5s ease-in-out forwards;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: scale(0.98); filter: blur(10px); }
            50% { opacity: 1; transform: scale(1); filter: blur(0); }
            100% { opacity: 0; transform: scale(1.02); filter: blur(5px); }
        }

        /* --- LAYOUT: HEAD & FOOT --- */
        .header {
            position: fixed;
            top: 0; width: 100%;
            height: 44px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text);
            opacity: 0.6;
        }

        .footer {
            position: fixed;
            bottom: 0; width: 100%;
            height: 60px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        /* --- MAIN CONTENT --- */
        #main-ui {
            opacity: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 80px;
            height: 100vh;
            overflow-y: auto;
            transition: opacity 1.5s ease;
        }

        /* --- LOGO ENGINE 2.0 --- */
        .hero {
            position: relative;
            width: 220px;
            margin-bottom: 50px;
            perspective: 1000px;
        }

        .logo-box {
            position: relative;
            width: 100%;
            animation: heavyFloat 8s ease-in-out infinite;
        }

        .main-logo {
            width: 100%;
            z-index: 2;
            position: relative;
            filter: drop-shadow(0 20px 40px rgba(0,0,0,0.08));
        }

        /* Эффект "Энергетического ядра" вместо дешевых бликов */
        .logo-core {
            position: absolute;
            top: 50%; left: 50%;
            width: 80%; height: 80%;
            background: radial-gradient(circle, var(--accent) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
            mix-blend-mode: soft-light;
            animation: corePulse 4s ease-in-out infinite;
        }

        @keyframes heavyFloat {
            0%, 100% { transform: translateY(0) rotateX(0); }
            50% { transform: translateY(-15px) rotateX(5deg); }
        }

        @keyframes corePulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.7; transform: translate(-50%, -50%) scale(1.3); }
        }

        /* --- CARDS --- */
        .grid {
            width: 90%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-bottom: 120px;
        }

        .card {
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.03);
        }

        .card:active { transform: scale(0.97); background: #fafafa; }

        .t-id {
            font-size: 9px;
            font-weight: 700;
            color: #86868b;
            letter-spacing: 1.5px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .t-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.5px;
        }

        .icon-wrap {
            width: 44px; height: 44px;
            background: #F2F2F7;
            border-radius: 12px;
            display: flex;
            align-items: center; justify-content: center;
            color: var(--accent);
        }

        /* Кнопка в футере */
        .f-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center; justify-content: center;
            color: #86868b;
        }
    </style>
</head>
<body>

    <div id="splash">
        <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="splash-logo">
    </div>

    <header class="header">System Hub 2.0</header>

    <main id="main-ui">
        <div class="hero">
            <div class="logo-box">
                <div class="logo-core"></div>
                <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
            </div>
        </div>

        <div class="grid">
            <a href="#" class="card">
                <div>
                    <div class="t-id">Module 01</div>
                    <div class="t-name">CitiTool</div>
                </div>
                <div class="icon-wrap">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
            </a>

            <a href="#" class="card">
                <div>
                    <div class="t-id">Module 02</div>
                    <div class="t-name">Stange</div>
                </div>
                <div class="icon-wrap">
                    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </a>
        </div>
    </main>

    <footer class="footer">
        <div class="f-btn">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        </div>
        <div class="f-btn" style="color: var(--accent);">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        </div>
        <div class="f-btn">
            <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </div>
    </footer>

    <script>
        window.onload = () => {
            setTimeout(() => {
                document.getElementById('splash').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('splash').style.display = 'none';
                    document.getElementById('main-ui').style.opacity = '1';
                }, 1000);
            }, 2500);
        };
    </script>
</body>
</html>
