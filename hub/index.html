<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CitiHub Excellence 2026</title>
    <style>
        :root {
            --bg: #FAFAFA;
            --card-bg: rgba(255, 255, 255, 0.8);
            --accent: #007AFF;
            --text-main: #121212;
            --text-sec: #636366;
            --border: rgba(0, 0, 0, 0.04);
            --glow-color: rgba(0, 122, 255, 0.15);
        }

        body {
            background: var(--bg);
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        /* --- ПРЕМИАЛЬНЫЙ ВХОД --- */
        #content {
            opacity: 0;
            transform: translateY(15px);
            transition: all 1.2s cubic-bezier(0.19, 1, 0.22, 1);
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        /* --- LOGO ENGINE (ANIMATIONS) --- */
        .hero {
            position: relative;
            width: 220px;
            margin-bottom: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-container {
            position: relative;
            width: 100%;
            /* Плавное парение */
            animation: heroFloat 6s ease-in-out infinite;
        }

        .main-logo {
            width: 100%;
            height: auto;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.05));
        }

        /* Свечение (Glow) */
        .logo-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 120%; height: 120%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulseGlow 4s ease-in-out infinite;
            pointer-events: none;
        }

        /* Блик-сканер (Scan Flare) */
        .logo-scanner {
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(
                120deg, 
                transparent 30%, 
                rgba(255, 255, 255, 0.6) 50%, 
                transparent 70%
            );
            z-index: 3;
            animation: scanMove 5s infinite cubic-bezier(0.4, 0, 0.2, 1);
            mask-image: url('https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png');
            -webkit-mask-image: url('https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png');
            mask-size: contain;
            -webkit-mask-size: contain;
            mask-repeat: no-repeat;
            -webkit-mask-repeat: no-repeat;
            pointer-events: none;
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(0.5deg); }
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        @keyframes scanMove {
            0% { left: -100%; opacity: 0; }
            20% { opacity: 0.8; }
            40% { left: 100%; opacity: 0; }
            100% { left: 100%; opacity: 0; }
        }

        /* --- CARDS --- */
        .app-list {
            width: 90%;
            max-width: 380px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .app-card {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .app-card:active { transform: scale(0.97); }

        .t-id {
            font-size: 10px;
            font-weight: 700;
            color: var(--text-sec);
            text-transform: uppercase;
            letter-spacing: 0.12em;
            margin-bottom: 2px;
        }

        .t-name {
            font-size: 19px;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .icon-box {
            width: 42px; height: 42px;
            background: #F2F2F7;
            border-radius: 12px;
            display: flex;
            align-items: center; justify-content: center;
            color: var(--accent);
        }

        .bottom-gap { height: 100px; }

    </style>
</head>
<body onload="init()">

    <div id="content">
        <div class="hero">
            <div class="logo-container">
                <div class="logo-glow"></div>
                <img src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png" class="main-logo">
                <div class="logo-scanner"></div>
            </div>
        </div>

        <div class="app-list">
            <a href="https://syncoperator.github.io/syncoperator/liste3/index.html" class="app-card">
                <div>
                    <div class="t-id">Module 01</div>
                    <div class="t-name">CitiTool</div>
                </div>
                <div class="icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
                </div>
            </a>

            <a href="https://syncoperator.github.io/syncoperator/stange/index.html" class="app-card">
                <div>
                    <div class="t-id">Module 02</div>
                    <div class="t-name">Stange</div>
                </div>
                <div class="icon-box">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                </div>
            </a>
        </div>
        <div class="bottom-gap"></div>
    </div>

    <script>
        function init() {
            setTimeout(() => {
                const content = document.getElementById('content');
                content.style.opacity = '1';
                content.style.transform = 'translateY(0)';
            }, 300);
        }
    </script>
</body>
</html>
