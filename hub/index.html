<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F3F5">
<title>CITITOOL SYNCOPERATOR · HUB</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%2064%2064%22%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2215%22%20fill=%22%230B0B0D%22/%3E%3Cg%20fill=%22%23F2F3F5%22%20stroke=%22%23F2F3F5%22%20stroke-width=%221.5%22%20stroke-linejoin=%22round%22%3E%3Cpolygon%20points=%2227.2%2C9.0%2036.8%2C9.0%2034.9%2C15.2%2029.1%2C15.2%22/%3E%3Cpolygon%20points=%2250.0%2C31.8%2045.2%2C40.2%2040.8%2C35.4%2043.7%2C30.4%22/%3E%3Cpolygon%20points=%2218.8%2C40.2%2014.0%2C31.8%2020.3%2C30.4%2023.2%2C35.4%22/%3E%3C/g%3E%3Ccircle%20cx=%2232%22%20cy=%2227%22%20r=%228.2%22%20fill=%22%23F2F3F5%22/%3E%3Ccircle%20cx=%2232%22%20cy=%2227%22%20r=%2219.8%22%20fill=%22none%22%20stroke=%22%23F2F3F5%22%20stroke-width=%222.2%22/%3E%3Cpath%20d=%22M12%2056v-3M16%2056v-2M20%2056v-2M24%2056v-2M28%2056v-2M32%2056v-4M36%2056v-2M40%2056v-2M44%2056v-2M48%2056v-2M52%2056v-3%22%20stroke=%22%23F2F3F5%22%20stroke-width=%221.2%22%20opacity=%22.75%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F2F3F5; --card:#fff; --ink:#0B0B0D; --mute:#6B6F76; --line:#E3E5E9; --tick:#B9BDC4; --alert:#D6342B; --ok:#1F9D55;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#15161A; --card:#1F2025; --ink:#F4F5F7; --mute:#9A9EA6; --line:#2C2E35; --tick:#4A4D56; --alert:#FF6B61; --ok:#4CC380; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);
  padding:max(18px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
.wrap{max-width:780px;margin:0 auto}
a{color:inherit;text-decoration:none}

/* Kopf */
header{display:flex;align-items:center;gap:14px;padding:6px 2px 0}
.logo{width:58px;height:58px;flex:none;color:var(--ink)}
.logo .bg{fill:var(--ink)} .logo .fg{stroke:var(--bg)} .logo .fgf{fill:var(--bg)}
.wm{flex:1;min-width:0}
.wm b{display:block;font-size:clamp(25px,7vw,34px);line-height:1;letter-spacing:-.02em;font-weight:700;text-transform:uppercase}
.wm span{display:block;margin-top:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.34em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.clock{text-align:right;flex:none}
.clock b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1}
.clock span{display:block;margin-top:6px;font-family:var(--mono);font-size:10.5px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.ruler{display:block;width:100%;height:14px;margin:16px 0 14px;color:var(--tick)}

/* Allgemein */
.sec{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;margin:20px 2px 8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px;position:relative;overflow:hidden}
a.card{display:block;transition:transform .18s ease,border-color .18s ease}
@media(hover:hover){a.card:hover{border-color:var(--ink);transform:translateY(-2px)}}
a.card:active{transform:scale(.99)}
.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch .ico{width:40px;height:40px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center;flex:none}
.ch .ico svg{width:23px;height:23px}
.ch b{display:block;font-size:17px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;line-height:1.1}
.ch small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-top:3px}
.ch .go{margin-left:auto;width:20px;height:20px;color:var(--mute);flex:none}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:720px){.grid{grid-template-columns:1fr 1fr}.wide{grid-column:1/-1}}

/* Heute */
.today{display:flex;flex-direction:column;gap:12px}
.live{display:flex;align-items:center;gap:14px;padding:16px;border-radius:18px;background:var(--ink);color:var(--bg)}
.live .pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(31,157,85,.6);animation:pl 1.6s infinite;flex:none}
@keyframes pl{70%{box-shadow:0 0 0 12px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.live b{display:block;font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.live small{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;opacity:.7;margin-top:6px;text-transform:uppercase}
.live .eur{margin-left:auto;text-align:right}
.live .eur b{font-size:22px}
.idle{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;border:1.5px dashed var(--line);color:var(--mute);font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase}
.idle b{color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.kpi{padding:12px 6px 10px;border-radius:14px;background:var(--card);border:1px solid var(--line);text-align:center}
.kpi b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.kpi span{display:block;margin-top:6px;font-family:var(--mono);font-size:8.5px;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.kpi.hot{border-color:var(--alert)}.kpi.hot b{color:var(--alert)}
.kpi.ok b{color:var(--ok)}

/* Zu tun */
.todo{display:flex;flex-direction:column}
.td{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px dashed var(--line)}
.td:last-child{border-bottom:0}
.td i{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tick)}
.td.r i{background:var(--alert)}.td.y i{background:#E0A93B}.td.g i{background:var(--ok)}
.td span{flex:1;min-width:0;font-size:13.5px;line-height:1.3}
.td span small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase;margin-top:2px}
.td em{font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;padding:3px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;text-transform:uppercase;color:var(--mute)}
.allok{display:flex;align-items:center;gap:10px;color:var(--ok);font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase}

/* Fortschritt */
.pb{margin-top:10px;padding-bottom:6px}
.pb-l{display:flex;align-items:baseline;gap:8px;font-size:12.5px;margin-bottom:6px}
.pb-l span{flex:1;color:var(--mute);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.pb-l b{font-family:var(--mono);font-weight:600;font-size:13px}
.pb-l b small{color:var(--mute);font-weight:400;font-size:11px}
.pb-t{position:relative;height:10px;border-radius:5px;background:var(--line);overflow:visible}
.pb-f{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--ink);transition:width .8s cubic-bezier(.2,.7,.2,1)}
.pb-f.ok{background:var(--ok)}.pb-f.behind{background:#E0A93B}
.pb-m{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;border-radius:1px}
.pb-m::after{content:attr(data-l);position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:8.5px;color:var(--mute);white-space:nowrap}
.mini{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;height:46px;align-items:end;margin-top:14px}
.mini i{display:block;border-radius:3px 3px 1px 1px;background:var(--ink);opacity:.8;min-height:2px}
.mini i.now{background:var(--ok);opacity:1}
.mini-l{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--mute);margin-top:4px;letter-spacing:.06em}
.rows{display:flex;flex-direction:column;margin-top:12px}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--line);font-size:12.5px}
.row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.row .n{font-family:var(--mono);font-weight:600;font-size:12px;white-space:nowrap}
.row .n.r{color:var(--alert)}.row .n.g{color:var(--ok)}
.row small{font-family:var(--mono);font-size:10px;color:var(--mute);white-space:nowrap}
.rr{display:flex;gap:3px;width:110px;flex:none}
.rr i{display:block;height:8px;border-radius:3px}
.rr .ro{background:var(--ink)}.rr .ru{background:var(--tick)}
.leg{display:flex;gap:12px;font-family:var(--mono);font-size:9.5px;color:var(--mute);letter-spacing:.08em;margin-top:8px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.stats4 div{padding:9px 4px;border-radius:12px;background:var(--bg);text-align:center}
.stats4 b{display:block;font-family:var(--mono);font-size:19px;font-weight:600;line-height:1}
.stats4 span{display:block;font-family:var(--mono);font-size:8px;letter-spacing:.08em;color:var(--mute);margin-top:5px;text-transform:uppercase}
.stats4 .hot b{color:var(--alert)}
.empty{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;padding:6px 0}

/* Schnellstart */
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.app{display:flex;flex-direction:column;align-items:center;gap:7px;padding:12px 4px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-align:center}
.app .ico{width:40px;height:40px;border-radius:11px;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.app .ico svg{width:22px;height:22px}
.app b{font-size:11px;letter-spacing:.04em;text-transform:uppercase;line-height:1.1}
.app small{font-family:var(--mono);font-size:8.5px;color:var(--mute);letter-spacing:.04em}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--tick)}
.chip.ok i{background:var(--ok)}.chip.warn i{background:var(--alert)}.chip.warn{border-color:var(--alert)}
footer{margin-top:22px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase;text-align:center}
@media(max-width:380px){.wm span{letter-spacing:.2em}.clock b{font-size:19px}.kpi b{font-size:19px}}
@media(prefers-reduced-motion:no-preference){
  .card,.today>*,.apps{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
  .grid .card:nth-child(2){animation-delay:.05s}.grid .card:nth-child(3){animation-delay:.1s}.grid .card:nth-child(4){animation-delay:.15s}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
}
@media(prefers-reduced-motion:reduce){.live .pulse{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="CitiTool SyncOperator">
      <rect class="bg" width="64" height="64" rx="15"/>
      <g class="fgf fg" stroke-width="1.5" stroke-linejoin="round"><polygon points="27.2,9.0 36.8,9.0 34.9,15.2 29.1,15.2"/><polygon points="50.0,31.8 45.2,40.2 40.8,35.4 43.7,30.4"/><polygon points="18.8,40.2 14.0,31.8 20.3,30.4 23.2,35.4"/></g>
      <circle class="fgf" cx="32" cy="27" r="8.2"/>
      <circle class="fg" cx="32" cy="27" r="19.8" fill="none" stroke-width="2.2"/>
      <path class="fg" d="M12 56h40" stroke-width="1.3" opacity=".5" fill="none"/>
      <path class="fg" d="M12 56v-3M16 56v-2M20 56v-2M24 56v-2M28 56v-2M32 56v-4M36 56v-2M40 56v-2M44 56v-2M48 56v-2M52 56v-3" stroke-width="1.2" opacity=".75" fill="none"/>
    </svg>
    <div class="wm"><b>CitiTool</b><span>Syncoperator</span></div>

  <div class="sec">Übersicht</div>
  <main class="grid">
    <a class="card" id="cEinsatz" data-id="shift" href="nakamura/ruesten.html"></a>
    <a class="card" id="cLager" data-id="order" href="nakamura/bestellen/index.html"></a>
    <a class="card" id="cCiti" data-id="citi" href="nakamura/nakamura2.html"></a>
    <a class="card" id="cMpf" data-id="mpf" href="ctx/indexm.html"></a>
  </main>

  <div class="sec">Öffnen</div>
  <nav class="apps" id="apps"></nav>

  <div class="foot" id="foot"></div>
  <footer>Nur für mich · Daten bleiben in diesem Browser</footer>
</div>

<script>
(function(){
  var DAY=864e5, $=function(i){return document.getElementById(i)};
  var ls=function(k){try{return localStorage.getItem(k)||''}catch(e){return ''}};
  var js=function(k,d){try{var v=JSON.parse(ls(k));return v==null?d:v}catch(e){return d}};
  var arr=function(k){var v=js(k,[]);return Array.isArray(v)?v:[]};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
  var pad=function(n){return String(n).padStart(2,'0')};
  var eur=function(v){return (v||0).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:0})+' €'};
  var eur2=function(v){return (v||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})+' €'};
  var hmin=function(m){m=Math.round(m);return Math.floor(m/60)+':'+pad(m%60)};
  var dd=function(ts){return new Date(ts).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'})};
  var ago=function(ts){if(!ts)return 'noch nie';var d=Math.floor((Date.now()-ts)/DAY);return d<=0?'heute':d===1?'gestern':'vor '+d+' Tagen'};
  var IC={
    shift:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 8.5V13l3 2M9.5 2.5h5"/></svg>',
    order:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2 10.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.1L20 8H6.2"/><circle cx="9.5" cy="19.2" r="1.2"/><circle cx="17" cy="19.2" r="1.2"/></svg>',
    citi:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m8 7-5 5 5 5M16 7l5 5-5 5M13.5 5l-3 14"/></svg>',
    mpf:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13M3 12h18M3 17h13"/><path d="m18 5 3 2-3 2M18 15l3 2-3 2"/></svg>'
  };
  var GO='<svg class="go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M9 7h8v8"/></svg>';
  var head=function(id,t,s){return '<div class="ch"><span class="ico">'+IC[id]+'</span><span><b>'+t+'</b><small>'+s+'</small></span>'+GO+'</div>'};
  var bar=function(label,val,goal,fmtv,fmtg,marker,cls){
    var p=goal?Math.min(100,val/goal*100):0, m=marker!=null&&goal?Math.min(100,marker*100):null;
    return '<div class="pb"><div class="pb-l"><span>'+label+'</span><b>'+fmtv+(goal?' <small>/ '+fmtg+'</small>':'')+'</b></div><div class="pb-t"><div class="pb-f '+(cls||'')+'" style="width:'+(goal?Math.max(p,1.5):0)+'%"></div>'+(m!=null?'<div class="pb-m" style="left:'+m+'%" data-l="HEUTE"></div>':'')+'</div></div>';
  };

  // Lineal
  var d='';for(var i=0;i<=100;i++){var x=i*4,h=i%10===0?14:i%5===0?9:5;d+='M'+x+' 14V'+(14-h)}$('rl').setAttribute('d',d);

  // ======== EINSATZ (syncop_einsatz_v1) ========
  function einsatz(){
    var db=js('syncop_einsatz_v1',null); if(!db) return null;
    var st=db.settings||{}, now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(), m1=new Date(now.getFullYear(),now.getMonth()+1,1).getTime();
    var calc=function(ms,s){s=s||st;var raw=Math.max(0,ms)/60000,r=+s.round||0;var min=r>1?Math.ceil(raw/r-1e-9)*r:Math.round(raw);var h=min/60,lohn=h*(+s.rate||0),brutto=(+s.pausch||0)+lohn,pct=((+s.tax||0)+(+s.soz||0))/100,abz=(s.pauschTax?brutto:lohn)*pct;return{min:min,brutto:brutto,netto:brutto-abz}};
    var es=(db.entries||[]).filter(function(e){return +e.start>=m0&&+e.start<m1&&+e.end>+e.start});
    var sum=0,min=0; es.forEach(function(e){var c=calc(e.end-e.start,e.s);sum+=c.netto;min+=c.min});
    var run=db.running&&+db.running.start?db.running:null, live=run?calc(Date.now()-run.start,run.s):null;
    var last=(db.entries||[]).slice().sort(function(a,b){return b.start-a.start})[0];
    var dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
    return{st:st,es:es,sum:sum,min:min,days:es.length,run:run,live:live,last:last,calc:calc,frac:now.getDate()/dim,goal:+st.goal||0,goalDays:+st.goalDays||0,goalMin:+st.goalMin||0,lastBackup:+db.lastBackup||0};
  }
  // ======== BESTELLLISTE ========
  function lager(){
    var items=arr('syncop_bestellliste_v1'),lib=arr('syncop_bestellliste_lib_v1'),orders=arr('syncop_bestellliste_orders_v1'),moves=arr('syncop_bestellliste_moves_v1');
    if(!items.length&&!lib.length&&!orders.length) return null;
    var rd=parseInt(ls('syncop_bestellliste_remind')||'3',10),now=Date.now();
    var cart=items.filter(function(i){return i.status==='bedarf'});
    var sent=items.filter(function(i){return i.status==='gesendet'});
    var late=sent.filter(function(i){var t=Math.max(i.sentAt||0,i.remindedAt||0);return t&&(now-t)/DAY>=rd});
    var q=function(v){var m=String(v==null?'':v).match(/\d+/);return m?+m[0]:0};
    var low=lib.filter(function(t){return typeof t.stock==='number'&&q(t.min)>0&&t.stock<=q(t.min)});
    var d0=new Date();d0.setHours(0,0,0,0);var t0=d0.getTime();
    var aus=moves.filter(function(m){return m.kind==='aus'});
    var days=[];for(var k=13;k>=0;k--){var a=t0-k*DAY,b=a+DAY;days.push(aus.filter(function(m){return m.ts>=a&&m.ts<b}).reduce(function(s,m){return s+Math.abs(m.qty)},0))}
    var nm=function(id){var t=lib.find(function(x){return x.id===id});return t?((t.type&&!String(t.name||'').toUpperCase().startsWith(t.type)?'':'')+(t.name||'')):'–'};
    var open=orders.filter(function(o){return (o.itemIds||[]).some(function(id){var it=items.find(function(i){return i.id===id});return it&&it.status==='gesendet'})});
    return{items:items,lib:lib,orders:orders,moves:moves,cart:cart,sent:sent,late:late,low:low,days:days,today:days[13],week:days.slice(7).reduce(function(a,b){return a+b},0),open:open,nm:nm,lastBackup:+ls('syncop_bestellliste_lastbackup')||0,rd:rd};
  }
  // ======== CITITOOL ========
  function citi(){
    var db=arr('CITITOOL_2026'), brain=js('CITITOOL_BRAIN_2026',{}); if(!db.length) return null;
    var ps=db.filter(function(p){return (p.oben||[]).length||(p.unten||[]).length||p.num||p.name});
    return{ps:ps,lib:(brain.library||[]).length,lastBackup:+ls('CT_LASTBK')||0};
  }
  // ======== MPF VISUAL (Struktur wird erkannt) ========
  function mpf(){
    var keys=['CitiTool_SO_v12_m','CitiTool_SO_v12'],raw='',key='';
    for(var i=0;i<keys.length;i++){raw=ls(keys[i]);if(raw){key=keys[i];break}}
    if(!raw) return null;
    var d; try{d=JSON.parse(raw)}catch(e){return{key:key,size:raw.length,ps:[]}}
    var pick=function(o){if(Array.isArray(o))return o;if(!o||typeof o!=='object')return null;var c=['projects','projekte','list','items','data','plans'];for(var j=0;j<c.length;j++)if(Array.isArray(o[c[j]]))return o[c[j]];return null};
    var ps=pick(d)||(d&&typeof d==='object'&&(d.ops||d.operations||d.tools||d.werkzeuge)?[d]:[]);
    var len=function(o,names){for(var j=0;j<names.length;j++){var v=o&&o[names[j]];if(Array.isArray(v))return v.length;if(v&&typeof v==='object'){var n=0;for(var k in v)if(Array.isArray(v[k]))n+=v[k].length;if(n)return n}}return 0};
    ps=ps.filter(function(p){return p&&typeof p==='object'}).map(function(p){return{
      name:p.name||p.titel||p.title||p.teil||p.num||p.nr||p.projekt||'',
      ops:len(p,['ops','operations','plan','schritte','steps']),
      tools:len(p,['tools','werkzeuge','wkz','toolList','tl']),
      ts:+(p.updated||p.changed||p.ts||p.date||0)}});
    return{key:key,size:raw.length,ps:ps};
  }

  function render(){
    var E=einsatz(),L=lager(),C=citi(),M=mpf(),now=Date.now();
    // ---- Heute: laufender Einsatz
    if(E&&E.run){ $('live').innerHTML='<a class="live" href="nakamura/ruesten.html" data-id="shift"><span class="pulse"></span><span><b id="liveT">0:00:00</b><small>Einsatz läuft · seit '+new Date(E.run.start).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})+'</small></span><span class="eur"><b id="liveE">–</b><small>netto ≈</small></span></a>'; }
    else $('live').innerHTML='<a class="idle" href="nakamura/ruesten.html" data-id="shift">'+IC.shift.replace('<svg','<svg width="20" height="20"')+'<span>Kein Einsatz aktiv'+(E&&E.last?' · zuletzt <b>'+dd(E.last.start)+'</b>':'')+'</span></a>';
    // ---- KPIs
    var k=[];
    k.push(['Netto Monat',E?eur(E.sum+(E.live?E.live.netto:0)):'–',E&&E.goal&&E.sum>=E.goal?'ok':'']);
    k.push(['Zu bestellen',L?L.cart.length:'–',L&&L.cart.length?'':'']);
    k.push(['Überfällig',L?L.late.length:'–',L&&L.late.length?'hot':'']);
    k.push(['Unter Min',L?L.low.length:'–',L&&L.low.length?'hot':'']);
    $('kpis').innerHTML=k.map(function(x){return '<div class="kpi '+x[2]+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('');
    // ---- Zu tun
    var td=[];
    if(L&&L.late.length) td.push(['r',L.late.length+(L.late.length===1?' Position':' Positionen')+' überfällig','Bestellung nachfragen','Bestellliste','nakamura/bestellen/index.html']);
    if(L&&L.low.length) td.push(['r',L.low.length+' Werkzeug'+(L.low.length===1?'':'e')+' unter Mindestbestand',L.low.slice(0,3).map(function(t){return t.name}).join(' · '),'Lager','nakamura/bestellen/index.html']);
    if(L&&L.cart.length){var old=L.cart.filter(function(i){return now-(i.createdAt||now)>DAY}).length;td.push([old?'y':'',L.cart.length+' auf der Bestellliste',old?'liegt seit über einem Tag – senden':'noch nicht gesendet','Bestellliste','nakamura/bestellen/index.html']);}
    if(E&&E.goal){var exp=E.goal*E.frac,have=E.sum;if(have<exp*0.85&&E.frac>0.15)td.push(['y','Einsatz-Plan: '+eur(exp-have)+' hinter dem Soll','Ziel '+eur(E.goal)+' · bisher '+eur(have),'Einsatz','nakamura/ruesten.html']);else if(have>=E.goal)td.push(['g','Monatsziel erreicht',eur(have)+' von '+eur(E.goal),'Einsatz','nakamura/ruesten.html']);}
    var bk=[['Bestellliste',L&&L.lastBackup,L,'nakamura/bestellen/index.html'],['Einsatz',E&&E.lastBackup,E,'nakamura/ruesten.html'],['CitiTool',C&&C.lastBackup,C,'nakamura/nakamura2.html']];
    bk.forEach(function(b){if(!b[2])return;var age=b[1]?Math.floor((now-b[1])/DAY):null;if(age===null||age>14)td.push(['y','Backup '+b[0]+(age===null?' noch nie':' vor '+age+' Tagen'),'Daten liegen nur in diesem Browser',b[0],b[3]])});
    $('todo').innerHTML=td.length?td.map(function(t){return '<a class="td '+t[0]+'" href="'+t[4]+'"><i></i><span>'+esc(t[1])+'<small>'+esc(t[2])+'</small></span><em>'+esc(t[3])+'</em></a>'}).join(''):'<div class="allok"><svg width="20" height="20" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="9"/><path d="M7 11.5l2.6 2.5L15 8.5"/></svg>Alles erledigt</div>';
    // ---- Einsatz-Karte
    var mn=new Date().toLocaleDateString('de-DE',{month:'long'}).toUpperCase();
    if(E){var tot=E.sum+(E.live?E.live.netto:0),totMin=E.min+(E.live?E.live.min:0);
      var cls=function(v,g){return g&&v>=g?'ok':g&&v<g*E.frac*0.85?'behind':''};
      $('cEinsatz').innerHTML=head('shift','Einsatz','Monatsplan · '+mn)+
        bar('Netto',tot,E.goal,eur(tot),eur(E.goal),E.frac,cls(tot,E.goal))+
        bar('Tage',E.days+(E.run?1:0),E.goalDays,String(E.days+(E.run?1:0)),String(E.goalDays),E.frac,cls(E.days,E.goalDays))+
        bar('Zeit',totMin,E.goalMin,hmin(totMin)+' h',hmin(E.goalMin)+' h',E.frac,cls(totMin,E.goalMin))+
        (E.goal||E.goalDays||E.goalMin?'':'<div class="empty" style="margin-top:8px">Kein Monatsziel gesetzt – in Einsatz unter Plan</div>')+
        '<div class="rows">'+E.es.slice().sort(function(a,b){return b.start-a.start}).slice(0,3).map(function(e){var c=E.calc(e.end-e.start,e.s);return '<div class="row"><span class="t">'+new Date(e.start).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'})+(e.note?' · '+esc(e.note):'')+'</span><small>'+hmin(c.min)+' h</small><span class="n g">'+eur2(c.netto)+'</span></div>'}).join('')+'</div>';
    } else $('cEinsatz').innerHTML=head('shift','Einsatz','Arbeitszeit & Verdienst')+'<div class="empty">Noch keine Daten in diesem Browser</div>';
    // ---- Lager-Karte
    if(L){var mx=Math.max(1,Math.max.apply(null,L.days));
      $('cLager').innerHTML=head('order','Bestellliste & Lager',L.lib.length+' Werkzeuge · '+L.orders.length+' Bestellungen')+
        '<div class="stats4"><div><b>'+L.cart.length+'</b><span>Liste</span></div><div><b>'+L.sent.length+'</b><span>Unterwegs</span></div><div class="'+(L.late.length?'hot':'')+'"><b>'+L.late.length+'</b><span>Überfällig</span></div><div class="'+(L.low.length?'hot':'')+'"><b>'+L.low.length+'</b><span>Unter Min</span></div></div>'+
        (L.moves.length?'<div class="mini">'+L.days.map(function(n,i){return '<i class="'+(i===13?'now':'')+'" style="height:'+(n?Math.max(8,n/mx*100):3)+'%"></i>'}).join('')+'</div><div class="mini-l"><span>AUSGABE 14 TAGE</span><span>HEUTE '+L.today+' · 7 T '+L.week+'</span></div>':'')+
        (L.open.length?'<div class="rows">'+L.open.slice(0,3).map(function(o){var its=(o.itemIds||[]).map(function(id){return L.items.find(function(i){return i.id===id})}).filter(Boolean),got=its.filter(function(i){return i.status==='geliefert'}).length;var w=Math.floor((now-o.sentAt)/DAY);return '<div class="row"><span class="t">'+esc(o.nr)+(o.to?' · '+esc(o.to):'')+'</span><small>'+got+'/'+its.length+'</small><span class="n '+(w>=L.rd?'r':'')+'">'+w+' T</span></div>'}).join('')+'</div>':'');
    } else $('cLager').innerHTML=head('order','Bestellliste & Lager','Werkzeug bestellen & ausgeben')+'<div class="empty">Noch keine Daten in diesem Browser</div>';
    // ---- CitiTool-Karte
    if(C){var cmx=Math.max(1,Math.max.apply(null,C.ps.map(function(p){return (p.oben||[]).length+(p.unten||[]).length})));
      $('cCiti').innerHTML=head('citi','CitiTool',C.ps.length+' Projekte · '+C.lib+' im Werkzeug-Gedächtnis')+
        '<div class="rows">'+C.ps.slice(-5).reverse().map(function(p){var ro=(p.oben||[]).length,ru=(p.unten||[]).length;return '<div class="row"><span class="t">'+esc([p.num,p.name].filter(Boolean).join(' · ')||'OHNE NAME')+'</span><span class="rr"><i class="ro" style="width:'+(ro/cmx*100)+'%"></i><i class="ru" style="width:'+(ru/cmx*100)+'%"></i></span><small>'+ro+'/'+ru+'</small></div>'}).join('')+'</div><div class="leg"><span><i style="background:var(--ink)"></i>RO OBEN</span><span><i style="background:var(--tick)"></i>RU UNTEN</span></div>';
    } else $('cCiti').innerHTML=head('citi','CitiTool','Nakamura WT-250 II')+'<div class="empty">Noch keine Projekte in diesem Browser</div>';
    // ---- MPF-Karte
    if(M&&M.ps.length){var omx=Math.max(1,Math.max.apply(null,M.ps.map(function(p){return p.ops+p.tools})));
      $('cMpf').innerHTML=head('mpf','MPF Visual',M.ps.length+' Projekte · CTX 350')+'<div class="rows">'+M.ps.slice(-5).reverse().map(function(p){return '<div class="row"><span class="t">'+esc(p.name||'PROJEKT')+'</span><span class="rr"><i class="ro" style="width:'+(p.ops/omx*100)+'%"></i><i class="ru" style="width:'+(p.tools/omx*100)+'%"></i></span><small>'+p.ops+' OP · '+p.tools+' WZ</small></div>'}).join('')+'</div><div class="leg"><span><i style="background:var(--ink)"></i>OPERATIONEN</span><span><i style="background:var(--tick)"></i>WERKZEUGE</span></div>';
    } else $('cMpf').innerHTML=head('mpf','MPF Visual','DMG MORI CTX 350')+'<div class="empty">'+(M?'Daten gefunden ('+Math.round(M.size/1024)+' KB) – Übersicht folgt':'Noch keine Daten in diesem Browser')+'</div>';
    // ---- Schnellstart + zuletzt geöffnet
    var used=js('syncop_hub_used',{});
    var apps=[['shift','Einsatz','nakamura/ruesten.html'],['order','Bestellen','nakamura/bestellen/index.html'],['citi','CitiTool','nakamura/nakamura2.html'],['mpf','MPF Visual','ctx/indexm.html']];
    $('apps').innerHTML=apps.map(function(a){return '<a class="app" data-id="'+a[0]+'" href="'+a[2]+'"><span class="ico">'+IC[a[0]]+'</span><b>'+a[1]+'</b><small>'+ago(used[a[0]]).toUpperCase()+'</small></a>'}).join('');
    // ---- Fuß
    var f=[];bk.forEach(function(b){if(!b[2])return;var age=b[1]?Math.floor((now-b[1])/DAY):null;f.push('<span class="chip '+(age===null||age>14?'warn':'ok')+'"><i></i>Backup '+b[0]+': '+(age===null?'noch keins':ago(b[1]))+'</span>')});
    var sc=ls('syncop_bestellliste_synccode');f.push('<span class="chip '+(sc?'ok':'')+'"><i></i>Sync Bestellliste: '+(sc?'an':'aus')+'</span>');
    $('foot').innerHTML=f.join('');
    window.__E=E;
  }
  function tick(){
    var t=new Date();$('clk').textContent=t.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
    $('date').textContent=t.toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});
    var E=window.__E;if(E&&E.run&&$('liveT')){var ms=Date.now()-E.run.start,s=Math.floor(ms/1000);$('liveT').textContent=Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60);$('liveE').textContent=eur2(E.calc(ms,E.run.s).netto)}
  }
  document.addEventListener('click',function(e){var a=e.target.closest('[data-id]');if(!a)return;var u=js('syncop_hub_used',{});u[a.dataset.id]=Date.now();try{localStorage.setItem('syncop_hub_used',JSON.stringify(u))}catch(x){}});
  render();tick();setInterval(tick,1000);setInterval(render,60000);
  window.addEventListener('storage',render);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)render()});
  window.addEventListener('pageshow',render);
})();
</script>
