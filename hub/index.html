<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator Premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <h1>Sync Operator</h1>
            <div class="actions">
                <button onclick="exportData()" class="action-btn">Export JSON</button>
                <button onclick="importData()" class="action-btn">Import JSON</button>
            </div>
        </div>
    </header>

    <section class="scroll-container" id="draggable-zone">
        
        <div class="apple-card" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="card-info">
                <span class="t-nr">T-01</span>
                <h2 class="t-name">Stange Calculator</h2>
                <p class="description">Professional tool for precise structural calculations and synchronization.</p>
                <span class="link-mock">Open app →</span>
            </div>
            <div class="image-wrapper">
                <img src="https://www.apple.com/v/iphone/home/bu/images/overview/select/iphone_15_pro__dqdbbb8unmue_large.png" alt="Tool 1">
            </div>
        </div>

        <div class="apple-card" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="card-info">
                <span class="t-nr">T-02</span>
                <h2 class="t-name">Advanced Liste</h2>
                <p class="description">Now with enhanced sorting and real-time data management features.</p>
                <span class="link-mock">Open app →</span>
            </div>
            <div class="image-wrapper">
                <img src="https://www.apple.com/v/iphone/home/bu/images/overview/select/iphone_15__er9cl7un6766_large.png" alt="Tool 2">
            </div>
        </div>

    </section>

    <div class="bottom-padding"></div>

    <script src="ui.js"></script>
</body>
</html>
