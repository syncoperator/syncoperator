<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitiHub</title>

<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/stange/index.html">
<link rel="prefetch" href="https://romarfbozz.github.io/syncoperator/index.html">

<style>

:root{
 --bg:#f6f8fc;
 --surface:#fff;
 --text:#0c0f14;
 --muted:#96a0ad;
 --line:rgba(0,0,0,.06);
 --radius:24px;
}

*{box-sizing:border-box;margin:0}

body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:#f6f8fc;
 color:var(--text);
 height:100vh;
 overflow:hidden;
}

/* intro */

#intro{
 position:fixed;
 inset:0;
 background:white;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:9999;
}

.intro-text{
 font-size:46px;
 font-weight:700;
 letter-spacing:.5px;
 opacity:0;
 transform:scale(.94);
 animation:intro .9s cubic-bezier(.16,1,.3,1) forwards;
}

@keyframes intro{
 40%{opacity:1; transform:scale(1)}
 100%{opacity:0; transform:scale(1.04)}
}

/* top */

.top{
 position:fixed;
 width:100%;
 height:60px;
 backdrop-filter:blur(20px);
 background:rgba(255,255,255,.8);
 border-bottom:1px solid rgba(0,0,0,.05);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
 letter-spacing:2px;
 color:#98a0ad;
 z-index:5;
}

/* main */

main{
 height:100%;
 overflow:auto;
 padding:110px 20px 130px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:34px;
 opacity:0;
 transition:opacity .8s;
}

/* logo */

.logo{
 width:200px;
 transition:transform .25s cubic-bezier(.16,1,.3,1);
 filter:drop-shadow(0 30px 60px rgba(0,0,0,.18));
}

/* stack */

.stack{
 width:100%;
 max-width:420px;
 display:flex;
 flex-direction:column;
 gap:20px;
}

/* cards */

.card{
 padding:24px;
 border-radius:var(--radius);
 background:var(--surface);
 border:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;
 box-shadow:0 2px 6px rgba(0,0,0,.05),
            0 20px 50px rgba(0,0,0,.08);
 transition:.3s cubic-bezier(.16,1,.3,1);
}

.card:hover{
 transform:translateY(-6px);
 box-shadow:0 4px 12px rgba(0,0,0,.08),
            0 30px 70px rgba(0,0,0,.12);
}

.label{
 font-size:11px;
 letter-spacing:1.5px;
 color:#98a0ad;
 margin-bottom:4px;
 font-weight:600;
}

.title{
 font-size:22px;
 font-weight:600;
}

.icon{
 width:54px;
 height:54px;
 border-radius:50%;
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.3s;
}

.card:hover .icon{
 background:#0c0f14;
 transform:scale(1.1);
}

.card:hover svg{stroke:white}

/* bottom */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:72px;
 backdrop-filter:blur(20px);
 background:rgba(255,255,255,.9);
 border-top:1px solid rgba(0,0,0,.05);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav{
 width:50px;
 height:50px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#98a0ad;
 transition:.25s;
}

.nav.active{
 color:#0c0f14;
 transform:scale(1.18);
}

::-webkit-scrollbar{display:none}

</style>
</head>
<body>

<div id="intro">
<div class="intro-text">CitiTool</div>
</div>

<div class="top">CITIHUB</div>

<main id="main">

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
<div>
<div class="label">MODULE 01</div>
<div class="title">Werkzeugliste</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<path d="M14.7 6.3l2 2 4-4a6 6 0 11-8 8l-7 7a2 2 0 11-3-3l7-7a6 6 0 018-8z"/>
</svg>
</div>
</a>

<a class="card" href="https://syncoperator.github.io/syncoperator/stange/index.html">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</div>
</a>

<a class="card" href="https://romarfbozz.github.io/syncoperator/index.html">
<div>
<div class="label">SYSTEM</div>
<div class="title">SyncOP</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<rect x="4" y="4" width="16" height="16" rx="3"/>
<path d="M8 12h8"/>
</svg>
</div>
</a>

</div>
</main>

<div class="bottom">

<div class="nav active">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7"/>
<rect x="14" y="3" width="7" height="7"/>
<rect x="14" y="14" width="7" height="7"/>
<rect x="3" y="14" width="7" height="7"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<circle cx="12" cy="12" r="3"/>
</svg>
</div>

</div>

<script>

/* intro */

window.addEventListener("load",()=>{
 setTimeout(()=>{
  intro.style.opacity=0
  intro.style.transition="opacity .5s"
  setTimeout(()=>{
   intro.remove()
   main.style.opacity=1
  },500)
 },900)
})

/* logo parallax */

const logo=document.querySelector(".logo")

document.addEventListener("mousemove",e=>{
 const x=(window.innerWidth/2-e.clientX)/20
 const y=(window.innerHeight/2-e.clientY)/20
 logo.style.transform=`rotateY(${x}deg) rotateX(${y}deg) scale(1.02)`
})

/* hover preload */

document.querySelectorAll("a").forEach(a=>{
 a.addEventListener("mouseenter",()=>{
  fetch(a.href,{mode:"no-cors"})
 })
})

</script>

</body>
</html>
