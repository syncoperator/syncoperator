<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitiHub</title>

<style>

:root{
 --bg:#f6f7fb;
 --surface:#ffffff;
 --text:#0b0d12;
 --muted:#8c919b;
 --line:rgba(0,0,0,.05);

 --radius-xl:28px;
 --radius-lg:22px;
 --radius-md:16px;

 --shadow-1:0 2px 4px rgba(0,0,0,.04);
 --shadow-2:0 14px 40px rgba(0,0,0,.08);
 --shadow-3:0 30px 80px rgba(0,0,0,.12);

 --ease:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:radial-gradient(circle at 20% 0%,#fff,var(--bg));
 color:var(--text);
 height:100vh;
 overflow:hidden;
}

/* top bar */

.top{
 position:fixed;
 inset:0 0 auto 0;
 height:64px;
 backdrop-filter:blur(20px);
 background:rgba(255,255,255,.6);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
 letter-spacing:2px;
 font-weight:600;
 color:var(--muted);
 z-index:10;
}

/* main */

main{
 height:100%;
 overflow:auto;
 padding:110px 20px 140px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:30px;
 animation:enter 1s var(--ease);
}

@keyframes enter{
 from{opacity:0; transform:translateY(24px)}
}

/* logo */

.logo{
 width:210px;
 filter:drop-shadow(0 40px 70px rgba(0,0,0,.12));
 animation:float 8s var(--ease) infinite;
}

@keyframes float{
 50%{transform:translateY(-16px)}
}

/* cards */

.stack{
 width:100%;
 max-width:420px;
 display:flex;
 flex-direction:column;
 gap:18px;
}

.card{
 background:var(--surface);
 border-radius:var(--radius-xl);
 padding:24px 24px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;
 position:relative;

 border:1px solid var(--line);

 box-shadow:var(--shadow-1),var(--shadow-2);
 transition:.6s var(--ease);
}

/* hover light physics */

.card::before{
 content:"";
 position:absolute;
 inset:-60%;
 background:radial-gradient(circle at var(--x) var(--y),
 rgba(255,255,255,.9),transparent 45%);
 opacity:0;
 transition:.7s;
}

.card:hover::before{opacity:1}

.card:hover{
 transform:translateY(-8px);
 box-shadow:var(--shadow-1),var(--shadow-3);
}

/* text */

.label{
 font-size:10px;
 letter-spacing:1.5px;
 color:var(--muted);
 margin-bottom:6px;
 font-weight:600;
}

.title{
 font-size:22px;
 font-weight:600;
 letter-spacing:-.3px;
}

/* icon container */

.icon{
 width:52px;
 height:52px;
 border-radius:50%;
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.55s var(--ease);
}

.card:hover .icon{
 transform:scale(1.15) rotate(5deg);
 background:#0b0d12;
}

.card:hover svg{
 stroke:white;
}

/* bottom */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:95px;
 backdrop-filter:blur(20px);
 background:rgba(255,255,255,.65);
 border-top:1px solid var(--line);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav{
 width:54px;
 height:54px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#8f96a3;
 transition:.45s;
}

.nav.active{
 color:#0b0d12;
 transform:scale(1.2);
}

/* remove scrollbar */

::-webkit-scrollbar{display:none}

</style>
</head>
<body>

<div class="top">CITIHUB CONTROL</div>

<main>

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="#">
<div>
<div class="label">MODULE 01</div>
<div class="title">CitiTool</div>
</div>

<div class="icon">
<svg width="22" height="22" fill="none" stroke="#0b0d12" stroke-width="1.7" viewBox="0 0 24 24">
<path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.7-3.7a6 6 0 01-7.9 7.9l-6.9 6.9a2.1 2.1 0 01-3-3l6.9-6.9a6 6 0 017.9-7.9z"/>
</svg>
</div>
</a>

<a class="card" href="#">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>

<div class="icon">
<svg width="22" height="22" fill="none" stroke="#0b0d12" stroke-width="1.7" viewBox="0 0 24 24">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</div>
</a>

</div>
</main>

<div class="bottom">

<div class="nav active">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 01.3 1.8l.1.1a2 2 0 010 2.8 2 2 0 01-2.8 0l-.1-.1a1.7 1.7 0 01-1.8.3 1.7 1.7 0 01-1 1.5V21a2 2 0 01-4 0v-.1a1.7 1.7 0 01-1-1.5 1.7 1.7 0 01-1.8-.3l-.1.1a2 2 0 01-2.8 0 2 2 0 010-2.8l.1-.1a1.7 1.7 0 01-.3-1.8 1.7 1.7 0 01-1.5-1H3a2 2 0 010-4h.1a1.7 1.7 0 011.5-1 1.7 1.7 0 01.3-1.8l-.1-.1a2 2 0 010-2.8 2 2 0 012.8 0l.1.1a1.7 1.7 0 011.8-.3H9a1.7 1.7 0 011-1.5V3a2 2 0 014 0v.1a1.7 1.7 0 011 1.5 1.7 1.7 0 011.8.3l.1-.1a2 2 0 012.8 0 2 2 0 010 2.8l-.1.1a1.7 1.7 0 01.3 1.8 1.7 1.7 0 011.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 01-1.5 1z"/></svg>
</div>

</div>

<script>
document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect()
  card.style.setProperty("--x",(e.clientX-r.left)+"px")
  card.style.setProperty("--y",(e.clientY-r.top)+"px")
 })
})
</script>

</body>
</html>
