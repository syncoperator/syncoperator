<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator // Ultra Light</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="main-header">
        <div class="logo-group">
            <span class="sub-logo">Premium Interface</span>
            <h1>SyncOperator</h1>
        </div>
        <div class="top-actions">
            <button class="neu-btn-sm" onclick="exportData()">Export JSON</button>
            <button class="neu-btn-sm active" onclick="importData()">Import JSON</button>
        </div>
    </header>

    <main class="app-grid" id="sortable-grid">
        
        <div class="neu-tab" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="tab-head">
                <span class="t-nr">T-01</span>
                <div class="indicator green"></div>
            </div>
            <h2 class="t-name">Stange Calculator</h2>
        </div>

        <div class="neu-tab" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="tab-head">
                <span class="t-nr">T-02</span>
                <div class="indicator blue"></div>
            </div>
            <h2 class="t-name">Advanced Liste</h2>
        </div>

        <div class="neu-tab">
            <div class="tab-head">
                <span class="t-nr">T-03</span>
                <div class="indicator grey"></div>
            </div>
            <h2 class="t-name">Data Sync</h2>
        </div>

        <div class="neu-tab">
            <div class="tab-head">
                <span class="t-nr">T-04</span>
                <div class="indicator grey"></div>
            </div>
            <h2 class="t-name">Node Manager</h2>
        </div>

    </main>

    <footer class="bottom-spacer">
        <p>System v3.1 • Drag and drop to reorder</p>
    </footer>

    <script src="ui.js"></script>
</body>
</html>
