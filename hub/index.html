<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitiHub</title>

<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
<link rel="prefetch" href="https://syncoperator.github.io/syncoperator/stange/index.html">
<link rel="prefetch" href="https://romarfbozz.github.io/syncoperator/index.html">

<style>

:root{
 --bg:#f6f8fc;
 --surface:#fff;
 --text:#0c0f14;
 --muted:#96a0ad;
 --line:rgba(0,0,0,.06);

 --radius:26px;

 --shadow1:0 2px 6px rgba(0,0,0,.05);
 --shadow2:0 20px 50px rgba(0,0,0,.08);
 --shadow3:0 40px 120px rgba(0,0,0,.18);

 --ease:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;margin:0}

body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:radial-gradient(circle at var(--mx) var(--my),#fff,var(--bg));
 color:var(--text);
 height:100vh;
 overflow:hidden;
}

/* intro screen */

#intro{
 position:fixed;
 inset:0;
 background:white;
 display:flex;
 align-items:center;
 justify-content:center;
 z-index:9999;
}

.intro-text{
 font-size:42px;
 font-weight:600;
 letter-spacing:4px;
 background:linear-gradient(90deg,#000,#666,#000);
 background-size:200%;
 -webkit-background-clip:text;
 color:transparent;
 animation:shineText 2.2s var(--ease) forwards;
}

@keyframes shineText{
 0%{opacity:0; transform:scale(.9)}
 40%{opacity:1}
 100%{background-position:200%; opacity:0; transform:scale(1.05)}
}

/* top */

.top{
 position:fixed;
 width:100%;
 height:64px;
 backdrop-filter:blur(26px);
 background:rgba(255,255,255,.7);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:11px;
 letter-spacing:2px;
 color:var(--muted);
 z-index:5;
}

/* main */

main{
 height:100%;
 overflow:auto;
 padding:120px 20px 220px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:36px;
 opacity:0;
 transition:opacity 1s;
}

/* logo */

.logo{
 width:210px;
 position:relative;
 transform-style:preserve-3d;
 animation:idle 6s ease-in-out infinite;
 filter:drop-shadow(var(--shadow3));
}

@keyframes idle{
 50%{transform:rotateX(6deg) rotateY(-6deg)}
}

.logo::after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(120deg,
 transparent 20%,
 rgba(255,255,255,.9) 45%,
 transparent 70%);
 opacity:0;
}

.logo.shine::after{
 opacity:1;
 transform:translateX(160%);
 transition:1.2s cubic-bezier(.19,1,.22,1);
}

/* stack */

.stack{
 width:100%;
 max-width:440px;
 display:flex;
 flex-direction:column;
 gap:22px;
}

/* card */

.card{
 position:relative;
 padding:26px;
 border-radius:var(--radius);
 background:var(--surface);
 border:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;
 box-shadow:var(--shadow1),var(--shadow2);
 transition:.35s var(--ease);
}

.card:hover{
 transform:translateY(-10px);
 box-shadow:var(--shadow1),var(--shadow3);
}

.card::before{
 content:"";
 position:absolute;
 inset:0;
 background:radial-gradient(circle at var(--lx) var(--ly),
 rgba(255,255,255,.9),transparent 45%);
 opacity:0;
 pointer-events:none;
 transition:.3s;
}

.card:hover::before{opacity:1}

.label{
 font-size:11px;
 letter-spacing:1.6px;
 color:var(--muted);
 margin-bottom:4px;
 font-weight:600;
}

.title{
 font-size:22px;
 font-weight:600;
}

.icon{
 width:56px;
 height:56px;
 border-radius:50%;
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.3s;
}

.card:hover .icon{
 background:#0c0f14;
 transform:scale(1.1);
}

.card:hover svg{stroke:#fff}

/* bottom */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:110px;
 backdrop-filter:blur(28px);
 background:rgba(255,255,255,.75);
 border-top:1px solid var(--line);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav{
 width:58px;
 height:58px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#98a0ad;
 transition:.3s;
}

.nav.active{
 color:#0c0f14;
 transform:scale(1.2);
}

::-webkit-scrollbar{display:none}

</style>
</head>
<body>

<div id="intro">
<div class="intro-text">CitiTool</div>
</div>

<div class="top">CITIHUB</div>

<main id="main">

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="https://syncoperator.github.io/syncoperator/liste3/index.html">
<div>
<div class="label">MODULE 01</div>
<div class="title">Werkzeugliste</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<path d="M14.7 6.3l2 2 4-4a6 6 0 11-8 8l-7 7a2 2 0 11-3-3l7-7a6 6 0 018-8z"/>
</svg>
</div>
</a>

<a class="card" href="https://syncoperator.github.io/syncoperator/stange/index.html">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</div>
</a>

<a class="card" href="https://romarfbozz.github.io/syncoperator/index.html">
<div>
<div class="label">SYSTEM</div>
<div class="title">SyncOP</div>
</div>
<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0c0f14" stroke-width="1.8">
<rect x="4" y="4" width="16" height="16" rx="3"/>
<path d="M8 12h8"/>
</svg>
</div>
</a>

</div>
</main>

<div class="bottom">

<div class="nav active">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7"/>
<rect x="14" y="3" width="7" height="7"/>
<rect x="14" y="14" width="7" height="7"/>
<rect x="3" y="14" width="7" height="7"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.7 1.7 0 01.3 1.8"/>
</svg>
</div>

</div>

<script>

/* intro */

window.addEventListener("load",()=>{
 setTimeout(()=>{
  intro.style.opacity=0
  intro.style.transition="opacity .8s"
  setTimeout(()=>{
   intro.remove()
   main.style.opacity=1
  },800)
 },1600)
})

/* global light */

document.addEventListener("mousemove",e=>{
 document.body.style.setProperty("--mx",e.clientX+"px")
 document.body.style.setProperty("--my",e.clientY+"px")
})

/* card light */

document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect()
  card.style.setProperty("--lx",(e.clientX-r.left)+"px")
  card.style.setProperty("--ly",(e.clientY-r.top)+"px")
 })
})

/* logo shine */

const logo=document.querySelector(".logo")
setInterval(()=>{
 logo.classList.add("shine")
 setTimeout(()=>logo.classList.remove("shine"),1200)
},4000)

/* hover preload */

document.querySelectorAll("a").forEach(a=>{
 a.addEventListener("mouseenter",()=>{
  fetch(a.href,{mode:"no-cors"})
 })
})

</script>

</body>
</html>
