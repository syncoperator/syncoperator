<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncOperator Hub</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

<header class="hub-header">
    <div class="brand-zone">
        <h1>SyncOperator</h1>
        <div class="system-status"><span></span> Online</div>
    </div>
    <div class="data-mgmt">
        <button class="icon-btn" onclick="exportJSON()" title="Export JSON">↑</button>
        <button class="icon-btn" onclick="importJSON()" title="Import JSON">↓</button>
        <button class="btn-main" onclick="exportJSON()">JSON Export</button>
        <button class="btn-main primary" onclick="importJSON()">JSON Import</button>
    </div>
</header>

<main class="compact-grid" id="sort-container">
    <div class="mini-card" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
        <div class="card-top">
            <span class="t-nr">T-01</span>
            <div class="drag-handle">:::</div>
        </div>
        <div class="card-body">
            <h2 class="t-name">Stange Calculator</h2>
            <div class="card-icon">⚡</div>
        </div>
    </div>

    <div class="mini-card" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
        <div class="card-top">
            <span class="t-nr">T-02</span>
            <div class="drag-handle">:::</div>
        </div>
        <div class="card-body">
            <h2 class="t-name">Advanced Liste</h2>
            <div class="card-icon">📋</div>
        </div>
    </div>

    <div class="mini-card disabled">
        <div class="card-top"><span class="t-nr">T-03</span></div>
        <div class="card-body"><h2 class="t-name">Future App</h2></div>
    </div>
</main>

<div class="footer-safe-zone">
    <p>© 2026 SyncOperator Systems • Ready for scaling</p>
</div>

<script src="ui.js"></script>
</body>
</html>
