<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CitiHub</title>

<style>

/* DESIGN SYSTEM */

:root{
 --bg:#f6f8fc;
 --surface:#ffffff;
 --text:#0a0c10;
 --muted:#8f96a3;
 --line:rgba(0,0,0,.06);

 --radius:28px;

 --depth1:0 2px 6px rgba(0,0,0,.04);
 --depth2:0 20px 50px rgba(0,0,0,.08);
 --depth3:0 40px 120px rgba(0,0,0,.14);

 --ease:cubic-bezier(.16,1,.3,1);
}

*{box-sizing:border-box;margin:0}

body{
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui;
 background:radial-gradient(circle at var(--mx) var(--my),#fff,var(--bg));
 color:var(--text);
 height:100vh;
 overflow:hidden;
 transition:background .2s linear;
}

/* TOP */

.top{
 position:fixed;
 width:100%;
 height:64px;
 backdrop-filter:blur(30px);
 background:rgba(255,255,255,.65);
 border-bottom:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 letter-spacing:2px;
 font-size:11px;
 color:var(--muted);
 z-index:10;
}

/* MAIN */

main{
 height:100%;
 overflow:auto;
 padding:120px 20px 160px;
 display:flex;
 flex-direction:column;
 align-items:center;
 gap:36px;
}

/* LOGO */

.logo{
 width:220px;
 filter:drop-shadow(var(--depth3));
 transform-style:preserve-3d;
 transition:transform .2s linear;
}

/* STACK */

.stack{
 width:100%;
 max-width:440px;
 display:flex;
 flex-direction:column;
 gap:22px;
 perspective:1400px;
}

/* CARD */

.card{
 position:relative;
 padding:26px;
 border-radius:var(--radius);
 background:var(--surface);
 border:1px solid var(--line);
 display:flex;
 justify-content:space-between;
 align-items:center;
 text-decoration:none;
 color:inherit;

 transform-style:preserve-3d;

 box-shadow:var(--depth1),var(--depth2);
 transition:
 transform .25s linear,
 box-shadow .25s linear;
}

/* lighting */

.card::before{
 content:"";
 position:absolute;
 inset:-100%;
 background:radial-gradient(circle at var(--lx) var(--ly),
 rgba(255,255,255,.9),transparent 45%);
 opacity:.0;
 transition:.25s;
}

.card:hover::before{opacity:1}

/* hover physics */

.card:hover{
 transform:translateY(-12px) scale(1.02);
 box-shadow:var(--depth1),var(--depth3);
}

/* TEXT */

.label{
 font-size:11px;
 letter-spacing:1.6px;
 color:var(--muted);
 margin-bottom:6px;
 font-weight:600;
}

.title{
 font-size:23px;
 font-weight:600;
 letter-spacing:-.4px;
}

/* ICON */

.icon{
 width:56px;
 height:56px;
 border-radius:50%;
 border:1px solid var(--line);
 display:flex;
 align-items:center;
 justify-content:center;
 transition:.35s;
 transform:translateZ(40px);
}

.card:hover .icon{
 background:#0a0c10;
 transform:translateZ(70px) scale(1.1);
}

.card:hover svg{stroke:white}

/* BOTTOM */

.bottom{
 position:fixed;
 bottom:0;
 width:100%;
 height:100px;
 backdrop-filter:blur(28px);
 background:rgba(255,255,255,.7);
 border-top:1px solid var(--line);
 display:flex;
 justify-content:space-around;
 align-items:center;
}

.nav{
 width:60px;
 height:60px;
 border-radius:50%;
 display:flex;
 align-items:center;
 justify-content:center;
 color:#96a0af;
 transition:.3s;
}

.nav.active{
 color:#0a0c10;
 transform:scale(1.25);
}

/* hide scroll */

::-webkit-scrollbar{display:none}

</style>
</head>
<body>

<div class="top">CITIHUB SYSTEM</div>

<main>

<img class="logo" src="https://raw.githubusercontent.com/syncoperator/syncoperator/refs/heads/main/hub/IMG_2846.png">

<div class="stack">

<a class="card" href="#">
<div>
<div class="label">MODULE 01</div>
<div class="title">CitiTool</div>
</div>

<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0a0c10" stroke-width="1.8">
<path d="M14.7 6.3l2 2 4-4a6 6 0 11-8 8l-7 7a2 2 0 11-3-3l7-7a6 6 0 018-8z"/>
</svg>
</div>
</a>

<a class="card" href="#">
<div>
<div class="label">MODULE 02</div>
<div class="title">Stange</div>
</div>

<div class="icon">
<svg width="24" height="24" fill="none" stroke="#0a0c10" stroke-width="1.8">
<circle cx="12" cy="12" r="9"/>
<path d="M12 7v5l3 2"/>
</svg>
</div>
</a>

</div>
</main>

<div class="bottom">

<div class="nav active">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<rect x="3" y="3" width="7" height="7"/>
<rect x="14" y="3" width="7" height="7"/>
<rect x="14" y="14" width="7" height="7"/>
<rect x="3" y="14" width="7" height="7"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/>
</svg>
</div>

<div class="nav">
<svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8">
<circle cx="12" cy="12" r="3"/>
<path d="M19.4 15a1.7 1.7 0 01.3 1.8 1.7 1.7 0 01-1.5 1H21a2 2 0 010 4h-.1a1.7 1.7 0 01-1.5 1 1.7 1.7 0 01-.3 1.8"/>
</svg>
</div>

</div>

<script>

/* GLOBAL LIGHT ENGINE */

document.addEventListener("mousemove",e=>{
 document.body.style.setProperty("--mx",e.clientX+"px")
 document.body.style.setProperty("--my",e.clientY+"px")
})

/* CARD LIGHT */

document.querySelectorAll(".card").forEach(card=>{
 card.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect()
  card.style.setProperty("--lx",(e.clientX-r.left)+"px")
  card.style.setProperty("--ly",(e.clientY-r.top)+"px")
 })
})

/* LOGO PARALLAX */

const logo=document.querySelector(".logo")
document.addEventListener("mousemove",e=>{
 let x=(window.innerWidth/2-e.clientX)/40
 let y=(window.innerHeight/2-e.clientY)/40
 logo.style.transform=`rotateY(${x}deg) rotateX(${y}deg)`
})

</script>

</body>
</html>
