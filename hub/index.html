<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator Premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body>

    <header class="minimal-header">
        <span class="label">PREMIUM INTERFACE</span>
        <h1>SyncOperator</h1>
    </header>

    <main class="grid-layout" id="drag-zone">
        
        <div class="neu-tab" onclick="location.href='https://syncoperator.github.io/syncoperator/stange.html'">
            <div class="tab-top">
                <span class="t-nr">T-01</span>
                <div class="status-indicator"></div>
            </div>
            <div class="tab-icon">📐</div>
            <h2 class="t-name">Stange Calculator</h2>
        </div>

        <div class="neu-tab" onclick="location.href='https://syncoperator.github.io/syncoperator/liste2/index.html'">
            <div class="tab-top">
                <span class="t-nr">T-02</span>
                <div class="status-indicator blue"></div>
            </div>
            <div class="tab-icon">📑</div>
            <h2 class="t-name">Advanced Liste</h2>
        </div>

        <div class="neu-tab">
            <div class="tab-top">
                <span class="t-nr">T-03</span>
            </div>
            <div class="tab-icon">⚙️</div>
            <h2 class="t-name">System Config</h2>
        </div>

        <div class="neu-tab">
            <div class="tab-top">
                <span class="t-nr">T-04</span>
            </div>
            <div class="tab-icon">☁️</div>

        </div>

    <div class="footer-spacer"></div>

    <script src="ui.js"></script>

</html>
