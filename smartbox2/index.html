<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTBOX PRO V2</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-heavy: 3px solid #000;
            --border-light: 1px solid #000;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }

        body {
            margin: 0;
            font-family: var(--font-main);
            background: #f0f0f0;
            color: var(--text-color);
        }

        /* --- UI STYLES --- */
        header {
            background: #000;
            color: #fff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .ui-content {
            max-width: 1000px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding-bottom: 160px; /* Отступ в конце списка */
        }

        .meta-editor {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f9f9f9;
            border: var(--border-light);
        }

        .input-box { display: flex; flex-direction: column; }
        .input-box label { font-size: 10px; font-weight: 900; margin-bottom: 3px; }
        .input-box input { border: 1px solid #ccc; padding: 6px; font-weight: 700; }

        .tool-item {
            border: var(--border-light);
            padding: 10px 15px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
        }

        .tool-main { display: flex; flex-direction: column; }
        .tool-meta { text-align: right; }
        
        .label-bem { font-size: 9px; font-weight: 900; color: #000; }
        .val-name { font-size: 18px; font-weight: 900; border: none; outline: none; width: 100%; }
        .val-sub { font-size: 10px; font-weight: 700; color: #666; border: none; outline: none; }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 12px;
            font-size: 10px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
        }

        button.btn-sec { background: #e0e0e0; color: #000; margin-left: 4px; }

        /* --- PRINT STYLES --- */
        #print-wrapper { display: none; }

        @media print {
            @page { margin: 8mm; size: A4; }
            body { background: #fff; }
            header, .ui-content, .no-print { display: none !important; }
            #print-wrapper { display: block; width: 100%; }

            table.print-frame {
                width: 100%;
                border-collapse: collapse;
                border: var(--border-heavy);
            }

            .header-main { padding: 10px 15px; border-bottom: var(--border-heavy); }
            .project-title { font-size: 11px; font-weight: 900; text-transform: uppercase; }
            .project-num { font-size: 52px; font-weight: 900; line-height: 0.9; margin: 5px 0; }

            .header-meta { 
                padding: 0; 
                width: 40%; 
                border-bottom: var(--border-heavy);
                border-left: var(--border-heavy);
            }
            .meta-inner-table { width: 100%; border-collapse: collapse; }
            .meta-inner-table td { 
                border-bottom: 1px solid #000; 
                padding: 4px 8px; 
                font-size: 9px; 
                font-weight: 900; 
                height: 20px;
            }
            .meta-inner-table tr:last-child td { border-bottom: none; }

            .category-head {
                background: #000 !important;
                color: #fff !important;
                font-size: 11px;
                font-weight: 900;
                padding: 5px 15px;
                text-transform: uppercase;
            }

            .tool-row td {
                border-bottom: var(--border-light);
                padding: 6px 15px;
                vertical-align: middle;
            }
            .pr-name { font-size: 13px; font-weight: 900; text-transform: uppercase; }
            .pr-sub { font-size: 8px; font-weight: 900; text-transform: uppercase; }
            .pr-bemerkung { text-align: right; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900;">SMARTBOX PRO V2</div>
    <div>
        <button onclick="exportJSON()">Export JSON</button>
        <button class="btn-sec" onclick="document.getElementById('import-file').click()">Import JSON</button>
        <button class="btn-sec" onclick="window.print()">Print PDF</button>
        <input type="file" id="import-file" style="display:none" onchange="handleImport(event)">
    </div>
</header>

<div class="ui-content">
    <div class="meta-editor">
        <div class="input-box"><label>NUM</label><input type="text" id="ui-num" oninput="sync()"></div>
        <div class="input-box"><label>NAME</label><input type="text" id="ui-name" oninput="sync()"></div>
        <div class="input-box"><label>MAT</label><input type="text" id="ui-mat" oninput="sync()"></div>
        <div class="input-box"><label>LZF</label><input type="text" id="ui-lzf" oninput="sync()"></div>
        <div class="input-box"><label>SÄGE (SLG)</label><input type="text" id="ui-slg" oninput="sync()"></div>
        <div class="input-box"><label>ABST (ABS)</label><input type="text" id="ui-abs" oninput="sync()"></div>
        <div class="input-box"><label>BACKEN (GRF)</label><input type="text" id="ui-grf" oninput="sync()"></div>
        <div class="input-box"><label>STÜCK (STK)</label><input type="text" id="ui-stk" oninput="sync()"></div>
    </div>

    <div id="editor-list"></div>

    <div style="margin-top: 20px;" class="no-print">
        <button onclick="addManual('SONDER')">+ Add Sonder</button>
        <button onclick="addManual('STANDART')" class="btn-sec">+ Add Standart</button>
    </div>
</div>

<div id="print-wrapper">
    <table class="print-frame">
        <thead>
            <tr>
                <td class="header-main">
                    <div id="pr-proj-name" class="project-title">PROJECT NAME</div>
                    <div id="pr-proj-num" class="project-num">000000</div>
                </td>
                <td class="header-meta">
                    <table class="meta-inner-table">
                        <tr>
                            <td style="border-right: 1px solid #000;">MAT: <span id="pr-mat"></span></td>
                            <td>LZF: <span id="pr-lzf"></span></td>
                        </tr>
                        <tr>
                            <td style="border-right: 1px solid #000;">SÄGE: <span id="pr-slg"></span></td>
                            <td>ABST: <span id="pr-abs"></span></td>
                        </tr>
                        <tr>
                            <td style="border-right: 1px solid #000;">BACKEN: <span id="pr-grf"></span></td>
                            <td>STÜCK: <span id="pr-stk"></span></td>
                        </tr>
                    </table>
                </td>
            </tr>
        </thead>
        <tbody id="print-tbody">
            <!-- Content via JS -->
        </tbody>
    </table>
</div>

<script>
    let appData = {
        num: "230947",
        name: "EINSCHRAUBNIPPEL DN10",
        mat: "1.4104 ⌀30",
        lzf: "4Min 45Sek",
        slg: "1003mm",
        abs: "0.5mm",
        grf: "18-25",
        stk: "100",
        tools: []
    };

    function sync() {
        appData.num = document.getElementById('ui-num').value;
        appData.name = document.getElementById('ui-name').value;
        appData.mat = document.getElementById('ui-mat').value;
        appData.lzf = document.getElementById('ui-lzf').value;
        appData.slg = document.getElementById('ui-slg').value;
        appData.abs = document.getElementById('ui-abs').value;
        appData.grf = document.getElementById('ui-grf').value;
        appData.stk = document.getElementById('ui-stk').value;
        
        updatePrint();
    }

    function renderUI() {
        const list = document.getElementById('editor-list');
        list.innerHTML = '';
        appData.tools.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tool-item';
            div.innerHTML = `
                <div class="tool-main">
                    <span class="label-bem">${t.type}WERKZEUG</span>
                    <input class="val-name" value="${t.nm}" oninput="updateTool(${i}, 'nm', this.value)">
                    <input class="val-sub" value="${t.kom || 'IN BLAUKISTE'}" oninput="updateTool(${i}, 'kom', this.value)">
                </div>
                <div class="tool-meta">
                    <div class="label-bem">BEMERKUNG</div>
                    <input style="text-align:right; font-weight:900; border:none; width:60px;" value="${t.bem || '--'}" oninput="updateTool(${i}, 'bem', this.value)">
                    <div style="margin-top:5px;">
                        <button class="btn-sec" onclick="move(${i}, -1)">↑</button>
                        <button class="btn-sec" onclick="move(${i}, 1)">↓</button>
                        <button class="btn-sec" style="color:red" onclick="removeTool(${i})">✕</button>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });
        updatePrint();
    }

    function updateTool(i, field, val) {
        appData.tools[i][field] = val;
        updatePrint();
    }

    function move(i, dir) {
        let target = i + dir;
        if(target >= 0 && target < appData.tools.length) {
            [appData.tools[i], appData.tools[target]] = [appData.tools[target], appData.tools[i]];
            renderUI();
        }
    }

    function removeTool(i) {
        appData.tools.splice(i, 1);
        renderUI();
    }

    function addManual(type) {
        appData.tools.push({ type: type, nm: 'NEW TOOL', kom: 'IN BLAUKISTE', bem: '--' });
        renderUI();
    }

    function updatePrint() {
        document.getElementById('pr-proj-name').innerText = appData.name;
        document.getElementById('pr-proj-num').innerText = appData.num;
        document.getElementById('pr-mat').innerText = appData.mat;
        document.getElementById('pr-lzf').innerText = appData.lzf;
        document.getElementById('pr-slg').innerText = appData.slg;
        document.getElementById('pr-abs').innerText = appData.abs;
        document.getElementById('pr-grf').innerText = appData.grf;
        document.getElementById('pr-stk').innerText = appData.stk;

        const tbody = document.getElementById('print-tbody');
        tbody.innerHTML = '';

        const sonder = appData.tools.filter(t => t.type === 'SONDER' || !t.isStandart);
        const standart = appData.tools.filter(t => t.type === 'STANDART' || t.isStandart);

        if(sonder.length > 0) {
            tbody.innerHTML += `<tr><td colspan="2" class="category-head">SONDERWERKZEUGE</td></tr>`;
            sonder.forEach(t => tbody.innerHTML += createRow(t));
        }
        if(standart.length > 0) {
            tbody.innerHTML += `<tr><td colspan="2" class="category-head">STANDARTWERKZEUGE</td></tr>`;
            standart.forEach(t => tbody.innerHTML += createRow(t));
        }
    }

    function createRow(t) {
        return `
            <tr class="tool-row">
                <td>
                    <div class="pr-name">${t.nm}</div>
                    <div class="pr-sub">${t.kom || (t.loc ? 'LOC: ' + t.loc : 'IN BLAUKISTE')}</div>
                </td>
                <td class="pr-bemerkung">
                    <div class="label-bem">BEMERKUNG</div>
                    <div style="font-weight:900; font-size:11px;">${t.bem || '--'}</div>
                </td>
            </tr>
        `;
    }

    function handleImport(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            const json = JSON.parse(event.target.result);
            const data = Array.isArray(json) ? json[0] : json;
            
            appData.num = data.num || "";
            appData.name = data.name || "";
            appData.lzf = data.lzf || "";
            appData.mat = data.mat || "";
            appData.slg = data.slg || "";
            appData.abs = data.abs || "";
            appData.grf = data.grf || "";
            appData.stk = data.stk || "";
            
            // Map types from JSON
            appData.tools = (data.tools || []).map(t => ({
                ...t,
                type: t.isStandart ? 'STANDART' : 'SONDER'
            }));

            // Sync UI inputs
            document.getElementById('ui-num').value = appData.num;
            document.getElementById('ui-name').value = appData.name;
            document.getElementById('ui-mat').value = appData.mat;
            document.getElementById('ui-lzf').value = appData.lzf;
            document.getElementById('ui-slg').value = appData.slg;
            document.getElementById('ui-abs').value = appData.abs;
            document.getElementById('ui-grf').value = appData.grf;
            document.getElementById('ui-stk').value = appData.stk;

            renderUI();
        };
        reader.readAsText(file);
    }

    function exportJSON() {
        const blob = new Blob([JSON.stringify(appData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tools_${appData.num}.json`;
        a.click();
    }

    // Init
    document.getElementById('ui-num').value = appData.num;
    document.getElementById('ui-name').value = appData.name;
    document.getElementById('ui-mat').value = appData.mat;
    document.getElementById('ui-lzf').value = appData.lzf;
    document.getElementById('ui-slg').value = appData.slg;
    document.getElementById('ui-abs').value = appData.abs;
    document.getElementById('ui-grf').value = appData.grf;
    document.getElementById('ui-stk').value = appData.stk;
    renderUI();
</script>

</body>
</html>
