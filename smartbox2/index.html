<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#F2F2F7; --card:#FFF; --accent:#007AFF; --sub:#8E8E93; --danger:#FF3B30; --sonder:#FF9500; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:#000; overflow:hidden; }

        .view { display:none; flex-direction:column; height:100vh; width:100%; position:fixed; top:0; left:0; z-index:10; }
        .view.active { display:flex; }

        .nav-bar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(255,255,255,0.8); backdrop-filter:blur(20px); border-bottom:0.5px solid #D1D1D6; z-index:20; }
        .nav-title { font-weight:900; font-size:17px; }
        .nav-title span { color:var(--accent); }

        .btn-plus { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:10px; font-weight:800; cursor:pointer; }
        .nav-btn { background:none; border:none; color:var(--accent); font-size:17px; font-weight:600; cursor:pointer; min-width:44px; }
        .nav-info { text-align:center; cursor:pointer; flex:1; }
        .nav-info span { display:block; font-size:10px; color:var(--sub); font-weight:700; }
        .nav-info b { font-size:18px; font-weight:900; }

        .content-scroll { flex:1; overflow-y:auto; padding:16px 16px 180px; -webkit-overflow-scrolling:touch; }

        .list-item { background:var(--card); padding:18px; border-radius:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; position:relative; z-index:15; }
        .list-item:active { background:#F2F2F7; }
        .list-item b { font-size:20px; display:block; letter-spacing:-0.5px; pointer-events:none; }
        .list-item small { color:var(--sub); font-size:11px; font-weight:700; text-transform:uppercase; pointer-events:none; }

        .badge-sonder { background:var(--sonder); color:#fff; font-size:9px; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase; margin-bottom:4px; display:inline-block; }
        .badge-std { background:#E5E5EA; color:#000; font-size:9px; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase; margin-bottom:4px; display:inline-block; }

        .rev-toggle-btn { margin-top:8px; padding:14px; border-radius:12px; border:2px solid #E5E5EA; text-align:center; font-weight:800; font-size:13px; cursor:pointer; background:#F2F2F7; }
        .rev-toggle-btn.on { background:#000; color:#fff; border-color:#000; }

        .type-toggle-btn { margin-bottom:12px; padding:12px; border-radius:10px; border:2px solid #E5E5EA; text-align:center; font-weight:800; font-size:12px; cursor:pointer; background:#fff; }
        .type-toggle-btn.is-sonder { border-color:var(--sonder); color:var(--sonder); }

        .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
        .btn-main { padding:14px; border-radius:12px; border:none; font-weight:700; cursor:pointer; }
        .btn-main.primary { background:var(--accent); color:#fff; }
        .btn-main.secondary { background:#E5E5EA; color:#000; }

        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(5px); z-index:100; align-items:flex-end; }
        .sheet { background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:20px 20px 40px; animation:up 0.3s ease; box-sizing:border-box; max-height:90vh; overflow-y:auto; }
        @keyframes up { from{transform:translateY(100%)} to{transform:translateY(0)} }
        .sheet-bar { width:36px; height:5px; background:#D1D1D6; border-radius:3px; margin:-8px auto 20px; }
        .sheet-title { font-weight:900; font-size:22px; margin-bottom:20px; }

        .form-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .field.full { grid-column:span 2; }
        .field label { display:block; font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; margin-bottom:4px; }
        .field input, textarea { width:100%; padding:12px; background:#F2F2F7; border:none; border-radius:10px; font-size:16px; font-weight:600; box-sizing:border-box; font-family:inherit; }

        .sheet-buttons { margin-top:20px; display:flex; flex-direction:column; gap:8px; }
        .btn-action { padding:16px; border-radius:14px; border:none; font-weight:800; font-size:16px; cursor:pointer; }
        .btn-action.primary { background:var(--accent); color:#fff; }
        .btn-action.danger { background:#FFF1F0; color:var(--danger); }
        .btn-action.ghost { background:transparent; color:var(--sub); }

        #print-container { display:none; position:absolute; z-index:-1; pointer-events:none; }
        @media print { body{background:#fff; overflow:visible;} .view, .overlay{display:none!important;} #print-container{display:block!important; z-index:9999;} }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="nav-bar">
            <h1 class="nav-title">QS <span>CENTRAL</span></h1>
            <button class="btn-plus" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="nav-btn" onclick="goHome()">←</button>
            <div class="nav-info" onclick="modalP(true)">
                <span id="h-nam">NAME</span>
                <b id="h-num">000000</b>
            </div>
            <button class="nav-btn" onclick="makePDF()">PDF</button>
        </div>
        <div class="action-grid">
            <button class="btn-main primary" onclick="modalT()">+ Werkzeug</button>
            <button class="btn-main secondary" onclick="show('m-imp')">Import</button>
        </div>
        <div id="list-t" class="content-scroll"></div>
    </div>

    <div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Projekt</h2>
            <input type="hidden" id="p-idx">
            <div class="form-grid">
                <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="p-num"></div>
                <div class="field full"><label>Kunde / Name</label><input type="text" id="p-nam"></div>
                <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
                <div class="field"><label>Stück T</label><input type="text" id="p-stt"></div>
                <div class="field"><label>Stück N</label><input type="text" id="p-stn"></div>
                <div class="field full"><label>Material</label><input type="text" id="p-mat"></div>
                <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="field"><label>Greifbacken</label><input type="text" id="p-grf"></div>
            </div>
            <div class="sheet-buttons">
                <button class="btn-action primary" onclick="saveP()">Speichern</button>
                <button class="btn-action ghost" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Werkzeug</h2>
            <input type="hidden" id="t-idx">
            
            <div id="btn-type-toggle" class="type-toggle-btn" onclick="toggleType()">STANDART (LAGER)</div>

            <div class="field full"><label>T-Nr</label><input type="text" id="t-id"></div>
            <div class="field full"><label>Beschreibung</label><input type="text" id="t-nm"></div>
            <div class="field full"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
            
            <div class="field full"><label>Bemerkung (Zusatz Info)</label><textarea id="t-bem" rows="2"></textarea></div>

            <div class="field full">
                <label>Revolver Modus</label>
                <div id="btn-rev-toggle" class="rev-toggle-btn">REVOLVER UNTEN START ↓</div>
            </div>
            
            <div class="sheet-buttons">
                <button class="btn-action primary" onclick="saveT()">Speichern</button>
                <button id="btn-del-t" class="btn-action danger" onclick="delT()">Löschen</button>
                <button class="btn-action ghost" onclick="hide('m-t')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Daten Management</h2>
            <textarea id="imp-area" rows="6"></textarea>
            <div class="sheet-buttons">
                <button class="btn-action primary" onclick="exportJSON()">Export JSON</button>
                <button class="btn-action secondary" onclick="importJSON()">Import JSON</button>
                <button class="btn-action ghost" onclick="hide('m-imp')">Schließen</button>
            </div>
        </div>
    </div>

    <div id="print-container"></div>

    <script>
        const DB_KEY = 'QS_DATA_V12_FINAL';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;

        const el = (id) => document.getElementById(id);
        const show = (id) => { if(el(id)) el(id).style.display = 'flex'; };
        const hide = (id) => { if(el(id)) el(id).style.display = 'none'; };

        function modalP(edit = false) {
            if (!edit) currentIdx = null; 
            const p = (edit && currentIdx !== null && db[currentIdx]) ? db[currentIdx] : {num:'', name:'', lzf:'', sag:'', stt:'', stn:'', abs:'', grf:'', mat:''};
            el('p-idx').value = edit ? currentIdx : '';
            el('p-num').value = p.num || '';
            el('p-nam').value = p.name || '';
            el('p-lzf').value = p.lzf || '';
            el('p-sag').value = p.sag || '';
            el('p-stt').value = p.stt || '';
            el('p-stn').value = p.stn || '';
            el('p-abs').value = p.abs || '';
            el('p-grf').value = p.grf || '';
            if(el('p-mat')) el('p-mat').value = p.mat || ''; 
            show('m-p');
        }

        function saveP() {
            const idx = el('p-idx').value;
            const newP = {
                num: el('p-num').value,
                name: el('p-nam').value.toUpperCase(),
                lzf: el('p-lzf').value, 
                sag: el('p-sag').value,
                stt: el('p-stt').value, 
                stn: el('p-stn').value,
                abs: el('p-abs').value, 
                grf: el('p-grf').value,
                mat: el('p-mat') ? el('p-mat').value.toUpperCase() : '',
                tools: (idx !== '' && db[idx]) ? (db[idx].tools || []) : []
            };
            if (idx === '') { db.push(newP); currentIdx = db.length - 1; } 
            else { db[idx] = newP; }
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            hide('m-p');
            renderList();
            if(idx !== '') openProject(idx); else goHome();
        }

        function renderList() {
            const list = el('list-p'); if(!list) return;
            list.innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div><small>${p.name || '---'}</small><b>${p.num || '---'}</b></div>
                    <div style="color:var(--danger); font-weight:900; padding:15px; z-index:20;" onclick="event.stopPropagation(); deleteProject(${i})">✕</div>
                </div>`).join('') + '<div style="height:100px"></div>';
        }

        function openProject(i) {
            if (db[i]) {
                currentIdx = i;
                el('v-home').classList.remove('active');
                el('v-det').classList.add('active');
                el('h-num').innerText = db[i].num || '---';
                el('h-nam').innerText = db[i].name || '---';
                renderTools();
            }
        }

        function goHome() { currentIdx = null; el('v-home').classList.add('active'); el('v-det').classList.remove('active'); renderList(); }

        let startIdx = null;
        function renderTools() {
            const list = el('list-t'); if(!list || currentIdx === null) return;
            const tools = db[currentIdx].tools || [];
            list.innerHTML = '';
            tools.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = 'list-item';
                item.setAttribute('data-idx', i);
                
                const revMark = t.rev ? `<div style="background:#000; color:#fff; font-size:9px; padding:2px 6px; border-radius:4px; margin-bottom:5px; font-weight:900; width:fit-content;">UNTEN START ↓</div>` : '';
                const typeBadge = t.isSonder ? `<span class="badge-sonder">Sonderwerkzeug (Blaukiste)</span>` : `<span class="badge-std">Standard</span>`;
                const bemStr = t.bem ? `<div style="font-size:11px; font-weight:700; color:var(--accent); margin-top:4px;">${t.bem}</div>` : '';

                item.innerHTML = `
                    <div class="handle" style="cursor:grab; color:#ccc; font-size:24px; padding:10px; user-select:none; touch-action:none;">☰</div>
                    <div style="flex:1; min-width:0;" onclick="modalT(${i})">
                        ${revMark}
                        ${typeBadge}
                        <small style="color:#8e8e93; font-weight:700; font-size:11px; display:block;">${t.id || 'T0000'}</small>
                        <b style="font-size:20px; font-weight:900; display:block; line-height:1.2; word-wrap:break-word; white-space:pre-wrap;">${t.nm || '---'}</b>
                        ${bemStr}
                    </div>`;

                const handle = item.querySelector('.handle');
                handle.ontouchstart = () => { startIdx = i; item.style.background = "#f9f9f9"; };
                handle.ontouchmove = (e) => {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const targetItem = document.elementFromPoint(touch.clientX, touch.clientY)?.closest('.list-item');
                    if (targetItem) {
                        const overIdx = parseInt(targetItem.getAttribute('data-idx'));
                        if (overIdx !== startIdx) { moveTool(startIdx, overIdx); startIdx = overIdx; }
                    }
                };
                handle.ontouchend = () => { item.style.background = ""; renderTools(); };
                item.draggable = true;
                item.ondragstart = () => { startIdx = i; item.style.opacity = '0.4'; };
                item.ondrop = () => { if(startIdx !== i) moveTool(startIdx, i); };
                item.ondragover = (e) => e.preventDefault();
                list.appendChild(item);
            });
            list.innerHTML += '<div style="height:180px;"></div>'; 
        }

        function moveTool(from, to) {
            const tools = db[currentIdx].tools;
            const item = tools.splice(from, 1)[0];
            tools.splice(to, 0, item);
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderTools();
        }

        function toggleType() {
            const btn = el('btn-type-toggle');
            btn.classList.toggle('is-sonder');
            btn.innerText = btn.classList.contains('is-sonder') ? "SONDERWERKZEUG (BLAUKISTE)" : "STANDART (LAGER)";
        }

        function modalT(i = null) {
            const edit = i !== null;
            el('t-idx').value = edit ? i : '';
            const t = edit ? db[currentIdx].tools[i] : {id:'', nm:'', dia:'', rev:false, isSonder:false, bem:''};
            el('t-id').value = t.id || ''; el('t-nm').value = t.nm || ''; el('t-dia').value = t.dia || ''; el('t-bem').value = t.bem || '';
            const btnRev = el('btn-rev-toggle');
            if(t.rev) btnRev.classList.add('on'); else btnRev.classList.remove('on');
            btnRev.onclick = () => btnRev.classList.toggle('on');
            const btnType = el('btn-type-toggle');
            if(t.isSonder) { btnType.classList.add('is-sonder'); btnType.innerText = "SONDERWERKZEUG (BLAUKISTE)"; } 
            else { btnType.classList.remove('is-sonder'); btnType.innerText = "STANDART (LAGER)"; }
            el('btn-del-t').style.display = edit ? 'block' : 'none';
            show('m-t');
        }

        function saveT() {
            const i = el('t-idx').value;
            const t = { 
                id: el('t-id').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(), dia: el('t-dia').value, 
                rev: el('btn-rev-toggle').classList.contains('on'), isSonder: el('btn-type-toggle').classList.contains('is-sonder'),
                bem: el('t-bem').value.toUpperCase()
            };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(i === '') db[currentIdx].tools.push(t); else db[currentIdx].tools[i] = t;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); hide('m-t');
        }

        function deleteProject(i) { if(confirm('Löschen?')) { db.splice(i, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); } }
        function delT() { db[currentIdx].tools.splice(el('t-idx').value, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderTools(); hide('m-t'); }
        function exportJSON() { el('imp-area').value = JSON.stringify(db); alert("JSON bereit!"); }
        function importJSON() { try { const p = JSON.parse(el('imp-area').value); if(Array.isArray(p)) { db = p; localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); hide('m-imp'); } } catch(e) { alert("Error"); } }

        function makePDF() {
            const p = db[currentIdx];
            const getPageHead = () => `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; min-height:90px;">
                    <div>
                        <div style="font-size:13px; font-weight:900; text-transform:uppercase; color:#666; margin-bottom:2px;">${p.name || ''}</div>
                        <div style="font-size:60px; font-weight:900; line-height:0.8; letter-spacing:-2px;">${p.num || '---'}</div>
                    </div>
                    <div style="width:220px; font-size:11px; font-weight:800; line-height:1.5;">
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>MAT</span><span>${p.mat || ''}</span></div>
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>LZF</span><span>${p.lzf || ''}</span></div>
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>SÄGE</span><span>${p.sag || ''}</span></div>
                        <div style="display:flex; justify-content:space-between; border-bottom:1px solid #f0f0f0;"><span>ABST</span><span>${p.abs || ''}</span></div>
                        <div style="display:flex; justify-content:space-between;"><span>STÜCK</span><span>${p.stt || ''} / ${p.stn || ''}</span></div>
                    </div>
                </div><div style="border-bottom:5px solid #000; margin-bottom:15px;"></div>`;

            const getRow = (t) => {
                const dia = t.dia.includes('/') ? t.dia.split('/').join('<br>') : t.dia;
                const badge = t.isSonder 
                    ? `<span style="font-size:8px; background:#000; color:#fff; padding:1px 4px; border-radius:2px; vertical-align:middle; margin-left:6px;">SONDER</span>` 
                    : `<span style="font-size:8px; background:#E5E5EA; color:#000; padding:1px 4px; border-radius:2px; vertical-align:middle; margin-left:6px;">STANDARD</span>`;

                return `
                <div style="display:flex; align-items:flex-start; border-bottom:1.5px solid #000; padding:10px 0; width:100%; page-break-inside:avoid;">
                    <div style="width:75px; font-weight:900; font-size:16px;">${t.id}</div>
                    <div style="flex:1; padding-right:10px;">
                        <div style="font-weight:800; font-size:16px; text-transform:uppercase;">${t.nm} ${badge}</div>
                        ${t.bem ? `<div style="font-size:11px; font-weight:800; color:#007AFF; margin-top:4px; border-left:2px solid #007AFF; padding-left:5px;">${t.bem}</div>` : ''}
                    </div>
                    <div style="width:110px; text-align:right; font-weight:900; font-size:15px; line-height:1.1;">${dia}</div>
                </div>`;
            };

            let oben = [], unten = [];
            (p.tools || []).forEach(t => { t.rev ? unten.push(t) : oben.push(t); });

            let html = `<div style="width:210mm; padding:12mm; background:#fff; font-family:sans-serif;">
                <div style="border:2px solid #000; padding:25px; min-height:265mm; display:flex; flex-direction:column; page-break-after:always;">
                    ${getPageHead()}
                    <div style="flex:1;"><div style="font-size:18px; font-weight:900; margin-bottom:10px; border-bottom:2px solid #000; width:fit-content;">REVOLVER OBEN</div>${oben.map(getRow).join('')}</div>
                </div>`;

            if (unten.length > 0) {
                html += `<div style="border:2px solid #000; padding:25px; min-height:265mm; display:flex; flex-direction:column; margin-top:20px;">
                    ${getPageHead()}
                    <div style="flex:1;"><div style="font-size:18px; font-weight:900; margin-bottom:10px; border-bottom:2px solid #000; width:fit-content;">REVOLVER UNTEN</div>${unten.map(getRow).join('')}</div>
                </div>`;
            }
            html += `</div>`;
            el('print-container').innerHTML = html;
            setTimeout(() => window.print(), 200);
        }

        window.onload = renderList;
    </script>
</body>
</html>
