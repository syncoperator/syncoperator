<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QS SMARTBOX INDUSTRIAL V6</title>
    <style>
        :root { --line: 2pt solid #000; }
        body { font-family: 'Helvetica', Arial, sans-serif; margin: 0; padding: 0; background: #f0f0f0; }
        
        /* UI СТИЛИ ДЛЯ РАБОТЫ */
        header { background: #fff; padding: 15px; display: flex; justify-content: space-between; border-bottom: var(--line); position: sticky; top: 0; z-index: 100; }
        .btn { border: var(--line); background: #fff; padding: 10px 20px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .list-container { padding: 20px; max-width: 900px; margin: 0 auto; background: #fff; min-height: 100vh; }
        
        /* СТРОГАЯ СЕТКА PDF */
        .pdf-grid { border: var(--line); width: 100%; box-sizing: border-box; background: #fff; }
        .pdf-row { display: flex; border-bottom: var(--line); min-height: 50px; }
        .pdf-row:last-child { border-bottom: none; }
        
        .col-main { flex: 1; padding: 8px 15px; display: flex; flex-direction: column; justify-content: center; border-right: var(--line); }
        .col-side { width: 150px; padding: 8px 15px; text-align: right; display: flex; flex-direction: column; justify-content: center; }
        
        .p-num { font-size: 50px; font-weight: 900; line-height: 0.8; letter-spacing: -2px; }
        .p-name { font-size: 12px; font-weight: 900; text-transform: uppercase; margin-bottom: 5px; }
        
        .meta-grid { width: 250px; font-size: 11px; font-weight: 900; }
        .meta-line { display: flex; justify-content: space-between; border-bottom: 1px solid #000; }
        
        .cat-head { background: #000 !important; color: #fff !important; font-weight: 900; padding: 8px 15px; text-transform: uppercase; border-bottom: var(--line); }
        
        .t-name { font-size: 18px; font-weight: 900; text-transform: uppercase; }
        .t-sub { font-size: 10px; font-weight: 900; color: #333; margin-top: 2px; }
        .t-bem-label { font-size: 8px; font-weight: 900; color: #666; }
        .t-bem-val { font-size: 24px; font-weight: 900; }

        @media print {
            body { background: #fff; }
            .no-print { display: none; }
            .list-container { padding: 0; max-width: 100%; }
            @page { margin: 8mm; }
        }
    </style>
</head>
<body>

<header class="no-print">
    <div style="font-weight: 900; font-size: 20px;">QS SMARTBOX <span style="color:red;">PRO</span></div>
    <div>
        <button class="btn" onclick="makePDF()">PDF DRUCKEN</button>
        <button class="btn" onclick="exportData()">JSON</button>
    </div>
</header>

<div class="list-container">
    <div id="pdf-content" class="pdf-grid">
        <div class="pdf-row">
            <div class="col-main">
                <div class="p-name" id="ui-name">EINSCHRAUBNIPPEL DN10</div>
                <div class="p-num" id="ui-num">230947</div>
            </div>
            <div class="meta-grid" style="padding: 10px;">
                <div class="meta-line"><span>MAT:</span><span id="ui-mat">1.4104 ⌀30</span></div>
                <div class="meta-line"><span>LZF:</span><span id="ui-lzf">4Min 45Sek</span></div>
                <div class="meta-line"><span>SÄGE:</span><span id="ui-slg">1003mm</span></div>
                <div class="meta-line"><span>ABST:</span><span id="ui-abs">0.5mm</span></div>
                <div class="meta-line"><span>GRF:</span><span id="ui-grf">18-25</span></div>
                <div class="meta-line"><span>STOCK:</span><span id="ui-stk">100</span></div>
            </div>
        </div>

        <div class="cat-head">Sonderwerkzeuge</div>
        <div id="sonder-list"></div>

        <div class="cat-head">Standartwerkzeuge</div>
        <div id="std-list"></div>
    </div>
    <div style="height: 100px;"></div>
</div>

<script>
    const data = [
      {
        "num": "230947",
        "name": "EINSCHRAUBNIPPEL DN10",
        "lzf": "4Min 45Sek",
        "mat": "1.4104 ⌀30",
        "slg": "1003mm",
        "abs": "0.5mm",
        "grf": "18-25",
        "stk": "100",
        "tools": [
          {"bem": "T0101", "nm": "KOPIERSTAHL NEGATIV R0.8 G54", "isStandart": true, "loc": "FACH A", "kom": "DNMG150608-NMT WS10"},
          {"bem": "T0202", "nm": "KOPIERSTAHL NEGATIV R0.4 G54", "isStandart": true},
          {"bem": "T0303", "nm": "DREHBOHRER D18 G54", "isStandart": true},
          {"bem": "T0404", "nm": "SPIBO D7 HM IK G54", "isStandart": true},
          {"bem": "T0505", "nm": "SPIBO 9.5 HM IK G54", "isStandart": true},
          {"bem": "T0606", "nm": "A-GEWINDESTAHL M29X1.5 G54", "isStandart": true},
          {"bem": "T0707", "nm": "BOHRST.D10 CCGT R0.2 G54", "isStandart": true},
          {"bem": "T0808", "nm": "BOHRST.D6 MHC 20-6 G54", "isStandart": true},
          {"bem": "T0909", "nm": "ZENTRIERBO D10 RADIAL G55", "isStandart": true},
          {"bem": "T1010", "nm": "KOPIERST.NEGATIV R0.4 G55", "isStandart": true},
          {"bem": "T1111", "nm": "KOPIERST. NEGATIV R0.4 G55", "isStandart": true},
          {"bem": "T1212", "nm": "FRÄSER D10 RADIAL G55", "isStandart": true},
          {"bem": "T1313", "nm": "A-STECHSTAHL TUNGALOY 2MM G55", "isStandart": true},
          {"bem": "T1414", "nm": "A-STECHSTAHL TUNGALOY 3MM G55", "isStandart": true},
          {"bem": "T1515", "nm": "ZENTRIERBO D8 G55", "isStandart": true},
          {"bem": "T1616", "nm": "ABSTECHSTAHL 3MM RECHTS G54", "isStandart": true},
          {"bem": "T1212", "nm": "KUGELFRAESER D10/JOKE G54", "isStandart": false},
          {"bem": "T0505", "nm": "SPIBO D4 MIT KTB G54", "isStandart": false}
        ]
      }
    ];

    function render() {
        const p = data[0];
        const sonder = p.tools.filter(t => !t.isStandart);
        const std = p.tools.filter(t => t.isStandart);

        const rowHtml = t => `
            <div class="pdf-row">
                <div class="col-main">
                    <div class="t-name">${t.nm}</div>
                    <div class="t-info">${t.isStandart ? (t.loc || 'LAGER') : 'IN BLAUKISTE'} ${t.kom ? ' | ' + t.kom : ''}</div>
                </div>
                <div class="col-side">
                    <div class="t-bem-label">BEMERKUNG</div>
                    <div class="t-bem-val">${t.bem}</div>
                </div>
            </div>`;

        document.getElementById('sonder-list').innerHTML = sonder.map(rowHtml).join('');
        document.getElementById('std-list').innerHTML = std.map(rowHtml).join('');
    }

    function makePDF() { window.print(); }
    function exportData() { alert(JSON.stringify(data, null, 2)); }

    window.onload = render;
</script>
</body>
</html>
