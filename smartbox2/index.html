<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTBOX PRO V2 - UI/UX Expert System</title>
    <style>
        /* Light Premium Design Tokens */
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-color: #000000;
            --border-width: 3px;
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact;
        }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Header UI */
        header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            background: white;
            z-index: 100;
        }

        .header-title {
            font-size: 24px;
            font-weight: 900;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            background: black;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.8;
        }

        button.secondary {
            background: #eee;
            color: black;
        }

        /* Main Content */
        main {
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        #tool-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 160px; /* Essential padding to avoid overlapping with fixed actions */
        }

        /* Tool Card Styles */
        .tool-card {
            border: 2px solid #000;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            position: relative;
        }

        .tool-info {
            display: flex;
            flex-direction: column;
        }

        .label-bemerkung {
            font-size: 9px;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        .value-text {
            font-size: 22px;
            font-weight: 900;
            line-height: 1;
        }

        .card-actions {
            display: flex;
            gap: 5px;
        }

        /* Print/PDF Preparation Layout (Hidden in UI) */
        #print-container {
            display: none;
        }

        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #print-container {
                display: block;
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            header, .controls, #tool-list, .card-actions { display: none !important; }
        }

        /* PDF Frame Structure */
        .pdf-frame {
            width: 100%;
            border-collapse: collapse;
            border: var(--border-width) solid #000;
        }

        .pdf-header-cell {
            border-bottom: var(--border-width) solid #000;
            padding: 15px;
            vertical-align: top;
        }

        .meta-box {
            border-left: var(--border-width) solid #000;
            width: 250px;
            padding: 10px;
        }

        .meta-item {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            font-weight: 900;
            border-bottom: 1px solid #000;
            padding: 2px 0;
        }

        .meta-item:last-child { border-bottom: none; }

        .tool-row td {
            border-bottom: 1px solid #000;
            padding: 8px 15px;
        }

        /* Project Info Form */
        .project-meta-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
            background: #f9f9f9;
            padding: 20px;
            border: 1px solid #ddd;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 10px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        input {
            padding: 8px;
            border: 1px solid #000;
            font-family: var(--font-main);
            font-weight: 700;
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">SMARTBOX PRO V2</div>
    <div class="controls">
        <button onclick="exportJSON()">JSON Export</button>
        <button class="secondary" onclick="triggerImport()">Import</button>
        <button onclick="window.print()">Print PDF</button>
    </div>
</header>

<main>
    <section class="project-meta-form">
        <div class="input-group">
            <label>PROJECT NAME</label>
            <input type="text" id="proj-name" value="PROJEKT_ALPHA">
        </div>
        <div class="input-group">
            <label>PROJECT NUMBER</label>
            <input type="text" id="proj-num" value="2024-001">
        </div>
    </section>

    <div style="margin-bottom: 20px;">
        <button onclick="addTool()">+ Добавить Инструмент</button>
    </div>

    <div id="tool-list">
        <!-- Инструменты будут здесь -->
    </div>
</main>

<!-- Контейнер для печати (согласно правилу единой таблицы) -->
<div id="print-container"></div>

<input type="file" id="import-input" style="display:none" onchange="importJSON(event)">

<script>
    // Инициализация данных
    let tools = [
        { id: 1, bemerkung: "T-NR 102", value: "FRAISER D12" },
        { id: 2, bemerkung: "T-NR 105", value: "DRILL 5.0" }
    ];

    const toolList = document.getElementById('tool-list');

    function renderTools() {
        toolList.innerHTML = '';
        tools.forEach((tool, index) => {
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.innerHTML = `
                <div class="tool-info">
                    <div class="label-bemerkung">BEMERKUNG</div>
                    <div class="value-text" contenteditable="true" onblur="updateValue(${index}, 'value', this.innerText)">${tool.value}</div>
                    <div class="label-bemerkung" style="margin-top: 10px;">${tool.bemerkung}</div>
                </div>
                <div class="card-actions">
                    <button class="secondary" onclick="moveTool(${index}, -1)">↑</button>
                    <button class="secondary" onclick="moveTool(${index}, 1)">↓</button>
                    <button style="background:red" onclick="deleteTool(${index})">X</button>
                </div>
            `;
            toolList.appendChild(card);
        });
        updatePrintView();
    }

    function addTool() {
        const nr = tools.length + 100;
        tools.push({ id: Date.now(), bemerkung: `T-NR ${nr}`, value: "NEW TOOL" });
        renderTools();
    }

    function deleteTool(index) {
        tools.splice(index, 1);
        renderTools();
    }

    function updateValue(index, field, val) {
        tools[index][field] = val;
        updatePrintView();
    }

    function moveTool(index, direction) {
        const newIndex = index + direction;
        if (newIndex >= 0 && newIndex < tools.length) {
            const temp = tools[index];
            tools[index] = tools[newIndex];
            tools[newIndex] = temp;
            renderTools();
        }
    }

    function exportJSON() {
        const data = {
            project: {
                name: document.getElementById('proj-name').value,
                number: document.getElementById('proj-num').value
            },
            tools: tools
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `smartbox_${data.project.name}.json`;
        a.click();
    }

    function triggerImport() {
        document.getElementById('import-input').click();
    }

    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = JSON.parse(e.target.result);
            if (data.tools) {
                tools = data.tools;
                document.getElementById('proj-name').value = data.project.name || "";
                document.getElementById('proj-num').value = data.project.number || "";
                renderTools();
            }
        };
        reader.readAsText(file);
    }

    function updatePrintView() {
        const projName = document.getElementById('proj-name').value;
        const projNum = document.getElementById('proj-num').value;
        const printContainer = document.getElementById('print-container');

        let html = `
            <table class="pdf-frame">
                <thead>
                    <tr>
                        <td class="pdf-header-cell">
                            <h1 style="margin:0; font-weight:900;">${projName}</h1>
                            <p style="margin:5px 0 0 0; font-weight:700;">PROJ-NR: ${projNum}</p>
                        </td>
                        <td class="pdf-header-cell meta-box" style="width: 250px;">
                            <div class="meta-item"><span>MAT</span><span>______</span></div>
                            <div class="meta-item"><span>LZF</span><span>______</span></div>
                            <div class="meta-item"><span>SÄGE</span><span>______</span></div>
                            <div class="meta-item"><span>ABST</span><span>______</span></div>
                            <div class="meta-item"><span>BACKEN</span><span>______</span></div>
                            <div class="meta-item"><span>STOCK</span><span>______</span></div>
                        </td>
                    </tr>
                </thead>
                <tbody>
        `;

        tools.forEach(tool => {
            html += `
                <tr class="tool-row">
                    <td colspan="2">
                        <div style="font-size: 10px; font-weight: 900;">${tool.bemerkung}</div>
                        <div style="font-size: 18px; font-weight: 900;">${tool.value}</div>
                    </td>
                </tr>
            `;
        });

        // Fill remaining space to keep border solid
        html += `
                </tbody>
            </table>
        `;
        printContainer.innerHTML = html;
    }

    // Слушатели для обновления мета-данных
    document.getElementById('proj-name').addEventListener('input', updatePrintView);
    document.getElementById('proj-num').addEventListener('input', updatePrintView);

    // Начальный рендер
    renderTools();
</script>

</body>
</html>
