<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2</title>
    <style>
        /* UI DESIGN: LIGHT PREMIUM */
        :root { --bg: #ffffff; --text: #000000; --sub: #8e8e93; --border-thick: 3px solid #000; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; }
        
        header { padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: #fff; z-index: 10; }
        .h-title { font-weight: 900; font-size: 20px; }
        
        /* TOOL CARDS UI */
        .list-container { padding: 10px; padding-bottom: 160px; } /* Отступ в конце списка */
        .tool-card { 
            background: #fff; border: 1px solid #eee; border-radius: 12px; margin-bottom: 10px; padding: 15px;
            display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .t-info { flex: 1; }
        .t-label { font-size: 9px; font-weight: 900; color: var(--sub); text-transform: uppercase; margin-bottom: 2px; }
        .t-value { font-size: 22px; font-weight: 900; line-height: 1; }
        .t-name { font-size: 14px; font-weight: 700; margin-top: 5px; }

        .controls { display: flex; gap: 8px; }
        .btn-ui { background: #f2f2f7; border: none; border-radius: 8px; width: 40px; height: 40px; font-weight: 900; cursor: pointer; }
        .fab { position: fixed; bottom: 30px; right: 20px; background: #000; color: #fff; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); border: none; }

        /* PDF STYLES (EXACT WERKZEUGLISTE) */
        @media print {
            .no-print { display: none !important; }
            body { padding: 0; margin: 0; }
            @page { margin: 10mm; }
            .pdf-frame { width: 100%; border-collapse: collapse; border: var(--border-thick); }
            .pdf-frame td, .pdf-frame th { border: 1px solid #000; padding: 8px; vertical-align: middle; }
            .p-num { font-size: 40pt; font-weight: 900; letter-spacing: -2px; line-height: 0.8; }
            .meta-box { border-left: var(--border-thick) !important; width: 250px; padding: 0 !important; }
            .meta-table { width: 100%; border-collapse: collapse; font-size: 9pt; font-weight: 900; }
            .meta-table td { border: none !important; border-bottom: 1px solid #000 !important; padding: 3px 5px; }
            .th-row { font-size: 8pt; font-weight: 900; text-align: left; background: #f0f0f0; }
            .cat-row { background: #000 !important; color: #fff !important; text-align: center; font-weight: 900; font-size: 10pt; }
        }
    </style>
</head>
<body>

<div id="ui-main" class="no-print">
    <header>
        <div class="h-title">SMARTBOX <span>PRO</span></div>
        <div style="display:flex; gap:10px;">
            <button class="btn-ui" onclick="makePDF()">PDF</button>
            <button class="btn-ui" onclick="toggleJSON()">JSON</button>
        </div>
    </header>

    <div id="tool-list" class="list-container"></div>
    <button class="fab" onclick="addTool()">+</button>
</div>

<div id="json-modal" class="no-print" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; padding:20px;">
    <textarea id="json-io" style="width:100%; height:80%; border-radius:12px; padding:15px; font-family:monospace;"></textarea>
    <div style="display:flex; gap:10px; margin-top:10px;">
        <button class="btn-ui" style="width:100%; height:50px;" onclick="importData()">IMPORT</button>
        <button class="btn-ui" style="width:100%; height:50px;" onclick="toggleJSON()">CLOSE</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('SB_PRO_V2')) || {
        project: { num: "230947", name: "EINSCHRAUBNIPPEL DN10", mat: "1.4104 30", lzf: "4:45", sag: "1003", abs: "0.5", grf: "18-25", stk: "100" },
        tools: [
            { id: "T0101", nm: "KOPIERST. R0.8 G54", kom: "FACH A | DNMG150608", tol: "", cat: "SONDER" },
            { id: "T1212", nm: "KUGELFRAESER D10", kom: "IN BLAUKISTE", tol: "10.6-10.8", cat: "STANDART" }
        ]
    };

    function save() { localStorage.setItem('SB_PRO_V2', JSON.stringify(db)); render(); }

    function render() {
        const list = document.getElementById('tool-list');
        list.innerHTML = db.tools.map((t, i) => `
            <div class="tool-card">
                <div class="t-info" onclick="editTool(${i})">
                    <div class="t-label">BEMERKUNG</div>
                    <div class="t-value">${t.id}</div>
                    <div class="t-name">${t.nm}</div>
                </div>
                <div class="controls">
                    <button class="btn-ui" onclick="move(${i}, -1)">↑</button>
                    <button class="btn-ui" onclick="move(${i}, 1)">↓</button>
                </div>
            </div>
        `).join('');
    }

    function move(i, dir) {
        let target = i + dir;
        if (target >= 0 && target < db.tools.length) {
            [db.tools[i], db.tools[target]] = [db.tools[target], db.tools[i]];
            save();
        }
    }

    function makePDF() {
        const p = db.project;
        const sonder = db.tools.filter(t => t.cat === 'SONDER');
        const std = db.tools.filter(t => t.cat === 'STANDART');

        let printHtml = `
        <table class="pdf-frame">
            <tr>
                <td colspan="2" style="border-bottom:3px solid #000">
                    <div style="font-size:10pt; font-weight:900;">${p.name}</div>
                    <div class="p-num">${p.num}</div>
                </td>
                <td class="meta-box" style="border-bottom:3px solid #000">
                    <table class="meta-table">
                        <tr><td>MATERIAL</td><td>${p.mat}</td></tr>
                        <tr><td>LAUFZEIT</td><td>${p.lzf}</td></tr>
                        <tr><td>SÄGELÄНGE</td><td>${p.sag}</td></tr>
                        <tr><td>ABSTAND</td><td>${p.abs}</td></tr>
                        <tr><td>BACKEN</td><td>${p.grf}</td></tr>
                        <tr><td>STOCK</td><td>${p.stk}</td></tr>
                    </table>
                </td>
            </tr>
            <tr class="th-row">
                <th style="width:80px">T-NR</th>
                <th>WERKZEUGNAME / KOMMENTAR</th>
                <th style="width:150px; text-align:right">Ø / TOLERANZ</th>
            </tr>
            ${renderPdfGroup("Sonderwerkzeuge", sonder)}
            ${renderPdfGroup("Standartwerkzeuge", std)}
        </table>`;

        const win = window.open('', '_blank');
        win.document.write('<html><head><link rel="stylesheet" href="' + window.location.href + '"><style>body{padding:0; margin:0;}</style></head><body>' + printHtml + '</body></html>');
        win.document.close();
        setTimeout(() => { win.print(); win.close(); }, 500);
    }

    function renderPdfGroup(title, list) {
        if (!list.length) return '';
        let rows = list.map(t => `
            <tr>
                <td style="font-weight:900; text-align:center;">${t.id}</td>
                <td><div style="font-weight:900;">${t.nm}</div><div style="font-size:8pt;">${t.kom}</div></td>
                <td style="text-align:right; font-weight:900;">${t.tol}</td>
            </tr>`).join('');
        return `<tr><td colspan="3" class="cat-row">${title}</td></tr>` + rows;
    }

    function toggleJSON() {
        const m = document.getElementById('json-modal');
        const io = document.getElementById('json-io');
        if (m.style.display === 'none') {
            io.value = JSON.stringify(db, null, 2);
            m.style.display = 'block';
        } else {
            m.style.display = 'none';
        }
    }

    function importData() {
        try {
            db = JSON.parse(document.getElementById('json-io').value);
            save();
            toggleJSON();
        } catch (e) { alert("Ошибка JSON"); }
    }

    function addTool() {
        db.tools.push({ id: "T0000", nm: "NEUES WERKZEUG", kom: "", tol: "", cat: "SONDER" });
        save();
    }

    window.onload = render;
</script>
</body>
</html>
