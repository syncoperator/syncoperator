<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QS SMARTBOX - PREMIUM GRID</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f7; }
        
        /* UI КНОПКИ */
        .no-print { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .btn { padding: 12px 24px; background: #000; color: #fff; border: none; font-weight: bold; cursor: pointer; border-radius: 8px; }
        
        /* ПРЕМИУМ СЕТКА (PDF) */
        .pdf-container { width: 210mm; background: #fff; margin: 0 auto; padding: 10mm; box-sizing: border-box; color: #000; }
        
        .header-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .header-table td { vertical-align: top; border: none; }
        .title-block { width: 65%; }
        .p-name { font-size: 10pt; font-weight: bold; margin: 0; }
        .p-num { font-size: 38pt; font-weight: 900; margin: -5px 0 0 0; letter-spacing: -1px; }
        
        .meta-table { width: 100%; border-collapse: collapse; font-size: 8pt; font-weight: bold; }
        .meta-table td { border-bottom: 0.5pt solid #000 !important; padding: 2px 0; }
        .meta-table td:last-child { text-align: right; }

        .section-title { background: #fff; font-size: 11pt; font-weight: bold; padding: 5px 0; border-top: 2pt solid #000; margin-top: 10px; }

        .main-grid { width: 100%; border-collapse: collapse; border-top: 1.5pt solid #000; border-bottom: 1.5pt solid #000; }
        .main-grid th { font-size: 7.5pt; font-weight: bold; text-align: left; padding: 4px 8px; border-bottom: 1pt solid #000; background: #fff; }
        .main-grid td { font-size: 10pt; font-weight: bold; padding: 6px 8px; border-bottom: 0.5pt solid #ccc; vertical-align: middle; }
        
        .col-tnr { width: 12%; text-align: left; }
        .col-name { width: 63%; }
        .col-tol { width: 25%; text-align: right; }

        .kommentar { font-size: 8pt; font-weight: normal; color: #444; display: block; }

        @media print {
            body { background: #fff; padding: 0; }
            .no-print { display: none; }
            .pdf-container { width: 100%; padding: 0; }
            @page { size: A4; margin: 10mm; }
        }
    </style>
</head>
<body>

<div class="no-print">
    <button class="btn" onclick="window.print()">DRUCKEN (PDF)</button>
    <button class="btn" style="background:#007aff" onclick="alert('JSON Export ready')">JSON DATA</button>
</div>

<div class="pdf-container">
    <table class="header-table">
        <tr>
            <td class="title-block">
                <div class="p-name">EINSCHRAUBNIPPEL DN10</div>
                <div class="p-num">230947</div>
            </td>
            <td>
                <table class="meta-table">
                    <tr><td>LAUFZEIT</td><td>4Min 45Sek</td></tr>
                    <tr><td>MATERIAL</td><td>1.4104 ⌀30</td></tr>
                    <tr><td>SÄGELÄNGE</td><td>1003mm</td></tr>
                    <tr><td>ABSTAND</td><td>0.5mm</td></tr>
                    <tr><td>GREIFBACKEN</td><td>18-25</td></tr>
                    <tr><td>STÜCKZAHL</td><td>100</td></tr>
                </table>
            </td>
        </tr>
    </table>

    <div class="section-title">REVOLVER OBEN</div>
    <table class="main-grid">
        <thead>
            <tr>
                <th class="col-tnr">T-NR</th>
                <th class="col-name">WERKZEUGNAME/KOMMENTAR</th>
                <th class="col-tol">Ø/TOLERANZ</th>
            </tr>
        </thead>
        <tbody id="top-tools">
            </tbody>
    </table>

    <div class="section-title">REVOLVER UNTEN</div>
    <table class="main-grid">
        <thead>
            <tr>
                <th class="col-tnr">T-NR</th>
                <th class="col-name">WERKZEUGNAME/KOMMENTAR</th>
                <th class="col-tol">Ø/TOLERANZ</th>
            </tr>
        </thead>
        <tbody id="bottom-tools">
            </tbody>
    </table>
</div>

<script>
    const tools = [
        { "t": "T0101", "nm": "KOPIERST.R0.8 G54", "kom": "FACH A | DNMG150608-NMT WS10", "tol": "", "rev": "top" },
        { "t": "T0707", "nm": "ECO-CUT D18 G54", "kom": "", "tol": "21.00 - 21.04", "rev": "top" },
        { "t": "T0404", "nm": "SPIBO 9.5 HM IK G54", "kom": "", "tol": "", "rev": "top" },
        { "t": "T1212", "nm": "KUGELFRAESER D10/JOKE G54", "kom": "IN BLAUKISTE", "tol": "10.60 - 10.80", "rev": "top" },
        { "t": "T1216", "nm": "STANGENANSCHLAG G54", "kom": "", "tol": "", "rev": "bottom" },
        { "t": "T0101", "nm": "KOPIERST.NEGATIV R0.4 G55", "kom": "", "tol": "", "rev": "bottom" },
        { "t": "T0303", "nm": "STECHSTAHL 3MM G55", "kom": "", "tol": "", "rev": "bottom" }
    ];

    function render() {
        const top = document.getElementById('top-tools');
        const bot = document.getElementById('bottom-tools');
        
        tools.forEach(tool => {
            const html = `
                <tr>
                    <td class="col-tnr">${tool.t}</td>
                    <td class="col-name">
                        ${tool.nm}
                        ${tool.kom ? `<span class="kommentar">${tool.kom}</span>` : ''}
                    </td>
                    <td class="col-tol">${tool.tol}</td>
                </tr>`;
            if(tool.rev === 'top') top.innerHTML += html;
            else bot.innerHTML += html;
        });
    }
    render();
</script>
</body>
</html>
