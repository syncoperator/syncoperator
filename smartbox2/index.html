<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMARTBOX PRO V2</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --border-heavy: 3px solid #000;
            --border-light: 1px solid #000;
            --font-main: "Inter", -apple-system, sans-serif;
        }

        * { box-sizing: border-box; -webkit-print-color-adjust: exact; }

        body {
            margin: 0;
            font-family: var(--font-main);
            background: #f4f4f4;
            color: var(--text-color);
        }

        /* UI Elements */
        header {
            background: #fff;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: var(--border-light);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .ui-container {
            max-width: 900px;
            margin: 20px auto;
            background: #fff;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding-bottom: 160px;
        }

        .tool-card {
            border: var(--border-light);
            margin-bottom: 10px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-labels { display: flex; flex-direction: column; gap: 2px; }
        .label-small { font-size: 9px; font-weight: 900; text-transform: uppercase; }
        .value-large { font-size: 20px; font-weight: 900; text-transform: uppercase; border: none; outline: none; }

        button {
            background: #000;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }

        button.sec { background: #eee; color: #000; margin-left: 5px; }

        /* Print Layout (The Frame) */
        #print-area { display: none; }

        @media print {
            @page { margin: 10mm; }
            body { background: #fff; }
            .ui-container, header, .no-print { display: none !important; }
            #print-area { display: block; width: 100%; }
            
            table.master-frame {
                width: 100%;
                border-collapse: collapse;
                border: var(--border-heavy);
            }

            .header-cell { padding: 10px 15px; border-bottom: var(--border-heavy); }
            .meta-table { width: 100%; border-left: var(--border-heavy); }
            .meta-table td { 
                font-size: 9px; 
                font-weight: 900; 
                padding: 3px 10px; 
                border-bottom: 0.5px solid #000; 
            }
            
            .category-row {
                background: #000 !important;
                color: #fff !important;
                font-weight: 900;
                font-size: 12px;
                padding: 6px 15px;
                text-transform: uppercase;
            }

            .tool-row td {
                border-bottom: var(--border-light);
                padding: 8px 15px;
                vertical-align: middle;
            }

            .tool-name { font-size: 14px; font-weight: 900; text-transform: uppercase; }
            .tool-sub { font-size: 8px; font-weight: 900; text-transform: uppercase; }
            .bemerkung-box { text-align: right; }
        }

        /* Inputs */
        .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .meta-grid input { border: var(--border-light); padding: 8px; font-weight: 900; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 18px;">SMARTBOX PRO V2</div>
    <div class="no-print">
        <button onclick="exportData()">Export JSON</button>
        <button class="sec" onclick="document.getElementById('file-input').click()">Import JSON</button>
        <button class="sec" onclick="window.print()">Print PDF</button>
        <input type="file" id="file-input" style="display:none" onchange="importData(event)">
    </div>
</header>

<div class="ui-container">
    <div class="meta-grid">
        <input type="text" id="p-title" placeholder="TITLE (e.g. EINSCHRAUBNIPPEL)" value="EINSCHRAUBNIPPEL DN10">
        <input type="text" id="p-number" placeholder="PROJECT NUMBER" value="230947">
    </div>

    <div id="editor-list"></div>
    
    <div style="margin-top: 20px;" class="no-print">
        <button onclick="addTool('SONDER')">+ Add Sonderwerkzeug</button>
        <button onclick="addTool('STANDART')" class="sec">+ Add Standartwerkzeug</button>
    </div>
</div>

<div id="print-area">
    <table class="master-frame">
        <thead>
            <tr>
                <td class="header-cell" style="width: 60%;">
                    <div id="pr-title" style="font-size: 11px; font-weight: 900;">TITLE</div>
                    <div id="pr-number" style="font-size: 42px; font-weight: 900; line-height: 1;">000000</div>
                </td>
                <td class="header-cell" style="padding: 0; width: 40%;">
                    <table class="meta-table" cellspacing="0">
                        <tr><td>MAT: <span id="m-mat">1.4104 #30</span></td><td>LZF: <span id="m-lzf">--</span></td></tr>
                        <tr><td>SÄGE: <span id="m-sage">--</span></td><td>ABST: <span id="m-abst">0.5mm</span></td></tr>
                        <tr><td>BACKEN: <span id="m-back">18-25</span></td><td>STÜCK: <span id="m-stuck">--</span></td></tr>
                    </table>
                </td>
            </tr>
        </thead>
        <tbody id="print-body">
            <!-- Content generated by JS -->
        </tbody>
    </table>
</div>

<script>
    let state = {
        title: "EINSCHRAUBNIPPEL DN10",
        number: "230947",
        meta: { mat: "1.4104 #30", lzf: "--", sage: "--", abst: "0.5mm", back: "18-25", stuck: "--" },
        tools: [
            { type: 'SONDER', name: 'BOHRST.D6 MHC 20-6 G54', sub: 'IN BLAUKISTE', note: '--' },
            { type: 'SONDER', name: 'SPIBO D4 MIT KTB G54', sub: 'IN BLAUKISTE', note: '--' }
        ]
    };

    function render() {
        // Update UI
        const list = document.getElementById('editor-list');
        list.innerHTML = '';
        state.tools.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tool-card';
            div.innerHTML = `
                <div class="card-labels">
                    <span class="label-small">${t.type}</span>
                    <input class="value-large" value="${t.name}" onchange="updateTool(${i}, 'name', this.value)">
                    <input style="font-size:10px; font-weight:700; border:none; color:#666;" value="${t.sub}" onchange="updateTool(${i}, 'sub', this.value)">
                </div>
                <div style="text-align:right">
                    <div class="label-small">BEMERKUNG</div>
                    <input style="text-align:right; font-weight:900;" value="${t.note}" onchange="updateTool(${i}, 'note', this.value)">
                    <div style="margin-top:5px">
                        <button class="sec" onclick="move(${i}, -1)">↑</button>
                        <button class="sec" onclick="move(${i}, 1)">↓</button>
                        <button class="sec" style="color:red" onclick="remove(${i})">X</button>
                    </div>
                </div>
            `;
            list.appendChild(div);
        });

        // Update Print
        document.getElementById('pr-title').innerText = document.getElementById('p-title').value;
        document.getElementById('pr-number').innerText = document.getElementById('p-number').value;
        
        const tbody = document.getElementById('print-body');
        tbody.innerHTML = '';

        const categories = ['SONDER', 'STANDART'];
        categories.forEach(cat => {
            const filtered = state.tools.filter(t => t.type === cat);
            if(filtered.length > 0) {
                const catRow = document.createElement('tr');
                catRow.innerHTML = `<td colspan="2" class="category-row">${cat}WERKZEUGE</td>`;
                tbody.appendChild(catRow);

                filtered.forEach(t => {
                    const tr = document.createElement('tr');
                    tr.className = 'tool-row';
                    tr.innerHTML = `
                        <td>
                            <div class="tool-name">${t.name}</div>
                            <div class="tool-sub">${t.sub}</div>
                        </td>
                        <td class="bemerkung-box">
                            <div class="label-small">BEMERKUNG</div>
                            <div style="font-weight:900; font-size:12px;">${t.note}</div>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            }
        });
    }

    function addTool(type) {
        state.tools.push({ type, name: 'NEW TOOL', sub: 'IN BLAUKISTE', note: '--' });
        render();
    }

    function updateTool(i, field, val) {
        state.tools[i][field] = val;
        render();
    }

    function move(i, dir) {
        let n = i + dir;
        if(n >= 0 && n < state.tools.length) {
            [state.tools[i], state.tools[n]] = [state.tools[n], state.tools[i]];
            render();
        }
    }

    function remove(i) {
        state.tools.splice(i, 1);
        render();
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
        const dlAnchorElem = document.createElement('a');
        dlAnchorElem.setAttribute("href", dataStr);
        dlAnchorElem.setAttribute("download", `smartbox_${state.number}.json`);
        dlAnchorElem.click();
    }

    function importData(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (event) => {
            state = JSON.parse(event.target.result);
            document.getElementById('p-title').value = state.title;
            document.getElementById('p-number').value = state.number;
            render();
        };
        reader.readAsText(file);
    }

    document.getElementById('p-title').addEventListener('input', render);
    document.getElementById('p-number').addEventListener('input', render);

    render();
</script>

</body>
</html>
