<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>QS SMARTBOX PRO</title>
    <style>
        /* UI SMARTBOX - Твой дизайн */
        :root { --bg: #f2f2f7; --accent: #007aff; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); padding-bottom: 100px; }
        header { background: #fff; padding: 15px 20px; display: flex; justify-content: space-between; border-bottom: 0.5px solid #ccc; }
        .project-card { background: #fff; border-radius: 15px; margin: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .p-num-big { font-size: 32px; font-weight: 900; }
        
        /* КАРТОЧКА ИНСТРУМЕНТА В ПРИЛОЖЕНИИ */
        .tool-card { 
            background: #fff; border-radius: 12px; margin: 8px 10px; padding: 12px; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .t-nr-ui { font-size: 9px; color: #888; font-weight: 900; }
        .t-val-ui { font-size: 20px; font-weight: 900; }
        
        .btn-icon { background: #eee; border: none; border-radius: 8px; padding: 10px; color: var(--accent); font-weight: bold; cursor: pointer; }
        .fab { position: fixed; bottom: 25px; right: 20px; background: #000; color: #fff; width: 60px; height: 60px; border-radius: 30px; display: flex; align-items: center; justify-content: center; font-size: 30px; }

        /* МОДАЛКА */
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: flex-end; }
        .modal-content { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px; box-sizing: border-box; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }

        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>

<div id="ui" class="no-print">
    <header>
        <div style="font-weight:900">QS SMARTBOX</div>
        <button class="btn-icon" onclick="exportData()">JSON</button>
    </header>
    <div id="project-list"></div>
    <div id="tool-view" style="display:none">
        <div style="padding:10px; display:flex; justify-content:space-between;">
            <button class="btn-icon" onclick="goBack()">←</button>
            <button class="btn-icon" style="background:#000; color:#fff" onclick="makePDF()">PDF DRUCKEN</button>
        </div>
        <div id="tools-container"></div>
    </div>
    <div class="fab" onclick="openAdd()">+</div>
</div>

<div id="m-add" class="modal" onclick="if(event.target==this)this.style.display='none'">
    <div class="modal-content">
        <input id="in-bem" placeholder="T-NR (z.B. T0101)">
        <input id="in-nm" placeholder="WERKZEUGNAME">
        <input id="in-kom" placeholder="KOMMENTAR">
        <input id="in-tol" placeholder="Ø / TOLERANZ">
        <button class="btn-icon" style="width:100%; margin:10px 0" id="in-std" onclick="this.dataset.s=this.dataset.s=='1'?'0':'1';this.textContent=this.dataset.s=='1'?'STANDART':'SONDER'" data-s="1">STANDART</button>
        <button class="btn-icon" style="width:100%; background:#000; color:#fff" onclick="saveTool()">SPEICHERN</button>
    </div>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('SB_DATA')) || [{
        num: "230947", name: "EINSCHRAUBNIPPEL DN10",
        mat: "1.4104 30", lzf: "4Min 45Sek", sag: "1003mm", abs: "0.5mm", grf: "18-25", stk: "100",
        tools: [
            { bem: "T0101", nm: "KOPIERST.R0.8 G54", kom: "FACH A | DNMG150608", tol: "", isStd: true },
            { bem: "T1212", nm: "KUGELFRAESER D10", kom: "IN BLAUKISTE", tol: "10.60-10.80", isStd: false }
        ]
    }];
    let cur = 0;

    function render() {
        const pl = document.getElementById('project-list');
        pl.innerHTML = db.map((p,i)=>`
            <div class="project-card" onclick="openP(${i})">
                <div style="font-size:11px; font-weight:bold; color:#888">${p.name}</div>
                <div class="p-num-big">${p.num}</div>
            </div>
        `).join('');
    }

    function openP(i) {
        cur=i; document.getElementById('project-list').style.display='none'; document.getElementById('tool-view').style.display='block';
        renderTools();
    }
    function goBack() { document.getElementById('project-list').style.display='block'; document.getElementById('tool-view').style.display='none'; }

    function renderTools() {
        const tc = document.getElementById('tools-container');
        tc.innerHTML = db[cur].tools.map(t=>`
            <div class="tool-card">
                <div class="t-nr-ui">BEMERKUNG</div>
                <div class="t-val-ui">${t.bem}</div>
                <div style="flex:1; margin-left:15px"><b>${t.nm}</b></div>
                <div style="font-size:10px">${t.isStd?'STD':'SONDER'}</div>
            </div>
        `).join('');
    }

    function openAdd() { document.getElementById('m-add').style.display='flex'; }
    function saveTool() {
        db[cur].tools.push({
            bem: document.getElementById('in-bem').value.toUpperCase(),
            nm: document.getElementById('in-nm').value.toUpperCase(),
            kom: document.getElementById('in-kom').value.toUpperCase(),
            tol: document.getElementById('in-tol').value,
            isStd: document.getElementById('in-std').dataset.s == '1'
        });
        localStorage.setItem('SB_DATA', JSON.stringify(db));
        document.getElementById('m-add').style.display='none';
        renderTools();
    }

    // ВОТ ТУТ ГЕНЕРАЦИЯ СЕТКИ 1в1 КАК В PDF ПРИМЕРЕ
    function makePDF() {
        const p = db[cur];
        const sonder = p.tools.filter(t => !t.isStd);
        const std = p.tools.filter(t => t.isStd);

        let h = `<html><head><style>
            body { font-family: Arial, sans-serif; margin: 0; padding: 10mm; }
            .grid { width: 100%; border-collapse: collapse; border: 1.5pt solid #000; }
            .grid td, .grid th { border: 1.5pt solid #000; padding: 6px 10px; vertical-align: middle; }
            .p-num { font-size: 50px; font-weight: 900; line-height: 0.8; letter-spacing: -2px; }
            .meta { width: 100%; border-collapse: collapse; font-size: 10px; font-weight: bold; }
            .meta td { border:none!important; border-bottom:0.5pt solid #000!important; padding: 2px 0; }
            .cat-title { background: #fff; font-size: 14px; font-weight: bold; padding: 10px 0; border-top: 2.5pt solid #000; margin-top: 15px; }
            .th-row th { font-size: 8pt; font-weight: bold; text-align: left; background: #fff; border-bottom: 1.5pt solid #000; }
            .t-nr { width: 60px; font-weight: bold; font-size: 11pt; }
            .t-nm { font-weight: bold; font-size: 11pt; text-transform: uppercase; }
            .t-tol { width: 130px; text-align: right; font-weight: bold; font-size: 10pt; }
            .kom { font-size: 9pt; font-weight: normal; color: #333; display: block; }
        </style></head><body>
            <table class="grid">
                <tr>
                    <td colspan="2" style="width:65%; border-bottom: 2pt solid #000;">
                        <div style="font-size:12px; font-weight:bold">${p.name}</div>
                        <div class="p-num">${p.num}</div>
                    </td>
                    <td style="padding:0; border-bottom: 2pt solid #000;">
                        <table class="meta">
                            <tr><td>MATERIAL</td><td style="text-align:right">${p.mat}</td></tr>
                            <tr><td>LAUFZEIT</td><td style="text-align:right">${p.lzf}</td></tr>
                            <tr><td>SÄGELÄNGE</td><td style="text-align:right">${p.sag}</td></tr>
                            <tr><td>ABSTAND</td><td style="text-align:right">${p.abs}</td></tr>
                            <tr><td>GREIFBACKEN</td><td style="text-align:right">${p.grf}</td></tr>
                            <tr><td>STÜCKZAHL</td><td style="text-align:right">${p.stk}</td></tr>
                        </table>
                    </td>
                </tr>
            </table>`;

        const renderTable = (title, list) => {
            if(!list.length) return '';
            return `
                <div class="cat-title">${title.toUpperCase()}</div>
                <table class="grid">
                    <tr class="th-row">
                        <th style="width:60px">T-NR</th>
                        <th>WERKZEUGNAME/KOMMENTAR</th>
                        <th style="width:130px; text-align:right">Ø/TOLERANZ</th>
                    </tr>
                    ${list.map(t=>`
                        <tr>
                            <td class="t-nr">${t.bem}</td>
                            <td class="t-nm">${t.nm} ${t.kom ? `<span class="kom">${t.kom}</span>` : ''}</td>
                            <td class="t-tol">${t.tol}</td>
                        </tr>
                    `).join('')}
                </table>`;
        };

        h += renderTable('Sonderwerkzeuge', sonder);
        h += renderTable('Standartwerkzeuge', std);
        h += `</body></html>`;

        const w = window.open(); w.document.write(h); w.document.close();
        setTimeout(()=>w.print(), 500);
    }

    render();
</script>
</body>
</html>
