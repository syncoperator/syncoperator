<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root { --bg:#F2F2F7; --card:#FFF; --accent:#007AFF; --sub:#8E8E93; --danger:#FF3B30; }
        body { margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:#000; overflow:hidden; }
        .view { display:none; flex-direction:column; height:100vh; width:100%; position:fixed; top:0; left:0; z-index:10; }
        .view.active { display:flex; }
        .nav-bar { height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; background:rgba(255,255,255,0.8); backdrop-filter:blur(20px); border-bottom:0.5px solid #D1D1D6; z-index:20; }
        .nav-title { font-weight:900; font-size:17px; }
        .nav-title span { color:var(--accent); }
        .btn-plus { background:var(--accent); color:#fff; border:none; padding:8px 16px; border-radius:10px; font-weight:800; cursor:pointer; }
        .nav-btn { background:none; border:none; color:var(--accent); font-size:17px; font-weight:600; cursor:pointer; min-width:44px; }
        .nav-info { text-align:center; cursor:pointer; flex:1; }
        .nav-info span { display:block; font-size:10px; color:var(--sub); font-weight:700; }
        .nav-info b { font-size:18px; font-weight:900; }
        .content-scroll { flex:1; overflow-y:auto; padding:16px 16px 180px; -webkit-overflow-scrolling:touch; }
        .list-item { background:var(--card); padding:18px; border-radius:16px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,0.04); cursor:pointer; position:relative; z-index:15; }
        .list-item:active { background:#F2F2F7; }
        .list-item b { font-size:20px; display:block; letter-spacing:-0.5px; }
        .list-item small { color:var(--sub); font-size:11px; font-weight:700; text-transform:uppercase; }
        .badge-sonder { background:#000; color:#fff; font-size:9px; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase; margin-bottom:4px; display:inline-block; }
        .badge-std { background:#E5E5EA; color:#000; font-size:9px; font-weight:900; padding:2px 6px; border-radius:4px; text-transform:uppercase; margin-bottom:4px; display:inline-block; }
        .rev-toggle-btn { margin-top:8px; padding:14px; border-radius:12px; border:2px solid #E5E5EA; text-align:center; font-weight:800; font-size:13px; cursor:pointer; background:#F2F2F7; }
        .rev-toggle-btn.on { background:#000; color:#fff; border-color:#000; }
        .type-toggle-btn { margin-bottom:12px; padding:12px; border-radius:10px; border:2px solid #E5E5EA; text-align:center; font-weight:800; font-size:12px; cursor:pointer; background:#fff; }
        .type-toggle-btn.is-sonder { border-color:#000; color:#000; }
        .action-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:16px; }
        .btn-main { padding:14px; border-radius:12px; border:none; font-weight:700; cursor:pointer; }
        .btn-main.primary { background:var(--accent); color:#fff; }
        .btn-main.secondary { background:#E5E5EA; color:#000; }
        .overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(5px); z-index:100; align-items:flex-end; }
        .sheet { background:var(--card); width:100%; border-radius:20px 20px 0 0; padding:20px 20px 40px; box-sizing:border-box; max-height:90vh; overflow-y:auto; }
        .sheet-bar { width:36px; height:5px; background:#D1D1D6; border-radius:3px; margin:-8px auto 20px; }
        .field { margin-bottom:12px; }
        .field label { display:block; font-size:11px; font-weight:700; color:var(--sub); text-transform:uppercase; margin-bottom:4px; }
        .field input, textarea { width:100%; padding:12px; background:#F2F2F7; border:none; border-radius:10px; font-size:16px; font-weight:600; box-sizing:border-box; font-family:inherit; }
        
        #print-container { display:none; }
        @media print { 
            body { background:#fff; overflow:visible; } 
            .view, .overlay { display:none!important; } 
            #print-container { display:block!important; width:210mm; } 
            .print-page { width: 210mm; height: 297mm; position: relative; page-break-after: always; overflow: hidden; }
        }
    </style>
</head>
<body>

    <div id="v-home" class="view active">
        <div class="nav-bar">
            <h1 class="nav-title">QS <span>CENTRAL</span></h1>
            <button class="btn-plus" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="nav-btn" onclick="goHome()">←</button>
            <div class="nav-info" onclick="modalP(true)">
                <span id="h-nam">NAME</span>
                <b id="h-num">000000</b>
            </div>
            <button class="nav-btn" onclick="makePDF()">PDF</button>
        </div>
        <div class="action-grid">
            <button class="btn-main primary" onclick="modalT()">+ Werkzeug</button>
            <button class="btn-main secondary" onclick="show('m-imp')">Import</button>
        </div>
        <div id="list-t" class="content-scroll"></div>
    </div>

    <div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <div class="field"><label>Zeichnungsnummer</label><input type="text" id="p-num"></div>
            <div class="field"><label>Name</label><input type="text" id="p-nam"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
            </div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="field"><label>Stück T</label><input type="text" id="p-stt"></div>
                <div class="field"><label>Stück N</label><input type="text" id="p-stn"></div>
            </div>
            <div class="field"><label>Material</label><input type="text" id="p-mat"></div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="field"><label>Greifbacken</label><input type="text" id="p-grf"></div>
            </div>
            <button class="btn-main primary" style="width:100%; padding:16px;" onclick="saveP()">Speichern</button>
        </div>
    </div>

    <div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <div id="btn-type-toggle" class="type-toggle-btn" onclick="toggleType()">STANDARD (LAGER)</div>
            <div class="field"><label>T-Nr</label><input type="text" id="t-id"></div>
            <div class="field"><label>Werkzeugname</label><input type="text" id="t-nm"></div>
            <div class="field"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
            <div class="field"><label>Bemerkung</label><textarea id="t-bem" rows="2"></textarea></div>
            <div id="btn-rev-toggle" class="rev-toggle-btn">REVOLVER UNTEN START ↓</div>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:20px;">
                <button class="btn-main primary" onclick="saveT()">Speichern</button>
                <button id="btn-del-t" class="btn-main secondary" style="color:red;" onclick="delT()">Löschen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <textarea id="imp-area" rows="6" style="margin-bottom:15px;"></textarea>
            <button class="btn-main primary" style="width:100%; margin-bottom:10px;" onclick="exportJSON()">Export JSON</button>
            <button class="btn-main secondary" style="width:100%;" onclick="importJSON()">Import JSON</button>
        </div>
    </div>

    <div id="print-container"></div>

    <script>
        const DB_KEY = 'QS_PREMIUM_FINAL_2026';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;
        let tEditIdx = null;

        const el = (id) => document.getElementById(id);
        const show = (id) => { el(id).style.display = 'flex'; };
        const hide = (id) => { el(id).style.display = 'none'; };

        function modalP(edit=false) {
            if(edit) {
                const p = db[currentIdx];
                el('p-num').value = p.num; el('p-nam').value = p.name;
                el('p-lzf').value = p.lzf; el('p-sag').value = p.sag;
                el('p-stt').value = p.stt; el('p-stn').value = p.stn;
                el('p-mat').value = p.mat; el('p-abs').value = p.abs; el('p-grf').value = p.grf;
            } else {
                currentIdx = null; 
                document.querySelectorAll('#m-p input').forEach(i => i.value = '');
            }
            show('m-p');
        }

        function saveP() {
            const p = {
                num: el('p-num').value, name: el('p-nam').value.toUpperCase(),
                lzf: el('p-lzf').value, sag: el('p-sag').value, stt: el('p-stt').value, stn: el('p-stn').value,
                mat: el('p-mat').value.toUpperCase(), abs: el('p-abs').value, grf: el('p-grf').value,
                tools: currentIdx !== null ? db[currentIdx].tools : []
            };
            if(currentIdx === null) db.push(p); else db[currentIdx] = p;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); hide('m-p'); renderList();
            if(currentIdx !== null) openProject(currentIdx);
        }

        function renderList() {
            el('list-p').innerHTML = db.map((p, i) => `
                <div class="list-item" onclick="openProject(${i})">
                    <div><small>${p.name}</small><b>${p.num}</b></div>
                    <div style="color:var(--danger); font-weight:900; padding:10px;" onclick="event.stopPropagation(); deleteProject(${i})">✕</div>
                </div>`).join('') + '<div style="height:100px"></div>';
        }

        function openProject(i) {
            currentIdx = i; el('v-home').classList.remove('active'); el('v-det').classList.add('active');
            el('h-num').innerText = db[i].num; el('h-nam').innerText = db[i].name; renderTools();
        }

        function goHome() { el('v-home').classList.add('active'); el('v-det').classList.remove('active'); renderList(); }

        function renderTools() {
            const list = el('list-t'); const tools = db[currentIdx].tools || [];
            list.innerHTML = tools.map((t, i) => `
                <div class="list-item" onclick="modalT(${i})">
                    <div style="flex:1;">
                        ${t.rev ? '<div style="background:#000; color:#fff; font-size:9px; padding:2px 6px; border-radius:4px; margin-bottom:5px; font-weight:900; width:fit-content;">UNTEN START ↓</div>' : ''}
                        ${t.isSonder ? '<span class="badge-sonder">Sonder (Blaukiste)</span>' : '<span class="badge-std">Standard</span>'}
                        <small style="display:block;">${t.id}</small><b>${t.nm}</b>
                        ${t.bem ? `<div style="font-size:11px; color:var(--accent); font-weight:700;">${t.bem}</div>` : ''}
                    </div>
                </div>`).join('') + '<div style="height:180px;"></div>';
        }

        function modalT(i=null) {
            tEditIdx = i;
            if(i !== null) {
                const t = db[currentIdx].tools[i];
                el('t-id').value = t.id; el('t-nm').value = t.nm; el('t-dia').value = t.dia; el('t-bem').value = t.bem;
                t.rev ? el('btn-rev-toggle').classList.add('on') : el('btn-rev-toggle').classList.remove('on');
                t.isSonder ? el('btn-type-toggle').classList.add('is-sonder') : el('btn-type-toggle').classList.remove('is-sonder');
            } else {
                document.querySelectorAll('#m-t input, #m-t textarea').forEach(i => i.value = '');
                el('btn-rev-toggle').classList.remove('on'); el('btn-type-toggle').classList.remove('is-sonder');
            }
            el('btn-type-toggle').innerText = el('btn-type-toggle').classList.contains('is-sonder') ? "SONDERWERKZEUG (BLAUKISTE)" : "STANDARD (LAGER)";
            show('m-t');
        }

        function toggleType() {
            const b = el('btn-type-toggle'); b.classList.toggle('is-sonder');
            b.innerText = b.classList.contains('is-sonder') ? "SONDERWERKZEUG (BLAUKISTE)" : "STANDARD (LAGER)";
        }

        el('btn-rev-toggle').onclick = function() { this.classList.toggle('on'); };

        function saveT() {
            const t = {
                id: el('t-id').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(), dia: el('t-dia').value,
                bem: el('t-bem').value.toUpperCase(), rev: el('btn-rev-toggle').classList.contains('on'),
                isSonder: el('btn-type-toggle').classList.contains('is-sonder')
            };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(tEditIdx === null) db[currentIdx].tools.push(t); else db[currentIdx].tools[tEditIdx] = t;
            localStorage.setItem(DB_KEY, JSON.stringify(db)); hide('m-t'); renderTools();
        }

        function deleteProject(i) { if(confirm('Löschen?')) { db.splice(i,1); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); } }
        function delT() { db[currentIdx].tools.splice(tEditIdx, 1); localStorage.setItem(DB_KEY, JSON.stringify(db)); hide('m-t'); renderTools(); }
        function exportJSON() { el('imp-area').value = JSON.stringify(db); }
        function importJSON() { try { db = JSON.parse(el('imp-area').value); localStorage.setItem(DB_KEY, JSON.stringify(db)); renderList(); hide('m-imp'); } catch(e){alert('Error');} }

        function makePDF() {
            const p = db[currentIdx];
            const getPage = (title, tools) => `
                <div class="print-page">
                    <div style="position:absolute; inset:10mm; border:1.5px solid #000; padding:25px; box-sizing:border-box; display:flex; flex-direction:column;">
                        <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:10px;">
                            <div>
                                <div style="font-size:18px; font-weight:900; text-transform:uppercase;">${p.name}</div>
                                <div style="font-size:90px; font-weight:900; line-height:0.8; letter-spacing:-4px; margin-left:-4px;">${p.num}</div>
                            </div>
                            <div style="width:250px; font-size:12px; font-weight:800; line-height:1.7;">
                                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>LAUFZEIT</span><span>${p.lzf}</span></div>
                                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>MATERIAL</span><span>${p.mat}</span></div>
                                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>SÄGELÄNGE</span><span>${p.sag}</span></div>
                                <div style="display:flex; justify-content:space-between; border-bottom:1.5px solid #000;"><span>ABSTAND</span><span>${p.abs}</span></div>
                                <div style="display:flex; justify-content:space-between;"><span>STÜCKZAHL</span><span>${p.stt} / ${p.stn}</span></div>
                            </div>
                        </div>
                        <div style="border-bottom:7px solid #000; margin-bottom:12px;"></div>
                        <div style="flex:1;">
                            <div style="font-size:22px; font-weight:900; margin-bottom:8px; letter-spacing:-0.5px;">${title}</div>
                            <div style="display:flex; font-size:11px; font-weight:900; text-transform:uppercase; margin-bottom:5px; padding:0 2px;">
                                <div style="width:95px;">T-NR</div>
                                <div style="flex:1;">WERKZEUGNAME / KOMMENTAR</div>
                                <div style="width:135px; text-align:right;">Ø / TOLERANZ</div>
                            </div>
                            <div style="border-bottom:5px solid #000;"></div>
                            ${tools.map(t => `
                                <div style="display:flex; align-items:center; border-bottom:1.5px solid #000; padding:8px 0;">
                                    <div style="width:95px; font-weight:900; font-size:20px;">${t.id}</div>
                                    <div style="flex:1; padding-right:10px;">
                                        <div style="font-weight:800; font-size:17px; line-height:1.1; text-transform:uppercase;">${t.nm}</div>
                                        <div style="font-size:9px; font-weight:800; margin-top:1px;">
                                            <span style="color:#333;">${t.isSonder ? 'SONDERWERKZEUG' : 'STANDARD'}</span>
                                            ${t.bem ? ` | <span style="color:#000;">${t.bem}</span>` : ''}
                                        </div>
                                    </div>
                                    <div style="width:135px; text-align:right; font-weight:900; font-size:16px; line-height:1;">${t.dia.replace('/','<br>')}</div>
                                </div>`).join('')}
                        </div>
                        <div style="border-top:1.5px solid #000; padding-top:6px; font-size:11px; font-weight:900; display:flex; justify-content:space-between;">
                            <span>QS CENTRAL</span><span>PAGE ${title.includes('OBEN') ? '1' : '2'}</span>
                        </div>
                    </div>
                </div>`;

            let oben = [], unten = [], reached = false;
            (p.tools || []).forEach(t => { if(t.rev) reached = true; if(reached) unten.push(t); else oben.push(t); });

            let html = getPage("REVOLVER OBEN", oben);
            if(unten.length > 0) html += getPage("REVOLVER UNTEN", unten);

            el('print-container').innerHTML = html; 
            setTimeout(() => window.print(), 250);
        }

        window.onload = renderList;
    </script>
</body>
</html>
