<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2</title>
    <style>
        :root {
            --bg-color: #FFFFFF;
            --secondary-bg: #F2F2F7;
            --text-main: #000000;
            --text-secondary: #8E8E93;
            --border-ui: 1.5px solid #E5E5EA;
            --radius-input: 14px;
            --radius-modal: 24px;
            --accent-blue-bg: #E1F5FE;
            --accent-blue-text: #0288D1;
            --accent-orange-bg: #FFF3E0;
            --accent-orange-text: #EF6C00;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.4;
        }

        /* --- UI: HEADER --- */
        header {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: var(--border-ui);
            z-index: 100;
        }

        .header-btns { display: flex; gap: 8px; }
        .header-btns button {
            background: var(--secondary-bg);
            border: none;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        /* --- UI: LIST --- */
        #main-container {
            padding: 10px 20px;
            padding-bottom: 160px; /* Безопасная зона */
        }

        .project-header-card {
            margin-bottom: 24px;
            border-bottom: var(--border-ui);
            padding-bottom: 16px;
        }

        .tool-card {
            display: flex;
            align-items: center;
            padding: 16px 0;
            border-bottom: var(--border-ui);
            gap: 16px;
        }

        .sort-btns {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sort-btn {
            width: 44px;
            height: 44px;
            background: var(--secondary-bg);
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-content { flex-grow: 1; cursor: pointer; }
        
        .label-upper { font-size: 9px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px; }
        .value-major { font-size: 22px; font-weight: 900; color: var(--text-main); line-height: 1.1; margin-bottom: 4px; }
        .value-sub { font-size: 15px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }

        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }
        .tag-standard { background: var(--accent-blue-bg); color: var(--accent-blue-text); }
        .tag-sonder { background: var(--accent-orange-bg); color: var(--accent-orange-text); }

        /* --- FAB --- */
        .fab {
            position: fixed;
            right: 24px;
            bottom: 24px;
            width: 64px;
            height: 64px;
            background: #000;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            cursor: pointer;
            z-index: 99;
            border: none;
        }

        /* --- BOTTOM SHEET MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1000;
            align-items: flex-end;
        }

        .bottom-sheet {
            width: 100%;
            background: #fff;
            border-top-left-radius: var(--radius-modal);
            border-top-right-radius: var(--radius-modal);
            padding: 24px;
            padding-bottom: 40px;
            transform: translateY(100%);
            transition: transform 0.3s ease-out;
        }

        .modal-overlay.active { display: flex; }
        .modal-overlay.active .bottom-sheet { transform: translateY(0); }

        .sheet-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; text-align: center; }
        
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 10px; font-weight: 900; margin-bottom: 6px; color: var(--text-secondary); }
        .input-group input, .input-group select {
            width: 100%;
            background: var(--secondary-bg);
            border: none;
            border-radius: var(--radius-input);
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            outline: none;
        }

        .btn-main {
            width: 100%;
            background: #000;
            color: #fff;
            padding: 18px;
            border: none;
            border-radius: var(--radius-input);
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-delete {
            width: 100%;
            background: transparent;
            color: #FF3B30;
            padding: 12px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
        }

        /* --- PDF PRINT (MASTER FRAME) --- */
        #print-area { display: none; }

        @media print {
            @page { margin: 10mm; size: A4; }
            body { background: #fff; }
            header, #main-container, .fab, .modal-overlay, .no-print { display: none !important; }
            #print-area { display: block; width: 100%; }

            table.print-frame {
                width: 100%;
                border-collapse: collapse;
                border: 3px solid #000;
                table-layout: fixed;
            }

            .ph-left { padding: 10px 15px; border-bottom: 3px solid #000; width: 60%; vertical-align: top; }
            .ph-right { border-bottom: 3px solid #000; border-left: 3px solid #000; width: 40%; padding: 0; }

            .p-num { font-size: 52px; font-weight: 900; line-height: 0.9; margin: 4px 0; }
            .p-title { font-size: 11px; font-weight: 900; text-transform: uppercase; }

            .meta-table { width: 100%; border-collapse: collapse; }
            .meta-table td { border-bottom: 1px solid #000; padding: 5px 10px; font-size: 10px; font-weight: 900; height: 24px; }
            .meta-table tr:last-child td { border-bottom: none; }

            .cat-header { background: #000 !important; color: #fff !important; font-size: 12px; font-weight: 900; padding: 6px 15px; text-transform: uppercase; }

            .tool-row { page-break-inside: avoid; }
            .tool-row td { border-bottom: 2px solid #000; padding: 10px 15px; vertical-align: middle; }
            
            .p-tnm { font-size: 14px; font-weight: 900; text-transform: uppercase; }
            .p-tloc { font-size: 9px; font-weight: 900; text-transform: uppercase; margin-top: 2px; }
            .p-bem { text-align: right; }
            .p-bem-lbl { font-size: 8px; font-weight: 900; }
            .p-bem-val { font-size: 12px; font-weight: 900; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 18px;">SmartBox</div>
    <div class="header-btns no-print">
        <button onclick="exportJSON()">JSON</button>
        <button onclick="document.getElementById('fileInput').click()">Import</button>
        <button style="background: #000; color: #fff;" onclick="window.print()">PDF</button>
    </div>
</header>

<div id="main-container">
    <div class="project-header-card" onclick="openProjectEdit()">
        <div class="label-upper">PROJEKT</div>
        <div id="ui-proj-num" class="value-major">000000</div>
        <div id="ui-proj-name" class="value-sub">LADEN...</div>
    </div>

    <div id="tool-list">
        <!-- Инструменты будут здесь -->
    </div>
</div>

<button class="fab" onclick="openToolEdit(-1)">+</button>

<!-- BOTTOM SHEET: РЕДАКТИРОВАНИЕ ПРОЕКТА -->
<div id="project-modal" class="modal-overlay" onclick="closeModals(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-title">Данные проекта</div>
        <div class="input-group"><label>NUM</label><input type="text" id="edit-num"></div>
        <div class="input-group"><label>NAME</label><input type="text" id="edit-name"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="input-group"><label>MAT</label><input type="text" id="edit-mat"></div>
            <div class="input-group"><label>LZF</label><input type="text" id="edit-lzf"></div>
            <div class="input-group"><label>SÄGE</label><input type="text" id="edit-slg"></div>
            <div class="input-group"><label>ABST</label><input type="text" id="edit-abs"></div>
            <div class="input-group"><label>BACKEN</label><input type="text" id="edit-grf"></div>
            <div class="input-group"><label>STÜCK</label><input type="text" id="edit-stk"></div>
        </div>
        <button class="btn-main" onclick="saveProject()">Сохранить</button>
    </div>
</div>

<!-- BOTTOM SHEET: РЕДАКТИРОВАНИЕ ИНСТРУМЕНТА -->
<div id="tool-modal" class="modal-overlay" onclick="closeModals(event)">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-title">Инструмент</div>
        <div class="input-group"><label>BESCHREIBUNG</label><input type="text" id="t-edit-nm"></div>
        <div class="input-group"><label>TYP</label>
            <select id="t-edit-type">
                <option value="standard">Standard</option>
                <option value="sonder">Sonder</option>
            </select>
        </div>
        <div class="input-group"><label>BEMERKUNG</label><input type="text" id="t-edit-bem"></div>
        <div class="input-group" id="loc-group"><label>LAGERORT</label><input type="text" id="t-edit-loc"></div>
        <button class="btn-main" onclick="saveTool()">Speichern</button>
        <button class="btn-delete" id="del-tool-btn" onclick="deleteTool()">Löschen</button>
    </div>
</div>

<!-- PDF AREA -->
<div id="print-area">
    <table class="print-frame">
        <thead>
            <tr>
                <td class="ph-left">
                    <div id="p-proj-name" class="p-title">NAME</div>
                    <div id="p-proj-num" class="p-num">000000</div>
                </td>
                <td class="ph-right">
                    <table class="meta-table">
                        <tr><td style="border-right:1px solid #000;">MAT: <span id="pdf-mat"></span></td><td>LZF: <span id="pdf-lzf"></span></td></tr>
                        <tr><td style="border-right:1px solid #000;">SÄGE: <span id="pdf-slg"></span></td><td>ABST: <span id="pdf-abs"></span></td></tr>
                        <tr><td style="border-right:1px solid #000;">BACKEN: <span id="pdf-grf"></span></td><td>STÜCK: <span id="pdf-stk"></span></td></tr>
                    </table>
                </td>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<input type="file" id="fileInput" style="display:none" onchange="importJSON(event)">

<script>
    let appData = {
        num: "230947",
        name: "EINSCHRAUBNIPPEL DN10",
        mat: "1.4104 ⌀30", lzf: "4Min 45Sek", slg: "1003mm", abs: "0.5mm", grf: "18-25", stk: "100",
        tools: []
    };
    let currentEditIndex = -1;

    function render() {
        // UI
        document.getElementById('ui-proj-num').innerText = appData.num;
        document.getElementById('ui-proj-name').innerText = appData.name;
        
        const list = document.getElementById('tool-list');
        list.innerHTML = '';
        appData.tools.forEach((t, i) => {
            const card = document.createElement('div');
            card.className = 'tool-card';
            card.innerHTML = `
                <div class="sort-btns no-print">
                    <button class="sort-btn" onclick="moveT(${i}, -1); event.stopPropagation();">↑</button>
                    <button class="sort-btn" onclick="moveT(${i}, 1); event.stopPropagation();">↓</button>
                </div>
                <div class="card-content" onclick="openToolEdit(${i})">
                    <div class="label-upper">BEMERKUNG: ${t.bem || '--'}</div>
                    <div class="value-major">${t.nm}</div>
                    <div class="tag ${t.isStandart ? 'tag-standard' : 'tag-sonder'}">
                        ${t.isStandart ? 'Standard' : 'Sonder'}
                    </div>
                </div>
            `;
            list.appendChild(card);
        });

        // PDF SYNC
        document.getElementById('p-proj-num').innerText = appData.num;
        document.getElementById('p-proj-name').innerText = appData.name;
        document.getElementById('pdf-mat').innerText = appData.mat;
        document.getElementById('pdf-lzf').innerText = appData.lzf;
        document.getElementById('pdf-slg').innerText = appData.slg;
        document.getElementById('pdf-abs').innerText = appData.abs;
        document.getElementById('pdf-grf').innerText = appData.grf;
        document.getElementById('pdf-stk').innerText = appData.stk;

        const pdfBody = document.getElementById('pdf-body');
        pdfBody.innerHTML = '';

        const sonder = appData.tools.filter(t => !t.isStandart);
        const standard = appData.tools.filter(t => t.isStandart);

        if(sonder.length > 0) {
            pdfBody.innerHTML += `<tr><td colspan="2" class="cat-header">Sonderwerkzeuge</td></tr>`;
            sonder.forEach(t => pdfBody.innerHTML += createPdfRow(t));
        }
        if(standard.length > 0) {
            pdfBody.innerHTML += `<tr><td colspan="2" class="cat-header">Standardwerkzeuge</td></tr>`;
            standard.forEach(t => pdfBody.innerHTML += createPdfRow(t));
        }
    }

    function createPdfRow(t) {
        return `
            <tr class="tool-row">
                <td>
                    <div class="p-tnm">${t.nm}</div>
                    <div class="p-tloc">${t.isStandart ? (t.loc || 'FACH --') : 'IN BLAUKISTE'}</div>
                </td>
                <td class="p-bem">
                    <div class="p-bem-lbl">BEMERKUNG</div>
                    <div class="p-bem-val">${t.bem || '--'}</div>
                </td>
            </tr>
        `;
    }

    // --- MODALS ---
    function openProjectEdit() {
        document.getElementById('edit-num').value = appData.num;
        document.getElementById('edit-name').value = appData.name;
        document.getElementById('edit-mat').value = appData.mat;
        document.getElementById('edit-lzf').value = appData.lzf;
        document.getElementById('edit-slg').value = appData.slg;
        document.getElementById('edit-abs').value = appData.abs;
        document.getElementById('edit-grf').value = appData.grf;
        document.getElementById('edit-stk').value = appData.stk;
        document.getElementById('project-modal').classList.add('active');
    }

    function saveProject() {
        appData.num = document.getElementById('edit-num').value;
        appData.name = document.getElementById('edit-name').value;
        appData.mat = document.getElementById('edit-mat').value;
        appData.lzf = document.getElementById('edit-lzf').value;
        appData.slg = document.getElementById('edit-slg').value;
        appData.abs = document.getElementById('edit-abs').value;
        appData.grf = document.getElementById('edit-grf').value;
        appData.stk = document.getElementById('edit-stk').value;
        closeModals();
        render();
    }

    function openToolEdit(idx) {
        currentEditIndex = idx;
        if(idx === -1) {
            document.getElementById('t-edit-nm').value = "";
            document.getElementById('t-edit-bem').value = "";
            document.getElementById('t-edit-loc').value = "";
            document.getElementById('t-edit-type').value = "standard";
            document.getElementById('del-tool-btn').style.display = "none";
        } else {
            const t = appData.tools[idx];
            document.getElementById('t-edit-nm').value = t.nm;
            document.getElementById('t-edit-bem').value = t.bem || "";
            document.getElementById('t-edit-loc').value = t.loc || "";
            document.getElementById('t-edit-type').value = t.isStandart ? "standard" : "sonder";
            document.getElementById('del-tool-btn').style.display = "block";
        }
        document.getElementById('tool-modal').classList.add('active');
    }

    function saveTool() {
        const tObj = {
            nm: document.getElementById('t-edit-nm').value,
            bem: document.getElementById('t-edit-bem').value,
            loc: document.getElementById('t-edit-loc').value,
            isStandart: document.getElementById('t-edit-type').value === "standard"
        };
        if(currentEditIndex === -1) appData.tools.push(tObj);
        else appData.tools[currentEditIndex] = tObj;
        closeModals();
        render();
    }

    function deleteTool() {
        if(currentEditIndex > -1) {
            appData.tools.splice(currentEditIndex, 1);
            closeModals();
            render();
        }
    }

    function closeModals(e) {
        document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
    }

    function moveT(i, d) {
        let n = i + d;
        if(n >= 0 && n < appData.tools.length) {
            [appData.tools[i], appData.tools[n]] = [appData.tools[n], appData.tools[i]];
            render();
        }
    }

    // --- JSON ---
    function exportJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(appData, null, 2));
        const dl = document.createElement('a');
        dl.setAttribute("href", dataStr);
        dl.setAttribute("download", `SB_${appData.num}.json`);
        dl.click();
    }

    function importJSON(e) {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = (ev) => {
            const raw = JSON.parse(ev.target.result);
            const source = Array.isArray(raw) ? raw[0] : raw;
            appData = { ...appData, ...source };
            if(source.tools) appData.tools = source.tools.map(t => ({...t, isStandart: t.isStandart ?? true}));
            render();
        };
        reader.readAsText(file);
    }

    render();
</script>

</body>
</html>
