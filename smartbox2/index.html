<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL NEXT</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --accent: #007AFF;
            --text: #1C1C1E;
            --sub: #8E8E93;
            --danger: #FF3B30;
            --success: #34C759;
            --radius-lg: 20px;
            --radius-md: 14px;
            --shadow: 0 4px 12px rgba(0,0,0,0.05);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding-bottom: 100px;
            overflow-x: hidden;
        }

        /* Navigation */
        header {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .nav-brand { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .nav-brand span { color: var(--accent); }

        /* Cards */
        .container { padding: 12px; }
        .card {
            background: var(--card);
            border-radius: var(--radius-lg);
            margin-bottom: 12px;
            padding: 16px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
            position: relative;
        }
        .card:active { transform: scale(0.98); }

        .project-num { font-size: 24px; font-weight: 900; line-height: 1.1; margin-bottom: 4px; }
        .project-name { font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; }

        .tool-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            cursor: grab;
        }
        .tool-info .t-nr { font-size: 11px; color: var(--sub); font-weight: 700; margin-bottom: 2px; }
        .tool-info .t-desc { font-size: 17px; font-weight: 800; color: var(--text); }
        .tool-info .t-dia { color: var(--accent); font-weight: 700; font-size: 14px; margin-top: 2px; }

        .badge-rev {
            display: inline-block;
            background: #000;
            color: #fff;
            font-size: 9px;
            font-weight: 900;
            padding: 2px 6px;
            border-radius: 4px;
            margin-bottom: 6px;
        }

        /* Buttons */
        .btn-round {
            background: var(--accent);
            color: white;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab {
            position: fixed;
            bottom: 30px;
            right: 25px;
            width: 64px;
            height: 64px;
            border-radius: 32px;
            background: var(--accent);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(0,122,255,0.3);
            z-index: 999;
            border: none;
        }

        /* Modal / Sheets */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.4);
            display: none;
            align-items: flex-end;
            z-index: 2000;
        }
        .sheet {
            background: white;
            width: 100%;
            border-radius: 24px 24px 0 0;
            padding: 24px;
            max-height: 92vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        input, textarea {
            width: 100%;
            background: #F2F2F7;
            border: 1px solid #E5E5EA;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        input:focus { border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .full { grid-column: span 2; }

        .btn-action {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            font-weight: 700;
            border: none;
            margin-top: 8px;
            font-size: 16px;
        }
        .primary { background: var(--accent); color: white; }
        .ghost { background: transparent; color: var(--sub); }
        .danger { background: #fff; color: var(--danger); }

        /* Drag and Drop styles */
        .dragging { opacity: 0.5; border: 2px dashed var(--accent); }

        #detail-view { display: none; }
        .back-bar { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
        
        /* Print/PDF styles */
        @media print {
            body { background: white; padding: 0; }
            .no-print { display: none !important; }
            .card { box-shadow: none; border: 1px solid #000; border-radius: 0; page-break-inside: avoid; }
        }
    </style>
</head>
<body>

    <!-- Home View -->
    <div id="home-view">
        <header>
            <div class="nav-brand">QS <span>CENTRAL</span></div>
            <div style="display:flex; gap:10px;">
                <button class="btn-round" style="background:#E5E5EA; color:var(--text)" onclick="openSync()">
                    <i data-lucide="database"></i>
                </button>
            </div>
        </header>
        <div class="container" id="project-list"></div>
        <button class="fab" onclick="showProjectModal()"><i data-lucide="plus" size="32"></i></button>
    </div>

    <!-- Detail View -->
    <div id="detail-view">
        <header>
            <button class="btn-round" style="background:transparent; color:var(--text)" onclick="closeProject()">
                <i data-lucide="chevron-left"></i>
            </button>
            <div style="text-align:center">
                <div id="view-p-name" class="project-name">NAME</div>
                <div id="view-p-num" style="font-weight:900; font-size:18px;">0000</div>
            </div>
            <button class="btn-round" style="background:transparent; color:var(--accent)" onclick="exportPDF()">
                <i data-lucide="file-text"></i>
            </button>
        </header>
        
        <div class="container">
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:16px;">
                <button class="btn-action primary" style="margin:0" onclick="showToolModal()">+ Werkzeug</button>
                <button class="btn-action" style="margin:0; background:#E5E5EA" onclick="showProjectModal(currentIdx)">Edit Info</button>
            </div>
            <div id="tool-list"></div>
            <div style="height:80px;"></div> <!-- Padding for overlap -->
        </div>
    </div>

    <!-- Modals -->
    <div id="modal-project" class="overlay" onclick="closeModals(event)">
        <div class="sheet">
            <h3 id="p-modal-title" style="margin-top:0">Neues Projekt</h3>
            <input type="hidden" id="f-p-idx">
            <input type="text" id="f-p-num" placeholder="Zeichnungsnummer">
            <input type="text" id="f-p-nam" placeholder="Kunde / Name">
            <div class="grid">
                <input type="text" id="f-p-mat" placeholder="Material" class="full">
                <input type="text" id="f-p-lzf" placeholder="Laufzeit">
                <input type="text" id="f-p-sag" placeholder="Sägelänge">
                <input type="text" id="f-p-stt" placeholder="Soll (T)">
                <input type="text" id="f-p-stn" placeholder="Ist (N)">
            </div>
            <button class="btn-action primary" onclick="saveProject()">Speichern</button>
            <button class="btn-action ghost" onclick="hideModal('modal-project')">Abbrechen</button>
            <button id="btn-del-p" class="btn-action danger" style="display:none" onclick="deleteProject()">Projekt löschen</button>
        </div>
    </div>

    <div id="modal-tool" class="overlay" onclick="closeModals(event)">
        <div class="sheet">
            <h3 style="margin-top:0">Werkzeug</h3>
            <input type="hidden" id="f-t-idx">
            <input type="text" id="f-t-id" placeholder="T-Nr (z.B. T0101)">
            <input type="text" id="f-t-nm" placeholder="Beschreibung">
            <input type="text" id="f-t-dia" placeholder="Ø / Toleranz">
            
            <div style="margin: 10px 0;">
                <label style="font-size:12px; font-weight:700; color:var(--sub)">REVOLVER POSITION</label>
                <button id="f-t-rev" class="btn-action" style="background:#F2F2F7; border: 1px solid #DDD;" onclick="toggleRev()">
                    OBEN
                </button>
            </div>

            <button class="btn-action primary" onclick="saveTool()">Speichern</button>
            <button id="btn-del-t" class="btn-action danger" onclick="deleteTool()">Löschen</button>
            <button class="btn-action ghost" onclick="hideModal('modal-tool')">Abbrechen</button>
        </div>
    </div>

    <div id="modal-sync" class="overlay" onclick="closeModals(event)">
        <div class="sheet">
            <h3 style="margin-top:0">Daten Management</h3>
            <p style="font-size:12px; color:var(--sub)">Kopieren Sie den Code für ein Backup oder fügen Sie einen Code ein.</p>
            <textarea id="f-sync-data" rows="8" style="font-family: monospace; font-size:12px;"></textarea>
            <div class="grid">
                <button class="btn-action primary" onclick="importData()">Import</button>
                <button class="btn-action" style="background:#E5E5EA" onclick="copyData()">Kopieren</button>
            </div>
            <button class="btn-action ghost" onclick="hideModal('modal-sync')">Schließen</button>
        </div>
    </div>

    <script>
        // --- Core Logic ---
        const DB_KEY = 'QS_CENTRAL_NEXT_DB';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;
        let isRevDown = false;

        function save() {
            localStorage.setItem(DB_KEY, JSON.stringify(db));
            renderProjects();
            if(currentIdx !== null) renderTools();
        }

        // --- UI Navigation ---
        function showModal(id) { document.getElementById(id).style.display = 'flex'; }
        function hideModal(id) { document.getElementById(id).style.display = 'none'; }
        function closeModals(e) { if(e.target.classList.contains('overlay')) e.target.style.display = 'none'; }

        function openProject(idx) {
            currentIdx = idx;
            const p = db[idx];
            document.getElementById('home-view').style.display = 'none';
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('view-p-name').textContent = p.nam || '---';
            document.getElementById('view-p-num').textContent = p.num || '0000';
            renderTools();
        }

        function closeProject() {
            currentIdx = null;
            document.getElementById('home-view').style.display = 'block';
            document.getElementById('detail-view').style.display = 'none';
        }

        // --- Project CRUD ---
        function showProjectModal(idx = null) {
            const isEdit = idx !== null;
            document.getElementById('f-p-idx').value = isEdit ? idx : '';
            document.getElementById('p-modal-title').textContent = isEdit ? 'Projekt bearbeiten' : 'Neues Projekt';
            document.getElementById('btn-del-p').style.display = isEdit ? 'block' : 'none';
            
            const p = isEdit ? db[idx] : {};
            document.getElementById('f-p-num').value = p.num || '';
            document.getElementById('f-p-nam').value = p.nam || '';
            document.getElementById('f-p-mat').value = p.mat || '';
            document.getElementById('f-p-lzf').value = p.lzf || '';
            document.getElementById('f-p-sag').value = p.sag || '';
            document.getElementById('f-p-stt').value = p.stt || '';
            document.getElementById('f-p-stn').value = p.stn || '';
            
            showModal('modal-project');
        }

        function saveProject() {
            const idx = document.getElementById('f-p-idx').value;
            const data = {
                num: document.getElementById('f-p-num').value,
                nam: document.getElementById('f-p-nam').value.toUpperCase(),
                mat: document.getElementById('f-p-mat').value,
                lzf: document.getElementById('f-p-lzf').value,
                sag: document.getElementById('f-p-sag').value,
                stt: document.getElementById('f-p-stt').value,
                stn: document.getElementById('f-p-stn').value,
                tools: idx === '' ? [] : (db[idx].tools || [])
            };

            if(idx === '') db.push(data);
            else db[idx] = data;

            save();
            hideModal('modal-project');
            if(idx !== '') openProject(idx);
        }

        function deleteProject() {
            if(!confirm("Projekt wirklich löschen?")) return;
            db.splice(currentIdx, 1);
            save();
            closeProject();
            hideModal('modal-project');
        }

        // --- Tool CRUD ---
        function showToolModal(tIdx = null) {
            const isEdit = tIdx !== null;
            document.getElementById('f-t-idx').value = isEdit ? tIdx : '';
            document.getElementById('btn-del-t').style.display = isEdit ? 'block' : 'none';

            const t = isEdit ? db[currentIdx].tools[tIdx] : {};
            document.getElementById('f-t-id').value = t.id || '';
            document.getElementById('f-t-nm').value = t.nm || '';
            document.getElementById('f-t-dia').value = t.dia || '';
            isRevDown = t.rev || false;
            updateRevUI();

            showModal('modal-tool');
        }

        function toggleRev() {
            isRevDown = !isRevDown;
            updateRevUI();
        }

        function updateRevUI() {
            const btn = document.getElementById('f-t-rev');
            btn.textContent = isRevDown ? 'UNTEN' : 'OBEN';
            btn.style.background = isRevDown ? '#000' : '#F2F2F7';
            btn.style.color = isRevDown ? '#FFF' : '#000';
        }

        function saveTool() {
            const tIdx = document.getElementById('f-t-idx').value;
            const tool = {
                id: document.getElementById('f-t-id').value.toUpperCase(),
                nm: document.getElementById('f-t-nm').value.toUpperCase(),
                dia: document.getElementById('f-t-dia').value,
                rev: isRevDown
            };

            if(tIdx === '') db[currentIdx].tools.push(tool);
            else db[currentIdx].tools[tIdx] = tool;

            save();
            hideModal('modal-tool');
        }

        function deleteTool() {
            const tIdx = document.getElementById('f-t-idx').value;
            db[currentIdx].tools.splice(tIdx, 1);
            save();
            hideModal('modal-tool');
        }

        // --- Rendering ---
        function renderProjects() {
            const list = document.getElementById('project-list');
            list.innerHTML = db.map((p, i) => `
                <div class="card" onclick="openProject(${i})">
                    <div class="project-name">${p.nam || 'UNBENANNT'}</div>
                    <div class="project-num">${p.num || '----'}</div>
                    <div style="font-size:10px; color:var(--sub); margin-top:8px">
                        ${p.tools?.length || 0} Werkzeuge • ${p.mat || 'Material n.A.'}
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function renderTools() {
            const list = document.getElementById('tool-list');
            const tools = db[currentIdx].tools || [];
            
            list.innerHTML = tools.map((t, i) => `
                <div class="card tool-card" draggable="true" ondragstart="handleDragStart(event, ${i})" ondragover="handleDragOver(event)" ondrop="handleDrop(event, ${i})" onclick="showToolModal(${i})">
                    <div class="tool-info">
                        ${t.rev ? '<div class="badge-rev">UNTEN</div>' : ''}
                        <div class="t-nr">${t.id || 'T---'}</div>
                        <div class="t-desc">${t.nm || 'Keine Beschreibung'}</div>
                        <div class="t-dia">${t.dia || ''}</div>
                    </div>
                    <div style="color:var(--sub)">
                        <i data-lucide="grip-vertical"></i>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        // --- Drag & Drop Reordering ---
        let dragSrcIdx = null;
        function handleDragStart(e, idx) {
            dragSrcIdx = idx;
            e.target.classList.add('dragging');
        }
        function handleDragOver(e) { e.preventDefault(); }
        function handleDrop(e, targetIdx) {
            e.preventDefault();
            if(dragSrcIdx === targetIdx) return;
            const tools = db[currentIdx].tools;
            const item = tools.splice(dragSrcIdx, 1)[0];
            tools.splice(targetIdx, 0, item);
            save();
        }

        // --- Data Management ---
        function openSync() {
            document.getElementById('f-sync-data').value = JSON.stringify(db, null, 2);
            showModal('modal-sync');
        }
        function copyData() {
            const area = document.getElementById('f-sync-data');
            area.select();
            document.execCommand('copy');
            alert("Код скопирован в буфер обмена!");
        }
        function importData() {
            try {
                const data = JSON.parse(document.getElementById('f-sync-data').value);
                if(Array.isArray(data)) {
                    db = data;
                    save();
                    location.reload();
                }
            } catch(e) { alert("Invalid JSON"); }
        }

        // --- PDF Export ---
        function exportPDF() {
            const p = db[currentIdx];
            const oben = (p.tools || []).filter(t => !t.rev);
            const unten = (p.tools || []).filter(t => t.rev);
            
            const rows = (arr) => arr.map(t => `
                <tr>
                    <td style="padding:10px; border-bottom:1px solid #eee"><b>${t.id}</b></td>
                    <td style="padding:10px; border-bottom:1px solid #eee">${t.nm}</td>
                    <td style="padding:10px; border-bottom:1px solid #eee; text-align:right"><b>${t.dia}</b></td>
                </tr>
            `).join('');

            const win = window.open('', '_blank');
            win.document.write(`
                <html>
                <body style="font-family:sans-serif; padding:40px; color:#333">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:10px; margin-bottom:20px">
                        <div>
                            <div style="font-size:14px; text-transform:uppercase; font-weight:bold">${p.nam}</div>
                            <div style="font-size:48px; font-weight:900; margin-top:-5px">${p.num}</div>
                        </div>
                        <div style="text-align:right; font-size:12px">
                            ${p.mat} | LZ: ${p.lzf} | S: ${p.sag}<br>
                            Soll: ${p.stt} | Ist: ${p.stn}
                        </div>
                    </div>
                    
                    <h3 style="background:#f0f0f0; padding:8px">REVOLVER OBEN</h3>
                    <table style="width:100%; border-collapse:collapse; margin-bottom:30px">${rows(oben)}</table>
                    
                    <h3 style="background:#f0f0f0; padding:8px">REVOLVER UNTEN</h3>
                    <table style="width:100%; border-collapse:collapse">${rows(unten)}</table>
                    
                    <script>setTimeout(() => { window.print(); }, 500);<\/script>
                </body>
                </html>
            `);
            win.document.close();
        }

        window.onload = () => {
            renderProjects();
            lucide.createIcons();
        };
    </script>
</body>
</html>
