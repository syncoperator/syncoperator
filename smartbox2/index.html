<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO V2 - Final Edition</title>
    <style>
        :root {
            --bg-color: #FFFFFF;
            --secondary-bg: #F2F2F7;
            --text-main: #000000;
            --text-secondary: #8E8E93;
            --border-heavy: 3px solid #000;
            --border-medium: 2px solid #000;
            --border-ui: 1.5px solid #E5E5EA;
            --radius-input: 14px;
            --radius-modal: 24px;
            --font-main: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Roboto", sans-serif;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--bg-color);
            color: var(--text-main);
        }

        /* --- UI ИНТЕРФЕЙС --- */
        header {
            position: sticky; top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; border-bottom: var(--border-ui); z-index: 100;
        }

        .header-btns { display: flex; gap: 8px; }
        .header-btns button {
            background: var(--secondary-bg); border: none; padding: 8px 14px;
            border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
        }

        #main-container { padding: 10px 20px; padding-bottom: 160px; }

        .project-card { margin-bottom: 24px; padding: 16px 0; border-bottom: var(--border-ui); cursor: pointer; }
        .label-mini { font-size: 9px; font-weight: 900; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 2px; }
        .val-huge { font-size: 24px; font-weight: 900; line-height: 1; margin-bottom: 4px; }
        .val-sub { font-size: 16px; font-weight: 700; }

        .tool-card {
            display: flex; align-items: center; padding: 16px 0;
            border-bottom: var(--border-ui); gap: 16px;
        }

        .sort-controls { display: flex; flex-direction: column; gap: 4px; }
        .sort-btn {
            width: 42px; height: 42px; background: var(--secondary-bg);
            border: none; border-radius: 10px; font-size: 18px; cursor: pointer;
        }

        .card-body { flex-grow: 1; cursor: pointer; }
        .tag {
            display: inline-block; padding: 3px 8px; border-radius: 6px;
            font-size: 10px; font-weight: 800; text-transform: uppercase; margin-top: 6px;
        }
        .tag-std { background: #E1F5FE; color: #0288D1; }
        .tag-son { background: #FFF3E0; color: #EF6C00; }

        .fab {
            position: fixed; right: 24px; bottom: 24px;
            width: 64px; height: 64px; background: #000; color: #fff;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 32px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); border: none; z-index: 99;
        }

        /* --- МОДАЛЬНЫЕ ОКНА (BOTTOM SHEET) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4); display: none; z-index: 1000; align-items: flex-end;
        }
        .modal-overlay.active { display: flex; }

        .bottom-sheet {
            width: 100%; background: #fff; border-radius: var(--radius-modal) var(--radius-modal) 0 0;
            padding: 24px; padding-bottom: 40px; transform: translateY(100%); transition: transform 0.25s ease-out;
        }
        .modal-overlay.active .bottom-sheet { transform: translateY(0); }

        .sheet-title { font-size: 20px; font-weight: 900; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 16px; }
        .input-group label { display: block; font-size: 10px; font-weight: 900; margin-bottom: 6px; color: var(--text-secondary); }
        .input-group input, .input-group select {
            width: 100%; background: var(--secondary-bg); border: none; border-radius: var(--radius-input);
            padding: 14px; font-size: 16px; font-weight: 600; outline: none;
        }

        .btn-black {
            width: 100%; background: #000; color: #fff; padding: 18px;
            border: none; border-radius: var(--radius-input); font-size: 16px; font-weight: 800;
        }
        .btn-del { width: 100%; background: none; color: #FF3B30; padding: 12px; border: none; font-weight: 700; }

        /* --- PDF LAYOUT (ТЕХНИЧЕСКИЙ БЛАНК) --- */
        #pdf-export { display: none; }

        @media print {
            @page { margin: 8mm; size: A4 portrait; }
            body { background: #fff; }
            header, #main-container, .fab, .modal-overlay, .no-print { display: none !important; }
            #pdf-export { display: block; width: 100%; }

            table.master-frame {
                width: 100%; border-collapse: collapse; border: var(--border-heavy); table-layout: fixed;
            }

            /* Шапка в thead для авто-дублирования */
            thead { display: table-header-group; }
            
            .ph-main { padding: 10px 15px; border-bottom: var(--border-heavy); width: 62%; vertical-align: top; }
            .ph-meta { border-bottom: var(--border-heavy); border-left: var(--border-heavy); width: 38%; padding: 0; }

            .p-num { font-size: 54px; font-weight: 900; line-height: 0.85; margin: 5px 0; letter-spacing: -2px; }
            .p-title { font-size: 12px; font-weight: 900; text-transform: uppercase; }

            .meta-grid { width: 100%; border-collapse: collapse; }
            .meta-grid td { 
                border-bottom: 1px solid #000; padding: 4px 10px; font-size: 10px; 
                font-weight: 900; height: 26px; text-transform: uppercase;
            }
            .meta-grid tr:last-child td { border-bottom: none; }
            .meta-grid .val-right { text-align: right; }

            .cat-banner { 
                background: #000 !important; color: #fff !important; 
                font-size: 13px; font-weight: 900; padding: 6px 15px; 
                text-transform: uppercase; border-bottom: var(--border-heavy);
            }

            .row-tool { page-break-inside: avoid; }
            .row-tool td { border-bottom: var(--border-medium); padding: 8px 15px; vertical-align: middle; }
            
            .txt-nm { font-size: 14px; font-weight: 900; text-transform: uppercase; }
            .txt-loc { font-size: 9px; font-weight: 900; text-transform: uppercase; margin-top: 3px; }
            
            .col-bem { border-left: var(--border-medium); width: 120px; text-align: right; }
            .bem-lbl { font-size: 8px; font-weight: 900; display: block; }
            .bem-val { font-size: 12px; font-weight: 900; text-transform: uppercase; }
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 900; font-size: 18px;">SMARTBOX V2</div>
    <div class="header-btns no-print">
        <button onclick="exportData()">JSON</button>
        <button onclick="document.getElementById('fileIn').click()">Import</button>
        <button style="background: #000; color: #fff;" onclick="window.print()">PRINT PDF</button>
    </div>
</header>

<div id="main-container">
    <div class="project-card" onclick="openProjEdit()">
        <div class="label-mini">PROJEKT</div>
        <div id="ui-p-num" class="val-huge">000000</div>
        <div id="ui-p-name" class="val-sub">ЗАГРУЗКА...</div>
    </div>
    <div id="tool-list"></div>
</div>

<button class="fab no-print" onclick="openToolEdit(-1)">+</button>

<!-- MODALS -->
<div id="modal-proj" class="modal-overlay" onclick="closeM()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-title">Параметры проекта</div>
        <div class="input-group"><label>NUM</label><input type="text" id="in-num"></div>
        <div class="input-group"><label>NAME</label><input type="text" id="in-name"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <div class="input-group"><label>MAT</label><input type="text" id="in-mat"></div>
            <div class="input-group"><label>LZF</label><input type="text" id="in-lzf"></div>
            <div class="input-group"><label>SÄGE</label><input type="text" id="in-slg"></div>
            <div class="input-group"><label>ABST</label><input type="text" id="in-abs"></div>
            <div class="input-group"><label>BACKEN</label><input type="text" id="in-grf"></div>
            <div class="input-group"><label>STÜCK</label><input type="text" id="in-stk"></div>
        </div>
        <button class="btn-black" onclick="saveProj()">SPEICHERN</button>
    </div>
</div>

<div id="modal-tool" class="modal-overlay" onclick="closeM()">
    <div class="bottom-sheet" onclick="event.stopPropagation()">
        <div class="sheet-title">Инструмент</div>
        <div class="input-group"><label>BESCHREIBUNG</label><input type="text" id="t-in-nm"></div>
        <div class="input-group"><label>TYP</label>
            <select id="t-in-type">
                <option value="sonder">Sonderwerkzeug</option>
                <option value="standard">Standardwerkzeug</option>
            </select>
        </div>
        <div class="input-group"><label>BEMERKUNG</label><input type="text" id="t-in-bem"></div>
        <div class="input-group"><label>LAGERORT / KOMMENTAR</label><input type="text" id="t-in-loc"></div>
        <button class="btn-black" onclick="saveTool()">SPEICHERN</button>
        <button class="btn-del" id="t-del-btn" onclick="delTool()">LÖSCHEN</button>
    </div>
</div>

<!-- PDF RENDER AREA -->
<div id="pdf-export">
    <table class="master-frame">
        <thead>
            <tr>
                <td class="ph-main">
                    <div id="pdf-p-name" class="p-title">PROJECT</div>
                    <div id="pdf-p-num" class="p-num">000000</div>
                </td>
                <td class="ph-meta">
                    <table class="meta-grid">
                        <tr><td>MAT</td><td class="val-right" id="pdf-mat"></td></tr>
                        <tr><td>LZF</td><td class="val-right" id="pdf-lzf"></td></tr>
                        <tr><td>SÄGE</td><td class="val-right" id="pdf-slg"></td></tr>
                        <tr><td>ABST</td><td class="val-right" id="pdf-abs"></td></tr>
                        <tr><td>BACKEN</td><td class="val-right" id="pdf-grf"></td></tr>
                        <tr><td>STÜCK</td><td class="val-right" id="pdf-stk"></td></tr>
                    </table>
                </td>
            </tr>
        </thead>
        <tbody id="pdf-body"></tbody>
    </table>
</div>

<input type="file" id="fileIn" style="display:none" onchange="importData(event)">

<script>
    let state = {
        num: "230947", name: "EINSCHRAUBNIPPEL DN10",
        mat: "1.4104 ⌀30", lzf: "4Min 45Sek", slg: "1003mm", abs: "0.5mm", grf: "18-25", stk: "100",
        tools: []
    };
    let editIdx = -1;

    function render() {
        // UI Sync
        document.getElementById('ui-p-num').innerText = state.num;
        document.getElementById('ui-p-name').innerText = state.name;

        const list = document.getElementById('tool-list');
        list.innerHTML = '';
        state.tools.forEach((t, i) => {
            const div = document.createElement('div');
            div.className = 'tool-card';
            div.innerHTML = `
                <div class="sort-controls no-print">
                    <button class="sort-btn" onclick="moveT(${i},-1);event.stopPropagation()">↑</button>
                    <button class="sort-btn" onclick="moveT(${i},1);event.stopPropagation()">↓</button>
                </div>
                <div class="card-body" onclick="openToolEdit(${i})">
                    <div class="label-mini">BEMERKUNG: ${t.bem || '--'}</div>
                    <div class="val-huge" style="font-size: 20px;">${t.nm}</div>
                    <div class="tag ${t.isStandart ? 'tag-std' : 'tag-son'}">${t.isStandart ? 'Standard' : 'Sonder'}</div>
                </div>
            `;
            list.appendChild(div);
        });

        // PDF Sync
        document.getElementById('pdf-p-num').innerText = state.num;
        document.getElementById('pdf-p-name').innerText = state.name.toUpperCase();
        document.getElementById('pdf-mat').innerText = (state.mat || '--').toUpperCase();
        document.getElementById('pdf-lzf').innerText = (state.lzf || '--').toUpperCase();
        document.getElementById('pdf-slg').innerText = (state.slg || '--').toUpperCase();
        document.getElementById('pdf-abs').innerText = (state.abs || '--').toUpperCase();
        document.getElementById('pdf-grf').innerText = (state.grf || '--').toUpperCase();
        document.getElementById('pdf-stk').innerText = (state.stk || '--').toUpperCase();

        const pdfBody = document.getElementById('pdf-body');
        pdfBody.innerHTML = '';

        const sonder = state.tools.filter(t => !t.isStandart);
        const standard = state.tools.filter(t => t.isStandart);

        if(sonder.length > 0) {
            pdfBody.innerHTML += `<tr><td colspan="2" class="cat-banner">SONDERWERKZEUGE</td></tr>`;
            sonder.forEach(t => pdfBody.innerHTML += pdfRow(t));
        }
        if(standard.length > 0) {
            pdfBody.innerHTML += `<tr><td colspan="2" class="cat-banner">STANDARTWERKZEUGE</td></tr>`;
            standard.forEach(t => pdfBody.innerHTML += pdfRow(t));
        }
    }

    function pdfRow(t) {
        const name = (t.nm || '--').toUpperCase();
        const loc = t.isStandart ? (t.loc || '--').toUpperCase() : 'IN BLAUKISTE';
        const bem = (t.bem || '--').toUpperCase();
        return `
            <tr class="row-tool">
                <td>
                    <div class="txt-nm">${name}</div>
                    <div class="txt-loc">${loc}</div>
                </td>
                <td class="col-bem">
                    <span class="bem-lbl">BEMERKUNG</span>
                    <span class="bem-val">${bem}</span>
                </td>
            </tr>
        `;
    }

    // Modal Logic
    function openProjEdit() {
        document.getElementById('in-num').value = state.num;
        document.getElementById('in-name').value = state.name;
        document.getElementById('in-mat').value = state.mat;
        document.getElementById('in-lzf').value = state.lzf;
        document.getElementById('in-slg').value = state.slg;
        document.getElementById('in-abs').value = state.abs;
        document.getElementById('in-grf').value = state.grf;
        document.getElementById('in-stk').value = state.stk;
        document.getElementById('modal-proj').classList.add('active');
    }
    function saveProj() {
        state.num = document.getElementById('in-num').value;
        state.name = document.getElementById('in-name').value;
        state.mat = document.getElementById('in-mat').value;
        state.lzf = document.getElementById('in-lzf').value;
        state.slg = document.getElementById('in-slg').value;
        state.abs = document.getElementById('in-abs').value;
        state.grf = document.getElementById('in-grf').value;
        state.stk = document.getElementById('in-stk').value;
        closeM(); render();
    }
    function openToolEdit(idx) {
        editIdx = idx;
        if(idx === -1) {
            document.getElementById('t-in-nm').value = "";
            document.getElementById('t-in-bem').value = "";
            document.getElementById('t-in-loc').value = "";
            document.getElementById('t-in-type').value = "standard";
            document.getElementById('t-del-btn').style.display = "none";
        } else {
            const t = state.tools[idx];
            document.getElementById('t-in-nm').value = t.nm;
            document.getElementById('t-in-bem').value = t.bem || "";
            document.getElementById('t-in-loc').value = t.loc || "";
            document.getElementById('t-in-type').value = t.isStandart ? "standard" : "sonder";
            document.getElementById('t-del-btn').style.display = "block";
        }
        document.getElementById('modal-tool').classList.add('active');
    }
    function saveTool() {
        const obj = {
            nm: document.getElementById('t-in-nm').value,
            bem: document.getElementById('t-in-bem').value,
            loc: document.getElementById('t-in-loc').value,
            isStandart: document.getElementById('t-in-type').value === "standard"
        };
        if(editIdx === -1) state.tools.push(obj); else state.tools[editIdx] = obj;
        closeM(); render();
    }
    function delTool() { state.tools.splice(editIdx, 1); closeM(); render(); }
    function closeM() { document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active')); }

    function moveT(i, d) {
        let n = i + d;
        if(n >= 0 && n < state.tools.length) {
            [state.tools[i], state.tools[n]] = [state.tools[n], state.tools[i]];
            render();
        }
    }

    function exportData() {
        const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `SBOX_${state.num}.json`;
        a.click();
    }
    function importData(e) {
        const reader = new FileReader();
        reader.onload = (ev) => {
            const data = JSON.parse(ev.target.result);
            const src = Array.isArray(data) ? data[0] : data;
            state = { ...state, ...src };
            if(src.tools) state.tools = src.tools.map(t => ({...t, isStandart: t.isStandart ?? true}));
            render();
        };
        reader.readAsText(e.target.files[0]);
    }

    render();
</script>
</body>
</html>
