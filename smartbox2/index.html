<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SMARTBOX PRO PREMIUM</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f2f2f7;
            --accent: #007aff;
            --card: #ffffff;
            --text: #1c1c1e;
            --sub: #8e8e93;
            --danger: #ff3b30;
            --success: #34c759;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); 
            font-family: 'Inter', -apple-system, sans-serif; 
            margin: 0; 
            color: var(--text); 
            padding-bottom: 120px; 
        }

        /* Navigation */
        .nav-bar {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
        }

        .nav-title { font-weight: 900; font-size: 22px; margin: 0; letter-spacing: -1px; }
        .nav-title span { color: var(--accent); }
        
        .nav-info { text-align: center; flex: 1; cursor: pointer; }
        .nav-info span { display: block; font-size: 11px; font-weight: 700; color: var(--sub); text-transform: uppercase; }
        .nav-info b { font-size: 18px; font-weight: 900; }

        .btn-plus { 
            background: var(--text); color: #fff; border: none; 
            padding: 8px 16px; border-radius: 10px; font-weight: 800; font-size: 13px; 
        }

        .nav-btn { 
            background: var(--bg); border: none; border-radius: 10px; 
            width: 40px; height: 40px; font-weight: 900; color: var(--accent); cursor: pointer;
        }

        /* Content */
        .content-scroll { padding: 10px 0; }

        .project-card {
            background: var(--card); border-radius: 20px; margin: 10px 16px; 
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .p-num-big { font-size: 26px; font-weight: 900; letter-spacing: -1px; }
        .p-name-sub { font-size: 12px; font-weight: 700; color: var(--sub); text-transform: uppercase; }

        .action-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 16px 15px;
        }

        .btn-main {
            padding: 14px; border-radius: 14px; border: none; font-weight: 800; font-size: 15px;
        }
        .btn-main.primary { background: var(--accent); color: #fff; }
        .btn-main.secondary { background: #e5e5ea; color: var(--text); }

        /* Tool Cards - Твой дизайн */
        .tool-card {
            background: var(--card); border-radius: 18px; margin: 8px 16px; 
            padding: 16px; display: flex; justify-content: space-between; align-items: center;
        }
        .t-label { font-size: 9px; font-weight: 900; color: var(--sub); text-transform: uppercase; }
        .t-val-big { font-size: 20px; font-weight: 900; line-height: 1.1; margin: 2px 0; }
        .t-name-sub { font-size: 14px; font-weight: 700; color: var(--text); }
        
        .tag { 
            display: inline-block; padding: 4px 8px; border-radius: 6px; 
            font-size: 10px; font-weight: 900; margin-top: 6px; text-transform: uppercase;
        }
        .tag.sonder { background: #fff2e8; color: #ff9500; }
        .tag.standart { background: #e8f2ff; color: #007aff; }

        /* Modals / Sheets */
        .overlay {
            display: none; position: fixed; inset: 0; 
            background: rgba(0,0,0,0.5); z-index: 2000; align-items: flex-end;
        }
        .sheet {
            background: #fff; width: 100%; border-radius: 25px 25px 0 0; 
            padding: 20px 24px 40px; max-height: 90vh; overflow-y: auto;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        .sheet-bar { 
            width: 40px; height: 5px; background: #e5e5ea; 
            border-radius: 3px; margin: 0 auto 20px; 
        }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .field { margin-bottom: 15px; }
        .field.full { grid-column: span 2; }
        .field label { display: block; font-size: 11px; font-weight: 800; color: var(--sub); text-transform: uppercase; margin-bottom: 6px; margin-left: 4px; }
        
        input, textarea {
            width: 100%; padding: 14px; border-radius: 12px; border: 1.5px solid #efeff4;
            background: #f9f9fb; font-size: 16px; font-weight: 600; font-family: inherit;
        }

        .btn-action {
            width: 100%; padding: 16px; border-radius: 16px; border: none; 
            font-weight: 800; font-size: 16px; margin-top: 10px;
        }
        .btn-action.primary { background: var(--text); color: #fff; }
        .btn-action.danger { background: none; color: var(--danger); }
        .btn-action.ghost { background: none; color: var(--sub); }

        .toggle-box {
            background: #f2f2f7; padding: 14px; border-radius: 12px;
            text-align: center; font-weight: 800; cursor: pointer; border: 2px solid transparent;
        }
        .toggle-box.active { background: var(--success); color: #fff; }

        #print-container { display: none; }
    </style>
</head>
<body>

    <div id="v-home" class="view">
        <div class="nav-bar">
            <h1 class="nav-title">SMART<span>BOX</span></h1>
            <button class="btn-plus" onclick="modalP()">+ PROJEKT</button>
        </div>
        <div id="list-p" class="content-scroll"></div>
    </div>

    <div id="v-det" class="view" style="display:none">
        <div class="nav-bar">
            <button class="nav-btn" onclick="goHome()">←</button>
            <div class="nav-info" onclick="editCurrentProject()">
                <span id="h-nam">NAME</span>
                <b id="h-num">000000</b>
            </div>
            <button class="nav-btn" onclick="makePDF()">PDF</button>
        </div>
        <div class="action-grid" style="margin-top:15px;">
            <button class="btn-main primary" onclick="modalT()">+ Werkzeug</button>
            <button class="btn-main secondary" onclick="openData()">Daten</button>
        </div>
        <div id="list-t" class="content-scroll"></div>
    </div>

    <div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <input type="hidden" id="p-idx">
            <div class="form-grid">
                <div class="field full"><label>Projekt Nummer</label><input type="text" id="p-num" placeholder="000000"></div>
                <div class="field full"><label>Kunde / Bezeichnung</label><input type="text" id="p-nam" placeholder="NAME"></div>
                <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="field"><label>Material</label><input type="text" id="p-mat"></div>
                <div class="field"><label>Säge</label><input type="text" id="p-sag"></div>
                <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="field"><label>Backen</label><input type="text" id="p-grf"></div>
                <div class="field"><label>Stock</label><input type="text" id="p-stk"></div>
            </div>
            <button class="btn-action primary" onclick="saveP()">Speichern</button>
            <button id="btn-del-p" class="btn-action danger" style="display:none" onclick="delProject()">Projekt Löschen</button>
        </div>
    </div>

    <div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <input type="hidden" id="t-idx">
            <div class="field full"><label>Bemerkung (T-NR / ИНФО)</label><input type="text" id="t-id"></div>
            <div class="field full"><label>Werkzeug Name</label><input type="text" id="t-nm"></div>
            <div class="field full">
                <label>Lagerung</label>
                <div id="t-storage" class="toggle-box" onclick="this.classList.toggle('active'); this.innerText = this.classList.contains('active') ? 'STANDART (STORAGE)' : 'SONDER (BLAUKISTE)';">SONDER (BLAUKISTE)</div>
            </div>
            <div class="field"><label>Lagerort</label><input type="text" id="t-loc" placeholder="A1 / B2"></div>
            <div class="field"><label>Info</label><input type="text" id="t-kom" placeholder="Optional"></div>
            
            <button class="btn-action primary" onclick="saveT()">Speichern</button>
            <button id="btn-del-t" class="btn-action danger" onclick="delT()">Löschen</button>
        </div>
    </div>

    <div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <textarea id="imp-area" rows="8" placeholder="JSON Data..."></textarea>
            <div class="action-grid" style="padding: 15px 0 0;">
                <button class="btn-main primary" onclick="exportJSON()">Export</button>
                <button class="btn-main secondary" onclick="importJSON()">Import</button>
            </div>
        </div>
    </div>

    <script>
        const DB_KEY = 'SMARTBOX_ULTIMATE_V1';
        let db = JSON.parse(localStorage.getItem(DB_KEY)) || [];
        let currentIdx = null;

        const el = id => document.getElementById(id);
        const hide = id => el(id).style.display = 'none';
        const show = id => el(id).style.display = 'flex';

        function saveDB() { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

        function renderProjects() {
            el('v-home').style.display = 'block';
            el('v-det').style.display = 'none';
            el('list-p').innerHTML = db.map((p, i) => `
                <div class="project-card" onclick="openProject(${i})">
                    <div>
                        <div class="p-name-sub">${p.name || '---'}</div>
                        <div class="p-num-big">${p.num || '000000'}</div>
                    </div>
                    <div style="color:#c7c7cc; font-size:20px;">→</div>
                </div>
            `).join('') + '<div style="height:100px;"></div>';
        }

        function openProject(i) {
            currentIdx = i;
            el('v-home').style.display = 'none';
            el('v-det').style.display = 'block';
            el('h-num').innerText = db[i].num;
            el('h-nam').innerText = db[i].name;
            renderTools();
        }

        function goHome() { currentIdx = null; renderProjects(); }

        function modalP() {
            el('p-idx').value = '';
            el('btn-del-p').style.display = 'none';
            ['p-num','p-nam','p-lzf','p-mat','p-sag','p-abs','p-grf','p-stk'].forEach(id => el(id).value = '');
            show('m-p');
        }

        function editCurrentProject() {
            const p = db[currentIdx];
            el('p-idx').value = currentIdx;
            el('p-num').value = p.num; el('p-nam').value = p.name;
            el('p-lzf').value = p.lzf; el('p-mat').value = p.mat;
            el('p-sag').value = p.sag; el('p-abs').value = p.abs;
            el('p-grf').value = p.grf; el('p-stk').value = p.stk;
            el('btn-del-p').style.display = 'block';
            show('m-p');
        }

        function saveP() {
            const i = el('p-idx').value;
            const data = {
                num: el('p-num').value, name: el('p-nam').value.toUpperCase(),
                lzf: el('p-lzf').value, mat: el('p-mat').value, sag: el('p-sag').value,
                abs: el('p-abs').value, grf: el('p-grf').value, stk: el('p-stk').value,
                tools: i === '' ? [] : db[i].tools
            };
            if(i === '') db.push(data); else db[i] = data;
            saveDB(); hide('m-p');
            i === '' ? renderProjects() : openProject(i);
        }

        function delProject() {
            if(confirm('Projekt komplett löschen?')) {
                db.splice(currentIdx, 1); saveDB(); hide('m-p'); goHome();
            }
        }

        function renderTools() {
            const tools = db[currentIdx].tools || [];
            el('list-t').innerHTML = tools.map((t, i) => `
                <div class="tool-card" onclick="modalT(${i})">
                    <div style="flex:1">
                        <div class="t-label">BEMERKUNG</div>
                        <div class="t-val-big">${t.id || '---'}</div>
                        <div class="t-name-sub">${t.nm}</div>
                        <div class="tag ${t.isStd ? 'standart' : 'sonder'}">${t.isStd ? 'Standart | '+t.loc : 'Sonder'}</div>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px;">
                        <button class="nav-btn" style="width:32px;height:32px;" onclick="event.stopPropagation(); moveT(${i},-1)">↑</button>
                        <button class="nav-btn" style="width:32px;height:32px;" onclick="event.stopPropagation(); moveT(${i},1)">↓</button>
                    </div>
                </div>
            `).join('') + '<div style="height:150px;"></div>';
        }

        function modalT(i = null) {
            const edit = i !== null;
            const t = edit ? db[currentIdx].tools[i] : {id:'', nm:'', isStd:false, loc:'', kom:''};
            el('t-idx').value = edit ? i : '';
            el('t-id').value = t.id; el('t-nm').value = t.nm; el('t-loc').value = t.loc; el('t-kom').value = t.kom;
            
            const toggle = el('t-storage');
            t.isStd ? toggle.classList.add('active') : toggle.classList.remove('active');
            toggle.innerText = t.isStd ? 'STANDART (STORAGE)' : 'SONDER (BLAUKISTE)';
            
            el('btn-del-t').style.display = edit ? 'block' : 'none';
            show('m-t');
        }

        function saveT() {
            const i = el('t-idx').value;
            const t = {
                id: el('t-id').value.toUpperCase(), nm: el('t-nm').value.toUpperCase(),
                isStd: el('t-storage').classList.contains('active'),
                loc: el('t-loc').value.toUpperCase(), kom: el('t-kom').value.toUpperCase()
            };
            if(!db[currentIdx].tools) db[currentIdx].tools = [];
            if(i === '') db[currentIdx].tools.push(t); else db[currentIdx].tools[i] = t;
            saveDB(); hide('m-t'); renderTools();
        }

        function delT() {
            db[currentIdx].tools.splice(el('t-idx').value, 1);
            saveDB(); hide('m-t'); renderTools();
        }

        function moveT(i, d) {
            const a = db[currentIdx].tools; const n = i + d;
            if(n >= 0 && n < a.length) { [a[i], a[n]] = [a[n], a[i]]; saveDB(); renderTools(); }
        }

        function openData() { el('imp-area').value = JSON.stringify(db); show('m-imp'); }
        function exportJSON() { 
            const blob = new Blob([JSON.stringify(db, null, 2)], {type: 'application/json'});
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `smartbox_backup_${new Date().toLocaleDateString()}.json`; a.click();
        }
        function importJSON() {
            try { db = JSON.parse(el('imp-area').value); saveDB(); location.reload(); } catch(e) { alert('JSON Error'); }
        }

        function makePDF() {
            const p = db[currentIdx];
            const sonder = (p.tools || []).filter(t => !t.isStd);
            const std = (p.tools || []).filter(t => t.isStd);
            
            let html = `<html><head><style>
                @page { size: A4; margin: 10mm; }
                body { font-family: 'Inter', sans-serif; margin: 0; -webkit-print-color-adjust: exact; }
                .main-table { width: 100%; border: 3px solid #000; border-collapse: collapse; }
                thead { display: table-header-group; }
                .header-cell { border-bottom: 3px solid #000; padding: 15px 20px; }
                .meta-box { border-left: 3px solid #000; width: 220px; font-size: 11px; font-weight: 900; padding: 10px; }
                .meta-row { display: flex; justify-content: space-between; margin-bottom: 2px; }
                .cat-row { background: #000 !important; color: #fff !important; font-weight: 900; padding: 8px 15px; text-transform: uppercase; font-size: 14px; }
                .tool-row td { border-bottom: 2px solid #000; padding: 12px 15px; }
                .bem-cell { width: 160px; border-left: 2px solid #000; text-align: right; }
                .t-name { font-weight: 900; font-size: 18px; display: block; text-transform: uppercase; }
                .t-sub { font-size: 10px; font-weight: 800; color: #444; margin-top: 4px; text-transform: uppercase; }
                .b-label { font-size: 8px; font-weight: 900; color: #888; display: block; }
                .b-val { font-size: 16px; font-weight: 900; text-transform: uppercase; }
                tr { page-break-inside: avoid; }
            </style></head><body>
                <table class="main-table">
                    <thead>
                        <tr>
                            <td class="header-cell">
                                <div style="font-size:13px; font-weight:900; text-transform:uppercase; color:#666;">${p.name}</div>
                                <div style="font-size:55px; font-weight:900; line-height:0.9; letter-spacing:-2px;">${p.num}</div>
                            </td>
                            <td class="header-cell meta-box">
                                <div class="meta-row"><span>MAT:</span><span>${p.mat||'--'}</span></div>
                                <div class="meta-row"><span>LZF:</span><span>${p.lzf||'--'}</span></div>
                                <div class="meta-row"><span>SÄGE:</span><span>${p.sag||'--'}</span></div>
                                <div class="meta-row"><span>ABST:</span><span>${p.abs||'--'}</span></div>
                                <div class="meta-row"><span>GRF:</span><span>${p.grf||'--'}</span></div>
                                <div class="meta-row"><span>STOCK:</span><span>${p.stk||'--'}</span></div>
                            </td>
                        </tr>
                    </thead>
                    <tbody>`;

            const addGroup = (title, list, defLoc) => {
                if(list.length === 0) return;
                html += `<tr><td colspan="2" class="cat-row">${title}</td></tr>`;
                list.forEach(t => {
                    html += `
                    <tr class="tool-row">
                        <td>
                            <span class="t-name">${t.nm}</span>
                            <span class="t-sub">${t.isStd ? (t.loc || 'STANDART') : 'IN BLAUKISTE'} ${t.kom ? ' | ' + t.kom : ''}</span>
                        </td>
                        <td class="bem-cell">
                            <span class="b-label">BEMERKUNG</span>
                            <span class="b-val">${t.id || '--'}</span>
                        </td>
                    </tr>`;
                });
            };

            addGroup('Sonderwerkzeuge', sonder, 'IN BLAUKISTE');
            addGroup('Standartwerkzeuge', std, 'STANDART');

            html += `</tbody></table></body></html>`;
            const win = window.open('','_blank');
            win.document.write(html); win.document.close();
            setTimeout(() => { win.print(); win.close(); }, 500);
        }

        window.onload = renderProjects;
    </script>
</body>
</html>
