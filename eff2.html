<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Effizienz-Analyse v2.4</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root {
            --bg: #f4f4f7;
            --surface: #ffffff;
            --accent: #000000;
            --text-main: #1c1c1e;
            --text-sec: #636366;
        }

        * { box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { margin: 0; background: var(--bg); color: var(--text-main); }
        .container { max-width: 650px; margin: 0 auto; padding: 25px; padding-bottom: 120px; }
        
        header { margin-bottom: 30px; border-left: 6px solid var(--accent); padding-left: 20px; }
        header h1 { font-size: 24px; font-weight: 900; margin: 0; text-transform: uppercase; }
        
        .card { 
            background: var(--surface); border-radius: 0; padding: 25px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 2px solid var(--accent);
            margin-bottom: 20px;
        }

        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        label { display: block; font-size: 11px; font-weight: 900; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; }
        input { 
            width: 100%; padding: 14px; border-radius: 0; border: 2px solid #d1d1d6; 
            font-size: 18px; background: #fff; font-weight: 700; outline: none;
        }

        .analysis-box { background: var(--accent); color: white; padding: 30px; margin-bottom: 20px; }
        .big-val { font-size: 32px; font-weight: 900; display: block; line-height: 1; }

        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; font-size: 11px; color: var(--accent); padding: 10px 5px; text-transform: uppercase; border-bottom: 3px solid var(--accent); }
        td { padding: 16px 5px; border-bottom: 1px solid #e5e5e7; font-size: 16px; font-weight: 600; }
        
        .footer-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 100px; 
            background: var(--surface); border-top: 2px solid var(--accent);
            display: flex; align-items: center; padding: 0 20px; gap: 15px; z-index: 100;
        }
        .btn { height: 60px; border: none; font-weight: 900; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 16px; }
        .btn-black { background: var(--accent); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>EFFIZIENZ-BERICHT</h1>
        <p style="font-weight: 700; color: var(--text-sec);">CNC PRODUCTION OPTIMIZER v2.4</p>
    </header>

    <section class="card">
        <div class="input-row">
            <div style="grid-column: span 2;">
                <label>Benennung (z.B. Gehäuse)</label>
                <input type="text" id="partName" placeholder="Name der Komponente" value="Gehäuse">
            </div>
            <div style="grid-column: span 2;">
                <label>Zeichnungsnummer</label>
                <input type="text" id="partNum" placeholder="234446" value="234446">
            </div>
            <div style="grid-column: span 2;">
                <label>Gesamtstückzahl</label>
                <input type="number" id="stk" value="290" oninput="calc()">
            </div>
            <div>
                <label>ALT (M:S)</label>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="am" value="5" oninput="calc()">
                    <input type="number" id="as" value="30" oninput="calc()">
                </div>
            </div>
            <div>
                <label>NEU (M:S)</label>
                <div style="display:flex; gap:8px;">
                    <input type="number" id="nm" value="4" oninput="calc()">
                    <input type="number" id="ns" value="15" oninput="calc()">
                </div>
            </div>
        </div>
    </section>

    <div id="main-box" class="analysis-box">
        <span id="finish-days" class="big-val">-</span>
    </div>

    <section class="card">
        <table>
            <thead>
                <tr>
                    <th>PARAMETER</th>
                    <th>STATUS: ALT</th>
                    <th>STATUS: NEU</th>
                </tr>
            </thead>
            <tbody>
                <tr><td>Stück / Schicht</td><td id="s-alt-sh">-</td><td id="s-neu-sh">-</td></tr>
                <tr><td>Produktion (h)</td><td id="s-alt-tot">-</td><td id="s-neu-tot">-</td></tr>
                <tr><td>Schichten</td><td id="s-alt-sch">-</td><td id="s-neu-sch">-</td></tr>
            </tbody>
        </table>
    </section>
</div>

<div class="footer-nav">
    <button class="btn btn-black" onclick="generatePDF()">PDF Bericht Erstellen</button>
</div>

<script>
    // Все функции расчета скрыты для краткости, они работают так же
    function calc() {
        const stk = parseFloat(document.getElementById('stk').value) || 0;
        const shSec = 7.5 * 3600; 
        const tA = (parseFloat(document.getElementById('am').value) * 60) + (parseFloat(document.getElementById('as').value) || 0);
        const tN = (parseFloat(document.getElementById('nm').value) * 60) + (parseFloat(document.getElementById('ns').value) || 0);
        if (tA <= 0 || tN <= 0) return;

        const stkShA = shSec / tA;
        const stkShN = shSec / tN;
        const daysN = stk / (stkShN + 30);
        const minDiff = ((stk * tA) - (stk * tN)) / 60;

        document.getElementById('s-alt-sh').innerText = stkShA.toFixed(1);
        document.getElementById('s-neu-sh').innerText = stkShN.toFixed(1);
        document.getElementById('s-alt-tot').innerText = ((stk * tA) / 3600).toFixed(1) + " h";
        document.getElementById('s-neu-tot').innerText = ((stk * tN) / 3600).toFixed(1) + " h";
        document.getElementById('s-alt-sch').innerText = ((stk * tA) / shSec).toFixed(1);
        document.getElementById('s-neu-sch').innerText = ((stk * tN) / shSec).toFixed(1);
        document.getElementById('finish-days').innerText = daysN.toFixed(1) + " TAGE PROGNOSE";
        
        window.latestCalc = { tA, tN, stk, stkShA, stkShN, minDiff, daysN, daysA: stk/(stkShA+30) };
    }

    function generatePDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        const d = window.latestCalc;
        const pName = document.getElementById('partName').value;
        const pNum = document.getElementById('partNum').value;
        
        // Линия верха
        doc.setDrawColor(0);
        doc.setLineWidth(0.8);
        doc.line(15, 30, 195, 30);
        
        doc.setFont("helvetica", "bold");
        doc.setFontSize(26);
        doc.text("EFFIZIENZ-BERICHT", 15, 25);

        // Meta данные с новыми полями
        doc.setFontSize(10);
        doc.setFont("helvetica", "bold");
        doc.text(`BAUTEIL:`, 15, 40);
        doc.setFont("helvetica", "normal");
        doc.text(`${pName} | Nr. ${pNum}`, 35, 40);

        doc.setFont("helvetica", "bold");
        doc.text(`PRODAKTION:`, 15, 46);
        doc.setFont("helvetica", "normal");
        doc.text(`${d.stk} STÜCK | DATUM: ${new Date().toLocaleDateString('de-DE')}`, 45, 46);

        // Таблица (Zebra style)
        doc.autoTable({
            startY: 55,
            head: [['PARAMETER', 'STATUS: ALT', 'STATUS: NEU']],
            body: [
                ['Zeit pro Stück (Min)', (d.tA/60).toFixed(2), (d.tN/60).toFixed(2)],
                ['Stückzahl pro Schicht', d.stkShA.toFixed(1), d.stkShN.toFixed(1)],
                ['Produktionszeit (Std)', ((d.stk*d.tA)/3600).toFixed(1)+" h", ((d.stk*d.tN)/3600).toFixed(1)+" h"],
                ['Schichten Netto', (d.stk*d.tA/(7.5*3600)).toFixed(1), (d.stk*d.tN/(7.5*3600)).toFixed(1)]
            ],
            theme: 'striped',
            headStyles: { fillColor: [0, 0, 0], textColor: [255, 255, 255], fontStyle: 'bold' },
            alternateRowStyles: { fillColor: [245, 245, 247] },
            styles: { cellPadding: 6, fontSize: 11, textColor: [0, 0, 0] }
        });

        let y = doc.lastAutoTable.finalY + 15;

        // Капацитет (Текст)
        const drawAnalysis = (title, days, stkDaily, totalMin) => {
            doc.setFont("helvetica", "bold");
            doc.setFontSize(14);
            doc.text(title, 15, y);
            doc.setFont("helvetica", "normal");
            doc.setFontSize(11);
            doc.text(`- Kapazität pro Tag: ${stkDaily.toFixed(1)} Stück`, 20, y + 10);
            doc.text(`- Zeitbedarf: ${days.toFixed(1)} Arbeitstage`, 20, y + 17);
            doc.text(`- Gesamtminuten: ${totalMin.toFixed(0)} min`, 20, y + 24);
            y += 35;
        };

        drawAnalysis("KAPAZITÄTSANALYSE (ALT)", d.daysA, (d.stkShA + 30), (d.stk * d.tA / 60));
        drawAnalysis("KAPAZITÄTSANALYSE (NEU)", d.daysN, (d.stkShN + 30), (d.stk * d.tN / 60));

        // Ersparnis
        doc.setLineWidth(0.4); doc.setDrawColor(200);
        doc.line(15, y - 5, 120, y - 5);
        doc.setFontSize(16); doc.setFont("helvetica", "bold");
        doc.text(`ERSPARNIS: ${d.minDiff.toFixed(0)} MIN`, 15, y + 5);

        // ФИНАЛЬНАЯ ЧЕРНАЯ ЛИНИЯ
        doc.setDrawColor(0, 0, 0);
        doc.setLineWidth(0.8);
        doc.line(15, 280, 195, 280); 
        doc.setFontSize(9);
        doc.text("CNC PRODUCTION OPTIMIZER | TECHNICAL DOC v2.4", 105, 287, {align: 'center'});

        doc.save(`Report_${pNum}.pdf`);
    }
    calc();
</script>

</body>
</html>
