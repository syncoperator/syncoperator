<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL PREMIUM</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body>

    <div id="v-home" class="view active">
        <header class="premium-header">
            <div class="logo-area">
                <h1 class="main-title">QS CENTRAL</h1>
                <div class="status-badge">System Ready</div>
            </div>
        </header>
        
        <div class="action-bar-top">
            <button class="btn-plus" onclick="modalP()">+ NEU PROJEKT</button>
        </div>

        <div id="list-p" class="app-grid"></div>
        <div class="bottom-safe-area"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar-premium">
            <button class="nav-circle-btn" onclick="goHome()">←</button>
            <div class="nav-info-premium" onclick="modalP(true)">
                <span id="h-nam">PROJEKT NAME</span>
                <b id="h-num">000000</b>
            </div>
            <button class="nav-circle-btn accent" onclick="makePDF()">PDF</button>
        </div>

        <div class="action-grid-premium">
            <button class="btn-neu primary" onclick="modalT()">+ WERKZEUG</button>
            <button class="btn-neu" onclick="show('m-imp')">IMPORT</button>
        </div>

        <div id="list-t" class="content-scroll"></div>
    </div>

    <div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Projekt Details</h2>
            <input type="hidden" id="p-idx">
            <div class="form-grid">
                <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="p-num"></div>
                <div class="field full"><label>Kunde / Name</label><input type="text" id="p-nam"></div>
                <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
                <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
                <div class="field"><label>Stück T</label><input type="text" id="p-stt"></div>
                <div class="field"><label>Stück N</label><input type="text" id="p-stn"></div>
                <div class="field full"><label>Material</label><input type="text" id="p-mat"></div>
                <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
                <div class="field"><label>Greifbacken</label><input type="text" id="p-grf"></div>
            </div>
            <div class="sheet-buttons">
                <button class="btn-neu primary large" onclick="saveP()">Speichern</button>
                <button class="btn-neu large ghost" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Werkzeug Setup</h2>
            <input type="hidden" id="t-idx">
            <div class="field full"><label>T-NR</label><input type="text" id="t-id"></div>
            <div class="field full"><label>Beschreibung</label><input type="text" id="t-nm"></div>
            <div class="field full"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
            <div class="field full">
                <label>Modus</label>
                <div id="btn-rev-toggle" class="rev-toggle-neu">REVOLVER UNTEN START ↓</div>
            </div>
            <div class="sheet-buttons">
                <button class="btn-neu primary large" onclick="saveT()">Speichern</button>
                <button id="btn-del-t" class="btn-neu danger" onclick="delT()">Löschen</button>
                <button class="btn-neu large ghost" onclick="hide('m-t')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
        <div class="sheet">
            <div class="sheet-bar"></div>
            <h2 class="sheet-title">Data Management</h2>
            <textarea id="imp-area" rows="6" placeholder="JSON oder T-Liste..."></textarea>
            <div class="sheet-buttons">
                <button class="btn-neu primary large" onclick="runImp()">Import T-Liste</button>
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px;">
                    <button class="btn-neu" onclick="exportJSON()">Export JSON</button>
                    <button class="btn-neu" onclick="importJSON()">Import JSON</button>
                </div>
                <button class="btn-neu large ghost" onclick="hide('m-imp')">Schließen</button>
            </div>
        </div>
    </div>

    <div id="print-container"></div>
    <script src="ui.js"></script>
</body>
</html>
