<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <h1 class="premium-logo">QS CENTRAL</h1>
        <div class="center-box">
            <button class="n-btn primary" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="container"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-header">
            <button class="n-btn round" onclick="goHome()">←</button>
            <div class="header-info">
                <small>NAME</small>
                <strong id="h-num">000000</strong>
            </div>
        </div>
        
        <div class="button-row">
            <button class="n-btn" onclick="makePDF()">PDF</button>
            <button class="n-btn" onclick="modalT()">+ Werkzeug</button>
            <button class="n-btn" onclick="show('m-imp')">Import</button>
        </div>

        <div id="list-t" class="container"></div>
    </div>

    <div id="m-p" class="modal">
        <div class="n-card modal-content">
            <h2 class="section-title">Projekt</h2>
            <div class="input-group">
                <label>Zeichnungsnummer</label>
                <input type="text" id="p-num" class="n-input">
            </div>
            <div class="input-group">
                <label>Kunde / Name</label>
                <input type="text" id="p-nam" class="n-input">
            </div>
            <div class="button-row">
                <button class="n-btn green" onclick="saveP()">Speichern</button>
                <button class="n-btn" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
