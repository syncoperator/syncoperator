<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <h1 class="premium-logo">QS CENTRAL</h1>
        <div class="main-action">
            <button class="n-btn" onclick="modalP()">+ NEU</button>
        </div>
        <div id="list-p" class="scroll-container"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="n-btn round" onclick="goHome()">←</button>
            <div class="header-text">
                <small>PROJEKT</small>
                <strong id="h-num">---</strong>
            </div>
        </div>
        
        <div class="action-grid">
            <button class="n-btn" onclick="makePDF()">PDF</button>
            <button class="n-btn" onclick="modalT()">+ WERKZEUG</button>
            <button class="n-btn" onclick="showModal('m-imp')">DATABASE</button>
        </div>

        <div id="list-t" class="scroll-container"></div>
    </div>

    <div id="m-p" class="modal">
        <div class="n-card modal-content">
            <h2 class="section-title">Projekt</h2>
            <input type="hidden" id="p-idx">
            
            <div class="input-group">
                <label>Zeichnungsnummer</label>
                <input type="text" id="p-num" class="n-input">
            </div>
            <div class="input-group">
                <label>Kunde / Name</label>
                <input type="text" id="p-nam" class="n-input">
            </div>
            
            <div class="grid-2">
                <div class="input-group">
                    <label>Laufzeit</label>
                    <input type="text" id="p-lzf" class="n-input">
                </div>
                <div class="input-group">
                    <label>Sägelänge</label>
                    <input type="text" id="p-sag" class="n-input">
                </div>
            </div>

            <div class="grid-2">
                <div class="input-group">
                    <label>Stück T</label>
                    <input type="text" id="p-stt" class="n-input">
                </div>
                <div class="input-group">
                    <label>Stück N</label>
                    <input type="text" id="p-stn" class="n-input">
                </div>
            </div>

            <div class="input-group">
                <label>Material</label>
                <input type="text" id="p-mat" class="n-input">
            </div>

            <div class="modal-btns">
                <button class="n-btn green" onclick="saveP()">Speichern</button>
                <button class="n-btn" onclick="hideModal('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="n-card modal-content">
            <h2 class="section-title">Werkzeug</h2>
            <input type="hidden" id="t-idx">
            <input type="text" id="t-id" class="n-input" placeholder="T-Nr">
            <input type="text" id="t-nm" class="n-input" placeholder="Beschreibung">
            <input type="text" id="t-dia" class="n-input" placeholder="Ø / Toleranz">
            
            <div class="toggle-box">
                <span style="font-weight: 800; font-size: 14px;">REVOLVER UNTEN</span>
                <button id="rev-btn" class="n-btn" onclick="toggleRev()">OFF</button>
            </div>

            <div class="modal-btns">
                <button class="n-btn green" onclick="saveT()">Speichern</button>
                <button class="n-btn" onclick="hideModal('m-t')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="n-card modal-content">
            <h2>Import/Export</h2>
            <textarea id="imp-area" class="n-input" style="height:150px"></textarea>
            <div class="modal-btns">
                <button class="n-btn" onclick="importJSON()">Import</button>
                <button class="n-btn" onclick="exportJSON()">Export</button>
                <button class="n-btn" onclick="hideModal('m-imp')">Close</button>
            </div>
        </div>
    </div>

    <script src="ui.js"></script>
</body>
</html>
