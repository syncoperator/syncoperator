<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator Elite</title>
    <style>
        :root {
            --bg: #e0e5ec;
            --text: #44475a;
            --text-light: #7a7f9a;
            --primary: #4d89ff;
            --shadow-light: 12px 12px 20px #c1c9d2, -12px -12px 20px #ffffff;
            --shadow-inner: inset 6px 6px 12px #c1c9d2, inset -6px -6px 12px #ffffff;
            --shadow-small: 5px 5px 10px #c1c9d2, -5px -5px 10px #ffffff;
            --radius: 30px;
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text);
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Header */
        .app-header {
            padding: 50px 25px 20px;
            text-align: center;
        }
        .header-top { font-size: 10px; font-weight: 800; color: var(--text-light); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
        .app-title { font-size: 34px; font-weight: 900; letter-spacing: -1.5px; margin: 0; }
        .badge { 
            display: inline-block; padding: 6px 16px; margin-top: 15px;
            background: var(--bg); border-radius: 50px; font-size: 10px; font-weight: 800;
            box-shadow: var(--shadow-small); color: var(--primary);
        }

        /* Main Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
            padding: 25px;
        }

        .card-action {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 30px 20px;
            box-shadow: var(--shadow-light);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            min-height: 140px;
            border: none;
            transition: 0.2s;
        }

        .card-action:active { box-shadow: var(--shadow-inner); transform: scale(0.98); }

        .card-action .t-nr {
            position: absolute;
            top: 25px; left: 25px;
            font-size: 11px; font-weight: 800; color: var(--text-light);
        }

        .card-action .status-dot {
            position: absolute;
            top: 25px; right: 25px;
            width: 8px; height: 8px;
            border-radius: 50%;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.1);
        }

        .card-action span { font-weight: 800; font-size: 14px; color: var(--text); }

        /* Lists */
        .view { display: none; flex-direction: column; min-height: 100vh; }
        .view.active { display: flex; }

        .list-item {
            background: var(--bg);
            margin: 0 25px 20px;
            padding: 22px;
            border-radius: 20px;
            box-shadow: var(--shadow-small);
            display: flex;
            align-items: center;
        }

        .list-item:active { box-shadow: var(--shadow-inner); }

        .list-item .indicator {
            width: 8px; height: 8px;
            background: var(--primary);
            border-radius: 50%;
            margin-right: 20px;
            box-shadow: 0 0 10px var(--primary);
        }

        .item-info small { display: block; font-size: 11px; font-weight: 800; color: var(--text-light); text-transform: uppercase; margin-bottom: 4px; }
        .item-info b { font-size: 18px; font-weight: 900; }

        /* Buttons & Inputs */
        .btn-action {
            background: var(--bg);
            padding: 18px; border-radius: 20px; border: none; font-weight: 800;
            box-shadow: var(--shadow-small); color: var(--text); transition: 0.2s;
        }
        .btn-action:active { box-shadow: var(--shadow-inner); }
        .btn-action.primary { color: var(--primary); }

        .overlay {
            position: fixed; inset: 0; background: rgba(224, 229, 236, 0.8);
            backdrop-filter: blur(10px); display: none; align-items: flex-end; z-index: 1000;
        }
        .sheet {
            background: var(--bg); width: 100%; border-radius: 40px 40px 0 0;
            padding: 30px 25px 50px; box-sizing: border-box;
            box-shadow: 0 -20px 40px rgba(0,0,0,0.05);
        }
        .sheet-bar { width: 40px; height: 6px; background: #c1c9d2; border-radius: 10px; margin: -10px auto 30px; }
        
        .field { margin-bottom: 15px; }
        .field label { font-size: 10px; font-weight: 800; color: var(--text-light); text-transform: uppercase; padding-left: 10px; margin-bottom: 8px; display: block; }
        .field input {
            width: 100%; padding: 16px; border-radius: 15px; border: none;
            background: var(--bg); box-shadow: var(--shadow-inner);
            font-size: 16px; font-weight: 700; color: var(--text); outline: none; box-sizing: border-box;
        }

        #print-container { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #print-container { display: block; position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body>

<div id="v-home" class="view active">
    <div class="app-header">
        <div class="header-top">Elite Neumorphic</div>
        <h1 class="app-title">SyncOperator</h1>
        <div class="badge">SYSTEM READY</div>
    </div>
    <div class="menu-grid">
        <div class="card-action" onclick="modalP()">
            <div class="t-nr">T-01</div>
            <div class="status-dot" style="background: #34c759; box-shadow: 0 0 8px #34c759;"></div>
            <span>Projekt Liste</span>
        </div>
        <div class="card-action" onclick="show('m-imp')">
            <div class="t-nr">T-02</div>
            <div class="status-dot" style="background: var(--primary); box-shadow: 0 0 8px var(--primary);"></div>
            <span>Data Management</span>
        </div>
    </div>
    <div id="list-p" style="padding-bottom:100px;"></div>
</div>

<div id="v-det" class="view">
    <div style="padding: 30px 25px; display: flex; align-items: center; justify-content: space-between;">
        <button class="btn-action" style="width:50px; height:50px; padding:0;" onclick="goHome()">←</button>
        <div style="text-align: center;">
            <small id="h-nam" style="display:block; color:var(--text-light); font-weight:800; font-size:10px; text-transform:uppercase;"></small>
            <b id="h-num" style="font-size:24px; letter-spacing:-1px;"></b>
        </div>
        <button class="btn-action primary" onclick="makePDF()">PDF</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:0 25px 25px;">
        <button class="btn-action primary" onclick="modalT()">+ Tool</button>
        <button class="btn-action" onclick="show('m-imp')">Import</button>
    </div>
    <div id="list-t" style="padding-bottom:150px;"></div>
</div>

<div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
            <div class="field" style="grid-column: span 2;"><label>Zeichnungsnummer</label><input type="text" id="p-num"></div>
            <div class="field" style="grid-column: span 2;"><label>Name</label><input type="text" id="p-nam"></div>
            <div class="field" style="grid-column: span 2;"><label>Material</label><input type="text" id="p-mat"></div>
            <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
            <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
        </div>
        <div style="margin-top:25px; display:grid; grid-template-columns: 2fr 1fr; gap:15px;">
            <button class="btn-action primary" onclick="saveP()">Speichern</button>
            <button class="btn-action" onclick="hide('m-p')">Close</button>
        </div>
    </div>
</div>

<div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <input type="hidden" id="t-idx">
        <div class="field"><label>T-Nr</label><input type="text" id="t-id"></div>
        <div class="field"><label>Name</label><input type="text" id="t-nm"></div>
        <div class="field"><label>Ø / Tol</label><input type="text" id="t-dia"></div>
        <div style="margin:20px 0; display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:800; font-size:14px; color:var(--text-light);">Unten?</span>
            <div id="t-rev-toggle" style="width:60px; height:32px; background:var(--bg); border-radius:20px; box-shadow:var(--shadow-inner); position:relative; cursor:pointer;" onclick="this.classList.toggle('on'); this.firstChild.style.left=this.classList.contains('on')?'32px':'4px'; this.firstChild.style.background=this.classList.contains('on')? 'var(--primary)':'#c1c9d2';">
                <div style="width:24px; height:24px; background:#c1c9d2; border-radius:50%; position:absolute; top:4px; left:4px; transition:0.3s; box-shadow:var(--shadow-small);"></div>
            </div>
        </div>
        <div style="display:grid; grid-template-columns: 2fr 1fr; gap:15px;">
            <button class="btn-action primary" onclick="saveT()">Save</button>
            <button id="btn-del-t" class="btn-action" style="color:#ff5f5f;" onclick="delT()">Del</button>
        </div>
    </div>
</div>

<div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <textarea id="imp-area" style="width:100%; height:150px; border:none; background:var(--bg); box-shadow:var(--shadow-inner); border-radius:20px; padding:15px; font-weight:700; outline:none; color:var(--text);"></textarea>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px; margin-top:20px;">
            <button class="btn-action primary" onclick="runImp()">Import</button>
            <button class="btn-action" onclick="exportJSON()">Export</button>
        </div>
    </div>
</div>

<div id="print-container"></div>
<script src="ui.js"></script>
</body>
</html>
