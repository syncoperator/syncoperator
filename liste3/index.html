<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS CENTRAL ELITE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <h1 class="premium-logo">QS CENTRAL</h1>
        <div class="center-box"><button class="n-btn primary" onclick="modalP()">+ NEU</button></div>
        <div id="list-p" class="container"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-header">
            <button class="n-btn round" onclick="goHome()">←</button>
            <div class="header-info"><small id="h-nam">NAME</small><strong id="h-num">000000</strong></div>
        </div>
        <div class="button-row">
            <button class="n-btn" onclick="makePDF()">PDF REPORT</button>
            <button class="n-btn" onclick="modalT()">+ WERKZEUG</button>
            <button class="n-btn" onclick="show('m-imp')">DATABASE</button>
        </div>
        <div id="list-t" class="container"></div>
    </div>

    <div id="m-p" class="modal">
        <div class="n-card modal-content">
            <h2 class="section-title">Projekt</h2>
            <input type="hidden" id="p-idx">
            <label class="n-label">Zeichnungsnummer</label><input type="text" id="p-num" class="n-input">
            <label class="n-label">Kunde / Name</label><input type="text" id="p-nam" class="n-input">
            <div class="grid-2">
                <div><label class="n-label">Laufzeit</label><input type="text" id="p-lzf" class="n-input"></div>
                <div><label class="n-label">Sägelänge</label><input type="text" id="p-sag" class="n-input"></div>
            </div>
            <div class="grid-2">
                <div><label class="n-label">Stück T</label><input type="text" id="p-stt" class="n-input"></div>
                <div><label class="n-label">Stück N</label><input type="text" id="p-stn" class="n-input"></div>
            </div>
            <div class="grid-2">
                <div><label class="n-label">Abstand</label><input type="text" id="p-abs" class="n-input"></div>
                <div><label class="n-label">Greifbacken</label><input type="text" id="p-grf" class="n-input"></div>
            </div>
            <label class="n-label">Material</label><input type="text" id="p-mat" class="n-input">
            <div class="button-row">
                <button class="n-btn green" onclick="saveP()">Speichern</button>
                <button class="n-btn" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="n-card modal-content">
            <h2 class="section-title">Werkzeug</h2>
            <input type="hidden" id="t-idx">
            <label class="n-label">T-NR</label><input type="text" id="t-id" class="n-input">
            <label class="n-label">Beschreibung</label><input type="text" id="t-nm" class="n-input">
            <label class="n-label">Ø / Toleranz</label><input type="text" id="t-dia" class="n-input">
      <div class="rev-toggle-box">
    <span style="font-weight:800; font-size:13px;">REVOLVER UNTEN START:</span>
    <button id="btn-rev-toggle" type="button" onclick="toggleRev()">REVOLVER OBEN</button>
</div>

            <div class="button-row">
                <button class="n-btn green" onclick="saveT()">Speichern</button>
                <button class="n-btn red" id="btn-del-t" style="display:none" onclick="delT()">Löschen</button>
                <button class="n-btn" onclick="hide('m-t')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="n-card modal-content">
            <h2>Database</h2>
            <textarea id="imp-area" class="n-input" style="height:150px"></textarea>
            <div class="button-row">
                <button class="n-btn" onclick="exportJSON()">Export</button>
                <button class="n-btn" onclick="importJSON()">Import</button>
                <button class="n-btn" onclick="hide('m-imp')">Close</button>
            </div>
        </div>
    </div>

    <div id="print-area"></div>
    <script src="ui.js"></script>
</body>
</html>
