<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SyncOperator Premium</title>
    <style>
        :root {
            --bg: #f8f9fc;
            --card: #ffffff;
            --primary: #3b82f6;
            --text-main: #1c1c1e;
            --text-muted: #8e8e93;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.04);
            --border: rgba(0, 0, 0, 0.03);
        }

        body {
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: var(--text-main);
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        /* Маленькие кнопки JSON в шапке */
        .top-controls {
            position: absolute;
            top: 55px;
            right: 20px;
            display: flex;
            gap: 8px;
        }
        .btn-mini {
            padding: 8px 12px;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-size: 10px;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            cursor: pointer;
        }

        .app-header { padding: 60px 24px 30px; background: #fff; position: relative; }
        .header-top { font-size: 10px; font-weight: 800; color: var(--text-muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 5px; }
        .app-title { font-size: 38px; font-weight: 900; letter-spacing: -1.5px; margin: 0; }
        .badge { display: inline-block; padding: 5px 12px; background: var(--bg); border-radius: 20px; font-size: 10px; font-weight: 800; color: var(--text-muted); margin-top: 10px; }

        .view { display: none; flex-direction: column; min-height: 100vh; }
        .view.active { display: flex; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 20px; }
        .card-action {
            background: var(--card); border-radius: 24px; padding: 35px 20px; box-shadow: var(--shadow);
            border: 1px solid var(--border); position: relative; display: flex; flex-direction: column;
            justify-content: flex-end; min-height: 130px;
        }
        .card-action .t-nr { position: absolute; top: 20px; left: 20px; font-size: 11px; font-weight: 800; color: #d1d1d6; }
        .card-action .status-dot { position: absolute; top: 20px; right: 20px; width: 7px; height: 7px; border-radius: 50%; }
        .card-action span { font-weight: 800; font-size: 15px; color: var(--text-main); }

        .list-item {
            background: var(--card); margin: 0 20px 12px; padding: 22px; border-radius: 20px;
            box-shadow: var(--shadow); display: flex; align-items: center; border: 1px solid var(--border);
        }
        .list-item .indicator { width: 4px; height: 35px; background: var(--primary); border-radius: 10px; margin-right: 20px; }
        .item-info small { display: block; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; margin-bottom: 2px; }
        .item-info b { font-size: 19px; font-weight: 900; letter-spacing: -0.5px; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); backdrop-filter: blur(5px); display: none; align-items: flex-end; z-index: 1000; }
        .sheet { background: #fff; width: 100%; border-radius: 32px 32px 0 0; padding: 25px 25px 50px; box-sizing: border-box; }
        .sheet-bar { width: 35px; height: 5px; background: #e5e5ea; border-radius: 10px; margin: -10px auto 25px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field.full { grid-column: span 2; }
        .field label { font-size: 10px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; padding-left: 4px; }
        .field input { padding: 16px; border-radius: 14px; border: 1.5px solid #f2f2f7; background: #f9f9fc; font-size: 16px; font-weight: 700; outline: none; width: 100%; box-sizing: border-box; }

        .btn-action { padding: 16px; border-radius: 16px; border: none; font-weight: 800; font-size: 15px; cursor: pointer; }
        .primary { background: var(--primary); color: white; }
        .ghost { background: #f2f2f7; color: var(--text-main); }

        #print-container { display: none; }
        @media print {
            body * { visibility: hidden; }
            #print-container, #print-container * { visibility: visible; }
            #print-container { display: block; position: absolute; left: 0; top: 0; width: 100%; }
            .page-break { page-break-before: always; }
        }
    </style>
</head>
<body>

<div id="v-home" class="view active">
    <div class="app-header">
        <div class="header-top">PREMIUM INTERFACE</div>
        <h1 class="app-title">SyncOperator</h1>
        <div class="top-controls">
            <div class="btn-mini" onclick="show('m-imp'); exportJSON();">Export</div>
            <div class="btn-mini" onclick="show('m-imp')">Import</div>
        </div>
        <div class="badge">SYSTEM LIVE</div>
    </div>
    <div class="menu-grid">
        <div class="card-action" onclick="modalP()">
            <div class="t-nr">T-01</div>
            <div class="status-dot" style="background: #34c759;"></div>
            <span>Neues Projekt</span>
        </div>
        <div class="card-action" onclick="show('m-imp')">
            <div class="t-nr">T-02</div>
            <div class="status-dot" style="background: #007aff;"></div>
            <span>Data Management</span>
        </div>
    </div>
    <div id="list-p" style="padding-bottom:120px;"></div>
</div>

<div id="v-det" class="view">
    <div style="padding: 25px; display: flex; align-items: center; justify-content: space-between; background:#fff;">
        <button onclick="goHome()" style="background:none; border:none; font-size: 24px;">←</button>
        <div style="text-align: center;">
            <small id="h-nam" style="display:block; color:var(--text-muted); font-weight:800; font-size:10px; text-transform:uppercase;"></small>
            <b id="h-num" style="font-size:22px; letter-spacing:-1px;"></b>
        </div>
        <button onclick="makePDF()" style="color:var(--primary); background:none; border:none; font-weight:900; font-size:15px;">PDF</button>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:15px; padding:20px;">
        <button class="btn-action primary" onclick="modalT()">+ Werkzeug</button>
        <button class="btn-action ghost" onclick="show('m-imp')">Import</button>
    </div>
    <div id="list-t" style="padding-bottom:150px;"></div>
</div>

<div id="m-p" class="overlay" onclick="if(event.target==this)hide('m-p')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <input type="hidden" id="p-idx">
        <div class="form-grid">
            <div class="field full"><label>Zeichnungsnummer</label><input type="text" id="p-num"></div>
            <div class="field full"><label>Kunde / Name</label><input type="text" id="p-nam"></div>
            <div class="field full"><label>Material</label><input type="text" id="p-mat"></div>
            <div class="field"><label>Laufzeit</label><input type="text" id="p-lzf"></div>
            <div class="field"><label>Sägelänge</label><input type="text" id="p-sag"></div>
            <div class="field"><label>Stück T</label><input type="text" id="p-stt"></div>
            <div class="field"><label>Stück N</label><input type="text" id="p-stn"></div>
            <div class="field"><label>Abstand</label><input type="text" id="p-abs"></div>
            <div class="field"><label>Greifbacken</label><input type="text" id="p-grf"></div>
        </div>
        <div style="margin-top:25px; display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
            <button class="btn-action primary" onclick="saveP()">Speichern</button>
            <button class="btn-action ghost" onclick="hide('m-p')">Abbrechen</button>
        </div>
    </div>
</div>

<div id="m-t" class="overlay" onclick="if(event.target==this)hide('m-t')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <input type="hidden" id="t-idx">
        <div class="form-grid">
            <div class="field full"><label>T-Nr</label><input type="text" id="t-id"></div>
            <div class="field full"><label>Beschreibung</label><input type="text" id="t-nm"></div>
            <div class="field full"><label>Ø / Toleranz</label><input type="text" id="t-dia"></div>
        </div>
        <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center; background:#f9f9fc; padding:15px; border-radius:15px;">
            <span style="font-weight:800; font-size:14px;">Revolver Unten?</span>
            <div id="t-rev-toggle" style="width:50px; height:28px; background:#e5e5ea; border-radius:20px; position:relative; cursor:pointer;" onclick="this.classList.toggle('on'); this.style.background=this.classList.contains('on')?'#3b82f6':'#e5e5ea';">
                <div style="width:22px; height:22px; background:#fff; border-radius:50%; position:absolute; top:3px; left:3px; transition:0.2s;"></div>
            </div>
        </div>
        <div style="margin-top:25px; display:grid; grid-template-columns: 2fr 1fr; gap:10px;">
            <button class="btn-action primary" onclick="saveT()">Speichern</button>
            <button id="btn-del-t" class="btn-action ghost" style="color:red;" onclick="delT()">Löschen</button>
        </div>
    </div>
</div>

<div id="m-imp" class="overlay" onclick="if(event.target==this)hide('m-imp')">
    <div class="sheet">
        <div class="sheet-bar"></div>
        <textarea id="imp-area" style="width:100%; height:150px; border-radius:15px; border:1.5px solid #f2f2f7; padding:15px; font-weight:600; box-sizing:border-box; background:#f9f9fc;"></textarea>
        <div class="form-grid" style="margin-top:15px;">
            <button class="btn-action primary" onclick="runImp()">Import Tools</button>
            <button class="btn-action ghost" onclick="importJSON()">Import JSON</button>
        </div>
    </div>
</div>

<div id="print-container"></div>
<script src="ui.js"></script>
</body>
</html>
