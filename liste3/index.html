<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QS Central Premium</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="v-home" class="view active">
        <h1 class="logo-text">QS CENTRAL</h1>
        <button class="neumorph main-btn" onclick="modalP()">+ NEU</button>
        <div id="list-p"></div>
    </div>

    <div id="v-det" class="view">
        <div class="nav-bar">
            <button class="neumorph round-btn" onclick="goHome()">←</button>
            <div class="project-info">
                <span class="sub-label">NAME</span>
                <span id="h-num" class="main-val">000000</span>
            </div>
        </div>

        <div class="action-bar">
            <button class="neumorph" onclick="makePDF()">PDF</button>
            <button class="neumorph" onclick="modalT()">+ Werkzeug</button>
            <button class="neumorph" onclick="show('m-imp')">Import</button>
        </div>

        <div id="list-t"></div>
    </div>

    <div id="m-p" class="modal">
        <div class="card">
            <h2>Projekt</h2>
            <input type="hidden" id="p-idx">
            <label>Zeichnungsnummer</label>
            <input type="text" id="p-num" class="input-field">
            <label>Kunde / Name</label>
            <input type="text" id="p-nam" class="input-field">
            <label>Laufzeit</label>
            <input type="text" id="p-lzf" class="input-field">
            
            <div class="modal-buttons">
                <button class="neumorph btn-safe" onclick="saveP()">Speichern</button>
                <button class="neumorph" onclick="hide('m-p')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-t" class="modal">
        <div class="card">
            <h2>Werkzeug</h2>
            <input type="hidden" id="t-idx">
            <label>T-Nr</label>
            <input type="text" id="t-id" class="input-field">
            <label>Beschreibung</label>
            <input type="text" id="t-nm" class="input-field">
            <label>Ø / Toleranz</label>
            <input type="text" id="t-dia" class="input-field">
            
            <div class="toggle-row">
                <span>REVOLVER UNTEN</span>
                <button id="btn-rev-toggle" class="neumorph">OFF</button>
            </div>

            <div class="modal-buttons">
                <button class="neumorph btn-safe" onclick="saveT()">Speichern</button>
                <button class="neumorph" onclick="delT()" id="btn-del-t">Löschen</button>
                <button class="neumorph" onclick="hide('m-t')">Abbrechen</button>
            </div>
        </div>
    </div>

    <div id="m-imp" class="modal">
        <div class="card">
            <h2>Daten Management</h2>
            <textarea id="imp-area" class="input-field" style="height:150px"></textarea>
            <div class="modal-buttons">
                <button class="neumorph" onclick="importJSON()">Import JSON</button>
                <button class="neumorph" onclick="hide('m-imp')">Schließen</button>
            </div>
        </div>
    </div>

    <div id="print-container"></div>

    <script src="ui.js"></script>
</body>
</html>
